<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KJ Lee Essential Otolaryngology (12th ed) — Chapter MCQs</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--box:#0B1418;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--box:#000;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.chap{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px}
.chap.on{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.chap b{flex:1;font-weight:600}
.chap span{color:var(--muted);font-variant-numeric:tabular-nums}
.chap .done{font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px}
.seg button.on{background:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#06201F}}
.primary{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
@media (prefers-color-scheme:dark){.primary{color:#06201F}}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.topi .t{flex:1;min-width:0;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topi .sc{font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width .25s}
.qn{font:600 .9rem/1 inherit;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.note{font-size:.9rem;color:var(--muted);margin:-4px 0 12px}
.flag{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:6px;font-size:.92rem;margin:0 0 12px}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}
.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}
.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:12px 0 4px}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-cur{outline:2px solid var(--teal);outline-offset:1px}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:8px 0}
table{width:100%;border-collapse:collapse;margin:12px 0 18px;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<script>
const DATA=[{"t":"Ch 1 · Syndromes and Eponyms","q":[{"bn":1,"s":"Which of the following is characterized by hypoplastic malar eminences, down-slanting palpebral fissures, normal IQ, and aural atresia?","o":["Waardenburg syndrome","Goldenhar syndrome","Treacher-Collins syndrome","Apert syndrome"],"k":"C","x":"","n":1},{"bn":2,"s":"Zellballen is best described as","o":["Whorled cellular pattern with psammoma bodies","Cellular nests and sustentacular cells","Keratin pearls","Palisading cells and Verocay bodies"],"k":"B","x":"","n":2},{"bn":3,"s":"Sipple syndrome is a familial syndrome consisting of","o":["Medullary carcinoma of the thyroid","Hyperparathyroidism","Pheochromocytoma","All of the above"],"k":"D","x":"","n":3},{"bn":4,"s":"Nonsyphilitic interstitial keratitis and progressive hearing loss with vestibular symptoms is characteristic of","o":["Meniere disease","Alport syndrome","Cogan syndrome","Behçet disease"],"k":"C","x":"","n":4},{"bn":5,"s":"Which of the following syndromes is characterized by cerebellar, medullary, and spinal hemangioblastoma, pheochromocytoma, and bilateral papillary adenocarcinoma of the temporal bone?","o":["Chediak Higashi syndrome","von Hippel-Lindau syndrome","Takayasu disease","Costen syndrome"],"k":"B","x":"","n":5}]},{"t":"Ch 2 · Obstructive Sleep Apnea","q":[{"bn":1,"s":"The definition of an apnea includes","o":["Cessation of airflow for 10 seconds","Cessation of airflow for 10 seconds with an arousal","Hypoxia after decreased airflow for 10 seconds","Cessation of airflow for 20 seconds with an arousal"],"k":"A","x":"An apnoea is cessation (≥90% reduction) of airflow for at least 10 seconds; an arousal is not part of the definition (it is used for scoring hypopnoeas and RERAs). (AASM scoring manual.)","f":"Key corrected — book key: B; updated answer: A.","n":1},{"bn":2,"s":"All of the following are indications for surgery for OSA except","o":["Nonadherence to CPAP","Patient preference","Favorable anatomy","Small tonsils"],"k":"D","x":"","n":2},{"bn":3,"s":"When performing Friedman staging of a patient’s oropharynx, which of the following is true?","o":["The tongue is protruded.","The patient is instructed to say “ahh.”","The patient is asked to swallow.","The patient is asked to open mouth without any other action."],"k":"D","x":"","n":3},{"bn":4,"s":"The only curative surgery for OSA is","o":["UPPP","Tracheostomy","MMA","Lingual tonsillectomy"],"k":"B","x":"","n":4},{"bn":5,"s":"Indications for drug-induced sleep endoscopy include all of the following except","o":["Mandatory before any surgery takes place","Where clinical findings do not match sleep study outcomes","Failure of primary surgery","Prior to major surgical intervention"],"k":"A","x":"","n":5}]},{"t":"Ch 3 · Laser and Radiofrequency Surgery","q":[{"bn":1,"s":"In general, lasers with longer wavelength have deeper tissue penetration. Which of the following lasers is an exception to this rule?","o":["Alexandrite, 755 nm","CO2 , 10.6 µm","Argon, 514 nm","KTP, 532 nm","Tunable dye, 585 nm"],"k":"B","x":"","n":1},{"bn":2,"s":"During an operative procedure utilizing a laser, the following safety precautions should be observed.","o":["Patient’s eyes must be protected with moist eye pads.","All operating room personnel must wear wavelength specific protective glasses.","While the laser is not in use, it should be in “stand by” mode.","In laser aerodigestive tract surgery, partial pressure of oxygen in the gas mixture should be reduced to a minimum.","All of the above."],"k":"E","x":"","n":2},{"bn":3,"s":"Which of the following lasers would be appropriate for treatment of superficial vascular lesions?","o":["CO2 , 10.6 µm","Er:YAG, 2.94 µm","Alexandrite, 755 nm","Copper vapor, 578 nm","Holmium:YAG, 2.1 µm"],"k":"D","x":"Superficial vascular lesions need oxyhaemoglobin-absorbed wavelengths: copper vapour (578 nm), pulsed dye (585–595 nm), KTP (532 nm). Alexandrite (755 nm) is used mainly for hair and tattoo removal, as Q5 of this chapter states.","f":"Key corrected — book key: C; updated answer: D.","n":3},{"bn":4,"s":"All of the following are contraindications to laser skin resurfacing, except","o":["Use of isotretinoin (Accutane) within the past 1 to 2 years","Scleroderma","Active smoking","Active acne","History of a facial burn"],"k":"C","x":"","n":4},{"bn":5,"s":"Which of the following statements regarding laser surgery is true?","o":["Alexandrite laser (755 nm) is frequently used for tattoo and hair removal.","CO2 laser is often used for treatment of superficial vascular lesions.","CO2 laser light (10.6 µm) can be transmitted through an optical fiber.","Postoperative pigmentary changes after laser skin resurfacing are more pronounced in patients with low Fitzpatrick classes (I and II).","CO2 laser light is visible."],"k":"A","x":"","n":5}]},{"t":"Ch 5 · Surgical Hemostasis and Clotting Mechanisms","q":[{"bn":1,"s":"Why is a bleeding history more likely to reveal a bleeding disorder, than screening tests of coagulation?","o":["The PT/PTT tests do not measure fibrinolytic bleeding.","The bleeding time often misses mild von Willebrand disease.","Antiplatelet drugs such as Plavix may not affect the PT/PTT or bleeding time.","A bleeding history is likely to uncover hemostatic stress such as dental extractions.","All of the above."],"k":"E","x":"","n":1},{"bn":2,"s":"Which of the following are true statements regarding the differences or similarities between standard UFH and LMWH?","o":["Both UFH and LMWH prolong the PTT.","Only LMWH requires monitoring using the PTT or anti-Xa.","Only LMWH requires dose adjustment in renal failure.","A weight-based nomogram for UFH avoids the need for PTT monitoring.","Only UFH is a polysaccharide with a specific binding site for AT-III."],"k":"C","x":"","n":2},{"bn":3,"s":"Which of the following statements are true regarding typical HIT?","o":["The platelet drop in HIT is less than 100,000.","The platelet drop in HIT is 50% or more from baseline.","The drop in platelets is typically 24 hours after heparin exposure.","The drop in platelets never occurs days after heparin is stopped.","HIT is more common with the use of LMWH."],"k":"B","x":"","n":3},{"bn":4,"s":"Which of the following statements are true regarding DIC?","o":["DIC is diagnosed by specific laboratory findings.","DIC is only a clinical diagnosis.","DIC can manifest clinically in overt and occult syndromes.","DIC is always treated by heparin therapy to stop thrombosis.","The d-dimer test is diagnostic of DIC."],"k":"C","x":"","n":4},{"bn":5,"s":"A 35-year-old woman presents to emergency room (ER) with history of bruising easily over the past 1½ week. She also reports a large bruise over the right thigh associated with pain and difficulty in walking and also another bruise on her left forearm that was spontaneous. She did not have history of a fall or trauma prior to this. She did have an upper respiratory tract infection (URI) and was prescribed augmentin 2 weeks prior. She denies bleeding from anywhere. She also denies history of bleeding excessively after a dental extraction or since childhood or menorrhagia. There is no family history of bleeding in her family. On laboratory evaluation her PT is 12.7 and aPTT is 58. CBC has a white blood cell (WBC)—6.7, Hgb—9.0, platelet (PLT)—145. On physical examination she has a large hematoma over her right thigh. Before surgical management to the hematoma you would:","o":["Call the laboratory to perform a bleeding time.","Obtain a 50:50 mixing study to evaluate presence of factor deficiency or inhibitor.","Check for lupus anticoagulant.","Order a DIC panel."],"k":"B","x":"","n":5}]},{"t":"Ch 6 · Related Neurology and Neurosurgery","q":[{"bn":1,"s":"A 35-year-old woman presents with the primary complaint of “sinus pain.” She states that she has had severe pain around her eye that is associated with tearing, nasal congestion, and rhinorrhea; all of her symptoms are on the right side. Upon further questioning, she reveals that she has had these symptoms throughout most of her adult life and says that these symptoms are quite persistent for 2 to 3 weeks and then relapse; she is symptom free for 1 to 2 months before the symptoms return. She believes most of her symptoms occur with changes in the weather and she does not complain of associated nausea, vomiting, or photophobia. What is her diagnosis?","o":["Migraine headache","Chronic sinusitis","Allergic rhinitis","Cluster headache","Tension headache"],"k":"D","x":"","n":1},{"bn":2,"s":"A 45-year-old man presents to your clinic with left eye pain. Upon examination he has no extraocular movement from his left eye. Other than a frozen eye and a slightly dilated pupil that does not normally constrict to light, he has a normal neurologic examination. An MRI shows abnormal enhancement of the anterior cavernous sinus, superior orbital fissure, and orbital apex without signs of mass effect or of a dural tail extending posteriorly or laterally. What is the diagnosis?","o":["Raeder syndrome","Tolosa-Hunt syndrome","Gradenigo syndrome","Vernet syndrome"],"k":"B","x":"","n":2},{"bn":3,"s":"A 55-year-old man presents to clinic with a 1-year history of facial pain. He states that he has sharp, lancinating pain radiating down his mandible that is exacerbating by shaving, brushing his teeth, and by cool air touching his face. You correctly diagnose him with trigeminal neuralgia. What is the first-line treatment for trigeminal neuralgia?","o":["Microvascular decompression","Thermal rhizotomy","Lamotrigine","Carbamazepine"],"k":"D","x":"","n":3},{"bn":4,"s":"A 29-year-old man presents with a history of a seizure disorder. He states that his seizures are associated with lip-smacking and odd sensations over his chest wall that lead to unconsciousness and generalized tonic-clonic activity. What is the seizure disorder that affects this patient?","o":["Gelastic seizures","West syndrome","Temporal lobe seizures","Petit-mal seizures"],"k":"C","x":"","n":4},{"bn":5,"s":"A 65-year-old woman presents with headache, personality changes, anosmia, central scotoma of the right eye, optic nerve atrophy of the right eye, and left eye papilledema. She is diagnosed with Foster-Kennedy syndrome and an MRI of her brain is ordered which reveals a large mass of the anterior cranial fossa most consistent with an olfactory groove meningioma. She undergoes an endoscopic, endonasal approach for the resection of the mass which involves coagulation of the ethmoidal arteries, removal of the crista galli and cribiform plate of the ethmoid bone, resection of the involved dura underlying the meningioma, and extirpation of the mass. What is the Simpson grade for the degree of resection of the meningioma?","o":["Grade 1","Grade 2","Grade 3","Grade 4","Grade 5"],"k":"A","x":"","n":5}]},{"t":"Ch 7 · The Chest for ENT","q":[{"bn":1,"s":"Spirometric evidence of obstructive airways disease is based on","o":["Reduced FEV1","Reduced FEV1 /FEV ratio","Both"],"k":"B","x":"Obstruction is defined spirometrically by a reduced FEV1/FVC ratio (<0.7 or below the lower limit of normal). A reduced FEV1 alone occurs in both obstructive and restrictive disease and grades severity. (ATS/ERS.)","f":"Key corrected — book key: C; updated answer: B.","n":1},{"bn":2,"s":"Increased work of breathing could be due to","o":["Decreased pulmonary function","Airway obstruction","Decreased muscle function","All of the above"],"k":"D","x":"","n":2}]},{"t":"Ch 8 · Nutrition, Fluid, and Electrolytes","q":[{"bn":1,"s":"Disadvantages of TPN include all of the following, except","o":["Difficulty attaining nutritional requirements because of fluid overload","Major infection or sepsis","Small bowel obstruction or paralytic ileus","Cholelithiasis, liver dysfunction, and gastrointestinal tract atrophy","Central venous access if required"],"k":"C","x":"","n":1},{"bn":2,"s":"What is the recommended daily energy intake and protein intake for head and neck squamous cell carcinoma (HNSCC) patients undergoing surgery or chemoradiation therapy?","o":["30 kcal/kg/d and 1.02 g protein/kg/d","1.2 kcal/kg/d and 30 g protein/kg/d","10 kcal/kg/d and 1.2 g protein/kg/d","30 kcal/kg/d and 1.20 g protein/kg/d"],"k":"D","x":"ESPEN and the chapter recommend about 25–30 kcal/kg/day and 1.2–1.5 g protein/kg/day for head and neck cancer patients during surgery or chemoradiation. Option C (10 kcal/kg/day) is far too low.","f":"Key corrected — book key: C; updated answer: D.","n":2},{"bn":3,"s":"How does cancer cachexia differ from starvation?","o":["There is decreased protein breakdown.","Refeeding enterically or by TPN replenishes some body mass and increases survival outcomes.","Refeeding by any mean replenishes some body mass and increases survival outcomes.","There is approximately equal loss of muscle and fat.","Metabolism shifts are characterized by a slow catabolic mode to minimize energy expenditure."],"k":"D","x":"","n":3},{"bn":4,"s":"Which of the following is the most important test to review when addressing hyperkalemia greater than 6.5mEq?","o":["Myoglobin","CPK","EKG","Creatinine"],"k":"C","x":"In hyperkalaemia >6.5 mEq/L the ECG is the most important immediate test: peaked T waves, widened QRS or arrhythmia mandate immediate calcium gluconate, insulin–dextrose and other treatment.","f":"Key corrected — book key: E; updated answer: C.","n":4},{"bn":5,"s":"What are the indications for TPN?","o":["Nonfunctioning of GI tract","Severe protein malnutrition with loss of normal gastrointestinal (GI) function","Chyle leak after neck dissection","All of the above"],"k":"D","x":"TPN is indicated when the GI tract cannot be used: a non-functioning gut, severe malnutrition with loss of GI function, and high-output chyle leak after neck dissection (to rest the lymphatics). All three are correct.","f":"Key corrected — book key: C; updated answer: D.","n":5}]},{"t":"Ch 9 · Antimicrobial Therapy in Otolaryngology—Head and Neck Surgery","q":[{"bn":1,"s":"Which aminoglycoside is the least vestibulotoxic but most cochleotoxic?","o":["Streptomycin","Tobramycin","Amikacin","Gentamicin"],"k":"C","x":"Amikacin (with neomycin and kanamycin) is predominantly cochleotoxic with little vestibulotoxicity. Streptomycin and gentamicin are primarily vestibulotoxic. Gentamicin is the drug used for chemical labyrinthectomy because of this.","f":"Key corrected — book key: D; updated answer: C.","n":1},{"bn":2,"s":"Which antibiotic can produce a rash in patients with Epstein-Barr virus mononucleosis?","o":["Cefdinir","Amoxicillin","Doxycycline","Azithromycin"],"k":"B","x":"Aminopenicillins (amoxicillin, ampicillin) cause a maculopapular rash in most patients with EBV infectious mononucleosis; this is not a true penicillin allergy.","f":"Key corrected — book key: C; updated answer: B.","n":2},{"bn":3,"s":"Which fluoroquinolone has Pseudomonas coverage?","o":["Ciprofloxacin","Levofloxacin","Moxifloxacin","None of the above"],"k":"A","x":"Ciprofloxacin is the fluoroquinolone with the best antipseudomonal activity (levofloxacin also covers Pseudomonas, but less reliably). Moxifloxacin has poor Pseudomonas activity.","f":"Key corrected — book key: C; updated answer: A.","n":3},{"bn":4,"s":"Which azole antifungal has the broadest spectrum of coverage including Mucorales?","o":["Itraconazole","Posaconazole","Fluconazole","Ketoconazole"],"k":"B","x":"Posaconazole (and isavuconazole) are the only azoles with activity against Mucorales; voriconazole, itraconazole, fluconazole and ketoconazole do not cover them reliably.","f":"Key corrected — book key: D; updated answer: B.","n":4},{"bn":5,"s":"Which antiviral is used to treat congenital CMV?","o":["Valacyclovir","Acyclovir","Ganciclovir","Famciclovir"],"k":"C","x":"Symptomatic congenital CMV is treated with ganciclovir (IV) or its oral prodrug valganciclovir, which improves hearing and neurodevelopmental outcomes. Acyclovir, valacyclovir and famciclovir are for HSV/VZV.","f":"Key corrected — book key: E; updated answer: C.","n":5},{"bn":6,"s":"Which presentation is considered a nonallergic reaction or adverse effect?","o":["Diarrhea","Nausea and vomiting","Headache","All of the above"],"k":"D","x":"Diarrhoea, nausea/vomiting and headache are predictable adverse (non-immunological) effects of antimicrobials, not allergic reactions. Allergy is IgE-mediated (urticaria, angio-oedema, anaphylaxis) or delayed T-cell mediated (rash, SJS).","f":"Key not given in the book — answer supplied from current references.","n":6}]},{"t":"Ch 10 · Pharmacology and Therapeutics","q":[{"bn":1,"s":"Of the drugs listed, which is the least to cause sensorineural hearing loss?","o":["Tobramycin","Amikacin","Neomycin","Streptomycin"],"k":"D","x":"","n":1},{"bn":2,"s":"Which biologic agent targets the CD20 surface protein on B cells allowing for antibodydependent cellular and complement-dependent cytotoxicity?","o":["Cetuximab","Rituximab","Omalizumab","Mepolizumab"],"k":"B","x":"","n":2},{"bn":3,"s":"Which of the following is true regarding epinephrine?","o":["Duration of action is less than 1 hour.","High doses above 290 mg can lead to increased risk of avascular necrosis.","Vasoconstriction is mediated by alpha-2 receptors.","Beta-2 agonism induces coronary vasoconstriction."],"k":"A","x":"","n":3},{"bn":4,"s":"The wavelength spectrum of UVB is","o":["200 to 240 nm","290 to 320 nm","320 to 400 nm","430 to 470 nm"],"k":"B","x":"","n":4},{"bn":5,"s":"Which best describes botulinum toxin?","o":["The target of the drug is enzymatic cleavage of SNARE proteins along the postsynaptic membrane.","There are few clinical indications.","Reinnervation occurs through collateral growth.","Serotype B is the only serotype indicated for cosmetic use."],"k":"C","x":"","n":5}]},{"t":"Ch 11 · Head and Neck Manifestations of HIV","q":[{"bn":1,"s":"Which malignancy is associated with HIV infection and/or immunocompromised state?","o":["Kaposi sarcoma","Primary CNS lymphoma","Plasmablastic lymphoma","All of the above"],"k":"D","x":"","n":1},{"bn":2,"s":"Which is the most common type of oral candidiasis?","o":["Pseudomembranous","Atrophic","Erythematous","Hyperplastic"],"k":"A","x":"","n":2},{"bn":3,"s":"Which is generally not considered a treatment option for BLECs?","o":["ART","Serial needle aspiration","Sclerotherapy","Radiotherapy","Surgical excision"],"k":"D","x":"","n":3},{"bn":4,"s":"Which diagnosis does not require subsequent investigation into HIV status?","o":["Oral histoplasmosis","Oral hairy leukoplakia","Necrotizing gingivostomatitis","Oral candidiasis"],"k":"D","x":"","n":4},{"bn":5,"s":"HIV can be transmitted through all of the following except","o":["Blood","Semen","Saliva","Vaginal fluid","Breast milk"],"k":"C","x":"","n":5}]},{"t":"Ch 12 · Granulomatous Diseases of the Head and Neck","q":[{"bn":1,"s":"Which disease is often associated with a bony septal perforation?","o":["Tuberculosis","Leprosy","Syphilis","Blastomycosis","Langerhan histiocytosis"],"k":"C","x":"","n":1},{"bn":2,"s":"An 8-year-old patient presents with a history of several weeks of a violaceous, submandibular mass showing sulfur granules on fine needle aspiration. What is your definitive management?","o":["PO antibiotics only","IV antibiotics only","Surgical curettage only","Surgical curettage and IV, then PO antibiotics","Conservative management"],"k":"D","x":"","n":2},{"bn":3,"s":"“Heerfordt syndrome” is a variant of what condition?","o":["HIV","Sjogren","Lyme disease","Melkersson-Rosenthal syndrome","Sarcoidosis"],"k":"E","x":"","n":3},{"bn":4,"s":"Which of the following facts about Churg-Strauss is incorrect?","o":["A smalland medium-vessel necrotizing vasculitis","aka eosinophilic granulomatosis with polyangiitis","Classic triad of airway necrotizing granulomas, systemic vasculitis, and focal glomerulonephritis","Associated with pANCA","Can be divided into allergic, eosinophilic, and vasculitic stages"],"k":"C","x":"","n":4},{"bn":5,"s":"Which of the following is not one of the five diagnostic c roscopic local and/or nodal residual Group 3 Incomplete resection or biopsy with gross residual Group 4 Distant metastasis C. Middle fossa approach with gross total excision with nerve grafting from labyrinthine to tympanic segment","Mastoid approach with gross total excision with nerve grafting from intracanalicular to tympanic facial nerve"],"k":"C","x":"","n":1},{"bn":2,"s":"Which of the following is correct regarding SDHA related head and neck paragangliomas?","o":["Higher incidence in vagal paraganglioma","Low risk of pheochromocytoma","High risk for multiple head and neck paraganglioma","Maternal imprinting"],"k":"B","x":"","n":2},{"bn":3,"s":"A 50-year-old woman presents with right profound hearing loss and episodic vertigo. MRI demonstrates a heterogeneously enhancing mass centered on the mid portion of the posterior fossa dura adjacent to the posterior semicircular canal. A CT shows irregular bone erosion that involves both the posterior and lateral semicircular canal. What is the best approach for obtaining a gross total excision of the tumor?","o":["Retrolabyrinthine transdural approach","Middle fossa approach","Infratemporal fossa approach with posterior re-routing of the facial nerve and overclosure of the ear canal","Translabyrinthine approach"],"k":"D","x":"","n":3},{"bn":4,"s":"What lesion in the IAC is hyperintense on a T1-weighted MRI without gadolinium contrast?","o":["Vestibular schwannoma","Lipoma","Meningioma","Metastasis"],"k":"B","x":"","n":4},{"bn":5,"s":"What is an audiologic characteristic of a retrocochlear lesion?","o":["Rollover","Carhart notch","Mixed hearing loss","Preservation of speech discrimination scores Introduction Endoscopic ear surgery (EES) is a minimally invasive approach similar to standard microscopic techniques. Initially endoscope was used to assist traditional operations to visualize middle ear hidden areas. Therefore, instrumentals, optics, light and camera systems improvements allowed endoscope to be a main tool in middle ear surgery. Anatomy Middle ear is an irregular cavity filled with air in the center of the temporal bone in tympanic portion (Figure 25-1). Limits • Superior: called tegmen, a plate of bone below middle cranial fossa dura and temporal lobe. • Inferior: narrow and thin plate of bone above jugular bulb. Careful approach to middle ear is necessary if patient has a high or dehiscent jugular bulb. • Medial: cochlear promontory (cochlea basal turn), tympanic plexus (Jacobson nerve), oval and round windows, tympanic segment of facial nerve, and lateral semicircular canal. • Lateral: tympanic membrane, annulus fibrosus, and scutum. • Anterior: formed by petrous bone. From superior to inferior: (a) Tensor tympani muscle canal (b) Eustachian tube (c) Internal carotid artery (vertical segment) • Posterior: formed by the petrous bone and aditus ad antrum that communicates attic and mastoid antrum. Epitympanum (Attic) • It is the upper portion of middle ear cavity above tympanic membrane level and an imaginary plane through malleus short process (Figures 25-2, 25-3, and 25-4). • Communicates with mastoid antrum."],"k":"A","x":"","n":5}]},{"t":"Ch 25 · Endoscopic Middle Ear Surgery","q":[{"bn":1,"s":"The most important characteristic of anterior tympanic isthmus is","o":["Next to the jugular bulb","Communicates with middle cranial fossa dura","Largest ventilation route to attic","Irregular cavity filled with air","Contains tympanic segment of facial nerve"],"k":"C","x":"","n":1},{"bn":2,"s":"Microscopic approach cannot properly visualize this region.","o":["Epitympanum","Prussak space","Mesotympanum","Hypotympanum","Retrotympanum"],"k":"E","x":"","n":2},{"bn":3,"s":"These are advantages of endoscopic technique, except","o":["Minimally invasive approach","Easier and requires a smaller learning curve","No need of periauricular incisions","Preservation of mastoid cell system","Possible to restore ventilation routes to attic"],"k":"B","x":"","n":3},{"bn":4,"s":"Essential instr teristic of which of the following?","o":["Sinonasal papilloma","Juvenile nasopharyngeal angiofibroma","Cystic fibrosis","Olfactory neuroblastoma","None of the above"],"k":"B","x":"","n":1},{"bn":2,"s":"What is the most common indication for postoperative radiation in patients with tonsil cancer?","o":["T stage","Extracapsular extension","Differentiation","Positive margins"],"k":"B","x":"","n":2},{"bn":3,"s":"An absolute contraindication to cochlear implantation is","o":["Mondini malformation","History of meningitis","Michel aplasia","Middle ear cholesteatoma","High jugular bulb"],"k":"C","x":"","n":3},{"bn":4,"s":"The artery of the second branchial arch becomes","o":["Posterior inferior cerebellar artery","Stapedial artery","Superficial temporal vein","Superficial temporal artery"],"k":"B","x":"","n":4},{"bn":5,"s":"Which Syndrome has X-linked dominant inheritance and frequent glomerulonephritis?","o":["Pendred","Goldenhar","Alport","Apert"],"k":"C","x":"","n":5}]}];
const L='ABCDE';
let S={sel:new Set(DATA.map((_,i)=>i)),order:'book',list:[],pos:0,ans:{},multiPick:{}};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const id=(c,n)=>c+'-'+n;
function home(){
  document.body.querySelector('.nav')?.remove();
  const total=[...S.sel].reduce((a,c)=>a+DATA[c].q.length,0);
  $('#app').innerHTML=`<h1>KJ Lee Essential Otolaryngology</h1><p class="sub">${DATA.reduce((a,c)=>a+c.q.length,0)} end-of-chapter single-best-answer questions (12th edition) across ${DATA.length} chapters. Keys rechecked against the chapter text and current references; corrections are explained in the answer box. Pick chapters, then start.</p>
  ${DATA.map((c,i)=>{const done=c.q.filter(q=>S.ans[id(i,q.n)]).length;return `<button class="chap ${S.sel.has(i)?'on':''}" onclick="tog(${i})" aria-pressed="${S.sel.has(i)}"><b>${c.t}</b>${done?`<span class="done">${done} done</span>`:''}<span>${c.q.length}</span></button>`}).join('')}
  <div class="row"><div class="seg" role="group" aria-label="Order"><button class="${S.order=='book'?'on':''}" onclick="S.order='book';home()">Book order</button><button class="${S.order=='shuf'?'on':''}" onclick="S.order='shuf';home()">Shuffled</button></div>
  <div class="seg"><button onclick="S.sel=new Set(DATA.map((_,i)=>i));home()">All</button><button onclick="S.sel=new Set();home()">None</button></div></div>
  <button class="primary" ${total?'':'disabled'} onclick="start()">Start ${total} questions</button>
  ${Object.keys(S.ans).length?`<div class="row"><button class="ghost" style="flex:1" onclick="results()">See results so far</button><button class="ghost" style="flex:1" onclick="if(confirm('Clear all answers?')){S.ans={};home()}">Clear answers</button></div>`:''}
  <p class="note" style="margin-top:18px">Answers are kept while this page is open. Tap any figure to enlarge.</p>`;
  scrollTo(0,0);
}
function tog(i){S.sel.has(i)?S.sel.delete(i):S.sel.add(i);home()}
function start(list){
  if(!list){list=[];[...S.sel].sort().forEach(c=>DATA[c].q.forEach(q=>list.push([c,q.n])));
    if(S.order=='shuf')for(let i=list.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[list[i],list[j]]=[list[j],list[i]]}}
  S.list=list;S.pos=0;const f=list.findIndex(([c,n])=>!S.ans[id(c,n)]);if(f>0)S.pos=f;show();
}
function score(){let a=0,r=0;S.list.forEach(([c,n])=>{const x=S.ans[id(c,n)];if(x){a++;if(x.ok)r++}});return{a,r}}
function show(){
  const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const A=S.ans[id(c,n)];const {a,r}=score();
  const pick=S.multiPick[id(c,n)]||new Set();
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="home()" aria-label="Back to chapters">Chapters</button><span class="t">${DATA[c].t}</span><span class="sc">${r}/${a}</span></div><div class="bar"><i style="width:${(S.pos+1)/S.list.length*100}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${S.list.length} &nbsp;·&nbsp; Book Q${q.bn||n}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${n}" onclick="zoom(this.src)">`).join('')}</div>`;
  if(q.m)h+=`<p class="note">More than one answer. Select all that apply, then check.</p>`;
  q.o.forEach((t,i)=>{const l=L[i];let cl='';
    if(A){if(q.k.includes(l))cl='ok';else if(A.pick.includes(l))cl='bad'}else if(pick.has(l))cl='sel';
    h+=`<button class="opt ${cl}" ${A?'disabled':''} onclick="choose('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(q.m&&!A)h+=`<button class="primary" style="margin-top:6px" ${pick.size?'':'disabled'} onclick="check()">Check answer</button>`;
  if(A){h+=`<div class="exp"><h3 class="${A.ok?'ok':'bad'}">${A.ok?'Correct':'Incorrect'} — answer ${q.k.split('').join(', ')}</h3>`;
    if(q.f)h+=`<div class="flag">${esc(q.f)}</div>`;
    h+=q.x?q.x.split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join(''):`<p class="note" style="margin:0">Key only — the book gives no explanation.</p>`;
    if(q.xi)h+=q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join('');
    h+=`</div>`}
  $('#app').innerHTML=h;
  let nav=document.querySelector('.nav');if(!nav){nav=document.createElement('div');nav.className='nav';document.body.appendChild(nav)}
  const last=S.pos==S.list.length-1;
  nav.innerHTML=`<div class="navi"><button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Jump</button><button class="primary" onclick="${last?'results()':'go(1)'}">${last?'Finish':'Next'}</button></div>`;
  scrollTo(0,0);
}
function choose(l){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);if(S.ans[k])return;
  if(q.m){const p=S.multiPick[k]||new Set();p.has(l)?p.delete(l):p.add(l);S.multiPick[k]=p;const y=scrollY;show();scrollTo(0,y);return}
  S.ans[k]={pick:[l],ok:l==q.k};const y=scrollY;show();scrollTo(0,y)}
function check(){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);const p=[...S.multiPick[k]].sort().join('');
  S.ans[k]={pick:p.split(''),ok:p==q.k};const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(S.list.length-1,S.pos+d));show()}
function grid(){const d=$('#dlg');
  d.innerHTML=`<b>Jump to question</b><div class="grid">${S.list.map(([c,n],i)=>{const a=S.ans[id(c,n)];return `<button class="${a?(a.ok?'g-ok':'g-bad'):''} ${i==S.pos?'g-cur':''}" onclick="S.pos=${i};$('#dlg').close();show()">${i+1}</button>`}).join('')}</div><button class="ghost" style="width:100%;margin-top:8px" onclick="$('#dlg').close()">Close</button>`;
  d.showModal()}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
function results(){
  document.querySelector('.nav')?.remove();
  let rows='',ta=0,tr=0,wrong=[];
  DATA.forEach((c,ci)=>{let a=0,r=0;c.q.forEach(q=>{const x=S.ans[id(ci,q.n)];if(x){a++;if(x.ok)r++;else wrong.push([ci,q.n])}});
    ta+=a;tr+=r;if(a)rows+=`<tr><td>${c.t}</td><td>${r}/${a} · ${Math.round(r/a*100)}%</td></tr>`});
  $('#app').innerHTML=`<h1>Results</h1><div class="big">${ta?Math.round(tr/ta*100):0}%</div><p class="sub">${tr} correct of ${ta} answered</p>
  <table>${rows||'<tr><td>No answers yet</td><td></td></tr>'}</table>
  ${wrong.length?`<button class="primary" onclick="redo()">Retry ${wrong.length} incorrect</button>`:''}
  <div class="row"><button class="ghost" style="flex:1" onclick="home()">Back to chapters</button></div>`;
  S.wrong=wrong;scrollTo(0,0)}
function redo(){S.wrong.forEach(([c,n])=>{delete S.ans[id(c,n)];delete S.multiPick[id(c,n)]});start(S.wrong.slice())}
document.addEventListener('keydown',e=>{if($('#dlg').open||!document.querySelector('.nav'))return;
  if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else if('abcde'.includes(e.key.toLowerCase())&&e.key.length==1)choose(e.key.toUpperCase())});
home();
</script></body></html>
