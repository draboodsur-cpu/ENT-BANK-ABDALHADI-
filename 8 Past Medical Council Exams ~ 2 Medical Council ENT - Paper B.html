<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--amber:#B06A00;--amber-soft:#FBEFD9;--box:#0B1418;--on-teal:#fff;color-scheme:light}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td:last-child{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px 8px;text-align:center}
.seg button.on{background:var(--teal);color:var(--on-teal);font-weight:600}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note{font-size:.9rem;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.timer{font:700 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.topi .t{flex:1;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.flagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}

.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}

.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}

.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{opacity:1}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}.exp h3.na{color:var(--amber)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;position:relative}
.grid .ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.grid .flg{box-shadow:inset 0 0 0 2px var(--amber)}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-na{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid .cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.legend .a::before{background:var(--teal-soft);border-color:var(--teal)}.legend .f::before{box-shadow:inset 0 0 0 2px var(--amber)}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3.2rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>button{flex:1}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--teal)}
</style></head><body>

const P={"title": "Palestine Medical Council Certificate — ENT Paper B", "q": [{"s": "The landmark of the lateral surface of the temporal bone which acts as a guide to the surgical approach of the antrum is the:", "o": ["Notch of Rivinus", "Suprameatal spine of Henle", "Temporal line", "Tympanosquamous suture", "Trautman triangle"], "k": "B", "x": "The suprameatal (Henle) spine and the suprameatal (Macewen) triangle overlie the antrum, ~1.5 cm deep.", "d": "Otology", "src": "KJ Lee · Anatomy of the ear / Cummings Ch 159 Mastoid surgery"}, {"s": "Severe epistaxis originating above the middle turbinate and not controlled by packing requires legation of the:", "o": ["Anterior ethmoidal artery", "Maxillary artery", "Sphenopalatine artery", "Internal carotid artery", "External carotid artery"], "k": "A", "x": "Bleeding above the middle turbinate comes from the ethmoidal (ICA) system → anterior ethmoidal artery ligation (external ethmoidectomy approach).", "d": "Rhinology", "src": "Cummings Ch 45 Epistaxis"}, {"s": "The utricle and saccule are connected by:", "o": ["Cochlear aqueduct", "Ducts reunions", "Semicircular canals", "Common crus", "Endolymphatic duct"], "k": "E", "x": "Utricle and saccule communicate via the utriculosaccular duct, which joins the endolymphatic duct. Ductus reuniens links saccule to cochlear duct.", "d": "Otology", "src": "KJ Lee · Inner ear anatomy"}, {"s": "The plate of the bone which separates the attic from the middle cranial fossa is called:", "o": ["Aditus and antrum", "Macewen plate", "Tegmen tympani", "The sinodural angle", "Trautman triangle"], "k": "C", "x": "Tegmen tympani is the thin plate separating attic/antrum from the middle cranial fossa.", "d": "Otology", "src": "KJ Lee · Temporal bone anatomy"}, {"s": "Development of the hard palate:", "o": ["Is from a median premaxilla and two lateral maxillary processes", "Is from an anterior premaxilla, median maxilla, and posterior uvular processes", "Includes a central area derived from the lower edge of the nasal septum", "Is primarily from the bucconasal membrane:"], "k": "A", "x": "Primary palate (premaxilla) from medial nasal prominences + secondary palate from the two lateral maxillary palatine shelves.", "d": "Paediatric", "src": "Cummings Ch 176 Cleft lip and palate (embryology)"}, {"s": "The parasympathetic innervation of the submandibular gland is carried by the:", "o": ["Vidian nerve", "Chorda tympani", "Lesser petrosal nerve", "Otic ganglion", "Glossopharyngeal nerve"], "k": "B", "x": "Superior salivatory nucleus → nervus intermedius → chorda tympani → lingual nerve → submandibular ganglion.", "d": "H&N / Plastics / Trauma", "src": "Cummings Ch 65 Salivary physiology"}, {"s": "A patient given 3 L (3000 ml) of 5% dextrose-containing intravenous solutions daily will receive about:", "o": ["250 cal/24 hr", "600 cal/24 hr", "1000 cal/24 hr", "2000 cal/24 hr", "3000 cal/24 hr"], "k": "B", "x": "3 L of 5% dextrose = 150 g glucose × 3.4 kcal/g ≈ 510 kcal → closest 600 cal.", "d": "General", "src": "General surgery / fluids"}, {"s": "Respiratory dead space, i.e. , the volume from the nose and mouth down to the alveoli, is about:", "o": ["75 ml", "150 ml", "350 ml", "450 ml", "550 ml"], "k": "B", "x": "Anatomic dead space ≈ 150 mL (≈2 mL/kg).", "d": "General", "src": "Physiology"}, {"s": "The stream of inspired air in the nose travels:", "o": ["A straight course from nostril to choana", "In a high curve through the nasal chamber", "Along the inferior turbinate", "Along the floor of the nose", "In numerous eddies occupying most of the nasal chamber"], "k": "B", "x": "Inspired air arches upward in a high curve through the middle of the nasal cavity (middle meatus region), not along the floor.", "d": "Rhinology", "src": "Cummings Ch 41 Nasal physiology"}, {"s": "Pseudoepitheliomatous hyperplasia:", "o": ["Usually precedes cholesteatoma formation", "Is viral in etiology", "Accompanies laryngeal papilloma", "Is best treated by radiation", "Is a type of acanthosis which superficial resembles malignancy"], "k": "E", "x": "Pseudoepitheliomatous hyperplasia: benign epithelial overgrowth that mimics SCC (granular cell tumour, fungal infections, TB).", "d": "Laryngology", "src": "Pathology"}, {"s": "Mixed tumor of a salivary gland is so named because it", "o": ["May be found in the submaxillary or parotid gland", "May be either benign or malignant", "Contains both epithelial and connective tissue elements", "Contains both squamous cell and adenocarcinoma components"], "k": "C", "x": "Pleomorphic adenoma contains epithelial and myoepithelial-derived mesenchymal (chondromyxoid) elements.", "d": "H&N / Plastics / Trauma", "src": "Cummings Ch 69 Salivary neoplasms"}, {"s": "Squamous epithelium of the upper respiratory tract abruptly changes to a respiratory type at the junction of the:", "o": ["Hypopharynx and larynx", "Epiglottis and ventricular band", "False and true vocal cords", "Glottic and subglottic larynx", "Trachea and main-stem bronchus"], "k": "D", "x": "The true cords carry stratified squamous epithelium; respiratory epithelium resumes abruptly in the subglottis.", "d": "Laryngology", "src": "KJ Lee · Laryngeal histology"}, {"s": "The essential radiologic finding in coalescent or surgical mastoiditis is:", "o": ["Poor temporal bone pneumatization", "Diffuse clouding of mastoid cells", "Radiolucent defect in the antral area", "Rarefaction and loss of distinctness of the cell partition", "Erosion of the dural or sinus plate"], "k": "D", "x": "Coalescence = loss of bony septa: haziness with rarefaction and loss of definition of cell partitions.", "d": "Otology", "src": "Cummings Ch 155 Temporal bone infection complications"}, {"s": "The speech reception threshold is that decibel level at which:", "o": ["A list of phonetically balanced words can be repeated correctly", "50% of a list of spondee words can be repeated correctly", "50% of a list of phonetically balanced words can be repeated correctly", "A list of spondee words can be repeated correctly"], "k": "B", "x": "SRT = lowest level at which 50% of spondee words are repeated correctly.", "d": "Otology", "src": "Cummings Ch 146 Audiology"}, {"s": "In evaluating the need for masking we calculate that the energy loss across the head by air conduction is about:", "o": ["15 dB", "30 dB", "50 dB", "75 dB"], "k": "C", "x": "Interaural attenuation for air conduction (supra-aural phones) ≈ 40–50 dB.", "d": "Otology", "src": "Cummings Ch 146 Audiology"}, {"s": "In evaluating the need for masking we calculate that the energy loss across the head by bone conduction is about:", "o": ["15 dB", "30 dB", "50 dB", "85 dB"], "k": "A", "x": "Interaural attenuation for bone conduction is essentially 0 dB (0–15 dB); the closest option is 15 dB. Always mask BC.", "d": "Otology", "src": "Cummings Ch 146 Audiology"}, {"s": "Temporary threshold shift is commonly with:", "o": ["Meniere disease", "Ototoxic drugs", "Presbycusis", "Noise exposure", "Tone decay"], "k": "D", "x": "Temporary threshold shift follows noise exposure; recovery within hours–days.", "d": "Otology", "src": "Cummings Ch 128 Noise-induced hearing loss"}, {"s": "The most frequent cause of perforation of the nasal septum is:", "o": ["Congenital", "Tuberculosis", "Syphilis", "Chronic infection", "Operative trauma"], "k": "E", "x": "Iatrogenic (septal surgery) is the commonest cause of septal perforation, followed by trauma/picking and cocaine.", "d": "Rhinology", "src": "Cummings Ch 50 Septum"}, {"s": "The most common causal factor in hyperplastic rhinitis is:", "o": ["Allergy", "Bacterial infection", "Septal deviation", "Chemical irritation", "Previous nasal surgery"], "k": "A", "x": "Chronic allergic inflammation is the commonest cause of hyperplastic (hypertrophic) rhinitis.", "d": "Rhinology", "src": "Cummings Ch 48 Allergic rhinitis"}, {"s": "In hereditary hemorrhagic telangiectasis (Osler-Weber-Rendu disease):", "o": ["Clotting time is prolonged", "Platelet count is decreased", "Partial thromboplastin time is prolonged", "Bleeding time is prolonged", "All coagulation studies are normal"], "k": "E", "x": "HHT is a vascular dysplasia (ENG/ACVRL1); coagulation tests are normal.", "d": "Rhinology", "src": "Cummings Ch 45 Epistaxis"}, {"s": "The chief shortcoming of intranasal antrostomy has been:", "o": ["Occurrence of a bony sequestrum", "Closing of the window", "Inability to use the procedure for bilateral disease", "Disruption of normal physiology", "Failure to remove diseased sinus mucosa"], "k": "B", "x": "Inferior meatal antrostomy windows tend to close and drain against mucociliary flow (toward the natural ostium).", "d": "Rhinology", "src": "Cummings Ch 62 Open sinus surgery"}, {"s": "An endocrine dysfunction not infrequently found in vasomotor rhinitis patients is:", "o": ["Diabetes insipidus", "Diabetes mellitus", "Hypothyroidism", "Hyperparathyroidism", "Primary aldosteronism"], "k": "C", "x": "Hypothyroidism is a recognized association of vasomotor rhinitis (~3%).", "d": "Rhinology", "src": "Cummings Ch 49 Non-allergic rhinitis (also Shamsan Q34)"}, {"s": "The most common cause of oroantral fistula is:", "o": ["Maxillary sinusitis", "Dental extraction", "Odontogenic cyst", "Osteomyelitis of the maxilla", "Carcinoma of the maxilla"], "k": "B", "x": "Extraction of maxillary premolar/molar teeth whose roots project into the antrum.", "d": "Rhinology", "src": "Cummings Ch 73 Odontogenic infection"}, {"s": "The immunoglobulin in the allergic-anaphylactic reaction is:", "o": ["IgA", "IgD", "IgE", "IgG", "IgM"], "k": "C", "x": "Type I hypersensitivity is IgE-mediated (mast cell degranulation).", "d": "Rhinology", "src": "Cummings Ch 13 Allergy & immunology"}, {"s": "A cardiac condition that may occur secondary to hypertrophied tonsils and adenoids is:", "o": ["Atrial septal defect", "Bundle branch block", "Patent ducts arteriosus", "Cor pulmonale", "Coarctation of the aorta"], "k": "D", "x": "Chronic upper airway obstruction → hypoxia/hypercarbia → pulmonary hypertension → cor pulmonale.", "d": "Paediatric", "src": "Cummings Ch 181 Adenotonsillar disease"}, {"s": "The usual finding in glossodynia (burning tongue) is:", "o": ["Hypertrophy of the circumvallate", "Beefy red tongue", "Cheilitis", "Positive serology", "No clinically detectable lesion"], "k": "E", "x": "Burning mouth syndrome: normal-appearing mucosa; diagnosis of exclusion.", "d": "H&N / Plastics / Trauma", "src": "Cummings Ch 74 Oral manifestations of systemic disease"}, {"s": "The diagnosis of scarlet fever is confirmed by:", "o": ["The presence of a pharyngeal pseudomembrane", "The presence of a fusospirochete", "A positive tellurite culture", "The Schick test", "The Dick test"], "k": "E", "x": "The Dick test (intradermal erythrogenic toxin) was used for scarlet fever susceptibility; Schick test = diphtheria.", "d": "Paediatric", "src": "Pharyngitis (historical)"}, {"s": "A parotid tumor which may occur bilaterally and which gives a “hot” scan with technetium 99m is:", "o": ["Pleomorphic adenoma", "Oxyphilic adenoma", "Oncocytoma", "Warthin tumor", "Squamous cell carcinoma"], "k": "D", "x": "Warthin tumour: bilateral in ~10%, concentrates Tc-99m pertechnetate (hot). Oncocytoma is also hot but rarely bilateral.", "d": "H&N / Plastics / Trauma", "src": "Cummings Ch 66 Salivary imaging"}, {"s": "Chronic nonobstructive sialodochiectasis (sialectasis) presents a sialographic pattern of:", "o": ["Diffuse dilatation of the peripheral ducts", "Structure of the peripheral ducts", "One or more calculi", "Displacement of the ductal system", "Absence of ductal filling"], "k": "A", "x": "Sialectasis: punctate/globular dilatation of peripheral ducts (\"tree in blossom\").", "d": "H&N / Plastics / Trauma", "src": "Cummings Ch 66 Salivary imaging"}, {"s": "Swelling of the parotid glands not infrequently follows ingestion of:", "o": ["Mercury", "Hypertonic glucose", "Lipase", "Iodides", "Amylase"], "k": "D", "x": "\"Iodide mumps\": acute parotid swelling after iodinated contrast or iodides.", "d": "H&N / Plastics / Trauma", "src": "Cummings Ch 67 Salivary infection"}, {"s": "Cricoarytenoid joint arthritis is best differentiated from unilateral vocal cord paralysis is by:", "o": ["Suspension laryngoscopy", "Laryngeal electromyography", "Latex agglutination test", "Passive mobility test", "CT scan of the larynx"], "k": "B", "x": "LEMG separates paralysis (denervation) from cricoarytenoid fixation (normal EMG); palpation of arytenoid mobility at laryngoscopy confirms.", "d": "Laryngology", "src": "Cummings Ch 101 Laryngeal EMG"}, {"s": "A tracheostomy located between the cricoid cartilage and first tracheal ring is:", "o": ["A good procedure in most situation", "Called a cricothyrotomy", "More difficult to perform than the usual tracheostomy at a lower level", "Often complicated by subglottic stenosis", "Useful in the short-necked individual"], "k": "D", "x": "A high tracheotomy at/through the first ring abuts the cricoid → perichondritis and subglottic stenosis.", "d": "Laryngology", "src": "Cummings Ch 106 Tracheotomy"}, {"s": "The key to identification of the recurrent laryngeal nerve during thyroid surgery is:", "o": ["The superior thyroid artery", "The middle thyroid vein", "The inferior thyroid artery", "The parathyroid glands", "With a nerve stimulator"], "k": "C", "x": "The RLN runs in relation to the inferior thyroid artery; Berry ligament and the tracheoesophageal groove also guide identification.", "d": "H&N / Plastics / Trauma", "src": "Cummings Ch 130 Thyroid surgery"}, {"s": "In the previously radiated neck, a precaution taken during radical neck dissection is:", "o": ["Tracheotomy", "Preservation of the spinal accessory nerve", "Avoidance of electrocautery", "Use of a muscle flap for carotid artery protection", "Preservation of the internal jugular vein"], "k": "D", "x": "Irradiated neck: protect the carotid with a levator scapulae/pectoralis or dermal graft against blowout.", "d": "H&N / Plastics ction from a plaster cap", "Watchful waiting"], "k": "A", "x": "Isolated depressed zygomatic arch: Gillies temporal approach elevation.", "d": "H&N / Plastics / Trauma", "src": "Cummings Ch 24 Maxillofacial trauma"}, {"s": "In the typical blow-out fracture of the orbit, motion of the eye is affected primarily in:", "o": ["Upward gaze", "Downward gaze", "Medial gaze", "Lateral gaze"], "k": "A", "x": "Inferior rectus entrapment limits upward gaze (diplopia on up-gaze).", "d": "H&N / Plastics / Trauma", "src": "Cummings Ch 24 Maxillofacial trauma"}, {"s": "In a child where several attempts at closure of a cleft palate have failed, the best management is:", "o": ["Secondary closure at age 16", "Utilization of a posterior pharyngeal flap", "Use of a vomer flap", "Using an external skin tube pedicle", "Use of a prosthesis"], "k": "E", "x": "After repeated failed closures, a palatal obturator prosthesis is the best option.", "d": "Paediatric", "src": "Cummings Ch 176 Cleft palate"}, {"s": "While doing Functional Endoscopic Sinus Surgery, the surgeon is trying to preserve middle turbinate and work lateral to it. Middle turbinate of nose is part of which bone:", "o": ["Ethmoid bone", "Maxillary bone", "Palatine bone", "Vomer bone", "Not a part of any of these but a separate bone"], "k": "A", "x": "Middle (and superior) turbinates are parts of the ethmoid bone; the inferior turbinate is a separate bone.", "d": "Rhinology", "src": "Cummings Ch 54 Sinus anatomy"}, {"s": "Which of the following statements is true:", "o": ["External auditory canal is 2/3rd cartilage and 1/3rd bone", "Eustachian tube is 1/3rd cartilage and 2/3rd bone", "Internal auditory canals all bone", "Canal of tensor tympani muscle is 1/4th cartilage and 3/4th bone"], "k": "C", "x": "IAC is entirely bony. EAC: lateral 1/3 cartilage, medial 2/3 bone. ET: 1/3 bone, 2/3 cartilage.", "d": "Otology", "src": "KJ Lee · Temporal bone anatomy"}, {"s": "A 38-year old female patient was subjected to subtotal thyroidecto ": "C", "x": "Exam (book) key C. Current evidence favours E: Book key C is wrong: spinal accessory nodes = level V, removed in every RND. NOT removed: suboccipital, parotid (intraglandular), retropharyngeal, facial, paratracheal (VI). Answer E.\nRND removes levels I–V (including IA submental and level V spinal accessory chain) with SCM, IJV and XI; the parotid tail is usually taken with level II.", "d": "H&N / Plastics / Trauma", "src": "Cummings 5th-ed review file · Ch 87 · Neck anatomy · Scott-Brown 8th, Cummings 7th, KJ Lee 12th"}, {"s": "Trismus associated with deep neck infection is most indicative of:", "o": ["Peritonsillar abscess", "Parapharyngeal abscess", "Parotitis", "Submandibular abscess", "Infection tracking along the carotid sheath"], "k": "B", "x": "Medial pterygoid irritation in the prestyloid PPS.", "d": "H&N / Plastics / Trauma", "src": "Cummings 5th-ed review file · Ch 89 · Deep neck infection (also Shamsan Q151) · Scott-Brown 8th"}, {"s": "The tensor veli palatine muscle is innervated by the:", "o": ["Mandibular division of the trigeminal nerve", "Maxillary division of the trigeminal nerve", "Glossopharyngeal nerve", "Vagus nerve", "Hypoglossal nerve."], "k": "A", "x": "First-arch muscle (with tensor tympani).", "d": "H&N / Plastics / Trauma", "src": "Cummings 5th-ed review file · Ch 71 · Oral cavity/pharynx anatomy · Scott-Brown 8th"}, {"s": "A common reason that revision stapes surgery is necessary is:", "o": ["Tympanic membrane perforation", "Formation of adhesions in the middle ear", "Exostosis of the external auditory canal", "Incus erosion", "Malignant external otitis"], "k": "D", "x": "Prosthesis migration/incus necrosis is the commonest finding.", "d": "Otology", "src": "Cummings 5th-ed review file · Ch 160 · Otosclerosis · Scott-Brown 8th"}, {"s": "what are the embryologic origins of the laryngeal cartilages", "o": ["First branchial arch", "Second branchial arch", "Third branchial arch", "Fourth, fifth, and sixth branchial arches"], "k": "D", "x": "Laryngeal cartilages: 4th arch (thyroid) and 6th arch (cricoid, arytenoids).", "d": "Laryngology", "src": "Cummings 4th ed. Ch 171 Developmental anatomy"}]};const Q=P.q;const L='ABCDEFGH';
const DOMS=['Otology','Rhinology','Laryngology','Paediatric','H&N / Plastics / Trauma','General'];
let S={mode:'exam',mins:180,phase:'start',pos:0,ans:{},flag:{},end:0,start:0,tick:null,used:0,list:[],rpos:0,rtitle:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')};
function nav(html){let n=document.querySelector('.nav');if(!html){n&&n.remove();return}if(!n){n=document.createElement('div');n.className='nav';document.body.appendChild(n)}n.innerHTML='<div class="navi">'+html+'</div>'}
function startScreen(){
  S.phase='start';nav();clearInterval(S.tick);
  const cnt={};Q.forEach(q=>cnt[q.d]=(cnt[q.d]||0)+1);
  $('#app').innerHTML=`<div class="kicker">Palestinian Board · Final MCQ mock</div><h1>${esc(P.title)}</h1>
  <p class="sub">100 single-best-answer questions, one correct option each. Original exam wording. Each answer gives the source key and the Cummings/Shamsan chapter where the question appears; where current evidence differs from the book key, the explanation says so.</p>
  <div class="card"><table>${DOMS.filter(d=>cnt[d]).map(d=>`<tr><td>${d}</td><td>${cnt[d]}</td></tr>`).join('')}</table></div>
  <b>Mode</b><div class="seg" role="group" aria-label="Mode"><button class="${S.mode=='exam'?'on':''}" onclick="S.mode='exam';startScreen()">Exam — marked at the end</button><button class="${S.mode=='practice'?'on':''}" onclick="S.mode='practice';startScreen()">Practice — instant feedback</button></div>
  ${S.mode=='exam'?`<b>Time</b><div class="seg" role="group" aria-label="Time limit">${[180,150,120,90].map(m=>`<button class="${S.mins==m?'on':''}" onclick="S.mins=${m};startScreen()">${m==180?'3 h':m+' min'}</button>`).join('')}</div>`:''}
  <button class="primary" onclick="begin()">Start paper</button>
  <p class="note">${S.mode=='exam'?'You can change answers and flag questions until you submit. The paper submits itself when time runs out.':'Each answer is marked when you tap it and locks. Untimed.'} Progress is kept while this page stays open.</p>`;
  scrollTo(0,0)}
function begin(){S.ans={};S.flag={};S.pos=0;S.phase='run';S.start=Date.now();
  if(S.mode=='exam'){S.end=S.start+S.mins*60000;S.tick=setInterval(()=>{const r=S.end-Date.now();const t=$('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}
  show()}
function answered(){return Object.keys(S.ans).length}
function show(){
  const q=Q[S.pos],a=S.ans[S.pos],prac=S.mode=='practice';
  let h=`<div class="top"><div class="topi">${S.mode=='exam'?`<span class="timer" id="tm">${fmt(S.end-Date.now())}</span>`:`<span class="timer">${Object.entries(S.ans).filter(([i,v])=>v==Q[i].k).length}/${answered()}</span>`}<span class="t">${answered()} of ${Q.length} answered</span><button class="flagbtn ${S.flag[S.pos]?'on':''}" onclick="flag()" aria-pressed="${!!S.flag[S.pos]}">${S.flag[S.pos]?'Flagged':'Flag'}</button></div><div class="bar"><i style="width:${(S.pos+1)}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${Q.length}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${S.pos+1}" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,i)=>{const l=L[i];let c='';if(prac&&a){if(l==q.k)c='ok';else if(l==a)c='bad'}else if(a==l)c='sel';
    h+=`<button class="opt ${c}" ${prac&&a?'disabled':''} onclick="pick('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(prac&&a)h+=expl(q,a);
  $('#app').innerHTML=h;
  const last=S.pos==Q.length-1;
  nav(`<button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Questions</button>${last?`<button class="primary" onclick="confirmSubmit()">Submit</button>`:`<button class="primary" onclick="go(1)">Next</button>`}`);
}
function expl(q,a){const ok=a==q.k;
  return `<div class="exp"><h3 class="${a?(ok?'ok':'bad'):'na'}">${a?(ok?'Correct':'Incorrect'):'Not answered'} — answer ${q.k}</h3>${q.x?q.x.split('\n').map(p=>`<p>${esc(p)}</p>`).join(''):`<p class="note">The source gives the key only for this question.</p>`}${q.xi?q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join(''):''}<div class="src">${esc(q.d)} · ${esc(q.src)}</div></div>`}
function pick(l){if(S.mode=='practice'&&S.ans[S.pos])return;if(S.mode=='exam'&&S.ans[S.pos]==l)delete S.ans[S.pos];else S.ans[S.pos]=l;const y=scrollY;show();scrollTo(0,y)}
function flag(){S.flag[S.pos]?delete S.flag[S.pos]:S.flag[S.pos]=1;const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(Q.length-1,S.pos+d));show();scrollTo(0,0)}
function grid(){const d=$('#dlg');const nf=Object.keys(S.flag).length,na=Q.length-answered();
  d.innerHTML=`<b>Questions</b><div class="legend" style="margin-top:6px"><span class="a">Answered (${answered()})</span><span class="f">Flagged (${nf})</span><span>Unanswered (${na})</span></div>
  <div class="grid">${Q.map((_,i)=>`<button class="${S.ans[i]?'ans':''} ${S.flag[i]?'flg':''} ${i==S.pos?'cur':''}" onclick="S.pos=${i};$('#dlg').close();show();scrollTo(0,0)" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div>
  <div class="row"><button class="ghost" onclick="$('#dlg').close()">Close</button><button class="primary" onclick="$('#dlg').close();confirmSubmit()">Submit paper</button></div>`;d.showModal()}
function confirmSubmit(){const d=$('#dlg');const na=Q.length-answered(),nf=Object.keys(S.flag).length;
  d.innerHTML=`<b>Submit this paper?</b><p class="note">${na?`${na} question${na>1?'s are':' is'} unanswered. `:'All questions answered. '}${nf?`${nf} flagged.`:''} You can't change answers after submitting.</p><div class="row"><button class="ghost" onclick="$('#dlg').close()">Keep going</button><button class="primary" onclick="$('#dlg').close();submit()">Submit</button></div>`;d.showModal()}
function submit(auto){clearInterval(S.tick);S.used=Date.now()-S.start;S.phase='done';S.auto=!!auto;if($('#dlg').open)$('#dlg').close();results()}
function results(){nav();
  let r=0;const by={};Q.forEach((q,i)=>{const b=by[q.d]=by[q.d]||{n:0,r:0};b.n++;if(S.ans[i]==q.k){r++;b.r++}});
  const wrong=Q.map((q,i)=>i).filter(i=>S.ans[i]&&S.ans[i]!=Q[i].k),skip=Q.map((q,i)=>i).filter(i=>!S.ans[i]),fl=Object.keys(S.flag).map(Number).sort((a,b)=>a-b);
  $('#app').innerHTML=`<div class="kicker">${esc(P.title)}</div><h1>Results</h1>${S.auto?'<p class="note">Time ran out — the paper was submitted automatically.</p>':''}
  <div class="big">${r}<span style="font-size:1.4rem;color:var(--muted)">/100</span></div><p class="sub">${wrong.length} incorrect · ${skip.length} unanswered · time used ${fmt(S.used)}</p>
  <div class="card"><table>${DOMS.filter(d=>by[d]).map(d=>{const b=by[d],p=Math.round(b.r/b.n*100);return `<tr><td>${d}<div class="meter"><i style="width:${p}%"></i></div></td><td>${b.r}/${b.n} · ${p}%</td></tr>`}).join('')}</table></div>
  <div class="row"><button class="primary" ${wrong.length+skip.length?'':'disabled'} onclick="review('Incorrect and unanswered',${JSON.stringify(wrong.concat(skip).sort((a,b)=>a-b))})">Review incorrect (${wrong.length+skip.length})</button></div>
  <div class="row"><button class="ghost" ${fl.length?'':'disabled'} onclick="review('Flagged',${JSON.stringify(fl)})">Flagged (${fl.length})</button><button class="ghost" onclick="review('All questions',${JSON.stringify(Q.map((_,i)=>i))})">All 100</button></div>
  <div class="row"><button class="ghost" onclick="startScreen()">Retake paper</button></div>`;scrollTo(0,0)}
function review(t,list){S.list=list;S.rpos=0;S.rtitle=t;rshow()}
function rshow(){const i=S.list[S.rpos],q=Q[i],a=S.ans[i];
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="results()">Results</button><span class="t">${S.rtitle} · ${S.rpos+1}/${S.list.length}</span>${S.flag[i]?'<span class="flagbtn on">Flagged</span>':''}</div></div>
  <div class="qn">Question ${i+1}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,j)=>{const l=L[j];const c=l==q.k?'ok':(l==a?'bad':'');h+=`<button class="opt ${c}" disabled><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  h+=expl(q,a);$('#app').innerHTML=h;
  nav(`<button class="ghost" ${S.rpos?'':'disabled'} onclick="S.rpos--;rshow();scrollTo(0,0)">Previous</button><button class="primary" ${S.rpos<S.list.length-1?'':'disabled'} onclick="S.rpos++;rshow();scrollTo(0,0)">Next</button>`)}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
window.addEventListener('beforeunload',e=>{if(S.phase=='run'){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(S.phase!='run'||$('#dlg').open)return;if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else{const i=L.indexOf(e.key.toUpperCase());if(e.key.length==1&&i>=0&&i<Q[S.pos].o.length)pick(L[i])}});
startScreen();
</script></body></html>
