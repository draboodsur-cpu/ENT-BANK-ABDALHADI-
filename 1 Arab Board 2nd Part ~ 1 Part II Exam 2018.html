<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>ENT Part II Exam 2018 — Answered &amp; Referenced</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--amber:#B06A00;--amber-soft:#FBEFD9;--box:#0B1418;--on-teal:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--amber:#E8A94A;--amber-soft:#3A2C14;--box:#000;--on-teal:#06201F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td:last-child{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px 8px;text-align:center}
.seg button.on{background:var(--teal);color:var(--on-teal);font-weight:600}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note{font-size:.9rem;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.timer{font:700 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.topi .t{flex:1;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.flagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
.flagbtn.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.qn{font-weight:600;font-size:.9rem;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{opacity:1}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}.exp h3.na{color:var(--amber)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;position:relative}
.grid .ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.grid .flg{box-shadow:inset 0 0 0 2px var(--amber)}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-na{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid .cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.legend .a::before{background:var(--teal-soft);border-color:var(--teal)}.legend .f::before{box-shadow:inset 0 0 0 2px var(--amber)}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3.2rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>button{flex:1}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--teal)}
</style></head><body>

ral nodes = N2c → stage IVA (AJCC 8).","src":"2018 exam recall · Q6","d":"Head & Neck"},{"s":"In otherwise healthy patient with advance laryngeal cancer , treatment regimen that is most likely to result in preservation of larynx at 2 years: Concurrent chemoradiation allows laryngeal","o":["Concurrent chemotherapy and radiation therapy ,","Induction chemotherapy followed by radiation","Radiation followed by adjuvant chemotherapy","Partial laryngectomy followed by radiation","radiation only"],"k":"A","x":"Concurrent chemoradiation gives the highest larynx preservation rate (RTOG 91-11).","src":"2018 exam recall · Q7","d":"Laryngology"},{"s":"From the following head and neck space infection, the commonest is","o":["Retropharyngeal space","parapharyngeal space","Parotid space","Prevertebral space","Masticator space"],"k":"B","x":"⚑ No answer given in the recall; answered from the references. — Parapharyngeal (lateral pharyngeal) space infections are among the commonest deep neck infections in adults (Cummings).","src":"2018 exam recall · Q8","d":"Head & Neck"},{"s":"Laryngeal Chondrosarcoma","o":["Is usually low grade","most commonly arise from the anterior commissure","Commonly metastases to the lung","Can be adequately treated by Curretage","Commonly affect thyroid cartilage"],"k":"A","x":"⚑ No answer given in the recall; answered from the references. — Laryngeal chondrosarcoma is usually low grade, arises most often from the posterior cricoid, and rarely metastasizes (Cummings).","src":"2018 exam recall · Q9","d":"Laryngology"},{"s":"Which serological marker may be indicative of recurrent well differentiated thyroid carcinoma?","o":["Decrease thyroglobulin","Increase thyroglobulin","Increase thyrotropin","Increase thyroid stimulating hormone (TSH)","Decrease TSH"],"k":"B","x":"A rising thyroglobulin after thyroidectomy/ablation suggests recurrent differentiated thyroid cancer (ATA).","src":"2018 exam recall · Q10","d":"Head & Neck"},{"s":"The optimal treatment of recurrent cervical lymph node metastasis in nasopharyngeal carcinoma following radiotherapy is","o":["Second, come of radio therapy","Modified neck dissection,","Radical neck dissection","Radical neck dissection followed by radiotherapy","Chemotherapy and radiotherapy"],"k":"C","x":"Recurrent cervical nodal NPC after radiotherapy: radical neck dissection (Cummings).","src":"2018 exam recall · Q11","d":"Rhinology"},{"s":"The most common presentation of tracheal squamous cell carcinoma is","o":["Neck mass","Hoarseness","Dyspnea","Dysphagia","Haemoptysis & cough"],"k":"E","x":"Tracheal SCC most commonly presents with haemoptysis and cough; adenoid cystic carcinoma presents with dyspnoea (Cummings).","src":"2018 exam recall · Q12","d":"Laryngology"},{"s":"The utility of sentinel node biopsy is higher in patients with tumors in the","o":["Floor of the mouth","Oral tongue","Lower gum","Base of the tongue","larynx"],"k":"B","x":"Sentinel node biopsy has the highest utility in early oral tongue cancer (NCCN).","src":"2018 exam recall · Q13","d":"Head & Neck"},{"s":"Selective posterolateral neck dissection include level","o":["I- III","I-IV","II-IV","II-V","II-VI"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — Posterolateral neck dissection removes levels II–V plus suboccipital/retroauricular nodes (Shah).","src":"2018 exam recall · Q14","d":"Head & Neck"},{"s":"Squamous cell carcinoma of right tonsil with bilateral lymph node metastasis of 5cm? in the neck stage is","o":["N1","N2a","N2b","N2c","N3"],"k":"D","x":"Bilateral cervical metastases = N2c (AJCC 8, p16-negative).","src":"2018 exam recall · Q16","d":"Head & Neck"},{"s":"A patient develops a chylous fistula a following a left neck dissection, which of the following treatment is LEAST LIEY to result in fistula closure?","o":["Endovascular embolization of the thoracic duct","Enteral diet containing predominantly medium chain fatty acids","Surgical re - exploration","Enteral diet containing p  recall · Q30","d":"Head & Neck"},{"s":"A 27-year-old man presents with hoarseness for 6 months. He has ….. employed as a telephone operator for the last 8 months. The most likely diagnosis is","o":["Postnasal drip","Cancer of the larynx","Reflux esophagitis","Voice abuse","Kallman syndrome"],"k":"D","x":"Hoarseness in a heavy voice user (telephone operator) is most likely due to voice abuse/misuse (Scott-Brown).","src":"2018 exam recall · Q31","d":"Laryngology"},{"s":"Regarding Zenker's diverticulum:","o":["Aspiration pneumonitis is unlikely","It is a congenital abnormality","Associated squamous cell carcinoma is extremely rare","It is a traction-type diverticulum","Treatment is restriction of certain foods"],"k":"C","x":"Carcinoma arising within a Zenker diverticulum is a recognized but rare association (Scott-Brown).","src":"2018 exam recall · Q32","d":"Head & Neck"},{"s":"Concerning lip cancer","o":["It is the second most common site for cancer in the oral cavity","Basal cell carcinoma is more common on the upper lip compared to the lower lip","Cancer of the upper lip is associated with a better prognosis compared to that of lower lip","Bilateral cervical metastasis is not a concern for cancers in close proximity to the midline","Squamous cell carcinoma is the second most common tumour. Carcinoma o the upper lip or oral commissure"],"k":"B","x":"Basal cell carcinoma is commoner on the upper lip; SCC dominates the lower lip (Cummings).","src":"2018 exam recall · Q33","d":"Head & Neck"},{"s":"Following a cervical Tracheal resection there is difficulty in obtaining tension free anastomosis despite full neck flection. What maneuver should be performed next?","o":["Hilar release","Suprahyoid release","Infrahyoid release","Mediastinoscopy to identify scar bands","Harvest costal cartilage graft"],"k":"B","x":"A suprahyoid laryngeal release gives more tracheal mobility than an infrahyoid release (Cummings).","src":"2018 exam recall · Q34","d":"Laryngology"},{"s":"Laryng ation"],"k":"C","x":"Electrogustometry is least useful for prognosis in Bell palsy (Cummings).","src":"2018 exam recall · Q10","d":"Others"},{"s":"Which of the following causes of acute facial paralysis carries the best prognosis for recovery?","o":["Acute otitis media (AOM)","Penetrating trauma","Temporal bone fracture due to blunt trauma","Bell's palsy","Ramsay Hunt syndrome"],"k":"A","x":"Facial palsy from AOM carries the best prognosis (Cummings).","src":"2018 exam recall · Q12","d":"Others"},{"s":"The most common site of origin of acquired cholesteatoma is","o":["Anterior epitympanum","posterior epitympanum","posterior mesotympanum","anterior mesotympanum","inferior mesotympanum"],"k":"B","x":"Acquired cholesteatoma most commonly originates in the posterior epitympanum (Prussak space) (Scott-Brown).","src":"2018 exam recall · Q13","d":"Otology"},{"s":"Scutum erosion on CT scan is indicative of","o":["Mastoiditis","Middle ear neoplasm","Attic cholesteatoma","Necrotizing otitis externa","Glomus jugulare tumor"],"k":"C","x":"Scutum erosion on CT indicates attic cholesteatoma (Scott-Brown).","src":"2018 exam recall · Q15","d":"Others"},{"s":"What is the most likely diagnosis in a patient with a history of vestibular neuronitis 6 \u0003 months ago, who now has vague unsteadiness and disorientation After 6 month :In some patients, especially the elderly and those with additional central","o":["Panic attacks","Cerebellar stroke","Motion sickness","Visual vertigo syndrome","Vestibular migraine"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — Persistent vague unsteadiness, worse in visually busy environments, after vestibular neuritis suggests visual vertigo/PPPD (Cummings).","src":"2018 exam recall · Q16","d":"Otology"},{"s":"Which of the following conditions MOSTLY supports the diagnosis of superior canal dehiscence?","o":["Positive head thrust maneuver","Air bone gap at 250 Hz","VEMP (vestibular evoked myogenic potential) thresholds","S x":"In otosclerosis the air–bone gap typically begins in the low frequencies; reflexes are absent and women are more affected (Scott-Brown).","src":"2018 exam recall · Q22","d":"Otology"},{"s":"Following tympanostomy tube insertion, there is strong evidence in the literature to show that intraoperative administration of antibiotics ear drops can","o":["Reduce pain levels as reported by patients","Prevent post tympanostomy tube otitis media","Prevent granulation tissue formation at site of insertion","reduce post tympanostomy tube otorrhea","Reduces tube extrusion"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — Intraoperative topical antibiotic drops reduce early post-tympanostomy otorrhoea (AAO-HNS tube guideline).","src":"2018 exam recall · Q23","d":"Otology"},{"s":"Eight weeks after successful stapedectomy, the female patient complains of hearing loss. Tuning fork testing","o":["Otosclerosis of the round window","Formation of middle ear adhesions","reparative granuloma of the oval window","loose wire of the prosthesis","displacement of the prosthesis"],"k":"E","x":"⚑ No answer given in the recall; answered from the references. — Delayed conductive loss after stapedectomy is most often from prosthesis displacement/incus necrosis (Brackmann).","src":"2018 exam recall · Q24","d":"Otology"},{"s":"Which of the following is an absolute contraindication of external ear canal reconstruction?","o":["Laterally displaced CN VII","thick atretic plate","ossicular abnormalities","malformed inner ear with SNHL","Presence of cholesteatoma"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — A malformed inner ear with SNHL is an absolute contraindication to atresia repair (Cummings).","src":"2018 exam recall · Q25","d":"Otology"},{"s":"A 12 year old boy presented with swelling in the left temporal region for the past 2 months. Child has left complete facial palsy and a mass in the external auditory canal. There is no fever hatic sac (Brackmann).","src":"2018 exam recall · Q32","d":"Others"},{"s":"During diving the pressure on our body keeps increasing as the depth increases. At what depth under the sea water, an additional one atmospheric pressure gets added to the pressure applied on the entire body;","o":["100 meters","80 meters","50 meters","20 meters","10 meters"],"k":"E","x":"Each 10 m of seawater adds one atmosphere of pressure (Scott-Brown).","src":"2018 exam recall · Q33","d":"Others"},{"s":"Which one of the following is an indication for radical mastoidectomy;","o":["Extensive cholesteatoma","Cholesteatoma with lateral semicircular canal dehiscence","COSM with meningitis","Ugo Fisch type A approach for glomus jugulare","Cholesteatoma with complete facial palsy"],"k":"A","x":"⚑ No answer given in the recall; answered from the references. — Radical mastoidectomy is reserved for extensive, unresectable cholesteatoma where middle ear reconstruction is not possible (Brackmann).","src":"2018 exam recall · Q34","d":"Otology"},{"s":"At the time of preoperative check 1 week prior to stapedectomy, patient was noted to have positive Schwartz sign. What is the most appropriate plan;","o":["Prescribe antibiotics and continue with the plan","The findings are incidental and there is no need to change the plan","No change in plan but patient will need longer piston and focus is","Prescribe sodium fluoride and go ahead with surgery as planned","Prescribe sodium fluoride and wait until the sign subsides"],"k":"E","x":"A positive Schwartze sign indicates active otosclerosis — prescribe sodium fluoride and postpone surgery (Scott-Brown).","src":"2018 exam recall · Q35","d":"Otology"},{"s":"A large near total perforation following acute necrotizing otitis media must be followed up for fear of;","o":["Recurrent middle ear infection","Secondary acquired cholesteatoma","Retraction pocket","Tympanosclerosis","Otosclerosis"],"k":"B","x":"Large perforations after necrotizing otitis media risk secondary acquired cholesteatoma from epithelial migration (Scott-Brown).","src":"2018 exam recall · Q36","d":"Otology"},{"s":"A 5 year old child has persistent serous effusion in both ears for 6 months after an acute infection. He has 40-db conductive hearing loss in both ears and have trouble at school. What would be the BEST treatment for this child?","o":["Observe the child for another 3 months","Prescribe amoxicillin for 10 days","Recommend hearing aids","Place ventilating tubes","Prescribe prophylactic antibiotics for 3 months"],"k":"D","x":"Bilateral OME for 6 months with 40 dB hearing loss: ventilation tubes (AAO-HNS).","src":"2018 exam recall · Q37","d":"Paediatric"},{"s":"After mastoidectomy operation, complete facial nerve paralysis was observed after recovery from anaesthesia;","o":["Steroids and follow up are only required","Immediate surgical exploration is needed","Surgical exploration is made after electro diagnostic tests","Giving steroids and removing the ear pack is usually successful","Observe and wait"],"k":"C","x":"⚑ No answer given in the recall; answered from the references. — Immediate post-mastoidectomy palsy: wait a few hours for local anaesthetic to wear off, then explore if it persists (Brackmann).","src":"2018 exam recall · Q38","d":"Otology"},{"s":"In lower motor neuron facial paralysis with normal Schirmer test and loss of taste sensation at the anterior 2/3 of the tongue , the level of the lesion is;","o":["In the internal auditory canal","In the horizontal tympanic part","At the geniculate ganglion","In the stylomastoid foramen","At the labyrinthine part"],"k":"B","x":"⚑ No answer given in the recall; answered from the references. — Normal Schirmer test with loss of taste places the lesion between the geniculate ganglion and chorda tympani — horizontal tympanic segment (Scott-Brown).","src":"2018 exam recall · Q39","d":"Head & Neck"},{"s":"A patient has sustained a fracture of the skull base. Thorough examination concludes that the greater superficial petrosal nerve has been injured. The conclusion was based","o":["Partial dryness of the mouth due to lack of salivary secretion from the submandibular and","Partial dryness of the mouth due to lack of salivary secretion from the","Dryness of the cornea due to lack of lacrimal secretion","Loss of taste sensation from the anterior 2/3 f the tongue","Loss of the taste at the base of the tongue"],"k":"C","x":"⚑ No answer given in the recall; answered from the references. — Greater superficial petrosal nerve injury reduces lacrimation, causing corneal dryness (Scott-Brown).","src":"2018 exam recall · Q40","d":"Otology"},{"s":"With the right ear positioned toward the ground in the Dix-Halpike maneuver, which of the following nystagmus is characteristic of right posterior semicircular canal BPPV?","o":["Pure horizontal geotropic","Downbeating, geotropic and torsional","Downbeating, ageotropic and torsional","Upbeating, geotropic and torsional","Upbeating , ageotropic and torsional"],"k":"D","x":"Right posterior canal BPPV: upbeating, geotropic torsional nystagmus (AAO-HNS).","src":"2018 exam recall · Q41","d":"Otology"},{"s":"Type III tympanoplasty is;","o":["Graft placement directly on the malleus ● Type 1: All ossicles are present and mobile","Graft placed on the footplate","Graft placed on the stapes head","Graft placement directly on the incus","Called myringoplasty"],"k":"C","x":"⚑ No answer given in the recall; answered from the references. — Wullstein type III: graft placed on the stapes head (Brackmann).","src":"2018 exam recall · Q42","d":"Otology"},{"s":"During stapedectomy, there is a luxation of the incus, how to manage?","o":["Abortion of the operation","Myringostapedopexy","Use a malleus-oval window prosthesis","Incus transposition","Fix the incus back in place"],"k":"C","x":"⚑ No answer given in the recall; answered from the references. — Incus luxation during stapedectomy: use a malleus-to-oval window prosthesis (Brackmann).","src":"2018 exam recall · Q43","d":"Otology"},{"s":"Blunting of the anterior angle of the ear canal results in;","o":["Poorer rate of perforation closure","Poor hearing","Cholesteatoma formation","Increased incidence of otitis externa","Difficulty in visualizing the tympanic membrane post operatively"],"k":"B","x":"⚑ No answer given in the recall; answered from the references. — Anterior blunting causes conductive hearing loss (Brackmann).","src":"2018 exam recall · Q45","d":"Otology"},{"s":"An injury that results in 3x3 cm loss of skin and perichondrium from auricle is best treated by a;","o":["Split thickness skin graft","Full thickness skin graft","Pedicled postauricular skin flap","Excision of the exposed cartilage and primary closure","Excision of the exposed cartilage and reconstruction with"],"k":"C","x":"⚑ No answer given in the recall; answered from the references. — Loss of skin and perichondrium needs a pedicled postauricular flap (Cummings).","src":"2018 exam recall · Q46","d":"Others"},{"s":"A 13 year old girl presented with a history of three episodes of meningitis associated with right sided acute suppurative otitis media. She was born with a right sided unilateral profound SNHL. You suspect she has what?","o":["A right-sided meningoencephalocele through the mastoid tegmen","A right-sided Mondini malformation","A right-sided enlarged vestibular aqueduct syndrome","A patent Hyrtl's fissure","Congenital cholesteatoma"],"k":"B","x":"Recurrent meningitis with ipsilateral otitis suggests an inner ear malformation (Mondini) with CSF fistula (Cummings).","src":"2018 exam recall · Q48","d":"Paediatric"},{"s":"While operating on a patient with facial paralysis from an infected cholesteatoma you should avoid;","o":["Removing the bone of the fallopian canal","Removing the incus","Removing granulation tissue adjacent to the facial nerve","Incising the facial nerve sheath","Cutting the chorda tympani nerve"],"k":"D","x":"The facial nerve sheath should not be incised in an infected field (Brackmann).","src":"2018 exam recall · Q49","d":"Otology"},{"s":"A 40-year old female attends the clinic for assessment of dizziness. The dizziness occur when she rolls over from lying position to either the left side or right side. It also occurs when she looks upwards. The episodes usually last for 10-14 seconds. They have been occurring for the past 6 months and occur on average 1-2 times per day. What is the most likely diagnosis?","o":["Acute labyrinthitis","BPPV","Central vertigo","Orthostatic hypotension","Vestibular neuronitis"],"k":"B","x":"Positional vertigo on rolling over = BPPV (AAO-HNS).","src":"2018 exam recall · Q50","d":"Others"},{"s":"The ideal embolic agent for embolizing a glomus jugulare tumour is;","o":["Gelfoam","A tissue adhesive","Metallic coils","Beads","Polyvinyl alcohol foam"],"k":"E","x":"⚑ No answer given in the recall; answered from the references. — Polyvinyl alcohol particles are the preferred embolic agent for glomus tumours (Cummings).","src":"2018 exam recall · Q52","d":"Otology"},{"s":"First line of treatment of petrous apicitis is;","o":["Radical mastoidectomy","Limited petrous apex approach","Antibiotic therapy against pseudomonas aeruginosa. cranial fossa approach for petrous apiciectomy","Middle fossa approach","Extensive surgical dissection surrounding the internal carotid artery"],"k":"C","x":"⚑ No answer given in the recall; answered from the references. — First-line treatment of petrous apicitis: antibiotics against Pseudomonas and other organisms (± mastoidectomy) (Cummings).","src":"2018 exam recall · Q53","d":"Otology"},{"s":"In Ramsay Hunt syndrome all of the following is true EXCEPT;","o":["The primary pathophysiology is located in the central nucleus of the facial nerve","Hearing loss and balance problems may occur","Corticosteroids and oral acyclovir are utilized commonly","Surgical decompression of the facial nerve has no role in this syndrome","Varicella zoster is the virus responsible for this disease"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — Surgical decompression is not routinely indicated in Ramsay Hunt syndrome (Cummings).","src":"2018 exam recall · Q54","d":"Others"},{"s":"A 60 year old dizzy male is suspected of having a central lesion, the MOST reliable sign would be;","o":["Failure of ocular fixation","Right beating nystagmus","Direction fixed nystagmus","Direction changing nystagmus","Ocular fixation"],"k":"A","x":"⚑ No answer given in the recall; answered from the references. — Failure of fixation suppression is a reliable central sign (Scott-Brown).","src":"2018 exam recall · Q55","d":"Others"},{"s":"The low frequency component of SNHL in adults is likely mediated by pathology of the;","o":["Stria vascularis","Outer hair cells","Inner hair cells","Spiral ligament","Spiral ganglion neuron"],"k":"A","x":"Low-frequency SNHL in adults is linked to stria vascularis (strial) pathology (Cummings).","src":"2018 exam recall · Q56","d":"Otology"},{"s":"The most successful strategy of vestibular rehabilitation for dizzy patient with bilaterally absent vestibular function is thought to be vestibular;","o":["Adaptation","Habituation","Cooperation","Compensation","Substitution"],"k":"E","x":"With bilateral vestibular loss, rehabilitation relies on substitution (vision, somatosensation) (Cummings).","src":"2018 exam recall · Q57","d":"Otology"},{"s":"Otoacoustic emissions is most useful in assessing which of the following;","o":["Moderate sensorineural pathology","Mild conductive pathology","Tinnitus patients","Meniere's disease","Neonatal screening"],"k":"E","x":"OAEs are most useful for neonatal hearing screening (Cummings).","src":"2018 exam recall · Q58","d":"Otology"},{"s":"A person subjected to prolonged constant-velocity rotation in the dark will eventually not perceive that he is rotating. This effect is due to;","o":["Efferent modulation of vestibular hair cells","Depletion of neurotransmitter in the vestibular hair cells","T  epithelium into the underlying stroma","It is typically unilateral but can affect the nose bilaterally","Typically start at the medial wall of the nose and extends laterally","Have a high rate of recurrence"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — Inverted papilloma typically arises from the lateral nasal wall, not the medial wall (Cummings).","src":"2018 exam recall · Q68","d":"Laryngology"},{"s":"Juvenile Angiofibroma, all are true EXCEPT;","o":["Blood vessels typically lack smooth muscle and elastic fibers","Typically presents in a young male with nasal obstruction and recurrent epistaxis","Diagnosis should be made on the basis of imaging and not biopsy","Complete surgical resection is the treatment of choice","Recurrence is dependent on the initial extent/staging of the disease extension;^involvement of the"],"k":"C","x":"⚑ No answer given in the recall; answered from the references. — JNA diagnosis is clinical/radiological; biopsy is avoided because of haemorrhage risk (Cummings).","src":"2018 exam recall · Q69","d":"Paediatric"},{"s":"Esthesioneuroblastoma, all are true EXCEPT;","o":["Is a malignant neoplasm of neuroectodermal origin","This tumor an either be extremely aggressive or relatively indolent Rpid B.R","Up to 25% of these tumors invade the dura and anterior cranial fossa","Management is surgical resection with or without radiotherapy post-operatively","The disease present early with recurrent epistaxis and nasal obstruction"],"k":"E","x":"⚑ No answer given in the recall; answered from the references. — Esthesioneuroblastoma often presents late, not early (Cummings).","src":"2018 exam recall · Q70","d":"Head & Neck"},{"s":"Hereditary hemorrhagic telangiectasia (HHT), all are true EXCEPT;","o":["Autosomal dominant disease","The classical features are telangiectasia, arteriovenous malformations and aneurysms","Epistaxis occurs in 70% of cases","In HHT the vessel walls lack the contractile elements","Young's procedure could be utilized in the surgical management of the disease"],"k":"C","x":"Epistaxis occurs in about 90–95% of HHT patients (Cummings).","src":"2018 exam recall · Q71","d":"Others"},{"s":"Regarding lateral deviation of the nasal pyramid after nasal bone fracture, bones deviated greater than one full width of the bridge of the nose is regarded as grade;","o":["0","1","2","3","4"],"k":"D","x":"Nasal pyramid deviated more than one full bridge width is graded as the most severe (grade 3) deviation (Scott-Brown).","src":"2018 exam recall · Q72","d":"Rhinology"},{"s":"In Kuhn classification for allergic fungal rhinosinusitis ; sinus polyps with allergic mucin is considered as stage;","o":["0","1","2","3","4"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — Kupferberg staging: stage 3 = sinus polyps with fungal debris/allergic mucin (Cummings).","src":"2018 exam recall · Q73","d":"Rhinology"},{"s":"The first line in management of progressive proptosis after sinus surgery is;","o":["Packing the nasal cavity","Ophthalmic consultation","Re exploration of the ethmoid cavity to control the site of hemorrhage","Lateral canthotomy","Mannitol"],"k":"D","x":"Progressive proptosis after sinus surgery: immediate lateral canthotomy (Cummings).","src":"2018 exam recall · Q74","d":"Rhinology"},{"s":"A nasal cavity tumor extending to maxillary sinus, with single ipsilateral lymph node 3 cm in the neck is staged as;","o":["Stage I","Stage II","Stage III","Stage IVA","Stage IVB"],"k":"C","x":"Nasal cavity tumour extending to the maxillary sinus (T2) with a single ipsilateral 3-cm node (N1) = stage III (AJCC 8).","src":"2018 exam recall · Q75","d":"Rhinology"},{"s":"Granulomatous fungal sinusitis is confirmed by;","o":["CT","Clinical immunology for fungal antibodies","Histopathology","Direct microscopy of nasal smear","MRI"],"k":"C","x":"⚑ No answer given in the recall; answered from the references. — Granulomatous fungal sinusitis is confirmed by histopathology (Cummings).","src":"2018 exam recall · Q76","d":"Rhinology"},{"s":"CSF Rhinorrhea can be complicated by;","o":["Viral encephalitis","Pneumocephalus","Coning","Optic nerve atrophy","Hydrocephalus"],"k":"B","x":"⚑ No answer given in the recall; answered from the references. — CSF rhinorrhoea can be complicated by pneumocephalus and meningitis (Cummings).","src":"2018 exam recall · Q77","d":"Rhinology"},{"s":"A 34-year old male presented with fungating nasopharyngeal squamous cell carcinoma and extension into the orbit with an opthalmoplegia. This patient is staged as;","o":["T1","T2","T3","T4","Tx"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — NPC with orbital extension = T4 (AJCC 8).","src":"2018 exam recall · Q78","d":"Rhinology"},{"s":"The commonest cause of non-traumatic CSF rhinorrhea;","o":["Pituitary tumors","Acoustic neuroma","Nasopharyngeal carcinoma","Congenital anomalies","Focal atrophy"],"k":"A","x":"⚑ Debatable item — modern series identify spontaneous (IIH-related) leaks as the commonest non-traumatic cause. — Tumours (notably pituitary) are a classic cause of non-traumatic (high-pressure) CSF rhinorrhoea in older texts; spontaneous leaks with idiopathic intracranial hypertension are now most common (Cummings).","src":"2018 exam recall · Q79","d":"Rhinology"},{"s":"After a road traffic accident, facial bones imaging of a young patient showed a pyramidal fracture line from the pterygoid plate through the infraorbital rim to the nasofrontal suture line. This fracture classification is;","o":["Le Forte I fracture","Le Forte II fracture","Le Forte III fracture","Blow out fracture","Sever naso-ethmoid fracture"],"k":"B","x":"⚑ No answer given in the recall; answered from the references. — A pyramidal fracture through the pterygoid plates = Le Fort II (Scott-Brown).","src":"2018 exam recall · Q80","d":"Rhinology"},{"s":"During endoscopic sinus surgery, what is the best maneuver to determine whether \u0003 lamina papyracea is intact or not?","o":["Intraoperative CT scan","Fat float test","Orbital press test","Endoscopic dissection and search for orbital fat","Ocular mobility test"],"k":"C","x":"The orbital press test checks lamina papyracea integrity (Cummings).","src":"2018 exam recall · Q81","d":"Rhinology"},{"s":"An appropriate initial management option for patients with intermittent allergic rhinitis include;","o":["Oral corticosteroids","Turbinate reduction","Antihistamines","Allergen-specific immunotherapy","Antileukotrienes"],"k":"C","x":"Antihistamines (or intranasal steroids) are first-line for intermittent allergic rhinitis (ARIA).","src":"2018 exam recall · Q82","d":"Others"},{"s":"In congenital nasal masses encephalocele can be distinguished from glioma based on a positive","o":["Venous engorgement","Arterial supply from both internal and external carotid arteries","A patent intracranial communication with CSF","Absence of patent intracranial communication with CSF","Connection with skull base"],"k":"C","x":"A positive Furstenberg sign reflects a patent intracranial communication (encephalocele) (Cummings).","src":"2018 exam recall · Q83","d":"Rhinology"},{"s":"Sever epistaxis originating above the middle turbinate and not controlled by other means requires ligation of the;","o":["Anterior ethmoid artery","Posterior ethmoid artery","Anterior and posterior arteries","Sphenopalatine artery","External carotid artery"],"k":"C","x":"Bleeding above the middle turbinate not otherwise controlled requires ligation of the anterior and posterior ethmoidal arteries (Scott-Brown).","src":"2018 exam recall · Q84","d":"Rhinology"},{"s":"A 37. Year old man with a unilateral nasal mass. The biopsy showed esthesioneuroblastoma which is penetrating the skull base but not the dura. The BEST treatment of this patient is;","o":["Chemotherapy and palliative radiotherapy","Radiotherapy followed by savage surgery","Cranio-facial resection followed by radiotherapy","Intra-nasal removal followed by therapy results in which of the following immunologic changes?","o":["Increased serum neutrophils","Increased serum IgE-blocking antibodies","Decreased serum IgG4 antibodies","Changes different to that observed after subcutaneous immunotherapy","No change in serum IgG4 antibodies antibody class switching of B cells from"],"k":"B","x":"Successful SLIT increases IgG4 blocking antibodies (Cummings).","src":"2018 exam recall · Q90","d":"Others"},{"s":"Reduction of blood flow through the spheno-palatine artery may be achieved by injection of local anaesthetic into the","o":["Foramen rotundum","Lesser palatine foramen","Greater palatine foramen","Infraorbital foramen","Incisive foramen"],"k":"C","x":"⚑ No answer given in the recall; answered from the references. — Greater palatine foramen injection reduces sphenopalatine flow (Scott-Brown).","src":"2018 exam recall · Q91","d":"Others"},{"s":"For assessment of the skull base and intracranial extension of cancer, which combination of studies is most informative","o":["PET and CT","CT and MRI","PET and MRI","MRI and MRI angiography","PET/CT and MRI"],"k":"B","x":"⚑ No answer given in the recall; answered from the references. — CT (bone) plus MRI (soft tissue, dura, perineural spread) best assess the skull base (Cummings).","src":"2018 exam recall · Q92","d":"Rhinology"},{"s":"Aspirin-exacerbated respiratory disease is characterized by","o":["A well-defined mechanism by which patients become intolerance to medication that inhibit cyclo","Overproduction of Lipoxins","Underproduction of Prostaglandin D2","Overproduction of Cysteinyl leukotrienes overproduction of proinflammatory cysteinyl leukotrienes and","Overproduction of Prostaglandin E2"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — AERD involves overproduction of cysteinyl leukotrienes (Cummings).","src":"2018 exam recall · Q93","d":"Others"},{"s":"Which of the following is an indication for orbital exenteration in a patient with squamous cell carcinoma?","o":["Involving the posterior ethmoid air cells","Involving the orbital bony floor","Involving the lacrimal gland","Involving orbital apex soft tissue","Involving periorbita adjacent to the lacrimal sac"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — Orbital apex invasion is an indication for orbital exenteration (Cummings).","src":"2018 exam recall · Q94","d":"Rhinology"},{"s":"Which of the following statements about complications in endoscopic pituitary surgery is true ?","o":["Complications rate are similar in primary and revision cases","CSF leaks require craniotomy to definitely repair","Delayed CSF leaks can be observed in patients without intraoperative CSF leaks","Persistent or delayed CSF leaks always resolve with lumber puncture","Meningitis is always associated with persistent CSF leaks"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — Persistent or delayed CSF leaks after pituitary surgery require surgical repair (Cummings).","src":"2018 exam recall · Q95","d":"Others"},{"s":"When injury to the lacrimal system is suspected during endoscopic sinus surgery the surgeon should;","o":["Immediately perform a dacryocystogram","Perform an external dacryocystorhinostomy","Perform an endoscopic dacryocystorhinostomy","Place silastic tubing stents in the lacrimal drainage system","Complete the procedure, taking care to avoid additional injury"],"k":"E","x":"⚑ No answer given in the recall; answered from the references. — Lacrimal injury during ESS is usually managed by completing surgery and observing; most patients remain asymptomatic (Cummings).","src":"2018 exam recall · Q96","d":"Rhinology"},{"s":"Transantral decompression performed for graves ophthalmopathy is LEAST likely to improve a patients;","o":["Intraocular pressure","Strabismus","Visual acuity","Proptosis","Visual fields"],"k":"B","x":"⚑ No answer given in the recall; answered from the references. — Orbital decompression often worsens (or does not improve) strabismus (Cummings).","src":"2018 exam recall · Q97","d":"Others"},{"s":"An open roof deformity can occure after","o":["Bony hump removal with inadequate osteotomy","Avulsion of upper lateral cartilage","Excessive soft tissue in supratip","Over resection of septal cartilage","Excessive resection of lower lateral crura"],"k":"A","x":"⚑ No answer given in the recall; answered from the references. — Open roof deformity follows bony hump removal without adequate osteotomies (Cummings).","src":"2018 exam recall · Q98","d":"Others"},{"s":"When harvesting costal cartilage, the ribs MOST commonly used are the","o":["First and second","Third and fourth","Fifth and sixth","Seventh and eighth","Eleventh and twelfth,"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — Costal cartilage is usually harvested from the 6th–8th ribs (Cummings).","src":"2018 exam recall · Q99","d":"Others"},{"s":"The efficacy of intranasal steroid used to control eye symptoms in patients with allergic rhinoconjuctivitis most likely is the result which of the following mechanisms or activity","o":["Systemic absorption of intranasal steroid","intranasal steroid reaching through nasolacrimal duct","intranasal steroid inhibiting ocular reflex induced by allergen in the nose","intranasal steroid reducing system allergic inflammation","AII of die above"],"k":"C","x":"Intranasal steroids reduce eye symptoms mainly by inhibiting the naso-ocular reflex (Cummings).","src":"2018 exam recall · Q100","d":"Rhinology"}]}];let PI=0;let P=PAPERS[0];let Q=P.q;const L='ABCDEF';
const DOMS=['Otology','Rhinology','Laryngology','Head & Neck','Paediatric','Others'];
let S={mode:'exam',mins:180,phase:'start',pos:0,ans:{},flag:{},end:0,start:0,tick:null,used:0,list:[],rpos:0,rtitle:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')};
function nav(html){let n=document.querySelector('.nav');if(!html){n&&n.remove();return}if(!n){n=document.createElement('div');n.className='nav';document.body.appendChild(n)}n.innerHTML='<div class="navi">'+html+'</div>'}
function startScreen(){
  S.phase='start';nav();clearInterval(S.tick);
  const cnt={};Q.forEach(q=>cnt[q.d]=(cnt[q.d]||0)+1);
  $('#app').innerHTML=`<div class="kicker">Palestinian Board · Exam recall · answered</div><h1>Part II Exam 2018</h1><b>Paper</b><div class="seg" role="group" aria-label="Paper" style="flex-wrap:wrap">${PAPERS.map((p,i)=>`<button class="${PI==i?'on':''}" onclick="pickPaper(${i})">${i+1}</button>`).join('')}</div><h2 style="margin:14px 0 6px;font-size:1.15rem">${esc(P.title)}</h2>
  <p class="sub">The 2018 Part II recall (Paper 15 A and B). Each question is answered against our references, with a short referenced explanation. Changed or missing recalled keys are flagged ⚑, and incomplete questions are completed.</p>
  <div class="card"><table>${DOMS.filter(d=>cnt[d]).map(d=>`<tr><td>${d}</td><td>${cnt[d]}</td></tr>`).join('')}</table></div>
  <b>Mode</b><div class="seg" role="group" aria-label="Mode"><button class="${S.mode=='exam'?'on':''}" onclick="S.mode='exam';startScreen()">Exam — marked at the end</button><button class="${S.mode=='practice'?'on':''}" onclick="S.mode='practice';startScreen()">Practice — instant feedback</button></div>
  ${S.mode=='exam'?`<b>Time</b><div class="seg" role="group" aria-label="Time limit">${[180,150,120,90].map(m=>`<button class="${S.mins==m?'on':''}" onclick="S.mins=${m};startScreen()">${m==180?'3 h':m+' min'}</button>`).join('')}</div>`:''}
  <button class="primary" onclick="begin()">Start paper</button>
  <p class="note">${S.mode=='exam'?'You can change answers and flag questions until you submit. The paper submits itself when time runs out.':'Each answer is marked when you tap it and locks. Untimed.'} Progress is kept while this page stays open.</p>`;
  scrollTo(0,0)}
function begin(){S.ans={};S.flag={};S.pos=0;S.phase='run';S.start=Date.now();
  if(S.mode=='exam'){S.end=S.start+S.mins*60000;S.tick=setInterval(()=>{const r=S.end-Date.now();const t=$('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}
  show()}
function answered(){return Object.keys(S.ans).length}
function show(){
  const q=Q[S.pos],a=S.ans[S.pos],prac=S.mode=='practice';
  let h=`<div class="top"><div class="topi">${S.mode=='exam'?`<span class="timer" id="tm">${fmt(S.end-Date.now())}</span>`:`<span class="timer">${Object.entries(S.ans).filter(([i,v])=>v==Q[i].k).length}/${answered()}</span>`}<span class="t">${answered()} of ${Q.length} answered</span><button class="flagbtn ${S.flag[S.pos]?'on':''}" onclick="flag()" aria-pressed="${!!S.flag[S.pos]}">${S.flag[S.pos]?'Flagged':'Flag'}</button></div><div class="bar"><i style="width:${(S.pos+1)}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${Q.length}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${S.pos+1}" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,i)=>{const l=L[i];let c='';if(prac&&a){if(l==q.k)c='ok';else if(l==a)c='bad'}else if(a==l)c='sel';
    h+=`<button class="opt ${c}" ${prac&&a?'disabled':''} onclick="pick('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(prac&&a)h+=expl(q,a);
  $('#app').innerHTML=h;
  const last=S.pos==Q.length-1;
  nav(`<button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Questions</button>${last?`<button class="primary" onclick="confirmSubmit()">Submit</button>`:`<button class="primary" onclick="go(1)">Next</button>`}`);
}
function expl(q,a){const ok=a==q.k;
  return `<div class="exp"><h3 class="${a?(ok?'ok':'bad'):'na'}">${a?(ok?'Correct':'Incorrect'):'Not answered'} — answer ${q.k}</h3>${q.x?`<p>${esc(q.x)}</p>`:`<p class="note">The source gives the key only for this question.</p>`}${q.xi?q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join(''):''}<div class="src">${esc(q.d)} · ${esc(q.src)}</div></div>`}
function pick(l){if(S.mode=='practice'&&S.ans[S.pos])return;if(S.mode=='exam'&&S.ans[S.pos]==l)delete S.ans[S.pos];else S.ans[S.pos]=l;const y=scrollY;show();scrollTo(0,y)}
function flag(){S.flag[S.pos]?delete S.flag[S.pos]:S.flag[S.pos]=1;const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(Q.length-1,S.pos+d));show();scrollTo(0,0)}
function grid(){const d=$('#dlg');const nf=Object.keys(S.flag).length,na=Q.length-answered();
  d.innerHTML=`<b>Questions</b><div class="legend" style="margin-top:6px"><span class="a">Answered (${answered()})</span><span class="f">Flagged (${nf})</span><span>Unanswered (${na})</span></div>
  <div class="grid">${Q.map((_,i)=>`<button class="${S.ans[i]?'ans':''} ${S.flag[i]?'flg':''} ${i==S.pos?'cur':''}" onclick="S.pos=${i};$('#dlg').close();show();scrollTo(0,0)" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div>
  <div class="row"><button class="ghost" onclick="$('#dlg').close()">Close</button><button class="primary" onclick="$('#dlg').close();confirmSubmit()">Submit paper</button></div>`;d.showModal()}
function confirmSubmit(){const d=$('#dlg');const na=Q.length-answered(),nf=Object.keys(S.flag).length;
  d.innerHTML=`<b>Submit this paper?</b><p class="note">${na?`${na} question${na>1?'s are':' is'} unanswered. `:'All questions answered. '}${nf?`${nf} flagged.`:''} You can't change answers after submitting.</p><div class="row"><button class="ghost" onclick="$('#dlg').close()">Keep going</button><button class="primary" onclick="$('#dlg').close();submit()">Submit</button></div>`;d.showModal()}
function submit(auto){clearInterval(S.tick);S.used=Date.now()-S.start;S.phase='done';S.auto=!!auto;if($('#dlg').open)$('#dlg').close();results()}
function results(){nav();
  let r=0;const by={};Q.forEach((q,i)=>{const b=by[q.d]=by[q.d]||{n:0,r:0};b.n++;if(S.ans[i]==q.k){r++;b.r++}});
  const wrong=Q.map((q,i)=>i).filter(i=>S.ans[i]&&S.ans[i]!=Q[i].k),skip=Q.map((q,i)=>i).filter(i=>!S.ans[i]),fl=Object.keys(S.flag).map(Number).sort((a,b)=>a-b);
  $('#app').innerHTML=`<div class="kicker">${esc(P.title)}</div><h1>Results</h1>${S.auto?'<p class="note">Time ran out — the paper was submitted automatically.</p>':''}
  <div class="big">${r}<span style="font-size:1.4rem;color:var(--muted)">/100</span></div><p class="sub">${wrong.length} incorrect · ${skip.length} unanswered · time used ${fmt(S.used)}</p>
  <div class="card"><table>${DOMS.filter(d=>by[d]).map(d=>{const b=by[d],p=Math.round(b.r/b.n*100);return `<tr><td>${d}<div class="meter"><i style="width:${p}%"></i></div></td><td>${b.r}/${b.n} · ${p}%</td></tr>`}).join('')}</table></div>
  <div class="row"><button class="primary" ${wrong.length+skip.length?'':'disabled'} onclick="review('Incorrect and unanswered',${JSON.stringify(wrong.concat(skip).sort((a,b)=>a-b))})">Review incorrect (${wrong.length+skip.length})</button></div>
  <div class="row"><button class="ghost" ${fl.length?'':'disabled'} onclick="review('Flagged',${JSON.stringify(fl)})">Flagged (${fl.length})</button><button class="ghost" onclick="review('All questions',${JSON.stringify(Q.map((_,i)=>i))})">All 100</button></div>
  <div class="row"><button class="ghost" onclick="startScreen()">Retake paper</button></div>`;scrollTo(0,0)}
function review(t,list){S.list=list;S.rpos=0;S.rtitle=t;rshow()}
function rshow(){const i=S.list[S.rpos],q=Q[i],a=S.ans[i];
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="results()">Results</button><span class="t">${S.rtitle} · ${S.rpos+1}/${S.list.length}</span>${S.flag[i]?'<span class="flagbtn on">Flagged</span>':''}</div></div>
  <div class="qn">Question ${i+1}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,j)=>{const l=L[j];const c=l==q.k?'ok':(l==a?'bad':'');h+=`<button class="opt ${c}" disabled><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  h+=expl(q,a);$('#app').innerHTML=h;
  nav(`<button class="ghost" ${S.rpos?'':'disabled'} onclick="S.rpos--;rshow();scrollTo(0,0)">Previous</button><button class="primary" ${S.rpos<S.list.length-1?'':'disabled'} onclick="S.rpos++;rshow();scrollTo(0,0)">Next</button>`)}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
window.addEventListener('beforeunload',e=>{if(S.phase=='run'){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(S.phase!='run'||$('#dlg').open)return;if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else{const i=L.indexOf(e.key.toUpperCase());if(e.key.length==1&&i>=0&&i<Q[S.pos].o.length)pick(L[i])}});
startScreen();

function pickPaper(i){PI=i;P=PAPERS[i];Q=P.q;S.ans={};S.flag={};S.pos=0;startScreen()}</script></body></html>
