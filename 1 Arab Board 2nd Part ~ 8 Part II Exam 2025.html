tal haematoma are uncommon (<1%) (Cummings; Stankiewicz).","src":"2025 exam recall · Q126","d":"Rhinology"},{"s":"A 50 year old woman underwent total thyroidectomy and radical neck dissection for papillary thyroid carcinoma what is the TSH level required before starting radioactive iodine ablation","o":["30 mU/L","20 mU/L","10 mU/L","40 mU/L"],"k":"A","x":"RAI ablation requires TSH >30 mU/L, achieved by thyroid hormone withdrawal or recombinant TSH (ATA 2015).","src":"2025 exam recall · Q127","d":"Head & Neck"},{"s":"A patient with suspected superior semi circular canal dehesince disease undergoes audiometry which is more characteristic","o":["Flat sensorineural loss across all frequencies","Pseudoconductive hearing loss","True conductive hearing loss","Normal hearing threshold in all frequencies"],"k":"B","x":"Superior canal dehiscence causes a low-frequency \"pseudoconductive\" air–bone gap with supranormal bone conduction and preserved acoustic reflexes, unlike true middle ear conductive loss (Minor; Cummings).","src":"2025 exam recall · Q128","d":"Otology"},{"s":"A 30-year old man had trauma to his right ear presented to the clinic with hearing impairment which one of the following is the most common ossicular abnormality","o":["Malleus dislocation","Fracture of incus tong process","Incudustapedial joint disarticulation","Fracture of stapes supra structure"],"k":"C","x":"Incudostapedial joint separation and incus dislocation are the commonest traumatic ossicular injuries; the incus is the least supported ossicle (Scott-Brown).","src":"2025 exam recall · Q129","d":"Otology"},{"s":"A 50 year old man with T2N1 glottic SCC Failed Chemoradiation. He has persistent disease at 6 months post treatment which one of the following is the most appropriate management","o":["Total laryngectomy","Repeat chemoradiation","Immunotherapy","Radiation boost"],"k":"A","x":"Persistent or recurrent laryngeal cancer after chemoradiation is treated with salvage total laryngectomy (± neck dissection, with a vascularized flap). Re-irradiation and immunotherapy are for unresectable disease (NCCN).","src":"2025 exam recall · Q130","d":"Laryngology"},{"s":"A 3- year old boy suddenly develop coughing and wheezing while playing with small toys. There in unilateral decrease breathing sounds on the right What to the most appropriate next step?","o":["Oral corticosteroids","Chest X-ray","Rigid bronchoscopy","Flexible bronchoscopy"],"k":"C","x":"Sudden choking with unilateral decreased breath sounds in a toddler means a suspected bronchial foreign body; rigid bronchoscopy under general anaesthesia is diagnostic and therapeutic. A normal chest X-ray does not exclude a foreign body (Scott-Brown).","src":"2025 exam recall · Q131","d":"Paediatric"},{"s":"A-40 years ole professional singer develops a hemorrhagic polys on the edge of the rights vocal fold she has tried 6 weeks voice therapy without improvement. What is the key surgical principle in phonosurgery for this lesion","o":["Subepithelial infiltration and en bloc excision","Complete excision of the polyp with superficial lamina propria (SLP)","Removal of lesion while preserving the vocal ligament and SLP","Laser excision with cauterization of feeding vessel"],"k":"C","x":"Phonosurgical principle: remove the lesion with microflap or excision, preserving the superficial lamina propria (Reinke space) and vocal ligament to keep the mucosal wave; ablate the feeding vessel if present (Cummings, Phonosurgery).","src":"2025 exam recall · Q132","d":"Laryngology"},{"s":"A biopsy from nasal mass in middle aged woman showed non casiting granuloma negative AFR and fungal stain,and no vasculitis serum ACE elevated. What is the most likely diagnosis","o":["Sarcoidosis","Granulomatosis with polyangitis","Leprosy","Tuberculosis"],"k":"A","x":"Non-caseating granulomas with negative AFB and fungal stains, no vasculitis, and raised serum ACE indicate sarcoidosis (Cummings).","src":"2025 exam recall · Q133","d":"Rhinology"},{"s":"Which one of the following intraoperative approaches gives the best access to sinus tympani","o":["Posterior Tympanotomy","Facial recess","Retrofacial","Wide saucerization of mastoid"],"k":"C","x":"The sinus tympani lies medial to the facial nerve; it is reached via a retrofacial approach (or with angled endoscopes). The facial recess (posterior tympanotomy) gives access lateral to the nerve (Brackmann; Scott-Brown).","src":"2025 exam recall · Q134","d":"Otology"},{"s":"Which one of the following is the most common complication of partial laryngectomy","o":["Cough","Aspiration","pharyngocutaneous fistula","Subglottic stenosis"],"k":"B","x":"Aspiration is the commonest functional complication after partial (especially supraglottic and supracricoid) laryngectomy, and patient selection relies on pulmonary reserve (Cummings).","src":"2025 exam recall · Q135","d":"Laryngology"},{"s":"26 year old woman presented with sudden vertigo and nausea no hearing loss she had a recent upper respiratory tract infection ,what is the most likely diagnosis","o":["BPPV","Labyrinthitis","Vistibular neuritis","Ménière disease"],"k":"C","x":"Sudden prolonged vertigo with nausea, no hearing loss, after a viral URTI is vestibular neuritis. Labyrinthitis also involves hearing; BPPV gives brief positional episodes (Cummings). Option D was blank in the recall; a distractor was added.","src":"2025 exam recall · Q136","d":"Otology"},{"s":"A 25 years old woman diagnosed with Otosclerosis ,ear examination revealed flamingo blush, which medication can be used to slow progression","o":["Corticosteroid","Sodium fluoride","Calcium gluconate","Betahistine"],"k":"B","x":"Sodium fluoride (with calcium/vitamin D) has been used to slow progression of active (cochlear) otosclerosis, indicated by a Schwartze sign; bisphosphonates are an alternative (Scott-Brown, Otosclerosis). Option D was blank in the recall; a distractor was added.","src":"2025 exam recall · Q137","d":"Otology"},{"s":"During microlaryngoscopy surgery which one of the following technique most important to decrease rate of anterior glottic web formation","o":["Avoiding bilateral opposing raw surfaces","Use of CO2 laser with low wattage","Topical mitomycin c application","Postoperative voice rest alone"],"k":"A","x":"The main principle to avoid anterior glottic web is to avoid creating opposing raw mucosal surfaces at the anterior commissure; operate one side at a time when both sides are involved (Cummings). Option D was blank in the recall; a distractor was added.","src":"2025 exam recall · Q138","d":"Laryngology"},{"s":"During FESS persistent bleeding encountered from the posterior superior nasal cavity . Ligating of which one of the following arteries should done if the level of bleeding superior to sphenoid ostium ?","o":["Posterior ethmoidal Artery","Sphenopalatine Artery","Post septal artery","Anterior ethmoidal artery"],"k":"A","x":"Bleeding from the posterosuperior nasal cavity above the level of the sphenoid ostium is from the posterior ethmoidal artery at the skull base; the sphenopalatine artery and its posterior septal branch bleed at or below the ostium level (Cummings). Option D was blank in the recall; a distractor was added.","src":"2025 exam recall · Q139","d":"Rhinology"},{"s":"A 30 years old man with gardener’s syndrome presented with rec frontal sinusitis ,which one of the following lesions is associated with this syndrome","o":["Fibrous dysplasia","Osteoma","Ossifying fibroma","Inverted papilloma"],"k":"B","x":"Gardner syndrome (APC; familial adenomatous polyposis) features multiple osteomas (frontal sinus, mandible), epidermoid cysts, desmoids and colonic polyps (Cummings). Option D was blank in the recall; a distractor was added.","src":"2025 exam recall · Q140","d":"Rhinology"},{"s":"which of the following structure is the first site for binaural processing in the central auditory pathway","o":["Medial geniculate body","Inferior colliculus","cochlear nucleus","sup olivary"],"k":"D","x":"The superior olivary complex is the first site of binaural convergence, used for sound localization (interaural time and intensity differences) (Scott-Brown, Central Auditory Pathways).","src":"2025 exam recall · Q141","d":"Otology"},{"s":"A 47 years old male presented with RT neck mass biopsy show p16 positive SCC no distant metastasis , PET-CT show 3.5 cm Rt tonsillar mass and 3cm ipsilateral level II LN no extranodal extension According to AJCC 8th edition, what is the clinical stage?","o":["I","III","II","IV"],"k":"A","x":"AJCC 8 p16+ oropharynx: a 3.5-cm tonsil primary is T2; a single ipsilateral node ≤6 cm is cN1, so the stage is I (T1–2 N0–1). Option D was blank in the recall; a distractor was added.","src":"2025 exam recall · Q142","d":"Head & Neck"},{"s":"A 26 year old man with recurrent respiratory papillomatosis had several surgical debridement, which one of the following adjuvant therapy has the strongest evidence for reducing recurrence in adult","o":["Intralesional interferon alpha injection and radiation","Bevacizumab (Avastin) with intralesional injection","Indole 3 Carbinol","Intralesional cidofovir"],"k":"B","x":"For adult RRP, adjuvant bevacizumab (intralesional or systemic) currently has the strongest supporting evidence for reducing recurrence and surgical frequency; cidofovir has weaker evidence, and indole-3-carbinol and interferon are older or limited options (Cummings; recent RRP consensus). Option D was truncated in the recall (\"acido\"); restored as intralesional cidofovir.","src":"2025 exam recall · Q143","d":"Laryngology"},{"s":"A pt undergo type C infratemporal approach for extended type C glomus juglare tumor to cavernous sinus, which one of the following cranial nerve pass through the cavernous sinus","o":["Abducent","Oculomotor","Trochlear nerve","Ophthalmic nerve (V1)"],"k":"A","x":"The abducens nerve runs within the cavernous sinus (lateral to the ICA); CN III, IV, V1 and V2 run in its lateral dural wall (Cummings, Skull Base Anatomy). Options C and D were blank in the recall; distractors added (CN IV and V1 run in the lateral wall, not within the sinus).","src":"2025 exam recall · Q144","d":"Head & Neck"},{"s":"A 60 year old smoker man has T3 glottic carcinoma and single ipsilateral LN 2.5 cm, he want to preserve his voice if possible which is the most appropriate treatment option?","o":["Concurrent chemoradiatiom","Radiation therapy","Total laryngectomy with neck dissection","Transoral laser cordectomy alone"],"k":"A","x":"For T3 glottic cancer with a single ipsilateral node, wanting larynx preservation: concurrent cisplatin chemoradiation (RTOG 91-11), with salvage laryngectomy if it fails (NCCN). Options C and D were blank in the recall; distractors added.","src":"2025 exam recall · Q145","d":"Laryngology"},{"s":"During stapedectomy a persistent stapedial artery maybe encountered and crossing the promontory what is the safest intraoperative management","o":["Abandon surgery and close","Cut and cautery immediately","Attempt to mobilize it laterally","Ligate at both sides and proceed"],"k":"A","x":"A large persistent stapedial artery crossing the footplate/promontory is traditionally an indication to abandon stapedectomy because of bleeding and facial nerve or vascular risk; small vessels can sometimes be worked around, and laser coagulation is described (Cummings; Brackmann).","src":"2025 exam recall · Q146","d":"Otology"},{"s":"A 55 year old man scheduled for excision of inverted papilloma from lateral maxillary wall sinus ,which measurement on CT scan is most predictive of the possibility for prelacrimal recess approach","o":["Height of uncinate process in relation to inferior turbinate","width between pyriform aperture and nasolacrimal duct","Angle of the maxillary infundibulum","Thickness of the lamina papryacea"],"k":"B","x":"The prelacrimal recess approach depends on the anteroposterior distance between the anterior maxillary wall/pyriform aperture and the nasolacrimal duct (at least about 3 mm on CT is needed) (Zhou; Simmen classification).","src":"2025 exam recall · Q147","d":"Rhinology"},{"s":"What is the primmary biomechanical effect of reink’s edema on VC function","o":["increased stiffness with improved high frequency phonation","Increased mass with decrease mucosal mass wave amplitude","increased glottic closure strength and higher pitch","Reduced subglottic pressure required for phonation"],"k":"B","x":"Reinke oedema increases the mass of the vibrating cover, lowering fundamental frequency (deep voice) and dampening mucosal wave amplitude (Cummings).","src":"2025 exam recall · Q148","d":"Laryngology"},{"s":"A 37 years old woman presented to clinic complaining of dry eyes and mouth,which one of the following investigation would be most likely to reach diagnosis","o":["c ANCA","RhO antibody testing","Rhumatological factor level","Labial biopsy"],"k":"D","x":"Minor salivary gland (labial) biopsy with focal lymphocytic sialadenitis (focus score ≥1) is the most specific test for Sjögren syndrome; anti-Ro/SSA is the key serology (ACR/EULAR 2016).","src":"2025 exam recall · Q149","d":"Head & Neck"}]}];let PI=0;let P=PAPERS[0];let Q=P.q;const L='ABCDEF';
const DOMS=['Otology','Rhinology','Laryngology','Head & Neck','Paediatric','Others'];
let S={mode:'exam',mins:180,phase:'start',pos:0,ans:{},flag:{},end:0,start:0,tick:null,used:0,list:[],rpos:0,rtitle:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')};
function nav(html){let n=document.querySelector('.nav');if(!html){n&&n.remove();return}if(!n){n=document.createElement('div');n.className='nav';document.body.appendChild(n)}n.innerHTML='<div class="navi">'+html+'</div>'}
function startScreen(){
  S.phase='start';nav();clearInterval(S.tick);
  const cnt={};Q.forEach(q=>cnt[q.d]=(cnt[q.d]||0)+1);
  $('#app').innerHTML=`<div class="kicker">Palestinian Board · Exam recall · answered</div><h1>Part II Exam 2025</h1><b>Paper</b><div class="seg" role="group" aria-label="Paper" style="flex-wrap:wrap">${PAPERS.map((p,i)=>`<button class="${PI==i?'on':''}" onclick="pickPaper(${i})">${i+1}</button>`).join('')}</div><h2 style="margin:14px 0 6px;font-size:1.15rem">${esc(P.title)}</h2>
  <p class="sub">148 recalled single-best-answer questions from the 2025 Part II exam. Each question is answered against our references (Cummings, Scott-Brown, Brackmann, Bailey, Ballenger, KJ Lee, AJCC 8, NCCN), with a short referenced explanation. Changed or uncertain recalled keys are flagged ⚑; incomplete stems and options are repaired, and the repairs are noted.</p>
  <div class="card"><table>${DOMS.filter(d=>cnt[d]).map(d=>`<tr><td>${d}</td><td>${cnt[d]}</td></tr>`).join('')}</table></div>
  <b>Mode</b><div class="seg" role="group" aria-label="Mode"><button class="${S.mode=='exam'?'on':''}" onclick="S.mode='exam';startScreen()">Exam — marked at the end</button><button class="${S.mode=='practice'?'on':''}" onclick="S.mode='practice';startScreen()">Practice — instant feedback</button></div>
  ${S.mode=='exam'?`<b>Time</b><div class="seg" role="group" aria-label="Time limit">${[180,150,120,90].map(m=>`<button class="${S.mins==m?'on':''}" onclick="S.mins=${m};startScreen()">${m==180?'3 h':m+' min'}</button>`).join('')}</div>`:''}
  <button class="primary" onclick="begin()">Start paper</button>
  <p class="note">${S.mode=='exam'?'You can change answers and flag questions until you submit. The paper submits itself when time runs out.':'Each answer is marked when you tap it and locks. Untimed.'} Progress is kept while this page stays open.</p>`;
  scrollTo(0,0)}
function begin(){S.ans={};S.flag={};S.pos=0;S.phase='run';S.start=Date.now();
  if(S.mode=='exam'){S.end=S.start+S.mins*60000;S.tick=setInterval(()=>{const r=S.end-Date.now();const t=$('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}
  show()}
function answered(){return Object.keys(S.ans).length}
function show(){
  const q=Q[S.pos],a=S.ans[S.pos],prac=S.mode=='practice';
  let h=`<div class="top"><div class="topi">${S.mode=='exam'?`<span class="timer" id="tm">${fmt(S.end-Date.now())}</span>`:`<span class="timer">${Object.entries(S.ans).filter(([i,v])=>v==Q[i].k).length}/${answered()}</span>`}<span class="t">${answered()} of ${Q.length} answered</span><button class="flagbtn ${S.flag[S.pos]?'on':''}" onclick="flag()" aria-pressed="${!!S.flag[S.pos]}">${S.flag[S.pos]?'Flagged':'Flag'}</button></div><div class="bar"><i style="width:${(S.pos+1)}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${Q.length}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${S.pos+1}" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,i)=>{const l=L[i];let c='';if(prac&&a){if(l==q.k)c='ok';else if(l==a)c='bad'}else if(a==l)c='sel';
    h+=`<button class="opt ${c}" ${prac&&a?'disabled':''} onclick="pick('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(prac&&a)h+=expl(q,a);
  $('#app').innerHTML=h;
  const last=S.pos==Q.length-1;
  nav(`<button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Questions</button>${last?`<button class="primary" onclick="confirmSubmit()">Submit</button>`:`<button class="primary" onclick="go(1)">Next</button>`}`);
}
function expl(q,a){const ok=a==q.k;
  return `<div class="exp"><h3 class="${a?(ok?'ok':'bad'):'na'}">${a?(ok?'Correct':'Incorrect'):'Not answered'} — answer ${q.k}</h3>${q.x?`<p>${esc(q.x)}</p>`:`<p class="note">The source gives the key only for this question.</p>`}${q.xi?q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join(''):''}<div class="src">${esc(q.d)} · ${esc(q.src)}</div></div>`}
function pick(l){if(S.mode=='practice'&&S.ans[S.pos])return;if(S.mode=='exam'&&S.ans[S.pos]==l)delete S.ans[S.pos];else S.ans[S.pos]=l;const y=scrollY;show();scrollTo(0,y)}
function flag(){S.flag[S.pos]?delete S.flag[S.pos]:S.flag[S.pos]=1;const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(Q.length-1,S.pos+d));show();scrollTo(0,0)}
function grid(){const d=$('#dlg');const nf=Object.keys(S.flag).length,na=Q.length-answered();
  d.innerHTML=`<b>Questions</b><div class="legend" style="margin-top:6px"><span class="a">Answered (${answered()})</span><span class="f">Flagged (${nf})</span><span>Unanswered (${na})</span></div>
  <div class="grid">${Q.map((_,i)=>`<button class="${S.ans[i]?'ans':''} ${S.flag[i]?'flg':''} ${i==S.pos?'cur':''}" onclick="S.pos=${i};$('#dlg').close();show();scrollTo(0,0)" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div>
  <div class="row"><button class="ghost" onclick="$('#dlg').close()">Close</button><button class="primary" onclick="$('#dlg').close();confirmSubmit()">Submit paper</button></div>`;d.showModal()}
function confirmSubmit(){const d=$('#dlg');const na=Q.length-answered(),nf=Object.keys(S.flag).length;
  d.innerHTML=`<b>Submit this paper?</b><p class="note">${na?`${na} question${na>1?'s are':' is'} unanswered. `:'All questions answered. '}${nf?`${nf} flagged.`:''} You can't change answers after submitting.</p><div class="row"><button class="ghost" onclick="$('#dlg').close()">Keep going</button><button class="primary" onclick="$('#dlg').close();submit()">Submit</button></div>`;d.showModal()}
function submit(auto){clearInterval(S.tick);S.used=Date.now()-S.start;S.phase='done';S.auto=!!auto;if($('#dlg').open)$('#dlg').close();results()}
function results(){nav();
  let r=0;const by={};Q.forEach((q,i)=>{const b=by[q.d]=by[q.d]||{n:0,r:0};b.n++;if(S.ans[i]==q.k){r++;b.r++}});
  const wrong=Q.map((q,i)=>i).filter(i=>S.ans[i]&&S.ans[i]!=Q[i].k),skip=Q.map((q,i)=>i).filter(i=>!S.ans[i]),fl=Object.keys(S.flag).map(Number).sort((a,b)=>a-b);
  $('#app').innerHTML=`<div class="kicker">${esc(P.title)}</div><h1>Results</h1>${S.auto?'<p class="note">Time ran out — the paper was submitted automatically.</p>':''}
  <div class="big">${r}<span style="font-size:1.4rem;color:var(--muted)">/100</span></div><p class="sub">${wrong.length} incorrect · ${skip.length} unanswered · time used ${fmt(S.used)}</p>
  <div class="card"><table>${DOMS.filter(d=>by[d]).map(d=>{const b=by[d],p=Math.round(b.r/b.n*100);return `<tr><td>${d}<div class="meter"><i style="width:${p}%"></i></div></td><td>${b.r}/${b.n} · ${p}%</td></tr>`}).join('')}</table></div>
  <div class="row"><button class="primary" ${wrong.length+skip.length?'':'disabled'} onclick="review('Incorrect and unanswered',${JSON.stringify(wrong.concat(skip).sort((a,b)=>a-b))})">Review incorrect (${wrong.length+skip.length})</button></div>
  <div class="row"><button class="ghost" ${fl.length?'':'disabled'} onclick="review('Flagged',${JSON.stringify(fl)})">Flagged (${fl.length})</button><button class="ghost" onclick="review('All questions',${JSON.stringify(Q.map((_,i)=>i))})">All 100</button></div>
  <div class="row"><button class="ghost" onclick="startScreen()">Retake paper</button></div>`;scrollTo(0,0)}
function review(t,list){S.list=list;S.rpos=0;S.rtitle=t;rshow()}
function rshow(){const i=S.list[S.rpos],q=Q[i],a=S.ans[i];
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="results()">Results</button><span class="t">${S.rtitle} · ${S.rpos+1}/${S.list.length}</span>${S.flag[i]?'<span class="flagbtn on">Flagged</span>':''}</div></div>
  <div class="qn">Question ${i+1}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,j)=>{const l=L[j];const c=l==q.k?'ok':(l==a?'bad':'');h+=`<button class="opt ${c}" disabled><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  h+=expl(q,a);$('#app').innerHTML=h;
  nav(`<button class="ghost" ${S.rpos?'':'disabled'} onclick="S.rpos--;rshow();scrollTo(0,0)">Previous</button><button class="primary" ${S.rpos<S.list.length-1?'':'disabled'} onclick="S.rpos++;rshow();scrollTo(0,0)">Next</button>`)}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
window.addEventListener('beforeunload',e=>{if(S.phase=='run'){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(S.phase!='run'||$('#dlg').open)return;if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else{const i=L.indexOf(e.key.toUpperCase());if(e.key.length==1&&i>=0&&i<Q[S.pos].o.length)pick(L[i])}});
startScreen();

function pickPaper(i){PI=i;P=PAPERS[i];Q=P.q;S.ans={};S.flag={};S.pos=0;startScreen()}</script></body></html>
