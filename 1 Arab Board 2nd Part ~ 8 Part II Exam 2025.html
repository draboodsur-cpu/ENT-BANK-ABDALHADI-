<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>ENT Part II Exam 2025 — Answered &amp; Referenced</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--amber:#B06A00;--amber-soft:#FBEFD9;--box:#0B1418;--on-teal:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--amber:#E8A94A;--amber-soft:#3A2C14;--box:#000;--on-teal:#06201F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td:last-child{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px 8px;text-align:center}
.seg button.on{background:var(--teal);color:var(--on-teal);font-weight:600}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note{font-size:.9rem;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.timer{font:700 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.topi .t{flex:1;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.flagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
.flagbtn.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.qn{font-weight:600;font-size:.9rem;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{opacity:1}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}.exp h3.na{color:var(--amber)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;position:relative}
.grid .ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.grid .flg{box-shadow:inset 0 0 0 2px var(--amber)}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-na{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid .cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.legend .a::before{background:var(--teal-soft);border-color:var(--teal)}.legend .f::before{box-shadow:inset 0 0 0 2px var(--amber)}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3.2rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>button{flex:1}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--teal)}
</style></head><body>

<script>
const PAPERS=[{"title":"2025 Exam (Part II recall)","q":[{"s":"A patient presents with breathy dysphonia months after thyroidectomy. Laryngoscopy confirms a unilateral immobile vocal fold in the paramedian position. Which factor most strongly influences the decision to proceed with medialization thyroplasty rather than injection laryngoplasty?","o":["Distance from midline on stroboscopy","Age of the patient","Duration of vocal fold immobility","pt occupation and Vocal demand"],"k":"C","x":"⚑ The recall had two options marked (C and D). Duration and likelihood of recovery is the deciding factor; vocal demand influences the timing of temporary injection, not the choice of permanent thyroplasty.\nDuration and expected recovery decide the procedure: injection laryngoplasty is temporary and used while recovery is still possible (<6–12 months, or early for aspiration); medialization thyroplasty is permanent and chosen once paralysis is established and non-recovering (Cummings; Scott-Brown, Vocal Fold Paralysis). Stem repaired: the recalled version says \"both vocal folds immobile\", which would present with airway compromise rather than breathy dysphonia; the question is about unilateral paralysis.","src":"2025 exam recall · Q1","d":"Laryngology"},{"s":"A 13-year-old girl presents with episodic stridor; laryngoscopy shows paradoxical vocal fold movement. What is the typical pattern on flexible laryngoscopy in this condition?","o":["Suction of the vocal folds during inspiration","Inspiratory adduction of the anterior two-thirds of the vocal folds with a posterior glottic chink","Abduction of vocal folds during both inspiration and expiration","Adduction of arytenoids only during expiration"],"k":"B","x":"Paradoxical vocal fold motion: the folds adduct during inspiration, typically the anterior two-thirds, leaving a posterior diamond-shaped glottic chink (Cummings, Laryngeal Function; Scott-Brown). Stem and option B repaired: paradoxical vocal fold motion is a disorder of adolescents and young adults (not a 3-year-old), and the classic finding is inspiratory adduction of the anterior folds with a posterior glottic chink — not complete posterior closure as the recalled option stated.","src":"2025 exam recall · Q2","d":"Laryngology"},{"s":"Which one of the following flaps considered the best flap for partial glossectomy reconstruction?","o":["Lattismus dorsi","Anterolateral thigh","Radial forearm","Gastric abdominis"],"k":"C","x":"The radial forearm free flap is thin and pliable, with a long pedicle — the workhorse for partial (hemi-) glossectomy defects. ALT or bulkier flaps are preferred for subtotal/total glossectomy (Cummings, Free Tissue Transfer).","src":"2025 exam recall · Q3","d":"Head & Neck"},{"s":"During Follow up a patient with voice prosthesis presents with short phonation time and weak voice Laryngoscopy shows no obstruction. What is the most probably cause?","o":["Prosthesis diameter too small","Gastroesophageal reflux","Insufficient pulmonary support","Candida biofilm"],"k":"C","x":"When the prosthesis and pharyngo-oesophageal segment are patent (no obstruction, no leakage), short phonation time and a weak voice usually reflect inadequate pulmonary drive through the TE puncture (Scott-Brown, Voice Rehabilitation after Laryngectomy).","src":"2025 exam recall · Q4","d":"Otology"},{"s":"A patient presents with a nasal mass. Biopsy shows large foamy histiocytes (Mikulicz cells) and Russell bodies. Which of the following is the most likely diagnosis?","o":["Rhinoscleroma","Tuberculosis","Sarcoidosis","Granulomatosis with polyangitis"],"k":"A","x":"Rhinoscleroma (Klebsiella rhinoscleromatis) shows Mikulicz cells (large foamy histiocytes) and Russell bodies on biopsy; it is endemic in the Middle East and presents with a progressive nasal mass (Scott-Brown; KJ Lee). Stem repaired: the recalled stem was garbled (\"Uingray of Devletproofs\"); the biopsy findings were restored from the keyed diagnosis (rhinoscleroma).","src":"2025 exam recall · Q5","d":"Rhinology"},{"s":"A 44-year-old woman undergoes endoscopic endonasal resection of a tuberculum sellae meningioma. On the first postoperative day she develops monocular blindness. Which is the most likely mechanism?","o":["Posterior communicating artery injury","Superior sagittal sinus thrombosis","Over packing with fat graft in the optic canal","Trochlear nerve injury"],"k":"C","x":"Delayed monocular visual loss after endoscopic tuberculum sellae surgery suggests compression of the optic apparatus, classically by over-packing of the reconstruction (fat/graft) in the sella or optic canal region, or by haematoma; urgent imaging and removal of packing is needed (Cummings, Endoscopic Skull Base Surgery).","src":"2025 exam recall · Q6","d":"Rhinology"},{"s":"A 4 year old boy presented shortness of breathe Examination reveals bilateral nasal polyps Which one of the following is the diagnosis","o":["Meningioencephalocele","Allergy Rhinitis","Cystic fibrosis","Juvenile polyposis syndrome"],"k":"C","x":"Nasal polyps in a child younger than 10–12 years mandate a sweat chloride test to exclude cystic fibrosis (Scott-Brown, Paediatric Rhinology; EPOS).","src":"2025 exam recall · Q7","d":"Rhinology"},{"s":"A 10 year old male presented with a painless neck mass FNAC suggest metastic squamous cell carcinoma panendoscopy and imaging failed to identify the primary site. Which one of the following in the most common primary?","o":["Larynx","Base of tongue","Nasopharynx","Hypopharynx"],"k":"C","x":"⚑ Key corrected — recalled answer: B (base of tongue); updated answer: C (nasopharynx), because the patient is a child.\nIn children, metastatic carcinoma to the neck with an occult primary is most often from the nasopharynx (undifferentiated NPC, EBV-related). In adults, the commonest occult primary is the tonsil or base of tongue (HPV-related) (Cummings, Pediatric Head and Neck Malignancies; Scott-Brown).","src":"2025 exam recall · Q8","d":"Paediatric"},{"s":"During a selective neck dissection for oral cavity carcinoma, the surgeon identifies a lymph node in Level llb. Which Landmark best differentiates Level lla from Level llb","o":["posterior belly of digastric muscle","Spinal accessary nerve","Omohyoid muscle","Hypoglossal nerve"],"k":"B","x":"Level II is divided by the spinal accessory nerve: IIA lies anterior-inferior and IIB posterior-superior to it (AAO-HNS neck level classification).","src":"2025 exam recall · Q9","d":"Head & Neck"},{"s":"A 50 year old man diagnosed with a petrous apex cholesterol granuloma. Which of the following MRI features in characteristic of these lesion?","o":["T1 hypointense, T2 hypointense","T1 hypointense, T2 hyperintense","T1 hyperintense, T2 hyperintense","T1 isointense, T2 hypointense"],"k":"C","x":"Cholesterol granuloma is hyperintense on both T1 and T2 because of methaemoglobin and cholesterol, does not restrict on DWI, and does not suppress with fat saturation (Cummings, Petrous Apex Lesions).","src":"2025 exam recall · Q10","d":"Otology"},{"s":"A 23-year-old patient presented to emergency with acute painful lt auricular swelling during sport injury which of the following is the best management","o":["Aspiration and steroid","Aspiration and antibiotics","Drainage and pressure dressing","Non-steroidal anti-inflammatory"],"k":"C","x":"Auricular haematoma needs evacuation (incision and drainage, or aspiration for small early collections) with a bolster/pressure dressing to prevent re-accumulation and cauliflower ear; prophylactic antibiotics are usually added (Scott-Brown; KJ Lee).","src":"2025 exam recall · Q11","d":"Otology"},{"s":"A 44-year-old woman has a 2-cm thyroid nodule; ultrasound shows TI-RADS 3 (TR3). Which is the most appropriate next step in management?","o":["Radioactive iodine","Fine needle aspiration","Total thyroidectomy","Serial ultrasound"],"k":"D","x":"ACR TI-RADS TR3 (mildly suspicious): FNA only if ≥2.5 cm and follow-up ultrasound if ≥1.5 cm; smaller nodules need no FNA. Of the options, ultrasound surveillance is correct; RAI and thyroidectomy are not indicated (ACR TI-RADS; ATA 2015). Stem repaired: \"2 mm\" corrected to 2 cm; the answer (ultrasound surveillance) is the same either way, since TR3 nodules <2.5 cm do not need FNA.","src":"2025 exam recall · Q12","d":"Head & Neck"},{"s":"A 22-year-old woman complain of HL and tinnitus Otoscopy reveals a normal tympanic membrane with reddish hue over the promontory. What is the most likely diagnosis","o":["Acute otitis media","Otosclerosis","Glomus jugulare","Cholesteatoma"],"k":"B","x":"A reddish hue on the promontory behind a normal tympanic membrane (Schwartze sign) in a young woman with hearing loss and tinnitus indicates active otosclerosis (otospongiosis) (Scott-Brown, Otosclerosis).","src":"2025 exam recall · Q13","d":"Otology"},{"s":"A 55 year old presented with firm submandibular gland mass for 10 months. Biopsy showed basaloid SCC with extending along lingual nerve What is the BEST management option","o":["Gland excision with lingual nerve sacrifice and adjuvant chemotherapy","Chemoradiotherapy followed by gland excision","Gland excision with lingual nerve sacrifice, neck dissection and radiotherapy","Gland excision with postoperative radiotherapy"],"k":"C","x":"A high-grade submandibular malignancy with perineural spread along the lingual nerve needs en bloc gland excision with the involved nerve (traced to a negative margin), neck dissection, and postoperative radiotherapy for the adverse features (NCCN Salivary; Cummings).","src":"2025 exam recall · Q14","d":"Head & Neck"},{"s":"What is the main determinant factor for postoperative voice quality after Type 1 thyroplasty for unilateral vocal fold paralysis?","o":["Degree of supraglottic hyperfuncion","Preoperative glottic gap size","Material used for medialization implant","Position of the arytenoid cartilage"],"k":"B","x":"⚑ Marked uncertain in the recall. Glottic gap size (especially a posterior gap from arytenoid malposition) is the main determinant; a large posterior gap needs arytenoid adduction in addition.\nThe size and configuration of the preoperative glottic gap largely determine the result of type I thyroplasty: a large posterior gap (arytenoid malposition) is not corrected by medialization alone and needs arytenoid adduction (Cummings, Medialization).","src":"2025 exam recall · Q15","d":"Laryngology"},{"s":"A 53 year old man with profound SNHL undergoes cochlear implant. During the post-operative testing period , there is spasm of the ipsilateral face. What is the best appropriate management","o":["Adjusting the implant programming parameters","Reposition the electrode","Turn off the implant and implant the other side","Botox to the ipsilateral face"],"k":"A","x":"Facial nerve stimulation after cochlear implantation is managed first by reprogramming: deactivating the offending electrodes or changing stimulation mode/pulse width. Revision surgery is rarely needed (Cummings, Cochlear Implantation).","src":"2025 exam recall · Q16","d":"Otology"},{"s":"A 4-years-old boy congenitally deaf who had undergone cochlear implant two years ago , presented with depigmented patches of the skin and heterochromia iridas. What is the most likely syndrome","o":["Chiher","Pendred","Waardenburg","NF type 2"],"k":"C","x":"Waardenburg syndrome (PAX3/MITF): congenital SNHL with pigmentary anomalies — heterochromia iridis, white forelock, depigmented skin patches, dystopia canthorum in type 1 (Scott-Brown, Genetic Hearing Loss).","src":"2025 exam recall · Q17","d":"Otology"},{"s":"A 50 year old man presents with a slow growing, firm parotid mass of five months duration FNAC reviled High Grade mucoepidermoid carcinoma Facial nerve is intact. What is the best management?","o":["Superficial parotidectomy","Conservation total parotidectomy","Chemoradiation","Radiation therapy"],"k":"B","x":"High-grade mucoepidermoid carcinoma: total (conservative) parotidectomy preserving a functioning facial nerve, plus neck dissection and postoperative radiotherapy. Superficial parotidectomy is reserved for low-grade superficial lobe tumours (NCCN Salivary; Cummings).","src":"2025 exam recall · Q18","d":"Head & Neck"},{"s":"4 years old girl presented with mild to moderate SNHL , preauricular pits Branchial cleft cyst ,cleft palate family hx postive for similar features What is the most likely diagnosis?","o":["Branchio-Oto-Renal syndrome","Teacher Collins syndrome","CHARGE syndrome","Alport syndrome"],"k":"A","x":"Branchio-oto-renal syndrome (EYA1, autosomal dominant): preauricular pits, branchial cleft cysts/fistulae, mixed or SNHL, and renal anomalies, with an affected parent (Scott-Brown).","src":"2025 exam recall · Q19","d":"Otology"},{"s":"A 45 year old men presents with unilateral nasal obstruction and hyposmia. Endoscopy reveals a friable mass in the middle meats Biopsy shows olfactory neuroesthlioma. According to Kadish staging, extension into the orbit and anterior cranial Fossa indicates which one of the following stages?","o":["A","B","C","D"],"k":"C","x":"Kadish staging of olfactory neuroblastoma: A = nasal cavity; B = nasal cavity and paranasal sinuses; C = beyond the sinuses (orbit, skull base, intracranial); D (Morita) = nodal or distant metastasis (Cummings).","src":"2025 exam recall · Q20","d":"Rhinology"},{"s":"During endoscopic sinus surgery you encountered onodi cell, What is the critical anatomical structure at risk ?","o":["Vidian nerve","Posterior ethmoidal artery","Optic Nerve","Anterior ethmoidal artery"],"k":"C","x":"An Onodi (sphenoethmoidal) cell pneumatizes lateral and superior to the sphenoid sinus, so the optic nerve (and sometimes the ICA) runs in its wall and is at risk (Stammberger; Cummings).","src":"2025 exam recall · Q21","d":"Rhinology"},{"s":"A 5 year old girl presents with congenital profound SNHL family report multiple syncopal episodes. ECG shows prolonged QT What is the most appropriate next step?","o":["Cardiology referral for -blocker therapy","Immediate cochlear implantation","MRI of the internal auditory canals","Genetic testing for SLC26A4"],"k":"A","x":"Congenital profound SNHL with syncope and a prolonged QT is Jervell and Lange-Nielsen syndrome (KCNQ1/KCNE1). Sudden cardiac death is the immediate risk, so urgent cardiology referral for β-blockade takes priority over implantation (Scott-Brown).","src":"2025 exam recall · Q22","d":"Otology"},{"s":"A 62 -old man on anticoagulants develops recurrent posterior epistaxis. After failed packing and cautery, he underwent sphenopalatine artery ligation but the bleeding persists. What is the next best management","o":["Internal maxillary artery embolization","Repeat ligation of sphenopalatine artery","IV tranxamic acid","Revision posterior packing"],"k":"A","x":"Persistent posterior epistaxis after endoscopic SPA ligation is managed by angiography with selective internal maxillary artery embolization, or by ligation of the anterior ethmoidal artery if bleeding is from that territory (Cummings, Epistaxis).","src":"2025 exam recall · Q23","d":"Rhinology"},{"s":"Which one of the following tumors most commonly metastasizes to level 1 lymph nodes","o":["Hypopharyngeal carcinoma","Tongue carcinoma","laryngeal","paranasal sinus tumors"],"k":"B","x":"Oral cavity cancers (tongue, floor of mouth, lip) drain first to levels I–III. Larynx and hypopharynx drain to II–IV, and paranasal sinuses to retropharyngeal and level II nodes (Shah; Cummings).","src":"2025 exam recall · Q24","d":"Head & Neck"},{"s":"First-bite syndrome is a complication seen after which one of the following surgeries?","o":["Parotid gland","Submandibular gland","Thyroid gland","Larynx"],"k":"A","x":"First bite syndrome — pain in the parotid region with the first bite of each meal — follows surgery that disrupts the cervical sympathetic supply to the parotid: parapharyngeal space, deep lobe parotid and infratemporal fossa surgery (Cummings).","src":"2025 exam recall · Q25","d":"Head & Neck"},{"s":"Which of the following best explain type 3 modified radical neck dissection","o":["Removal of levels I-IV","Removal of all 5 levels with preservation of CN XI, SCM & IJV","Removal of all 5 levels with SCM, IJV, CN XI and CN X","Selective removal of levels 1-lll"],"k":"B","x":"Modified radical neck dissection removes levels I–V. Type I preserves CN XI; type II preserves XI and IJV; type III (functional neck dissection) preserves XI, IJV and SCM (Medina classification; Shah).","src":"2025 exam recall · Q26","d":"Head & Neck"},{"s":"A 34 year old man with pancytopenia following chemotherapy for leukemia, presented with ipsilateral facial swelling a proptosis ophthalmoplegia, headache and vomiting. Which one of the following imaging is best to diagnose","o":["CT-Scan","Cone-Beam","MRI","PET-CT"],"k":"C","x":"In acute invasive fungal sinusitis with orbital and intracranial symptoms, contrast MRI best shows soft-tissue, orbital apex, cavernous sinus and intracranial extension (including the \"black turbinate\" sign). CT shows bone destruction but underestimates early invasion (Cummings).","src":"2025 exam recall · Q27","d":"Rhinology"},{"s":"A 30 year old woman with rec nasal polyposis planned to receive biologic therapy ,how biologic leads to olfaction improvement","o":["Reduce local eosinophilic inflammation","Stimulate olfactory nerve regeneration","Enlarge the nasal cavity","Thin nasal secretions"],"k":"A","x":"Biologics (dupilumab, mepolizumab, omalizumab) improve smell in CRSwNP by suppressing type 2 eosinophilic inflammation, reducing polyp burden and inflammation of the olfactory cleft mucosa (EPOS 2020). Only three options in the recall; a fourth distractor was added.","src":"2025 exam recall · Q28","d":"Rhinology"},{"s":"which of the following consider an indication for radiotherapy for resected head and neck scc","o":["Negative margine, 2cm DOI","Perineural invasion","T1N0, no other risk factors","Node-negative disease"],"k":"B","x":"Adjuvant radiotherapy after resection of head and neck SCC is indicated for pT3–4, N2–3 (or N1 with risk factors), close margins, perineural invasion, lymphovascular invasion, or level IV–V nodes from oral cavity/oropharynx; chemoradiation is added for positive margins or ENE (NCCN).","src":"2025 exam recall · Q29","d":"Head & Neck"},{"s":"A 55-year-old man is diagnosed with Merkel cell carcinoma. Which one of the following viruses is commonly associated with this condition?","o":["Polyomavirus","Human papiloma 16","Epstein-Barr","Cytomegalovirus"],"k":"A","x":"About 80% of Merkel cell carcinomas contain clonally integrated Merkel cell polyomavirus; the rest are UV-induced (NCCN Merkel Cell).","src":"2025 exam recall · Q30","d":"Head & Neck"},{"s":"A 50 year old man diagnosed with stage IV oral SCC of the lower alveolus and scheduled for reconstructive surgery Which one of the following is the best flaps to be used","o":["Latissimus dorsi","Anterolateral thigh","Ostrocutaenous fibula","Rectus abdomins"],"k":"C","x":"Segmental mandibular defects from advanced lower alveolar cancer are best reconstructed with an osteocutaneous fibula free flap: long bicortical bone that accepts osteotomies and implants, with a reliable skin paddle (Cummings, Mandibular Reconstruction).","src":"2025 exam recall · Q31","d":"Head & Neck"},{"s":"A 30 year old man with cholesteatoma underwent canal wall down mastoidectomy , intraoperatively the horizntal Scc was eroded but mucosa intact what is the best management step","o":["Obliterate canal with bone dust and fat","Open canal and pack with fascia","Leave intact mucosa undisturbed","Convert to subtotal petrosectomy"],"k":"C","x":"If the lateral canal is eroded with intact endosteum (no open labyrinth), the area should be left undisturbed: do not suction or drill over it, and in CWD surgery leave the matrix or cover it with fascia. Opening the canal risks SNHL (Brackmann, Otologic Surgery; Scott-Brown).","src":"2025 exam recall · Q32","d":"Otology"},{"s":"A biopsy of suspicious lesion on vocal fold came as carcinoma of situ . What is the most appropriate next step in management","o":["Endoscopic excision with margin evaluation","Radiation therapy to the larynx","Close observation with repeat laryngoscopy in 6 weeks","Hemilaryngectomy"],"k":"A","x":"Glottic carcinoma in situ is treated by endoscopic excision (cold steel or CO₂ laser) with margin assessment, which is both diagnostic and therapeutic. Radiotherapy is reserved for recurrent or diffuse disease (Cummings; NCCN).","src":"2025 exam recall · Q33","d":"Laryngology"},{"s":"A 7 year old boy with acute mastoiditis he develops persistent fever and recent onset lateral gaze palsy what is the next most appropriate step in management","o":["Start anticoagulation","Cortical mastoidectomy","IV antibiotics and observation","Tympanostomy tube"],"k":"B","x":"Lateral gaze (CN VI) palsy with acute mastoiditis indicates petrous apicitis (Gradenigo). Management is IV antibiotics plus surgery — cortical mastoidectomy with exenteration of air cells, and a petrous apex approach if needed — after imaging (Cummings; Scott-Brown).","src":"2025 exam recall · Q34","d":"Otology"},{"s":"which of the following reduces the risk of pharyngocutenous fistula post total laryngectomy","o":["Reinforcement with vascularized flap in salvage cases","Using a salivary bypass tube routinely","Avoiding modified radical neck dissection","Routine tracheoesophageal puncture (TEP) during surgery"],"k":"A","x":"Reinforcing the pharyngeal closure with vascularized tissue (pectoralis major onlay or a free flap) significantly reduces pharyngocutaneous fistula in salvage laryngectomy after (chemo)radiation (Cummings; meta-analyses of salvage laryngectomy).","src":"2025 exam recall · Q35","d":"Head & Neck"},{"s":"which of the following is the most appropriate indication for total laryngectomy ?","o":["T4a glottic ca","T3 supraglottic cancer","T2 glottic carcinoma","T3 glottic cancer"],"k":"A","x":"T4a laryngeal cancer with cartilage destruction or extralaryngeal spread is the classic indication for primary total laryngectomy with adjuvant (chemo)radiation; organ preservation gives poorer survival in T4a (NCCN; VA/RTOG 91-11 data).","src":"2025 exam recall · Q36","d":"Laryngology"},{"s":"pt with menires disease presented with tumakrin crisis What is the most appropriate intervention","o":["Endolymphatic sac surgery","Diuretics","Intratympanic steroid","Vestibular nerve section"],"k":"D","x":"⚑ Marked uncertain in the recall. Intratympanic gentamicin would also be correct if offered; of the options listed, vestibular nerve section is the definitive treatment.\nTumarkin otolithic crises (drop attacks) in Ménière disease call for ablative treatment of the affected vestibular end-organ. Of the options, vestibular neurectomy is the definitive procedure; intratympanic gentamicin is an equally accepted first ablative choice where offered (Cummings, Ménière Disease).","src":"2025 exam recall · Q37","d":"Otology"},{"s":"A 3 year old girl presented to emergency with sore throat, stridor, dysphagia fever 72 hrs ago,chest examination was normal which one of the following would be your next step in the management","o":["Lateral neck x ray","Esophagoscopy","Oral examination","Fiberoptic laryngoscopy"],"k":"A","x":"Fever, sore throat, dysphagia and stridor in a toddler suggest retropharyngeal abscess. A soft-tissue lateral neck X-ray (prevertebral widening) is the quick first screen, followed by contrast CT. In a child with suspected epiglottitis, the airway is secured first and the child is not examined (Scott-Brown, Paediatric).","src":"2025 exam recall · Q38","d":"Others"},{"s":"A 45 years old women scheduled for glomus juglare tumor surgery which one of the following skull base approaches shall provides the widest exposure for jugular foramen","o":["Extended translabyrinthine","Rotrosigmoid","Infratemporal fossa type A","Middle fossa"],"k":"C","x":"The Fisch infratemporal fossa type A approach, with anterior transposition of the facial nerve, gives the widest exposure of the jugular foramen and infralabyrinthine region for glomus jugulare tumours (Fisch; Cummings).","src":"2025 exam recall · Q39","d":"Head & Neck"},{"s":"Which of the following is the characteristic radiological feature of fibrous dysplasia on CT","o":["Ground-glass","Onion peel","Soap bubble","Sunburst pattern"],"k":"A","x":"Fibrous dysplasia has a ground-glass matrix with expansion and preserved cortex on CT. Onion peel suggests Ewing sarcoma, soap bubble ameloblastoma or aneurysmal bone cyst, and sunburst osteosarcoma (Cummings).","src":"2025 exam recall · Q40","d":"Head & Neck"},{"s":"A 12 year old boy with craniopharyngioma is considered for endoscopic endonasal resection, compared to transcranial approach which of the following is the strongest advantage of the endoscopic approach","o":["Lower rate of CSF","Better visual outcomes","Easier lateral extension management","Lower recurrence without radiotherapy"],"k":"B","x":"For midline craniopharyngiomas (especially retrochiasmatic), endoscopic endonasal resection gives better visual outcomes and higher gross total resection than transcranial approaches, at the cost of a higher CSF leak rate (Komotar meta-analysis; Cummings).","src":"2025 exam recall · Q41","d":"Rhinology"},{"s":"A 35 year old male from rural area presented with chronic friable nasal mass, foul smelling discharge, obstruction, biopsy shows large spongia with internal endosperes, What is the most likely diagnosis","o":["Mucormycosis","Rhinosporidiose","Nasal histoplasmosis","Paracoccodiomycosis"],"k":"B","x":"Rhinosporidiosis (Rhinosporidium seeberi): a friable, polypoid, strawberry-like nasal mass in rural endemic areas; histology shows large sporangia containing endospores. Treatment is wide excision with cauterization of the base (Scott-Brown).","src":"2025 exam recall · Q42","d":"Rhinology"},{"s":"A 33 year old woman complaining of episodes of vertigo lasting hours with severe hearing loss and tinnitus, and aural fullness, Which one to the following is the most effective long term treatment to reduce vertigo attacks in pt refractory to medical treatment","o":["High-dose benzodiazepines","Endolymphatic sac decompression","Long-term betahistine therapy","Intratympanic gentamicin"],"k":"D","x":"Intratympanic gentamicin (chemical labyrinthectomy) gives about 90% vertigo control in medically refractory Ménière disease; endolymphatic sac surgery is less effective, and benzodiazepines/betahistine are not long-term solutions (Cummings; AAO-HNS 2020 guideline).","src":"2025 exam recall · Q43","d":"Otology"},{"s":"A 50 year old man presented with spontaneous CSF otohorrea which one of the following site is the most common site in middle ear otohorrea","o":["Tegmen","Hurtles fissure","Round window","Oval window"],"k":"A","x":"Spontaneous CSF otorrhoea most often arises through tegmen tympani/mastoideum defects (often with encephalocele), especially in obese patients with idiopathic intracranial hypertension (Cummings).","src":"2025 exam recall · Q44","d":"Otology"},{"s":"in epistaxis due to hereditary hemorrhagic telangiectasia osler weber rendu disease which one of the following treatment is considered the most effective","o":["Laser ablation","Nasal cautery","Nasal packing","Systemic steroids"],"k":"A","x":"For HHT epistaxis, laser photocoagulation (KTP/Nd:YAG) is the mainstay of local treatment, with topical or systemic bevacizumab, tranexamic acid, septodermoplasty or Young procedure for severe cases. Cautery and packing worsen the mucosa (Cummings; HHT international guidelines).","src":"2025 exam recall · Q45","d":"Rhinology"},{"s":"19 year old adolescent diagnosed with Von Hippel Lindau syndrome which one of the following temporal bone lesion is commonly seen with this syndrome","o":["Hefner's tumor","Congenital cholesteatoma","Osteogenesis imperfecta","Paget's dieses"],"k":"A","x":"Endolymphatic sac tumour (Heffner tumour), a low-grade papillary adenocarcinoma, is associated with von Hippel-Lindau disease and is often bilateral (Cummings, Tumours of the Temporal Bone).","src":"2025 exam recall · Q46","d":"Otology"},{"s":"During an endaural tympanoplasty for marginal anterior perforation, the surgeon places the graft underlay On follow up graft medicalization is seen which of the following is best intraoperative modification","o":["Cartilage reinforcement of graft","Use of overlay graft technique","Anterior lucking of graft under annulus","Using gel foam for anterior support"],"k":"C","x":"⚑ Recall marked B/C as uncertain; updated answer: C.\nMedialization of an underlay graft for an anterior marginal perforation is prevented by securing the graft anteriorly — tucking it under the annulus or into a tunnel in the anterior canal wall. Overlay grafting risks blunting and lateralization (Brackmann, Otologic Surgery; Scott-Brown).","src":"2025 exam recall · Q47","d":"Otology"},{"s":"A 35 year old man scheduled for total glossectomy anterolateral thigh flap (ALT) reconstruction, What is the main pedicle of the flap?","o":["Superficial circumflex iliac","inferior epigastric","Lateral circumflex femoral","Internal thoracic"],"k":"C","x":"The ALT flap is based on the descending branch of the lateral circumflex femoral artery (septocutaneous or musculocutaneous perforators through vastus lateralis) (Cummings, Free Flaps).","src":"2025 exam recall · Q48","d":"Head & Neck"},{"s":"A 40year old woman presented with one week history of severe dizziness and vomiting. There is no history of hearing impairment .there was no improvement after taking oral anti vertigo treatment. which one of following is the best management option","o":["Oral antiviral therapy","Vestibular rehabilitation","Admission and intravenous therapy","Intratympanic injection of steroids"],"k":"C","x":"One week of severe vertigo with vomiting, no hearing loss and no response to oral medication fits acute vestibular neuritis with failed outpatient treatment. Admission for IV fluids, antiemetics and steroids is appropriate, then early vestibular rehabilitation (Cummings; Scott-Brown).","src":"2025 exam recall · Q49","d":"Otology"},{"s":"Which of the following is a recognized complication of type I medialization thyroplasty using a Silastic implant","o":["Airway stenosis","Perichondritis","Implant extrusion","Vocal fold paralysis"],"k":"C","x":"Silastic medialization implants can extrude or migrate into the airway; other complications are airway obstruction from oedema/haematoma and overmedialization. Perichondritis is rare and vocal fold paralysis is the indication, not a complication (Cummings).","src":"2025 exam recall · Q50","d":"Laryngology"},{"s":"A 50 year old woman presented with CSF leak from lateral recess of right sphenoid sinus which endoscopic approach providing the best access?","o":["Transnasal sphenoidetomy","Transpterygoid","Transethmoidal","Transcranial"],"k":"B","x":"CSF leaks from a well-pneumatized lateral recess of the sphenoid (Sternberg canal) need an endoscopic transpterygoid approach, removing the posterior maxillary wall and entering the pterygopalatine fossa (Cummings, Skull Base).","src":"2025 exam recall · Q51","d":"Rhinology"},{"s":"a 48 years old women undergoes partial glossectomy and neck dissection for a T2N0 on tongue SCC histopathology shows 3.2 cm tumor depth of invasion 6 mm, perineural invasion, 4mm margin ,what is the most appropriate next step","o":["Observation only","Margins revision","Radiation therapy","Chemoradiation"],"k":"C","x":"pT2 N0 oral tongue SCC with perineural invasion and a close margin (<5 mm) meets criteria for postoperative radiotherapy. Concurrent chemotherapy is reserved for positive margins or ENE (NCCN; RTOG 9501/EORTC 22931).","src":"2025 exam recall · Q52","d":"Head & Neck"},{"s":"A 52 year old man presented with renal disease and nasal crusting, nasal examination reveals nasal septal perforation and saddle nose deformity, C ANCA is positive What is the most appropriate treatment","o":["Brad-spectrum antibiotics","Endoscopic debridement and topical steroids","Systemic corticosteroids and rituximab","Septal reconstruction"],"k":"C","x":"Generalized GPA (c-ANCA/PR3 with renal involvement) needs induction with high-dose glucocorticoids plus rituximab (or cyclophosphamide), then maintenance (ACR/EULAR 2021).","src":"2025 exam recall · Q53","d":"Rhinology"},{"s":"A 50 years old male develops progressive hoarseness,aspiration,palate drop 2 weeks after skull base surgery flexible laryngoscope shows intermediate position of ipsilateral vocal fold, absent cough reflex, at which level is the lesion","o":["External branch of superior laryngeal nerve","Recurrent laryngeal nerve in tracheoesophageal groove","Vagus nerve proximal to nodose ganglion","Internal branch of superior laryngeal nerve"],"k":"C","x":"Palatal droop (pharyngeal branch), vocal fold paralysis and loss of supraglottic sensation together indicate a high vagal lesion above the nodose ganglion, at or near the jugular foramen; this typically follows skull base surgery (Cummings).","src":"2025 exam recall · Q54","d":"Head & Neck"},{"s":"A 30years old male with recurrent sinusitis and history of infertility, nasal biopsy shows absent dynin arm on electron microscopy. What is the most likely diagnosis?","o":["Allergic fungal sinusitis","Samter's triad","Kartagener's syndrome","Granulomatosis with polyangitis"],"k":"C","x":"Absent dynein arms on electron microscopy with recurrent sinusitis and male infertility indicate primary ciliary dyskinesia; with situs inversus it is Kartagener syndrome (Scott-Brown).","src":"2025 exam recall · Q55","d":"Rhinology"},{"s":"A 50 year old woman presented with gradual hearing loss in one ear and imbalance audiometry confirmed SNHL What is the best diagnostic test?","o":["MR with gadolinium","Audiogram only","CT temporal bone","Tympanometry"],"k":"A","x":"Asymmetric SNHL with imbalance requires gadolinium-enhanced MRI of the IAC/CPA (or high-resolution T2) to exclude vestibular schwannoma (Cummings; AAO-HNS).","src":"2025 exam recall · Q56","d":"Otology"},{"s":"A 40 years old woman underwent endoscopic frontal sinus surgery. What is the most common complication of this surgery?","o":["Posterior table CSF leak","Orbital hematoma","Anterior ethmoidal artery bleeding","Frontal recess stenosis"],"k":"D","x":"Frontal recess stenosis (scarring, osteitis, middle turbinate lateralization) is the most frequent complication and cause of failure after endoscopic frontal sinus surgery (Cummings; Wormald).","src":"2025 exam recall · Q57","d":"Rhinology"},{"s":"A 45 years old man presented with progressive hearing loss, imbalance , occasion tinnitus ,examination showed decrease corneal reflex on right side , Audiogram reveal SNHL in rt side What is the most likely diagnosis","o":["Meiners disease","Glomus jugulare tumor","Vestibular schwannoma","Meningioma of the CP angle"],"k":"C","x":"Progressive unilateral SNHL, tinnitus and imbalance with a reduced corneal reflex (CN V compression) indicate a large vestibular schwannoma; loss of the corneal reflex is the earliest trigeminal sign (Cummings).","src":"2025 exam recall · Q58","d":"Otology"},{"s":"A 59 years old man underwent an MRI for brain due to concern cpa mass , Which one of the findings is characteristic of a vestibular shwanomma","o":["Isointense on T1, variable intensity with T2, mild to moderate enhancement with contrast","Isointense on T1, slightly hyperintense on T2, strongly enhances with contrast","Hypointense on T1, hyperintense on T2 nonenhancing, no restriction on DWI","Hypointense on T1, Hypointense on T2, nonenhancing, DWI showing restriction"],"k":"B","x":"Vestibular schwannoma: iso/hypointense on T1, hyperintense on T2, strongly enhancing (heterogeneous if cystic), centred on and expanding the IAC without a dural tail (Cummings).","src":"2025 exam recall · Q59","d":"Otology"},{"s":"A 10 years old girl presented with progressive bilateral SNHL ,she also has history of goiter and fluctuating hearing loss CT reveal bilateral enlarged Vestibular aqueduct What is the most likely diagnosis?","o":["BOR syndrome?","Alport syndrome","Pendred syndrome","Usher syndrome"],"k":"C","x":"Pendred syndrome (SLC26A4, pendrin): SNHL with enlarged vestibular aqueducts (± Mondini), euthyroid goitre, and a positive perchlorate discharge test (Scott-Brown).","src":"2025 exam recall · Q60","d":"Otology"},{"s":"Which one of the following is limitation of an endoscopic marasuplization for paranasal sinus mucocele","o":["Lateral position of frontal mucocele","Big sinus mucocele","Sphenoid mucocele","Recurrent ethmoido-frontal mucocele"],"k":"A","x":"Laterally placed frontal mucoceles (beyond the lamina papyracea or far lateral in the frontal sinus) may not be reached endoscopically and can need an external or combined approach (Cummings; Wormald).","src":"2025 exam recall · Q61","d":"Rhinology"},{"s":"A 5-year-old boy presented with a large pulsatile mass in the posterior mesotympanum the IJV and carotid artery are normal, but there is noted to be obliteration of the foramen spinosum on the CT scan, What is the most likely diagnosis?","o":["Persistent stapedial artery","Caroticotympanic artery","Tympanic paraganglioma","Jugular foramen paraganglioma"],"k":"A","x":"A persistent stapedial artery gives a pulsatile mesotympanic mass; on CT the foramen spinosum is absent or small because the middle meningeal artery arises from the stapedial artery, and there may be a widened facial canal (Cummings, Vascular Anomalies of the Middle Ear).","src":"2025 exam recall · Q62","d":"Otology"},{"s":"A 62 years old man presented to emergency with neck cellulitis his CT show’s lemirre yndrome. Which one of the following is the recommended treatment","o":["Antifungal","Anticoagulants","Antibiotics","Surgery"],"k":"C","x":"Lemierre syndrome (Fusobacterium necrophorum septic IJV thrombophlebitis) is treated primarily with prolonged IV antibiotics (β-lactam + metronidazole). Anticoagulation is controversial and selective; surgery is for abscess or persistent septic emboli (Cummings).","src":"2025 exam recall · Q63","d":"Head & Neck"},{"s":"40 years old man scheduled for carotid body tumor resection. Which one of the following best describe the relationship of vagus nerve to the internal carotid artery (CA) within the carotid sheth?","o":["Posterior to CA","Medial to ICA","Anterior to ICA","Lateral to ICA"],"k":"A","x":"In the carotid sheath the vagus lies posterior, between the internal carotid artery (medial) and the internal jugular vein (lateral) (Shah; Gray anatomy).","src":"2025 exam recall · Q64","d":"Head & Neck"},{"s":"A 49 years old woman complaining of lt earache for 3 months the ear is normal but she has a large left tonsil tumor. Which one of the following nerves is responsible for the earache","o":["Vagus","Auriculo-temporal","Glossopharyngeal","Greater auricular"],"k":"C","x":"Tonsillar pain is referred to the ear via the glossopharyngeal nerve (tympanic branch — Jacobson nerve) (Scott-Brown).","src":"2025 exam recall · Q65","d":"Head & Neck"},{"s":"A 10-years-old boy with congenital hearing loss presented with and enlarged thyroid. What is the most likely cause of his hearing loss?","o":["Mutation of type II collagen","Mutation of type IV collagen","Mutation of potassium channels","Mutation of chloride/lodide channels"],"k":"D","x":"Hearing loss with goitre is Pendred syndrome, caused by mutations in SLC26A4 (pendrin), a chloride–iodide anion transporter (Scott-Brown).","src":"2025 exam recall · Q66","d":"Otology"},{"s":"A 40 year old obese man diagnosed with obstructive sleep apnea, which of the following physiologic mechanism best explains the collapse of the upper airway during sleep in obstructive sleep apnea","o":["Decreased pharyngeal dilator muscle tone during REM stoop","Increased alveolar surface tension due to surfactant dysfunction","Central failure of respiratory drive during NREM sleep","Reflex inhibition of the diaphragm by pulmonary stretch receptors"],"k":"A","x":"OSA results from a narrow, collapsible pharynx with loss of pharyngeal dilator (genioglossus) muscle tone during sleep, most marked in REM sleep (Cummings; KJ Lee).","src":"2025 exam recall · Q67","d":"Others"},{"s":"A 23years old male presented with a midline neck swelling that moves with deglutition and tong protrusion which one of the following is the most appropriate next step in the management","o":["Neck ultrasound","Surgery","FNAC","Technetium scan"],"k":"A","x":"A midline neck mass that moves with swallowing and tongue protrusion is a thyroglossal duct cyst. Ultrasound comes first to confirm the cyst and a normal thyroid gland before Sistrunk surgery (Scott-Brown; Cummings).","src":"2025 exam recall · Q68","d":"Paediatric"},{"s":"which voice therapy principle is MOST evidence-based for treating presbyphonia?","o":["Confidential voce therapy","Resonant voice therapy alone","Semi occluded vocal tract exercises","Vocal rest with adequate hydration"],"k":"C","x":"⚑ Recall marked B (uncertain); updated answer: C.\nPresbyphonia (vocal fold atrophy/bowing) has its best evidence for exercise-based therapy: vocal function exercises and phonation resistance training (PhoRTE), built on semi-occluded vocal tract postures. Voice rest is not helpful (Cummings, Aging Voice).","src":"2025 exam recall · Q69","d":"Laryngology"},{"s":"A 44 years old woman diagnosed with idiopathic vocal cord paralysis. What is the chances of her getting full vocal cord mobility recovery","o":["5-20%","50-70%","20-40%","70-90%"],"k":"C","x":"Idiopathic unilateral vocal fold paralysis recovers fully in roughly 20–40% of patients, usually within 6–12 months (Cummings; Scott-Brown).","src":"2025 exam recall · Q70","d":"Laryngology"},{"s":"A newborn failed the screening and rescreening otoacousticemession are absent What is the best next step","o":["Start speech therapy","Refer for cochlear implant","ABR (Auditory Brainstem Response)","CT scan of the temporal bones"],"k":"C","x":"A newborn who fails OAE screening and rescreening needs a diagnostic ABR by about 3 months of age (EHDI 1-3-6 guideline; JCIH 2019).","src":"2025 exam recall · Q71","d":"Otology"},{"s":"In an infant with bilateral vocal cord immobility, which one of the following should be ruled out?","o":["Neurological abnormalities","Arnold Chiari malformation","Rheumatological disorders","Delivery trauma"],"k":"B","x":"Bilateral vocal fold immobility in an infant is most often neurological; Arnold–Chiari malformation with hydrocephalus (brainstem compression) must be excluded by MRI of the brain/brainstem (Cummings, Pediatric Airway).","src":"2025 exam recall · Q72","d":"Paediatric"},{"s":"6 months old girl diagnosed with subglottic hemangioma and started on propranolol Which one of the following is a side effect of propranol","o":["Tachycardia","Bronchospasm","Hyperglacemia","hypertension"],"k":"B","x":"Propranolol for infantile haemangioma can cause bronchospasm, bradycardia, hypotension, hypoglycaemia and sleep disturbance — not tachycardia or hyperglycaemia (Léauté-Labrèze; AAP 2019).","src":"2025 exam recall · Q73","d":"Paediatric"},{"s":"5years old girl with down syndrome complaining of bilateral ear pain on Otoscopy bilat OME which of the following is the best management option","o":["observation for 3 month","Adenoidectomy","Tympanostomy","Steroid"],"k":"C","x":"Children with Down syndrome and persistent OME with hearing loss are offered ventilation tubes (or hearing aids, given narrow canals and high tube complication rates). Adenoidectomy is not routinely added and steroids are ineffective (NICE CG60; AAO-HNS 2016).","src":"2025 exam recall · Q74","d":"Paediatric"},{"s":"during surgical extirpation of carotid body tumor the pt experiment frequent changes of vital signs by anesthetist what afferent nerve of carotid body is mostly being stimulated","o":["Glossopharyngeal","Vagus","Cervical sympathetic","Recurrent laryngeal"],"k":"A","x":"Carotid body chemoreceptor and baroreceptor afferents travel in the carotid sinus nerve (Hering) — a branch of the glossopharyngeal nerve. Manipulation causes haemodynamic swings (bradycardia, hypotension) (Cummings).","src":"2025 exam recall · Q75","d":"Head & Neck"},{"s":"Which of the following can differentiate of vocal cord immobility due to neurogenic cause from posterior glottic stenosis","o":["Presence of skin lesion","Type of delivery","History of prior intubation","Apgar score"],"k":"C","x":"A history of prior (especially prolonged) intubation points to posterior glottic stenosis or cricoarytenoid ankylosis rather than neurogenic paralysis; palpation of the arytenoids at microlaryngoscopy confirms it (Cummings).","src":"2025 exam recall · Q76","d":"Laryngology"},{"s":"which of the following is the hallmark of the inflammatory phase of wound healing ?","o":["Neutrophil and macrophage infiltration","Vasoconstriction and lymphocyte infiltration","proliferation of fibroblasts","Scar remodeling"],"k":"A","x":"The inflammatory phase (days 0–4) is dominated by neutrophils, then macrophages. The proliferative phase brings fibroblasts and angiogenesis; remodelling follows (Cummings, Wound Healing).","src":"2025 exam recall · Q77","d":"Others"},{"s":"A 2 year old boy presented with recurrent ear discharge ear examination showed granulation in deep canal biopsy was taken that showed histiocytic granuloma with Langerhans cell, What is the most likely diagnosis","o":["Granulomatosis with polyangitis","Neurofibromatosis type","Hand-Schaller-Christian disease","Sarcoidosis"],"k":"C","x":"Langerhans cell histiocytosis of the temporal bone (Hand-Schüller-Christian: multifocal chronic form) presents with otorrhoea, aural granulations and lytic lesions; biopsy shows Langerhans cells (CD1a, S100, Birbeck granules) (Scott-Brown).","src":"2025 exam recall · Q78","d":"Paediatric"},{"s":"A 42 years old sudanean man presented with bilateral neck mass with nasal congestion,MRI shows Nasopharyngeal mass with parapharyngeal extension biopsy confirmed undifferentiated non keratinized carcinoma What is the best treatment option","o":["Surgical resection","Chemoradiation","Radiotherapy","Immunotherapy"],"k":"B","x":"Locoregionally advanced nasopharyngeal carcinoma (T2 with bilateral nodes) is treated with concurrent chemoradiation (cisplatin) ± induction chemotherapy; surgery has no primary role (NCCN; Intergroup 0099).","src":"2025 exam recall · Q79","d":"Head & Neck"},{"s":"A pt presented with supraglottic mass seen by laryngoscopy. You need asses cartilage invasion and extralaryngeal spread Which one of the following imaging modality is most appropriate for local staging of laryngeal ca","o":["Ultrasound","Chest X-ray","MRI neck","PET scan"],"k":"C","x":"Of these options, MRI best shows cartilage invasion and pre-epiglottic/paraglottic and extralaryngeal spread. Contrast CT is the usual first-line staging study, with MRI more sensitive for early cartilage invasion (Cummings, Imaging of the Larynx).","src":"2025 exam recall · Q80","d":"Laryngology"},{"s":"A 50 years old man diagnosed with undifferentiated nasopharyngeal carcinoma (UCNT), CT-showed tumor extending anteriorly to the lt maxillary sinus with bone erosion ,nasal cavity and posterior Ethmoid cells ,there is also bilateral cervical lymph nodes metastasis, the largest was 1 cm in greatest dimension without distant metastasis what is the TNM staging of this tumor?","o":["T3N2M0","T3N1M0","T4N1M0","T4N2M0"],"k":"A","x":"AJCC 8 NPC: invasion of paranasal sinuses (maxillary bone erosion), with or without nasal cavity involvement, is T3. Bilateral cervical nodes ≤6 cm above the caudal cricoid are N2, so the stage is T3N2M0 (stage III).","src":"2025 exam recall · Q81","d":"Head & Neck"},{"s":"Which of the following paranasal sinuses is the most commonly affected by mucocele","o":["Ethmoid and Haller cell","Ethmoid and maxillary","Ethmoid and frontal","Ethmoid and sphenoid"],"k":"C","x":"Mucoceles most commonly affect the frontal and ethmoid sinuses (frontoethmoidal, about 60–65% frontal), then maxillary; sphenoid mucoceles are rare (Scott-Brown).","src":"2025 exam recall · Q82","d":"Rhinology"},{"s":"A 40 year old man undergo canal wall up mastoidectomy 1 year ago but now there is recurrent ear discharge and CHL MRI with diffusion weighted imaging shoes non enhancing lesion in the mastoid cavity What is the best next step?","o":["Tympanoplasty","Revision surgery","Start antibiotics and observe","Steroid therapy"],"k":"B","x":"A non-enhancing lesion with restricted diffusion on non-EPI DWI after canal-wall-up surgery is recurrent or residual cholesteatoma and needs revision surgery (second look) (Cummings; Scott-Brown).","src":"2025 exam recall · Q83","d":"Otology"},{"s":"during cochlear implantation electrode array is inserted into the scala tympani through the round window Which one of the following structures separate the scala tympani from the scala media","o":["Basilar Membrane","Ressner's Membrane","Tectorial Membrane","Osseous Spiral Lamina"],"k":"A","x":"The basilar membrane separates the scala media from the scala tympani; Reissner membrane separates the scala vestibuli from the scala media (Scott-Brown, Anatomy of the Cochlea).","src":"2025 exam recall · Q84","d":"Otology"},{"s":"A 4-month-old boy has stridor. Fiberoptic laryngoscopy shows type 1 laryngomalacia. Which one of the following best describes this type of laryngomalacia?","o":["Short aryepiglottic folds with tubular epiglottis","redundant arytenoid mucosae","Retroflexed epiglottis obscuring the airway","Inward collapse of aryepiglottic folds"],"k":"B","x":"⚑ Marked uncertain in the recall; confirmed per the Olney classification (type 1 = arytenoid mucosal prolapse).\nOlney classification of laryngomalacia: type 1 = prolapse of redundant arytenoid/supra-arytenoid mucosa; type 2 = short aryepiglottic folds (with tubular, omega-shaped epiglottis); type 3 = posterior displacement of the epiglottis (Cummings, Pediatric Airway). Age completed (\"month old\"); laryngomalacia presents in early infancy.","src":"2025 exam recall · Q86","d":"Paediatric"},{"s":"An 80 years old man heavy smoker presented with parotid mass which of the following salivary tumor have linked to smoking","o":["Adenoid cystic carcinoma","Papillary cystadenoma Lymphatousum","Carcinoma ex pleomorphic adenoma","Mucoepidermoid carcinoma"],"k":"B","x":"Warthin tumour (papillary cystadenoma lymphomatosum) is strongly associated with smoking: smokers have about an 8-fold risk. It is bilateral in about 10% (Cummings; KJ Lee).","src":"2025 exam recall · Q87","d":"Head & Neck"},{"s":"a 28 years old male with superior SCC dehesince which of the Following is least likely to improve post surgical intervention?","o":["Autophany","Hyperacusis","Tinnitus","Hearing loss"],"k":"D","x":"After superior canal dehiscence plugging or resurfacing, autophony, sound/pressure-induced vertigo and hyperacusis improve in most patients. Hearing (the low-frequency air–bone gap) is the least likely to improve, and SNHL is a recognised risk (Minor; Cummings).","src":"2025 exam recall · Q88","d":"Otology"},{"s":"During cholesteatoma surgery a 2 mm lateral scc fistula was found What is the best intraoperative management","o":["Abort surgery and start steroids","Remove the matrix and seal the fistula","Leave fistula untouched to avoid vertigo","Start steroid and betahistidine"],"k":"B","x":"⚑ Recall marked B/C as uncertain; updated answer: B.\nFor a small (2 mm) lateral canal fistula, most surgeons remove the matrix at the end of the procedure and immediately seal the fistula with fascia/bone pâté under steroid cover. Leaving matrix is reserved for large fistulae, the only hearing ear, or CWD surgery (Brackmann; Cummings).","src":"2025 exam recall · Q89","d":"Otology"},{"s":"A 52 year old man with T2N0 oral tongue SCC planned for surgical resection you with depth of invasion 6mm What is the appropriate management of the clinically N0 neck","o":["Observation only","Sentinel lymph node biopsy","Elective radiation therapy","Levels I–III (supraomohyoid) neck dissection"],"k":"D","x":"Clinically N0 oral tongue SCC with a depth of invasion >4 mm (NCCN: >3–4 mm) has an occult nodal risk >20% and needs elective neck dissection of levels I–III (supraomohyoid). Sentinel node biopsy is an alternative in experienced centres (NCCN; D’Cruz NEJM 2015).","src":"2025 exam recall · Q90","d":"Head & Neck"},{"s":"A pt with a large cavity canal wall down mastoidectomy reports recurrent infection and persistent otohorrea despite proper care What is the best treatment option","o":["Tympanoplasty","Revision canal wall down mastoidectomy and IV antibiotics","Mastoid cavity obliteration with muscle flap or bone pate","Oral steroids"],"k":"C","x":"A large, chronically discharging canal-wall-down cavity despite good care is best treated by revision with mastoid obliteration (muscle flap, bone pâté, hydroxyapatite) and meatoplasty, which reduces cavity size and infection (Brackmann; Scott-Brown).","src":"2025 exam recall · Q91","d":"Otology"},{"s":"A 60 year old smoker presented with hoarseness and hemoptysis laryngoscopy show lesion involving supraglottic with bilateral cervical node metastasis according to the 8th edition of AJJC this belong to which","o":["T2N2c","T1N1","T3N1","T4N0"],"k":"A","x":"Bilateral cervical nodes are N2c (AJCC 8, HPV-negative larynx). T cannot be fully determined from the stem, but T2N2c is the only option with bilateral disease (AJCC 8).","src":"2025 exam recall · Q92","d":"Laryngology"},{"s":"A 60years old man presented with unilateral nasal obstruction and epistaxis a biopsy showed pleomorphic tumor with keratin pearls What is the most likely diagnosis","o":["Adenocarcinoma","Nasopharyngeal angiofibroma","Squamous cell carcinoma","Olfactory neuroblastoma"],"k":"C","x":"A pleomorphic malignant epithelial tumour with keratin pearls is squamous cell carcinoma, the commonest sinonasal malignancy (maxillary sinus most often) (Cummings).","src":"2025 exam recall · Q93","d":"Rhinology"},{"s":"A 58years old ex smoker presented with progressive hoarseness 3 months duration.,nasolaryngoscopy showed lt vocal cord lesion with fixed mobility ,but no visible supraglottis or subglottic extension no neck masses ,biopsy SCC What is the most likely T stage","o":["T1b","T2","T3","T4a"],"k":"C","x":"AJCC 8 glottis: tumour limited to the larynx with vocal cord fixation is T3 (fixation, paraglottic space or inner thyroid cortex involvement) (AJCC 8).","src":"2025 exam recall · Q94","d":"Laryngology"},{"s":"A 10 year old boy sustained blunt head trauma with rt sided facial nerve weakness , Hemotympanum,CHL >40 dB ,CT showed cochlear sparing temporal bone fracture What is the most likely cause of the hearing loss?","o":["perilymphatic fistula","Hemotympanum","Ossicular discontinuity","Cochlear concussion"],"k":"C","x":"Persistent conductive loss >40 dB after a temporal bone fracture (otic capsule-sparing) suggests ossicular discontinuity, most often incudostapedial separation or incus dislocation. Haemotympanum alone usually gives a smaller gap that resolves (Scott-Brown; Cummings).","src":"2025 exam recall · Q95","d":"Otology"},{"s":"A patient has bilateral vc immobility following prolonged intubation ,CT shows no masses ,which of the following would be the best next step if pt presented with dyspnea and normal voice","o":["Medialization thyroplasty","Posterior cordectomy with partial arytenoidectomy","Reinnervation of the recurrent laryngeal nerves","Injection laryngoplasty"],"k":"B","x":"Bilateral vocal fold immobility after intubation with dyspnoea and good voice needs glottic airway enlargement: endoscopic posterior cordotomy/cordectomy and/or partial arytenoidectomy, or tracheostomy if acute. Medialization worsens the airway (Cummings).","src":"2025 exam recall · Q96","d":"Laryngology"},{"s":"A 50 year old scheduled for lt parathyroidectomy, superior parathyroid derived from which embryological structure?","o":["3rd pharyngeal arch","3rd pharyngeal pouch","4th pharyngeal arch","4th pharyngeal pouch"],"k":"D","x":"Superior parathyroids arise from the 4th pharyngeal pouch; inferior parathyroids and thymus arise from the 3rd pouch and descend further, so their position varies more (Cummings; Shah).","src":"2025 exam recall · Q97","d":"Head & Neck"},{"s":"a 35 years old man has facial nerve paralysis (House Brak mann grade VI) two years ago post temporal bone fracture What test would be helpful to determine the best treatment for reanimation","o":["Contracted temporal bone CT scan","Maximum stimulation test","Electroneuronography","Electromyography"],"k":"D","x":"Two years after HB VI paralysis, EMG shows whether the facial muscles are still viable (fibrillation potentials) or have become fibrotic (electrical silence). This decides between nerve transfer/grafting and dynamic muscle transfer (Cummings, Facial Reanimation).","src":"2025 exam recall · Q98","d":"Otology"},{"s":"A pt 6 days post total laryngectomy develops neck swelling ,erythema and saliva in drain What in the most likely diagnosis?","o":["Chyle leak","Wound infection","Hematoma","Pharyngocutenous fistula"],"k":"D","x":"Neck swelling, erythema and saliva in the drain around day 5–10 after total laryngectomy indicate a pharyngocutaneous fistula (Cummings).","src":"2025 exam recall · Q99","d":"Head & Neck"},{"s":"A 45-years old woman presented with 6month history of parotid swelling and pain that had been treated with multiple courses of antibiotics, which organism is the most likely cause","o":["Streptococcus pyogens","Streptococcus","Staphylococcus aureus","Streptococcus anginosus"],"k":"C","x":"Chronic recurrent sialadenitis is most commonly associated with Staphylococcus aureus (often penicillin-resistant), sometimes with streptococci and anaerobes; ductal stenosis or stones should be evaluated (sialendoscopy) (Cummings).","src":"2025 exam recall · Q100","d":"Head & Neck"},{"s":"in Granulomatosis with polyangitis what is the most common initial presentation in head and neck region","o":["Nasal obstruction and anosmia","Epistaxis and nasal crusting","Subglottic stenosis","Septal perforation"],"k":"B","x":"Sinonasal disease is the commonest head and neck presentation of GPA (about 85–90%): crusting, bloody discharge/epistaxis and obstruction, later septal perforation and saddle nose. Subglottic stenosis occurs in about 16–23% (Cummings).","src":"2025 exam recall · Q101","d":"Rhinology"},{"s":"Which of the following is the best indication for requesting PET CT in head and neck cancer?","o":["For surgical planning in oral cavity cancer","To confirm histology of neck nodes","Before biopsy of primary tumor","For staging in advanced disease"],"k":"D","x":"PET-CT is indicated for staging advanced (stage III–IV) head and neck cancer (distant metastases, second primaries), for unknown primary, and for post-chemoradiation response at 12 weeks. It does not give histology or replace the biopsy (NCCN; PET-NECK trial).","src":"2025 exam recall · Q102","d":"Head & Neck"},{"s":"A 1 year-old child with bilateral profound SNHL being evaluated for Cochlear implantation MRI shows cochlear nerve aplasia What is the best et step management?","o":["Consider auditory brainstem implant","Hearing aids and auditory-verbal therapy","Proceed with bilateral cochlear implants","BAHA (bone-anchored hearing aid)"],"k":"A","x":"⚑ Marked uncertain in the recall; confirmed — cochlear nerve aplasia is an indication to consider an ABI.\nCochlear nerve aplasia on MRI is a contraindication to cochlear implantation; an auditory brainstem implant is considered (Cummings; Colletti).","src":"2025 exam recall · Q103","d":"Otology"},{"s":"A 39 years old man presented with chronic hoarseness laryngoscopy reveals a small gray sessile mass on the posterior lt vc biopsy show pseudoepithelimatous hyperplasia which stain positive for PNS and S100 what is the diagnosis","o":["Hemangioma","Amyloidosis","Chondroma","Granular cell Tumor"],"k":"D","x":"A granular cell tumour (Schwann cell origin; S100 and PAS positive) often lies on the posterior vocal fold. Overlying pseudoepitheliomatous hyperplasia can mimic SCC (Cummings).","src":"2025 exam recall · Q104","d":"Laryngology"},{"s":"Which one of the following pathologies is considered as absolute contraindication for cochlear implantation","o":["Cochlear Aplasia","Single sided deafness","Meningitis","Mondini Malformation"],"k":"A","x":"Absolute contraindications to cochlear implantation: complete labyrinthine/cochlear aplasia (Michel) and cochlear nerve aplasia. Mondini malformation, post-meningitis ossification and single-sided deafness are not contraindications (Cummings).","src":"2025 exam recall · Q105","d":"Otology"},{"s":"A 4 year old boy with unilateral grade 3 microtia and congenital aural atresia, the child has no other anomalies CT shows malformed external canal and ossicles ,developed cochlea What is the most appropriate next step?","o":["Cochlear implant","Atresiaplasty","BAHA trail","Immediate ossiculoplasty"],"k":"C","x":"In unilateral microtia/atresia, a bone-conduction device trial (softband BAHA) can be offered to improve hearing in difficult listening, while atresiaplasty (Jahrsdoerfer score ≥7) is deferred to about age 6–7 and coordinated with microtia repair (Cummings; Scott-Brown).","src":"2025 exam recall · Q106","d":"Otology"},{"s":"in pt treated with head and neck cancer the recurrence is the highest in which of the following periods","o":["4-5 years","2-3 years","after 5 years","after10 years"],"k":"B","x":"About 80–90% of head and neck SCC recurrences occur within the first 2–3 years after treatment, which is why follow-up is most intensive then (NCCN surveillance).","src":"2025 exam recall · Q107","d":"Head & Neck"},{"s":"A 67 year old man developed acute inspiratory stridor post prolonged intubation flexible scope shows posterior glottic web formation with cricoarytenoid fixation what is the most appropriate initial surgical approach","o":["Posterior cricoid split with cartilage grafting","Bilateral cordectomy","Tracheostomy and staged airway surgery","Arytenoidectomy with laser"],"k":"C","x":"Severe acute stridor from posterior glottic stenosis with cricoarytenoid fixation is first managed by securing the airway with tracheostomy; definitive airway reconstruction (posterior cricoid split with graft) is staged later (Cummings).","src":"2025 exam recall · Q108","d":"Laryngology"},{"s":"A 20 year old woman presented to the clinic with a history of right ear hearing impairment and diagnosed to have autoimmune SNHL. Which one of the following is the most common feature of this type of hearing loss","o":["Sudden hearing loss","Slowly progressive hearing loss","Rapidly progressive hearing loss","Sudden hearing loss with severe vertigo"],"k":"C","x":"Autoimmune inner ear disease classically presents as rapidly progressive (weeks–months), often bilateral and asymmetric, fluctuating SNHL, responsive to steroids (McCabe; Cummings).","src":"2025 exam recall · Q109","d":"Otology"},{"s":"A 50 years old woman presented with ear pain and diagnosed to aryepiglottic fold Adenoid cystic carcinoma Which one of the following nerves responsible of refered otalgia?","o":["Glossopharyngeal","Facial","Vagus","Mandibular"],"k":"C","x":"Referred otalgia from the larynx and hypopharynx is via the vagus (internal laryngeal nerve → Arnold nerve, the auricular branch of X) (Scott-Brown).","src":"2025 exam recall · Q110","d":"Laryngology"},{"s":"12 year-old boy presented with bilateral SNHL, proteinuria and hematuria,also ophthalmic examination showed keratoconus Which syndrome most likely","o":["Alport syndrome","Waardenburg syndrome","Treacher Collins syndrome","Goldenhar syndrome"],"k":"A","x":"Alport syndrome (COL4A5, type IV collagen): progressive SNHL, haematuria/proteinuria, and ocular anomalies — anterior lenticonus and perimacular flecks (Scott-Brown).","src":"2025 exam recall · Q111","d":"Head & Neck"},{"s":"Which one of the following could be the cause of an immobile vocal fold if the recurrent laryngeal nerve was documented to be intact (stimulating) at the end of thyroid surgery?","o":["Hypomagnesemia","Superior laryngeal nerve stretching","Hypothyroidism","Cricoarytenoid joint fixation"],"k":"D","x":"If the RLN is intact and stimulating at the end of thyroidectomy, postoperative immobility may be due to arytenoid dislocation / cricoarytenoid joint injury from intubation, or neuropraxia (Cummings).","src":"2025 exam recall · Q112","d":"Laryngology"},{"s":"A 48 years old women with history of asthma ,presented show sinusitis,nasal polyps , mononeuritis multiplex , laboratory investigation showed esonophilia and elevated p- ANCA, What is the most likely cause","o":["Sarcoidosis","Granulomatosis with polyangitis","Churg-Strauss syndrome","Allergic fungal sinusitis"],"k":"C","x":"Asthma, nasal polyposis, eosinophilia, mononeuritis multiplex and p-ANCA (MPO) indicate eosinophilic granulomatosis with polyangiitis (Churg-Strauss) (Cummings).","src":"2025 exam recall · Q113","d":"Rhinology"},{"s":"which one of the following is the most diagnostic feature for external auditory canal cholesteatoma","o":["Severe conductive Hearing Loss","Localized bone erosion","History of repeated trauma to canal skin","Purulent ear discharge"],"k":"B","x":"EAC cholesteatoma: localized erosion of the canal bone (usually inferior/posterior) with keratin debris and sequestrum, often with dull pain and otorrhoea; keratosis obturans gives diffuse canal widening with a keratin plug (Scott-Brown).","src":"2025 exam recall · Q114","d":"Otology"},{"s":"in which of the following skull base lesion retrosigmoid approach is used","o":["Vestibular schwannom with hearing preservation","Petroclival meningioma with massive dural extension","Type C glomus jugulare tumors","Olfactory neuroblastoma"],"k":"A","x":"The retrosigmoid (suboccipital) approach is used for CPA tumours with useful hearing, especially those with limited lateral IAC extension (Cummings).","src":"2025 exam recall · Q115","d":"Otology"},{"s":"A 45 year old man with refractory frontal sinusitis will undergo draf surgery which one of the following is the frontal recess land mark during this surgery?","o":["Bulla Ethmoidalis","Sphenoethmoidal recess","Onodi cell","Basal lamella"],"k":"A","x":"In frontal sinusotomy, the bulla ethmoidalis/bulla lamella and anterior ethmoidal artery form the posterior boundary of the frontal recess; the agger nasi lies anteriorly (Wormald; Cummings).","src":"2025 exam recall · Q116","d":"Rhinology"},{"s":"A 6 year old boy with history of recurrent neck abscess CT shows a cervical cyst extending down in to the mediastinum, Which one of the following Branchial anomalies is the most likely diagnosis?","o":["Second","First","Third","Fourth"],"k":"D","x":"Recurrent neck abscesses and suppurative thyroiditis (usually left-sided) from a sinus tract arising in the pyriform sinus apex and descending towards the mediastinum suggest a 4th branchial pouch anomaly (Cummings, Branchial Anomalies).","src":"2025 exam recall · Q117","d":"Paediatric"},{"s":"Which of the following is an indication for surgical intervention in patient with laryngomalacia","o":["Cyanotic spells or apnea","Noisy breathing only during sleep","Mild retractions with feeding","Omega-shaped epiglottis"],"k":"A","x":"Indications for supraglottoplasty in laryngomalacia: apnoea/cyanotic spells, failure to thrive or feeding difficulty with aspiration, pulmonary hypertension/cor pulmonale, and severe retractions. Mild stridor and an omega epiglottis alone are not indications (Cummings).","src":"2025 exam recall · Q118","d":"Paediatric"},{"s":"A 40 year old man with CPA lesion scheduled for surgery by translabyrinthine approach, which one of the following advantage of this approach","o":["hearing preservation","Wide exposure of the petrous apex","Direct access to the internal auditory canal","Preservation of vestibular function"],"k":"C","x":"The translabyrinthine approach gives direct access to the whole IAC to the fundus, with early identification of the facial nerve and minimal cerebellar retraction, at the cost of hearing (Cummings).","src":"2025 exam recall · Q119","d":"Otology"},{"s":"A 49 year old woman presented with of dysphagia and weight loss which has been slowly progressive over 6months she gives history of anemia ,examination revealed positive Moore's sign. What is the most likely diagnosis?","o":["Post cricoid carcinoma","Laryngopharyngeal reflux","Esophageal carcinoma","Globus pharynges"],"k":"A","x":"Progressive dysphagia, weight loss, iron-deficiency anaemia and loss of laryngeal crepitus (positive Moore sign) indicate post-cricoid carcinoma, associated with Plummer–Vinson (Paterson–Brown-Kelly) syndrome (Scott-Brown).","src":"2025 exam recall · Q120","d":"Head & Neck"},{"s":"Which one of the following imaging modality is best in detecting residual or recurrent cholesteatoma","o":["Plain X ray mastoid","MRI with diffusion-weighted imaging","Contrast enhanced CT temporal bone","Ultrasound"],"k":"B","x":"Non-echo-planar diffusion-weighted MRI is the most accurate imaging for residual or recurrent cholesteatoma (restricted diffusion) and can replace a planned second look (Scott-Brown; Cummings).","src":"2025 exam recall · Q121","d":"Otology"},{"s":"A preterm newborn had two failed extubation attempts the NICU. Flexible laryngoscopy shows both vc immobile in the paramedian position . There is no history of prior cardiac surgery What is the most appropriate next step?","o":["Trial of CPAP","Tracheostomy","MRI of the brain and brainstem","Observation with serial laryngoscopy"],"k":"C","x":"Bilateral vocal fold paralysis in a neonate without cardiac or neck surgery is most commonly neurological (Arnold–Chiari malformation, hydrocephalus), so MRI of the brain and brainstem is needed (Cummings, Pediatric Airway).","src":"2025 exam recall · Q122","d":"Paediatric"},{"s":"A 60 year old man undergo endoscopic transsphenoidal pituitary tumor resection intraoperative CSF leak developed What is the most common site if it","o":["Tuberculum sella","sella diaphragm","opticocarotid recess","cavernous sinus"],"k":"B","x":"Intraoperative CSF leaks in transsphenoidal pituitary surgery most often come from a tear in the diaphragma sellae (arachnoid herniation), especially with suprasellar extension (Cummings).","src":"2025 exam recall · Q123","d":"Rhinology"},{"s":"Which of the following histopathological feature distinguishes verrucous carcinoma from conventional squamous cell carcinoma of the larynx?","o":["Broad pushing borders with minimal cytological atypia","Invasion through basement membrane with mitoses","Presence of keratin pearls","Increased mitotic figures"],"k":"A","x":"Verrucous carcinoma: an exophytic, well-differentiated keratinizing tumour with broad pushing (not infiltrative) borders and minimal cytologic atypia; it does not metastasize (Cummings).","src":"2025 exam recall · Q124","d":"Laryngology"},{"s":"A 14 year old boy with CHARGE syndrome is brought with history of unilateral nasal obstruction , recurrent sinusitis and snoring, Which one of the following is the most likely finding?","o":["Antrochoanal Polyp","Unilateral choanal atresia","Sinonasal angiofibroma","Rhinolithiasis"],"k":"B","x":"Choanal atresia (unilateral or bilateral) is a major CHARGE criterion; unilateral atresia presents later with one-sided obstruction and discharge (Scott-Brown).","src":"2025 exam recall · Q125","d":"Rhinology"},{"s":"Which one of the following is the most common complication endoscopic sinus surgery FESS","o":["orbital Hematoma","CSF leak","Synechia","Orbital ecchymosis"],"k":"C","x":"Synechiae (adhesions) are the commonest complication of ESS (about 6–8%); major complications such as CSF leak and orbi
