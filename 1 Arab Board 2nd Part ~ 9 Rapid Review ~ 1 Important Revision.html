", "note": ""}, {"n": 223, "sec": "Pediatric ORL 25(30)", "stem": "The commonest congenital tumor of the nose is:", "opts": [["A", "Dermoid."], ["B", "Glioma."], ["C", "Hemangioma."], ["D", "Encephalocele."]], "marked": ["B"], "a": "A", "e": "The commonest congenital midline nasal mass is the nasal dermoid (sinus cyst) (~60%), then glioma and encephalocele. Source key marked B (glioma). Note: if \"congenital tumour\" is read as neoplasm, haemangioma is the commonest nasal vascular tumour of infancy.", "t": "Dermoid = pit with hair; glioma = firm non-compressible; encephalocele = compressible, Furstenberg +.", "r": "Cummings Pediatric Ch. Congenital Nasal Masses", "note": "Changed from source key (B)."}, {"n": 224, "sec": "Pediatric ORL 25(30)", "stem": "Regarding juvenile nasopharyngeal angiofibroma, stage IIB refers to:", "opts": [["A", "Tumor limited to posterior nares and/ or nasopharyngeal vault."], ["B", "Minimal lateral extension into pterygomaxillary fossa (PMF)."], ["C", "Involvement of nasopharyngeal space and at least one para-nasal sinus."], ["D", "Occupation of PMF with or without superior erosion of orbital bones."]], "marked": ["D"], "a": "D", "e": "Radkowski staging of JNA: IA limited to nose/ nasopharynx; IB + ≥1 paranasal sinus; IIA minimal extension into PPF; IIB full occupation of PPF ± orbital bone erosion; IIC infratemporal fossa/ behind pterygoid plates; IIIA skull base erosion minimal intracranial; IIIB extensive intracranial ± cavernous sinus.", "t": "", "r": "Radkowski 1996; Cummings", "note": ""}, {"n": 225, "sec": "Pediatric ORL 25(30)", "stem": "The commonest area of epistaxis in children is:", "opts": [["A", "Little's area"], ["B", "Retrocolumellar Vein"], ["C", "Middle turbinate"], ["D", "Sphenopalatine artery"]], "marked": ["B"], "a": "B", "e": "In children, anterior epistaxis arises from Little's area; the retrocolumellar vein (running vertically on the anterior septum just behind the columella) is a recognised commonest bleeding point in children/ adolescents (Scott-Brown). Source key B retained.", "t": "Both are anterior septum; Little's area is the general answer for adults and children.", "r": "Scott-Brown Ch. Epistaxis", "note": "Wording-dependent."}, {"n": 226, "sec": "Pediatric ORL 25(30)", "stem": "Sudden respiratory distress and spasmodic cough in a 3 year old, is most probably due to: 70", "opts": [["A", "Acute tonsillopharyngitis"], ["B", "Foreign body inhalation."], ["C", "A severe common cold."], ["D", "Allergic rhinosinsuitis."]], "marked": ["B"], "a": "B", "e": "Sudden onset respiratory distress with spasmodic cough in a toddler = foreign body inhalation.", "t": "", "r": "Cummings Pediatric", "note": ""}];
const SHORT = {"Otology":"Otology","Neurology":"Neurotology & Audiology","Rhinology":"Rhinology & Skull Base","Laryngology":"Laryngology & Speech","Head":"Head & Neck","General":"General","Pediatric":"Paediatric"};
const short = s => { for (const k in SHORT) if (s.startsWith(k)) return SHORT[k]; return s; };
const sections = [...new Set(DATA.map(q => q.sec))];
let state = { ans: {}, sec: "All", idx: 0, fWrong:false, fUn:false, fChg:false };
const KEY = "ent-revision-bank-v1";
async function load(){ try{ const r = await window.storage.get(KEY); if(r && r.value){ const s = JSON.parse(r.value); state.ans = s.ans || {}; } }catch(e){} render(); }
async function save(){ try{ await window.storage.set(KEY, JSON.stringify({ans:state.ans}), false); }catch(e){} }
const esc = t => t.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function list(){
  return DATA.filter(q => (state.sec==="All" || q.sec===state.sec)
    && (!state.fWrong || (state.ans[q.n] && state.ans[q.n]!==q.a))
    && (!state.fUn || !state.ans[q.n])
    && (!state.fChg || q.note));
}
function chips(){
  const el = document.getElementById("chips"); el.innerHTML = "";
  ["All", ...sections].forEach(s => {
    const b = document.createElement("button"); b.className = "chip";
    const n = s==="All" ? DATA.length : DATA.filter(q => q.sec===s).length;
    b.innerHTML = `${esc(s==="All"?"All sections":short(s))}<small>${n}</small>`;
    b.setAttribute("aria-pressed", state.sec===s);
    b.onclick = () => { state.sec = s; state.idx = 0; render(); };
    el.appendChild(b);
  });
}
function score(){
  const done = Object.keys(state.ans).length;
  const ok = DATA.filter(q => state.ans[q.n]===q.a).length;
  const pct = done ? Math.round(100*ok/done) : 0;
  document.getElementById("score").innerHTML = `<b>${ok}</b> correct of <b>${done}</b> answered · ${pct}%`;
  document.getElementById("prog").style.width = (100*done/DATA.length) + "%";
}
function grid(L){
  const g = document.getElementById("grid"); g.innerHTML = "";
  L.forEach((q,i) => {
    const c = document.createElement("button"); c.className = "cell";
    const a = state.ans[q.n]; if (a) c.classList.add(a===q.a?"ok":"bad");
    if (i===state.idx) c.classList.add("cur");
    c.textContent = q.n; c.setAttribute("aria-label", "Question " + q.n);
    c.onclick = () => { state.idx = i; render(); window.scrollTo({top:0}); };
    g.appendChild(c);
  });
}
function render(){
  chips(); score();
  const L = list(); if (state.idx >= L.length) state.idx = Math.max(0, L.length-1);
  grid(L);
  const v = document.getElementById("view");
  document.getElementById("pos").textContent = L.length ? `${state.idx+1} / ${L.length}` : "0 / 0";
  if (!L.length){ v.innerHTML = `<div class="empty">No questions match these filters. Turn a filter off or pick another section.</div>`; return; }
  const q = L[state.idx]; const chosen = state.ans[q.n];
  let h = `<article class="q"><div class="qmeta"><span>Question ${q.n}</span><span>${esc(short(q.sec))}</span></div>`;
  h += `<p class="stem">${q.n}. ${esc(q.stem)}</p><div class="opts">`;
  q.opts.forEach(([L,t]) => {
    let cls = "";
    if (chosen){ if (L===q.a) cls="ok"; else if (L===chosen) cls="bad"; }
    h += `<button class="opt ${cls}" data-l="${L}" ${chosen?"disabled":""}><span class="L">${L}</span><span>${esc(t)}</span></button>`;
  });
  h += `</div>`;
  if (chosen){
    const right = chosen===q.a; const at = q.opts.find(o => o[0]===q.a)[1];
    h += `<div class="exp" aria-live="polite"><p class="verdict ${right?"ok":"bad"}">${right?"Correct":"Incorrect"} — answer ${q.a}. ${esc(at)}</p>`;
    h += `<p>${esc(q.e)}</p>`;
    if (q.t) h += `<p class="trap"><b>Exam trap:</b> ${esc(q.t)}</p>`;
    if (q.note) h += `<p class="note"><b>Note:</b> ${esc(q.note)}</p>`;
    h += `<p class="ref">${esc(q.r)}</p></div>`;
  }
  h += `</article>`;
  v.innerHTML = h;
  v.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(q, b.dataset.l));
}
function answer(q, L){ if (state.ans[q.n]) return; state.ans[q.n] = L; save(); render(); }
function move(d){ const L = list(); if (!L.length) return; state.idx = Math.min(L.length-1, Math.max(0, state.idx+d)); render(); window.scrollTo({top:0}); }
document.getElementById("prev").onclick = () => move(-1);
document.getElementById("next").onclick = () => move(1);
function toggle(id, k){ const b = document.getElementById(id); b.onclick = () => { state[k] = !state[k]; b.setAttribute("aria-pressed", state[k]); state.idx = 0; render(); }; }
toggle("fWrong","fWrong"); toggle("fUn","fUn"); toggle("fChg","fChg");
document.getElementById("gridBtn").onclick = e => { const g = document.getElementById("grid"); const on = g.classList.toggle("show"); e.currentTarget.setAttribute("aria-pressed", on); };
document.getElementById("reset").onclick = () => { if (confirm("Clear all your answers?")){ state.ans = {}; state.idx = 0; save(); render(); } };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key==="ArrowRight") move(1); else if (e.key==="ArrowLeft") move(-1);
  else { const k = e.key.toUpperCase(); if ("ABCDEF".includes(k) && k.length===1){ const L = list(); const q = L[state.idx]; if (q && q.opts.some(o=>o[0]===k)) answer(q,k); } }
});
load();
</script>
</body>
