alysis"]], "marked": ["D"], "a": "D", "e": "Inspiratory stridor = obstruction at or above the glottis (extrathoracic): bilateral vocal cord paralysis. Intrathoracic tracheal/ bronchial lesions (lower trachea, carina, bronchial FB) produce expiratory wheeze/ stridor.", "t": "Biphasic = subglottis/ cervical trachea.", "r": "Cummings Ch. Stridor", "note": ""}, {"n": 102, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "In an adult with acute supraglottitis which sign often indicates a need for airway intervention?", "opts": [["A", "Rapid onset of symptoms"], ["B", "Fever over 39 degrees"], ["C", "Previous similar symptoms"], ["D", "Heart rate over 120 b/m"]], "marked": ["A"], "a": "A", "e": "In adult supraglottitis, predictors of airway intervention: rapid onset (<12–24 h), stridor, drooling, dyspnoea, sitting erect, epiglottic abscess, diabetes. Fever/ tachycardia are less predictive.", "t": "", "r": "Cummings Ch. Adult Supraglottitis", "note": ""}, {"n": 103, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "Vocal cord nodules are most frequently located at:", "opts": [["A", "The junction of the anterior 1/3^(rd) and posterior 2/3rds"], ["B", "The anterior commissure"], ["C", "The posterior commissure"], ["D", "Junction of the anterior 2/3rds and the posterior 1/3^(rd)"]], "marked": ["A"], "a": "A", "e": "Vocal nodules are bilateral, at the junction of the anterior third and posterior two-thirds of the membranous cord (midpoint of membranous vocal fold — point of maximal impact).", "t": "", "r": "Cummings Ch. Benign Vocal Fold Lesions", "note": ""}, {"n": 104, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "The most common cause of vocal cord palsy in adults is:", "opts": [["A", "Surgical trauma"], ["B", "Malignancy"], ["C", "Idiopathic"], ["D", "Infectious"]], "marked": ["A"], "a": "A", "e": "Commonest cause of vocal cord palsy in adults: iatrogenic surgical trauma (thyroid, anterior cervical spine, cardiothoracic, carotid surgery), followed by malignancy (lung, oesophagus, thyroid) and idiopathic.", "t": "Left side affected more (longer course).", "r": "Cummings Ch. Vocal Fold Paralysis", "note": ""}, {"n": 105, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "A patient is sent to you with dysphagia and dysarthria and demonstrates an exaggerated jaw jerk and gag reflex, a spastic tongue and emotional liability. Which of the following terms refers to this constellation of symptoms?", "opts": [["A", "Amyotrophic lateral sclerosis"], ["B", "Bulbar palsy"], ["C", "Pseudo bulbar palsy"], ["D", "Botulism from improperly canned food"]], "marked": ["C"], "a": "C", "e": "Pseudobulbar palsy (bilateral UMN corticobulbar lesions): spastic tongue, exaggerated jaw jerk and gag, emotional lability, spastic dysarthria/ dysphagia. Bulbar palsy (LMN) = wasted fasciculating tongue, absent reflexes.", "t": "", "r": "Bailey; KJ Lee", "note": ""}, {"n": 106, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "In essence, voice therapy does which of the following?", "opts": [["A", "Strengthens the vocal folds"], ["B", "Balances the systems of respiration, phonation and resonance"], ["C", "Instructs patients in good vocal hygiene"], ["D", "Instructs patients not to yell and scream"]], "marked": ["B"], "a": "B", "e": "Voice therapy balances/ coordinates respiration, phonation and resonance subsystems; vocal hygiene is one component.", "t": "", "r": "Bailey Ch. Voice Therapy", "note": ""}, {"n": 107, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "What are the three component parts of any voice therapy program?", "opts": [["A", "Manage laryngopharyngeal reflux, increase hydration and decrease screaming"], ["B", "Increase vocal hygiene, decrease phonotrauma and increase coordinated voice production"], ["C", "Relaxation, breath support and articulation"], ["D", "Psychosocial counsel, increase hydration, and increase voice rest"]], "marked": ["B"], "a": "B", "e": "Three components of voice therapy: improve vocal hygiene, reduce phonotrauma (abusive behaviours), and train coordinated efficient voice production (direct therapy).", "t": "", "r": "Bailey Ch. Voice Therapy", "note": ""}, {"n": 108, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "Which voice disorder would be the least amenable to voice therapy?", "opts": [["A", "Primary muscle tension dysphonia"], ["B", "Secondary muscle tension dysphonia"], ["C", "Nodules"], ["D", "Functional aphonia"]], "marked": ["B"], "a": "B", "e": "Secondary muscle tension dysphonia (compensating for an underlying organic lesion — paralysis, scar, sulcus) is least amenable because the underlying pathology persists. Primary MTD and functional aphonia respond very well; nodules respond in most.", "t": "", "r": "Bailey Ch. Voice Therapy", "note": ""}, {"n": 109, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "Voice therapy usually requires:", "opts": [["A", "1 to 2 sessions of indirect voice therapy and 4 to 6 sessions of direct voice therapy"], ["B", "4 to 6 sessions of indirect voice therapy and 1 to 2 sessions of direct voice therapy"], ["C", "12 weekly sessions"], ["D", "6 sessions of indirect voice therapy"]], "marked": ["A"], "a": "A", "e": "Typical voice therapy course: 1–2 sessions of indirect therapy (education, hygiene) plus 4–6 sessions of direct therapy (technique training).", "t": "", "r": "Bailey Ch. Voice Therapy", "note": ""}, {"n": 110, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "A young man sustained a motor vehicle collision presented with dysphonia, indirect laryngoscopy showed unilateral vocal cord immobility. According to Schaefer classification system, what is the severity rating of this injury?", "opts": [["A", "2"], ["B", "3"], ["C", "4"], ["D", "5"]], "marked": ["B"], "a": "B", "e": "Schaefer classification: Group 1 minor haematoma/ laceration, no fracture; Group 2 oedema/ haematoma, minor mucosal disruption without exposed cartilage, non-displaced fracture; Group 3 massive oedema, mucosal tears, exposed cartilage, displaced fracture, VOCAL CORD IMMOBILITY; Group 4 = group 3 + anterior commissure disruption/ unstable fracture/ >2 fracture lines; Group 5 complete laryngotracheal separation.", "t": "Cord immobility puts the patient in group 3 at least.", "r": "Schaefer 1992/2014; Cummings", "note": ""}, {"n": 111, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "Based on the Schaefer classification system for severity of laryngeal injury, tracheostomy is always required in what group of severity?", "opts": [["A", "2"], ["B", "3"], ["C", "4"], ["D", "5"]], "marked": ["C"], "a": "B", "e": "In Schaefer groups 3, 4 and 5 a tracheostomy is always needed (with exploration ± repair; group 4 also stenting). Group 1 observation, group 2 may need tracheostomy. The lowest group where tracheostomy is always required is group 3. Source key marked C (group 4).", "t": "\"Always required\" starts at group 3; group 4 adds open repair + stent.", "r": "Schaefer; Cummings Ch. Laryngeal Trauma", "note": "Changed from source key (C) — wording-dependent."}, {"n": 112, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "When laryngeal squamous cell carcinoma invades the thyroid gland, at what stage is it classified according to the TNM staging?", "opts": [["A", "T2"], ["B", "T3"], ["C", "T4a"], ["D", "T4b"]], "marked": ["C"], "a": "C", "e": "AJCC 8th larynx: T4a = invades through outer cortex of thyroid cartilage and/or extralaryngeal tissues (trachea, soft tissue of neck incl. deep extrinsic tongue muscles, strap muscles, THYROID GLAND, oesophagus). T4b = prevertebral space, carotid encasement, mediastinum.", "t": "Inner cortex invasion = T3.", "r": "AJCC 8th — Larynx", "note": ""}, {"n": 113, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "In which one of these cases total laryngectomy should be done for carcinoma larynx?", "opts": [["A", "Subglottic extension"], ["B", "Thyroid cartilage invasion"], ["C", "Infiltrated anterior commissure"], ["D", "Arytenoids fixation"]], "marked": ["A"], "a": "A", "e": "Total laryngectomy is required when partial surgery is contraindicated: significant subglottic extension (>10 mm anteriorly/ >5 mm posteriorly, cricoid involvement), cartilage destruction through the outer cortex, bilateral arytenoid fixation, posterior commissure involvement. Of options, subglottic extension (involving cricoid) is the source answer; full-thickness thyroid cartilage invasion (T4a) is also a classic indication.", "t": "Anterior commissure involvement can be managed by SCPL/ frontolateral laryngectomy; unilateral arytenoid fixation by SCPL (one mobile CA unit needed).", "r": "Cummings Ch. Total Laryngectomy; KJ Lee", "note": "Option B is also a recognised indication — wording-dependent."}, {"n": 114, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "In which one of the following laryngeal carcinoma neck is dissection for early stage primary (N0) indicated?", "opts": [["A", "Tumor infiltrating anterior commissure"], ["B", "Glottic carcinoma"], ["C", "Supraglottic carcinoma"], ["D", "Tumor invading the paraglottic fat"]], "marked": ["C"], "a": "C", "e": "Supraglottic carcinoma has rich bilateral lymphatics → occult nodal metastasis 20–50% even in early T stage → elective bilateral neck treatment (levels II–IV). Early glottic cancer has sparse lymphatics (<5%) → no END.", "t": "", "r": "Cummings; NCCN", "note": ""}, {"n": 115, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "Lymphatic drainage of the larynx: 60", "opts": [["A", "Is mainly to the superficial cervical nodes."], ["B", "Infraglottis drains to prelaryngeal nodes."], ["C", "Is very rich at the glottis."], ["D", "Is sparse at the supraglottis part."]], "marked": ["B"], "a": "B", "e": "Laryngeal lymphatics: supraglottis rich (to levels II–III via thyrohyoid membrane, bilateral); glottis sparse; infraglottis drains through cricothyroid membrane to prelaryngeal (Delphian), pretracheal and paratracheal (level VI) nodes, then IV.", "t": "Drains to DEEP cervical nodes.", "r": "Cummings Ch. Laryngeal Anatomy", "note": ""}, {"n": 116, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "Surgical emphysema after tracheostomy is corrected by :70", "opts": [["A", "Removal of some stitches."], ["B", "Cold compressions"], ["C", "I.V Hydrocortisone."], ["D", "Antihistamines"]], "marked": ["A"], "a": "A", "e": "Surgical emphysema after tracheostomy usually results from tight skin closure around the tube — air dissects into tissues. Remove some/ all skin sutures (loosen the wound), check tube position; exclude pneumothorax (CXR).", "t": "Never close the skin tightly around a fresh tracheostomy.", "r": "Scott-Brown Ch. Tracheostomy", "note": ""}, {"n": 117, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "Emergency treatment of an elderly patient with severe stridor : 60", "opts": [["A", "Hydrocortisone and dexamethasone."], ["B", "Cricothryodotomy."], ["C", "Emergency laryngectomy."], ["D", "Admit and plan for tracheostomy."]], "marked": ["B"], "a": "B", "e": "Severe stridor in extremis (cannot wait for formal tracheostomy) → cricothyroidotomy (fastest surgical airway), converted to tracheostomy within 24–72 h. If time allows, awake tracheostomy under LA.", "t": "Emergency laryngectomy is obsolete.", "r": "DAS guidelines; Cummings", "note": ""}, {"n": 118, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "According to American Joint Committee on cancer classification a T2 glottic tumor is: 60", "opts": [["A", "Involving both vocal cords"], ["B", "Extending to false cord"], ["C", "Extension to anterior commissure"], ["D", "Fixing vocal cord"]], "marked": ["B"], "a": "B", "e": "AJCC 8th glottic T2: extends to supraglottis (false cord) and/or subglottis, and/or impaired cord mobility. T1a one cord; T1b both cords (anterior commissure); T3 fixed cord, paraglottic space, inner cortex thyroid cartilage.", "t": "Involving both cords = T1b; fixed cord = T3.", "r": "AJCC 8th — Larynx", "note": ""}, {"n": 119, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "A 38-year-old man had road traffic accident presented to emergency department with breathing difficulty. Neck examination revealed ecchymosis. Fiberoptic laryngoscopy showed bilateral vocal cord abductor paralysis. Which one of the following is the most likely diagnosis?", "opts": [["A", "Thyroid cartilage fracture"], ["B", "Arytenoid cartilage dislocation"], ["C", "Anterior commissure avulsion"], ["D", "Cricotracheal separation"]], "marked": ["D"], "a": "D", "e": "Blunt anterior neck trauma (dashboard/ clothesline) with bilateral vocal cord paralysis and breathing difficulty = cricotracheal separation (bilateral RLN injury at the cricoarytenoid level) — Schaefer group 5; secure airway by tracheostomy below the separation (not intubation).", "t": "Thyroid cartilage fracture alone rarely causes bilateral paralysis.", "r": "Schaefer; Cummings Ch. Laryngeal Trauma", "note": ""}, {"n": 120, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "A 45 year old man diagnosed to have left glottic squamous cell carcinoma. CT scan showed involvement of left paraglottic space, erosion of the thyroid cartilage and extralaryngeal spread. Which one of the following is the best treatment option?", "opts": [["A", "Surgery followed by radiotherapy"], ["B", "Chemoradiotherapy"], ["C", "Surgery"], ["D", "Chemotherapy followed by salvage surgery"]], "marked": ["A"], "a": "A", "e": "T4a glottic SCC (thyroid cartilage erosion with extralaryngeal spread): primary total laryngectomy + neck dissection followed by postoperative (chemo)radiotherapy. Organ-preservation CRT is inferior for T4a with cartilage destruction (VA/ RTOG 91-11 excluded large T4).", "t": "", "r": "NCCN Larynx; Cummings", "note": ""}, {"n": 121, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "A 38-year-old woman diagnosed to have spasmodic dysphonia and treated with botulinum toxin. Which one of the following is the mechanism of action of this toxin?", "opts": [["A", "Blocking serotonin release"], ["B", "Decreasing exoplasmic flow"], ["C", "Activating nerve growth factor"], ["D", "Blocking acetylcholine release"]], "marked": ["D"], "a": "D", "e": "Botulinum toxin A cleaves SNAP-25, inhibiting presynaptic acetylcholine release at the neuromuscular junction — first-line treatment of adductor spasmodic dysphonia (thyroarytenoid injection).", "t": "", "r": "Cummings Ch. Spasmodic Dysphonia", "note": ""}, {"n": 122, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "A 60 year old man had total laryngectomy and insertion of Provox voice prosthesis one year back. He presented with a leak around the prosthesis and fungal infection is suspected. Which one of the following fungal infections is most likely associated with prosthesis failure?", "opts": [["A", "Aspergillus"], ["B", "Candida albicans"], ["C", "Mucormycosis"], ["D", "Cryptococcus neoformans"]], "marked": ["B"], "a": "B", "e": "Candida albicans biofilm colonises silicone voice prostheses → valve incompetence (leak through) and deterioration — commonest cause of prosthesis failure. Leak AROUND the prosthesis is usually due to enlarged fistula.", "t": "Not Aspergillus.", "r": "Cummings Ch. Voice Restoration", "note": ""}, {"n": 123, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "A 35-year old man presented to AE room unconscious following RTA. Intubation was attempted twice but failed. Which one of the following is an indication for an urgent Crico thyroidotomy?", "opts": [["A", "Failure to perform intubation in a patient that cannot be mask ventilate"], ["B", "Progressive hoarse voice"], ["C", "Slow, shallow breathing"], ["D", "Failure to mask ventilate an obese patient with a long beard"]], "marked": ["A"], "a": "A", "e": "Indication for emergency cricothyroidotomy: \"can't intubate, can't oxygenate\" (CICO) — failed intubation in a patient who cannot be mask-ventilated or oxygenated by supraglottic airway.", "t": "Difficult mask ventilation alone (beard/ obesity) is managed by adjuncts.", "r": "DAS 2015 Guidelines", "note": ""}, {"n": 124, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "A 58-years old woman presented with a long-standing hoarseness of voice, and recently developed dyspnoea and stridor. Respiratory rate was normal and no use of accessory muscles or gasping. Bedside flexible nasopharyngoscopy revealed bilateral abductor vocal cord paralysis. CT scan demonstrated subglottic mass suspicious of malignancy. What is the appropriate next step in management?", "opts": [["A", "Urgent resection of this subglottic mass"], ["B", "Biopsy of the subglottic mass to confirm malignancy"], ["C", "Urgent tracheotomy"], ["D", "MRI to confirm extent of the mass"]], "marked": ["C"], "a": "C", "e": "Stridor from bilateral abductor paralysis + subglottic mass: secure the airway first — awake tracheotomy under LA (below the tumour), with biopsy at the same sitting. Do not proceed to biopsy/ imaging/ resection under GA without a secured airway.", "t": "", "r": "Cummings", "note": ""}, {"n": 125, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "Which of the following statements is true regarding early supraglottic carcinoma?", "opts": [["A", "Pulmonary function is not important in selecting therapy for early tumours."], ["B", "Regional metastasis is rare."], ["C", "The contralateral neck does not need to be treated."], ["D", "Supraglottic laryngectomy, radiation therapy, and laser excision have similar cure rates."]], "marked": ["D"], "a": "D", "e": "Early supraglottic carcinoma: supraglottic laryngectomy, radiotherapy and transoral laser microsurgery give similar cure rates. Regional metastasis is common (rich bilateral lymphatics) — treat both necks; pulmonary function is crucial for partial surgery.", "t": "", "r": "Ballenger", "note": ""}, {"n": 126, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "A 70-years old patient presented with a supra-glottic laryngeal carcinoma. You decided to do a partial laryngectomy for him. Following surgery, the patient started to suffer from continuous aspiration and recurrent chest infection. What is your decision?", "opts": [["A", "Perform a total laryngectomy"], ["B", "Give antibiotics"], ["C", "Stop oral feeding"], ["D", "Start chest physiotherapy"]], "marked": ["A"], "a": "A", "e": "Intractable aspiration with recurrent pneumonia after supraglottic partial laryngectomy despite rehabilitation → completion total laryngectomy.", "t": "Life-threatening aspiration overrides organ preservation.", "r": "Cummings", "note": ""}, {"n": 127, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "A 72-year old presented with hoarseness for 5 months which is getting worse and developed difficulty in swallowing and shortness of breath on exertion, pain in both ears and 3 episodes of haemoptysis. On examination, he has a significant cervical lymphadenopathy. Flexible endoscopy revealed a large laryngeal mass and biopsy showed squamous cell carcinoma. As this lesion is inoperable due to its extensive nature, what is the most appropriate treatment option?", "opts": [["A", "Chemotherapy"], ["B", "Radiotherapy"], ["C", "Combined Chemotherapy and Radiotherapy"], ["D", "Repeat the flexible endoscopy 3 months later"]], "marked": ["C"], "a": "C", "e": "Unresectable laryngeal SCC in a fit patient: concurrent chemoradiotherapy (cisplatin) is the standard of care. RT alone for unfit patients; chemotherapy alone is palliative.", "t": "", "r": "NCCN Larynx", "note": ""}, {"n": 128, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "Which laryngeal cartilage is the most at risk of developing radio necrosis?", "opts": [["A", "Cricoid"], ["B", "Thyroid lamina"], ["C", "Arytenoid"], ["D", "Epiglottis"]], "marked": ["C"], "a": "C", "e": "The arytenoid cartilages are most susceptible to chondroradionecrosis (thin overlying mucosa, high-dose field); presents with pain, oedema, fixation, aspiration months-years after RT. Biopsy to exclude recurrence; HBO, steroids, antibiotics; laryngectomy if severe.", "t": "", "r": "Bailey", "note": ""}, {"n": 129, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "Which one of these therapeutic options should be indicated for a 79 year- old-Man with T2 glottic carcinoma, with subglottic extension?", "opts": [["A", "Radiotherapy"], ["B", "Reconstructive frontal Anterior Laryngectomy (Tucker technique)"], ["C", "Supra-cricoid Laryngectomy"], ["D", "Total Laryngectomy"]], "marked": ["A", "D"], "a": "A", "e": "79-year-old with T2 glottic SCC with subglottic extension: definitive radiotherapy (local control ~70–80%) preserves larynx and avoids surgical morbidity in the elderly. Partial laryngectomies (SCPL/ Tucker) need good pulmonary reserve and are less suited in the very elderly; total laryngectomy is overtreatment for T2.", "t": "Source marked both A and D — A is correct.", "r": "NCCN Larynx; Cummings", "note": "Source key ambiguous (A and D)."}, {"n": 130, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "What is the most important predicting factor for better functional outcomes in conservative surgery for supraglottic tumours?", "opts": [["A", "Pulmonary function status"], ["B", "Age"], ["C", "Surgical approach"], ["D", "Extent of resection"]], "marked": ["A"], "a": "A", "e": "Pulmonary function (FEV1, stair climbing) is the most important predictor of functional (swallowing/ aspiration) outcome after conservation supraglottic surgery.", "t": "", "r": "Cummings", "note": ""}, {"n": 131, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "A 40-year-old male smoker presents with hoarseness and a superficial hyperkeratosis on a mobile right vocal cord. What would be the next step in management?", "opts": [["A", "MRI"], ["B", "Administration of ant reflux agents"], ["C", "Speech therapy"], ["D", "Direct laryngoscopy with excision biopsy"]], "marked": ["D"], "a": "D", "e": "Persistent hyperkeratotic lesion on a mobile cord in a smoker → direct microlaryngoscopy with excisional biopsy (diagnosis and treatment).", "t": "Not a reflux/ speech therapy trial.", "r": "Bailey", "note": ""}, {"n": 132, "sec": "Head &Neck Surgery 50(50)", "stem": "A 55 year old man diagnosed with left upper alveolus squamous cell carcinoma and scheduled for infrastructure maxillectomy. Which one of the following best describes this surgery?", "opts": [["A", "Resection of the maxilla inferior to infraorbital nerve"], ["B", "Resection of 4 cm of maxillary bone with 1 cm margin"], ["C", "Resection of 2.5 cm of maxillary bone with 0.5 cm margin"], ["D", "Resection of maxilla through the infraorbital fissure"]], "marked": ["A"], "a": "A", "e": "Infrastructure maxillectomy removes the maxilla below the level of the infraorbital nerve (alveolus, hard palate, lower antrum), preserving the orbital floor.", "t": "", "r": "Cummings Ch. Maxillectomy", "note": ""}, {"n": 133, "sec": "Head &Neck Surgery 50(50)", "stem": "A 45 year old man diagnosed with left inverted papilloma arising from the medial wall of maxillary sinus and scheduled for medial maxillectomy using lateral rhinotomy approach. Which one of the following is the lateral boundary of the resected maxilla?", "opts": [["A", "Infraorbital foramen"], ["B", "Lateral canthal ligament"], ["C", "lacrimal sac"], ["D", "Anterior ethmoidal foramen"]], "marked": ["A"], "a": "A", "e": "Medial maxillectomy (lateral rhinotomy or endoscopic): removes the lateral nasal wall/ medial maxilla and ethmoids; lateral limit = medial to the infraorbital foramen/ nerve; superior = ethmoid roof/ fovea.", "t": "", "r": "Cummings Ch. Maxillectomy", "note": ""}, {"n": 134, "sec": "Head &Neck Surgery 50(50)", "stem": "A10-year-old girl presented with multiple bilateral cervical lymphadenopathies and lymphoma is suspected. Which one of the following is the best diagnostic procedure?", "opts": [["A", "Excision biopsy"], ["B", "Magnetic Resonance Imaging"], ["C", "Fine-needle aspiration biopsy"], ["D", "Contrast-enhanced CT scan"]], "marked": ["A"], "a": "A", "e": "Lymphoma requires architecture → excisional (whole node) biopsy is gold standard; core biopsy acceptable in some centres; FNA insufficient for classification.", "t": "", "r": "NCCN Lymphoma; Bailey", "note": ""}, {"n": 135, "sec": "Head &Neck Surgery 50(50)", "stem": "A 13 year old girl presented with nasopharyngeal mass and malignancy is suspected. Which one of the following is the most likely histopathology diagnosis?", "opts": [["A", "Adenocarcinoma"], ["B", "Mucoepidermoid carcinoma"], ["C", "Non-keratinizing undifferentiated carcinoma"], ["D", "Keratinizing squamous cell carcinoma"]], "marked": ["C"], "a": "C", "e": "Juvenile NPC is almost always non-keratinising undifferentiated carcinoma (WHO type III), EBV-associated, presents with advanced nodal disease, radio-/ chemosensitive.", "t": "", "r": "Cummings Pediatric", "note": ""}, {"n": 136, "sec": "Head &Neck Surgery 50(50)", "stem": "A 30 year old man diagnosed to have nasopharyngeal carcinoma which is confined to the nasopharynx. Neck examination revealed bilateral lymph nodes less than 6 cm in greatest dimension above the caudal border of cricoid cartilage. Which one of the following is the TNM stage of this cancer?", "opts": [["A", "T1N3"], ["B", "T2N2"], ["C", "T2N3a"], ["D", "T3N1"]], "marked": ["B"], "a": "B", "e": "AJCC 8th NPC: tumour confined to nasopharynx = T1; bilateral cervical nodes ≤6 cm above caudal cricoid = N2 → correct stage T1N2 (stage III). T1N2 is not offered; B gets the N category (bilateral = N2) right, which is what the question tests.", "t": "N3 = >6 cm and/or below caudal border of cricoid. Retropharyngeal nodes (even bilateral) = N1.", "r": "AJCC 8th — Nasopharynx", "note": "Correct answer (T1N2) not among options."}, {"n": 137, "sec": "Head &Neck Surgery 50(50)", "stem": "A 45-year-old woman underwent partial parotidectomy with facial nerve preservation for a 2 cm tumor in the superficial lobe of right parotid gland. Pathology showed a low grade mucoepidermoid carcinoma. Margins are negative. The neck is radiologically negative. What therapy do you recommend?", "opts": [["A", "No further therapy, observation"], ["B", "Completion of total parotidectomy"], ["C", "Completion of total parotidectomy and adjuvant radiation"], ["D", "Completion of total parotidectomy and neck dissection"]], "marked": ["A"], "a": "A", "e": "Low-grade MEC, completely excised (negative margins), N0 → observation. No completion parotidectomy, RT or neck dissection.", "t": "Repeated in multiple Arab Board recalls.", "r": "Bailey; NCCN", "note": ""}, {"n": 138, "sec": "Head &Neck Surgery 50(50)", "stem": "A 5 year old girl presents with fever and sore throat of one week duration. Per oral examination shows a congested throat with a bulge in posterior pharyngeal wall. Neck CT scan reveals a collection in danger space. Which one of the following best describes the superior and inferior extent of the danger space?", "opts": [["A", "From skull base to T1-2"], ["B", "From oropharynx to root of neck"], ["C", "From skull base to the diaphragm"], ["D", "From oropharynx to the pelvic diaphragm"]], "marked": ["C"], "a": "C", "e": "Danger space (between alar and prevertebral fascia) extends from skull base to the diaphragm → route for posterior mediastinitis. Retropharyngeal space extends from skull base to T1–T2 (where alar fascia fuses); prevertebral space to the coccyx.", "t": "", "r": "Cummings Ch. Deep Neck Infections", "note": ""}, {"n": 139, "sec": "Head &Neck Surgery 50(50)", "stem": "A 5 -year-old woman presents with recurrent left parotitis of 6 months duration. Which one of the following is the best diagnostic workup and treatment?", "opts": [["A", "Sialography and antibiotics"], ["B", "Ultrasound and Sialoendoscopy"], ["C", "Oral antibiotics and sialagogues"], ["D", "Autoimmune workup and sialagogues"]], "marked": ["B"], "a": "B", "e": "Recurrent parotitis in a child (juvenile recurrent parotitis): ultrasound first (multiple small hypoechoic areas) and sialendoscopy with irrigation/ steroid instillation (diagnostic + therapeutic).", "t": "Sialography largely replaced by US and MR sialography.", "r": "Cummings Pediatric Salivary", "note": ""}, {"n": 140, "sec": "Head &Neck Surgery 50(50)", "stem": "In a patient with a T2N0M0 tongue carcinoma, who underwent partial glossectomy and neck dissection level I-III. The decision to give postoperative radiation therapy depends on which of the following?", "opts": [["A", "High yield of nodes in neck dissection specimen"], ["B", "Close margin and perineural invasion"], ["C", "Tumour 6 mm away from posterior margin"], ["D", "Tumour differentiation grade"]], "marked": ["B"], "a": "B", "e": "Adjuvant RT after oral cavity surgery: close margins, perineural invasion, lymphovascular invasion, pT3–4, pN2–3; chemotherapy added for positive margins or ENE.", "t": "A margin 6 mm away is clear.", "r": "NCCN H&N", "note": ""}, {"n": 141, "sec": "Head &Neck Surgery 50(50)", "stem": "A 40 year old woman scheduled for right tongue carcinoma excision and right extended Supraomohyoid neck dissection. Which of following lymph nodes levels would be removed in this type of dissection?", "opts": [["A", "I, II&III"], ["B", "II, III&IV"], ["C", "I, II, III, IV"], ["D", "II, III, IV&V"]], "marked": ["C"], "a": "C", "e": "Extended supraomohyoid neck dissection = levels I–IV (adds level IV for oral tongue due to skip metastases). SOHND = I–III; lateral = II–IV; posterolateral = II–V + suboccipital/ retroauricular.", "t": "", "r": "AHNS classification", "note": ""}, {"n": 142, "sec": "Head &Neck Surgery 50(50)", "stem": "A 35 year old woman had left buccal squamous cell carcinoma for which she underwent left wide local excision and left neck dissection. Which one of the following factors is the most important predictor of tumor recurrence in the neck following the neck dissection?", "opts": [["A", "Location of the primary"], ["B", "Number of histologically positive lymph nodes"], ["C", "Positive nodes at multiple levels in the neck"], ["D", "Extracapsular extension of tumour"]], "marked": ["D"], "a": "D", "e": "Extracapsular (extranodal) extension is the most important predictor of regional recurrence and survival; indication for postoperative CRT (RTOG 9501/ EORTC 22931); now in AJCC 8th pN.", "t": "", "r": "AJCC 8th; Cummings", "note": ""}, {"n": 143, "sec": "Head &Neck Surgery 50(50)", "stem": "A 55 year old woman had postcricoid squamous cell carcinoma which was treated with chemoradiation presented with swallowing problems. She was seen by the swallowing therapist and advised her to do supraglottic swallow manoeuvre. Which one of the following best describes this manoeuvre?", "opts": [["A", "Holding one’s breath, then swallowing, coughing, and swallowing again before inhaling"], ["B", "Holding one’s breath while bearing down, swallowing, coughing, and swallowing again before inhaling"], ["C", "Consciously keeping the larynx elevated while swallowing"], ["D", "Consciously squeezing one’s swallowing muscles while swallowing"]], "marked": ["B"], "a": "A", "e": "Supraglottic swallow: hold breath, swallow, cough, swallow again before inhaling. Super-supraglottic swallow adds bearing down (effortful breath-hold, closes false cords). Mendelsohn: keep larynx elevated. Effortful swallow: squeeze muscles.", "t": "Source key marked B — that describes the SUPER-supraglottic swallow.", "r": "Logemann; Cummings Ch. Dysphagia", "note": "Changed from source key (B)."}, {"n": 144, "sec": "Head &Neck Surgery 50(50)", "stem": "A 50 year old woman scheduled for hemiglossectomy and type I modified radical neck dissection. As part of the surgery, you are required to ligate the superior end of the internal jugular vein (IJV). What is the most common relationship of IJV to the spinal accessory nerve?", "opts": [["A", "Internal jugular vein commonly splits around the spinal accessory nerve"], ["B", "Spinal accessory nerve is medial to the IJV at the skull base"], ["C", "Spinal accessory nerve is lateral to the IJV at the skull base"], ["D", "Spinal accessory nerve is unlikely to be found at the upper end of the IJV"]], "marked": ["C"], "a": "C", "e": "At the upper end of the IJV (skull base/ C1), the spinal accessory nerve crosses lateral (superficial) to the IJV in ~70%, medial in ~30%, and passes through a split IJV rarely (<3%).", "t": "", "r": "Cummings Ch. Neck Dissection", "note": ""}, {"n": 145, "sec": "Head &Neck Surgery 50(50)", "stem": "A 45 year old woman presents with chest metastasis five years after treatment of her head and neck primary.Which one of the following cancer is most at risk of giving rise to distant metastases without any evidence of cervical metastases?", "opts": [["A", "T4N0 SCC of the hypopharynx"], ["B", "T3N0 medullary thyroid cancer"], ["C", "T4N0 SCC supraglottic carcinoma"], ["D", "T3N0 laryngeal adenoid cystic carcinoma"]], "marked": ["D"], "a": "D", "e": "Adenoid cystic carcinoma (including laryngeal) has high distant (lung) metastasis with low regional nodal spread and late presentation — classic \"distant mets without neck mets\".", "t": "Supraglottic/ hypopharyngeal SCC → high nodal spread.", "r": "Cummings", "note": ""}, {"n": 146, "sec": "Head &Neck Surgery 50(50)", "stem": "A 40 year old woman diagnosed to have parotid gland cancer. Which one of the following parotid gland cancer is most likely to metastasize to cervical nodes?", "opts": [["A", "Adenoid cystic carcinoma"], ["B", "Low-grade mucoepidermoid carcinoma"], ["C", "Epithelial–myoepithelial carcinoma"], ["D", "Carcinoma ex pleomorphic adenoma"]], "marked": ["D"], "a": "D", "e": "Highest nodal metastasis among parotid cancers: high-grade types — carcinoma ex-pleomorphic adenoma, salivary duct carcinoma, high-grade MEC, SCC. ACC, low-grade MEC and epithelial–myoepithelial carcinoma rarely metastasise to nodes.", "t": "", "r": "Cummings; NCCN Salivary", "note": ""}, {"n": 147, "sec": "Head &Neck Surgery 50(50)", "stem": "A 45 year old man presented with an ulcerative proliferative growth involving the floor of the mouth which is just abutting the mandible. Biopsy of the lesion proved moderately differentiated squamous cell carcinoma. Which one of the following is an indication of doing marginal mandibuloectomy along with the resection of the lesion?", "opts": [["A", "Tumor superficially invades the cortex"], ["B", "Edentulous atrophied mandible"], ["C", "Previous radiation"], ["D", "Paramandibular soft tissue involvement"]], "marked": ["A"], "a": "A", "e": "Marginal (rim) mandibulectomy: tumour abutting or superficially invading the alveolar/ cortical bone without marrow invasion. Segmental resection for marrow/ ID canal invasion, edentulous atrophic mandible, previous radiation, extensive paramandibular disease.", "t": "B, C, D are indications for SEGMENTAL resection.", "r": "Cummings Ch. Oral Cavity Cancer", "note": ""}, {"n": 148, "sec": "Head &Neck Surgery 50(50)", "stem": "A 64-years old man presented with severe dysphagia, odynophagia and speech difficulty. CT scan showed retropharyngeal abscess. Which of the following is a potential sequel of this condition?", "opts": [["A", "Ludwig angina"], ["B", "Tongue paralysis"], ["C", "Carotid artery thrombophlebitis"], ["D", "Acute necrotizing mediastinitis"]], "marked": ["D"], "a": "D", "e": "Retropharyngeal abscess can rupture into the danger space and spread to the mediastinum → acute necrotising mediastinitis (high mortality); also airway obstruction, aspiration, carotid erosion, IJV thrombosis (Lemierre).", "t": "", "r": "Cummings Ch. Deep Neck Infections", "note": ""}, {"n": 149, "sec": "Head &Neck Surgery 50(50)", "stem": "Which of the following statements is true about using positron emission tomography in evaluation of occult nodal metastases from laryngopharyngeal malignancies?", "opts": [["A", "Provides the most anatomic detail of any imaging study."], ["B", "Is of no use in the clinically N0 neck."], ["C", "Is more sensitive and specific than CT or MRI."], ["D", "Is chosen for single-modality imaging."]], "marked": ["C"], "a": "C", "e": "FDG-PET is more sensitive and specific than CT/ MRI for nodal metastasis and recurrence, but provides poor anatomic detail (hence PET-CT) and has limited sensitivity for micrometastases in the cN0 neck (<5 mm).", "t": "", "r": "Ballenger; NCCN", "note": ""}, {"n": 150, "sec": "Head &Neck Surgery 50(50)", "stem": "Which of the following flaps is the most commonly used in head and neck reconstruction?", "opts": [["A", "Pectoralis major and latissimus dorsi"], ["B", "Pectoralis major and sternocleidomastoid"], ["C", "Sternocleidomastoid and latissimus dorsi"], ["D", "Sternocleidomastoid and trapezius"]], "marked": ["A"], "a": "A", "e": "Workhorse pedicled flaps in head and neck reconstruction: pectoralis major myocutaneous (thoracoacromial artery) and latissimus dorsi (thoracodorsal artery); deltopectoral historically. Free flaps (RFFF, ALT, fibula) dominate modern practice.", "t": "", "r": "Cummings Ch. Regional Flaps", "note": ""}, {"n": 151, "sec": "Head &Neck Surgery 50(50)", "stem": "The best study to distinguish post-operative scar from tumor recurrence is:", "opts": [["A", "PET-CT imaging"], ["B", "PET imaging"], ["C", "CT imaging"], ["D", "MRI with contrast"]], "marked": ["A"], "a": "A", "e": "PET-CT best differentiates post-treatment scar/ fibrosis from recurrent tumour (metabolic activity + anatomy), ideally ≥12 weeks after treatment. MRI with DWI is a useful adjunct.", "t": "", "r": "NCCN; Shah", "note": ""}, {"n": 152, "sec": "Head &Neck Surgery 50(50)", "stem": "Surgical treatment of cervical lymph node tuberculosis should be performed in which one of the following situations?", "opts": [["A", "Pediatric population"], ["B", "Adenopathies ≥ 2 cm in diameter"], ["C", "HIV infected patients"], ["D", "Resistance to first line antiuberculous therapy"]], "marked": ["D"], "a": "D", "e": "Cervical TB lymphadenitis is treated medically (6-month regimen). Surgery (excision) is indicated for drug resistance/ failure of medical therapy, persistent residual nodes, diagnostic uncertainty, cold abscess/ sinus. Atypical (non-tuberculous) mycobacteria in children → excision.", "t": "", "r": "Cummings Ch. Granulomatous Neck Disease", "note": ""}, {"n": 153, "sec": "Head &Neck Surgery 50(50)", "stem": "Frey’s syndrome (post-parotidectomy) is caused by the damage of which one of these nerves?", "opts": [["A", "Superficial cervical Plexus"], ["B", "Great Auricular"], ["C", "Temporal branches of facial nerve"], ["D", "Auriculo-temporal"]], "marked": ["D"], "a": "D", "e": "Frey syndrome (gustatory sweating) results from aberrant regeneration of parasympathetic secretomotor fibres of the auriculotemporal nerve into sweat glands of the skin flap. Minor starch-iodine test; treatment botulinum toxin; prevention SMAS/ fat/ ADM interposition.", "t": "", "r": "Cummings Ch. Parotid Surgery Complications", "note": ""}, {"n": 154, "sec": "Head &Neck Surgery 50(50)", "stem": "In which one of these situations is prophylactic central neck dissection in patients with papillary thyroid carcinoma recommended?", "opts": [["A", "Age > 60 years"], ["B", "Male gender"], ["C", "Tumor size > 2 cm"], ["D", "Extra-thyroidal extension"]], "marked": ["D"], "a": "D", "e": "ATA 2015: prophylactic central neck dissection considered in PTC with cN0 central neck but advanced primary (T3/ T4 — gross extrathyroidal extension) or clinically involved lateral nodes.", "t": "", "r": "ATA 2015 Guidelines", "note": ""}, {"n": 155, "sec": "Head &Neck Surgery 50(50)", "stem": "Which one of these imaging studies is the best preoperative method of localization of parathyroid adenomas?", "opts": [["A", "Ultrasonography (USG)"], ["B", "18-FDG –PET"], ["C", "Technetium Sestamibi (99m Tc-MIBI)"], ["D", "CT-SCAN"]], "marked": ["C"], "a": "C", "e": "Tc-99m sestamibi (with SPECT/CT) is the best single functional localisation test for parathyroid adenoma; combined with ultrasound (concordance) allows focused parathyroidectomy. 4D-CT/ choline PET for discordant/ re-operative cases.", "t": "", "r": "Cummings Ch. Parathyroid", "note": ""}, {"n": 156, "sec": "Head &Neck Surgery 50(50)", "stem": "What is the best investigation tool for diagnosis of patients presenting with trismus due to peri tonsillar abscess?", "opts": [["A", "Contrast-enhanced CT"], ["B", "Needle Aspiration"], ["C", "Intra-oral Ultrasound"], ["D", "MRI with Gadolinium injection"]], "marked": ["A"], "a": "A", "e": "Contrast-enhanced CT is the best investigation when trismus prevents adequate examination of a suspected peritonsillar abscess (also excludes parapharyngeal/ retropharyngeal extension). Intraoral US is excellent but limited by trismus; needle aspiration is diagnostic and therapeutic.", "t": "", "r": "Cummings Ch. Pharyngitis & PTA", "note": ""}, {"n": 157, "sec": "Head &Neck Surgery 50(50)", "stem": "Which one of these procedures should be the initial treatment for patients with peri tonsillar abscess?", "opts": [["A", "Antibiotic therapy followed by tonsillectomy"], ["B", "Incisional drainage"], ["C", "Swab for culture and sensitivity"], ["D", "Abscess tonsillectomy"]], "marked": ["C"], "a": "B", "e": "Initial treatment of peritonsillar abscess: drainage — needle aspiration or incision and drainage — plus antibiotics (penicillin + metronidazole/ clindamycin), analgesia, fluids. Quinsy tonsillectomy for airway compromise/ failed drainage. A swab for culture is part of drainage, not the treatment.", "t": "Source key marked C (swab) — that is not a treatment.", "r": "Cummings Ch. PTA; Scott-Brown", "note": "Changed from source key (C)."}, {"n": 158, "sec": "Head &Neck Surgery 50(50)", "stem": "Which one of these procedures is recently considered as the first-line treatment of cervico-facial lymphatic malformations?", "opts": [["A", "Radiofrequency"], ["B", "Percutaneous sclerotherapy"], ["C", "Surgical excision"], ["D", "Laser therapy"]], "marked": ["B"], "a": "B", "e": "Percutaneous sclerotherapy (OK-432, doxycycline, bleomycin, ethanol) is the first-line treatment of macrocystic and mixed cervicofacial lymphatic malformations; sirolimus for complex/ microcystic disease; surgery for failures.", "t": "", "r": "ISSVA; Cummings Pediatric Vascular Anomalies", "note": ""}, {"n": 159, "sec": "Head &Neck Surgery 50(50)", "stem": "In which one of the following situations is surgical management indicated for cervico-facial lymphatic malformations?", "opts": [["A", "Oral cavity extension"], ["B", "Failure of sclerotherapy"], ["C", "Orbital location"], ["D", "Paediatric population"]], "marked": ["B"], "a": "B", "e": "Surgery for cervicofacial lymphatic malformations is indicated after failure of sclerotherapy (or for localised, well-defined lesions/ airway compromise).", "t": "", "r": "Cummings Pediatric", "note": ""}, {"n": 160, "sec": "Head &Neck Surgery 50(50)", "stem": "Which one of these histological Types is the most common malignant tumor of salivary glands?", "opts": [["A", "Mucoepidermoid carcinoma"], ["B", "Adenoid cystic carcinoma"], ["C", "Carcinoma ex-pleomorphic adenoma"], ["D", "Lymphoma"]], "marked": ["A"], "a": "A", "e": "Mucoepidermoid carcinoma is the most common salivary malignancy overall (parotid) and in children; adenoid cystic is the most common in submandibular and minor salivary glands.", "t": "", "r": "Cummings", "note": ""}, {"n": 161, "sec": "Head &Neck Surgery 50(50)", "stem": "On the basis of MRI finding in salivary gland tumors, which one of the following indicative of malignancy?", "opts": [["A", "Isointense to muscle on T1-w images and hyper intense on T2-w."], ["B", "Low signal intensity on T2-w"], ["C", "Thin peripheral enhancement following contrast"], ["D", "Heterogeneous low to intermediate intensities on both T1-w and T2-w"]], "marked": ["B"], "a": "B", "e": "On MRI, low T2 signal (high cellularity) with ill-defined/ infiltrative margins and low ADC suggests malignancy. Pleomorphic adenoma is very bright on T2 with lobulated margins; Warthin intermediate/ low with cysts.", "t": "", "r": "Cummings Ch. Salivary Imaging", "note": ""}, {"n": 162, "sec": "Head &Neck Surgery 50(50)", "stem": "Which diagnostic procedure is the gold standard in the diagnosis of lymphoma patients presenting with cervical lymph nodes?", "opts": [["A", "Excision biopsy"], ["B", "Fine-needle aspiration biopsy"], ["C", "Core needle biopsy"], ["D", "Contrast-enhanced CT scan"]], "marked": ["A"], "a": "A", "e": "Excisional biopsy is the gold standard for lymphoma diagnosis (architecture, immunohistochemistry, molecular studies).", "t": "", "r": "NCCN Lymphoma", "note": ""}, {"n": 163, "sec": "Head &Neck Surgery 50(50)", "stem": "Torus palatinus is considered as:", "opts": [["A", "Premalignant"], ["B", "A tumor"], ["C", "A hamartoma"], ["D", "An exostosis"]], "marked": ["D"], "a": "D", "e": "Torus palatinus: benign bony exostosis in the midline of the hard palate (torus mandibularis on the lingual mandible). Treat only if denture interference/ ulceration.", "t": "", "r": "Cummings Ch. Oral Lesions", "note": ""}, {"n": 164, "sec": "Head &Neck Surgery 50(50)", "stem": "Warthin’s tumor of the parotid :", "opts": [["A", "Affects submandibular gland."], ["B", "Salivary tissue is entrapped in lymph nodes."], ["C", "Is usually bilateral."], ["D", "Has high rate of malignant transformation."]], "marked": ["B"], "a": "B", "e": "Warthin tumour (papillary cystadenoma lymphomatosum): parotid tail almost exclusively, elderly male smokers, bilateral in ~10–15%; arises from salivary ductal inclusions entrapped in intraparotid lymph nodes; malignant transformation is very rare; hot on Tc-99m pertechnetate.", "t": "\"Usually bilateral\" is false (10–15%).", "r": "Cummings Ch. Benign Salivary Neoplasms", "note": ""}, {"n": 165, "sec": "Head &Neck Surgery 50(50)", "stem": "The postcricoid region extends from the cricoarytenoid joint to the: 60", "opts": [["A", "Superior border of the cricoid cartilage"], ["B", "Inferior border of the cricoid cartilage"], ["C", "Inferior border of the thyroid cartilage"], ["D", "Superior border of the thyroid cartilage"]], "marked": ["B"], "a": "B", "e": "Post-cricoid region (hypopharynx subsite): from the level of the arytenoid cartilages/ cricoarytenoid joints to the inferior border of the cricoid cartilage (anterior wall of hypopharynx).", "t": "", "r": "AJCC 8th — Hypopharynx subsites", "note": ""}, {"n": 166, "sec": "Head &Neck Surgery 50(50)", "stem": "The parathyroid glands lie in contact with the:80", "opts": [["A", "Posterior surface of the thyroid"], ["B", "Lateral surface of the thyroid"], ["C", "Medial surface of the thyroid"], ["D", "Anterior surface of the thyroid"]], "marked": ["A"], "a": "A", "e": "Parathyroids lie on the posterior surface of the thyroid lobes (superior glands posterior at cricothyroid junction near RLN entry; inferior glands more variable, near lower pole/ thymus).", "t": "", "r": "Cummings Ch. Parathyroid", "note": ""}, {"n": 167, "sec": "Head &Neck Surgery 50(50)", "stem": "The standard treatment for extracapsular nodal spread of head and neck cancer is:60", "opts": [["A", "Neoadjuvant chemoradiotherapy"], ["B", "Surgery and postoperative radiotherapy"], ["C", "Surgery and postoperative chemotherapy"], ["D", "Radiotherapy"]], "marked": ["B"], "a": "B", "e": "Extracapsular nodal spread → surgery followed by postoperative concurrent CHEMORADIOTHERAPY (cisplatin) is the standard. Of options, surgery + postoperative radiotherapy is closest; chemotherapy should be added.", "t": "Correct modern answer: surgery + postoperative CRT.", "r": "RTOG 9501; EORTC 22931", "note": "Best of options — true standard is POCRT."}, {"n": 168, "sec": "Head &Neck Surgery 50(50)", "stem": "An asymptomatic mid line posterior lingual swelling is most probably: 60", "opts": [["A", "A lingual thyroid."], ["B", "Mucoepidermoid carcinoma."], ["C", "A ranula."], ["D", "An epidermoid cyst."]], "marked": ["A"], "a": "A", "e": "Asymptomatic midline posterior tongue swelling at foramen caecum = lingual thyroid; often the only functioning thyroid (~70%) → thyroid scan before any excision.", "t": "", "r": "Cummings Ch. Thyroid Embryology", "note": ""}, {"n": 169, "sec": "Head &Neck Surgery 50(50)", "stem": "Pleomorphic adenoma arises from: 60", "opts": [["A", "Myoepithelial cells"], ["B", "Acinar cells"], ["C", "Connective tissue"], ["D", "Stem cells"]], "marked": ["A"], "a": "A", "e": "Pleomorphic adenoma is a mixed tumour of epithelial (ductal) and myoepithelial cells (from intercalated duct reserve cells); the myoepithelial cells produce the chondromyxoid stroma. Key answer: myoepithelial cells.", "t": "", "r": "Cummings Ch. Salivary Neoplasms", "note": ""}, {"n": 170, "sec": "Head &Neck Surgery 50(50)", "stem": "Acute non suppurative sialadenitis is seen in: 80", "opts": [["A", "Acute bacterial sialadenitis"], ["B", "Mumps"], ["C", "Chronic bacterial sialadenitis"], ["D", "Necrotizing sialadenitis"]], "marked": ["B"], "a": "B", "e": "Mumps (paramyxovirus) = acute non-suppurative (viral) sialadenitis — bilateral parotitis, orchitis, pancreatitis, unilateral SNHL.", "t": "", "r": "Cummings", "note": ""}, {"n": 171, "sec": "Head &Neck Surgery 50(50)", "stem": "Salivary gland mucocele most commonly arises due to: 60", "opts": [["A", "Rupture of salivary gland"], ["B", "Partial compression of gland duct"], ["C", "Inflammatory changes in glandular tissue"], ["D", "Partial or complete obstruction of gland duct"]], "marked": ["A"], "a": "A", "e": "Mucocele (extravasation type, commonest on lower lip) arises from rupture/ trauma of a minor salivary duct with mucus spilling into tissues (no epithelial lining). Retention cyst = duct obstruction with epithelial lining (less common).", "t": "", "r": "Cummings Ch. Oral Lesions", "note": ""}, {"n": 172, "sec": "Head &Neck Surgery 50(50)", "stem": "Ameloblastoma most frequently occurs in:70", "opts": [["A", "Mandibular molar region"], ["B", "Maxillary molar region"], ["C", "Mandibular premolar region"], ["D", "Maxillary premolar region"]], "marked": ["A"], "a": "A", "e": "Ameloblastoma: 80% mandible, mostly molar–ramus region; multilocular \"soap-bubble\" radiolucency; resect with 1–1.5 cm bony margin.", "t": "", "r": "Cummings Ch. Odontogenic Tumours", "note": ""}, {"n": 173, "sec": "Head &Neck Surgery 50(50)", "stem": "The cell abnormality in dysplasia involves:50", "opts": [["A", "Maturation and differentiation"], ["B", "Maturation"], ["C", "organization"], ["D", "Differentiation"]], "marked": ["A"], "a": "A", "e": "Dysplasia: disordered maturation and differentiation (loss of polarity, pleomorphism, increased mitoses), graded mild/ moderate/ severe by thickness involved.", "t": "", "r": "WHO 2017", "note": ""}, {"n": 174, "sec": "Head &Neck Surgery 50(50)", "stem": "Regarding the superficial part of the submandibular gland: 60", "opts": [["A", "lateral surface lies against the submandibular fossa of the mandible"], ["B", "Lateral surface is grooved posteriorly by the facial nerve"], ["C", "The inferior surface is crossed by the facial artery"], ["D", "Medial surface lies against mylohyoid, hyoglossus and genoglossus"]], "marked": ["A"], "a": "A", "e": "Superficial part of the submandibular gland: lateral surface lies in the submandibular fossa of the mandible and is grooved by the facial artery; inferior surface covered by skin, platysma, facial vein and investing fascia; medial surface on mylohyoid, hyoglossus and styloglossus (not genioglossus).", "t": "", "r": "Gray's Anatomy", "note": ""}, {"n": 175, "sec": "Head &Neck Surgery 50(50)", "stem": "Ludwig’s angina is manifested by: 70", "opts": [["A", "Sublingual and submental cellulitis."], ["B", "Unilateral submandibular cellulitis."], ["C", "Parapharyngeal abscess."], ["D", "Suprasternal gross swelling."]], "marked": ["A"], "a": "A", "e": "Ludwig angina: bilateral cellulitis of submandibular, sublingual and submental spaces (woody floor of mouth, elevated tongue), usually odontogenic (2nd/ 3rd molars).", "t": "", "r": "Cummings Ch. Deep Neck Infections", "note": ""}, {"n": 176, "sec": "Head &Neck Surgery 50(50)", "stem": "Asymptomatic palatal swelling, with intact mucosa is most probably:70", "opts": [["A", "A pleomorphic salivary gland adenoma."], ["B", "An indolent abscess."], ["C", "A carcinoma in situ."], ["D", "A mucous cyst."]], "marked": ["A"], "a": "A", "e": "Asymptomatic firm palatal swelling with intact mucosa = minor salivary gland tumour — pleomorphic adenoma commonest.", "t": "", "r": "Cummings", "note": ""}, {"n": 177, "sec": "Head &Neck Surgery 50(50)", "stem": "Pleomorphic adenoma arises from: 60", "opts": [["A", "Myoepithelial cells"], ["B", "Acinar cells"], ["C", "Connective tissue"], ["D", "Stem cells"]], "marked": ["A"], "a": "A", "e": "Duplicate of Q169.", "t": "", "r": "Cummings", "note": "Duplicate."}, {"n": 178, "sec": "Head &Neck Surgery 50(50)", "stem": "Most common salivary gland metastasis in bones is from: 50", "opts": [["A", "Malignant ex pleomorphic adenoma"], ["B", "Adenoid cystic carcinoma"], ["C", "Mucoepidermoid carcinoma"], ["D", "Adenocarcinoma"]], "marked": ["C"], "a": "B", "e": "Adenoid cystic carcinoma has the highest distant metastasis rate among salivary cancers (lung most common, then bone); salivary duct carcinoma also. Source key marked C (MEC).", "t": "Evidence supports ACC as the commonest salivary cancer to metastasise distantly (incl. bone).", "r": "Cummings Ch. Malignant Salivary Neoplasms", "note": "Changed from source key (C) — limited evidence."}, {"n": 179, "sec": "Head &Neck Surgery 50(50)", "stem": "Acute non suppurative sialadenitis is seen in: 80", "opts": [["A", "Acute bacterial sialadenitis"], ["B", "Mumps"], ["C", "Chronic bacterial sialadenitis"], ["D", "Necrotizing sialadenitis"]], "marked": ["B"], "a": "B", "e": "Duplicate of Q170.", "t": "", "r": "Cummings", "note": "Duplicate."}, {"n": 180, "sec": "Head &Neck Surgery 50(50)", "stem": "Which neoplasm is associated with dentigerous cyst? 60", "opts": [["A", "Osteogenic carcinoma"], ["B", "Ameloblastoma"], ["C", "Osteoclastoma"], ["D", "Osteosarcoma"]], "marked": ["B"], "a": "B", "e": "Dentigerous cyst (around crown of unerupted tooth, commonly third molar) may give rise to unicystic ameloblastoma, SCC or mucoepidermoid carcinoma.", "t": "", "r": "Cummings Ch. Odontogenic Cysts", "note": ""}, {"n": 181, "sec": "Head &Neck Surgery 50(50)", "stem": "A 60 years old man undergoes neck dissection involving excision of level II-IV lymph nodes with preservation of the jugular vein, accessory nerve and sternocleidomastoid. What is the type of this neck dissection?60", "opts": [["A", "Modified radical neck dissection type I"], ["B", "Supraomohyoid selective neck dissection"], ["C", "Posterolateral selective neck dissection"], ["D", "Lateral selective neck dissection"]], "marked": ["D"], "a": "D", "e": "Lateral selective neck dissection = levels II–IV (laryngeal, hypopharyngeal, oropharyngeal cancers), preserving IJV, SAN and SCM.", "t": "", "r": "AHNS classification", "note": ""}, {"n": 182, "sec": "Head &Neck Surgery 50(50)", "stem": "Sluder’s neuralgia includes all, Except : 50", "opts": [["A", "Rhinorrhoea"], ["B", "Increased lacrimation"], ["C", "Nasal stuffiness"], ["D", "Facial neuralgia"]], "marked": ["D"], "a": "D", "e": "Sluder's (sphenopalatine ganglion) neuralgia: unilateral facial/ orbital/ nasal pain with ipsilateral rhinorrhoea, lacrimation and nasal congestion. Facial pain is actually a core feature — the question is flawed; recall key gives D.", "t": "Source key D retained — all four features occur in Sluder's neuralgia.", "r": "KJ Lee", "note": "Question flawed."}, {"n": 183, "sec": "General (Systemic Diseases in ORL 10(14)", "stem": "A 34-year-old woman presented with dry eyes and mouth complaints. You suspected primary Sjogren's syndrome. Which one of the following investigations is most likely to confirm the diagnosis?", "opts": [["A", "cANCA testing"], ["B", "Rheumatoid factor levels"], ["C", "RhO antibody testing"], ["D", "Labial biopsy"]], "marked": ["D"], "a": "D", "e": "Labial minor salivary gland biopsy (focal lymphocytic sialadenitis, focus score ≥1) is the most specific test for primary Sjögren's (ACR/EULAR 2016: biopsy 3 points, anti-Ro 3, Schirmer/ ocular staining/ salivary flow 1 each; total ≥4).", "t": "cANCA = GPA.", "r": "ACR/EULAR 2016", "note": ""}, {"n": 184, "sec": "General (Systemic Diseases in ORL 10(14)", "stem": "One of the following is a manifestation of sarcoidosis:", "opts": [["A", "Intrathoracic lymphadenopathy in 80%"], ["B", "Splenomegaly in less than 50%"], ["C", "Myopathy in less than 50%"], ["D", "Testicular involvement in over 5%"]], "marked": ["A"], "a": "A", "e": "Sarcoidosis: intrathoracic (bilateral hilar) lymphadenopathy in ~80–90%. Splenomegaly ~10%, myopathy symptomatic rarely, testicular involvement <1%.", "t": "", "r": "Cummings Ch. Sarcoidosis", "note": ""}, {"n": 185, "sec": "General (Systemic Diseases in ORL 10(14)", "stem": "Hair removal prior to surgery should be completed by which of these methods?", "opts": [["A", "Shaving"], ["B", "Hair clippers"], ["C", "Chemical remover"], ["D", "Dermabrasion"]], "marked": ["B"], "a": "B", "e": "Hair removal, if necessary, should be with clippers immediately before surgery — shaving increases surgical site infection (micro-abrasions).", "t": "", "r": "WHO/ NICE SSI guidelines", "note": ""}, {"n": 186, "sec": "General (Systemic Diseases in ORL 10(14)", "stem": "Surgical Care Improvement Guidelines require that preoperative antibiotics be given when?", "opts": [["A", "At the time of incision"], ["B", "2 hours before incision"], ["C", "Within 1 hour of incision"], ["D", "Any time during the procedure"]], "marked": ["C"], "a": "C", "e": "SCIP: prophylactic antibiotic within 60 minutes before incision (120 min for vancomycin/ fluoroquinolones), stopped within 24 h.", "t": "", "r": "SCIP; Bailey", "note": ""}, {"n": 187, "sec": "General (Systemic Diseases in ORL 10(14)", "stem": "Reflux Laryngitis is best treated by:", "opts": [["A", "Antacids"], ["B", "Antacids and H₂ – receptor antagonists"], ["C", "Proton-pump inhibitors"], ["D", "Promotility agents"]], "marked": ["C"], "a": "C", "e": "LPR is best treated with twice-daily proton-pump inhibitors for 2–3 months plus lifestyle/ dietary measures (± alginates).", "t": "", "r": "Koufman; Cummings Ch. LPR", "note": ""}, {"n": 188, "sec": "General (Systemic Diseases in ORL 10(14)", "stem": "The commonest infective agent associated with congenital anomalies is:", "opts": [["A", "Cytomegalovirus"], ["B", "Rubella"], ["C", "Toxoplasmosis"], ["D", "EB virus"]], "marked": ["B"], "a": "A", "e": "Congenital CMV is now the commonest congenital infection causing birth defects (microcephaly, SNHL, chorioretinitis) in the post-rubella-vaccine era. Source key marked B (rubella — classic textbook answer for anomalies like cataract, PDA, deafness).", "t": "Older texts: rubella. Current: CMV.", "r": "JCIH 2019; Cummings Pediatric", "note": "Changed from source key (B) — older key = rubella."}, {"n": 189, "sec": "General (Systemic Diseases in ORL 10(14)", "stem": "induction of general anaesthesia for tonsillectomy is best achieved by use of:", "opts": [["A", "Diazepam"], ["B", "Ketamine"], ["C", "Propofol"], ["D", "Pentothal"]], "marked": ["C"], "a": "C", "e": "Propofol is the induction agent of choice (smooth induction, rapid recovery, antiemetic, suppresses airway reflexes). Paediatric inhalational induction (sevoflurane) is also common.", "t": "", "r": "Scott-Brown Ch. Anaesthesia", "note": ""}, {"n": 190, "sec": "General (Systemic Diseases in ORL 10(14)", "stem": "An impacted salivary gland stone in Wharton's duct before the opening is best removed via :", "opts": [["A", "The duct opening"], ["B", "Encouraging liberal quantities of citrus drinks"], ["C", "Marsupialization of the duct"], ["D", "Removal of the salivary gland"]], "marked": ["C"], "a": "C", "e": "Stone impacted in Wharton's duct just behind the papilla (distal duct): transoral incision over the stone with marsupialisation (sialodochoplasty) of the duct.", "t": "", "r": "Cummings Ch. Sialolithiasis", "note": ""}, {"n": 191, "sec": "General (Systemic Diseases in ORL 10(14)", "stem": "Fibrous dysplasia is:", "opts": [["A", "An inherited mutation with incomplete penetrance"], ["B", "Non inherited mutation"], ["C", "Recessive gene"], ["D", "Dominant gene"]], "marked": ["B"], "a": "B", "e": "Fibrous dysplasia: post-zygotic (somatic) activating mutation of GNAS1 — non-inherited; mosaic distribution explains mono-/ polyostotic forms and McCune-Albright.", "t": "", "r": "Cummings Ch. Fibro-osseous Lesions", "note": ""}, {"n": 192, "sec": "General (Systemic Diseases in ORL 10(14)", "stem": "In the pathogenesis of xeroderma pigmentosa, the defect is in: 40", "opts": [["A", "Maturation of melanocytes"], ["B", "DNA repair mechanism"], ["C", "Pigmentation"], ["D", "Cell division"]], "marked": ["B"], "a": "B", "e": "Xeroderma pigmentosum: autosomal recessive defect of nucleotide excision DNA repair → UV-induced early skin cancers (BCC, SCC, melanoma).", "t": "", "r": "Cummings Ch. Cutaneous Malignancy", "note": ""}, {"n": 193, "sec": "General (Systemic Diseases in ORL 10(14)", "stem": "Post streptococcal glomerulonephritis:60", "opts": [["A", "Oliguria occurs ten days after the proceeding pharyngitis."], ["B", "Is treated by antibiotic and steroids."], ["C", "Has poor prognosis especially in children."], ["D", "Macroscopic haematuria and hyaline casts are diagnostic features."]], "marked": ["A"], "a": "A", "e": "PSGN appears 1–2 weeks (≈10 days) after streptococcal pharyngitis (3–6 weeks after skin infection) with oliguria, haematuria (red cell casts), oedema, hypertension, low C3; good prognosis in children; treatment supportive (antibiotics to eradicate strep, no steroids).", "t": "Hyaline casts are non-specific — red cell casts are diagnostic.", "r": "Cummings Ch. Pharyngitis", "note": ""}, {"n": 194, "sec": "General (Systemic Diseases in ORL 10(14)", "stem": "Regarding chronic granulomatous diseases: 60", "opts": [["A", "Wegener granulomatosis is a unilateral disease of the ear."], ["B", "Most granulomas in the lungs are caused by mycobacterial or fungal infections."], ["C", "In chronic granulomas lymphocytes are unable to produce hydrogen peroxide."], ["D", "Hydrogen peroxide is quite favourable for some bacteria and fungi to produce granulomas."]], "marked": ["B"], "a": "B", "e": "Most pulmonary granulomas are caused by infections — mycobacteria and fungi (histoplasma, coccidioides). Wegener (GPA) of the ear is usually bilateral; in chronic granulomatous disease, NEUTROPHILS (NADPH oxidase defect) cannot produce hydrogen peroxide.", "t": "", "r": "Cummings Ch. Granulomatous Diseases", "note": ""}, {"n": 195, "sec": "General (Systemic Diseases in ORL 10(14)", "stem": "The lower part of the tonsillar bed is crossed by which nerve? 80", "opts": [["A", "Vagus"], ["B", "Hypoglossal"], ["C", "Lingual"], ["D", "Glossopharyngeal"]], "marked": ["D"], "a": "D", "e": "The glossopharyngeal nerve lies deep to the lower part of the tonsillar bed (on the superior constrictor/ stylopharyngeus) — at risk at the inferior pole (taste loss, referred otalgia).", "t": "", "r": "Cummings Ch. Tonsillectomy", "note": ""}, {"n": 196, "sec": "General (Systemic Diseases in ORL 10(14)", "stem": "Which one of the following conditions is related to Heerfordt syndrome?", "opts": [["A", "Wegener's granulomatosis"], ["B", "Syphilis"], ["C", "Sarcoidosis"], ["D", "Leprosy"]], "marked": ["C"], "a": "C", "e": "Heerfordt syndrome (uveoparotid fever) = sarcoidosis: fever, parotitis, uveitis, facial palsy.", "t": "", "r": "Cummings", "note": ""}, {"n": 197, "sec": "Pediatric ORL 25(30)", "stem": "A 3 year old boy had tracheostomy after a prolonged endotracheal intubation post cardiac surgery referred for decannulation. Airway assessment showed grade IV subglottic stenosis (Cotton-Myer grading system). Which one of the following is the best management option?", "opts": [["A", "Laryngeal expansion"], ["B", "Posterior cricoid split"], ["C", "Anterior cricoid split"], ["D", "Cricotracheal resection"]], "marked": ["D"], "a": "D", "e": "Grade IV (no lumen) paediatric subglottic stenosis: partial cricotracheal resection (best decannulation rates for grade III–IV, provided ≥4 mm margin below cords). LTR with grafts for grade II–III.", "t": "Anterior cricoid split is for neonates.", "r": "Monnier; Cummings Pediatric", "note": ""}, {"n": 198, "sec": "Pediatric ORL 25(30)", "stem": "A 4-year-old boy presented with stridor after prolonged intubation. Airway assessment showed a posterior glottic stenosis. Which one of the following is the best management option?", "opts": [["A", "Anterior and posterior cricoid split with cartilage interposition"], ["B", "Posterior cricoid split with or without cartilage interposition"], ["C", "Laryngotracheoplasty"], ["D", "Laryngeal expansion"]], "marked": ["B"], "a": "B", "e": "Paediatric posterior glottic stenosis: posterior cricoid split with (or without) costal cartilage graft interposition (endoscopic or open) to widen the posterior glottis.", "t": "", "r": "Cummings Pediatric Ch. Laryngeal Stenosis", "note": ""}, {"n": 199, "sec": "Pediatric ORL 25(30)", "stem": "A 3-year-old boy was brought to the emergency department with history suggestive of a caustic ingestion. Oesophagoscopy showed severe caustic burns. Which one of the following is the most likely caustic agent?", "opts": [["A", "Sulphuric acid"], ["B", "HCl drain cleaner"], ["C", "NaOH drain cleaner"], ["D", "Liquid Ammonia"]], "marked": ["C"], "a": "C", "e": "Alkalis (sodium hydroxide drain cleaners) cause the most severe oesophageal injury — liquefactive necrosis with deep penetration, little taste warning. Acids cause coagulative necrosis (eschar limits depth), more gastric injury.", "t": "", "r": "Cummings Pediatric Ch. Caustic Ingestion", "note": ""}, {"n": 200, "sec": "Pediatric ORL 25(30)", "stem": "A 5-year-old boy presented with recurrent painful left parotid gland swelling of 3 years duration. Which one of the following is the most likely diagnosis?", "opts": [["A", "Mumps"], ["B", "Recurrent parotitis"], ["C", "Sialolithiasis"], ["D", "Sjogren’s disease"]], "marked": ["B"], "a": "B", "e": "Recurrent painful parotid swelling over years in a young child = juvenile recurrent parotitis (sialectasis), usually resolves at puberty.", "t": "", "r": "Cummings Pediatric", "note": ""}, {"n": 201, "sec": "Pediatric ORL 25(30)", "stem": "A 9 months old boy was brought to your clinic with history of stridor. Airway assessment showed type III laryngomalcia. Which one of the following would be the most likely cause?", "opts": [["A", "Retrognathia"], ["B", "Nasopharyngeal mass"], ["C", "Short neck"], ["D", "Floor of the mouth mass"]], "marked": ["A"], "a": "A", "e": "Type III laryngomalacia (Olney — posterior collapse/ retroflexion of epiglottis) is associated with neurological disorders and craniofacial anomalies such as retrognathia (Pierre Robin).", "t": "", "r": "Olney 1999; Cummings Pediatric", "note": ""}, {"n": 202, "sec": "Pediatric ORL 25(30)", "stem": "A 1 months old boy presented with stridor. Fiberoptic laryngoscopy revealed type I laryngomalcia. Which one of the best describes this type of laryngomalcia?", "opts": [["A", "Short aryepiglottic folds with tubular epiglottis"], ["B", "Hypertrophied redundant arytenoid mucosae"], ["C", "Retroflexed epiglottis obscuring the airway"], ["D", "Inward collapse of aryepiglottic folds"]], "marked": ["D"], "a": "D", "e": "Using the Holinger classification (type 1 = inward collapse of the aryepiglottic folds; 2 = long tubular curled epiglottis; 3 = anterior/ medial collapse of arytenoids; 4 = posterior epiglottis; 5 = short AE folds), type I = inward collapse of AE folds. In the Olney classification, type 1 = prolapse of redundant arytenoid mucosa (option B).", "t": "Know which classification the question uses — source key D (Holinger).", "r": "Holinger & Konior 1989; Olney 1999", "note": "Classification-dependent."}, {"n": 203, "sec": "Pediatric ORL 25(30)", "stem": "Which one of the following is the most common congenital laryngeal anomalies?", "opts": [["A", "Laryngomalacia"], ["B", "Laryngeal cleft"], ["C", "Glottic stenosis"], ["D", "Vocal cord paralysis"]], "marked": ["A"], "a": "A", "e": "Laryngomalacia is the commonest congenital laryngeal anomaly (~60%) and commonest cause of infant stridor; vocal cord paralysis is second, subglottic stenosis third.", "t": "", "r": "Cummings Pediatric", "note": ""}, {"n": 204, "sec": "Pediatric ORL 25(30)", "stem": "Which one of the following can differentiate vocal cord immobility due to a neurogenic cause from posterior glottic stenosis in children?", "opts": [["A", "History of prior intubation"], ["B", "Type of delivery"], ["C", "Presence of skin lesion"], ["D", "Apgar score"]], "marked": ["A"], "a": "A", "e": "History of prior intubation favours posterior glottic stenosis (fixation) over neurogenic paralysis; definitive differentiation is passive arytenoid palpation under GA and laryngeal EMG.", "t": "", "r": "Cummings Pediatric", "note": ""}, {"n": 205, "sec": "Pediatric ORL 25(30)", "stem": "In an infant with bilateral vocal cord paralysis which one of the following should be ruled out?", "opts": [["A", "Arlond chiari malformation"], ["B", "Neurological abnormalities"], ["C", "Rheumatological disorders"], ["D", "Delivery trauma"]], "marked": ["A"], "a": "A", "e": "Bilateral vocal cord paralysis in an infant: exclude central causes — Arnold-Chiari malformation (brainstem compression/ hydrocephalus) → MRI brain; decompression may restore movement.", "t": "", "r": "Cummings Pediatric", "note": ""}, {"n": 206, "sec": "Pediatric ORL 25(30)", "stem": "A newborn presented with noisy breathing. Airway assessment showed a localized pulsatile tracheomalcia. Which one of the following is the most likely cause?", "opts": [["A", "Vascular ring"], ["B", "Cardiac anomalies"], ["C", "Tracheoesophageal fistula"], ["D", "Neck mass"]], "marked": ["A"], "a": "A", "e": "Localised pulsatile tracheal compression = extrinsic vascular compression — innominate artery compression or vascular ring (double aortic arch). Confirm with CT angiography/ MRI.", "t": "", "r": "Cummings Pediatric Ch. Tracheomalacia", "note": ""}, {"n": 207, "sec": "Pediatric ORL 25(30)", "stem": "A 3-year old child with cleft palate presented with impaired hearing. On examination a moderately enlarged tonsils and large adenoids filling the nasopharynx were seen through a wide cleft palate. Ear examination showed retracted tympanic membrane with evidence of middle ear effusion in both ears. Which one of the following are you going to advise?", "opts": [["A", "Tonsillectomy"], ["B", "Adenoidectomy"], ["C", "Adenotonsillectomy"], ["D", "Permanent ventilation tubes"]], "marked": ["D"], "a": "D", "e": "Cleft palate with OME: long-term ventilation tubes (persistent ET dysfunction from tensor veli palatini). Adenoidectomy contraindicated (worsens VPI).", "t": "", "r": "Cummings Pediatric", "note": ""}, {"n": 208, "sec": "Pediatric ORL 25(30)", "stem": "A 10-year old boy presenting to the ER with torticollis, tender swelling behind the angle of the mandible and fever. He had history of a long-standing ear discharge. Ear examination showed profuse greenish purulent discharge. What is the most probable diagnosis?", "opts": [["A", "Acute lymphadenitis secondary to otitis media"], ["B", "Masked Mastoiditis"], ["C", "Bezold’s abscess"], ["D", "Petrositis"]], "marked": ["C"], "a": "C", "e": "Chronic discharging ear + fever + tender swelling behind angle of mandible with torticollis (SCM spasm) = Bezold abscess (mastoid tip perforation medial to SCM insertion).", "t": "", "r": "Ballenger", "note": ""}, {"n": 209, "sec": "Pediatric ORL 25(30)", "stem": "A 5-years old feverish child diagnosed as having an acute epiglottitis was rushed to the emergency room. What is your first line of management?", "opts": [["A", "Broad-spectrum IV antibiotics"], ["B", "Antipyretics"], ["C", "Air-way support"], ["D", "X-ray to assess the airway"]], "marked": ["C"], "a": "C", "e": "Acute epiglottitis: airway support first — controlled transfer to theatre to secure airway (gas induction, intubation; tracheostomy backup), then IV antibiotics. Avoid distressing the child/ X-ray/ throat examination.", "t": "", "r": "Cummings Pediatric", "note": ""}, {"n": 210, "sec": "Pediatric ORL 25(30)", "stem": "A child inhaled a pea nut. How are you going to proceed?", "opts": [["A", "Administration of antibiotics and observation."], ["B", "Just observation if the X-ray is free."], ["C", "Immediate bronchoscopy, even if the X-ray is free."], ["D", "Bronchoscopy when the child is distressed."]], "marked": ["C"], "a": "C", "e": "Peanut (organic) aspiration: immediate rigid bronchoscopy even with a normal X-ray — organic material swells and causes inflammation.", "t": "Most FBs are radiolucent.", "r": "Cummings Pediatric", "note": ""}, {"n": 211, "sec": "Pediatric ORL 25(30)", "stem": "One of the following is not a contraindication for tonsillectomy:", "opts": [["A", "Hemophilia"], ["B", "One attack of quinsy 2 months ago"], ["C", "Active rheumatic arthritis"], ["D", "Acute tonsillitis"]], "marked": [], "a": "B", "e": "One attack of quinsy 2 months ago is NOT a contraindication — interval tonsillectomy after quinsy is an indication (especially with recurrent tonsillitis). Contraindications: uncorrected haemophilia/ bleeding disorder, active acute infection (operate after 2–3 weeks), uncontrolled systemic disease (active rheumatic fever/ arthritis).", "t": "", "r": "Scott-Brown; AAO-HNS Tonsillectomy Guideline 2019", "note": "Unmarked in source — answer added."}, {"n": 212, "sec": "Pediatric ORL 25(30)", "stem": "A 3-year-old child presents with 6 hours of progressive sore throat, fever and drooling. The best initial step in treatment is:", "opts": [["A", "To check the WBC count"], ["B", "To establish a safe airway"], ["C", "IV antibiotics"], ["D", "To obtain radiographic studies"]], "marked": ["B"], "a": "B", "e": "Rapid-onset sore throat, fever and drooling in a toddler = epiglottitis → establish a safe airway first.", "t": "", "r": "Cummings Pediatric", "note": ""}, {"n": 213, "sec": "Pediatric ORL 25(30)", "stem": "The most common cause of facial paralysis in children is :", "opts": [["A", "Bell's palsy"], ["B", "Birth trauma"], ["C", "Acute otitis media"], ["D", "Temporal bone fractures"]], "marked": ["A"], "a": "A", "e": "Bell's palsy is the commonest cause of facial paralysis in children overall; other causes: AOM, trauma, Lyme disease (endemic areas), Ramsay Hunt, tumours. Birth trauma is commonest in neonates.", "t": "", "r": "Cummings Pediatric Ch. Facial Paralysis", "note": ""}, {"n": 214, "sec": "Pediatric ORL 25(30)", "stem": "One of the following is not associated with increased risk of obstructive sleep apnoea OSA in children :", "opts": [["A", "Cerebral palsy"], ["B", "Sickle cell disease"], ["C", "Diabetes"], ["D", "Achondroplasia"]], "marked": ["C"], "a": "C", "e": "Paediatric OSA risk factors: adenotonsillar hypertrophy, obesity, craniofacial anomalies (achondroplasia, Down, Pierre Robin), neuromuscular disease (cerebral palsy), sickle cell disease. Diabetes is not a recognised risk factor.", "t": "", "r": "AAP OSA guideline; Cummings Pediatric", "note": ""}, {"n": 215, "sec": "Pediatric ORL 25(30)", "stem": "The commonest site for TGDC Thyroglossal duct cyst is :", "opts": [["A", "Lingual"], ["B", "Suprahyoid"], ["C", "Infrahyoid"], ["D", "Prethyroid"]], "marked": ["C"], "a": "C", "e": "Thyroglossal duct cysts: ~60–65% infrahyoid/ adjacent to hyoid, ~20–25% suprahyoid, ~8% at hyoid level, lingual rare; move with tongue protrusion. Sistrunk operation.", "t": "", "r": "Cummings Pediatric", "note": ""}, {"n": 216, "sec": "Pediatric ORL 25(30)", "stem": "Regarding acute Epiglottitis of childhood:", "opts": [["A", "Age is usually five year"], ["B", "History is slowly progressive"], ["C", "Speech is not affected"], ["D", "Responsible organism is H influenzae"]], "marked": ["D"], "a": "D", "e": "Classic paediatric epiglottitis: H. influenzae type b (now rare post-Hib vaccine; S. pyogenes, S. pneumoniae, S. aureus more common now), age 2–6 years, rapid onset, muffled \"hot potato\" voice, drooling, tripod posture, toxic.", "t": "", "r": "Cummings Pediatric", "note": ""}, {"n": 217, "sec": "Pediatric ORL 25(30)", "stem": "The most effective treatment modality for juvenile respiratory papillomatosis:", "opts": [["A", "Powered microdebrider"], ["B", "Cold – steel surgery"], ["C", "Co2 laser"], ["D", "KTP laser"]], "marked": ["A"], "a": "A", "e": "Powered microdebrider is now the preferred surgical tool for RRP — faster, less thermal injury and scarring, better voice outcomes than CO2 laser (Pasquale 2003); CO2/ KTP laser remain alternatives.", "t": "", "r": "Cummings Pediatric Ch. RRP", "note": ""}, {"n": 218, "sec": "Pediatric ORL 25(30)", "stem": "A 3-year-old boy presented with acute respiratory distress, spasmodic cough, cyanosis and active accessory respiratory muscles. The most probable diagnosis is:", "opts": [["A", "Acute follicular tonsillitis"], ["B", "Foreign body inhalation"], ["C", "Laryngomalacia"], ["D", "Vocal cord nodule"]], "marked": ["B"], "a": "B", "e": "Sudden respiratory distress with spasmodic cough and cyanosis in a toddler = foreign body inhalation → rigid bronchoscopy.", "t": "", "r": "Cummings Pediatric", "note": ""}, {"n": 219, "sec": "Pediatric ORL 25(30)", "stem": "The best treatment for a 1- year old child with unilateral vocal cord paralysis is:", "opts": [["A", "Tracheostomy"], ["B", "Gel foam injection into the paralyzed cord"], ["C", "Teflon injection"], ["D", "Observation"]], "marked": ["D"], "a": "D", "e": "Unilateral vocal cord paralysis in an infant usually compensates; observation (recovery possible up to 1–2 years); feeding/ swallow assessment. Injection (temporary) if aspiration; Teflon is obsolete; tracheostomy only for bilateral paralysis.", "t": "", "r": "Cummings Pediatric", "note": ""}, {"n": 220, "sec": "Pediatric ORL 25(30)", "stem": "Which one of the following is the most common benign parotid tumor in children?", "opts": [["A", "Lipoma"], ["B", "Pleomorphic adenoma"], ["C", "Hemangioma"], ["D", "Lymphoepithelial cyst"]], "marked": ["C"], "a": "C", "e": "Most common parotid tumour in children overall = infantile haemangioma (non-epithelial). Most common benign epithelial tumour = pleomorphic adenoma.", "t": "Read \"benign\" vs \"epithelial\" carefully.", "r": "Cummings Pediatric Salivary", "note": ""}, {"n": 221, "sec": "Pediatric ORL 25(30)", "stem": "A 4 years old girl is diagnosed as having recurrent respiratory papillomatosis, with mild respiratory distress. The best management is:", "opts": [["A", "Tracheostomy"], ["B", "Micro-laryngoscopy excision"], ["C", "Antiviral"], ["D", "Steroids"]], "marked": ["B"], "a": "B", "e": "RRP with mild respiratory distress: microlaryngoscopy with excision/ debulking (microdebrider or laser), preserving normal mucosa. Avoid tracheostomy (distal seeding). Adjuvants for frequent recurrence.", "t": "", "r": "Cummings Pediatric", "note": ""}, {"n": 222, "sec": "Pediatric ORL 25(30)", "stem": "Regarding acute epiglottitis of childhood :", "opts": [["A", "Age is usually seven years"], ["B", "History is slowly progressive"], ["C", "Speech is not affected"], ["D", "Child is toxic"]], "marked": ["D"], "a": "D", "e": "Same as Q216 — the child with epiglottitis is toxic, rapid course, age 2–6 years, muffled voice.", "t": "", "r": "Cummings Pediatric
