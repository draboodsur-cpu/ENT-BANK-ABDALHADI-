<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENT Revision Bank — Interactive MCQs</title>
<style>
:root{
  --paper:#F6F8F7; --card:#FFFFFF; --ink:#16252C; --muted:#5B6B72; --line:#D9E1E0;
  --teal:#0E6B73; --teal-soft:#E3F0F0; --ok:#2F7D4F; --ok-soft:#E5F3EA; --bad:#B4412E; --bad-soft:#F9E7E3;
  --amber:#8F5E00; --amber-soft:#FBF1DC; --focus:#0E6B73;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#101A1E; --card:#17242A; --ink:#E4ECEC; --muted:#9AAEB2; --line:#2A3A40;
    --teal:#5DBAC2; --teal-soft:#1B3438; --ok:#6CC490; --ok-soft:#173226; --bad:#EE8B78; --bad-soft:#3A201B;
    --amber:#E5B95C; --amber-soft:#33291A; --focus:#5DBAC2;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top{max-width:760px;margin:0 auto;padding:12px 16px 8px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{font:600 18px/1.2 "Iowan Old Style",Charter,Georgia,serif;margin:0;flex:1;min-width:200px}
.score{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.score b{color:var(--ink)}
.bar{height:3px;background:var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
.chips{max-width:760px;margin:0 auto;padding:8px 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--paper)}
.chip small{opacity:.75;margin-left:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 8px}
.tool{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.tool[aria-pressed="true"]{color:var(--teal);border-color:var(--teal);background:var(--teal-soft)}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 20px 18px;margin-top:8px}
.qmeta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;margin-bottom:10px}
.stem{font:400 18px/1.55 "Iowan Old Style",Charter,Georgia,serif;margin:0 0 16px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:transparent;border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--teal)}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;border:1px solid var(--line)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .L{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .L{background:var(--bad);border-color:var(--bad);color:var(--card)}
.exp{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.exp{animation:none}.bar i{transition:none}}
.verdict{font-weight:600;margin:0 0 8px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.exp p{margin:0 0 10px}
.trap{background:var(--bad-soft);border-left:3px solid var(--bad);padding:8px 12px;border-radius:0 8px 8px 0;font-size:14px}
.note{background:var(--amber-soft);border-left:3px solid var(--amber);padding:8px 12px;border-radius:0 8px 8px 0;font-size:14px;color:var(--ink)}
.ref{color:var(--muted);font-size:13px;font-style:italic}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);z-index:5}
.nav div{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--paper);font-weight:600}
.pos{flex:1;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.grid{display:none;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:12px}
.grid.show{display:grid}
.cell{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 0;font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--teal);outline-offset:1px}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:12.5px;margin-top:22px;line-height:1.5}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>ENT Revision Bank</h1>
    <div class="score" id="score"></div>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="chips" id="chips" role="toolbar" aria-label="Sections"></div>
</header>
<main class="wrap">
  <div class="tools">
    <button class="tool" id="fWrong" aria-pressed="false">Wrong answers only</button>
    <button class="tool" id="fUn" aria-pressed="false">Unanswered only</button>
    <button class="tool" id="fChg" aria-pressed="false">Flagged questions</button>
    <button class="tool" id="gridBtn" aria-pressed="false">Question map</button>
    <button class="tool" id="reset">Reset progress</button>
  </div>
  <div class="grid" id="grid"></div>
  <div id="view"></div>
  <p class="foot">Answers verified against Cummings, Scott-Brown, Bailey, Ballenger, KJ Lee, AJCC 8th, NCCN, ATA 2015, EPOS 2020 and current guidelines. Amber notes mark questions where the answer differs from the original key or the question is contested. Keyboard: A–D to answer, ← → to move.</p>
</main>
<nav class="nav"><div>
  <button class="btn" id="prev">Previous</button>
  <span class="pos" id="pos"></span>
  <button class="btn primary" id="next">Next</button>
</div></nav>
<script>
const DATA = [{"n": 1, "sec": "Otology 30 (35)", "stem": "A 30-year-old man had trauma followed by hearing impairment. Which one of the following is the most common traumatic ossicular abnormality?", "opts": [["A", "Malleus dislocation"], ["B", "Incudostapedial joint disarticulation"], ["C", "Fracture of incus long process"], ["D", "Fracture of stapes supra structure"]], "marked": [], "a": "B", "e": "Incudostapedial joint separation is the commonest traumatic ossicular injury (the long process of incus is the weakest link, tethered between the mobile malleus and the stapes), followed by incus dislocation and stapes crura fracture. Ossicular discontinuity behind an intact drum gives the largest conductive loss (~55–60 dB).", "t": "Commonest ossicular EROSION in CSOM is also the long process of incus — don't confuse trauma vs infection.", "r": "Cummings Ch. Temporal Bone Trauma; Scott-Brown Vol 2", "note": "Unmarked in source — answer added."}, {"n": 2, "sec": "Otology 30 (35)", "stem": "A 28 year old man diagnosed to have superior canal dehiscence. Which one of the symptoms is the least likely to improve following surgical intervention?", "opts": [["A", "Autophony"], ["B", "Hyperacusis"], ["C", "Tinnitus"], ["D", "Hearing loss"]], "marked": ["D"], "a": "D", "e": "After plugging/resurfacing of SSCD, autophony, sound/pressure-induced vertigo (Tullio, Hennebert), hyperacusis and pulsatile tinnitus improve in most; the hearing component is least predictable — the low-frequency ABG may not close and there is a small risk of SNHL.", "t": "Patients operated for disabling vestibular/autophony symptoms, not for hearing.", "r": "Minor 2005; Cummings Ch. SSCD", "note": ""}, {"n": 3, "sec": "Otology 30 (35)", "stem": "A 35-year-old man had facial nerve paralysis (House-Brackmann grade VI) two years ago following temporal bone fracture. What is the most helpful test to determine the best treatment result for reanimation?", "opts": [["A", "Contracted temporal bone CT scan"], ["B", "Electroneuronography"], ["C", "Maximum stimulation test"], ["D", "Electromyography"]], "marked": ["D"], "a": "D", "e": "Two years after complete palsy, ENoG/MST are useless (they need distal Wallerian degeneration timing in the first 3 weeks). Needle EMG decides reanimation: fibrillation potentials = viable denervated muscle (nerve graft/ hypoglossal–facial transfer possible); polyphasic potentials = reinnervation; electrical silence = atrophy → dynamic muscle transfer (temporalis, free gracilis).", "t": "ENoG = acute (day 3–14); EMG = late (>2–3 weeks) and for reanimation planning.", "r": "Cummings Ch. Facial Nerve Testing & Reanimation", "note": ""}, {"n": 4, "sec": "Otology 30 (35)", "stem": "A 38 year old woman presented with history of right ear hearing impairment and was diagnosed to have autoimmune sensory neural hearing loss. Which one of the following is the most common feature of this type of hearing loss?", "opts": [["A", "Sudden hearing loss"], ["B", "Rapidly progressive hearing loss"], ["C", "Slowly progressive hearing loss"], ["D", "Sudden hearing loss with severe vertigo"]], "marked": ["B"], "a": "B", "e": "Autoimmune inner ear disease (AIED): bilateral (often asymmetric) SNHL progressing over weeks to months (rapidly progressive, faster than presbycusis, slower than sudden), fluctuating, ± vestibular symptoms in ~50%. Diagnosis is clinical with response to steroids; anti-hsp70 supportive.", "t": "Sudden (<72 h) = SSNHL; slowly progressive over years = presbycusis/ otosclerosis.", "r": "McCabe 1979; Cummings Ch. AIED", "note": ""}, {"n": 5, "sec": "Otology 30 (35)", "stem": "Which of the following determines the duration of antimicrobial therapy in patients with necrotizing external otitis?", "opts": [["A", "Serum glucose level."], ["B", "Gallium scan and ESR"], ["C", "Magnetic resonance imaging."], ["D", "Relief of symptoms."]], "marked": ["B"], "a": "B", "e": "Necrotising otitis externa is treated 6–8 weeks with anti-pseudomonal therapy; duration is guided by clinical response plus normalisation of gallium-67 (or indium-WBC) scan and falling ESR/CRP. Technetium bone scan stays positive for months (bone remodelling) and cannot guide stopping.", "t": "Gallium = follow-up; technetium = early diagnosis; CT = first-line extent imaging.", "r": "Ballenger; Cummings Ch. External Ear Infections", "note": ""}, {"n": 6, "sec": "Otology 30 (35)", "stem": "A 2 years old child presents with chronic draining right and conductive hearing loss. On examination you detect a right postauricular swelling and a purpuric skin rash in the diaper area. What is the most probable diagnosis?", "opts": [["A", "Congenital cholesteatoma"], ["B", "Acute coalescent Mastoiditis"], ["C", "Langerhans cell histiocytosis"], ["D", "Rhabdomyosarcoma"]], "marked": ["C"], "a": "C", "e": "Toddler with chronic ear discharge, postauricular (lytic temporal bone) swelling and a purpuric/seborrhoeic diaper-area rash = Langerhans cell histiocytosis. Look for diabetes insipidus, lytic skull lesions. Biopsy: CD1a, S100, langerin (CD207), Birbeck granules.", "t": "Mimics mastoiditis/ CSOM; rhabdomyosarcoma presents with aural polyp/ bleeding and facial palsy.", "r": "Cummings Pediatric; Scott-Brown Vol 2", "note": ""}, {"n": 7, "sec": "Otology 30 (35)", "stem": "A 57-years old man presents with history of progressive left-sided hearing loss for 5 months. He has no concerns with hearing in his right ear. An audiogram confirms this unilateral sensorineural hearing loss. What is the next step in management?", "opts": [["A", "Reassurance and repeat audiogram in 6 months"], ["B", "Intratympanic steroid injection"], ["C", "MRI"], ["D", "CT with contrast"]], "marked": ["C"], "a": "C", "e": "Progressive unilateral (asymmetric) SNHL must be imaged to exclude vestibular schwannoma/ retrocochlear pathology: gadolinium-enhanced MRI of IAM/CPA (or high-resolution T2 FIESTA/CISS screening).", "t": "CT misses small intracanalicular tumours; waiting 6 months is unacceptable.", "r": "AAO-HNS; Cummings Ch. Vestibular Schwannoma", "note": ""}, {"n": 8, "sec": "Otology 30 (35)", "stem": "A 39-year-old man is seen with chronically draining left ear and has positive fistula test in that ear. Computed tomography scan suggests possible erosion of the lateral semicircular canal. Against which of the following pairs of microorganisms should antibiotic therapy be directed?", "opts": [["A", "Pseudomonas aeruginosa and Mycoplasma pneumoniae"], ["B", "Haemophilus influenzae and Bacteroides fragilis"], ["C", "Haemophilus influenzae and Streptococcus pneumoniae"], ["D", "Pseudomonas aeruginosa and Bacteroides fragilis"]], "marked": ["D"], "a": "D", "e": "Chronically discharging ear with labyrinthine fistula (cholesteatoma eroding LSCC): CSOM flora is polymicrobial — Pseudomonas aeruginosa (commonest), S. aureus, Proteus, and anaerobes (Bacteroides fragilis, Peptostreptococcus). Cover Pseudomonas + anaerobes; definitive treatment is surgery.", "t": "H. influenzae + S. pneumoniae = acute otitis media.", "r": "Ballenger; Cummings Ch. Chronic Otitis Media", "note": ""}, {"n": 9, "sec": "Otology 30 (35)", "stem": "Which one of the following studies is the best to diagnose lateral sinus thrombosis?", "opts": [["A", "Ultrasonography."], ["B", "Jugular venography."], ["C", "Enhanced magnetic resonance imaging"], ["D", "Enhanced computed tomography."]], "marked": ["C"], "a": "C", "e": "Lateral (sigmoid) sinus thrombosis is best diagnosed by contrast-enhanced MRI with MR venography (thrombus signal, loss of flow void). Contrast CT shows the \"empty delta\" sign and CT venography is an accepted alternative; angiography/ jugular venography are obsolete as first-line.", "t": "Plain CT may be normal early.", "r": "Ballenger; Cummings Ch. Intracranial Complications", "note": ""}, {"n": 10, "sec": "Otology 30 (35)", "stem": "Which one of the following patients is most likely to have an encephalocele and CSF leak?", "opts": [["A", "A 43 year with a 35 dB conductive hearing loss and apparent serous otitis media"], ["B", "A 37 year man with previously un-operated cholesteatoma"], ["C", "A 21 year man scheduled for his fourth operation for cholesteatoma"], ["D", "A 17 year girl with her fourth episode of meningitis"]], "marked": ["C"], "a": "C", "e": "Temporal bone encephalocele/ CSF leak is most often iatrogenic — after mastoid surgery with tegmen violation, especially multiple revision procedures. Spontaneous encephaloceles occur in obese middle-aged women (presenting as \"serous otitis media\"), and congenital defects may present with recurrent meningitis.", "t": "Option A describes the classic spontaneous presentation, but repeated surgery carries the highest likelihood.", "r": "Ballenger; Cummings Ch. CSF Otorrhoea", "note": ""}, {"n": 11, "sec": "Otology 30 (35)", "stem": "Which of the following therapies is an accepted therapy for confirmed autoimmune inner ear disease?", "opts": [["A", "High-dose prednisone (60 mg) for at least several weeks"], ["B", "Trans-tympanic cyclophosphamide 1 mg/mL daily for 2 weeks."], ["C", "Perilymph perfusion with dexamethasone."], ["D", "Oral famciclovir for herpes virus."]], "marked": ["A"], "a": "A", "e": "Accepted treatment of AIED: high-dose oral prednisone (60 mg/day or 1 mg/kg) for ~4 weeks, then taper if responding; intratympanic steroids as adjunct; steroid-sparing agents (methotrexate, biologics such as anakinra/ rituximab) for steroid-dependent patients. Cyclophosphamide is systemic and reserved for refractory cases.", "t": "Antivirals have no role.", "r": "Ballenger; Cummings Ch. AIED", "note": ""}, {"n": 12, "sec": "Otology 30 (35)", "stem": "Which one of the following procedures for facial reanimation will you adopt to treat a patient with hemi facial paralysis of 3 years duration following an iatrogenic facial nerve injury?", "opts": [["A", "End-to end anastomosis of the nerve cable"], ["B", "Cable nerve grafting"], ["C", "Hypoglossal-facial nerve anastomosis"], ["D", "Muscle transplant/transfer procedure"]], "marked": ["D"], "a": "D", "e": "After ~2 years of denervation, facial muscles atrophy and motor end-plates are lost, so nerve repair/ grafting/ hypoglossal transfer fail. At 3 years, dynamic reanimation needs new muscle: regional (temporalis tendon transfer/ lengthening myoplasty) or free functional muscle transfer (gracilis) with cross-face graft or masseteric nerve.", "t": "Hypoglossal–facial transfer requires viable mimetic muscles (<2 years).", "r": "Cummings Ch. Facial Reanimation", "note": ""}, {"n": 13, "sec": "Otology 30 (35)", "stem": "Which one of the following tests is the most accurate in diagnosing facial nerve degeneration?", "opts": [["A", "Nerve excitability"], ["B", "Electromyography"], ["C", "Electroneuronography"], ["D", "Stapedial reflex."]], "marked": ["C"], "a": "C", "e": "Electroneuronography (evoked EMG) is the most accurate objective test of the proportion of degenerated fibres (compares CMAP amplitudes side-to-side) between day 3 and day 14–21 after onset. ≥90% degeneration within 14 days (in trauma/ Bell's) supports decompression.", "t": "NET/MST are subjective; EMG detects voluntary activity, not the degree of degeneration.", "r": "Fisch; Cummings Ch. Facial Nerve Testing", "note": ""}, {"n": 14, "sec": "Otology 30 (35)", "stem": "The main differential diagnosis of bullous myringitis (Myringitis bullosa haemorrhagica) is:", "opts": [["A", "Acute otitis media."], ["B", "Otitis externa"], ["C", "Ramsay – Hunt syndrome"], ["D", "Eczema"]], "marked": ["C"], "a": "C", "e": "Bullous myringitis (haemorrhagic bullae on TM/ deep canal, severe pain; viral/ Mycoplasma/ S. pneumoniae) is mainly differentiated from herpes zoster oticus (Ramsay Hunt: vesicles on concha/ canal, facial palsy, SNHL). It may coexist with AOM; SNHL in up to 1/3.", "t": "Ramsay Hunt has facial palsy; bullous myringitis usually doesn't.", "r": "KJ Lee; Cummings", "note": ""}, {"n": 15, "sec": "Otology 30 (35)", "stem": "The commonest site for congenital cholesteatoma of the middle ear cavity is at the:", "opts": [["A", "Attic"], ["B", "Epitympanum"], ["C", "Hypotympanum"], ["D", "Anterior-superior quadrant"]], "marked": ["D"], "a": "D", "e": "Congenital cholesteatoma (Levenson criteria: white mass behind intact TM, no history of otorrhoea/ perforation/ prior surgery) is most commonly in the anterosuperior quadrant (near Eustachian tube/ tensor tympani — epidermoid formation remnant). Posterosuperior lesions occur in older children.", "t": "Attic = acquired pars flaccida cholesteatoma.", "r": "Levenson 1986; Cummings Pediatric", "note": ""}, {"n": 16, "sec": "Otology 30 (35)", "stem": "Regarding otosclerosis:", "opts": [["A", "Bilateral disease is commoner than unilateral"], ["B", "Middle ear compliance is always low"], ["C", "Persistent stapedial artery is a relative contra-indication for surgery"], ["D", "Chorda tympani is intentionally severed during surgery"]], "marked": ["A"], "a": "A", "e": "Otosclerosis is bilateral in ~70–80%. Compliance may be normal (As type) — not always low. A large persistent stapedial artery may force abandoning the procedure, but the chorda tympani should be preserved whenever possible, not severed intentionally.", "t": "\"Always/ intentionally\" statements are usually false.", "r": "Cummings Ch. Otosclerosis", "note": ""}, {"n": 17, "sec": "Otology 30 (35)", "stem": "The best treatment line of uncontrolled unilateral Meniere's disease with severe vertigo & profound sensory neural hearing loss is?", "opts": [["A", "Intratympanic injection of corticosteroids"], ["B", "Intratympanic injection of gentamycin"], ["C", "Labryinthectomy"], ["D", "Vestibular neurectomy"]], "marked": ["C"], "a": "C", "e": "Unilateral Ménière's with disabling vertigo and a dead (non-serviceable) ear: surgical labyrinthectomy gives the highest vertigo control (>95%) and is the definitive destructive option. Intratympanic gentamicin (~90%) is the less invasive alternative, preferred when some hearing remains.", "t": "Vestibular neurectomy is for intractable vertigo with SERVICEABLE hearing.", "r": "AAO-HNS Ménière's Guideline 2020; Cummings", "note": ""}, {"n": 18, "sec": "Otology 30 (35)", "stem": "The most common feature of autoimmune sensory neural hearing loss is?", "opts": [["A", "Sudden hearing loss"], ["B", "Rapidly progressive hearing loss"], ["C", "Slowly progressive hearing loss"], ["D", "Sudden hearing loss with severe vertigo"]], "marked": ["B"], "a": "B", "e": "Same concept as Q4: AIED typically presents as rapidly progressive (weeks–months), bilateral, fluctuating SNHL responsive to steroids.", "t": "", "r": "McCabe; Cummings", "note": "Same as Q4."}, {"n": 19, "sec": "Otology 30 (35)", "stem": "An 11- year- old boy presented with unilateral hearing loss, type A tympanogram, the most likely diagnosis is:", "opts": [["A", "SNHL due to Mumps"], ["B", "Congenital fixation of the malleus"], ["C", "Otosclerosis"], ["D", "Congenital SNHL"]], "marked": ["A"], "a": "A", "e": "Unilateral SNHL in a school-age child with a normal type A tympanogram — mumps is the commonest acquired cause of unilateral profound SNHL in children (often unnoticed). Malleus fixation and otosclerosis are conductive (type A/As but with ABG); congenital SNHL is usually detected by newborn screening.", "t": "Normal tympanogram does not exclude conductive fixation — but the question implies SNHL.", "r": "Cummings Pediatric Ch. Hearing Loss", "note": ""}, {"n": 20, "sec": "Otology 30 (35)", "stem": "Familial Amino glycoside Ototoxicity.", "opts": [["A", "Occurs mostly in Chinese"], ["B", "Is non syndromic autosomal recessive"], ["C", "Causes maternally inherited non-syndromic hearing loss"], ["D", "Affects males exclusively"]], "marked": ["C"], "a": "C", "e": "Familial aminoglycoside ototoxicity is caused by the mitochondrial 12S rRNA A1555G (and C1494T) mutation — maternally inherited, non-syndromic; carriers may become deaf after a single dose. Described in many populations (high in Chinese and Spanish families), affects both sexes.", "t": "Mitochondrial = maternal transmission, males and females affected equally.", "r": "Cummings Ch. Genetic Hearing Loss", "note": ""}, {"n": 21, "sec": "Otology 30 (35)", "stem": "Which one of these treatments is the benchmark management of otitis media with effusion (OME)?", "opts": [["A", "Adenoidectomy"], ["B", "Corticoids"], ["C", "Mucokinetic agents"], ["D", "Tympanostomy tube"]], "marked": ["D"], "a": "D", "e": "Tympanostomy (ventilation) tube insertion is the benchmark/ first surgical treatment for persistent bilateral OME (≥3 months) with hearing loss or structural TM changes. Adenoidectomy is added for children ≥4 years or with repeat tubes/ nasal obstruction. Steroids, antihistamines, decongestants and mucolytics are NOT recommended.", "t": "Medical therapy for OME = watchful waiting only.", "r": "AAO-HNS OME Guideline 2016; Tympanostomy Tube Guideline 2022", "note": ""}, {"n": 22, "sec": "Otology 30 (35)", "stem": "Which one of these procedures should be included in the assessment of children with otitis media with effusion (OME)?", "opts": [["A", "CT temporal bone"], ["B", "Auditory evoked potentials"], ["C", "Age –appropriate vocal audiometry"], ["D", "Pharyngo-esophageal endoscopy"]], "marked": ["B"], "a": "C", "e": "Children with OME should have age-appropriate hearing testing (behavioural: VRA 6 m–2.5 y, play audiometry 2.5–5 y, conventional PTA/ speech audiometry older) when OME persists ≥3 months or with language delay. Auditory evoked potentials are only for children who cannot be tested behaviourally. CT and endoscopy are not part of routine OME assessment.", "t": "Source key marked B (evoked potentials) — guideline answer is age-appropriate audiometry.", "r": "AAO-HNS OME Guideline 2016", "note": "Changed from source key (B)."}, {"n": 23, "sec": "Otology 30 (35)", "stem": "Which one of the following is the most common post-operative complication of cochlear implant in children?", "opts": [["A", "Meningitis"], ["B", "Dizziness"], ["C", "Internal receiver migration"], ["D", "Facial nerve paralysis"]], "marked": ["C"], "a": "C", "e": "Paediatric cochlear implant complications: minor complications are commonest — wound/flap problems, then device (receiver-stimulator) migration/ extrusion, especially in young children with thin skulls (hence well/ subperiosteal pocket fixation). Meningitis and facial palsy are rare; dizziness is more frequent in adults.", "t": "If \"wound/flap infection\" is an option, choose it (2023 bank).", "r": "Cummings Ch. Cochlear Implantation", "note": ""}, {"n": 24, "sec": "Otology 30 (35)", "stem": "In patients with bilateral profound hearing loss following meningitis, cochlear implant should be performed within:", "opts": [["A", "1- 2 weeks"], ["B", "2-4 weeks"], ["C", "4-6 weeks"], ["D", "6-8 weeks"]], "marked": ["C"], "a": "B", "e": "After meningitis, labyrinthitis ossificans can start within 3–4 weeks and is often established by 2 months. Image early (MRI heavy T2 for loss of fluid signal + HRCT) and implant as soon as medically stable — within the first weeks. Source key gives 4–6 weeks; I give 2–4 weeks as the safest \"within\" window.", "t": "Principle examiners want: implant URGENTLY before ossification; bilateral implantation recommended.", "r": "Cummings; Scott-Brown Vol 2", "note": "Source key C (4–6 weeks) — contested between recalls."}, {"n": 25, "sec": "Otology 30 (35)", "stem": "Which one of these radiological studies is the best modality for diagnosis of necrotizing otitis externa?", "opts": [["A", "MRI"], ["B", "Gallium scintigraphy"], ["C", "Computed tomography"], ["D", "Technetium scintigraphy"]], "marked": ["C"], "a": "C", "e": "For diagnosis and extent of necrotising OE, CT temporal bone is the first-line imaging (bony erosion of canal floor, skull base, soft tissue). Technetium-99 scan is the most sensitive for early osteomyelitis; MRI best defines soft tissue/ marrow and intracranial extent; gallium follows response.", "t": "CT may be normal early (needs ~30–50% bone loss).", "r": "Cummings; Ballenger", "note": ""}, {"n": 26, "sec": "Otology 30 (35)", "stem": "Which one of these imaging modalities is the method of choice for the assessment of structural abnormalities of the temporal bone in cases of conductive or mixed hearing loss?", "opts": [["A", "Magnetic Resonance Imaging"], ["B", "High resolution computed tomography scan"], ["C", "Cone Beam Computed Tomography"], ["D", "Positron Emission Tomography"]], "marked": ["B"], "a": "B", "e": "High-resolution CT of the temporal bone is the method of choice for structural (bony) abnormalities in conductive/ mixed loss: ossicular chain, otosclerotic foci, SSCD, atresia, inner ear malformations. Cone-beam CT is an emerging lower-dose alternative.", "t": "MRI is for SNHL/ retrocochlear lesions.", "r": "Cummings Ch. Temporal Bone Imaging", "note": ""}, {"n": 27, "sec": "Otology 30 (35)", "stem": "What is the CT grading according to VEILLON classification for otosclerosis, if Computed tomography shows anterior fenestral hypo density > 1 mm, in contact with the cochlear endosteum?", "opts": [["A", "Type 1"], ["B", "Type 2"], ["C", "Type 3"], ["D", "Type 4"]], "marked": ["C"], "a": "C", "e": "Veillon CT classification of otosclerosis: 1a isolated thickened (>0.6 mm) footplate; 1b anterior fenestral hypodensity ≤1 mm; 2 anterior fenestral hypodensity >1 mm without cochlear endosteum contact; 3 >1 mm WITH contact with the cochlear endosteum; 4a pericochlear (anterior labyrinthine); 4b posterior labyrinthine (around SCC/ vestibule).", "t": "Type 3 and 4 = extensive forms with worse bone-conduction outcomes.", "r": "Veillon et al.; Otol Neurotol 2024 comparison", "note": "Verified against published Veillon tables."}, {"n": 28, "sec": "Otology 30 (35)", "stem": "The most informative imaging tool to assess cholesteatoma extension is:", "opts": [["A", "CT"], ["B", "Ultra Sound"], ["C", "MRI"], ["D", "PET Scan"]], "marked": ["A"], "a": "A", "e": "HRCT is the most informative tool for the extent of cholesteatoma pre-operatively — bony erosion (scutum, ossicles, tegmen, LSCC fistula, facial canal) and anatomy. Non-EPI diffusion-weighted MRI is best for distinguishing cholesteatoma from granulation and detecting residual/ recurrent disease.", "t": "Primary assessment = CT; residual/ recurrent = non-EPI DWI MRI.", "r": "Cummings Ch. Cholesteatoma; EAONO/JOS", "note": ""}, {"n": 29, "sec": "Otology 30 (35)", "stem": "The commonest site of a congenital cholesteatoma of the middle ear cavity is at the:", "opts": [["A", "Attic"], ["B", "Epitympanum"], ["C", "Anterior-superior quadrant"], ["D", "Posterior tympanum"]], "marked": ["C"], "a": "C", "e": "Same as Q15 — congenital cholesteatoma is commonest in the anterosuperior quadrant.", "t": "", "r": "Levenson", "note": "Same as Q15."}, {"n": 30, "sec": "Otology 30 (35)", "stem": "Future perspectives of managing congenital hearing loss is: 60", "opts": [["A", "Cochlear implant"], ["B", "Brainstem implant"], ["C", "Gene therapy"], ["D", "Stem cell implant"]], "marked": ["C"], "a": "C", "e": "Gene therapy (AAV-mediated) is the future for congenital genetic deafness — OTOF gene therapy for DFNB9 restored hearing in children in 2024 trials. Stem cell therapy remains experimental and further away.", "t": "CI is current, not \"future\", management.", "r": "Lancet/ NEJM OTOF trials 2024", "note": ""}, {"n": 31, "sec": "Otology 30 (35)", "stem": "In chronic suppurative otitis media: 60", "opts": [["A", "The middle ear mucosa is oedematous and infiltrated by neutrophils."], ["B", "Granulation tissue is intimately involved in bony destruction."], ["C", "Eosinophils secrete substances that facilitate tissue destruction."], ["D", "Ultimately cholesteatoma help in the healing process and fibrosis."]], "marked": ["B"], "a": "B", "e": "In CSOM, granulation tissue (with osteoclasts, cytokines, collagenases) is intimately involved in bone destruction (ossicular erosion) — even without cholesteatoma. Mucosa shows chronic inflammatory infiltrate (lymphocytes, plasma cells), not acute neutrophilic oedema.", "t": "Cholesteatoma causes destruction, not healing.", "r": "Ballenger; Cummings Ch. CSOM", "note": ""}, {"n": 32, "sec": "Otology 30 (35)", "stem": "One of the following nerves runs on the promontory: 60", "opts": [["A", "Posterior auricular"], ["B", "Jacobson’s"], ["C", "Chorda tympani"], ["D", "Facial"]], "marked": ["B"], "a": "B", "e": "Jacobson's nerve (tympanic branch of glossopharyngeal, IX) runs on the promontory forming the tympanic plexus → lesser petrosal nerve → otic ganglion → parotid secretomotor fibres. Target of tympanic neurectomy for Frey syndrome/ sialorrhoea.", "t": "Chorda tympani runs between malleus and incus; facial nerve runs above the oval window.", "r": "Gray's; Cummings", "note": ""}, {"n": 33, "sec": "Otology 30 (35)", "stem": "Which of the following inner ear congenital anomalies increases the risk of facial nerve injury in cochlear implant surgery?", "opts": [["A", "Hypoplasia of cochlea"], ["B", "Mondini malformation"], ["C", "Common cavity"], ["D", "Dilated vestibular aqueduct"]], "marked": ["A"], "a": "C", "e": "Facial nerve anomalies (aberrant course) and risk of facial nerve injury during cochlear implantation are highest in severe inner ear malformations — common cavity and cochlear aplasia/ hypoplasia (CH-I). Mondini (IP-II) and EVA usually have a normal nerve course. Pre-operative HRCT mapping is mandatory.", "t": "Source key marked A (hypoplasia) — both CH and common cavity are high risk; common cavity is the classic answer in Arab Board recalls.", "r": "Papsin 2005; Sennaroglu classification", "note": "Changed from source key (A) — contested."}, {"n": 34, "sec": "Otology 30 (35)", "stem": "Which of the following electrodes is the best to use in cochlear implant for a child with peri-lymphatic gusher?", "opts": [["A", "Compressed electrode"], ["B", "Short electrode"], ["C", "Electrode with stopper"], ["D", "Pre-curved modular electrode"]], "marked": ["C"], "a": "C", "e": "In perilymph/ CSF gusher (IP-III/ X-linked POU3F4, common cavity, EVA, IP-I), use an electrode with a stopper/ cork (e.g. \"Gusher\" electrode) to seal the cochleostomy, plus soft tissue packing; this prevents CSF leak and meningitis.", "t": "", "r": "Cummings Ch. Cochlear Implantation", "note": ""}, {"n": 35, "sec": "Otology 30 (35)", "stem": "In severe facial paralysis following temporal bone fracture without a visible fracture line on CT, which option to choose from these proposed studies?", "opts": [["A", "Electromyography (EMG)"], ["B", "Cerebral Magnetic resonance imaging (MRI)"], ["C", "Surgical facial nerve decompression"], ["D", "Electroneuronography (ENoG)"]], "marked": ["D"], "a": "D", "e": "Severe/ complete facial palsy after temporal bone trauma with no fracture line on CT: ENoG (day 3–14) — ≥90% degeneration within 14 days supports surgical exploration/ decompression; also repeat HRCT with fine cuts. MRI brain is not the next test; surgery needs prognostic justification.", "t": "ENoG is meaningful only in COMPLETE paralysis.", "r": "Cummings Ch. Temporal Bone Trauma", "note": ""}, {"n": 36, "sec": "Neurology 10 Audiology 10(24)", "stem": "A 30-year-old man had trauma followed by hearing impairment. Which one of the following is the most common traumatic ossicular abnormality?", "opts": [["A", "Malleus dislocation"], ["B", "Incudostapedial joint disarticulation"], ["C", "Fracture of incus long process"], ["D", "Fracture of stapes supra structure"]], "marked": [], "a": "B", "e": "Duplicate of Q1 — incudostapedial joint disarticulation.", "t": "", "r": "Cummings", "note": "Duplicate (unmarked in source)."}, {"n": 37, "sec": "Neurology 10 Audiology 10(24)", "stem": "A 28 year old man diagnosed to have superior canal dehiscence. Which one of the symptoms is the least likely to improve following surgical intervention?", "opts": [["A", "Autophony"], ["B", "Hyperacusis"], ["C", "Tinnitus"], ["D", "Hearing loss"]], "marked": ["D"], "a": "D", "e": "Duplicate of Q2 — hearing loss least improved after SSCD surgery.", "t": "", "r": "Minor", "note": "Duplicate."}, {"n": 38, "sec": "Neurology 10 Audiology 10(24)", "stem": "A 35-year-old man had facial nerve paralysis (House-Brackmann grade VI) two years ago following temporal bone fracture. What is the most helpful test to determine the best treatment result for reanimation?", "opts": [["A", "Contracted temporal bone CT scan"], ["B", "Electroneuronography"], ["C", "Maximum stimulation test"], ["D", "Electromyography"]], "marked": ["D"], "a": "D", "e": "Duplicate of Q3 — EMG for late reanimation planning.", "t": "", "r": "Cummings", "note": "Duplicate."}, {"n": 39, "sec": "Neurology 10 Audiology 10(24)", "stem": "A 38 year old woman presented with history of right ear hearing impairment and was diagnosed to have autoimmune sensory neural hearing loss. Which one of the following is the most common feature of this type of hearing loss?", "opts": [["A", "Sudden hearing loss"], ["B", "Rapidly progressive hearing loss"], ["C", "Slowly progressive hearing loss"], ["D", "Sudden hearing loss with severe vertigo"]], "marked": ["B"], "a": "B", "e": "Duplicate of Q4 — rapidly progressive SNHL.", "t": "", "r": "Cummings", "note": "Duplicate."}, {"n": 40, "sec": "Neurology 10 Audiology 10(24)", "stem": "A 45 year old man diagnosed to have sarcoidosis presented with fever, parotid enlargement, hearing impairment, facial nerve palsy and uveitis. Which one of the following is the most likely diagnosis?", "opts": [["A", "Hereford's syndrome"], ["B", "Lyme disease"], ["C", "Moebius syndrome"], ["D", "Brachio-oto- renal disease"]], "marked": ["A"], "a": "A", "e": "Heerfordt syndrome (uveoparotid fever) — sarcoidosis with fever, parotid enlargement, anterior uveitis and facial nerve palsy (± other cranial neuropathies/ SNHL).", "t": "Spelled \"Heerfordt\" (option written \"Hereford\").", "r": "Cummings Ch. Granulomatous Diseases", "note": ""}, {"n": 41, "sec": "Neurology 10 Audiology 10(24)", "stem": "Which of the following statements is most accurate about hereditary hearing loss?", "opts": [["A", "Approximately 50% of cases are autosomal dominant."], ["B", "Syndromic hearing loss accounts for nearly one-third of cases."], ["C", "There is little phenotypic variation in syndromic hearing loss."], ["D", "The majority of cases are sex-linked."]], "marked": ["B"], "a": "B", "e": "Hereditary hearing loss: ~50–60% of congenital deafness is genetic; of these ~30% syndromic, ~70% non-syndromic. Non-syndromic: AR ~75–80% (GJB2 commonest), AD ~20%, X-linked ~1–2%, mitochondrial <1%. Syndromic forms show wide phenotypic variability.", "t": "AD is ~20%, not 50%.", "r": "Ballenger; Cummings Ch. Genetic Hearing Loss", "note": ""}, {"n": 42, "sec": "Neurology 10 Audiology 10(24)", "stem": "What is the term given for a measurement problem associated with interference of masking sound presented to the non-test ear with assessment of hearing thresholds for the test ear in patients with serious bilateral conductive hearing loss?", "opts": [["A", "Pure-tone average."], ["B", "Rollover."], ["C", "Loudness recruitment."], ["D", "Masking dilemma"]], "marked": ["D"], "a": "D", "e": "Masking dilemma: in bilateral moderate–severe conductive loss, the masking level needed to overcome the non-test ear's ABG exceeds interaural attenuation and crosses over to the test ear — valid masked thresholds become impossible. Insert earphones (higher interaural attenuation) reduce it.", "t": "Rollover = speech score decline at high intensity (retrocochlear).", "r": "Ballenger Ch. Audiology", "note": ""}, {"n": 43, "sec": "Neurology 10 Audiology 10(24)", "stem": "Which of the following anatomic sites is the major anatomic generator of the wave V component in auditory brainstem response?", "opts": [["A", "Lateral lemniscus."], ["B", "Cochlear nucleus."], ["C", "Superior olivary complex."], ["D", "Inferior colliculus."]], "marked": ["D"], "a": "A", "e": "Classic ABR generators (Ballenger): I distal CN VIII; II proximal CN VIII; III cochlear nucleus; IV superior olivary complex; V lateral lemniscus (as it terminates in the inferior colliculus). Mnemonic E-COLI. Wave V is the most robust and is used for threshold and latency measures.", "t": "Source key marked D (inferior colliculus). Ballenger's answer is lateral lemniscus; some texts say \"lateral lemniscus/ inferior colliculus\".", "r": "Ballenger; Møller", "note": "Changed from source key (D) — contested."}, {"n": 44, "sec": "Neurology 10 Audiology 10(24)", "stem": "Which of the following produces the otoacoustic emissions?", "opts": [["A", "Basilar membrane traveling waves."], ["B", "Synchronous firing of the eighth cranial nerve fibers."], ["C", "Outer hair cell motility"], ["D", "Efferent auditory system innervation of outer hair cells."]], "marked": ["C"], "a": "C", "e": "OAEs are generated by outer hair cell electromotility (prestin-driven cochlear amplifier) and recorded in the canal. Present OAE + abnormal ABR = auditory neuropathy spectrum disorder.", "t": "", "r": "Ballenger", "note": ""}, {"n": 45, "sec": "Neurology 10 Audiology 10(24)", "stem": "Which one of the following is the cause of temporary threshold shift?", "opts": [["A", "Physical shaking of the hair cells."], ["B", "Excessive neurotransmitter release at the hair cell–dendrite junction ."], ["C", "Fracture of the cilial rootlet."], ["D", "Oxygen desaturation of the stria vascularis."]], "marked": ["B"], "a": "B", "e": "Temporary threshold shift after noise: metabolic exhaustion — excessive glutamate release at the inner hair cell–afferent synapse (excitotoxicity, synaptic swelling) and outer hair cell fatigue; recovers within 24–48 h. Repeated TTS → permanent shift and cochlear synaptopathy (\"hidden hearing loss\").", "t": "Stereocilia rootlet fracture = permanent threshold shift.", "r": "Ballenger", "note": ""}, {"n": 46, "sec": "Neurology 10 Audiology 10(24)", "stem": "Which of the following viruses is most often associated with congenital hearing loss?", "opts": [["A", "Cytomegalovirus."], ["B", "Herpes virus."], ["C", "Rubella."], ["D", "Mumps."]], "marked": ["A"], "a": "A", "e": "Congenital CMV is the commonest infectious (non-genetic) cause of congenital SNHL; may be progressive/ late-onset (hence targeted screening). Diagnose by PCR (saliva/urine) within 21 days; valganciclovir for symptomatic infants.", "t": "Rubella was classic before vaccination.", "r": "JCIH 2019; Cummings Pediatric", "note": ""}, {"n": 47, "sec": "Neurology 10 Audiology 10(24)", "stem": "A patient with sudden sensorineural hearing loss reports that she had skin rash and joint pain about a month ago. Which one of the following is the most useful investigation?", "opts": [["A", "Computed tomography."], ["B", "Otoacoustic emissions."], ["C", "Serologic tests"], ["D", "Complete blood count."]], "marked": ["C"], "a": "C", "e": "SSNHL with preceding rash and arthralgia suggests syphilis, Lyme disease or autoimmune disease → targeted serology (FTA-ABS/ RPR, Lyme, ANA/ ESR). MRI for retrocochlear pathology is standard SSNHL workup; routine labs are not recommended without clues.", "t": "Specific history = targeted tests.", "r": "AAO-HNS SSNHL 2019; Ballenger", "note": ""}, {"n": 48, "sec": "Neurology 10 Audiology 10(24)", "stem": "Which one of the following statements explains the lack of correlation between extent and site-of-lesion testing and patient functional disability seen on performing vestibular testing?", "opts": [["A", "Low sensitivity of caloric testing to mild peripheral disorders."], ["B", "Inability of the electronystagmography (ENG) and other site-of-lesion studies to characterize fully the state and extent of the central compensation process."], ["C", "Oculomotor tests, which dominantly characterize only the posterior fossa region."], ["D", "The large number of patients with primary psychiatric disorders related to dizziness."]], "marked": ["B"], "a": "B", "e": "Site-of-lesion vestibular tests measure peripheral/ central function but cannot characterise the state of central compensation — which determines functional disability. Hence poor correlation between test results and symptoms.", "t": "", "r": "Ballenger Ch. Vestibular Testing", "note": ""}, {"n": 49, "sec": "Neurology 10 Audiology 10(24)", "stem": "Which of the following statements describes the primary clinical utility of electronystagmography?", "opts": [["A", "Leads to specific diagnosis in most patients."], ["B", "Directly guides recommendations for most patients."], ["C", "Provides direct evaluation of otolithic organs."], ["D", "Is confirmatory evidence for suspected site of lesion."]], "marked": ["D"], "a": "D", "e": "ENG/VNG provides confirmatory evidence for a suspected site of lesion consistent with the clinical diagnosis; it rarely gives a specific diagnosis alone and does not assess otolith organs (VEMP does).", "t": "", "r": "Ballenger", "note": ""}, {"n": 50, "sec": "Neurology 10 Audiology 10(24)", "stem": "What does it imply that a patient has absence of warm, cool, and ice water caloric responses for right ear irrigations?", "opts": [["A", "The right peripheral system is completely nonresponsive throughout the frequency range (dead system)."], ["B", "There is severe low-frequency loss of sensitivity for the right peripheral part of the vestibular system."], ["C", "The right medial vestibular nucleus is severely reduced in its low-frequency responsiveness."], ["D", "This finding can only occur secondary to technical error(s) and is not reliable."]], "marked": ["B"], "a": "B", "e": "Calorics test only a very low frequency (~0.003 Hz). Absent warm, cool and ice-water responses mean severe LOW-frequency loss of that peripheral system — higher frequencies may persist (check vHIT/ rotary chair). It does not prove a \"dead\" labyrinth.", "t": "", "r": "Ballenger", "note": ""}, {"n": 51, "sec": "Neurology 10 Audiology 10(24)", "stem": "Which of the following is true about spontaneous nystagmus?", "opts": [["A", "Spontaneous nystagmus of peripheral origin is most pronounced with fixation present."], ["B", "Spontaneous nystagmus of central origin is most pronounced with fixation removed."], ["C", "Is not a useful sign for either central or peripheral disease?"], ["D", "is common immediately following unilateral peripheral injury"]], "marked": ["D"], "a": "D", "e": "Spontaneous nystagmus is common immediately after acute unilateral peripheral loss (fast phase away from the lesion) and fades with compensation. Peripheral nystagmus is SUPPRESSED by fixation (enhanced with Frenzel/ darkness); central nystagmus is not suppressed.", "t": "Options A and B reverse the fixation rule.", "r": "Ballenger", "note": ""}, {"n": 52, "sec": "Neurology 10 Audiology 10(24)", "stem": "Which of the following is the benefit of using the rotational chair system in situations of bilateral peripheral paresis?", "opts": [["A", "Provides for accurate prognosis of recovery of function in patients with peripheral lesions."], ["B", "Is the only available study to delineate the actual extent of bilateral paresis."], ["C", "Is the only available study to determine the relative reduction in responsiveness, left versus right"], ["D", "Is typically of no use."]], "marked": ["B"], "a": "B", "e": "Rotary chair testing is the only study that delineates the actual extent (frequency range) of residual function in bilateral peripheral paresis (calorics may be absent bilaterally). It cannot lateralise reliably.", "t": "Calorics lateralise; rotary chair quantifies bilateral function.", "r": "Ballenger", "note": ""}, {"n": 53, "sec": "Neurology 10 Audiology 10(24)", "stem": "Which of the following patient symptom descriptors would suggest that vestibular and balance rehabilitation should be considered as a treatment option?", "opts": [["A", "Patient reports spontaneous spells of vertigo lasting 1 to 2 hours, with no symptoms between the events."], ["B", "Patient reports a rocking sensation when standing or sitting still with all symptoms absent when in motion."], ["C", "Patient reports symptoms that are provoked by head or visual motion stimuli producing brief spells of vertigo with no symptoms when the head is still."], ["D", "Patient reports imbalance only when arising from lying or sitting, lasting seconds, with no other symptoms noted."]], "marked": ["C"], "a": "C", "e": "Vestibular rehabilitation suits stable, uncompensated peripheral deficits with motion-provoked (head/ visual) brief symptoms. Spontaneous episodic attacks (Ménière's), rocking when still (mal de débarquement) and positional seconds-long symptoms (BPPV → repositioning; orthostatic) are not primary indications.", "t": "Rehabilitation needs a stable lesion.", "r": "Ballenger", "note": ""}, {"n": 54, "sec": "Neurology 10 Audiology 10(24)", "stem": "Which of the following inner ear pathologies is associated with an enlarged vestibular aqueduct?", "opts": [["A", "Mondini dysplasia"], ["B", "Fibro-osseous dysplasia"], ["C", "Meniere’s disease"], ["D", "Perilymph gusher"]], "marked": ["A"], "a": "A", "e": "Enlarged vestibular aqueduct (>1.5 mm midpoint; Cincinnati/ Valvassori) is commonly associated with Mondini dysplasia (incomplete partition type II) and Pendred syndrome (SLC26A4). Avoid head trauma/ contact sports.", "t": "Mondini triad: IP-II cochlea + dilated vestibule + EVA.", "r": "Ballenger; Sennaroglu", "note": ""}, {"n": 55, "sec": "Neurology 10 Audiology 10(24)", "stem": "Acoustic Schwanoma may arise from either the superior or inferior vestibular nerves. Which of the following tests can point to the site of origin?", "opts": [["A", "Ocular VEMP"], ["B", "Cervical VEMP"], ["C", "Middle latency responses"], ["D", "Late latency responses"]], "marked": ["B"], "a": "B", "e": "cVEMP tests the saccule and inferior vestibular nerve; oVEMP tests the utricle and superior vestibular nerve; calorics/ vHIT lateral canal also reflect the superior nerve. An abnormal cVEMP with normal calorics suggests inferior vestibular nerve origin. Both VEMPs together localise the nerve of origin.", "t": "Most VS arise from the inferior vestibular nerve.", "r": "Cummings Ch. Vestibular Testing", "note": ""}, {"n": 56, "sec": "Neurology 10 Audiology 10(24)", "stem": "In which of the following ear conditions do you get conductive hearing loss with preserved acoustic reflex?", "opts": [["A", "Cochlear otosclerosis"], ["B", "Dislocated incudo-malleolar joint"], ["C", "Dislocated incudo-stapedial joint"], ["D", "Superior semi-circular canal fistula"]], "marked": ["D"], "a": "D", "e": "Conductive loss with PRESERVED acoustic reflexes and normal tympanogram = third-window lesion (superior semicircular canal dehiscence/ \"fistula\"). Ossicular disruption and otosclerosis abolish reflexes.", "t": "Never perform stapedotomy when reflexes are present.", "r": "Minor; Cummings", "note": ""}, {"n": 57, "sec": "Neurology 10 Audiology 10(24)", "stem": "In which of the following syndromes do you get a positive Tulio’s phenomenon", "opts": [["A", "Gradenigo"], ["B", "Waardenburg"], ["C", "Minor"], ["D", "Treacher-Collins"]], "marked": ["C"], "a": "C", "e": "Minor syndrome (superior semicircular canal dehiscence): Tullio phenomenon (sound-induced vertigo/ nystagmus in the plane of the superior canal), Hennebert sign, autophony, low-frequency conductive loss with preserved reflexes, low-threshold VEMPs.", "t": "Gradenigo = petrous apicitis.", "r": "Minor 1998; Cummings", "note": ""}, {"n": 58, "sec": "Neurology 10 Audiology 10(24)", "stem": "A positive Hennebert sign indicates which of the following otological conditions?", "opts": [["A", "Otosclerosis"], ["B", "Petrositis"], ["C", "Sigmoid sinus thrombosis"], ["D", "Congenital syphilis"]], "marked": ["D"], "a": "D", "e": "Hennebert sign (vertigo/ nystagmus on canal pressure with intact TM) — congenital syphilis (fibrous bands between footplate and utricle) and Ménière's disease (saccule against footplate); also SSCD.", "t": "Fistula sign = with perforation/ cholesteatoma fistula.", "r": "KJ Lee; Cummings", "note": ""}, {"n": 59, "sec": "Neurology 10 Audiology 10(24)", "stem": "Which one of the following symptoms is not a typical presentation of intra canalicular vestibular schwannomas?", "opts": [["A", "Unilateral hearing loss."], ["B", "Tinnitus."], ["C", "Facial numbness."], ["D", "Imbalance or disequilibrium."]], "marked": ["C"], "a": "C", "e": "Intracanalicular VS presents with unilateral SNHL (95%), tinnitus and imbalance. Facial numbness (CN V) only with large CPA tumours (>2.5–3 cm).", "t": "Facial weakness is rare even with large tumours.", "r": "Ballenger; Cummings", "note": ""}, {"n": 60, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Which one of the following is the most common presentation of frontal osteoma?", "opts": [["A", "Rapid progressive swelling."], ["B", "Proptosis."], ["C", "Severe persistent headache."], ["D", "Asymptommatic."]], "marked": ["D"], "a": "D", "e": "Frontal sinus osteoma (commonest paranasal site) is usually asymptomatic and found incidentally. Symptoms (headache, mucocele, orbital/ intracranial extension) or size >50% of sinus/ growth = surgical indications. Gardner syndrome association.", "t": "", "r": "Cummings Ch. Benign Sinonasal Tumours", "note": ""}, {"n": 61, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Increased number of nasal eosinophils is found in nasal smears of patients with:", "opts": [["A", "Vasomotor Rhinitis"], ["B", "Aspirin Sensitivity"], ["C", "Viral infections"], ["D", "Rhinitis medicamentosa"]], "marked": ["B"], "a": "B", "e": "Nasal smear eosinophilia: allergic rhinitis, NARES, aspirin-exacerbated respiratory disease (Samter triad: polyps, asthma, aspirin sensitivity). Vasomotor rhinitis, viral infection and rhinitis medicamentosa do not cause eosinophilia (viral = neutrophils/ lymphocytes).", "t": "", "r": "Cummings Ch. Rhinitis; EPOS 2020", "note": ""}, {"n": 62, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "The most common complications of total inferior turbinectomy is:", "opts": [["A", "Bleeding"], ["B", "Atrophic Rhinitis"], ["C", "Failure to relieve nasal obstruction"], ["D", "Infection"]], "marked": ["B"], "a": "B", "e": "Total inferior turbinectomy → atrophic rhinitis/ empty nose syndrome (crusting, dryness, paradoxical obstruction). Turbinate reduction should be submucosal and mucosa-sparing.", "t": "Bleeding is common but early.", "r": "Cummings Ch. Turbinate Surgery", "note": ""}, {"n": 63, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Nasopharyngeal Angiofibroma:", "opts": [["A", "Occasionally metastasizes"], ["B", "Is linked to endocrine abnormalities"], ["C", "Is most common in adolescent males"], ["D", "Is most common in male children"]], "marked": ["C"], "a": "C", "e": "JNA occurs almost exclusively in adolescent males (14–25 years); benign, locally aggressive, arises at sphenopalatine foramen; does not metastasise. Hormonal (androgen receptor) role suspected but no endocrine abnormality is found.", "t": "Females with JNA → karyotype.", "r": "Cummings Ch. JNA", "note": ""}, {"n": 64, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Which one of the following is the most common presentation of frontal osteoma?", "opts": [["A", "Rapid progressive swelling."], ["B", "Proptosis."], ["C", "Severe persistent headache."], ["D", "Asymptommatic."]], "marked": ["D"], "a": "D", "e": "Duplicate of Q60.", "t": "", "r": "Cummings", "note": "Duplicate."}, {"n": 65, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Increased number of nasal eosinophils is found in nasal smears of patients with:", "opts": [["A", "Vasomotor Rhinitis"], ["B", "Aspirin Sensitivity"], ["C", "Viral infections"], ["D", "Rhinitis medicamentosa"]], "marked": ["B"], "a": "B", "e": "Duplicate of Q61.", "t": "", "r": "Cummings", "note": "Duplicate."}, {"n": 66, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "The most common complications of total inferior turbinectomy is:", "opts": [["A", "Bleeding"], ["B", "Atrophic Rhinitis"], ["C", "Failure to relieve nasal obstruction"], ["D", "Infection"]], "marked": ["B"], "a": "B", "e": "Duplicate of Q62.", "t": "", "r": "Cummings", "note": "Duplicate."}, {"n": 67, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Nasopharyngeal Angiofibroma:", "opts": [["A", "Occasionally metastasizes"], ["B", "Is linked to endocrine abnormalities"], ["C", "Is most common in adolescent males"], ["D", "Is most common in male children"]], "marked": ["C"], "a": "C", "e": "Duplicate of Q63.", "t": "", "r": "Cummings", "note": "Duplicate."}, {"n": 68, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "A 6-month-old infant who had 2 previous episodes of meningitis, presenting with lethargy and fever, as well as seizure activity, bacterial meningitis due to tuft of hair arising from a dimple located at the base of the columella. Imaging will most likely show:", "opts": [["A", "Narrowing of the nasal bones"], ["B", "An empty sella"], ["C", "A bifid crista gali or bifid nasal septum"], ["D", "A fluid-filled cystic mass with an ependymal inclusion"]], "marked": ["C"], "a": "C", "e": "Nasal dermal sinus (pit with hair at the nasal dorsum/ columella base) with recurrent meningitis indicates intracranial extension through the foramen caecum: CT shows an enlarged foramen caecum and a bifid/ distorted crista galli (± bifid septum); MRI shows tract/ cyst. Excise the tract (combined approach if intracranial).", "t": "Never biopsy a midline nasal pit/ mass before imaging.", "r": "Cummings Pediatric Ch. Congenital Nasal Masses", "note": ""}, {"n": 69, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "During endoscopic sphenoethmoidectomy injury to the optic nerve is most likely to occur at:", "opts": [["A", "The superior aspect of the posterior ethmoid sinuses"], ["B", "Sphenoethmoidal cell (Onodi cell)"], ["C", "Lateral wall of the sphenoid sinus"], ["D", "Removal of sphenoid intersinus septum"]], "marked": ["B"], "a": "B", "e": "The optic nerve is most at risk in a sphenoethmoidal (Onodi) cell — a posterior ethmoid cell pneumatising lateral/ superior to the sphenoid, with the optic nerve in its lateral wall (often dehiscent). Identify on pre-op coronal/ axial CT.", "t": "Lateral sphenoid wall also contains optic nerve and ICA — but the Onodi cell is the classic trap.", "r": "Cummings Ch. FESS Anatomy", "note": ""}, {"n": 70, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "How far and what angle is the anterior wall of the sphenoid sinus from the anterior nasal spies?", "opts": [["A", "5cm, 45 degrees"], ["B", "7cm, 30 degrees"], ["C", "9cm, 30 degrees"], ["D", "6cm, 45 degrees"]], "marked": ["B"], "a": "B", "e": "The anterior wall of the sphenoid (ostium) lies ~7 cm from the anterior nasal spine at ~30° to the nasal floor.", "t": "Numbers: 7 cm, 30°.", "r": "Bailey; Stammberger", "note": ""}, {"n": 71, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Concerning maxillary sinus carcinoma, which of the following is false:", "opts": [["A", "80% are squamous cell carcinoma"], ["B", "Ohngren’s line is an imaginary line drawn diagonally through the maxillary sinus"], ["C", "According to TNM, T3 means a tumor presenting with destruction of the infrastructure, including the hard palate and the middle meatus"], ["D", "Cervical nodal mets occurs in less than 5% of patients"]], "marked": ["C"], "a": "C", "e": "False statement: hard palate and middle meatus involvement = T2 (AJCC 8th maxillary sinus), not T3. T3 = posterior wall, subcutaneous tissue, floor/ medial wall of orbit, pterygoid fossa, ethmoids. ~80% are SCC; Ohngren's line from medial canthus to angle of mandible.", "t": "Note: nodal metastasis at presentation is ~10–15% — option D is also debatable.", "r": "AJCC 8th; Cummings", "note": ""}, {"n": 72, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "What does the tear drop sign on imaging indicate?", "opts": [["A", "Le Fort 2 fracture"], ["B", "Zygomatic fracture"], ["C", "Tripod fracture"], ["D", "Orbital blowout fracture"]], "marked": ["D"], "a": "D", "e": "Teardrop sign: herniated orbital fat/ inferior rectus hanging into the maxillary sinus roof on coronal CT/ Waters view = orbital floor (blow-out) fracture. Entrapment (white-eyed blowout in children) needs urgent repair.", "t": "", "r": "Cummings Ch. Orbital Fractures", "note": ""}, {"n": 73, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Endoscopically, the agger nasi cell is seen as:", "opts": [["A", "A small eminence just posterior to the bulla ethmoidalis"], ["B", "A small eminence anterior to the inferior turbinate"], ["C", "A small eminence anterior to the insertion of the middle turbinate"], ["D", "A small eminence in the infundibulum"]], "marked": ["C"], "a": "C", "e": "Endoscopically the agger nasi appears as an eminence on the lateral nasal wall anterior to (and above) the insertion (axilla) of the middle turbinate; it forms the anterior boundary of the frontal recess.", "t": "", "r": "Bailey; IFAC 2016", "note": ""}, {"n": 74, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "When evaluating nasal encephalocele, MRI is superior to CT because:", "opts": [["A", "The pathway of intracranial herniation is more clearly demonstrated"], ["B", "Tissue planes in children are easy to delineate"], ["C", "CSF can be differentiated from blood"], ["D", "Cartilage can be better differentiated from bone"]], "marked": ["A"], "a": "A", "e": "MRI is superior to CT in nasal encephalocele because it shows the intracranial connection/ herniation pathway and the nature of herniated tissue (brain vs CSF); CT shows bony defect. Both are often obtained.", "t": "In children, unossified cartilage on CT can mimic defects.", "r": "Cummings Pediatric", "note": ""}, {"n": 75, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Ohngren’s line is used as a prognostic indicator in the management of carcinoma of the maxillary sinus. This line is described as an imaginary plane perpendicular to the intersection between:", "opts": [["A", "The medial canthus and the angle of the jaw"], ["B", "The lateral canthus and the angle of the jaw"], ["C", "The tragus and the menton"], ["D", "The lateral canthus and the menton"]], "marked": ["A"], "a": "A", "e": "Ohngren's line: from the medial canthus to the angle of the mandible — anteroinferior (infrastructure, better prognosis) vs posterosuperior (suprastructure, worse).", "t": "", "r": "KJ Lee", "note": ""}, {"n": 76, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Trotter’s triad is indicative of:", "opts": [["A", "Laryngeal carcinoma"], ["B", "Hypophayrngeal carcinoma"], ["C", "Nasopharyngeal carcinoma"], ["D", "Juvenile nasopharyngeal angiofibroma"]], "marked": ["C"], "a": "C", "e": "Trotter's triad (nasopharyngeal carcinoma in the fossa of Rosenmüller/ lateral wall): unilateral conductive deafness (OME), ipsilateral soft palate immobility, and trigeminal (V3) neuralgia/ pain.", "t": "", "r": "Scott-Brown; KJ Lee", "note": ""}, {"n": 77, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "A patient presented with CSF rhinorrhoea. What is the characteristic signal on MRI?", "opts": [["A", "High intensity signal on T1-weighted image"], ["B", "High intensity signal on T2-weighted image"], ["C", "Low intensity signal on T2-weighted image"], ["D", "Enhancement following administration of gadolinium"]], "marked": ["B"], "a": "B", "e": "CSF is high signal on T2 (low on T1). Heavily T2-weighted MR cisternography shows CSF tract and meningoencephalocele; HRCT shows the bony defect.", "t": "Gadolinium enhancement = inflammation/ tumour.", "r": "Cummings Ch. CSF Rhinorrhoea", "note": ""}, {"n": 78, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Which of the following is true for iatrogenic cerebrospinal fluid (CSF) leak resulting from endoscopic sinus surgery?", "opts": [["A", "Most commonly occurs at the posterior ethmoid roof."], ["B", "Leaks more commonly occur on the right side."], ["C", "Majority of leaks manifest in a delayed fashion."], ["D", "Leaks are equally common in the hands of experienced surgeons"]], "marked": ["B"], "a": "B", "e": "Iatrogenic CSF leaks during ESS: more common on the right side (right-handed surgeon angulation), most commonly at the lateral lamella of the cribriform plate/ anterior ethmoid roof; most are recognised intraoperatively; more common with less experienced surgeons.", "t": "", "r": "Bailey Ch. FESS Complications", "note": ""}, {"n": 79, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "A cerebrospinal fluid leak during ethmoidectomy is most likely to occur at:", "opts": [["A", "The junction of fovea ethmoidalis and lamina papyracea"], ["B", "The medial fovea ethmoidalis"], ["C", "The insertion of the uncinate process"], ["D", "The planum sphenoidale"]], "marked": ["B"], "a": "B", "e": "CSF leak during ethmoidectomy is most likely at the medial fovea ethmoidalis/ lateral lamella of the cribriform plate (thinnest bone, anterior ethmoid artery entry). Keros III = highest risk.", "t": "", "r": "Bailey; Keros", "note": ""}, {"n": 80, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Which of the following laboratory tests is most specific for suspected cerebrospinal fluid (CSF) rhinorrhea?", "opts": [["A", "Glucose strip test"], ["B", "Protein analysis of fluid"], ["C", "Albumin level of fluid"], ["D", "β2-transferrin analysis"]], "marked": ["D"], "a": "D", "e": "β2-transferrin (immunofixation) is the most sensitive and specific test for CSF (also β-trace protein). Glucose strips are unreliable (false positives with nasal secretions/ blood).", "t": "", "r": "Cummings Ch. CSF Rhinorrhoea", "note": ""}, {"n": 81, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Which of the following is not an indication for CT-guided surgery according to the American Academy of Otolaryngology-Head and Neck Surgery consensus statement guidelines?", "opts": [["A", "Revision sinus surgery"], ["B", "Extensive nasal polyposis"], ["C", "Cases involving CSF leak repair"], ["D", "Cases involving concha bullosa takedown"]], "marked": ["D"], "a": "D", "e": "AAO-HNS image-guidance indications: revision sinus surgery, distorted anatomy, extensive polyposis, frontal/ posterior ethmoid/ sphenoid disease, disease abutting skull base/ orbit/ optic nerve/ carotid, CSF leak repair, sinonasal tumours. Concha bullosa reduction is not an indication.", "t": "", "r": "AAO-HNS IGS Policy; Bailey", "note": ""}, {"n": 82, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "In patients with CSF rhinorrhea after skull base fracture, the use of prophylactic antibiotics is associated with:", "opts": [["A", "Decrease in frequency of meningitis"], ["B", "Reduction in meningitis-related mortality"], ["C", "less need for surgical repair of CSF leakage"], ["D", "No apparent therapeutic benefit"]], "marked": ["D"], "a": "D", "e": "Prophylactic antibiotics in traumatic CSF rhinorrhoea show no proven benefit on meningitis rate, mortality or need for repair (Cochrane). Most close in 7–10 days; pneumococcal vaccination recommended.", "t": "", "r": "Cochrane (Ratilal 2015)", "note": ""}, {"n": 83, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "What is the most common location of the ophthalmic artery in relation to the optic nerve in the optic canal?", "opts": [["A", "lateral"], ["B", "Superior"], ["C", "Inferior"], ["D", "Medial"]], "marked": ["C"], "a": "C", "e": "In the optic canal the ophthalmic artery lies inferior (and slightly lateral) to the optic nerve within the dural sheath; in the orbit it crosses superiorly from lateral to medial.", "t": "", "r": "Bailey; Cummings", "note": ""}, {"n": 84, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "What is the thinnest part of the anterior skull base?", "opts": [["A", "Ethmoid roof (fovea ethmoidalis)"], ["B", "lateral lamella"], ["C", "Sella turcica"], ["D", "Planum sphenoidale"]], "marked": ["B"], "a": "B", "e": "The lateral lamella of the cribriform plate is the thinnest bone of the anterior skull base (~0.05–0.2 mm) — weakest point; Keros classification measures olfactory fossa depth (I 1–3, II 4–7, III 8–16 mm).", "t": "", "r": "Bailey; Keros 1962", "note": ""}, {"n": 85, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Which one of these investigations is recommended for patients treated for nasopharyngeal carcinoma followed by continuous or progressive increase in EBV DNA?", "opts": [["A", "MRI to detect residual nasopharyngeal tumor"], ["B", "Whole Body Scanning"], ["C", "Positron-emission-tomography PET – CT"], ["D", "Repeat nasopharyngeal biopsy and verify histological type"]], "marked": ["C"], "a": "C", "e": "Persistent/ rising plasma EBV DNA after NPC treatment indicates residual/ recurrent or metastatic disease → PET-CT (whole-body + locoregional) with MRI nasopharynx, then biopsy any lesion.", "t": "", "r": "NCCN Nasopharynx", "note": ""}, {"n": 86, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "What is the surgical first line treatment for children with chronic rhino sinusitis?", "opts": [["A", "Turbinoplasty"], ["B", "Adenoidectomy"], ["C", "Septoplasty"], ["D", "Middle metal antrostomies"]], "marked": ["B"], "a": "B", "e": "Adenoidectomy is first-line surgery for paediatric CRS (adenoid biofilm reservoir), ± maxillary irrigation/ balloon; ESS for failures or complications.", "t": "", "r": "AAO-HNS Pediatric CRS Consensus 2014", "note": ""}, {"n": 87, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Which one of these surgical techniques is the most practiced for management of bilateral choanal atresia?", "opts": [["A", "Trans nasal endoscopically assisted perforation"], ["B", "Trans palatal resection"], ["C", "Trans nasal endoscopic choanoplasty"], ["D", "Trans nasal perforation"]], "marked": ["C"], "a": "C", "e": "Bilateral choanal atresia: transnasal endoscopic choanoplasty (removal of atretic plate + posterior vomer, ± mucosal flaps; stenting controversial) is the most practised technique; transpalatal reserved for older children/ failures.", "t": "Simple perforation → restenosis.", "r": "Cummings Pediatric", "note": ""}, {"n": 88, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "External surgical approach of sinonasal mucocele is indicated for which one of these cases?", "opts": [["A", "Bilateral mucocele"], ["B", "Mucocele with cutaneous fistula"], ["C", "Ethmoid mucocele with orbital extension"], ["D", "Spheroidal mucocele with cranial extension"]], "marked": ["B"], "a": "B", "e": "Most sinonasal mucoceles are treated endoscopically (marsupialisation). External approach indications: cutaneous fistula, far-lateral frontal mucocele beyond endoscopic reach, failed endoscopic surgery, extensive osteitis/ neo-osteogenesis.", "t": "Orbital/ intracranial extension alone can be marsupialised endoscopically.", "r": "Cummings Ch. Mucoceles", "note": ""}, {"n": 89, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Based on the 8^(th) AJCC/UICC TNM staging system, how to classify a Nasopharyngeal tumor with involvement of the lateral pterygoid muscle and the prevertebral muscles?", "opts": [["A", "T1"], ["B", "T2"], ["C", "T3"], ["D", "T4"]], "marked": ["B"], "a": "B", "e": "AJCC 8th NPC: T2 = parapharyngeal extension and/or adjacent soft tissue — medial pterygoid, lateral pterygoid, prevertebral muscles. T3 = bony structures of skull base, cervical vertebra, pterygoid structures, paranasal sinuses. T4 = intracranial, cranial nerves, hypopharynx, orbit, parotid, beyond lateral pterygoid.", "t": "8th edition moved pterygoid/ prevertebral MUSCLES to T2 (T4 = beyond lateral surface of lateral pterygoid).", "r": "AJCC 8th — Nasopharynx", "note": ""}, {"n": 90, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "By which one of the following techniques is per orbital invasion due to sinonasal cancer is best assessed :", "opts": [["A", "MRI T1 sequences with gadolinium"], ["B", "Parenchyma window CT scan"], ["C", "MRI T2"], ["D", "PET and CT Scans"]], "marked": ["C"], "a": "A", "e": "Periorbital (periorbita) invasion is best assessed by MRI: T1 pre-contrast (orbital fat obliteration) and post-gadolinium fat-suppressed T1 (enhancing tumour breaching the low-signal periorbita); T2 helps separate tumour from retained secretions. CT shows lamina papyracea erosion but not periorbita breach.", "t": "Source key marked C (T2).", "r": "Cummings Ch. Sinonasal Imaging; Eisen et al.", "note": "Changed from source key (C)."}, {"n": 91, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Which one of these situations is having the highest risk of post-operative CSF leak following endoscopic endonasal resection of skull base tumors?", "opts": [["A", "Pre-operative hydrocephalus"], ["B", "intra-operative CSF leak"], ["C", "Posterior Fossa defects"], ["D", "Post-operative meningitis"]], "marked": ["B"], "a": "B", "e": "After endoscopic endonasal skull base surgery, the strongest predictor of post-operative CSF leak is a high-flow intra-operative CSF leak (opening of arachnoid cisterns/ ventricle); other risks: posterior fossa (clival) defects, raised BMI/ ICP, prior radiation. Vascularised nasoseptal flap reduces leak to <5%.", "t": "", "r": "Cummings Ch. Endoscopic Skull Base Surgery", "note": ""}, {"n": 92, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Which one of these Head and neck tumors can commonly invade the skull base by perineural spread?", "opts": [["A", "Lymphoma"], ["B", "Schwanoma"], ["C", "Olfactory neuroblastoma"], ["D", "Adenoid Cystic Carcinoma"]], "marked": ["D"], "a": "D", "e": "Adenoid cystic carcinoma classically invades the skull base via perineural spread (V2 through foramen rotundum/ PPF, V3 via foramen ovale) with skip lesions. Olfactory neuroblastoma invades directly through the cribriform plate.", "t": "", "r": "Cummings", "note": ""}, {"n": 93, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "In radiological assessment of tympano-jugular paraganglioma, which one of the following is the modality of choice to demonstrate erosion of adjacent structures?", "opts": [["A", "Coronal fat-suppressed T2 MRI sequences"], ["B", "Angio-MRI"], ["C", "CT –Scan"], ["D", "Coronal non-contrast T1 MRI sequences"]], "marked": ["C"], "a": "C", "e": "Temporal bone CT is best to show bony erosion in tympano-jugular paragangliomas (caroticojugular spine — Phelps sign, jugular foramen, hypotympanum). MRI (\"salt-and-pepper\") shows soft-tissue/ intracranial extent; angiography for embolisation.", "t": "Fisch/ Glasscock-Jackson staging relies on CT.", "r": "Cummings Ch. Paragangliomas", "note": ""}, {"n": 94, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Invasive fungal sinusitis is the most aggressive pathology that mimics skull base malignant tumors. Which one of the following imaging findings is characteristic of fungal elements?", "opts": [["A", "Mucosal thickening with opacification of the affected sinuses"], ["B", "Very low T2WI signal on MRI"], ["C", "Hypo intense on T1W and hyper intense on T2W"], ["D", "Absence of bone destruction on CT"]], "marked": ["B"], "a": "B", "e": "Fungal concretions (iron, manganese, calcium) produce very low signal on T2-weighted MRI (may mimic air), and hyperdensity on CT. In acute invasive fungal sinusitis, lack of contrast enhancement (\"black turbinate\") indicates necrosis.", "t": "", "r": "Cummings Ch. Fungal Rhinosinusitis", "note": ""}, {"n": 95, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "A 35- year old lady presented with destructive recent ulcer at the right ala nasi associated with facial swelling and ill health, biopsy showed marked necrosis that necessitated repeat biopsy. The most likely diagnosis is:", "opts": [["A", "Wegner's granuloma"], ["B", "Malignant T cell lymphoma"], ["C", "Basal cell carcinoma"], ["D", "Invasive fungal granuloma"]], "marked": ["B"], "a": "B", "e": "Destructive midline/ alar ulceration with marked necrosis requiring repeat biopsies = extranodal NK/T-cell lymphoma, nasal type (EBV-associated, \"lethal midline granuloma\"). Multiple deep biopsies needed due to necrosis.", "t": "GPA: c-ANCA, necrotising granulomas with vasculitis.", "r": "Cummings Ch. Sinonasal Lymphoma", "note": ""}, {"n": 96, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "A 30- year lady presented with right proptosis with no nasal symptoms, the most likely diagnosis is:", "opts": [["A", "Allergic fungal rhino sinusitis"], ["B", "Fungal granuloma of the Ethmoid"], ["C", "Chronic invasive fungal rhino sinusitis"], ["D", "Eosinophilic fungal rhino sinusitis"]], "marked": ["B"], "a": "B", "e": "Chronic granulomatous invasive fungal sinusitis (\"fungal granuloma\"; A. flavus) in immunocompetent patients (Sudan, India, Middle East) presents with slowly progressive proptosis/ orbital mass with few nasal symptoms.", "t": "AFRS has nasal polyps/ obstruction.", "r": "deShazo classification", "note": ""}, {"n": 97, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Cytokines which are responsible for migration of eosinophils in chronic sinusitis include: 40", "opts": [["A", "Interferon-γ and histamine."], ["B", "Interleukin-4 and interleukin-5"], ["C", "Tumor necrosis factor-α and major basic protein."], ["D", "Eosinophilic cationic protein and interleukin-3."]], "marked": ["B"], "a": "B", "e": "Eosinophil recruitment/ survival in CRSwNP: IL-5 (key survival factor), IL-4/ IL-13 (VCAM-1, eotaxin induction), eotaxins. Basis of biologics (mepolizumab anti-IL-5; dupilumab anti-IL-4Rα).", "t": "", "r": "Ballenger; EPOS 2020", "note": ""}, {"n": 98, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "What are the histological features of esthesioneuroblastoma? 70", "opts": [["A", "Well-differentiated cells with abundant cytoplasm"], ["B", "Poorly differentiated cells with multiple mitotic figures"], ["C", "Undifferentiated small neuroepithelial cells with hyperchromasia"], ["D", "Granular cells in various stages of differentiation with a high mitotic rate"]], "marked": ["C"], "a": "C", "e": "Esthesioneuroblastoma: small round blue neuroepithelial cells with hyperchromatic nuclei in lobules, neurofibrillary matrix, Homer Wright pseudorosettes and Flexner-Wintersteiner rosettes; synaptophysin/ chromogranin +, S100 sustentacular cells. Hyams grading; Kadish staging.", "t": "", "r": "Cummings Ch. Olfactory Neuroblastoma", "note": ""}, {"n": 99, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Russell bodies are a characteristic histological finding in: 60", "opts": [["A", "Rhinoscleroma."], ["B", "Rhinosporodosis."], ["C", "Sarcoidosis"], ["D", "Wegner’s granulomatosis"]], "marked": ["A"], "a": "A", "e": "Rhinoscleroma (Klebsiella rhinoscleromatis): Mikulicz cells (foamy histiocytes with bacilli) and Russell bodies (plasma cells with Ig inclusions). Treatment: long-term ciprofloxacin/ doxycycline.", "t": "Rhinosporidiosis = sporangia.", "r": "Scott-Brown; KJ Lee", "note": ""}, {"n": 100, "sec": "Rhinology 25 Skull base Surgery 15(40)", "stem": "Patients with familial adenomatous polyp are more likely to develop:", "opts": [["A", "Juvenile angiofibroma"], ["B", "Nasopharyngeal carcinoma"], ["C", "Nasal sinus squamous cell carcinoma"], ["D", "Inverted papilloma"]], "marked": ["A"], "a": "A", "e": "Familial adenomatous polyposis (APC mutation) carries ~25-fold increased risk of juvenile nasopharyngeal angiofibroma (Giardiello 1993).", "t": "", "r": "Giardiello 1993; Cummings", "note": ""}, {"n": 101, "sec": "Laryngology 20 Speech &language Therapy 5(31)", "stem": "Inspiratory stridor is most likely expected with which of the following lesions:", "opts": [["A", "Foreign body in the right main bronchus"], ["B", "Tumor at the carina"], ["C", "Tracheal stenosis in the lower 1/3^(rd) of the trachea"], ["D", "Bilateral vocal cord par
