<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ENT Board Exam Recall — 13 Nov 2026</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--amber:#B06A00;--amber-soft:#FBEFD9;--box:#0B1418;--on-teal:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--amber:#E8A94A;--amber-soft:#3A2C14;--box:#000;--on-teal:#06201F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td:last-child{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px 8px;text-align:center}
.seg button.on{background:var(--teal);color:var(--on-teal);font-weight:600}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note{font-size:.9rem;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.timer{font:700 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.topi .t{flex:1;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.flagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
.flagbtn.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.qn{font-weight:600;font-size:.9rem;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{opacity:1}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}.exp h3.na{color:var(--amber)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;position:relative}
.grid .ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.grid .flg{box-shadow:inset 0 0 0 2px var(--amber)}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-na{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid .cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.legend .a::before{background:var(--teal-soft);border-color:var(--teal)}.legend .f::before{box-shadow:inset 0 0 0 2px var(--amber)}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3.2rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>button{flex:1}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--teal)}
</style></head><body>

<script>
const PAPERS=[{"title":"ENT Board Exam Recall — 13 November 2026","q":[{"s":"A child presents with recurrent meningitis. Imaging shows a patent communication between the posterior cranial fossa and the hypotympanum. Through which congenital pathway does this communication most likely occur?","o":["Fissula ante fenestram","Petrotympanic (Glaserian) fissure","Fissure of Santorini","Hyrtl’s fissure (tympanomeningeal fissure)","Cochlear aqueduct"],"k":"D","x":"Hyrtl’s fissure normally closes by the 24th week of gestation; when it persists it links the posterior fossa subarachnoid space with the hypotympanum, causing CSF otorrhoea/otorhinorrhoea and recurrent meningitis in children. The fissures of Santorini are cartilaginous EAC defects (routes for infection or parotid tumour), not CSF pathways (Scott-Brown; Cummings).","src":"Board exam recall · 13 Nov 2026 · Q1","d":"Otology"},{"s":"A 38-year-old has a 25-dB low-frequency conductive hearing loss, a normal tympanogram, and PRESENT stapedial reflexes. What is the most appropriate next investigation?","o":["High-resolution CT temporal bone with Pöschl/Stenvers reformats","MRI internal auditory canals","Electrocochleography","Stapedotomy without imaging","Exploratory tympanotomy"],"k":"A","x":"A conductive gap with preserved acoustic reflexes argues against stapes fixation and suggests an inner-ear “third window” (superior canal dehiscence). Fine-cut CT (≤0.6 mm) with reformats in the plane of the superior canal (Pöschl) confirms it; VEMPs (low cVEMP thresholds/high oVEMP amplitudes) support it. Never operate on the stapes before excluding SSCD (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q2","d":"Otology"},{"s":"Inverted papilloma attached to the lateral wall of the maxillary sinus, without extension beyond the sinuses, is staged as:","o":["Krouse T1","Cannady Group C","Krouse T4","Cannady Group B","Cannady Group A"],"k":"D","x":"Cannady: Group A = nasal cavity, ethmoid, or medial maxillary wall; Group B = any other maxillary wall, frontal or sphenoid sinus; Group C = extension beyond the paranasal sinuses. Recurrence rises from about 3% (A) to about 20% (B) and 35% (C). Lateral maxillary wall disease (Krouse T3) often needs a prelacrimal or endoscopic Denker approach (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q3","d":"Rhinology"},{"s":"A 40-year-old reports vertigo induced by loud noise and straining, autophony and hearing his own eye movements. Examination shows sound-evoked torsional nystagmus. What is the most likely diagnosis?","o":["Perilymph fistula of the round window","Superior semicircular canal dehiscence syndrome","Patulous Eustachian tube","Ménière disease","Otosclerosis"],"k":"B","x":"Tullio (sound) and Hennebert (pressure) phenomena, autophony and conductive hyperacusis (hearing eye movements or footsteps) are typical of superior canal dehiscence, a “third window” that diverts acoustic energy into the vestibular labyrinth (Minor 1998; Cummings).","src":"Board exam recall · 13 Nov 2026 · Q4","d":"Otology"},{"s":"Superior semicircular canal dehiscence is best demonstrated on CT using reformatted images in which plane?","o":["Coronal plane through the cochlea","Pöschl plane (parallel to the superior canal)","Axial plane only","Sagittal plane through the IAC","Stenvers plane only"],"k":"B","x":"The Pöschl plane runs parallel to the superior canal and shows the dehiscent arcuate roof. Standard axial/coronal cuts over-diagnose dehiscence because of partial-volume effect. Stenvers (perpendicular) views are complementary (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q5","d":"Otology"},{"s":"A 9-year-old has orbital cellulitis. CT shows a medial subperiosteal abscess (Chandler III) with decreasing visual acuity. What is the most appropriate management?","o":["IV antibiotics and urgent surgical drainage (endoscopic or external)","IV antibiotics alone for 72 hours then re-image","IV steroids alone","Observation with daily visual acuity","Oral antibiotics and outpatient review"],"k":"A","x":"Chandler III (subperiosteal abscess) is treated with IV antibiotics plus urgent ophthalmology review. Surgical drainage is indicated for visual compromise, a large abscess, non-medial location, age >9 years, frontal sinusitis, or failure to improve within 24–48 h. Small medial abscesses in young children with normal vision may be treated medically first (Cummings; Garcia & Harris criteria).","src":"Board exam recall · 13 Nov 2026 · Q6","d":"Rhinology"},{"s":"A 35-year-old has extensive cholesteatoma involving the mastoid, sinus tympani and a lateral canal fistula, with a contracted mastoid. What is the traditional definitive operation?","o":["Canal wall down (modified radical) mastoidectomy","Transcanal atticotomy","Myringoplasty","Cortical mastoidectomy only","Canal wall up mastoidectomy"],"k":"A","x":"Canal wall down surgery gives the lowest rate of residual or recurrent disease for extensive cholesteatoma, sclerotic or contracted mastoids, labyrinthine fistula, only-hearing ears, poor follow-up or recurrent disease. CWU preserves anatomy but needs a second look or non-EPI DWI surveillance (Brackmann; Scott-Brown).","src":"Board exam recall · 13 Nov 2026 · Q7","d":"Otology"},{"s":"After total thyroidectomy the patient is extubated and develops progressive inspiratory stridor; laryngoscopy shows both vocal folds immobile in the paramedian (adducted) position. What is the main concern and immediate management?","o":["Hypocalcaemia — IV calcium","Voice loss — speech therapy","Aspiration — start nasogastric feeding","Airway obstruction — re-intubate or perform tracheostomy","Haematoma — open the wound"],"k":"D","x":"Bilateral RLN palsy leaves the folds paramedian, so the voice may be near normal but the glottic airway is critically narrow. Secure the airway (re-intubation, steroids, then tracheostomy if no recovery). Later options include cordotomy or arytenoidectomy once recovery is unlikely (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q8","d":"Laryngology"},{"s":"During translabyrinthine/retrolabyrinthine drilling your trainer tells you not to drill deeper or inferior to the cochlear aqueduct. Which structure is being protected?","o":["Superior petrosal sinus","Petrous internal carotid artery","Glossopharyngeal nerve and jugular bulb (pars nervosa of the jugular foramen)","Abducens nerve in Dorello canal","Facial nerve labyrinthine segment"],"k":"C","x":"⚑ The recall stated \"petrous ICA\"; corrected — the cochlear aqueduct marks the inferior limit to protect CN IX/the jugular bulb (the ICA is anterior). — The cochlear aqueduct is the inferior limit of dissection in translabyrinthine surgery: immediately below and medial to it lie the glossopharyngeal nerve and the pars nervosa of the jugular foramen, with the jugular bulb. The petrous ICA lies anterior, not inferior (Brackmann; Cummings).","src":"Board exam recall · 13 Nov 2026 · Q9","d":"Otology"},{"s":"On day 3 after translabyrinthine excision of a vestibular schwannoma, clear fluid leaks from the postauricular wound. What is the first step?","o":["Observation only","Oversew the wound (skin closure suture) with a pressure dressing and head elevation","Antibiotics alone","Immediate revision craniotomy","Insertion of a ventriculoperitoneal shunt"],"k":"B","x":"Incisional CSF leak is managed first by oversewing the wound, a pressure dressing, bed rest with head elevation and acetazolamide. A lumbar drain is added if it persists; re-exploration with fat graft/Eustachian tube obliteration is needed for persistent leaks or rhinorrhoea. Shunting is for hydrocephalus (Brackmann).","src":"Board exam recall · 13 Nov 2026 · Q10","d":"Otology"},{"s":"A 60-year-old smoker has a T1a glottic squamous cell carcinoma confined to the mid third of one mobile vocal fold. What is the recommended treatment?","o":["Concurrent chemoradiotherapy","Vertical hemilaryngectomy with neck dissection","Induction chemotherapy","Transoral laser cordectomy or radiotherapy","Total laryngectomy"],"k":"D","x":"Single-modality treatment: transoral laser microsurgery (type I–III cordectomy) or radiotherapy (local control about 90–95%). TLM is cheaper and repeatable and keeps RT in reserve; RT may give a slightly better voice. Elective neck treatment is not needed (NCCN).","src":"Board exam recall · 13 Nov 2026 · Q11","d":"Laryngology"},{"s":"A 45-year-old has nasopharyngeal carcinoma, stage III (T3N1M0). What is the current preferred treatment?","o":["Induction chemotherapy followed by concurrent cisplatin chemoradiotherapy","Concurrent chemoradiotherapy followed by surgery","Adjuvant chemotherapy alone","Surgical nasopharyngectomy","Radiotherapy alone"],"k":"A","x":"Locoregionally advanced NPC (stage III–IVA) is treated with induction chemotherapy (gemcitabine–cisplatin, category 1) followed by concurrent cisplatin–IMRT, which improves overall survival. Surgery is reserved for residual or recurrent disease (NCCN; Zhang NEJM 2019).","src":"Board exam recall · 13 Nov 2026 · Q12","d":"Head & Neck"},{"s":"During sialendoscopy, a 7-mm stone in the hilum of Stensen’s duct cannot be captured with a wire basket. What is the most appropriate next step?","o":["Ligate the duct","Radiotherapy","Fragmentation (intraductal laser/lithotripsy) or a combined sialendoscopy–transfacial approach","Abandon and repeat antibiotics only","Superficial parotidectomy"],"k":"C","x":"Stones larger than about 4–5 mm (parotid) usually need fragmentation (holmium/pneumatic intraductal lithotripsy or extracorporeal shock-wave) or a combined endoscopic–external approach. Gland-preserving options come before parotidectomy (Cummings, Sialendoscopy).","src":"Board exam recall · 13 Nov 2026 · Q13","d":"Head & Neck"},{"s":"Regarding surgery for a small benign parotid tumour, how does extracapsular dissection differ from enucleation?","o":["Enucleation always identifies the facial nerve trunk","Extracapsular dissection removes the tumour with a cuff of normal tissue without routine identification of the facial nerve trunk; enucleation shells the tumour out through its capsule","Enucleation has the lowest recurrence rate","They are identical procedures","Extracapsular dissection removes the entire superficial lobe"],"k":"B","x":"Enucleation breaches or follows the pseudocapsule and leaves pseudopodia, with high recurrence (20–45%) — abandoned for pleomorphic adenoma. Extracapsular dissection removes the lump with a thin margin of normal parotid, with recurrence similar to superficial parotidectomy for small mobile superficial tumours (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q14","d":"Head & Neck"},{"s":"In a rhomboid (Limberg) flap, where is the maximum wound tension?","o":["At the centre of the primary defect","At closure of the secondary (donor) defect","Along the base of the flap","Equally along all limbs","At the tip of the flap"],"k":"B","x":"After transposition the greatest tension lies at the closure of the donor site (secondary defect), so the flap is designed so this closure line lies along relaxed skin tension lines and lines of maximum extensibility (Cummings, Local Flaps).","src":"Board exam recall · 13 Nov 2026 · Q15","d":"Others"},{"s":"Which muscle is the only abductor of the vocal folds?","o":["Cricothyroid","Interarytenoid","Lateral cricoarytenoid","Thyroarytenoid","Posterior cricoarytenoid"],"k":"E","x":"The posterior cricoarytenoid (RLN supplied) is the sole abductor. LCA, interarytenoid and TA adduct; the cricothyroid (external branch of the SLN) tenses and lengthens the folds (Scott-Brown).","src":"Board exam recall · 13 Nov 2026 · Q16","d":"Laryngology"},{"s":"What is the most common congenital infection causing sensorineural hearing loss?","o":["Cytomegalovirus","Toxoplasmosis","Herpes simplex","Rubella","Syphilis"],"k":"A","x":"Congenital CMV is the commonest non-genetic cause of congenital SNHL; loss may be progressive or late-onset, so infants need audiological follow-up even after passing screening. Symptomatic infants may receive valganciclovir (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q17","d":"Paediatric"},{"s":"Which feature of postcricoid carcinoma explains its high recurrence after surgery?","o":["Exophytic growth with clear borders","Radio-resistance","Submucosal longitudinal spread with skip lesions","Rare nodal metastasis","Early haematogenous spread to bone"],"k":"C","x":"Hypopharyngeal (especially postcricoid) carcinoma spreads submucosally well beyond the visible edge, with skip lesions, so wide margins (often total pharyngolaryngo-oesophagectomy with gastric pull-up for postcricoid disease) are needed. Nodal spread (including paratracheal) is early (Scott-Brown).","src":"Board exam recall · 13 Nov 2026 · Q18","d":"Head & Neck"},{"s":"During FESS a rapidly expanding orbital haematoma develops with proptosis, a tense globe, and a dilated pupil. What is the immediate management?","o":["Remove nasal packs only and wait 1 hour","Topical decongestant and observation","CT scan of the orbit","Lateral canthotomy and inferior cantholysis","Mannitol alone"],"k":"D","x":"Arterial orbital haematoma causes orbital compartment syndrome; retinal ischaemia becomes irreversible within about 60–90 minutes. Immediate canthotomy/cantholysis decompresses the orbit; mannitol, steroids and acetazolamide are adjuncts, followed by endoscopic orbital decompression or AEA ligation (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q19","d":"Rhinology"},{"s":"Two hours after FESS on the ward, the patient has a painful proptotic eye with reduced vision and raised intraocular pressure. What should you do first?","o":["Give oral analgesia and review in the morning","Bedside lateral canthotomy and cantholysis without waiting for imaging","Apply warm compresses","Arrange urgent CT first","Refer to ophthalmology clinic next week"],"k":"B","x":"Orbital compartment syndrome is a clinical diagnosis; decompression must not be delayed for imaging. After canthotomy, remove packs, call ophthalmology and consider return to theatre (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q20","d":"Rhinology"},{"s":"In the Bouthillier classification of the internal carotid artery, which is segment C4?","o":["Clinoid","Petrous","Cavernous","Ophthalmic","Lacerum"],"k":"C","x":"Bouthillier: C1 cervical, C2 petrous, C3 lacerum, C4 cavernous, C5 clinoid, C6 ophthalmic, C7 communicating (terminal). These segments are key landmarks in endoscopic skull base surgery (paraclival ICA = C3–C4 junction) (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q21","d":"Rhinology"},{"s":"What is the most common cause of a cartilaginous pollybeak (supratip fullness) deformity after rhinoplasty?","o":["Under-resection of the cartilaginous dorsum (anterior septal angle)","Use of spreader grafts","Excessive tip projection","Over-narrowing by lateral osteotomies","Over-resection of the bony dorsum"],"k":"A","x":"⚑ The recall stated \"excessive removal of caudal support\" — that is a contributing cause (via tip ptosis); the commonest cause is under-resected cartilaginous dorsum. — A pollybeak is supratip fullness. The cartilaginous type is from inadequate lowering of the cartilaginous dorsum/anterior septal angle, often with loss of tip support (over-resected caudal septum or lost tip projection). The soft-tissue type is from supratip dead-space scarring, especially in thick skin (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q22","d":"Others"},{"s":"What is the Hitselberger sign?","o":["Vertigo on loud sound","Facial twitching on tragal pressure","Loss of the corneal reflex","Pain on pulling the pinna","Hypoaesthesia of the posterosuperior external auditory canal skin"],"k":"E","x":"Compression of sensory fibres of the facial nerve (nervus intermedius) by a vestibular schwannoma reduces sensation over the posterosuperior EAC (Hitselberger sign) — an early sign of CPA tumour (Scott-Brown).","src":"Board exam recall · 13 Nov 2026 · Q23","d":"Otology"},{"s":"In the middle cranial fossa approach, how is the internal auditory canal localized relative to the arcuate eminence/superior semicircular canal?","o":["It lies about 60° anterior to the axis of the superior canal, bisecting the angle between the GSPN and the arcuate eminence","It lies posterior to the superior canal","It lies at 90° to the GSPN, lateral to the geniculate ganglion","It lies parallel to and directly beneath the arcuate eminence","It runs along the line of the petrous ridge, behind the superior canal"],"k":"A","x":"⚑ Reconstructed from the recall (exact wording uncertain). — Fisch: the IAC lies about 60° anterior to the blue-lined superior canal. Garcia-Ibanez: the IAC bisects the angle (about 120°) between the GSPN and the arcuate eminence. Drilling starts medially at the porus, where the IAC is farthest from the cochlea and superior canal (Brackmann; Cummings).","src":"Board exam recall · 13 Nov 2026 · Q24","d":"Otology"},{"s":"A glottic carcinoma invades the paraglottic space but the vocal cord is mobile and the outer thyroid cortex is intact. What is the T stage (AJCC 8)?","o":["T1b","T4b","T4a","T2","T3"],"k":"E","x":"Glottic T3 = limited to the larynx with vocal fold fixation and/or invasion of the paraglottic space and/or the inner cortex of the thyroid cartilage. Through the outer cortex = T4a (AJCC 8).","src":"Board exam recall · 13 Nov 2026 · Q25","d":"Laryngology"},{"s":"What is the most common malignant tumour of the temporal bone in children?","o":["Squamous cell carcinoma","Chondrosarcoma","Langerhans cell histiocytosis","Rhabdomyosarcoma (embryonal)","Adenoid cystic carcinoma"],"k":"D","x":"Embryonal rhabdomyosarcoma is the commonest paediatric temporal bone malignancy (aural polyp, otorrhoea, facial palsy). SCC predominates in adults; LCH is not classed as a classic malignancy (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q26","d":"Otology"},{"s":"A parapharyngeal space mass displaces the internal carotid artery posteriorly (and the parapharyngeal fat medially). What is its most likely origin?","o":["Vagal paraganglioma","Carotid body tumour","Deep lobe of the parotid (prestyloid pleomorphic adenoma)","Sympathetic chain schwannoma","Retropharyngeal lymph node"],"k":"C","x":"Prestyloid lesions (deep lobe parotid/minor salivary tumours) push the ICA posteriorly. Poststyloid lesions (vagal paraganglioma, schwannoma) displace the ICA anteriorly/anteromedially; paragangliomas are flow-void, “salt-and-pepper” and avidly enhancing (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q27","d":"Head & Neck"},{"s":"What is the most commonly used columellar incision in open (external) rhinoplasty?","o":["Intercartilaginous incision only","Inverted-V (or stair-step) transcolumellar incision joined to bilateral marginal incisions","Horizontal straight incision at the columella base","Alar base (Weir) incision","Transfixion incision only"],"k":"B","x":"The inverted-V or stair-step transcolumellar incision at the narrowest point of the columella, connected to marginal (infracartilaginous) incisions, breaks up the scar and prevents notching (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q28","d":"Others"},{"s":"How are tip ptosis and saddle-nose deformity prevented during septoplasty?","o":["Preserve an L-strut of at least 10–15 mm dorsally and caudally","Fracture the vomer","Remove the entire quadrangular cartilage","Avoid preserving the caudal septum","Resect the anterior septal angle"],"k":"A","x":"A dorsal and caudal L-strut of at least 1–1.5 cm (with a stable keystone area) maintains dorsal height and tip support; over-resection causes saddling and tip ptosis (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q29","d":"Others"},{"s":"A 55-year-old has a level II metastatic SCC (p16-positive) with no primary found on examination or MRI. What is the most appropriate next investigation before panendoscopy?","o":["Chest X-ray only","Repeat FNAC only","Ultrasound of the abdomen","FDG PET-CT","Barium swallow"],"k":"D","x":"PET-CT (ideally before biopsies) detects the primary in about 25–40% of unknown-primary cases and guides directed biopsies, tonsillectomy and TORS tongue-base mucosectomy (NCCN; BAHNO).","src":"Board exam recall · 13 Nov 2026 · Q30","d":"Head & Neck"},{"s":"A patient has intermittent clear rhinorrhoea with positive β2-transferrin, but high-resolution CT does not localize the defect. What is the next investigation?","o":["Radionuclide bone scan","Repeat plain radiographs","Ultrasound","PET-CT","MR cisternography (heavily T2-weighted)"],"k":"E","x":"When HRCT is non-localizing, heavily T2-weighted MR cisternography shows the CSF tract or meningoencephalocele non-invasively. CT cisternography (intrathecal contrast) is for active leaks; intrathecal fluorescein helps intraoperatively (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q31","d":"Rhinology"},{"s":"During septorhinoplasty, internal nasal valve narrowing is most commonly corrected with:","o":["Spreader grafts","Cap graft","Shield graft","Alar batten grafts only","Columellar strut"],"k":"A","x":"Spreader grafts between the dorsal septum and upper lateral cartilages widen the internal valve angle (normal 10–15°) and prevent the inverted-V deformity (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q32","d":"Others"},{"s":"Oral tongue SCC extends posterolaterally into the masticator space/skull base (middle cranial fossa region), with two ipsilateral nodes of 2 cm (no ENE). What is the TNM stage (AJCC 8)?","o":["T4bN2b","T3N2b","T4aN2b","T4aN2a","T4bN1"],"k":"A","x":"⚑ The recalled answer was T4aN2b; skull base/masticator space involvement makes it T4b (AJCC 8). The stem was reconstructed from the recall. — Oral cavity T4b = invasion of the masticator space, pterygoid plates or skull base, or encasement of the ICA. T4a = cortical bone/maxillary sinus/facial skin. Multiple ipsilateral nodes ≤6 cm, ENE-negative = N2b (AJCC 8).","src":"Board exam recall · 13 Nov 2026 · Q33","d":"Head & Neck"},{"s":"A laryngeal cleft extends through the cricoid into the cervical trachea. What is its Benjamin–Inglis type?","o":["Type I","Type III","Type 0","Type IV","Type II"],"k":"B","x":"Benjamin–Inglis: I supraglottic interarytenoid (above the cords); II partial cricoid; III through the cricoid into the cervical trachea; IV into the thoracic trachea (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q34","d":"Paediatric"},{"s":"What is the preferred treatment for a short (<1 cm), thin, web-like subglottic stenosis?","o":["Observation","Laryngotracheal reconstruction with costal cartilage","Cricotracheal resection","Endoscopic radial incisions (CO2 laser/cold knife) with balloon dilatation","Permanent tracheostomy"],"k":"D","x":"Thin (Cotton–Myer I–II), short, non-circumferential webs respond well to endoscopic treatment (radial incisions + balloon dilatation ± mitomycin/steroid). Thick, long or grade III–IV stenoses need open resection or reconstruction (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q35","d":"Laryngology"},{"s":"What is the characteristic ENT finding in Plummer–Vinson (Paterson–Brown-Kelly) syndrome?","o":["Zenker diverticulum","Postcricoid oesophageal web with iron-deficiency anaemia","Tonsillar hypertrophy","Laryngeal papillomatosis","Achalasia"],"k":"B","x":"Dysphagia, postcricoid web, iron-deficiency anaemia, glossitis and koilonychia in middle-aged women; premalignant for postcricoid carcinoma (Scott-Brown).","src":"Board exam recall · 13 Nov 2026 · Q36","d":"Head & Neck"},{"s":"Which approach provides wide exposure for resection of an advanced (T3–T4a) base-of-tongue carcinoma?","o":["Transoral resection without retraction","Infratemporal fossa approach","Trans-nasal endoscopic approach","Lateral rhinotomy","Lip-split paramedian mandibulotomy (mandibular swing)"],"k":"E","x":"Paramedian mandibulotomy with lip split and mandibular swing gives excellent access to large tongue-base and oropharyngeal tumours. Transhyoid/lateral pharyngotomy suits small lesions; TORS suits selected T1–T2 (Shah; Cummings).","src":"Board exam recall · 13 Nov 2026 · Q37","d":"Head & Neck"},{"s":"After resection of a head and neck SCC, which pathological finding is an indication for postoperative concurrent chemoradiotherapy?","o":["Close margin of 4 mm only","Perineural invasion alone","Extranodal extension and/or positive margins","pT2 tumour","Single positive node without ENE"],"k":"C","x":"RTOG 9501/EORTC 22931: ENE and/or positive margins mandate concurrent cisplatin with PORT. Other adverse features (pT3–4, N2–3, PNI, LVI, close margins) indicate PORT alone (NCCN).","src":"Board exam recall · 13 Nov 2026 · Q38","d":"Head & Neck"},{"s":"In sinonasal malignancy, which orbital finding generally makes orbit-preserving curative surgery inappropriate and indicates exenteration or unresectability?","o":["Involvement of the orbital floor bone only","Erosion of the lamina papyracea only","Invasion of the orbital apex (with optic nerve/cavernous sinus extension)","Epiphora","Periorbital (periosteal) bowing"],"k":"C","x":"The orbit can be preserved when only bone or periorbita is involved. Invasion of orbital fat, extraocular muscles or the globe indicates exenteration, and orbital apex involvement with cavernous sinus/optic chiasm extension is usually unresectable for cure (T4b) (Cummings; NCCN).","src":"Board exam recall · 13 Nov 2026 · Q39","d":"Rhinology"},{"s":"Epistaxis persists after successful embolization of the internal maxillary artery. Which vessels are most likely responsible?","o":["Superior thyroid artery","Anterior and posterior ethmoidal arteries (ophthalmic, ICA system)","Ascending pharyngeal artery","Facial artery","Occipital artery"],"k":"B","x":"Embolization only treats the external carotid territory; the ethmoidal arteries (from the ophthalmic/ICA) cannot be embolized safely and are controlled by endoscopic or external ligation (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q40","d":"Rhinology"},{"s":"The Hadad–Bassagasteguy nasoseptal flap is pedicled on which artery?","o":["Superior labial artery","Greater palatine artery","Posterior septal artery (branch of the sphenopalatine)","Anterior ethmoidal artery","Posterior ethmoidal artery"],"k":"C","x":"The posterior septal artery runs across the anterior face of the sphenoid between the natural ostium and the choana; it must be protected during sphenoidotomy (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q41","d":"Rhinology"},{"s":"A patient on warfarin for atrial fibrillation presents with epistaxis. When is reversal of anticoagulation required?","o":["Never — anticoagulation must never be reversed","Always, in every epistaxis","Only if the patient is over 80 years","Only after posterior packing has been in place for 72 hours","When bleeding is uncontrolled or life-threatening despite packing, or the INR is above the therapeutic range"],"k":"E","x":"⚑ Reconstructed — the recalled \"packing\" is the local treatment; reversal is reserved as stated. — Most epistaxis on warfarin is controlled with local measures (cautery or packing) without stopping anticoagulation. Check the INR; reverse (vitamin K ± prothrombin complex concentrate) only for supratherapeutic INR or severe uncontrolled bleeding, in discussion with haematology/cardiology (ENT UK; Cummings).","src":"Board exam recall · 13 Nov 2026 · Q42","d":"Rhinology"},{"s":"Which post-manoeuvre instructions have traditionally been given after the Epley manoeuvre?","o":["Antibiotics","Immediate vestibular suppressants for one month","Repeat CT scan","Strict bed rest for one week","All of the following: sleep semi-upright, avoid lying on the affected side, and avoid head extension/bending for a few days"],"k":"E","x":"Traditional advice: semi-upright sleeping for 1–2 nights, avoid lying on the treated side and avoid head extension or bending for about a week. Current AAO-HNS BPPV guidelines state these restrictions add little benefit and are not routinely needed.","src":"Board exam recall · 13 Nov 2026 · Q43","d":"Otology"},{"s":"What is the most common cause of congenital stridor in infants?","o":["Subglottic stenosis","Subglottic haemangioma","Vascular ring","Laryngomalacia","Vocal fold paralysis"],"k":"D","x":"Laryngomalacia accounts for about 60% of congenital stridor: inspiratory, worse supine and with feeding, starting in the first weeks and usually resolving by 12–24 months (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q44","d":"Paediatric"},{"s":"Which of the following is an indication for supraglottoplasty in laryngomalacia?","o":["Omega-shaped epiglottis alone","Failure to thrive, apnoea/cyanotic episodes, or cor pulmonale","Parental anxiety","Stridor worse when supine only","Mild intermittent stridor while feeding"],"k":"B","x":"About 10–20% need surgery for severe disease: failure to thrive or feeding difficulty with aspiration, obstructive apnoea or cyanotic spells, pulmonary hypertension/cor pulmonale, and severe retractions (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q45","d":"Paediatric"},{"s":"Which tests are most useful to monitor hearing in noise-induced or ototoxic (e.g., cisplatin) hearing loss?","o":["Tuning forks","ABR only","Tympanometry alone","Pure-tone audiometry including extended high-frequency (>8 kHz) testing and DPOAEs","Caloric testing"],"k":"D","x":"Ototoxicity first affects the basal turn, so extended high-frequency audiometry (9–16 kHz) and DPOAEs detect damage early, before the speech frequencies are affected (ASHA ototoxicity guidelines).","src":"Board exam recall · 13 Nov 2026 · Q46","d":"Otology"},{"s":"How does ASSR differ from click-evoked ABR?","o":["ASSR requires a behavioural response","ASSR gives frequency-specific threshold estimates up to severe–profound levels (about 120 dB HL) using objective statistical detection","ABR is more frequency-specific than ASSR","ASSR measures middle ear compliance","ASSR cannot test infants"],"k":"B","x":"The click ABR estimates mainly 2–4 kHz thresholds up to about 90 dB nHL. ASSR uses amplitude/frequency-modulated tones and automatic detection to estimate thresholds at several frequencies, including profound losses, which helps hearing aid and implant candidacy (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q47","d":"Otology"},{"s":"Which ABR finding suggests a vestibular schwannoma?","o":["Interaural wave V latency difference >0.2 ms (prolonged I–V interpeak)","Normal ABR in all cases","Shortened I–III interval","Increased wave V amplitude","Absent wave I with normal V"],"k":"A","x":"Retrocochlear signs: interaural wave V latency difference (IT5) >0.2–0.4 ms, prolonged I–III/I–V interpeak intervals, or absent waves. ABR misses small intracanalicular tumours, so MRI is the gold standard (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q48","d":"Otology"},{"s":"In sudden sensorineural hearing loss, when does most spontaneous recovery occur?","o":["After 6 months","Only after steroid therapy","Within the first 2 weeks","Never — spontaneous recovery does not occur","After 1 year"],"k":"C","x":"About 32–65% recover spontaneously, mostly within the first 2 weeks. Treat with steroids (oral, or intratympanic as salvage) ideally within 2 weeks of onset (AAO-HNS 2019).","src":"Board exam recall · 13 Nov 2026 · Q49","d":"Otology"},{"s":"After a clothesline injury to the neck the patient has stridor and bilateral vocal fold immobility. Which associated injury must be suspected?","o":["Thyroid lobe haematoma","Arytenoid dislocation only","Oesophageal web","Laryngotracheal (cricotracheal) separation","Hyoid fracture"],"k":"D","x":"Cricotracheal separation stretches or transects both RLNs at the cricothyroid joints, giving bilateral palsy. The airway is secured by tracheostomy below the injury (often under local anaesthesia), followed by open repair (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q50","d":"Laryngology"},{"s":"How do you differentiate vocal fold paralysis (neuropathy) from mechanical cricoarytenoid fixation or dislocation?","o":["Stroboscopy alone","Voice handicap index","CT scan alone","Palpation of the arytenoid at direct laryngoscopy (± laryngeal EMG)","Tympanometry"],"k":"D","x":"Under anaesthesia the arytenoid moves passively in neural paralysis but is fixed or dislocated in mechanical lesions. Laryngeal EMG shows denervation in paralysis and normal recruitment in fixation (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q51","d":"Laryngology"},{"s":"The lateral lamella of the cribriform plate is approximately how many times thinner than the fovea ethmoidalis (ethmoid roof)?","o":["About 10 times thinner","They are equal","About 2 times thinner","It is thicker than the fovea","About 50 times thinner"],"k":"A","x":"⚑ The recall stated \"2 times\"; Kainz & Stammberger describe the lateral lamella as up to 10 times thinner. — Kainz & Stammberger: the lateral lamella (about 0.05–0.2 mm) can be up to 10 times thinner than the fovea ethmoidalis, making it the commonest site of iatrogenic CSF leak, especially with a deep Keros type III olfactory fossa (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q52","d":"Rhinology"},{"s":"What is the most common causative organism of acute otitis externa?","o":["Streptococcus pneumoniae","Candida albicans","Pseudomonas aeruginosa","Aspergillus niger","Staphylococcus aureus"],"k":"C","x":"Pseudomonas aeruginosa (about 40%) followed by S. aureus. Fungi (otomycosis) follow prolonged topical antibiotic use. Treat with topical antibiotic/steroid drops and aural toilet (AAO-HNS AOE guideline).","src":"Board exam recall · 13 Nov 2026 · Q53","d":"Otology"},{"s":"Alport syndrome results from a defect in which collagen type?","o":["Type IV","Type II","Type XI","Type I","Type III"],"k":"A","x":"COL4A5 (X-linked) or COL4A3/4: progressive SNHL, haemorrhagic nephritis and ocular lenticonus. Type II/XI defects cause Stickler syndrome; type I osteogenesis imperfecta (Scott-Brown).","src":"Board exam recall · 13 Nov 2026 · Q54","d":"Otology"},{"s":"Which nerve carries general sensation from the anterior two-thirds of the tongue?","o":["Chorda tympani","Greater petrosal nerve","Lingual nerve (V3)","Glossopharyngeal nerve","Hypoglossal nerve"],"k":"C","x":"Lingual nerve = general sensation; chorda tympani (VII) = taste anterior two-thirds; IX = posterior third (taste and sensation); XII = motor (Scott-Brown).","src":"Board exam recall · 13 Nov 2026 · Q55","d":"Head & Neck"},{"s":"Approximately what percentage of sphenoid sinuses show bony dehiscence of the internal carotid artery wall?","o":[">80%","<1%","20–30%","50–60%","5%"],"k":"C","x":"The ICA protrudes into the sphenoid sinus in up to about 70% of cases and its bony wall is dehiscent in roughly 20–25%. Septa inserting on the carotid prominence must never be twisted off (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q56","d":"Rhinology"},{"s":"An iatrogenic CSF leak is recognized during FESS. What is the approximate risk of meningitis if untreated, and the management?","o":["<1% — observation only","100% — prophylactic antibiotics for life","About 10–40% (roughly 10% per year) — repair the leak immediately at the time of recognition","No risk — leaks always close spontaneously","About 5% — lumbar drain only"],"k":"C","x":"Untreated CSF rhinorrhoea carries a cumulative meningitis risk of about 10–40%. Leaks recognized intraoperatively are repaired immediately with a multilayer graft or nasoseptal flap (success >90%); prophylactic antibiotics are not proven to help (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q57","d":"Rhinology"},{"s":"Which of the following is NOT an advantage of canal wall up mastoidectomy?","o":["Easy detection of residual/recurrent cholesteatoma","No lifelong cavity care","Better hearing aid fitting and water tolerance","Preservation of normal anatomy","Faster healing without a cavity"],"k":"A","x":"The disadvantage of CWU is that residual cholesteatoma is hidden behind the intact wall, so a planned second look or non-EPI DWI MRI surveillance is needed; CWD exposes recurrence for direct inspection (Brackmann).","src":"Board exam recall · 13 Nov 2026 · Q58","d":"Otology"},{"s":"What is the first-line treatment for moderate–severe obstructive sleep apnoea in adults?","o":["Uvulopalatopharyngoplasty","Weight loss alone","Mandibular advancement surgery","Tracheostomy","CPAP"],"k":"E","x":"CPAP is first-line for moderate–severe OSA (AHI ≥15) or symptomatic mild OSA. Oral appliances suit mild–moderate disease; surgery is for CPAP failure or for clear anatomical obstruction (AASM).","src":"Board exam recall · 13 Nov 2026 · Q59","d":"Others"},{"s":"A small (2-mm) facial nerve schwannoma of the geniculate region is found in a patient with House–Brackmann grade II weakness and normal hearing. If surgery is chosen, which approach is most appropriate?","o":["Middle cranial fossa resection with cable grafting","Translabyrinthine resection with grafting","Facial–hypoglossal anastomosis","Middle cranial fossa bony decompression of the nerve without tumour resection","Radical mastoidectomy"],"k":"D","x":"⚑ Reconstructed from the candidate’s clarification (facial nerve schwannoma, HB II; options were MCF decompression vs MCF grafting). — Facial nerve schwannomas with good function (HB I–II) are managed by observation, or bony decompression via the middle fossa (hearing preserved), to delay deterioration. Resection with grafting gives at best HB III, so it is reserved for HB III–IV or worse, or for rapid growth (Brackmann; Cummings).","src":"Board exam recall · 13 Nov 2026 · Q60","d":"Otology"},{"s":"A large glomus jugulare tumour (Fisch C) has already caused lower cranial nerve palsies (IX–XI) in a fit 45-year-old. What is the preferred management?","o":["Radiotherapy alone in every case","Surgical excision via infratemporal fossa approach after preoperative embolization","Chemotherapy","Observation only","Tympanomeningeal flap only"],"k":"B","x":"When lower cranial nerve deficits are already present and compensated, surgery adds little new morbidity, so excision is favoured in fit patients. Radiotherapy/radiosurgery is preferred in elderly patients or those with intact nerves at risk (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q61","d":"Otology"},{"s":"How does facial–masseteric nerve transfer differ from facial–hypoglossal transfer for facial reanimation?","o":["Hypoglossal transfer requires biting to smile","Masseteric transfer is used only for eye closure","Masseteric transfer gives a strong, fast smile with minimal donor deficit but needs biting to initiate; hypoglossal transfer gives better resting tone but causes tongue weakness/atrophy","They give identical results","Masseteric transfer causes tongue atrophy"],"k":"C","x":"Masseteric nerve (V3): strong commissure excursion, little donor morbidity, smiling linked to clenching (often later dissociated by cortical adaptation). Hypoglossal (classic or split/jump): good tone and symmetry, with tongue hemiatrophy, dysphagia/speech issues and synkinesis with eating (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q62","d":"Others"},{"s":"How are epithelial pearls (cysts) and anterior blunting prevented in overlay (lateral graft) tympanoplasty?","o":["Avoiding canal skin elevation altogether","Placing the graft under the malleus only","Leaving the squamous epithelium on the remnant","Complete de-epithelialization of the drum remnant/canal and preservation or recreation of a sharp anterior tympanomeatal angle with careful packing","Using no packing"],"k":"D","x":"Residual squamous epithelium under the graft causes pearls; failure to recreate the anterior sulcus (canal skin and graft not well apposed, excessive soft tissue anteriorly) causes blunting. Meticulous de-epithelialization and correct anterior packing prevent both (Brackmann).","src":"Board exam recall · 13 Nov 2026 · Q63","d":"Otology"},{"s":"A patient has dysphagia, hoarseness and shoulder weakness on one side (IX, X, XI palsy — Vernet syndrome). Where is the lesion?","o":["Superior orbital fissure","Foramen ovale","Internal acoustic meatus","Hypoglossal canal","Jugular foramen"],"k":"E","x":"Vernet syndrome = IX, X, XI at the jugular foramen (glomus jugulare, schwannoma, metastasis). Add XII = Collet-Sicard; add sympathetics (Horner) = Villaret, indicating a retroparotid/parapharyngeal lesion (Scott-Brown).","src":"Board exam recall · 13 Nov 2026 · Q64","d":"Head & Neck"},{"s":"In facial paralysis of more than 2 years’ duration (atrophied facial muscles), which is commonly used for dynamic smile reanimation?","o":["Botulinum toxin","Great auricular nerve cable graft","Primary facial nerve repair","Gold weight only","Free gracilis muscle transfer (innervated by cross-face graft or masseteric nerve)"],"k":"E","x":"After about 18–24 months the facial muscles atrophy, so nerve repair alone fails and new muscle is needed. Free gracilis (obturator nerve) is the workhorse; temporalis tendon transfer is a single-stage regional alternative (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q65","d":"Others"},{"s":"What does the “halo sign” on temporal bone CT indicate?","o":["Cochlear (retrofenestral) otosclerosis — pericochlear radiolucency","Cholesteatoma","Paget disease only","Labyrinthitis ossificans","Superior canal dehiscence"],"k":"A","x":"The double-ring/halo sign is a lucent band around the cochlea from otospongiotic foci in retrofenestral otosclerosis, associated with SNHL (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q66","d":"Otology"},{"s":"A patient with poorly controlled type 2 diabetes develops sudden sensorineural hearing loss. What is a useful treatment option?","o":["Vasodilators","High-dose oral steroids without monitoring","Hyperbaric oxygen as sole treatment","Intratympanic steroid injection","Antiviral therapy alone"],"k":"D","x":"Intratympanic dexamethasone or methylprednisolone gives high perilymph levels with minimal systemic effect, so it is preferred as primary therapy when systemic steroids are relatively contraindicated (diabetes, hypertension) (AAO-HNS 2019).","src":"Board exam recall · 13 Nov 2026 · Q67","d":"Otology"},{"s":"How do intratympanic steroids mainly reach the inner ear?","o":["Via the Eustachian tube","Via the blood stream","Through the oval window only","Diffusion across the round window membrane into the scala tympani","Through the endolymphatic sac"],"k":"D","x":"The round window membrane is the main route (the oval window annular ligament is minor), so keep the head turned for 20–30 minutes and remove pseudomembranes over the niche if needed (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q68","d":"Otology"},{"s":"In Wullstein type IV tympanoplasty, why is the graft placed to shield the round window niche?","o":["To create a phase difference between the oval and round windows (round window protection), preventing sound cancellation","To seal a perilymph fistula","To prevent cholesteatoma recurrence","To protect the facial nerve","To improve Eustachian tube function"],"k":"A","x":"In type IV the graft lies on the mobile footplate, creating a small middle ear (cavum minor) around the round window. Sound reaches the oval window directly while the round window is shielded, so the windows are not stimulated in phase (Brackmann).","src":"Board exam recall · 13 Nov 2026 · Q69","d":"Otology"},{"s":"A fit 58-year-old has locally advanced supraglottic carcinoma judged unresectable (T4b, prevertebral fascia involvement). What is the most appropriate treatment?","o":["Total laryngectomy","Definitive concurrent cisplatin chemoradiotherapy","Laser debulking alone","Supraglottic laryngectomy","Observation"],"k":"B","x":"⚑ Reconstructed: true T4a is resectable by definition; \"unresectable\" disease is T4b. — Unresectable disease (T4b) in a patient with good performance status is treated with concurrent chemoradiotherapy (or induction followed by CRT). Palliative radiotherapy or systemic therapy is for poor performance status (NCCN).","src":"Board exam recall · 13 Nov 2026 · Q70","d":"Laryngology"},{"s":"In an immunocompromised (neutropenic) patient, a black necrotic middle turbinate suggests:","o":["Allergic fungal sinusitis","Fungal ball","Rhinoscleroma","Atrophic rhinitis","Acute invasive fungal rhinosinusitis (mucormycosis/aspergillosis) with angioinvasion"],"k":"E","x":"Angioinvasion causes thrombosis and ischaemic necrosis (pale then black mucosa, often painless on biopsy). Management is urgent biopsy, liposomal amphotericin B, surgical debridement and reversal of the immunosuppression (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q71","d":"Rhinology"},{"s":"Which is NOT one of the Bent–Kuhn criteria for allergic fungal rhinosinusitis?","o":["Eosinophilic mucin with fungal hyphae without invasion","Characteristic CT findings","Fungal invasion of tissue","Type I hypersensitivity","Nasal polyposis"],"k":"C","x":"Bent–Kuhn major criteria: type I (IgE) hypersensitivity, nasal polyps, characteristic CT (heterogeneous hyperdensity, expansion), eosinophilic mucin and positive fungal stain WITHOUT tissue invasion. Invasion defines invasive fungal disease (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q72","d":"Rhinology"},{"s":"What type of hypersensitivity reaction causes allergic rhinitis?","o":["Type IV (delayed, T-cell)","Type II (cytotoxic)","Type III (immune complex)","None — it is non-immune","Type I (IgE-mediated immediate)"],"k":"E","x":"Allergen cross-links IgE on mast cells → histamine/leukotriene release (early phase) followed by an eosinophilic late phase at 4–8 h (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q73","d":"Others"},{"s":"When acute invasive fungal sinusitis is suspected, which site gives the highest diagnostic yield on biopsy?","o":["Nasal septum (caudal)","Vestibular skin","Middle turbinate","Nasal floor","Inferior turbinate"],"k":"C","x":"The middle turbinate is the commonest site of early invasion; biopsy abnormal-looking (pale, insensate or black) mucosa there, then the septum and palate if suspicious (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q74","d":"Rhinology"},{"s":"What is the relationship of the chorda tympani in the middle ear?","o":["It runs medial to the long process of the incus","It runs inferior to the round window","It runs lateral to the malleus handle","It passes through the stapes crura","It runs medial to the neck of the malleus and lateral to the long process of the incus"],"k":"E","x":"The chorda crosses the tympanic membrane medial to the malleus neck/handle and lateral to the long process of the incus, then exits through the petrotympanic fissure (Scott-Brown).","src":"Board exam recall · 13 Nov 2026 · Q75","d":"Otology"},{"s":"During FESS a separate posterior fontanelle accessory ostium is found alongside the natural maxillary ostium. What is the correct management?","o":["Close the natural ostium","Join the accessory and natural ostia into one antrostomy","Enlarge only the accessory ostium","Perform a Caldwell-Luc","Leave both untouched"],"k":"B","x":"Two separate openings cause mucus recirculation (out of the natural ostium and back in via the accessory one), perpetuating sinusitis. Connecting them in a single middle meatal antrostomy stops recirculation (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q76","d":"Rhinology"},{"s":"Gustatory sweating and flushing over the parotid region after parotidectomy is called:","o":["Crocodile tears syndrome","Eagle syndrome","Frey syndrome","First bite syndrome","Horner syndrome"],"k":"C","x":"Aberrant regeneration of auriculotemporal parasympathetic fibres to sweat glands; confirmed by the Minor starch–iodine test and treated with botulinum toxin or prevented by an SMAS flap/ADM interposition (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q77","d":"Head & Neck"},{"s":"What is the most common cause of retropharyngeal abscess in children?","o":["Dental infection","Tuberculosis","Foreign body ingestion","Upper respiratory tract infection with suppuration of retropharyngeal (Rouvière) nodes","Trauma from instrumentation"],"k":"D","x":"The retropharyngeal nodes are prominent in children under about 5 years and involute later, so most paediatric cases follow URTI. In adults, trauma, foreign bodies and instrumentation predominate (Scott-Brown).","src":"Board exam recall · 13 Nov 2026 · Q78","d":"Paediatric"},{"s":"A child needs an emergency life-saving blood transfusion but the parents (Jehovah’s Witnesses) refuse. What is the most appropriate action?","o":["Wait until the child is 18","Give saline only and document","Discharge the child","Respect the refusal and withhold treatment","Give the transfusion in an emergency in the child’s best interests (and seek legal/court authority when time allows)"],"k":"E","x":"Parental refusal cannot override a child’s right to life-saving treatment. In an emergency, proceed and document; if time allows, seek a court order. Use blood-sparing strategies where possible (GMC; ethical/legal guidance).","src":"Board exam recall · 13 Nov 2026 · Q79","d":"Others"},{"s":"What is the best MRI sequence for detecting residual or recurrent cholesteatoma?","o":["T1 with fat suppression","Non-echo-planar diffusion-weighted imaging (non-EPI DWI, e.g., HASTE)","MR angiography","Contrast-enhanced T1 only","FLAIR"],"k":"B","x":"Cholesteatoma restricts diffusion (bright on non-EPI DWI, low ADC). This sequence detects lesions down to about 2–3 mm and can replace planned second-look surgery (Scott-Brown).","src":"Board exam recall · 13 Nov 2026 · Q80","d":"Otology"},{"s":"Which features characterize adenoid cystic carcinoma of the parotid?","o":["Perineural invasion and late distant (pulmonary) metastases","Early nodal metastasis and short natural history","Association with smoking and bilaterality","Commonest malignant parotid tumour","Radio-insensitivity and no recurrence after 5 years"],"k":"A","x":"ACC: slow-growing with perineural spread (skip lesions) causing pain or palsy, late lung metastases (often decades), low nodal rate, and recurrences beyond 10–15 years. Cribriform/tubular types do better than solid (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q81","d":"Head & Neck"},{"s":"What is the best imaging investigation for suspected facial nerve (perineural) invasion by a parotid malignancy?","o":["PET only","Plain CT without contrast","Ultrasound","Sialography","Gadolinium-enhanced MRI with fat suppression"],"k":"E","x":"⚑ No answer was recalled; answered from the references. — Contrast MRI shows nerve thickening, enhancement and obliteration of fat at the stylomastoid foramen, with tracking along the mastoid segment, which defines perineural spread and surgical extent (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q82","d":"Head & Neck"},{"s":"What is the ideal nasolabial angle in women?","o":["120–130°","95–115°","90–95°","60–70°","80–85°"],"k":"B","x":"The nasolabial angle (columella to upper lip) is ideally about 95–115° in women and 90–95° in men. Under-rotation (<90°) or over-rotation (>120°) is unaesthetic and guides tip rotation surgery (Cummings).","src":"Board exam recall · 13 Nov 2026 · Q83","d":"Others"}]}];let PI=0;let P=PAPERS[0];let Q=P.q;const L='ABCDEF';
const DOMS=['Otology','Rhinology','Laryngology','Head & Neck','Paediatric','Others'];
let S={mode:'exam',mins:180,phase:'start',pos:0,ans:{},flag:{},end:0,start:0,tick:null,used:0,list:[],rpos:0,rtitle:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')};
function nav(html){let n=document.querySelector('.nav');if(!html){n&&n.remove();return}if(!n){n=document.createElement('div');n.className='nav';document.body.appendChild(n)}n.innerHTML='<div class="navi">'+html+'</div>'}
function startScreen(){
  S.phase='start';nav();clearInterval(S.tick);
  const cnt={};Q.forEach(q=>cnt[q.d]=(cnt[q.d]||0)+1);
  $('#app').innerHTML=`<div class="kicker">Palestinian Board · Exam recall 2026</div><h1>Board exam recall</h1><b>Paper</b><div class="seg" role="group" aria-label="Paper" style="flex-wrap:wrap">${PAPERS.map((p,i)=>`<button class="${PI==i?'on':''}" onclick="pickPaper(${i})">${i+1}</button>`).join('')}</div><h2 style="margin:14px 0 6px;font-size:1.15rem">${esc(P.title)}</h2>
  <p class="sub">83 questions recalled from the Palestinian ENT Board exam of 13 November 2026, rebuilt as full single-best-answer MCQs with five options, answers and referenced explanations (Cummings, Scott-Brown, Brackmann, AJCC 8, NCCN). Questions reconstructed or corrected from the recall are marked ⚑. Prepared by Dr. Abdalhadi Seyam for junior residents.</p>
  <div class="card"><table>${DOMS.filter(d=>cnt[d]).map(d=>`<tr><td>${d}</td><td>${cnt[d]}</td></tr>`).join('')}</table></div>
  <b>Mode</b><div class="seg" role="group" aria-label="Mode"><button class="${S.mode=='exam'?'on':''}" onclick="S.mode='exam';startScreen()">Exam — marked at the end</button><button class="${S.mode=='practice'?'on':''}" onclick="S.mode='practice';startScreen()">Practice — instant feedback</button></div>
  ${S.mode=='exam'?`<b>Time</b><div class="seg" role="group" aria-label="Time limit">${[180,150,120,90].map(m=>`<button class="${S.mins==m?'on':''}" onclick="S.mins=${m};startScreen()">${m==180?'3 h':m+' min'}</button>`).join('')}</div>`:''}
  <button class="primary" onclick="begin()">Start paper</button>
  <p class="note">${S.mode=='exam'?'You can change answers and flag questions until you submit. The paper submits itself when time runs out.':'Each answer is marked when you tap it and locks. Untimed.'} Progress is kept while this page stays open.</p>`;
  scrollTo(0,0)}
function begin(){S.ans={};S.flag={};S.pos=0;S.phase='run';S.start=Date.now();
  if(S.mode=='exam'){S.end=S.start+S.mins*60000;S.tick=setInterval(()=>{const r=S.end-Date.now();const t=$('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}
  show()}
function answered(){return Object.keys(S.ans).length}
function show(){
  const q=Q[S.pos],a=S.ans[S.pos],prac=S.mode=='practice';
  let h=`<div class="top"><div class="topi">${S.mode=='exam'?`<span class="timer" id="tm">${fmt(S.end-Date.now())}</span>`:`<span class="timer">${Object.entries(S.ans).filter(([i,v])=>v==Q[i].k).length}/${answered()}</span>`}<span class="t">${answered()} of ${Q.length} answered</span><button class="flagbtn ${S.flag[S.pos]?'on':''}" onclick="flag()" aria-pressed="${!!S.flag[S.pos]}">${S.flag[S.pos]?'Flagged':'Flag'}</button></div><div class="bar"><i style="width:${(S.pos+1)}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${Q.length}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${S.pos+1}" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,i)=>{const l=L[i];let c='';if(prac&&a){if(l==q.k)c='ok';else if(l==a)c='bad'}else if(a==l)c='sel';
    h+=`<button class="opt ${c}" ${prac&&a?'disabled':''} onclick="pick('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(prac&&a)h+=expl(q,a);
  $('#app').innerHTML=h;
  const last=S.pos==Q.length-1;
  nav(`<button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Questions</button>${last?`<button class="primary" onclick="confirmSubmit()">Submit</button>`:`<button class="primary" onclick="go(1)">Next</button>`}`);
}
function expl(q,a){const ok=a==q.k;
  return `<div class="exp"><h3 class="${a?(ok?'ok':'bad'):'na'}">${a?(ok?'Correct':'Incorrect'):'Not answered'} — answer ${q.k}</h3>${q.x?`<p>${esc(q.x)}</p>`:`<p class="note">The source gives the key only for this question.</p>`}${q.xi?q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join(''):''}<div class="src">${esc(q.d)} · ${esc(q.src)}</div></div>`}
function pick(l){if(S.mode=='practice'&&S.ans[S.pos])return;if(S.mode=='exam'&&S.ans[S.pos]==l)delete S.ans[S.pos];else S.ans[S.pos]=l;const y=scrollY;show();scrollTo(0,y)}
function flag(){S.flag[S.pos]?delete S.flag[S.pos]:S.flag[S.pos]=1;const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(Q.length-1,S.pos+d));show();scrollTo(0,0)}
function grid(){const d=$('#dlg');const nf=Object.keys(S.flag).length,na=Q.length-answered();
  d.innerHTML=`<b>Questions</b><div class="legend" style="margin-top:6px"><span class="a">Answered (${answered()})</span><span class="f">Flagged (${nf})</span><span>Unanswered (${na})</span></div>
  <div class="grid">${Q.map((_,i)=>`<button class="${S.ans[i]?'ans':''} ${S.flag[i]?'flg':''} ${i==S.pos?'cur':''}" onclick="S.pos=${i};$('#dlg').close();show();scrollTo(0,0)" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div>
  <div class="row"><button class="ghost" onclick="$('#dlg').close()">Close</button><button class="primary" onclick="$('#dlg').close();confirmSubmit()">Submit paper</button></div>`;d.showModal()}
function confirmSubmit(){const d=$('#dlg');const na=Q.length-answered(),nf=Object.keys(S.flag).length;
  d.innerHTML=`<b>Submit this paper?</b><p class="note">${na?`${na} question${na>1?'s are':' is'} unanswered. `:'All questions answered. '}${nf?`${nf} flagged.`:''} You can't change answers after submitting.</p><div class="row"><button class="ghost" onclick="$('#dlg').close()">Keep going</button><button class="primary" onclick="$('#dlg').close();submit()">Submit</button></div>`;d.showModal()}
function submit(auto){clearInterval(S.tick);S.used=Date.now()-S.start;S.phase='done';S.auto=!!auto;if($('#dlg').open)$('#dlg').close();results()}
function results(){nav();
  let r=0;const by={};Q.forEach((q,i)=>{const b=by[q.d]=by[q.d]||{n:0,r:0};b.n++;if(S.ans[i]==q.k){r++;b.r++}});
  const wrong=Q.map((q,i)=>i).filter(i=>S.ans[i]&&S.ans[i]!=Q[i].k),skip=Q.map((q,i)=>i).filter(i=>!S.ans[i]),fl=Object.keys(S.flag).map(Number).sort((a,b)=>a-b);
  $('#app').innerHTML=`<div class="kicker">${esc(P.title)}</div><h1>Results</h1>${S.auto?'<p class="note">Time ran out — the paper was submitted automatically.</p>':''}
  <div class="big">${r}<span style="font-size:1.4rem;color:var(--muted)">/100</span></div><p class="sub">${wrong.length} incorrect · ${skip.length} unanswered · time used ${fmt(S.used)}</p>
  <div class="card"><table>${DOMS.filter(d=>by[d]).map(d=>{const b=by[d],p=Math.round(b.r/b.n*100);return `<tr><td>${d}<div class="meter"><i style="width:${p}%"></i></div></td><td>${b.r}/${b.n} · ${p}%</td></tr>`}).join('')}</table></div>
  <div class="row"><button class="primary" ${wrong.length+skip.length?'':'disabled'} onclick="review('Incorrect and unanswered',${JSON.stringify(wrong.concat(skip).sort((a,b)=>a-b))})">Review incorrect (${wrong.length+skip.length})</button></div>
  <div class="row"><button class="ghost" ${fl.length?'':'disabled'} onclick="review('Flagged',${JSON.stringify(fl)})">Flagged (${fl.length})</button><button class="ghost" onclick="review('All questions',${JSON.stringify(Q.map((_,i)=>i))})">All 100</button></div>
  <div class="row"><button class="ghost" onclick="startScreen()">Retake paper</button></div>`;scrollTo(0,0)}
function review(t,list){S.list=list;S.rpos=0;S.rtitle=t;rshow()}
function rshow(){const i=S.list[S.rpos],q=Q[i],a=S.ans[i];
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="results()">Results</button><span class="t">${S.rtitle} · ${S.rpos+1}/${S.list.length}</span>${S.flag[i]?'<span class="flagbtn on">Flagged</span>':''}</div></div>
  <div class="qn">Question ${i+1}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,j)=>{const l=L[j];const c=l==q.k?'ok':(l==a?'bad':'');h+=`<button class="opt ${c}" disabled><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  h+=expl(q,a);$('#app').innerHTML=h;
  nav(`<button class="ghost" ${S.rpos?'':'disabled'} onclick="S.rpos--;rshow();scrollTo(0,0)">Previous</button><button class="primary" ${S.rpos<S.list.length-1?'':'disabled'} onclick="S.rpos++;rshow();scrollTo(0,0)">Next</button>`)}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
window.addEventListener('beforeunload',e=>{if(S.phase=='run'){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(S.phase!='run'||$('#dlg').open)return;if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else{const i=L.indexOf(e.key.toUpperCase());if(e.key.length==1&&i>=0&&i<Q[S.pos].o.length)pick(L[i])}});
startScreen();

function pickPaper(i){PI=i;P=PAPERS[i];Q=P.q;S.ans={};S.flag={};S.pos=0;startScreen()}</script></body></html>
