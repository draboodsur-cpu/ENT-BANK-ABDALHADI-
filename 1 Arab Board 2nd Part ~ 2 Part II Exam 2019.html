<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ENT Part II Exam 2019 — Answered &amp; Referenced</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--amber:#B06A00;--amber-soft:#FBEFD9;--box:#0B1418;--on-teal:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--amber:#E8A94A;--amber-soft:#3A2C14;--box:#000;--on-teal:#06201F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td:last-child{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px 8px;text-align:center}
.seg button.on{background:var(--teal);color:var(--on-teal);font-weight:600}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note{font-size:.9rem;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.timer{font:700 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.topi .t{flex:1;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.flagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
.flagbtn.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.qn{font-weight:600;font-size:.9rem;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{opacity:1}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}.exp h3.na{color:var(--amber)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;position:relative}
.grid .ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.grid .flg{box-shadow:inset 0 0 0 2px var(--amber)}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-na{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid .cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.legend .a::before{background:var(--teal-soft);border-color:var(--teal)}.legend .f::before{box-shadow:inset 0 0 0 2px var(--amber)}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3.2rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>button{flex:1}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--teal)}
</style></head><body>

const PAPERS=[{"title":"2019 Exam · Paper A","q":[{"s":"Regarding sinus fungal ball (mycetoma)","o":["occurs in immune-compromised patients","nasal polyps occurs in 80% of patient","sphenoid sinus is the most common site","nasal discharge and anosmia are the most common clinical presentation","the treatment of choice is surgery"],"k":"E","x":"Fungus ball occurs in immunocompetent patients, usually in the maxillary sinus; treatment is surgical removal (endoscopic) (EPOS).","src":"2019 exam recall · Q1","d":"Rhinology"},{"s":"Parapharyngeal abscess all true except","o":["Lateral neck mass","CT & MRI are diagnostic","Mostly due to tonsillitis or peritonsillar abscess","Causative organism are streptococcus","I.V antibiotic is the mainstay of treatment"],"k":"E","x":"A parapharyngeal abscess needs surgical drainage — IV antibiotics alone are not the mainstay once an abscess forms (Cummings).","src":"2019 exam recall · Q2","d":"Others"},{"s":"Efficacy of radiotherapy of the head & neck tumors","o":["squamous cell tumors are more responsive than tumors of lymphoid origin","sarcomas of bony origin have good response rate (very poor)","efficacy of radiotherapy is enhanced by hypothermia","photons damage cells more effectively then neutrons","hypoxia protects tumours cells"],"k":"E","x":"Hypoxia makes tumour cells radioresistant; lymphoid tumours are more radiosensitive than SCC, and neutrons cause more damage than photons (Scott-Brown).","src":"2019 exam recall · Q3","d":"Head & Neck"},{"s":"In the Myer-Cotton grading of subglottic stenosis , 60% stenosis would be","o":["Grade 0","Grade I","Grade II","grade III","grade IV"],"k":"C","x":"Myer–Cotton grade II = 51–70% obstruction (Cummings).","src":"2019 exam recall · Q4","d":"Others"},{"s":"The most common tumor of the parapharyngeal space is","o":["adenoid cystic carcinoma","adenocarcinoma","pleomorphic adenoma","meningioma","vagal schwannoma"],"k":"C","x":"Pleomorphic adenoma (deep lobe/minor salivary) is the commonest parapharyngeal space tumour (Cummings).","src":"2019 exam recall · Q7","d":"Head & Neck"},{"s":"All are true regarding papillary carcinoma of the thyroid EXCEPT","o":["it accounts for 70-85% of all cancers of the thyroid","men are more affected than women Female","it spread by lymphatic routes","it possesses the best prognosis","the average age of diagnosis is 40 years"],"k":"B","x":"Papillary thyroid cancer is commoner in women (Cummings).","src":"2019 exam recall · Q8","d":"Head & Neck"},{"s":"Neck dissection for a T3N0 well-differentiation left lower lip cancer patient for whom radiotherapy is not indicated should involve","o":["Right level I & left I-III selective Neck dissection","left parotid & left I-III Neck dissection","left modified radical (I-V) Neck dissection","left I-III selective Neck dissection","no Neck dissection as the risk of cervical metastasis is low"],"k":"A","x":"A T3 lower lip cancer near the midline drains bilaterally to submental nodes: ipsilateral levels I–III plus contralateral level I (Shah).","src":"2019 exam recall · Q9","d":"Head & Neck"},{"s":"The commonest site for the development of a second primary malignant in a patient with oropharyngeal carcinoma is","o":["larynx","upper esophagus","nasopharynx","postcricoid area","main bronchus"],"k":"B","x":"Second primaries after oropharyngeal cancer arise mainly in the upper aerodigestive tract (oesophagus) and lung (Cummings).","src":"2019 exam recall · Q11","d":"Head & Neck"},{"s":"A patient with a T3N0 Sq. cell Ca. of the lateral floor of the mouth is to undergo surgical treatment , which of the following is an appropriate Neck dissection in this case?","o":["selective neck dissection of levels I&II","selective neck dissection of levels I,II&III","selective neck dissection of levels II,III&IV","modified radical neck dissection type II","modified radical neck dissection type I"],"k":"B","x":"T3N0 lateral floor of mouth: supraomohyoid neck dissection (levels I–III) (Bailey).","src":"2019 exam recall · Q12","d":"Head & Neck"},{"s":"patient of 40 years old complaining of a CHL headache ,diplopia , facial hyperesthesia .the most probable etiology of his condition","o":["petrous apex lesion","cholesteatoma of the anterior epitympanic recess","posterior fossa lesion","tumor of the end lymphatic sac","none of the above"],"k":"A","x":"Conductive loss, headache, diplopia (VI) and facial (V) symptoms suggest a petrous apex lesion (Scott-Brown).","src":"2019 exam recall · Q13","d":"Others"},{"s":"a 46 year old male has a lesion on the left lateral border of mobile tongue diagnosed as Sq. cell Ca.it is staged as T2N0M0 which of the following is the best accepted treatment for him","o":["wedge resection and suprahyoid neck dissection clearing level I-II","radical dose radiation","subtotal glossectomy","wedge resection radiotherapy to the neck","Hemiglossectomy with level I-III neck dissection"],"k":"E","x":"T2N0 lateral tongue SCC: partial (hemi)glossectomy with elective neck dissection levels I–III (NCCN).","src":"2019 exam recall · Q14","d":"Head & Neck"},{"s":"a patient has the following clinical extent of the tumor (Sq. cell Ca.) right supraglottic tumor involving the false cord , aryepiglottic fold and arytenoid on right side right side vocal cord is fixed, there is 3cm lymph node at level III on left side no evidence of distant metastasis mention the clinical stage that best describes the lesion: T3: vocal fold fixation or primary tumor invades postcricoid area, pre","o":["T2N2AM0","T2N2c M0","T3N2AM0","T3N2BM0","T3N2CM0"],"k":"E","x":"Supraglottic tumour with bilateral nodes: N2c (AJCC 8).","src":"2019 exam recall · Q15","d":"Laryngology"},{"s":"Glottic T1b tumors are defined as those that","o":["are limited to one vocal cord","are limited to the anterior commissure","are limited to the vocal process of the arytenoids","involve both vocal cords","extend to the supraglottic or subglottic"],"k":"D","x":"T1b glottic cancer involves both vocal folds (AJCC 8).","src":"2019 exam recall · Q16","d":"Laryngology"},{"s":"The most common complication of VS resection","o":["CSF leak","Meningitis","Facial nerve palsy","Hydrocephalus"],"k":"A","x":"CSF leak is the commonest complication after vestibular schwannoma surgery (Cummings).","src":"2019 exam recall · Q17","d":"Others"},{"s":"In a 55 year old patient with an enlarged ulcerative lesion of the floor of the mouth clinical findings that would suggest mandibular invasion include","o":["tender on palpation","pain during eating","decrease sensation along the tongue","decrease sensation along the lower lip","palpable submandibular L.N"],"k":"D","x":"Numbness along the inferior alveolar/mental nerve distribution suggests mandibular canal invasion (Shah).","src":"2019 exam recall · Q18","d":"Head & Neck"},{"s":"A young patient with dysphagia regurgitation but no dyspnea investigation include Ba. Swallow &angiography revealed an indentation of the esophagus posteriorly the condition could be to","o":["double aortic arch","anomalous right subclavian arteryand an aberrant left subclavian artery with a right aortic arch will be evident as a small","anomalous innominate artery","patent ductus arteriosus","Coarctation of aorta"],"k":"B","x":"Dysphagia lusoria with posterior oesophageal indentation: aberrant right subclavian artery (Cummings).","src":"2019 exam recall · Q19","d":"Laryngology"},{"s":"A 37 year old man with a unilateral nasal mass the biopsy showed esthesioneuroblastoma which is penetrating the skull base but not the Dura the Localized skull base invasion treatment of this pt. is : does not necessarily preclude","o":["chemotherapy & palliative radiotherapy","radiotherapy followed by salvage surgery","Cranio-facial resection followed by radiotherapy","intra nasal followed by radiotherapy ??","intranasal followed by chemotherapy"],"k":"C","x":"Esthesioneuroblastoma through the skull base: craniofacial (or endoscopic) resection with postoperative radiotherapy (Cummings).","src":"2019 exam recall · Q20","d":"Rhinology"},{"s":"A 51 years old is sent for a Ba. Swallow reported as aperistalsis esophageal dilatation & failure of the lower esophageal sphincter to relax with retention of the ingested materials this patient probably has","o":["Achalasia of the cardia","diffuse esophageal spasm","oesophageal carcinoma","pharyngeal pouch","tracheo-esophageal fistula"],"k":"A","x":"Aperistalsis, oesophageal dilatation and failed LES relaxation = achalasia (Scott-Brown).","src":"2019 exam recall · Q21","d":"Laryngology"},{"s":"The MOST accurate diagnosis of a superior laryngeal nerve paralysis is made by","o":["history","physical examination","electro glottography","electromyography","Phonoanalysis"],"k":"D","x":"Laryngeal EMG is the most accurate test for superior laryngeal nerve paralysis (Cummings).","src":"2019 exam recall · Q22","d":"Laryngology"},{"s":"Which diagnostic test is highly specific for Wegener’s granulomatosis?","o":["anticentrometer antibodies","rapid plasma reagent","antinuclear anticytoplasmic antibodies","antinuclear antibody","Antismooth muscle antibody"],"k":"C","x":"c-ANCA (PR3) is highly specific for GPA (Cummings).","src":"2019 exam recall · Q23","d":"Others"},{"s":"The MOST common cause of congenital hearing loss in patient with radiographically normal inner ear is","o":["Cochleo-saccular dysplasia","Utricular dysplasia","Semicircular canal abnormalities","collapsed cochlear basal turn dysplasia","Mondini malformation"],"k":"A","x":"Cochleosaccular (Scheibe) dysplasia is the commonest cause of congenital deafness with normal inner ear imaging (Scott-Brown).","src":"2019 exam recall · Q24","d":"Otology"},{"s":"Duration of antimicrobial therapy in a patient with malignant external otitis is determined by","o":["serum glucose level","electroneuronography","gallium scan and erythrocyte sedimentation rate","magnetic resonance imaging","relief of symptoms"],"k":"C","x":"Gallium scan and ESR determine treatment duration in necrotizing otitis externa (Ballenger).","src":"2019 exam recall · Q26","d":"Otology"},{"s":"The most critical factor in avoiding injury to the facial nerve during mastoid operations","o":["use of a facial nerve monitor","a preoperative CT scan","drilling parallel to the","using a diamond bur","exposing the sheath of the nerve by removing the overlying bone"],"k":"C","x":"Drilling parallel to the facial nerve (with good identification of landmarks) is the most critical safety factor (Ballenger).","src":"2019 exam recall · Q27","d":"Otology"},{"s":"Critical steps in constructing a canal wall down mastoid cavity include all of the following except","o":["removal of the mastoid tip","obliteration of the mastoid with soft tissue. Optional step","wide saucerization of the cavity","always drilling parallel to the facial nerve and using copious irrigation to identify the sheath before","removal of conchal cartilage when performing the meatoplasty"],"k":"B","x":"Mastoid obliteration is not a required step in constructing a canal wall down cavity (Ballenger).","src":"2019 exam recall · Q28","d":"Otology"},{"s":"Which of the following otogenic complications is least likely to require surgery?","o":["meningitis in a 15-month-old girl which will respond to medical management","meningitis in an 18-year-old woman","facial paralysis in a 20-year-old man","subdural empyema in a 15-month-old girl","labyrinthine fistula in a 47-year-old man neurosurgical emergency, even when it"],"k":"A","x":"Otogenic meningitis in a young child usually responds to medical treatment (Ballenger).","src":"2019 exam recall · Q29","d":"Others"},{"s":"A 28-year-old man with a long-standing history of left otorrhea is transferred from another hospital, clinically ill and toxic. His temperature has spiked to 104 to 105˚F each morning and evening. The condition most likely to be responsible is","o":["otitic hydrocephalus","lateral sinus thrombosis","meningitis","epidural abscess","subdural empyema"],"k":"B","x":"A toxic patient with chronic otorrhoea and spiking fever suggests lateral sinus thrombosis (Ballenger).","src":"2019 exam recall · Q30","d":"Otology"},{"s":"The most frequent site of first occurrence of otosclerosis is in the","o":["oval window rim","fossula post fenestram","round window niche","fissula ante fenestram","processus cochleariformis"],"k":"D","x":"Otosclerosis most often begins at the fissula ante fenestram (Ballenger).","src":"2019 exam recall · Q31","d":"Otology"},{"s":"Branchio-oto-renal syndrome may be associated with the following, except","o":["dilated vestibular aqueduct","autosomal recessive inheritance","mutations in EYA1","renal anomalies","marked phenotypic variability"],"k":"B","x":"BOR syndrome is autosomal dominant (EYA1), with variable expressivity (Ballenger).","src":"2019 exam recall · Q32","d":"Others"},{"s":"Recent studies have linked the cause of Bell’s palsy to","o":["varicella-zoster virus","herpes simplex virus","Parainfluenza virus","papillomavirus","none of the above"],"k":"B","x":"HSV-1 reactivation is implicated in Bell palsy (Ballenger).","src":"2019 exam recall · Q33","d":"Others"},{"s":"Pott’s puffy tumor is a complication of sinus disease related to","o":["tuberculous sinusitis","Odontogenic infection","cavernous sinus thrombosis","frontal sinusitis","concha bullosa"],"k":"D","x":"Pott puffy tumour is frontal osteomyelitis complicating frontal sinusitis (Ballenger).","src":"2019 exam recall · Q34","d":"Rhinology"},{"s":"A deformity in which the middle portion of the ear is overcorrected in relation to the upper and lower poles is the","o":["telephone ear deformity","reverse telephone ear deformity","lop ear deformity","cup ear deformity","flail ear deformity."],"k":"A","x":"Overcorrection of the middle third relative to the poles after otoplasty = telephone ear deformity (Cummings).","src":"2019 exam recall · Q35","d":"Otology"},{"s":"A patient had mastoid operation 10 years ago, and is experiencing monthly episodes of otorrhea, During the last 24 hours the drainage has become foul smelling, and the patient has experienced a significant headache. The best immediate management is to","o":["Insert a wick with antibiotic eardrops reexamine after 48 hours","Obtain a Gram's stain of the drainage and begin IVantibiotic","Schedule mastoid exploration as soon as possible","Prescribe antibiotic eardrops and oral ciprofloxacin, reexamine in a week","Obtain a CT scan of the temporal bone and Gram's stain of the drainage"],"k":"E","x":"A sudden change in chronic cavity otorrhoea with new symptoms warrants CT of the temporal bone to exclude complications (Ballenger).","src":"2019 exam recall · Q37","d":"Otology"},{"s":"Patients with presbyacusis who have developed bilateral profound hearing loss are best aided with:","o":["Cochlear implant","Implantable middle ear hearing aid","Digital hearing aid","Behavioral rehabilitation","Brain stem implants"],"k":"A","x":"Bilateral profound presbycusis with little benefit from hearing aids: cochlear implantation (Cummings).","src":"2019 exam recall · Q38","d":"Otology"},{"s":"Which type of malignant parotid tumor may have a bilateral presentation?","o":["Mucoepidermoid carcinoma","Adenoid cystic carcinoma","Expleomorphic carcinoma","Adenocarcinoma","Acinic cell carcinoma"],"k":"E","x":"Acinic cell carcinoma is the malignant parotid tumour most often bilateral (about 3%) (Cummings).","src":"2019 exam recall · Q40","d":"Head & Neck"},{"s":"Which of the following auditor/ brain stem response test results suggest that a hearing deficit is a conductive loss?","o":["Prolonged wave V latency and prolonged wave 1 latency","Prolonged wave I latency and normal wave V latency","Normal wave I latency and prolonged wave V latency","Normal wave 1 latency and normal wave V latency","Normal wave I latency and no detectable wave V"],"k":"A","x":"Conductive loss prolongs all latencies (wave I and V) with normal interpeak intervals (Cummings).","src":"2019 exam recall · Q41","d"   <p class="sub">The 2019 Part II recall (Paper 16 A and B). Each question is answered against our references, with a short referenced explanation. Changed or missing recalled keys are flagged ⚑, and incomplete questions are completed.</p>
  <div class="card"><table>${DOMS.filter(d=>cnt[d]).map(d=>`<tr><td>${d}</td><td>${cnt[d]}</td></tr>`).join('')}</table></div>
  <b>Mode</b><div class="seg" role="group" aria-label="Mode"><button class="${S.mode=='exam'?'on':''}" onclick="S.mode='exam';startScreen()">Exam — marked at the end</button><button class="${S.mode=='practice'?'on':''}" onclick="S.mode='practice';startScreen()">Practice — instant feedback</button></div>
  ${S.mode=='exam'?`<b>Time</b><div class="seg" role="group" aria-label="Time limit">${[180,150,120,90].map(m=>`<button class="${S.mins==m?'on':''}" onclick="S.mins=${m};startScreen()">${m==180?'3 h':m+' min'}</button>`).join('')}</div>`:''}
  <button class="primary" onclick="begin()">Start paper</button>
  <p class="note">${S.mode=='exam'?'You can change answers and flag questions until you submit. The paper submits itself when time runs out.':'Each answer is marked when you tap it and locks. Untimed.'} Progress is kept while this page stays open.</p>`;
  scrollTo(0,0)}
function begin(){S.ans={};S.flag={};S.pos=0;S.phase='run';S.start=Date.now();
  if(S.mode=='exam'){S.end=S.start+S.mins*60000;S.tick=setInterval(()=>{const r=S.end-Date.now();const t=$('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}
  show()}
function answered(){return Object.keys(S.ans).length}
function show(){
  const q=Q[S.pos],a=S.ans[S.pos],prac=S.mode=='practice';
  let h=`<div class="top"><div class="topi">${S.mode=='exam'?`<span class="timer" id="tm">${fmt(S.end-Date.now())}</span>`:`<span class="timer">${Object.entries(S.ans).filter(([i,v])=>v==Q[i].k).length}/${answered()}</span>`}<span class="t">${answered()} of ${Q.length} answered</span><button class="flagbtn ${S.flag[S.pos]?'on':''}" onclick="flag()" aria-pressed="${!!S.flag[S.pos]}">${S.flag[S.pos]?'Flagged':'Flag'}</button></div><div class="bar"><i style="width:${(S.pos+1)}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${Q.length}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${S.pos+1}" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,i)=>{const l=L[i];let c='';if(prac&&a){if(l==q.k)c='ok';else if(l==a)c='bad'}else if(a==l)c='sel';
    h+=`<button class="opt ${c}" ${prac&&a?'disabled':''} onclick="pick('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(prac&&a)h+=expl(q,a);
  $('#app').innerHTML=h;
  const last=S.pos==Q.length-1;
  nav(`<button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Questions</button>${last?`<button class="primary" onclick="confirmSubmit()">Submit</button>`:`<button class="primary" onclick="go(1)">Next</button>`}`);
}
function expl(q,a){const ok=a==q.k;
  return `<div class="exp"><h3 class="${a?(ok?'ok':'bad'):'na'}">${a?(ok?'Correct':'Incorrect'):'Not answered'} — answer ${q.k}</h3>${q.x?`<p>${esc(q.x)}</p>`:`<p class="note">The source gives the key only for this question.</p>`}${q.xi?q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join(''):''}<div class="src">${esc(q.d)} · ${esc(q.src)}</div></div>`}
function pick(l){if(S.mode=='practice'&&S.ans[S.pos])return;if(S.mode=='exam'&&S.ans[S.pos]==l)delete S.ans[S.pos];else S.ans[S.pos]=l;const y=scrollY;show();scrollTo(0,y)}
function flag(){S.flag[S.pos]?delete S.flag[S.pos]:S.flag[S.pos]=1;const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(Q.length-1,S.pos+d));show();scrollTo(0,0)}
function grid(){const d=$('#dlg');const nf=Object.keys(S.flag).length,na=Q.length-answered();
  d.innerHTML=`<b>Questions</b><div class="legend" style="margin-top:6px"><span class="a">Answered (${answered()})</span><span class="f">Flagged (${nf})</span><span>Unanswered (${na})</span></div>
  <div class="grid">${Q.map((_,i)=>`<button class="${S.ans[i]?'ans':''} ${S.flag[i]?'flg':''} ${i==S.pos?'cur':''}" onclick="S.pos=${i};$('#dlg').close();show();scrollTo(0,0)" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div>
  <div class="row"><button class="ghost" onclick="$('#dlg').close()">Close</button><button class="primary" onclick="$('#dlg').close();confirmSubmit()">Submit paper</button></div>`;d.showModal()}
function confirmSubmit(){const d=$('#dlg');const na=Q.length-answered(),nf=Object.keys(S.flag).length;
  d.innerHTML=`<b>Submit this paper?</b><p class="note">${na?`${na} question${na>1?'s are':' is'} unanswered. `:'All questions answered. '}${nf?`${nf} flagged.`:''} You can't change answers after submitting.</p><div class="row"><button class="ghost" onclick="$('#dlg').close()">Keep going</button><button class="primary" onclick="$('#dlg').close();submit()">Submit</button></div>`;d.showModal()}
function submit(auto){clearInterval(S.tick);S.used=Date.now()-S.start;S.phase='done';S.auto=!!auto;if($('#dlg').open)$('#dlg').close();results()}
function results(){nav();
  let r=0;const by={};Q.forEach((q,i)=>{const b=by[q.d]=by[q.d]||{n:0,r:0};b.n++;if(S.ans[i]==q.k){r++;b.r++}});
  const wrong=Q.map((q,i)=>i).filter(i=>S.ans[i]&&S.ans[i]!=Q[i].k),skip=Q.map((q,i)=>i).filter(i=>!S.ans[i]),fl=Object.keys(S.flag).map(Number).sort((a,b)=>a-b);
  $('#app').innerHTML=`<div class="kicker">${esc(P.title)}</div><h1>Results</h1>${S.auto?'<p class="note">Time ran out — the paper was submitted automatically.</p>':''}
  <div class="big">${r}<span style="font-size:1.4rem;color:var(--muted)">/100</span></div><p class="sub">${wrong.length} incorrect · ${skip.length} unanswered · time used ${fmt(S.used)}</p>
  <div class="card"><table>${DOMS.filter(d=>by[d]).map(d=>{const b=by[d],p=Math.round(b.r/b.n*100);return `<tr><td>${d}<div class="meter"><i style="width:${p}%"></i></div></td><td>${b.r}/${b.n} · ${p}%</td></tr>`}).join('')}</table></div>
  <div class="row"><button class="primary" ${wrong.length+skip.length?'':'disabled'} onclick="review('Incorrect and unanswered',${JSON.stringify(wrong.concat(skip).sort((a,b)=>a-b))})">Review incorrect (${wrong.length+skip.length})</button></div>
  <div class="row"><button class="ghost" ${fl.length?'':'disabled'} onclick="review('Flagged',${JSON.stringify(fl)})">Flagged (${fl.length})</button><button class="ghost" onclick="review('All questions',${JSON.stringify(Q.map((_,i)=>i))})">All 100</button></div>
  <div class="row"><button class="ghost" onclick="startScreen()">Retake paper</button></div>`;scrollTo(0,0)}
function review(t,list){S.list=list;S.rpos=0;S.rtitle=t;rshow()}
function rshow(){const i=S.list[S.rpos],q=Q[i],a=S.ans[i];
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="results()">Results</button><span class="t">${S.rtitle} · ${S.rpos+1}/${S.list.length}</span>${S.flag[i]?'<span class="flagbtn on">Flagged</span>':''}</div></div>
  <div class="qn">Question ${i+1}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,j)=>{const l=L[j];const c=l==q.k?'ok':(l==a?'bad':'');h+=`<button class="opt ${c}" disabled><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  h+=expl(q,a);$('#app').innerHTML=h;
  nav(`<button class="ghost" ${S.rpos?'':'disabled'} onclick="S.rpos--;rshow();scrollTo(0,0)">Previous</button><button class="primary" ${S.rpos<S.list.length-1?'':'disabled'} onclick="S.rpos++;rshow();scrollTo(0,0)">Next</button>`)}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
window.addEventListener('beforeunload',e=>{if(S.phase=='run'){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(S.phase!='run'||$('#dlg').open)return;if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else{const i=L.indexOf(e.key.toUpperCase());if(e.key.length==1&&i>=0&&i<Q[S.pos].o.length)pick(L[i])}});
startScreen();

function pickPaper(i){PI=i;P=PAPERS[i];Q=P.q;S.ans={};S.flag={};S.pos=0;startScreen()}</script></body></html>
