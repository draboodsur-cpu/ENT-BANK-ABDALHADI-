<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--box:#0B1418;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--box:#000;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.chap{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px}
.chap.on{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.chap b{flex:1;font-weight:600}
.chap span{color:var(--muted);font-variant-numeric:tabular-nums}
.chap .done{font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px}
.seg button.on{background:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#06201F}}
.primary{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
@media (prefers-color-scheme:dark){.primary{color:#06201F}}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.topi .t{flex:1;min-width:0;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topi .sc{font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width .25s}
.qn{font:600 .9rem/1 inherit;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.note{font-size:.9rem;color:var(--muted);margin:-4px 0 12px}
.flag{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:6px;font-size:.92rem;margin:0 0 12px}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}
.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:12px 0 4px}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-cur{outline:2px solid var(--teal);outline-offset:1px}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:8px 0}
table{width:100%;border-collapse:collapse;margin:12px 0 18px;font-variant-numeric:tabular-nums}

<script>
const DATA=[{"t":"Ahmed Abu Helal set (11/11)","q":[{"n":1,"s":"During mastoidectomy, the most reliable surface landmark for identifying the sigmoid sinus is:","o":["Temporal line","Suprameatal spine","Digastric ridge","Spine of Henle","Tympanosquamous suture"],"k":"C","x":"The digastric ridge is the best of these options for the sigmoid sinus. Followed posteriorly on the medial mastoid surface it leads toward the sigmoid sinus, and followed anteriorly it points to the stylomastoid foramen. Why the others are wrong: the temporal line approximates the level of the middle fossa dura (tegmen), not the sinus. The suprameatal spine and the spine of Henle are the same landmark; they mark the antrum, which lies about 1.5 cm deep to Macewen's triangle. The tympanosquamous suture guides the anterior canal-wall cut. (Scott-Brown, mastoid surgery; Cummings, mastoidectomy technique.)","f":"Weakly built question. The true external landmark for the transverse–sigmoid junction is the asterion; the mastoid emissary foramen also overlies the sinus. Neither is offered, so C is the most defensible answer."},{"n":2,"s":"Which radiation technique is considered the standard approach for most sinonasal malignancies requiring radiotherapy?","o":["Gamma Knife","Conventional cobalt radiotherapy","IMRT","Intracavitary brachytherapy in all cases","Whole-brain radiotherapy"],"k":"C","x":"IMRT (or proton therapy where available) is the standard. It delivers a curative dose to the sinuses and skull base while sparing the optic nerves, chiasm, lacrimal gland and brainstem, and it reduces the blindness risk seen with older 2D/3D techniques. Why the others are wrong: Gamma Knife is stereotactic radiosurgery for small intracranial targets. Cobalt cannot shape the dose around the optic apparatus. Brachytherapy is adjunctive and only occasionally used, never 'in all cases'. Whole-brain RT has no role. (NCCN Head & Neck — Ethmoid/Maxillary sinus; Cummings, sinonasal malignancy.)"},{"n":3,"s":"The ideal nasofrontal angle is approximately:","o":["60–75°","80–90°","95–105°","115–130°","140–150°"],"k":"D","x":"The nasofrontal angle is formed by a line along the glabella–nasion and a line along the nasal dorsum. The ideal is about 115–130° (some texts give up to 135°), and slightly more obtuse in women. 95–105° is the ideal nasolabial angle in women (90–95° in men). Do not confuse the two angles: that is the classic trap. (Cummings, Facial Analysis / Rhinoplasty; Bailey, Facial Plastic Surgery.)"},{"n":4,"s":"A transcartilaginous incision is primarily used for:","o":["Accessing the nasal septum","Accessing the lower lateral cartilage through its cephalic portion","Performing lateral osteotomy","Exposing the nasal bones","Accessing the maxillary sinus"],"k":"B","x":"The transcartilaginous (cartilage-splitting) incision is made through the vestibular skin and the lateral crus itself, a few mm cephalic to its caudal margin. It lets the surgeon resect the cephalic portion of the lateral crus (cephalic trim) in a non-delivery approach. Why the others are wrong: the septum is reached through hemitransfixion or Killian incisions. Osteotomies use a vestibular stab or a percutaneous approach. Nasal bones are exposed through intercartilaginous or open approaches. (Cummings, Rhinoplasty — Incisions and Approaches.)"},{"n":5,"s":"The marginal (infracartilaginous) incision is placed along the:","o":["Cephalic border of upper lateral cartilage","Caudal border of lower lateral cartilage","Dorsal septum","Nasal bone","Caudal border of upper lateral cartilage"],"k":"B","x":"The marginal incision follows the caudal border of the lower lateral (alar) cartilage. It is used in the open approach together with a columellar (transcolumellar) incision, and in delivery approaches. Trap: the intercartilaginous incision lies between the caudal border of the upper lateral cartilage and the cephalic border of the lower lateral cartilage (option E describes its upper edge). (Cummings, Rhinoplasty.)"},{"n":6,"s":"A 55-year-old male smoker presents with a persistent cystic lateral neck mass. Fine-needle aspiration is inconclusive. What is the most appropriate next step?","o":["Open surgical excision without further investigation","Reassurance and observation","Contrast-enhanced imaging and further evaluation for occult head and neck malignancy","Empirical prolonged antibiotic treatment","Repeated aspiration only"],"k":"C","x":"In an adult over 40, a cystic lateral neck mass is a cystic nodal metastasis until proven otherwise. The usual sources are HPV-positive oropharyngeal SCC (tonsil or tongue base), papillary thyroid carcinoma, or nasopharyngeal carcinoma. Work-up: contrast CT/MRI of the neck, ultrasound-guided FNA of the solid wall (with p16/HPV and thyroglobulin), PET-CT if the primary is occult, then panendoscopy with tonsillectomy and tongue-base biopsy. Why the others are wrong: open excision before staging violates the neck and compromises definitive treatment. Observation, antibiotics and repeated blind aspiration delay the diagnosis of cancer. (AAO-HNS Adult Neck Mass Guideline; NCCN Occult Primary; Scott-Brown.)"},{"n":7,"s":"A 2-year-old child presents with severe respiratory distress, inspiratory stridor, drooling, and tripod positioning. Acute epiglottitis is suspected. What is the most appropriate next step?","o":["Immediate tongue-depressor examination","Nebulized adrenaline as definitive treatment","Controlled airway management in the operating room","Routine lateral neck X-ray before intervention","Discharge after corticosteroid administration"],"k":"C","x":"Keep the child calm on the parent's lap, give no IV access and no examination that could upset them, and go straight to theatre. There, a senior anaesthetist performs inhalational induction with an ENT surgeon scrubbed and ready for rigid bronchoscopy or tracheostomy, and the child is intubated. After the airway is secured: cultures, then IV third-generation cephalosporin. Why the others are wrong: a tongue depressor can precipitate complete obstruction. Adrenaline is a temporising measure (croup), not definitive treatment. A lateral X-ray (thumb sign) wastes time and moves the child away from airway expertise. (Scott-Brown, Paediatric Airway; Cummings, Pediatric Infections of the Larynx.)"},{"n":8,"s":"During canal wall down mastoidectomy for cholesteatoma, the facial nerve is exposed in its tympanic segment. The surgeon notices that the nerve is dehiscent but intact. What is the most appropriate management?","o":["Immediate nerve decompression","Electrical stimulation followed by nerve grafting","Preserve the nerve and avoid unnecessary manipulation","Apply topical adrenaline directly to the nerve","Remove the dehiscent bony canal completely"],"k":"C","x":"Tympanic-segment dehiscence is common: up to 50% in temporal bone studies, mostly above the oval window. With normal function and an intact nerve, the rule is to identify it, protect it, and remove matrix gently in the direction of the nerve without drilling on or stripping the sheath. Use the facial nerve monitor and record the dehiscence in the operative note (important for revision surgery). Why the others are wrong: decompression and grafting are for injury or paralysis, not an incidental dehiscence. Adrenaline on the nerve is pointless. Removing more fallopian canal increases exposure and risk. (Scott-Brown, Cholesteatoma Surgery; Cummings, Intraoperative Facial Nerve Injury.)"},{"n":9,"s":"During thyroidectomy, injury to the external branch of the superior laryngeal nerve primarily causes:","o":["Vocal cord paralysis","Loss of vocal cord sensation","Inability to produce high-pitched sounds","Bilateral vocal cord fixation","Aspiration due to sensory loss"],"k":"C","x":"The external branch of the superior laryngeal nerve (EBSLN) supplies the cricothyroid muscle, which tensions and lengthens the vocal fold. Injury causes loss of upper pitch range, voice fatigue and a weak projected voice, which matters to singers (the 'Amelita Galli-Curci nerve'). To protect it, ligate the superior pole vessels individually and close to the gland (Cernea classification), with or without neuromonitoring. Why the others are wrong: the internal branch carries supraglottic sensation (B, E). Paralysis and fixation of the cord (A, D) are recurrent laryngeal nerve problems. (Scott-Brown, Thyroid Surgery; Cummings.)"},{"n":10,"s":"Breslow thickness is measured from:","o":["Surface epithelium to deepest tumour cell","Granular layer to deepest invasive melanoma cell","Basement membrane to deepest tumour cell","Dermis to subcutaneous fat","Epidermal surface to tumour centre"],"k":"B","x":"Breslow depth is measured with an ocular micrometer from the top of the granular layer of the epidermis to the deepest invasive melanoma cell. If the lesion is ulcerated, it is measured from the base of the ulcer. It defines the AJCC 8th edition T category: T1 ≤1.0 mm (T1a <0.8 mm without ulceration), T2 >1–2 mm, T3 >2–4 mm, T4 >4 mm. Trap: Clark level is anatomical (by dermal layer) and is no longer used for T staging in AJCC 8. (AJCC 8th Edition, Melanoma of the Skin; NCCN Melanoma.)"},{"n":11,"s":"Which histological finding defines carcinoma in situ of the larynx?","o":["Basement membrane invasion","Full-thickness epithelial dysplasia without stromal invasion","Cartilage invasion","Perineural invasion","Vascular invasion"],"k":"B","x":"Carcinoma in situ (Tis) means full-thickness cytological and architectural atypia with an intact basement membrane and no stromal invasion. Any breach of the basement membrane makes it invasive SCC. (In the 2017 WHO two-tier system, CIS falls under high-grade dysplasia.) Treatment is complete excision (transoral laser or cold steel) or radiotherapy, with close follow-up. Why the others are wrong: options C–E all describe invasive disease. (Cummings, Premalignant Lesions of the Larynx; WHO 2017; AJCC 8.)"},{"n":12,"s":"Which histological feature is most characteristic of olfactory neuroblastoma?","o":["Keratin pearls","Homer Wright rosettes","Psammoma bodies","Mucin-producing glands","Signet-ring cells"],"k":"B","x":"Olfactory neuroblastoma (esthesioneuroblastoma) arises from the olfactory neuroepithelium at the cribriform plate. Histology shows lobules of small round blue cells in a neurofibrillary matrix, with Homer Wright pseudorosettes and sometimes Flexner–Wintersteiner true rosettes. S100-positive sustentacular cells sit at the periphery of the lobules, and the tumour is synaptophysin and chromogranin positive. It is staged by Kadish and graded by Hyams. Why the others are wrong: keratin pearls indicate SCC, psammoma bodies papillary thyroid carcinoma or meningioma, mucin glands adenocarcinoma, and signet-ring cells mucinous adenocarcinoma. (Cummings, Sinonasal Malignancy; Scott-Brown.)"},{"n":13,"s":"Following a zygomaticomaxillary complex fracture, a patient develops diplopia and restricted upward gaze. Which muscle is most likely entrapped?","o":["Superior rectus","Inferior rectus","Lateral rectus","Medial rectus","Superior oblique"],"k":"B","x":"A ZMC fracture always involves the orbital floor. Herniation or entrapment of the inferior rectus (and periorbital fat) into the floor defect tethers the eye and restricts upgaze; the diplopia is worse on looking up. Confirm with a forced duction test and coronal CT. A child with a 'white-eyed' trapdoor fracture, bradycardia or vomiting from the oculocardiac reflex needs urgent release within 24–48 h. Why the others are wrong: medial rectus entrapment follows medial wall (lamina papyracea) fractures and limits lateral gaze. (Scott-Brown, Maxillofacial Trauma; Cummings.)"},{"n":14,"s":"During superficial parotidectomy, the facial nerve trunk is most reliably identified using which combination of landmarks?","o":["External carotid artery and masseter muscle","Tragal pointer, tympanomastoid suture and posterior belly of digastric","Zygomatic arch and buccinator muscle","Mandibular angle and submandibular duct","Great auricular nerve and carotid bifurcation"],"k":"B","x":"The classic triad:\n(1) Tympanomastoid suture: the most reliable landmark; the trunk lies 6–8 mm deep to its inferior end.\n(2) Tragal pointer: the nerve lies about 1 cm deep and slightly anterior-inferior to its tip.\n(3) Posterior belly of digastric: the trunk lies just superior to its attachment, at the same depth.\nIf these fail, use retrograde dissection from a peripheral branch (marginal mandibular or buccal) or a mastoidectomy. (Scott-Brown, Salivary Gland Surgery; Cummings.)"},{"n":15,"s":"The average distance between the stylomastoid foramen and the tip of the mastoid process is approximately:","o":["3–5 mm","7–9 mm","15–16 mm","25–30 mm","35–40 mm"],"k":"C","x":"Adult cadaveric studies place the stylomastoid foramen about 1.5 cm from the mastoid tip, medial and anterior to it, roughly halfway along the digastric groove. Clinically relevant: (1) in infants and young children, before the mastoid process develops, the foramen is very superficial and the nerve is at risk from a standard postauricular incision. (2) In parotid surgery, the nerve leaves the foramen deep to the tympanomastoid suture (6–8 mm). (Cummings, Facial Nerve Anatomy; Scott-Brown.)","f":"Reported values vary between anatomical studies (about 13–16 mm). Learn 'about 1.5 cm' as the exam figure."},{"n":16,"s":"For definitive radiotherapy of a locally advanced sinonasal carcinoma, the typical high-risk gross disease dose is approximately:","o":["30 Gy","40 Gy","50 Gy","60 Gy","66–70 Gy"],"k":"E","x":"Definitive radiotherapy for head and neck SCC, including sinonasal, gives 66–70 Gy in 2 Gy fractions (about 7 weeks) to gross disease, with concurrent cisplatin for locally advanced disease. Reference doses for comparison: postoperative RT to the tumour bed is 60 Gy, or 60–66 Gy with positive margins or ENE; elective nodal or low-risk volumes receive 44–50 Gy (2 Gy) or 54–63 Gy (1.6–1.8 Gy). IMRT is needed to respect optic tolerance (about 54 Gy). (NCCN Head & Neck — Paranasal Sinus; Cummings, Radiotherapy.)"},{"n":17,"s":"A patient presents with dysphagia and suspected pharyngeal pouch (Zenker diverticulum). Which investigation is classically preferred to demonstrate the pouch?","o":["CT temporal bone","Barium swallow / contrast esophagography","MRI brain","CTA neck","PET-CT"],"k":"B","x":"A barium swallow (contrast oesophagram), ideally videofluoroscopic, is the investigation of choice. It shows the posterior pouch arising through Killian's dehiscence, between the thyropharyngeus and cricopharyngeus, together with its size, the cricopharyngeal bar and any aspiration. Avoid blind flexible oesophagoscopy or nasogastric tube insertion because of the perforation risk. Rigid endoscopy is done at treatment (stapling or laser diverticulotomy) and excludes carcinoma in the pouch (about 0.3–1.5%). (Scott-Brown, Pharyngeal Pouch; Cummings.)"},{"n":18,"s":"Which CT finding is most suggestive of coalescent mastoiditis?","o":["Mastoid air-cell opacification without bone destruction","Erosion of mastoid air-cell septa","Isolated middle-ear effusion","Ossicular fixation","Widening of the internal auditory canal"],"k":"B","x":"Coalescent mastoiditis means an osteitic breakdown of the bony septa between mastoid air cells, forming an empyema cavity. On CT this is septal erosion or demineralisation, often with cortical erosion and a subperiosteal abscess. Trap (option A): simple opacification without bone loss is seen in almost every acute otitis media and does not mean surgical mastoiditis. Coalescence or abscess usually needs a cortical mastoidectomy with a grommet, plus IV antibiotics. (Scott-Brown, Acute Mastoiditis; Cummings, Complications of Otitis Media.)"},{"n":19,"s":"HRCT temporal bone demonstrates a defect in the bony roof of the superior semicircular canal. The patient complains of sound-induced vertigo and autophony. What is the most likely diagnosis?","o":["Ménière disease","Superior semicircular canal dehiscence syndrome","Vestibular schwannoma","Labyrinthitis","Otosclerosis"],"k":"B","x":"Superior canal dehiscence syndrome (Minor, 1998) acts as a 'third window'. Features: Tullio phenomenon (sound-induced vertigo), Hennebert sign (pressure-induced vertigo), autophony, hearing one's own eye movements or pulse, and a pseudo-conductive low-frequency air–bone gap with negative bone-conduction thresholds and preserved acoustic reflexes. VEMPs are characteristic: low cVEMP thresholds and a large oVEMP amplitude. Confirm on Pöschl/Stenver reformatted CT. Treatment is plugging or resurfacing, by middle fossa or transmastoid approach. Trap: otosclerosis also gives an air–bone gap but with absent acoustic reflexes; do not perform stapedectomy on a dehiscence. (Cummings; Scott-Brown.)"},{"n":20,"s":"Which imaging modality is most sensitive for detecting residual or recurrent cholesteatoma after surgery?","o":["Plain X-ray","Contrast-enhanced CT","Non-EPI diffusion-weighted MRI","CT angiography","Ultrasound"],"k":"C","x":"Non-echo-planar DWI (for example HASTE) shows cholesteatoma as restricted diffusion (bright on b-1000), separating it from granulation tissue and fluid. It detects lesions down to about 2–3 mm (sensitivity and specificity over 90%) and is now replacing routine second-look surgery in many centres. CT cannot separate cholesteatoma from scar or fluid in an operated ear. Echo-planar DWI is degraded by susceptibility artefact at the skull base. (Scott-Brown, Imaging in Otology; Cummings.)"},{"n":21,"s":"Which lymph node level is most associated with nasopharyngeal carcinoma metastasis?","o":["Level IA","Level IB","Level II","Level VI","Level VII only"],"k":"C","x":"Nasopharyngeal carcinoma drains first to the retropharyngeal (Rouvière) nodes and level II, then to level V (posterior triangle). About 80–90% of patients have nodes at presentation, often bilateral. Level II, especially IIB, is the most commonly involved neck level, and a level II or V mass is the commonest presenting complaint. Levels I and VI are rarely involved. (Cummings, Nasopharyngeal Carcinoma; Scott-Brown; AJCC 8.)"},{"n":22,"s":"A patient with papillary thyroid carcinoma requires therapeutic lateral neck dissection. Which levels are generally included?","o":["I–III","II–V","I–VI","III–IV only","VI only"],"k":"B","x":"Therapeutic lateral neck dissection for cN1b differentiated thyroid cancer is a selective dissection of levels IIa, III, IV and Vb, extended to IIb and Va when involved, together with central (VI) dissection. 'Berry-picking' is condemned. Level I is included only when clinically involved. Why the others are wrong: III–IV only leaves a high recurrence rate. Level VI is the central compartment, not the lateral neck. (ATA 2015 Guidelines; BAHNO / BTA; Scott-Brown.)"},{"n":23,"s":"Which structure is preserved in Modified Radical Neck Dissection type III?","o":["IJV only","SAN only","SCM only","SAN, IJV, and SCM","None of the above"],"k":"D","x":"Medina classification of modified radical neck dissection (levels I–V removed in each case):\n• Type I: spinal accessory nerve (SAN) preserved.\n• Type II: SAN and internal jugular vein (IJV) preserved.\n• Type III (functional, Bocca): SAN, IJV and sternocleidomastoid (SCM) all preserved.\n'None preserved' describes a radical neck dissection. (Cummings, Neck Dissection; AAO-HNS classification.)"},{"n":24,"s":"A patient presents with a cystic lateral neck mass at level II. Which diagnosis must be excluded, particularly in an adult?","o":["Thyroglossal duct cyst","Branchial cleft cyst","Cystic metastatic HPV-related oropharyngeal carcinoma","Dermoid cyst","Lymphangioma"],"k":"C","x":"HPV-positive oropharyngeal SCC characteristically produces cystic level II nodes in young, often non-smoking adults. Many 'branchial cysts' in adults over 40 prove to be metastases. Work-up: FNA with p16/HPV testing, imaging, examination of the tonsils and tongue base, and panendoscopy with tonsillectomy if needed. Never label an adult cyst 'branchial' without excluding this. Why the others are wrong: a thyroglossal cyst is midline, and dermoids are midline too. Lymphangioma is mainly paediatric. (AAO-HNS Adult Neck Mass Guideline; NCCN.)"},{"n":25,"s":"A supraglottic carcinoma extends from the epiglottis to the aryepiglottic fold and involves the mucosa of the medial wall of the pyriform sinus. Vocal cord mobility is normal. What is the T category?","o":["T1","T2","T3","T4a","T4b"],"k":"B","x":"AJCC 8th edition, supraglottic larynx:\n• T1: one subsite, cords mobile.\n• T2: invades the mucosa of more than one adjacent supraglottic subsite, or the glottis, or a region outside the supraglottis (for example the base of tongue, vallecula or medial wall of the pyriform sinus), without fixation of the larynx.\n• T3: cord fixation, postcricoid area, pre-epiglottic space, paraglottic space, or inner cortex of the thyroid cartilage.\nThis tumour involves more than one subsite plus the medial pyriform wall with mobile cords, so it is T2. Trap: medial pyriform wall involvement alone does not make it T3. (AJCC 8th Edition.)"},{"n":26,"s":"NPC extends into the parapharyngeal space without skull base invasion. There are no lymph nodes or distant metastases. What is the stage?","o":["Stage I","Stage II","Stage III","Stage IVA","Stage IVB"],"k":"B","x":"AJCC 8th edition, nasopharynx: parapharyngeal space extension, or infiltration of the medial pterygoid, lateral pterygoid or prevertebral muscles, is T2. Skull base, cervical vertebra, pterygoid structures or paranasal sinuses = T3. Intracranial extension, cranial nerves, hypopharynx, orbit, parotid or beyond the lateral pterygoid = T4. Stage grouping: T2 N0 M0 = Stage II (Stage I is T1 N0). Note AJCC 8 changes: Stage IVA = T4 or N3; Stage IVB = M1. (AJCC 8th Edition, Nasopharynx.)"},{"n":27,"s":"A patient has a 2 cm oral tongue SCC with a single ipsilateral cervical lymph node measuring 2.5 cm and clinically negative extranodal extension (ENE−). What is the overall stage?","o":["Stage I","Stage II","Stage III","Stage IVA","Stage IVB"],"k":"C","x":"AJCC 8th edition, oral cavity:\n• T: a tumour ≤2 cm with depth of invasion ≤5 mm is T1. No DOI is given, so the 2 cm lesion is taken as T1. If the DOI were 5–10 mm it would be T2, and the stage would still be III.\n• cN1: a single ipsilateral node ≤3 cm, ENE−.\n• Stage: T1–2 N1 M0 = Stage III; Stage IVA = T4a or N2; Stage IVB = T4b or N3.\nTrap: a 2.5 cm node is N1 (≤3 cm), not N2a (>3–6 cm). (AJCC 8th Edition; NCCN.)"},{"n":28,"s":"A lateral oral tongue SCC measures 1.7 cm, with DOI of 8 mm. No nodal involvement. What is the T category?","o":["T1","T2","T3","T4a","T4b"],"k":"B","x":"AJCC 8th edition, oral cavity T category (DOI added in the 8th edition):\n• T1: ≤2 cm and DOI ≤5 mm.\n• T2: ≤2 cm with DOI >5 mm and ≤10 mm, or >2–4 cm with DOI ≤10 mm.\n• T3: >4 cm, or any tumour with DOI >10 mm.\nA 1.7 cm tumour with DOI 8 mm is T2. Clinical point: DOI >4 mm (NCCN) is an indication for elective neck dissection even in cN0. Trap: DOI is not tumour thickness; it is measured from the level of the adjacent normal basement membrane. (AJCC 8th Edition; NCCN Oral Cavity.)"}]}];
const L='ABCDE';
let S={sel:new Set(DATA.map((_,i)=>i)),order:'book',list:[],pos:0,ans:{},multiPick:{}};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const id=(c,n)=>c+'-'+n;
function home(){
  document.body.querySelector('.nav')?.remove();
  const total=[...S.sel].reduce((a,c)=>a+DATA[c].q.length,0);
  $('#app').innerHTML=`<h1>Ahmed Abu Helal MCQ set</h1><p class="sub">28 questions shared on 11/11, answered and explained (Scott-Brown, Cummings, AJCC 8th edition, NCCN, ATA). Staging follows AJCC 8. Two weakly constructed items are flagged.</p>
  ${DATA.map((c,i)=>{const done=c.q.filter(q=>S.ans[id(i,q.n)]).length;return `<button class="chap ${S.sel.has(i)?'on':''}" onclick="tog(${i})" aria-pressed="${S.sel.has(i)}"><b>${c.t}</b>${done?`<span class="done">${done} done</span>`:''}<span>${c.q.length}</span></button>`}).join('')}
  <div class="row"><div class="seg" role="group" aria-label="Order"><button class="${S.order=='book'?'on':''}" onclick="S.order='book';home()">Book order</button><button class="${S.order=='shuf'?'on':''}" onclick="S.order='shuf';home()">Shuffled</button></div>
  <div class="seg"><button onclick="S.sel=new Set(DATA.map((_,i)=>i));home()">All</button><button onclick="S.sel=new Set();home()">None</button></div></div>
  <button class="primary" ${total?'':'disabled'} onclick="start()">Start ${total} questions</button>
  ${Object.keys(S.ans).length?`<div class="row"><button class="ghost" style="flex:1" onclick="results()">See results so far</button><button class="ghost" style="flex:1" onclick="if(confirm('Clear all answers?')){S.ans={};home()}">Clear answers</button></div>`:''}
  <p class="note" style="margin-top:18px">Answers are kept while this page is open. Tap any figure to enlarge.</p>`;
  scrollTo(0,0);
}
function tog(i){S.sel.has(i)?S.sel.delete(i):S.sel.add(i);home()}
function start(list){
  if(!list){list=[];[...S.sel].sort().forEach(c=>DATA[c].q.forEach(q=>list.push([c,q.n])));
    if(S.order=='shuf')for(let i=list.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[list[i],list[j]]=[list[j],list[i]]}}
  S.list=list;S.pos=0;const f=list.findIndex(([c,n])=>!S.ans[id(c,n)]);if(f>0)S.pos=f;show();
}
function score(){let a=0,r=0;S.list.forEach(([c,n])=>{const x=S.ans[id(c,n)];if(x){a++;if(x.ok)r++}});return{a,r}}
function show(){
  const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const A=S.ans[id(c,n)];const {a,r}=score();
  const pick=S.multiPick[id(c,n)]||new Set();
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="home()" aria-label="Back to chapters">Chapters</button><span class="t">${DATA[c].t}</span><span class="sc">${r}/${a}</span></div><div class="bar"><i style="width:${(S.pos+1)/S.list.length*100}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${S.list.length} &nbsp;·&nbsp; Q${n}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${n}" onclick="zoom(this.src)">`).join('')}</div>`;
  if(q.m)h+=`<p class="note">More than one answer. Select all that apply, then check.</p>`;
  q.o.forEach((t,i)=>{const l=L[i];let cl='';
    if(A){if(q.k.includes(l))cl='ok';else if(A.pick.includes(l))cl='bad'}else if(pick.has(l))cl='sel';
    h+=`<button class="opt ${cl}" ${A?'disabled':''} onclick="choose('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(q.m&&!A)h+=`<button class="primary" style="margin-top:6px" ${pick.size?'':'disabled'} onclick="check()">Check answer</button>`;
  if(A){h+=`<div class="exp"><h3 class="${A.ok?'ok':'bad'}">${A.ok?'Correct':'Incorrect'} — answer ${q.k.split('').join(', ')}</h3>`;
    if(q.f)h+=`<div class="flag">${esc(q.f)}</div>`;
    h+=q.x.split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('');
    if(q.xi)h+=q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join('');
    h+=`</div>`}
  $('#app').innerHTML=h;
  let nav=document.querySelector('.nav');if(!nav){nav=document.createElement('div');nav.className='nav';document.body.appendChild(nav)}
  const last=S.pos==S.list.length-1;
  nav.innerHTML=`<div class="navi"><button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Jump</button><button class="primary" onclick="${last?'results()':'go(1)'}">${last?'Finish':'Next'}</button></div>`;
  scrollTo(0,0);
}
function choose(l){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);if(S.ans[k])return;
  if(q.m){const p=S.multiPick[k]||new Set();p.has(l)?p.delete(l):p.add(l);S.multiPick[k]=p;const y=scrollY;show();scrollTo(0,y);return}
  S.ans[k]={pick:[l],ok:l==q.k};const y=scrollY;show();scrollTo(0,y)}
function check(){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);const p=[...S.multiPick[k]].sort().join('');
  S.ans[k]={pick:p.split(''),ok:p==q.k};const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(S.list.length-1,S.pos+d));show()}
function grid(){const d=$('#dlg');
  d.innerHTML=`<b>Jump to question</b><div class="grid">${S.list.map(([c,n],i)=>{const a=S.ans[id(c,n)];return `<button class="${a?(a.ok?'g-ok':'g-bad'):''} ${i==S.pos?'g-cur':''}" onclick="S.pos=${i};$('#dlg').close();show()">${i+1}</button>`}).join('')}</div><button class="ghost" style="width:100%;margin-top:8px" onclick="$('#dlg').close()">Close</button>`;
  d.showModal()}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
function results(){
  document.querySelector('.nav')?.remove();
  let rows='',ta=0,tr=0,wrong=[];
  DATA.forEach((c,ci)=>{let a=0,r=0;c.q.forEach(q=>{const x=S.ans[id(ci,q.n)];if(x){a++;if(x.ok)r++;else wrong.push([ci,q.n])}});
    ta+=a;tr+=r;if(a)rows+=`<tr><td>${c.t}</td><td>${r}/${a} · ${Math.round(r/a*100)}%</td></tr>`});
  $('#app').innerHTML=`<h1>Results</h1><div class="big">${ta?Math.round(tr/ta*100):0}%</div><p class="sub">${tr} correct of ${ta} answered</p>
  <table>${rows||'<tr><td>No answers yet</td><td></td></tr>'}</table>
  ${wrong.length?`<button class="primary" onclick="redo()">Retry ${wrong.length} incorrect</button>`:''}
  <div class="row"><button class="ghost" style="flex:1" onclick="home()">Back to chapters</button></div>`;
  S.wrong=wrong;scrollTo(0,0)}
function redo(){S.wrong.forEach(([c,n])=>{delete S.ans[id(c,n)];delete S.multiPick[id(c,n)]});start(S.wrong.slice())}
document.addEventListener('keydown',e=>{if($('#dlg').open||!document.querySelector('.nav'))return;
  if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else if('abcde'.includes(e.key.toLowerCase())&&e.key.length==1)choose(e.key.toUpperCase())});
home();
</script></body></html>
