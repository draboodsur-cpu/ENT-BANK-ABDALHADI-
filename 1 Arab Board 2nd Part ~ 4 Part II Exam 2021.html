<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ENT Part II Exam 2021 — Answered &amp; Referenced</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--amber:#B06A00;--amber-soft:#FBEFD9;--box:#0B1418;--on-teal:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--amber:#E8A94A;--amber-soft:#3A2C14;--box:#000;--on-teal:#06201F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td:last-child{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px 8px;text-align:center}
.seg button.on{background:var(--teal);color:var(--on-teal);font-weight:600}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note{font-size:.9rem;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.timer{font:700 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.topi .t{flex:1;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.flagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
.flagbtn.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.qn{font-weight:600;font-size:.9rem;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{opacity:1}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}.exp h3.na{color:var(--amber)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;position:relative}
.grid .ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.grid .flg{box-shadow:inset 0 0 0 2px var(--amber)}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-na{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid .cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.legend .a::before{background:var(--teal-soft);border-color:var(--teal)}.legend .f::before{box-shadow:inset 0 0 0 2px var(--amber)}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3.2rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>button{flex:1}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--teal)}
</style></head><body>

<script>
const PAPERS=[{"title":"2021 Exam · Paper A","q":[{"s":"Which vestibular test is capable of testing each side of the vestibular system independently?","o":["Caloric testing","Videonystagmography testing","Rotatory chair","Posturography","Oculomotor testing"],"k":"A","x":"Caloric testing stimulates each labyrinth separately; rotatory chair stimulates both simultaneously and is used for suspected bilateral loss (Cummings).","src":"2021 exam recall · Q1","d":"Otology"},{"s":"A 10-month old infant failed a neonatal hearing screening at the hospital but follow-up ABR revealed normal hearing thresholds. Which of the following would be the most appropriate type of test on today visit?","o":["Behavioral observation audiometry","Distortion-product otoacoustic emissions (DPOAEs)","Visual reinforcement audiometry","Automated auditory brainstem response (AABR)","Conditioned play audiometry"],"k":"C","x":"A 10-month-old with normal ABR is followed with visual reinforcement audiometry (6 months–2 years) (Oxford).","src":"2021 exam recall · Q2","d":"Paediatric"},{"s":"What is the most common complication of Myringotomy tube insertion?","o":["Granulation tissue","Persistent perforation","Cholesteatoma","Obstructed tube","Transient otorrhea"],"k":"E","x":"Transient otorrhoea is the commonest complication of ventilation tubes (about 15–25%) (AAO-HNS).","src":"2021 exam recall · Q5","d":"Others"},{"s":"A 65. Year-old male with a history of right sided Herpes zoster oticus two years ago, comes to clinic with burning pain in right ear. Examination of the ear showed no abnormality. What is the most appropriate therapy?","o":["Ibuprofen","Gabapentin","Varicella vaccine","Valacyclovir","Prednisolone"],"k":"B","x":"Post-herpetic neuralgia after Ramsay Hunt syndrome is treated with gabapentinoids or tricyclics (Cummings).","src":"2021 exam recall · Q6","d":"Otology"},{"s":"Which of the following is true regarding oculomotor evaluation in vestibular dysfunction?","o":["Nystagmus that is central in origin will be direction fixed and enhanced with fixation","Smooth pursuit tracking is the least sensitive oculomotor tests","Post headshake Nystagmus is considered clinically significant if at least 3 to 5","Pure vertical nystagmus and nystagmus that changes direction in a fixed head position","Warm water irrigation to the right external auditory mal should"],"k":"C","x":"Post-headshake nystagmus is a sign of asymmetric peripheral vestibular function (Cummings).","src":"2021 exam recall · Q7","d":"Otology"},{"s":"A patient with severe vertigo is referred for vestibular testing. Which of the following pathologies is associated with increased amplitudes during vestibular evoked Article myogenic potentials (VEMPs)? cVEMP (lower threshold and increased amplitude compared to","o":["Endolymphatic hydrops","Superior canal dehiscence","Cochlear otosclerosis","Acoustic schwannoma","Vestibular neuritis"],"k":"B","x":"Superior canal dehiscence gives enlarged VEMP amplitudes and low thresholds (Cummings).","src":"2021 exam recall · Q9","d":"Otology"},{"s":"Which of the following is the most common cause of neonatal facial paralysis?","o":["Möbius syndrome","Birth trauma (pressure/forceps)","Congenital CMV infection","Hemifacial microsomia"],"k":"B","x":"Birth trauma (forceps/pressure on the face) is the commonest cause of neonatal facial paralysis; Möbius and developmental causes are rarer (Cummings).","src":"2021 exam recall · Q10","d":"Paediatric"},{"s":"A 48-year-old female presents with a 6-month history of progressive left sided hearing loss and tinnitus. An MRI with contrast reveals a lateral temporal bone lesion that is hyperintense on Tl and T2. What is the most likely diagnosis?","o":["Vestibular schwannoma","Meningioma","Cholesteatoma","Arachnoid cyst","Cholesterol granuloma"],"k":"E","x":"A lesion hyperintense on both T1 and T2 is a cholesterol granuloma (Cummings).","src":"2021 exam recall · Q11","d":"Otology"},{"s":"Which facial nerve segment is at greatest risk of iatrogenic injury during middle ear cleft surgery?","o":["Meatal","Labyrinthine","Geniculate ganglion","Tympanic","Second genu"],"k":"D","x":"The tympanic (horizontal) segment, often dehiscent above the oval window, is most at risk in middle ear surgery (Brackmann).","src":"2021 exam recall · Q12","d":"Otology"},{"s":"Which of the following is NOT true about temporal bone paragangliomas?","o":["They are confined to the Tympanic cavity","Incidence is more common in females","Almost all are benign","Is slowly growing","Treatment is usually surgical initial management strategy for"],"k":"A","x":"Temporal bone paragangliomas are not confined to the tympanic cavity — glomus jugulare tumours arise at the jugular bulb (Cummings).","src":"2021 exam recall · Q13","d":"Others"},{"s":"Otosclerosis: are multiple or bilateral,","o":["Is a bony overgrowth of stapes Crura","Men are more affected than women","Maybe caused by herpes virus","May cause taste disturbances","Maybe managed by hearing aids"],"k":"E","x":"Otosclerosis can be managed with hearing aids (or stapes surgery); it is female-predominant and affects the stapes footplate (Scott-Brown).","src":"2021 exam recall · Q14","d":"Otology"},{"s":"Which of the following inner ear malformation is contraindicated for cochlear implant?","o":["Enlarged vestibular aqueduct","Enlarged cochlear aqueduct","Mondini deformity","Dehiscent facial nerve","Cochlear aplasia"],"k":"E","x":"Cochlear aplasia (and Michel aplasia) is an absolute contraindication to cochlear implantation (Cummings).","src":"2021 exam recall · Q15","d":"Otology"},{"s":"Monaural diplacusis is present in a lesion of: one sound is perceived as two in the same ear","o":["Acoustic nerve","Pons","Cochlea","Efferent auditory neurons","Cerebral cortex"],"k":"C","x":"Monaural diplacusis (one tone heard as two pitches in the same ear) indicates a cochlear lesion (Scott-Brown).","src":"2021 exam recall · Q17","d":"Otology"},{"s":"The principal objective in stapes surgery is to","o":["Protect the inner ear nom intense sound","Restore ossicular continuity","Restore sound transmission to the inner ear","Decrease fluid movement in the inner ear","Prevent disease progress"],"k":"C","x":"The aim of stapes surgery is to restore sound transmission to the inner ear (Scott-Brown).","src":"2021 exam recall · Q18","d":"Otology"},{"s":"The most common cause of excessive pain in the immediate postoperative period after otoplasty is:","o":["Haematoma","Perichondritis","Suture tension","Chondritis from a cartilage fracture"],"k":"A","x":"Severe or excessive pain early after otoplasty suggests a haematoma until proven otherwise — inspect immediately (Cummings).","src":"2021 exam recall · Q19","d":"Others"},{"s":"In lower motor neuron facial paralysis with intact taste sensation at the anterior a Of the tongue, the level of the lesion is at","o":["Internal auditory canal","Horizontal tympanic part","Vertical part above the stapes","Geniculate ganglion","Stylomastoid foramen"],"k":"E","x":"Lower motor neuron palsy with preserved taste places the lesion distal to the chorda tympani — near the stylomastoid foramen (Scott-Brown).","src":"2021 exam recall · Q20","d":"Head & Neck"},{"s":"In reconstruction of the auricle, the most important contour to recreate is the","o":["Tragus","Helical rim","Antihelix","Antitragus","Concha"],"k":"B","x":"The helical rim is the most important contour to recreate in auricular reconstruction (Cummings).","src":"2021 exam recall · Q21","d":"Others"},{"s":"Which of the following viruses is most commonly isolated from middle ear in patients with acute otitis media?","o":["Adenovirus","Respiratory syncytial virus","Influenza virus","Parainfluenza virus","Poliovirus"],"k":"B","x":"RSV is the virus most commonly isolated from middle ear fluid in AOM (Scott-Brown).","src":"2021 exam recall · Q22","d":"Otology"},{"s":"A 40-year-old woman presented with vertigo on exposure to loud noise What is the name of this phenomenon?","o":["Tullio","Schwartz","Hennebert","Toynbee","Brown"],"k":"A","x":"Vertigo provoked by loud sound is the Tullio phenomenon (Scott-Brown).","src":"2021 exam recall · Q23","d":"Otology"},{"s":"A 16-year-old boy presented with ear discharge post auricular swelling and spiking fever of 5 days duration. Tobey Ayer's test was positive. This test is positive in which one of the following conditions? Lateral Sinus Thrombophlebitis","o":["Sigmoid sinus thrombosis","Acute mastoiditis","Serous labrynthitis","Cavernous sinus thrombosis","Meningitis"],"k":"A","x":"A positive Tobey–Ayer test indicates sigmoid (lateral) sinus thrombosis (Scott-Brown).","src":"2021 exam recall · Q24","d":"Paediatric"},{"s":"A 32-year-old woman underwent stapedectomy for a diagnosis of otosclerosis. Her hearing improved after surgery including the bone conduction curve. Which of the following explains the improvement in bone conduction?","o":["Carhart's effect","Baffle effect","Phase difference","Resonant frequency","Coherent difference"],"k":"A","x":"Improvement of bone conduction after stapedectomy reflects reversal of the Carhart notch/effect (Scott-Brown).","src":"2021 exam recall · Q25","d":"Otology"},{"s":"A 25 year-old man had road traffic accident and diagnosed to have temporal bone Fracture . Which one of the following g clinical findings would indicate surgery?","o":["Sever hearing loss","Bleeding from the ear","immediate complete facial paralysis","Cerebrospinal fluid otorrhea","Skin canal laceration"],"k":"C","x":"Immediate complete facial paralysis after temporal bone fracture suggests nerve transection and may need exploration (Cummings).","src":"2021 exam recall · Q26","d":"Others"},{"s":"Which one of the following audiology findings is consistent with Meniere's disease?","o":["Tone decay negative","Short increment sensitive index of 60%","Presence of recruitment","SNHL with a notch at 4ktlz","Conductive hearing loss"],"k":"C","x":"Recruitment is a cochlear sign consistent with Ménière disease (Scott-Brown).","src":"2021 exam recall · Q27","d":"Otology"},{"s":"Regarding Otosclerosis all is true .EXCEPT","o":["Is common in females","Anti-measles IgG in perilymph are elevated","Is an autosomal recessive with 40% penetrance of recurrent vertigo support the diagnosis. Cumm","Shows halo sign in CT scan","Is bilateral in 85% An autosomal dominant inheritance with penetrance in range of 20–40"],"k":"C","x":"Otosclerosis is autosomal dominant with incomplete penetrance (about 40%) — not recessive (Scott-Brown).","src":"2021 exam recall · Q28","d":"Otology"},{"s":"All the following features may be seen post recovery of the facial nerve paralysis EXCEPT","o":["Synkinesis","Hcmifacial spasm","Crocodile tears","Mass movements","Gustatory sweating"],"k":"E","x":"Gustatory sweating is Frey syndrome after parotid surgery, not facial nerve recovery; synkinesis, spasm and crocodile tears are (Cummings).","src":"2021 exam recall · Q29","d":"Otology"},{"s":"All of the following areas may be affected in auditory neuropathy spectrum disease EXCEPT","o":["Outer hair cells","Inner hair cells","The synaptic junction of the inner hair cells","Auditory nerve","Auditory neurons in the spinal ganglia"],"k":"A","x":"Outer hair cell function (OAEs) is preserved in auditory neuropathy; the lesion is at the inner hair cells, synapse or nerve (Cummings).","src":"2021 exam recall · Q30","d":"Others"},{"s":"The commonest site of otogenic brain abscess occurring due to chronic suppurative otitis media is","o":["Temporal lobe","Frontal lobe","Parietal lobe","Occipital lobe","Cerebellum"],"k":"A","x":"The temporal lobe is the commonest site of otogenic brain abscess, then the cerebellum (Scott-Brown).","src":"2021 exam recall · Q31","d":"Otology"},{"s":"Battle sign is seen in: Postauricular ecchymosis due to bleeding into","o":["Otosclerosis","Skull base fracture","Mastoiditis","Necrotizing otitis externa","Glomus jugulare"],"k":"B","x":"Battle sign (mastoid ecchymosis) indicates a skull base (temporal bone) fracture (Scott-Brown).","src":"2021 exam recall · Q32","d":"Others"},{"s":"Regarding temporal bone fracture","o":["Otic capsule-sparing fractures are associated with cerebrospinal fluid otorrhea","Facial nerve injury is more likely when the otic capsule is spared","Sensorineural hearing loss occurs in all types of fractures","Otic capsule violating fractures result from a blow to the occipital region","All types of fractures are associated with vestibular symptoms"],"k":"D","x":"Otic capsule-violating fractures carry higher risk of facial palsy, SNHL and CSF leak (Cummings).","src":"2021 exam recall · Q33","d":"Others"},{"s":"Which of the following will NOT show physical findings in a patient with third window pathology?","o":["Fistula test","Tragal compression","Valsalva maneuver","Hyperventilation","Tullio phenomenon"],"k":"D","x":"Third-window signs are elicited by pressure (fistula test, tragal compression, Valsalva) or sound (Tullio); hyperventilation is not a third-window test (Cummings).","src":"2021 exam recall · Q34","d":"Others"},{"s":"Regarding autoimmune hearing loss","o":["It presents as gradual sensorineural hearing loss","It is more common in men","Can be managed using diuretics","Unilateral presentation is more common","immunosuppressant is not helpful"],"k":"A","x":"AIED presents as progressive (typically rapidly progressive), often bilateral SNHL responsive to steroids (Cummings).","src":"2021 exam recall · Q35","d":"Otology"},{"s":"What is the best option for a five-year-old child with bilateral aural atresia?","o":["Atresia surgery","Bone-conduction implant (BAHA/Bonebridge)","Body-worn air-conduction hearing aid","Observation"],"k":"B","x":"A child with bilateral atresia at 5 years: bone-anchored (or other bone conduction) implant; atresiaplasty is considered from 6–7 years if anatomy is favourable (Cummings).","src":"2021 exam recall · Q36","d":"Paediatric"},{"s":"Which laryngeal cartilage is the most likely at risk for radionecrosis?","o":["Cricoid","Thyroid lamina","Arytenoid","Epiglottis","Corniculate"],"k":"C","x":"The arytenoid cartilages are most at risk of radionecrosis (Bailey).","src":"2021 exam recall · Q37","d":"Laryngology"},{"s":"The first sign of hypoxia in a neonate is","o":["Tachycardia","Hypotension","Hypertension","Bradycardia","Apnea"],"k":"D","x":"Bradycardia is the earliest sign of hypoxia in neonates (Scott-Brown).","src":"2021 exam recall · Q38","d":"Paediatric"},{"s":"Reflux laryngitis is best treated by","o":["Antacids","Antacids and H2-meptor antagonists","H2-receptor antagonists and promotility agents","Proton-pump inhibitors","Promotility agents"],"k":"D","x":"Proton-pump inhibitors are the mainstay of reflux laryngitis treatment (Cummings).","src":"2021 exam recall · Q39","d":"Laryngology"},{"s":"A 58-year-olu man diagnosed with stage IV laryngeal cancer underwent total laryngectomy and advised post-operative Chemoradiotherapy. He is not known to have any medical problem. Which one of the following chemotherapy should be given?","o":["Cefuximab","Cisplatin","Chlorambucil","Cyclophosphamide","Methotrexate"],"k":"B","x":"Cisplatin is the standard concurrent agent for postoperative chemoradiation (NCCN).","src":"2021 exam recall · Q40","d":"Laryngology"},{"s":"A 12-year-old boy presents with hoarseness of voice. Which is the most likely diagnosis?","o":["Vocal fold nodules","Recurrent respiratory papillomatosis","Vocal fold cyst","Vocal fold paralysis"],"k":"A","x":"Vocal fold nodules are the commonest cause of hoarseness in children (Cummings).","src":"2021 exam recall · Q42","d":"Paediatric"},{"s":"What is the maximum save volume of 1% lidocaine with 1 in 200000 adrenaline for 80 kg male who is otherwise healthy?","o":["20 ml","30 ml","40 ml","50 ml","60 ml"],"k":"D","x":"Lignocaine with adrenaline maximum 7 mg/kg (about 500 mg ceiling) ≈ 50 ml of 1% for an 80 kg adult (Oxford).","src":"2021 exam recall · Q43","d":"Others"},{"s":"Patient undergoes excision of branchial anomaly which is consistent with 2nd T branchial cleft anomaly, Where does this tract terminate?","o":["Piriform sinus","Tonsillar fossa","Oral cavity","Laryngeal vestibule","Nasopharynx"],"k":"B","x":"A second branchial cleft tract ends in the tonsillar fossa (Cummings).","src":"2021 exam recall · Q44","d":"Others"},{"s":"A 47-yeirr-old f male underwent total thyroidectomy for follicular thyroid carcinoma Which of following finding, if present, would NOT be an absolute indication for Post-thyroidectomy radioactive iodine treatment","o":["Primary tumor size less than 4 cm","Suspected distant metastasis","Elevated post-operative thyroglobulin","Extensive vascular invasion","Gross extravascular extension"],"k":"A","x":"RAI is indicated for metastases, raised thyroglobulin, vascular invasion and extrathyroidal extension — not merely a primary <4 cm (ATA 2015).","src":"2021 exam recall · Q46","d":"Head & Neck"},{"s":"A 58-year-old male with history of T3N2bM0 tongue base squamous cell e carcinoma is treated with primary chemoradiation, A one-year post-treatment PET|CT reveal no evidence of oropharyngeal carcinoma, but 2.2 cm right thyroid nodule is discovered Incidentally, What is the next best step In management of this patient?","o":["Observation with ultrasound follow up","Observation with repeat PET/C'T","Fine needle aspiration biopsy","Thyroid lobectomy"],"k":"C","x":"A 2.2 cm thyroid nodule incidentally found on PET should be evaluated with ultrasound-guided FNA (ATA 2015).","src":"2021 exam recall · Q47","d":"Head & Neck"},{"s":"A 72-year-old male, heavy y smoker present with a left parotid tumor. Which of the following salivary tumors has been linked to cigarettes usage?","o":["Cystadenoma lymphamatosum","Mucoepidermoid carcinoma","Adenoid cystic carcinoma","Pleomorphic adenoma","Acinic cell tumor"],"k":"A","x":"Warthin tumour (papillary cystadenoma lymphomatosum) is strongly linked to smoking (Cummings).","src":"2021 exam recall · Q48","d":"Head & Neck"},{"s":"Zenker's diverticulum is","o":["Mucosal herniation of the anterior pharyngeal wall","More common in females","More common on the right side","Rarely presents with food regurgitation","Treated by endoscopic stapling"],"k":"E","x":"Zenker diverticulum is commonly treated by endoscopic stapling/laser diverticulotomy; it is posterior, left-sided and commoner in elderly men (Scott-Brown).","src":"2021 exam recall · Q49","d":"Others"},{"s":"The best survival rate of salivary gland cancer is present in","o":["Mucoepidermoid","Acinic cell","Adenoid cystic","Squamous cell","Lymphoma"],"k":"B","x":"Acinic cell carcinoma has among the best survival of salivary malignancies (with low-grade MEC) (Cummings).","src":"2021 exam recall · Q50","d":"Head & Neck"},{"s":"T1 Lip cancer, all the following n g are true EXCEPT","o":["Survival rate is high","Recurrence rate is low","Pipe smoking is a risk factor","Neck metastasis m unusual","More common in the upper lip"],"k":"E","x":"Lip cancer is far more common on the lower lip (about 90%) (Cummings).","src":"2021 exam recall · Q51","d":"Head & Neck"},{"s":"The commonest site of minor salivary gland cancer is","o":["Palate","Lips","Buccal mucosa","Tongue","Floor of the mouth"],"k":"A","x":"The palate is the commonest site of minor salivary gland cancer (Cummings).","src":"2021 exam recall · Q52","d":"Head & Neck"},{"s":"Selective neck dissection for squamous cell carcinoma of the supraglottis involvement the following levels","o":["I-III","I-IV","II-IV","II-V","III-VI"],"k":"C","x":"Supraglottic SCC elective neck dissection covers levels II–IV (lateral neck dissection) (NCCN).","src":"2021 exam recall · Q53","d":"Head & Neck"},{"s":"A 44year-old male smoker presents with hoarseness and superficial hyperkeratosis on a mobile right vocal cord. What would be the next step in management?","o":["MRI larynx","CT larynx","Administration of proton pump inhibitor","Speech therapy","Direct laryngoscopy with excision biopsy"],"k function begin(){S.ans={};S.flag={};S.pos=0;S.phase='run';S.start=Date.now();
  if(S.mode=='exam'){S.end=S.start+S.mins*60000;S.tick=setInterval(()=>{const r=S.end-Date.now();const t=$('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}
  show()}
function answered(){return Object.keys(S.ans).length}
function show(){
  const q=Q[S.pos],a=S.ans[S.pos],prac=S.mode=='practice';
  let h=`<div class="top"><div class="topi">${S.mode=='exam'?`<span class="timer" id="tm">${fmt(S.end-Date.now())}</span>`:`<span class="timer">${Object.entries(S.ans).filter(([i,v])=>v==Q[i].k).length}/${answered()}</span>`}<span class="t">${answered()} of ${Q.length} answered</span><button class="flagbtn ${S.flag[S.pos]?'on':''}" onclick="flag()" aria-pressed="${!!S.flag[S.pos]}">${S.flag[S.pos]?'Flagged':'Flag'}</button></div><div class="bar"><i style="width:${(S.pos+1)}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${Q.length}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${S.pos+1}" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,i)=>{const l=L[i];let c='';if(prac&&a){if(l==q.k)c='ok';else if(l==a)c='bad'}else if(a==l)c='sel';
    h+=`<button class="opt ${c}" ${prac&&a?'disabled':''} onclick="pick('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(prac&&a)h+=expl(q,a);
  $('#app').innerHTML=h;
  const last=S.pos==Q.length-1;
  nav(`<button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Questions</button>${last?`<button class="primary" onclick="confirmSubmit()">Submit</button>`:`<button class="primary" onclick="go(1)">Next</button>`}`);
}
function expl(q,a){const ok=a==q.k;
  return `<div class="exp"><h3 class="${a?(ok?'ok':'bad'):'na'}">${a?(ok?'Correct':'Incorrect'):'Not answered'} — answer ${q.k}</h3>${q.x?`<p>${esc(q.x)}</p>`:`<p class="note">The source gives the key only for this question.</p>`}${q.xi?q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join(''):''}<div class="src">${esc(q.d)} · ${esc(q.src)}</div></div>`}
function pick(l){if(S.mode=='practice'&&S.ans[S.pos])return;if(S.mode=='exam'&&S.ans[S.pos]==l)delete S.ans[S.pos];else S.ans[S.pos]=l;const y=scrollY;show();scrollTo(0,y)}
function flag(){S.flag[S.pos]?delete S.flag[S.pos]:S.flag[S.pos]=1;const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(Q.length-1,S.pos+d));show();scrollTo(0,0)}
function grid(){const d=$('#dlg');const nf=Object.keys(S.flag).length,na=Q.length-answered();
  d.innerHTML=`<b>Questions</b><div class="legend" style="margin-top:6px"><span class="a">Answered (${answered()})</span><span class="f">Flagged (${nf})</span><span>Unanswered (${na})</span></div>
  <div class="grid">${Q.map((_,i)=>`<button class="${S.ans[i]?'ans':''} ${S.flag[i]?'flg':''} ${i==S.pos?'cur':''}" onclick="S.pos=${i};$('#dlg').close();show();scrollTo(0,0)" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div>
  <div class="row"><button class="ghost" onclick="$('#dlg').close()">Close</button><button class="primary" onclick="$('#dlg').close();confirmSubmit()">Submit paper</button></div>`;d.showModal()}
function confirmSubmit(){const d=$('#dlg');const na=Q.length-answered(),nf=Object.keys(S.flag).length;
  d.innerHTML=`<b>Submit this paper?</b><p class="note">${na?`${na} question${na>1?'s are':' is'} unanswered. `:'All questions answered. '}${nf?`${nf} flagged.`:''} You can't change answers after submitting.</p><div class="row"><button class="ghost" onclick="$('#dlg').close()">Keep going</button><button class="primary" onclick="$('#dlg').close();submit()">Submit</button></div>`;d.showModal()}
function submit(auto){clearInterval(S.tick);S.used=Date.now()-S.start;S.phase='done';S.auto=!!auto;if($('#dlg').open)$('#dlg').close();results()}
function results(){nav();
  let r=0;const by={};Q.forEach((q,i)=>{const b=by[q.d]=by[q.d]||{n:0,r:0};b.n++;if(S.ans[i]==q.k){r++;b.r++}});
  const wrong=Q.map((q,i)=>i).filter(i=>S.ans[i]&&S.ans[i]!=Q[i].k),skip=Q.map((q,i)=>i).filter(i=>!S.ans[i]),fl=Object.keys(S.flag).map(Number).sort((a,b)=>a-b);
  $('#app').innerHTML=`<div class="kicker">${esc(P.title)}</div><h1>Results</h1>${S.auto?'<p class="note">Time ran out — the paper was submitted automatically.</p>':''}
  <div class="big">${r}<span style="font-size:1.4rem;color:var(--muted)">/100</span></div><p class="sub">${wrong.length} incorrect · ${skip.length} unanswered · time used ${fmt(S.used)}</p>
  <div class="card"><table>${DOMS.filter(d=>by[d]).map(d=>{const b=by[d],p=Math.round(b.r/b.n*100);return `<tr><td>${d}<div class="meter"><i style="width:${p}%"></i></div></td><td>${b.r}/${b.n} · ${p}%</td></tr>`}).join('')}</table></div>
  <div class="row"><button class="primary" ${wrong.length+skip.length?'':'disabled'} onclick="review('Incorrect and unanswered',${JSON.stringify(wrong.concat(skip).sort((a,b)=>a-b))})">Review incorrect (${wrong.length+skip.length})</button></div>
  <div class="row"><button class="ghost" ${fl.length?'':'disabled'} onclick="review('Flagged',${JSON.stringify(fl)})">Flagged (${fl.length})</button><button class="ghost" onclick="review('All questions',${JSON.stringify(Q.map((_,i)=>i))})">All 100</button></div>
  <div class="row"><button class="ghost" onclick="startScreen()">Retake paper</button></div>`;scrollTo(0,0)}
function review(t,list){S.list=list;S.rpos=0;S.rtitle=t;rshow()}
function rshow(){const i=S.list[S.rpos],q=Q[i],a=S.ans[i];
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="results()">Results</button><span class="t">${S.rtitle} · ${S.rpos+1}/${S.list.length}</span>${S.flag[i]?'<span class="flagbtn on">Flagged</span>':''}</div></div>
  <div class="qn">Question ${i+1}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,j)=>{const l=L[j];const c=l==q.k?'ok':(l==a?'bad':'');h+=`<button class="opt ${c}" disabled><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  h+=expl(q,a);$('#app').innerHTML=h;
  nav(`<button class="ghost" ${S.rpos?'':'disabled'} onclick="S.rpos--;rshow();scrollTo(0,0)">Previous</button><button class="primary" ${S.rpos<S.list.length-1?'':'disabled'} onclick="S.rpos++;rshow();scrollTo(0,0)">Next</button>`)}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
window.addEventListener('beforeunload',e=>{if(S.phase=='run'){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(S.phase!='run'||$('#dlg').open)return;if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else{const i=L.indexOf(e.key.toUpperCase());if(e.key.length==1&&i>=0&&i<Q[S.pos].o.length)pick(L[i])}});
startScreen();

function pickPaper(i){PI=i;P=PAPERS[i];Q=P.q;S.ans={};S.flag={};S.pos=0;startScreen()}</script></body></html>
