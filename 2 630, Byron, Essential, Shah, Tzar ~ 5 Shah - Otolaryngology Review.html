<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Otolaryngology–Head and Neck Surgery Review (Shah) — MCQs</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--box:#0B1418;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--box:#000;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.chap{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px}
.chap.on{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.chap b{flex:1;font-weight:600}
.chap span{color:var(--muted);font-variant-numeric:tabular-nums}
.chap .done{font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px}
.seg button.on{background:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#06201F}}
.primary{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
@media (prefers-color-scheme:dark){.primary{color:#06201F}}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.topi .t{flex:1;min-width:0;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topi .sc{font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width .25s}
.qn{font:600 .9rem/1 inherit;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.note{font-size:.9rem;color:var(--muted);margin:-4px 0 12px}
.flag{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:6px;font-size:.92rem;margin:0 0 12px}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}
.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}
.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:12px 0 4px}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-cur{outline:2px solid var(--teal);outline-offset:1px}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:8px 0}
table{width:100%;border-collapse:collapse;margin:12px 0 18px;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

istula","Vestibular schwannoma","Superior semicircular canal dehiscence","Otospongiosis","Paget disease"],"k":"C","x":"","n":11},{"bn":62,"s":"The facial nerve segment that is least likely to enhance on contrast-enhanced MRI is:","o":["Labyrinthine","Geniculate","Tympanic","Mastoid"],"k":"A","x":"","n":12},{"bn":63,"s":"MRI of a woman with facial nerve weakness and a whitish mass behind the tympanic membrane shows an avidly enhancing mass associated with the tympanic segment of the facial nerve. The most likely diagnosis is:","o":["Schwannoma","Hemangioma","Paraganglioma","Cholesterol granuloma","Cholesteatoma"],"k":"A","x":"","n":13},{"bn":64,"s":"A purple mass behind the tympanic membrane is least likely to be a:","o":["Glomus tumor","Cholesterol granuloma","Cholesteatoma","Dehiscent jugular bulb","Aberrant carotid artery"],"k":"C","x":"","n":14},{"bn":65,"s":"Gradenigo syndrome is caused by spread of mastoid infection to the:","o":["Middle ear tegmen","Inferior mastoid","Petrous apex","Sigmoid sinus","Orbit"],"k":"C","x":"","n":15},{"bn":66,"s":"What is the most common abnormality of the petrous apex seen in imaging studies?","o":["Cholesterol granuloma","Congenital cholesteatoma","Meningoencephalocele","Effusion","Metastasis"],"k":"D","x":"","n":16},{"bn":67,"s":"Hyperintense T1 signal in an expansile petrous apex lesion is characteristic for:","o":["Cholesterol granuloma","Congenital cholesteatoma","Meningoencephalocele","Effusion","Metastasis"],"k":"A","x":"","n":17},{"bn":68,"s":"A mass demonstrating marked heterogeneity of MRI signal due to blood by-products centered in the dorsal petrous ridge is most likely to represent a:","o":["Cholesterol granuloma","Cholesteatoma","Meningioma","Endolymphatic sac tumor","Choristoma"],"k":"D","x":"","n":18},{"bn":69,"s":"An expansile petrous apex mass that shows fluid signal and no enhancement on MRI is most likely to be a:","o":["Schwannoma","Cholesteatoma","Meningocele","Effusion","Cholesterol granuloma"],"k":"C","x":"","n":19},{"bn":70,"s":"Which of the following is a contraindication for cochlear implantation?","o":["Absence of the cochlear nerve on MRI","Enlarged vestibular aqueduct","Michel anomaly","Anomalous cochlea","Anomalous vestibule"],"k":"C","x":"","n":20},{"bn":71,"s":"The most common imaging abnormality in a child with sensorineural hearing loss is:","o":["Semicircular canal anomaly","Cochlear anomaly","Vestibular anomaly","Enlarged vestibular aqueduct","Enlarged cochlear aqueduct"],"k":"D","x":"","n":21},{"bn":72,"s":"Which of the following structures exits the cranium outside the jugular foramen?","o":["Glossopharyngeal nerve","Vagus nerve","Spinal accessory nerve","Hypoglossal nerve","Internal jugular vein"],"k":"D","x":"","n":22},{"bn":73,"s":"The most common mass in the jugular foramen is:","o":["Paraganglioma","Schwannoma","Meningioma","Metastasis","Chondrosarcoma"],"k":"A","x":"","n":23},{"bn":74,"s":"The incidence of multicentric paraganglioma in a patient with a family history of neck masses is:","o":["2%","7%","15%","20%","25%"],"k":"E","x":"","n":24},{"bn":75,"s":"The most common site of CSF leak at the anterior skull base is:","o":["Cribriform plate","Fovea ethmoidalis","Lateral lamella","Frontal plate","Crista galli"],"k":"C","x":"","n":25},{"bn":76,"s":"The middle meatus is part of the drainage pathway for which sinuses?","o":["Sphenoid and posterior ethmoid","Anterior and posterior ethmoid","Frontal, maxillary, and sphenoid","Frontal, maxillary, and anterior ethmoid"],"k":"D","x":"","n":26},{"bn":77,"s":"The modality of choice for the evaluation of chronic rhinosinusitis and planning of surgery is:","o":["MRI","Radiography","Fluoroscopy","CT"],"k":"D","x":"","n":27},{"bn":78,"s":"The imaging characteristics of silent sinus syndrome include:","o":["A clear sinus airspace","Sinus wall thickening","Bulging of the anterior wall of the sinus","Exophthalmos","Patent infundibulum"],"k":"B","x":"","n":28},{"bn":79,"s":"Identification of sphenoethmoidal (Onodi "],"k":"D","x":"","n":7},{"bn":58,"s":"A middle ear filled with cholesteatoma via an attic retraction would mostly likely present with which of the following on tympanometry?","o":["Shallow pressure peak within the normal range, large volume","Dynamic pressure peak within the normal range, normal volume","Flat pressure curve, normal volume","Flat pressure curve, restricted volume","Tympanometry would be difficult to perform in a patient with extensive middle ear cholesteatoma."],"k":"C","x":"","n":8},{"bn":59,"s":"All of the following are reasons that cholesteatoma should be managed surgically, even in early presentations of the disease, EXCEPT:","o":["Propensity of cholesteatoma to progressively erode structures within the middle ear space","Propensity of cholesteatoma to form biofilms resistant to medical therapies","Tendency of cholesteatoma to cause early cranial nerve VII palsy","Risk of progressive hearing loss in unchecked disease","All of the above are reasons for surgical management."],"k":"C","x":"","n":9},{"bn":60,"s":"Which of the following structures within the middle ear does NOT play a significant role in limiting the predictable spread of cholesteatoma?","o":["Promontory","Tympanic diaphragm","Lateral mallear fold","Incus body","Malleus head"],"k":"A","x":"","n":10},{"bn":61,"s":"Which of the following is the second most common location for primary acquired cholesteatoma?","o":["Anterior pars tensa","Inferior pars tensa","Posterior pouch of von Troeltsch","Anterior pouch of von Troeltsch","Posterior pars tensa"],"k":"E","x":"","n":11},{"bn":62,"s":"The most common route for a posterior epitympanic cholesteatoma to reach the sinus tympani would be which of the following?","o":["Prussak space > posterior pouch of von Troeltsch > posterior mesotympanum > sinus tympani","Prussak space > anterior pouch of von Troeltsch > anterior mesotympanum > sinus tympani","Prussak space > superior incudal space > aditus ad antrum > sinus tympani","Superior incudal space > posterior pouch of von Troeltsch > facial recess > sinus tympani"],"k":"A","x":"","n":12},{"bn":63,"s":"Shrapnell membrane is structurally distinct for which of the following reasons?","o":["As the only interossicular membrane in the middle ear, it has vibroelastic properties.","Its pseudoepithelium is permeable to gas transfer.","It is stabilized circumferentially by a thick, fibrous annulus.","It lacks a central fibrous connective tissue layer.","It is highly resistant to the propagation of cholesteatoma."],"k":"D","x":"","n":13},{"bn":64,"s":"Which of the following best describes MRI imaging characteristics of cholesteatoma?","o":["Iso/hypointense on T1, intermediate/hyperintensity on T2, no contrast enhancement, no restriction on diffusion-weighted MRI","Iso/hypointense on T1, hypointensity on T2, no contrast enhancement, no restriction on diffusionweighted MRI","Iso/hypointense on T1, hypointensity on T2, no contrast enhancement, restriction on diffusionweighted MRI","Hyperintensity on T1, intermediate/hyperintensity on T2, no contrast enhancement, no restriction on diffusion-weighted MRI","Iso/hypointense on T1, intermediate/hyperintensity on T2, no contrast enhancement, restriction on diffusion-weighted MRI"],"k":"E","x":"","n":14},{"bn":65,"s":"In addition to cholesteatoma, diffusion-weighted MRI will also demonstrate increased signal intensity from which of the following?","o":["Cholesterol granuloma","Mucoid secretions","Granulation tissue","Serous effusion","None of the above"],"k":"E","x":"","n":15},{"bn":66,"s":"In the workup of primary acquired cholesteatoma, dedicated temporal bone CT provides the surgeon with excellent:","o":["Diagnostic sensitivity","Diagnostic specificity","Positive predictive value","Negative predictive value","None of the above"],"k":"D","x":"","n":16},{"bn":67,"s":"Which of the following would NOT potentially be a histopathologic finding within a middle ear filled with cholesteatoma?","o":["Activated osteoclasts with evidence of bone erosion","Keratin debris surrounded by a keratinizing pseudoepithelial matrix","Bacterial biofilm formation harboring Gram-negative rods","Papillary proliferation of epithelial cones through the basilar layers of the tympanic membrane","Papillary proliferation of epithelial cones into the epineurium of the chorda tympani nerve"],"k":"E","x":"","n":17},{"bn":68,"s":"The most common organisms found to infect cholesteatomas are which of the following?","o":["Gram-negative cocci","Gram-positive rods","Acid-fast bacilli","Gram-negative rods","Yeast exhibiting septate hyphae branching at 45-degree angles"],"k":"D","x":"","n":18},{"bn":69,"s":"The histopathologic layers of a cholesteatoma, in order from innermost to outermost, are:","o":["Concentrically layered keratin debris, matrix, perimatrix, inflammatory infiltrate","Concentrically layered keratin debris, perimatrix, matrix, inflammatory infiltrate","Matrix, perimatrix, concentrically layered keratin debris, inflammatory infiltrate","Matrix, perimatrix, inflammatory infiltrate, concentrically layered keratin debris"],"k":"A","x":"","n":19},{"bn":70,"s":"Which of the following is NOT a theory describing the formation of cholesteatoma?","o":["Invagination of a retraction pocket of the tympanic membrane","Basal cell hyperplasia","Hypoxia-mediated fibrosis of keratin emboli","Squamous metaplasia of middle ear epithelium","Epithelial migration through a perforation"],"k":"C","x":"","n":20},{"bn":71,"s":"A retraction pocket arising from which of the following locations would be most likely to give rise to cholesteatoma involving the sinus tympani?","o":["Attic/Prussak space","Anterior epitympanum","Posterior mesotympanum","Posterior, inferior external auditory canal"],"k":"C","x":"","n":21},{"bn":72,"s":"Which of the following is NOT a classification of cholesteatoma?","o":["Primary","Secondary","Tertiary","Congenital","Acquired"],"k":"C","x":"","n":22},{"bn":73,"s":"“Contact inhibition” refers to which of the fo teatoma is theorized to form secondary to failure to involute of which of the following structures?","o":["Squamoid formation","Epidermoid formation","Keratinoblast rest","None of the above"],"k":"B","x":"","n":47},{"bn":98,"s":"What percentage of middle ear congenital cholesteatomas are found in the anterior superior quadrant?","o":["> 60%","30% to 60%","15% to 30%","< 15%"],"k":"A","x":"","n":48},{"bn":99,"s":"All of the following support a diagnosis of congenital cholesteatoma EXCEPT:","o":["Whitish mass in anterior superior quadrant of mesotympanum","Intact tympanic membrane","No history of otorrhea","An intact ossicular chain","No prior otologic surgery"],"k":"D","x":"","n":49},{"bn":100,"s":"Which statement is INCORRECT with regard to congenital cholesteatoma?","o":["There is male predominance.","It may involve the ossicular chain.","It may extend to involve the mastoid.","It may be associated with prior history of acute otitis media.","Recurrence rates are typically higher than those seen with primary acquired cholesteatoma."],"k":"E","x":"","n":50}]},{"t":"Ch 7 · Otitis Media and Externa","q":[{"bn":51,"s":"Which of the following is the single most important initial investigation in an adult presenting with unilateral otitis media with effusion?","o":["Computed tomography (CT) of the temporal bones","CT of the paranasal sinuses","Immunoglobulin E (IgE) and radioallergosorbent test (RAST)","Flexible nasoendoscopy"],"k":"D","x":"","n":1},{"bn":52,"s":"What is the attic portion of the middle ear also known as?","o":["Protympanum","Mesotympanum","Epitympanum","Antrum"],"k":"C","x":"","n":2},{"bn":53,"s":"Which aspect of tympanostomy tube insertion affects how long the tube remains in the tympanic membrane?","o":["Diameter of the inner flange","Part of the tympanic membrane into which the tube is inserted","Material tube is made from","Grade of surgeon who performs the procedure"],"k":"A","x":"","n":3},{"bn":54,"s":"What is the most common postoperative problem with tympanostomy tubes?","o":["Persistent perforation of the tympanic membrane","Lack of resolution of conductive hearing loss","Otorrhea","Otalgia"],"k":"C","x":"","n":4},{"bn":55,"s":"The temporal line is the surface landmark for which important structure?","o":["Mastoid antrum","Endolymphatic sac","Sigmoid sinus","Dura of the middle cranial fossa"],"k":"D","x":"","n":5},{"bn":56,"s":"Which portion of an ossicle is most commonly eroded by chronic/recurrent otitis media?","o":["Head of malleus","Long process of incus","Crura of stapes","Stapes footplate"],"k":"B","x":"","n":6},{"bn":57,"s":"Which of the following is a useful landmark for the facial nerve during mastoid surgery?","o":["Horizontal semicircular canal","Short process of the incus","Posterior external auditory canal","All of the above"],"k":"D","x":"","n":7},{"bn":58,"s":"Why might a mastoid cavity fail?","o":["High facial ridge","Dependent mastoid tip","No/inadequate meatoplasty","All of the above"],"k":"D","x":"","n":8},{"bn":59,"s":"Which cranial nerve is most commonly involved in necrotizing otitis externa?","o":["Trigeminal","Facial","Vestibulocochlear","Glossopharyngeal"],"k":"B","x":"","n":9},{"bn":60,"s":"Drops containing which of the following can be used to prevent otitis externa?","o":["Gentamicin","Ichthammol","Arachis oil","Acetic acid"],"k":"D","x":"","n":10},{"bn":61,"s":"What is the mortality rate associated with necrotizing otitis externa?","o":["5%","10%","50%","60%"],"k":"B","x":"","n":11},{"bn":62,"s":"Which organism most commonly causes acute otitis media?","o":["Influenza A virus","Moraxella catarrhalis","Streptococcus pneumoniae","Haemophilus influenzae"],"k":"C","x":"","n":12},{"bn":63,"s":"What is the most common intracranial complication of acute/chronic otitis media?","o":["Sigmoid sinus thrombosis","Meningitis","Temporal lobe abscess","Extradural abscess"],"k":"B","x":"","n":13},{"bn":64,"s":"Hyrtl fissure predisposes to which intracranial complication of acute/chronic otitis
