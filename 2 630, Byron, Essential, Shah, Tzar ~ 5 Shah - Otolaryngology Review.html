n","CT"],"k":"B","x":"","n":38},{"bn":89,"s":"Which scan is most useful for an early diagnosis of necrotizing otitis externa?","o":["Technetium-99m","Gallium-67 citrate","MRI with gadolinium enhancement and fat suppression","CT"],"k":"A","x":"","n":39},{"bn":90,"s":"Cortisporin Otic contains:","o":["Acetic acid 2% and hydrocortisone 1%","Framycetin 0.5%, gramicidin 0.005%, and dexamethasone 0.05%","Neomycin, polymyxin B, and hydrocortisone","Triamcinolone, neomycin, gramicidin, and nystatin"],"k":"C","x":"","n":40},{"bn":91,"s":"Körner septum represents the suture line between which parts of the temporal bone?","o":["Squamous and mastoid","Tympanic and mastoid","Petrous and squamous","Petrous and tympanic"],"k":"C","x":"","n":41},{"bn":92,"s":"Which statement is INCORRECT regarding cerumen?","o":["It is bactericidal.","It needs to be cleared regularly.","It contains secretions from sebaceous and apocrine glands.","It is slightly acidic."],"k":"B","x":"","n":42},{"bn":93,"s":"All of the following are true regarding acute otitis media EXCEPT:","o":["It is more common in lower socioeconomic groups.","It is more common in bottle-fed children.","It is more common if child lives in a crowded environment.","It is more common in children cared for at home."],"k":"D","x":"","n":43},{"bn":94,"s":"A child less than 2 years of age with otalgia and otorrhea is most likely to have which of the following?","o":["Otitis externa","Otitis media with effusion","Acute otitis media","Congenital cholesteatoma"],"k":"C","x":"","n":44},{"bn":95,"s":"An elderly diabetic with otalgia and otorrhea should be suspected of having which of the following?","o":["Otitis externa","Necrotizing otitis externa","Acute otitis media","Congenital cholesteatoma"],"k":"B","x":"","n":45},{"bn":96,"s":"Features of acute mastoiditis in a child include:","o":["Otalgia","Fever","Lateral displacement of the pinna","All of the above"],"k":"D","x":"","n":46},{"bn":97,"s":"Which of the following is NOT a landmark used for planning a postauricular incision?","o":["Temporal line","Zygomatic arch","Mastoid tip","Postauricular sulcus"],"k":"B","x":"","n":47},{"bn":98,"s":"Where is a tympanic membrane graft most likely to fail?","o":["Anterior","Posterior","Superior","Inferior"],"k":"A","x":"","n":48},{"bn":99,"s":"Anaphylaxis occurs in what percentage of patients given penicillin?","o":["0.01%","0.1%","1%","10%"],"k":"A","x":"","n":49},{"bn":100,"s":"A type B tympanogram may suggest:","o":["A middle ear effusion","A tympanic membrane perforation","A patent ventilation tube","All of the above"],"k":"D","x":"","n":50}]},{"t":"Ch 8 · Facial Nerve Disorders","q":[{"bn":51,"s":"The facial nerve origina tes from the facial motor nucleus, which lies in the:","o":["Anterior pons","Posterior pons","Lateral portion of anterior pons","Lateral portion of posterior pons"],"k":"C","x":"","n":1},{"bn":52,"s":"The nervus intermedius carries:","o":["Afferent fibers for taste from the anterior two-thirds of the tongue and conveys sensation from the anterior wall of external auditory canal (EAC)","Afferent fibers for taste from the anterior two-thirds of the tongue and conveys sensation to the posterior EAC","Afferent fibers for taste from the anterior two-thirds of the tongue and conveys sensation to the posterior EAC, as well as secretory fibers to the lacrimal, sublingual, and submaxillary glands","Only afferent fibers conveying sensation to the posterior wall of the EAC"],"k":"C","x":"","n":2},{"bn":53,"s":"The chorda tympani carries:","o":["Preganglionic, parasympathetic fibers that synapse at the submandibular ganglion","Preganglionic, sympathetic fibers that synapse at the submandibular ganglion","Postganglionic, parasympathetic fibers that innervate only the submandibular gland","Postganglionic, sympathetic fibers that innervate only the sublingual gland"],"k":"A","x":"","n":3},{"bn":54,"s":"Transverse fractures:","o":["Are less common than longitudinal fractures but more likely to cause facial nerve damage, occurring in up to 50% of fractures","Are more common than longitudinal fractures but more likely to cause facial nerve damage, occurring in up to 50% of fractures","Are more common than longitudinal fractures but less likely to cause facial nerve damage","Are a result of trauma to the temporal and parietal region of the skull"],"k":"A","x":"","n":4},{"bn":55,"s":"Facial nerve schwannomas are typically:","o":["Extratemporal and most often involve the tympanic segment and geniculate ganglion","Extratemporal and most often involve the labyrinthine segment and geniculate ganglion","Intratemporal and most often involve the labyrinthine segment and geniculate ganglion","Intratemporal and most often involve the tympanic segment and geniculate ganglion"],"k":"C","x":"","n":5},{"bn":56,"s":"The most common neurologic manifestation of Lyme disease is:","o":["Sensorineural hearing loss (SNHL)","Facial nerve paralysis","Neuralgia","Hypesthesia"],"k":"B","x":"","n":6},{"bn":57,"s":"Which is the most accurate statement regarding the etiology and management of Ramsay Hunt syndrome (RHS)?","o":["Herpes simplex virus (HSV) reactivation at the geniculate ganglion and is treated with antivirals only","Varicella-zoster virus (VZV) reactivation at the geniculate ganglion and is treated with corticosteroids only","VZV reactivation at the geniculate ganglion and is treated with antivirals only and is treated with corticosteroids only","VZV reactivation at the geniculate ganglion and is treated with antivirals and corticosteroids"],"k":"D","x":"","n":7},{"bn":58,"s":"Neonatal facial palsy is most likely caused by which of the following?","o":["Möbius syndrome","Maternal transmission of HSV","Melkersson-Rosenthal syndrome","Birth trauma"],"k":"D","x":"","n":8},{"bn":59,"s":"Beginning at Bill bar and ending in the stylomastoid foramen, the facial canal is approximately how long?","o":["30 mm","50 mm","60 mm","10 cm"],"k":"A","x":"","n":9},{"bn":60,"s":"The greater superficial petrosal nerve:","o":["Supplies taste fibers to the anterior palate","Contains taste fibers and preganglionic parasympathetic fibers","Contains sympathetic fibers that supply the nasal and palatine mucosal glands","Does not carry any sensory or parasympathetic fibers"],"k":"B","x":"","n":10},{"bn":61,"s":"The digastric ridge and tendon is:","o":["Anterior, inferior, and superficial to the facial nerve","Anterior, superior, and superficial to the facial nerve","Posterior, inferior, and superficial to the facial nerve","Posterior, superior, and superficial to the facial nerve"],"k":"C","x":"","n":11},{"bn":62,"s":"The most common abnormality within the vertical segment of the facial nerve is:","o":["Anterior medial displacement","Anterior lateral displacement","Posterior medial displacement","Posterior lateral displacement"],"k":"D","x":"","n":12},{"bn":63,"s":"Synkinesis:","o":["Refers to mass movement of the face","Results from adequate facial nerve regeneration","Results from abnormal facial nerve regeneration","a and c"],"k":"D","x":"","n":13},{"bn":64,"s":"On EMG, fibrillation potentials or denervation potentials:","o":["Occur as part of normal nerve regeneration","Occur 14 to 21 days after wallerian degeneration occurs","Occur immediately after nerve injury","Occur only if the nerve does not undergo wallerian degeneration"],"k":"B","x":"","n":14},{"bn":65,"s":"Recurrent facial palsy, furrowed tongue, and faciolabial edema are seen in which of the following?","o":["Melkersson-Rosenthal syndrome","Familial Bell palsy","Möbius syndrome","Millard-Gubler syndrome"],"k":"A","x":"","n":15},{"bn":66,"s":"Bilateral facial palsies can be encountered with all listed EXCEPT:","o":["Bell palsy","Syphilis","Melkersson-Rosenthal syndrome","Multiple sclerosis"],"k":"C","x":"","n":16},{"bn":67,"s":"The following are considered typical presentations for Bell palsy EXCEPT:","o":["Pain or numbness of the ear or midface","Progressive facial paralysis occurring over 3 weeks or longer","Taste disturbances","Acute onset facial paralysis or paresis"],"k":"B","x":"","n":17},{"bn":68,"s":"Herpes zoster oticus:","o":["Can affect the ear canal, external ear, and soft palate","Is referred to as Ramsay Hunt syndrome when there is concurrent facial palsy","Presents with otalgia and varicelliform lesions","All of the above"],"k":"D","x":"","n":18},{"bn":69,"s":"With House-Brackmann grade IV dysfunction, there is:","o":["Complete eye closure with maximal effort","Incomplete eye closure with maximal effort","Perceptible forehead movement","Barely perceptible motion"],"k":"B","x":"","n":19},{"bn":70,"s":"Histopathology studies of patients with Bell palsy have shown:","o":["Intraneural vascular congestion of the facial nerve","Hemorrhage in the labyrinthine segment of the facial nerve","Leukocytic infiltration of the facial nerve","All of the above"],"k":"D","x":"","n":20},{"bn":71,"s":"In adults, Lyme disease is promptly treated with which of the following?","o":["3 weeks of Keflex","3 weeks of amoxicillin","3 weeks of doxycycline","1 million units of penicillin G intramuscularly × 1"],"k":"C","x":"","n":21},{"bn":72,"s":"Facial palsy with concurrent acute otitis media is treated with which of the following?","o":["Systemic antibiotics","Wide myringotomy and systemic antibiotics","Cortical mastoidectomy only if antibiotics and myringotomy fail","Facial nerve decompression"],"k":"C","x":"","n":22},{"bn":73,"s":"Contrast-enhanced MRI in patients with Bell palsy may show:","o":["Diffuse enhancement of the ipsilateral facial nerve","Focal enhancement of the ipsilateral facial nerve","Diffuse enhancement of bilateral facial nerves","No enhancement of the facial nerve"],"k":"A","x":"","n":23},{"bn":74,"s":"The trigeminofacial (blink) reflex:","o":["Assesses facial nerve conduction via activation of the facial nucleus centrally","Records action potentials reflexively generated in the orbicularis oculi muscle in response to an electrical stimulus to the supraorbital area","Is not relevant to facial nerve function","a and b"],"k":"D","x":"","n":24},{"bn":75,"s":"Facial neuromas in the temporal bone exhibit a distinct predilection for which of the following?","o":["The labyrinthine segment","The geniculate ganglion","The tympanic segment","The vertical segment at the stylomastoid foramen"],"k":"B","x":"","n":25},{"bn":76,"s":"On Sunderland’s description of the pathophysiology of nerve compression, stage 2 refers to which of the following?","o":["Compromised arterial supply with subsequent fibrosis and permanent damage","Venous congestion with reversible damage","Endothelial damage, intrafascicular edema with subsequent ischemia, and segmental demyelination","None of the above"],"k":"C","x":"","n":26},{"bn":77,"s":"Traumatic neuromas are:","o":["Nonneoplastic proliferations of peripheral nerves","Composed of disrupted axons, Schwann cells, and fibroblastic cells","Caused by relatively trivial injuries to the head/face","All of the above"],"k":"D","x":"","n":27},{"bn":78,"s":"Facial nerve hemangiomas have a predilection for:","o":["Geniculate ganglion","Scarpa ganglion","a only","a and b"],"k":"D","x":"","n":28},{"bn":79,"s":"Granular cell tumors:","o":["Are derived from Schwann cells","Are seen predominantly in Caucasian men","Develop in the second and third decades of life","Are commonly found in the breast"],"k":"A","x":"","n":29},{"bn":80,"s":"Typical presentations of facial nerve tumors include which of the following?","o":["Gradually progressive facial paralysis","Twitching of the facial musculature","Recurrent facial paralysis","All of the above"],"k":"D","x":"","n":30},{"bn":81,"s":"The presence of a stapedial reflex in a patient with facial paralysis:","o":["Is consistent with a parotid gland tumor","Is an expected finding","Is consistent with an intratemporal tumor","Is irrelevant in the workup of facial paralysis"],"k":"A","x":"","n":31},{"bn":82,"s":"Treatment of facial schwannomas includes:","o":["Watchful waiting when there is underlying good facial function","Radiosurgery immediately on diagnosis","Surgical resection immediately on diagnosis","Partial debulking to help prevent dysfunction"],"k":"A","x":"","n":32},{"bn":83,"s":"Facial schwannomas are seen in patients with which of the following?","o":["Neurofibromatosis type 1","Neurofibromatosis type 2","Schwannomatosis","All of the above"],"k":"D","x":"","n":33},{"bn":84,"s":"Patients with a complete transection of the facial nerve can achieve eye closure by:","o":["Contralateral innervation of the facial nerve","Relaxing the superior levator palpebrae muscle","Motor innervation by CN V","None of the above"],"k":"B","x":"","n":34},{"bn":85,"s":"The paralytic effect of injectable lidocaine wears off:","o":["15 minutes after injection","90 minutes after injection","2 to 3 hours after injection","5 to 6 hours after injection"],"k":"C","x":"","n":35},{"bn":86,"s":"The rationale for prompt exploration of iatrogenic facial nerve injury lies in:","o":["Preventing the accumulation of granulation tissue at the site of nerve injury, which would make later repair more difficult","Evacuation of a possible expanding hematoma within the nerve sheath","Grafting or direct repair if complete transection is found","All of the above"],"k":"D","x":"","n":36},{"bn":87,"s":"Anatomic preservation of the facial nerve in acoustic neuroma surgery:","o":["Translates to intact facial nerve function postoperatively","Results in immediate postoperative paresis in more than 50% of cases","Results in immediate postoperative paralysis in up to 13.5% of cases","b and c"],"k":"D","x":"","n":37},{"bn":88,"s":"Facial nerve injury during middle fossa surgery:","o":["May occur with elevation of the dura over a dehiscent geniculate ganglion","May be avoided by elevating dura off the middle fossa floor in anterior to posterior fashion","Is reduced by making skin cuts and staying in the fascial plane between the subdermal fat and temporalis muscle at the level of the superficial muscular aponeurotic system","May occur only when drilling directly over the IAC"],"k":"A","x":"","n":38},{"bn":89,"s":"In congenital atresia surgery, the facial nerve most commonly lies:","o":["Inferiorly and anteriorly to the atretic bone","Inferiorly and posteriorly to the atretic bone","Superiorly and anteriorly to the atretic bone","Superiorly and posteriorly to the atretic bone"],"k":"B","x":"","n":39},{"bn":90,"s":"The most common site for dehiscence of the facial canal is:","o":["Vertical segment","Horizontal segment","Labyrinthine segment","Meatal foramen"],"k":"B","x":"","n":40},{"bn":91,"s":"Primary temporal bone carcinoma is predominantly:","o":["Squamous cell carcinoma","Adenoid cystic carcinoma","Basal cell carcinoma","Melanoma"],"k":"A","x":"","n":41},{"bn":92,"s":"According to the revised Pittsburgh staging system for primary temporal bone squamous cell cancer (SCCA), facial nerve involvement confers:","o":["Stage 2","Stage 3","Stage 4","The facial nerve is not taken into account for staging criteria."],"k":"C","x":"","n":42},{"bn":93,"s":"Facial paralysis with ear canal edema and underlying deep facial pain in an elderly diabetic patient is due to:","o":["Pseudomonas aeruginosa infection","Basal cell cancer of the ear canal","A parotid malignancy","SCCA of the ear canal"],"k":"A","x":"","n":43},{"bn":94,"s":"Metastasis to the temporal bone:","o":["Originates in the prostate","Occurs by hematogenous spread to the marrow of the petrous apex","Occurs by extension up the eustachian tube","Is seen mostly in the pediatric population"],"k":"B","x":"","n":44},{"bn":95,"s":"Facial paralysis can be the result of collagen vascular diseases, which include all of the following EXCEPT:","o":["Scleroderma","Periarteritis nodosa","Sarcoidosis","Systemic lupus erythematosus"],"k":"C","x":"","n":45},{"bn":96,"s":"Iridocyclitis, parotid enlargement, and facial palsy are seen in which of the following?","o":["Heerfordt syndrome","Leprosy","Poliomyelitis","Wegener granulomatosis"],"k":"A","x":"","n":46},{"bn":97,"s":"The procedure of choice to restore facial function after discontinuity of the facial nerve is:","o":["Cable graft with sural nerve","Cable graft with great auricular nerve","Primary anastomosis","Hypoglossal-facial anastomosis"],"k":"C","x":"","n":47},{"bn":98,"s":"Gunshot wounds to the temporal bone are most likely to injure the:","o":["Tympanic segment","Mastoid segment","Labyrinthine segment","Main trunk distal for the stylomastoid foramen"],"k":"B","x":"","n":48},{"bn":99,"s":"A regenerating nerve will have which of the following characteristics on EMG?","o":["Fibrillation potentials","Absent volitional compound muscle action potentials (CMAPs)","Denervation potentials","Polyphasic potentials"],"k":"D","x":"","n":49},{"bn":100,"s":"Facial reanimation for patients who are not candidates for primary repair includes:","o":["Cross facial nerve graft","Hypoglossal-facial jump graft","Free muscle transfer","All of the above"],"k":"D","x":"","n":50}]},{"t":"Ch 9 · Hearing Aids","q":[{"bn":51,"s":"Physical components of a hearing aid must include which of the following?","o":["A noise damper","A receiver","A compressor","An earmold"],"k":"B","x":"","n":1},{"bn":52,"s":"Which of the following is the greatest advantage of an open-fit hearing aid for an appropriate hearing aid candidate relative to other amplification styles?","o":["It is easier to remove.","It is more durable.","The thicker tubing requires less maintenance.","It allows low-frequency sound to pass through naturally."],"k":"D","x":"","n":2},{"bn":53,"s":"Limiting acoustic feedback may be accomplished by all of the following EXCEPT:","o":["Tightly occluding the ear canal with a well fit hearing aid or earmold","Increasing the distance between the microphone and the loudspeaker","Applying digital feedback reduction controls in the device software","Increasing vent size of the hearing aid or earmold"],"k":"D","x":"","n":3},{"bn":54,"s":"Most modern hearing aids are programmed to each individual patient via which of the following?","o":["Use of a hearing aid analyzer to adjust the maximum output","Manual adjustment of the frequency response of the microphone","Controls in software specific to the manufacturer of each hearing aid","Electroacoustic verification of the device"],"k":"C","x":"","n":4},{"bn":55,"s":"In situ hearing aid verification measurements are generally performed using which of the following?","o":["A sound level meter","A 2-cc coupler","A probe microphone","Insert earphones"],"k":"C","x":"","n":5},{"bn":56,"s":"Which of the following statements is true about specific prescriptive measurements developed for pediatric populations?","o":["They are available only in specific pediatric hearing instruments.","They are designed to incorporate the resonance characteristics of the child’s ear.","They are designed for patient comfort rather than audibility.","They can be used only until a child reaches age 9."],"k":"B","x":"","n":6},{"bn":57,"s":"Frequency transposition technology may be of greatest benefit to individuals with which of the following?","o":["Cochlear dead regions","A rising audiogram","Hyperacusis","Mixed hearing loss"],"k":"A","x":"","n":7},{"bn":58,"s":"All of the following statements are true EXCEPT:","o":["Hearing aids are predominantly fit on ears with sensorineural or mixed hearing loss.","Hearing aid users tend to have hearing loss that is at least moderate in degree.","Most patients with mild to moderate hearing loss do not pursue hearing aid use.","Patients with minimal hearing loss cannot benefit from mild gain hearing aids."],"k":"D","x":"","n":8},{"bn":59,"s":"Which of the following statements is true regarding patients with anatomical abnormalities of the ear such as microtia or stenosis?","o":["They would most likely benefit from an ITE style hearing aid.","They will generally not have issues with device retention.","They may require use of a bone conducted hearing device.","They are generally able to use conventional amplification."],"k":"C","x":"","n":9},{"bn":60,"s":"Which of the following statements is true regarding patients with external ear canal concerns such as excessive moisture or otitis externa?","o":["They are unable to use amplification without resolution of their symptoms.","They would likely benefit from a traditional BTE rather than ITE or RIC.","They would likely benefit from an ITE rather than a RIC or traditional BTE.","They would likely benefit from a RIC rather than an ITE or traditional BTE."],"k":"B","x":"","n":10},{"bn":61,"s":"Which of the following statements regarding hearing aid style decisions is INCORRECT?","o":["They are made individually for each patient.","They are affected by the anatomy of the external auditory canal and pinna.","They are made without regard for durability of the devices.","They are limited by the patient’s visual status and dexterity."],"k":"C","x":"","n":11},{"bn":62,"s":"Which of the following statements is true of the telecoil of a hearing aid?","o":["It is a standard feature in every device.","It communicates via Bluetooth technology.","It is an ALD that creates a visual stimulus.","It interacts with external inputs electromagnetically."],"k":"D","x":"","n":12},{"bn":63,"s":"Patients with significant cognitive impairment may require consideration of which of the following?","o":["A CROS system","Unilateral fitting of a device","A personal sound amplifier","Written communication"],"k":"C","x":"","n":13},{"bn":65,"s":"The membrane of a microphone vibrates to capture all of the following EXCEPT:","o":["The amplitude of an acoustic signal","The frequency of an acoustic signal","The phase of an acoustic signal","The resistance of an acoustic signal"],"k":"D","x":"","n":14},{"bn":66,"s":"Alternative input transducers (such as telecoils or FM signals) reduce degradation of a signal by removing the effects of all of the following EXCEPT:","o":["Distance","Flat frequency response","Noise","Reverberation"],"k":"B","x":"","n":15},{"bn":67,"s":"Gain is adjusted to vary as a function of which of the following?","o":["Frequency depending on the user’s hearing loss","Phase depending on the user’s hearing loss","Resistance depending on the user’s hearing loss","Impedance depending on the user’s hearing loss"],"k":"A","x":"","n":16},{"bn":68,"s":"The input-output function of a hearing aid describes the relationship of which of the following?","o":["Input and output frequency","Input and output intensity","Input and output phase","Input and output resistance"],"k":"B","x":"","n":17},{"bn":69,"s":"Linear amplification is typically best applied to which of the following?","o":["Sensorineural hearing loss","Auditory processing disorder","Conductive hearing loss","Mixed hearing loss"],"k":"C","x":"","n":18},{"bn":70,"s":"Abnormal loudness growth (or recruitment) refers to the phenomenon in which:","o":["Individuals with conductive hearing loss hear high-intensity sounds normally","Individuals with conductive hearing loss hear high-intensity sounds normally only if amplified","Individuals with sensorineural hearing loss hear high-intensity sounds normally","Individuals with sensorineural hearing loss hear high-intensity sounds normally only if amplified"],"k":"C","x":"","n":19},{"bn":71,"s":"Which of the following statements is true of nonlinear amplification?","o":["Gain is applied uniformly to lowand high-intensity inputs.","The same amount of gain is added regardless of input intensity.","Gain is applied only to low-intensity inputs.","The amount of gain applied is dependent on the input signal intensity."],"k":"D","x":"","n":20},{"bn":72,"s":"Nonlinear amplification is designed to do all of the following EXCEPT:","o":["Make soft sounds audible","Maintain loudness of high-intensity sounds but not overamplify the signal","Address the altered loudness growth of an ear with sensorineural hearing loss","Address the increased dynamic range of an ear with sensorineural hearing loss"],"k":"D","x":"","n":21},{"bn":73,"s":"Which of the following statements regarding wide dynamic range compression circuitry is INCORRECT?","o":["It allows the entire frequency bandwidth of an input acoustic signal to be processed by a hearing aid.","It limits the maximum output of a hearing aid.","It provides nonlinear amplification across a wide range of acoustic inputs.","It diminishes gain near the maximum output level."],"k":"A","x":"","n":22},{"bn":74,"s":"Hearing aids may adversely affect a patient’s ability to hear in background noise largely because:","o":["The normal spatial cues provided by the resonance of the pinna and ear canal are altered when a hearing aid is placed in the ear canal.","Sound delivered by a hearing aid has poor lowfrequency sound fidelity.","Expansion maximizes gain for very low-intensity inputs.","Noise is louder than amplified speech sounds, effectively masking the listener’s target signal."],"k":"A","x":"","n":23},{"bn":75,"s":"Which of the following statements is true of BTE hearing aids?","o":["They have the shortest distance between the microphone and ear canal.","They offer limited flexibility in terms of fitting range.","They are not compatible with telecoils.","They house the receiver in the ear canal or in the case behind the ear."],"k":"D","x":"","n":24},{"bn":76,"s":"Open-fit hearing aids are most appropriate for individuals with which of the following?","o":["Low-frequency hearing loss","High-frequency hearing loss","Severe hearing loss","Profound hearing loss"],"k":"B","x":"","n":25},{"bn":77,"s":"Microphone directionality is generally available in all of the following EXCEPT:","o":["BTE hearing aids","Completely-in-the-canal (CIC) hearing aids","Full-shell hearing aids","RIC hearing aids"],"k":"B","x":"","n":26},{"bn":78,"s":"Which of the following statements is true of occlusion of the ear canal?","o":["It results in a sensation of increased volume of the patient’s own voice.","It results in a sensation of decreased volume of the patient’s own voice.","It reduces the echo quality of external sounds.","It reduces the echo quality of the patient’s own voice."],"k":"A","x":"","n":27},{"bn":79,"s":"Which of the following statements is true of venting of hearing aids or earmolds?","o":["It is important for patients with profound hearing loss.","It increases the occlusion effect.","It allows aeration of the external auditory canal.","It decreases potential for acoustic feedback."],"k":"C","x":"","n":28},{"bn":80,"s":"The auricle and concha of the ear increase highfrequency sound by collecting and resonating sound:","o":["Below 500 Hz","500 to 1000 Hz","1000 to 2000 Hz","Above 2000 Hz"],"k":"D","x":"","n":29},{"bn":81,"s":"Which of the following hearing aid styles is least likely to be affected by excessive cerumen or perspiration?","o":["CIC","RIC","Full-shell","Traditional BTE"],"k":"D","x":"","n":30},{"bn":82,"s":"An FM system consists of all the following EXCEPT:","o":["A microphone/transmitter","An amplifier","A receiver","A probe"],"k":"D","x":"","n":31},{"bn":83,"s":"The hearing aid process generally begins with which of the following?","o":["Selection","Verification","Quality control","Programming"],"k":"A","x":"","n":32},{"bn":84,"s":"Which of the following statements is true of target gain?","o":["It is based only on audiometric measures.","It varies depending on the prescriptive measure selected.","It is greater for patients who are using amplification for the first time.","It is not dependent on patient age."],"k":"B","x":"","n":33},{"bn":85,"s":"Which of the following statements is true of unilateral amplification when a patient has relatively symmetric hearing loss and is a bilateral candidate?","o":["It may improve long-term speech perception of the aided ear.","It may improve long-term speech perception of the unaided ear.","It may degrade long-term speech perception of the aided ear.","It may degrade long-term speech perception of the unaided ear."],"k":"D","x":"","n":34},{"bn":86,"s":"CROS or BiCROS systems are most appropriate for patients with which of the following?","o":["Symmetric hearing loss","Significantly poorer hearing loss in one ear that will not benefit from amplification","Symmetric word recognition scores","Poor word recognition scores bilaterally"],"k":"B","x":"","n":35},{"bn":87,"s":"Earmold impressions are typically not contraindicated by which of the following?","o":["External otitis","Inflammation","Otomycosis","Presence of a mastoid cavity"],"k":"D","x":"","n":36},{"bn":88,"s":"Electroacoustic analysis of a hearing aid measures all of the following EXCEPT:","o":["Frequency response","Distortion","Circuit noise","Real ear resonance"],"k":"D","x":"","n":37},{"bn":89,"s":"Which of the following is verified by probe microphone measurements?","o":["Battery drain","Distortion","Circuit noise","Real ear response"],"k":"D","x":"","n":38},{"bn":90,"s":"Objective verification of hearing aids includes which of the following?","o":["Loudness judgment ratings","The Hearing Handicap Inventory for the Elderly","Speech mapping","Informal quality judgments from the patient"],"k":"C","x":"","n":39},{"bn":91,"s":"Subjective verification of hearing aid measures include all of the following EXCEPT:","o":["Assessment of real ear aided gain","Loudness rating","The Client-Oriented Scale of Improvement","Speech-perception judgments"],"k":"A","x":"","n":40},{"bn":92,"s":"Which of the following is the ultimate priority of pediatric hearing aid fittings?","o":["Sound comfort","Flexibility for continually changing listening needs, including manual controls","Sound audibility","Subjective measurements for verification due to limited patient feedback"],"k":"C","x":"","n":41},{"bn":93,"s":"Pediatric patients are generally fit with which of the following?","o":["Open-fit hearing aids","BTE hearing aids","ITE hearing aids","CIC hearing aids"],"k":"B","x":"","n":42},{"bn":94,"s":"Compared with an adult ear, resonance characteristics of a pediatric ear:","o":["Generally result in a lower SPL delivered to the ear","Are relatively stable over time","Create the need for regular programming adjustments","Can be disregarded until the child reaches 5 years of age"],"k":"C","x":"","n":43},{"bn":95,"s":"Which of the following statements is true of geriatric patients?","o":["They may have additional auditory processing changes that reduce their ability to understand speech.","They maintain ability to hear spatially as they age.","They are unlikely to benefit from amplification.","They will likely need less digital processing in hearing aids due to decreased listening environment complexity."],"k":"A","x":"","n":44},{"bn":96,"s":"Which of the following statements is true of patients with tinnitus?","o":["They generally do not benefit from amplification.","They can use an ear-level masker to help alleviate tinnitus.","They are a homogeneous population with obvious treatment options.","They should pursue hearing aids only if their hearing loss is at least moderate in degree."],"k":"B","x":"","n":45},{"bn":97,"s":"Which of the following is a common ALD used in school settings for children with hearing loss?","o":["AM system","FM system","Visual alerter","Telephone amplifier"],"k":"B","x":"","n":46},{"bn":98,"s":"Which of the following statements is true of functional gain measurements?","o":["They compare aided and unaided performance.","They can be performed only with speech stimuli.","They require use of a probe microphone.","They are not behavioral measurements."],"k":"A","x":"","n":47},{"bn":99,"s":"Which of the following statements is true of hearing aid candidacy?","o":["It is the same for all patients.","It is based solely on degree of hearing loss.","It is based on communication challenges associated with hearing loss.","It is unrelated to patient motivation."],"k":"C","x":"","n":48},{"bn":100,"s":"Which of the following is the most critical aspect of hearing aid orientation?","o":["Hearing aid storage","Battery use","Maintenance","Realistic expectations"],"k":"D","x":"","n":49}]},{"t":"Ch 10 · Vestibular Function and Disease","q":[{"bn":51,"s":"Which of the following statements is true of vertigo?","o":["It is a hallucination of movement.","It can be rotator.","It can be described as swaying.","All of the above are true."],"k":"D","x":"","n":1},{"bn":52,"s":"The crisis of Tumarkin occurs in which of the following?","o":["Recurrent vestibulopathy","Meniere disease","BPV","Vestibular schwannoma"],"k":"B","x":"","n":2},{"bn":54,"s":"Which of the following statements is true of central nystagmus?","o":["It has slow and fast components.","It is not suppressed by gaze fixation.","Failure of vestibuloocular suppression is a peripheral vestibular sign.","b and c"],"k":"B","x":"Central nystagmus is typically not suppressed by visual fixation; failure of fixation suppression is a central (not peripheral) sign, so statement C is false. Peripheral vestibular nystagmus is suppressed by fixation. (Cummings; Scott-Brown, Vestibular Assessment.)","f":"Key corrected — book key: C; updated answer: B.","n":3},{"bn":55,"s":"Which of the following statements is true?","o":["A change in a patient’s position causing vertigo is due to BPV.","A change in a patient’s position resulting in lightheadedness on upright positioning indicates a vestibular disorder.","A change in a patient’s position causing vertigo is nonspecific and cannot be attributed to positional vertigo alone.","All of the above are true."],"k":"C","x":"","n":4},{"bn":56,"s":"In Dix-Hallpike testing, which of the following statements is true?","o":["The rotatory nystagmus is best turned clockwise or anticlockwise based on the patient’s point of view.","The rotatory nystagmus is best turned clockwise or anticlockwise based on the examiner’s point of view.","Geotropic nystagmus is rotation of the patient’s eyes away from the floor.","Ageotropic nystagmus is rotation of the patent’s eyes away from the floor."],"k":"D","x":"","n":5},{"bn":57,"s":"Which of the following statements is true regarding nystagmus classical of BPV?","o":["It is not fatigable.","It is ageotropic.","It has a latent period.","a and c"],"k":"C","x":"","n":6},{"bn":58,"s":"Which of the following statements is true regarding caloric testing?","o":["It is accomplished using water 7° C cooler and 7° C warmer than core body temperature.","The patient is positioned 30 degrees from supine to allow the posterior semicircular canal to be in a vertical plane.","With a patient’s head 45 degrees from supine, ampullifugal endolymphatic flow in the lateral semicircular canal is established.","a and b"],"k":"A","x":"","n":7},{"bn":59,"s":"Which of the following statements is true regarding a pathological result in caloric testing?","o":["It occurs when water at 44° C is irrigated in both ears at once.","It relies on the difference between response from right and left inner ear hair cells.","It occurs only when there is a difference in canal paresis of over 15%.","It refers to pathology elicited by rapid head movement."],"k":"B","x":"","n":8},{"bn":60,"s":"Which of the following statements is true regarding irritative vestibular pathology?","o":["It includes pathology caused by cholesteatoma.","It causes nystagmus toward the diseased ear.","It causes nystagmus away from the diseased ear.","a and c"],"k":"B","x":"","n":9},{"bn":61,"s":"Which of the following statements is true regarding ENG?","o":["It is used in conjunction with caloric testing to measure vestibulospinal reflexes.","The electronic recording of nystagmus by ENG relates to the vestibuloocular reflex.","It measures the velocity of the fast phase of nystagmus.","b and c"],"k":"B","x":"","n":10},{"bn":62,"s":"Which of the following statements is true regarding the fistula test?","o":["Medial tragal pressure causes nystagmus toward the pathologically affected ear.","Negative pressure causes nystagmus contralateral to the affected ear.","Both of the above are true.","None of the above is true."],"k":"A","x":"","n":11},{"bn":63,"s":"Which of the following statements is true regarding dynamic posturography?","o":["It can be useful in nonorganic vestibular loss.","It can identify defects in proprioceptive, ocular, and vestibular inputs separately.","It tests patients with eyes open and closed while standing on a soft platform only.","a and c"],"k":"A","x":"","n":12},{"bn":64,"s":"Which of the following statements is true regarding acoustic neuroma?","o":["Vertigo is a prominent feature as the tumor arises off the vestibular nerve.","Loss of speech discrimination with regard to hearing loss is the principal manifestation.","It accounts for 50% of all lesions at the cerebellopontine angle.","b and c"],"k":"B","x":"","n":13},{"bn":65,"s":"Which of the following statements is true regarding Meniere disease?","o":["Bilateral ears may be affected in up to 90% of cases in which disease has been present for 20 years or more.","Labyrinthectomy for Meniere disease has decreased in frequency due to the risk of bilateral involvement of the disease.","The presence of drop attacks increases the risk of bilateral ear involvement.","a and c"],"k":"B","x":"","n":14},{"bn":66,"s":"Which of the following statements is true regarding objective tests for Meniere disease?","o":["Audiograms classically feature low-frequency sensorineural hearing loss.","ENG findings are constantly abnormal between each episodic attack.","Abnormal SP : AP ratios are shown on electrocochleography, which is the gold standard for diagnosis.","All of the above are true."],"k":"A","x":"","n":15},{"bn":67,"s":"Which of the following statements is true regarding BPV?","o":["Posterior semicircular canal occlusion is a recognized management option.","It is most commonly caused by canaliths within the ampullated end of the posterior semicircular canals.","It may be caused by occlusion of the anterior vestibular artery.","a and c"],"k":"D","x":"","n":16},{"bn":68,"s":"The following are recognized interventional management options for Meniere disease EXCEPT:","o":["Labyrinthectomy","Glycerol application","Transtympanic dexamethasone injection","Silverstein MicroWick aminoglycoside application"],"k":"B","x":"","n":17},{"bn":69,"s":"Which of the following statements is true regarding oscillopsia?","o":["It is the inability to maintain a stable horizon on walking.","It is a feature of Meniere disease.","It is due to otolithic dysfunction as opposed to semicircular canal pathology.","a and c"],"k":"C","x":"","n":18},{"bn":70,"s":"Which of the following statements is true regarding Meniere disease?","o":["By definition, it cannot be diagnosed without the aural fullness component.","Remission occurs in 90% of patients if symptoms are of late onset.","Fluctuation in symptoms is thought to be secondary to rupture of the Reissner membrane of the inner ear.","a and b"],"k":"C","x":"","n":19},{"bn":71,"s":"Which of the following statements is true regarding posttraumatic vertigo?","o":["It may cause Meniere syndrome as a result.","The most common cause of posttraumatic head injury vertigo is benign BPV.","It is more readily remedial to medical therapy.","a and b"],"k":"D","x":"","n":20},{"bn":72,"s":"Which of the following statements is true regarding a positive fistula test?","o":["It is always indicative of a semicircular canal fistula.","It is due to stiffening of the stapes footplate.","It is diagnostic for superior semicircular canal dehiscence.","None of the above is true."],"k":"D","x":"","n":21},{"bn":73,"s":"Which of the following statements is true regarding posttraumatic vertigo?","o":["In conjunction with hearing loss it suggests a transverse temporal bone fracture rather than a longitudinal fracture.","It is common in patients in whom a middle ear hematoma is evident.","It is more common in temporal bone fractures longitudinal to the petrous apex.","None of the above is true."],"k":"A","x":"","n":22},{"bn":74,"s":"Which of the following statements is true regarding vestibular rehabilitation?","o":["It is not indicated when the patient is not symptomatic of his/her vertigo spell.","It will likely not benefit a patient with migraineassociated vertigo.","It is beneficial in patients with unilateral BPV or unilateral vestibular hypofunction.","b and c"],"k":"D","x":"","n":23},{"bn":75,"s":"Which of the following statements is true regarding vestibular neuronitis?","o":["It is viral in origin; therefore, antivirals are a mainstay of primary treatment.","It causes debilitating vertigo that commonly lasts up to a week.","Spontaneous nystagmus is observed toward the side of the affected ear.","a and b"],"k":"B","x":"","n":24},{"bn":76,"s":"Which of the following statements is true regarding superior semicircular canal dehiscence?","o":["It is associated with autophony in the affected side.","Measurement of ocular vestibular myogenic potential is the gold standard objective investigation for this condition.","It is related to temporal bone trauma in the majority of cases.","a and c"],"k":"A","x":"","n":25},{"bn":77,"s":"Which of the following statements regarding vestibular neuronitis is true?","o":["It classically affects one ear only.","Episodes typically wax and wane, lasting minutes to hours.","Complete resolution of symptoms is expected within 1 week.","It occurs most commonly in the elderly."],"k":"A","x":"","n":26},{"bn":78,"s":"Downbeating nystagmus occurs in which of the following?","o":["Arnold-Chiari malformation","Psychotropic medication use","Syringomyelia and syringobulbia","All of the above"],"k":"D","x":"","n":27},{"bn":79,"s":"All of the following are communications between the inner ear and the temporal bone EXCEPT:","o":["Ductus reuniens","Internal auditory canal","Cochlear aqueduct","Vestibular aqueduct"],"k":"A","x":"","n":28},{"bn":80,"s":"Which of the following statements is true regarding Wallenberg syndrome?","o":["It is suspected in a patient with vertigo, dysphagia, and vocal cord paralysis.","It is secondary to disruption of the medial longitudinal fasciculus.","It is also known as the lateral medullary syndrome.","a and c"],"k":"D","x":"","n":29},{"bn":81,"s":"Which of the following statements is true regarding mal de debarquement syndrome?","o":["It is characterized by sway vertigo and imbalance due to endolymphatic hydrops similar to Meniere disease.","Symptoms abate when the patient is in motion, such as in a car or train.","It has an excellent prognosis with interventional vestibular rehabilitation.","b and c"],"k":"B","x":"","n":30},{"bn":82,"s":"Which of the following statements is true regarding endolymph?","o":["It has high Na + and low K + content.","It is resorbed in the endolymphatic sac.","It is present in the scala tympani and scala media.","None of the above is true."],"k":"B","x":"","n":31},{"bn":83,"s":"Which of the following statements is true regarding nonorganic vertigo?","o":["It is intensified by head movement.","It is associated with ataxia.","Symptoms are accurately reproduced by hyperventilation.","a and c"],"k":"C","x":"","n":32},{"bn":84,"s":"Which of the following statements is true regarding smooth pursuit assessment?","o":["It assesses the vestibulocerebellar tract.","It is most likely to be affected by central nervous system pathology.","It tests oculomotor function in addition to gaze stability and saccadic eye movement.","b and c"],"k":"D","x":"","n":33},{"bn":86,"s":"Which of the following statements is true regarding the Halmagyi head thrust maneuver?","o":["It works on the premise that there is perfect compensatory conjugate eye movement to the contralateral side with respect to head movement.","It assesses smooth pursuit function.","It assesses refixation eye movements, termed vergence movements .","b and c"],"k":"A","x":"","n":34},{"bn":87,"s":"Which of the following statements is true regarding the oscillopsia test?","o":["It is a test for unilateral vestibular loss.","It is abnormal with a loss of two lines or more on reading a Snellen chart during repetitive head movement of 2 Hz.","It is used to assess bilateral vestibular loss due to ototoxicity.","It is a test of the vertical vestibuloocular reflex."],"k":"C","x":"","n":35},{"bn":88,"s":"Which of the following statements is true regarding aminoglycoside therapy for intractable Meniere disease?","o":["Kanamycin and gentamicin are the most vestibulotoxic of the aminoglycoside group.","Treatment protocols are divided into fixed-dose protocols and titration protocols.","Efficacy is based on the accumulation of aminoglycoside within the hair cell.","b and c"],"k":"D","x":"","n":36},{"bn":89,"s":"Which of the following statements is true regarding bilateral vestibular loss?","o":["It results in oscillopsia.","It results in rotatory vertigo due to imbalance of afferent vestibular information.","It results in loss of posture and coordination despite normal visual and proprioceptive feedback.","a and b"],"k":"A","x":"","n":37},{"bn":90,"s":"Which of the following statements is true regarding Frenzel goggles?","o":["They allow the patient to focus on visual fixation.","They remove the patient’s ability to visually fixate.","They are used primarily as a magnification tool to identify nystagmus.","All of the above are true."],"k":"B","x":"","n":38},{"bn":91,"s":"Which of the following statements is true regarding migraine-associated vertigo?","o":["Sumatriptan is not effective for vertigo spells.","Prophylaxis includes antidepressants such as amitriptyline.","Vertigo may occur as part of an aura, as part of the headache phase, or between headaches.","All of the above are true."],"k":"D","x":"","n":39},{"bn":92,"s":"Which of the following statements is true for betahistine use in Meniere disease?","o":["Betahistine is postulated to work via vasodilatory effects on blood supply to the inner ear.","Betahistine is prescribed to decrease frequency and severity of vertiginous episodes.","Betahistine is effective in arresting hearing loss.","Betahistine is a H1-receptor agonist."],"k":"C","x":"","n":40},{"bn":93,"s":"Which of the following statements is true regarding vestibular neuronitis?","o":["It is most commonly bilateral.","It classically causes severe vertigo that lasts a week.","Hearing loss is often a feature.","a and c"],"k":"B","x":"","n":41},{"bn":94,"s":"Which of the following statements is true regarding mal de debarquement syndrome?","o":["Patients feel better getting off a moving vehicle.","Objective caloric tests often show unilateral canal paresis.","It can be treated effectively by vestibular rehabilitation.","None of the above is true."],"k":"D","x":"","n":42},{"bn":95,"s":"Which of the following statements is true regarding the doll’s eye test?","o":["It is synonymous with the Halmagyi head thrust test.","Catch-up saccades on turning the head swiftly to the left suggest right-sided vestibular hypofunction.","It cannot be used in assessment of a comatose patient.","a and c"],"k":"A","x":"","n":43},{"bn":96,"s":"The following objective tests of balance all serve to localize disease precisely to the central or peripheral vestibular system EXCEPT:","o":["Cervical vestibular myogenic potential","Dynamic posturography","ENG","b and c"],"k":"B","x":"","n":44},{"bn":98,"s":"In attempting to diagnose the specific cause of peripheral vertigo, which answer is most useful to elicit from the patient?","o":["Aural fullness","Duration of vertigo spell","Sway or rotatory vertigo","Associated tinnitus"],"k":"B","x":"","n":45},{"bn":99,"s":"Which of the following statements is true regarding Cogan syndrome?","o":["It is associated with interstitial keratitis and audiovestibular dysfunction.","It typically causes unilateral audiovestibular symptoms.","Anti–tumor necrosis factor therapy is first-line.","It is a variant of Meniere disease."],"k":"A","x":"","n":46},{"bn":100,"s":"Which of the following statements is true regarding central vestibular disorders?","o":["They are associated with a negative Romberg test.","They are associated with fatigable nystagmus.","They are associated with gaze-evoked nystagmus.","a and b"],"k":"C","x":"","n":47}]},{"t":"Ch 11 · Neurotologic Skull Base Surgery","q":[{"bn":51,"s":"Which of the following structures passes through Dorello canal?","o":["Greater superficial petrosal nerve","Subarcuate artery","Vestibular aqueduct","Abducent nerve","AICA"],"k":"D","x":"","n":1},{"bn":52,"s":"Which of the following is the principal surgical landmark for middle cranial fossa procedures?","o":["Greater superficial petrosal nerve","Arcuate eminence","Foramen lacerum","Foramen spinosum","Gasserian ganglion"],"k":"A","x":"","n":2},{"bn":53,"s":"Which of the following foramina are found on the floor of the middle cranial fossa? i. Foramen spinosum\nii. Foramen magnum\niii. Superior orbital fissure iv. Foramen ovale\nv. Foramen rotundum","o":["i, iv, and v","i, iii, iv, and v","iv and v","iii, iv, and v","All of the above"],"k":"B","x":"","n":3},{"bn":55,"s":"Which of the following statements is INCORRECT?","o":["Meningiomas are the most common radiationinduced neoplasm of the central nervous system.","Meningiomas have a malignant potential.","Meningiomas rarely occur in children.","Head trauma is an unequivocal risk factor for meningiomas."],"k":"D","x":"","n":4},{"bn":56,"s":"Regarding meningiomas, which of the following statements is correct?","o":["Ninety percent of meningiomas occur in association with NF2.","In asymptomatic patients < 60 years, treatment options for a meningioma include a period of watchful waiting.","All patients with meningiomas should have a full-body MRI.","All patients with meningioma should have a 24-hour urine collection for vanillylmandelic acid, catecholamines, and metanephrines."],"k":"B","x":"","n":5},{"bn":57,"s":"The retrosigmoid approach to the skull base:","o":["Is contraindicated in the presence of a contralateral hearing loss","Has a lower postoperative risk of CSF fistula than a middle cranial fossa approach","Is not suitable for cerebellopontine angle tumors extending to the fundus of the internal auditory meatus","Avoids cerebellar retraction"],"k":"C","x":"","n":6},{"bn":58,"s":"Which of the following anatomical structures pass through the jugular foramen?\ni. Inferior petrosal sinus\nii. Superior petrosal sinus\niii. Meningeal branch of ascending pharyngeal artery\niv. Cranial nerve (CN) IX\nv. CN XII","o":["i, iii, and iv","i, ii, iii, and iv","i and iv","iii and iv","All of the above"],"k":"A","x":"","n":7},{"bn":59,"s":"Regarding the infratemporal fossa, which of the following statements are true?\ni. It is bounded inferiorly by the digastric muscle.\nii. It communicates with the orbit through the superior orbital fissure.\niii. It contains the maxillary division of the trigeminal nerve (V ).2\niv. It communicates with the middle cranial fossa through foramen spinosum.\nv. The lateral and medial pterygoid muscles lie within the infratemporal fossa.","o":["i, ii, iii, and iv","i, ii, iii, and v","ii, iii, and iv","i, iv, and v","All of the above"],"k":"D","x":"","n":8},{"bn":60,"s":"Regarding the contents of the IAM, which of the following statements is correct?","o":["The facial nerve is located anteroinferiorly in the IAM.","The superior vestibular nerve is located posterosuperiorly in the internal auditory canal.","The cochlear nerve is located anterosuperiorly in the internal auditory canal.","The cochlear nerve is located posterosuperiorly in the internal auditory canal.","None of the above is correct."],"k":"B","x":"","n":9},{"bn":61,"s":"Inadvertent opening of a dural sinus during surgery may lead to an air embolus. Signs of an air embolus include which of the following?","o":["Hypotension, tachycardia, and decreased endtidal P CO2","Hypertension, tachycardia, and decreased end-tidal P CO2","Intravascular crepitation, hypertension, and decreased end-tidal P CO2","None of the above"],"k":"A","x":"","n":10},{"bn":62,"s":"Regarding the dural sinuses in skull base surgery, which of the following statements are correct?\ni. Small dural tears can usually be controlled with bipolar diathermy and/or oxidized cellulose gauze. ii. Inadvertent opening of the sigmoid sinus intraoperatively mandates identification and ligation of the internal jugular vein in the neck. iii. Air embolism is far more likely to be of clinical significance when the patient is operated on in the sitting position. iv. Rotating the operating table to a “reverse Trendelenburg” position and application of digital pressure may help prevent a complication from an air embolus.","o":["i, ii, and iii","i and iii","ii and iii","iii and iv","All of the above","None of the above"],"k":"B","x":"","n":11},{"bn":63,"s":"Regarding surgery of the CPA, which of the following statements is correct?","o":["Disruption of the AICA causes Wallenberg syndrome, characterized by vocal cord paralysis, ataxia, dysarthria, and ipsilateral Horner syndrome.","Disruption of the posterior inferior cerebellar artery causes a lateral medullary infarction, characterized by vocal cord paralysis, ataxia, dysarthria, and contralateral Horner syndrome.","The superior cerebellar artery gives a branch that travels in the IAM.","The AICA is a branch of the internal carotid artery.","Division of the petrosal vein (Dandy’s vein) rarely has adverse neurological consequences."],"k":"E","x":"","n":12},{"bn":64,"s":"Which answer best describes the MRI features of a vestibular schwannoma?","o":["Hyperintense on T1 imaging","Decreased intensity with fat suppression","Enhancement with gadolinium administration","Isointense to CSF"],"k":"C","x":"","n":13},{"bn":65,"s":"Which of the following tumors is LEAST likely to involve the jugular foramen?","o":["Paraganglioma","Schwannoma","Meningioma","Chondrosarcoma","Craniopharyngioma"],"k":"E","x":"","n":14},{"bn":67,"s":"Regarding the infratemporal fossa approach type A as described by Fisch, which of the following statements is correct?","o":["It is used for removal of tumors involving the petrous apex and clivus.","It is contraindicated in tumors with intracranial extension.","It provides access to the jugular foramen.","Typically there is grade I House-Brackmann facial nerve function postoperatively."],"k":"C","x":"","n":15},{"bn":68,"s":"Regarding malignant otitis externa (MOE), which of the following statemenonts are correct? i. The causative organism is always Pseudomonas aeruginosa.\nii. The fissures of Santorini are implicated in spread of disease.\niii. Cranial nerves IX, X, and XI are the most commonly affected cranial nerves. iv. Facial nerve involvement is an independent prognostic indicator.\nv. There is no difference in predisposition between type I and II diabetes.","o":["ii and v","i and v","ii, iv, and v","ii and iv","All of the above are correct."],"k":"A","x":"","n":16},{"bn":69,"s":"Regarding MOE, which of the following statements are correct?\ni. Granulation tissue along the osteocartilaginous junction is pathognomonic for MOE.\nii. A “picket fence” fever is a common sign in MOE.\niii. Gallium citrate Ga-67 scanning is more useful than CT scanning in determining efficacy of therapy.\niv. Facial nerve palsy is an indication for surgery.\nv. Ceftazidime is a third-generation cephalosporin that has demonstrated efficacy in the treatment of MOE.","o":["i, iii, and v","iii, iv, and v","i, ii, and iii","i, iii, iv, and v","ii, iii, iv, and v"],"k":"A","x":"","n":17},{"bn":70,"s":"Which of the following statements regarding temporal bone fractures involving the otic capsule is incorrect?","o":["They are generally associated with a sensorineural hearing loss (SNHL).","They account for 10% to 20% of temporal bone fractures.","Hemotympanum is the most common cause of hearing loss.","They are more likely to result in facial nerve palsy than otic capsule–sparing fractures."],"k":"C","x":"","n":18},{"bn":71,"s":"Regarding CSF fistula after temporal bone fracture, which of the following statements is INCORRECT?","o":["Diagnosis can be confirmed by evaluating the fluid for β 2-transferrin.","They can occur as a result of a dural tear after any type of temporal bone fracture.","Initial management includes bed rest and placement of a lumbar drain.","CSF leak can be delayed after the initial trauma in 30% of cases."],"k":"C","x":"","n":19},{"bn":72,"s":"Which of the following conditions most commonly causes pulsatile tinnitus?","o":["Glomus jugulare","Glomus tympanicum","Aberrant carotid artery","Benign intracranial hypertension"],"k":"D","x":"","n":20},{"bn":73,"s":"The Pittsburgh classification system for staging of temporal bone SCC was modified in 2002. Patients with facial nerve paralysis were staged as a T4 tumor. According to that classification system, which of the following tumors are classified as stage III? i. T1, N2, M0\nii. T1, N1, M0\niii. T2, N1, M0 iv. T3, N0, M0\nv. T4, N0, M0","o":["i, ii, ii, and iv","iv","ii and iv","iv and v"],"k":"C","x":"","n":21},{"bn":74,"s":"In which of the following features of an acoustic neuroma would a middle cranial fossa approach be considered inappropriate?","o":["Only hearing ear","Existing mastoid cavity","3-cm CPA tumor","Age > 60 years","Unilateral peripheral vertigo"],"k":"C","x":"","n":22},{"bn":75,"s":"Anesthetic techniques to reduce brain edema during a middle cranial fossa approach include all EXCEPT:","o":["Elevated head position","Mannitol","Furosemide","Hyperventilation to a P CO of 25 to 30 mmHg2","Sevoflurane"],"k":"E","x":"","n":23},{"bn":76,"s":"Which of the following statements regarding neurofibromatosis is correct?","o":["Vestibular schwannomas are more commonly seen in neurofibromatosis type 1 (NF1).","Bilateral vestibular schwannoma is diagnostic of NF1.","All children of NF2 patients have a 50% chance of developing the disease.","Hearing loss in NF2 can generally be rehabilitated with cochlear implantation.","Twenty percent of cases of NF2 result from new mutations."],"k":"C","x":"","n":24},{"bn":77,"s":"Which of the following are NOT features of NF2?","o":["Vestibular schwannomas","Posterior subcapsular lenticular opacities","Meningioma","Lisch nodules","Cataract"],"k":"D","x":"","n":25},{"bn":79,"s":"Which of the following statements regarding lesions of the petrous apex is INCORRECT?","o":["Cholesterol granuloma is the most common petrous apex lesion.","Cholesterol granuloma can usually be differentiated from cholesteatoma on CT scanning.","Petrous apicitis associated with a CN IV palsy and facial pain is known as Gradenigo syndrome.","Cholesterol granulomas demonstrate a hyperintense signal on T1 MRI.","Clival chordomas may extend laterally to involve the petrous apex."],"k":"B","x":"","n":26},{"bn":80,"s":"Which of the following statements regarding lesions of the CPA is correct?","o":["An enhancement of a dural tail after administration of gadolinium contrast is a characteristic MRI sign found in acoustic neuroma.","Extension of a tumor into the internal auditory canal excludes the diagnosis of meningioma.","Epidermoid cysts avidly enhance following administration of gadolinium contrast on MRI.","Hitzelberger sign in acoustic neuroma is due to pressure on the sensory fibers carried in the nervus intermedius."],"k":"D","x":"","n":27},{"bn":81,"s":"Regarding chondrosarcoma, which of the following statements is INCORRECT?","o":["Chondrosarcomas in the skull base are most commonly seen in the midline.","Chondrosarcomas have radiologic features similar to chordomas.","Chondrosarcomas are low-grade tumors that rarely require surgical intervention.","On CT scanning, chondrosarcomas demonstrate matrix calcification and endosteal scalloping."],"k":"C","x":"","n":28},{"bn":82,"s":"Regarding chondrosarcoma, which of the following statements is INCORRECT?","o":["Chondrosarcomas of the skull base may be associated with Maffucci syndrome.","They account for 30% of intracranial neoplasms.","They are most commonly located at the petrooccipital synchondrosis.","Chondrosarcomas have a significantly better prognosis than chordomas."],"k":"B","x":"","n":29},{"bn":83,"s":"A patient presents with a temporal bone SCC limited to the osseous external auditory canal. Which of the following is the most appropriate therapeutic intervention?","o":["Lateral temporal bone resection","Sleeve resection","Total temporal bone resection","Radiation therapy","Pinnectomy and sleeve resection"],"k":"A","x":"","n":30},{"bn":84,"s":"Regarding stereotactic radiotherapy for the treatment of vestibular schwannomas, which of the following statements is correct?","o":["Radiation doses of less than 40 Gy are not associated with facial neuropathies.","It is generally considered as first-line treatment for acoustic neuromas > 4 cm.","After stereotactic radiation, hearing levels plateau 3 months posttreatment.","The cochlear dose is an independent predictor of hearing preservation.","It is contraindicated in patients < 20 years."],"k":"D","x":"","n":31},{"bn":85,"s":"Fluctuating deafness in a patient with temporal bone trauma is most likely due to which of the following?","o":["Hemotympanum","Ossicular chain disruption","Perilymph fistula","Injury to internal acoustic meatus"],"k":"C","x":"","n":32},{"bn":86,"s":"In transverse fractures of temporal bone, the facial nerve is most commonly injured at which of the following?","o":["Mastoid segment","Tympanic segment","Labyrinthine segment","Stylomastoid foramen","IAM"],"k":"C","x":"","n":33},{"bn":87,"s":"Regarding the evaluation of a patient with a facial nerve injury, which of the following statements is INCORRECT?","o":["Conduction block only with no physical disruption of axonal discontinuity correlates with Sunderland’s first-degree injury.","Transection of the epineurium correlates with Sunderland’s second-degree injury.","Transection of the endoneurium correlates with Sunderland’s third-degree injury.","Synkinesis refers to the loss of discrete facial movements after facial nerve injury.","Topodiagnostic testing has little correlation with the site of injury to the facial nerve."],"k":"B","x":"","n":34},{"bn":89,"s":"Which of the following is the most common cause of conductive deafness in a patient with a longitudinal fracture of the temporal bone?","o":["Hemotympanum","Dislocation of malleus","Tympanic membrane perforation","Perilymph fistula","Malleoincudal dislocation"],"k":"A","x":"","n":35},{"bn":90,"s":"An MRI of the brain and temporal bone demonstrates a lesion of the petrous apex, which is hyperintense on both T1 and T2 imaging and does not enhance with gadolinium. Which of the following is the most appropriate management?","o":["Wide en-bloc excision of petrous apex neoplasm","Radiation therapy","Excision of neoplasm followed by radiotherapy","Surgical drainage of petrous apex granuloma"],"k":"D","x":"","n":36},{"bn":91,"s":"Which of the following is the most common complication in the treatment of vestibular schwannoma with the gamma knife?","o":["Delayed SNHL","Immediate SNHL","Immediate CN VII palsy","Delayed CN VII palsy","Malignant transformation"],"k":"A","x":"","n":37},{"bn":92,"s":"A 56-year-old woman presents to the outpatient clinic with an 8-month history of otalgia and otorrhea. Otoscopy reveals a large polyp filling the external auditory canal. Subsequent imaging is demonstrated in Figure 11-1. Which of the following statements represents the next single best step in managing this patient? B","o":["Balloon-test occlusion","Biopsy of the polyp","24-hour urinary vanillylmandelic acid measurement","Referral to radiation oncology"],"k":"B","x":"","i":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAGDArwDASIAAhEBAxEB/8QAHAAAAQQDAQAAAAAAAAAAAAAAAAMEBQYBAgcI/8QAUBAAAQMCBAIECQoFAgMGBQUAAQACAwQRBRIhMUFRBhMiYQcUMjdVcZSz0RUWFzZCcnN1kdIjUoGToTNWNLHBJCU
