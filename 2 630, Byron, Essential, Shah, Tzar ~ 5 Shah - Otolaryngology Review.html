x":"","n":1},{"bn":52,"s":"Which of the following statements is/are correct regarding third branchial arch cysts? i. They are rare.\nii. They present in the lower neck, anterior to the sternocleidomastoid muscle. iii. They are located deep to fourth-arch derivatives including the superior laryngeal nerve and internal carotid artery. iv. They are located superficial to third-arch derivatives including the pharyngeal constrictors.","o":["i and iv","i and ii","i and iii","i only","All of the above"],"k":"B","x":"","n":2},{"bn":54,"s":"The second branchial arch forms which of the following structures?\ni. Stylohyoid\nii. Lesser cornu of hyoid iii. Stylopharyngeus\niv. Anterior belly of digastric\nv. Maxillary artery","o":["iii, iv, and v","ii and v","i, ii, iii, and iv","i and ii","All of the above"],"k":"D","x":"","n":3},{"bn":55,"s":"The third branchial arch forms which of the following structures?\ni. Glossopharyngeal nerve\nii. Stylohyoid muscle iii. Greater cornu of hyoid\niv. Common carotid artery","o":["i, ii, and iii","i, ii, and iv","i and ii","ii, iii, and iv","i, iii, and iv"],"k":"E","x":"","n":4},{"bn":56,"s":"Which of the following statements is/are correct regarding plunging ranula? i. It is an extravasation salivary pseudocyst.\nii. It most often presents as a swelling in the submental triangle. iii. It is more common in patients with a previous history of intraoral surgery.\niv. It most often presents with an intraoral component.","o":["i only","i and iv","ii and iv","i, iii, and iv"],"k":"D","x":"","n":5},{"bn":57,"s":"Which of the following statements is/are correct regarding plunging ranulas? i. Total excision via a transcervical approach is the standard of care.\nii. Transoral excision of the sublingual gland with or without aspiration is appropriate in about 25% of cases.\niii. Recurrence occurs in approximately 30% of cases. iv. Removal of the submandibular salivary gland is advisable at the time of ranula excision.","o":["i only","i and ii","i and iii","ii and iv","None of the above"],"k":"E","x":"","n":6},{"bn":58,"s":"Which of the following statements is/are correct regarding teratomas? i. The head and neck are the most common anatomical site of occurrence.\nii. Malignancy is known to arise in 5% of congenital cervical teratomas.\niii. The risk of malignancy increases with younger age of diagnosis. iv. They have a poor overall prognosis.","o":["iv only","ii and iii","ii, iii, and iv","ii only","All of the above"],"k":"D","x":"","n":7},{"bn":59,"s":"Which of the following statements is/are correct regarding surgical intervention for teratomas? i. It may be undertaken as an EXIT (ex utero intrapartum treatment)/OOPS (operation on placental support) procedure ii. In cases of maternal polyhydramnios, surgical intervention should be deferred until at least 6 months of age. iii. It has an associated mortality of < 2%.\niv. In the absence of any airway compromise, surgical intervention should be deferred until the child weighs 15 kg.","o":["i and iv","i, ii, and iv","iii only","i only","All of the above"],"k":"D","x":"","n":8},{"bn":60,"s":"Teratomas may be diagnosed:\ni. Secondary to maternal polyhydramnios ii. On routine antenatal ultrasound\niii. During the second stage of labor\niv. In the neonatal period v. In later childhood","o":["i, ii, iii, and iv","i, iii, iv, and v","i, ii, and iv","All of the above"],"k":"D","x":"","n":9},{"bn":61,"s":"Which of the following statements are correct regarding chondromas of the neck?\ni. They most frequently arise from the larynx. ii. They may present as a lateral neck mass.\niii. They arise from immature hyaline cartilage.\niv. They have been reported arising from the hyoid.","o":["i and ii","i, ii, and iii","i and iv","i, iii, and iv","i, ii, and iv"],"k":"E","x":"","n":10},{"bn":62,"s":"Which of the following statements is/are correct regarding paragangliomas?\ni. After the adrenal glands, the head and neck are the next most frequent site of occurrence.\nii. One percent to three percent of extraadrenal paragangliomas are secretory tumors. iii. They are derived from paraganglionic cells of neural crest origin.\niv. In the head and neck they have a 20% rate of malignancy.","o":["i, ii, and iii","i, iii, and iv","ii only","iii only","ii and iii"],"k":"E","x":"","n":11},{"bn":64,"s":"Which of the following statements is/are correct regarding hereditary paraganglioma syndromes?\ni. Mutation of the B subunit of succinate dehydrogenase (SDH) is the most common abnormality. ii. SDHD gene is found on chromosome 11.\niii. SDHB gene is found on chromosome 1.\niv. SDHB gene mutations confer a higher risk of secreting tumors and pheochromocytomas.","o":["i only","ii only","iii only","iii and iv","ii, iii, and iv"],"k":"E","x":"","n":12},{"bn":65,"s":"Which of the following statements are correct regarding carotid body tumors? i. The carotid body is located in the adventitia of the posteromedial aspect of carotid bifurcation.\nii. The branchiomeric paraganglion group, from which the carotid body tumor grows, is derived from the third branchial cleft mesoderm.\niii. They are the most common bilateral paragangliomas in the head and neck.\niv. Bilateral carotid body tumors are best managed by single-stage bilateral surgery. v. Carotid body tumors should always undergo preoperative embolization.","o":["ii, iii, iv, and v","i, ii, iii, and iv","i, iii, and v","i, ii, and v","i, ii, and iii"],"k":"E","x":"","n":13},{"bn":66,"s":"Genetic screening for hereditary paraganglioma SDH gene mutations should be considered in which of the following patients?\ni. Patients < 40 years of age ii. Patients with a positive family history\niii. Patients with bilateral /multiple tumors\niv. Patients with tumors < 2 cm","o":["All of the above","i, ii, and iii","ii, iii, and iv","ii and iii"],"k":"B","x":"","n":14},{"bn":67,"s":"The classical features of carotid body tumors include which of the following?\ni. The lyre sign\nii. Fontaine sign iii. “salt and pepper” pattern on MRI\niv. Lower cranial nerve dysfunction\nv. Horner syndrome","o":["i, ii, and iii","i, iii, iv, and v","i, iii, and v","i and iii"],"k":"A","x":"","n":15},{"bn":68,"s":"Which of the following statements is/are correct regarding paragangliomas of the head and neck?\ni. After carotid body tumors, glomus vagale is the next most common tumor. ii. At altitude, there is a distinct male predominance in the gender distribution of carotid body tumors.\niii. Shamblin’s classification may predict the necessity for carotid resection, with Shamblin type 1 conferring the highest risk.\niv. The dominant feeding vessel to carotid body tumors is the superior thyroid artery.","o":["i, ii, and iii","i, ii, and iv","iv only","All of the above","None of the above"],"k":"E","x":"","n":16},{"bn":69,"s":"Which of the following statements is/are correct regarding schwannomas? i. Surgical excision is rarely associated with postoperative nerve dysfunction.\nii. Demonstrates strong s100 immunohistochemical positivity.\niii. Malignant transformation is reported in about 10%.\niv. They are rarely multiple in the head and neck.","o":["ii, iii, and iv","iii and iv","ii only","ii and iv","All of the above"],"k":"D","x":"","n":17},{"bn":70,"s":"Which of the following statements are correct regarding cervical schwannomas?\ni. They tend to be slow growing. ii. They tend to be hypointense on T1-weighted MRI and hyperintense on T2-weighted MRI, depending on their cellularity. iii. There is marked enhancement of the solid component of the tumor following the administration of gadolinium. iv. A “salt and pepper” pattern may be seen in postgadolinium MRI.","o":["i, ii, and iii","i and ii","i and iv","All of the above"],"k":"D","x":"","n":18},{"bn":71,"s":"Which of the following statements is/are correct regarding cervicofacial neurofibromas? i. They are most often seen in patients with neurofibromatosis type 2.\nii. They are well-encapsulated tumors of peripheral nerve sheaths.\niii. They are more frequently multiple than schwannomas. iv. When associated with neurofibromatosis, they have a higher risk of malignant degeneration.\nv. They should be routinely excised.","o":["i, iii, and iv","iii and iv","iii, iv, and v","iii only","ii only"],"k":"B","x":"","n":19},{"bn":72,"s":"Which of the following statements are correct regarding NF1?\ni. It has an incidence of 1 in 3000. ii. The NF1 gene is located on chromosome 17.\niii. Inheritance is by an autosomal dominant pattern.\niv. It is associated with increased risk of malignant peripheral nerve sheath tumors.","o":["i, iii, and iv","ii, iii, and iv","i and iv","All of the above"],"k":"D","x":"","n":20},{"bn":74,"s":"Which of the following statements are correct regarding cervical bronchogenic cysts?\ni. Although congenital, they usually present in the third decade of life. ii. Surgery is the treatment of choice.\niii. Malignant transformation has been reported.\niv. They may become infected.","o":["ii, iii, and iv","i, ii, and iv","ii and iv","All of the above"],"k":"A","x":"","n":21},{"bn":75,"s":"Which of the following statements are correct regarding cervical thymic cysts? i. They account for 1% of all cystic cervical masses.\nii. They usually present in the first decade of life.\niii. They are more common in males. iv. They are most often left sided.\nv. They can present anywhere in the neck from angle of mandible to suprasternal notch.","o":["i, ii, iii, and v","i, ii, iv, and v","i, iii, and iv","i and v","All of the above"],"k":"E","x":"","n":22},{"bn":76,"s":"Which of the following statements is/are correct regarding cervical thymic cysts?\ni. They have mediastinal extension in 50% of cases.\nii. Distinction from third and fourth branchial arch cysts is made on MRI.\niii. They are less common than branchial arch cyst anomalies. iv. They arise from the ventral foregut.","o":["i and iii","ii and iv","ii, iii, and iv","i only","None of the above"],"k":"A","x":"","n":23},{"bn":77,"s":"Which of the following statements is/are correct re garding the embryological development of the thyroid gland? i. It begins during the fifth week of gestation.\nii. It begins at the foramen cecum, which lies rostral to the tuberculum impar. iii. Descent into the neck may go anterior, through, or ventral to the hyoid bone.\niv. Obliteration of the migratory tract is normally complete by 18 weeks’ gestation.","o":["i and iv","ii and iii","ii, iii, and iv","i only","i and iii"],"k":"E","x":"","n":24},{"bn":78,"s":"Which of the following statements is/are correct regarding thyroglossal duct cysts?\ni. They are the most common congenital neck anomaly.\nii. They may be present in up to 7% of the population.\niii. The majority present before the age of 10. iv. They may present as lateral neck masses in adults.","o":["ii only","iv only","ii, iii, and iv","i and ii","All of the above"],"k":"E","x":"","n":25},{"bn":79,"s":"Which of the following statements are correct regarding thyroglossal duct cysts?\ni. They are most frequently infrahyoid. ii. They are suprahyoid in 25% of cases.\niii. Radionuclide scans are required preoperatively.\niv. They occur in cases in which thyroid cancer has been reported previously.","o":["i and ii","i and iii","i, ii, and iii","i, ii, and iv"],"k":"D","x":"","n":26},{"bn":80,"s":"Which of the following statements is/are correct regarding surgical excision of thyroglossal duct cysts?\ni. It is associated with 15% recurrence rates if the central portion of the hyoid is excised as part of the procedure.\nii. Simple cyst excision is associated with recurrence rates of 30%. iii. It is recommended predominantly for cosmetic reasons.\niv. It should not be undertaken if the thyroglossal duct cyst represents the only functioning thyroid tissue.","o":["i only","ii only","iii and iv","ii and iv","None of the above"],"k":"E","x":"","n":27},{"bn":81,"s":"Which of the following statements is/are correct regarding lymphangiomas of the cervicofacial region?\ni. They most often present from the twelfth week of life onward.\nii. They are best treated with propranolol.\niii. Steroids may be of short-term benefit. iv. Sclerosants such as bleomycin and OK-432 are valid therapeutic options.","o":["i, ii, and iii","ii, iii, and iv","iv only","None of the above"],"k":"C","x":"","n":28},{"bn":82,"s":"Which of the following statements are correct regarding cystic hygromas?\ni. They are the second most common congenital mass in the parotid region.\nii. Oral cavity and tongue involvement may result in dysphagia and airway difficulties. iii. Within the neck, the anterior triangle is the most common site.\niv. Rapid increase in size can occur secondary to spontaneous hemorrhage into the lesion.","o":["i, ii, and iv","ii and iv","i and ii","All of the above"],"k":"D","x":"","n":29},{"bn":84,"s":"Which of the following statements are correct regarding Kikuchi-Fujimoto disease?\ni. It is a self-limiting disease. ii. It most often occurs in the Japanese population.\niii. It has a viral etiology.\niv. It recurs in 30% of patients.","o":["ii, iii, and iv","ii and iv","i, iii, and iv","i, ii, and iv"],"k":"D","x":"","n":30},{"bn":85,"s":"Which of the following statements are correct regarding Kikuchi-Fujimoto disease? i. It typically affects young adults.\nii. It has a gradual onset.\niii. Posterior cervical nodes are frequently involved (65% to 70% of the cases).\niv. Lymph nodes tend to be mobile and firm.\nv. It occurs exclusively in Asian populations.","o":["i, ii, iii, and iv","ii, iii, and iv","ii, iv, and v","All of the above"],"k":"A","x":"","n":31},{"bn":86,"s":"Which of the following statements is/are correct regarding adult rhabdomyoma? i. It is a rare benign tumor of smooth muscle differentiation.\nii. It predominantly occurs in the head and neck. iii. It demonstrates a strong male predilection.\niv. It generally presents in the over-40 age group.\nv. It may be multifocal in as many as 15% of patients.","o":["ii, iii, iv, and v","i, iii, iv, and v","i and v","ii only","All of the above"],"k":"A","x":"","n":32},{"bn":87,"s":"Which of the following statements is/are correct regarding Kimura disease?\ni. It presents as painless solitary or multiple subcutaneous nodules that are asymmetric, mostly in the head and neck region, with coexisting lymphadenopathy in 90% of the cases.\nii. Typical areas for the nodules include preauricular, submandibular, and popliteal regions.\niii. Renal involvement occurs in 30% of patients.\niv. Hypereosinophilia and elevated serum immunoglobulin E are frequent findings.","o":["i only","ii and iii","iii and iv","ii and iv","All of the above"],"k":"D","x":"","n":33},{"bn":88,"s":"Which of the following statements are correct regarding Kimura disease?\ni. It is most common in Asian populations but has been reported in all populations.\nii. A strong male predominance exists.\niii. It most frequently presents in the third decade of life.\niv. Histopathology of excised specimens demonstrates a marked eosinophilic infiltrate and eosinophilic abscesses.","o":["i and iv","i, ii, and iii","i and iii","All of the above"],"k":"D","x":"","n":34},{"bn":89,"s":"Which of the following statements is/are correct regarding cat-scratch disease?\ni. Presentation usually occurs 1 to 3 weeks after inoculation with tender lymphadenopathy. ii. Associated systemic symptoms are common.\niii. Lymphadenopathy is usually the first to resolve.\niv. Kittens have a greater capacity to transmit the disease than adult cats.","o":["ii, iii, and iv","i, ii, and iii","iii only","iv only","All of the above"],"k":"E","x":"","n":35},{"bn":90,"s":"Which of the following statements is/are correct regarding cat-scratch disease?\ni. Bartonella quintana is the causative agent. ii. It most often presents at 30 to 40 years of age.\niii. It is more common in men.\niv. It is a seasonal disease. v. It can occur in the absence of a history of feline contact.","o":["i, ii, iii, and iv","iii, iv, and v","i only","All of the above"],"k":"B","x":"","n":36},{"bn":91,"s":"Which of the following statements are correct regarding cat-scratch disease?\ni. Positive serology is required for diagnosis. ii. Lymph node biopsy is required for diagnosis.\niii. Antimicrobial therapy is indicated in most cases.\niv. Azithromycin has been shown to reduce the risk of disseminated disease.","o":["i and iii","ii and iv","iii and iv","None of the above"],"k":"D","x":"","n":37},{"bn":92,"s":"Which of the following statements is/are correct regarding atypical mycobacterial infection?\ni. Mycobacterium avium complex is the most common causative agent. ii. It most often presents in children < 6 years of age.\niii. It causes a shiny, violaceous discoloration of the skin overlying the affected lymph nodes. iv. Positive serology confirms the diagnosis.","o":["i, ii, and iv","i, iii, and iv","ii only","iii only","All of the above"],"k":"A","x":"","n":38},{"bn":94,"s":"Which of the following statements are correct regarding Toxoplasma gondii infection?\ni. It is associated with cervical adenitis in 90% of cases. ii. It is usually minimally symptomatic.\niii. It is usually treated with azithromycin or pyrimethamine and sulfadiazine. iv. Seroprevalence in the United States is estimated between 11% and 22%.","o":["i, ii, and iv","iii and iv","ii and iv","All of the above"],"k":"B","x":"","n":39},{"bn":95,"s":"Which of the following statements is/are correct regarding Kawasaki disease?\ni. Eighty percent of patients are 5 years of age or younger.\nii. The male-to-female ratio is 1.5 : 1.\niii. Cardiac sequelae occur in 5% of patients. iv. Early intervention with steroids reduces cardiac morbidity.\nv. Recurrence occurs in 20% of cases.","o":["i, ii, iii, and iv","iii, iv, and v","i, ii, and iii","iii only"],"k":"C","x":"","n":40},{"bn":96,"s":"Which of the following are among the principal clinical findings utilized to diagnose Kawasaki disease? i. Cervical lymphadenopathy\nii. Changes in lips and oral cavity\niii. Polymorphous exanthema iv. Polyarthritis\nv. Changes in the extremities including erythema and desquamation","o":["i, ii, iii, and iv","i, iii, iv, and v","i, ii, iii, and v","i and v"],"k":"C","x":"","n":41},{"bn":97,"s":"Which of the following statements are correct regarding Kawasaki disease? i. It is a systemic vasculitis with a predilection for the coronary arteries.\nii. It may demonstrate seasonal incidence. iii. An inflammatory arteritis begins at day 6.\niv. Aneurysm formation generally begins at day 12.","o":["i and iv","i and ii","iii and iv","All of the above"],"k":"D","x":"","n":42},{"bn":98,"s":"Which of the following statements is/are correct regarding Rosai-Dorfman disease?\ni. It is also known as sinus histiocytosis with massive lymphadenopathy.\nii. It most frequently involves the posterior triangle lymph nodes. iii. It most frequently affects those in the third and fourth decades of life.\niv. It is usually treated with systemic corticosteroids.","o":["i, iii, and iv","ii and iv","i only","iii only"],"k":"C","x":"","n":43},{"bn":99,"s":"Which of the following statements is/are correct regarding lipomas? i. They are hamartomatous proliferations of mature fat cells.\nii. Twenty-five percent occur in the head and neck. iii. The anterior triangle of the neck is the most common site within the head and neck.\niv. A peak incidence of lipoma formation is noted in fifth and sixth decades of life.","o":["ii and iii","iv only","i, ii, and iv","All of the above"],"k":"C","x":"","n":44},{"bn":100,"s":"Which of the following syndromes are associated with lipoma formation? i. Gardner syndrome\nii. Dercum disease\niii. Madelung disease iv. von Recklinghausen disease\nv. Familial multiple lipomatosis","o":["i, iii, and v","ii, iii, and iv","i, ii, iii, and v","i, ii, and iii"],"k":"C","x":"","n":45}]},{"t":"Ch 13 · Tonsils and Adenoids","q":[{"bn":51,"s":"Which of the following is the most common neoplasm of the tonsil?","o":["Lymphoma","Metastatic carcinoma","Squamous cell carcinoma","Salivary neoplasm"],"k":"C","x":"","n":1},{"bn":53,"s":"Blood supply to the palatine tonsil is derived from branches of which of the following arteries?","o":["Internal carotid","External carotid","Common carotid","Both internal and external carotid"],"k":"B","x":"","n":2},{"bn":54,"s":"The pathology specimen in a patient with squamous cell carcinoma of the tonsillar fossa without a history of smoking or drinking often is positive for which of the following?","o":["HPV","Epstein-Barr virus (EBV)","Cytomegalovirus (CMV)","Herpes simplex virus (HSV)"],"k":"A","x":"","n":3},{"bn":55,"s":"Pediatric nasopharyngeal carcinoma has a more favorable prognosis than adult nasopharyngeal carcinoma and is more closely associated with which of the following?","o":["HPV","EBV","CMV","HSV"],"k":"B","x":"","n":4},{"bn":56,"s":"Tonsillitis associated with a gray membrane covering the surface of the tonsil but that may be removed without bleeding is often associated with which of the following?","o":["HPV","EBV","CMV","HSV"],"k":"B","x":"","n":5},{"bn":57,"s":"Which of the following is the leading cause of bacterial tonsillitis after 2002?","o":["Methicillin-resistant Staphylococcus aureus (MRSA)","Intermediate-resistant Streptococcus pneumoniae (IRSP)","GABHS","Vancomycin-resistant enterococcus"],"k":"C","x":"","n":6},{"bn":58,"s":"Which of the following is the most common cause of tonsillitis?","o":["Viral infection","Bacterial infection","Environmental allergens","Gastropharyngeal reflux"],"k":"A","x":"","n":7},{"bn":59,"s":"When comparing the WHO classification for nasopharyngeal carcinoma in children versus adults, children most commonly have more of which of the following?","o":["Type 1: squamous cell carcinoma","Type 2: nonkeratinizing carcinoma","Type 3: undifferentiated carcinoma","No difference in WHO classification between adults and children"],"k":"C","x":"","n":8},{"bn":60,"s":"Which of the following does NOT adversely affect prognosis in pediatric nasopharyngeal · Sleep Apnea and Snoring","q":[{"bn":51,"s":"Major risk factors for OSA in adults include which of the following? i. Obesity\nii. Male gender\niii. Postmenopausal status iv. Age","o":["i","i and ii","i, ii, and iv","All of the above"],"k":"D","x":"","n":1},{"bn":52,"s":"Fujita type III classification of the pattern of upper airway obstruction refers to obstruction at which region?","o":["Retropalatal region","Retrolingual region","Both the retropalatal and retrolingual region","None of the above"],"k":"B","x":"","n":2},{"bn":53,"s":"Which of the following are common questionnaires used to screen for symptoms of OSA?","o":["Berlin questionnaire","STOPBang questionnaire","ESS","All of the above"],"k":"D","x":"","n":3},{"bn":54,"s":"Sequelae of untreated OSA in adults include which of the following?\ni. Insulin resistance\nii. Increased mortality iii. Hypertension\niv. Dysphagia","o":["ii","ii and iii","i, ii, and iii","All of the above"],"k":"C","x":"","n":4},{"bn":55,"s":"Which of the following muscles is considered most important in maintaining upper airway patency during sleep?","o":["Levator veli palatini","Superior constrictor","Tensor palatini","Genioglossus","No one muscle is clearly more important than the other muscles of the oral cavity and pharynx."],"k":"D","x":"","n":5},{"bn":56,"s":"Cephalometric characteristics most strongly associated with OSA include all of the following EXCEPT:","o":["Decreased pharyngeal length","Inferiorly positioned hyoid bone","Increased soft palate thickness","Longer soft palate","None of the above"],"k":"A","x":"","n":6},{"bn":57,"s":"A standard nocturnal polysomnogram includes which of the following monitors? i. Electroencephalogram\nii. Submental electromyogram\niii. Tracheal microphone iv. Pulse oximetry\nv. Esophageal pressure monitor","o":["i, ii, and iii","i, ii, and iv","i, iii, and iv","i, ii, iii, and iv","All of the above"],"k":"D","x":"","n":7},{"bn":58,"s":"Obstructive sleep apnea syndrome is defined as which of the following? i. Five or more respiratory events (apneas, hypopneas, or respiratory event–related arousals) per hour\nii. 15 or more respiratory events (apneas, hypopneas, or respiratory event–related arousals) per hour\niii. Associated excessive daytime somnolence, waking with gasping, choking, or breath holding","o":["i only","ii only","i and iii","(i and iii) or ii"],"k":"D","x":"","n":8},{"bn":59,"s":"“Good compliance” with positive airway pressure therapy is typically defined as which of the following?","o":["At least 3 hours per night for 4 nights per week","At least 4 hours per night for 5 nights per week","At least 6 hours per night for 5 nights per week","At least 6 hours per night for 7 nights per week"],"k":"B","x":"","n":9},{"bn":60,"s":"Which of the following is NOT considered an indication for surgical treatment of OSA?","o":["Mild OSA with severe obstructing anatomy that is surgically correctable","Failure of CPAP therapy","Failure of positional therapy","Failure of oral appliance therapy"],"k":"C","x":"","n":10},{"bn":61,"s":"Which of the following procedures can be performed in an office-based setting under local anesthetic?\ni. Radiofrequency turbinate reduction\nii. Placement of palatal implants iii. Palatal radiofrequency ablation\niv. Tongue base radiofrequency ablation","o":["i","i and ii","i, ii, and iii","All of the above"],"k":"D","x":"","n":11},{"bn":62,"s":"Which of the following conditions is NOT considered high risk for OSA?","o":["Congestive heart failure","Atrial fibrillation","Nocturnal dysrhythmias","Type 2 diabetes","End-stage renal disease","Preoperative for bariatric surgery"],"k":"E","x":"","n":12},{"bn":63,"s":"A 40-year-old man with a body mass index (BMI) of 35 kg/m 2 and large tonsils is hypertensive despite optimal medical management. He has a history of mild snoring and has an ESS score of 11. Which of the following is the most appropriate next step in management?","o":["Observation","Home sleep testing with portable monitoring","In-laboratory polysomnography","Tonsillectomy followed by objective testing"],"k":"B","x":"","n":13},{"bn":64,"s":"Acceptable portable monitoring should at a minimum include which of the following?","o":["Blood oxygenation","Blood oxygenation and airflow","Blood oxygenation, airflow, and respiratory effort","Blood oxygenation, airflow, respiratory effort, and electroencephalography"],"k":"C","x":"","n":14},{"bn":65,"s":"Which of the following is NOT a behavioral treatment option for OSA?","o":["Weight loss","Daytime napping","Avoidance of alcohol and sedatives before bedtime","Positional therapy"],"k":"B","x":"","n":15},{"bn":66,"s":"Normalization of AHI with PAP therapy results in resolution of hypersomnia in all but what percentage of patients?","o":["10%","20%","30%","50%"],"k":"B","x":"","n":16},{"bn":67,"s":"Which of the following is the minimum average nightly CPAP use necessary to achieve improvement on the Multiple Sleep Latency Test?","o":["3 hours","4 hours","6 hours","8 hours"],"k":"C","x":"","n":17},{"bn":68,"s":"Indications for use of an oral appliance include which of the following?\ni. Mild to moderate OSA ii. Failed CPAP trial\niii. Failed behavioral measures such as weight loss or positional therapy iv. Primary snoring with failed behavioral measures","o":["i","i and ii","i, ii, and iii","All of the above"],"k":"D","x":"","n":18},{"bn":69,"s":"The Friedman staging system for adult OSA is based on assessments of which of the following?\ni. Tonsil size ii. Tongue-palate position\niii. BMI\niv. Neck circumference","o":["i","i and ii","i, ii, and iii","All of the above"],"k":"C","x":"","n":19},{"bn":70,"s":"The VOTE classification system refers to which type of assessment?","o":["Drug-induced sleep endoscopy","Oral cavity/oropharynx examination","Cephalometry","Cine MRI"],"k":"A","x":"","n":20},{"bn":71,"s":"Which of the following is a potential limitation of drug-induced sleep endoscopy?","o":["Lack of standardized sedation regimen","Variability ongest risk factor associated with progression of OSA over time?","o":["Increasing age","Male gender","Increasing weight","Severe snoring"],"k":"C","x":"","n":28},{"bn":79,"s":"Compared with CPAP, mandibular advancement devices (MADs):","o":["Are more successful at reducing AHI","Are better at controlling snoring","Do not require a titration procedure to be effective","Show better compliance than CPAP"],"k":"D","x":"","n":29},{"bn":80,"s":"Compared with mouth breathing, unobstructed nasal breathing:","o":["Results in increased ventilation","Increases upper airway dilator muscle activity","Is less common in patients with OSA","All of the above"],"k":"D","x":"","n":30},{"bn":81,"s":"Which of the following has NOT been associated with persistent OSA after adenotonsillectomy in children?","o":["Obesity","Male gender","Severe preoperative OSA","Neuromuscular comorbidity"],"k":"B","x":"","n":31},{"bn":82,"s":"A 12-year-old boy presents with a history of heavy snoring, gasping and snorting during sleep, witnessed apneic pauses, and daytime sleepiness. Physical examination findings include a BMI in the 95th percentile for age, 3 + tonsils, modified Mallampati class III, and a large tongue. The next most appropriate step in management is:\ni. Obtain a sleep study\nii. Nutritionist referral to discuss weight-loss strategies iii. Tonsillectomy\niv. CPAP trial\nv. Multilevel surgery","o":["i","ii","iii","ii and iii","ii and iv","ii and v"],"k":"B","x":"","n":32},{"bn":83,"s":"In an unselected population of adult patients with mild to moderate OSA, UPPP has a reported success rate (defined as > 50% reduction in AHI and AHI < 20 events/hour) closest to:","o":["30%","50%","70%","90%"],"k":"B","x":"","n":33},{"bn":84,"s":"When used optimally and consistently, which of the following treatments has NOT demonstrated consistent efficacy in improving snoring, AHI, or sleep quality of life?","o":["Oropharyngeal exercise","Tongue-retaining devices","Nasal dilators","Intranasal steroids"], 0},{"bn":91,"s":"A 3-year-old girl with significant snoring, witnessed apneic pauses, gasping, and snorting undergoes a sleep study and is found to have an AHI of 4.5 with oxygen saturation nadir of 90%. What is the degree of OSA severity?","o":["Normal","Mild","Moderate","Severe"],"k":"B","x":"","n":41},{"bn":92,"s":"The same 3-year-old girl as in question 91 is found on physical examination to have a BMI in the 99th percentile, chronic mouth breathing with significant nasal congestion and rhinorrhea, 2 + tonsils, and modified Mallampati class III. Which of the following is the next step in management?","o":["Tonsillectomy and adenoidectomy","Adenoidectomy alone","Tonsillectomy alone","CPAP trial"],"k":"A","x":"","n":42},{"bn":93,"s":"In studies of the outcomes of adenotonsillectomy for treatment of OSA in children, what is the lowest reported rate of complete resolution of OSA?","o":["10%","25%","50%","75%"],"k":"B","x":"","n":43},{"bn":94,"s":"What is the primary functional difference between type III and type IV portable monitors for the diagnosis of OSA?","o":["Ability to distinguish sleep and awake states","Ability to accurately calculate AHI","Ability to distinguish central versus obstructive events","Ability to monitor muscle tone"],"k":"C","x":"","n":44},{"bn":96,"s":"Regarding hyoid myotomy and suspension, which of the following statements is INCORRECT?","o":["Hyoid suspension has demonstrated significant improvement in AHI and daytime sleepiness.","Hyoid suspension is not recommended as an isolated procedure in patients who fail CPAP and are found to have significant retrolingual collapse.","Hyoid suspension is recommended in combination with other procedures as part of multilevel surgery that includes the retrolingual airway.","All of the above statements are true."],"k":"B","x":"","n":45},{"bn":97,"s":"What is the average rate of success (defined as 50% reduction in AHI, postoperative AHI < 20) of multilevel surgery in adults with a broad range of OSA s ted with improvement in all of the following symptoms EXCEPT:","o":["Nasal congestion","Sneezing","Nasal pruritus","Eye tearing","Rhinorrhea"],"k":"A","x":"","n":33},{"bn":86,"s":"Sedative side effects occur in approximately what per centage of patients taking first-generation oral H1 antihistamines?","o":["10%","20%","50%","75%"],"k":"B","x":"","n":34},{"bn":87,"s":"Topical decongestants, such as phenylephrine and oxymetazoline, are recommended only for short-term use due to the association with which of the following side effects?","o":["Epistaxis","Sedation","Septal perforation","Rhinitis medicamentosa"],"k":"D","x":"","n":35},{"bn":88,"s":"Administration of intranasal anticholinergics, such as ipratropium bromide, is typically associated with improvement of which of the following symptoms?","o":["Nasal congestion","Sneezing","Nasal pruritis","Eye tearing","Rhinorrhea"],"k":"E","x":"","n":36},{"bn":89,"s":"Which of the following classes of medications is considered the most efficacious for the treatment of allergic rhinitis?","o":["Intranasal steroids","Oral antihistamines","Intranasal antihistamines","Leukotriene receptor antagonists"],"k":"A","x":"","n":37},{"bn":90,"s":"Various studies have shown that the administration of intranasal steroids is associated with a significant reduction in which of the following?\ni. Inflammatory cell influx into nasal mucosa and nasal secretions ii. Production of TH1-type cytokines in nasal mucosa and nasal secretions\niii. Antigen-induced hyperresponsiveness to subsequent antigen challenge\niv. Antigen-induced hyperresponsiveness to histamine provocation","o":["i, ii, and iii","i, ii, and iv","i, iii, and iv","All of the above","None of the above"],"k":"C","x":"","n":38},{"bn":91,"s":"What is the most common side effect associated with consistent use of intranasal steroids?","o":["Growth suppression","Epistaxis","Local nasal irritation","Mucosal atrophy","Septal perforation","Candida overgrowth"],"k":"C","x":"","n":39},{"bn":9 n controlling ocular symptoms.","Intranasal steroids have equivalent efficacy in controlling ocular symptoms when compared with H antihistamines.1","Coadministration of intranasal steroids and intranasal antihistamines produces an additive benefit in controlling ocular symptoms."],"k":"C","x":"","n":46},{"bn":99,"s":"Which combination therapies have been shown to have a clear additive benefit in the treatment of allergic rhinitis?","o":["Intranasal antihistamines and intranasal steroids","Oral antihistamines and intranasal steroids","Oral leukotriene modifiers and oral steroids","Oral antihistamines and oral steroids","All of the above"],"k":"A","x":"","n":47},{"bn":100,"s":"All of the following medications are considered safe during pregnancy (category B agents) EXCEPT:","o":["Budesonide","Fluticasone","Loratadine","Cetirizine","Levocetirizine"],"k":"B","x":"","n":48}]},{"t":"Ch 20 · Facial Plastic Surgery","q":[{"bn":51,"s":"From which region is the Frankfurt horizontal plane drawn?","o":["Superior aspect of the external auditory canal to the inferior border of the infraorbital rim","Superior aspect of the root of the helix to the inferior border of the infraorbital rim","Inferior aspect of the external auditory canal to the inferior border of the infraorbital rim","Inferior aspect of the root of the helix to the inferior border of the infraorbital rim"],"k":"A","x":"","n":1},{"bn":52,"s":"When examining the width of the face, the width of one eye should equal all of the following EXCEPT:","o":["One-fifth of the total facial width","The intercanthal width","The width of the mouth","The width of the nasal base"],"k":"C","x":"","n":2},{"bn":53,"s":"Which of the following measurements is NOT part of the rule of thirds when evaluating facial height?","o":["Trichion to nasion","Glabella to subnasale","Glabella to trichion","Subnasale to menton"],"k":"A","x":"","n":3},{"bn":54,"s":"The nasofrontal angle formed by a line tangent to the nasal dorsum intersecting a line tangent to the glabella through the nasion should be within which range of angles?","o":["90 to 110 degrees","115 to 135 degrees","70 to 90 degrees","135 to 145 degrees"],"k":"B","x":"","n":4},{"bn":55,"s":"Which of the following is NOT a major esthetic unit of the face?","o":["Forehead","Eyes","Ears","Nasal vestibule"],"k":"D","x":"","n":5},{"bn":56,"s":"The nasolabial angle formed from the intersection of a line tangent between the labrale superioris and the subnasale and that tangent between the subnasale and the most anterior point of the columella should measure:","o":["95 to 110 degrees in men","95 to 110 degrees in women","75 to 85 degrees in men","75 to 85 degrees in women"],"k":"B","x":"","n":6},{"bn":57,"s":"When examining nasal tip projection, the ratio between upper lip length and nasal projection should roughly equal:","o":["1 : 2","1 : 3","1 : 1","1 : 1.5"],"k":"C","x":"","n":7},{"bn":58,"s":"Using Goode method, the ratio of a vertical line from the nasion to the alar groove with a line perpendicular from the alar groove to the nasal tip should equal:","o":["0.35 to 0.45","0.45 to 0.50","0.55 to 0.60","0.65 to 0.75"],"k":"C","x":"","n":8},{"bn":59,"s":"When considering the ideal ear, which of the following measurements are most accurate?","o":["The ear protrudes from the skull at an angle of 20 to 30 degrees and has a posterior rotation of 15 degrees from the vertical plane.","The ear protrudes from the skull at an angle of 15 degrees and has a posterior rotation of 20 to 30 degrees from the vertical plane.","The ear protrudes from the skull at an angle of 35 to 40 degrees and has a posterior rotation of 10 degrees from the vertical plane.","The ear protrudes from the skull at an angle of 10 degrees and has a posterior rotation of 35 to 40 degrees from the vertical plane."],"k":"A","x":"","n":9},{"bn":60,"s":"Which of the following critical factors should NOT be commented on in the clinical notes or to an examiner in vivo when analyzing the facial skin?","o":["Texture","Thickness","Elasticity","Translucence"],"k":"D","x":"","n":10},{"bn":61,"s":"All of the following are examples of hyperdynamic facial lines EXCEPT:","o":["Crow’s feet","Melolabial sulcus","Glabella lines","Horizontal forehead creases"],"k":"B","x":"","n":11},{"bn":62,"s":"Using the Fitzpatrick Classification of Sun-Reactive Skin Types, which of the following statements is INCORRECT?","o":["Type 1 skin always tans and never burns.","Type 2 skin usually burns and tans with difficulty.","Type 4 skin rarely burns and tans with ease.","Type 5 skin very rarely burns and tans very easily."],"k":"A","x":"","n":12},{"bn":63,"s":"Of the following, which is NOT a classification for cutaneous flaps?","o":["Classification by method of transfer","Classification by blood supply","Classification by skin match","Classification by proximity to the defect"],"k":"C","x":"","n":13},{"bn":64,"s":"Which of the following methods of transfer does NOT apply to local cutaneous flaps?","o":["Pivotal","Microsurgical","Advancement","Hinged"],"k":"B","x":"","n":14},{"bn":65,"s":"Which of the following local flaps is an example of a pivotal flap?","o":["Interpolated","Bipedical","V-Y flap","Unipedicle"],"k":"A","x":"","n":15},{"bn":66,"s":"When rotating a pivotal flap through 180 degrees, what is the amount of effective length that may be lost as a result?","o":["15%","20%","30%","40%"],"k":"D","x":"","n":16},{"bn":67,"s":"Scalp defects are best reconstructed with which of the following types of flap, secondary to the shape of the cranium and relative lack of skin elasticity?","o":["Advancement flap","Transposition flap","Rotation flap","Free flap"],"k":"C","x":"","n":17},{"bn":68,"s":"An interpolated flap can be used as a single-stage reconstruction when which most important condition is met?","o":["The pedicle is de-epithelialized and passed under the intervening skin.","The skin color and texture exactly match between donor and defect sites.","A good random blood supply exists.","The defect is located in close proximity to the base of the flap."],"k":"D","x":"","n":18},{"bn":69,"s":"Which of the following is NOT a feature of advancement flaps for reconstruction?","o":["They have a linear configuration.","Tissue is moved through two vectors.","They depend on tissue elasticity.","They often require undermining of surrounding soft tissue to achieve closure."],"k":"B","x":"","n":19},{"bn":70,"s":"When reconstructing nasal defects of a convex aesthetic unit, which percentage defect is best repaired first by removing the remaining skin of the subunit?","o":["5%","20%","35%","50%"],"k":"D","x":"","n":20},{"bn":71,"s":"When raising a paramedian forehead flap based on the supratrochlear artery, the origin of the supratrochlear artery is most commonly found:","o":["0.5 to 1.0 cm lateral to midline","1.7 to 2.2 cm lateral to midline","2.3 to 2.7 cm lateral to midline","2.8 to 3.1 cm lateral to midline"],"k":"B","x":"","n":21},{"bn":72,"s":"Regarding the Karapandzic flap, which of the following is INCORRECT?","o":["It is an innervated reconstructive option for lip defects.","It often results in microstomia.","It is useful for the reconstruction of defects less than one-third of lip width.","It restores a continuous circle of functioning orbicularis oris muscle."],"k":"C","x":"","n":22},{"bn":73,"s":"Aesthetic goals for repairing forehead defects include all of the following EXCEPT:","o":["Avoidance of diagonal scars","Maintenance of eyebrow symmetry","Maintenance of natural frontal hairlines","Planning vertical scars where possible"],"k":"D","x":"","n":23},{"bn":74,"s":"Which of the following will give the WORST cosmetic result for the repair of forehead defects generally?","o":["Skin graft","Healing by secondary intention","Primary closure","Local advancement flaps"],"k":"A","x":"","n":24},{"bn":75,"s":"Regarding tissue expansion for defect repair, which of the following is NOT a disadvantage?","o":["It is a two-stage procedure.","The end cosmetic result","Tissue expansion must occur prior to defect creation.","There is considerable associated deformity during the expansion."],"k":"B","x":"","n":25},{"bn":76,"s":"Which of the following is the most common abnormality regarding protruding ears?","o":["Unfurled helix","Deficiency of triangular fossa","Hypertrophic conchal bowl","Loss of antitragus"],"k":"A","x":"","n":26},{"bn":77,"s":"Which of the following is NOT a sensory supply to the pinna?","o":["C2 and C3","V2","VII","X"],"k":"B","x":"","n":27},{"bn":78,"s":"Which of the following pairs is INCORRECT in relation to the evolution of the external ear from the hillocks of His?","o":["First hillock → the tragus","Third hillock → the helix","Fifth hillock → the antihelix","Sixth hillock → the lobule"],"k":"C","x":"","n":28},{"bn":79,"s":"Which of the following statements is correct?","o":["By 3 years of age 90% of auricular growth has been completed.","Cartilaginous growth is almost complete by age 5 years.","The vertical dimension of the average adult ear is 7 cm.","The incidence of protruding ears in Caucasians is approximately 15%."],"k":"B","x":"","n":29},{"bn":80,"s":"Regarding complications following otoplasty, which of the following is NOT an early complication?","o":["Perichondritis","Cartilage necrosis","Hematoma","Keloid scar formation"],"k":"D","x":"","n":30},{"bn":81,"s":"Regarding late complications of otoplasty, which of the following is INCORRECT?","o":["Keloid scarring is most commonly seen in older, fairer skinned patients.","Foreign body granuloma formation is more often seen when braided sutures are used compared with monofilament sutures.","Recurrent frostbite may occur due to disruption of the auricular blood supply.","Hypoaesthesia after otoplasty is secondary to injury of the greater auricular nerve."],"k":"A","x":"","n":31},{"bn":82,"s":"Which of the following statements regarding skin malignancies is correct?","o":["Basal cell carcinoma is the most common malignancy, but melanoma causes the most deaths related to skin cancer.","Basal cell carcinoma is the most common malignancy, but squamous cell carcinoma causes the most deaths related to skin cancer.","Squamous cell carcinoma is the most common malignancy, but basal cell carcinoma causes the most deaths related to skin cancer.","Squamous cell carcinoma is the most common malignancy, but melanoma causes the most deaths related to skin cancer."],"k":"A","x":"","n":32},{"bn":83,"s":"Which of the following human papilloma virus (HPV) subtypes is not typically associated with verruca vulgaris?","o":["HPV 2","HPV 27","HPV 16","HPV 57"],"k":"C","x":"","n":33},{"bn":84,"s":"Which of the following is NOT a subtype of melanocytic nevi?","o":["Dysplastic","Compound","Spitz","Intraepidermal"],"k":"D","x":"","n":34},{"bn":85,"s":"Regarding melanocytic lesions of the head and neck, which of the following is NOT an indication for biopsy, providing it is not practical to excise the entire lesion?","o":["Variegation in color","Diameter greater than 2 mm","Asymmetry of the border","Evolution of the lesion"],"k":"B","x":"","n":35},{"bn":86,"s":"With respect to lentigines, which of the following statements is INCORRECT?","o":["Cryotherapy is effective for solitary lesions, as keratinocytes are preferentially destroyed at low temperatures.","Lentigines are characterized by a proliferation of benign melanocytes at the dermoepidermal junction.","Lentigines are photoinduced and darken on sun exposure.","Clinically, lentigines have more even pigment distribution when compared with melanoma in situ."],"k":"A","x":"","n":36},{"bn":87,"s":"Of the following, which is NOT characteristic for a diagnosis of neurofibromatosis type 1?","o":["Lisch nodules","Café au lait macules","Bilateral vestibular schwannomas","Optic gliomas"],"k":"C","x":"","n":37},{"bn":88,"s":"Regarding congenital bullous diseases, which of the following descriptions is correct for dystrophic epidermolysis bullosa?","o":["Blistering occurs in the epidermis.","Blisters can occur at various levels.","Blistering occurs within the dermis.","Blistering occurs at the dermoepidermal junction."],"k":"C","x":"","n":38},{"bn":89,"s":"Treatment options of pemphigus and pemphigoid include all of the following EXCEPT:","o":["Immunoglobulin infusion","Oral corticosteroids","Monoclonal antibodies","Systemic immunosuppression"],"k":"A","x":"","n":39},{"bn":90,"s":"Regarding Stevens-Johnson syndrome, which of the following statements is INCORRECT?","o":["Adult cases are usually infectious in nature.","Fever and malaise are common first symptoms, followed by cutaneous and mucosal lesions.","It is characterized by erythema and blistering of the skin and mucous membranes of less than 10% of body surface area.","Oral corticosteroids used after substantial desquamation have been shown to increase morbidity."],"k":"A","x":"","n":40},{"bn":91,"s":"Of the following risk factors for development of malignant skin lesions, which of the following is thought most important for the development of squamous cell carcinoma?","o":["Exposure to chemical carcinogens","Cumulative sun exposure","Sunburns","Intense and intermittent sun exposure during childhood"],"k":"B","x":"","n":41},{"bn":92,"s":"Which of the following types of melanoma is most likely to lack a radial growth phase?","o":["Superficial spreading","Lentigo maligna","Nodular","Acral lentiginous"],"k":"C","x":"","n":42},{"bn":93,"s":"Which of the following is the most common variant of basal cell carcinoma?","o":["Infiltrative","Morpheaform","Sclerosing","Nodular"],"k":"D","x":"","n":43},{"bn":94,"s":"Which of the following is NOT associated with Gorlin syndrome?","o":["Bifid ribs","Microcephaly","Ovarian fibromas","Basal cell carcinoma"],"k":"B","x":"","n":44},{"bn":95,"s":"Regarding squamous cell carcinoma, which of the following is NOT considered a trait associated with increased aggressive behavior?","o":["Increasing differentiation","Perineural invasion","Depth of invasion greater than 4 mm","Lesions greater than 2 cm in diameter"],"k":"A","x":"","n":45},{"bn":96,"s":"Which of the following is NOT a risk factor for the development of Merkel cell carcinoma?","o":["Ultraviolet radiation exposure","Arsenic exposure","Immunosuppression","Merkel cell polyomavirus infection"],"k":"B","x":"","n":46},{"bn":97,"s":"Which of the following lesions is most commonly associated with tuberous sclerosis?","o":["Angiofibroma","Acrochordon","Xanthelasma","Sebaceous hyperplasia"],"k":"A","x":"","n":47},{"bn":98,"s":"Which of the following is INCORRECT regarding morphea?","o":["It is thought to have an autoimmune cause.","It is usually a self-limiting condition.","It is a systemic manifestation of scleroderma.","Adult onset of the disease is uncommon."],"k":"C","x":"","n":48},{"bn":99,"s":"Which of the following is correct regarding melanoma?","o":["Survival is not related to tumor thickness.","Patients with atypical nevi are not at increased risk of developing melanoma compared with the general population.","Light skin, hair, and eye color are not risk factors for melanoma.","Tumor ulceration and mitotic rate are important prognostic factors."],"k":"D","x":"","n":49},{"bn":100,"s":"Keratoacanthomas require removal with adequate margin and depth for histopathologic review because","o":["Not all keratoacanthomas will involute.","They consist of keratinocytes with follicular features.","Frequent mitoses at the base of the lesion and a rapid growth phase are suggestive of squamous cell carcinoma.","Involution may result in scarring."],"k":"C","x":"","n":50}]},{"t":"Ch 21 · Rhinoplasty","q":[{"bn":51,"s":"Evaluation of skin type for the purposes of rhinoplasty is best performed by which of the following?","o":["Visual inspection of entirely nasal skin","Inspection and palpation of nasal tip","Inspection and palpation of the skin over the nasal skeleton","Inspection and palpation of the skin over key areas of the face"],"k":"C","x":"","n":1},{"bn":52,"s":"Evaluation of all of the following can be performed by preoperative palpation of the nasal vestibule, EXCEPT:","o":["Caudal septum twists and angulations","Size and shape of the columella","Quadrangular cartilage length and interference with adequate tip rotation","Location of the rhinion"],"k":"D","x":"","n":2},{"bn":53,"s":"The internal nasal valve is best defined by which of the following structures?","o":["Nasal septum, cephalic margin of the upper lateral cartilages, and the nasal floor","Nasal septum, caudal margin of the upper lateral cartilages, head of the inferior turbinate, and nasal floor","Nasal septum, mid-portion of the upper lateral cartilages, head of the inferior turbinate, nasal floor, and pyriform aperture","Nasal floor, head of the inferior turbinate, and head of the middle turbinate"],"k":"B","x":"","n":3},{"bn":54,"s":"Ideal photographic views of rhinoplasty should include which of the following?","o":["Frontal, lateral, oblique, and basal","Frontal, axial, basal, and lateral","Lateral, basal, medial, and central","Frontal, oblique, basal, and side"],"k":"A","x":"","n":4},{"bn":55,"s":"To minimize local anesthetic needs and distortion of nasal anatomy, which of the following are the best planes for preoperative local anesthetic infiltration?","o":["(1) Supraperiosteal planes lateral and medial to each ascending process of maxilla, (2) supramucoperiosteal and supramucoperichondrial planes of both sides of the septum, and (3) supraperiosteal and supraperichondrial regions over the lower and upper cartilages and nasal bones","(1) Subperiosteal planes lateral and medial to each ascending process of maxilla, (2) submucoperiosteal and submucoperichondrial planes of both sides of the septum, and (3) supraperiosteal and supraperichondrial regions over the lower and upper cartilages and nasal bones","(1) Subperiosteal planes lateral and medial to each ascending process of maxilla, (2) submucoperiosteal and submucoperichondrial planes of both sides of the septum, and (3) subperiosteal and subperichondrial regions over the lower and upper cartilages and nasal bones","(1) Supraperiosteal planes lateral and medial to each ascending process of maxilla, (2) submucoperiosteal and submucoperichondrial planes of both sides of the septum, and (3) supraperiosteal and supraperichondrial regions over the lower and upper cartilages and nasal bones"],"k":"D","x":"","n":5},{"bn":56,"s":"The best form of topical anesthesia is:","o":["4% cocaine if the patient is sedated and has no cardiac issues, 0.05% oxymetazoline if the patient is under general anesthesia or has cardiac issues","4% cocaine in all scenarios, unless the patient has cardiac issues","0.05% oxymetazoline in all scenarios","4% cocaine if the patient is under general anesthesia and has no cardiac issues, 0.05% oxymetazoline if the patient is sedated or has cardiac issues"],"k":"A","x":"","n":6},{"bn":57,"s":"Which of the following is the recommended local anesthetic for ideal vasoconstriction and anesthesia in rhinoplasty?","o":["0.05% lidocaine in 1 : 200,000 epinephrine","0.05% lidocaine in 1 : 100,000 epinephrine","1% lidocaine in 1 : 100,000 epinephrine","1% lidocaine in 1 : 200,000 epinephrine"],"k":"C","x":"","n":7},{"bn":58,"s":"All of the following are MAJOR tip support mechanisms EXCEPT:","o":["Size, shape, and resiliency of medial and lateral crura","Attachment of the medial crural footplates to the caudal septal cartilage","Upper lateral cartilage attachment to the alar cartilage","Cartilaginous dorsum"],"k":"D","x":"","n":8},{"bn":59,"s":"All of the following are MINOR tip support mechanisms EXCEPT:","o":["Interdomal soft tissue","Alar cartilage attachment to skin and soft tissue","Vestibular skin","Membranous septum"],"k":"C","x":"","n":9},{"bn":60,"s":"All of the following are components of the lower lateral cartilages EXCEPT:","o":["Intermediate crura","Medial crura","Middle lamella","Lateral crura"],"k":"C","x":"","n":10},{"bn":61,"s":"All of the following are valid rhinoplasty incisionapproach combinations EXCEPT:","o":["Intercartilaginous → retrograde-eversion","Intercartilaginous → tip delivery","Intercartilaginous/marginal → tip delivery","Transcolumellar/marginal → tip delivery (external)"],"k":"B","x":"","n":11},{"bn":62,"s":"All of the following are possible indications for an OPEN approach to rhinoplasty EXCEPT:","o":["Septal extension grafting","Cleft lip complex deformities","Complex revision rhinoplasty","Mild tip bulbosity"],"k":"D","x":"","n":12},{"bn":63,"s":"In performing narrowing of the lateral crura of the lower lateral cartilages, it is best to maintain a width of at LEAST:","o":["3 to 5 mm","5 to 7 mm","7 to 9 mm","9 to 11 mm"],"k":"C","x":"","n":13},{"bn":64,"s":"Which of the following incision(s) can be used for tip “delivery”?","o":["Intercartilaginous/marginal","Transcartilaginous/marginal","Transcolumellar/marginal","a and c"],"k":"D","x":"","n":14},{"bn":65,"s":"Which of the following incision combinations is used for the open/external rhinoplasty approach?","o":["Intercartilaginous/marginal","Transcartilaginous/marginal","Marginal/transcolumellar","Intercartilaginous/transcartilaginous"],"k":"C","x":"","n":15},{"bn":66,"s":"All of the following are acceptable methods of enhancing tip projection EXCEPT:","o":["Spreader grafts","Columellar strut graft","Columellar plumping grafts","Medial crural binding sutures"],"k":"A","x":"","n":16},{"bn":67,"s":"Columellar plumping grafts are appropriate for all of the following EXCEPT:","o":["Enhancing tip support","Effacing an acute nasolabial angle","Enhancing tip definition","Treating a retraction or defects in the nasolabial angle"],"k":"C","x":"","n":17},{"bn":68,"s":"Which of the following best describes the components of the cartilaginous vault?","o":["Upper lateral cartilages","Upper lateral cartilages and lower lateral cartilages","Lower lateral cartilages and caudal septum","Upper lateral cartilages and dorsal quadrangular cartilage"],"k":"D","x":"","n":18 eral cartilages","Upper lateral cartilage and septal cartilage","Quadrangular cartilage only"],"k":"C","x":"","n":26},{"bn":77,"s":"Disruption of the mucoperiosteal flap between the upper lateral cartilages and septum is most likely to cause which of the following?","o":["Nasal airway obstruction","Saddle nose deformity","Increased risk of postoperative hematoma","Pollybeak deformity"],"k":"A","x":"","n":27},{"bn":78,"s":"The use of unilateral spreader grafting versus bilateral spreader grafting is best in all of the following EXCEPT:","o":["When there is bilateral nasal valve collapse","When there is dorsal deviation","When there is unilateral nasal valve narrowing","When there is localized disarticulation of the upper lateral cartilage from the nasal bone"],"k":"A","x":"","n":28},{"bn":79,"s":"Disarticulation of the upper lateral cartilage from the nasal bone in isolation can cause all of the following EXCEPT:","o":["Dorsal depression","Pollybeak deformity","Nasal valve collapse","A difficult surgical repair"],"k":"B","x":"","n":29},{"bn":80,"s":"All of the following are acceptable surgical tools for bony dorsal reduction EXCEPT:","o":["Rubin osteotome","Rasp","Jansen-Middleton forceps","Double-action Becker scissors"],"k":"C","x":"","n":30},{"bn":81,"s":"Which of the following best describes the optimal order for addressing the bony dorsum in rhinoplasty?","o":["(1) Osteotome reduction of hump, (2) rasping of irregularities, and (3) lateral osteotomies","(1) Rasping of irregularities, (2) osteotome reduction of hump, and (3) lateral osteotomies","(1) Lateral osteotomies, (2) osteotome reduction of hump, and (3) rasping of irregularities","(1) Lateral osteotomies, (2) rasping of irregularities, and (3) osteotome reduction of hump"],"k":"A","x":"","n":31},{"bn":82,"s":"Which of the following is LEAST ideal in reconstructing an overreduced bony dorsum?","o":["Expanded polytetrafluoroethylene implants","Reimplantation of the removed bony hump","Septal cartilage","Aur e was the driver and the airbag did not deploy. She struck her nasal root against the steering wheel, resulting in a comminuted NEC fracture. On examination, she has telecanthus and laxity of the medial canthal ligament, right more than left. Appropriate repair includes which of the following?","o":["Direct resuspension medially and superiorly","Rigid fixation of NEC bone fragments","Percutaneous resuspension of the medial canthal ligaments","Transnasal resuspension medially with slight overcorrection"],"k":"D","x":"","n":40},{"bn":91,"s":"In treating mandibular fractures, when prior attempts have been unsuccessful at achieving proper reduction and rigid fixation, which of the following is the best choice for fallback technique?","o":["External fixation","Lag screw technique","Mandibular reconstruction plate","Compression plating"],"k":"C","x":"","n":41},{"bn":92,"s":"Which of the following is an acceptable repair when fixing fracture of the mandibular angle?","o":["Load-bearing placement of a reconstruction plate","Load-sharing miniplate over the oblique line","Load-sharing repair with two miniplates at the angle","All of the above","None of the above"],"k":"D","x":"","n":42},{"bn":94,"s":"After a fall, an 86-year-old male is found to have mandibular fractures at the angle and parasymphyseal region. His edentulous mandible is noted to be atrophic. Which of the following is the best strategy for management?","o":["Load-bearing ORIF with bicortical plating","Load-sharing ORIF with monocortical miniplates","Removal of the bone fragment, because it is likely devitalized, and bone graft reconstruction","Positioning of dentures and MMF with screw fixation"],"k":"A","x":"","n":43},{"bn":95,"s":"Which of the following statements is correct when approaching panfacial fractures?","o":["It is helpful to repair each fracture individually.","Repair must proceed from the bottom up superiorly, with occlusion as the foundation.","Beginning with occlusion and then proceeding from stable to unstable allows for systematic repair.","Proceeding from the top down, create a stable central component and stabilize onto this foundation."],"k":"C","x":"","n":44},{"bn":96,"s":"Which of the following is the most common osseous complication?","o":["Pseudoarthrosis","Malunion","Nonunion","Osteomyelitis"],"k":"B","x":"","n":45},{"bn":97,"s":"Which of the following is the most common orbital complication?","o":["Hypoglobus","Enophthalmos","Ectropion","Entropion"],"k":"B","x":"","n":46},{"bn":98,"s":"Repair of mandible fractures from which of the following areas has the highest rate of complications?","o":["Symphysis","Angle","Body","Ramus"],"k":"B","x":"","n":47}]}];
const L='ABCDE';
let S={sel:new Set(DATA.map((_,i)=>i)),order:'book',list:[],pos:0,ans:{},multiPick:{}};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const id=(c,n)=>c+'-'+n;
function home(){
  document.body.querySelector('.nav')?.remove();
  const total=[...S.sel].reduce((a,c)=>a+DATA[c].q.length,0);
  $('#app').innerHTML=`<h1>Otolaryngology review MCQs</h1><p class="sub">${DATA.reduce((a,c)=>a+c.q.length,0)} single-best-answer questions from the review book (true/false and matching items left out), with the book's figures. Keys rechecked; staging per AJCC 8. Pick chapters, then start.</p>
  ${DATA.map((c,i)=>{const done=c.q.filter(q=>S.ans[id(i,q.n)]).length;return `<button class="chap ${S.sel.has(i)?'on':''}" onclick="tog(${i})" aria-pressed="${S.sel.has(i)}"><b>${c.t}</b>${done?`<span class="done">${done} done</span>`:''}<span>${c.q.length}</span></button>`}).join('')}
  <div class="row"><div class="seg" role="group" aria-label="Order"><button class="${S.order=='book'?'on':''}" onclick="S.order='book';home()">Book order</button><button class="${S.order=='shuf'?'on':''}" onclick="S.order='shuf';home()">Shuffled</button></div>
  <div class="seg"><button onclick="S.sel=new Set(DATA.map((_,i)=>i));home()">All</button><button onclick="S.sel=new Set();home()">None</button></div></div>
  <button class="primary" ${total?'':'disabled'} onclick="start()">Start ${total} questions</button>
  ${Object.keys(S.ans).length?`<div class="row"><button class="ghost" style="flex:1" onclick="results()">See results so far</button><button class="ghost" style="flex:1" onclick="if(confirm('Clear all answers?')){S.ans={};home()}">Clear answers</button></div>`:''}
  <p class="note" style="margin-top:18px">Answers are kept while this page is open. Tap any figure to enlarge.</p>`;
  scrollTo(0,0);
}
function tog(i){S.sel.has(i)?S.sel.delete(i):S.sel.add(i);home()}
function start(list){
  if(!list){list=[];[...S.sel].sort().forEach(c=>DATA[c].q.forEach(q=>list.push([c,q.n])));
    if(S.order=='shuf')for(let i=list.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[list[i],list[j]]=[list[j],list[i]]}}
  S.list=list;S.pos=0;const f=list.findIndex(([c,n])=>!S.ans[id(c,n)]);if(f>0)S.pos=f;show();
}
function score(){let a=0,r=0;S.list.forEach(([c,n])=>{const x=S.ans[id(c,n)];if(x){a++;if(x.ok)r++}});return{a,r}}
function show(){
  const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const A=S.ans[id(c,n)];const {a,r}=score();
  const pick=S.multiPick[id(c,n)]||new Set();
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="home()" aria-label="Back to chapters">Chapters</button><span class="t">${DATA[c].t}</span><span class="sc">${r}/${a}</span></div><div class="bar"><i style="width:${(S.pos+1)/S.list.length*100}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${S.list.length} &nbsp;·&nbsp; Book Q${q.bn||n}</div><p class="stem" style="white-space:pre-line">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${n}" onclick="zoom(this.src)">`).join('')}</div>`;
  if(q.m)h+=`<p class="note">More than one answer. Select all that apply, then check.</p>`;
  q.o.forEach((t,i)=>{const l=L[i];let cl='';
    if(A){if(q.k.includes(l))cl='ok';else if(A.pick.includes(l))cl='bad'}else if(pick.has(l))cl='sel';
    h+=`<button class="opt ${cl}" ${A?'disabled':''} onclick="choose('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(q.m&&!A)h+=`<button class="primary" style="margin-top:6px" ${pick.size?'':'disabled'} onclick="check()">Check answer</button>`;
  if(A){h+=`<div class="exp"><h3 class="${A.ok?'ok':'bad'}">${A.ok?'Correct':'Incorrect'} — answer ${q.k.split('').join(', ')}</h3>`;
    if(q.f)h+=`<div class="flag">${esc(q.f)}</div>`;
    h+=q.x?q.x.split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join(''):`<p class="note" style="margin:0">Key only — the book gives no explanation.</p>`;
    if(q.xi)h+=q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join('');
    h+=`</div>`}
  $('#app').innerHTML=h;
  let nav=document.querySelector('.nav');if(!nav){nav=document.createElement('div');nav.className='nav';document.body.appendChild(nav)}
  const last=S.pos==S.list.length-1;
  nav.innerHTML=`<div class="navi"><button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Jump</button><button class="primary" onclick="${last?'results()':'go(1)'}">${last?'Finish':'Next'}</button></div>`;
  scrollTo(0,0);
}
function choose(l){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);if(S.ans[k])return;
  if(q.m){const p=S.multiPick[k]||new Set();p.has(l)?p.delete(l):p.add(l);S.multiPick[k]=p;const y=scrollY;show();scrollTo(0,y);return}
  S.ans[k]={pick:[l],ok:l==q.k};const y=scrollY;show();scrollTo(0,y)}
function check(){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);const p=[...S.multiPick[k]].sort().join('');
  S.ans[k]={pick:p.split(''),ok:p==q.k};const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(S.list.length-1,S.pos+d));show()}
function grid(){const d=$('#dlg');
  d.innerHTML=`<b>Jump to question</b><div class="grid">${S.list.map(([c,n],i)=>{const a=S.ans[id(c,n)];return `<button class="${a?(a.ok?'g-ok':'g-bad'):''} ${i==S.pos?'g-cur':''}" onclick="S.pos=${i};$('#dlg').close();show()">${i+1}</button>`}).join('')}</div><button class="ghost" style="width:100%;margin-top:8px" onclick="$('#dlg').close()">Close</button>`;
  d.showModal()}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
function results(){
  document.querySelector('.nav')?.remove();
  let rows='',ta=0,tr=0,wrong=[];
  DATA.forEach((c,ci)=>{let a=0,r=0;c.q.forEach(q=>{const x=S.ans[id(ci,q.n)];if(x){a++;if(x.ok)r++;else wrong.push([ci,q.n])}});
    ta+=a;tr+=r;if(a)rows+=`<tr><td>${c.t}</td><td>${r}/${a} · ${Math.round(r/a*100)}%</td></tr>`});
  $('#app').innerHTML=`<h1>Results</h1><div class="big">${ta?Math.round(tr/ta*100):0}%</div><p class="sub">${tr} correct of ${ta} answered</p>
  <table>${rows||'<tr><td>No answers yet</td><td></td></tr>'}</table>
  ${wrong.length?`<button class="primary" onclick="redo()">Retry ${wrong.length} incorrect</button>`:''}
  <div class="row"><button class="ghost" style="flex:1" onclick="home()">Back to chapters</button></div>`;
  S.wrong=wrong;scrollTo(0,0)}
function redo(){S.wrong.forEach(([c,n])=>{delete S.ans[id(c,n)];delete S.multiPick[id(c,n)]});start(S.wrong.slice())}
document.addEventListener('keydown',e=>{if($('#dlg').open||!document.querySelector('.nav'))return;
  if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else if('abcde'.includes(e.key.toLowerCase())&&e.key.length==1)choose(e.key.toUpperCase())});
home();
</script></body></html>
