<html lang="en"><head><meta charset="utf-8">

<title>ENT Part II Exam 2024 — Answered &amp; Referenced</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--amber:#B06A00;--amber-soft:#FBEFD9;--box:#0B1418;--on-teal:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--amber:#E8A94A;--amber-soft:#3A2C14;--box:#000;--on-teal:#06201F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td:last-child{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px 8px;text-align:center}
.seg button.on{background:var(--teal);color:var(--on-teal);font-weight:600}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note{font-size:.9rem;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.timer{font:700 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.topi .t{flex:1;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.flagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
.flagbtn.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.qn{font-weight:600;font-size:.9rem;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{opacity:1}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}.exp h3.na{color:var(--amber)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;position:relative}
.grid .ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.grid .flg{box-shadow:inset 0 0 0 2px var(--amber)}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-na{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid .cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.legend .a::before{background:var(--teal-soft);border-color:var(--teal)}.legend .f::before{box-shadow:inset 0 0 0 2px var(--amber)}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3.2rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>button{flex:1}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--teal)}
</style></head><body>

<script>
const PAPERS=[{"title":"2024 Exam · Paper 1","q":[{"s":"A 12-year-old girl had recurrent laryngeal papillomatosis and had multiple endoscopic CO2 laser excisions of the papillomas. Which one of the following should be considered in addition to surgery to reduce future recurrence?","o":["Cidofovir","Steroid","Cetuximab","Cisplatin"],"k":"A","x":"Adjuvant intralesional cidofovir is the classic adjuvant for frequently recurring RRP; systemic/intralesional bevacizumab and the HPV vaccine are newer options (Cummings, RRP).","src":"2024 exam recall · Paper 1 · Q1","d":"Paediatric"},{"s":"A 15-year-old boy presented with diplopia and proptosis, examination and investigation revealed fibrous dysplasia of the orbital rim and maxillary sinus. Which one of the following is the best treatment","o":["Radical maxillectomy and radiotherapy","Maxillectomy and orbital exenteration with palatal prosthesis","Partial excision with contouring of the involved area","Maxillectomy with microvascular osteocutaneous flap"],"k":"C","x":"Fibrous dysplasia is benign and self-limiting after puberty; symptomatic craniofacial lesions are treated by conservative contouring or partial excision, with optic decompression only for visual compromise. Radical resection is not indicated (Ballenger).","src":"2024 exam recall · Paper 1 · Q2 (source tag: Ballenger)","d":"Paediatric"},{"s":"A 6-year-old child presented with hypernasality; Examination revealed a bifid uvula What is the most appropriate treatment","o":["Adenoidectomy","Tonsillectomy","Observation","Speech therapy"],"k":"D","x":"Of these options, speech therapy is first: hypernasality with a bifid uvula suggests a submucous cleft with VPI, assessed by nasendoscopy and videofluoroscopy, with Furlow palatoplasty or pharyngoplasty if VPI persists. Adenoidectomy is contraindicated as it worsens VPI (Cummings).","src":"2024 exam recall · Paper 1 · Q3","d":"Paediatric"},{"s":"a 40 years-old woman underwent Type II laser cordectomy for SCC Which one of the following best describes type II laser cordectomy","o":["Subligamental","Transmuscular","Subepithelial","Transmucosal"],"k":"A","x":"ELS endoscopic cordectomy classification: type I subepithelial, II subligamental, III transmuscular, IV total, V extended (Remacle; Cummings).","src":"2024 exam recall · Paper 1 · Q4","d":"Laryngology"},{"s":"A 6-year-old boy has large cystic in the floor of mouth. The Mass has been aspired many times but always reoccur. What is the most likely diagnosis","o":["Tooth Cyst","Cystic lymphangioma","Thyroglossal duct cyst","Ranula"],"k":"D","x":"A floor-of-mouth cyst that recurs after repeated aspiration is a ranula (mucus extravasation from the sublingual gland); cure requires sublingual gland excision (Scott-Brown).","src":"2024 exam recall · Paper 1 · Q5","d":"Paediatric"},{"s":"A 42 your old presented with right OME and nasal obstruction, nasal endoscopy revealed nasopharyngeal mass. Biopsy proved poorly differentiated SCC. CT scan showing extension into the parapharyngeal space. What is the best treatment","o":["Concurrent chemoradiation","Adjuvant chemoradiation","Induction chemotherapy and radiotherapy","Surgery and postoperative radiotherapy"],"k":"A","x":"NPC with parapharyngeal extension (T2) is treated with concurrent cisplatin chemoradiation (± induction); surgery has no primary role (NCCN).","src":"2024 exam recall · Paper 1 · Q6","d":"Rhinology"},{"s":"A one year old diagnosed with aural atresia, Which one of the following anomalies In the course of facial nerve is the most commonly associated with the atresia","o":["Posteriorly displaced mastoid segment","Dehiscent mastoid segment","Anteriorly displaced mastoid segment","A bifurcated nerve trunk"],"k":"C","x":"In congenital aural atresia the mastoid (vertical) segment of the facial nerve is typically displaced anteriorly and laterally, putting it at risk during atresiaplasty (Bailey; Jahrsdoerfer).","src":"2024 exam recall · Paper 1 · Q7 (source tag: Bailey (old ed.))","d":"Otology"},{"s":"A 60 years old woman presented with a left ear CHL for months. She had treated with antibiotics with no improvement. Otoscopic examination revealed middle ear effusion. Myringotomy with grommet insertion was performed. She developed persistent, Copious otorrhea. Which one of the following pathologies would be the most likely cause","o":["Fungal external otitis","Chronic suppurative otitis media","Cerebrospinal fluid leak","Chronic serous otitis media"],"k":"C","x":"⚑ No answer was marked in the recall; answer supplied from the references. — Persistent copious watery otorrhoea after grommet insertion for \"OME\" in an adult should raise suspicion of a spontaneous CSF leak (tegmen defect/encephalocele) presenting as effusion; test the fluid for β2-transferrin and image the tegmen (Brackmann; Cummings).","src":"2024 exam recall · Paper 1 · Q8 (source tag: Brackmann)","d":"Otology"},{"s":"A 7 year old boy diagnosed with type 3 laryngomalacia Which one of the following is the beat treatment option","o":["CO2 laser resection of aryepiglottic folds","CO2 laser resection of redundant arytenoid mucosa","Tracheostomy","Epiglottopexy"],"k":"D","x":"Type 3 laryngomalacia (posterior collapse of the epiglottis over the glottis) is treated with epiglottopexy; type 1 with arytenoid mucosa trimming and type 2 with division of short aryepiglottic folds (Cummings).","src":"2024 exam recall · Paper 1 · Q9","d":"Paediatric"},{"s":"A 40-year old woman presented with episodic severe vertigo lasting for seconds which to aggravated by head movement. Neurological and ENT examination were normal. Which one of the following is the most diagnostic test?","o":["Posturography","Dix-Hallpike","Video Head Impulse","Videonystagmography"],"k":"B","x":"Brief positional vertigo with a normal examination suggests BPPV; the Dix–Hallpike test (torsional upbeat nystagmus) is diagnostic for posterior canal BPPV (AAO-HNS BPPV guideline).","src":"2024 exam recall · Paper 1 · Q10","d":"Otology"},{"s":"A 16-year old boy presented with recurrent epistaxis. Endoscopic examination revealed a red postnasal mass suggestive of angiofibroma, Which one of the imaging signs is pathognomonic for this condition","o":["Antral pad","Holman Miller","Target","Panda"],"k":"B","x":"The Holman–Miller sign (anterior bowing of the posterior maxillary wall) on CT is characteristic of juvenile nasopharyngeal angiofibroma arising at the sphenopalatine foramen (Scott-Brown).","src":"2024 exam recall · Paper 1 · Q11","d":"Paediatric"},{"s":"An elderly man presented with progressive dysphagia to solids for the past 2 years with frequent attacks of aspiration. Fiberoptic laryngoscopy revealed an anteriorly displaced larynx and a significant bulge of the posterior pharyngeal wall covered by normal mucosa, extending from the level of the epiglottis to the retroarytenoid area; both arytenoids were freely mobile. What is the most likely diagnosis?","o":["Severe cervical spondylosis","Retropharyngeal abscess","Zenker's diverticulum","post cricoid carcinoma"],"k":"A","x":"⚑ The recall marked A and C. — A smooth posterior pharyngeal wall bulge under normal mucosa that pushes the larynx forward, with slowly progressive dysphagia and aspiration and mobile arytenoids, indicates large anterior cervical osteophytes (cervical spondylosis/DISH, Forestier disease). A Zenker diverticulum does not produce a submucosal bulge (Cummings). Age missing in the recall; stem tidied.","src":"2024 exam recall · Paper 1 · Q12","d":"Laryngology"},{"s":"A 20-year-old women she is scheduled for septoplasty She gave a history of valvular heart surgery and she taken warfarin for 2 years, Which one of the following INR is recommended before the surgery?","o":["2","2.5","1.8","1.5"],"k":"D","x":"⚑ Key corrected — recalled answer: B; updated answer: D. — For elective surgery the INR should be ≤1.5. Patients with a mechanical valve on warfarin need bridging (stop warfarin about 5 days before and use LMWH/heparin) under cardiology guidance. An INR of 2–2.5 is therapeutic, not safe for surgery (ACCP perioperative guideline).","src":"2024 exam recall · Paper 1 · Q13","d":"Rhinology"},{"s":"A 36 year old man suffering from unilateral nasal obstruction with discharge and contrast Paranasal CT scan revealed a maxillary sinus fungus ball. Which one of the following is the most appropriate management?","o":["Voriconazole","Amphotericin B","Endoscopic medial maxillectomy","Middle meatus antrostomy"],"k":"D","x":"A maxillary fungus ball (non-invasive mycetoma) is cured by endoscopic middle meatal antrostomy with complete removal and irrigation; antifungals are not required (EPOS; Cummings).","src":"2024 exam recall · Paper 1 · Q14","d":"Rhinology"},{"s":"20-year-old woman diagnosed with posterior glottic stenosis after prolonged intubation Which one of the following is the best treatment option?","o":["Anterior and posterior cricoid split with cartilage interposition","Cricotracheal resection","Posterior cordectomy","Posterior cricoid split with cartilage interposition"],"k":"D","x":"Posterior glottic stenosis with interarytenoid scar (Bogdasarian III–IV) is treated by posterior cricoid split with a costal cartilage graft to widen the posterior glottis; cricotracheal resection is for subglottic stenosis (Cummings).","src":"2024 exam recall · Paper 1 · Q15","d":"Laryngology"},{"s":"A 12 year old boy presented with facial asymmetry CT scan relieved features of fibrous dysplasia Which one of the following radiological features are suggestive of the mentioned pathology","o":["Expansile intramedullary lesion with well-defined cortical borders","Well-defined intramedullary lesion with ill-defined cortical borders","Destructive cortical borders","Destructive intramedullary lesion"],"k":"A","x":"On CT, fibrous dysplasia is an expansile intramedullary lesion with ground-glass matrix and a thinned but intact, well-defined cortex; destruction suggests malignancy (Cummings).","src":"2024 exam recall · Paper 1 · Q16","d":"Paediatric"},{"s":"Which one of the following may damage during removal of cholesteatoma form sinus tympani","o":["Crus commune","Lateral semicircular canal ampulla","Superior semicircular canal ampulla","Posterior semicircular canal ampulla"],"k":"D","x":"⚑ No answer was marked in the recall; answer supplied from the references. — The sinus tympani lies directly lateral to the posterior semicircular canal and its ampulla, so overly deep curettage in the sinus tympani can open the posterior canal (Brackmann; Scott-Brown).","src":"2024 exam recall · Paper 1 · Q17","d":"Otology"},{"s":"67 year old diabetic pt presents with severe right ear pain, physical examination showed granulation tissue in the right ear canal with right facial nerve paralysis, What is the first line in the investigation?","o":["Technetium scan","MRI","CT Scan","Gallium scan"],"k":"C","x":"⚑ Key corrected — recalled answer: A; updated answer: C. — Modern practice uses high-resolution CT as the first-line investigation in suspected necrotizing (malignant) otitis externa (bone erosion, extent), with MRI for soft tissue/skull base spread. Tc-99 is sensitive but non-specific, and gallium/SPECT is used for follow-up (Cummings; Scott-Brown).","src":"2024 exam recall · Paper 1 · Q18","d":"Otology"},{"s":"A case with meningitis get profound SNHL. What is the maximum period following infection in which the cochlear implant should be performed?","o":["4 weeks","8 weeks","6 weeks","2 weeks"],"k":"B","x":"⚑ No answer was marked in the recall; answer supplied from the references. Timing advice varies; most sources stress implanting as early as possible (within weeks to about 2 months) because ossification can start early. — Labyrinthitis ossificans can begin within weeks of bacterial meningitis; implantation should be done as early as possible, ideally within about 8 weeks, after CT/MRI confirms a patent cochlea (Cummings, Cochlear Implantation).","src":"2024 exam recall · Paper 1 · Q19","d":"Otology"},{"s":"Endoscopy have shown mass that occupying the entire nasal cavity. CT scan shows a homogeneous mass filling the left maxillary sinus with widening of osteometal complex. What is the most likely diagnosis?","o":["Mucocele","Antrochoanal polyp","Angiofibroma","Inverted Papilloma"],"k":"B","x":"A homogeneous mass filling the maxillary sinus, extending through a widened accessory ostium/OMC into the nasal cavity and choana, is an antrochoanal polyp (Scott-Brown).","src":"2024 exam recall · Paper 1 · Q20","d":"Rhinology"},{"s":"While performing FESS, a clear fluid was noticed coming from the lateral lamellae of the cribriform plate. What is the most appropriate intervention","o":["Stop surgery, wake the patient up and see if the clear fluid continues","Inject intrathecal fluorescein to confirm the presence of a CSF leak","Continue the surgery, then pack the nose with a tampon for 48 hours","Perform intraoperative local repair of a possible CSF leak"],"k":"D","x":"A CSF leak recognized during FESS should be repaired immediately (multilayer graft/flap) once the site is identified; repair at the time of injury has success above 90% (Oxford Handbook; Cummings).","src":"2024 exam recall · Paper 1 · Q21 (source tag: Oxford SBA)","d":"Rhinology"},{"s":"A 40-year-old woman presented with symptoms suggestive of acute sinusitis. She takes beta lactam antibiotic without improvement. Which one of the following is the best therapeutic option?","o":["Levofloxacin","Imipenem","Cefuroxime","Ceftriaxone"],"k":"A","x":"If acute bacterial rhinosinusitis fails a β-lactam (amoxicillin), switch to high-dose amoxicillin–clavulanate or a respiratory fluoroquinolone (levofloxacin/moxifloxacin) (IDSA 2012; AAO-HNS adult sinusitis guideline).","src":"2024 exam recall · Paper 1 · Q22","d":"Rhinology"},{"s":"A woman had floor of mouth squamous cell carcinoma and underwent excision with bilateral neck dissection. Which one of the following factors is the most important predictor of tumour recurrence in the neck following the neck dissection?","o":["Lymphovascular invasion","Number of histologically positive lymph nodes","Extracapsular extension of tumor","Positive nodes at level II & III"],"k":"C","x":"Extracapsular (extranodal) extension is the most powerful predictor of neck recurrence and survival after neck dissection, and the main indication for adjuvant chemoradiation (Bailey; NCCN).","src":"2024 exam recall · Paper 1 · Q23 (source tag: Bailey (old ed.))","d":"Head & Neck"},{"s":"A 50 year old man had tonsillar carcinoma 1 year back that were treated with chemoradiation. He presented with a tongue growth. The biopsy of lesion came as squamous cell carcinoma. This tongue cancer is considered as","o":["Metachronous second primary","Synchronous second primary","Recurrence","Metastasis"],"k":"A","x":"A new primary arising more than 6 months after the index tumour is metachronous; within 6 months it is synchronous (Warren & Gates; Hong criteria).","src":"2024 exam recall · Paper 1 · Q24","d":"Head & Neck"},{"s":"A 25 year old man complaining of nystagmus following severe head injury causing destruction of Right labyrinth . What is the direction of nystagmus?","o":["Upward","Right side","Left side","Rotatory"],"k":"C","x":"Destruction of the right labyrinth leaves the left vestibular tone unopposed, so the slow phase drifts right and the fast phase beats to the left (Scott-Brown).","src":"2024 exam recall · Paper 1 · Q25","d":"Otology"},{"s":"A 55-year old man scheduled for hemiglossoectomy and type 2 it modified radical neck dissection, in this type of neck dissection which of the following nonlymphatic structures are preserved?","o":["Spinal accessory nerve and internal jugular vein","Spinal accessory nerve and sternocleidomastoid muscle","Internal jugular vein and spinal nerves","Internal Jugular vein and sternocleidomastoid muscle"],"k":"A","x":"Medina modified radical neck dissection: type I preserves XI; type II preserves XI and IJV; type III preserves XI, IJV and SCM (Shah).","src":"2024 exam recall · Paper 1 · Q26","d":"Head & Neck"},{"s":"A 50 year old man underwent a biopsy of a vocal cord lesion The final histopathology came on carcinoma in situ (CIS). Which one of the following is the best treatment option?","o":["Radiotherapy","Observation","Type II laser cordectomy","Mucosal striping"],"k":"D","x":"Vocal fold carcinoma in situ is treated by mucosal stripping/subepithelial excision (type I cordectomy), with close follow-up; radiotherapy is for recurrence or diffuse disease (Cummings).","src":"2024 exam recall · Paper 1 · Q27","d":"Laryngology"},{"s":"40 year old man diagnosed with stage 3 glottic carcinoma (T3N0M0) and scheduled for supracricoid partial laryngectomy: Which one of the following is a contraindication of doing this surgery?","o":["Thyroid cartilage inner cortex invasion","Intact subglottic area","One mobile cricoarytenoid joint","Pre-epiglottic space invasion"],"k":"D","x":"⚑ Key corrected — recalled answer: C; updated answer: D. — Supracricoid laryngectomy requires at least one mobile cricoarytenoid unit, so option C is a prerequisite, not a contraindication. Contraindications include extensive pre-epiglottic space invasion (for CHEP), outer thyroid perichondrium breach, cricoid invasion, and subglottic extension of more than 10 mm anteriorly or 5 mm posteriorly (Cummings).","src":"2024 exam recall · Paper 1 · Q28","d":"Laryngology"},{"s":"A patient presented with submandibular swelling for a week, aggravated by meals. Examination revealed a tender swollen submandibular gland with pus coming out of Wharton’s duct. Which one of the following is the first step in management?","o":["Submandibular gland excision","Sialoendoscopy","NSAID","IV antibiotics"],"k":"D","x":"Acute suppurative submandibular sialadenitis with pus from the duct is treated first with IV antistaphylococcal antibiotics, hydration, sialogogues and massage; sialendoscopy and excision come later for recurrence (Cummings).","src":"2024 exam recall · Paper 1 · Q29","d":"Others"},{"s":"2 years old boy presented to emergency department with a febrile convulsion he has a history of recurrent acute Otitis media, Otoscopic examination revealed congested tympanic membrane bilaterally. Which one of the following is your next step in the management?","o":["Lumbar puncture with CSF analysis","MRI","Contrast brain CT scan","Temporal bone CT scan"],"k":"D","x":"⚑ Debatable item: if meningitis is suspected clinically, lumbar puncture is required (after imaging if focal signs). The recalled key (temporal bone CT) is kept. — A febrile seizure with bilateral AOM in a 2-year-old most often reflects a simple febrile convulsion. If an otogenic intracranial complication is suspected, imaging (temporal bone/contrast CT) comes before lumbar puncture (Scott-Brown, Complications of Otitis Media).","src":"2024 exam recall · Paper 1 · Q30","d":"Paediatric"},{"s":"A 37-year-old man with a 4-month history of anosmia but he can detect ammonia flavor Which one of following cranial nerves is responsible for this","o":["Olfactory","Trigeminal","Vagus","Glossopharyngeal"],"k":"B","x":"Ammonia and other irritants stimulate intranasal trigeminal free nerve endings, so they are detected even in olfactory anosmia; a response to ammonia but not to pure odorants suggests true anosmia, while no response raises malingering (Oxford Handbook).","src":"2024 exam recall · Paper 1 · Q31 (source tag: Oxford SBA)","d":"Rhinology"},{"s":"A 4-year-old boy presented with fever, sore throat and torticollis. He was found to have a retropharyngeal space abscess and scheduled for incision and drainage. Which of the following forms the boundaries of this space","o":["Buccopharyngeal fascia anteriorly, carotid sheath laterally, prevertebral fascia posteriorly","Hyoid bone inferiorly, skull base superiorly, masticator and parotid spaces laterally","Buccopharyngeal fascia anteriorly, parotid glands laterally, alar fascia posteriorly","Skull base superiorly, diaphragm inferiorly, alar fascia anteriorly, prevertebral fascia"],"k":"A","x":"The retropharyngeal space lies between the buccopharyngeal (visceral) fascia anteriorly and the alar fascia posteriorly, bounded laterally by the carotid sheaths, from the skull base to about T1–T2 (Cummings, Deep Neck Spaces).","src":"2024 exam recall · Paper 1 · Q32","d":"Paediatric"},{"s":"A 50-year-old man presented with an ulcer in the right buccal mucosa. Examination revealed a 4 x 5 cm ulceroproliferative growth in buccal mucosa extending into the gingivobuccal sulcus and abutting the mandible. There is no palpable lymph nodes on neck examination. Biopsy proved a well differentiated squamous cell carcinoma. Which of the following is the best treatment option?","o":["Wide local excision with level I-IV neck dissection and reconstruction with antrolateral thigh free flap","Wide local excision with segmental mandibuloectomy, level I-III neck dissection and reconstruction with radial forearm free flap","Wide local excision with marginal mandibuloectorny, level I-III neck dissection and reconstruction with radial forearm free flap","Wide local excision with level I-V neck dissection and reconstruction with anterolateral thigh"],"k":"C","x":"A 4–5 cm buccal SCC extending into the gingivobuccal sulcus and abutting (not invading) the mandible needs wide excision with marginal mandibulectomy, elective neck dissection (I–III/IV) and flap reconstruction; segmental resection is for gross bone invasion (Shah; NCCN).","src":"2024 exam recall · Paper 1 · Q33","d":"Head & Neck"},{"s":"A 45 year old woman diagnosed with stage III (T2 N1M0) right buccal squamous cell carcinoma (SCC). What is the best definition of a T2 buccal SCC","o":["More than 4 cm sized lesion and DOI between 0.5-1.0 cm","3.5 cm sized lesion with DOI between 0.8-1.5 cm","≤2 cm in maximum size with DOI between 0.5-1.0 cm","1.2-4 cm sized lesion and DOI (depth of invasion) >1.0 cm"],"k":"C","x":"AJCC 8 oral cavity T2: ≤2 cm with depth of invasion >5 mm and ≤10 mm, or >2 cm but ≤4 cm with DOI ≤10 mm. DOI >10 mm makes it T3 (AJCC 8).","src":"2024 exam recall · Paper 1 · Q34","d":"Head & Neck"},{"s":"A 71 year old presented with a complaints of recent sudden attacks of loss of balance following upper respiratory tract infection. He has the sensation that surrounding environment is spinning, associated with nausea and vomiting. There is no history of hearing loss or tinnitus. Which one of the following is the most likely diagnosis?","o":["Cerebrovascular accident","Meniere's disease","Vestibular neuronitis","Paroxysmal positional vertigo"],"k":"C","x":"Acute rotatory vertigo with nausea after a URTI, without hearing loss or neurological signs, is vestibular neuronitis (Scott-Brown).","src":"2024 exam recall · Paper 1 · Q35","d":"Otology"},{"s":"A 41 year old man have road traffic accident brought to emergency department with dyspnea, Neck examination revealed swelling with crepitus. The swelling is progressively increasing. Which one of the following is the best management option?","o":["Close observation","Endotracheal intubation","Cardiothoracic referral","Urgent CT scan"],"k":"B","x":"⚑ Key corrected — recalled answer: D; updated answer: B. — Penetrating or blunt neck trauma with dyspnoea and an expanding swelling with crepitus (airway or vascular injury) mandates securing the airway first (intubation, or awake tracheostomy if laryngeal disruption) before CT (ATLS; Cummings, Laryngeal Trauma).","src":"2024 exam recall · Paper 1 · Q36","d":"Head & Neck"},{"s":"A 3 year old bay diagnosed with, severe grade 3 subglottic stenosis post prolonged intubation Which one of the following is the best site for the placement of tracheostomy?","o":["Between cricoid cartilage and first tracheal ring","Between the 3rd and 4th tracheal rings","Through the cricoid cartilage","Between the cricoid and thyroid cartilages"],"k":"B","x":"⚑ Key corrected — recalled answer: A; updated answer: B. — A tracheostomy should be placed through the 2nd–4th tracheal rings, below the stenosis, preserving the first ring and cricoid for later laryngotracheal reconstruction. Placing it at the cricoid/first ring increases subglottic stenosis (Cummings, Pediatric Airway).","src":"2024 exam recall · Paper 1 · Q37","d":"Paediatric"},{"s":"What is the most likely cause of a sudden hoarseness which developed followed pop singing?","o":["Vocal cord hemorrhage","Functional dysphonia","Vocal cord paralysis","Vocal cord nodule"],"k":"A","x":"Sudden hoarseness during forceful singing is typical of vocal fold haemorrhage (submucosal capillary rupture); it needs strict voice rest and stroboscopic follow-up (Cummings).","src":"2024 exam recall · Paper 1 · Q38","d":"Laryngology"},{"s":"A 77-year-old woman presented with asymmetric sensorineural hearing lose. What is the most important step in her evaluation","o":["Otoacoustic emission","CPA MRI","PET-CT","Brain CT scan"],"k":"B","x":"Asymmetric SNHL requires MRI of the IAC/CPA to exclude vestibular schwannoma (Bailey; AAO-HNS).","src":"2024 exam recall · Paper 1 · Q39 (source tag: Bailey (current ed.))","d":"Otology"},{"s":"A 60-year-old man presented with severe pain of the right ear and sudden onset of facial palsy of the same side. On examination, the tympanic membrane was red in color with numerous vesicles in external auditory canal. What is the most likely diagnosis?","o":["Acute otitis media","Herpes zoster oticus","Furunculosis","Myringitis bullosa"],"k":"B","x":"Severe otalgia, vesicles in the canal/on the TM and facial palsy is Ramsay Hunt syndrome (herpes zoster oticus) (Scott-Brown).","src":"2024 exam recall · Paper 1 · Q40","d":"Otology"},{"s":"A 69-year-old man smoker and alcohol consumer presented with a growth in right posterolateral border of the tongue. Biopsy proved a squamous cell carcinoma. Which one following is the best imaging study","o":["CT scan","PET scan","MRI scan","Angiography"],"k":"C","x":"MRI best shows the soft-tissue extent and depth of invasion of oral tongue SCC; CT is complementary for bone and nodes (NCCN; Bailey).","src":"2024 exam recall · Paper 1 · Q41","d":"Head & Neck"},{"s":"Which of the following tympanic membrane grafting techniques is most likely to cause tympanic membrane blanting?","o":["Fat","On-lay","Under-lay","Cartilage"],"k":"B","x":"Onlay (lateral) grafting is associated with anterior blunting, lateralization and epithelial pearls; underlay grafts risk medialization (Brackmann).","src":"2024 exam recall · Paper 1 · Q42","d":"Otology"},{"s":"A 45-year-old woman known case of sarcoidosis, presented to the outpatient clinic with change of voice and occasional history of blood-stained secretions. She is suspected to have laryngeal sarcoidosis. What is the most common laryngeal site of involvement in sarcoidosis","o":["True vocal cord","Anterior commissure","Subglottic","Supraglottic"],"k":"D","x":"Laryngeal sarcoidosis classically involves the supraglottis (epiglottis, aryepiglottic folds), giving pale, diffuse \"turban\" oedema (Cummings).","src":"2024 exam recall · Paper 1 · Q43 (source tag: Bailey (current ed.))","d":"Laryngology"},{"s":"A 50-year-old man scheduled to wide resection of tongue squamous cell carcinoma with marginal mandibulectomy and neck dissection, which one of the following is a contraindication of doing marginal mandibulectomy?","o":["Paramandibular disease","Positive neck nodes","Periosteum infiltration","Previous oral surgery"],"k":"A","x":"⚑ Key corrected — recalled answer: B; updated answer: A. — Marginal mandibulectomy is appropriate when tumour abuts or minimally involves the periosteum/alveolar crest. Gross bone invasion, invasion of the mandibular canal or extensive paramandibular soft-tissue disease requires segmental resection. Positive neck nodes are not a contraindication (Shah; Cummings).","src":"2024 exam recall · Paper 1 · Q44","d":"Head & Neck"},{"s":"a 20-year-old man presented with right painful discharging ear on further questioning the pain located inside the ear and the ipsilateral eye microscopic examination revealed TM perforation and mucopurulent discharge. What is the most likely underlying cause do you suspect","o":["Petrositis","Mastoiditis","Otitis externa","Brain abscess"],"k":"A","x":"Deep ear and retro-orbital pain with otorrhoea suggests petrous apicitis (Gradenigo syndrome: otorrhoea, retro-orbital pain, VI palsy) (Scott-Brown).","src":"2024 exam recall · Paper 1 · Q45 (source tag: Brackmann)","d":"Otology"},{"s":"A 52-year-old man diagnosed with base of tongue squamous cell carcinoma on palliative radiation presented with a severe persistent bleeding from the tumor site which is not controlled with cauterization. Which one of the following is the next step in the management?","o":["External carotid artery ligation","Common carotid artery ligation","Lingual artery ligation","Embolization"],"k":"D","x":"⚑ Key corrected — recalled answer: C; updated answer: D. — Uncontrolled tumour bleeding from the base of tongue in a palliative patient is best managed by angiography and selective embolization of the lingual/external carotid branches; ligation is a fallback (Cummings, Carotid Blowout).","src":"2024 exam recall · Paper 1 · Q46","d":"Head & Neck"},{"s":"a 25-year-old man diagnosed with bell's palsy (grade 5 HB) 5 year ago and managed accordingly with no improvement One year back he developed progressive sensorineural hearing loss and instability. What is the most likely diagnosis?","o":["Vascular loop","Polyneuropathy","Vestibular Schwannoma","Congenital cholesteatoma"],"k":"C","x":"A \"Bell palsy\" that never recovers, followed by SNHL and imbalance, mandates MRI. A neoplasm (vestibular or facial schwannoma) along the IAC/CPA is most likely (Cummings).","src":"2024 exam recall · Paper 1 · Q47","d":"Otology"},{"s":"a 2-year-old girl presented with right ear discharge and mastoid swelling. examination revealed a purple skin rash in the diaper area, Urine analysis showed a specific gravity of 1009. Which one of pathologies is the most likely diagnosis?","o":["Rhabdomyosarcoma","Histiocytosis","Congenital cholesteatoma","Acute mastoiditis"],"k":"B","x":"Otorrhoea and mastoid swelling, a seborrhoeic/purpuric diaper-area rash and dilute urine (diabetes insipidus) in a toddler indicate Langerhans cell histiocytosis (Scott-Brown).","src":"2024 exam recall · Paper 1 · Q48","d":"Paediatric"},{"s":"A 3 year old boy had neck swelling since birth that has recently grown in size examination revealed a multicystic mass at level V. CT scan revealed a multi- lobulated cyst. Which one of the following is the most likely diagnosis?","o":["Hemangioma","Dermoid cyst","Cystic hygroma","Thyroglossal duct cyst"],"k":"C","x":"A multiloculated cystic mass in the posterior triangle, present since birth and enlarging (often after infection or haemorrhage), is a cystic hygroma (lymphatic malformation) (Cummings).","src":"2024 exam recall · Paper 1 · Q49","d":"Paediatric"},{"s":"A 40 yours old present with squamous cell carcinoma filling the antrum extended from the maxillary antrum into the hard palate and anterior maxillary wall. There is no orbital walls or subcutaneous tissue invasion What is T classification of this","o":["T1","T2","T4","T3"],"k":"B","x":"AJCC 8 maxillary sinus T2: bone erosion/destruction including the hard palate and/or middle meatus, excluding the posterior wall and pterygoid plates. Anterior wall bone involvement without skin or subcutaneous invasion stays T2 (AJCC 8).","src":"2024 exam recall · Paper 1 · Q50 (source tag: Oxford SBA)","d":"Rhinology"},{"s":"A 4 old girl present with history of recent infections developed with progressive sever headache and photophobia On examination she had Grisainger sign. Which one of the following best describes this sign?","o":["Vertigo and nystagmus induced by tragal pressure","Oedema and tenderness over the mastoid","Unilateral pulsatile otorrhea","Tenderness on moving the auricle"],"k":"B","x":"Griesinger sign is oedema and tenderness over the mastoid emissary vein, a sign of lateral (sigmoid) sinus thrombosis (Scott-Brown).","src":"2024 exam recall · Paper 1 · Q51","d":"Paediatric"},{"s":"A 30-year old woman presented with parotid mass and scheduled for parotid surgery Which one of the following parotid pathology is an indication of doing neck dissection?","o":["Carcinoma ex pleomorphic adenoma","Adenoid cystic carcinoma","Monomorphic adenoma","Cystadenoma lymphatosum"],"k":"A","x":"Neck dissection is indicated for high-grade parotid malignancy (carcinoma ex pleomorphic adenoma, high-grade MEC, salivary duct carcinoma) even in the clinically N0 neck (NCCN Salivary).","src":"2024 exam recall · Paper 1 · Q52","d":"Head & Neck"},{"s":"A 55 year old man had total laryngectomy and insertion of Pravox prosthesis one year back. He presented with a leak through the prosthesis. Which one of the following is most likely cause7","o":["Aspergillus infection","Prosthesis malfunction","Prosthesis migration","Mucormycosis infection"],"k":"B","x":"Leakage through a voice prosthesis is usually valve incompetence from Candida biofilm or wear (prosthesis malfunction) and needs replacement; leakage around it means an enlarged puncture (Scott-Brown).","src":"2024 exam recall · Paper 1 · Q53","d":"Laryngology"},{"s":"Which one of the following sites in the most commonly affected by amyloidosis in the head and neck","o":["Nose","Trachea","Nasopharynx","Larynx"],"k":"D","x":"The larynx (especially the false cords/ventricle) is the commonest site of localized amyloidosis in the head and neck (Cummings).","src":"2024 exam recall · Paper 1 · Q54","d":"Head & Neck"},{"s":"A 17-years old female presented with sudden loss of voice . Fibro-optic laryngoscopy revealed that vocal cord in abducted position that fail to adduct on phonation, the cough is normal. What is the most likely diagnosis?","o":["Viral laryngitis","Functional aphonia","Asthenophonia","Puberphonia"],"k":"B","x":"A sudden whisper with folds that abduct and fail to adduct on phonation but close on coughing is functional (psychogenic/conversion) aphonia (Scott-Brown).","src":"2024 exam recall · Paper 1 · Q55","d":"Laryngology"},{"s":"A 34 years old woman diagnosed with ( recurrent\\irradiation parotitis ), She underwent multiple sialendoscopy with no improvement. Then, she was treated with botulinum toxin. Which one of the following is the mechanism of action of this toxin","o":["Blocking serotonin release","Decreasing exoplasmic flow","Blocking acetylcholine release","Activating nerve growth factor"],"k":"C","x":"Botulinum toxin blocks presynaptic acetylcholine release (cleaving SNARE proteins), reducing parasympathetic salivary secretion (Bailey).","src":"2024 exam recall · Paper 1 · Q56 (source tag: Bailey (old ed.))","d":"Head & Neck"},{"s":"A 50 your old man had laryngeal carcinoma and underwent total laryngectomy 1 year ago: He presented with multiple small growth around the stoma suggestive of stomal recurrence. Which one of the following is a risk factor for developing stromal recurrence?","o":["Positive level IV lymph nodes","Positive level V lymph nodes","Subglottic extension of the treated cancer","Glottic extension of the treated cancer"],"k":"C","x":"Risk factors for stomal recurrence include subglottic extension, preoperative tracheostomy, paratracheal/level VI node involvement, and T4 stage (Cummings).","src":"2024 exam recall · Paper 1 · Q57","d":"Laryngology"},{"s":"A 35 your old man developed facial nerve palsy (Housa. Brackmann grade V , two years following temporal bone fracture. What test would be the most helpful to determine the best treatment for the reanimation?","o":["Temporal bone CT scan","Electroneuronography","Electromyography","Maximum stimulation test"],"k":"C","x":"Two years after paralysis, EMG shows whether the facial muscles are still innervatable (fibrillations) or atrophic (silence), guiding nerve transfer versus muscle transfer (Cummings).","src":"2024 exam recall · Paper 1 · Q58","d":"Otology"},{"s":"Old women presented with presented with presistant OME left ear conductive hearing loss for month following an upper respiratory infection that was treated with antibiotic . He is complaining of mild ear pain. Otoscopy examination revealed middle ear effusion. What is your next step","o":["CT temporal bone","Observation","Change the oral antibiotic","Frequent Valsalva"],"k":"A","x":"Persistent unilateral OME in an adult needs exclusion of a nasopharyngeal or skull base lesion (nasopharyngoscopy, then imaging); of the options, CT is the next investigation (Brackmann; Scott-Brown).","src":"2024 exam recall · Paper 1 · Q59 (source tag: Brackmann)","d":"Otology"},{"s":"In a patient with a stage ll (B) (tongue carcinoma who underwent partial glossectomy and neck dissection level 1. fit, the decision to give adjuvant radiation therapy depends on which one of the following","o":["Close margin and perineural invasion","Tumor 6 mm away from anterior margin","4 mm depth of tumor invasion","Tumor differentiation grade"],"k":"A","x":"Close margins and perineural invasion are indications for adjuvant radiotherapy in early oral cancer; a 6 mm margin, DOI of 4 mm and grade alone are not (NCCN).","src":"2024 exam recall · Paper 1 · Q60","d":"Head & Neck"},{"s":"A 30 y old man with a history of orbital subperiosteal abscess that progressed to cavernous sinus thrombosis, Which one of the following cranial nerves is the most likely to be first effected?","o":["VI","V","lll","IV"],"k":"A","x":"The abducens nerve runs within the cavernous sinus beside the ICA (not in the lateral wall), so it is often the first nerve affected in cavernous sinus thrombosis (Scott-Brown).","src":"2024 exam recall · Paper 1 · Q61","d":"Rhinology"},{"s":"A 71 year old who underwent total laryngectomy with pharyngectomy and jejaunal free flap reconstruction. The blood supply of this flap arises from which one of the following arteries?","o":["Inferior ileal","Superior ileal","Middle mesenteric","Superior mesenteric"],"k":"D","x":"A free jejunal flap is based on a jejunal branch (arcade) of the superior mesenteric artery (Cummings, Pharyngeal Reconstruction).","src":"2024 exam recall · Paper 1 · Q62","d":"Laryngology"},{"s":"A 30-year-old woman presented with left parotid sialadenitis. Imaging shows a 3 × 4.5 mm calculus at the hilum of Stensen’s duct. Which one of the following is the best treatment option?","o":["Sialoendoscopy with intraoral combined approach","Superficial parotidectomy","Total parotidectomy","Sialoendoscopy lwith external combined approach"],"k":"D","x":"⚑ No answer was marked in the recall; answer supplied from the references. — Large (>5–7 mm), proximal/hilar parotid stones that cannot be retrieved intraorally are removed by sialendoscopy combined with an external (transfacial) approach, preserving the gland (Cummings, Sialendoscopy). Stem repaired: \"3 x 4.5 cm\" corrected to mm (a hilar sialolith).","src":"2024 exam recall · Paper 1 · Q63","d":"Head & Neck"},{"s":"A newborn baby delivered by spontaneous vaginal delivery , developed Respiratory distress and cyanosis which is relieved by crying What is most likely diagnosis?","o":["Respiratory distress syndrome","Bilateral choanal atresia","Tracheao-esophageal fistula","Subglottic haemangioma"],"k":"B","x":"Bilateral choanal atresia gives cyclical cyanosis relieved by crying (obligate nasal breathers); secure an oral airway (McGovern nipple) and then do surgical repair (Scott-Brown).","src":"2024 exam recall · Paper 1 · Q64","d":"Paediatric"},{"s":"A woman is diagnosed with CSF rhinorrhoea. CT and MRI of the paranasal sinuses and brain reveal a 5-mm skull base defect with a meningoencephalocele. What is the best management of the meningoencephalocele (during endoscopic repair)?","o":["Neurosurgeon referral","Cauterization","Gelfoam packing","No intervention"],"k":"B","x":"Small meningoencephaloceles with CSF leak are managed endoscopically: the herniated non-functional tissue is reduced by bipolar cauterization and the defect closed with a multilayer graft or flap (Cummings).","src":"2024 exam recall · Paper 1 · Q65","d":"Rhinology"},{"s":"Pt with csf rhinorrhea. What is the characteristic signal seen on MRI","o":["High signal intensity on T1","Low signal intensity on T2","Gadolinium Enhancement","High signal intensity on T2"],"k":"D","x":"CSF is bright (hyperintense) on T2-weighted MRI; heavily T2-weighted MR cisternography localizes leaks non-invasively (Brackmann; Cummings).","src":"2024 exam recall · Paper 1 · Q66 (source tag: Brackmann)","d":"Rhinology"},{"s":"A 40-year-old man diagnosed with progressive hoarseness for 4 months. Fiberoptic laryngoscopy superficial hyperkeratotic lesion on the right anterior vocal cord with normal mobility. What is the best management","o":["Direct laryngoscopy and excisional biopsy","Fiberoptic laryngoscopy after 1 month","Ant reflux agents and speech therapy","CT and MRI scans"],"k":"A","x":"A persistent hyperkeratotic vocal fold lesion (leukoplakia) needs direct laryngoscopy with excisional biopsy to exclude dysplasia or invasive carcinoma (Bailey).","src":"2024 exam recall · Paper 1 · Q67 (source tag: Bailey (current ed.))","d":"Laryngology"},{"s":"50-year-old man worker and alcohol presented with hoarseness of 2 months duration Fiberoptic laryngoscopy revealed right vocal paralysis with proliferative growth Biopsy, came as moderate to severe dysplasia. Which one of the following is the next step in the management?","o":["Close observation","Start PPI","Neck US","Repeat biopsy"],"k":"D","x":"A vocal fold growth with fold paralysis is suspicious for invasive cancer even if the biopsy shows only dysplasia; a deeper repeat biopsy at direct laryngoscopy is needed (Cummings).","src":"2024 exam recall · Paper 1 · Q68","d":"Laryngology"},{"s":"Which one of the following is the most common form of fibrous dysplasia","o":["Cervical spine","Clavicle","Polyostotic","Monostotic"],"k":"D","x":"Monostotic fibrous dysplasia (about 70–80%) is the commonest form; the craniofacial bones (maxilla, mandible) are frequently involved (Bailey).","src":"2024 exam recall · Paper 1 · Q69 (source tag: Bailey (old ed.))","d":"Others"},{"s":"A 28-year old man had blunt trauma to the neck presented to emergency department with hoarseness. Fiberoptic laryngoscopy showed hematoma of right aryepiglottic fold and false cord which is not compromising the airway. The vocal cords are mobile. There is minimal laceration of posterior pharyngeal wall. Neck examination is normal. Which one of the following is the best next step?","o":["Admission for urgent drainage","admission for close observation","Discharge with antibiotics","discharge with PPI"],"k":"B","x":"⚑ Key corrected — recalled answer: D; updated answer: B. — Laryngeal haematoma or small mucosal lacerations without airway compromise (Schaefer group 1–2) need admission for airway observation, humidification, voice rest, PPI and antibiotics for mucosal tears; discharge is unsafe because oedema can progress (Cummings, Laryngeal Trauma).","src":"2024 exam recall · Paper 1 · Q70","d":"Laryngology"},{"s":"A 30-year-old woman had tracheostomy after a prolonged endotracheal intubation due to head trauma referred for decannulation. Airway assessment showed grade IV subglottic stenosis (Cotton Myer grading system). Which one of the following is the best management option?","o":["Laryngeal expansion","Posterior cricoid split","Cricotracheal resection","Anterior cricoid split"],"k":"C","x":"Grade IV (complete) subglottic stenosis in an adult is best treated by cricotracheal resection with primary anastomosis (Cummings).","src":"2024 exam recall · Paper 1 · Q71","d":"Laryngology"},{"s":"A 72 years old man had bilateral modified radical mastoidectomy and using hearing aids presented with bilateral hearing loss, itching and discharge. There is no hearing improvement with hearing aid. Microscopic examination revealed edema and congestion of EAC bilaterally. Which one of the following is the best management?","o":["Bilateral cochlear implant","Surgical revision for ossiculoplasty","Bone Anchored Hearing Aid (BAHA)","Unilateral cochlear implant"],"k":"C","x":"Bilateral open cavities with chronic otitis externa and failed air-conduction aids are an indication for bone-anchored hearing (BAHA), which bypasses the canal (Brackmann).","src":"2024 exam recall · Paper 1 · Q72","d":"Otology"},{"s":"A 30- your-old man complains of hearing loss after road Traffic accident: CT scan show ossicular chain disruption. Which one of the following ABG most likely seen in the PTA?","o":["30-35 dB","55-60 dB","40-45 dB","35-40 dB"],"k":"B","x":"⚑ Key corrected — recalled answer: D; updated answer: B. — Ossicular discontinuity behind an intact tympanic membrane produces the largest conductive loss, an air–bone gap of about 55–60 dB, because the intact TM shields the oval and round windows (Scott-Brown).","src":"2024 exam recall · Paper 1 · Q73","d":"Otology"},{"s":"A 17 months old child with bilateral aural atresia. Which one of the following is the best treatment option","o":["Aural-oral rehabilitation","Soft band bone conduction hearing aid","Atresia surgery","Bone anchored hearing aid (BAHA"],"k":"B","x":"Infants with bilateral atresia need early amplification with a softband bone-conduction aid; an implanted BAHA is usually placed from age 5, and atresiaplasty around 6–7 years if anatomy allows (Bailey).","src":"2024 exam recall · Paper 1 · Q74 (source tag: Bailey (current ed.))","d":"Paediatric"},{"s":"In designing a trial comparing primary surgery against primary chemoradiotherapy for head and neck Cancer, which one of the following is true regarding randomization","o":["The patients in each arm should have similar prognostic factors","The clinician can favor one treatment over another if the patient expresses choice","The number of patients in each arm should be equal","The clinician will not be aware of which treatment the patients has received"],"k":"A","x":"Randomization aims to distribute known and unknown prognostic factors equally between arms; equal numbers and blinding are separate issues (Oxford Handbook).","src":"2024 exam recall · Paper 1 · Q75 (source tag: Oxford SBA)","d":"Head & Neck"},{"s":"A36-year-old woman underwent a thyroidectomy. Two hours postoperatively she developed respiratory distress with a neck swelling. What should be the first step in the management?","o":["Intubation","Cricothyroidectomy","Sutures removal","Tracheostomy"],"k":"C","x":"Respiratory distress from a post-thyroidectomy haematoma requires immediate bedside opening of the wound (skin and strap sutures) to decompress the airway, then return to theatre (ATA; Cummings).","src":"2024 exam recall · Paper 1 · Q76","d":"Head & Neck"},{"s":"A 24-year-old man diagnosed with tracheal stenosis et 2nel, 3rd and 4th tracheal post prolonged Intubation, (to is undergoing tracheal dilatation almost every 8 months. Which one of the following the best treatment option?","o":["Laser resection of the stenotic area","Intralesional steroid injection at the stenotic area","Placement of Montgomery T-lube","Tracheal resection and anastomosis"],"k":"D","x":"Recurrent focal tracheal stenosis needing repeated dilatation is best treated by segmental tracheal resection with end-to-end anastomosis (Cummings).","src":"2024 exam recall · Paper 1 · Q77","d":"Laryngology"},{"s":"A 30-year-old women underwent Sistrunk Surgery and the final histopathology came on thyroglossal duct cyst with papillary carcinoma. Which one of the following should follow in the management of this case","o":["Thyroid ultrasound","Total Thyroidectomy","Radiolodine therapy","Close observation"],"k":"B","x":"⚑ Current practice: thyroid ultrasound first, with total thyroidectomy for high-risk features or thyroid nodules. The recalled key is kept. — Papillary carcinoma in a thyroglossal duct cyst: after Sistrunk, total thyroidectomy (± RAI) is generally recommended, especially if the thyroid has nodules or risk factors, because about 25–50% have synchronous thyroid carcinoma. Thyroid ultrasound guides the decision (Oxford; ATA).","src":"2024 exam recall · Paper 1 · Q78 (source tag: Oxford SBA)","d":"Head & Neck"},{"s":"Pt did superficial parotidectomy for a pleomorphic adenoma 6 years back. Another recurrence 1 year ago which was resected. Now presented with another recurrence. What is the best management following the recurrence resection?","o":["Immunotherapy","Radiotherapy","Chemoradiation","Observation"],"k":"B","x":"Multiply recurrent pleomorphic adenoma (multinodular recurrence) after re-excision benefits from postoperative radiotherapy to reduce further recurrence (Cummings).","src":"2024 exam recall · Paper 1 · Q79","d":"Head & Neck"},{"s":"A new screen test for SCC is developed. A total 150 cases were tested. 50 were known to have the disease. When testing started 40 had the disease, where 10 of the positive didn’t have the disease. Which is true","o":["80% negative predictive value","80% specificity","80% sensitivity","90% positive predictive value"],"k":"C","x":"Of 50 diseased, 40 test positive, so sensitivity = 40/50 = 80%. With 10 false positives among 100 non-diseased, specificity = 90%, PPV = 40/50 = 80% and NPV = 90/100 = 90%. Only C is true (Oxford Handbook).","src":"2024 exam recall · Paper 1 · Q80 (source tag: Oxford SBA)","d":"Head & Neck"},{"s":"A 4 year-old child with villocardiofacial syndrome has adenoid hypertrophy causing severe OSA, Which one of the following associated anomalies can be a potential risk. during surgery?","o":["Laterally placed facial nerve","Medially displaced carotid artery","Tracheal stenosis","Subglottic stenosis"],"k":"B","x":"Velocardiofacial (22q11.2 deletion) syndrome is associated with medially displaced (retropharyngeal) internal carotid arteries, which must be identified before adenoidectomy or pharyngoplasty (Cummings).","src":"2024 exam recall · Paper 1 · Q81","d":"Paediatric"},{"s":"During canal wall up mastoidectomy for cholesteatoma, the road tripped off the promontory and the incus was removed. The malleus was mobile, and the stapes was intact and mobile. Which one of following is the best options for the management","o":["Place sialastic sheeting over the promontory and stage the surgery","Graft the TM and use a PORP to reconstruct the ossicular chain","Pack the ear with antibiotic, soaked packing and stage the surgery","Place a ventilation tube in the newly reconstructed TM and then use a PORP"],"k":"A","x":"If the incus is removed but the stapes is intact, place Silastic sheeting to preserve the middle ear space and stage the ossicular reconstruction at the second-look operation (Brackmann).","src":"2024 exam recall · Paper 1 · Q82 (source tag: Brackmann)","d":"Otology"},{"s":"A 40-year-old woman underwent partial parotidectomy. On the first postoperative day, examination revealed mild swelling with ecchymosis at the surgical site. What is the most likely diagnosis?","o":["Seroma","Infection","Sialocele","Haematoma"],"k":"D","x":"⚑ Key corrected — recalled answer: C; updated answer: D. — Swelling with ecchymosis on the first postoperative day is a haematoma. A sialocele or seroma develops later (days) without bruising (Cummings). Age corrected (\"10 year old woman\").","src":"2024 exam recall · Paper 1 · Q83","d":"Head & Neck"},{"s":"Perineural invasion is associated with which one of following salivary gland neoplasm","o":["Mucoepidermoid carcinoma","Squamous cell carcinoma","Adenoid cystic carcinoma","Acinic cell carcinoma"],"k":"C","x":"Adenoid cystic carcinoma is notorious for perineural invasion and skip lesions along nerves (Bailey).","src":"2024 exam recall · Paper 1 · Q84 (source tag: Bailey (current ed.))","d":"Head & Neck"},{"s":"Salivary mass and pulpable lymph node. Which one of the following is the LEAST likely diagnosis?","o":["Acinic cell carcinoma","Carcinoma ex pleomorphic adenoma","Salivary ductal carcinoma","Adenoid cystic carcinoma"],"k":"D","x":"Adenoid cystic carcinoma has a low rate of nodal metastasis (spreading perineurally and haematogenously), whereas salivary duct carcinoma and carcinoma ex pleomorphic adenoma frequently metastasize to nodes (Cummings).","src":"2024 exam recall · Paper 1 · Q85","d":"Head & Neck"},{"s":"30 year old with dec haering, tunning forks shown high conductive hearing lesion with on ABG of 30 dB, tympanogram shows a type A curves both ear acoustic reflex is preserved in both ears. What is the most likely diagnosis?","o":["Congenital apical cholesteatoma","Superior semicircular canal dehiscence","Cochlear otosclerosis","Tympanosclerosis"],"k":"B","x":"A conductive air–bone gap with a normal tympanogram and preserved acoustic reflexes suggests an inner-ear \"third window\" (superior canal dehiscence) rather than otosclerosis or tympanosclerosis, where reflexes are absent (Cummings).","src":"2024 exam recall · Paper 1 · Q86","d":"Otology"},{"s":"Which one of the following best describes type Il laryngomalacia?","o":["Tubular epiglottis with short aryepiglottic folds","Tubular epiglottis with inward collapse of the aryepiglottic folds","Retroflexed epiglottis with retrognathla","Retroflexed epiglottis with prolapse into the laryngeal inlet"],"k":"A","x":"Olney type 2 laryngomalacia is short aryepiglottic folds, often with a tubular (omega) epiglottis (Cummings).","src":"2024 exam recall · Paper 1 · Q87","d":"Laryngology"},{"s":"Diagnostic criteria to do sialendoscopy in children","o":["A minimum of two episodes of parotitis occurred within 6 months","A minimum of four episodes of parotitis occurred within 6 months","Six episodes occurred within one year","Five episodes occurred within one year"],"k":"A","x":"Juvenile recurrent parotitis is defined by at least two episodes of parotid swelling; sialendoscopy (with steroid irrigation) is diagnostic and therapeutic (Cummings, Sialendoscopy).","src":"2024 exam recall · Paper 1 · Q88","d":"Head & Neck"},{"s":"Pt with (T2N2b) lat dorsal tongue SCC. He underwent partial glossectomy and neck dissection, the final pathophysiology reported that the margins are free and there an extracapsular spread of one of the lymph nodes. What is best adjuvant treatment?","o":["Chemotherapy","Chemoradiation","Conventional radiation","No further therapy"],"k":"B","x":"Extranodal extension (or positive margins) after resection mandates adjuvant concurrent cisplatin chemoradiation (RTOG 9501/EORTC 22931; NCCN).","src":"2024 exam recall · Paper 1 · Q89","d":"Head & Neck"},{"s":"In which one of the following tumour site the utility of sentinal node biopsy is the highest","o":["Lower alveolus","Base of tongue","Oral tongue","Floor of the mouth"],"k":"C","x":"Sentinel node biopsy is most validated for early (T1–T2 N0) oral tongue cancer; it is less reliable in floor-of-mouth tumours (shine-through) and not used for base of tongue (Bailey; NCCN).","src":"2024 exam recall · Paper 1 · Q90 (source tag: Bailey (current ed.))","d":"Head & Neck"},{"s":"A 30 years-old man is going to have rhinoseptoplasty the best time to give the prophylactic antibiotics","o":["At the time of the incision","2 hours before the incision","Any time during the surgery","Within 1 hour of the incision"],"k":"D","x":"Prophylactic antibiotics should be given within 60 minutes before incision so that tissue levels peak during surgery (Bailey; WHO surgical safety).","src":"2024 exam recall · Paper 1 · Q91 (source tag: Bailey (current ed.))","d":"Rhinology"},{"s":"The distance of post ethmoid artery from the anterior ethmoid crest","o":["12 mm","24 mm","36 mm","30 mm"],"k":"C","x":"\"24–12–6\" rule: from the anterior lacrimal crest the AEA is about 24 mm, the PEA about 12 mm further (about 36 mm) and the optic canal about 6 mm beyond that (about 42 mm).","src":"2024 exam recall · Paper 1 · Q92","d":"Rhinology"},{"s":"Which one of the following anatomical relations helps to localize the thoracic duct","o":["Posterior to the thyrocervical trunk","Posterior to the carotid artery","Anterior to both carotid artery and jugular vein","Anterior to carotid artery and phrenic nerve"],"k":"B","x":"The thoracic duct arches in the left lower neck behind the carotid sheath (posterior to the carotid artery and IJV), anterior to the phrenic nerve, anterior scalene and thyrocervical trunk (Bailey).","src":"2024 exam recall · Paper 1 · Q93 (source tag: Bailey (current ed.))","d":"Others"},{"s":"What are the typical histopathological features of GPA?","o":["Eosinophilia, granulomatous inflammation and perivascular cuffing","Cellular debris, granulomatous inflammation","Necrosis, granulomatous inflammation and vasculitis","Necrosis and large vessels vasculitis"],"k":"C","x":"GPA histology: necrotizing granulomatous inflammation with small/medium-vessel vasculitis and geographic necrosis (Cummings).","src":"2024 exam recall · Paper 1 · Q94","d":"Others"},{"s":"Which one of the following identify the LOWER surgical boundary of Level III neck dissection?","o":["Upper border of cricoid cartilage","Sternothyroid muscle","Ansa cervicalis","Superior belly of omohyoid muscle"],"k":"D","x":"Level III extends from the hyoid to the inferior border of the cricoid. Surgically, its lower boundary is where the omohyoid muscle crosses the IJV (Shah; AAO-HNS).","src":"2024 exam recall · Paper 1 · Q95","d":"Head & Neck"},{"s":"Supraglottic laryngectomy Which one of the following is a contraindication of doing this surgery","o":["Crohn's disease","Irritable bowel disease","Rheumatic valvular heart disease","Chronic obstructive pulmonary disease"],"k":"D","x":"Supraglottic laryngectomy causes temporary aspiration, so poor pulmonary reserve (COPD; FEV1 <50% predicted) is a contraindication (Cummings).","src":"2024 exam recall · Paper 1 · Q96","d":"Laryngology"},{"s":"30 y old women underwent rt FESS , 2 h post operative devaloped progresive rt proptosis , what is the next step of mangement?","o":["Ophthalmic consultation","Lateral canthotomy","Observation","Re-exploration"],"k":"B","x":"⚑ The recall marked B and D. — Progressive proptosis soon after FESS indicates an orbital haematoma with rising intraorbital pressure. Immediate lateral canthotomy and inferior cantholysis decompress the orbit, then ophthalmology review and haemostasis follow (Cummings).","src":"2024 exam recall · Paper 1 · Q97","d":"Rhinology"},{"s":"During parathyroidectomy the best way to confirm your removal success","o":["Intraoperative PTH reduction","lonized serum calcium reduction","Frozen section","Ultrasound localization"],"k":"A","x":"A fall in intraoperative PTH of more than 50% from the highest pre-excision level 10 minutes after excision (Miami criterion) confirms removal of the hyperfunctioning gland (Cummings).","src":"2024 exam recall · Paper 1 · Q98","d":"Head & Neck"},{"s":"Sinus with double density signal, Which one of the following the LEAST likely pathology","o":["Allergic fungal sinusitis","Chondrosarcoma","Antrochoanal polyp","Inverted papilloma"],"k":"C","x":"Hyperdense (\"double density\") sinus contents on CT are seen with allergic fungal sinusitis (fungal mucin), calcified chondrosarcoma matrix, and inverted papilloma (focal hyperostosis/calcification). An antrochoanal polyp is homogeneously soft-tissue density (Oxford Handbook).","src":"2024 exam recall · Paper 1 · Q99 (source tag: Oxford SBA)","d":"Rhinology"},{"s":"Pt with neck swelling hoarseness of voice and positives bryce sign most likely diagnosis","o":["Pharyngeal pouch","Laryngocele","Branchial cyst","Thyroglossal duct cyst"],"k":"B","x":"⚑ No answer was marked in the recall; answer supplied from the references. — Bryce sign is gurgling or hissing on compressing a neck swelling (with hoarseness), characteristic of a mixed laryngocele (Scott-Brown). Options C and D were blank in the recall; distractors added.","src":"2024 exam recall · Paper 1 · Q100","d":"Laryngology"}]},{"title":"2024 Exam · Paper 2","q":[{"s":"Which one of the following as one of the criteria in diagnosing second primaries according to warren and Gates criteria ?","o":["Time interval between second primary tumors and histological type","Should be within the same anatomical slte","Must be with the same histopathologic type","Should be separated by more than 4 cm of normal epithelium"],"k":"A","x":"Warren & Gates/Hong criteria for a second primary: both malignant, separated by normal mucosa (≥2 cm), and metastasis excluded. A tumour of the same histology must be separated in time (≥3 years) to be considered a new primary rather than recurrence (Cummings).","src":"2024 exam recall · Paper 2 · Q1","d":"Others"},{"s":"a 55y old man diagnosed with two simultaneous scc , one in the floor of mouth and the second in the lat oropharyngeal waal.Which one of these factor is considered when determining the index tumor?","o":["T stage","Dysplasia association","Differentiation grade","Loation"],"k":"A","x":"⚑ No answer was marked in the recall; answer supplied from the references. — With synchronous tumours, the index tumour is the one with the higher T stage (most advanced), which dictates treatment and prognosis (Cummings).","src":"2024 exam recall · Paper 2 · Q2","d":"Head & Neck"},{"s":"A 60y old man has undergone a total petrosectomy for atemporal bone carcinoma , which one of the following factors is the most significant prediction of postoperative survival rate","o":["Patient age and sex","Lymphovascular invation","depth of invation","Clear surgical margins"],"k":"D","x":"After temporal bone resection, clear surgical margins are the strongest predictor of survival (Brackmann; Cummings).","src":"2024 exam recall · Paper 2 · Q3 (source tag: Brackmann)","d":"Otology"},{"s":"a 3y old boy with congenital hearing loss was found to have abnormal electroretinography what is the most likely diagnosis ?","o":["Penderd S","Nonsyndromic hearing loss","Nielsen syndrome","Usher syndrome"],"k":"D","x":"Congenital SNHL with retinitis pigmentosa (abnormal electroretinography) is Usher syndrome (Scott-Brown).","src":"2024 exam recall · Paper 2 · Q4","d":"Paediatric"},{"s":"an elderly man present with a neck mass clinically suspected to be a metastatic LN thorough clinical evaluation has not revealed any growth in the H&N which one of the following is the most establishing the diagnosis?","o":["Ultrasound of the neck","Fine needle aspiration cytology from the node","Multiple blind biopsies from different mucosal siles","Excision biopsy of the node"],"k":"B","x":"The next step for a suspected metastatic node is (ultrasound-guided) FNA cytology, with HPV/EBV testing; excision biopsy is avoided before a full workup (NCCN; Cummings).","src":"2024 exam recall · Paper 2 · Q5","d":"Head & Neck"},{"s":"a 2y old child presenting with bilateral nasal polyps what is the most likely associated condition?","o":["immobile cilia syndrome","kartagners syndrome","Mucovisidosis","allergic rhinitis"],"k":"C","x":"Nasal polyps in a young child strongly suggest cystic fibrosis (mucoviscidosis); sweat chloride testing is needed (EPOS).","src":"2024 exam recall · Paper 2 · Q6","d":"Paediatric"},{"s":"A pt with Parkinson dis is referred for hypophonia examination revealed VF bowing which one of the following appropriate step?","o":["Deep brain stimulator placerent","MRI scan","Botulinum toxin injection","Speech therapy"],"k":"D","x":"Hypophonia with vocal fold bowing in Parkinson disease is treated first with intensive voice therapy (Lee Silverman Voice Treatment); augmentation is an adjunct (Cummings).","src":"2024 exam recall · Paper 2 · Q7","d":"Others"},{"s":"A 46y old woman presented with a large upper gingivobuccal submucosal mass which was completely excised , which one of the following malignancies is an indication of giving immunotherapy as adjuvant ttt?","o":["ACC","sarcoma","adenocarcinoma","Melanoma"],"k":"D","x":"Of these, mucosal melanoma is the tumour for which adjuvant immunotherapy (checkpoint inhibitors) is considered after resection (NCCN Melanoma).","src":"2024 exam recall · Paper 2 · Q8","d":"Others"},{"s":"a 60y old man refered with dysphagia and dysarthria , he demonstrate an exaggerated jaw jerk and gag reflex , spastic tongue and emotional lability , what is the most likely diagnosis?","o":["Amyotrophic lateral sclerosis","Botulism","Pseudobulbar palsy","Bulbar palsy"],"k":"C","x":"Spastic tongue, exaggerated jaw jerk and gag, dysarthria and emotional lability indicate pseudobulbar (bilateral upper motor neuron) palsy; bulbar palsy is lower motor neuron, with a flaccid, wasted tongue (Bailey).","src":"2024 exam recall · Paper 2 · Q9 (source tag: Bailey (current ed.))","d":"Head & Neck"},{"s":"a 45y old man presented with a scalp brownish skin mass biopsy proved melanoma , mid revealed a 2.2 mm thik melanoma of the scalp , what is the appropriate margins of the resection?","o":["0.5 cm","2 cm","4 cm","1 cm"],"k":"B","x":"A melanoma of 2.01–4 mm Breslow thickness needs 2 cm margins (1–2 cm per NCCN), and sentinel node biopsy should be discussed (NCCN Melanoma; Bailey).","src":"2024 exam recall · Paper 2 · Q10 (source tag: Bailey (current ed.))","d":"Head & Neck"},{"s":"a younge smoker develop change of voice fiberobtic laryngoscope showed diffuse odemaof the both VC , in which vc layer the edema is most likely develops?","o":["Squamous epithelium","intermediate lamina propria","Deep lamina propria","Superficial lamina propria"],"k":"D","x":"Reinke oedema is fluid accumulation in the superficial lamina propria (Reinke space), strongly linked to smoking (Oxford Handbook).","src":"2024 exam recall · Paper 2 · Q11 (source tag: Oxford SBA)","d":"Laryngology"},{"s":"which of the following causes of epiphora?","o":["Intra nasal splints","Inferior turbinate out-fracture","Lateral osteotomy","Huge nasal pack"],"k":"C","x":"⚑ Key corrected — recalled answer: B; updated answer: C. — Epiphora after rhinoplasty most often results from a lateral osteotomy placed too high or posteriorly, injuring the lacrimal sac or nasolacrimal duct (Cummings).","src":"2024 exam recall · Paper 2 · Q13","d":"Rhinology"},{"s":"60% subglottic stenosis , what is the grade of stenosis according to Myers Cotton grading-system","o":["I","III","IV","II"],"k":"D","x":"Myer–Cotton grading: I ≤50%, II 51–70%, III 71–99%, IV no lumen. A 60% stenosis is grade II (Oxford Handbook).","src":"2024 exam recall · Paper 2 · Q14 (source tag: Oxford SBA)","d":"Others"},{"s":"a 22y old man presented to emergency department with nasal truma , examination revealed diffuse edema over the nasal dorsum with tenderness with crepitus on palpation , on x-ray show displaced nasal bone fracture , Whate is the next appropriate step in the management?","o":["Immediate nasal bone reduction","Conservative management","Septorhinoplasty after-2 months","Delayed surgical reduction within 2 weeks"],"k":"D","x":"A displaced nasal bone fracture with marked oedema is reduced closed within about 2 weeks, once swelling settles and before the bones set; immediate reduction is possible only before swelling develops (Scott-Brown).","src":"2024 exam recall · Paper 2 · Q15","d":"Rhinology"},{"s":"which of the following is the best laser option for laryngeal papilomatosis?","o":["Argon","CO2","KTP","ND YAG"],"k":"B","x":"The CO₂ laser is the classic laser for laryngeal papillomatosis (precise ablation); the angiolytic KTP/pulsed-dye lasers are increasingly used in office settings (Cummings).","src":"2024 exam recall · Paper 2 · Q16","d":"Laryngology"},{"s":"Pt with typical HX of lat sinus thromposis","o":["Brain abscess","Meningitis with extra dural abscess","lat sinus thrombosis","Meningitis"],"k":"C","x":"The typical history (otitic headache, spiking fever, Griesinger sign) indicates lateral sinus thrombosis (Scott-Brown).","src":"2024 exam recall · Paper 2 · Q17","d":"Rhinology"},{"s":"Kimora disease treatment","o":["Radiation","Cetuximab","Cryotherapy","Cyclosporine"],"k":"A","x":"Kimura disease is treated with surgical excision and/or steroids; radiotherapy is used for recurrent or refractory lesions. Cetuximab and cryotherapy have no role (Cummings).","src":"2024 exam recall · Paper 2 · Q18","d":"Others"},{"s":"The most reliable technique during 1ry traacheoesophageal puncture, to avoid loss of the puncture","o":["Single layer pharyngeal closure","Pharyngeal neurectomy","Cricopharyngeal myotomy","Botox injection"],"k":"C","x":"A cricopharyngeal myotomy (or pharyngeal plexus neurectomy) at primary TEP prevents pharyngoesophageal spasm, the commonest cause of failed tracheoesophageal speech (Cummings).","src":"2024 exam recall · Paper 2 · Q19","d":"Others"},{"s":"During laser microlaryngosrgery","o":["Local oxygen concentration should be maintained < 30%","Using high later power and electrosurgical instruments","Covers the head and neck area completely using tight drapes","Anesthetist should use an armored tube"],"k":"A","x":"Airway fire prevention during laser surgery: keep FiO₂ below 30%, avoid N₂O, use laser-safe tubes with saline-filled cuffs and wet drapes (Cummings).","src":"2024 exam recall · Paper 2 · Q20","d":"Others"},{"s":"The risk of lymphoma in sjogren's is","o":["5 times","10 times","20 times","40 times"],"k":"D","x":"Sjögren syndrome carries about a 40-fold (up to 44×) increased risk of non-Hodgkin (MALT) lymphoma (Bailey).","src":"2024 exam recall · Paper 2 · Q21 (source tag: Bailey (current ed.))","d":"Head & Neck"},{"s":"Child with EXTERNAL nasal DORSUM compressible mass, the most likely Dx is","o":["Dermoid","Hamartoma","Meningocele","Glioma"],"k":"C","x":"⚑ Key corrected — recalled answer: B; updated answer: C. — A compressible nasal dorsum mass in a child that enlarges with crying (positive Furstenberg test) is a meningocele/encephalocele; dermoids and gliomas are firm and non-compressible. Imaging is mandatory before biopsy (Cummings).","src":"2024 exam recall · Paper 2 · Q22","d":"Paediatric"},{"s":"Mass spraying the ICA & ECA, with no LN or metastasis","o":["Radiographic emoalization","Surgical excision","Chemotnerapy","Radiation therapy"],"k":"B","x":"A carotid body tumour splaying the ICA and ECA without metastasis is treated by surgical excision (± preoperative embolization) in fit patients; radiotherapy is for the unfit or unresectable (Cummings).","src":"2024 exam recall · Paper 2 · Q23","d":"Head & Neck"},{"s":"Pt came with oropharyngeal mass T2n2b, what is the stage","o":["I","II","III","IV"],"k":"D","x":"HPV-negative oropharyngeal T2N2b is stage IVA (AJCC 8). If p16-positive, the same nodes would be cN1 and stage I (AJCC 8).","src":"2024 exam recall · Paper 2 · Q24","d":"Head & Neck"},{"s":"IP with hyper osteosis in the post maxillary wall, the best management","o":["Trans-nasal mass excision","Endoscopic mass excision and adjuvant radiotherapy","Endoscopic mass excision with posterior wall drilling","Endoscopic medial maxillectomy"],"k":"C","x":"⚑ The recall marked C and D. — Hyperostosis marks the inverted papilloma attachment site; endoscopic excision with subperiosteal dissection and drilling of the hyperostotic bone is required to prevent recurrence (Cummings).","src":"2024 exam recall · Paper 2 · Q25","d":"Rhinology"},{"s":"Which of the following almost presents symptomatically at birth?","o":["Lymphatic malformation","Fetal goiter","Salivary duct cyst","Cervical teratomas"],"k":"D","x":"Cervical teratomas are almost always symptomatic at birth (airway obstruction, polyhydramnios) and may need an EXIT procedure (Bailey).","src":"2024 exam recall · Paper 2 · Q26 (source tag: Bailey (old ed.))","d":"Others"},{"s":"A 65-year-old man being treated for T3N2c squamous cell carcinoma of the larynx with adjuvant chemoradiation has significant pain during the fifth week of radiation, requiring hospitalization for fluids and pain control. What should be done with the patient's treatment during the hospitalization?","o":["Disc
