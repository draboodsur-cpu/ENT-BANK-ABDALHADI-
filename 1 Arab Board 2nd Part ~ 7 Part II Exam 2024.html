ontinue radiation and do not resume","Defer radiation until patient is discharged","Continue radiation while patient admitted","Stop chemotherapy"],"k":"C","x":"Treatment breaks prolong overall radiotherapy time and reduce locoregional control, so radiation should continue while the patient is admitted for supportive care (Bailey; NCCN).","src":"2024 exam recall · Paper 2 · Q27 (source tag: Bailey (current ed.))","d":"Laryngology"},{"s":"A patient with a T3NO squamous cell carcinoma of the lateral floor of the mouth is to undergo surgical treatment. Which of the following is an appropriate neck dissection in this case?","o":["Selective neck dissection of levels I and II","Selective neck dissection of levels I, II, and III","Selective neck dissection of levels II, III, and IV","Modified radical neck dissection"],"k":"B","x":"For T3N0 lateral floor-of-mouth SCC the appropriate elective neck dissection is supraomohyoid (levels I–III) (Bailey; Shah).","src":"2024 exam recall · Paper 2 · Q28 (source tag: Bailey (current ed.))","d":"Head & Neck"},{"s":"Long (5 cm) facial nerve defects should be grafted with","o":["The greater auricular nerve","The cervical cutaneous nerves","The cranial nerve XI","The sural nerve"],"k":"A","x":"For shorter facial nerve defects the great auricular nerve (about 7–10 cm) is suitable; the sural nerve is preferred for longer defects or when branching is needed (Cummings).","src":"2024 exam recall · Paper 2 · Q29","d":"Otology"},{"s":"The commonest presenting symptom of nasopharyngeal (NP) carcinoma is","o":["Epistaxis","Hearing loss due to serous otitis media","Enlarged cervical lymph node","Nasal obstruction"],"k":"C","x":"A painless upper cervical (level II/V) node is the commonest presenting feature of nasopharyngeal carcinoma, followed by unilateral OME and nasal symptoms (Bailey).","src":"2024 exam recall · Paper 2 · Q30 (source tag: Bailey (old ed.))","d":"Rhinology"},{"s":"What segment of the facial nerve is most commonly damaged as a result of temporal bone trauma","o":["Intracranial","Mastoid","Labyrinthine","Tympanic"],"k":"C","x":"The perigeniculate/labyrinthine region is the commonest site of facial nerve injury in temporal bone fractures (Brackmann).","src":"2024 exam recall · Paper 2 · Q31 (source tag: Brackmann)","d":"Otology"},{"s":"The mechanism for salivary gland tumor involvement of the temporal bone is","o":["Direct extension","Hematogenous metastases","Ectopic salivary rests within the temporal bone","Squamous metaplasia","Absence of the fissures of Santorini"],"k":"A","x":"Parotid malignancies involve the temporal bone mainly by direct extension (along the canal and stylomastoid foramen and through the fissures of Santorini) (Brackmann).","src":"2024 exam recall · Paper 2 · Q32 (source tag: Brackmann)","d":"Head & Neck"},{"s":"A 14-year-old girl is febrile and toxic and has a 2 cm diffuse, tender mass at the angle of the mandible. The ear on that side has been draining for 3 weeks; granulation tissue is seen coming through a perforation of the tympanic membrane, but examination is difficult. Before you obtain a computed tomography (CT) scan, your clinical impression is","o":["Laryngocele","Bezold’s abscess","Esophageal tear","pharyngeal pouch"],"k":"B","x":"A Bezold abscess is mastoid pus breaking through the mastoid tip deep to the sternocleidomastoid, giving a tender mass at the angle of the mandible in a toxic patient with chronic otorrhoea (Scott-Brown).","src":"2024 exam recall · Paper 2 · Q33 (source tag: Bailey (old ed.))","d":"Paediatric"},{"s":"In a journal club, you are asked to assign a level of evidence to a study about treatment effects. In making your assignment which of the following considerations would be helpful","o":["A systematic review of randomized trials could rank higher than a single randomized trial","A systematic review of randomized trials is preferable to a clinical practice guideline","Randomized trials, by nature of their study design, always have high methodological quality","Levels of evidence, in general, are not appropriate for studies of treatment effects"],"k":"A","x":"A systematic review of RCTs can be downgraded (inconsistency, imprecision, bias) and well-done observational studies upgraded, so study design alone does not fix the level of evidence (Bailey).","src":"2024 exam recall · Paper 2 · Q34 (source tag: Bailey (current ed.))","d":"Others"},{"s":"The Tobey–Ayer test is a characteristic sign in:","o":["Brain abscess","Lateral sinus thrombosis","Meningitis","Cavernous sinus thrombosis"],"k":"B","x":"⚑ No answer was marked in the recall; answer supplied from the references. — Tobey–Ayer (Queckenstedt) test: compressing the IJV on the thrombosed side produces no rise in CSF pressure — a sign of lateral sinus thrombosis (Scott-Brown). Options repaired: in the recall, options a/b were printed inside the stem.","src":"2024 exam recall · Paper 2 · Q35","d":"Otology"},{"s":"After a radical neck dissection. A patient is noted to have ptosis of the ipsilateral upper eyelid. This finding is due to inadvertent dissection deep to the","o":["Internal jugular vein","Common carotid artery","Brachial plexus","Omohyoid muscle"],"k":"B","x":"Horner syndrome after neck dissection results from injury to the cervical sympathetic chain, which lies deep (posteromedial) to the common carotid artery (Bailey).","src":"2024 exam recall · Paper 2 · Q36 (source tag: Bailey (old ed.))","d":"Head & Neck"},{"s":"A 28-year-old undergoes partial parotidectomy with facial nerve dissection for a 22-mm tumor. Pathology shows a low-grade mucoepidermoid carcinoma. Margins are negative. The neck is radiologically negative. What therapy do you recommend?","o":["No further therapy, observation","Completion of total parotidectomy","Total parotidectomy, adjuvant radiation","Total parotidectomy, neck dissection"],"k":"A","x":"Completely excised low-grade mucoepidermoid carcinoma with negative margins and N0 neck needs no further treatment, only follow-up (NCCN Salivary; Bailey).","src":"2024 exam recall · Paper 2 · Q37 (source tag: Bailey (current ed.))","d":"Otology"},{"s":"lateral boundery of medial maxillectomy","o":["Infraorbital foramen","Lacrimal sac","Anterior ethmoidal foramen","Lateral canthal ligament"],"k":"A","x":"Medial maxillectomy removes the lateral nasal wall; its lateral limit is at the infraorbital foramen/nerve (Cummings).","src":"2024 exam recall · Paper 2 · Q38","d":"Rhinology"},{"s":"After septorhinoplasty nasal obstruction caused by","o":["Loss of nasal tip support","External nasal valve stenosis","Inferior turbinate head medicalization","Postoperative Epistaxis"],"k":"C","x":"Postoperative obstruction after septorhinoplasty commonly results from medialization of the inferior turbinate heads after lateral osteotomies, or from internal valve narrowing (Cummings).","src":"2024 exam recall · Paper 2 · Q39","d":"Rhinology"},{"s":"The ideal microvascular free flap for partial glossectomy defects is the radial forearm flap. What is its blood supply?","o":["Radial artery","Deep inferior epigastric artery","Thoracodorsal artery","Lateral circumflex femoral artery (descending branch)"],"k":"A","x":"⚑ Stem/options repaired: the recall listed only epigastric vessels, which do not supply the flap used for partial glossectomy. — The radial forearm free flap (thin, pliable, long pedicle) is based on the radial artery; it is the workhorse for partial glossectomy (Cummings).","src":"2024 exam recall · Paper 2 · Q40","d":"Head & Neck"},{"s":"Infrastructure maxillectomy involves removal of maxillary segment","o":["Inferior to the infraorbital nerve","At the level of nasomaxillary suture","Through the infraorbital fissure","A 3 cm maxillary bone with 1 cm margin"],"k":"A","x":"Infrastructure maxillectomy removes the inferior maxilla (palate and alveolus) below the level of the infraorbital nerve, preserving the orbital floor (Shah).","src":"2024 exam recall · Paper 2 · Q41","d":"Rhinology"},{"s":"During decompression of endolymphatic sac which of the following is landmark","o":["Donaldson's line","Solid angle","Citell's angle","Trautman’s triangle"],"k":"A","x":"Donaldson line (extending the plane of the lateral canal back to bisect the posterior canal) marks the upper limit of the endolymphatic sac below it (Brackmann).","src":"2024 exam recall · Paper 2 · Q42","d":"Otology"},{"s":"The commonest site of a second primary malignant tumor in a patient with oral or oropharyngeal carcinoma is ?","o":["larynx","esophagus","nasopharynx","Lung"],"k":"B","x":"⚑ Lung is the most common site of second primary tumours in HNSCC overall; for oral/oropharyngeal primaries, the upper aerodigestive tract (including oesophagus) predominates. The recalled key is kept. — For oral/oropharyngeal SCC second primaries are commonest in the upper aerodigestive tract (oesophagus, head and neck), with lung a close second. In HNSCC overall, lung is the most frequent site (Cummings).","src":"2024 exam recall · Paper 2 · Q43","d":"Head & Neck"},{"s":"Pt came to the emergency with intermittent stridor with gerhardts syndrome what is the most probable cause","o":["Bilateral abductor vocal cord paralysis","Tracheal stenosis","Bilateral adductor vocal cord paralysis","Subglottic stenosis"],"k":"A","x":"Gerhardt syndrome is bilateral abductor vocal fold paralysis (posterior cricoarytenoid weakness), causing inspiratory stridor with a near-normal voice (Scott-Brown).","src":"2024 exam recall · Paper 2 · Q44","d":"Laryngology"},{"s":"Case of recurrent juvenile protitis , which of the following seen by Ultrasound","o":["Multiple small roundish hyperechole areas in the glandular parenchyma","Heterogeneous echogenicity with distal acoustic shadowing","Homogenous echogenicity with distal acoustic shadowing","Heterogeneous echogenicity with multiple small hypoechogenic areas"],"k":"D","x":"Ultrasound in juvenile recurrent parotitis shows enlarged heterogeneous parotid glands with multiple small hypoechoic areas (sialectasis) (Cummings).","src":"2024 exam recall · Paper 2 · Q45","d":"Paediatric"},{"s":"Pt came with oral cavity cancer T2n2b 1 y ago treated with surgical removal and neck dissection after one year came with diffuse fullness at level 3 , Neck CT scan revealed an ill defined border with mixed density. Which of the following is the best investigation","o":["PET CT scan","Scintigraphy","Neck US","Observation with repeat CT in 6 months"],"k":"A","x":"Post-treatment neck changes with an ill-defined mass are best characterized by PET-CT (high negative predictive value), followed by US-guided FNA of any avid lesion (NCCN). Option D was blank in the recall; distractor added.","src":"2024 exam recall · Paper 2 · Q46","d":"Head & Neck"},{"s":"The limitation of endoscopic orbital decompression is","o":["Orbital apex","Lateral to infraorbital nerve","Postenor orbital floor","Anterior medial orbilal wall"],"k":"B","x":"Endoscopic orbital decompression removes the medial wall and the floor medial to the infraorbital nerve; bone lateral to the nerve cannot be reached endoscopically (Cummings).","src":"2024 exam recall · Paper 2 · Q47","d":"Rhinology"},{"s":"The blood supply of the nasolabial flap","o":["Superior labial","Inferior labial","Superficial ternporal","Angular"],"k":"D","x":"The nasolabial flap is supplied by perforators of the facial–angular artery (random pattern superiorly based on angular branches) (Cummings).","src":"2024 exam recall · Paper 2 · Q48","d":"Rhinology"},{"s":"Child pt with symptoms of severe epiglotitis symptoms, the next management","o":["Oral examination","Radiological investigations","Steroid and antibiotics","Secure the airway"],"k":"D","x":"Suspected epiglottitis: secure the airway first (controlled intubation in theatre with tracheostomy backup), avoiding throat examination or upsetting the child, then give IV antibiotics (Scott-Brown).","src":"2024 exam recall · Paper 2 · Q49","d":"Paediatric"},{"s":"12 month old child with PROGRESSIVE stridor, diagnosed as subglottic haemangioma, the BEST management","o":["Propranolol","Steroid nebulizer","Laser therapy","Intraleslonal steroid"],"k":"A","x":"⚑ The recall marked A and C. — Oral propranolol is first-line for symptomatic subglottic haemangioma, replacing steroids, laser and tracheostomy (Cummings).","src":"2024 exam recall · Paper 2 · Q50","d":"Paediatric"},{"s":"A 73-year-old woman with a history of metastatic SCC presents with lethargy, hypopharyngeal vomiting, hypotension, and tachycardia. A corrected serum calcium is found to found to be 3.14 mmoll/L(2.12-2.62). Which of the following electrocardiogram (ECG) abnormalities is most likely to be found?","o":["QRS interval shortening","QT interval prolongation","QT interval shortening","Peaked T wave"],"k":"C","x":"⚑ No answer was marked in the recall; answer supplied from the references. — Hypercalcaemia shortens the QT interval; hyperkalaemia gives peaked T waves and hypocalcaemia QT prolongation (Oxford Handbook).","src":"2024 exam recall · Paper 2 · Q51 (source tag: Oxford SBA)","d":"Head & Neck"},{"s":"Diplacusis is cuased by pathology of the","o":["Cochlea","Cochlear nucleus","Auditory nerve","Auditory cortical centers"],"k":"A","x":"⚑ No answer was marked in the recall; answer supplied from the references. — Diplacusis (the same tone perceived at a different pitch in each ear) is a cochlear (sensory) phenomenon, as in Ménière disease (Scott-Brown).","src":"2024 exam recall · Paper 2 · Q52","d":"Otology"},{"s":"Middle age female, with positive moure's sign","o":["Postcricold carcinoma","Pyriform fossa carcinoma","Osophogeal carcinoma","Epoglottic carcinoma"],"k":"A","x":"Loss of laryngeal crepitus (positive Moore sign) indicates post-cricoid carcinoma or a retro-cricoid mass (Scott-Brown).","src":"2024 exam recall · Paper 2 · Q53","d":"Others"},{"s":"Pt with cholesteatoma, during exploration the Dr noticed 1 cm loss of the mastoid segment of the facial nerve, management is","o":["Decompreas and cover with steroid soaked geil foam","Remove all cholesteatoma and plan nerve repair at a second stage","End to end facial nerve anastomosis","Dccompress, remove the injured segment and place cable graft"],"k":"D","x":"Loss of a segment of the facial nerve in clean surgery is repaired immediately: decompress, trim back to healthy ends and place an interposition (great auricular) cable graft; tension-free end-to-end repair is only possible with very short gaps (Brackmann).","src":"2024 exam recall · Paper 2 · Q54","d":"Otology"},{"s":"The most common cause of revision surgery post stapedectomy","o":["Facal nerve palsy","Severe headache","Recurrence of CHL","SNHL and verligo"],"k":"C","x":"Recurrent or persistent conductive hearing loss (prosthesis displacement, incus erosion) is the commonest indication for revision stapes surgery (Brackmann).","src":"2024 exam recall · Paper 2 · Q55 (source tag: Brackmann)","d":"Otology"},{"s":"Child 10 days post tonsillectomy, with ( Fever and Hb of 8 g/dl ), came to the emergency with bleeding and clot in one of the tonsills, management","o":["Vital signs monitoring and IV fluid","IV antibiotics and cold drinks","IV antibiotics and control the bleeding","Blood transfusion and ice cold drinks"],"k":"C","x":"Secondary post-tonsillectomy haemorrhage with fever (infection) and anaemia requires IV antibiotics and active control of bleeding (clot removal, cautery or theatre), with resuscitation and transfusion as needed (Scott-Brown).","src":"2024 exam recall · Paper 2 · Q56","d":"Paediatric"},{"s":"Pt post head trauma, examination revealed blood behind intact TM, the most likely cause","o":["Zygoma fracture","Tymoanic membrane rupture","Temporal bone fracture","Extemal canal trauma"],"k":"C","x":"Haemotympanum (blood behind an intact TM) after head injury indicates a temporal bone fracture (Scott-Brown).","src":"2024 exam recall · Paper 2 · Q57","d":"Others"},{"s":"A patient demonstrates aspiration after the swallow on a modified barium swallow study. This could be the result of","o":["Glottal incompetence","Incomplete mastication","Reduced labial closure","Reduced tongue mobility"],"k":"D","x":"Aspiration after the swallow results from pharyngeal residue (vallecular/pyriform) spilling into the airway, from reduced tongue-base retraction or pharyngeal weakness. Aspiration before the swallow reflects poor oral control or a delayed trigger (Bailey).","src":"2024 exam recall · Paper 2 · Q58 (source tag: Bailey (current ed.))","d":"Others"},{"s":"Disadvantages present in underlay but not onlay tympanoplasty","o":["Graf necrosis","Tympanic membrane blunting","Graft medialization","Cholesteatoma pearls"],"k":"C","x":"⚑ The recall marked A and C. — Underlay grafts can medialize and adhere to the promontory, while onlay grafts risk blunting, lateralization and pearls (Brackmann).","src":"2024 exam recall · Paper 2 · Q59","d":"Otology"},{"s":"Reading only the abstract of an original research article in an otolaryngology j ournal may provide an incomplete, or biased, view of study results because the abstract offers which of the following","o":["Usually does not provide the sample size","Frequently does not convey the study design","Infrequently describes adverse events","Provides too much information","Often confuses dropouts with loss to follow-up"],"k":"C","x":"Abstracts rarely report adverse events, so reading only the abstract can bias the reader towards benefit (Bailey).","src":"2024 exam recall · Paper 2 · Q60 (source tag: Bailey (current ed.))","d":"Others"},{"s":"Talliu or Henepert phenomena ? Found in","o":["High jagular bulb","Meniere's","Vestibular schwannoma","Tympanosclerosis"],"k":"B","x":"Tullio and Hennebert phenomena occur with third-window lesions (SSCD), perilymph fistula, congenital syphilis and Ménière disease (Scott-Brown).","src":"2024 exam recall · Paper 2 · Q61","d":"Others"},{"s":"Intracanalicular VS, with good hearing, the best approach is","o":["Infrutemporal","Middle cranial fossa","Transotic","Translabyrinthine"],"k":"B","x":"A small intracanalicular vestibular schwannoma with good hearing is suited to the middle cranial fossa approach (hearing preservation, lateral IAC access) (Brackmann).","src":"2024 exam recall · Paper 2 · Q62","d":"Otology"},{"s":"Mass that presents ASYMPTOMATIC at birth","o":["Lymphangioma","Cervical tertomas","TGD","Hemangioma"],"k":"A","x":"⚑ Key corrected — recalled answer: D; updated answer: A. — Lymphatic malformations are usually present at birth and often asymptomatic; infantile haemangiomas are typically absent or minimal at birth and appear in the first weeks (Cummings).","src":"2024 exam recall · Paper 2 · Q63","d":"Others"},{"s":"Pt with epistaxis, Which of the following land marks used to identify sphenopalatine","o":["Uncinate and choana","Middle meatus and caudal end of middle turbinate","Uncinate and posterior end of interior turbinate","Uncinate and bulla ethmoidalis"],"k":"B","x":"The sphenopalatine foramen lies at the posterior end of the middle meatus, just behind the posterior attachment of the middle turbinate; the crista ethmoidalis is the key landmark (Cummings).","src":"2024 exam recall · Paper 2 · Q64","d":"Rhinology"},{"s":"Case with parotid abscess, The incision will be","o":["Parallel to the direction of the facial nerve","With an incision on middle part of the cheek","With an incision 2 cm from the lawer border of mandible","Perpendicutar to the direction of the facial nerve"],"k":"A","x":"⚑ Key corrected — recalled answer: D; updated answer: A. — A parotid abscess is drained through incisions parallel to the facial nerve branches (Hilton method / blunt dissection) to avoid nerve injury (Cummings).","src":"2024 exam recall · Paper 2 · Q65","d":"Head & Neck"},{"s":"Case with trismus? and retromandibular swelling, with ant displaced tragus, The most likely cause","o":["Parotid pland abscess","Sjogren's syndrome","Lyme disease","Acute otitis externa"],"k":"A","x":"A tense retromandibular swelling with trismus and anterior displacement of the tragus/earlobe suggests a deep parotid abscess (Cummings).","src":"2024 exam recall · Paper 2 · Q66","d":"Others"},{"s":"Cochlear implant contraindications","o":["History of meningitis","Michel aplasia","Enlarged vestibular aqueduct","Auditory neuropathy"],"k":"B","x":"Michel aplasia (complete labyrinthine aplasia) is an absolute contraindication to cochlear implantation (Scott-Brown).","src":"2024 exam recall · Paper 2 · Q67","d":"Otology"},{"s":"Contraindication to brachytheraby","o":["T1-T2 tumors","Bone infiltration","Post-surgical recurrence","Positive surgical margins"],"k":"B","x":"Brachytherapy is avoided when tumour infiltrates bone because of the high risk of osteoradionecrosis (Bailey).","src":"2024 exam recall · Paper 2 · Q68","d":"Others"},{"s":"The most serious complication of the infracochlear approach to the petrous apex is","o":["Sensorineural hearing loss","Facial nerve injury","Carotid artery injury","Rupture of the jugular bulb"],"k":"C","x":"The infracochlear approach to the petrous apex passes between the ICA (anteriorly) and jugular bulb, so carotid injury is the most serious risk (Brackmann).","src":"2024 exam recall · Paper 2 · Q69 (source tag: Brackmann)","d":"Otology"},{"s":"CIS definition","o":["A full thickness epithellial replacement by malignant cells without basement membrane invasion","A 75% thickness epithellial replacement by malignant cells without basement membrane invasion","A 50% thickness epithellial replacement by malignant cells without basement membrane invasion","A full thickness epithellial replacement by malignant cells with basement membrane invasion"],"k":"A","x":"Carcinoma in situ is full-thickness replacement of the epithelium by malignant cells without breach of the basement membrane (Cummings).","src":"2024 exam recall · Paper 2 · Q70","d":"Others"},{"s":"Pt with 3 FESS during 1 year, came with 300 eosinophil & 80 IgE, The next management is","o":["Revsion FESS","Omalozemab","Dupilmab","Oral sterold"],"k":"C","x":"Recurrent CRSwNP after multiple surgeries with eosinophilia (≥150–300/µL) and type 2 inflammation is an indication for a biologic, typically dupilumab (anti-IL-4Rα) (EPOS 2020).","src":"2024 exam recall · Paper 2 · Q71","d":"Rhinology"},{"s":"The most common cause of PORP failure is","o":["Absence of malleus handle","Age of the patient","Absence of a cartilage interface","Short prosthesis"],"k":"C","x":"The commonest cause of PORP/TORP failure is extrusion through the TM, prevented by a cartilage interface between prosthesis and graft (Brackmann).","src":"2024 exam recall · Paper 2 · Q72 (source tag: Brackmann)","d":"Otology"},{"s":"Pt presents with subglottic tumour invading the cricoid cartilage, Stage is","o":["II","III","IVa","IVb"],"k":"C","x":"Subglottic carcinoma invading through the cricoid cartilage is T4a, giving stage IVA (AJCC 8).","src":"2024 exam recall · Paper 2 · Q73","d":"Head & Neck"},{"s":"The structure at risk during infralabyrinthine approach is","o":["PSCC","Carotid artery","Facial nerve","Jugular bulb"],"k":"D","x":"The infralabyrinthine approach to the petrous apex is limited by the jugular bulb below and the facial nerve laterally, so the jugular bulb is at greatest risk (Brackmann).","src":"2024 exam recall · Paper 2 · Q74 (source tag: Brackmann)","d":"Others"},{"s":"The best treatment of laryngeal Wegener’s disease","o":["Methotrexate","Cyclophosphamide","Laser excision","Steroid"],"k":"B","x":"Systemic GPA with laryngeal disease is treated with steroids plus cyclophosphamide (or now rituximab), with intralesional steroid and endoscopic dilatation for established subglottic stenosis (ACR/EULAR; Cummings).","src":"2024 exam recall · Paper 2 · Q75","d":"Laryngology"},{"s":"Unilateral maxillary sinusitis with intraotbital extension ( No signs of AIFRS; so here it's AFRS), what is the best management","o":["Oral itraconazola","FESS and IV voriconazole","FESS and amphotericin B","FESS and oral steroid"],"k":"D","x":"Allergic fungal rhinosinusitis (even with orbital expansion) is treated by FESS with removal of all fungal mucin, followed by systemic and topical steroids; antifungals are not first-line (EPOS; Cummings).","src":"2024 exam recall · Paper 2 · Q76","d":"Rhinology"},{"s":"Pt with cholesteatoma and labyrinthine fistula, which one is the most favorable situation to close it","o":["A 15-mm flstula involving the LSSC and vestibule","A 1-mm LSCC fistula in an only hearing ear","A 0.5 -mm cochlear fistula With normal hearing in the contralateral ear","A 1.5-mm LSCC fistula, with contralateral normal hearing ear"],"k":"D","x":"Matrix removal and fistula closure is safest for a small (≤2 mm) lateral canal fistula with normal contralateral hearing. Large fistulae, cochlear fistulae and only-hearing ears favour leaving matrix in place (Brackmann).","src":"2024 exam recall · Paper 2 · Q77 (source tag: Brackmann)","d":"Otology"},{"s":"Female pt with peri oral pallor and glossitis, complaining of postcricoid Ca ( I think ), What’s the cause","o":["Hereditary factors","Exposure to lonizing radiation","Plummer Vinson syndrome","EBV"],"k":"C","x":"Glossitis, pallor (iron deficiency), dysphagia/post-cricoid web and post-cricoid carcinoma risk indicate Plummer–Vinson (Paterson–Brown-Kelly) syndrome (Scott-Brown).","src":"2024 exam recall · Paper 2 · Q78","d":"Head & Neck"},{"s":"Child pt post DA ligation, started to complain of breathy crying and aspiration, what is the cause","o":["Laryngeal papillomatosis","Laryngomalacia","Unilateral vocal fold paralysis","Subglottic haemagioma"],"k":"C","x":"PDA ligation risks injury to the left recurrent laryngeal nerve (which loops around the ductus), causing weak cry and aspiration from unilateral paralysis (Cummings).","src":"2024 exam recall · Paper 2 · Q79","d":"Paediatric"},{"s":"Pt with patulous ET, what is the cause","o":["Eustachian Tube endoscopy","Adenoidectomy","Uvulopalatopharyngoplasty","Bariatric surgery"],"k":"D","x":"Rapid weight loss (bariatric surgery), pregnancy and radiotherapy cause a patulous Eustachian tube through loss of peritubal fat (Scott-Brown).","src":"2024 exam recall · Paper 2 · Q80","d":"Others"},{"s":"Pt with headache and nasal purulence, No improvement post antibiotic and other medications, what is next","o":["IV antibiotics","Systemic steroids","CT paranasal sinuses","Swab for C/S"],"k":"C","x":"Failure of medical therapy for sinusitis is an indication for CT of the paranasal sinuses (to confirm and stage disease and plan surgery) (EPOS; AAO-HNS).","src":"2024 exam recall · Paper 2 · Q81","d":"Rhinology"},{"s":"Male pt with headache for 2 days, nasal obstruction & nasal tip pain, the diagnosis is","o":["Acute fungal rhinosinusitis","Cavernous sinus thrombophlebitis","Pyogenic granuloma","Septal abscess"],"k":"D","x":"Nasal obstruction with tenderness of the nasal tip/septum, headache and fever (often after trauma) suggests a septal haematoma/abscess, which needs urgent drainage (Scott-Brown).","src":"2024 exam recall · Paper 2 · Q82","d":"Rhinology"},{"s":"Pt with severe aspiration & is tracheostomized who wants to swallow normally and discharged home","o":["Laryngotracheal separation","Replace with a fenestrated cuffed tube","Discharge home without any intervention","Place a laryngeal stent"],"k":"A","x":"Intractable aspiration in a tracheostomized patient wishing to eat orally is managed by laryngotracheal separation/diversion, which is reversible and eliminates aspiration (Bailey).","src":"2024 exam recall · Paper 2 · Q83 (source tag: Bailey (current ed.))","d":"Laryngology"},{"s":"Pt came with oropharyngeal tumor T2N2b treated with CRX to the left tonsil, which one of the following should done next?","o":["CT of neck one month later after the treatment","Modified radical neck dissection 2 months later","PET CT scan 3 months after treatment","Immediate lonsillectomy"],"k":"C","x":"⚑ The recall marked B and C. — After chemoradiation, PET-CT about 12 weeks after treatment determines the need for neck dissection (PET-NECK trial), avoiding unnecessary planned dissections (NCCN).","src":"2024 exam recall · Paper 2 · Q84","d":"Head & Neck"},{"s":"A child with parotitis, has undergone sialendoscopy, 8 months later he came with the same complain, what should done","o":["Total parotidectomy","Sialendoscopy","Superficlal parotidectomy","Botox injection"],"k":"B","x":"Juvenile recurrent parotitis often recurs and is managed by repeat sialendoscopy with irrigation and steroid instillation; parotidectomy is not indicated (Cummings).","src":"2024 exam recall · Paper 2 · Q85","d":"Paediatric"},{"s":"Dupilmab MOA is against","o":["IL-4","IL-8","IL-20","IL-23"],"k":"A","x":"Dupilumab blocks the IL-4 receptor α subunit, inhibiting IL-4 and IL-13 signalling (EPOS 2020).","src":"2024 exam recall · Paper 2 · Q86","d":"Rhinology"},{"s":"Glottic carcinoma: the most common route of spread into the paraglottic space is through:","o":["Deep invasion through the thyroarytenoid (vocalis) muscle","Epiglottis","Thyroepiglottic ligament","Thyrohyoid membrane"],"k":"A","x":"⚑ Option A repaired: none of the recalled options described the route (recalled key: thyrohyoid membrane, which is a route out of the larynx). — Glottic tumours reach the paraglottic space by deep lateral invasion through the thyroarytenoid muscle (± conus elasticus), causing cord fixation (T3) (Cummings).","src":"2024 exam recall · Paper 2 · Q87","d":"Laryngology"},{"s":"Child had sever cough and distress, when admitted every thing was good, what should be done next","o":["Steroid","Bronchoscopy","Antibiotics","Discharge"],"k":"B","x":"A choking or coughing episode with distress, even if the child is now well, warrants bronchoscopy to exclude an inhaled foreign body (Scott-Brown).","src":"2024 exam recall · Paper 2 · Q88","d":"Paediatric"},{"s":"The most diagnostic test of CSF rhinorrhea","o":["B2 Transferrin","HRCT","Cysternogram","Glucose oxidase test strip"],"k":"A","x":"⚑ No answer was marked in the recall; answer supplied from the references. — β2-transferrin (or β-trace protein) in nasal fluid is the most specific confirmatory test for CSF; HRCT and cisternography localize the leak (Cummings). Option D was blank in the recall; distractor added.","src":"2024 exam recall · Paper 2 · Q89","d":"Rhinology"},{"s":"Iliac crest flap blood supply","o":["Deep circumflex illac","Superficial femoral iliac","External pudendal ilac","Superficial circumflex iliac"],"k":"A","x":"The iliac crest osteocutaneous flap is based on the deep circumflex iliac artery (Cummings).","src":"2024 exam recall · Paper 2 · Q90","d":"Head & Neck"},{"s":"When should the post septal flap be harvested in pituitary surgery","o":["Direct before posterior septectomy","Direct after posterior septectomy","At the end of the surgery","Only after tumour removal, once a leak is confirmed (rescue-flap technique not used)"],"k":"A","x":"⚑ No answer was marked in the recall; answer supplied from the references. — The nasoseptal flap (pedicled on the posterior septal artery) is harvested at the start, before the posterior septectomy and wide sphenoidotomy that would cut its pedicle; alternatively a \"rescue flap\" incision preserves it (Cummings). Option D was blank in the recall; distractor added.","src":"2024 exam recall · Paper 2 · Q91","d":"Head & Neck"},{"s":"Dr in stapes surgery, which of the following is contraindication, and required to abort the surgery","o":["Prolapsed facial nerve covering footplale","Fixed incudomalieal joint","Solid or oblitlerated foolplale","Tear in the tympanic membrane and flap"],"k":"A","x":"A prolapsed facial nerve completely covering the oval window/footplate is a reason to abort stapedotomy; an obliterated footplate can be drilled (Brackmann).","src":"2024 exam recall · Paper 2 · Q92 (source tag: Brackmann)","d":"Otology"},{"s":"Which is the best description of how the evidence evidence-based medicine is graded","o":["The overall grade is a compilation of the level of the best studies","The overall grade is based on the highest level of study available","The overall grade is determined by the level of the largest number of studies","The overall grade is determined by the level of the poorest individual study"],"k":"A","x":"The overall grade of a recommendation is a compilation of the quality and consistency of the whole body of evidence, not only the single highest or lowest study (Bailey).","src":"2024 exam recall · Paper 2 · Q93 (source tag: Bailey (current ed.))","d":"Others"},{"s":"50 y old diabetic man presented with sever pain of the lt ear. Ex revealed a small pustule on the post wall of the EAC. What is the most likely organism causing this condition","o":["P aurogenosa","S aureus","Aspergellous","Candida"],"k":"B","x":"⚑ The recall marked A and B. — An acute painful pustule of the outer (hair-bearing) canal is a furuncle, caused by Staphylococcus aureus; Pseudomonas causes diffuse and necrotizing otitis externa (Scott-Brown).","src":"2024 exam recall · Paper 2 · Q94","d":"Otology"},{"s":"A 4 y old boy with proptosis and check swelling, he is susbected to have ossifying fibroma, which of the following is the best treatment","o":["Surgery","Steroids","Intralsesional steroids","Observation"],"k":"A","x":"Ossifying fibroma (especially juvenile aggressive forms) is treated by complete surgical excision because it is locally aggressive and recurs if incompletely removed (Cummings).","src":"2024 exam recall · Paper 2 · Q95","d":"Paediatric"},{"s":"Oral cavity carcinoma with a single ipsilateral lymph node measuring 2 × 4 cm (no ENE). What is the N stage?","o":["II","III","N2a","N2b"],"k":"C","x":"⚑ No answer was marked in the recall; answer supplied from the references. — A single ipsilateral node of 4 cm (>3 cm and ≤6 cm, ENE-negative) is N2a in AJCC 8 for HPV-negative oral cancer (AJCC 8).","src":"2024 exam recall · Paper 2 · Q96","d":"Head & Neck"},{"s":"The most common type of Epidermolysis bullosa affect the larynx","o":["Kindler syndrome","Simplex","Junctional","Dystrophic"],"k":"C","x":"⚑ No answer was marked in the recall; answer supplied from the references. — Junctional epidermolysis bullosa most often involves the larynx (blisters, granulation tissue, airway stenosis) (Cummings).","src":"2024 exam recall · Paper 2 · Q97","d":"Laryngology"},{"s":"Laryngeal endoscopy show nibble ulceration what's the pathology","o":["TB","Sarcoidoses","Laryngeal amyloidosis","Squamous cell carcinoma"],"k":"A","x":"⚑ No answer was marked in the recall; answer supplied from the references. — \"Mouse-nibbled\" ulceration of the posterior larynx (interarytenoid region) is classic for laryngeal tuberculosis (Scott-Brown). Options C and D were blank in the recall; distractors added.","src":"2024 exam recall · Paper 2 · Q98","d":"Laryngology"},{"s":"Correction of androphonea in women, By Thyroplasty Type","o":["I","II","III","IV"],"k":"D","x":"⚑ No answer was marked in the recall; answer supplied from the references. — Type IV thyroplasty (cricothyroid approximation) raises vocal pitch, as used for androphonia or gender-affirming voice surgery (Isshiki; Cummings).","src":"2024 exam recall · Paper 2 · Q99","d":"Laryngology"},{"s":"The distinction between a tympanomastoid glomus tympanicum versus a tympanomastoid glomus jugulare is","o":["Visible mass in a tympanicum","Erosion of jugular bulb","Erosion of carotid canal","Middle ear and mastoid involvement"],"k":"B","x":"⚑ No answer was marked in the recall; answer supplied from the references. — The Glasscock–Jackson system distinguishes glomus jugulare by erosion of the jugular bulb/jugular foramen on CT; a tympanicum arises on the promontory with an intact jugular plate (Brackmann).","src":"2024 exam recall · Paper 2 · Q100 (source tag: Brackmann)","d":"Otology"}]}];let PI=0;let P=PAPERS[0];let Q=P.q;const L='ABCDEF';
const DOMS=['Otology','Rhinology','Laryngology','Head & Neck','Paediatric','Others'];
let S={mode:'exam',mins:180,phase:'start',pos:0,ans:{},flag:{},end:0,start:0,tick:null,used:0,list:[],rpos:0,rtitle:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')};
function nav(html){let n=document.querySelector('.nav');if(!html){n&&n.remove();return}if(!n){n=document.createElement('div');n.className='nav';document.body.appendChild(n)}n.innerHTML='<div class="navi">'+html+'</div>'}
function startScreen(){
  S.phase='start';nav();clearInterval(S.tick);
  const cnt={};Q.forEach(q=>cnt[q.d]=(cnt[q.d]||0)+1);
  $('#app').innerHTML=`<div class="kicker">Palestinian Board · Exam recall · answered</div><h1>Part II Exam 2024</h1><b>Paper</b><div class="seg" role="group" aria-label="Paper" style="flex-wrap:wrap">${PAPERS.map((p,i)=>`<button class="${PI==i?'on':''}" onclick="pickPaper(${i})">${i+1}</button>`).join('')}</div><h2 style="margin:14px 0 6px;font-size:1.15rem">${esc(P.title)}</h2>
  <p class="sub">The 2024 Part II recall, two papers (100 + 99 questions). Each question is answered against our references (Cummings, Scott-Brown, Brackmann, Bailey, Ballenger, Oxford SBA, KJ Lee, AJCC 8, NCCN), with a short referenced explanation. Recalled keys that were changed or unmarked are flagged ⚑, and incomplete stems and options are repaired.</p>
  <div class="card"><table>${DOMS.filter(d=>cnt[d]).map(d=>`<tr><td>${d}</td><td>${cnt[d]}</td></tr>`).join('')}</table></div>
  <b>Mode</b><div class="seg" role="group" aria-label="Mode"><button class="${S.mode=='exam'?'on':''}" onclick="S.mode='exam';startScreen()">Exam — marked at the end</button><button class="${S.mode=='practice'?'on':''}" onclick="S.mode='practice';startScreen()">Practice — instant feedback</button></div>
  ${S.mode=='exam'?`<b>Time</b><div class="seg" role="group" aria-label="Time limit">${[180,150,120,90].map(m=>`<button class="${S.mins==m?'on':''}" onclick="S.mins=${m};startScreen()">${m==180?'3 h':m+' min'}</button>`).join('')}</div>`:''}
  <button class="primary" onclick="begin()">Start paper</button>
  <p class="note">${S.mode=='exam'?'You can change answers and flag questions until you submit. The paper submits itself when time runs out.':'Each answer is marked when you tap it and locks. Untimed.'} Progress is kept while this page stays open.</p>`;
  scrollTo(0,0)}
function begin(){S.ans={};S.flag={};S.pos=0;S.phase='run';S.start=Date.now();
  if(S.mode=='exam'){S.end=S.start+S.mins*60000;S.tick=setInterval(()=>{const r=S.end-Date.now();const t=$('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}
  show()}
function answered(){return Object.keys(S.ans).length}
function show(){
  const q=Q[S.pos],a=S.ans[S.pos],prac=S.mode=='practice';
  let h=`<div class="top"><div class="topi">${S.mode=='exam'?`<span class="timer" id="tm">${fmt(S.end-Date.now())}</span>`:`<span class="timer">${Object.entries(S.ans).filter(([i,v])=>v==Q[i].k).length}/${answered()}</span>`}<span class="t">${answered()} of ${Q.length} answered</span><button class="flagbtn ${S.flag[S.pos]?'on':''}" onclick="flag()" aria-pressed="${!!S.flag[S.pos]}">${S.flag[S.pos]?'Flagged':'Flag'}</button></div><div class="bar"><i style="width:${(S.pos+1)}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${Q.length}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${S.pos+1}" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,i)=>{const l=L[i];let c='';if(prac&&a){if(l==q.k)c='ok';else if(l==a)c='bad'}else if(a==l)c='sel';
    h+=`<button class="opt ${c}" ${prac&&a?'disabled':''} onclick="pick('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(prac&&a)h+=expl(q,a);
  $('#app').innerHTML=h;
  const last=S.pos==Q.length-1;
  nav(`<button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Questions</button>${last?`<button class="primary" onclick="confirmSubmit()">Submit</button>`:`<button class="primary" onclick="go(1)">Next</button>`}`);
}
function expl(q,a){const ok=a==q.k;
  return `<div class="exp"><h3 class="${a?(ok?'ok':'bad'):'na'}">${a?(ok?'Correct':'Incorrect'):'Not answered'} — answer ${q.k}</h3>${q.x?`<p>${esc(q.x)}</p>`:`<p class="note">The source gives the key only for this question.</p>`}${q.xi?q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join(''):''}<div class="src">${esc(q.d)} · ${esc(q.src)}</div></div>`}
function pick(l){if(S.mode=='practice'&&S.ans[S.pos])return;if(S.mode=='exam'&&S.ans[S.pos]==l)delete S.ans[S.pos];else S.ans[S.pos]=l;const y=scrollY;show();scrollTo(0,y)}
function flag(){S.flag[S.pos]?delete S.flag[S.pos]:S.flag[S.pos]=1;const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(Q.length-1,S.pos+d));show();scrollTo(0,0)}
function grid(){const d=$('#dlg');const nf=Object.keys(S.flag).length,na=Q.length-answered();
  d.innerHTML=`<b>Questions</b><div class="legend" style="margin-top:6px"><span class="a">Answered (${answered()})</span><span class="f">Flagged (${nf})</span><span>Unanswered (${na})</span></div>
  <div class="grid">${Q.map((_,i)=>`<button class="${S.ans[i]?'ans':''} ${S.flag[i]?'flg':''} ${i==S.pos?'cur':''}" onclick="S.pos=${i};$('#dlg').close();show();scrollTo(0,0)" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div>
  <div class="row"><button class="ghost" onclick="$('#dlg').close()">Close</button><button class="primary" onclick="$('#dlg').close();confirmSubmit()">Submit paper</button></div>`;d.showModal()}
function confirmSubmit(){const d=$('#dlg');const na=Q.length-answered(),nf=Object.keys(S.flag).length;
  d.innerHTML=`<b>Submit this paper?</b><p class="note">${na?`${na} question${na>1?'s are':' is'} unanswered. `:'All questions answered. '}${nf?`${nf} flagged.`:''} You can't change answers after submitting.</p><div class="row"><button class="ghost" onclick="$('#dlg').close()">Keep going</button><button class="primary" onclick="$('#dlg').close();submit()">Submit</button></div>`;d.showModal()}
function submit(auto){clearInterval(S.tick);S.used=Date.now()-S.start;S.phase='done';S.auto=!!auto;if($('#dlg').open)$('#dlg').close();results()}
function results(){nav();
  let r=0;const by={};Q.forEach((q,i)=>{const b=by[q.d]=by[q.d]||{n:0,r:0};b.n++;if(S.ans[i]==q.k){r++;b.r++}});
  const wrong=Q.map((q,i)=>i).filter(i=>S.ans[i]&&S.ans[i]!=Q[i].k),skip=Q.map((q,i)=>i).filter(i=>!S.ans[i]),fl=Object.keys(S.flag).map(Number).sort((a,b)=>a-b);
  $('#app').innerHTML=`<div class="kicker">${esc(P.title)}</div><h1>Results</h1>${S.auto?'<p class="note">Time ran out — the paper was submitted automatically.</p>':''}
  <div class="big">${r}<span style="font-size:1.4rem;color:var(--muted)">/100</span></div><p class="sub">${wrong.length} incorrect · ${skip.length} unanswered · time used ${fmt(S.used)}</p>
  <div class="card"><table>${DOMS.filter(d=>by[d]).map(d=>{const b=by[d],p=Math.round(b.r/b.n*100);return `<tr><td>${d}<div class="meter"><i style="width:${p}%"></i></div></td><td>${b.r}/${b.n} · ${p}%</td></tr>`}).join('')}</table></div>
  <div class="row"><button class="primary" ${wrong.length+skip.length?'':'disabled'} onclick="review('Incorrect and unanswered',${JSON.stringify(wrong.concat(skip).sort((a,b)=>a-b))})">Review incorrect (${wrong.length+skip.length})</button></div>
  <div class="row"><button class="ghost" ${fl.length?'':'disabled'} onclick="review('Flagged',${JSON.stringify(fl)})">Flagged (${fl.length})</button><button class="ghost" onclick="review('All questions',${JSON.stringify(Q.map((_,i)=>i))})">All 100</button></div>
  <div class="row"><button class="ghost" onclick="startScreen()">Retake paper</button></div>`;scrollTo(0,0)}
function review(t,list){S.list=list;S.rpos=0;S.rtitle=t;rshow()}
function rshow(){const i=S.list[S.rpos],q=Q[i],a=S.ans[i];
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="results()">Results</button><span class="t">${S.rtitle} · ${S.rpos+1}/${S.list.length}</span>${S.flag[i]?'<span class="flagbtn on">Flagged</span>':''}</div></div>
  <div class="qn">Question ${i+1}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,j)=>{const l=L[j];const c=l==q.k?'ok':(l==a?'bad':'');h+=`<button class="opt ${c}" disabled><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  h+=expl(q,a);$('#app').innerHTML=h;
  nav(`<button class="ghost" ${S.rpos?'':'disabled'} onclick="S.rpos--;rshow();scrollTo(0,0)">Previous</button><button class="primary" ${S.rpos<S.list.length-1?'':'disabled'} onclick="S.rpos++;rshow();scrollTo(0,0)">Next</button>`)}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
window.addEventListener('beforeunload',e=>{if(S.phase=='run'){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(S.phase!='run'||$('#dlg').open)return;if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else{const i=L.indexOf(e.key.toUpperCase());if(e.key.length==1&&i>=0&&i<Q[S.pos].o.length)pick(L[i])}});
startScreen();

function pickPaper(i){PI=i;P=PAPERS[i];Q=P.q;S.ans={};S.flag={};S.pos=0;startScreen()}</script></body></html>
