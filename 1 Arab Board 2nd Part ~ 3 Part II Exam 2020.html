<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ENT Part II Exam 2020 — Answered &amp; Referenced</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--amber:#B06A00;--amber-soft:#FBEFD9;--box:#0B1418;--on-teal:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--amber:#E8A94A;--amber-soft:#3A2C14;--box:#000;--on-teal:#06201F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td:last-child{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px 8px;text-align:center}
.seg button.on{background:var(--teal);color:var(--on-teal);font-weight:600}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note{font-size:.9rem;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.timer{font:700 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.topi .t{flex:1;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.flagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
.flagbtn.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.qn{font-weight:600;font-size:.9rem;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{opacity:1}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}.exp h3.na{color:var(--amber)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;position:relative}
.grid .ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.grid .flg{box-shadow:inset 0 0 0 2px var(--amber)}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-na{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid .cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.legend .a::before{background:var(--teal-soft);border-color:var(--teal)}.legend .f::before{box-shadow:inset 0 0 0 2px var(--amber)}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3.2rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>button{flex:1}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--teal)}
</style></head><body>

const PAPERS=[{"title":"2020 Exam · Paper A","q":[{"s":"A 67-year old male with a T2 supraglottic squamous cell carcinoma. Involvement of which of the following anatomic subsists is consistent with extralaryngeal spread?","o":["Aryepiglottic folds","Infrahyoid epiglottis","Suprahyoid epiglottis","Vallecula,","Arytenoids"],"k":"D","x":"Supraglottic tumour extending to the vallecula (base of tongue mucosa) is T2 — involvement of a site outside the supraglottis without fixation (AJCC 8).","src":"2020 exam recall · Q1","d":"Head & Neck"},{"s":"Which of the following pathologies of the parotid gland, would NOT require a neck dissection? Articleﻣﻊ ﻟﺗﻌﯾ","o":["Squamous cell carcinoma","High-grade mucoepidermoid","Adenoid cystic carcinoma with perineural invasion","A 4.5 cm acinic cell carcinoma","Adenocarcinoma with N2 nodal disease on CT"],"k":"C","x":"Adenoid cystic carcinoma has a low nodal metastasis rate, so elective neck dissection is not routinely needed; SCC, high-grade MEC, large/high-grade tumours and node-positive disease need it (NCCN).","src":"2020 exam recall · Q2","d":"Head & Neck"},{"s":"A 50-year old female with Papillary thyroid cancer presents postoperatively after total thyroidectomy . According to recent guideline, TSH should be suppressed below what level?","o":["0. 01 uIU/ml","0.1 uIU/ml","0.5 uIU/ml","1.0 uIU/ml","2.0 uIU/ml"],"k":"B","x":"After total thyroidectomy for higher-risk PTC, TSH is suppressed to about ≤0.1 mU/L initially; low-risk targets are 0.5–2 (ATA 2015).","src":"2020 exam recall · Q3","d":"Head & Neck"},{"s":"A 45-year old female with Sjogren's syndrome, which of the following malignancy which this patient at a higher risk compared with the normal population?","o":["Hodgkin lymphoma","Chronic lymphocytic leukemia","Chronic myeloid leukemia","Diffuse large B-cell lymphoma","Mucosa associated lymphoid tissue type lymphoma (MALT)"],"k":"E","x":"Sjögren syndrome raises the risk of MALT (marginal zone) B-cell lymphoma, especially in the parotid (Cummings).","src":"2020 exam recall · Q4","d":"Others"},{"s":"Within the context of laryngeal malignancies, where is a \"marginal\" tumour located?","o":["Laryngeal epiglottis","Laryngeal ventricle","Aryepiglottic fold","Subglottis","Arytenoids"],"k":"C","x":"The \"marginal\" zone of the larynx is the aryepiglottic fold region, at the junction of larynx and hypopharynx (Scott-Brown).","src":"2020 exam recall · Q6","d":"Laryngology"},{"s":"Which of the following statements is true regarding lymph node metastasis in papillary thyroid carcinoma?","o":["Central neck dissection is recommended for all cases of papillary thyroid carcinoma","Central neck dissection is recommended for papillary thyroid carcinoma tumours","In patients with palpable or visible neck disease, a comprehensive neck dissection","Elective treatment of the contralateral neck lymph nodes is indicated for high stage","Children younger than 15 years old with papillary thyroid carcinoma have a 20% rate"],"k":"B","x":"Prophylactic central neck dissection is recommended for advanced PTC (T3–T4) even without clinical nodes (ATA 2015).","src":"2020 exam recall · Q7","d":"Head & Neck"},{"s":"Which statement is INCORRECT regarding microflap surgery of the vocal fold?","o":["A conservative surgical approach for submucosal benign pathology","Involves complete removal of vocal fold mucosa for the treatment of dysphonia.","Surgical precision and patience are required","Microinstrumentation with various angulations is involved","Saline or epinephrine submucosal infiltration can help with the microflap elevation"],"k":"B","x":"Microflap surgery preserves the superficial lamina propria; it does not remove the vocal ligament (Cummings).","src":"2020 exam recall · Q8","d":"Laryngology"},{"s":"The utility of sentinel node biopsy is higher in patients with tumors in the","o":["Vallecula","Oral tongue","Pyriform sinus","Base of the tongue","larynx"],"k":"B","x":"Sentinel node biopsy is most useful in early oral tongue cancer (NCCN).","src":"2020 exam recall · Q11","d":"Head & Neck"},{"s":"The optimal treatment of recurrent cervical lymph node metastasis in nasopharyngeal carcinoma following radiotherapy is","o":["Second, course of radio therapy","Modified neck dissection,","Radical neck dissection","Radical neck dissection followed by radiotherapy","Chemotherapy and radiotherapy"],"k":"C","x":"Recurrent nodal NPC after radiotherapy is best treated by radical neck dissection, because of extensive nodal and extranodal spread (Wei; Cummings).","src":"2020 exam recall · Q12","d":"Rhinology"},{"s":"Which of the following is NOT included in the treatment options for bilateral cord paralysis","o":["Tracheostomy","Suture lateralization","Vocal cord augmentation, Worsen the situation","Transverse cordotomy","Arytenoidectomy"],"k":"C","x":"Vocal fold augmentation worsens the airway; it is not used for bilateral paralysis (Cummings).","src":"2020 exam recall · Q13","d":"Others"},{"s":"The MOST COMMON affected site for laryngeal sarcoidosis is","o":["Mid-laryngeal","Subglottis","Supraglottis","Anterior commissure","Posterior commissure"],"k":"C","x":"Laryngeal sarcoidosis most often involves the supraglottis (Cummings).","src":"2020 exam recall · Q15","d":"Laryngology"},{"s":"A 62-year old male was discovered to have a 4. 5 cm squamous cell carcinoma of the pyriform sinus encroaching on arytenoid cartilage and leading to fixation of the hemilarynx. Clinical examination of the neck was negative for enlarged nodes. The MOST appropriate treatment plan from the following is: It is (T3N0, Stage III)","o":["Concurrent chemoradiation to the primary site","External beam radiation therapy alone to the primary site and neck","Total pharyngolaryngectomy","Total pharyngolaryngectomy and bilateral neck dissection","Total pharyngolaryngectomy + bilateral neck dissection+ radial forearm flap reconstruction"],"k":"E","x":"T4a pyriform sinus SCC with fixation/cartilage involvement: total pharyngolaryngectomy with bilateral neck dissection and adjuvant (chemo)radiation (NCCN).","src":"2020 exam recall · Q16","d":"Rhinology"},{"s":"A 55-year old male presents with hoarseness of voice over the past 8 months. He is known to be a heavy smoker and admits to occasional alcohol consumption. On examination, a lesion of 1cm was noted on the right vocal cord, Examination of the neck was normal. MOST appropriate initial management is","o":["Referral to stop working clinic","CT scan of the neck and chest","Proton pump inhibitor for 6 weeks","Microlaryngoscopy with excisional biopsy","MRI scans of the neck"],"k":"D","x":"Persistent hoarseness in a smoker needs microlaryngoscopy with excisional biopsy (Bailey).","src":"2020 exam recall · Q17","d":"Laryngology"},{"s":"Adenoid Cystic Carcinoma of the salivary glands","o":["Most commonly affected the parotid gland","Usually bilateral","Tubular histological type is usually associated with worse prognosis","Surgery with postoperative radiotherapy remains the mainstay of treatment","Chances of long term recurrence and distant metastasis are minimal with full treatment"],"k":"D","x":"Adenoid cystic carcinoma is treated by surgery with postoperative radiotherapy; it has a long natural history with late recurrence (Cummings).","src":"2020 exam recall · Q18","d":"Head & Neck"},{"s":"Regarding parotid surgery:","o":["Facial nerve monitoring should be reserved for difficult and revision cases only","Posterior belly of digastric muscle identifies the plane of the facial nerve","Hypoesthesia of the greater auricular nerve is an uncommon complication","Frey's syndrome is an uncommon complication postoperatively","Modified Blair incision is inadequate when neck dissection is indicated"],"k":"B","x":"The posterior belly of digastric is a key landmark: the facial nerve trunk lies at its level, superior and deep (Cummings).","src":"2020 exam recall · Q19","d":"Head & Neck"},{"s":"Chylous fistula post neck dissection","o":["Most commonly on the right side,","Most commonly sales with vacuum suctioning to neck drains,","Appears within the first 24 hours postoperatively","Occurs m 5-10% of neck dissection","Regular monitoring of electrolytes is mandatory"],"k":"E","x":"High-output chyle leak causes fluid, electrolyte and protein loss, so electrolytes are monitored; it is commoner on the left side (Cummings).","src":"2020 exam recall · Q20","d":"Head & Neck"},{"s":"Malignant cutaneous melanoma","o":["50% of melanomas present in the head and neck","Most commonly found on the nasal bridge","Breslow level measures the depth of invasion","Surgical excision with margin of at least2 mm is needed. 1- 3mm","5-year survival rate for an AJCC stage 1 melanoma is ~60%"],"k":"C","x":"Breslow thickness measures depth of invasion in millimetres (NCCN).","src":"2020 exam recall · Q21","d":"Head & Neck"},{"s":"Risk factors for developing basal cell carcinoma includes all the following EXCEPT","o":["Light skin","Exposure to ultraviolet radiation","Obesity,","Gorlin syndrome","Xeroderma pigmentosum,"],"k":"C","x":"Obesity is not a BCC risk factor; fair skin, UV, Gorlin syndrome and xeroderma pigmentosum are (Cummings).","src":"2020 exam recall · Q22","d":"Head & Neck"},{"s":"Regarding paraganglioma the following is true EXCEPT","o":["Carotid body tumor is the most common unilateral head and neck paraganglioma","Carotid body tumor is the most common bilateral head and neck paraganglioma","10% of paragnngliomas are familial","Surgery is always needed","Preoperative embolization if needed is usually performed 24-48 hours preoperatively"],"k":"D","x":"Surgery is not always needed for paragangliomas — observation or radiotherapy are options (Cummings).","src":"2020 exam recall · Q23","d":"Others"},{"s":"In patients with laryngeal trauma the most important single diagnostic test is","o":["Plane x-ray of the lateral soft tissues of the neck","Neck ultrasound","MRI of neck and larynx","CT scan of neck and larynx","Fibro-optic laryngeal and airway examination"],"k":"D","x":"CT of the larynx is the key diagnostic study after laryngeal trauma (with endoscopic assessment) (Cummings).","src":"2020 exam recall · Q24","d":"Laryngology"},{"s":"A patient has lymphoma of the right tonsil. This patient has a 20% to 30% chance of having a synchronous or mtachronous involvement of what other organ?","o":["Brain","Spleen","Thyroid","Gastrointestinal tract","Kidney"],"k":"D","x":"Tonsillar lymphoma is associated with gastrointestinal tract involvement (Waldeyer ring–GI) in about 20–30% (Cummings).","src":"2020 exam recall · Q25","d":"Head & Neck"},{"s":"What is the CORRECT treatment of an asymptomatic Zenker's diverticulum detected accidentally on a barium study?","o":["Diverticulectomy","Diverticulopexy","Observation","Cricopharyngeal myotomy","Dohlman procedure"],"k":"C","x":"An asymptomatic, incidentally found Zenker diverticulum is observed (Scott-Brown).","src":"2020 exam recall · Q26","d":"Others"},{"s":"The reliable landmark for the facial nerve in parotidectomy is the","o":["Tragal pointer","Posterior belly of the digastrics","Tympanomastoid suture line,","Bony cartilaginous ear canal","Sternomastoid muscle"],"k":"C","x":"The tympanomastoid suture is the most reliable landmark (nerve 6–8 mm deep to its inferior end) (Cummings).","src":"2020 exam recall · Q27","d":"Otology"},{"s":"When an endoscopic laser resection of a supraglottic tumour is considered, which of the following is the MOST COMMON complication?","o":["Pneumonia","Aspiration pneumonia","Aspiration","Mediastinitis","Gastrostomy tube placement. What is the most common and serious complication following supraglottic laryngeaomyl"],"k":"C","x":"Aspiration is the commonest complication of endoscopic supraglottic laser resection (Cummings).","src":"2020 exam recall · Q28","d":"Head & Neck"},{"s":"Contraindications for supracricoid partial laryngectomycricohyoidopexy include all the following EXCEPT","o":["Arytenoid fixation","Extralaryngeal extension","Anterior commissure lesions with pre-epiglotic space invasion","Invasion of the outer perichondrium of me thyroid cartilage","Subglottic extension 10 mm posteriorly"],"k":"C","x":"Anterior commissure involvement is not a contraindication to SCPL-CHP; arytenoid fixation, extralaryngeal spread, outer perichondrium invasion and posterior subglottic extension ≥10 mm are (Cummings).","src":"2020 exam recall · Q29","d":"Laryngology"},{"s":"The only absolute contraindication to primary voice restoration after total laryngectomy is","o":["Limited pulmonary function","Preoperative radiation therapy","Patient's inability to use and care for the prosthesis","Separation of the party wall at the puncture site","The need for postoperative radiation therapy"],"k":"D","x":"Separation of the party wall between trachea and oesophagus is the only absolute contraindication to primary TEP (Cummings).","src":"2020 exam recall · Q30","d":"Laryngology"},{"s":"The following are suspicious CT scan findings of lymph node secondaries EXCEPT","o":["Rim enhancement following 1.V. contrast","Central necrosis","Spherical shape","Size greater than 0. 5 cm","Group of three or more nodes"],"k":"D","x":"A node larger than 5 mm is not in itself suspicious; >10–15 mm, round shape, necrosis, rim enhancement and clustering are (Cummings).","src":"2020 exam recall · Q31","d":"Head & Neck"},{"s":"in performing a tracheostomy","o":["The head should be extended to a maximum degree","Vertical incision should be avoided in children","Tracheostomy tube should fit tightly without a cuff","Tapes should be lied with the head in the neutral position","Tube should be three quarter the size of trachea"],"k":"E","x":"A tracheostomy tube should be about three-quarters of the tracheal lumen diameter (Scott-Brown).","src":"2020 exam recall · Q32","d":"Laryngology"},{"s":"Which of the following is MOST LIKELY to give rise to isolated nodal metastasis at level IV?","o":["Squamous cell carcinoma (SCC)in anterior tongue,","SCC of the subglottic larynx","SCC of the tonsil","Papillary thyroid carcinoma","SCC of the nasopharynx,"],"k":"D","x":"Papillary thyroid carcinoma can present with isolated level IV metastasis (Cummings).","src":"2020 exam recall · Q33","d":"Head & Neck"},{"s":"Which of the following statements regarding bilateral neck dissection is TRUE?","o":["Most patients undergoing bilateral neck dissection should also undergo tracheostomy","Should not be performed simultaneously with transoral laser or robotic resection of","Bilateral blindness is a rarely reported complication","Should only be performed in case of grossly abnormal nodes in both sides of the neck","Should only be performed in cases of FNAC proven metastasis"],"k":"C","x":"Bilateral blindness is a rarely reported complication of bilateral neck dissection (raised intracranial/venous pressure) (Cummings).","src":"2020 exam recall · Q34","d":"Head & Neck"},{"s":"A 50-year-old man referred 4 week s after completion of chemoradiation for nasopharyngeal carcinoma. PET scan shows increased uptake in the nasopharynx. Endoscopic examination and MRI are both normal. Which of the following treatment approaches is the next BEST step?","o":["Continue close clinical follow up","Order CT scan with contrast","Resume radiation therapy for an additional 20 Gy","Prepare the patient for nasopharyngeal resection","Take an endoscope-guided nasopharyngeal biopsy"],"k":"A","x":"PET only 4 weeks after chemoradiation gives false positives; continue follow-up and repeat at about 12 weeks (NCCN).","src":"2020 exam recall · Q35","d":"Rhinology"},{"s":"65-year-old man currently taking anticoagulants is seen at a 6-month follow-up of his 5cm glomus Vagale tumour. Since his previous visit, he remains asymptomatic, and the tumour had grown 2mm. The most reasonable BEST step is","o":["Surgical resection","Radiation therapy to achieve tumor regression","Radiation therapy to arrest tumor growth","Chemotherapy","Continued observation"],"k":"E", ,"o":["Severe Epistaxis","Depression of nasal bridge. Due to septal","Meningitis","Cavernous sinus thrombophlebitis","Septal perforation"],"k":"A","x":"Severe epistaxis is not a complication of septal abscess; saddle nose, meningitis, CST and perforation are (Scott-Brown).","src":"2020 exam recall · Q81","d":"Others"},{"s":"Which of the following is an indication for orbital exenteration in a patient with squamous cell carcinoma of the maxillary sinus?","o":["Involving. the posterior ethmoid air cells","Involving the orbital bony floor,","Involving the lacrimal gland","involving the orbital apex soft tissues","Involving the periorbita adjacent to the lacrimal sac"],"k":"D","x":"Invasion of the orbital apex soft tissue (or orbital fat/muscle) indicates orbital exenteration (Cummings).","src":"2020 exam recall · Q82","d":"Rhinology"},{"s":"· A cerebrospinal fluid leak during ethmoidetomy is MOST LIKE LY to occur at the","o":["Junction of fovea ethmoidalis and lamina papryracea","Medial fovea ethmoidalis","Insertion of the uncinate process","Planum sphenoidale"],"k":"B","x":"The medial fovea ethmoidalis/lateral lamella is the commonest site of CSF leak during ethmoidectomy (Bailey).","src":"2020 exam recall · Q83","d":"Rhinology"},{"s":"A 46-year-old man has squamous cell carcinoma of the right maxillary sinus extending to the hard palate and anterior maxillary wall only. It has not invaded the orbital walls or involved subcutaneous tissues. According the TNM classification what stage would his tumour be?","o":["T1","T2","T3","T4a","T4b"],"k":"B","x":"Maxillary SCC eroding the palate and anterior wall only is T2 (AJCC 8).","src":"2020 exam recall · Q84","d":"Rhinology"},{"s":"Pierre Robin syndrome (PRS)","o":["No genetic cause has been identified yet","Tracheostomy to protect the airway is required for most cases","Gastroesophageal reflux is rarely associated with PRS","Gastrostomy tube feeding is rarely, needed","Cleft palate is usually described as being wide and U-s const DOMS=['Otology','Rhinology','Laryngology','Head & Neck','Paediatric','Others'];
let S={mode:'exam',mins:180,phase:'start',pos:0,ans:{},flag:{},end:0,start:0,tick:null,used:0,list:[],rpos:0,rtitle:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')};
function nav(html){let n=document.querySelector('.nav');if(!html){n&&n.remove();return}if(!n){n=document.createElement('div');n.className='nav';document.body.appendChild(n)}n.innerHTML='<div class="navi">'+html+'</div>'}
function startScreen(){
  S.phase='start';nav();clearInterval(S.tick);
  const cnt={};Q.forEach(q=>cnt[q.d]=(cnt[q.d]||0)+1);
  $('#app').innerHTML=`<div class="kicker">Palestinian Board · Exam recall · answered</div><h1>Part II Exam 2020</h1><b>Paper</b><div class="seg" role="group" aria-label="Paper" style="flex-wrap:wrap">${PAPERS.map((p,i)=>`<button class="${PI==i?'on':''}" onclick="pickPaper(${i})">${i+1}</button>`).join('')}</div><h2 style="margin:14px 0 6px;font-size:1.15rem">${esc(P.title)}</h2>
  <p class="sub">The 2020 Part II recall (Paper 17 A and B). Each question is answered against our references, with a short referenced explanation. Changed or missing recalled keys are flagged ⚑, and incomplete questions are completed.</p>
  <div class="card"><table>${DOMS.filter(d=>cnt[d]).map(d=>`<tr><td>${d}</td><td>${cnt[d]}</td></tr>`).join('')}</table></div>
  <b>Mode</b><div class="seg" role="group" aria-label="Mode"><button class="${S.mode=='exam'?'on':''}" onclick="S.mode='exam';startScreen()">Exam — marked at the end</button><button class="${S.mode=='practice'?'on':''}" onclick="S.mode='practice';startScreen()">Practice — instant feedback</button></div>
  ${S.mode=='exam'?`<b>Time</b><div class="seg" role="group" aria-label="Time limit">${[180,150,120,90].map(m=>`<button class="${S.mins==m?'on':''}" onclick="S.mins=${m};startScreen()">${m==180?'3 h':m+' min'}</button>`).join('')}</div>`:''}
  <button class="primary" onclick="begin()">Start paper</button>
  <p class="note">${S.mode=='exam'?'You can change answers and flag questions until you submit. The paper submits itself when time runs out.':'Each answer is marked when you tap it and locks. Untimed.'} Progress is kept while this page stays open.</p>`;
  scrollTo(0,0)}
function begin(){S.ans={};S.flag={};S.pos=0;S.phase='run';S.start=Date.now();
  if(S.mode=='exam'){S.end=S.start+S.mins*60000;S.tick=setInterval(()=>{const r=S.end-Date.now();const t=$('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}
  show()}
function answered(){return Object.keys(S.ans).length}
function show(){
  const q=Q[S.pos],a=S.ans[S.pos],prac=S.mode=='practice';
  let h=`<div class="top"><div class="topi">${S.mode=='exam'?`<span class="timer" id="tm">${fmt(S.end-Date.now())}</span>`:`<span class="timer">${Object.entries(S.ans).filter(([i,v])=>v==Q[i].k).length}/${answered()}</span>`}<span class="t">${answered()} of ${Q.length} answered</span><button class="flagbtn ${S.flag[S.pos]?'on':''}" onclick="flag()" aria-pressed="${!!S.flag[S.pos]}">${S.flag[S.pos]?'Flagged':'Flag'}</button></div><div class="bar"><i style="width:${(S.pos+1)}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${Q.length}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${S.pos+1}" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,i)=>{const l=L[i];let c='';if(prac&&a){if(l==q.k)c='ok';else if(l==a)c='bad'}else if(a==l)c='sel';
    h+=`<button class="opt ${c}" ${prac&&a?'disabled':''} onclick="pick('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(prac&&a)h+=expl(q,a);
  $('#app').innerHTML=h;
  const last=S.pos==Q.length-1;
  nav(`<button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Questions</button>${last?`<button class="primary" onclick="confirmSubmit()">Submit</button>`:`<button class="primary" onclick="go(1)">Next</button>`}`);
}
function expl(q,a){const ok=a==q.k;
  return `<div class="exp"><h3 class="${a?(ok?'ok':'bad'):'na'}">${a?(ok?'Correct':'Incorrect'):'Not answered'} — answer ${q.k}</h3>${q.x?`<p>${esc(q.x)}</p>`:`<p class="note">The source gives the key only for this question.</p>`}${q.xi?q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join(''):''}<div class="src">${esc(q.d)} · ${esc(q.src)}</div></div>`}
function pick(l){if(S.mode=='practice'&&S.ans[S.pos])return;if(S.mode=='exam'&&S.ans[S.pos]==l)delete S.ans[S.pos];else S.ans[S.pos]=l;const y=scrollY;show();scrollTo(0,y)}
function flag(){S.flag[S.pos]?delete S.flag[S.pos]:S.flag[S.pos]=1;const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(Q.length-1,S.pos+d));show();scrollTo(0,0)}
function grid(){const d=$('#dlg');const nf=Object.keys(S.flag).length,na=Q.length-answered();
  d.innerHTML=`<b>Questions</b><div class="legend" style="margin-top:6px"><span class="a">Answered (${answered()})</span><span class="f">Flagged (${nf})</span><span>Unanswered (${na})</span></div>
  <div class="grid">${Q.map((_,i)=>`<button class="${S.ans[i]?'ans':''} ${S.flag[i]?'flg':''} ${i==S.pos?'cur':''}" onclick="S.pos=${i};$('#dlg').close();show();scrollTo(0,0)" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div>
  <div class="row"><button class="ghost" onclick="$('#dlg').close()">Close</button><button class="primary" onclick="$('#dlg').close();confirmSubmit()">Submit paper</button></div>`;d.showModal()}
function confirmSubmit(){const d=$('#dlg');const na=Q.length-answered(),nf=Object.keys(S.flag).length;
  d.innerHTML=`<b>Submit this paper?</b><p class="note">${na?`${na} question${na>1?'s are':' is'} unanswered. `:'All questions answered. '}${nf?`${nf} flagged.`:''} You can't change answers after submitting.</p><div class="row"><button class="ghost" onclick="$('#dlg').close()">Keep going</button><button class="primary" onclick="$('#dlg').close();submit()">Submit</button></div>`;d.showModal()}
function submit(auto){clearInterval(S.tick);S.used=Date.now()-S.start;S.phase='done';S.auto=!!auto;if($('#dlg').open)$('#dlg').close();results()}
function results(){nav();
  let r=0;const by={};Q.forEach((q,i)=>{const b=by[q.d]=by[q.d]||{n:0,r:0};b.n++;if(S.ans[i]==q.k){r++;b.r++}});
  const wrong=Q.map((q,i)=>i).filter(i=>S.ans[i]&&S.ans[i]!=Q[i].k),skip=Q.map((q,i)=>i).filter(i=>!S.ans[i]),fl=Object.keys(S.flag).map(Number).sort((a,b)=>a-b);
  $('#app').innerHTML=`<div class="kicker">${esc(P.title)}</div><h1>Results</h1>${S.auto?'<p class="note">Time ran out — the paper was submitted automatically.</p>':''}
  <div class="big">${r}<span style="font-size:1.4rem;color:var(--muted)">/100</span></div><p class="sub">${wrong.length} incorrect · ${skip.length} unanswered · time used ${fmt(S.used)}</p>
  <div class="card"><table>${DOMS.filter(d=>by[d]).map(d=>{const b=by[d],p=Math.round(b.r/b.n*100);return `<tr><td>${d}<div class="meter"><i style="width:${p}%"></i></div></td><td>${b.r}/${b.n} · ${p}%</td></tr>`}).join('')}</table></div>
  <div class="row"><button class="primary" ${wrong.length+skip.length?'':'disabled'} onclick="review('Incorrect and unanswered',${JSON.stringify(wrong.concat(skip).sort((a,b)=>a-b))})">Review incorrect (${wrong.length+skip.length})</button></div>
  <div class="row"><button class="ghost" ${fl.length?'':'disabled'} onclick="review('Flagged',${JSON.stringify(fl)})">Flagged (${fl.length})</button><button class="ghost" onclick="review('All questions',${JSON.stringify(Q.map((_,i)=>i))})">All 100</button></div>
  <div class="row"><button class="ghost" onclick="startScreen()">Retake paper</button></div>`;scrollTo(0,0)}
function review(t,list){S.list=list;S.rpos=0;S.rtitle=t;rshow()}
function rshow(){const i=S.list[S.rpos],q=Q[i],a=S.ans[i];
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="results()">Results</button><span class="t">${S.rtitle} · ${S.rpos+1}/${S.list.length}</span>${S.flag[i]?'<span class="flagbtn on">Flagged</span>':''}</div></div>
  <div class="qn">Question ${i+1}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,j)=>{const l=L[j];const c=l==q.k?'ok':(l==a?'bad':'');h+=`<button class="opt ${c}" disabled><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  h+=expl(q,a);$('#app').innerHTML=h;
  nav(`<button class="ghost" ${S.rpos?'':'disabled'} onclick="S.rpos--;rshow();scrollTo(0,0)">Previous</button><button class="primary" ${S.rpos<S.list.length-1?'':'disabled'} onclick="S.rpos++;rshow();scrollTo(0,0)">Next</button>`)}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
window.addEventListener('beforeunload',e=>{if(S.phase=='run'){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(S.phase!='run'||$('#dlg').open)return;if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else{const i=L.indexOf(e.key.toUpperCase());if(e.key.length==1&&i>=0&&i<Q[S.pos].o.length)pick(L[i])}});
startScreen();

function pickPaper(i){PI=i;P=PAPERS[i];Q=P.q;S.ans={};S.flag={};S.pos=0;startScreen()}</script></body></html>
