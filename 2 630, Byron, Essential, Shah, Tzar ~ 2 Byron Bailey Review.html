<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Byron Bailey Review — Interactive Quiz</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--box:#0B1418;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--box:#000;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.chap{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px}
.chap.on{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.chap b{flex:1;font-weight:600;font-size:.92rem}
.ph{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;font-weight:700;color:var(--teal)}
.chap span{color:var(--muted);font-variant-numeric:tabular-nums}
.chap .done{font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px}
.seg button.on{background:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#06201F}}
.primary{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
@media (prefers-color-scheme:dark){.primary{color:#06201F}}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.topi .t{flex:1;min-width:0;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topi .sc{font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width .25s}
.qn{font:600 .9rem/1 inherit;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.note{font-size:.9rem;color:var(--muted);margin:-4px 0 12px}
.flag{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:6px;font-size:.92rem;margin:0 0 12px}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}
.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}
.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:12px 0 4px}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-cur{outline:2px solid var(--teal);outline-offset:1px}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:8px 0}
table{width:100%;border-collapse:collapse;margin:12px 0 18px;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

. Jones, a prominent local figure in your town, has had stomy relations with several physicians. You are covering facial trauma call for your local emergency room. Jones is brought in by ambulance, the angry victim of an motor vehicle accident. He has several deep lacerations much soft tissue loss over the malar area, and an absence of facial movement in the upper portion of his face. You attend to him in the emergency room, perform surgery to repair the facial nerve injury using cable grafts, and perform assiduous postoperative care. He ignores your postoperative would care instructions and develops a wound infection. He is also unpleasant, argumentative, and blames you for the failure of the facial nerve grafting. The best way to reduce your liability for this malpractice time bomb is to","o":["Continue to treat him carefully documenting his noncompliance in your charts","Refer him to another physician","Discharge him from your practice"],"k":"C","x":""},{"n":3,"bn":3,"s":"You happen on to the scene of a traffic accident. A young woman is unconscious and hemorrhaging. Worried that her car is about to catch fire, you carry her a safe distance and stanch her blood flow until paramedics arrive. In moving her, you have aggravated a spinal fracture, which leaves her paretic. Good Samaritan statutes protect you from malpractice litigation","o":["In all cases","As long as you are not a specialist in emergency medicine","Unless the woman was already your patient","Only if you do not bill for the care you administered","Not at all because these statutes do not apply to licensed physicians"],"k":"D","x":""},{"n":4,"bn":4,"s":"You order 6 mg of morphine for a patient. The nurse inadvertently gives 60 mg. Who is liable for the mistake?","o":["You are under the Captain of the Ship doctrine","The nurse, as a licensed professional is fully liable","The hospital, which hired the nurse, is responsible for the actions of employees","You are both liable"],"k":"D","x":""},{"n":5,"bn":5,"s":"You diagnose vocal nodule in a hoarse patient later found to have early laryngeal cancer. The patient sues. What is the jury's most likely reaction to the patient's chart which carefully documents a logical rational for your diagnosis?","o":["A mistaken diagnosis is negligence period","The documentation extenuates but does not eliminate your liability","You had good reasons for your diagnosis and therefore should be let off the"],"k":"C","x":""},{"n":6,"bn":6,"s":"Before surgery, your patient signs a consent form listing the procedures Known risks and complications. The patient later suffers one of the complications. Assuming the surgery itself was handled competently, what kind of legal protection does the signed form give you?","o":["None--course have held that a consent form is an educational tool for the patient's benefit","Minimal--the doctor is responsible for determining the whether benefit of surgery outweighs the risks","Substantial--but only if you reviewed the form with your patient, explained it in terms he could understand, and answered all of his questions","Total-- a signed consent form, like any other contract, constitutes a binding"],"k":"C","x":""},{"n":7,"bn":7,"s":"What percentage of malpractice suits are motivated primarily by anger and revenge?","o":["10%","25%","50%","75%","90%"],"k":"E","x":""},{"n":8,"bn":8,"s":"Each of the practices listed below are considered to be unethical. Identify the one that is incorrectly defined","o":["Fragmenting: the practice of billing for components of service rather than billing for the global service","Fee splitting: the practice of billing separately for in office laboratory procedures x-rays and clinical visits","Upcoding: the practice of billing at a higher level of service than was actually performed, for example, billing for an “intermediate” level of service when only a “limited” service was rendered","Exploding tests: the practice of itemizing a series of tests that are all done on"],"k":"B","x":""},{"n":9,"bn":9,"s":"What constitutes a fiduciary relationship such as that held by the patient doctor relationship?","o":["In exchange for money or other valuables the physician assumes responsibility for the patient's health and well begin","The physician agrees to be fiscally responsible and not overcharge the patient for services rendered","The physician is placed in a position of trust and is charged with making decisions and acting on behalf of the patient for the benefit of the patient","The practice of doing good for the patient as in an act of charity"],"k":"C","x":""},{"n":10,"bn":10,"s":"Select the statement that best characterizes modern medical ethics","o":["Medical ethics has become so complicated that the wise physician will wait until there are more answers before spending time on this topic","Medical ethics is changing so fast that there are no right answers","The study of medical ethics is reserved for bioethicists, those who have completed either a Ph. D. in philosophy ir an M. D. and taken fellowship training in medical ethics","The complexity of medicine mandates that all physicians be well versed in medical ethics to make reasoned choices for themselves and their patients"],"k":"D","x":""}]},{"t":"Ch 192 · Information on clinical medicine","part":"Facial plastic and reconstructive surgery","q":[{"n":1,"bn":1,"s":"The Internet","o":["Connects computers and networks all over the world","Allows users to exchange data over long distances","Can be accessed using many different interfaces","Uses gateways and routers to communicate between networks","All of the above"],"k":"E","x":""},{"n":2,"bn":2,"s":"Which of the following does not represent a potential advantage of listservs","o":["Listservs may allow physicians to obtain advice from colleagues","Listservs allow rapid and inexpensive dissemination of information to large groups of physicians","Communications may inadvertently be accessed by unintended recipients","Communications may be searched and archived","None of the above"],"k":"C","x":""},{"n":3,"bn":3,"s":"The world wide web","o":["Is composed of binary documents restricted ——— palatiform","Is the main interface of the Internet","Connects hypertext documents","Is difficult to update because documents——- on many computers","Has not been effective for dissemination of —— materials"],"k":"C","x":""},{"n":4,"bn":4,"s":"Features of the ideal electronic medical———- all of the following except","o":["A connection to Internet","Security features","Ability to include multimedia information (e.g. X rays, voice annotations)","A user- friendly interface","Accommodation of future expansion"],"k":"A","x":""},{"n":5,"bn":5,"s":"Which of the following technologies should always be subject to human override?","o":["Intelligent computer aided training","Expert systems","Virtual endoscopes","Gateways","Surgical simulators"],"k":"B","x":""},{"n":6,"bn":6,"s":"Potential advantages of telemedicine include","o":["Improved access to highly trained specialists","Delivery of care to remote and undeserved locales","Telementoring","Decreased opportunity costs","All of the above"],"k":"E","x":""},{"n":7,"bn":7,"s":"Application of advanced computer technology to radiologic images","o":["May eventually allow three dimensional reconstruction of anatomic structures","Has replaced endoscopy as a diagnostic modality","Allows physicians to identify anatomic and pathologic structures during endoscopic sinus surgery","Directly results in accurate pathologic diagnosis of suspicious lesions","Is more invasive than traditional techniques of diagnosis"],"k":"C","x":""},{"n":8,"bn":8,"s":"Factors that may limit the usefulness of medical knowledge include","o":["Accessibility","Obsolescence","Abundance","Lack of organization","All of the above"],"k":"E","x":""},{"n":9,"bn":9,"s":"Advantages of current computer systems include","o":["A lack of errors","Strong encryption","Built- in safeguards","Widespread use of a common configuration","None of the above"],"k":"E","x":""},{"n":10,"bn":10,"s":"The main factor limiting the usefulness of computers for physicians is","o":["Computational speed","Lack of useful applications","Legal liability","Lack of computer skills","Cost"],"k":"D","x":""}]},{"t":"Ch 193 · Understanding data","part":"Facial plastic and reconstructive surgery","q":[{"n":1,"bn":1,"s":"The accuracy of a diagnostic test","o":["Can be improved by using a precise instrument to measure values","Is related to the positive predictive value of the test","Improves with increased clinical experience","Improves with increasing specificity of the test"],"k":"D","x":""},{"n":2,"bn":2,"s":"A diagnostic test performed after a diagnosis is established is an example of","o":["Workup bias","Test review bias","Diagnostic review bias","Incorporation bias","None of the above"],"k":"C","x":""},{"n":3,"bn":3,"s":"Categorical data are","o":["Obtained from measurement or ratio data","Measured across an ordered spectrum of values","Ranked values ordered in either increasing or decreasing values","None of the above"],"k":"D","x":""},{"n":4,"bn":4,"s":"The expected central value of a gaussian distribution is best described using the","o":["Standard deviation","Coefficient of determination","Mean","Standard error of the mean","Reliability"],"k":"C","x":""},{"n":5,"bn":5,"s":"A random sample is used","o":["To ensure that both genders are included in equal proportion","To increase the chance of an equal number of patients in all treatment groups of a clinical trial","To select patients having defined characteristics","None of the above"],"k":"B","x":""},{"n":6,"bn":6,"s":"Sensitivity refers to the proportion of","o":["False positives","True positives","False negatives","True negatives","None of the above"],"k":"B","x":""},{"n":7,"bn":7,"s":"Specificity refers to the proportion of","o":["False positives","True positives","False negatives","True negatives","None of the above"],"k":"D","x":""},{"n":8,"bn":8,"s":"The positive predictive value refers to the proportion of","o":["False positives given the presence of disease","True positives given the presence of disease","False negatives given the presence of disease","True negatives given the presence of disease","None of the above"],"k":"B","x":""},{"n":9,"bn":9,"s":"A statistical test was used to evaluate differences between two treatment percentages. The two percentages were declared significantly different at the 0.05 level. This means that","o":["When the null hypothesis is false it will be declared false 5% of the time","When the null hypothesis is true it will be declared false 5% of the time","The probability of declaring the null hypothesis false is 0.5","The probability of declaring the null hypothesis false is less than 0.5","None of the above"],"k":"D","x":""},{"n":10,"bn":10,"s":"If null hypothesis of equal treatment efficacy is tested with a statistical test and is rejected","o":["Clinical significance is established","Prevalence is less than 0.5","The researcher has performed a double blind clinical trial","The researcher realizes that the p value describes the risk of error in rejecting the null hypothesis","All of the above"],"k":"D","x":""}]},{"t":"Ch 194 · Eponyms in otolaryngology","part":"Facial plastic and reconstructive surgery","q":[{"n":1,"bn":1,"s":"The nerve transected to relieve the symptoms of Freys syndrome is","o":["Arnolds nerve","Jacobson’s nerve","Vidian nerve","Facial nerve"],"k":"B","x":""},{"n":2,"bn":2,"s":"The characteristics of Alports syndrome include","o":["Hypoplastic mandible and conductive hearing loss","Sensorineural hearing loss and goiter","Keratoconjectivitis and Sensorineural hearing loss","Sensorineural hearing loss and glomerulonephritis"],"k":"D","x":""},{"n":3,"bn":3,"s":"A patient presents with malaise and a dark line that follows the margin of the gingiva. Careful questioning elicits a history of exposure to","o":["Arsenic containing insecticides","Lead based paints","Overuse of fluoride dental treatments","Chewing tobacco"],"k":"B","x":""},{"n":4,"bn":4,"s":"The typical history of a child with Pierre robin’s syndrome includes","o":["Tracheostomy dependence until death in late childhood","Tracheostomy dependence but a normal lifespan","Eventual weaning from a tracheotomy but lifelong problems with deglutition","Relatively normal oral function of both airway and swallowing by late"],"k":"D","x":""},{"n":5,"bn":5,"s":"Persons with Plummer Vinson syndrome are more likely to be","o":["Women with an increased likelihood of postcricoid cancer","Men with an increased likelihood of esophageal cancer","Women with an increased likelihood of oral cancer","Ether gender with an increased likelihood of esophageal cancer"],"k":"A","x":""},{"n":6,"bn":6,"s":"The most serious type of inner ear dysplasia is","o":["Michel’s dysplasia","Alexander’s dysplasia","Mondini’s dysplasia","Schibe’s dysplasia"],"k":"A","x":""},{"n":7,"bn":7,"s":"Winkles disease (chondridermatitis nodularis chronica helicis) is most commonly treated with","o":["Steroids","Excision","Antibiotics","No treatment necessary"],"k":"B","x":""},{"n":8,"bn":8,"s":"Fordyce’s spots are","o":["A normal variant and are seen in adults as well as children","Seen prior to measles","Seen in the newborn and spontaneously resolve","Premalignant lesions"],"k":"A","x":""},{"n":9,"bn":9,"s":"In Mikulicz’s disease, salivary glands show an infiltrate consisting of","o":["Eosinophils","macrophages","Histiocytes","Lymphocytes"],"k":"D","x":""},{"n":10,"bn":10,"s":"A patient with Peutz Jephers syndrome may present to an otolaryngologist because of","o":["Hoarseness secondary to vocal polyps","Hearing loss","Sudden appearance of pigmented patches around the mouth","Dysphagia"],"k":"C","x":""},{"n":11,"bn":11,"s":"A patient is diagnosed by an otolaryngologist as having Peutz Jephers syndrome. The patient should also be seen by a","o":["Nephrologist","Hematologist","Rheumatologist","Gastroenterologist"],"k":"D","x":""},{"n":12,"bn":12,"s":"A Tornwaldt’s cyst may be seen in the","o":["Mastoid","Floor of mouth","Posterior nasopharynx","Neck"],"k":"C","x":""}]}];
const L='ABCDEFGH';
let S={sel:new Set(DATA.map((_,i)=>i)),order:'book',list:[],pos:0,ans:{},multiPick:{}};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const id=(c,n)=>c+'-'+n;
function home(){
  document.body.querySelector('.nav')?.remove();
  const total=[...S.sel].reduce((a,c)=>a+DATA[c].q.length,0);
  $('#app').innerHTML=`<h1>Byron Bailey review</h1><p class="sub">${DATA.reduce((a,c)=>a+c.q.length,0)} questions across ${DATA.length} chapters, single-best-answer only, in book wording. Keys rechecked against current references: corrected keys show the book key, and repaired or debatable items are flagged in the answer box. Pick chapters, then start.</p>
  ${DATA.map((c,i)=>{const hdr=(i==0||DATA[i-1].part!==c.part)?`<div class="ph"><span>${esc(c.part||'')}</span><button class="ghost" style="padding:4px 10px;font-size:.8rem" onclick="selPart('${(c.part||'').replace(/'/g,'')}')">Only this part</button></div>`:'';const done=c.q.filter(q=>S.ans[id(i,q.n)]).length;const btn=`<button class="chap ${S.sel.has(i)?'on':''}" onclick="tog(${i})" aria-pressed="${S.sel.has(i)}"><b>${c.t}</b>${done?`<span class="done">${done} done</span>`:''}<span>${c.q.length}</span></button>`;return hdr+btn}).join('')}
  <div class="row"><div class="seg" role="group" aria-label="Order"><button class="${S.order=='book'?'on':''}" onclick="S.order='book';home()">Book order</button><button class="${S.order=='shuf'?'on':''}" onclick="S.order='shuf';home()">Shuffled</button></div>
  <div class="seg"><button onclick="S.sel=new Set(DATA.map((_,i)=>i));home()">All</button><button onclick="S.sel=new Set();home()">None</button></div></div>
  <button class="primary" ${total?'':'disabled'} onclick="start()">Start ${total} questions</button>
  ${Object.keys(S.ans).length?`<div class="row"><button class="ghost" style="flex:1" onclick="results()">See results so far</button><button class="ghost" style="flex:1" onclick="if(confirm('Clear all answers?')){S.ans={};home()}">Clear answers</button></div>`:''}
  <p class="note" style="margin-top:18px">Answers are kept while this page is open. Tap any figure to enlarge.</p>`;
  scrollTo(0,0);
}
function selPart(p){S.sel=new Set(DATA.map((c,i)=>(c.part||'').replace(/'/g,'')===p?i:-1).filter(i=>i>=0));home()}
function tog(i){S.sel.has(i)?S.sel.delete(i):S.sel.add(i);home()}
function start(list){
  if(!list){list=[];[...S.sel].sort().forEach(c=>DATA[c].q.forEach(q=>list.push([c,q.n])));
    if(S.order=='shuf')for(let i=list.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[list[i],list[j]]=[list[j],list[i]]}}
  S.list=list;S.pos=0;const f=list.findIndex(([c,n])=>!S.ans[id(c,n)]);if(f>0)S.pos=f;show();
}
function score(){let a=0,r=0;S.list.forEach(([c,n])=>{const x=S.ans[id(c,n)];if(x){a++;if(x.ok)r++}});return{a,r}}
function show(){
  const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const A=S.ans[id(c,n)];const {a,r}=score();
  const pick=S.multiPick[id(c,n)]||new Set();
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="home()" aria-label="Back to chapters">Chapters</button><span class="t">${DATA[c].t}</span><span class="sc">${r}/${a}</span></div><div class="bar"><i style="width:${(S.pos+1)/S.list.length*100}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${S.list.length} &nbsp;·&nbsp; Book Q${q.bn||n}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${n}" onclick="zoom(this.src)">`).join('')}</div>`;
  if(q.m)h+=`<p class="note">More than one answer. Select all that apply, then check.</p>`;
  q.o.forEach((t,i)=>{const l=L[i];let cl='';
    if(A){if(q.k.includes(l))cl='ok';else if(A.pick.includes(l))cl='bad'}else if(pick.has(l))cl='sel';
    h+=`<button class="opt ${cl}" ${A?'disabled':''} onclick="choose('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(q.m&&!A)h+=`<button class="primary" style="margin-top:6px" ${pick.size?'':'disabled'} onclick="check()">Check answer</button>`;
  if(A){h+=`<div class="exp"><h3 class="${A.ok?'ok':'bad'}">${A.ok?'Correct':'Incorrect'} — answer ${q.k.split('').join(', ')}</h3>`;
    if(q.f)h+=`<div class="flag">${esc(q.f)}</div>`;
    h+=q.x?q.x.split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join(''):`<p class="note" style="margin:0">Key only — the book gives no explanation.</p>`;
    if(q.xi)h+=q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join('');
    h+=`</div>`}
  $('#app').innerHTML=h;
  let nav=document.querySelector('.nav');if(!nav){nav=document.createElement('div');nav.className='nav';document.body.appendChild(nav)}
  const last=S.pos==S.list.length-1;
  nav.innerHTML=`<div class="navi"><button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Jump</button><button class="primary" onclick="${last?'results()':'go(1)'}">${last?'Finish':'Next'}</button></div>`;
  scrollTo(0,0);
}
function choose(l){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);if(S.ans[k])return;
  if(q.m){const p=S.multiPick[k]||new Set();p.has(l)?p.delete(l):p.add(l);S.multiPick[k]=p;const y=scrollY;show();scrollTo(0,y);return}
  S.ans[k]={pick:[l],ok:l==q.k};const y=scrollY;show();scrollTo(0,y)}
function check(){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);const p=[...S.multiPick[k]].sort().join('');
  S.ans[k]={pick:p.split(''),ok:p==q.k};const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(S.list.length-1,S.pos+d));show()}
function grid(){const d=$('#dlg');
  d.innerHTML=`<b>Jump to question</b><div class="grid">${S.list.map(([c,n],i)=>{const a=S.ans[id(c,n)];return `<button class="${a?(a.ok?'g-ok':'g-bad'):''} ${i==S.pos?'g-cur':''}" onclick="S.pos=${i};$('#dlg').close();show()">${i+1}</button>`}).join('')}</div><button class="ghost" style="width:100%;margin-top:8px" onclick="$('#dlg').close()">Close</button>`;
  d.showModal()}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
function results(){
  document.querySelector('.nav')?.remove();
  let rows='',ta=0,tr=0,wrong=[];
  DATA.forEach((c,ci)=>{let a=0,r=0;c.q.forEach(q=>{const x=S.ans[id(ci,q.n)];if(x){a++;if(x.ok)r++;else wrong.push([ci,q.n])}});
    ta+=a;tr+=r;if(a)rows+=`<tr><td>${c.t}</td><td>${r}/${a} · ${Math.round(r/a*100)}%</td></tr>`});
  $('#app').innerHTML=`<h1>Results</h1><div class="big">${ta?Math.round(tr/ta*100):0}%</div><p class="sub">${tr} correct of ${ta} answered</p>
  <table>${rows||'<tr><td>No answers yet</td><td></td></tr>'}</table>
  ${wrong.length?`<button class="primary" onclick="redo()">Retry ${wrong.length} incorrect</button>`:''}
  <div class="row"><button class="ghost" style="flex:1" onclick="home()">Back to chapters</button></div>`;
  S.wrong=wrong;scrollTo(0,0)}
function redo(){S.wrong.forEach(([c,n])=>{delete S.ans[id(c,n)];delete S.multiPick[id(c,n)]});start(S.wrong.slice())}
document.addEventListener('keydown',e=>{if($('#dlg').open||!document.querySelector('.nav'))return;
  if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else if('abcde'.includes(e.key.toLowerCase())&&e.key.length==1)choose(e.key.toUpperCase())});
home();
</script></body></html>
