 It has been hypothesized that GABHS antineuronal antibodies cross-react with cells in the basal ganglia, giving rise to behavioral and motor disturbances. PAGE 703","bn":23},{"n":24,"s":"A 9-year-old girl presents with blunting of the nasolabial crease caused by an odontogenic infection in which space:","o":["Buccal space","Masticator space","Canine space","Sublingual space"],"k":"C","x":"The canine space represents a potential space bounded by the muscle heads of the upper lip elevators. These lip elevator muscles originate high on the maxilla and insert at the upper lip at the angle of the mouth. Although this space is infrequently involved with dental infections, it becomes involved if an infection from a maxillary cuspid tooth perforates the lateral cortex superior to the attachment of those upper lip elevators. Such an infection usually produces a firm swelling of the medial cheek and lateral surface of the nose that blunts the nasal labial crease. PAGE 716","bn":24},{"n":25,"s":"The clinical hallmark of an odontogenic infection in the masticator space is:","o":["Trismus","Cheek swelling","Orbital complication emphysema","Elevation of the tongue"],"k":"A","x":"The clinical hallmark of masticator space infections is trismus. The masticator spaces include the masseteric space, the pterygoid space, and the temporal spaces. These spaces communicate with each other and are bounded by the temporalis superiorly, the masseter laterally, and the medial pterygoid medially. Involvement of these muscles by infection can cause significant trismus without external swelling. PAGE 717","bn":25},{"n":26,"s":"The bacteria most commonly isolated in the oral cavity is:","o":["Staphylococcus aureus","Streptococcus viridans","Eikenella corrodens","Actinomyces odontolyticus"],"k":"B","x":"Streptococci are the most common facultative aerobic bacteria found in the oral cavity with the viridans species most prevalent. All the listed bacterial species may be found in the oral cavity and can be involved in odontogenic infections. Depending on the study, different bacteria are found to be the most common cause of odontogenic infections, with some studies finding a predominance of gram-positive cocci and others finding more anaerobic gram-negative bacilli. Most studies agree that odontogenic infections are polymicrobial and only rarely attributable to a single pathogen. PAGES 713-714","bn":26},{"n":27,"s":"A 54-year-old man presents to the emergency department 6 days after removal of a second mandibular molar. His temperature is 38.7 °C, heart rate 101, respiratory rate 22, with oxygen saturation of 98% on 6-L nasal cannula. On assessment, he has no stridor but is uncomfortable lying flat and is spitting his secretions into a basin. There is edema of the left submandibular area extending across the submental neck, without appreciable fluctuance. Flexible laryngoscopy shows significant supraglottic edema with patent glottic inlet. The most appropriate next step in management is:","o":["Admission to observation unit with IV steroids and high-flow oxygen","Rapid sequence induction with sedation and nasotracheal intubation","Awake flexible fiberoptic nasotracheal intubation","Cricothyroidotomy","Emergent tracheostomy in the emergency department"],"k":"C","x":"The patient has an odontogenic infection concerning for Ludwig angina. The clinical scenario describes evolving airway compromise with symptoms of submental edema, significant dysphagia, inability to lie flat, and supraglottic edema. The airway should be secured in a controlled fashion with awake flexible fiberoptic nasotracheal intubation. Induction of anesthesia with blind attempts at nasotracheal or orotracheal intubation should not be performed. As an otolaryngologist, one should be prepared to perform bedside cricothyroidotomy or tracheostomy if intubation is unsuccessful. It may be reasonable to observe odontogenic infections in early stages without airway compromise, however that is not the scenario presented here. PAGE 720","bn":27},{"n":28,"s":"What is a reported complication of odontogenic infections?","o":["Orbital abscess","Intracranial abscess","Mediastinitis","Necrotizing fasc’","All of the above"],"k":"E","x":"Severe complications of odontogenic infections include systemic sepsis, necrotizing fasciitis, descending mediastinitis, thrombophlebitis, orbital abscess, and intracranial abscess. The deep fascial planes of the neck extend into the mediastinum, and deep space neck infections may progress to mediastinitis. Valveless facial veins can act as conduits for the spread of infection into the orbit or intracranial space. PAGE 722","bn":28},{"n":29,"s":"Which of the following ultrasonographic features of a lymph node is not associated with greater suspicion for malignancy?","o":["Loss of the fatty hilum","Reniform shape","Peripheral vascularity","Loss of hilar artery and vein","Rounded shape"],"k":"B","x":"Suspicious ultrasound lymph node features include enlargement, rounded shape (instead of reniform), ill-defined borders, loss of fatty hilum, central necrosis, loss of hilar artery and vein, peripheral vascularity, incompressible. PAGE 730","bn":29},{"n":30,"s":"A 63-year-old man who is a current tobacco user presents with right-sided neck swelling for the last month. He first noticed the mass while shaving, and it has been enlarging. It is not causing him any pain, and he denies any constitutional symptoms. Apart from a 3-to 4-cm firm, nontender mass inferior to the right mandible, the rest of the head and neck examination is unrevealing. Cross-sectional imaging shows a 3.8-cm right level I lymph node with necrosis and ill-defined borders. There is no additional lymphadenopathy. What is the next best step in diagnosis?","o":["Open incisional biopsy","Open excisional biopsy","Fine needle aspiration (FNA)","Core needle biopsy"],"k":"C","x":"FNA with or without ultrasound guidance is often the initial procedure of choice for adult patients presenting with lymphadenopathy. In cases of nondiagnostic FNA or when additional sample is needed for immunohistochemical (IHC) analysis, a core needle biopsy can be considered. Lastly, open incisional and excisional biopsies can provide additional tissue for a definitive diagnosis and are the gold standard for lymphoproliferative disorders. This is because a diagnosis of lymphoma classically requires analysis by flow cytometry, which cannot be obtained from the cells provided by needle biopsy alone. However, in recent years, core needle biopsies have been shown by some to be sufficient in the diagnosis of many subtypes of lymphoma. PAGE 730","bn":30},{"n":31,"s":"An 18-year-old woman presents with several weeks of bulky cervical lymphadenopathy. She also endorses subjective fevers at home. An excisional biopsy is performed, which shows whole cells engulfed inside of histiocytes. What is the diagnosis?","o":["Castleman disease","Kikuchi-Fujimoto disease","Rosai-Dorfman disease","Lymphoma"],"k":"C","x":"Histology classically shows emperipolesis, or whole white and blood cells engulfed inside of the cytoplasm of macrophages, enlarged lymphatic sinuses, and S100 and CD68 positivity on immunohistochemistry (IHC). The IHC staining profile can help differentiate Rosai-Dorfman disease from lymphoma, as lymphomas may show emperipolesis but are not typically positive for S100. Kikuchi-Fujimoto disease histology shows follicular hyperplasia, eosinophils, and microabscesses with necrosis. Castleman disease has three histological types: hyaline vascular, plasma cell, and mixed. PAGES 733-735","bn":31},{"n":32,"s":"A 3-year-old boy presents from his pediatrician’s office with a firm neck mass just under the mandible. The parents report that this mass has been there for approximately 3 weeks and has not improved. Recently, the skin over the swelling has turned a purplish color. On examination, you palpate a 3-cm firm mass that is nontender in left level IB. There is an overlying violaceous hue. What is the most likely etiology?","o":["Mycobacterium tuberculosis","Bartonella henselae","Mycobacterium avium intracellulare","Epstein-Barr virus"],"k":"C","x":"Nontuberculous mycobacterial infections are common causes of cervical lymphadenopathy, especially in the preschool age group. It is generally unilateral, painless, and if left untreated can develop an overlying violaceous hue. The most common Nontuberculous mycobacterial species are Mycobacterium avium complex, M haemophilum, M scrofulaceum, and M kansasii. PAGES 732-733","bn":32},{"n":33,"s":"A 50-year-old man presents with neck swelling on the right side. The patient denies any associated pain or constitutional symptoms. On examination, you palpate an enlarged, nontender, firm lymph node in the posterior triangle on the right side. You also note a serous middle ear effusion on the right side and a normal tympanic membrane on the left side. What is the next best step?","o":["Nasal endoscopy","Cross-sectional imaging of the neck","Myringotomy","Nasal steroid spray and observation"],"k":"A","x":"Carcinoma must always be considered on the differential diagnosis for lymphadenopathy, particularly in adult patients with risk factors. Unilateral serous middle ear effusion may be due to a nasopharyngeal mass, so nasal endoscopy should be performed during the clinical examination. PAGE 735","bn":33},{"n":34,"s":"Which of the following is not found to be a driver of the inflammatory cascade in migraine patients?","o":["Calcitonin gene-related peptide","Substance P","Complement system","Histamine"],"k":"C","x":"During migraines, there is spontaneous neuronal dysfunction that leads to a depolarizing wave that spreads across the cerebral cortex. Part of this depolarization event leads to activation of trigeminal afferents and subsequent neurogenic inflammation mediated by a cytokine cascade, leading to the release of substance P, calcitonin gene-related peptide, histamine, as well as other inflammatory mediators. The complement system is not involved in this cascade. PAGE 740","bn":34},{"n":35,"s":"Which of the following has histaminergic neurons that are involved in migraine?","o":["Thalamus","Superior salivatory nucleus","Trigeminal nucleus caudalis","Tuberomammillary nucleus"],"k":"D","x":"The central nervous system (CNS) has histaminergic neurons in the tuberomammillary nucleus located in the posterior hypothalamus. These histaminergic neurons project throughout the CNS. Studies using PET suggest that there is activation of the posterior hypothalamus during the prodrome phase of migraines. PAGE 741","bn":35},{"n":36,"s":"Which of the following is not recognized by the International Headache Society (IHS) as a primary or secondary cause of headache?","o":["Cluster headache","Headache attributed to chronic or recurring rhinosinusitis","Sinus-type headache","Tension headache"],"k":"C","x":"The IHS does not consider rhinosinusitis itself a validated cause of headache or facial pain unless it is a secondary headache due to acute rhinosinusitis or an acute exacerbation of chronic rhinosinusitis. The diagnostic criteria given by the IHS in the International Classification of Headache Disorders 3rd Edition for “headache attributed to acute rhinosinusitis” and “headache attributed to chronic or recurring rhinosinusitis” are listed in Table 50.3. Cluster and tension headaches are both primary headache disorders as listed in Table 50.4. PAGE 742","bn":36},{"n":37,"s":"Which of the following fulfills the criteria for diagnosis of chronic rhinosinusitis?","o":["Four months of nasal congestion, headache, and cough with normal nasal endoscopy and findings of scattered maxillary and ethmoid opacification on CT sinus","One month of nasal congestion, postnasal drip, and rhinorrhea with findings of purulent drainage from bilateral middle meatus on nasal endoscopy","Four months of sinus headache, facial pain, and fatigue with normal nasal endoscopy and no evidence of sinonasal opacification on CT sinus","Six months of nasal congestion and rhinorrhea with normal nasal endoscopy and CT sinus remarkable for nasal septal deviation"],"k":"A","x":"The rhinosinusitis task force definition of chronic rhinosinusitis is as follows: 12 weeks or more of symptoms (two or more major factors or one major and two minor factors) and at least one of the following: purulence in sinonasal cavity, edema/erythema in sinonasal cavity, nasal polyps, inflammation of sinuses on imaging. Major factors are nasal obstruction, nasal drainage/purulence/ discolored postnasal drainage, hyposmia/anosmia, facial pain/pressure, and fever (in acute only). Minor factors are headache, halitosis, fatigue, dental pain, cough, and ear pain/fullness. PAGE 741","bn":37},{"n":38,"s":"A patient presents with intermittent severe right-sided temporal and orbital pain and headaches that last on average 1 to 2 hours and often will wake them up from sleep. There is associated right eye tearing and rhinorrhea with the headaches. Which of the following would most likely be the best acute treatment to resolve the patient’s symptoms?","o":["Indomethacin","100% oxygen via nonrebreather mask","Oxycodone","Pseudoephedrine"],"k":"B","x":"A cluster headache is a form of trigeminal autonomic cephalgia that is rare and mostly affects men with age of onset typically between 20 and 40 years of age. It is characterized by attacks of severe unilateral orbital, supraorbital, or temporal pain that last 15 to 180 minutes. The pain can be associated with autonomic symptoms of ipsilateral conjunctival injection, lacrimation, nasal congestion, rhinorrhea, forehead and facial sweating, miosis, ptosis, or eyelid edema. Some patients also may experience restlessness or agitation, which is different from migraine where patients prefer minimal movement and lack of stimuli from light and sound. Treatment with 100% oxygen for a period of 15 minutes via a tightly fitting nonrebreather mask usually allows for resolution of the attack. Triptans and other vasoconstrictive medications, such as ergotamine, have also been described for abortive treatments, while steroid taper at the onset of symptoms has been shown to shorten the attack. PAGE 744","bn":38},{"n":39,"s":"What is the mechanism of action of botulinum toxin A?","o":["Numbs the area that can diminish the perception of pain for a few hours","Blocks acetylcholine (ACh) release in the presynaptic neuromuscular transmitter","Blocks the neuromuscular junction by binding ACh to receptors located on it","Competitively binding to nicotinic cholinergic receptors"],"k":"B","x":"Botulinum toxin A has been shown to reduce the ACh release in the presynaptic neuromuscular transmitter at the neuromuscular junction. This is thought to reduce myofascial pain— linked excessive ACh release. PAGE 756","bn":39},{"n":40,"s":"Which of the following is most likely to distinguish temporomandibular disorder (TMD) from otalgia?","o":["Preauricular pain","Increase pain when chewing","Tinnitus","Muffled hearing"],"k":"B","x":"TMD pain frequently mimics other disez s seen by the otolaryngologist. Ear complaints are a common presentation of TMD and often consist of otalgia, aural fullness/clogged ear sensation, tinnitus, and crepitus or popping noises of the ear on the affected side. Patients may also complain of preauricular pain and hearing loss or hearing described as “muffled” on the affected side. Increase pain in chewing is seen with TMD but not generally with otalgia. PAGE 751","bn":40},{"n":41,"s":"What is the preferred imaging modality to visualize the soft tissue structures of the temporomandibular joint (TMJ)?","o":["Panorex","CT without contrast","CT with contrast","MRI"],"k":"D","x":"MRI is currently considered the preferred reference method for imaging the soft tissue structures of the TMJ. MRI can detect signs of TMJ pathology like thickening of the various ligaments, changes in disc morphology or functional position, and inflammatory fluid collections, such as joint effusions. PAGE 752","bn":41},{"n":42,"s":"Which of the following is an example of a first-line recommended treatment for TMJ spectrum diseases?","o":["Arthrocentesis","Trigger point injections","Nonsteroidal anti-inflammatory drugs (NSAIDs)","MRI"],"k":"C","x":"There are many types of medications used to treat TMJ spectrum diseases; the most common medications prescribed are NSAIDs, steroids, and skeletal muscle relaxants. NSAIDs are effective in the treatment of both arthrogenous (intracapsular) disorders and extracapsular myogenous TMJ disorders. NSAIDs not only provide analgesia but effectively lower inflammation. Trigger point injections and arthrocentesis can be used to treat TMJ spectrum disease but are not considered first line. PAGE 756","bn":42},{"n":43,"s":"Which of the following is the name of the classification scheme for various stages of internal derangement?","o":["Research diagnostic criteria","Diagnostic criteria","Wilkes","Israel"],"k":"C","x":"TMJ surgeons often use the popular Wilkes Staging System for internal derangement, which serves to classify the severity of damage to the TMJ and guide management of the disease. The Wilkes classification system focuses on the progressive stages of internal derangement with the end-stage representing loss of function. The progressive changes and loss of function are as a result of pathologic changes to the bone, cartilage, and synovium. PAGE 754","bn":43},{"n":44,"s":"A 34-year-old woman presents with enlarged submandibular glands and xerostomia. She has yet to undergo diagnostic work-up for immunologic disease. Based on clinical suspicion, which serologic test is most likely to yield positive results?","o":["SSA/anti-Ro Ab","Anti-centromere Ab","Anti-dsDNA Ab","Anti-desmoglein-3 Ab"],"k":"A","x":"The classic finding of Sjégren’s is sicca syndrome, which includes xerophthalmia with keratoconjunctivitis and xerostomia with or without salivary gland swelling. Diagnosis requires hallmark signs and symptoms as well as confirmation with a positive SSA/SSB antibody or characteristic minor salivary gland biopsy. PAGE 767","bn":44},{"n":45,"s":"A 56-year-old Caucasian woman has a long-term history of chronic kidney disease and interstitial lung disease and presents to your office with new-onset mild chronic rhinosinusitis symptomatology. Which diagnosis should be considered prior to offering endoscopic sinus surgery?","o":["Granulomatosis with polyangiitis","Behget disease","Microscopic polyangiitis","Rheumatoid arthritis"],"k":"C","x":"Microscopic polyangiitis (MPA) is a small vessel, ANCA-associated vasculitis primarily involving the lung and kidneys. MPA exhibits p-ANCA (myeloperoxidase antibody) staining upon indirect immunofluorescence. MPA has later onset and milder upper respiratory tract disease than granulomatosis with polyangiitis. PAGE","bn":45},{"n":46,"s":"A 43-year-old African American woman with sarcoidosis presents to the emergency department with stridor and mildly increased work of breathing. Flexible laryngoscopy demonstrates a bulky epiglottis with moderate airway obstruction. The decision is made to intubate the patient as the patient is tiring. Which intervention should be performed to yield an adequate airway?","o":["Tracheostomy","CO} laser reduction","Cryoablation","Balloon dilation"],"k":"B","x":"Treatment of laryngeal sarcoidosis is both medical and surgical. Systemic steroids are very effective in reducing the impact of disease. Intralesional steroid injection can limit systemic effects of oral administration. When airway obstruction is present, CO2 laser photoreduction and microdébridement may be considered to avoid the need for tracheostomy; however, tracheostomy is required when airway disease is unresponsive to more conservative treatment. PAGE 765","bn":46},{"n":47,"s":"A 13-year-old man with a history of osteogenesis imperfecta (OD) presents to clinic after having undergone audiometric evaluation, which demonstrated mild mixed hearing loss in the right ear and profound sensorineural hearing loss in the left ear. Which intervention is likely to yield a better hearing left","o":["Cochlear implantation","Bone conduction hearing aid","BiCROS hearing aid","No intervention will improve left-sided hearing"],"k":"A","x":"Hearing loss due to OI is typically mixed. Proposed mechanism is due to changes of the bony cochlea and vestibule. Early presentation of hearing loss in OI is typically due to conduction disturbances, most commonly stapes and footplate fixation. Therefore, stapedectomy yields meaningful improvement in long-term follow-up studies. However, severe-profound sensorineural loss will occur in half of patients with OI. Recent evidence supports the use of cochlear implantation for these patients, but the surgeon should be prepared for the potential altered anatomy of the operative field due to the disease. PAGES 771-772","bn":47},{"n":48,"s":"A 31-year-old man presents to the emergency department with diffuse blistering of approximately 80% of cutaneous surface area and mucosal membranes. The blisters are easily rupturing at the slightest touch. A diagnosis of pemphigus vulgaris is suspected. In addition to steroids and supportive therapy, which intervention is likely to improve the patient’s outcome most significantly?","o":["Topical corticosteroids","Topical cyclosporine","Corticosteroid-containing mouth rinse","Intravenous immunoglobulin"],"k":"D","x":"The gold standard for diagnosis of autoimmune blistering skin disease is identification of autoantibodies in skin or mucous membrane perilesional biopsy along with clinical suspicion. Treatment involves corticosteroids with or without cyclophosphamide or azathioprine. Intravenous immunoglobulin can be used in high-risk individuals. For limited and isolated skin disease, topical steroids or cyclosporine can be used. Supportive care and avoidance of worsening behaviors are also vital. PAGE 770","bn":48},{"n":49,"s":"A 43-year-old man presents to the emergency room with 5 days of sore throat and fevers, progressive fatigue over past 2 days, and decreased range of motion of his neck. Vitals are HR 128, BP 85/62, T 102.8, RR 26. On examination, the oropharynx is symmetric but there is purulent exudate on the right tonsil. Contrast-enhanced CT shows a 1.7-cm thrombus in right internal jugular vein with surrounding edema, inflammation, and fat stranding. What is the most likely organism on blood cultures?","o":["Bacteroides","Eikenella","Fusobacterium","Streptococcus"],"k":"C","x":"Lemierre syndrome, or internal jugular vein thrombophlebitis, is a rare but serious complication of soft tissue infections of the head and neck. The anaerobe, Fusobacterium necrophorum, is the most common causative organism, other bacteria implicated include Bacteroides, Eikenella, Streptococcus, Peptostreptococcus, Porphyromonas, Prevotella, Proteus, methicillin-sensitive Staphylococcus aureus, and methicillin-resistant Staphylococcus aureus. Clinical manifestations include spiking fevers, neck stiffness, pulmonary and systemic emboli, and tender swelling along the sternocleidomastoid muscle and angle of the jaw. Diagnosis is confirmed with the finding of ring enhancement and a filling defect of the internal jugular vein due to a clot or purulence on contrast-enhanced CT. Treatment involves beta-lactamase-resistant antibiotics, with consideration for CNS penetration if involvement is suspected. The use of anticoagulation is controversial. PAGE 787","bn":49},{"n":50,"s":"A 24-year-old man presents with a 5-day history of worsening throat pain, muffled voice, and fevers. Examination shows asymmetric fullness of the left soft palate with uvular deviation. What imaging modality will best visualize the area of concern:","o":["Ultrasound of the neck","CT of the neck with contrast","PET/CT scan","Plain films of the neck"],"k":"B","x":"Contrast-enhanced CT scan of the neck will most accurately show the peritonsillar abscess. The scan itself is excellent for delineating both bony and soft tissue structures. The addition of intravenous contrast further assists in differentiating a well-formed abscess from a phlegmon or cellulitis and visualizing the great vessels. An abscess on contrast-enhanced CT scan will demonstrate a central area of low attenuation or hypodensity with ring enhancement of its wall, surrounded by soft tissue edema. PAGES 783-784","bn":50},{"n":51,"s":"A 60-year-old diabetic woman has 1-cm trismus and subcutaneous crepitus. She is conversant and following commands. Which of the following would be the most effective airway management approach given for this patient’s symptoms?","o":["Conscience sedation","Slash tracheostomy","Transoral intubation after administration of paralytics","Awake fiberoptic nasotracheal intubation"],"k":"D","x":"Awake fiberoptic intubation, most commonly nasotracheal, has gained significant popularity as the availability of flexible fiberoptic scopes and subsequent experience level of operators have grown. The procedure requires the patient to sit in an upright position, preventing backward collapse of the tongue and pharyngeal walls. Inhaled nebulized lidocaine and nasopharyngeal “trumpets” coated with lidocaine jelly are generally effective in facilit: comfortable intubation in an awake patient. PAGES 784-785","bn":51},{"n":52,"s":"Upon arrival to the emergency room, a 2-year-old boy has fever, neck pain with lateral rotation, and is irritable. Imaging shows a 1.5-cm suppurative lymph node with rim enhancement. The next step in this patient’s management is","o":["Start IV antibiotics","Take him STAT to the OR","Perform a bedside tracheostomy","Consult infectious disease"],"k":"A","x":"Evidence has shown that an uncomplicated abscess, particularly in a pediatric patient, contained within a lymph node can be treated effectively with a 48-to 72-hour trial of antibiotics and close observation without surgical intervention. PAGE 785","bn":52},{"n":53,"s":"A 63-year-old woman with intellectual disability presents from a group home with significant left facial swelling, fluctuance, erythema and warmth and associated dryness of the overlying skin. Purulence drains intraorally, and she has poor dental hygiene. She has asymmetric pupils and droopy left eyelid. Infection of what other space may explain her neurologic deficits?","o":["Prestyloid parapharyngeal space","Poststyloid parapharyngeal space","Prevertebral space","Retropharyngeal space"],"k":"B","x":"Infections of the prestyloid and poststyloid compartments will differ in presentation. The prestyloid compartment normally contains fat, connective tissue, lymph nodes, and muscle, while the poststyloid compartment houses the carotid sheath and cranial nerves [X to XII. An infection of the poststyloid space may result in Horner syndrome (classic triad of ptosis, anhidrosis, and miosis). PAGES 793-794.","bn":53}]},{"t":"Laryngology","q":[{"n":1,"s":"Our ability to safely swallow different consistencies and volumes of food and liquid is based upon a:","o":["Autonomic response","Involuntary response","Patterned motor response","Voluntary response","None of the above"],"k":"C","x":"Normal swallowing function utilizes a variety of behaviors and reflexes. PAGE 801","bn":1},{"n":2,"s":"In a normal swallow, passage of the bolus through the relaxed upper esophageal sphincter (UES) is the result of:","o":["Bolus pressure exerted on the inferior constrictor muscle","Hyolaryngeal elevation with traction on the UES","Relaxation of the cricopharyngeus (CP) muscle","Response to glottic closure","A chin tuck"],"k":"B","x":"Hyolaryngeal elevation is the key aspect of UES opening, and when this is limited, dysphagia ensures. This happens with a variety of disease states (tracheotomy placement, radiation effects, surgery, etc.) PAGE 805","bn":2},{"n":3,"s":"A patient demonstrates aspiration after the swallow on a modified barium swallow study. This could be the result of:","o":["Inadequate hyolaryngeal elevation","Glottal incompetence","Incomplete mastication","Reduced labial closure","Velopharyngeal insufficiency"],"k":"A","x":"Aspiration can occur when inadequate hyolaryngeal elevation results in delayed or limited opening of the UES. PAGE 805","bn":3},{"n":4,"s":"On a modified barium swallow study, the epiglottis does not invert during the pharyngeal phase of swallowing. This suggests:","o":["Paresis of the aryepiglottic folds","Pharyngeal delay","Preferential filling of only one pyriform sinus","Tongue base weakness","Cognitive impairment"],"k":"D","x":"This abnormal position/movement of the epiglottis is a hallmark feature of dysphagia related to base of the tongue weakness, which is often seen after radiation therapy. PAGE 805","bn":4},{"n":5,"s":"Pill dysphagia without solid food dysphagia suggests a problem in which phase of swallowing?","o":["Anticipatory","Oropharyngeal","Pharyngeal","Esophageal","None of the above"],"k":"A","x":"Anticipation of swallowing especially food/water improves swallowing function, and this may not happen with pill intake. PAGE 802","bn":5},{"n":6,"s":"A patient demonstrates premature spillage on a videofluorographic study. This indicates:","o":["Poor preparation of the bolus","Premature glottal closure","Reduced posterior oral control","Velopharyngeal competence","Cricopharyngeal bar"],"k":"C","x":"Reduced posterior oral control and/or weak velar depression may produce premature loss or “premature spillage” of a liquid bolus into the pharynx or larynx before the pharyngeal phase of swallowing is “triggered.” PAGE 803","bn":6},{"n":7,"s":"Regarding the specific complaint of difficulty swallowing medications, which of the following is true?","o":["Pill dysphagia cannot be evaluated by videofluoroscopy.","Dysphagia to pills predicts dysphagia to solid food.","The PILL-5 was validated to screen for pill dysphagia by pharmacists.","Dysphagia to pills is common among otherwise healthy patients.","“Bedside” swallow evaluation is usually adequate for pill dysphagia evaluation."],"k":"D","x":"Videofluoroscopy and/or transnasal esophagoscopy are important tools to evaluate pill dysphagia. (Nativ-Zeltzer N, Bayoumi A, Mandin VP, et al. Validation of the PILL-5: a 5-Item Patient Reported Outcome Measure for Pill Dysphagia. Front Surg. 2019;6:43.) PAGE 809","bn":7},{"n":8,"s":"To evaluate complaints of dysphagia following ischemic stroke, videofluoroscopic swallow study (VFSS) offers what advantage over fiberoptic endoscopic evaluation of swallowing?","o":["Assessment of vocal fold mobility","Detection of frank aspiration","Evaluation of hyolaryngeal elevation","Measurement of oral and pharyngeal transit times","Assessment of potential mucosal disease of the oropharynx"],"k":"C","x":"Evaluation of hyolaryngeal elevation is an essential aspect of dysphagia evaluation and is best determined on VFSS. (Madden C, Fenton J, Hughes J, Timon C. Comparison between videofluoroscopy and milk-swallow endoscopy in the assessment of swallowing function. Clin Otolaryngol Allied Sci. 2000;25(6):504-506.) PAGE 815","bn":8},{"n":9,"s":"The sensitivity of fiberoptic endoscopic evaluation of swallowing with sensory testing is improved by including assessment of:","o":["Gag reflex","Pharyngeal squeeze","Laryngeal adductor reflex","Intrabolus pressure in the UES","Mucosal color changes in the posterior commissure"],"k":"B","x":"The assessment of pharyngeal squeeze during fiberoptic endoscopic evaluation of swallowing with sensory testing compliments that sensory assessment. (Setzen M, Cohen MA, Perlman PW, et al. The association between laryngopharyngeal sensory deficits, pharyngeal motor function, and the prevalence of aspiration with thin liquids. Otolaryngol Head Neck Surg. 2003;128(1):99-102.) PAGE 813","bn":9},{"n":10,"s":"A survivor of oropharyngeal squamous cell carcinoma who received concurrent chemoradiation 5 years prior and who presents with dysphagia would likely demonstrate which of the following on high-resolution manometry?","o":["Reduced pharyngeal contraction","Silent airway invasion","Exaggerated hyolaryngeal elevation","Premature swallow trigger","Vocal fold immobility"],"k":"A","x":"Manometry uniquely provides objective and detailed information about time and amount of muscle constriction associated with swallowing. (Schaen-Heacock NE, Jones CA, McCulloch TM. Pharyngeal swallowing pressures in patients with radiation-associated dysphagia. Dysphagia. 2021;36(2):242-249.) PAGES 818-819","bn":10},{"n":11,"s":"Transnasal esophagoscopy affords many advantages over conventional peroral esophagoscopy though traditional Esophagogastroduodenoscopy remains preferred for:","o":["Complication profile","Patient tolerance","Barrett esophagus screening at the gastroesophageal junction","Interventional procedures requiring sedation","Velopharyngeal insufficiency assessment"],"k":"D","x":"Interventional procedures requiring sedation. (Amin M, Postma G, Setzen M, et al. Transnasal esophagoscopy: a position statement from the American Bronchoesophagological Association (ABEA). Otolaryngol Head Neck Surg. 2008;138(4):411-414.) PAGES 815-817","bn":11},{"n":12,"s":"Which is not a compensatory posture to improve swallowing function?","o":["Chin tuck","Head turn","Head tilt","Head back","Tongue protrusion"],"k":"E","x":"Options A, B, C, and D are all commonly used compensatory postures to improve swallowing function. PAGES 825-826","bn":12},{"n":13,"s":"The supraglottic swallow maneuver sequence includes the following:","o":["Bare down, hold breath, swallow, cough","Cough, hold breath, bare down, swallow","Hold breath, bare down, cough, swallow","Hold breath, bare down, swallow, cough","None of the above"],"k":"D","x":"Option D is the appropriate sequence for the very important supraglottic swallow maneuver that is often a lifesaving maneuver to assist patients with dysphagia. PAGES 827-828","bn":13},{"n":14,"s":"Which are commonly used medical management approaches to assist with dysphagia:","o":["Drying agents","Chronic antibiotic treatment","Oral care","Pulmonary rehabilitation","Options A, C, D"],"k":"E","x":"Options A, C, and D are commonly used medical management approaches for patients with dysphagia. PAGES 829-830","bn":14},{"n":15,"s":"Key aspects of respiration with respect to swallowing dysfunction include:","o":["Timing of apnea","Forceful exhalation","Diaphragmatic breathing","Vocal fold abduction","None of the above"],"k":"A","x":"Coordination of swallowing and breathing are vital and often pulmonary disease impairs this timing and leads to dysphagia. PAGE 830","bn":15},{"n":16,"s":"In cases on immunocompromise, these infections can result in dysphagia.","o":["Cytomegalovirus","Candida","Smallpox","Herpes simplex","A, B, D"],"k":"E","x":"Options A, B, and D are three infections commonly seen in the individual who is immunocompromised and can lead to dysphagia. PAGE 830","bn":16},{"n":17,"s":"What is the clinical difference between rigid bougies and balloon for dilations?","o":["Longer relief of dysphagia symptoms with balloon dilation.","Fewer complications with balloon dilation.","Less postoperative pain associated with balloon dilation.","There are no reported differences between them.","Decreased environmental impact with balloon dilation."],"k":"C","x":"Although there are no differences in symptomatic relief, recurrence rate, bleeding, or perforation, the balloon dilators have been shown to be less painful in the postoperative period. PAGE","bn":17},{"n":18,"s":"What structure is most at risk during an open transcervical approach for repair of Killian-Jamieson diverticula?","o":["Recurrent laryngeal nerve (RLN)","Hypoglossal nerve","Carotid artery","Marginal mandibular branch of facial nerve","Thoracic duct"],"k":"A","x":"The RLN is typically in the vicinity of the diverticula and at risk during the procedure. PAGE 839","bn":18},{"n":19,"s":"Which procedures should be completed alongside a hypopharyngeal pharyngoplasty?","o":["Medialization laryngoplasty and tracheotomy","Hyoid suspension and cricopharyngeal myotomy","Tracheotomy and hyoid suspension","Cricopharyngeal myotomy and medialization laryngoplasty","Hyoid suspension and medialization laryngoplasty"],"k":"D","x":"The combination of these procedures decreases pooling of secretions in the pyriform sinus and allows better protection of the airway by laryngeal mechanisms. PAGE 837","bn":19},{"n":20,"s":"Where is the location of a Zenker diverticulum?","o":["Inferior to the CP muscle and protrudes posteriorly","Inferior to the CP muscle and protrudes anterolaterally","Superior to the CP muscle and inferior to the inferior pharyngeal constrictor muscle","Superior to the CP muscle and superior to the inferior pharyngeal constrictor muscle","Through the CP muscle fibers"],"k":"C","x":"A Zenker diverticulum is superior to the CP muscle because it is a pulsion diverticulum that is believed to be formed secondary to a dysfunctional CP muscle. Option A corresponds to a Laimer diverticulum. Option B corresponds to a Killian-Jameson diverticulum. PAGE 840","bn":20},{"n":21,"s":"Which does not increase the risk of perforation with dilation?","o":["Use of bougie dilators","Previous radiation","Friable esophageal mucosa","Complex strictures"],"k":"A","x":"Studies have not shown an increased risk of bougie dilators compared to balloon dilators. The other features all increase the risk of perforation. PAGE 838","bn":21},{"n":22,"s":"What is the most common cause of infectious esophagitis in immunocompetent individuals?","o":["Candida albicans","Cytomegalovirus","Staphylococci species","Human papillomavirus","Streptococcus pyogenes"],"k":"A","x":"This is most likely due to prolonged antibiotic use, GERD/LPRD, dysmotility or diabetes. PAGES 848-849","bn":22},{"n":23,"s":"The diagnosis of eosinophilic esophagitis is best made by:","o":["Lack of response to proton pump inhibitor (PPI) treatment","Presence of trachealization of the esophagus","Histologic presence of eosinophils in the submucosa","Positive food allergy testing","Esophageal manometry"],"k":"C","x":"Eosinophilic esophagitis diagnosis involves a greater than 15 eosinophils per high-power field on biopsy. PAGES 846-847","bn":23},{"n":24,"s":"Which of the following is a risk factor for development of vertebral osteophytes?","o":["Trauma","Reflux","Osteoporosis","Obesity","Smartphone use"],"k":"D","x":"Obesity, advanced age, and diabetes are the most common risk factors of vertebral osteophytes impacting swallowing function. PAGE 856","bn":24},{"n":25,"s":"Which of the following is a useful treatment for ineffective esophageal motility?","o":["Nifedipine","Bethanechol","Sildenafil","Fluconazole","Amoxicillin"],"k":"B","x":"Prokinetic medication including bethanechol can be used for ineffective esophageal motility. PAGE 854","bn":25},{"n":26,"s":"What is are the predominant feature of classic, or type I achalasia on high-resolution manometry?","o":["Elevated integrated relaxation pressure and absent esophageal peristal","Decreased integrated relaxation pressure and hypercontractile peristalsis","Elevated integrated relaxation pressure and intact esophageal peristalsis","Decreased integrated relaxation pressure and spastic esophageal peristalsis"],"k":"A","x":"Elevated integrated relaxation pressure and absent esophageal peristalsis. PAGES 850-851","bn":26},{"n":27,"s":"Which of the following muscles abducts the vocal fold?","o":["Cricothyroid muscle","Thyrohyoid muscle","Lateral thyroarytenoid muscle","Lateral cricoarytenoid muscle","Posterior cricoarytenoid muscle"],"k":"E","x":"The posterior cricoarytenoid muscle is the only true abductor of the vocal folds. PAGES 864-866","bn":27},{"n":28,"s":"Elastin fibers are most numerous in which layer of the vocal fold?","o":["Quadrangular ligament","Superficial lamina propria","Intermediate lamina propria","Deep lamina propria","Vocal ligament"],"k":"C","x":"The intermediate layer is thought to provide the “elastic” connection between the cover (epithelium/SLP and the deep layer of the lamina propria). PAGES 866-867","bn":28},{"n":29,"s":"Continuous positive airway pressure is effective for obstructive sleep apnea because it:","o":["Supports the soft palate","Compresses the tongue base","Stimulates activity of dilating muscles","Prevents pharyngeal collapse during expiration","Forces the pharynx to open after obstruction"],"k":"D","x":"Pharyngeal collapse is common in obstructive sleep apnea, and the positive pressure keeps this aspect of the airway patent during sleep. PAGE 862","bn":29},{"n":30,"s":"Sensation of upper airway pressure is primarily mediated through the:","o":["Superior laryngeal nerve (SLN)","RLN","Glossopharyngeal nerve","Inferior alveolar nerve","Pharyngeal plexus"],"k":"A","x":"The SLN provides sensory innervation to all mucosal aspects of the larynx to the level of the glottis. PAGE 866","bn":30},{"n":31,"s":"Which laryngeal muscle is bilaterally innervated?","o":["Thyroarytenoid","Interarytenoid","Cricothyroid","Lateral cricoarytenoid","Posterior cricoarytenoid"],"k":"B","x":"The interarytenoid muscle receives innervation from each RLN (right and left), given that it is a midline muscle. PAGES 865-866 32. Answer: Figure (D). ILO classically presents with a variable extrathoracic obstructive pattern flow volume loop, as depicted in Figure (D). Figure (A) represents a normal flow volume loop. While this is possible for a patient with ILO who is asymptomatic (ie, not acutely experiencing a dyspnea episode), it would be a less likely tracing for an acute ILO episode. Figure (B) depicts a fixed obstruction. This is classic for subglottic stenosis, where the stricture is nondynamic due to the circumferential rigid cricoid which minimizes variation of the degree of obstruction with respiration. Figure (C) represents variable intrathoracic obstruction (ie, airway below thoracic inlet) such as seen with tracheomalacia or tumors of the trachea/mainstem bronchus. PAGE 880","bn":31},{"n":32,"s":"In which scenario is a diagnosis of ILO most likely?","o":["A 23-year-old female presents to the emergency department with dyspnea and wheezing. Symptoms are unresponsive to inhaled albuterol. Chest x-ray is normal. An arterial blood gas was drawn upon arrival while on room air with the following results: PaO₂ 54, PaCO₂ 63, A-a gradient 17.","A 17-year-old competitive rower reports that after approximately 15 minutes of intense rowing, they become progressively short of breath and lose their ability to maintain stamina. The patient also notes noisy breathing during these episodes upon exhalation and chest tightness. This forces the patient to stop exercising. After sitting calmly for 15 to 20 minutes, the patient is usually back to their baseline.","A 21-year-old female presents to a pulmonologist for exercise-induced dyspnea, cough, and noisy breathing. Pulmonary function tests are performed. There is reduced peak expiratory flow and a scooped appearance to the expiratory flow limb. This is reversible upon administration of bronchodilator. The pulmonologist proceeds with bronchoprovocation testing. Immediately following administration of methacholine, the patient develops dyspnea, throat tightness, and inspiratory stridor.","A 45-year-old male reports dyspnea, inspiratory stridor, and dysphonia that began 6 weeks ago. The symptoms worsen with exertion but are present even at baseline. His bed partner does not notice stridor or any apneas at night while sleeping. Laryngoscopy demonstrates adduction of the true vocal folds during inspiration."],"k":"C","x":"Baseline spirometry for the patient in (C) is suggestive of an obstructive pattern, and reversibility suggests asthma. However, the bronchoprovocation challenge with methacholine immediately induces symptoms classic for [LO—dyspnea, symptoms localizing to the throat, and inspiratory stridor. It is key to recognize that a diagnosis of asthma does not preclude a diagnosis of ILO. Both can, and often, coexist. This patient likely has ILO and asthma. Patient (A) is presenting with an acute exacerbation of asthma. Patients presenting with an acute episode of isolated ILO should not be hypoxic, and the A-a gradient is always normal, and PaCO₂ can be variable. Patient (B) is most likely presenting with exercise-induced asthma given the gradual onset of symptoms that peak after maximal exercise has been ongoing for some time and then takes a longer duration of rest before resolution. Patient (D) likely has respiratory laryngeal dystonia given their symptoms have been present greater than 4-week duration, are constant while awake, and abate only at night. PAGES 880-881","bn":33},{"n":33,"s":"A patient presents for assessment of dyspnea and stridor, usually provoked with exertion. Laryngoscopy is performed. Which description is not consistent with ILO?","o":["During quiet breathing, both vocal folds show minimal movement with respiration. Upon phonation and swallowing, both vocal folds adduct completely and symmetrically. Following three forced sniffs, the vocal folds maximally abduct symmetrically. Rapid alternation between /i/ and sniffing is associated with vocal fold adduction and abduction, respectively.","During conversational speech, both vocal folds are noted to adduct while phonating, and then, quickly and symmetrically abduct as the patient takes a breath to begin their next sentence. When asked to sniff forcefully three times in a row, there is collapse of the supraglottic arytenoid mucosa that partially obstructs view of the true vocal folds.","During quiet breathing, both vocal folds show minimal movement with respiration. Upon phonation and swallowing, both vocal folds adduct completely and symmetrically. When asked to sniff forcefully three times in a row, both vocal folds are noted to close slightly. Alternation between /i/ and sniffing results in adduction and mild abduction of the vocal folds, respectively.","During quiet breathing, both vocal folds are noted to adduct with inspiration and then abduct slightly with expiration. With increased breathing effort, this effect is more exaggerated. Only intermittently when asked to quickly sniff do the vocal folds fully and symmetrically abduct. During conversational speech, there is significant supraglottic hyperfunction that almost completely obstructs view of the vocal folds."],"k":"C","x":"During laryngoscopy, it is critical at some point in the examination to document full and symmetric abduction of the vocal folds. While there may be paradoxical vocal fold motion (ie, adduction with inspiration), but this is never consistent, and failure to recognize intermittent full abduction precludes a diagnosis of ILO. Patient (C) likely has bilateral vocal fold hypomobility. The apparent closure of the vocal folds during sniffing may be due to either Bernoulli effect or aberrant synkinesis. Patients with bilateral hypomobility may be limited only in abduction, with preserved adduction. This is commonly seen in posterior glottic stenosis. Patient (A) has a normal laryngeal examination. This is commonly seen, even in patients with ILO, and does not preclude a diagnosis. Patient (B) demonstrates supraglottic ILO. Patient (D) has classic paradoxical vocal fold motion, diagnostic of glottic ILO. Note that full abduction is appreciated during the examination. PAGES 880-881","bn":34},{"n":34,"s":"Which of the following statements regarding neuromodulator treatment of chronic cough is FALSE?","o":["Gabapentin, pregabalin, and amitriptyline are recognized first-line neuromodulators for the treatment of chronic cough, with level 1 evidence supporting their treatment efficacy.","Following adequate cough control with neuromodulator use, long-term resolution of the cough is often achieved by slowly weaning off the neuromodulator.","The combination of behavioral cough management therapy in conjunction with neuromodulator use is synergistic in achieving improvement in cough frequency and severity.","Side effects are common with neuromodulator use and can be mitigated by down-titrating the dose."],"k":"B","x":"False. Many questions regarding neuromodulating medications remain unknown. Most randomized controlled trials demonstrate benefit of these medications; however, effect is generally lost following discontinuation of the medication. Gabapentin, pregabalin, and amitriptyline have level 1 randomized controlled trial evidence supporting their efficacy in the treatment of chronic cough and are therefore first-line agents. There is insufficient evidence to support a superior agent over another. Side effects are very common with neuromodulator use, and therefore, it is recommended that they be titrated accordingly, balancing cough control with adverse events. In combination with behavioral cough management under supervision of an SLP, there is a synergistic effect on cough improvement, with more durable/long-lasting cough control demonstrated. PAGE 876","bn":35},{"n":35,"s":"A 68-year-old male complains of cough of 8-month duration, which is progressively worsening. He notes that the cough occurs with almost every meal, especially with liquid intake. He is a lifelong nonsmoker. His only medication is pantoprazole 40 mg daily, which adequately controls his heartburn symptom. He denies dyspnea, stridor, or voice change. He has no other throat-related symptoms besides choking on his saliva at night when lying down. Sinonasal history is noncontributory. Flexible nasal endoscopy demonstrates healthy nasal mucosa, no polyposis, or other significant findings. Laryngoscopy demonstrates normal vocal fold motion, pooling of secretions in the left pyriform sinus, and no other concerning findings. Recent chest x-ray was normal. What is the next best step in the management of this patient?","o":["Increase his pantoprazole to 40 mg twice daily for control of gastric reflux—related chronic cough","Computed tomography (CT) thorax","Behavioral cough management therapy under the supervision of a speech-language pathologist (SLP) with training in voice and upper airway disorders","Video-fluoroscopic swallow study","Physical therapy for neck range of motion optimization"],"k":"D","x":"This gentleman’s history is concerning for aspiration. His cough is associated with oral intake, especially liquids. Other findings concerning for aspiration/dysphagia include pooling of hypopharyngeal secretions and choking on saliva when supine. These symptoms warrant an objective swallowing evaluation, such as video-fluoroscopic swallow study or functional endoscopic evaluation of swallowing. If the cough was related to reflux-provoking foods, occurring after the meal, especially if lying supine, or the patient complained of other LPR-related symptoms (refer to Reflux Severity Index), then PPI intensification would be appropriate. This is a nonsmoker with a normal chest x-ray, and no dyspnea, therefore CT thorax is unlikely to be contributory. Behavioral cough management in the setting of suspected aspiration-related cough is not an appropriate next step in management. He may be a candidate for swallowing therapy depending on the video-fluoroscopic swallow study results. PAGE 874","bn":36},{"n":36,"s":"Which of the following features is not associated with a difficult intubation:","o":["Short thyromental distance","Short sternomental distance","Limited neck extension","Previous difficult intubation","Obesity"],"k":"E","x":"Obesity is not a known risk fact for difficult intubation. Answers A-D are known risks factors for difficult intubation. PAGE","bn":37},{"n":37,"s":"Gold standard confirmation of endotracheal intubation is confirmed via:","o":["Bronchoscopic confirmation of the carina via the endotracheal tube (ETT)","Bilateral air entry on auscultation","Bilateral air entry on auscultation and qualitative capnography greater than 5 breaths","Quantitative waveform capnography greater than 5 breaths","Fogging of the ETT and chest wall movement"],"k":"D","x":"This is gold standard for ETT placement. Bronchoscopy is labor and equipment intensive and not standard of care. Auscultation can be faulty of endotracheal intubation. PAGE 905","bn":38},{"n":38,"s":"The American Society of Anesthesiologists Task Force defined the difficult airway as all of the following except:","o":["Difficult oral airway placement","Difficult face mask ventilation","Difficult laryngoscopy","Difficult intubation","More than three attempts at securing the airway"],"k":"A","x":"All other options are key aspects of a difficult airway patient. PAGE 906","bn":39},{"n":39,"s":"Which of the following represents the approach to jet ventilation with the most risk?","o":["Infraglottic","Supraglottic","Transtracheal","High frequency","Low frequency"],"k":"C","x":"Transtracheal jet ventilation is excellent for direct application of ventilation but also has the risk of barotrauma if not used properly. PAGE 913","bn":40},{"n":40,"s":"Apneic oxygenation (aka high-flow nasal oxygenation/ Transnasal Humidified Rapid-Insufflation Ventilatory Exchange):","o":["Shortens the safe apnea time","Effectively clears CO2","Does not require a patent upper airway","Occurs by bulk flow of oxygen down a pressure gradient into the alveoli","Prevents atelectasis"],"k":"D","x":"This airway technique benefits from a patent airway, has a risk of CO₂ build up, and is effective via the means listed in answer D. PAGES 914-915","bn":41},{"n":41,"s":"Which of the following is not an indication for tracheotomy?","o":["Airway protection","Upper airway protection, acute or chronic","Dysphagia","Pulmonary toilet","Prolonged mechanical ventilation"],"k":"C","x":"Dysphagia (temporary) results from tracheotomy. All other options are indications for tracheotomy. PAGE 920","bn":42},{"n":42,"s":"Contraindications for a cricothyrotomy include the following:","o":["Laryngeal trauma","Trismus","Transection of the airway","Neonate/very young age of patient","A, C, D"],"k":"E","x":"Trismus is not a contraindication for cricothyrotomy. The other options are classic contraindications for cricothyrotomy. PAGE 921","bn":43},{"n":43,"s":"Which of the following are not benefits of a multidisciplinary tracheotomy team?","o":["Decreased postoperative morbidity","Prolonged period of time to decannulation","Reduced incidence of tracheostomy tube obstruction","Decreased postoperative mortality","Increased use of speaking valves"],"k":"B","x":"All the options other than B represent benefits of a multidisciplinary tracheotomy team. This team also leads to more rapid decannulation time. PAGE 930","bn":44},{"n":44,"s":"Which of the following are not potential intraoperative complications of tracheotomy?","o":["Intraoperative tracheoesophageal fistula","Hemorrhage","Pneumothorax","Hypertension","Postobstructive pulmonary edema"],"k":"D","x":"All the above except hypertension is a known intraoperative complication. Fire is an additional risk of this procedure. Postobstructive pulmonary edema can occur shortly after relief of airway obstruction. PAGE 933","bn":45},{"n":45,"s":"Which is the following is not a contraindication of percutaneous tracheotomy?","o":["A patient in cervical collar with a stable airway","Unprotected airway and airway emergency","Inability to palpate the cricoid cartilage","Midline neck mass","High innominate artery"],"k":"A","x":"All the above are contraindication except for a patient in a cervical collar. Additional contraindications are children. PAGE","bn":46},{"n":46,"s":"A healthy 33-year-old female is 2 days s/p total thyroidectomy complicated by bilateral vocal fold motion impairment and now has symptomatic airway obstruction. Of the following, which provides immediate relief of obstruction, is reversible, and a good alternative to a tracheotomy?","o":["Vocal fold suture lateralization","Posterior cordotomy","Adductor laryngeal Botox","Total arytenoidectomy","Nimodipine"],"k":"A","x":"Suture lateralization provides at least a short-term solution for improving a neurogenic acute glottic obstruction and is reversible. While adductor Botox could be an additional answer, Botox takes 24 to 72 hours to take effect. Medical therapy for acute vocal fold paralysis is not an acute acting treatment. PAGE 956","bn":47},{"n":47,"s":"Which maneuver during a long-segment cervical tracheal resection provides the most release with the least additional morbidity?","o":["Suprahyoid release","Infrahyoid release","Hilar release","Pulmonary artery release","Tracheotomy"],"k":"A","x":"Suprahyoid release provides the most release with the least morbidity. Infrahyoid release is associated with increased rates of dysphagia. For hilar and pulmonary artery releases, additional dissection and incisions are required. Tracheotomy tethers the airway. PAGE 961","bn":48},{"n":48,"s":"Use of tracheal stenting is best suited for which of the following clinical indication?","o":["Worsening of a 3 cm tracheal stenosis related to active granulomatosis with polyangiitis","2 cm idiopathic tracheal stenosis refractory to dilation","Midtracheal compression with airway obstruction from anaplastic thyroid carcinoma","Worsening cricoid stenosis and narrowing from a chondroma","Bilateral vocal fold paralysis"],"k":"C","x":"Tracheal stents are best used for palliative cases. PAGES 962-963","bn":49},{"n":49,"s":"Cricotracheal resection differs from tracheal resection in regard to morbidity in that:","o":["There is a difference in postoperative mortality","Cricotracheal resection always requires a tracheostomy postoperatively","Swallowing is worse after cricotracheal resection","Voice changes after cricotracheal resection","There is no difference"],"k":"D","x":"Resection of the cricothyroid muscle is a necessary step for cricotracheal resection. This causes a reduced ability to elongate the vocal fold and elevate pitch. In women, in particular, there is risk of lowering the pitch of the voice. PAGE 958","bn":50},{"n":50,"s":"To appropriately stage a posterior glottic stenosis, the following is required:","o":["CT scan of the larynx","Office flexible laryngoscopy without laryngeal topical anesthesia","Laryngeal electromyography","Operative direct laryngoscopy","Pulmonary function testing"],"k":"D","x":"Bogdasarian and Olson staging of posterior glottic stenosis requires an assessment of the mobility of the cricoarytenoid joints. While all of these tests are useful patient assessment tools, only operative laryngoscopy with palpation of the joints provides the necessary information to complete staging. PAGE 954","bn":51},{"n":51,"s":"A 58-year-old male patient suffers laryngeal trauma in a motor vehicle collision. His physical examination findings include anterior cervical ecchymosis, loss of laryngeal landmarks, biphasic stridor, and moderate respiratory distress. The next best step in management would be:","o":["Admission for observation, humidified room air, and IV steroids","Awake fiberoptic intubation","Secure airway through awake tracheostomy with local anesthesia","Needle cricothyroidotomy with jet ventilation","Sending patient to the imaging department for a CT scan"],"k":"C","x":"This has an unstable airway, and manipulation of the larynx (including intubation) is risky and may result in loss of the airway. PAGES 975-976","bn":52},{"n":52,"s":"A 26-year-old male suffers laryngeal trauma in a bull riding injury. Physical examination finding includes mild anterior cervical ecchymosis, palpable laryngeal landmarks, and quiet breathing. Computed tomography displays a nondisplaced fracture of the cricoid cartilage. Bedside fiberoptic flexible laryngoscopy shows a small hematoma of the right true vocal fold but with good mobility. Which of the following is the next best step in management?","o":["Direct laryngoscopy to evaluate for mucosal lacerations and arytenoid mobility","Conservative management with close observation, humidified room air, PPIs, steroids, and voice rest","Fiberoptic intubation with a small diameter ETT","Awake tracheostomy under local anesthesia","MRI with a minimum 3 tesla device"],"k":"B","x":"The patient has a stable airway, and the imaging shows no encroachment of the airway despite the cricoid fracture. PAGE 976","bn":53},{"n":53,"s":"Which clinical scenario is the most appropriate for use of a stent in laryngeal trauma?","o":["Extensive lacerations and disruption of the anterior commissure and loss of anterior-posterior support of the larynx","Bilateral vocal fold hematomas","Massive laryngeal cartilage fractures with adequate stabilization","Cricotracheal separation","Exposed arytenoid cartilage"],"k":"A","x":"Stenting is essential when there is loss of integrity of the laryngeal structure and/or extensive mucosal loss. PAGE 979","bn":54},{"n":54,"s":"Shear failure of resorbable screws with open reduction and internal fixation of laryngeal cartilage is best prevented by utilizing:","o":["Tapped, undersized drill bits","Untapped, undersized drill bits","Tapped, same sized drill bits","Untapped, same sized drill bits","Tapped, upsized drill bits"],"k":"B","x":"This approach maximizes the security of fixation. PAGE 978","bn":55},{"n":55,"s":"Which of the following is most commonly associated with complete cricotracheal separation?","o":["Bilateral RLN injury","Supraglottic stenosis","Esophageal injury","Successful orotracheal intubation","Epiglottic inversion"],"k":"A","x":"This injury has a high incidence of bilateral RLN injury. PAGE 980","bn":56},{"n":56,"s":"Which of the following structures is innervated by the internal branch of the SLN?","o":["Thyroarytenoid muscle","Cricothyroid muscle","Supraglottic mucosa","Infraglottic mucosa","Lateral cricoarytenoid muscle"],"k":"C","x":"The internal branch of the SNL provides sensory innervation to the ipsilateral supraglottic mucosa. PAGE 988","bn":57},{"n":57,"s":"Contraction of the cricothyroid muscle results in which of the following changes?","o":["Decreased vocal fold tension","Decreased mass per unit length","Decreased vocal pitch","Decreased vibratory frequency","Vocal fold abduction"],"k":"B","x":"Cricothyroid muscle contraction increases vocal fold tension and length, thereby decreasing vocal fold mass per unit length. This allows vibratory frequency to increase, air pressure being equal, which increased vocal pitch. PAGES 986-987","bn":58},{"n":58,"s":"An examiner may record their qualitative assessment of a patient vocal quality using which rating instrument?","o":["Voice Handicap Index-10","Voice-Related Quality of Life","Consensus Auditory-Perceptual Evaluation of Voice","Stroboscopy","Jitter"],"k":"C","x":"The Consensus Auditory-Perceptual Evaluation of Voice is a standardized instrument for listener’s description of patient’s voice. PAGE 993","bn":59},{"n":59,"s":"Stroboscopy allows observation of which vocal fold characteristic in addition to those observed on continuous-light laryngoscopy?","o":["Mucosal color","Mucosal pliability","Gross vocal fold motion","Vascular lesions","Vocal fold hemorrhage"],"k":"B","x":"Stroboscopy uses a pulsed light source timed to flash just slightly off of the vocal fold vibratory frequency to yield an image of mucosal oscillation, which is otherwise too fast to be observed with continuous light. PAGE 994","bn":60},{"n":60,"s":"Which of the following physical properties of the vibratory mucosal wave correlates most often with hoarseness or rough voice quality?","o":["Amplitude","Frequency","Asymmetry","Aperiodicity","Mucosal erythema"],"k":"D","x":"Loss of regularity of mucosal wave vibration results in turbulent airflow through the glottis, irregular pressure changes, and rough sound quality. PAGE 994","bn":61},{"n":61,"s":"How does reflux cause laryngeal symptoms and induce extraesophageal pathology?","o":["Direct contact of acid and pepsin with the epithelium","Additional factors such as vocal abuse or concomitant viral infection","Acid within the distal esophagus stimulates vagally mediated reflexes leading to cough and other laryngeal pathology","Both A and C","All of the above"],"k":"E","x":"Options A-B are thought to be each involved in the symptoms of LPR. PAGE 1000","bn":62},{"n":62,"s":"You suspect that a patient may have Laryngopharyngeal reflux (LPR) based on symptoms and findings on flexible laryngoscopy. Which initial testing modality provides the most data to help establish a diagnosis?","o":["Dual pH metry","Oropharyngeal pH monitoring","MII-pH monitoring","Bilitec monitoring","Esophagoscopy"],"k":"C","x":"MII-pH monitor provides the clinician and patient with the most detailed information about reflux activity or lack thereof. PAGES 1006-1007","bn":63},{"n":63,"s":"Which salivary substance may have potential diagnostic value in the work up of LPR?","o":["Hydrochloric acid","Pepsin","Bile salts","Trypsin","All of the above"],"k":"B","x":"Given the central role of pepsin in reflux symptoms and negative impact, pepsin testing has been a goal for reflux detection. PAGE 1008","bn":64},{"n":64,"s":"There is a commercially available salivary pepsin assay in the United States.","o":["True","False","True but requires a doctors order","False this technology has been developed yet","False since pepsin can now be determined with a breath test"],"k":"A","x":"True. PAGE 1008","bn":65},{"n":65,"s":"What is considered the most effective management strategy for Extra Esophageal Reflux?","o":["Diet and lifestyle changes including weight loss","PPIs","H2 antagonists","Alginate suspensions","Nissen or Toupet fundoplication"],"k":"E","x":"These are surgical techniques to prevent gastric contents from refluxing in a cephalad direction. PAGES 1012-1013","bn":66},{"n":66,"s":"Which of the following is not one of the most common causative bacteria for bacterial laryngitis?","o":["Haemophilus influenzae","Staphylococcal species","Klebsiella pneumoniae","Streptococcal species"],"k":"C","x":"Klebsiella is a not commonly seen in the larynx. Methicillin-resistant Staphylococcus aureus has been reported. PAGE","bn":67},{"n":67,"s":"The first-line treatment for recurrent respiratory papillomatosis is:","o":["Debridement","Inhaled cidofovir","High-dose oral steroid burst","Azathioprine","Interferon"],"k":"A","x":"Surgical removal is the first-line treatment for recurrent respiratory papillomatosis that causes respiratory or voice problems. The other options are not regularly used treatments. PAGE","bn":68},{"n":68,"s":"The most commonly affected site for laryngeal sarcoid is:","o":["Postcricoid region","Subglottis","Glottis","Supraglottis","Postcricoid"],"k":"D","x":"The classic location of laryngeal sarcoid is the epiglottis. PAGE 1024","bn":69},{"n":69,"s":"Antoni A and Antoni B areas are classically seen in which of the following laryngeal pathologies?","o":["Chondroma","Schwannoma","Recurrent respiratory papillomatosis","Systemic lupus erythematous","Squamous cell carcinoma"],"k":"B","x":"These are classic histology findings of schwannomas and are usually positive for S-100. PAGE 1028","bn":70},{"n":70,"s":"Sequela of radiation to the larynx can include:","o":["Erythematous, edematous mucosa","Altered mucous gland secretion","Decreased mucosal clearance of secretions","Decreased vibration of phonatory mucosa","All of the above"],"k":"E","x":"These answers are the classic postradiation changes to the larynx. PAGES 1024-1025","bn":71},{"n":71,"s":"Which is the incorrect choice regarding vocal fold nodules?","o":["They are bilateral.","They cause minimal disruption to the mucosal wave.","They require surgical excision.","They are fairly symmetric.","They resolve with voice rest/voice therapy."],"k":"C","x":"Nodules respond favorably to rest/therapy, are symmetric, disrupt mucosal wave minimally, and are always bilateral/ midmembranous. Surgery is rarely required. PAGE 1035","bn":72},{"n":72,"s":"Which statement is incorrect regarding microflap surgery of the vocal fold?","o":["Involves a surgical approach for submucosal benign pathology.","Involves complete removal of vocal fold mucosa for the treatment of dysphonia.","Surgical precision and patience are required.","Microinstrumentation with various angulations is involved.","Saline or epinephrine submucosal infusion can help with the microflap elevation."],"k":"B","x":"Option B refers to vocal fold stripping, a historical procedure involving complete removal of the vocal fold mucosa. Microflap surgery is a conservation resection of submucosal pathology, limiting dissection of normal lamina propria and preserving normal tissue. Patience and specialized microinstrumentation are required. Rarely to never does a microflap surgery needs to be staged. PAGES 1044-1045","bn":73},{"n":73,"s":"Which of the following statements is correct regarding keratosis of the vocal folds?","o":["Change in size and nature of keratosis should prompt surgical excision.","Erythroplakia is a worse prognosis than leukoplakia.","Leukoplakia is a worse prognosis than erythroplakia.","All keratotic lesions must be completely surgically removed at all times.","Observation is appropriate because this is solely a benign process."],"k":"A","x":"Any epithelial lesion with demonstrating changes in growth or characteristic may represent transformation to more aggressive disease, including carcinoma, and requires surgical excision. Leukoplakia has not been proven to have a worse or better prognosis than erythroplakia and vice versa. Keratotic lesion can be benign and observed in some settings. PAGE 1034","bn":74},{"n":74,"s":"Which of the following best describes a sulcus deformity of the vocal fold?","o":["Involves a predisposition for vocal fold cancer","A derangement of the vocal fold lamina propria","Related to problems with the neuromuscular status of the vocal fold","Is solely a congenital disorder","Always occurs bilaterally"],"k":"B","x":"Sulcus vocalis implies loss of lamina propria, leading to vocal fold mucosal defects that can significantly affect healthy vocal production depending on size and location. PAGE 1038","bn":75},{"n":75,"s":"Which of the following best describes vocal fold granuloma?","o":["Is often related to recent endotracheal intubation","Occurs at the vocal process of the arytenoid cartilage","Involves caseating nodules on histology","Can often be a recurrent problem","A, B,D"],"k":"E","x":"Caseating nodules on histology should lead the clinician to suspect a diagnosis other than granuloma. The most common location of vocal fold granulomas is near the vocal process, often related to intubation, and can be recurrent—particularly in cases with nonintubated etiology. PAGE 1040","bn":76},{"n":76,"s":"What is the most common etiology of unilateral vocal fold paralysis (UVFP)?","o":["Iatrogenic (surgical trauma)","Malignancy","Intubation related","Idiopathic/post-viral","Post-vaccination"],"k":"A","x":"Nearly 45% of UVFP is attributable to surgical trauma. Thyroid surgery is the most common procedure causing UVFP, comprising one-third of iatrogenic cases. Idiopathic is the second most common overall cause. (Rosenthal LHS, Benninger MS, Deeb RH. Vocal fold immobility: a longitudinal analysis of etiology over 20 years. Laryngoscope. 2007;117:1864-1870.) PAGES 1050-1051","bn":77},{"n":77,"s":"A 55-year-old male was noted to have a weak, breathy sounding voice since extubation on postoperative day 3 s/p repair of thoracic aortic aneurysm. Examination reveals a globally weak patient on 2-L O2 via nasal cannula, without increased work of breathing or stridor. Flexible laryngoscopy reveals intact laryngeal sensation, left vocal fold immobility in the paramedian position, and a glottic gap with phonation. Right vocal fold motion is fully intact. Speech pathology evaluation reveals concern for aspiration and recommended NPO. What is the next step in management?","o":["CT neck and chest with contrast","Awake vocal fold injection augmentation with temporary injectable under local anesthesia, preferably at bedside","Suspension microlaryngoscopy, vocal fold injection augmentation with temporary injectable under general anesthetic","Observation with outpatient follow-up","In-patient swallowing therapy"],"k":"B","x":"Vocal fold injection augmentation is associated with improved outcomes in patients with UVFP after cardiothoracic surgery. Especially in light of the concern for aspiration, injection augmentation should be considered to improve pulmonary clearance and decrease aspiration. Given the patient’s recent thoracic surgery, bedside injection augmentation is preferred over injection augmentation under general anesthetic. CT neck is not indicated in the setting of new UVFP after cardiothoracic surgery or other procedure putting the RLN at risk. Swallowing therapy in the setting of aspiration due to a known glottic gap is unlikely to be helpful until the glottal insufficiency is addressed. (Barnes JH, Orbelo DM, Armstrong MF, et al. Cardiothoracic patients with unilateral vocal fold paralysis: pneumonia rates following injection laryngoplasty. Ann Otol Rhinol Laryngol. 2020;129:1129-1134; Bhattacharyya N, Batirel H, Swanson SJ. Improved outcomes with early vocal fold medialization for vocal fold paralysis after thoracic surgery. Auris Nasus Larynx. 2003;30:71-75.) PAGES 1058-1059","bn":78},{"n":78,"s":"A 45-year-old female noted a weak, breathy sounding voice after she underwent total thyroidectomy for multinodular goiter. The case proceeded uneventfully without apparent nerve injury. At her 1-week postoperative visit, her incision is healing well without infectious concerns. Her flexible laryngoscopy demonstrates right vocal fold immobility, in the paramedian position, with supraglottic hyperfunction with phonation. She is concerned about her ability to go back to work as a high school teacher. What is the next best step in management?","o":["Laryngeal EMG","Observation","Right vocal fold injection augmentation with calcium hydroxyapatite","Right vocal fold injection augmentation with temporary injectable","Medialization Laryngoplasty with Silastic or Gore-Tex™"],"k":"D","x":"Vocal fold injection augmentation can be performed awake or under general anesthetic and improves voice and swallowing outcomes among patients with acute UVFP. While observation may be reasonable for certain patients, this patient’s ability to work may be significantly affected by her dysphonia. Therefore, the next best step in management is vocal fold injection augmentation. Injection augmentation with calcium hydroxyapatite is not indicated, given its long duration as this patient may have a high chance of vocal recovery. (Young VN, Smith LJ, Rosen C. Voice outcome following acute unilateral vocal fold paralysis. Ann Otol Rhinol Laryngol. 2013;122:197-204; Wang CC, Wu SH, Tu YK, et al. Hyaluronic acid injection laryngoplasty for unilateral vocal fold paralysis—a systematic review and meta-analysis. Cells. 2020;9.) PAGES 1058-1059","bn":79},{"n":79,"s":"What is the most common etiology of unilateral vocal fold paresis?","o":["Iatrogenic (surgical trauma)","Malignancy","Intubation related","Idiopathic/post-viral","Drug reaction"],"k":"D","x":"In all three case series documented, idiopathic or postviral is the most common etiology of vocal fold paresis (36%-68%). Iatrogenic causes (20%-39%) are the second most common. (Koufman JA, Postma GN, Cummins MM, et al. Vocal fold paresis. Otolaryngol Head Neck Surg. 2000;122:537-541; Stager SV. Vocal fold paresis: etiology, clinical diagnosis and clinical management. Curr Opin Otolaryngol Head Neck Surg. 2014;22:444-449; Heman-Ackah YD, Barr A. Mild vocal fold paresis: understanding clinical presentation and electromyographic findings. J Voice. 2006;20:269-281.) PAGE 1062","bn":80},{"n":80,"s":"An otherwise healthy 45-year-old female presents for outpatient consultation for 1 month of acute dysphonia following an upper respiratory infection. She has no prior head, neck, or chest surgeries. Flexible laryngoscopy reveals right vocal fold immobility, right vocal fold atrophy, and glottic gap on phonation. She is diagnosed with right UVFP. CT neck with contrast spanning from skull base to the aorta does not reveal any abnormalities. She asks about her vocal prognosis. She has an average amount of voice use in her professional and social life. What can you counsel her regarding her long-term recovery of vocal function (a near-normal voice >1 year from onset)?","o":["Her chance of recovery is greater than 95%.","Her chance of recovery is about 65%.","Her chance of recovery is about 15%.","Her chance of recovery is less than 5%.","Her chance of recovery is about 27%."],"k":"B","x":"This patient has idiopathic vocal fold paralysis. Roughly 69% of patients with idiopathic vocal fold paralysis recover vocal function. However, only about 20% regained vocal fold motion. The majority recover vocal function through presumed “natural” reinnervation, which can restore vocal fold muscle bulk and result in a medial position of the vocal fold. At 1 month out from onset of paralysis, the chance of vocal recovery is about 65%. (Husain S, Sadoughi B, Mor N, et al. Time course of recovery of idiopathic vocal fold paralysis. Laryngoscope. 2018; 128(1):148-152.) PAGE 1064","bn":81},{"n":81,"s":"Which of the following best describes the typical voice of an individual with Parkinson disease?","o":["Soft, breathy voice with decreased loudness","Monotone voice accompanied by tremor","Strained vocal quality with frequent voice breaks","High-pitched and rough voice","AandB"],"k":"E","x":"These are the classic voice presentation features of Parkinson disease. PAGE 1074","bn":82},{"n":82,"s":"Which of the following condition is typically considered to produce a hyperkinetic voice disorder?","o":["Parkinson disease","Spasmodic dysphonia/laryngeal dystonia","Multiple system atrophy","Stroke","Vocal fold nodules"],"k":"B","x":"Laryngeal dystonia/spasmodic dysphonia involves excessive vocal fold spasm associated with connected speech. PAGES 1076-1077","bn":83},{"n":83,"s":"Which of the following is false regarding botulinum toxin injection for abductor-type spasmodic dysphonia/laryngeal dystonia?","o":["The thyroarytenoid/lateral cricoarytenoid complex is the site of injection.","Bilateral injection may lead to bilateral vocal paralysis and breathing difficulties.","Unilateral injection may limit some side effects.","Incidental injection of toxin to the cricopharyngeal muscle can result in dysphagia.","The injection procedure is technically challenging."],"k":"A","x":"The target injection site is the posterior cricoarytenoid muscle. PAGE 1077","bn":84},{"n":84,"s":"Which of the following is not considered a treatment for essential tremor of the vocal tract?","o":["Botulinum toxin","Primidone","Propranolol","Pilocarpine","Voice therapy"],"k":"D","x":"Pilocarpine has no role in treating essential tremor of the vocal tract. PAGE 1078","bn":85},{"n":85,"s":"Unilateral SLN injury (paralysis or paresis) may result in all of the following, except:","o":["Inability to reach highest vocal register","Loss of laryngeal sensation","Loss of pharyngeal contraction","Pooling of secretions on the affected side"],"k":"C","x":"Options A, B, and D are classic findings associated with an SNL palsy. PAGES 1083-1084","bn":86},{"n":86,"s":"A treatment seeking 34-year-old woman presents with a diagnosis of vocal nodules. What should a voice specialized SLP do first?","o":["Start patient on Resonant Voice Therapy","Assess patient’s candidacy for voice therapy","Start patient on Phonation Resistant Training Exercises (PhoRTE)","Recommend patients to steam","Provide instruction about voice rest"],"k":"B","x":"Prior to suggesting voice therapy for a patient, an assessment of the likelihood of success with voice therapy should be performed. This involves a variety of “voice stimulability probes” that often simulates what is done in voice therapy. PAGES 1089-1090","bn":87},{"n":87,"s":"Which therapy progra
