predominant peripheral generator of the oVEMP is the ipsilateral utricular macula. The projections from the utricle are routed through the utricular branch of the superior vestibular nerve and terminate at its root entry zone at the junction of the pons and the medulla in the vestibular nuclei. The oVEMP efferent limb begins when the activity from the vestibular nuclei is routed ipsilaterally and contralaterally through the medial longitudinal fasciculus to the motor nuclei of cranial nerves III, TV, and VI and terminate on the extraocular muscles. PAGES 2691-2693","bn":23},{"n":24,"s":"The rotational chair test is best suited for describing the extent of what peripheral structures?","o":["Eyes","Saccules","Horizontal canals","Utricles"],"k":"C","x":"Rotary chair testing is capable of delivering rotational stimuli that can effectively evaluate the horizontal semicircular canals and horizontal VOR. Additional information gained is an evaluation of vestibular compensation mechanisms, disease progression, or therapeutic responses, as these can be efficiently monitored with rotational testing. Rotational testing can assess a wide response frequency and is the gold standard for describing suspected bilateral vestibular areflexia. PAGES 2687-2690","bn":24},{"n":25,"s":"Posturography is an evaluation of functional balance that incorporates the input from vison, somatosensory, and. systems.","o":["Vestibular","Gustatory","Olfactory","Hearing"],"k":"A","x":"Computerized dynamic posturography is utilized to evaluate a patient’s functional balance; it is not a diagnostic test. Balance performance is measured by subjecting a patient to six different conditions where a visual surround and platform are moved with the body (ie, sway referencing). The output for analysis provides information regarding the ability of the patient to utilize visual, vestibular, and somatosensory information for the maintenance of upright stance. PAGES 2695-2697","bn":25},{"n":26,"s":"Which of the following is a far-field monitoring technique used for intraoperative monitoring of the auditory system during vestibular schwannoma resections?","o":["ECochG","Continuous noninvasive arterial pressure monitoring","Auditory brainstem response (ABR)","Intraoperative facial nerve monitoring"],"k":"C","x":"Several studies have attempted to evaluate the prognostic value of intraoperative ABR although their significance is unclear, but certain intraoperative ABR patterns are associated with postoperative hearing outcomes. Persistence of wave V at the conclusion of the procedure has been associated with serviceable hearing. Similarly, complete elimination or irreversible and progressive loss of wave V indicates a high likelihood of postoperative hearing loss. PAGES 2705-2708","bn":26},{"n":27,"s":"Which of the following best monitors and/or best measures the integrity of cochlear blood supply?","o":["ECochG","Continuous noninvasive arterial pressure monitoring","Auditory brainstem response","Intraoperative facial nerve monitoring"],"k":"A","x":"Clinically, ECochG may be used to predict postoperative audition and is sensitive to changes in cochlear blood supply. PAGES 2709-2710","bn":27},{"n":28,"s":"Where is the most common site for a dehiscent facial nerve?","o":["Mental segment","Tympanic segment","Labyrinthine segment","Mastoid segment"],"k":"B","x":"Treat the facial nerve as if it is dehiscent until proven otherwise, especially in the tympanic segment. This is important in middle ear and stapes surgery. PAGES 2713-2714","bn":28},{"n":29,"s":"What is the only intraoperative electromyography (EMG) pattern that corresponds to deterioration of facial nerve function?","o":["Prolonged, audible activity in the EMG patterns","C train","A train","Burst activity"],"k":"C","x":"The A train has been shown to be the only intraoperative EMG pattern associated with deterioration of facial nerve function. PAGES 2714-2716","bn":29},{"n":30,"s":"Which of the following paralytic agents is acceptable during induction when intraoperative facial nerve monitoring is being utilized?","o":["Succinylcholine","Vecuronium","Gallamine","Atracurium"],"k":"A","x":"Succinylcholine is used for induction because of its short duration of effect with complete recovery from neuromuscular blockade within 15 minutes. Atracurium and vecuronium typically induce paralysis for up to 30 minutes. PAGE 2716","bn":30},{"n":31,"s":"Which of the following maneuvers may require reestablishment of an intraoperative baseline ABR prior to manipulation of the auditory system?","o":["Retraction of the cerebellum","Opening of the dura","Irrigation","Acoustic masking from drilling noise"],"k":"B","x":"Nontraumatic maneuvers such as opening of the dura alter the conduction patterns of the ABR appearing as changes on the monitor; in these situations, an intraoperative baseline may need to be reestablished prior to further manipulation of the auditory system. PAGE 2706","bn":31},{"n":32,"s":"Which of the following findings is most likely present in a patient with a cranial neuropathy secondary to malignant otitis externa?","o":["Dysphonia and dysphagia","Trapezius weakness","Facial weakness","Tongue deviation"],"k":"C","x":"The incidence of cranial nerve involvement with malignant otitis externa has been reported to be 7% to 46%. Due to its intratemporal course, the facial nerve is the most commonly affected cranial nerve in malignant otitis externa. PAGE 2730","bn":32},{"n":33,"s":"An otherwise healthy patient presents with several days of severe otalgia and facial asymmetry. Examination reveals facial paresis, crusted lesions of the concha, and unremarkable otoscopy. What is the next best step in management?","o":["Antibiotic and steroid otic drops","Electroneuronography (ENoG)","Systemic antivirals and steroids","Systemic and topical antibiotics"],"k":"C","x":"This patient likely has Ramsey-Hunt syndrome (also known as herpes zoster oticus), which is caused by varicella-zoster virus. The proper treatment for this condition is systemic antivirals and steroids. PAGES 2736-2737","bn":33},{"n":34,"s":"A preauricular sinus is most commonly located:","o":["Lateral, superior, and posterior to the parotid gland","Parallel to the external auditory canal (EAC) as a “duplication”","At the mandibular angle","Tracking deep to the facial nerve"],"k":"A","x":"The preauricular sinus is typically found lateral, superior, and posterior to the parotid gland and the facial nerve, into which they can rarely extend. PAGES 2745-2746","bn":34},{"n":35,"s":"Which of the following imaging modalities is most likely to remain positive, that is, with hyperintense signal, long after resolution of malignant otitis externa?","o":["Fludeoxyglucose-positron emission tomography","Technetium-99m","Gallium-67","Indium-111"],"k":"B","x":"Technetium-99m is a cheap, easily available imaging modality, which is helpful for early detection of osteomyelitis. However, it cannot be used to follow-up malignant otitis externa because the scan remains positive long after disease resolution. PAGES 2731-2733","bn":35},{"n":36,"s":"Which agent(s) can safely be used for otorrhea in the setting of a tympanic membrane perforation or a tympanostomy tube?","o":["Acetic acid","Alcohol","Aminoglycosides","Fluoroquinolones"],"k":"D","x":"Fluoroquinolones have been shown to be safe to otologic applications in the setting of a tympanic membrane perforation or in the presence of a tympanostomy tube. PAGE 2729","bn":36},{"n":37,"s":"Muscular contractions of the levator veli palatini and tensor veli palatini muscles during swallowing usually result in which of the following?","o":["Opening of the eustachian tube","Closing of the eustachian tube","Tympanic membrane retraction","Middle ear effusion"],"k":"A","x":"Activation of the levator veli palatini muscle elevates the soft palate causing the torus tubarius to rotate medially. This acts as a scaffold upon which the tensor veli palatini muscle contraction then opens the eustachian tube valve. PAGE 2753","bn":37},{"n":38,"s":"A patient who reports hearing their own voice and breathing abnormally loudly especially during exercising may suffer from:","o":["Baro-challenge-induced eustachian tube dysfunction","Obstructive eustachian tube dysfunction","Patulous eustachian tube dysfunction","Cholesteatoma"],"k":"C","x":"Autophony of voice and breathing along with symptoms of aural fullness are a usual finding in patients with patulous eustachian tube dysfunction. Symptoms can often be induced by physical activity, dehydration, and prolonging talking, among others. PAGES 2755-2757","bn":38},{"n":39,"s":"Which of the following should be considered in an adult patient who presents with new-onset, persistent unilateral middle ear effusion?","o":["Nasopharyngeal carcinoma","Deviated nasal septum","Adenoid hypertrophy","Samter triad"],"k":"A","x":"An anatomical obstruction from a neoplasm is uncommon but needs to be taken into consideration as a potential cause for persistent unilateral obstruction of the eustachian tube resulting in middle ear effusion. Other more common causes would be more likely to cause bilateral obstruction. PAGES 2757-2758","bn":39},{"n":40,"s":"What is the usual location of pathology in obstructive eustachian tube dysfunction and therefore the site to target treatment with balloon dilation?","o":["Nasopharyngeal orifice of the eustachian tube","Bony eustachian tube","The eustachian tube isthmus","Cartilaginous eustachian tube"],"k":"D","x":"The most common cause for obstructive eustachian tube dysfunction is mucosal inflammation within the cartilaginous portion, which is the location of the functional valve. Much less commonly, obstructive pathology can occur within the bony portion. Dilation is not recommended within the bony portion as it is in close proximity with the internal carotid artery. PAGES 2758-2761","bn":40},{"n":41,"s":"A patient reports severe pain in both ears during flights, particularly on descent. Fullness and hearing loss in the ears sometimes persist for several days before slowly improving. On a visit to a general practitioner a week after flying, the ears were found to be normal on otoscopy. What could be the most likely cause for the pain in the ears?","o":["Obstruction of the bony eustachian tube","Superior semicircular canal dehiscence","Baro-challenge-induced obstructive eustachian tube dysfunction","Adenoid hypertrophy"],"k":"C","x":"Patients with eustachian tube dysfunction that occurs only during baro-challenge usually have normal findings on otoscopy, once the ear has recovered from any barotrauma that may have occurred. Endoscopic evaluation can reveal a lesser degree of pathology in the eustachian tube lumen than in patients with chronic obstructive dysfunction associated with negative middle ear pressure. A consistent history of baro-challenge is important in diagnosing the condition. PAGES 2757-2758","bn":41},{"n":42,"s":"Which of the following is the most common complication of otitis media?","o":["Petrositis","Labyrinthitis","Facial paralysis","Mastoiditis"],"k":"D","x":"Mastoiditis is the most common complication of otitis media given the continuity between the middle ear cavity and the mastoid air spaces. During an episode of otitis media, the mucosa lining the middle ear and the mastoid can become inflamed. When inflammation persists, purulent material can accumulate within the mastoid cavities and destroy the thin bony septae between air cells. In 58% of the cases, dissection through the lateral cortex of the mastoid results in a subperiosteal abscess posterior to the pinna. PAGES 2773-2775","bn":42},{"n":43,"s":"Since 2000, how has the microbiology of otitis media changed?","o":["There has been a reduction of pneumococcal otitis media cases.","There has been no change in the incidence of pneumococcal otitis media cases.","There has been an increase of pneumococcal otitis media cases.","There has been a reduction of Haemophilus influenzae otitis media cases."],"k":"A","x":"Since the introduction of PCV7 (2000) and PCV13 (2010), the number of pneumococcal otitis media cases have decreased. Notably, the prevalence of nonvaccine type Streptococcus pneumoniae otitis media has remained the same, and the effects of these vaccines on all causes of otitis media remains unclear. PAGES 2770-2772","bn":43},{"n":44,"s":"Which of the following is not an important clinical sign of an impending intratemporal or intracranial complication of otitis media?","o":["Persistent otalgia after 2 weeks of antibiotics","Opacification of the mastoid air cells","Foul-smelling discharge after a round of treatment","Peripheral vertigo"],"k":"B","x":"Opacification of the mastoid air cells is a nonspecific radiographic finding. In the absence of clinical findings, mastoid effusion does not suggest an impeding otitis media complication. PAGES 2772-2773","bn":44},{"n":45,"s":"For patients with a history of recurrent otitis media (last episode within 6 months) or recent antibiotic therapy, what is the suggested empiric parenteral antibiotic regimen?","o":["Vancomycin","Unasyn and Zosyn","Vancomycin and ceftazidime","Unasyn and ceftazidime"],"k":"C","x":"For patients with a history of recurrent otitis media or recent antibiotic therapy and no penicillin allergy, the recommended empiric antibiotic regimen vancomycin or linezolid plus ceftazidime or cefepime or piperacillin-tazobactam. Patients without a history of recurrent otitis media or recent antibiotic therapy can be treated with one agent: vancomycin or linezolid. In general, patients are treated with intravenous antibiotics for 7 to 10 days and then transitioned to oral antibiotics to complete a 4-week course. Treatment duration, however, can vary depending on the severity of the infection with extended courses for patients with intracranial complications. PAGES 2777-2778","bn":45},{"n":46,"s":"What key sign of petrositis may not be volunteered by a patient and should be specifically solicited during patient history taking and physical examination?","o":["Retro-orbital pain","Headache","Ear pain","Hearing loss"],"k":"A","x":"Petrous apicitis typically presents with deep, retro-orbital pain in the setting of COM. Gradenigo syndrome is a triad of symptoms seen with petrous apicitis and consists of retro-orbital pain, otorrhea, and abducens palsy. Other manifestations can include facial paralysis, and sensory hearing loss and vertigo due to labyrinthitis. PAGE 2775","bn":46},{"n":47,"s":"Prophylactic antibiotics, in the setting of posttraumatic cerebrospinal fluid (CSF) leak, have been associated with decreased rates of meningitis:","o":["As evidenced by well-controlled prospective studies.","Only in the presence of concomitant infection.","Never. The literature does not support this claim."],"k":"B","x":"The incidence of meningitis in patients with posttraumatic CSF leak is low, and prophylactic antibiotic therapy has not been shown to decrease the incidence of meningitis in these patients. Therefore, prophylactic antibiotic is only indicated in the setting of concomitant infection. PAGES 2794-2795","bn":47},{"n":48,"s":"Which of the following patients require emergent facial nerve exploration?","o":["Immediate, complete facial paralysis","Progressive, complete facial paralysis","Penetrating facial wound with immediate, complete facial paralysis","All of the above"],"k":"C","x":"Patients with delayed-onset or incomplete facial paralysis merits steroid administration and observation given the high recovery rates. Patients with immediate onset complete facial paralysis require assessment of nerve excitability. If the nerve can be stimulated, then observation is indicated. If the nerve cannot be stimulated, as is likely with a penetrating facial wound, then surgical exploration is indicated. PAGES 2790-2793","bn":48},{"n":49,"s":"What is the ideal timing for facial nerve ENoG after posttraumatic facial nerve paralysis?","o":["Within 12 hours","12 to 48 hours","4 to 7 days","Greater than 7 days"],"k":"C","x":"Since Wallerian degeneration occurs over approximately 3 to 5 days, the distal segment of the nerve may be able to be stimulated electrically for 3 to 5 days after injury. Therefore, ENOoG is most useful when performed at 4 to 7 days after nerve injury. PAGES 2787-2790","bn":49},{"n":50,"s":"For patients with posttraumatic delayed-onset, complete facial paralysis, what percentage of patients have a full recovery?","o":["Less than 50%","Less than 75%, greater than 50%","Greater than 75%, less than 90%","Greater than 90%"],"k":"D","x":"The prognosis for patients with delayed-onset, complete facial paralysis is excellent, with spontaneous full recovery rate of over 90%. PAGES 2787-2790","bn":50},{"n":51,"s":"In otic capsule-sparing fractures with immediate, complete paralysis, hearing preservation, well-aerated mastoid air cell systems or with ossicular discontinuity, which surgical approach would be recommended for facial nerve decompression?","o":["Transmastoid/supralabyrinthine approach","Transmastoid/middle cranial fossa","A middle cranial fossa approach"],"k":"A","x":"In patients with an otic capsule—sparing factures with facial paralysis and ossicular chain discontinuity or with well-aerated mastoid, the transmastoid/supralabyrinthine approach is a good option for facial nerve repair. This approach may require dislocation of the incus and ossicular reconstruction at the completion of the operation in order to expose the course of the facial nerve. PAGES 2790-2793","bn":51},{"n":52,"s":"A 5-year-old male patient is referred for evaluation of left-sided hearing loss identified by a school screening examination. His parents deny a history of otalgia or otorrhea. On physical examination, a white mass is most likely to be seen in which area of the middle ear?","o":["Posterior-superior quadrant","Anterior-superior quadrant","Posterior-inferior quadrant","Anterior-inferior quadrant"],"k":"B","x":"Congenital cholesteatomas occur in the absence of a retraction pocket in patients without a history of otorrhea or prior otologic surgery. The average age at presentation is 4.5 years, and there is a male-to-female preponderance of 3:1. The most common location of congenital cholesteatoma is in the anterior-superior quadrant. PAGES 2801-2802","bn":52},{"n":53,"s":"A 38-year-old female patient presents with 1 year of progressive right-sided hearing loss and intermittent foul-smelling otorrhea despite several courses of ototopical antibiotics. She describes a remote history of a traumatic perforation secondary to a hairpin and for which she did not pursue long-term follow-up. What is the most likely classification of her current diagnosis?","o":["Congenital cholesteatoma","Primary acquired cholesteatoma","Secondary acquired cholesteatoma","Chronic otitis externa"],"k":"C","x":"Acquired cholesteatomas are categorized as either primary or secondary. Primary acquired cholesteatomas arising from retraction pockets are theorized to occur from invagination, basal cell hyperplasia, otitis media with effusion, or epithelial invasion. Secondary acquired cholesteatomas are thought to arise secondary to iatrogenic implantation of skin in the middle ear as a result of surgery, ventilation tube placement, or trauma or from epithelial invasion along the rim of a marginal perforation. Congenital cholesteatomas present in childhood and are not usually associated with otorrhea. (Chapter 151, Section “Acquired Cholesteatoma”) PAGES 2802-2804","bn":53},{"n":54,"s":"A 59-year-old male referred for a tympanoplasty for a middle ear cholesteatoma presents for his preoperative audiogram and surgical discussion. During tympanometry, he becomes acutely dizzy. What is the most appropriate next step in surgical planning and counseling?","o":["Proceed with transcanal endoscopic ear surgery without any further workup.","Obtain a computed tomography (CT) temporal bone scan and plan for transcanal endoscopic ear surgery.","Obtain a CT temporal bone scan and plan for canal wall up (CWU) or canal wall down (CWD) mastoidectomy and tympanoplasty.","Abort surgery."],"k":"C","x":"Pressure-induced vertigo and nystagmus represents a positive fistula response indicating likely inner ear erosion by the cholesteatoma. A preoperative CT can assist in identification of the site of the fistula. The most likely site of a labyrinthine fistula is the horizontal semicircular canal. The limit of transcanal endoscopic ear surgery is the horizontal semicircular canal, and it would therefore not be an appropriate choice in this patient. Based on intraoperative findings, a CWU or CWD mastoidectomy can be performed. PAGES 2808-2809","bn":54},{"n":55,"s":"A 21-year-old Olympic swimmer presents with progressive right-sided hearing loss and persistent otorrhea despite one previous tympanoplasty and a revision tympanoplasty and mastoidectomy 2 years prior. He is found by audiogram to have a severe to profound sensorineural hearing loss and by CT to have extensive bony erosion of his posterior EAC. Which of the following would be the most appropriate surgical management?","o":["Revision tympanoplasty","Revision CWU mastoidectomy and tympanoplasty","CWD mastoidectomy","Subtotal petrosectomy"],"k":"D","x":"Subtotal petrosectomy allows for effective removal of cholesteatoma, diseased temporal bone air cells, and separation of the middle ear from the external environment by an EAC blind sac closure and plugging of the eustachian tube. It avoids the cavity cleanings that a CWD would require and allows patients to participate in water activities. A CWU procedure would not be appropriate in a patient with extensive posterior bony EAC erosion. PAGES 2809-2811","bn":55},{"n":56,"s":"A 62-year-old healthy female patient with a right cholesteatoma is recently diagnosed with a right Bell palsy by her primary care physician (PCP), who requests management advice. Which of the following is the most appropriate advice to provide to her PCP?","o":["Bell palsy is not an appropriate diagnosis. Imaging should be obtained, and the patient should be evaluated for surgery.","Bell palsy is a known complication of cholesteatoma, and steroid management should be initiated.","Facial paral: unrelated to her cholesteatoma, and a magnetic resonance imaging (MRI) should be ordered to investigate other causes.","Bell palsy is most likely due to malignant otitis externa. She should be admitted for intravenous antibiotics."],"k":"A","x":"Facial paralysis in patients with cholesteatoma can develop acutely due to infection or slowly due to chronic expansion. Surgery is indicated in either scenario. CT imaging can be helpful to identify the site of the lesion. In a patient with a history of or a known cholesteatoma, facial paralysis should not be considered idiopathic. (Chapter 151, Section “Complications—Facial Paralysis”) PAGES 2811-2814","bn":56},{"n":57,"s":"A patient with a history of chronic ear disease presents with several weeks of hearing loss, aural drainage and headache with a new onset of inability to abduct the ipsilateral eye. Prior workup for his chronic ear disease indicated normal bone lines bilaterally, with a CT demonstrating poor development of the mastoid bone and a high-riding jugular bulb. Appropriate surgical management could be:","o":["Transotic","Transmastoid","Infracochlear","Transnasal"],"k":"D","x":"This presentation is consistent with Gradenigo triad, typically due to infectious involvement of the petrous apex. While antibiotics are important, surgical drainage of the area is often required. The transotic approach would unnecessarily sacrifice his hearing, and the transmastoid approach would not be favored given its poor development and consequent-reduced visualization and increased risk to the facial nerve. The infracochlear approach is not appropriate where a high-riding jugular bulb minimizes access to the petrous apex. Depending on the anatomy of the paranasal sinuses, the petrous apex, and the carotid arteries, the endoscopic transnasal approach may form an advantageous route to the petrous apex. PAGE 2831","bn":57},{"n":58,"s":"A patient with an attic cholesteatoma is consented for an endoscopic atticotomy and tympanoplasty with ossicular chain reconstruction. What finding would most likely drive the surgeon toward adapting the surgical plan to include performing a mastoidectomy using the microscope?","o":["Cholesteatoma extending into the aditus ad antrum","Cholesteatoma enveloping the incudostapedial joint","Cholesteatoma in the anterior epitympanum","Prominent anterior canal wall"],"k":"A","x":"Cholesteatoma extending into the aditus ad antrum is difficult to remove endoscopically and is a good indication for performing a mastoidectomy under the microscope. A mastoidectomy may improve access to the incudostapedial joint via a facial recess approach and allow access to the anterior epitympanum via a posterior atticotomy approach, but these areas can often be accessed endoscopically as well. Visualization of the anterior sulcus may not be critical for treating an attic cholesteatoma and could also be achieved endoscopically. Given the occasional need for mastoidectomy in patients with advanced disease undergoing endoscopic tympanoplasty, it is advisable to consent them for this eventuality. PAGES 2822-2825","bn":58},{"n":59,"s":"A surgeon performing a mastoidectomy observes exposure of the nerve sheath while performing a facial recess approach to place a cochlear implant. The surgeon was using copious irrigation and a diamond bur while opening the recess. Appropriate management would be:","o":["Decompression of the facial nerve 5 mm above and below the exposed tissue","Removing the incus and incus buttress to allow the facial nerve to be stimulated in the tympanic segment","Electrically stimulate the exposed segment to ensure nerve viability","Continue with surgery and carefully observe for facial nerve weakness postoperatively"],"k":"D","x":"Exposure of the facial nerve sheath, while undesirable, is not uncommon when performing a facial recess approach. Decompression of the nerve would not be required without mechanical trauma, which is unlikely with an intact nerve sheath, or thermal damage, which is unlikely when using copious irrigation and keeping the rotating bur shaft away from the nerve. Stimulation of the nerve intraoperatively might be reassuring but is not required. However, removing the incus and incus buttress will not necessarily afford access to an exposed area of nerve in its tympanic segment, and stimulating at the site of exposure itself risks a falsely reassuring result from activation of fibers distal to the suspected site of injury. PAGES 2832-2833","bn":59},{"n":60,"s":"Which is a reliable anatomic relationship during mastoid surgery?","o":["The sigmoid sinus lies under a thin layer of air cells.","MacEwen triangle sits posterior to the spine of Henle.","The tegmen mastoideum forms a flat plane over the mastoid cavity.","The facial nerve is medial to the lateral (horizontal) semicircular canal."],"k":"B","x":"The position of MacEwen triangle is reliably found posterior to the spine of Henle at the posterosuperior limit of the bony EAC. The triangle can be used as an approximate indicator of the antrum directly medially. However, the dimensions of the spine of Henle vary and in some people are relatively indistinct. The sigmoid sinus can lie directly under the cortical bone of the skull, and the lateral portion of the tegmen mastoideum can lie lower than the medial part. The facial nerve is medial to the lateral extent of the otic capsule at the second genu but travels laterally as it moves inferiorly. PAGES 2819-2820","bn":60},{"n":61,"s":"Ongoing drainage after performing a radical mastoidectomy may be related to:","o":["Oversized meatoplasty","Oversized facial recess","Oversized facial ridge","Oversized eustachian tube"],"k":"C","x":"To improve healing and reduce postoperative drainage, CWD procedures must have a well-ventilated cavity. A facial ridge that is not sufficiently lowered isolates the mastoid cavity and reduces ventilation, whereas a large meatoplasty does the opposite. A radical mastoidectomy removes the incus buttress, eliminating the facial recess, and plugs the eustachian tube. PAGE 2826","bn":61},{"n":62,"s":"Which complication would be expected to occur more often with overlay as compared to underlay tympanoplasty techniques?","o":["Blunted malleus fixation to the anterior canal wall by scar tissue","Graft failure due to medial displacement","Excessive postoperative middle ear adhesions","Postoperative middle ear effusion"],"k":"A","x":"Blunting of the anterior ear canal is a common complication with overlay tympanoplasty. This is caused by dense scarring of the anterior tympanic membrane that results in reduction of the functional surface area of the drumhead and “pseudo-malleus” fixation caused by adhesion between the manubrium and the anterior canal wall. PAGES 2846-2848","bn":62},{"n":63,"s":"Which of the following is a potential inherent shortcoming of ossiculoplasty with a sculpted incus interposition graft?","o":["High risk of graft extrusion","Challenging revision surgery due to fixed integration with stapes head","Established track record of poor hearing outcomes in the medical literature","Inability to engage the malleus as part of ossicular reconstruction"],"k":"B","x":"The incus interposition graft is a useful technique for iculoplasty. The disadvantages of this technique are: (1) there is a low possibility of continued necrosis, (2) the incus may not be available in all cases, and (3) autologous ossicular grafts tend to fuse strongly to engage native ossicles, making revision surgery more challenging. PAGES 2849-2852","bn":63},{"n":64,"s":"Which factor is cited most frequently as impactful with respect to ossiculoplasty outcomes?","o":["Presence of the malleus","Presence of the stapes superstructure","Past history of cholesteatoma","Age of the patient"],"k":"A","x":"The malleus is very useful for ossiculoplasty. The malleus neck offers a consistent landmark for prosthesis placement. Typically, better hearing results can be expected if the partial ossicular chain reconstruction prosthesis is in contact with the malleus instead of being in contact directly with the tympanic membrane. This also helps to prevent prosthesis extrusion. PAGES 2849-2852","bn":64},{"n":65,"s":"A prominent low-tone air-bone gap should raise suspicion for which of the following situations?","o":["Stapes footplate fixation","Lateral ossicular chain (malleus and/or incus) head fixation","Incus erosion","Incus and stapes superstructure erosion"],"k":"B","x":"A low-tone air-bone gap typically indicates lateral ossicular chain fixation (malleus and/or incus), whereas stapes fixation typically affects mid and high frequencies. PAGES 2839-2841","bn":65},{"n":66,"s":"Which of the following is a shortcoming associated with cartilage graft tympanoplasty?","o":["Always results in poor hearing outcomes compared with fascia grafting due to thickness and rigidity.","Opaqueness may complicate postoperative otoscopic surveillance.","Not suitable for use with hostile middle ear environment.","Cannot be utilized for total tympanic membrane repair."],"k":"B","x":"Cartilage graft tympanoplasty is a useful technique for repairing tympanic membrane perforation, and it has a high success rate with excellent hearing outcomes. Its main shortcoming is the fact that the opaqueness of the tympanic membrane which results may complicate postoperative otoscopic surveillance. PAGES 2844-2845","bn":66},{"n":67,"s":"During a routine stapedectomy, the facial nerve is found to completely cover the stapes footplate. What is the best option in this setting?","o":["Decompress the facial nerve and perform a stapedotomy.","Decompress the facial nerve and perform a stapedectomy.","Amplification with a hearing aid.","Stapedotomy between the facial nerve and the round window."],"k":"C","x":"The tympanic segment of the facial nerve can sometimes be dehiscent and loop inferiorly to cover the oval window. In this e, it is best to abort the case and advise the patient to undergoing hearing aid evaluation. PAGES 2867-2873","bn":67},{"n":68,"s":"During a revision stapedectomy, the previously placed piston prosthesis is noted to be displaced out of the stapedotomy and the lenticular process is absent, but a majority of the incus long process is still present. What is the best way to proceed?","o":["Use a notched bucket handle prosthesis between the incus long process and the stapedotomy.","Use a total ossicular chain reconstruction prosthesis prosthesis between the stapes footplate and the malleus.","Use a partial ossicular chain reconstruction prosthesis prosthesis between the stapes footplate and the incus.","Place a piston on the malleus neck down to the stapes footplate."],"k":"A","x":"While all of the options are possible, a notched bucket handle prosthesis placement between the incus long process and stapedotomy is likely to give the best hearing outcomes. PAGES 2867-2873","bn":68},{"n":69,"s":"Which of the following agents has a potential role in the etiology of otosclerosis?","o":["Influenza virus","Measles virus","Mumps virus","Parainfluenza virus"],"k":"B","x":"Measles antigens and RNA, as well as nucleocapsid, have all been identified in otosclerotic lesions. PAGE 2859","bn":69},{"n":70,"s":"A patient presents with a conductive hearing loss with intact acoustic reflexes. A stapedectomy is performed with no improvement in hearing. What is the most likely cause of this poor result?","o":["Prosthesis displacement.","Prosthesis is too short.","Undiagnosed lateral chain fixation.","Inner ear third window."],"k":"D","x":"In this patient’s case, the conductive hearing loss is likely not caused by otosclerosis but rather by an inner ear third window such as superior canal dehiscence. This is why it is critical to obtain acoustic reflex testing in patients suspected to have otosclerosis. PAGE 2861","bn":70},{"n":71,"s":"A patient presents with a conductive hearing loss and negative Rinne tuning fork test. They also report episodic vertigo, low-pitched tinnitus, and ear fullness. What is the best management option for their hearing loss?","o":["Stapedotomy","Amplification with a hearing aid","Partial stapedectomy","Stapes mobilization"],"k":"B","x":"This patient likely has superior canal dehiscence. Therefore, hearing amplification is recommended instead of any stapes procedures. PAGES 2860-2861","bn":71},{"n":72,"s":"A child who presents with acute facial palsy, facial edema, fissured tongue likely has:","o":["Bell palsy","Ramsay Hunt syndrome","Melkersson-Rosenthal syndrome","Lyme disease"],"k":"C","x":"Acute facial palsy, facial edema, and fissured tongue are features of Melkersson-Rosenthal syndrome. PAGE 2880","bn":72},{"n":73,"s":"In neuropraxia, one expects the nerve to:","o":["Undergo Wallerian degeneration distal to the site of lesion","Recover to normal function","Have abnormal ENoG findings","Have abnormal nerve excitability test (NET) results"],"k":"B","x":"In neuropraxia, the nerve is viable and is expected to recover normal function when nerve blockade is removed. PAGES 2882-2884","bn":73},{"n":74,"s":"All of the following electrophysiologic tests are most helpful in the setting of acute facial paralysis (<2 weeks complete facial paralysis) except:","o":["NET","Maximal stimulation test","ENoG","EMG"],"k":"D","x":"NET, maximal stimulation test, and ENoG are all useful for assessing acute facial nerve paralysis. EMG cannot definitively differentiate between a neuropraxic nerve from a completely degenerated one in the acute phase. Therefore, it is not as useful. PAGES 2882-2884","bn":74},{"n":75,"s":"What is the most common cause of acute facial paralysis?","o":["Bell palsy","Facial nerve schwannoma","Lyme disease","Otitis media"],"k":"A","x":"Bell palsy is the most common cause of acute facial paralysis. PAGES 2884-2886","bn":75},{"n":76,"s":"Which virus has been implicated in Bell palsy?","o":["Streptococcus pneumoniae","Haemophilus influenzae","Herpes simplex virus (HSV)","Borrelia burgdorferi"],"k":"C","x":"HSV DNA has been isolated from geniculate ganglion, as well as from endoneurial fluid and muscle from patients undergoing facial nerve decompression surgery for Bell palsy. PAGES 2884-2886","bn":76},{"n":77,"s":"A 65-year-old male presents with new-onset episodic vertigo lasting 30 minutes to 2 hours with concomitant hearing fluctuations. He does not have hearing loss today. His examination is grossly normal, and an audiogram demonstrates bilateral symmetric high-frequency sensorineural hearing loss. A contrast-enhanced MRI of the brain demonstrates enhancement of cranial nerves VII and VIII, as well as multifocal leptomeningeal enhancement. On further history, he endorses having had a painless genital ulcer many years ago that self-resolved. What serological test would you order to help establish your diagnosis?","o":["ELISA test for antibodies against Borrelia burgdorferi","Fluorescent treponemal antibody absorption (FTA-ABS) test","PCR testing for HSV","Nucleic acid amplification test for Chlamydia"],"k":"B","x":"This patient likely has syphilis. The proper serological test to order is the FTA-ABS test. Another test to be considered is the microhemagglutination test. PAGES 2895-2897","bn":77},{"n":78,"s":"Which congenital viral etiology of sensorineural hearing loss is potentially preventable with prompt recognition and intervention?","o":["Cytomegalovirus","HSV","Varicella-zoster virus","Influenza virus"],"k":"A","x":"In symptomatic cytomegalovirus in neonates, treatment with parenteral ganciclovir has been shown to decrease hearing loss. PAGE 2897","bn":78},{"n":79,"s":"A patient presents to your office with left conductive hearing loss and left facial paralysis. Temporal bone CT showed opacification of the left middle ear and mastoid. Blood work showed elevated angiotensin converting enzyme level and hypercalcemia. What is the pathology likely to show from middle ear and mastoid specimens?","o":["Poorly differentiated keratinocytes","Nests of small basal cells with high nuclear to cytoplasmic ratio","Granuloma","Meningothelial nests of cells resembling arachnoid cap cells"],"k":"C","x":"This patient likely has sarcoidosis. Therefore, granuloma is expected to be observed on middle ear and mastoid specimens. PAGES 2898-2899","bn":79},{"n":80,"s":"Which studies are diagnostic of autoimmune inner ear disease?","o":["Erythrocyte sedimentation rate","Anti-Sjégren syndrome associated antigen A/B antibodies","Anti-heat shock protein 70 antibody","None of the above"],"k":"D","x":"Autoimmune inner ear disease is a clinical diagnosis. None of these tests are diagnostic. Routine serologic tests should be ordered in patients who may have suspected autoimmune inner ear disease in order to rule out other causes of otologic dysfunction. These include a complete blood count with differential white count, erythrocyte sedimentation rate, C-reactive protein, thyroid function studies, rheumatoid factor, antinuclear antibody test, anti-double-stranded DNA antibodies, anti-Sjégren syndrome associated antigen A/ B antibodies, antiphospholipid antibodies, and C3 and C4 complement levels. An FTA-ABS test (or a Treponema pallidum hemagglutination test) must be obtained to rule out otosyphilis. An MRI with paramagnetic enhancement must be obtained to rule out the retrocochlear lesions discussed earlier in this chapter. An HIV test may be considered to rule out AIDS-associated hearing loss. In endemic regions, a Lyme antibody test may be considered. PAGES 2901-2902","bn":80},{"n":81,"s":"Which disease of bone is associated with conductive hearing loss resultant of impact on the stapes?","o":["Paget disease","Osteoporosis","Ankylosing spondylitis","Osteopetrosis"],"k":"A","x":"Paget disease patients can develop stapes footplate fixation with or without fracture. Another bone condition which can affect the stapes is osteogenesis imperfect, where bone demineralization with fracture of the stapes crura can be seen. PAGES 2903-2904","bn":81},{"n":82,"s":"Which test is required to be used in a hearing conservation program?","o":["Pure tone audiometry","Distortion product OAE","Speech-in-noise","Auditory brainstem response"],"k":"A","x":"Hearing conservation programs required under 29 Code of Federal Regulations 1910.95 must include pure tone audiometric testing at 0.5, 1, 2, 3, 4, and 6 kHz. Testing at 8 kHz is recommended by National Institute for Occupational Health and Safety but is not required as part of Occupational Safety and Health Administration-mandated audiometric monitoring. PAGE 2922","bn":82},{"n":83,"s":"What is the typical audiometric configuration for an individual with early noise-induced hearing loss (NIHL)?","o":["Flat","Sloping","Notched","Reverse sloping"],"k":"C","x":"Pure tone audiometric testing will often reveal a “notched” configuration with the maximum hearing loss at 3, 4, or 6 kHz in individuals with a significant history of noise exposure. However, notched audiometric configurations can be observed in the absence of significant noise exposure. The gold standard for diagnosis of NIHL includes both significant history of noise exposure reported during case history and a notched audiometric configuration. In later years, the notch is often lost as ARHL accrues at higher frequencies. PAGE 2922","bn":83},{"n":84,"s":"Significant interactions between noise exposure and prescribed medication have been shown even after medication use is ceased for which of the following prescription medications?","o":["Aspirin","Cisplatin","Tylenol","Ibuprofen"],"k":"B","x":"Interactions between cisplatin and noise exposure have been shown, including data that suggest vulnerability to noise injury remains increased even after cisplatin dosing ends. The long-term interaction may be related to the long-term accumulation of cisplatin in the cochlea, which appears to be relatively unique to the cochlea. PAGES 2916-2917","bn":84},{"n":85,"s":"Which test has been recommended for use in hearing conservation programs because it reveals early evidence of injury to outer hair cells and may have some utility in identifying individuals who are at increased risk for significant threshold shift?","o":["Pure tone audiometry","Distortion product OAE","Speech-in-noise","Auditory brainstem response"],"k":"B","x":"Distortion product OAEs provide a sensitive measure of outer hair cell function and have been recommended for inclusion in audiometric monitoring programs to provide an earlier warning of cochlear injury; that is, before overt threshold shift has developed. In addition to providing earlier identification of cochlear damage, there are some data that suggest workers with decreased distortion-product otoacoustic emission amplitude are at increased risk for NIHL, presumably because there is existing outer hair cell damage and additional damage occurring during subsequent noise exposure results in Significant Threshold Shift when remaining hair cells are damaged by this exposure to loud sound. PAGES 2917-2918","bn":85},{"n":86,"s":"Electronic hearing protection products, which deliver quiet sounds at audible levels but attenuate high-level sounds to 85 dBA or less, are particularly recommended for which of the following groups?","o":["Hunters","Musicians","Factory workers","Forestry workers"],"k":"A","x":"Hunters often forego hearing protection devices (HPD) use because they do not perceive their hearing to be at risk from a small number of firearm discharges, and because they cannot hear environmental sounds, including the noise they are generating themselves which could alert and scare away the species they are pursuing. Electronic HPD deliver environmental sounds behind the HPD at safe levels, and many electronic HPD have a volume setting that allows quiet sounds to be amplified for the HPD user. When a firearm is discharged, the HPD attenuate the high-level sound. Firearm discharge is one of the most hazardous nonoccupational exposures. PAGES 2920-2922","bn":86},{"n":87,"s":"Mutation of which gene increases the risks of aminoglycoside ototoxicity?","o":["28S rRNA","18S rRNA","12S rRNA","16S rRNA"],"k":"C","x":"The A1555G mutation in the mitochondrial 12S rRNA results in significantly increased susceptibility of aminoglycosides. PAGE 2939","bn":87},{"n":88,"s":"Which of the following medications have been reported to cause ototoxicity?","o":["Streptomycin","Cisplatin","Furosemide","All of the above"],"k":"D","x":"Aminoglycosides, platinum compounds, vinca alkaloids, loop diuretics, macrolides, and salicylates have been reported to cause ototoxicity. PAGES 2936-2938","bn":88},{"n":89,"s":"According to the consensus statement from American Academy of Otolaryngology-Head & Neck Surgery in 2004, which of the following is recommended when prescribing a potentially ototoxic antibiotic drops to patients with a tympanic membrane perforation?","o":["The patient should be warned of the risks of ototoxicity.","The potentially ototoxic eardrops should only be used in infected ears.","The patient should be instructed to call if they develop dizziness, vertigo, hearing loss, and tinnitus.","All of the above."],"k":"D","x":"All of these considerations should be given when prescribing potentially ototoxic antibiotic eardrops to patients with tympanic membrane perforation. PAGE 2939","bn":89},{"n":90,"s":"Which of the following genes have been shown to play a role in modulating cisplatin ototoxicity?","o":["GSTM1","GSTT1","GSTM3","GSTP1","All of the above"],"k":"E","x":"All of these genes have been shown to potentially play a role in modulating cisplatin ototoxicity. PAGES 2939-2940","bn":90},{"n":91,"s":"Which cell type of the cochlea is most sensitive aminoglycoside ototoxicity?","o":["Inner hair cells from the apex of cochlea","Inner hair cells from the base of cochlea","Outer hair cells from the apex of cochlea","Outer hair cells from the base of cochlea"],"k":"D","x":"The outer hair cells from the base of cochlea are the most susceptible for aminoglycoside ototoxicity. PAGE 2940","bn":91},{"n":92,"s":"A patient suffers a temporal bone fracture from a high-speed motor vehicle accident. They are currently unresponsive and intubated in the intensive care unit. There is steady drainage from the ear on the injured side, which was initially bloodtinge but is now clearer. What is the most appropriate initial treatment for this patient’s condition?","o":["Surgery","Lumbar drain","High-dose steroid","Elevate head of bed 30°","Course of acetazolamide"],"k":"D","x":"This patient has a presumed traumatic CSF leak. This often resolves with conservative measures such as elevation of the head of bed. If this fails, acetazolamide or lumbar drain should be considered before surgical repair. PAGES 2953-2954","bn":92},{"n":93,"s":"During tympanomastoidectomy surgery for cholesteatoma, the temporal lobe dura is violated, and a CSF leak is appreciated intraoperatively. What is the most appropriate form of treatment?","o":["Immediate surgical repair.","Continue the surgery and allow the leak to heal on its own.","Continue the surgery and repair the leak at another date.","Place lumbar drain.","Begin course of acetazolamide."],"k":"A","x":"Immediate surgical repair. When a leak is appreciated intraoperatively, repair should be attempted during the case, which offers the best chance at resolution. Medication or a lumbar drain can be utilized as well but not alone. PAGES 2954-2957","bn":93},{"n":94,"s":"All of the following are risks of a lumbar drain except:","o":["Meningitis","Low CSF pressure headache","CSF leakage from the spine","Brainstem herniation","Dehydration"],"k":"E","x":"Dehydration is not a risk. Meningitis can occur through ascending infection of the lumbar drain system. Headache may occur when CSF is being drawn due to low-CSF pressure. After removal, leakage of CSF can occur via the spine. If there is high pressure above the tentorium, lumbar drain placement can result in brainstem herniation, and CT imaging should be obtained prior to lumbar drain placement. PAGE 2954","bn":94},{"n":95,"s":"When comparing the middle fossa approach compared to the transmastoid approach for CSF leak repair, all of the following are true of the middle fossa approach except:","o":["Wider access/exposure of the skull base","Technically more difficult","Higher risk of hearing loss","Generally avoided in older patients with significant comorbidities","Higher success rate"],"k":"C","x":"Higher risk of hearing loss. This is untrue, as the middle fossa approach allows access to the entire lateral skull base without having to disrupt the ossicular chain; thus, it has a lower chance of hearing loss compared to the transmastoid approach. It is technically more difficult, though has a higher success rate, likely due to the wide access it affords for addressing multiple leaks. It is generally avoided in older, less healthy patients as it requires retraction of the temporal lobe. PAGES 2954-2957","bn":95},{"n":96,"s":"A 35-year-old obese female patient is referred to your clinic for a unilateral chronic ear infection. They had not had issues prior to this year, and the ear continues to drain despite placement of a pressure equalization tube 4 months ago, as well as recurrent application of topical antibiotic ear drops, and oral antibiotics. Examination reveals a patent tympanostomy tube with clear pulsatile fluid draining through the tube. The patient has a history of morbid obesity, obstructive sleep apnea, and well-controlled diabetes but good functional status. What is the most appropriate management for this patient’s condition?","o":["Surgery","Lumbar drain","High-dose steroid","Elevate head of bed 30°","Course of acetazolamide"],"k":"A","x":"This is a classic presentation of a spontaneous CSF leak, which is unlikely to resolve without surgical repair. Although this patient has medical comorbidities, this is fairly typical of patients with spontaneous CSF leaks, and these alone should not preclude them from surgery. They should be optimized medically and screened by an anesthesiology provider prior to surgery. PAGES 2954-2957","bn":96},{"n":97,"s":"A 30-year-old woman with a history of retinal hemangioblastomas and pheochromocytomas is found to have a growing erosive posterior petrous lesion. An MRI shows a T1 and T2 hyperintense lesion. Which of the following is true?","o":["This lesion is benign and should be followed with serial imaging.","This lesion should be resected via a transmastoid approach.","This lesion is typically radioresistant.","Diffusion tensor imaging sequence should be obtained to evaluate the extent of the tumor.","On histology, this lesion is likely to show cholesterol crystals."],"k":"B","x":"This patient’s history and imaging are consistent with an endolymphatic sac tumor. Her history of hemangioblastomas and pheochromocytomas suggest von Hippel-Lindau disease, a genetic disease caused by a mutation in the tumor suppressor gene located on chromosome 3. Endolymphatic sac tumors are strongly hyperintense on TI and T2 MRI and enhance with gadolinium (Table 182.2). The treatment for these tumors is surgical via a transmastoid and possibly translabyrinthine approach and postoperative radiation. PAGES 2980-2983","bn":97},{"n":98,"s":"What is a disadvantage to the middle fossa craniotomy approach for resection of vestibular schwannoma?","o":["Increased risk of CSF leak","Increased risk of postoperative headaches","Increased risk of injury to temporal lobe","Access to tumors extending into the cerebellopontine angle (CPA)","Both C and D"],"k":"E","x":"Because the overlying temporal lobe is elevated, it is theoretically at increased risk of injury from a middle fossa craniotomy approach, compared to the translabyrinthine and retrosigmoid approaches. Tumor access beyond the IAC is poorer with the MCF approach unless the tentorium is divided. PAGES 2968-2970","bn":98},{"n":99,"s":"The following audiometric results are indicative of a retrocochlear pathology except:","o":["Positive acoustic reflex decay","Increased wave V latency difference","Shortened interpeak latencies waves I-V","Absent acoustic reflexes","Unilateral sensorineural hearing loss with disproportionately lower discrimination"],"k":"C","x":"All except shortened interpeak latencies waves I-V are audiometric characteristics of a retrocochlear pathology. PAGES 2962-2963","bn":99},{"n":100,"s":"How are vestibular schwannomas described on histology?","o":["Presence of Verocay bodies","Presence of zellballen cells","Positive stain for S100","Presence of calcified psammoma bodies","Positive stain for succinyl dehydrogenase","Both A and C"],"k":"F","x":"Options A and C refer to vestibular schwannoma pathology. Options B and E refer to paragangliomas; option D can be seen in meningiomas. PAGE 2961","bn":100},{"n":101,"s":"What skull base lesion is hypointense on T1, hyperintense on T2, and bright on diffusion-weighted image?","o":["Epidermoid","Arachnoid cyst","Lipoma","Cholesterol granuloma","Chordoma"],"k":"A","x":"This MRI pattern is consistent with an epidermoid. Please refer to Table 182.2 for a summary of CPA lesion characteristics. PAGE 2984","bn":101},{"n":102,"s":"A 37-year-old woman presents with right-sided intermittent headaches and tinnitus for several years. Examination of the head and neck is unremarkable. Otologic examination showed normal-appearing tympanic membrane. She does have a history of migraines, which has been well controlled. A CT of the temporal bone revealed a smooth bony expansion lesion in the right petrous apex. MRI with contrast demonstrated a nonenhancing, T1 hyperintense, and T2 hyperintense lesion in the same region. What is the most likely diagnosis?","o":["Arachnoid cyst","Cholesteatoma of the petrous apex","Cholesterol granuloma","Chordoma"],"k":"C","x":"The lesion described is most likely a cholesterol granuloma. It has characteristic MRI findings including hyperintensity on T1 and T2 and does not enhance with contrast. Arachnoid cyst is hypointense on T1 and hyperintense on T2. Cholesteatoma is hypointense on T1 and hyperintense on T2 and does not enhance with contrast. Chordoma is destructive and often infiltrative and does not appear as a smooth lesion. PAGES 3011-3012","bn":102},{"n":103,"s":"A 70-year-old man presents with a 2-year history of right-sided pulsatile tinnitus. Workup demonstrates a lesion in the region of the jugular foramen. MRI showed a bright, contrast-enhancing lesion with multiple flow voids. Surgical resection is undertaken. Intraoperatively, the internal jugular vein is tied off, and the proximal sigmoid sinus is ligated. Bleeding from which of the following is likely to occur and complicate resection of the lesion?","o":["Cavernous sinus","Superior petrosal sinus","Inferior petrosal sinus","Transverse sinus","Vertebral artery"],"k":"C","x":"The tumor is likely a glomus jugulare. Ligation of the sigmoid sinus would occlude blood flow from the transverse sinus and superior petrosal sinus. The cavernous sinus is distant from this region. The inferior petrosal sinus would provide drainage into the medial aspect of the tumor and is often encountered during surgical resection. PAGES 3027-3028","bn":103},{"n":104,"s":"A 45-year-old woman presents with a 2-year history of disequilibrium and left-sided hearing loss. She also reports worsening unilateral left-sided tinnitus over the last 3 months. An MRI of the brain with contrast revealed an enhancing lesion measuring 2.5 cm that involves both the left internal auditory canal (IAC) with extension into the CPA. Audiometric testing showed asymmetric left-sided sensorineural hearing loss, with a pure tone average of 65 dB and word recognition score of 8%. The hearing on the right side is normal. She would most benefit from:","o":["Continued observation","Translabyrinthine craniotomy for resection of the mass","Middle cranial fossa approach","Retrolabyrinthine approach to the CPA"],"k":"B","x":"The translabyrinthine approach is the most direct and preferred approach for resecting the tumor, especially since hearing on the left is already poor and hearing preservation is not possible. A middle fossa approach is not indicated due to large tumor size and poor hearing status. A retrolabyrinthine approach provides limited exposure to the IAC. Observation is not recommended given her symptoms. PAGES 3028-3029","bn":104},{"n":105,"s":"A rapidly expanding and contrast-enhancing mass in the IAC with accompanying progressive 7th and 8th cranial nerve neuropathies is most likely to be caused by:","o":["Meningioma","Lipoma","Vestibular schwannoma","Metastatic breast cancer"],"k":"D","x":"Lipoma, meningioma, and vestibular schwannomas are all slowly growing tumors of the IAC. Metastatic breast cancer has a more aggressive growth pattern and presentation and should be considered. PAGES 3026-3027","bn":105},{"n":106,"s":"On radiographic imaging, meningioma of the petrous bone in the CPA can be distinguished from vestibular schwannomas by which of the following features?","o":["Enhancement with intravenous gadolinium contrast","Salt and pepper appearance on MRI","Hyperostosis of the petrous bone","Extension of tumor into the IAC"],"k":"C","x":"Vestibular schwannomas are usually isodense or hypodense to brain and demonstrate enhancement with contrast. They do not have calcifications or hyperostosis of the petrous bone. Both tumors can extend and expand the IAC. Meningiomas are calcified and have characteristic hyperostosis of the adjacent bone. PAGE 2963","bn":106},{"n":107,"s":"Which of the following is an advantage of fractionated radiotherapy?","o":["It allows the delivery of a higher total radiation dose compared to radiosurgery.","It allows time for tissue repair.","It has lower toxicity compared to radiosurgery.","All of the above."],"k":"D","x":"All of the answers are advantage of fractionated radiotherapy. PAGE 3036","bn":107},{"n":108,"s":"Which of the following is a disadvantage of radiosurgery?","o":["Tissue diagnosis is not available.","The treatment is less effective than microsurgery.","It is only suitable for patients under 70 years old.","It is not effective against meningiomas."],"k":"A","x":"The main disadvantage for radiosurgery is the fact that tissue diagnosis is not possible. PAGE 3036","bn":108},{"n":109,"s":"Which of the following is false about the risk of malignant transformation in patients undergoing radiosurgery?","o":["The diagnosis of malignant transformation is based on the Cahan criteria.","The incidence in most studies is approximately 10%.","It typically occurs after 5 years of initially radiosurgery treatment.","The incidence of malignant transformation increases with time after radiosurgery treatment."],"k":"B","x":"The incidence of malignant transformation in patients receiving radiosurgery has been reported to be less than 1% in most studies. PAGES 3037-3038","bn":109},{"n":110,"s":"What is the routine prescription of radiation delivered to vestibular schwannoma patients at the 50% isodose line with Gamma Knife?","o":["5 to 6 Gy","8 to 9 Gy","12 to 13 Gy","15 to 16 Gy"],"k":"C","x":"The routine prescription of radiation delivered to vestibular schwannoma patients at the 50% isodose line with Gamma Knife is 12 to 13 Gy. PAGES 3043-3045","bn":110},{"n":111,"s":"Which of the following is true regarding cranial nerve outcomes in vestibular schwannoma patients undergoing Gamma Knife radiosurgery?","o":["The most common cranial nerve complication after Gamma Knife radiosurgery involves the trigeminal nerve.","The cranial nerve complications after radiosurgery does not correlate with radiation dose.","Most hearing loss and balance issues after radiosurgery occur within the first 6 months after treatment.","Radiosurgery poses higher risks to cranial nerves compared to microsurgery."],"k":"C","x":"Most hearing loss and balance issues after radiosurgery occur within the first 6 months after treatment. PAGES 3048-3051","bn":111},{"n":112,"s":"When is retrocochlear evaluation, ideally in the form of an MRI of the IACs with and without contrast indicated in patients with a sudden hearing loss (SHL)?","o":["Retrocochlear evaluation should only be done in cases where the hearing does not improve.","Retrocochlear evaluation is only indicated if serial audiograms show progression of hearing loss after the initial decline in hearing.","Retrocochlear evaluation should be done even when there appears to have been a clear viral etiology for the SHL.","Retrocochlear evaluation should be done emergently before treatment is initiated."],"k":"C","x":"Because retrocochlear lesions can present in patients with SHL with complete recovery of hearing, regardless of hearing recovery or progression, it should be done. However, as the treatment is time sensitive and the lesions found on MRI that can cause SHL are typically not emergent diagnoses, treatment should not be held up before imaging is obtained. PAGES 3062-3063","bn":112},{"n":113,"s":"What is the correct dose of oral steroids as initial therapy that may be offered to patients with SSHNL within 2 weeks of symptoms onset?","o":["Prednisone | mg/kg/d x 7 to 10 days, then taper","Prednisone 1 mg/kg/d x 7 to 10 days, with no taper","Prednisone 0.5 mg/kg/d x 7 to 10 days, then taper","Prednisone 0.5 mg/kg/d x 7 to 10 days, with no taper"],"k":"A","x":"There is some evidence that the value of steroids may be helpful for initial treatment of SSNHL. There are side effects/risks of high-dos hyperglycemia, and Cushing like syndrome, which may outweigh the systemic steroid use such as avascular hip necrosis, benefits of the therapy in some patients. When oral steroids are given as initial therapy, the correct dose is prednisone 1 mg/kg/d x 7 to 10 days, then taper to allow the adrenal gland time to resume normal function. PAGE 3064","bn":113},{"n":114,"s":"Hyperbaric oxygen (HBO) therapy may improve outcomes for patients with sudden sensorineural hearing loss (SSNHL) when:","o":["Given 2 months after onset of hearing loss","Used independently without steroids","Given within 2 weeks of onset of symptoms","Fewer than 10 treatments are given"],"k":"C","x":"There is some evidence that HBO can be helpful when used with steroids early after an episode of SSNHL. The evidence becomes weaker after 2 weeks, and there is no evidence of benefit for chronic hearing loss. When HBO is given, appropriate treatment involves 10 to 20 treatments at 2.0 to 2.5 ATM generally for 90 minutes. PAGE 3064","bn":114},{"n":115,"s":"Intratympanic steroid injection used as salvage therapy for","o":["Has been shown to be equivalent to HBO alone","Offers significant improvement in hearing compared to systemic steroids as salvage","Is recommended only after 3 months of no hearing improvement","Is better when offered as methylprednisolone compared to dexamethasone"],"k":"B","x":"Multiple studies have shown that after 2 weeks of onset of the SHL, intratympanic steroids have a better recovery rate than either oral steroids alone or HBO, whose rates of recovery decline significantly at weeks 3 and 4. For that reason, the clinical practice guidelines recommend the use of intratympanic steroids as salvage therapy between 2 and 6 weeks of onset. One meta-analysis (Ng et al, 2015) showed that dexamethasone has significantly better outcomes compared to methylprednisolone. PAGES 3065-3066","bn":115},{"n":116,"s":"During the initial presentation of a sudden hearing loss:","o":["A trial of antibiotics to clear the possible ear infection is indicated","Tuning fork examinations are incredibly inaccurate and have no role in the physical examination","Initiation of antiviral therapy can reverse the process quickly as most cases are suspected to be due to viral etiology","Early initiation of steroid therapy while trying to evaluate for possible etiologies is recommended"],"k":"D","x":"A thorough evaluation including a history and physical examination is important in evaluating a SHL. While tuning fork examinations are not perfect, when the Rinne and Weber are congruent (about 50% of the time), they can be 95% sensitive for a sensorineural loss. Empiric treatment for possible ear infection in the absence of physical examination findings causes unnecessary delay in the diagnosis and treatment of SHL. There has been no data suggesting that the addition of antiviral therapy improves the recovery of these patients. However, multiple studies have shown that the early initiation of steroid therapy results in better hearing outcomes. PAGES 3062-3063","bn":116},{"n":117,"s":"A 50-year-old male presents with unilateral right-sided pulsatile tinnitus that is improved with ipsilateral compression of her right neck. Which of the following is the most likely diagnosis?","o":["Temporomandibular joint disorder","Glomus tympanicum","Dehiscent jugular bulb","Superior semicircular canal dehiscence"],"k":"C","x":"Pulsatile tinnitus may be attributable to a vascular etiology. Light ipsilateral neck compression should be performed to assess the effect of decreased jugular venous flow on presence or intensity of the pulsatile tinnitus. Decreasing tinnitus with ipsilateral neck compression suggests a venous etiology such as a dehiscent jugular bulb. Temporomandibular joint disorder, superior semicircular canal dehiscence, or glomus tumors may present with pulsatile tinnitus but do not typically improve with neck compression. PAGE 3072","bn":117},{"n":118,"s":"A 76-year-old male presents with bilateral subjective nonpulsatile tinnitus. What is the most appropriate first step in management?","o":["ABR testing","Comprehensive behavioral audiometry","MRI of the IAC","Tinnitus pitch matching test"],"k":"B","x":"The initial evaluation of a patient presenting with tinnitus should include a complete or comprehensive behavioral audiogram, including pure-tone and spondee thresholds, word recognition scores, and tympanometry. Other audiologic tests, including auditory brainstem responses or tinnitus pitch matching, may be employed in rare cases but should not precede behavioral audiometry. MRI may be indicated for certain patients who present with tinnitus but are not required for all and should not precede an audiogram. PAGES 3072-3073","bn":118},{"n":119,"s":"Rigorous evaluation of published data, such as that performed. by Cochrane systemic reviews, has evaluated various treatments for subjective tinnitus. Study suggests that the most effective treatment for subjective tinnitus is:","o":["Cognitive behavioral therapy","Gingko biloba","HBO therapy","Betahistine"],"k":"A","x":"Systemic reviews and meta-analysis, such as those performed by Cochrane Systematic Review, provides high-quality evaluation of the efficacy of currently available treatments for subjective tinnitus. These are reviewed in Table 161.4. Cognitive behavioral treatment has been shown to be effective in reducing the negative impact of tinnitus on quality of life as well as small benefits on depressive symptoms related to tinnitus. There is no evidence to support an effect of Gingko Biloba, HBO, or betahistine on subjective tinnitus. PAGE 3078","bn":119},{"n":120,"s":"A 26-year-old female in the third trimester of pregnancy presents with pulsatile tinnitus. Her symptoms are most likely caused by which of the following?","o":["Preeclampsia","Weight gain","High-flow state","Multiple gestations"],"k":"C","x":"Hyperdynamic states leading to increased cardiac output can cause pulsatile tinnitus. These states include anemia, thyrotoxicosis, and pregnancy. Tinnitus in pregnancy is not specifically related to multiple gestations, weight gain, or preeclampsia. PAGE","bn":120},{"n":121,"s":"A 43-year-old overweight female presents with bilateral pulsatile tinnitus. She is found to have idiopathic intracranial hypertension (ITH). What is the most appropriate initial step in the treatment?","o":["Oral diuretic","CSF diversionary procedures","High-fat diet","Bariatric surgery"],"k":"A","x":"Most common in young, obese women, symptoms of IIH include headache, papilledema and visual disturbances, pulsatile tinnitus, hearing loss, and vestibular abnormalities. These symptoms may present individually or in combination. Acetazolamide, corticosteroids, and diuretics have been shown to improve tinnitus resulting from ITH. Additional treatment options include CSF diversion procedures or bariatric surgery for weight loss. Both may result in reduction of tinnitus, however are not typically considered until after failure of oral therapy. PAGE 3086","bn":121},{"n":122,"s":"A 68-year-old male presents to the clinic upon referral for vasomotor rhinitis and is accompanied by his wife. During the visit, his wife asks you for current time, which prompts the patient to say, “Why do you want to know about his dimes?” He has no significant medical problems, and his head and neck examination, including otoscopy, is unremarkable. In layman’s terms, you tell the patient and his wife your impression while washing your hands at sink, but the patient looks confused when you turn around to face him. After repeating yourself, you ask the patient if he has had any difficulty hearing, to which he admits he can never hear his wife whenever they go out for dinner. Regarding his hearing, what is the most appropriate next step?","o":["Hearing screening.","Referral for hearing aids.","Obtain MRI of the brain.","Reassure the patient that there are no significant concerns."],"k":"A","x":"Although this patient is being seen for another complaint, his untreated ARHL should not be ignored. Older adults with measurable hearing loss may or may not have subjective hearing concerns. Worsening ARHL, preferentially affecting high-frequency consonants, may lead to misinterpreting words, for example, “time” versus “dime,” and often struggle with hearing-in-noise, such as at social gatherings or restaurants. Based on the U.S. Preventive Services Task Force recommendations, it is expected that patients who have perceived hearing problems or hearing-related cognitive symptoms should be assessed for objective hearing impairment. Sensory management and aural rehabilitation should be discussed and implemented based on the patient’s hearing impairment and subsequent handicap. PAGES 3090-3094","bn":122},{"n":123,"s":"A 77-year-old female with bilateral hearing loss presents for further management. Previous management included bilateral hearing aids, which worked well for several years. However, she complains that her hearing aids are no longer working, and a repeat audiogram shows bilateral severe to profound hearing loss. Which of the following is the most appropriate statement to counsel this patient on cochlear implantation (CI)?","o":["Cl in an older adult would provide worse hearing outcomes compared to a younger adult.","Cl in this patient would be unsafe due to her old age.","Vestibular dysfunction after CI in an older adult may last longer than in a younger patient.","Cl in an older adult would make no difference in overall quality of life."],"k":"C","x":"Age alone should not be considered a limiting factor when considering CI candidacy; for in older adults, it is safe, cost-effective, and associated with improvements in a range of important functional domains, including social and emotional function, cognition, and overall quality of life. CIs can provide the same level of hearing performance as younger adults undergoing the procedure; however, postoperative duration of vestibular dysfunction may be longer among older patients. PAGES 3094-3096","bn":123},{"n":124,"s":"For which of the following has age-related hearing loss (ARHL) been identified as the largest potentially modifiable risk factor?","o":["Social isolation","Depression","Physical disability","Dementia"],"k":"D","x":"Although ARHL is independently associated with greater odds of depression, social isolation, and mobility disability, ARHL has been identified as the largest potentially modifiable risk factor for dementia at a population level. PAGES 3094-3096","bn":124},{"n":125,"s":"A 65-year-old male presents to clinic complaining of dizziness when getting into and out of bed each day. A Dix-Hallpike test using Frenzel goggles elicits upbeating, geotropic torsional nystagmus. What is the most appropriate next step?","o":["Canalith repositioning maneuver (eg, Epley maneuver).","MRI.","Place an order for vestibular function testing.","Contact his PCP to adjust his blood pressure medications."],"k":"A","x":"This patient presents with classic symptoms and signs of BPPV, the most common form of dizziness in the elderly. The practicing otolaryngologist should readily recognize this diagnostic entity and feel comfortable treating the patient with a canalith repositioning maneuver (eg, Epley) at the time of diagnosis. In the event that clinic space cannot allow for such maneuver, the patient is intolerant, or returns with recurrent spells, referral to a vestibular physical therapist is appropriate. PAGES 3098-3099","bn":125},{"n":126,"s":"An 82-year-old female with a past medical history of diabetes, hypertension, and depression is seen in consultation for recurrent falls and chronic dizziness for the past year. She was seen by an outside otolaryngologist who noted a gain of 0.7 bilaterally on video head-impulse testing. Other than this, her workup has remained unremarkable. Which of the following is the most appropriate next step in the care of this patient?","o":["Provide Dizziness Handicap Inventory questionnaire to identify any underlying balance disorder.","Refer for vestibular physical therapy.","Referral to a multidisciplinary falls prevention clinic.","Prescribe meclizine as a “rescue” medication."],"k":"C","x":"This patient meets diagnostic criteria for presbyvestibulopathy. In this type of patient, if present at ones’ institution, referral to multidisciplinary falls prevention clinics should be integral part of treatment. Although it may be appropriate to provide a Dizziness Handicap Inventory questionnaire, this will not rule out all possible underlying disorders, so would not be the best answer here. In a patient with multiple comorbidities that place her at risk of peripheral neuropathy, retinopathy, and use of fall-risk increasing medications (antihypertensives and antidepressives), vestibular physical therapy alone will likely not be sufficient. Vestibular suppressants (eg, meclizine, scopolamine, lorazepam) are effective at reducing acute symptoms of vertigo and motion sickness but are not recommended in the geriatric population. PAGES 3099-3100","bn":126},{"n":127,"s":"Measures for preventing post-CI meningitis include all of the following except:","o":["Vaccination against pneumococcus","Avoiding a separate intracochlear electrode positioner","Coating the array with antibiotic solutions","Sealing the cochleostomy"],"k":"C","x":"Coating the array with antibiotic solution has not been shown to prevent postimplantation meningitis. PAGE 3119","bn":127},{"n":128,"s":"Which of the following patients is not a cochlear implant candidate?","o":["Adult patient with profound hearing loss, patent cochlea, and arecent history of meningitis","A 25-year-old male with congenital profound sensorineural hearing loss and lack of spoken language","A 1-year-old female with proven connexin 26 mutations and profound sensorineural hearing loss","An 80-year-old male with progressive, moderate sloping to profound sensorineural hearing loss and lack of benefit from conventional amplification via hearing aids"],"k":"B","x":"A 25-year-old patient born without hearing or spoken language likely lacks the necessary cortical pathways available for auditory stimulation and spoken language development. This patient would be well past the plasticity period for cortical auditory maturation. PAGES 3109-3111","bn":128},{"n":129,"s":"What is the greatest average bone conduction threshold for which osseointegrated implantation is still possible?","o":["35 dB HL","45 dB HL","55 dB HL","65 dB HL"],"k":"D","x":"The percutaneous passive bone conduction implants allow for a conductive or mixed hearing loss threshold < 65 dB. For the transcutaneous active BCIs, the Cochlear OSIA device is approved for < 55 dB thresholds, whereas Med-EL Bonebridge is approved for < 45 dB thresholds. PAGES 3121-3123","bn":129},{"n":130,"s":"Active middle ear implants are contraindicated in each of the following conditions except:","o":["Poor speech discrimination","Active middle ear disease","Adequate performance with conventional amplification","Failed stapedectomy"],"k":"D","x":"Round window vibroplasty with the Vibrant Soundbridge system is a way to bypass the ossicular chain in the setting of stapedectomy failure. PAGE 3133","bn":130},{"n":131,"s":"What is the stimulation site for an auditory brainstem implant?","o":["Dorsal cochlear nucleus","Superior olivary complex","Central nucleus of the inferior colliculus"],"k":"A","x":"This is the correct site of implantation. PAGES 3134-3136","bn":131},{"n":132,"s":"Advantages of endoscopic ear surgery include all of the following except:","o":["The ability to “look around corners” within the middle ear","Binocular vision with true depth perception","Superior visualization due to position of the light source at the distal tip of the endoscope","Opportunity for less invasive approach with reduced need for postauricular incisions and bony removal","Potential for improved surgical ergonomics with “heads up” ear surgery"],"k":"B","x":"Endoscopic ear surgery improves the visualization of hidden cavities of the middle ear by allowing the surgeon to “look around corners.” The endoscope provides enhanced image clarity and superior visualization due to the position of the light source at the distal tip of the endoscope and improves access to pathology with less soft tissue retraction and bony drilling. Endoscopic ear surgery also affords superior ergonomics compared to microscopic surgery. The major disadvantage of the endoscope is the loss of binocular vision and bimanual approach to dissection. PAGES 3141-3143","bn":132},{"n":133,"s":"The light source intensity should be adjusted to a level less than or equal to which of the following to decrease risk of thermal injury and tissue desiccation during endoscopic ear surgery?","o":["20%","40%","50%","70%","90%"],"k":"C","x":"The light source of the endoscope is located at its distal end such that it is in closer proximity to critical structures of the middle ear compared to the microscope. Thermal injury and tissue desiccation is a concern with endoscopic ear surgery. Adjustment of the light source intensity to less than or equal to 50% appears to decrease the risk of these injuries. PAGE 3142","bn":133},{"n":134,"s":"While raising a tympanomeatal flap with an endoscope, all of the following techniques may be used to achieve adequate hemostasis except:","o":["Use of cotton balls or another small pledgets soaked in concentrated epinephrine solution","Injection of the tympanomeatal flap prior to incision with epinephrine solution","Placing the operating table in the Trendelenburg position","Maintaining the systemic blood pressure as low as possible","Use of a specialized suction dissector to simultaneously dissect the flap and evacuate blood"],"k":"C","x":"Achieving hemostasis with endoscopic ear surgery can be challenging, particularly for novice endoscopic ear surgeons. Placing the patient in reverse Trendelenburg, maintaining the systemic blood pressure as low as possible, and use of epinephrine can improve hemostasis. PAGES 3151-3152","bn":134},{"n":135,"s":"The disadvantages of endoscopic ear surgery include
