:111,"s":"A 6-year-old female 4-week status postmicrotia reconstruction with a porous polyethylene implant presents for a follow-up evaluation and is found to have an implant exposure. There is no evidence of active infection at the site. What would be the next best step in management?","o":["Observe and have the patient follow up in 1 month.","Schedule for revision of the site with debridement and coverage with a mastoid fascia flap/skin graft in the operating room within the next week.","Schedule for revision procedure with complete replacement of PPE implant.","Schedule for removal of implant."],"k":"B","x":"Schedule for revision of the site with debridement and coverage with a mastoid fascia flap/skin graft in the operating room within the next week. PAGE 3769","bn":111},{"n":112,"s":"The longitudinal axis of the auricle is generally within how many degrees of the angle of the nasal dorsum?","o":["5°","15°","25°","35°"],"k":"B","x":"15°. PAGES 3758, 3763","bn":112},{"n":113,"s":"A 3-year-old male with right-sided grade III microtia is being evaluated for possible reconstruction with autologous rib cartilage. Which is the earliest age by which he would likely have appropriate chest wall development for the Nagata technique?","o":["5 years old","6 years old","8 years old","10 years old"],"k":"D","x":"10 years old. PAGE 3765","bn":113},{"n":114,"s":"A newborn infant presents with left-sided anotia and aural atresia. Which of these is least likely to be required during future workup?","o":["MRI of the brain","CT temporal bone","Hearing evaluation","Renal ultrasound"],"k":"A","x":"MRI of the brain. PAGE 3759","bn":114},{"n":115,"s":"A 52-year-old Caucasian female presents to the clinic interested in a chemical peel. She is an excellent candidate for a Jessner prepeel followed by a 35% TCA chemical peel. What area is at high risk for delayed wound healing when using this chemical peel?","o":["Periocular region","Forehead","Nasal dorsum","Neck"],"k":"D","x":"The skin of the neck has decreased pilosebaceous units compared to that of facial skin. With this medium-depth chemical peel, reepithelialization is dependent on the density of pilosebaceous units. It is general, and it is recommended that chemical peels applied to the neck are limited to conservative, superficial depth chemical peels. PAGE 3792","bn":115},{"n":116,"s":"The medium for the laser being used determines which parameter?","o":["Wavelength","Fluence","Pulse duration","Spot size"],"k":"A","x":"Wavelength is dependent on the medium being used, for instance CO₂ laser is 10,600 nm. This determines the target chromophore of the tissue. Fluence is the amount of energy per unit area. Pulse duration is a variable for noncontinuous lasers and is related to the time required for one pulse to occur. Spot size is a setting that adjusts the area of tissue being treated with each applied pulse. PAGE","bn":116},{"n":117,"s":"Performing a dermabrasion, a yellow-whitish color with decreasing number of bleeding vessels is encountered. What level of the skin is represented by this visual indicator?","o":["Epidermis","Papillary dermis","Reticular dermis","Subcutaneous fat"],"k":"C","x":"A yellow-whitish color with decreasing number of blood vessels represents the reticular dermis. Generally, this depth should be avoided during dermabrasion because of the increased risk for scarring. PAGE 3796","bn":117},{"n":118,"s":"During a chemical peel, the skin demonstrates a symmetric white frost overlying a background of erythema. What is the most likely chemical peel agent being applied?","o":["20% glycolic acid","Jessner solution","35% TCA","Baker-Gordon peel"],"k":"C","x":"The description indicates level II frosting, which is achieved with medium-depth chemical peels. Glycolic acid and Jessner solution are superficial peel agents. The Baker-Gordon formula is a deep chemical that would demonstrate solid white frosting without visible erythema. PAGE 3791","bn":118},{"n":119,"s":"What is the minimum time recommended before treating subsequent facial units with a Baker-Gordon chemical peel?","o":["5 minutes","10 minutes","15 minutes","20 minutes"],"k":"C","x":"Phenol is systemically absorbed and may have cardiotoxic effects. Patients with renal and hepatic dysfunction are at higher risk. To prevent cardiotoxicity, it is recommended to allow 15 minutes between treatment of subsequent subunits during resurfacing. PAGE 3791","bn":119},{"n":120,"s":"A 4-month-old female is evaluated for a rapidly enlarging, red-blue tumor overlying her chin and anterior neck. What is the next best step?","o":["Start topical timolol gel twice a day until resolution.","Start weight-based oral propranolol until resolution.","Advise patients that this lesion will self-resolve without any sequelae.","Consider evaluation of airway with laryngoscopy and/or bronchoscopy"],"k":"D","x":"The vignette describes an infantile hemangioma in its proliferative phase. This typically occurs few months after birth. Patients with large hemangiomas over the parotid, mandible, lower lip, or submental areas should be evaluated for airway involvement. Medical therapy with oral propranolol can begin once internal involvement has been ruled out. PAGE 3805","bn":120},{"n":121,"s":"A 5-year-old boy presents with multiple, skin-colored papules clustered around the nose and upper lip. His mother is requesting removal of the lesions given the cosmetic appearance. The patient was diagnosed with vitiligo and infantile spasms within the past few years. What is the next best step?","o":["Complete skin examination","Curettage","Excision","Dermabrasion"],"k":"A","x":"The vignette describes adenoma sebaceum (facial angiofibromas), hypopigmented macules (“vitiligo”), and infantile spasms. This constellation of symptoms is suggestive of a systemic disease like tuberous sclerosis. A full skin examination may reveal a Shagreen patch (collagenoma), periungual fibromas, and or a fibrous forehead plaque. Systemic manifestations can include intellectual disability, cardiac rhabdomyoma, cortical dysplasia, and angiomyolipomas. Genetic testing may reveal a mutation in TSC1 or TSC2. PAGE 3805","bn":121},{"n":122,"s":"A 2.5-cm, hyperpigmented, variegated brown, patch with irregular borders has developed on the nasal sidewall of a 70-year-old male. The patient states it has evolved over the past few years, and he would like it removed for cosmetic reasons. What is the best next step?","o":["Electrodessication and curettage","Biopsy (broad shave, multiple scouting shave or punch)","Pulse dye laser","Excision and closure along relaxed skin tension lines","Excisional biopsy"],"k":"B","x":"The lesion described is suspicious for an evolving melanoma in situ, lentigo maligna type. Suspicious (ie, size > 0.5 cm, irregular border, variegated color, evolving) pigmented/melanocytic lesions should be biopsied to determine if malignant or benign. Broad shave biopsies, multiple scouting shave biopsies, or punch biopsies are most likely to capture any pathologic process. In this case, a 2.5-cm lesion on the nasal sidewall would be difficult to perform an excisional biopsy. The majority of brown macules or patches on patients are benign solar lentigines, ephelides, or macular seborrheic keratoses. PAGE 3807","bn":122},{"n":123,"s":"A patient requests removal of a tender, red brown, subcutaneous nodule on her upper chest/neck. You biopsy the nodule, and it results as a leiomyoma. What is the next best step?","o":["Inform patient of benign result, nothing further needed.","Inform patient of benign result, excise the remaining lesion.","Inform patient of benign result, ask or check patient for similar-appearing lesions.","Inform patient of malignant result, excise with 1-to 2-mm margins."],"k":"C","x":"Multiple cutaneous leiomyomas can be a marker of Reed syndrome (leiomyomatosis cutis et uteri). Reed syndrome is caused by a fumarate hydratase mutation and can lead to an increased risk of cutaneous and uterine leiomyomas as well as renal cell carcinoma. Patients should undergo genetic counseling and testing. PAGE 3815","bn":123},{"n":124,"s":"What is the best overall principle for deciding the management of various lesions that present on the facial region?","o":["Papular lesions should be shave excised flush with the surrounding skin.","Biopsy should be performed on pigmented lesions and those where the clinical diagnosis is uncertain.","Cryotherapy is the best starting treatment for any facial lesion.","Actinic keratoses should be excised given their risk of malignant transformation."],"k":"B","x":"While many facial lesions can be clinically diagnosed (ie, seborrheic keratosis, actinic keratosis, verruca, molluscum, lentigines, dermal nevi), there are a variety of appendageal tumors (ie, trichofolliculomas, syringomas, trichoepitheliomas, trichilemmomas) that cannot be reliably determined without histology. It may be prudent to consider skin biopsy to rule out a malignancy. Changing pigmented lesions should be biopsied before any definitive treatment is undertaken. PAGE 3815","bn":124},{"n":125,"s":"Concerning laser treatment of a tongue venous malformation, which is the most appropriate laser?","o":["Carbon dioxide laser (CO2)","Potassium titanyl phosphate laser (KTP)","Neodymium: Yttrium Aluminum Garnet (Nd:YAG)","Pulsed dye laser (PDL)"],"k":"C","x":"Nd:YAG. The Nd:YAG emits light with a wavelength of 1,064 nm, in the infrared range. It targets bluish lesions and is ideal for venous malformations. On the mucosa, a bare 550 micron fiber can be used or a hand held probe with dynamic cooling. PAGE 3832","bn":125},{"n":126,"s":"Regarding “infantile hemangiomas,” which of the following is true?","o":["All vascular lesions can be referred to as “hemangiomas.”","They can be subdivided into focal and segmental lesions.","They continue to grow throughout a patient’s lifetime.","They should all be treated."],"k":"B","x":"They can be focal or segmental. All vascular lesions are not “hemangiomas.” Refer to the ISSVA classification, which divides vascular lesions into tumors and malformations. Infantile hemangiomas (IHs) are the most common benign vascular tumor. Only malformations continue to grow. IHs proliferate and involute. Focal lesions proliferate for a year and segmental lesions for 2 to 3 years. Not all THs need treatment: depends on the growth phase, superficial or compound, and location. PAGE 3825","bn":126},{"n":127,"s":"Port-wine stains are associated with which of the following genetic abnormality?","o":["Tie-2","GNAQ","LYVEI","ENG"],"k":"B","x":"GNAQ mutation is a somatic mutation. Others have also been described but this is the first. Tie-2 is associated with VMs, LYVE!1 with LMs, and ENG with HHT. PAGE 3826","bn":127},{"n":128,"s":"Concerning the distribution of airway lymphatic malformations, which of the following is correct?","o":["Transglottic","Subglottic","Supraglottic","Glottic"],"k":"C","x":"Supraglottic. VMs and THs can be transglottic or subglottic, but LMs are supraglottic. PAGE 3835","bn":128},{"n":129,"s":"Which of the following statements concerning arteriovenous malformations of the head and neck is correct?","o":["There is a risk of malignant degeneration.","They involute as the patient approaches the sixth decade of life.","Left untreated, they will continue to expand throughout the patient’s life.","Surgery is the treatment of choice."],"k":"C","x":"All vascular malformations expand and hypertrophy throughout a patient’s lifetime. PAGE 3833","bn":129},{"n":130,"s":"Oral finasteride 1 mg/day is most indicated in which of the following patients?","o":["A 72-year-old male with diffuse thinning","A 61-year-old female with frontal fibrosing alopecia","A 24-year-old male with miniaturization and thinning of the crown","A 16-year-old male worried about his family history of hair"],"k":"D","x":"Women should not take finasteride, it probably is not effective in frontal fibrosing alopecia, and young men have the most to lose by not being on preventative therapy for MPB. PAGE 3840","bn":130},{"n":131,"s":"Which of the following piece of advice is best given to a 23-year-old male with MPB seeking a hair transplant for his receding hairline?","o":["The sooner it is performed, the better will be his donor area supply.","Take preventative therapy for at least | to 2 years to assess his response before considering a procedure.","Advise FUT because it can provide a greater total amount of donor hairs which he will need over the course of his lifetime.","Hairline lowering surgery is a great way to achieve a lower hairline without tapping into his limited donor hair supply."],"k":"B","x":"Young men are at high risk of progressive hair loss, and medical management is the cornerstone. PAGE 3841","bn":131},{"n":132,"s":"Which of the following patients is the best candidate for a hairline lowering surgery?","o":["A 42-year-old male-to-female transgender patient whose receding hairline has been stable for 2 years following gender reassignment surgery including orchiectomy","Middle-aged female recently diagnosed with frontal fibrosing alopecia","A 32-year-old Black female with frontal and temporal traction alopecia","A 31-year-old male with slowly receding hairline"],"k":"A","x":"The other three patients are at risk of progressive hair loss and therefore should not undergo the surgery. PAGE 3853","bn":132},{"n":133,"s":"In counseling patients about FUE versus FUT/strip surgery, which is the most accurate advice?","o":["FUE leaves no donor site scar and therefore assures that the patient can shave the scalp in the future.","FUE has typically a lower percentage of regrowth even when performed using oscillating hybrid punch systems.","Over the course of a patient’s lifetime, there are a larger number of total grafts that can be harvested using FUT combined with FUE as opposed to just FUE.","Sharp punches in FUE is preferred in nearly all cases to hybrid punches due to a lower rate of transection."],"k":"C","x":"This is true, although the greater number of total grafts—typically 2,000 to 3,000 grafts—is not necessarily worth having the donor strip scar. Oscillating hybrid punches are the superior punches to use as they minimize graft transection over robotic and other sharp punch devices. PAGE 3850","bn":133},{"n":134,"s":"In which of these cases, assuming maximum number of grafts can be placed, is a hair transplant most likely to yield the highest appearance of density?","o":["A 25-year-old Caucasian male for frontal forelock restoring with light skin and fine dark hairs","A 42-year-old Hispanic male for frontal scalp coverage with dark scalp and salt and pepper somewhat curly hair","A 31-year-old Caucasian male seeking maximum filling in of his crown","Premenopausal 42-year-old female with diffuse unpatterned alopecia"],"k":"B","x":"Color contrast is a prime determinant of the appearance of density, with darker scalps, lighter colored hair, curly hair, and work in the frontal region all positive characteristics. PAGE","bn":134},{"n":135,"s":"Overactivation of which muscles leads to the formation of vertical glabellar rhytids?","o":["Orbicularis oculi","Corrugator supercilii","Risorius","Frontalis"],"k":"B","x":"The paired corrugator supercilii act as brow depressors. They consist of an oblique and transverse heads, with the transverse heads the predominant contributors to vertical glabellar thytids. PAGE 3858","bn":135},{"n":136,"s":"Which of the following is the mechanism of action of botulinum toxin?","o":["Degrades acetylcholine at the postsynaptic nerve terminal","Induces temporary demyelination of peripheral nerves","Stimulates activity of acetylcholinesterase within neurotransmitter vesicles","Inhibits presynaptic release of acetylcholine"],"k":"D","x":"Botulinum toxin is a metalloendoprotease neurotoxin produced by Clostridium botulinum.'4 It causes a temporary chemodenervation of muscle fibers leading to flaccid paralysis. Biochemically, it works through inhibiting acetylcholine neurotransmitter release from presynaptic nerves at the motor end plate. PAGE 3859","bn":136},{"n":137,"s":"You inject poly-1 lactic acid for facial rejuvenation of a 42-year-old female patient, who is extremely happy with the immediate result. She calls you 2 days later to report that the injection effect has completely disappeared. What is the next best step?","o":["Bring the patient back to clinic today for a touch-up filler injection.","Reassure the patient that this is a normal result.","Advise monitoring and use of warm compresses with head elevation.","Massage the area and inject with hyaluronidase."],"k":"B","x":"Poly-l lactic acid is a semipermanent, biodegradable facial filler. It contains microspheres that stimulate an inflammatory response, activating collagen neogenesis and deposition. Eventually, this inflammatory process leads to the degradation of PLLA particles that are subsequently replaced by newly synthesized collagen fibers, at which point the final volumization effect becomes visible. PLLA is reconstituted in saline, which is quickly reabsorbed in the first few days after treatment. The patient should be counseled that the volumization process will take place over the next several weeks, at which point a touch-up injection may be considered. PAGE 3868","bn":137},{"n":138,"s":"Which facial filler requires allergy skin testing prior to treatment?","o":["Hyaluronic acid","Poly-I lactic acid","Calcium hydroxylapatite","Polymethyl methacrylate"],"k":"D","x":"Polymethyl methacrylate (PMMA) is a nonabsorbable permanent filler consisting of a suspension of PMMA microspheres in a bovine collagen carrier. Due to the potential immunogenicity of bovine collagen, patients should undergo skin testing prior to undergoing treatment of the face. PAGE 3868","bn":138},{"n":139,"s":"What medication is used to treat eyelid ptosis after botulinum toxin injection?","o":["Hyaluronidase injection into the treated area","1% prednisolone eye drops","0.5% apraclonidine eye drops","Oral methylprednisolone"],"k":"C","x":"Eyelid ptosis is a complication of botulinum toxin treatment that occurs due to migration into the levator palpebrae superioris. If this occurs, alpha-adrenergic ophthalmic drops such as 0.5% apraclonidine or 2.5% phenylephrine can be used to stimulate the action of the superior tarsal muscle to facilitate eyelid elevation and counteract the effects of levator palpebrae superioris paralysis. PAGE","bn":139}]},{"t":"Contemporary Issues in Medical Practice","q":[{"n":1,"s":"Dental extractions are performed during a major head and neck cancer resection and reconstruction. A small throat pack was placed by the dental team and placed entirely within the pharynx. The presence of the pack was not handed off to the other surgical teams and was left in the patient at the end of surgery. The presence of the throat pack was not discovered until 3 days later and resulted in patient harm. An otolaryngologist is interested in starting an institutional quality improvement initiative to reduce the incidence of retained surgical items from so called “uncountable objects.” Which of the following is a step in the development of quality improvement initiatives?","o":["Generation of a task force","Building awareness among hospital staff to the protocol","Root cause analysis","All of the above"],"k":"D","x":"All of the above are components of an institutional quality improvement initiative. Introducing an institutional quality improvement initiative usually begins with a root cause analysis (RCA) that identifies a need for protocol development. In this example, a retained foreign body would certainly be an event requiring an RCA. From there, a task force is developed consisting of diverse members of the hospital staff, which in this case could be an otolaryngologist, dentist, operating room nurse staff, scrub techs, and hospital administration. The multidisciplinary task force must then work together to develop a protocol and refine it until a consensus is reached. From there, awareness must be built among hospital staff, and the protocol must be implemented. Close monitoring of protocol adherence must be performed, and the protocol must be reviewed intermittently with changes made as needed. Usually, the protocol will initially be introduced on a smaller scale and then spread throughout the hospital and possibly to other hospitals within the hospital system. PAGES 3880-3883","bn":1},{"n":2,"s":"A patient is postoperative day 0 from an endoscopic repair of an encephalocele and a CSF leak. The patient sees a pain provider as an outpatient and receives gabapentin and hydrocodone/acetaminophen 10/325 mg every 4 hours for back pain. Following surgery, patient reports severe left-sided head pain. She is combative with the nursing staff and repeatedly asks for “Dilaudid.” A review of her history reveals that she has filled several opioid prescriptions in the past 3 months. The nurse reports the patient complaints to the physician, and they agree she is “pain seeking and a very difficult patient.” On POD 1, a head CT is performed showing a large intraparenchymal hemorrhage. The patient is assessed by neurosurgery and taken to OR on POD 1 for evacuation of the hemorrhage. What type of cognitive bias was displayed most prominently in this case?","o":["Visceral bias","Framing effect","Anchoring bias","Availability bias"],"k":"A","x":"In this case, the physician and nurse are displaying a visceral bias. The patient is combative with staff and unpleasant. She is also a known opioid user. The physician and nurse’s negative feelings toward the patient lead them to dismiss the patient’s pain claims and, thus, delay further workup. Framing bias is deciding on options based on whether the options are presented with positive or negative connotations. Anchoring bias is an over-reliance on first piece of information you hear. Availability bias is the tendency to judge things as being more likely to occur due to recent exposure to similar situations. These options would be less relevant in this situation. PAGE","bn":2},{"n":3,"s":"What is an example of a process measure?","o":["Surgical volume of thyroidectomy","Percentage of patients receiving appropriate VTE chemoprophylaxis","30-day mortality","Hospital readmission rate"],"k":"B","x":"The percentage of patients receiving appropriate VTE chemoprophylaxis is a process measure. Measurement of surgical care is frequently assessed using Donabedian’s structure-process-outcome model. In the Donabedian model, quality measurement can be either structural, process, or outcomes related. Structure measures look at the characteristics of health care systems and would include things such as surgical volume of thyroidectomy, “National Comprehensive Cancer Network Center” status, or subspecialty training by the surgeon. Process measures assess compliance with effective processes, such as the use of chemoprophylaxis for prevention of venous thromboembolism. Outcome measures look at repercussions of care and examples include morbidity and mortality rates, hospital length of stay, and readmission rates. PAGE 3880","bn":3},{"n":4,"s":"The wrong thyroid lobe was surgically removed because the schedulers mistakenly added the incorrect side to the OR schedule, because of preoperative mismarking, and partly because of patient confusion. Following this event, the institution initiates a root cause analysis and action group to examine the event (RCA2). What are the required components of an RCA2?","o":["Identifying incident to be analyzed","Formulation of a root cause contributing factor (RCCF) statement","Development of corrective action items","All of the above"],"k":"D","x":"All of the above steps are components of an RCA2. The first step and cornerstone of an RCA2 is identifying errors and determining which of the reported events are candidates for an RCA2. Typically, problems that have the highest risk of causing patient harm are the ones that are deemed most worthy of undergoing RCA2. After identifying an appropriate case, a team must be organized to perform the RCA2. The ideal team consists of varied medical and administrative members with diverse skillsets and backgrounds. Once a team has been assembled, the next step is generating case-specific instruments (flow diagram, event story map, and cause-effect diagram), which will then allow contributing factors to be clearly identified. This allows the formulation of a root cause contributing factor (RCCF) statement. Once refined, the RCCF statement then allows correct action items to be developed. The outcomes from these corrective action items must then be noted and reported and all “loops closed.” Thus, all these answer choices are components of an RCA2. PAGES 3880-3881","bn":4},{"n":5,"s":"Morbidity and mortality (M&M) conferences have long been used to help identify and prevent future adverse medical events. Which of the below answer choices has been identified as a potential technique to improve the quality of these conferences?","o":["Renaming the conference (ie, Patient Safety and Quality Improvement Conference)","Have a well-respected physician from department lead the conference","Requiring attendance by all physicians in the department","All of the above"],"k":"D","x":"All of the above have been recommended techniques to improve the quality of M&M/PSQI conferences. Making the conference mandatory for all providers and having the conference led by arespected member of the department provide the conference with a degree of legitimacy. Additionally, renaming the conference to reflect its true purpose, such as calling it a “Patient Safety and Quality Improvement” (PSQI) conference, is also important. Other important factor includes ensuring members of the conference feel safe from retaliation and humiliation, as this makes providers more willing to participate. Presenters should be held responsible for their actions but not for system , and members of the conference should ask themselves if the same events would have occurred if they were caring for the patient. Given the importance of M&M/PSQI conference, members should constantly look for ways to modify and improve the conference. PAGE 3880","bn":5},{"n":6,"s":"Medical malpractice suits can be avoided by all of the following EXCEPT:","o":["Making sure all visits are “short and sweet”","Maintaining empathic communications with patients","A thorough consent process","An institutional safety-oriented patient care culture","Interspecialty communications regarding patient care"],"k":"A","x":"The following have been shown to help avoid medical malpractice suits: communication and empathy, thorough informed consent process, clear documentation, and a safety-oriented institutional culture. PAGES 3888-3891","bn":6},{"n":7,"s":"True or False: Changes to a previously written note in the patient chart may be made after a lawsuit is filed with the approval of the physician’s attorney.","o":["True","False"],"k":"B","x":"It is critical to remember also that there must be no alterations to the medical record after an adverse event or error or after a claim is made. Modern electronic medical record systems can track changes easily. Altering the medical record constitutes tampering with evidence and may result in a negative impact upon the defense of a medicolegal claim. PAGE 3891","bn":7},{"n":8,"s":"True or False: Communication of some details are best kept to yourself in a medical malpractice case. It is both understood and legally protected that you may hold back on having to tell your attorney “every little detail.”","o":["True","False"],"k":"B","x":"Communications with the risk and legal teams are considered protected communications. As such, full disclosure of events to the risk and legal teams is advised. Hiding information from one’s attorney does not help you in the long run. PAGE 3891","bn":8},{"n":9,"s":"The elements of an effective compliance program include:","o":["Oversight","Monitoring and auditing","Training and education","Communication and reporting mechanisms","All of the above"],"k":"E","x":"The seven elements of an effective compliance program include policies and standards, oversight, training and education, communication and reporting mechanisms, monitoring and auditing, enforcing standards though well-published disciplinary guidelines, and response to noncompliance and implementation of corrective action.","bn":9},{"n":10,"s":"A surgeon in practice at Lakes Regional Hospital for 8 years has just attended a course on medialization laryngoplasty. She wants to add this to her list of approved procedures. Which medical staff or credentialing mechanism is most appropriate to achieve this at this hospital?","o":["FPPE","OPPE","Letter from chair","Certification from course director","Nothing additional: her Board certification is sufficient"],"k":"A","x":"The Joint Commission requires at least two mechanisms for competency evaluation, as competency entails behavioral and technical skills. The first mechanism follows the initial hiring and is referred to as the Initial Focused Practitioner Performance Evaluation (FPPE). Following this initial FPPE (the initial medical staff appointment), there may be additional FPPE for new procedures as they are incorporated. PAGE 3892","bn":10},{"n":11,"s":"When performing a procedure at the same time as an E/M, the following modifier should be added to the E/M code:","o":["24","25","50","62"],"k":"B","x":"Examples of modifiers include: 25 (an attachment to an E/M code when a procedure is done at the same visit), 24 (patient seen for a new complaint during a global period for a previously performed surgery), 50 (procedure is being done on both sides), and 62 or 80 (more than one surgeon performed portions of the procedure). PAGE","bn":11},{"n":12,"s":"A new patient is defined as:","o":["A patient who has not been seen in the past year","A patient who has not been seen in the past 2 years","A patient who has not been seen in the past 3 years","A patient who has never been seen by the provider"],"k":"C","x":"A new patient is one who has not been seen by a provider of the same specialty or subspecialty within the same practice in the past 3 years. Specifically, this means a provider of the same specialty, with the same tax identification number, and not necessarily the same physical location. PAGE 3990","bn":12},{"n":13,"s":"All of the following are used to determine the code level for an E/M EXCEPT:","o":["The number and complexity of problems addressed","The amount and/or complexity of data to be reviewed","The risk of complications and/or morbidity or mortality","The amount of history obtained and physical examination performed"],"k":"D","x":"When determining the code level based on the level of medical decision-making, the critical elements are as follows: the number, acuity, and complexity of problems addressed; the amount and/or complexity of data to be reviewed and analyzed; and the risk of complications and/or morbidity or mortality of patient management. PAGE 3900","bn":13},{"n":14,"s":"Global period means:","o":["Postoperative care is not to be billed for the duration of the global period with the exception of a need to return to the operative room.","Office visits cannot be billed but related procedures can still be billed in the office with the use of a modifier.","Patients can still be billed for office visits but the amount will be reduced.","The patient cannot be billed during the global period without an exception."],"k":"A","x":"After a patient has surgery, it is typically recommended that the patient comes back to the office for postoperative visits. Often, the surgical code and the fees associated with this code include the postoperative care. This is called the global period. During the global period, most care provided to the patient for the same underlying condition is covered under the codes already submitted. PAGE 2901","bn":14},{"n":15,"s":"When selecting a surgical code, the following below is correct:","o":["Choose any code that is close to what you have performed.","If there is not a code that describes exactly what you did, you need to use an unlisted code.","If you perform something similar to another code, then you can pick that code but add a modifier when submitting it.","You are allowed to unbundle codes and use multiple codes to describe what you did even if there is a more specific code that describes what you did."],"k":"B","x":"In cases where a surgery significantly deviates from any established CPT code, an unlisted code is applied. It is important to not attempt to apply a code to a procedure if it is “like” or “similar” but differs in a foundational way. Unlisted codes are most commonly applicable to surgeries that are novel or are based on new technology that significantly defines the nature of the procedure. PAGE 3903","bn":15},{"n":16,"s":"Which one of the following is true when describing an optimal EHR system?","o":["EHR should always be client-server based.","EHR cannot be used for billing purposes.","EHR should provide secure patient communication.","EHR does not allow for prescription tracking."],"k":"C","x":"Optimal EHR systems feature secure patient communications, medication tracking, automated billing, appointment scheduling features, document scanning/filing, and physician orders and surgical booking. They can be client-server based or web based. PAGE 3910","bn":16},{"n":17,"s":"Which of the following best describes appropriate phone etiquette for office staff?","o":["Always use the speakerphone with patients.","Encourage patients to leave voicemail rather than talk with a live attendant.","Answer patient calls within three rings.","Under no circumstances divulge your name."],"k":"C","x":"Phone etiquette suggestions for phone office staff include the following: answer the call within three rings, immediately introduce yourself, speak clearly, only use speakerphone when necessary, actively listen and take notes, use proper language, remain cheerful, ask before putting someone on hold or transferring a call, be honest if you don’t know the answer, be mindful of your volume, and check for and respond to voicemails. PAGE 3907","bn":17},{"n":18,"s":"Which of the following is the most common ancillary service provided by otolaryngology practices?","o":["Audiology","Otolaryngic allergy","Vestibular testing","Point of care imaging"],"k":"A","x":"A survey of otolaryngologists from 2018 revealed that the most common ancillary services provided included audiology services (100%), vestibular testing (76%), and imaging studies (63%). PAGE 3913","bn":18},{"n":19,"s":"Indications for use and specifications for the examination and equipment for point of care ultrasonography (POCUS) have been developed by:","o":["American College of Surgeons (ACS)","American Academy of Otolaryngology-Head and Neck Surgery (AAO-HNS)","American Thyroid Association (ATA)","American Institute of Ultrasound Medicine (ATUM)"],"k":"D","x":"Indications for use and specifications of the POCUS and equipment have been developed collaboratively by the American Institute of Ultrasound Medicine (AIUM) and the American College of Radiology (ACR). POCUS training is offered through specialized hands-on courses by the American College of Surgeons (ACS), AAO- HNS, American Thyroid Association (ATA), and the American College of Endocrinologist (ACE). PAGE 3915","bn":19},{"n":20,"s":"The following principle should guide social media marketing efforts:","o":["Always include a patient name to posted patient photographs.","Review all information prior to sharing or posting on your account.","Link personal and professional profiles so patients can learn about their doctor.","Use social media to share the surgical complications of competitors."],"k":"B","x":"Practical suggestions for physicians who wish to engage in social media include the following: maintain patient privacy at all costs, separate personal and professional profiles, deidentify all patient information, examine the information you are sharing, control your photos, have a physician strategic plan for social media engagement, and err on the side of caution. PAGE 3912","bn":20},{"n":21,"s":"All of the following metrics are used for tracking performance of a billing department except:","o":["Charge entry lag","Time of service collection rate","Overhead of the practice","Days in accounts receivable"],"k":"C","x":"The performance of the billing department can be tracked by closely monitoring several metrics, such as Charge Entry Lag, Time of Service Collection Rate, and Days in Accounts Receivable. PAGE 3907","bn":21},{"n":22,"s":"Which of the following databases can be best described as an administrative, discharge-based database?","o":["Reg-ent","Veterans Affairs Surgical Quality Improvement Program (VASQIP)","National Readmissions Database (NRD)","Surveillance, Epidemiology, and End Results (SEER)"],"k":"C","x":"The National Readmissions Database (NRD) is an administrative database administered by the Healthcare Cost and Utilization Project. It is composed of all-payer patients and in its 2017 iteration contained information regarding approximately 36 million United States discharges. PAGE 3921","bn":22},{"n":23,"s":"Which of the following surgical clinical registries is considered the precursor to the National Surgical Quality Improvement Program (NSQIP)?","o":["NSQIP-Pediatric (NSQIP-P)","VASQIP","SEER","Nationwide Inpatient Sample"],"k":"B","x":"The NSQIP is predicated on the VASQIP, which was borne out of a 1986 US Congress mandate that that VA hospital system report its surgical outcomes such that they could be compared with national averages. The program led to such strong results that it was subsequently adopted on a nationwide scale as the NSQIP. PAGE 3924","bn":23},{"n":24,"s":"Which of the following characteristics best describes an advantage of administrative databases?","o":["Designed and maintained for purposes of research and quality improvement","Contain data that are manually extracted from the electronic medical record (EMR) by clinically oriented staff","Contain information that is granular and may be obtained independent of CPT or ICD codes","Contain geographically and demographically diverse patients that best simulate “real-world” settings"],"k":"D","x":"Administrative databases by their nature are not designed or maintained for the purposes of research and quality improvement, and the data within them is populated by billing or insurance-based staff. They are often dependent on ICD or CPT codes, which may diverge from what has actually transpired in a clinical setting. An advantage of administrative databases is that they contain massive stores of data across geographically and demographically diverse settings, thereby simulating “real-world” settings better than artificially contrived clinical registries. PAGES 3919-3920","bn":24},{"n":25,"s":"Which of the following clinical registries has been approved by the Centers for Medicare and Medicaid Services (CMS) as a Qualified Clinical Data Registry?","o":["Global Tracheostomy Collaborative (GTC)","National Inpatient Sample (NIS)","Reg-ent","National Surgical Quality Improvement Program"],"k":"C","x":"Reg-ent was approved for use as QCDR by CMS in 2017, meaning that it is a tool that has been federally approved to submit information on quality measures that can be used for the purposes of reimbursement on behalf of clinicians and health systems. PAGE 3923","bn":25},{"n":26,"s":"Which of the following clinical registries has historically yielded the most publications within the field of otolaryngology head and neck surgery?","o":["National Surgical Quality Improvement Program (NSQIP)","Surveillance, Epidemiology, and End Results (SEER)","National Inpatient Sample (NIS)","Global Tracheostomy Collaborative (GTC)"],"k":"B","x":"The NIS is an example of an administrative database. The NSQIP and GTC are examples of clinical registries; however, research utilizing the SEER database has thus far yielded a much higher volume of publications than any other mentioned registry. PAGE 3920","bn":26},{"n":27,"s":"Which of the following would be considered “telemedicine”?","o":["An otologist reviews an audiogram, tympanogram, and images of the tympanic membrane sent by an audiologist and responds with an opinion on the treatment of a patient’s hearing loss.","A VTC (videoteleconference) occurs between a patient and a physician to evaluate fluctuating voice changes.","An otolaryngology nurse practitioner reviews a video clip sent by parents of a child with loud snoring. A phone conversation with the parents follow, and a treatment plan is documented in the electronic chart.","All of the above."],"k":"D","x":"Telemedicine, broadly defined, utilizes technology to enhance communication and provides services over a distance. All the choices above would fit that definition. PAGE 3931","bn":27},{"n":28,"s":"Emerging Direct to Consumer technologies","o":["Pose unacceptably high risks for HIPAA violations.","Require extremely expensive software putting it out of reach for most consumers.","Can allow for a blending of VTC and S&F that is initiated by the consumer.","Requires camera technology that is not widely available."],"k":"C","x":"Direct to consumer telemedicine technologies and applications use widely available and increasingly affordable hardware and software solutions to allow consumers to directly access their health care providers. These technologies allow for a blending of synchronous Interactive Video Teleconferencing (VTC), asynchronous store-and-forward (S&F). PAGES 3933-3934","bn":28},{"n":29,"s":"In the field of otology, telemedicine can be used for:","o":["Self-administered hearing screening","Post ear tube follow-up","Assessment of pathologic conditions of the tympanic membrane","All of the above"],"k":"D","x":"Telemedicine allows for the acquisition and transfer of tympanic membrane images, audiograms, tympanograms, and more recently self-administered hearing assessments. A wide range of otologic care can be provided or initiated with telemedicine. PAGES 3934-3937","bn":29},{"n":30,"s":"In the field of audiology, telemedicine","o":["Has no role in hearing aid fittings and follow-up","Offers options for vestibular assessment, rehabilitation, and balance training","Is limited due to the fact that automated pure tone air and bone testing correlated poorly with that obtained manually","Provided through smart phone applications shows little promise for hearing screening and diagnostic testing"],"k":"B","x":"Telemedicine offers exciting promise in audiology. Hearing and vestibular assessment and rehabilitation, cochlear implantation, and remote hearing aid programing are all active areas of investigation and use. PAGES 3938-3939","bn":30},{"n":31,"s":"The COVID-19 pandemic of 2020 led to which of the following temporary changes?","o":["An increase in the number of reimbursable services","Waived restrictions on geographic locations of both provider and consumer","Enforcement discretion of HIPAA privacy rules","All of the above"],"k":"D","x":"The COVID-19 pandemic of 2020 temporarily removed many of the financial and regulatory barriers that have held back the widespread adoption and use of telemedicine. PAGES 3939-3940","bn":31},{"n":32,"s":"Which of the following is not a characteristic of a high-reliability organization or system?","o":["Common aims","Feedback loops","Inherent unpredictability","Longer cycle time"],"k":"D","x":"Characteristics of such high-reliability systems include many variables, the most pertinent to otolaryngology include an understanding that (a) common aims are essential, (b) outstanding systems are created from outstanding elements, (c) complex systems are inherently unpredictable, (d) feedback loops improve performance, (e) standardization improves function for repetitive processes, (f) standardization is the only baseline, (g) shortened cycle time improves function, (h) system features should be driven by system goal, (i) human error is ubiquitous, (j) respect for persons improves systems performance, and (k) strong constructive leadership is essential. PAGES 3949-3950","bn":32},{"n":33,"s":"A classic model for a QI initiative is called the PDSA. What does the “S” stands for?","o":["Survey","Study","Statistics","Simple"],"k":"B","x":"A basic and classic model for a QI initiative is the PDSA cycle. This involves the steps of (P)lanning an intervention, (D)oing the intervention, (S)tudying the impact of the intervention, and (A)cting to improve the outcomes further. This iterative cycle is one of the most basic QI tools and has been successfully applied in myriad ways in our specialty. PAGE 3950","bn":33},{"n":34,"s":"Every health system is required to assess physician performance with regard to six core competencies defined by the Joint Commission, the American Board of Medical Specialties, and the American Council for Graduate Medical Education. Which of the following is NOT one of the core competencies?","o":["Patient care","Ethical decision-making","Practice-based learning","Interpersonal skills and communication"],"k":"B","x":"Starting in 2008, every health system was required to assess physician performance with regard to the six core competencies defined by the Joint Commission, the ABMS, and the American Council for Graduate Medical Education. Previously, these six areas of assessment were utilized solely in the assessment of house officers, but the Joint Commission has now extended these requirements to every physician on a hospital’s medical staff. Called the OPPE, the core areas measured are Medical/Clinical Knowledge, Patient Care, Interpersonal Skills and Communication, Practice-Based Learning, Professionalism, and System-Based Practice. While ethical decision-making is an important aspect of physician competency, it is not one of the six core competencies and is likely to span several, if not all, of these six competencies. PAGE 3949","bn":34},{"n":35,"s":"Per the National Institute of Health (NIH), conflict-of-interest guidelines require disclosure of financial support that exceeds which dollar amount (including stock ownership, speaking fees, and consulting fees)?","o":["$500","$1,000","$5,000","$10,000"],"k":"C","x":"Highlighting the importance of proper disclosure to avoid conflicts of interest, in 2012, the National Institutes of Health (NIH) implemented the first major overhaul of conflict of interest guidelines in over a decade. Old standards triggered financial reporting at $10,000. The new guidelines require disclosure of support that exceeds $5,000. This includes reporting stock ownership, speaking fees, consulting arrangements, and other financial relationships with foundations or industry. PAGE 3956","bn":35},{"n":36,"s":"According to the Patient Protection and Affordable Care Act, industry must report any payment or gift to a physician greater than what amount?","o":["$5","$10","$50","S100"],"k":"B","x":"As a dual check on reporting, the Patient Protection and Affordable Care Act, commonly known as Obamacare, included a “sunshine” provision, which mandated that industry report to a public government database, Open Payments, any payment, or gift to a physician greater than $10. PAGE 3956","bn":36},{"n":37,"s":"True or False: A speaker at an upcoming otolaryngology continuing medical education (CME) conference is presenting on outcomes of a device for which she receives consulting fees. She can present if she submits presentation/slides in advance for review.","o":["True","False"],"k":"A","x":"Valid CME disclosure typically pertains to salary, royalties, intellectual property rights, consulting fees, honoraria, ownership interest, stock options, employment or management positions, speaking fees, consulting fees, or advisory panel, review panel, or board memberships. If such a relationship is identified, it is still valid for a speaker to deliver content at a CME meeting as long as the presentation and/or slides are reviewed in advance by a person who is impartial. The validation process generally includes reviewing the literature cited to make sure it is objective, surveying the presented information to assure balance, and assessing the presentation to assure that it is nonpromotional. PAGE 3958","bn":37},{"n":38,"s":"On the International Committee of Medical Journal Editors (ICMJE) standard form for disclosure and potential conflicts of interest, financial activities outside of the submitted work must be disclosed if they occurred within how many months prior to submission?","o":["12","24","36","48"],"k":"C","x":"The International Committee of Medical Journal Editors (ICMJE) has adopted a standard form for disclosure, formally referred to as “ICMJE Form for Disclosure of Potential Conflicts of Interest.” Section 3 of this form probes financial activities outside of the submitted work, including relationships present during the 36 months prior to the actual submission. This includes board memberships, consultancies, employment, expert testimony, grants, payment for lectures, payment for manuscript preparation, payment for developing educational presentations, stock options, travel accommodations and meeting expenses, or other. PAGE 3953","bn":38},{"n":39,"s":"Which nasal sinus means “form of a sieve”?","o":["Ethmoid","Maxillary","Frontal","Sphenoid"],"k":"A","x":"Ethmoid comes from the Greek word ethmos meaning sieve. Sphenoid also is of Greek origin meaning “form of a wedge.” PAGE 3963","bn":39},{"n":40,"s":"This cranial nerve is named after the Latin word for pulley","o":["CN III (oculomotor)","CN IV (trochlear)","CN V (trigeminal)","CN VI (abducens)"],"k":"B","x":"Trochlea means pulley in Latin. CN IV innervates the superior oblique muscle—muscle origin is lesser wing of sphenoid and ends in a tendon that passes through a fibrous loop resembling a pulley before attaching to the eye. Trigeminal refers to triplets (V1, V2, and V3), while abducens translates to “lead away from,” consistent with the function of the lateral rectus. PAGE 3964","bn":40},{"n":41,"s":"Which of the following Latin words means “anvil?”","o":["Malleus","Incus","Stapes","Umbo"],"k":"B","x":"The wide body of the incus with acute angle formed by short crus resembles an anvil. It is struck by hammer (malleus) and then strikes the stirrup (stapes) in the transmission of mechanical vibrations. PAGE 3965","bn":41},{"n":42,"s":"Which Greek letter does hyoid refer to?","o":["Theta","Sigma","Beta","Upsilon"],"k":"D","x":"The U-shaped configuration of the hyoid bone contrasts that of the cricoid (“ring”) cartilage. PAGES 3966-3967","bn":42},{"n":43,"s":"Which of the following facial reference points is a Latin variation of “bald”?","o":["Glabella","Pogonion","Trichion","Radix"],"k":"A","x":"The glabella, the smooth, bald region between eyebrows, comes from glabrum, meaning bald in Latin. By contrast, trichion from the Greek thriks meaning hair. PAGE 3966","bn":43},{"n":44,"s":"The following physician is at the greatest risk for suicide:","o":["Female physician in emergency medicine","Male orthopedic surgeon","Female pediatrician","Male cardiologist","Male anesthesiologist"],"k":"E","x":"Based on Dr. Pam Wible’s database of 1,477 suicides she has followed for the past 8 years, anesthesiologists are the most likely to commit suicide followed by surgeons, then emergency medicine. Overall, male physicians are more likely to commit suicide than female physicians, and the use of a firearm is the most common method. PAGES 3971-3972","bn":44},{"n":45,"s":"Which of the following is not a key component of the ACGME mandated well-being component in the Common Programs requirement for all training programs?","o":["Educating residents and faculty on the topics of burnout, depression, and substance abuse in self and others","Mandatory training on nutrition and personal fitness with routine assessments of personal habits","Evaluating the safety of residents and faculty in their work environment","Availability and access to confidential and affordable mental health counseling and treatment, including access to urgent and emergent care, 24 hours a day, 7 days a week","Establishing policies and programs supporting optimal resident and faculty well-being, including opportunities to attend appointments for personal care, including during work hours"],"k":"B","x":"While the ACGME section VLC. outlines many requirements that must be fulfilled by training programs, it does not provide direction or details on “how” to teach trainees and faculty on optimizing individual well-being from all areas including emotional, physical, and mental health perspectives. PAGE 3973","bn":45},{"n":46,"s":"Which of the following has been shown by research on how physical activity and exercise can optimize individual mental health?","o":["Physical activity stimulates the release of dopamine, norepinephrine, and serotonin, which enhance mood and emotional regulation.","Physical activity allows one to consume more calories.","Those who exercise are not at risk for burnout.","Exercise leading to weight loss protects against mental health problems.","It is enough to be a “weekend warrior” since physicians simply do not have time to work out during the busy work week."],"k":"A","x":"Physical activity stimulates release of neurotransmitters. When neurotransmitters become unbalanced, we may experience depression and anxiety (serotonin); sloth, anger, and lack of motivation (dopamine); panic attacks, stress, and inability to calm down (GABA); heart problems, burnout, and intolerance to exercise (noradrenaline); and memory and focus problems (acetylcholine) (https://medium.com/publishous/fixing-your-brain-a-guide-to-balancing-neurotransmitters-72649aab40b1). PAGE 3976","bn":46},{"n":47,"s":"Which of the following statement is TRUE regarding physician burnout and well-being?","o":["“Wellness” and “well-being” are synonymous.","Physicians who are more resilient or have greater mental toughness do not experience “burnout.”","Burnout and well-being are inversely proportional, that is, a physician who is not in high degree of burnout has optimized their well-being.","Minimizing the individual experience of “burnout” and optimizing individual “well-being” are multifactorial and may be defined differently for each individual. Achieving both requires awareness and solutions on both the individual and system levels.","The longer a physician practices medicine, the higher their risk of experiencing burnout."],"k":"D","x":"Not every physician will experience high degree of burnout while everyone may be at risk. Those with history of depression, anxiety, and/or trauma from various experiences are at greater risk. “Well-being” for every individual may be different, but what is similar is the critical awareness and acceptance that self-care, self-compassion, and investing time and energy in all components of well-being and wellness must come first, ahead of patients and loved ones. PAGE 3971","bn":47},{"n":48,"s":"Which of the following is the most helpful to feel energized in all dimensions (physical, emotional, mental, and spiritual?)","o":["Drink coffee (or a caffeinated/energy drink, that is, soda, at least three times per day, and as needed anytime you feel sluggish.","Sleep at least 8 to 10 hours every night.","Make sure you eat meals and small snacks throughout the day to maintain blood glucose stability, and when feeling sluggish take 5 to 10 minutes to stretch, make large or small physical movement to increase circulation, along with taking many deep breaths.","Watch stimulation videos on Facebook/Twitter/Instagram/ YouTube and all other social media channels.","Purchase several “stress relief Dammit dolls,” keep in your office, clinic, and also give several to colleagues and use as often as needed on daily basis."],"k":"C","x":"Eat for energy and use physical movement to immediately increase energy. While choice “e” may be helpful, the author owned 3 Dammit dolls and found that “c” is a much better and effective way to feel energized. You get bonus point if you also chose “e.” PAGES 3975-3976","bn":48},{"n":49,"s":"Which of the following teaching methods provides an opportunity for participants to reflect on their experiences at the conclusion of a simulated teamwork scenario?","o":["Rapid cycle deliberate practice","Debriefing","Feedback","Morbidity and mortality conference"],"k":"B","x":"Debriefings occur at the conclusion of teamwork scenario simulations, offering opportunities to address both medical and teamwork principles. Feedback and rapid cycle deliberate practice typically occur during the simulation. Morbidity and mortality conferences take place weeks to months after a clinical event has occurred. PAGES 3989-3990","bn":49},{"n":50,"s":"The best method to identify latent safety threats is:","o":["In situ simulation","Task training","Participation in Resident boot camps","Simulations in ad hoc simulation centers"],"k":"A","x":"Jn situ simulations occur in actual patient care spaces and often incorporate actual patient care teams and equipment. In situ simulation allows testing of health care delivery systems and identification of latent safety threats such as lack of readily available equipment. PAGES 3986-3988","bn":50},{"n":51,"s":"Which of the following is not an application of simulation in otolaryngology?","o":["Junior resident education in high-stakes procedures","Improving education in resource-limited regions","Evaluating for process errors in hospital workflow","Assessment of safety of otolaryngologist during American Board of Otolaryngology — Head and Neck Surgery examination"],"k":"D","x":"Although simulation is currently being utilized by anesthesiology in board examinations, this has not yet been adapted in otolaryngology, head and neck surgery. PAGE 3989.","bn":51},{"n":52,"s":"What characteristic of a simulator best describes its realism?","o":["Cost","Technologic enhancement","Fidelity","Validation"],"k":"C","x":"Simulator fidelity describes how closely a simulator represents an actual human or portion of a human. PAGE 3983.","bn":52},{"n":53,"s":"When a simulation is used for assessment, what type of validity helps to differentiate novices from experts?","o":["Face","Construct","Predictive","Content"],"k":"B","x":"Construct validity describes the ability of a trainer to measure what it was intended to measure, such as discriminating between novice and expert participants based on performance. Face and content validity describe the realism of the simulation. Predictive validity describes the transfer of skills to patient care. PAGE 3990","bn":53},{"n":54,"s":"Which of the following cognitive heuristics is present when a surgeon ignores CT scan results that do not agree with his or her assessment of the patient’s condition?","o":["Actor-observer bias","Outcome bias","Confirmation bias","Anchoring"],"k":"C","x":"Confirmation bias is the tendency to place undue or disproportionate weight on data that support a preexisting hypothesis. Individuals tend to seek, and attend to, information that fits with their understanding of a situation; they tend to avoid or discount data that argue against their hypothesis. PAGE 3994","bn":54},{"n":55,"s":"An otolaryngologist-head and neck surgeon reports that she is late to clinic due to heavy traffic. Later in the day, a patient arrives late to his clinic appointment, and the surgeon attributes his lateness to neglecting his own health. Which of the following cognitive heuristics is present?","o":["Actor-observer bias","Outcome bias","Confirmation bias","Anchoring"],"k":"A","x":"In negative situations, we tend to treat our own actions and decisions differently than others. We typically blame our decisions on the situation or other external factors, while we blame others’ decisions on their intrinsic characteristics and motivations. In other words, in Actor-Observer Bias, we interpret decisions and actions different when we are the actor versus when we are the observer. PAGE 3995","bn":55},{"n":56,"s":"Where does an individual develop their implicit biases?","o":["Society","Family","Culture","Childhood friends","All of the above","None of the above"],"k":"E","x":"Implicit bias is simply the use of heuristics or cognitive associations to impute characteristics to individuals or groups of people. As with cognitive biases, these heuristics may create error by leading the mind to inappropriately assess the probability that an individual has a certain trait. Implicit biases are likely a result of associations learned from one’s society, family, and culture; they are detectable even in early childhood. PAGE 3997","bn":56},{"n":57,"s":"What are some mitigation strategies for implicit bias?","o":["Emphasis on shared decision-making","Intentional perspective-taking","Counterstereotypic training","Taking responsibility for each patient as an individual","All of the above","None of the above"],"k":"E","x":"As with cognitive biases, increased awareness and “debiasing” are important steps in mitigating the effects of implicit bias on clinical care. These efforts may include greater emphasis on shared decision-making, intentional perspective-taking to avoid actor-observer bias effects related to implicit bias and to increase empathy, deliberate counterstereotypic training through study of positive examples drawn from a given identity group, and taking responsibility for each patient as an individual. Most likely a combined approach is necessary, but individual providers cannot easily make the structural and social changes necessary to reduce implicit bias across the health care system. Medical education must certainly be involved, and hospital and university leaders must actively demonstrate investment. PAGE 3998","bn":57},{"n":58,"s":"Which of the following describe the components of informed consent, assuming that the patient is competent?","o":["Disclosure, discussion, understanding","Disclosure, understanding, decision","Empathy, discussion, understanding","Discussion, deliberation, decision"],"k":"B","x":"The key components of informed consent, assuming the patient has been deemed competent, are (1) disclosure of the diagnosis and treatment options available, which should include risks, benefits, and alternatives; (2) patient understanding of this information; and (3) patient decision, which is voluntary. PAGES 4005-4006","bn":58},{"n":59,"s":"Determining a person’s capacity to make medical decisions requires which of the following?","o":["Clinical examination and interview","Mini-mental status examination","Ethics consultation","Legal guardianship"],"k":"A","x":"Medical decision-making capacity can be determined by a single clinician who has performed an interview and examination. Formal testing is not required. Capacity is a clinical determination not a moral or legal one. PAGE 4006","bn":59},{"n":60,"s":"Using the criteria of “beginning, middle, and end” to help a patient understand their illness trajectory is an example of which of the following ethical frameworks?","o":["Principlism","Narrative ethics","Ethics of care","Virtue ethics"],"k":"B","x":"Narrative ethics uses the elements of storytelling, reading, and writing to help describe and make sense of patient experience. Ethics of Care focuses on relationships. Virtue Ethics focuses on identity and character. Principlism focuses on moral principles. PAGES 4002-4003","bn":60},{"n":61,"s":"Emulating a respected role model because “she is a good person” is an example of which of the following ethical frameworks?","o":["Principlism","Narrative ethics","Ethics of care","Virtue ethics"],"k":"D","x":"Virtue ethics places most importance on the inherent character of a person and encourages the development of good character by emulating good role models. Narrative ethics emphasizes literary explanatory models. Ethics of care emphasizes relationships. Principlism focuses on moral principles. PAGE 4003","bn":61},{"n":62,"s":"The most effective way to control for unconscious bias is to:","o":["Assume that members of the same ethnic group have similar biases","Associate biases with systemic racism","Enact standards of behavior that account for discriminatory biases","Make people aware of their biases without judgement"],"k":"D","x":"Awareness of biases enables people to correct for actions that may be discriminatory. General assumptions and regulations are less effective. Stigmatizing unconscious biases with the label of “racism” can be counterproductive. PAGES 4008-4009","bn":62}]}];
const L='ABCDEF';
let S={sel:new Set(DATA.map((_,i)=>i)),order:'book',list:[],pos:0,ans:{},multiPick:{}};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const id=(c,n)=>c+'-'+n;
function home(){
  document.body.querySelector('.nav')?.remove();
  const total=[...S.sel].reduce((a,c)=>a+DATA[c].q.length,0);
  $('#app').innerHTML=`<h1>Bailey otolaryngology review</h1><p class="sub">${DATA.reduce((a,c)=>a+c.q.length,0)} questions across ${DATA.length} sections, in book wording with the book's key and explanations (with Cummings page references). Pick sections, then start.</p>
  ${DATA.map((c,i)=>{const done=c.q.filter(q=>S.ans[id(i,q.n)]).length;return `<button class="chap ${S.sel.has(i)?'on':''}" onclick="tog(${i})" aria-pressed="${S.sel.has(i)}"><b>${c.t}</b>${done?`<span class="done">${done} done</span>`:''}<span>${c.q.length}</span></button>`}).join('')}
  <div class="row"><div class="seg" role="group" aria-label="Order"><button class="${S.order=='book'?'on':''}" onclick="S.order='book';home()">Book order</button><button class="${S.order=='shuf'?'on':''}" onclick="S.order='shuf';home()">Shuffled</button></div>
  <div class="seg"><button onclick="S.sel=new Set(DATA.map((_,i)=>i));home()">All</button><button onclick="S.sel=new Set();home()">None</button></div></div>
  <button class="primary" ${total?'':'disabled'} onclick="start()">Start ${total} questions</button>
  ${Object.keys(S.ans).length?`<div class="row"><button class="ghost" style="flex:1" onclick="results()">See results so far</button><button class="ghost" style="flex:1" onclick="if(confirm('Clear all answers?')){S.ans={};home()}">Clear answers</button></div>`:''}
  <p class="note" style="margin-top:18px">Answers are kept while this page is open. Tap any figure to enlarge.</p>`;
  scrollTo(0,0);
}
function tog(i){S.sel.has(i)?S.sel.delete(i):S.sel.add(i);home()}
function start(list){
  if(!list){list=[];[...S.sel].sort().forEach(c=>DATA[c].q.forEach(q=>list.push([c,q.n])));
    if(S.order=='shuf')for(let i=list.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[list[i],list[j]]=[list[j],list[i]]}}
  S.list=list;S.pos=0;const f=list.findIndex(([c,n])=>!S.ans[id(c,n)]);if(f>0)S.pos=f;show();
}
function score(){let a=0,r=0;S.list.forEach(([c,n])=>{const x=S.ans[id(c,n)];if(x){a++;if(x.ok)r++}});return{a,r}}
function show(){
  const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const A=S.ans[id(c,n)];const {a,r}=score();
  const pick=S.multiPick[id(c,n)]||new Set();
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="home()" aria-label="Back to sections">Sections</button><span class="t">${DATA[c].t}</span><span class="sc">${r}/${a}</span></div><div class="bar"><i style="width:${(S.pos+1)/S.list.length*100}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${S.list.length} &nbsp;·&nbsp; Book Q${q.bn||n}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${n}" onclick="zoom(this.src)">`).join('')}</div>`;
  if(q.m)h+=`<p class="note">More than one answer. Select all that apply, then check.</p>`;
  q.o.forEach((t,i)=>{const l=L[i];let cl='';
    if(A){if(q.k.includes(l))cl='ok';else if(A.pick.includes(l))cl='bad'}else if(pick.has(l))cl='sel';
    h+=`<button class="opt ${cl}" ${A?'disabled':''} onclick="choose('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(q.m&&!A)h+=`<button class="primary" style="margin-top:6px" ${pick.size?'':'disabled'} onclick="check()">Check answer</button>`;
  if(A){h+=`<div class="exp"><h3 class="${A.ok?'ok':'bad'}">${A.ok?'Correct':'Incorrect'} — answer ${q.k.split('').join(', ')}</h3>`;
    if(q.f)h+=`<div class="flag">${esc(q.f)}</div>`;
    h+=q.x.split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('');
    if(q.xi)h+=q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join('');
    h+=`</div>`}
  $('#app').innerHTML=h;
  let nav=document.querySelector('.nav');if(!nav){nav=document.createElement('div');nav.className='nav';document.body.appendChild(nav)}
  const last=S.pos==S.list.length-1;
  nav.innerHTML=`<div class="navi"><button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Jump</button><button class="primary" onclick="${last?'results()':'go(1)'}">${last?'Finish':'Next'}</button></div>`;
  scrollTo(0,0);
}
function choose(l){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);if(S.ans[k])return;
  if(q.m){const p=S.multiPick[k]||new Set();p.has(l)?p.delete(l):p.add(l);S.multiPick[k]=p;const y=scrollY;show();scrollTo(0,y);return}
  S.ans[k]={pick:[l],ok:l==q.k};const y=scrollY;show();scrollTo(0,y)}
function check(){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);const p=[...S.multiPick[k]].sort().join('');
  S.ans[k]={pick:p.split(''),ok:p==q.k};const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(S.list.length-1,S.pos+d));show()}
function grid(){const d=$('#dlg');
  d.innerHTML=`<b>Jump to question</b><div class="grid">${S.list.map(([c,n],i)=>{const a=S.ans[id(c,n)];return `<button class="${a?(a.ok?'g-ok':'g-bad'):''} ${i==S.pos?'g-cur':''}" onclick="S.pos=${i};$('#dlg').close();show()">${i+1}</button>`}).join('')}</div><button class="ghost" style="width:100%;margin-top:8px" onclick="$('#dlg').close()">Close</button>`;
  d.showModal()}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
function results(){
  document.querySelector('.nav')?.remove();
  let rows='',ta=0,tr=0,wrong=[];
  DATA.forEach((c,ci)=>{let a=0,r=0;c.q.forEach(q=>{const x=S.ans[id(ci,q.n)];if(x){a++;if(x.ok)r++;else wrong.push([ci,q.n])}});
    ta+=a;tr+=r;if(a)rows+=`<tr><td>${c.t}</td><td>${r}/${a} · ${Math.round(r/a*100)}%</td></tr>`});
  $('#app').innerHTML=`<h1>Results</h1><div class="big">${ta?Math.round(tr/ta*100):0}%</div><p class="sub">${tr} correct of ${ta} answered</p>
  <table>${rows||'<tr><td>No answers yet</td><td></td></tr>'}</table>
  ${wrong.length?`<button class="primary" onclick="redo()">Retry ${wrong.length} incorrect</button>`:''}
  <div class="row"><button class="ghost" style="flex:1" onclick="home()">Back to sections</button></div>`;
  S.wrong=wrong;scrollTo(0,0)}
function redo(){S.wrong.forEach(([c,n])=>{delete S.ans[id(c,n)];delete S.multiPick[id(c,n)]});start(S.wrong.slice())}
