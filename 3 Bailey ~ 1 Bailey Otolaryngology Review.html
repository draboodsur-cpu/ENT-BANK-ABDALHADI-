7. PAGE 1473","bn":61},{"n":62,"s":"What is the most common source of dysphonia in the pediatric population?","o":["Recurrent respiratory papillomatosis (RRP)","Unilateral vocal fold motion impairment","Vocal fold nodules","Vocal fold polyps"],"k":"C","x":"Vocal fold nodules are the most common benign laryngeal lesion leading to dysphonia in children. They are present in up to 60% of pediatric patients with hoarseness. Vocal fold nodules are phonotraumatic lesions related to voice use patterns. PAGE 1475","bn":62},{"n":63,"s":"Selective laryngeal reinnervation is achieved by creating a neuronal connection between which two anatomic structures?","o":["Ansa cervicalis and recurrent laryngeal nerve","Phrenic nerve and posterior cricoarytenoid","Hypoglossal nerve and recurrent laryngeal nerve","Ansa cervicalis and posterior cricoarytenoid"],"k":"A","x":"The recurrent laryngeal nerve is sutured to the unilateral (or contralateral in select cases) ANSA cervicalis nerve. PAGE 1470","bn":63},{"n":64,"s":"Laryngeal webs are commonly associated with which genetic abnormality?","o":["Chiari II malformation","CHARGE syndrome","22q11.2 deletion syndrome","Down syndrome"],"k":"C","x":"Congenital webs are caused by failed resorption of epithelium and recanalization of the laryngotracheal lumen, which typically occurs during the 8 weeks of embryogenesis. An important association for patient with congenital webs is the common association with 22q11.2 deletion syndrome or velocardiofacial syndrome. PAGE","bn":64},{"n":65,"s":"Which cause of pediatric dysphonia has a characteristically worse voice than would be expected based on in-office videostroboscopy?","o":["Unilateral vocal fold motion impairment","Vocal fold cyst","Posterior glottic insufficiency","Congenital laryngeal web"],"k":"C","x":"In-office assessment of the posterior glottis can be challenging due to hooding of the arytenoids necessitating a formal airway assessment in the operating room. PAGE 1481","bn":65},{"n":66,"s":"How have indications for pediatric tracheotomy evolved in the past 30 years?","o":["There has been an increase in children undergoing tracheotomy for management of acute airway obstruction related to infectious airway diseases.","There has been an increase in children undergoing tracheotomy for issues related to prolonged ventilation for patients with chronic lung and neuromuscular diseases.","Treatment of pulmonary toilet issues has become the most common indication for tracheotomy in children.","It has been recognized that it is imperative to proceed with tracheotomy placement for infants who will be endotracheally intubated for more than 1 to 2 weeks."],"k":"B","x":"Compared with the 1980s, there has been a decrease in tracheotomies for infectious diseases, prolonged intubation, and short-term airway management and an increase in the incidence of the procedure for prolonged ventilation related to prematurity and chronic lung disease, congenital anomalies, and neuromuscular disease. PAGE","bn":66},{"n":67,"s":"Which is true regarding surgical technique when performing pediatric tracheotomy?","o":["Horizontal tracheotomy incision is preferred in infants.","Right and left “stay sutures” are infrequently placed by surgeons who perform tracheotomy in young children.","Surgeons who mature the stoma during tracheotomy procedures feel that this step may decrease significant morbidity if there is an accidental decannulation.","Stoma maturation has been shown to increase rates of postoperative complications, including development of stomal granulation and persistent tracheocutaneous fistulae."],"k":"C","x":"Studies suggest that maturation of the stoma may decrease the morbidity of early accidental decannulation, making it easier to replace the tracheostomy tube in this case. This practice does not appear to increase rates of tracheocutaneous fistula after decannulation. PAGES 1490-1491","bn":67},{"n":68,"s":"Postoperatively, which of the following is true regarding care of pediatric tracheotomy patients?","o":["Patients are usually monitored on a general medical/surgical floor in the immediate postoperative period.","Acquired pressure wounds from the tracheostomy tube and/ or ties are expected and typically cannot be prevented.","Caregiver education on both daily and emergency tracheostomy care is a critical prior to discharge for a child who has undergone tracheotomy.","There is agreement among surgeons who perform pediatric tracheotomy that early elective airway endoscopy should be performed in all patients."],"k":"C","x":"It is important for any caregiver who will be involved in the tracheostomy patient’s care to understand both routine and emergency skills. Different types of educational programs have been described and are effective in the teaching of these caregivers. PAGE","bn":68},{"n":69,"s":"Which of the following is true regarding complications of pediatric tracheotomy?","o":["Early (within the first 7 days) postoperative complications are common; however, after healing, later complications are rare and tend to be mild.","Tracheostomy tube-related complications, such as tracheostomy tube plugging, are more commonly seen in older children than in infants.","Patients with tracheostomy tubes rarely require readmission after the initial surgical period.","Prior to considering tracheostomy decannulation in a pediatric patient, the airway should be evaluated to ensure that there is no area of obstruction that would prevent successful decannulation."],"k":"D","x":"Complete airway evaluation (awake and sedated) should be performed to ensure that there is no obstruction from the stoma to the oral cavity that might prevent decannulation. Types of obstruction include vocal fold immobility, subglottic stenosis, suprastomal obstruction from granulation tissue or cartilaginous collapse, supraglottic collapse, and tonsillar hypertrophy. PAGE 1501","bn":69},{"n":70,"s":"When discussing the option of tracheotomy with caregivers, which of the following should be discussed about communication and swallowing in children with tracheostomy?","o":["Use of a speaking valve with a tracheostomy tube is a good option in many children to both allow for vocalization and improve swallowing function.","Children with tracheostomy tubes should not attend school and should instead have home instruction only.","Swallowing function and oral feeding is not affected by the presence of a tracheostomy tube.","There is no association between speech and language development and tracheostomy tube status."],"k":"A","x":"Use of a one-way valve that attaches to the tracheostomy tube forces air through the glottis on exhalation, which allows for vocalization and restores subglottic pressures to near-normal. This restoration of subglottic pressures may also help improve swallowing function. PAGES 1502-1503","bn":70},{"n":71,"s":"What is the primary mechanism of tissue injury for acidic caustic ingestion?","o":["Liquefactive tissue necrosis","Thermal burn","Systemic poisoning","Coagulative tissue necrosis"],"k":"D","x":"Acidic agents result in coagulation necrosis. A coagulum or eschar forms on the mucosa, preventing deep tissue penetration and decreasing the rate of esophageal burn. PAGE 1509","bn":71},{"n":72,"s":"What is the primary mechanism of button battery injury when lodged inside the body?","o":["Leakage of electrolytes","Pressure","Alkaline, liquefactive tissue necrosis","Thermal injury"],"k":"C","x":"Button battery ingestion results in a rapid alkaline caustic injury that leads to saponification and liquefactive tissue necrosis of the esophagus. The resulting liquefaction necrosis causes disintegration of the mucosa, denaturing of proteins, blood vessel thrombosis, and subsequent penetration of the agent into the surrounding tissues, further propagating the injury. Injury occurs quickly with alkaline ingestion. PAGE 1515","bn":72},{"n":73,"s":"A button battery can be most reliably distinguished from a coin on x-ray based on which of the following radiographic characteristics?","o":["Measured diameter alone","Double ring or halo sign","Visible imprint from code engraved on battery","Absence of a jagged edge"],"k":"B","x":"The most consistent feature of button battery (BB) ingestion is the double ring or halo seen with zooming in on chest x-ray to differentiate it from a coin. PAGE 1515, Figure 98.6","bn":73},{"n":74,"s":"Prior to esophageal button battery removal, mitigation strategies of honey or sucralfate should be considered within how many hours of known or suspected ingestion?","o":["12 hours","15 hours","18 hours","24 hours"],"k":"A","x":"Honey and/or sucralfate can be administered orally to patients from the time of ingestion until BB removal, and if time of ingestion is less than 12 hours (no honey should be given to patients <1 year of age). PAGE 1516","bn":74},{"n":75,"s":"After esophageal button battery removal in the operating room, 50 to 150 mL of what solution is recommended for mucosal irrigation to help neutralize tissue pH?","o":["Sterile water","Sterile 0.9% normal saline","Sterile 0.25% acetic acid","Sucralfate"],"k":"C","x":"After BB removal, in the absence of obvious perforation or fistula, the esophagus should be irrigated with 50 to 150 mL 0.25% sterile acetic acid solution to neutralize residual alkali substances and help prevent progression of tissue damage. This sterile, medical-grade solution can be obtained from most hospital pharmacies, and it is commercially available. PAGE 1516","bn":75},{"n":76,"s":"Which human papillomavirus (HPV) subtypes are responsible for 90% of laryngeal infections in RRP?","o":["HPV types 16 and 18","HPV types 31 and 33","HPV types 6 and 11","HPV types 9 and 12","All of the above"],"k":"C","x":"HPV 6 and 11 are responsible for 90% of RRP and are classified as low risk. Types 16, 18, 31, and 33 have oncogenic potential. PAGE 1524","bn":76},{"n":77,"s":"Which site is not a common aerodigestive site for RRP infection?","o":["Nasopharyngeal surface of soft palate","Limen vestibuli","Undersurface of vocal folds","Laryngeal surface of epiglottis","Cervical esophagus"],"k":"E","x":"Although it may occur, the cervical esophagus is not a common location for RRP. Other common aerodigestive sites include the carina, bronchial spurs, and upper and lower margins of the ventricle. PAGE 1525","bn":77},{"n":78,"s":"Which of the following statements is not true about RRP epidemiology?","o":["RRP may occur at any age.","RRP is most often diagnosed in children 7 to 10 years of age.","Younger patients often have persistent disease.","Vaccination has had a profound impact in reducing the incidence of RRP.","None of the above."],"k":"B","x":"RRP is most often diagnosed in children 2 to 4 years of age. Younger patients at diagnosis have persistent disease and require more surgical interventions. Recent evidence suggests that vaccination has reduced RRP from 0.16 per 100,000 to 0.02 per 100,000 children in Australia. Similar results have been reported by the Center for Disease Control and Prevention. PAGE 1526","bn":78},{"n":79,"s":"Which of the following tools is not used in the endoscopic management of RRP?","o":["CO₂ laser","Pulse dye laser","Neodymium-doped yttrium aluminum garnet (ND:YAG) laser","Potassium titanyl phosphate laser","Microdebrider","Coblator"],"k":"C","x":"All but the ND:YAG laser has been shown to be effective in removing RRP. Technique can depend upon surgeon preference, skill, and experience. PAGE 1530, Table 99.2","bn":79},{"n":80,"s":"Intralesional cidofovir is recommended for which patients and at what concentration?","o":["Both children and adults requiring surgery less than every 2 months; 7.5 mg/mL","All patients at the onset of surgical intervention; 4 mg/mL","Only children less than 2 years of age with vestibule involvement; 1 mg/mL","To prevent recurrence when there is evidence of surgical improvement; 3 mg/mL","None of the above"],"k":"A","x":"Intralesional cidofovir is recommended in children and adults who require surgery at 2-month intervals or less, are experiencing decreasing intervals between surgery, or have extralaryngeal spread. The standard concentration is 7.5 mg/mL with doses not to exceed 40 mg/kg in adults and 3 mg/kg in children. PAGE","bn":80},{"n":81,"s":"Case: A 2-year-old male presents to your office with a 1-year history of snoring, witnessed apneas, hyperactivity, and loud mouth breathing when awake. His past medical history is notable for trisomy 21. On physical examination of his oropharynx, you see the following: (Reproduced with permission from P. Marazzi/Photo Researchers, Inc.) What would you consider the next step in the care of this patient?","o":["Polysomnogram (PSG)","Pulse oximetry at night","Observation for 6 months","Adenotonsillectomy (AT) at an outpatient surgery center"],"k":"A","x":"Overnight, in-laboratory PSG is the gold standard for diagnosing OSA in children. Evaluation of children with OSA should include a history and physical examination. Although this evaluation is important, history and physical examination alone are rarely sufficient to diagnose OSA. Prolonged wait times and poor availability of pediatric sleep laboratories for overnight PSG have prompted a search for alternative diagnostic screening tools. These tools typically include a combination of history and physical examination findings, but none have been found to be sufficient to predict OSA. Children with OSA should be closely monitored postoperatively for hypoxemia and hypercarbia, because they are at greater risk for complications compared with healthy children. Because of an increased risk of perioperative complications, postoperative admission and observation are recommended for children in the following groups: age younger than 3 years, severe OSA, cardiac complications of OSA, failure to thrive, obesity, prematurity, recent respiratory infection, neuromuscular or craniofacial disorders, Down syndrome, mucopolysaccharidoses, mation: the total apnea/hypopnea index was 11.2 per hour. Of this, the central apnea index was 0, the obstructive apnea index was 1.0, the mixed apnea index was 0, and the hypopnea index was 10.2. The random eye movement apnea hypopnea index (AHI) was 13.2 per hour. The respiratory disturbance index including all apneas, hypopneas, and respiratory effort-related arousals was 11.2 events per hour. Based on the sleep study results, what would you recommend as the next step in the management of this patient?","o":["AT at an outpatient surgery center","Pulse oximetry at night","Observation for 6 months","AT with overnight admission"],"k":"D","x":"Practice guidelines from the AAP and American Academy of Otolaryngology—Head and Neck Surgery (AAO-HNS) both recommend AT as primary therapy for OSA in healthy children older than age 2 years. AT has been reported to reduce daytime OSA symptoms and improve secondary outcomes of behavior, quality of life, and PSG findings, even in children who are not complete responders. Because of an increased risk of perioperative complications, postoperative admission and observation are recommended for children in the following groups: age younger than 3 years, severe OSA, cardiac complications of OSA, failure to thrive, obesity, prematurity, recent respiratory infection, neuromuscular or craniofacial disorders, Down syndrome, mucopolysaccharidoses, and sickle cell disease. PAGE 1555, Reference: Baugh RF, et al. Clinical practice guideline: tonsillectomy in children. Otolaryngol Head Neck Surg. 2011;144(1 Suppl):S1-S30.","bn":82},{"n":83,"s":"The patient is planning to proceed with an AT. Which of the following is an important part of the preoperative discussion?","o":["No discussion needed","Verbal and written information on posttonsillectomy care prior to the day of surgery","Prescription for postoperative antibiotics should be provided to the family","Try to talk them out of surgery and only recommend continuous positive airway pressure"],"k":"B","x":"Patient and caregiver education and counseling on posttonsillectomy care should include verbal and written information prior to the day of surgery, and clinicians should reinforce postoperative instructions on the day of surgery. Education interventions for patients and their caregivers should focus on increasing their knowledge on how to assess pain and achieving adequate pain management utilizing pharmacologic and nonpharmacologic interventions. A Cochrane review of 10 randomized controlled trials suggests that antibiotics do not reduce pain, the need for pain medication, or bleeding. In the pooled analyses, antibiotics had no impact on rates of secondary bleeding (of any severity; seven trials) or on significant secondary bleeding (requiring readmission, blood transfusion, or return to the operating room; three trials). PAGE 1557","bn":83},{"n":84,"s":"The patient had an uneventful AT and 6 months after the surgery, the parents reported that he continued to have snoring after the initial first month of improvement. Which of the following could be considered the next best step in managing this patient?","o":["Repeat PSG","Observation only","Revision adenoidectomy","Hyoid suspension"],"k":"A","x":"An in-laboratory, nighttime PSG remains the gold standard for diagnosis of OSA both before and after AT. PAGE 1569","bn":84},{"n":85,"s":"The patient’s repeat sleep study is noted to have the following information: the total apnea/hypopnea index was 10.2 per hour. The cadence of the respiratory events was in keeping with the VNS firing. Of this, the central apnea index was 0, the obstructive apnea index was 0.5, the mixed apnea index was 0, and the hypopnea index was 9.2. The random eye movement AHI was 13.2 per hour. The respiratory disturbance index including all apneas, hypopneas, and respiratory effort-related arousals was 11.2 events per hour. Based on the sleep study results, what would you recommend as the next step in the management of this patient?","o":["Observation only","Hyoid suspension","Drug-induced sleep endoscopy","Over-the-counter allergy medication"],"k":"C","x":"An attended, in-laboratory, nighttime PSG remains does not provide information on the site of obstruction, direct further therapies, or predict which children would benefit from surgical and/or medical interventions for persistent OSA. Continuous positive airway pressure is a widely accepted therapy for persistent OSA but is often poorly tolerated in children, with 50% or fewer adherent to therapy. PAGE 1553","bn":85},{"n":86,"s":"What percentage of children have obstructive sleep apnea (OSA)?","o":["Less than 1%","1.2% to 5.7%","5% to 10%","Greater than 10%"],"k":"B","x":"OSA affects about 1.2% to 5.7% and reported higher if diagnosed based upon history alone. PAGE 1562","bn":86},{"n":87,"s":"Which population does not have an increased risk of residual OSA s/p AT?","o":["Obese","Black","Syndromic","Caucasian"],"k":"D","x":"The high-risk groups for having residual OSA in the early-AT group were black patients, obese patients, and patients with a preoperative AHI of greater than 4.7 events per hour. PAGE 1562","bn":87},{"n":88,"s":"Which is not a daytime symptom of sleep-disordered breathing in children?","o":["Tics","Attention deficit","Irritability","Poor school performance"],"k":"A","x":"The two main categories of neurobehavioral impairment in children are behavioral and cognitive deficits. Behavioral symptoms include irritability, aggression, impulsivity, and hyperactivity. Cognitive symptoms include deficits in executive function, attention, and language. Hypersomnolence is present in some children with OSA; however, it is more commonly seen in adolescent and adult patients. PAGE 1564","bn":88},{"n":89,"s":"What is the correct definition of mild, moderate, and severe OSA severity in children in terms of the obstructive apnea-hypopnea index score?","o":["5 to 15, 15 to 30, greater than 30","1 to 5, 5 to 10, greater than 10","1 to 10, 10 to 20, greater than 20","1 to 5, 5 to 15, greater than 15"],"k":"B","x":"Current research definitions for OSA commonly define mild OSA when obstructive AHI is between | and less than 5 events per hour, moderate OSA if the AHI is 5 to less than 10, and severe OSA when the AHI is greater than 10. PAGE 1566","bn":89},{"n":90,"s":"Which was not a finding of the childhood AT trial study?","o":["AT was 79% successful.","Forty-seven percent of children in the watchful waiting group had spontaneous resolution of their OSA at 7 months.","Risk factors for residual postoperative OSA were obesity, Black race, and an AHI greater than 4.7 events per hour.","The surgical group had greater improvement in neurocognitive attention and executive function."],"k":"D","x":"The childhood AT trial study found the attention and executive function score on the Developmental Neuropsychological Assessment, did not differ significantly between the early-AT group and the watchful-waiting group. However, there were significantly greater improvements in behavioral, quality-of-life, and polysomnographic findings and significantly greater reduction in symptoms in the early-AT group compared to the watchful-waiting group. PAGE 1568","bn":90},{"n":91,"s":"Which of the following is an indication for PSG in the pediatric population?","o":["Down syndrome","Nasal septal deviation","ASD","Current tracheostomy"],"k":"A","x":"Current guidelines by the American Academy of Otolaryngology-Head and Neck Surgery recommend a referral for a PSG prior to AT in all children under 2 years of age and/or those with obesity, Down syndrome, craniofacial abnormalities, neuromuscular disorders, sickle cell disease, or mucopolysaccharidoses. Other indications for PSG include situations in which the need for surgery is uncertain or when there is disagreement between the physical examination and the severity of symptoms. PAGE 1566","bn":91},{"n":92,"s":"Which of the following is an indication for overnight observation following AT?","o":["Attention deficit/hyperactivity disorder","Less than 3 years of age","Postoperative snoring","Periodic fever, aphthous stomatitis, pharyngitis, adenitis"],"k":"B","x":"Postoperative overnight observation is recommended for children younger than 3 years of age, those with severe OSA, cardiac complications associated with OSA, failure to thrive, obesity, a current respiratory infection, craniofacial anomalies, or neuromuscular disorders. Overnight observation should also be considered for children with behavioral factors that may predispose them to poor oral intake and/or difficultly with pain control. PAGE 1577","bn":92},{"n":93,"s":"Which of the following is an effective nonsurgical therapy for pediatric OSA?","o":["Oral steroids","Modafinil","Leukotriene inhibitors","Topical oxymetazoline"],"k":"C","x":"Nasal steroids and oral leukotriene modifiers, such as montelukast, are effective medical therapies for the primary treatment of mild pediatric OSA and have also been shown to have benefit for persistent OSA following AT. Other effective, nonsurgical therapies for pediatric OSA include weight loss, oral appliance therapy, and positive airway pressure. PAGE 1567","bn":93},{"n":94,"s":"Which of the following is a risk factor for persistent OSA following AT?","o":["Attention deficit/hyperactivity disorder","Down syndrome","Epilepsy","Sickle cell disease"],"k":"B","x":"Risk factors for persistent OSA following AT include obesity, older age at the time of surgery, severe disease prior to surgery, asthma, craniofacial anomalies, and Down syndrome. PAGE","bn":94},{"n":95,"s":"Which of the following is not a known cause of velopharyngeal insufficiency (VPI)?","o":["Cleft palate","Cerebral palsy","Postadenoidectomy","Apraxia","Postseptoplasty"],"k":"E","x":"Septoplasty is not known to cause VPI. Although septal perforations may rarely occur, they do not cause VPI. Cerebral palsy is a neuromuscular source of VPI. Motor programming difficulties known as apraxia can affect time of closing the velopharyngeal port. Cleft palate by nature causes VPI. Rarely a postadenoidectomy can cause VPI especially in the setting of a submucous cleft. PAGE 1596, Table 103.1","bn":95},{"n":96,"s":"The gold standard for diagnosing VPI is:","o":["Video nasal endoscopy","Multiplanar video fluoroscopy","Perceptual evaluation by experienced speech pathologist","Presence of fog on nasal mirror during vocalistic consonants"],"k":"C","x":"The gold standard for the diagnosis of VPI is perceptual speech evaluation by an experienced SLP. Although nasal emission and mirror fog may occur with VPI, this is part of the SLP evaluation for diagnosis. Similarly, once VPI is diagnosed by SLP, instrumental assessment can be performed to describe degree and pattern of VPI. PAGE 1597","bn":96},{"n":97,"s":"Multiple procedures are used to improve VPI. The procedure of choice made is based upon which two important factors?","o":["Posterior pharyngeal bulk, length of palate","Length of palate, gap size","Levator veli palatini position, gap size","Lateral pharyngeal contracture, levator veli palatini position"],"k":"C","x":"The surgical algorithm for treating VPI depends upon the levator palatini position and the size of the velopharyngeal gap; based upon nasendoscopy results. For example, small or moderate gaps are managed by Furlow palatoplasty if the levator veli palatini is in the sagittal orientation. PAGE 1600, Figure 103.4","bn":97},{"n":98,"s":"Which of the following are key factors that influence the effectiveness of sphincter pharyngoplasty augmentation?","o":["The width of the recipient site mucosal defect","The musculature included in the flap","The degree of flap overlap","The cephalocaudal position of the neosphincter","All of the above"],"k":"E","x":"All these variables contribute to the flexibility and customizability of the sphincter pharyngoplasty. PAGE 1602","bn":98},{"n":99,"s":"Which of the following is not a surgical technique proposed to improve VPI?","o":["Furlow palatoplasty","Double-opposing buccal flap","Lateral wall augmentation","Posterior wall augmentation","Sphincter pharyngoplasty"],"k":"C","x":"Lateral wall augmentation has not been proposed as a technique to improve VPI. PAGES 1602-1604","bn":99},{"n":100,"s":"What is the best first-line antibiotic choice to treat a child with acute bacterial rhinosinusitis?","o":["Amoxicillin","Amoxicillin/clavulanate","Levofloxacin","Linezolid"],"k":"B","x":"M. catarrhalis and H. influenzae have high rates of B-lactamase. For these reasons, amoxicillin/clavulanate over amoxicillin is the first-line treatment for acute bacterial sinusitis. Levofloxacin or linezolid (in combination with cefixime) may be considered for patients who are allergic to penicillin. PAGE 1609","bn":100},{"n":101,"s":"A 15-year-old male is brought to the emergency room by his family for altered mental status. His parents describe symptoms of nasal congestion and drainage over the preceding few days. A brain MRI with and without contrast is obtained and shows an epidural fluid collection and erosion of the posterior table of the frontal sinus. What is the best initial treatment?","o":["Observation","Oral antibiotics","IV antibiotics","Surgical drainage"],"k":"D","x":"Intracranial extension of sinusitis is a serious complication and should be promptly addressed. This patient’s presentation is concerning for an epidural abscess originating from the frontal sinus. Surgical drainage followed by a course of antibiotics is the best treatment. PAGE 1615","bn":101},{"n":102,"s":"What bacteria is more likely to be cultured from the sinuses of a patient with cystic fibrosis (CF) with chronic rhinosinusitis (CRS) compared to a non-CF patient with CRS?","o":["Streptococcus. pneumoniae","Haemophilus influenzae","Pseudomonas aeruginosa","Moraxella catarrhalis"],"k":"C","x":"Patients with CF are at higher risk for colonization from bacteria including P. aeruginosa and Staphylococcus aureus. The remaining three bacteria are responsible for most cases of acute and CRS. PAGE 1615","bn":102},{"n":103,"s":"A 9-year-old female presents to the clinic with 2 weeks of fever, irritability, nasal congestion, and nasal drainage. Her mom describes a similar episode 2 years ago for which she was given antibiotics. On examination, purulent nasal drainage is present. What is the best diagnosis?","o":["Acute bacterial sinusitis","Viral upper respiratory tract infection","Recurrent acute bacterial sinusitis","Chronic rhinosinusitis"],"k":"A","x":"Given the duration of symptoms longer than 10 days, this patient’s symptoms are more consistent with acute bacterial sinusitis than a viral upper respiratory tract infection. Recurrent acute bacterial sinusitis involves four or more episodes per year with complete symptom resolution between episodes. CRS involves symptom duration for > 12 weeks. PAGE 1608","bn":103},{"n":104,"s":"An 11-year-old female with CRS continues to have significant symptoms affecting her quality of life despite multiple medical interventions. What is the most appropriate first-line surgical treatment for this patient?","o":["In-office balloon sinuplasty","Bilateral maxillary antrostomy, anterior ethmoidectomy","Adenoidectomy","Tonsillectomy and adenoidectomy"],"k":"C","x":"Adenoidectomy is considered the first-line surgical intervention for pediatric patients with CRS who have failed medical management under 12 years of age. Balloon sinuplasty is a relatively recent intervention with inconclusive data published about its effectiveness in treating CRS as an isolated procedure. Functional endoscopic sinus surgery may be considered if her symptoms persist after adenoidectomy. Tonsillectomy is not used to treat CRS. PAGE","bn":104},{"n":105,"s":"Eosinophils noted on nasal cytology would be seen in which of the following conditions?","o":["Gustatory rhinitis","Vasomotor rhinitis","Nonallergic rhinitis with eosinophils syndrome","Fungal sinusitis"],"k":"C","x":"Nonallergic rhinitis with eosinophils syndrome is a subtype of nonallergic rhinitis distinguished by the presence of increased numbers of eosinophils on cytology of nasal secretions. PAGE 1619","bn":105},{"n":106,"s":"A 5-year-old child with allergic rhinitis and mild intermittent asthma is started on a new medication for these conditions. A few weeks after starting the medication, his parents notice changes in his mood and behavior. They call his provider and the medication is stopped. Which medication was the likely cause of these side effects?","o":["Montelukast","Cetirizine","Fluticasone furoate","Ipratropium bromide"],"k":"A","x":"Montelukast has a black box warning regarding severe behavioral and mood changes that can be seen after starting the medication and should be stopped immediately should this occur. PAGE 1622","bn":106},{"n":107,"s":"A 15-year-old male is currently on sublingual immunotherapy (SLIT) tablets for treatment of his grass pollen allergic rhinitis. At his follow-up visit, he reports new abdominal pain and difficulty swallowing over the past month. Diagnosis of what condition should lead to discontinuation of SLIT.","o":["Gastroesophageal reflux","EOE","Achalasia","Pill esophagitis"],"k":"B","x":"EOE has been reported as a potential side effect of SLIT. Patients that develop EoE while on SLIT should stop this therapy. Likewise, SLIT should not be used in patients who already have a diagnosis of EoE. PAGE 1623","bn":107},{"n":108,"s":"A patient with which of the following food allergies is least likely to outgrow it over time?","o":["Egg","Cow’s milk","Wheat","Hazelnut"],"k":"D","x":"Tree nuts have the lowest likelihood of resolution with time, with only 9% of patients outgrowing their tree nut allergy. PAGE 1624","bn":108},{"n":109,"s":"An 8-month-old boy with a history of recurrent acute otitis media (AOM), pneumonia secondary to S. pneumonia, and gastroenteritis due to Giardia infection is found to have undetectable immunoglobulins and severely low levels of peripheral B cells. This child most likely has which immunodeficiency?","o":["Chronic granulomatous disease","X-linked agammaglobulinemia","Hyper IgE syndrome","Leukocyte adhesion defect"],"k":"B","x":"X-linked agammaglobulinemia is a primary immunodeficiency characterized by absence or very low levels of immunoglobulins and B cells secondary to a mutation in the BTK gene on the X chromosome. Clinically, these patients can present with recurrent respiratory and gastrointestinal bacterial infections. PAGE","bn":109},{"n":110,"s":"An intercarotid distance less than what value is considered a contraindication to endonasal approaches to the sella?","o":["0.5 cm","1cm","1.5 cm","2cm"],"k":"B","x":"Traditionally, 1 cm has been used as a cutoff for the minimum intercarotid distance that allows access to the sella with adequate room for dissection. PAGE 1640","bn":110},{"n":111,"s":"As compared to pituitary adenomas in the adult population, which statement best reflects the incidence of pediatric pituitary adenoma?","o":["Pediatric pituitary adenomas are found to be functional adenomas more often than adult pituitary adenomas.","Pediatric pituitary adenomas are found to be functional adenomas less often than adult pituitary adenomas.","Pediatric pituitary adenomas are found to be functional adenomas with the same frequency as adult pituitary adenomas.","None of the above."],"k":"A","x":"Pediatric pituitary adenomas are much more likely than adult pituitary masses to be secreting tumors. Reports estimate that 89.5% to 95% of adenomas are secreting in the pediatric age group with corticotrophinomas (adrenocorticotropic hormone-secreting) being the most common. PAGE 1635","bn":111},{"n":112,"s":"A 5-year-old child presents with a sellar and suprasellar mass extending lateral to the carotid and optic nerves on the right with extension into the partially pneumatized (presellar pneumatization pattern) sphenoid sinus. Imaging findings are consistent with craniopharyngioma. What would be the best approach(es) to achieve gross total resection or near total resection of this tumor?","o":["Open cranio-orbito-zygomatic approach on the left","Endonasal trans-sellar and transplanum approach","Combined open cranio-orbito-zygomatic and endonasal trans-sellar and transplanum approach","Frontal craniotomy"],"k":"C","x":"Given the extension of this tumor lateral to the carotid and optic nerves, EEA is unlikely to be able to achieve gross total resection and an open approach (such as cranio-orbitozygomatic) is needed. The sellar and suprasellar midline portions of the tumor are still best approached endonasally, thus the need for combined approach. PAGE 1640","bn":112},{"n":113,"s":"Which subtype of craniopharyngioma is more prevalent in the pediatric population and how is it thought to develop?","o":["Papillary craniopharyngioma—arising from cellular metaplasia or mutation","Adamantinomatous craniopharyngioma—developing from remnants of Rathke pouch","Papillary craniopharyngioma—developing from remnants of Rathke pouch","Adamantinomatous craniopharyngioma—arising from cellular metaplasia or mutation"],"k":"B","x":"Adamantinomatous craniopharyngiomas arise from Rathke pouch and are the most common subtype found in children. Adult craniopharyngiomas are thought to arise from metaplasia or mutation of fully differentiated adult cells. PAGE 1635","bn":113},{"n":114,"s":"True or False. Pediatric endonasal skull base surgery has been shown to impede facial growth.","o":["True","False"],"k":"B","x":"While initially a concern with the EEA approach, there has been no evidence of facial growth disruption to date. PAGE","bn":114},{"n":115,"s":"An otherwise healthy 18 months old is referred to you for drooling. The parent is very concerned about having to change bibs 5 times a day and wipe the mouth at least 7 times a day. What is the best approach in this case?","o":["Offer bilateral submandibular gland excision and parotid duct ligation.","Refer to a behavior therapy program.","Parental reassurance.","Initiate an anticholinergic medication to decrease the alorrhea."],"k":"C","x":"This is likely to improve spontaneously in a healthy child. Development of saliva control is part of normal child development, and as such drooling is a normal physiologic condition seen in children until maturation and social awareness are achieved. In a large cohort, 3% to 15% of the typically developing preschoolers were still drooling to a certain extent at 4 years of age. PAGE 1652","bn":115},{"n":116,"s":"An 11-year-old child with a newly diagnosed left parotid mass. What imaging characteristics would most support a diagnosis of pleomorphic adenoma?","o":["Flow voids","T2 isointense lesion with smooth borders","T2 hyperintense lobulated mass","Fluid-fluid levels on T2-weighted imaging"],"k":"C","x":"Classic imaging findings suggesting a diagnosis of pleomorphic adenoma include hyperintense signal on T2-weighted MRI. PAGE 1650","bn":116},{"n":117,"s":"Ina normally developing healthy preschooler presenting to you with drooling, constant mouth breathing, and snoring at night, the best initial management to help with the drooling is:","o":["Parental reassurance","Bilateral submandibular gland excision and parotid duct ligation","Pharmacotherapy to decrease the sialorrhea","Nasal fiberoptic endoscopy and treatment of the etiology of nasal obstruction"],"k":"D","x":"As mouth breathing can also be an important contributor, potential sites of nasal pathology should be addressed before intervening on salivary flow. These include adenoid hypertrophy, allergic rhinitis, turbinate hypertrophy, nasal blockage. PAGE 1653","bn":117},{"n":118,"s":"A healthy 4-year-old child is referred to you for recurrent bilateral parotitis. He has had similar episodes, 5 times already this year, all treated with antibiotics by his primary care physician. On examination, there is no purulent secretions. You decide to perform an elective sialoendoscopy. What is the most likely finding intraoperatively?","o":["A parotid lithiasis","Severe sialorrhea","White ductal wall appearance with scarce vascularity in the ductal lumen along with some fibrinous debris","Ductal erythema and frank purulence"],"k":"C","x":"In juvenile recurrent parotitis, typical findings on sialoendoscopy reveal white ductal wall appearance with scarce vascularity in the ductal lumen along with stenosis and fibrinous debris/ mucous plugs. PAGE 1657","bn":118},{"n":119,"s":"A 2-year-old male presents to the clinic after having been seen in the emergency department for sudden swelling on the right side of his face after a upper respiratory infection. An MRI at the time identified a macrocystic cervicofacial lymphatic malformation involving the right parotid gland. Genetic testing performed on tissue obtained from this lesion would be most likely to show which of the following?","o":["Gain-of-function PIK3CA gene mutation","MAML2 rearrangement","NMyc gene amplification","BRAF mutation"],"k":"A","x":"Gain-of-function somatic mutations in the PIK3CA gene have been implicated in most ventral head and neck lymphatic malformations. PAGE 1648","bn":119},{"n":120,"s":"A 12-year-old child presents to the clinic with a history of intermittent, unilateral swelling in the right upper neck associated with ipsilateral pain, every time he eats. The most likely diagnosis is:","o":["Right parotid lithiasis","A 3-mm stone in Warthin’s duct","Sjégren syndrome","Recurrent parotitis of childhood"],"k":"B","x":"In children, sialolithiasis of the submandibular gland is more common than parotid sialolithiasis. Common symptoms include intermittent, unilateral swelling in the affected gland with ipsilateral pain, mostly associated with meals. PAGE 1657","bn":120},{"n":121,"s":"During preoperative discussions with the family of a child with a large parotid mass, the parents ask about the potential for additional therapy. Which of the following salivary gland neoplasms is most likely to require adjuvant radiotherapy following surgical resection?","o":["Intermediate grade mucoepidermoid carcinoma","Acinic cell carcinoma","Adenoid cystic carcinoma","Papillary cystadenoma lymphomatosum"],"k":"C","x":"Though the role of radiotherapy is not well established in most salivary gland malignancies, according to NCCN guidelines, it should be considered for patients with adenoid cystic carcinoma. PAGE 1651","bn":121},{"n":122,"s":"You are consulted in the emergency department for an otherwise healthy 12-month-old boy. His mother reports he was diagnosed with an ear infection 3 days ago by his pediatrician and was started on amoxicillin. However, he has continued to have persistent fevers, irritability, and pulling of his left ear. On examination, the patient’s pinna and mastoid appear normal without tenderness or edema. The left tympanic membrane is bulging with purulent middle ear effusion. A CT scan was performed prior to your arrival, which demonstrates complete opacification of the mastoid air cells and middle ear space, without bony erosion. What do you recommend?","o":["Change antibiotic to amoxicillin/clavulanate","Myringotomy","Admit for IV antibiotics","Cortical mastoidectomy and tympanostomy tube placement"],"k":"A","x":"This patient has failed first-line antibiotic therapy. Therefore, changing his antibiotic to a beta-lactamase inhibitor is recommended. The mastoid is opacified but without bony erosion so does not meet criteria for acute mastoiditis. PAGE 1668","bn":122},{"n":123,"s":"A father brings his 4-year-old daughter to your clinic for a routine follow-up after tympanostomy tube placement 6 months prior. She did have an episode of right ear drainage 4 weeks ago that resolved with antibiotic drops. She currently has no complaints. Right tympanometry shows a flat pattern with a large ear canal volume. Which of the following is most likely given the tympanometry results?","o":["Persistent AOM","Patent tympanostomy tube","Extruded tympanostomy tube with healed tympanic membrane","Insufficient seal of the tympanometry device to the ear canal"],"k":"B","x":"The tympanogram is a graph of the acoustic energy of the reflected tone (immittance) admitted to the tympanic membrane and middle ear in response to air pressure introduced to the ear canal. Acoustic energy is transmitted to the ear canal, and an internal microphone measures the reflected sound while the pressure is varied from negative to positive. The effect on middle ear function can then be recorded graphically. A flat or rounded pattern (TW >350 daPa) with a small ear canal volume indicates a middle ear effusion, while a flat pattern with a large ear canal volume suggests a perforation or a patent tympanostomy tube. In a normal air-filled middle ear with equal pressure on both sides of the TM, the peak pressure of the tympanogram is 0 daPa. PAGE 1667","bn":123},{"n":124,"s":"A 12-year-old boy is brought into the clinic by his mother and father for concerns for ear fullness and difficulty hearing on both sides. He is otherwise healthy, and denies fevers, pain, or vertigo. He describes ear fullness, like he is “hearing underwater.” On 512-Hz tuning fork examination, Weber is midline, and bone conduction is greater than air conduction bilaterally. Otoscopy shows patent external auditory canals (EACs), intact tympanic membrane, and bilateral yellowish clear middle ear effusions. Which of the following is true regarding this condition?","o":["Bacterial biofilms have a major role in pathogenesis.","A bacterial pathogen is identified in most middle ear effusions in those with otitis media with effusion (OME).","When patients are symptomatic, they typically complain of vertigo.","Tympanometry is helpful in differentiating an infectious from noninfectious cause."],"k":"A","x":"The patient’s presentation is most consistent with OME. The pathogenesis of OME appears to be the result of a variety of inciting events involving inflammation and tissue hyperplasia, with bacterial biofilms playing a major role. Biofilms consist of bacterial cells within a biopolymer matrix, which provides a potential means of antimicrobial resistance and can create a communicating system in which nutrients and other biological materials can be shared. Biofilms of H. influenzae, S. pneumoniae, M. catarrhalis, and S. aureus have been identified in the nasopharynx of children with “chronic otitis media” (recurrent AOM and/or OME), and it has been suggested that the biofilm may act as a reservoir for bacterial pathogens resistant to antibiotics. It is this suspected association for which the mechanical debridement of nasopharyngeal biofilms may explain the observed clinical benefit associated with adenoidectomy in subsets of pediatric patients. PAGE 1663","bn":124},{"n":125,"s":"The parents of a 3-year-old boy are considering tympanostomy tube placement for OME that has lasted 6 months. In counseling the family, what will you tell them is the most common sequela of placing tympanostomy tubes?","o":["Persistent perforation","Bleeding","Cholesteatoma","Purulent otorrhea"],"k":"D","x":"While tympanostomy tubes are generally well tolerated, the most common tube-related sequela is otorrhea. This can be seen in approximately 16% of children within 4 weeks of surgery and 26% of children at any time the tube remains in place (mean, 12 to 14 months). Complications include an obstructed tube lumen in 7% of intubated ears, premature extrusion of the tube in 4%, and tube displacement into the middle ear in 0.5%. The posttympanostomy tube sequela most likely to require surgical intervention is persistent perforation, which occurs in about 2% to 3% of children. PAGE 1670","bn":125},{"n":126,"s":"You are seeing a 4-year-old girl in clinic, 2 years after successful right-sided cochlear implantation. She has no complaints. On otoscopy, you notice that she has an intact tympanic membrane on the right, with a serous effusion. The patient has no history of AOM or prior effusions. What do you recommend?","o":["CT scan of the temporal bones","Course of amoxicillin/clavulanate","Placement of tympanostomy tube","Follow-up to ensure resolution of the effusion"],"k":"D","x":"AOM in children with cochlear implants has increased potential for severe complications and should be treated appropriately with antibiotics. However, a serous effusion in an ear with a previously implanted device does not warrant antibiotic use, provided it remains uninfected. Tympanostomy tube placement can be considered in a patient with a cochlear implant and a history of recurrent ear infections or persistent effusions. PAGE 1669","bn":126},{"n":127,"s":"What percentage of children born with genetic hearing loss are born to parents with normal hearing?","o":["25%","50%","70%","90%"],"k":"D","x":"If cytomegalovirus testing is negative, a genetics evaluation is recommended, especially if the hearing loss is bilateral. PAGE 1674, https://www.who.int/news-room/fact-sheets/detail/ deafness-and-hearing-loss","bn":127},{"n":128,"s":"When is the most optimal time for urine or saliva screening for congenital cytomegalovirus (CMV)?","o":["Less than 3 weeks","Less than 6 weeks","Less than 12 weeks","Within 1 year"],"k":"A","x":"Collection within the first 3 weeks of life aids in avoiding the potential confounding results from a postnatal infection. Postnatal infection is not associated with hearing loss. A saliva sample tends to be much easier to collect than urine, but a positive result can be confounded by breastmilk contamination. PAGE 1680","bn":128},{"n":129,"s":"What are the risk factors that warrant repeat hearing screen between 24 and 30 months?","o":["External ear deformity: preauricular pit/tag","| day in the NICU","Born at 37 weeks","Family history of ear infections","None of the above"],"k":"E","x":"Children with indicators of progressive or delayed-onset hearing loss should be referred for an audiologic assessment at least once by 24 to 30 months of age. Children with risk indicators that are highly associated with delayed-onset hearing loss, having received extracorporeal membrane oxygenation, or having congenital CMV infection, should have more frequent audiologic assessments. PAGE 1677, Table 109.4","bn":129},{"n":130,"s":"What is the most common cause of failure of newborn hearing screening?","o":["Cerumen or other fluid in the EAC","Otitis media with effusion","Mild-to-moderate sensorineural hearing loss","Severe-to-profound sensorineural hearing loss"],"k":"B","x":"There is no known percentage of patients who fail newborn hearing screening due to OME, but it is one of the most common causes of failure, and all babies who fail the newborn screen should be assessed for middle ear disease. Most babies (~85%) have bilateral OME if it is present. PAGE 1676","bn":130},{"n":131,"s":"What is the volume of normal peak compliance in a type A tympanogram?","o":["0.5 mL","1.0 mL","1.5 mL","2.0 mL"],"k":"C","x":"Type A tympanograms, which represent normal middle ear function, should have a normal peak compliance of approximately 1.5 mL. Type B tympanograms, which are flat or show significantly reduced peak compliance, can be indicative of middle ear effusion, increased stiffness of the eardrum from scarring, tympanosclerosis, cholesteatoma, or middle ear tumor. Type C tympanograms demonstrate negative pressure of the middle ear and are indicative of tympanic membrane retraction. PAGE 1684","bn":131},{"n":132,"s":"An 18-month-old boy is scheduled to receive bilateral cochlear implants. Which vaccine should the child receive prior to implant?","o":["Prevnar","Prevnar and Pneumovax","Pneumovax","Meningococcal vaccine"],"k":"A","x":"The concern for bacterial meningitis for children who have CIs is particularly for S. pneumoniae (70% to 80%). Recommendations advise that all children should get conjugate vaccine Prevnar-13 (PCV-13), and H. influenzae per routine childhood schedule. At age 2 years, children can get Pneumovax 23 (PPSV23), which contains additional serotypes. Meningococcal vaccination is not necessary. PAGE 1696","bn":132},{"n":133,"s":"What is not an option for a 7-year-old child with right profound sensorineural hearing loss and normal left hearing?","o":["Observation","Frequency modulation system","Contralateral routing of signals aid","Bilateral microphones with contralateral routing of signal (BiCROS) aid"],"k":"D","x":"Management of unilateral profound hearing loss, or single-sided deafness, is made after appropriate counseling of parents and trial of options that include all of those listed except a BiCROS aid. A BiCROS, which includes amplification of the good ear, is valuable in asymmetric hearing loss but not when the good ear hears normally. A contralateral routing of signals would be appropriate. PAGE 1686","bn":133},{"n":134,"s":"Current FDA-approved minimum age for a cochlear implant is what age?","o":["6 months","9 months","12 months","18 months"],"k":"B","x":"In 2020, the FDA approved cochlear implantation for children with bilateral profound sensorineural hearing loss down to lower age limit of 9 months (previously 12 months). PAGE 1695","bn":134},{"n":135,"s":"What is the best option for a 2-month-old boy with bilateral aural atresia and microtia?","o":["Bilateral cochlear implants","Unilateral active bone conduction implant","Softband with bone conduction device","Soundbridge middle ear implant","None of the above"],"k":"C","x":"Cochlear implantation is not appropriate for conductive hearing loss from atresia. The cochlea can often hear normally, if stimulated appropriately with a bone conduction device. Surgery with bone conduction implants are not FDA approved until 5 years of age. A bone conduction device on a headband/Softband is used until surgical candidacy. The Vibrant Soundbridge middle ear implant is approved in Europe in children greater than 3 years but not until 18 years of age in the United States. PAGE 1707","bn":135},{"n":136,"s":"Which of the following is an advantage of a percutaneous bone conduction implant over a transcutaneous implant?","o":["Better cosmesis","Less soft tissue complications","Better MRI compatibility","Ease of attachment"],"k":"C","x":"As indicated in Table 110.3, the transcutaneous bone conduction implant has better cosmesis, ease of attachment of the processor, and less soft tissue. Percutaneous implants do not require an internal magnet to keep the external and internal attached, and so offer better MRI compatibility. PAGE 1707","bn":136},{"n":137,"s":"A newborn is found to have congenital severe-to-profound bilateral sensorineural hearing loss due to a genetic cause. After genetic testing, a diagnosis of the most common cause of genetic hearing loss is made. What gene is involved and what cell type of the organ of Corti is affected?","o":["KCNQI, inner hair cells","KCNQ1, supporting cells","GJB2, inner hair cells","GJB2, supporting cells"],"k":"D","x":"The gene GJB2 encodes connexin 26. Mutations in this gene are the most common genetic cause of congenital severe-to-profound bilateral sensorineural hearing loss in many ethnicities around the world. Connexin 26 is a subunit or a pore that allows for the transfer of potassium ions between supporting cells in the organ of Corti. PAGE 1722","bn":137},{"n":138,"s":"Which is the gene name and form of inheritance for the most common cause of genetic auditory neuropathy spectrum disorder?","o":["OTOPI, recessive inheritance","OTOF, recessive inheritance","OTOP, dominant inheritance","OTOF, dominant inheritance"],"k":"B","x":"OTOF encodes the gene otoferlin, which is the most common genetic cause of auditory neuropathy spectrum disorder. Otoferlin functions at the synapse at the base of the inner hair cells in the organ of Corti. Mutations in OTOF lead to reduction or disordered release of glutamate and therefore impeded transduction of the auditory signal to the brain. PAGE 1724","bn":138},{"n":139,"s":"What is a primary side effect of concern during antiviral treatment of congenital CMV?","o":["Ototoxicity","Leukemia","Neutropenia","Nephrotoxicity"],"k":"C","x":"Congenital CMV can be treated with the antiviral drugs ganciclovir and valganciclovir. This treatment has been shown to halt or reverse congenital CMV hearing loss in children with other symptoms of congenital CMV infection. This treatment is not currently FDA approved for congenital CMV that only causes hearing loss. The most concerning side effect of ganciclovir and valganciclovir is neutropenia, which may require frequent monitoring during treatment. PAGE 1731","bn":139},{"n":140,"s":"Which test has the highest diagnostic yield for children with unilateral hearing loss?","o":["Imaging (CT or MRI)","Thyroid function test","Perchlorate discharge test","Comprehensive genetic testing"],"k":"A","x":"Most of the bilateral permanent sensorineural hearing loss in children is due to a genetic cause. However, unilateral hearing loss in children is more often caused by anatomic abnormalities of the cochleovestibular system, which may be identified with imaging. It is for this reason that clinical practice guidelines suggest imaging first for children with unilateral hearing loss. PAGE 1734","bn":140},{"n":141,"s":"Enlarged vestibular aqueduct is associated with which syndromic form of hearing loss?","o":["Mitochondrial hearing loss","Jervell and Lange-Nielsen syndrome","Usher syndrome","Pendred syndrome"],"k":"D","x":"Pendred syndrome is classically described as hearing loss due to enlarged vestibular aqueduct along with thyroid goiter. Pendred syndrome lies on a phenotypic spectrum that includes isolated enlarged vestibular aqueduct syndrome, which does not include the thyroid phenotype. Pendred syndrome and enlarged vestibular aqueduct syndrome are due to mutations in the gene SLC26A4. PAGE 1724","bn":141},{"n":142,"s":"During development, which of the following structures receives embryologic contribution from the otic capsule?","o":["Malleus","EAC","Incus","Stapes footplate"],"k":"D","x":"The ossicles, except for the vestibular portion of the stapes footplate, are formed from the first and second branchial arches. The external ear canal and tympanic membrane are derived from the first branchial cleft. The stapes footplate is formed in part from the otic capsule, and in most cases, it is normally developed in ears with congenital atresia. PAGE 1742","bn":142},{"n":143,"s":"While performing the canalplasty for atresia repair, an abnormally positioned facial nerve is most encountered in which of the following locations?","o":["Surface of the mastoid cortex","Superiorly, along the tegmen mastoideum","Posteriorly and inferiorly, along the newly formed EAC","None of the above"],"k":"C","x":"Facial nerve abnormalities are common in cases of aural atresia, and the facial nerve may take an anomalous course. Typically, the facial nerve makes an acute angle at the second genu, crossing the middle ear in a more anterior and lateral direction to exit into the glenoid fossa. This abnormal position of the mastoid segment of the facial nerve places it at jeopardy when drilling the posterior inferior portion of the new external ear canal. PAGE 1747","bn":143},{"n":144,"s":"A 3-month-old male with no significant past medical history presents with bilateral complete aural atresia. After audiometric evaluation, what is the next best step in management?","o":["Atresia repair","Hearing amplification with a nonsurgical bone conduction device","CT","Observation"],"k":"B","x":"Early amplification within the first 3 to 4 months of life is essential in infants with bilateral atresia. Initial medical and audiologic evaluations can be completed within the first few months of life, and a bone conduction hearing aid or other nonsurgical bone conduction device (eg, Cochlear Baha Softband, MedEI Adhear) can be fitted soon thereafter. Radiographic studies on infants are usually not recommended because the information is rarely applicable to immediate rehabilitative plans. In very young children, poor patient cooperation often necessitates anesthesia or results in a suboptimal study that must be repeated later. Almost all patients with cholesteatoma formation are older than 3 years, which is another reason to delay the CT evaluation until the patient is beyond that age. If elected, surgery is typically deferred until 6 to 7 years of age. By this time, accurate audiometric tests have been obtained, pneumatization of the temporal bone is well advanced, adequate development of the costal cartilage (for microtia repair) has occurred, and most children are able to cooperate with postoperative care. This timing also permits microtia repair to be well under way. PAGE 1744","bn":144},{"n":145,"s":"Which of the following about isolated cleft palate is true?","o":["Incidence varies widely based on ethnicity.","It is more common than cleft lip with or without cleft palate.","It is more common in girls than boys.","It is less likely to be associated with an identifiable genetic cause compared to cleft lip."],"k":"C","x":"Isolated cleft palate is felt to be a distinct entity from cleft lip with or without cleft palate. The incidence does not vary widely between ethnicities and is fairly constant at 1/1700 in the United States. Cleft lip with or without palate has an incidence of 1/700, and incidence can vary widely between ethnicities. Cleft palate is more common in girls and is more likely to be associated with an identifiable genetic cause compared to cleft lip. PAGE 1761","bn":145},{"n":146,"s":"The advantages of nasoalveolar molding include:","o":["Increase in lip height of the cleft side","Decreasing lip volume on the cleft side","Decreasing tension on lip repair","Ease of placement by the family at home"],"k":"C","x":"Nasoalveolar molding brings the lateral segments of the palate and alveolus together. This decreases the gap that the muscle, mucosa, and skin must span in order to be approximated, therefore decreasing tension at the incision of the lip repair. PAGE 1765, Reference: Kapadia H, Olson D, Tse R, Susarla SM. Nasoalveolar molding for unilateral and bilateral cleft lip repair. Oral Maxillofac Surg Clin North Am. 2020;32(2):197-204.","bn":146},{"n":147,"s":"In the Fisher anatomic subunit approach to the unilateral cleft lip, the height of the upper lip triangle is calculated by which equation?","o":["(Greater lip height) — (lesser lip height) - 1 mm","(Noncleft vermillion thickness) — (cleft vermillion thickness)","(Greater lip height) + (lesser lip height) — 1 mm","(Greater lip height) — (lesser lip height) + 1 mm"],"k":"A","x":"This equation identifies the height discrepancy between the greater lip height and the lesser lip height and allows one to calculate the size of the cutaneous triangle to be inserted into the noncleft side of the lip. Subtracting 1 mm accounts for the stretch of the soft tissue, also known as the Rose-Thompson effect. PAGE 1767","bn":147},{"n":148,"s":"The goals of cleft palate repair include which of the following?","o":["Fill the cleft palate defect and shorten the palate.","Improve speech resonance.","Realign the palatopharyngeus muscle into a more anatomic position.","Prevent OSA."],"k":"B","x":"Though infants with cleft palate cannot effectively breastfeed, they can feed adequately with specialized feeders, thus repair is not needed for feeding. The repair realigns the levator veli palatini muscle into a more anatomic position. Cleft palate repair can cause at least temporary sleep apnea as it closes off the airway. The goal of cleft palate repair is to improve speech resonance by decreasing VPI; this is performed by repairing the cleft and realigning the abnormally inserted levator veli palatini musculature into a horizontal sling. PAGE 1769","bn":148},{"n":149,"s":"Which of the following is thought to be the most important risk factor in having a child with cleft lip with or without cleft palate?","o":["Maternal smoking","One parent with orofacial clefting","Gestational diabetes","Use of retinoids during second trimester"],"k":"B","x":"A positive family history of orofacial clefting is one of the strongest risk factors for the development of this condition. The risk of a first-degree relative being affected is approximately 3% and is significantly elevated compared to the general population. Pregestational diabetes is felt to convey a two-to sevenfold higher risk for orofacial clefting compared to the general population but gestational diabetes has not been shown to convey a significant risk of orofacial clefting. Maternal smoking conveys a 1.3-fold increased risk compared to the general population. Consumption of retinoids conveys a significant risk of congenital malformations including orofacial clefting. However, since the lip and palate have completed embryogenesis by the seventh and ninth postconception week, respectively, exposure during the second trimester would not influence this type of malformation. PAGE 1761","bn":149},{"n":150,"s":"What histochemical marker is particularly useful in distinguishing infantile hemangiomas (IHs) from other vascular tumors and from vascular malformations?","o":["VEGF","IGF-2","GLUT1","IGF-1"],"k":"C","x":"GLUT1 is strongly expressed in infantile IHs, placentas, and the blood-brain barrier; however, it is not expressed in normal surrounding vascular endothelium or in vascular malformations nor is it generally expressed in congenital IHs. Because the positive expression of GLUT1 persists throughout all phases of the TH life cycle, this histochemical marker is particularly useful in distinguishing infantile [Hs from other vascular tumors and from vascular malformations. PAGE 1780","bn":150},{"n":151,"s":"A 2-month-old female with a facial segmental IH in the beard distribution presents to the clinic. Which of the following is commonly associated with this facial segmental lesion?","o":["Polydactyly","Airway hemangioma","Jaundice","LUMBAR (lower body hemangioma, urogenital abnormalities, myelopathy, bone deformities, anorectal malformations, arterial anomalies, and renal anomalies) syndrome"],"k":"B","x":"Approximately 65% of patients with THs that occur in a beard distribution (ie, the chin, jawline, and preauricular areas) have associated airway involvement, and most airway IHs are localized in the supraglottic or subglottic regions. Patients must be closely followed, and treatment should be initiated when airway involvement is suspected. PAGE 1782","bn":151},{"n":152,"s":"What laser can be used to treat cutaneous or mucosal venous malformations?","o":["Nd:YAG laser","Pulsed dye laser","CO} laser","Er:YAG laser"],"k":"A","x":"Superficial cutaneous lesions or the superficial component of deep lesions as well as mucosal lesions can be treated with the Nd:YAG laser. Its wavelength is 1064 nm, and its chromophore is deoxyhemoglobin. PAGE 1789","bn":152},{"n":153,"s":"Kasabach-Merritt phenomenon is associated with which of the following vascular anomalies?","o":["TH","Kaposiform hemangioendotheliomas","Tufted angiomas","Both B and C"],"k":"D","x":"Kasabach-Merritt phenomenon is a rare, potentially life-threatening condition associated with two specific subtypes of vascular tumors: tufted angioma and Kaposiform hemangioendothelioma. PAGE 1788","bn":153},{"n":154,"s":"Which of the following sclerosants used in treating some lymphatic malformations have associated possible side effects of skin hyperpigmentation and pulmonary fibrosis?","o":["Doxycycline","Bleomycin","Ethanol","Sodium tetradecyl"],"k":"B","x":"Bleomycin is a sclerosant used by some to treat cystic lymphatic malformations. Two of its reported possible side effects include skin hyperpigmentation at the site of any skin trauma (such as from skin tape or EKG leads) during the first 48 to 72 hours after the treatment. A rare but reported side effect is pulmonary fibrosis. PAGE","bn":154},{"n":155,"s":"Choose the option with common types and subtypes of rhabdomyosarcomas:","o":["Myosarcoma, embryonal, rhabdomyoblastoma, spitzoid","Epithelioid, botryoid, spitzoid, alveolar","Embryonal, botryoid, spindle cell, alveolar","Myosarcoma, epithelioid, rhabdomyoblastoma, spindle cell","Embryonal, botryoid, rhabdomyoblastoma, alveolar"],"k":"C","x":"Embryonal, botryoid, spindle cell, alveolar is the correct answer as it is the only option with four types of rhabdomyosarcoma. PAGE 1799","bn":155},{"n":156,"s":"Choose the option with the most common pediatric salivary gland malignancy and location:","o":["Mucoepidermoid carcinoma, parotid","Mucoepidermoid carcinoma, submandibular","Mucoepidermoid carcinoma, sublingual","Ex-adenoma pleomorphic carcinoma, parotid","Adenocarcinoma, parotid"],"k":"A","x":"The most common malignancy found in the pediatric population, and the most common location is the parotid gland. Options B and C are incorrect due to the incorrect location. Option D is incorrect due to ex-adenoma pleomorphic carcinoma being extremely uncommon. Option E is incorrect as adenocarcinoma is a very rare pediatric salivary gland malignancy. PAGE 1807","bn":156},{"n":157,"s":"Which option shows the appropriate margins for a melanoma 1.0 mm in depth on the cheek?","o":["0.5 cm","0.5 to 0.9 cm","1to2cm","2 to3cm","2to4cm"],"k":"C","x":"| to 2 cm is correct. Options A and B are incorrect as the margins are too small. Options D and E are incorrect as the margins are too wide. PAGE 1810","bn":157},{"n":158,"s":"Which virus and subtype of nasopharyngeal carcinoma (NPC) are associated to the endemic presentation in children?","o":["CMV, differentiated","Epstein-Barr virus (EBV), differentiated","Herpes simplex virus, undifferentiated","EBV, undifferentiated","Human herpes virus 8, undifferentiated"],"k":"D","x":"The undifferentiated variant of NPC is the most common presentation in children and is associated with endemic EBV infections. CMV, herpes simplex virus, and human herpes virus 8 do not have a common role in the development of NPC. PAGE 1809","bn":158},{"n":159,"s":"Choose the option with syndromes commonly related to head and neck malignancies in children:","o":["Cystic fibrosis, Li-Fraumeni, sickle cell disease","DICERI, sickle cell disease, cystic fibrosis","Li-Fraumeni, DICER1, xeroderma pigmentosum","DICER1, sickle cell disease, cystic fibrosis","Li-Fraumeni, PRS, Beckwith-Wideman syndrome"],"k":"C","x":"Out of all the options noted, option C is the only one with the most common syndromes associated with the development of head and neck malignancies in children. PAGE 1809","bn":159},{"n":160,"s":"The most common cause of persistent hyperthyroidism in children is:","o":["Chronic lymphocytic thyroiditis","Autoimmune thyroiditis","Autonomic hyperfunctioning nodule","Well-differentiated thyroid cancer"],"k":"B","x":"Graves disease is the most common cause of persistent hyperthyroidism in children and caused by autoimmune thyroiditis. PAGE 1816","bn":160},{"n":161,"s":"For a 4-year-old child with Graves disease, the most appropriate definitive therapy is:","o":["Propylthiouracil","Dexamethasone","Radioactive iodine-131 ablation","Total thyroidectomy"],"k":"D","x":"Children under age 5 may not receive RAI for Graves hyperthyroid disease, with many authors and other countries restricting its use under age 10. PAGE 1816","bn":161},{"n":162,"s":"The main indication for lateral neck dissection in the case of well-differentiated papillary thyroid cancer is:","o":["Patient preference","Prophylactic dissection","Histologic confirmation of lateral neck metastasis","Radiographic concern for lateral neck metastasis"],"k":"C","x":"The 2015 ATA Management Guidelines for Children with Thyroid Nodules and Differentiated Thyroid Cancer specifically requires histologic confirmation of lateral neck metastasis prior to lateral neck dissection. PAGE 1822","bn":162},{"n":163,"s":"Decisions regarding adjuvant therapy and postoperative surveillance of patients with pediatric papillary thyroid cancer are primarily influenced by:","o":["Risk group as determined by patient age","Risk group as determined by modified AJCC TNM Staging of well-differentiated thyroid cancer","Thyroid cancer predisposition syndrome","Presence of parathyroid function abnormalities"],"k":"B","x":"After determination of the modified AJCC TNM Stage, a risk group is assigned. Subsequent evaluation and treatment decisions are based on initial risk group. PAGE 1825","bn":163},{"n":164,"s":"Compared to adult thyroid cancer, pediatric thyroid cancer is more likely to:","o":["Be limited to the thyroid gland without metastatic lymphadenopathy at presentation","Contain a BRAF oncogene mutation","Cause disease-specific mortality","Require lateral neck dissection"],"k":"D","x":"Pediatric thyroid cancer is more likely to present with cervical metastasis than in adults. PAGES 1817, 1827","bn":164},{"n":165,"s":"What is the correct deep anatomic course of a second branchial cleft anomaly (BCA)?","o":["Runs between the branches of the facial nerve, terminating at external auditory canal","Runs between the internal and external carotid arteries and superior to the glossopharyngeal and hypoglossal nerves, terminating at the tonsillar fossa","Runs between the internal and external carotid arteries and between the glossopharyngeal and hypoglossal nerves, terminating at the tonsillar fossa","Runs deep to the internal and external carotid arteries and between the glossopharyngeal and hypoglossal nerves, terminating at the pyriform sinus"],"k":"B","x":"Second BCAs are the most common branchial anomalies, composing 70% to 90% of branchial cleft lesions. They most frequently occur along the anterior border of the sternocleidomastoid muscle in the midneck region. If present, the deep tact runs between the internal and external carotid arteries and superior to the glossopharyngeal and hypoglossal nerves, terminating at the tonsillar fossa. Bilateral second BCAs, especially fistulae, should raise suspicion for an underlying syndrome such as branchio-oto-renal. PAGE 1832, Table 117.1","bn":165},{"n":166,"s":"What are the classic three physical examination findings associated with midline cervical cleft?","o":["Superior sinus, midline cleft of atrophic epidermis, inferior skin tag","Superior skin tag, midline cleft of atrophic epidermis, surrounding hypopigmentation","Superior skin tag, midline cleft of atrophic epidermis, inferior sinus","Superior sinus or skin tag, horizontal cleft of atrophic epidermis, surrounding hypopigmentation"],"k":"C","x":"Explanation: Midline cervical clefts present as a triad of anatomic findings (superior skin tag, a midline cleft of atrophic epidermis, and an inferior sinus) that may occur anywhere from the mandible to the sternum. Beneath the superficial components, there is also a fibrous cord. Treatment is surgical excision with multiple Z-plasties early in life to prevent limited neck mobility from contracture. PAGE 1834, Figure 117.6","bn":166},{"n":167,"s":"A 5-year-old patient presents to the clinic with left preauricular swelling. He has not had this occur before and is otherwise healthy. Physical examination is notable for erythema and tenderness at the root of the helix, with a small overlying pit in the skin. Bedside ultrasound reveals an underlying area concerning for a subcentimeter fluid collection. What is the best treatment option?","o":["Observation","Oral antibiotics","Incision and drainage","Surgical excision including removal of tract and perichondrium of the root of the helix"],"k":"B","x":"Oral antibiotics are the first line of treatment for an infected preauricular sinus, especially since the patient is antibiotic naive and any underlying fluid collection is small. Avoidance of incision and drainage is preferable since violation of the sinus may make definitive surgical excision more difficult. An interval of at least 6 weeks should be allowed following infection of preauricular sinuses to ensure resolution of inflammation. PAGE 1834","bn":167},{"n":168,"s":"What is the most common cause of a congenital neck mass?","o":["Thyroglossal duct cyst","Type 1 BCA","Type 2 BCA","Dermoid cyst"],"k":"A","x":"Thyroglossal duct cysts are the most common congenital malformation of the neck, accounting for approximately 70% of cases. PAGE 1835","bn":168},{"n":169,"s":"A midline neck mass is surgically excised, and final pathology shows epidermal tissue, hair follicles, and sebaceous glands. What is the likely diagnosis?","o":["Branchial cleft cyst","Thyroglossal duct cyst","Epidermoid cyst","Dermoid cyst"],"k":"D","x":"Epidermoid cysts contain only epidermal tissue, while dermoid cysts may also contain hair follicles and sebaceous glands. In the head and neck, these cysts usually occur in the so-called T distribution involving the midline of the face, anterior neck, orbits, and periauricular area. PAGE 1837","bn":169},{"n":170,"s":"Which of the following is not true regarding genetic inheritance?","o":["The trait appears only in children who are homozygous in autosomal recessive inheritance.","All the daughters of an affected man are carriers but not affected in X-linked recessive gene inheritance.","Both parents of an affected person carry the gene in autosomal dominance inheritance.","When an individual carries two different mutated alleles at the same locus is called a genetic compound."],"k":"C","x":"Only one parent of an affected person is necessary to pass on a gene in autosomal dominance inheritance. PAGE 1842","bn":170},{"n":171,"s":"is when a mutant gene or gene pair causes multiple phenotypic events such as that seen with alpha-l-iduronidase deficiency in Hurler syndrome.","o":["Heterogeneity","Deformation","Pleiotropy","Sequence"],"k":"C","x":"Heterogeneity is when multiple causes result in the same effect. Deformation is the result of disrupted mechanical forces. Sequence is used to designate a series of anomalies resulting from a cascade of events. PAGE 1843","bn":171},{"n":172,"s":"Which syndrome is not associated with branchial arch anomalies?","o":["Treacher Collins","Apert","Nager","Goldenhar"],"k":"B","x":"Apert syndrome is associated with craniosynostosis and not the result of branchial arch anomalies as seen in Nager, Goldenhar, and Treacher Collins. PAGE 1845","bn":172},{"n":173,"s":"Which condition and gene mutation are characterized by an elongated upper lip and philtrum, learning disability, and velopharyngeal dysfunction?","o":["DiGeorge syndrome, 22q11.2","Robin sequence, 21q13.3","Crouzon syndrome, 23q12.1","Down syndrome, 21q13.3"],"k":"A","x":"Velocardiofacial syndrome (aka DiGeorge syndrome, Shprintzen syndrome) is associated with hypoplastic nasal alae, elongated upper lip, adenoid hypoplasia, VPI, and hypernasal speech with 35% having cleft palate. The correct mutation is 22q11.2. PAGE","bn":173},{"n":174,"s":"Which condition is caused by a biallelic mutation in SLC26A4?","o":["Alport syndrome","Achondroplasia","Beckwith-Wiedemann syndrome","Pendred syndrome"],"k":"D","x":"Pendred is an autosomal recessive disorder characterized by thyroid goiter and sensorineural hearing loss caused by the biallelic mutation in the PDS gene (SLC26A4) affecting pendrin protein function. Achondroplasia is associated with FGF3 mutation. The other two do not have clearly identified mutations. PAGE 1858","bn":174},{"n":175,"s":"Which patient is at the highest risk of postoperative apnea?","o":["A 3-month-old male who was born at 40 weeks of gestation, now presenting for inguinal hernia repair.","A 4-month-old male who was born at 32 weeks of gestation presenting for cleft lip repair.","An 8-month-old female who was born at 35 weeks of gestation presenting for emergency exploratory laparotomy.","A 13-month-old male who was born at 33 weeks presenting for umbilical hernia repair."],"k":"B","x":"Risk is greatest for former preterm infants who are less than 60 weeks postconception at the time of surgery. Risk is reduced to 1% at 56 weeks postconception age. PAGE 1872","bn":175},{"n":176,"s":"Which patient should most likely be rescheduled for surgery?","o":["An 8-year-old male with a history of controlled asthma presenting for an urgent appendectomy who has a |-week history of productive cough, fevers, and wheezing","A 4-year-old female with no past medical history presenting for bilateral myringotomy tube placement with a 3-day history of rhinitis with no other symptoms","An 8-month-old male with no past medical history presenting for cleft palate repair with a 5-day history of fevers, fussiness, and decreased feeding","A 3-year-old female with OSA presenting for AT who was sick with dry cough and rhinorrhea that resolved 2 weeks ago"],"k":"C","x":"Symptoms that are considered more concerning and would trigger rescheduling include fever, malaise, cough, poor appetite, purulent nasal discharge, and wheezing. Option C has fevers and malaise, and poor appetite. Option D has resolved symptoms. PAGE 1871","bn":176},{"n":177,"s":"Which factor would increase the minimum alveolar concentration of a healthy 7-year-old female undergoing anesthesia?","o":["Hypothermia","Administration of fentanyl intraoperatively","Ephedrine administration","Acidosis"],"k":"C","x":"Several factors increase minimum alveolar concentration, a term used to describe minimum concentration of inhaled anesthetic at 1 atm that will prevent skeletal muscle movement in response to surgical incision. These include hyperthermia, hypernatremia, and agents that increase catecholamine levels (eg, epinephrine). PAGE 1881, Table 119.4","bn":177},{"n":178,"s":"In which of the following situations would the use of inhaled nitrous oxide be advantageous?","o":["Tympanoplasty and mastoidectomy","Supraglottoplasty","B12 deficiency","Myringotomy and tube placement"],"k":"D","x":"Nitrous oxide is more soluble in blood than nitrogen and will cause distension of any air-containing space. Often avoided in tympanoplasty but can be advantageous in ear tube placement of atelectat
