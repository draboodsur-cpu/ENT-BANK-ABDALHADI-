 upper thoracic trachea that avidly enhances with contrast and narrows the airway by around 50%. In preparation for biopsy of this lesion, what would be the most appropriate way to manage their airway?","o":["Awake tracheostomy in the upper cervical trachea.","Extracorporeal membrane oxygenation.","Transoral intubation with a 5.0 endotracheal tube.","Awake office bronchoscopy with topical anesthesia should be performed for the biopsy."],"k":"C","x":"In this patient, there is moderate airway compromise but still is an adequate lumen for direct intubation with a small endotracheal tube. Tracheostomy, while feasible, would be above the site of the tumor, not helping with airway control and also may impact future options for definitive resection. The use of ECMO would not be recommended here as there are much less invasive ways of securing an airway. While awake bronchoscopy is an excellent option for biopsy in some patients as they are able to maintain spontaneous ventilation, here, due to his anticoagulation, the risk of airway bleeding in an uncontrolled office setting makes it not advisable. PAGE 2301","bn":98},{"n":99,"s":"For an equivalently staged primary tumor, which of the following histopathologies would have the highest rate of regional nodal metastases?","o":["Adenoid cystic carcinoma","Chondrosarcoma","Adenocarcinoma","Squamous cell carcinoma"],"k":"D","x":"Of the choices listed, squamous cell carcinomas of the trachea have the highest rate of regional metastases and the worst prognosis. PAGE 2306","bn":99},{"n":100,"s":"A healthy 52-year-old male presents with a painless right neck mass for 3 months. He is otherwise asymptomatic. On examination, there is a palpable 2-cm right level 2 neck mass. The patient is noted to have increased coughing upon deep palpation of the mass. Imaging demonstrates a T1-isointense and T2-hyperintense mass that displaces the carotid ventrally and medially and the internal jugular vein posterolaterally. The mass enhances uniformly with contrast. This mass is mostly like a:","o":["Carotid body tumor","Vagal schwannoma","Vagal paraganglioma","Metastatic carcinoma"],"k":"B","x":"It can be difficult to distinguish between vagal paraganglioma and schwannoma on imaging as both lesions enhance with contrast and the carotid anteromedially and the jugular vein posterolaterally. However, paroxysmal cough with deep palpation is pathognomonic for vagal schwannoma as manipulation of the mass causes stimulation of the vagus nerve. PAGE 2317","bn":100},{"n":101,"s":"A 45-year-old female presents with a painless left neck mass. Diagnostic angiography demonstrates a 2.5-cm mass splaying the internal and external carotid arteries. What additional imaging study would be most useful to evaluate for distant metastatic disease?","o":["18F-FDG PET/CT","Iodine meta-iodobenzylguanidine scan (MIBG)","68Ga-DOTATATE","Octreoscan"],"k":"C","x":"The patient described has imaging findings consistent with a carotid body tumor. &8Ga-DOTATATE imaging has high sensitivity and specificity for identification of multiple tumors or metastatic disease in patients with paragangliomas and is superior to the other modalities listed. PAGE 2313","bn":101},{"n":102,"s":"Which characteristic is a favorable prognostic factor for survival in soft tissue sarcomas?","o":["Size greater than 5 cm","Low-grade histology","Positive margins","Location in the head and neck"],"k":"B","x":"Negative prognostic factors that have been consistently reported to influence survival include high-grade histology, size greater than 5 cm, and positive margins. Overall survival for soft tissue sarcomas in the head and neck is poorer than for those in other anatomic subsites, likely because of a combination of factors including a greater proportion of high-grade tumors occurring in the head and neck as well as difficulty obtaining negative margins given anatomic limits. Low-grade histology is associated with improved survival. PAGE 2321","bn":102},{"n":103,"s":"A 40-year-old female presents to the office with left-sided pulsatile tinnitus and subjective hearing loss for 4 months. On examination, there is a reddish/blue soft tissue mass behind the tympanic membrane that blanches on pneumatic otoscopy. CT scan reveals a left-sided mass in the middle ear surrounding and partially destroying the ossicles with extension into the hypotympanic cavity. The jugular bulb and carotid canal are intact. Based on the Fisch classification system for jugulotympanic paragangliomas, this tumor is a:","o":["Class A","Class B","Class Cl","Class C2","Class D"],"k":"B","x":"Fisch class B tumors arise from the inferior tympanic canal in the hypotympanum with middle ear and/or mastoid invasion but jugular bulb and carotid canal remain intact. Class C tumors arise in the jugular bulb and involve the carotid canal or carotid artery. Class D tumors are those with intracranial extension. PAGE 2312","bn":103},{"n":104,"s":"A 17-year-old male presents to the hospital with 1 week of progressive vision loss and proptosis of his left eye. He is found on MRI to have a mass in the left ethmoid cavity with direct infiltration of the intracranial and orbital compartments. Endoscopic biopsy is performed and shows rhabdomyosarcoma. What treatment regimen should this patient receive?","o":["Combined radiation and multiagent chemotherapy","Radiation therapy alone","Wide surgical excision with orbital exenteration followed by adjuvant radiation","Palliative treatment, since curative intent treatment is not possible"],"k":"A","x":"The mainstay of treatment for soft tissue sarcomas is surgical resection with wide margins and adjuvant radiation for high-grade disease or positive margins. However, chemotherapy has emerged as a highly effective treatment for certain sarcomas including rhabdomyosarcoma. Given the tumor location in the orbital and intracranial compartments, the preferred treatment is combined chemotherapy and radiation rather than surgical excision, which would carry significant morbidity. Radiation alone would not be appropriate as there are other more effective treatment options. PAGE 2324","bn":104},{"n":105,"s":"Which type of lymphoma is often treated with close observation rather than medical therapy, even in an advanced stage of disease?","o":["Diffuse large B-cell lymphoma","Follicular lymphoma","Burkitt lymphoma","Hodgkin lymphoma"],"k":"B","x":"Follicular lymphoma typically follows an indolent course, and patients often present with disseminated disease. Close observation has been shown to be noninferior treatment in asymptomatic patients and is associated with a 10-year survival rate of 85%. PAGE 2332","bn":105},{"n":106,"s":"A 55-year-old woman with Sjégren disease presents to clinic with a firm 3-cm asymptomatic mass arising from her parotid gland that is concerning for a malignancy. She notes that she has been living with Sjégren’s for over 20 years, and this has never happened to her before. What procedure should be performed for definitive tissue diagnosis?","o":["Superficial parotidectomy","Open excisional biopsy","Core needle biopsy","FNA"],"k":"C","x":"Sjégren disease is strongly associated with the development of MALT lymphoma of the salivary glands. Patients with more than 20 years since their diagnosis have an 18% risk of development of lymphoma. In order to establish the diagnosis of lymphoma, a tissue biopsy is required. FNA does not provide enough tissue in 25% of cases to perform complete subclassification of lymphoma and often results in diagnostic delay. Core needle biopsy provides adequate tissue sampling for both immunophenotyping and histopathology and can be performed in a clinic setting. It is the correct method of biopsy in this clinical encounter. PAGE 2335","bn":106},{"n":107,"s":"A 68-year-old woman presents to clinic for workup of a neck mass diagnosed on physical examination during a primary care visit. An ultrasound of the neck is performed, and its findings are suspicious for primary thyroid lymphoma. Which ultrasound finding is most useful in differentiating lymphoma from another malignancy of the thyroid?","o":["Hypoechogenicity","Increased vascularity","Size greater than 4 cm.","Lack of internal calcification"],"k":"D","x":"Most thyroid tumors present with hypoechogenicity and increased vascularity. However, lymphoma is associated with a lack of internal calcification in contrast to most other nonlymphoid thyroid tumors, which present with microcalcification. Size greater than 4 cm does not rule in or out lymphoma, although a rapidly enlarging thyroid mass is concerning for one of two malignancies—primary thyroid lymphoma (PTL) and anaplastic thyroid cancer. PAGE 2336","bn":107},{"n":108,"s":"A 40-year-old man undergoes a biopsy of a mass in the left lingual tonsil, which confirms a diagnosis of DLBCL. Subsequently, he undergoes a PET-CT, which demonstrates a 2-cm mass of high FDG avidity in the left lingual tonsil as well as in two adjacent subcentimeter lymph nodes. What stage of lymphoma does this patient have?","o":["I","IE","II","IIE","III","IV"],"k":"A","x":"This patient has stage I diffuse large B-cell lymphoma (DLBCL) in Waldeyer ring. Waldeyer ring was reclassified as a nodal site in the Lugano classification staging system of 2014. Stage I lymphoma is defined as one node or a group of adjacent nodes, which describes the involvement pattern presented. PAGE 2331","bn":108},{"n":109,"s":"Which of the following medical therapies is credited with the dramatic increase in 5-year survival for AIDS patients with non-Hodgkin lymphoma (NHL) in the last 30 years?","o":["R-CHOP","R-EPOCH","Involved site radiation therapy","Highly active antiretroviral therapy (HAART)","Rituximab monotherapy"],"k":"D","x":"Survival rates for AIDS patients with NHL have improved dramatically from 40% in the preantiretroviral therapy to 80% in the current era of HAART. In addition to increased survival, HAART has been credited with a reduction in the rate of toxicity to chemotherapeutic regimens in AIDS patients. Chemotherapeutic outcomes are superior in AIDS patients who continue or start HAART than those who discontinue or postpone treatment. PAGE 2336","bn":109},{"n":110,"s":"A patient presents with left-sided nasal obstruction, intermittent epistaxis, and tearing of his left eye. On examination, he has no restriction of his extraocular movements. Imaging reveals a mass of the left maxillary sinus with invasion of the medial wall of the orbit. Biopsy shows squamous cell carcinoma. What is the T stage of this patient based on imaging?","o":["TI","T2","T3","T4a","T4b"],"k":"C","x":"By the AJCC 8th Edition T staging system for maxillary sinus cancer, this is a T3 tumor. T3 tumors invade any of the following: bone of the posterior wall of maxillary sinus, subcutaneous tissues, floor or medial wall of orbit, pterygoid fossa, and/or ethmoid sinuses. It does not invade orbital contents beyond the floor or medial wall of the orbit. PAGE 2345","bn":110},{"n":111,"s":"HPV has been detected in up to what percentage of squamous cell carcinomas of the sinonasal cavity?","o":["5%","15%","25%","50%","75%"],"k":"C","x":"HPV has been detected in up to 25% of sinonasal squamous cell carcinomas. There is some suggestion that these may also be associated with better prognosis. PAGE 2346","bn":111},{"n":112,"s":"Which of the following is not an absolute contraindication for attempted curative surgical resection?","o":["Presence of distant metastases","Invasion of brain","Bilateral invasion of the optic nerves","Invasion of dura"],"k":"C","x":"Absolute contraindications for surgical resection are medical or nutritional problems that would eliminate the patient as a surgical candidate, presence of distant metastases, invasion of the prevertebral fascia, invasion of the cavernous sinus by a high-grade malignancy, involvement of the carotid artery in a high-risk patient (as determined by carotid flow studies), and bilateral invasion of the optic nerves or optic chiasm. PAGE 2353","bn":112},{"n":113,"s":"What chromosome abnormality defines NUT midline carcinoma?","o":["Chromosomal rearrangement of chromosome 15q14","Deletion of chromosome 22q11","Deletion of chromosome 15q14","Chromosomal rearrangement of chromosome 11q8"],"k":"A","x":"NUT midline carcinoma is defined by the chromosomal rearrangement of chromosome 15q14. PAGE 2348","bn":113},{"n":114,"s":"What percentage of patients with olfactory neuroblastoma ultimately develop cervical nodal disease within the first year of diagnosis?","o":["5% to 10%","20% to 25%","40% to 50%","70%"],"k":"B","x":"20% to 25% of patients with olfactory neuroblastoma (aka esthesioneuroblastoma) develop cervical nodal disease within the first year of diagnosis. These patients should be followed for many years after diagnosis, as local, regional, and distant recurrence is possible even years after initial diagnosis. PAGE 2348","bn":114},{"n":115,"s":"A 35-year-old woman presents with a 3-month history of progressing double vision. On examination, you note normal acuity but a left cranial nerve 6 palsy. What is the next step?","o":["Obtain an MRI and CT","EMG of lateral rectus","Serial clinical examination in 2 weeks","Begin high-dose steroids"],"k":"A","x":"Double vision with normal acuity and cranial nerve deficit suggests a mass lesion within the orbit or skull base. CT and MR imaging frequently help confirm the presence of a mass and define its extent. (pages throughout chapter which describe the role of CT/MR depending on the etiology) PAGES 2342-2343","bn":115},{"n":116,"s":"Which of these orbital bones contributes to the orbital rims?","o":["Sphenoid","Zygomatic","Palatine","Lacrimal"],"k":"B","x":"The zygomatic bone projects from the malar eminence superiorly toward the frontal process and medially to the maxilla to frame the inferior and lateral aspect of the orbit including the lateral aspect of the orbital rim. PAGE 2359","bn":116},{"n":117,"s":"What is the main lower eyelid retractor?","o":["Whitnall ligament","Capsulopalpebral fascia","Inferior oblique muscle","Orbicularis oculi"],"k":"B","x":"The lower eyelid retractor is a fascial extension from the terminal muscle fibers and tendon of the inferior rectus muscle, originating as the capsulopalpebral head. PAGE 2360","bn":117},{"n":118,"s":"A 3-year-old child presents with hypoglobus and a lesion on examination in the superior orbital rim. An FNA in clinic reveals dendritic histiocytes consistent with LCH. What is the next step in management?","o":["Surgery with conservative removal","Surgery with radical removal","Bone survey","Radiation therapy"],"k":"C","x":"While surgical excision is the treatment for isolated lesions, patients with disseminated disease receive aggressive chemotherapy treatment, and therefore, bone survey is indicated prior to the initiation of therapy. PAGE 2362","bn":118},{"n":119,"s":"Eight hours after an uneventful lateral orbitotomy for biopsy of an orbital tumor, your patient notes progressive unrelenting pain and chemosis. What must be considered as a cause for this pain?","o":["Retrobulbar hematoma","Intraoperative traction on the inferior orbital nerve","Transection of the superior orbital nerve","Infection at the site of miniplate repair"],"k":"A","x":"Postoperative pain with chemosis must alert the provider to the possibility of retrobulbar hematoma, especially considering that without rapid management, one risks major permanent ischemic injury to the optic nerve. PAGE 2371","bn":119},{"n":120,"s":"Margins of a craniofacial resection for olfactory neuroblastoma include all of the following except:","o":["Crista galli","Planum sphenoidale","Inferior orbital fissure","Medial wall of orbit"],"k":"C","x":"A craniofacial resection is bounded by the frontal bone (anterior and posterior walls of frontal sinus) and crista galli anteriorly, the medial walls of the orbit laterally, and the roof of the sphenoid sinus (planum sphenoidale) and optic canals posteriorly. It may be extended laterally to include the orbital roofs. PAGE 2383","bn":120},{"n":121,"s":"During a lateral infratemporal approach to the skull base, all of the following structures are superficial to the petrous segment of the internal carotid artery except:","o":["Mandibular nerve","Middle meningeal artery","Eustachian tube","Maxillary nerve"],"k":"D","x":"From anterior to posterior, the posterior edge of the lateral pterygoid plate, foramen ovale (mandibular nerve), foramen spinosum (middle meningeal artery), and sphenoid spine form a continuous line of anatomical landmarks superficial to the petrous segment of the internal carotid artery. The eustachian tube crosses obliquely deep to the mandibular nerve. PAGE 2384","bn":121},{"n":122,"s":"Which of the following is at greatest risk of injury during an endonasal midclival approach to the posterior cranial fossa?","o":["Optic nerve","Oculomotor nerve","Abducens nerve","Hypoglossal nerve"],"k":"C","x":"The 6th cranial nerve (abducens) is associated with the midclival region. It courses obliquely from intradural to interdural to Dorello canal deep to the paraclival segment of the internal carotid artery. PAGE 2389","bn":122},{"n":123,"s":"The primary blood supply to a pericranial flap is:","o":["Supraorbital artery","Supratrochlear artery","Superficial temporal artery","Anterior ethmoid artery"],"k":"A","x":"The anteriorly based pericranial flap is supplied by the supraorbital (major) and supratrochlear (minor) arteries that exit bony foramina along the superior orbital rim. The superficial temporal artery is the primary blood supply for a laterally based temporoparietal fascial flap. PAGE 2383","bn":123},{"n":124,"s":"The most important risk factor for postoperative intracranial infection (meningitis) is:","o":["Prior radiation therapy","Postoperative cerebrospinal fluid leak","Penicillin allergy","Malnutrition"],"k":"B","x":"Early recognition and management of a postoperative cerebrospinal fluid leak is the most important factor for the prevention of intracranial infection. The use of vascularized tissue for reconstruction decreases the risk of a postoperative cerebrospinal fluid leak. PAGE 2390","bn":124},{"n":125,"s":"A 20-year-old male is seen by his dentist for his annual cleaning. The patient denies a history of dental extractions. His dentist notices the patient is missing his third mandibular molar on the left and obtains routine radiographs. The radiograph reveals a well-circumscribed, unilocular lucency surrounding the crown of an unerupted third molar. What is the most likely diagnosis?","o":["Radicular cyst","Odontoma","Osteoma","Dentigerous cyst"],"k":"D","x":"A dentigerous cyst is commonly associated with an impacted or unerupted tooth, most commonly the mandibular third molar. It is most often associated with the crown of a tooth. In contrast, a radicular cyst develops at the apex of a nonvital tooth. PAGE 2395","bn":125},{"n":126,"s":"An 8-year-old female with hyperthyroidism and numerous café-au-lait spots is found to have a rare, benign genetic syndrome. Routine radiograph is concerning for a lesion in the maxilla. What is the most likely diagnosis?","o":["Nasopalatine duct cyst","Vascular malformation","Fibrous dysplasia","Odontogenic myxoma"],"k":"C","x":"McCune-Albright syndrome is characterized by polyostotic fibrous dysplasia, café-au-lait skin macules, multiple endocrinopathies, including hyperthyroidism and/or precocious puberty. PAGE 2408","bn":126},{"n":127,"s":"A 34-year-old female presents with a painful, bluish, expansile mandibular lesion that crosses the midline. She is diagnosed with a central giant cell granuloma. What combination of characteristics makes this lesion an aggressive variant?","o":["4.2 cm, root resorption, cortical bone perforation","4.2 cm, root resorption, rapid growth","6.0 cm, root resorption, cortical bone perforation","6.0 cm, high vascularity, cortical bone perforation"],"k":"C","x":"In order to be classified as an aggressive central giant cell granuloma, three of the following characteristics must be present: larger than 5.0 cm, recur after curettage and enucleation, rapid growth, root resorption, tooth displacement, or cortical bone perforation. PAGE","bn":127},{"n":128,"s":"A 44-year-old female presents with painless mandibular lesion. She states that over the last 4 years, it has slowly increased in size. Radiographic film reveals a unilocular radiolucency with ill-defined borders. Biopsy of the lesion shows columnar hyperchromatic basal cells in the epithelium with a basement membrane demonstrating nuclei with reversed polarity. What is the recommended treatment?","o":["Observation","Enucleation and curettage","Surgical resection with 1 to 1.5 cm margins","Sclerotherapy followed by excision"],"k":"C","x":"Ameloblastoma is a locally aggressive benign tumor that can reach substantial size and cause gross facial deformities. Undertreatment with enucleation and curettage has resulted in high recurrence rates and morbidity. Radical surgical resection with 1.0-to 1.5-cm margin of normal-appearing tissue is recommended. PAGE","bn":128},{"n":129,"s":"A 20-year-old male with a strong family history of an autosomal dominant disorder is noted to have multiple osteomas in the mandible and maxilla. He is subsequently diagnosed with the same genetic syndrome. A referral should be made to which specialist?","o":["Endocrinologist","Gastroenterologist","Dermatologist","Neurologist"],"k":"B","x":"Gardner syndrome is an autosomal dominant disorder characterized by intestinal polyposis, epidermoid cysts, desmoid tumors, and multiple osteomas. The formation of osteomas usually precedes other manifestations of the syndromes. Intestinal lesions, especially polyps have a high rate of malignant transformation. PAGE","bn":129},{"n":130,"s":"Which of the following syndromes is associated with the development of papillary thyroid carcinoma?","o":["Cowden syndrome","Multiple endocrine neoplasia type 1","Von Hippel-Lindau disease","Waardenburg syndrome"],"k":"A","x":"Cowden syndrome is an autosomal dominantly inherited mutation of PTEN. Clinical features include cerebellar tumors, facial trichilemmomas (benign hamartomatous lesions of hair follicles), acral keratoses, and papillomatous papules. Other malignancies associated with Cowden syndrome include breast and endometrial carcinoma. PAGE 2415","bn":130},{"n":131,"s":"Approximately what percentage of medullary thyroid carcinomas are associated with a hereditary (germline) RET mutation?","o":["Less than 5%","20%","60%","99%"],"k":"B","x":"Approximately 20% of medullary thyroid carcinoma cases are associated with a hereditary (germline) RET mutation. PAGE","bn":131},{"n":132,"s":"Patients with which of the following mutations should generally undergo prophylactic thyroidectomy early in life?","o":["Familial adenomatous polyposis","Cowden syndrome","MEN2b","BRAF V600E"],"k":"C","x":"Patients with MEN2b are at high risk of developing early macroscopic disease and nodal metastases and should be offered a prophylactic thyroidectomy early in life. PAGES 2419-2420","bn":132},{"n":133,"s":"Which of the following features help to differentiate a follicular carcinoma from a follicular adenoma?","o":["Presence of RAS mutation","Presence of nuclear grooves and inclusion bodies","Multifocality","Capsular and/or vascular invasion"],"k":"D","x":"Capsular or vascular invasion defines a follicular carcinoma. Follicular carcinoma cannot be diagnosed by FNA without the assistance of molecular testing. PAGE 2417","bn":133},{"n":134,"s":"Which of the following is a classic histologic feature of papillary thyroid carcinoma?","o":["Amyloid deposits","Psammoma bodies and “Orphan Annie eyes”","Predominance of large, granular, eosinophilic cells","Tumor necrosis, high nuclear pleomorphism, and high mitotic activity"],"k":"B","x":"Psammoma bodies and “Orphan Annie eyes” are commonly found in papillary thyroid carcinoma. PAGE 2416","bn":134},{"n":135,"s":"Which of the following best describes the typical lab findings associated with primary hyperparathyroidism?","o":["¥ Calcium t PTH J 1,25-OH vitamin D ft phosphate","t Calcium t PTH 4 1,25-OH vitamin D t phosphate","t Calcium f PTH • 1,25-OH vitamin D 4 phosphate","t Calcium t PTH • 1,25-OH vitamin D 4 phosphate"],"k":"C","x":"Primary hyperparathyroidism is characterized by abnormally elevated serum calcium levels along with an elevated or inappropriately normal PTH level. In addition, PTH also exerts direct effects on the renal tubules resulting in both increased urinary excretion of phosphate and increased production of 1,25-dihydroxyvitamin D. Option A describes lab findings most consistent with secondary hyperparathyroidism resulting from chronic renal failure. Option B is incorrect as primary hyperparathyroidism typically results in an increased level of 1,25-OH vitamin D and decreased levels of phosphate. Option D is incorrect as it is most consistent with tertiary hyperparathyroidism, which is generally seen after renal transplantation. PAGES 2425-2426","bn":135},{"n":136,"s":"During a planned near-total parathyroidectomy for a patient with tertiary hyperparathyroidism, you successfully identify two superior glands along the posterior aspects of the superior poles bilaterally. You are also able to identify an enlarged left inferior gland just inferior to the left thyroid lobe. However, you are unable to positively identify a right inferior parathyroid gland despite a thorough search along the inferior aspect of the right thyroid lobe. In which of the following areas should you begin your search for the suspected ectopic gland?","o":["Retroesophageal","Thymus and superior mediastinum","Carotid sheath","Intrathyroidal"],"k":"B","x":"The inferior parathyroid glands and the thymus are embryologically derived from the 3rd pharyngeal pouches. As these structures descend caudally, the inferior parathyroid glands generally come to rest at or near the inferior pole of the thyroid gland. However, this embryologic origin results in increased variability in the location of the inferior parathyroid glands, and ectopic inferior glands are most frequently identified in the anterior mediastinum either in close proximity to or within the substance of the residual thymic gland. If the search in the expected locations fails to identify an inferior gland, the next location that should be interrogated is the upper anterior mediastinum and within the thymus. Option A denotes an ectopic location of a superior gland. Options C and D are rarer ectopic locations that can be considered and evaluated if a gland is not found in the more common ectopic locations. PAGE 2423","bn":136},{"n":137,"s":"Compared to the thyroid gland and adjacent tissues, which of the following best describes the typical appearance of a parathyroid adenoma on an ultrasound examination of the neck?","o":["Hypoechoic; nonvascular","Hyperechoic; increased vascularity","Isoechoic; nonvascular","Hypoechoic; increased vascularity"],"k":"D","x":"With rare exceptions, parathyroid adenomas characteristically appear hypoechoic and hypervascular when compared to other central neck structures. It is important to note that normal parathyroid glands are not typically visible. Ultrasound has an overall high sensitivity in detecting parathyroid adenomas; however, its accuracy and efficacy are highly dependent on the skill and experience of the operator. The primary limitation of ultrasound is detecting ectopic adenomas located retroesophageally or deep in the mediastinum. PAGE 2426","bn":137},{"n":138,"s":"Which of the following is the most common etiology of sporadic primary hyperparathyroidism?","o":["Single adenoma","Multiglandular hyperplasia","Double adenomas","Parathyroid carcinoma"],"k":"A","x":"Several large retrospective case series have demonstrated that a single adenoma is by far the most common etiology of primary hyperparathyroidism—occurring in approximately 90% of cases. The incidence of double adenomas and multiglandular hyperplasia has reported to range between 4% and 16%. In contradistinction, parathyroid carcinoma is very rare and represents < 1% of all cases of primary hyperparathyroidism. Compared to the more common causes of primary hyperparathyroidism, parathyroid carcinoma is generally characterized by very high levels of both serum calcium (>13 mg/dL) and PTH (>1,000 pg/mL). PAGE 2424","bn":138},{"n":139,"s":"Following excision of a suspected single parathyroid adenoma, your patient’s 10-and 15-minute postexcision parathyroid hormone (PTH) levels return as 68 and 85 pg/mL, respectively (normal range 15-72 pg/mL) compared to a preincision baseline level of 120 pg/mL. Which of the following describes the most appropriate next step in surgical management?","o":["Finish the operation as these values indicate biochemical cure.","Wait and draw another PTH level after a 5-minute interval to further evaluate the trend.","Explore the ipsilateral central neck for a second adenoma and redraw PTH if identified and excised.","Proceed with a near-total parathyroidectomy for multiglandular hyperplasia."],"k":"C","x":"Along with preoperative imaging, intraoperative PTH (IOPTH) assays have supported a shift from bilateral parathyroid exploration to minimally invasive (ie, focused) parathyroidectomy. Based on the Miami Criteria, following excision of a suspected adenoma, a greater than 50% drop from the preexcision baseline level is indicative of operative success and rules out a second biochemically active adenoma. More stringent criteria have recently been published, which maintain that operative cure is most accurately indicated by both a greater than 50% drop and a return of the absolute IOPTH level to the normal range. In the current scenario, while excision of a suspected gland resulted in a drop in the IOPTH, neither the 10-nor 15-minute postexcision levels declined by greater than 50%, and both levels remain outside of the stated normal PTH range. These results and the temporal trend are highly suggestive of an additional hypersecretory adenoma and therefore performing further exploration first ipsilaterally and then contralaterally to identify a second adenoma is the best next step. Option A is incorrect as these levels do not confidently indicate successful surgery based on the aforementioned criteria, and prematurely stopping the procedure risks leaving the patient with persistent hyperparathyroidism. Option B is not the best next step as it is unlikely to provide any additional, useful information based on the upward trend seen in the 15-minute postexcision level compared to the 10-minute postexcision level. Lastly, while near-total parathyroidectomy is the preferred management of multiglandular hyperplasia, based on the information provided in the current scenario, it would be premature to proceed with this more extensive procedure. PAGES 2430-2431","bn":139},{"n":140,"s":"What is the most commonly reported long-term toxicity of radiation therapy to the head and neck?","o":["Dyspnea","Dysphagia","Pain","Sleep disturbance","Anxiety"],"k":"B","x":"Dysphagia is the most common long-term toxicity experienced by patients. A precise estimate of prevalence is hampered by a variety of reporting metrics such as response to PROM’s or surrogate outcomes such as feeding tube use. PAGE 2444","bn":140},{"n":141,"s":"What is the prevalence of xerostomia as a reported late and long term effects (LLE) after radiation?","o":["Less than 5%","6% to 15%","16% to 30%","31% to 45%","Over 46%"],"k":"C","x":"Clinical reports indicate grade 2 or worse xerostomia in approximately 20% of survivors. PAGE 2444","bn":141},{"n":142,"s":"After treatment for head and neck cancer, what is the prevalence of depression?","o":["Less than 5%","6% to 25%","26% to 50%","51% to 70%","Over 71%"],"k":"B","x":"The prevalence of depression has ranged from 13% to 24% and has been associated with decreased survival. PAGE 2445","bn":142},{"n":143,"s":"Neck disability has been reported in over 50% of head and neck survivors, what factor is most commonly associated with increased symptoms?","o":["Neck dissection","Image-guided radiation therapy","Chemotherapy","Immunotherapy","Multimodal therapy"],"k":"E","x":"Neck disability has been reported in over 54% of survivors responding to a PROM. Patients having nonsurgical treatment and those having surgery plus adjuvant treatment experience 3.46 and 4.98 times higher odds of neck disability when compared to neck surgery only. PAGE 2445","bn":143},{"n":144,"s":"Financial toxicity of cancer care may result in:","o":["Noncompliance or avoidance of recommended care","Reduction in departmental revenue","Elevated insurance premiums","Increase in malpractice lawsuits","Patient insurance claim denials"],"k":"A","x":"Financial toxicity is frequently experienced by cancer survivors. It may have a negative impact on quality of life and may lead to decreased adherence to recommended care. PAGE 2446","bn":144},{"n":145,"s":"The incidence and severity of radiation-associated side effects are affected by which of the following factors?","o":["Cumulative dose","Use of concurrent chemotherapy such as cisplatin","Radiation modality (intensity modulated radiation therapy [IMRT] vs non—-image-guided modalities)","All of the above"],"k":"D","x":"Concurrent chemotherapy is associated with worse functional outcomes. Focused radiation with IMRT may allow for less cumulative dose to sensitive structures that reduces the incidence and severity of radiation-associated side effects. PAGE 2454","bn":145},{"n":146,"s":"The radiation side effect associated with postradiotherapy dental disease is:","o":["Mucositis","Skin erythema","Xerostomia","Fibrosis"],"k":"C","x":"While fibrosis and pain from acute toxicities may reduce the ability to provide dental care. Xerostomia is associated with progression of poor dental hygiene and dental caries. PAGE 2454","bn":146},{"n":147,"s":"Routine strategies to improve posttreatment nutritional deficiencies include all of the following except:","o":["Change in dietary consistency","Behavioral strategies","Use of alternative methods of nutrition","Total parenteral nutrition"],"k":"D","x":"Total parenteral nutrition is rarely required and is not recommended when a functioning GI tract exists. PAGE 2457","bn":147},{"n":148,"s":"Both surgical intervention and radiation therapy for head and neck cancers can result in swallowing dysfunction. When are swallowing assessment and treatment most beneficial to patients with head and neck cancers?","o":["When a patient presents with a subjective complaint of dysphagia","Both before and after cancer treatment","When a patient develops aspiration pneumonia","When a patient demonstrates greater than 10% of their body weight"],"k":"B","x":"Prophylactic swallowing intervention delivered prior to oncologic therapy, in addition to reactive swallowing intervention, has been shown to facilitate quicker return to oral intake by mitigating anticipated swallowing dysfunction through compensatory strategies and swallowing exercises. PAGE 2457","bn":148},{"n":149,"s":"Hallmark characteristics of late radiation dysphagia include:","o":["Lower cranial neuropathies in majority of patients","Often refractory to conservative swallowing interventions","Muscle fibrosis, denervation, and atrophy of the swallowing apparatus","All of the above"],"k":"D","x":"Late-radiation dysphagia is an insidious process that results in fibrosis, denervation, and atrophy leading to impaired mobility and contractility of the swallowing musculature. Lower cranial neuropathies are common and occur in 83% of patients with late-radiation dysphagia. Unfortunately, late-radiation dysphagia often does not improve in response to traditional swallowing exercises and interventions. PAGE 2456","bn":149},{"n":150,"s":"A patient undergoing total laryngectomy should first meet with the speech pathologist:","o":["Prior to surgery","During their hospital stay following surgery","At their initial postoperative visit with the surgeon","After all oncologic treatment is completed"],"k":"A","x":"A preoperative meeting with the speech pathologist allows the speech pathologist to evaluate the patient for the most appropriate communication option(s). Additionally, this educational visit will provide the patient with realistic expectations about recovery and rehabilitation. PAGE 2466","bn":150},{"n":151,"s":"Which of the following is not an important consideration when considering candidacy for a tracheoesophageal voice prosthesis?","o":["Patient ability to provide self-care","Extended surgery with reconstruction","Tumor subsite","Substance abuse"],"k":"C","x":"Tracheoesophageal voice prostheses (TEP) require regular maintenance; thus, a patient who is unable to provide self-care for a number of reasons including substance abuse is not an ideal candidate for this option. Patients undergoing extended laryngectomy with reconstruction may have more issues with healing and complications; therefore, this is also an important consideration when considering TEP candidacy. PAGE 2466","bn":151},{"n":152,"s":"Which of the following is an indication for injection of botulinum toxin?","o":["Stomal stenosis","Cricopharyngeal spasm","Cricopharyngeal stricture","Leakage around a tracheoesophageal voice prosthesis"],"k":"B","x":"Cricopharyngeal spasm occurs in response to the egressive airflow from the esophagus through the upper esophageal sphincter. Botox injection into the cricopharyngeus helps to prevent this reactive spasm to facilitate tracheoesophageal (TE) voicing. PAGE","bn":152},{"n":153,"s":"An advantage to placing a prosthesis at the time of the puncture rather than a red rubber catheter:","o":["Increased stomal irritation","High risk of TEP dislodgment","Reduced risk of infection","Allows the patient to begin voicing immediately following puncture"],"k":"D","x":"While the TEP may be placed at the time of surgery, it is necessary to allow the surgical region to heal prior to the introduction of high-pressure airflow through this region. Thus, voicing with the TEP is generally delayed for | to 2 weeks at a minimum during early healing. PAGE 2466","bn":153},{"n":154,"s":"What is the most common cause of leakage around a tracheoesophageal voice prosthesis?","o":["The diameter of the prosthesis is too small.","The length of the prosthesis is excessive.","Recurrent tumor.","Poor nutritional status."],"k":"B","x":"When a prosthesis is too long, it may piston in the fistulous tract leading to dilation of the tissues. This can in turn allow liquids to flow around the dilated puncture tract. While recurrent tumor and poor nutritional status can contribute to leakage around the prosthesis, these are much less common. PAGE 2471","bn":154}]},{"t":"Sleep Medicine and Surgery","q":[{"n":1,"s":"Which of the following patients is home sleep testing contraindicated?","o":["Male with snoring, hypertension, and diabetes","Female with snoring, obesity, and polycystic ovarian syndrome","Male with snoring, hypertension, and peripheral vascular disease","Female with snoring, pain requiring narcotic therapy, and daytime sleepiness"],"k":"D","x":"Guideline for home sleep testing—patients with comorbid medical conditions such as significant cardiorespiratory disease, nocturnal oxygen use, potential respiratory muscle weakness due to neuromuscular condition, awake hypoventilation or suspicion of sleep-related hypoventilation, chronic opioid medication use, history of stroke, or severe insomnia are not candidates for home testing. PAGES 2499-2500","bn":1},{"n":2,"s":"Which one of the following can establish the diagnosis of obstructive sleep apnea (OSA)?","o":["Multiple sleep latency test","Stop-Bang questionnaire","Type III home sleep test","Epworth Sleepiness Test"],"k":"C","x":"OSA can only be diagnosed with testing of the breathing during sleep. This includes home sleep testing type III or type I in-lab testing. Multiple sleep latency test can diagnose narcolepsy or idiopathic hypersomnia. Epworth sleepiness test measures level of daytime sleepiness. The Stop-Bang questionnaire is a screening tool for potential OSA but does not diagnose OSA. PAGE","bn":2},{"n":3,"s":"Alcohol causes the following changes in sleep architecture:","o":["At all levels, alcohol causes a reduction in sleep onset latency, a more consolidated first half sleep and an increase in sleep disruption in the second half of sleep","Increase in sleep latency","Increased sleep efficiency","No effect on sleep architecture"],"k":"A","x":"In healthy nonalcoholics, at any level alcohol decreases sleep latency, consolidates, and increases slow wave sleep during the first half of the night. PAGE 2494","bn":3},{"n":4,"s":"In normal adult sleep, which stage comprises the largest proportion of total sleep time?","o":["NI","N2","N3","Wake after sleep onset","Rapid eye movement"],"k":"B","x":"In adults, about 45% to 55% of total sleep time is normally spent in N2 sleep. N1 sleep accounts for about 1% to 5% of the night, N3 sleep for about 20% to 25%, and 20% to 25% of total sleep time is normally spent in rapid eye movement sleep. PAGE 2480 (Table 155.1)","bn":4},{"n":5,"s":"Which of the following statements is correct regarding RLS (restless legs syndrome)?","o":["Polysomnogram (PSG) is required for the diagnosis of RLS.","Selective serotonin reuptake inhibitors (SSRIs) may be used to treat RLS.","Serotonin is the neurotransmitter primarily involved.","Opiates may be used to treat RLS.","Hemoglobin is the serum marker most closely associated with risk for RLS."],"k":"D","x":"Opiates may be used to treat RLS. RLS is a clinical diagnosis. A low serum ferritin (<50 ug/L) may be associated with RLS; in this case, supplemental iron is often the first-line therapy. The pathophysiology of RLS involves a dopaminergic deficit. Therapies for RLS include dopamine agonists, gabapentin, and occasionally opiates or benzodiazepines. Antihistamines, some centrally acting dopamine antagonists, and most antidepressants—including SSRIs—may aggravate RLS. PAGE 2484","bn":5},{"n":6,"s":"In patients with OSA and symptomatic nasal obstruction, treatment to lower nasal resistance is most often associated with all the following except:","o":["Reduction in the apnea-hypopnea index (AHI) by at least","Improvement in patient-reported sleep measures","Reduction in daytime sleepiness (epworth sleepiness scale)","Improved success rates with positive pressure therapy and oral appliance therapy"],"k":"A","x":"Medical and/or surgical treatment to lower nasal resistance may lead to improved patient-reported sleep and quality of life measures, reduced daytime sleepiness, and improved success rates with positive pressure therapy and oral appliance therapy. Improvement in nasal resistance general does not significantly impact the AHI. PAGE 2518","bn":6},{"n":7,"s":"Compared to oronasal masks, nasal pillows interfaces may be associated with:","o":["Increased leak rate","Increased insomnia symptoms","Lower positive airway pressure (PAP) pressure requirements","Lower equipment costs"],"k":"C","x":"Compared to oronasal masks, nasal pillow interfaces may lower PAP pressure requirements. Studies also show that nasal pillows are associated with lower leak rates and less insomnia. Equipment costs are generally not significantly different between different mask interface types. PAGE 2508","bn":7},{"n":8,"s":"Which of the following adverse side effects of oral appliance therapy most often necessitates discontinuation of therapy?","o":["Tooth discomfort","Gingival or other mucosal irritation","Dry mouth","Occlusal change"],"k":"D","x":"Many oral appliance side effects are minor and often transient including tooth pain, headache, dry mouth, and gingival irrigation. More severe and persistent adverse sequelae include clinically significant temporomandibular joint dysfunction, tooth movement, and permanent occlusal changes and often necessitate device discontinuation. PAGES 2515-2516","bn":8},{"n":9,"s":"Which clinical factors are associated with optimal response to oral appliance therapy?","o":["Increased upper airway collapsibility (higher pharyngeal critical closing pressure)","Increased nonanatomic pathophysiologic mechanisms (eg, high loop gain, low arousal threshold)","Reduced body mass index (BMI)","Reduced number of teeth"],"k":"C","x":"In a comparison of mandibular advancement device responders and nonresponders, only BMI and nasal resistance were independently predictive of mandibular advancement device outcomes. In order to obtain an oral appliance, patients must have at least eight teeth on the maxilla and mandible, and contraindications include dental caries, mobile teeth, or fractured teeth. Ideal candidates for oral appliance also have less nonanatomic pathophysiologic contribution to sleep apnea and only mild to moderate pharyngeal collapsibility (rather than severe). PAGES 2514-2516","bn":9},{"n":10,"s":"Which of the following OSA medical comorbidities would be most appropriate for the standard fixed (continuous positive airway pressure [CPAP)) or autotitrating (automatic positive airway pressure) positive pressure therapy?","o":["OSA and congestive heart failure","OSA and atrial fibrillation","OSA and chronic obstructive pulmonary disease","OSA and neuromuscular disease"],"k":"B","x":"The recommendation for home sleep study test followed by automatic positive airway pressure does NOT apply to complicated patients, including those with congestive heart failure, lung disease (such as chronic obstructive pulmonary disease), baseline oxygen requirements, neuromuscular disease, obesity hypoventilation, central or complex sleep apnea, or history of uvulopalatopharyngoplasty. PAGE 2507","bn":10},{"n":11,"s":"Which of the following is not considered a pathophysiologic mechanism contributing to OSA?","o":["Upper airway anatomic collapse","Ventilatory instability","Low arousal threshold","Hypocretin deficiency","Inadequate pharyngeal dilator muscle response"],"k":"D","x":"Hypocretin deficiency is one of the cerebrospinal fluid findings in type | narcolepsy, which is a sleep disorder of excessive sleepiness. One of the most popular models for OSA outlines four major pathophysiologic contributions to OSA: low arousal threshold, ventilatory instability (high loop gain), inadequate pharyngeal dilator muscle response, and anatomy. PAGES 2530-2532","bn":11},{"n":12,"s":"Which of the following is not an anatomic site scored in the Velum, Oropharynx Lateral Walls, Tongeu Base, Epiglottis (VOTE) classification used in drug-induced sleep endoscopy?","o":["Soft palate","Uvula","Lateral walls","Base of tongue","Epiglottis"],"k":"B","x":"The uvula is not part of the VOTE classification, which allows for scoring of the soft palate (velopharynx), oropharyngeal lateral walls, tongue base, and epiglottis. PAGE 2529 (Figure 157.3)","bn":12},{"n":13,"s":"Which of the following medications is commonly used for drug-induced sleep endoscopy?","o":["Zolpidem","Eszopiclone","Propofol","Zaleplon","Trazadone"],"k":"C","x":"All of the other choices are hypnotics, most often used for insomnia and experimentally used to treat certain types of sleep apnea. Propofol, midazolam, and dexmedetomidine are the most commonly used pharmacologic agents in drug-induced sleep endoscopy. PAGE 2528","bn":13},{"n":14,"s":"Which of the following describes a more collapsible upper airway?","o":["A more negative critical closing pressure","A more positive critical closing pressure","Increased responsiveness to changes in CO2","Decreased responsiveness to changes in CO"],"k":"B","x":"A more positive critical closing pressure (Pcrit). Options C and (D) refer to high and low loop gain, respectively, and do not describe upper airway collapsibility. A more positive Pcrit implies that positive pressure is required to keep the airway open which would be more collapsible than a negative Perit, which would require a negative, suction force to collapse the airway. PAGES 2525-2526","bn":14},{"n":15,"s":"Which of the following does not match a pathophysiologic mechanism with a potentially appropriate OSA treatment?","o":["Massive tonsillar hypertrophy: tonsillectomy","High loop gain: acetazolamide","Inadequate pharyngeal muscle response: hypoglossal nerve stimulation","High arousal threshold: hypnotic medications"],"k":"D","x":"This option represents a potentially dangerous combination. An individual with a high arousal threshold tends to have long and deep OSA events. Adding hypnotics would potentially further increase the arousal threshold and worsen OSA events leading to hypoxemia and/or hypercapnia. The other options are appropriate treatments for the listed pathophysiologic mechanism of OSA. PAGE","bn":15},{"n":16,"s":"What is the most common origin for the sound of snoring?","o":["Inferior turbinate","Nasopharynx","Soft palate","Epiglottis","Lingual tonsils"],"k":"C","x":"The soft palate is the most common cause of snoring sounds. The soft palate flutters and the vibrations contribute significantly to snoring. The uvula also vibrates significantly. PAGE","bn":16},{"n":17,"s":"According to the International Classification of Sleep Disorders Manual, 3rd edition (ICSD-3), which of the options below represent the minimum threshold for a diagnosis of","o":["Apneas + hypopneas + respiratory effort-related arousals greater than 5 events/h + signs/symptoms","Apneas + hypopneas only greater than 25 events/h","Apneas + hypopneas + respiratory effort—related arousals greater than 10 events/h + signs/symptoms","Apneas + hypopneas + respiratory effort related arousals greater than 30 events/h","Apneas + hypopneas greater than 3 events/h + signs/ symptoms"],"k":"A","x":"Apneas, hypopneas, and respiratory effort-related arousals are the three respiratory disturbances that are used to define OSA. Before the 2014 ICSD-3, only apneas and hypopneas were included in the definition of OSA, and apneas, hypopneas, and respiratory effort-related arousals were used to define the RDI. Before the ICSD-3 if the respiratory disturbance index was greater than 5 events/h and the AHI was less than 5 events/h, then the patients were diagnosed with upper airway resistance syndrome. PAGE 2536","bn":17},{"n":18,"s":"Snoring is defined as noisy breathing louder than how many decibels (dB)?","o":["50 dB","60 dB","37 dB","90 dB","76 dB"],"k":"A","x":"59dB. Snoring is defined by vibrating soft tissue sounds in the upper airway typically during inspiration that are 50 dB or louder. PAGE 2537","bn":18},{"n":19,"s":"Which procedure/treatment has not been previously shown to reduce snoring?","o":["Injection snoreplasty","Pillar procedure","Nasopharyngeal Botox","Mandibular advancement devices"],"k":"C","x":"Injection snoreplasty is a procedure where sclerosing agents are injected into the soft palate to help reduce palatal flutter and snoring. Pillar implants are polyethylene terephthalate implants placed into the soft palate and have been shown to reduce snoring by 25% to 51%. Mandibular advancement devices can improve sleep apnea and/or snoring. Nasopharyngeal Botox is not beneficial for snoring. PAGE 2538-2540","bn":19},{"n":20,"s":"In regards to the utilization of digital health tools on snoring detection and monitoring, which of the following is correct?","o":["There are no prior studies on their reliability and therefore should not be used.","They have been validated to diagnose OSA.","Can be useful to quantify snoring severity and possible triggers such as alcohol intake.","They generally use piezoelectric current as the main measurement."],"k":"C","x":"Digital health tools for snoring detection and monitoring can help quantify snoring severity. The devices (such as smartphone apps) can be used to record the snoring sounds and can be used to calculate the snores per hour (snoring index). These apps can then be used to measure how much the snoring volume/frequency changes with certain behaviors (eg, alcohol intake) or medical/surgical treatments. PAGE 2537","bn":20},{"n":21,"s":"Nasal surgery in OSA patients has been shown to:","o":["Consistently reduce sleep apnea severity","Improve daytime somnolence scores","Improve CPAP tolerance","All of the above","B and C"],"k":"E","x":"Meta-analyses have demonstrated a significant decrease in daytime somnolence scores (generally measured by Epworth sleepiness score) after nasal surgery. Nasal surgery has also been shown to reduce average CPAP pressures and improve CPAP adherence/tolerance. Most studies have shown that there is no consistent significant reduction in sleep apnea severity after nasal surgery. PAGES 2545-2546","bn":21},{"n":22,"s":"Which of the following is true about nasal obstruction?","o":["Nasal obstruction increases the maximal flowrate through the pharynx.","Nasal obstruction is uncommon in sleep apnea patients.","Nasal obstruction may contribute to sleep disordered breathing (SDB).","All of the above.","B andC."],"k":"C","x":"Population-based studies suggest that nasal obstruction may independently contribute to SDB, with chronic nocturnal nasal obstruction notably more prevalent in individuals with SDB, habitual snoring, chronic daytime sleepiness, and chronic nonrestorative sleep. Nasal airway obstruction is common in sleep apnea patients (reported in up to 70%). Based on the Starling resistor model, nasal resistance may decrease the maximal flowrate through the pharynx. PAGES 2542-2543","bn":22},{"n":23,"s":"The importance of nasal breathing in OSA may be explained in part by which of following mechanisms?","o":["Nasal obstruction predisposes patients to oral breathing.","Nasal resistance impacts airflow and pharyngeal collapsibility.","Nitric oxide levels may change with nasal airflow.","All of the above."],"k":"D","x":"Nasal breathing is the ideal route for airflow during sleep. Nasal obstruction will predispose patients to mouth breathing and associated worsening airway obstruction. The Starling Resistor Model also demonstrates that nasal resistance impacts airflow and pharyngeal collapsibility. Nasal obstruction/resistance may decrease the maximal flowrate through the pharynx leading to pharyngeal collapsibility. Also, nitrous oxide is produced in the nasal cavity and may play a role in maintaining upper airway patency by regulating pharyngeal tone. When nasal breathing is obstructed, NO levels will decrease potentially leading to increased pharyngeal collapsibility. PAGES 2543-2544","bn":23},{"n":24,"s":"Which of the following is typically reported as the narrowest cross-sectional area in the nasal airway and accounts for what % of airway resistance?","o":["Internal nasal valve; 50%","External nasal valve; 30%","Choanae; 50%","Internal nasal valve; 30%"],"k":"A","x":"The internal nasal valve is often described as the narrowest segment of the upper airway, accounting for approximately 50% of nasal airway resistance with a typical superior angle of 10° to 15°. PAGE 2542","bn":24},{"n":25,"s":"On average, nasal surgery decreases CPAP pressure requirements by approximately:","o":["0.5 to 1 em H20","2 to 3 cm H20","4 to 55cm H20","6 to 8cm H20"],"k":"B","x":"In a systematic review and meta-analysis of patients with OSA and nasal obstruction, nasal surgery was shown to reduce average therapeutic CPAP pressures from 11.6 + 2.2 to 9.5 +2.0cm H20 and converted 89% of non-PAP users to PAP-tolerant users. PAGES 2545-2546","bn":25},{"n":26,"s":"Expansion sphincter pharyngoplasty is effective in managing OSA by repositioning what pair of upper airway muscles?","o":["Superior constrictor","Palatoglossus","Palatopharyngeus","Salpingopharyngeus","Levator veli palatini"],"k":"C","x":"Expansion sphincter pharyngoplasty involves partial sectioning and repositioning of the palatopharyngeus muscles anteriorly, laterally, and superiorly. The muscle is secured to the hamulus to address both anterior-posterior collapse and lateral wall collapse. The other listed muscles are not repositioned during expansion sphincter pharyngoplasty. PAGE 2557","bn":26},{"n":27,"s":"Evaluation for sleep surgery involves utilization of which of the following tools?","o":["Drug-induced sleep endoscopy","Physical examination","Patient history","In-office flexible nasopharyngoscopy","All of the above"],"k":"E","x":"Preoperative evaluation for patients with OSA is of vital importance in aiding with appropriate patient selection. A thorough patient history and physical examination, in-office flexible laryngoscopy, and drug-induced sleep endoscopy are all important components of this evaluation. PAGES 2552-2554","bn":27},{"n":28,"s":"Which palatal phenotype achieves greatest success when employing the transpalatal advancement pharyngoplasty technique?","o":["Vertical","Oblique","Horizontal","Sail-shaped"],"k":"A","x":"Understanding palatal phenotypes are important when selecting patients for palatal surgery. Patients with an oblique pattern noted on physical examination and preoperative imaging are more appropriate for a modified palatopharyngoplasty procedure, while a vertical pattern with collapse at the level of the velum will be more successfully addressed with transpalatal advancement pharyngoplasty or skeletal surgery. PAGES 2556-2557","bn":28},{"n":29,"s":"A recent well-designed randomized controlled trial by Mackay et al demonstrated which of the following findings?","o":["Surgical intervention was significantly less effective than medical management in improving both objective and subjective measures in patients who had failed conventional therapy for sleep apnea.","Surgical intervention was equally effective compared to medical management in improving both objective and subjective measures in patients who had failed conventional therapy for sleep apnea.","Surgical intervention was significantly more effective than medical management in improving both objective and subjective measures in patients who had failed conventional therapy for sleep apnea.","Surgical management is not effective in treating sleep apnea."],"k":"C","x":"The landmark study by Mackay et al published in 2020 demonstrated that surgical intervention (modified palatopharyngoplasty with tongue base radiofrequency ablation) led to significant improvements in both objective measures (AHI) and subjective measures (quality of life indices) compared to medical management in patients who had previously failed conventional therapy for their sleep apnea. PAGE 2559","bn":29},{"n":30,"s":"The Friedman staging system to predict outcomes in palatal surgery includes all the following patient characteristics EXCEPT?","o":["Tonsil size","Friedman tongue position","Collapse pattern on flexible nasopharyngoscopy","BMI"],"k":"C","x":"The Friedman staging system, first described in 2004, continues to be commonly employed in sleep surgery clinics to aid in patient selection for palatal surgery. Components include tonsil size (1-4+), Friedman tongue position (I-IV), and BMI. Patients with lower Friedman stages have been shown to have higher success rates following palatal surgery. PAGE 2552","bn":30},{"n":31,"s":"A 65-year-old male with atrial fibrillation was diagnosed with sleep apnea. Home sleep study 2 years ago revealed AHI 50 events/h (central AHI 13 events/h), ODI 45 events/h. The patient was unable to tolerate nasal PAP treatment. He is interested in hypoglossal nerve stimulation implant. His BMI is 30 kg/m2. Which of the below conditions will not qualify him for the procedure?","o":["No documented oral appliance treatment","High number of central apneas","Anticoagulation requirement due to persistent atrial fibrillation","History of BMI 38 kg/m² prior to gastric bypass 5 years ago"],"k":"B","x":"Patient’s AHI has greater than 25% central apneas on home sleep test, which might overestimate degree of central apneas. Oral appliance treatment is not a prerequisite for HNS therapy. Anticoagulation and heart disease are not contraindications for surgery. Patient’s current BMI is below 35 kg/m2, and current sleep study has been performed after the bariatric surgery. PAGE 2568","bn":31},{"n":32,"s":"A 60-year-old female with a history of severe OSA presents for evaluation of upper airway stimulation. Her recent sleep study shows an AHI of 41 events/h. She has attempted CPAP on three occasions and recent smart card download showed compliance of 40%. Her BMI is 28 kg/m2, and she has anterior-posterior collapse of her palate on drug induced sleep endoscopy (DISE). During the preoperative consultation, she reports undergoing right-sided radical mastectomy 8 years ago and reconstruction with a latissimus dorsi axial flap. She is followed with CT imaging for cancer surveillance. What is the best way to proceed with surgical planning for her upper airway stimulation device?","o":["Get preoperative magnetic resonance imaging (MRI) to better evaluate the breast reconstruction.","Plan for a left-sided upper airway stimulation implant.","Discuss alternative options for management of her OSA as she is not a candidate due to her extensive breast reconstruction.","Discuss alternative options for management of her OSA as the need for recurrent computed tomography (CT) imaging of the chest is a contraindication to upper airway stimulation therapy."],"k":"B","x":"The best approach in this patient is a left-sided implant. Extensive right-sided surgery and reconstruction is a relative indication for a left-sided approach. Preoperative MRI is unnecessary unless there is a contraindication to a left-sided implant. Need for recurrent MRI of the chest, abdomen, and pelvis (not CT) is a contraindication to upper airway stimulation implantation. The current device is MRI conditional at 1.5T. PAGE 2579","bn":32},{"n":33,"s":"A 56-year-old male with a prior history of severe OSA (AHI 52 events/h) is undergoing hypoglossal nerve stimulation implantation on the right side. After placement of the stimulation cuff, the device is interrogated intraoperatively and observation of tongue motion shows retraction to the right with minimal protrusion of the tongue. What is the mechanism of this tongue motion?","o":["Stimulation of the contralateral tongue musculature through cross innervation of the intrinsic muscles of the tongue","Stimulation of the medial branch of the hypoglossal nerve innervating the genioglossus muscle","Preferential stimulation of the C1/C2 branches traveling along the hypoglossal nerve","Inclusion of a lateral branch of the hypoglossal nerve providing stimulation to the hyoglossus and styloglossus muscles"],"k":"D","x":"Retraction and rightward motion of the tongue (in a right-sided implant) is suggestive of inclusion of a late retrusor (lateral) branch of the hypoglossal nerve. This late retrusor branch innervates the hyoglossus and/or styloglossus muscles, which will cause tongue retraction. PAGE 2573","bn":33},{"n":34,"s":"A 60-year-old male underwent a right-sided upper airway stimulator implantation 5 weeks ago. At his 1-week postoperative visit, there was mild deviation of the tongue to the right indicative of mild hypoglossal nerve paresis. He denied complaints of dysarthria or dysphagia. He presents today for activation of his device, and there is no improvement in his tongue examination. What is the best course of action?","o":["Activate the upper airway stimulation device as planned.","Delay activation and reevaluate in 4 weeks for improved tongue motion. Consider a course of steroids.","Go back to the operating room to reexplore the cervical wound and evaluate the hypoglossal nerve.","Obtain an electromyography (EMG) of the tongue musculature to assi s for hypoglossal nerve integrity."],"k":"B","x":"Mild paresis can be seen after upper airway stimulation implantation and is typically due to dissection along the nerve and placement of the stimulation cuff. The paresis will recover with time. There is no role for operative reexploration, and tongue EMG is not indicated. If this occurs, activation of the device should be delayed allowing for recovery of function. A course of steroids can be considered. Activation of the device in the setting of residual paresis may require elevated stimulation thresholds and could, in theory, delay recovery of nerve function. PAGE 2574","bn":34},{"n":35,"s":"Which of the following is true regarding outcomes related to hypoglossal nerve stimulation therapy?","o":["The STAR trial published in 2014 demonstrated overall reduction in median apnea hypopnea index from 29.3 down to 9. However, the data did not support improvement in measurements related to quality of life/daytime sleepiness.","Increasing age has been associated with worse outcomes associated with this therapy.","While BMI above 35 is a contraindication to therapy, increasing BMI has not been correlated with outcomes.","Mixed activation in the STAR trial was associated with nonresponders to therapy."],"k":"D","x":"Outcomes associated with this therapy continue to support high rates of success in the treatment of OSA for CPAP-intolerant patients. This is supported in multiple publications including the STAR trial, which demonstrated overall reduction in median AHI from 29.3 down to 9 AND improvements in QOL measures including the Epworth Sleepiness Score and the FOSQ sleep questionnaire. Increasing age has been associated with better outcomes with the therapy. While there is some conflicting data regarding the impact of BMI on this therapy, it is generally accepted that extreme BMI is associated with poor outcomes in all surgical treatments for OSA and HNS. Mixed activation in the STAR trial was associated with nonresponders and is a testament to the importance of careful positioning of the stimulation cuff during the implantation procedure. PAGE 2573","bn":35},{"n":36,"s":"During maxillomandibular advancement (MMA) surgery for OSA, the maxillomandibular complex is usually advanced in an anterior direction and also rotated in which of the following directions?","o":["Clockwise in the sagittal plane","Counterclockwise in the sagittal plane","Clockwise in the axial plane","Counterclockwise in the axial plane"],"k":"B","x":"Counterclockwise rotation of the maxillomandibular complex in the sagittal plane is an important and unique feature of MMA for OSA. This rotation permits greater mandibular advancement without necessitating further forward advancement of the maxilla. PAGE 2584","bn":36},{"n":37,"s":"Which of the following is the most common complication after MMA surgery?","o":["Facial paresthesias","Foreign body reaction to implanted hardware","Unfavorable nasal cosmesis","Malocclusion"],"k":"A","x":"Facial numbness in the distribution of the infraorbital and inferior alveolar nerves is the most common complication after MMA surgery. With identification and preservation of these nerves, paresthesias usually resolve over the course of several months. Less common complications include foreign body reaction requiring hardware removal, unfavorable cosmesis requiring esthetic surgery, and malocclusion. PAGE 2588","bn":37},{"n":38,"s":"Which of the following has not been associated with surgical success after MMA surgery?","o":["Younger age","Lower preoperative BMI","Lower preoperative AHI","Higher preoperative AHI"],"k":"D","x":"Younger age, lower BMI, and lower AHI have been associated with surgical success as defined by Sher criteria (a greater than 50% reduction in AHI to fewer than 20 events per hour) after MMA surgery. Patients with higher preoperative AHI are less likely to achieve success as defined by Sher criteria but tend to experience a greater reduction in AHI. PAGE 2588","bn":38},{"n":39,"s":"The osteotomies employed during genioglossus advancement surgery for OSA must ensure capture of which bony landmark?","o":["Pogonion","Gnathion","Menton","Genial tubercle"],"k":"D","x":"The goal of genioglossus advancement surgery is to capture and advance the genial tubercle in a forward position, thereby suspending the genioglossus muscle anteriorly and combating tongue base collapse during sleep. The other landmarks are commonly used in cephalometry. The pogonion is the most anterior point on the contour of the chin. The gnathion is the most outward/everted point on the profile of the symphysis of the mandible. The menton is the lowest point on the symphysis of the mandible. PAGE 2588","bn":39},{"n":40,"s":"Surgically assisted rapid maxillary expansion (SARME) may include all of the following osteotomies, except:","o":["Midpalatal osteotomy","Le Fort | osteotomies","Wassmund osteotomy","Pterygomaxillary disjunction"],"k":"C","x":"A variety of SARME techniques have been described to treat adult patients with transverse maxillary deficiency and OSA. The surgical osteotomies that have been used include all or various combinations of the following: midpalatal or parasagittal palatal osteotomies, horizontal Le Fort I osteotomies, and disjunction of the nasal piriform, nasal septum, and/or pterygomaxillary buttresses. The Wassmund osteotomy is a type of anterior segmental maxillary osteotomy that corrects overjet and overbite of the central maxillary teeth and would not be appropriate for SARME given its anterior location. PAGES 2591-2593","bn":40}]},{"t":"Otology and Neurotology","q":[{"n":1,"s":"The vestibular surface of stapes arises from:","o":["First branchial arch","Second branchial arch","Second pharyngeal pouch","Otic placode"],"k":"D","x":"The vestibular surface of stapes arises from the second pharyngeal pouch. The first branchial arch gives rise to the mandible. The second branchial arch gives rise to the stapes (except its vestibular surface), styloid process, stylohyoid ligament, and the superior portion of the body of the hyoid. The otic placode gives rise to the auditory and vestibular systems. PAGE 2608","bn":1},{"n":2,"s":"Which of the following embryonic layers contribute to the tympanic membrane?","o":["Ectoderm","Mesoderm","Endoderm","All of the above"],"k":"D","x":"The tympanic membrane is derived from the first pharyngeal groove and the first pharyngeal pouch. The epidermal layer of the tympanic membrane comes from ectoderm. The fibrous layer of the tympanic membrane comes from mesoderm. The mucosal layer of the tympanic membrane comes from endoderm. PAGES 2063-2064","bn":2},{"n":3,"s":"In congenital malformation of the ear, compared to normal course, the facial nerve course is typically which of the following?","o":["More anteriorly displaced only","More anteriorly and laterally (superficially) displaced","More posteriorly displaced only","More posteriorly and medially (deeply) displaced"],"k":"B","x":"The anterior and lateral displacement of facial nerve is most common. The anterior and lateral displacement of the facial nerve can prevent the developing stapes from coming into contact with the otic capsule, resulting in rudimentary formation. It is associated with EYAI mutations. PAGE 2026","bn":3},{"n":4,"s":"On temporal bone computerized tomography of the temporal bone, morphologic abnormalities of the bony labyrinth are identified in what percentage of cases?","o":["Less than 20% of cases","20% to 40% of cases","41% to 60% of cases","61% to 80% of cases"],"k":"B","x":"Morphologic abnormalities of the bony labyrinth on temporal bone CT are identified in 20% to 40% of patients with childhood sensorineural hearing loss. PAGE 2610","bn":4},{"n":5,"s":"Mutations in which of the following gene have been identified to be associated with Pendred syndrome?","o":["GJB2","COCH","SLC26A4","PAX3"],"k":"C","x":"Pendred syndrome is caused by mutations in the SLC26A4 gene, which encodes for an anion exchanger channel. Mutations in GJB2 cause DFNB1 and DFNA3. Mutations in COCH cause DFNA9. Mutations in PAX3 cause Waardenburg syndrome. PAGE 2611","bn":5},{"n":6,"s":"Which cranial nerve is involved with sensory innervation to the pinna?","o":["CNV","CN VII","CNX","All of the above"],"k":"D","x":"The sensory innervation to the pinna involves cranial nerves V, VII, and X. PAGES 2616-2617","bn":6},{"n":7,"s":"For low-frequency sounds (<2 kHz), the head shadow effect will result in how big of a difference in sound level between the two ears?","o":["0dB","5 dB","10 dB","15 dB"],"k":"A","x":"The head shadow effect only plays a role for higher frequency sounds (>2 kHz). It does not play a significant role in lower frequency sounds. PAGE 2618","bn":7},{"n":8,"s":"The middle ear acts as an impedance matching device and causes a gain of incoming sound pressure by:","o":["5 dB","10 dB","15 dB","20 dB"],"k":"D","x":"The area ratio (the ratio between the surface area of the tympanic membrane and the stapes footplate) and the lever ratio (the ratio between the length of malleus manubrium and incus long process) lead to a pressure gain of approximately 20 dB in the middle ear. PAGE 2623","bn":8},{"n":9,"s":"The inner hair cells are innervated by what type of spiral ganglion neurons?","o":["Type | spiral ganglion neurons","Type 2 spiral ganglion neurons","Both type 1 and type 2 spiral ganglion neurons","Neither type | nor type 2 spiral ganglion neuron"],"k":"A","x":"The inner hair cells are innervated by the type 1 spiral ganglion neurons, which are myelinated, bipolar neurons with afferent projections to the cochlear nucleus. PAGE 2627","bn":9},{"n":10,"s":"What is the main neurotransmitter involved with the synapse between hair cells and spiral ganglion neurons?","o":["Acetylcholine","Glutamate","Epinephrine","Gamma-aminobutyric acid"],"k":"B","x":"Glutamate is the main neurotransmitter involved with the synapse between hair cells and spiral ganglion neurons. PAGE","bn":10},{"n":11,"s":"What is involved with the basic audiologic test battery?","o":["Acoustic immittance measurements","Otoacoustic emissions (OAEs)","Pure tone audiometry","Speech audiometry","All of the above"],"k":"E","x":"The basic audiologic test battery includes acoustic immittance measurements, OAEs, pure tone audiometry, and speech audiometry. PAGES 2639-2644","bn":11},{"n":12,"s":"A patient with ossicular discontinuity is expected to have what type of tympanogram?","o":["Type Ag","Type As","Type B","Type C"],"k":"A","x":"Patients with ossicular discontinuity is expected to have hypercompliant tympanic membrane, leading to a type Ag tympanogram. PAGES 2640-2642","bn":12},{"n":13,"s":"OAEs are produced by what type of cells in the cochlea?","o":["Inner hair cells","Outer hair cells","Deiter cells","Spiral ganglion cells"],"k":"B","x":"OAEs are produced by the outer hair cells. PAGES 2644-2646","bn":13},{"n":14,"s":"What type of audiometry is used for newborn hearing screening?","o":["Acoustic reflexes","OAEs","Pure tone audiometry","Auditory brainstem responses"],"k":"B","x":"OAEs are typically used for newborn hearing screening. PAGES 2644-2646","bn":14},{"n":15,"s":"What is the interaural attenuation level for supra-aural headphones above which masking is necessary for air conduction testing?","o":["10 dB","20 dB","30 dB","40 dB"],"k":"D","x":"When there is a threshold difference of more than 40 dB HL between the ears during air conduction testing, masking is necessary. PAGE 2649","bn":15},{"n":16,"s":"The purpose of the vestibulo-ocular reflex (VOR) is to:","o":["Relay changes in gravity and linear forces to the muscles of the neck, thorax, and lower limbs","Use rapid eye movements to redirect the fovea at an object of interest","Coordinate the interaction between the visual, vestibular, and somatosensory systems","Stabilize gaze during head movement or tilt"],"k":"D","x":"When the head moves, the VOR stabilizes the image of an object in space on the retina by producing an eye movement compensatory to the head movement. The reflex is mediated by stimulation of the semicircular canals or otolith organs, CN VIII, and the resulting compensatory eye movement via CN III, IV, and VI. PAGE 2679","bn":16},{"n":17,"s":"How are the vestibular hair cells are activated?","o":["By movement of the hair bundle toward the kinocilium","By movement of the hair bundle away from the kinocilium","Changes in the pH surrounding the hair bundles leading to an acidic environment","Magic"],"k":"A","x":"By movement of the hair bundle toward the kinocilium, which increases the firing rate of the associated vestibular afferent neuron. PAGES 2674-2675","bn":17},{"n":18,"s":"The semicircular canals detect acceleration while the otolith organs detect acceleration.","o":["Angular and linear.","Linear and angular.","Both detect uniform or constant acceleration.","These organs do not detect acceleration."],"k":"A","x":"The semicircular canals detect angular acceleration and are activated when the head is rotated to the left or right (horizontal canals), pitched forward (anterior canals), or arched backward (posterior canals). The otolith organs detect linear acceleration, in the form of translation (linear motion of the head) or gravity (tilt of the head), and consist of two sacs within the vestibule, utricle, and saccule. PAGE 2670","bn":18},{"n":19,"s":"In the otolith organs, the “striola” is:","o":["The gelatinous material surrounding the otoconia and is adherent to the hair cells","A collection of supporting cells abutting the sensory hair cells","The sensory epithelium that divides the macular surface","The geometric arrangement of the hair cells as noted on electron microscopy"],"k":"C","x":"The striola is the thin strip of sensory epithelium that divides the macular surface into two parts and contains predominantly type I sensory hair cells and irregularly firing afferents. Hairs on opposite sides of the striola have opposite polarization, and the boundary line distinguishing these opposing vectors is known as the line of polarity reversal. PAGES 2677-2678","bn":19},{"n":20,"s":"What shape are type II hair cells?","o":["Flask shaped","Cylinder shaped","Spiral shaped","Spindle shaped"],"k":"B","x":"Type II hair cells are cylinder-shaped hair cell that receives its afferent innervation from bouton terminals along its basolateral edges. PAGES 2674-2675","bn":20},{"n":21,"s":"What peripheral vestibular structures does the caloric test evaluate?","o":["Utricle and superior vestibular nerve","Saccule and inferior vestibular nerve","Horizontal semicircular canal and superior vestibular nerve","Posterior semicircular canal and inferior vestibular nerve"],"k":"C","x":"The caloric examination delivers a stimulus that is a temperature above or below normal body temperature into the external auditory meatus. The horizontal semicircular canal is sensitive to any temperature variations in the EAC because of its close proximity to the middle ear space. The temperature change stimulates the horizontal VOR. The nystagmus generated is captured and analyzed. PAGES 2685-2687","bn":21},{"n":22,"s":"The status of the saccule can be assessed using which of the following vestibular laboratory tests?","o":["Ocular vestibular-evoked myogenic potential (0oVEMP)","Cervical vestibular-evoked myogenic potential (CVEMP)","Caloric test","Rotational chair test","Electrocochleography (ECochG)"],"k":"B","x":"The cVEMP is a reflexive response of the musculature in the neck triggered by activation of the saccule. The afferent limb of the cVEMP extends from the saccule (ie, receptor organ) to Scarpa ganglion where neural projections course through the inferior branch of the vestibular nerve and terminate on the vestibular nuclei. The efferent limb of the cVEMP reflex descends from the vestibular nucleus to the motor nucleus of CN XI and then terminates on the sternocleidomastoid muscle. PAGES 2691-2693","bn":22},{"n":23,"s":"The status of the utricle can be assessed using which of the following vestibular laboratory tests?","o":["oVEMP","cVEMP","Caloric test","Rotational chair test","ECochG"],"k":"A","x":"The oVEMP is recorded from extraocular muscles with skin surface electrodes. The
