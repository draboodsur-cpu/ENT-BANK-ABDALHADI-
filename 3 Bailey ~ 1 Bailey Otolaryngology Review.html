<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bailey Otolaryngology Review — Interactive Quiz</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--box:#0B1418;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--box:#000;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.chap{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px}
.chap.on{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.chap b{flex:1;font-weight:600}
.chap span{color:var(--muted);font-variant-numeric:tabular-nums}
.chap .done{font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px}
.seg button.on{background:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#06201F}}
.primary{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
@media (prefers-color-scheme:dark){.primary{color:#06201F}}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.topi .t{flex:1;min-width:0;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topi .sc{font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width .25s}
.qn{font:600 .9rem/1 inherit;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.note{font-size:.9rem;color:var(--muted);margin:-4px 0 12px}
.flag{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:6px;font-size:.92rem;margin:0 0 12px}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}
.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}
.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:12px 0 4px}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-cur{outline:2px solid var(--teal);outline-offset:1px}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:8px 0}
table{width:100%;border-collapse:collapse;margin:12px 0 18px;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="wrap" id="app"></div>
<div class="zoom" id="zoom" onclick="this.style.display='none'"><img alt="Enlarged figure"></div>
<dialog id="dlg"></dialog>
<script>
const DATA=[{"t":"Basic Science/General Medicine","q":[{"n":1,"s":"Which muscle of the eye is sympathetically innervated?","o":["Levator palpebrae muscle","Miiller muscle","Orbicularis oculi muscle","Superior rectus muscle"],"k":"B","x":"Unlike the other mimetic facial muscles, which are innervated by the motor branches of cranial nerve VII (the facial nerve), Miiller muscle is innervated by the sympathetic branches of cranial nerve III (oculomotor nerve). PAGES 5-6","bn":1},{"n":2,"s":"Which mimetic muscle of facial expression lies deep to the facial nerve?","o":["Depressor anguli oris muscle","Risorius muscle","Buccinator muscle","Orbicularis oris muscle"],"k":"C","x":"All muscles of facial expression are innervated on their deep surfaces except for three facial muscles: the mentalis, levator anguli oris, and buccinator muscle. PAGE 13","bn":2},{"n":3,"s":"Which muscle elevates the mandible?","o":["Posterior digastric muscle","Mylohyoid muscle","Masseter muscle","Lateral pterygoid muscle"],"k":"C","x":"Several muscles attach to the mandible, enabling it to serve its multiple functions. The temporalis, masseter, and medial pterygoid muscles all elevate the mandible. The lateral pterygoid, mylohyoid, digastric, and geniohyoid muscles all depress the mandible. And note, the lateral pterygoid also acts to protrude the mandible, while the mylohyoid also serves to retract the mandible. PAGE 14","bn":3},{"n":4,"s":"Which bone does not contribute to the orbit?","o":["Palatine bone","Frontal bone","Sphenoid bone","Nasal bone"],"k":"D","x":"The following seven bones form the bony structure of the orbit: sphenoid, frontal, zygomatic, ethmoid, lacrimal, maxilla, and palatine bones. Given their proximity, it is a common misconception that the nasal bone is a component of the bony orbit. PAGE 6","bn":4},{"n":5,"s":"Which structure separates levels IIa and IIb in the neck?","o":["Internal jugular vein","Sternocleidomastoid muscle","Spinal accessory nerve","Internal carotid artery"],"k":"C","x":"Level II cervical lymph nodes along the jugular chain are located around the upper third of the internal jugular vein and adjacent spinal accessory nerve. They extend from the level of the skull base to the level of the inferior border of the hyoid bone. Level IT lymph nodes are subdivided into levels ITA and IIB. Level IIA nodes are located anterior (medial) to the vertical plane defined by the spinal accessory nerve, while level IIB nodes are located posterior (lateral) to the vertical plane defined by the spinal accessory nerve. The posterior border of the sternocleidomastoid muscle identifies the posterior (lateral) border of level IIb. PAGE 20","bn":5},{"n":6,"s":"All of the following are known comorbid conditions that increase the risk for a postoperative cardiac complication except:","o":["Creatinine greater than 2.0","Insulin-dependent diabetes","Inability to climb one flight of stairs","Body mass index of less than 25"],"k":"D","x":"Comorbidities that may increase the risk for a postoperative cardiovascular complication include age greater than 70 years, peripheral vascular disease, insulin-dependent diabetes, creatinine greater than 2.0, history of cerebrovascular disease, and poor functional capacity (inability to climb one flight of stairs). Currently, below normal body mass index has not been found to increase the risks for a postoperative cardiovascular complication. PAGE 29","bn":6},{"n":7,"s":"Postoperative hypotension may be the result of all of the following except:","o":["Sepsis","Adequate fluid replacement","Pulmonary dysfunction","Electrolyte abnormalities"],"k":"B","x":"Postoperative hypotension may be the result of inadequate fluid replacement or hemorrhage, sepsis, cardiac dysfunction, pulmonary dysfunction, and electrolyte abnormalities. Adequate fluid replacement should ensure that the patient remains normotensive. PAGE 30","bn":7},{"n":8,"s":"All of the following are symptoms of pulmonary insufficiency except:","o":["Tachypnea","Tachycardia","Appropriate capillary refill","Dyspnea"],"k":"C","x":"Postoperative pulmonary insufficiency is characterized by dyspnea, tachypnea, tachycardia, and cyanosis. Common causes of pulmonary insufficiency include atelectasis, bronchospasm, pulmonary edema, exacerbation of preexisting pulmonary disease, pulmonary embolization, and aspiration. While delayed capillary refill is concerning for pulmonary insufficiency or reduced perfusion of a cardiovascular source, appropriate capillary refill is not. PAGE 31","bn":8},{"n":9,"s":"For patients with thickened secretions, which of the following interventions aid in thinning the secretions:","o":["Humidification","Mucolytic agents","Nebulized breathing treatments","All of the above"],"k":"D","x":"Thickened secretions may result in the patient experiencing airway obstruction. Increased hydration, humidification, nebulized bronchodilators, and mucolytic agents may aid in thinning secretions and ease mucous clearance. If obstruction persists, a flexible bronchoscopy can be performed for direct visualization of the bronchial tree, removal of debris, and culture of sections. PAGE 31","bn":9},{"n":10,"s":"All of the following are manifestations of delirium except:","o":["Insomnia","Slowed cognition","Urinary retention","Irritability"],"k":"C","x":"Urinary incontinence, not retention, can result for delirium. Delirium is transient and characterized by the acute onset of cognitive impairment. Risk factors include age greater than 65 years, preoperative dementia or cognitive decline, vision or hearing impairment, and preoperative severe illness or presence of infection. Causes of delirium include drug intoxication, drug withdrawal, metabolic disturbances, acute cerebral disorders, infection, hemodynamic disturbances, hypoxia/respiratory disorders, nutritional and vitamin deficiencies, and trauma. Delirium symptoms include restlessness, insomnia, irritability, frightening dreams, slowed cognition, disturbed consciousness, and urinary incontinence. PAGE 32","bn":10},{"n":11,"s":"What is the best predictor for successful extubation/liberation from the ventilator?","o":["Following commands","Minimal secretions","Spontaneous breathing trial","Negative cuff leak test"],"k":"C","x":"Successful extubation is best predicted by a spontaneous breathing trial, conducted using pressure support ventilation mode on the ventilator in order to show that the patient has the requisite respiratory drive. All other factors are important but not sufficiently predictive of successful weaning from the ventilator. PAGE","bn":11},{"n":12,"s":"Which is not a recommended strategy in treating adult acute respiratory distress syndrome (ARDS)?","o":["High-flow oxygen","Positive end-expiratory pressure greater than 10 cm H₂O","Plateau pressure less than 30 cm H₂O","Prone positioning"],"k":"A","x":"ARDS is a highly morbid condition, contributing to 10% of all intensive care unit admissions, with mortality that approaches 40%. The key in managing ARDS is to provide ventilation without excessive barotrauma; therefore, plateau pressure should be maintained below 30 cm HO, and prone positioning can recruit healthier lung tissue in refractory cases. Positive end-expiratory pressure greater than 10 cm H₂O is commonly required in ARDS. High-flow oxygen is not recommended in adult ARDS as it may delay mechanical ventilation and is associated with increased mortality. PAGE 43","bn":12},{"n":13,"s":"Which of the following has not been conclusively linked to posttracheostomy tracheal stenosis?","o":["Obesity","Endotracheal tube size greater than 7.5 mm","Delayed tracheostomy beyond 10 days","Percutaneous dilatational tracheostomy"],"k":"D","x":"Although a retrospective single institution study from 2018 reported a higher incidence of tracheal stenosis after percutaneous dilation of tracheostomy, a Cochrane review from 2016 showed that percutaneous techniques reduce overall incidence of late, non-life-threatening events after tracheostomy, including tracheal stenosis. All other factors above have been linked to posttracheostomy tracheal stenosis. PAGES 43-44.","bn":13},{"n":14,"s":"What is the most common type of shock?","o":["Hypovolemic","Cardiogenic","Distributive","Hemorrhagic"],"k":"C","x":"Most commonly associated with peripheral vascular dilatation and increased cardiac output, distributive shock leads to poor gas exchange and hypoxia in the tissues, often associated with sepsis, which is the most common reason for intensive care unit admission. The other forms of shock less commonly present in isolation. PAGE 47","bn":14},{"n":15,"s":"What is the most common etiology of acute kidney injury (AKI)?","o":["Hypovolemia","Contrast-induced nephropathy","Acute tubular necrosis","Acute interstitial nephritis"],"k":"C","x":"Acute tubular necrosis is responsible for about half of all cases of AKI and reflects oxidative or inflammatory injury of the renal tubules. Hypovolemia accounts for 30% to 40% of all cases of AKI usually from dehydration or low-output heart failure. Contrast-induced nephropathy and acute interstitial nephritis are relatively rare causes of AKI. PAGE 53","bn":15},{"n":16,"s":"Which micronutrient enhances activation of leukocytes and macrophages in a wound bed and is essential for collagen synthesis?","o":["Vitamin A","Zinc","Vitamin C","Glutamine"],"k":"C","x":"Collagen synthesis depends upon the hydroxylation of lysine and proline. Vitamin C (along with ferrous iron) is a necessary cofactor for this hydroxylation. High-dose vitamin A or zinc can impede wound healing. Glutamine is associated with the inflammatory immune response in the early phases of wound healing. PAGE 69","bn":16},{"n":17,"s":"A healed wound is able to achieve what percent of maximal strength?","o":["30%","50%","80%","100%"],"k":"C","x":"The maximum tensile strength achieved for a healed wound is about 80% of the previously unwounded tissue after approximately 1 year. PAGE 65","bn":17},{"n":18,"s":"Angiogenesis and epithelialization are characteristics of which phase of wound healing?","o":["Hemostasis","Inflammation","Proliferation","Remodeling"],"k":"C","x":"The proliferative phase of wound healing begins on day 3 after injury once hemostasis is achieved and an adequate immune response has occurred. This phase lasts for about 2 weeks. Proliferation is a result of activated keratinocytes, fibroblasts, macrophages, and endothelial cells to effect wound closure, matrix deposition, and angiogenesis. Angiogenesis is a critical component of proliferation to support the metabolic demands. Epithelialization also begins shortly after injury. PAGES 64-65","bn":18},{"n":19,"s":"One product of tissue engineered products commonly used in head and neck surgery to support extracellular matrix deposition promoting regeneration of the dermis that is bilayered is which one of the following?","o":["Integra","Alloderm","Epicel","OASIS"],"k":"A","x":"Integra promotes regeneration of the dermis and is bilayered (dermal component derived from bovine collagen and chondroitin-6-sulfate and a silicone layer). The silicone layer serves as a provisional epidermal layer providing a protective covering while adjacent dermis cells can migrate into the matrix to deposit collagen and promote neovascularization. The silicone layer is removed after adequate dermal regeneration and is replaced by an autologous epidermal graft for final wound closure. Epicel is a cultured epidermal autograft indicated for total burn surface areas greater than 30%. It comprises sheets of autologous keratinocytes supported by petrolatum gauze that is removed 1 week after grafting. OASIS wound matrix is a 0.15-mm-thick nonchemically cross-linked cellular biomaterial derived from porcine small intestine submucosa. Its primary indication is for use in chronic nonhealing ulcers. Alloderm is a nonchemically cross-linked acellular dermal allograft derived from cadaveric skin. This is primarily used as a dermal substitute in deep partial-and full-thickness wounds to improve the take of eventual autologous split-thickness skin grafts. PAGE 70","bn":19},{"n":20,"s":"You are asked to review a research article that compares the Epley maneuver to a sham procedure for benign, paroxysmal, positional vertigo, in which the authors present the beneficial effect of the therapy, reported as an absolute rate difference of 40% (P < .001) and a 95% confidence interval (CI) of 25% to 55%. Which statement below properly interprets these results?","o":["The effect is likely biased because low statistical power may be present.","The 95% CI is too broad to conclude that the effect is clinically important.","If 20 of 100 patients in the sham group improved, we would expect 28 of 100 to improve after the Epley maneuver.","The 95% CI shows the zone of compatible results to be 25% to 55%."],"k":"D","x":"The CI describes a zone of compatibility with the data; for example, a 95% CI of 28% to 99% means that we do not know much about the real outcome of a treatment because the intervention is compatible with a very broad range of results. CI is a measure of the precision of a study, and the most common method to improve the Cl is to increase the sample size. PAGE 85","bn":20},{"n":21,"s":"Ina journal club, you are asked to assign a level of evidence to a study about treatment effects. In making your assignment, which of the following considerations would be helpful?","o":["A systematic review of randomized trials could rank higher than a single randomized trial.","A systematic review of randomized trials is preferable to a clinical practice guideline.","Randomized trials, by nature of their study design, always have high methodological quality.","Observational studies cannot provide a strength of evidence above level 3."],"k":"A","x":"In determining whether the results of a study are strong and consistent, the level of evidence generally increases as we progress from observational studies to RCTs, with the highest evidence for treatment effects based on a systematic review or RCTs. PAGE 87","bn":21},{"n":22,"s":"A group of investigators report superior patient satisfaction and outcomes after robotic-assisted surgery, compared with conventional surgery (P < .0001). The trial was randomized, but the nature of the interventions did not allow for blinding of the patients, surgeons, or outcome assessors to patient allocation. The differences between groups are unlikely to be caused by which of the following?","o":["Halo effect","Allocation (susceptibility) bias","Inadequate sample size","Ascertainment (detection) bias"],"k":"B","x":"Allocation bias is unlikely in this example because the assignment to treatment group was randomized, independent of investigator or patient preference. Halo effect and ascertainment (detection bias) are both possible due to inability for blinding. Inadequate sample size is possible as sample size is not described for this study (see also Table 5.4 in Bailey’s Head & Neck Surgery— Otolaryngology, Sixth Edition). PAGE 75","bn":22},{"n":23,"s":"Which of the following statements is true regarding survival analysis for censored data?","o":["Data are censored when an investigator suppresses results deemed unreliable.","Kaplan-Meier plots show the adjusted probability of survival beyond a specified time.","Survival data uniquely combine whether an event occurred and if it did, at what time.","Survival analysis is best restricted to studies that report cancer outcomes and predictors."],"k":"C","x":"Survival analysis is used for censored data that uniquely combine whether an event has occurred and, if it did occur, at what time in the observation period. Survival analysis is not limited to cancer research and should be used to report any outcome that includes time to event or may not have occurred by the end of a study (eg, extrusion of a tympanostomy tube, recurrence of cholesteatoma). PAGE 77","bn":23},{"n":24,"s":"When interpreting a research article that reports many P values as part of the statistical analysis, the reader should keep in mind that:","o":["Multiple P values suggest robust and thorough analysis by the study authors","Nonparametric statistical tests are the preferred method to adjust for multiple comparisons","Adjustment for multiple comparisons is unnecessary when the central limit theorem applies","Comparisons should be done using methods that do not inflate the family-wise error rate"],"k":"D","x":"Comparing multiple groups in a study or doing many independent statistical tests on a set of data will inflate the overall chance of a type 1 (false-positive) error (the family-wise error rate) well above the 5% rate of each test when P < .05 is used as the threshold for significance. To avoid this problem, investigators should compare multiple groups using special statistical techniques and use multivariable analysis instead of repeated independent tests. PAGES 82-83","bn":24},{"n":25,"s":"Which of the following is true of clinical outcomes research?","o":["The only outcomes measured are quality of life or functional status.","Severity staging is more important than comorbidity in predicting outcome.","Observational methodology is required for clinical outcomes research.","Validated instruments must be used for quality-of-life outcomes assessment."],"k":"D","x":"There are many possible outcomes that can be measured in a clinical outcomes research, and many possible study designs, however it is important that quality of life must be assessed using a validated instrument, and not just a questionnaire created for that study. PAGES 90-93","bn":25},{"n":26,"s":"A disease which affects the outcome being measured is which of the following?","o":["A comorbid condition","An example of bias","A dependent variable","A contributor to severity"],"k":"A","x":"The definition of a comorbid condition is another disease which affects the outcome of a different disease that is being studied. PAGE 92","bn":26},{"n":27,"s":"Which of the following is true of evidence-based medicine (EBM)?","o":["Only randomized controlled trials (RCTs) can be included in","EBM does not require the input of the clinician’s experience and expertise.","Evidence must include results from basic research and animal studies.","The overall evidence is given a grade based on study methodology."],"k":"D","x":"EBM assesses all available evidence and not only RCTs. One of the three “legs of the stool” in EBM is clinical expertise. EBM only includes human subject studies. Individual studies are given “levels,” and the overall evidence is given a “grade.” PAGES 93-98","bn":27},{"n":28,"s":"Which is the best description of how the evidence is graded, in the practice of EBM?","o":["The overall grade is a compilation of the level of the best studies.","The overall grade is based on the highest-level study available.","The overall grade is determined by the level of the largest number of studies.","The overall grade is determined by the level of the poorest individual study."],"k":"A","x":"The evidence is pooled, and studies are rated by the quality of the methodology. The overall evidence grade is determined by the level of the best quality studies. PAGES 95-96","bn":28},{"n":29,"s":"Which of the following are true, concerning levels of individual studies?","o":["Case-control study is higher than cohort study.","RCT is higher than case-control study.","Case series is the same level as cohort study.","Case series is higher than outcomes research."],"k":"B","x":"The levels of evidence, from highest to lowest, are RCTs, cohort studies, prospective outcomes research, case-control studies, and case series. PAGE 96","bn":29},{"n":30,"s":"All of the following are nucleotide components of RNA except:","o":["Adenine","Guanine","Cytosine","Thymine"],"k":"D","x":"Adenine, guanine, uracil, and cytosine are the nucleotides found in RNA molecules. Thymine is found in DNA. PAGE 101","bn":30},{"n":31,"s":"Non-mendelian genetics describes all of the following forms of inheritance except:","o":["Homologous recombination","Mitochondrial inheritance","X-linked inheritance","Digenic inheritance"],"k":"C","x":"X-linked inheritance follows the normal patterns of mendelian inheritance. Homologous recombination involves exchange of information between homologous chromosomes and does not follow a mendelian pattern. Mitochondrial inheritance typically follows inheritance of genes only from the mother. Digenic inheritance is a non-mendelian form of inheritance and refers to phenotypes that require inheritance of two alleles for the trait to be expressed. PAGES 104-114","bn":31},{"n":32,"s":"Which of the following syndromes are associated with mutations in chromosome 15q11-13: I. Prader-Willi syndrome IL. Angelman syndrome III. DiGeorge syndrome","o":["Tonly","Land II","Land III","I, I, and TI"],"k":"B","x":"Prader-Willi and Angelman syndromes involve deletions of region 15q11-13 in the paternal chromosome and maternal chromosome, respectively. DiGeorge syndrome involves a microdeletion at chromosome 22q11.2. PAGES 110-111","bn":32},{"n":33,"s":"The etiology of many sporadic head and neck cancers (HNCs) involves which of the following?","o":["Microdeletion of a chromosome","Nonsense mutation of a secretory protein","Mutations in a tumor suppressor gene or proto-oncogene","Mutations in genes involved in the sonic hedgehog pathway"],"k":"C","x":"Mutations in a tumor suppressor gene or proto-oncogene are a common pathway in the development of many HNCs. PAGE 116","bn":33},{"n":34,"s":"Which of the following statements is incorrect?","o":["Five different patients with the same autosomal dominant mutation having different presentations can be explained by variable expressivity.","Genetic imprinting describes a genetic process by which certain genes are expressed in a parent-of-origin-specific manner via upregulation of expression of specific alleles.","The degree of linkage between mutations is measured by calculating the distance between two genetic loci.","Penetrance describes whether individuals carrying a particular gene mutation also express an associated trait or phenotype."],"k":"B","x":"Genetic imprinting involves downregulation of expression of specific alleles, which allows for gene expression in a parent-of-origin-specific manner. PAGES 108-111","bn":34},{"n":35,"s":"Low-dose computed tomography (CT) technique has been routinely implemented to image which of the following anatomic sites?","o":["Neck","CT angiogram of the neck","Sinuses","Cervical spine"],"k":"C","x":"Low-dose techniques should be used for imaging bony structures in the head and neck, such as the paranasal sinuses, temporal bone, and teeth, as more image noise can be accepted without clinically relevant decline in image quality. PAGES 125-127","bn":35},{"n":36,"s":"In suspected cases of postseptal cellulitis, which of the following is the preferred modality of choice?","o":["Magnetic resonance imaging (MRI) orbit without contrast","MRI orbit with and without contrast","CT neck without contrast","Positron emission topography (PET)-CT"],"k":"B","x":"If postseptal orbital cellulitis is suspected on CT, then contrast-enhanced MRI of the orbits is obtained to fully define the extent of the disease, including intracranial extension. A CT neck would not image the orbit. PAGES 132-133","bn":36},{"n":37,"s":"When evaluating sensorineural hearing loss in adults, the advantage of MRI of the internal auditory canal with and without contrast is which of the following:","o":["Evaluate the bony anatomy","Can evaluate 7th and 8th cranial nerves along with membranous labyrinth","Can assess for brainstem lesion","Band C","A and B"],"k":"D","x":"MRI has the advantage of not only being able to evaluate the 7th and 8th cranial nerve complexes and the membranous labyrinth but also for pathology affecting the brainstem (ischemic or demyelinating disease) where the nuclei and parenchymal courses of the nerves reside. PAGE 135","bn":37},{"n":38,"s":"Which statement is true regarding dual-energy CT in head and neck imaging?","o":["Higher keV helps in distinguishing recurrent tumor versus posttreatment changes.","Lower keV level is useful for improving the detection of laryngeal cartilage invasion by tumor in patients with laryngeal and hypopharyngeal head and neck squamous cell carcinoma.","Decrease radiation dose to the patient by reconstructing noncontrast images from the data obtained from contrast-enhanced images.","It takes more time to scan."],"k":"C","x":"In dual-energy CT, lower keV levels is helpful in distinguishing recurrent tumor versus posttreatment changes. A higher keV level is useful for improving the detection of laryngeal cartilage invasion by tumor in patients with laryngeal and hypopharyngeal head and neck squamous cell carcinoma. Dual-energy CT can also help with metal artifact reduction. PAGES 144-145","bn":38},{"n":39,"s":"In postoperative cases of epidermoid or cholesteatoma, which MRI sequence is most sensitive to detect recurrence or residual disease?","o":["Diffusion-weighted imaging","T1 with contrast","T2","Fluid attenuated inversion recovery","T1 without contrast"],"k":"A","x":"Diffusion-weighted imaging can be useful in evaluation of petrous apex lesions and in postoperative temporal bone evaluation. Both epidermoid cysts of the petrous apex (congenital cholesteatomas) and recurrent acquired cholesteatomas in the postoperative temporal bone demonstrate high signal intensity compared to brain tissue on diffusion-weighted images. Nonecho planar-based diffusion-weighted sequences with thinner sections and decreased susceptibility artifacts are the most useful for helping distinguish scar tissue and granulation tissue from recurrent cholesteatoma in the postoperative temporal bone. PAGE 137","bn":39},{"n":40,"s":"A 65-year-old male presents to your clinic with a 1-cm tongue lesion concerning for malignancy. Which method of sampling should you proceed with to best determine tumor staging?","o":["Shave biopsy","Punch biopsy","Fine needle aspiration","Mucosal swab"],"k":"B","x":"The eighth edition AJCC guidelines for oral cavity SCC incorporate depth of invasion for tumor staging. Oral biopsy samples obtained using a punch instrument rather than other methods are significantly less prone to artifacts such as crushing, splitting, hemorrhage, and fracture. PAGES 148-149","bn":40},{"n":41,"s":"What is the nodal yield threshold during elective neck dissection for oral cavity cancers that has been shown to be associated with a significant reduction in survival?","o":["Less than 5","Less than 11","Less than 18","Less than 24"],"k":"C","x":"A 2011 report by Ebrahimi et al found that nodal yield of less than 18 during elective neck dissection for oral cavity cancers resulted in a significant reduction in overall survival. PAGE 154","bn":41},{"n":42,"s":"A 33-year-old female with cervical lymphadenopathy is taken to the operating room as you suspect possible lymphoma. How should the subsequent excisional lymph node biopsy be processed?","o":["The specimen should be sent “fresh” to the pathology laboratory and processed in a timely manner.","The specimen should be sent intact in a fixative solution to the pathology laboratory.","The specimen should be divided into several pieces by the surgeon and sent in a fixative solution to the pathology laboratory.","The specimen should be sent “fresh” to the pathology laboratory but can be processed in a few days."],"k":"A","x":"If a lymphoproliferative disorder is in the differential diagnosis, an excised lymph node should not be placed into a fixative solution. Instead, it should immediately be sent to the surgical pathology laboratory “fresh”—with the concern for lymphoma clearly indicated on the requisition. PAGE 154","bn":42},{"n":43,"s":"Which of the following head and neck tumor locations has the most marked shrinkage following excision?","o":["Maxillary alveolar ridge","Hard palate","Buccal mucosa","Oral tongue"],"k":"C","x":"Tumor location may play a role in the degree of shrinkage. According to a 2008 study by Cheng et al, the effects of shrinkage in HNCs based on tumor location appear to be most marked in tumors of the buccal mucosa, mandibular alveolar ridge, and retromolar trigone. PAGE 153","bn":43},{"n":44,"s":"Which of these factors has the greatest impact on prognosis for patients with oropharyngeal cancer?","o":["Patient age","Human papillomavirus (HPV) status","Alcohol use","Ethnicity"],"k":"B","x":"Despite the fact that they are squamous carcinomas, HPV-related cancers are clinicopathologically unique from conventional SCC. Patients with HPV-related SCC have improved prognosis when compared to cohorts with HPV-negative tumors. PAGE 168","bn":44},{"n":45,"s":"Which of the following condition is most likely to present with hearing loss?","o":["Migraine","Vertebrobasilar insufficiency","Anteroinferior cerebellar artery occlusion","Cerebellar infarction"],"k":"C","x":"Occlusion of the anteroinferior cerebellar artery results in infarction of the dorsolateral pontomedullary region and the inferolateral cerebellum. Because the labyrinthine artery originates from the anteroinferior cerebellar artery in 80% of patients, infarction of the membranous labyrinth is a common accompaniment. Severe vertigo, nausea, and vomiting are common initial symptoms. Other symptoms include ipsilateral hearing loss, tinnitus, facial paralysis, and cerebellar asynergy. Vertebrobasilar insufficiency generally causes vertigo without hearing loss. Cerebellar infarction can cause vertigo, vomiting, and ataxia. Migraine can cause vertigo, but hearing loss is rarely present. PAGES 171-179","bn":45},{"n":46,"s":"Which drug is most likely to be effective for treatment of migraine-associated vertigo?","o":["Sumatriptan","Meclizine","Nortriptyline","Diazepam"],"k":"C","x":"Tricyclic antidepressants are currently the mainstay of migraine prophylaxis. Nortriptyline is usually better tolerated than amitriptyline due to the more mild side effect profile. Sumatriptan (Imitrex), a SHT1D receptor agonist, has become the principal drug to abort severe migraine headache, but it has limited efficacy for concurrent vestibular symptoms. Antivertiginous medications, such as meclizine, may be used for symptom management. Benzodiazepines are not generally used for migraine-associated vertigo. PAGES 179-180","bn":46},{"n":47,"s":"Subarachnoid hemorrhage is most commonly caused by:","o":["Aneurysm","Trauma","Tumor","Seizure"],"k":"A","x":"Eight-five percent of subarachnoid hemorrhage cases are caused by aneurysm, most commonly saccular (berry) aneurysm rupture within the circle of Willis. PAGE 177","bn":47},{"n":48,"s":"Patients with a Chiari type I malformation would commonly present to an otolaryngologist for the below symptoms except:","o":["Headache","Dizziness","Hoarseness","Unilateral hearing loss"],"k":"D","x":"Symptoms of Chiari type I malformation include upper extremity weakness, sensory loss, pain, occipital headaches, dizziness, dysphagia, aspiration, and hoarseness. Unilateral hearing loss is not associated with Chiari type I malformation. PAGES 186-187","bn":48},{"n":49,"s":"Slurred speech and tongue fasciculations are common early manifestations of:","o":["Amyotrophic lateral sclerosis","Migraine","Guillain-Barré","Anterior-inferior cerebellar artery stroke"],"k":"A","x":"Amyotrophic lateral sclerosis affects both the upper and lower motor neurons of the central nervous system. It leads to progressive muscle atrophy as well as spasticity. Though the illness typically begins in an area of contiguous peripheral muscles (upper extremity greater than lower extremity), manifestations in the head and neck can be the first signs of illness in up to 28% of patients. This, bulbar-onset form of the disease, may present with slurred speech, inability to project the voice, hoarseness, or dysphagia and is associated with a more rapid progression. Tongue atrophy and fasciculations are also commonly seen. Guillain-Barré syndrome is characterized by symmetrical motor weakness, paresthesias, and areflexia that begin in the lower extremities and ascend to affect the upper extremities, oropharyngeal structures, and respiratory muscle. Migraine commonly presents with headache, nausea, vomiting, light sensitivity, or vertigo. An anterior-inferior cerebellar artery stroke leads to severe vertigo, nausea, vomiting, hearing loss, tinnitus, facial paralysis, and cerebellar asynergy. PAGE 181","bn":49},{"n":50,"s":"Delayed repair of orbital floor blowout fractures is most appropriate for patients with:","o":["Significant enophthalmos on the side of the fracture","Inferior rectus muscle entrapment","A fracture encompassing over 50% of the orbital floor","An abnormal oculo-cardiac reflex"],"k":"C","x":"Large orbital floor fractures, especially those in which the periorbita is not violated, may not develop significant enophthalmos or diplopia and can be managed with observation initially. Delayed orbital floor fracture repairs in this setting have similar outcomes to early repair. Fractures in which there is already significant enophthalmos should be repaired early, given the relative ease of early repairs versus delayed repair. Inferior rectus muscle entrapment or the presence of an abnormal oculo-cardiac reflex should prompt immediate repair and release of the entrapped muscle. PAGE 192","bn":50},{"n":51,"s":"Initial management of corneal exposure in the setting of an acute Bell palsy should begin with:","o":["Tarsorrhaphy","Gold weight placement in the upper eyelid","Lower lid ectropion repair","Ocular lubrication with artificial tears and ointments"],"k":"D","x":"Proper ocular surface lubrication is the initial step in managing corneal exposure due to paralytic lagophthalmos in the setting of an acute Bell palsy. If function is expected to recover but lubrication is still inadequate, a temporary tarsorrhaphy can be placed. Permanent tarsorrhaphy, eyelid weight placement, and ectropion repair are most appropriate for chronic facial nerve paralysis when conservative management with lubrication is inadequate. PAGES 198-199","bn":51},{"n":52,"s":"Which of the following is an early sign of optic neuropathy?","o":["Loss of color vision","Ophthalmoplegia","Decrease in best-corrected visual acuity","Unilateral hemianopia"],"k":"A","x":"Loss of color vision is a common early sign of optic neuropathy and generally occurs prior to decrease in visual acuity. Ophthalmoplegia is a late signs of severe orbital disease/cavernous sinus thrombosis, and a unilateral hemianopia is an unusual finding that would localize pathology to the ipsilateral perichiasmal region of the optic tract. PAGE 192","bn":52},{"n":53,"s":"Appropriate management of silent sinus syndrome (SSS) includes:","o":["Early orbital implant placement","Sublabial approach to the maxillary sinus","Endoscopic maxillary antrostomy","Strabismus surgery to address diplopia"],"k":"C","x":"Initial treatment of SSS should include endoscopic surgery to ventilate the maxillary sinus. Care with uncinate removal is paramount as anatomic changes associated with SSS place patients at increased risk for orbital injury. Following maxillary sinus ventilation, some patients will have reversal of enophthalmos with return of the orbital floor to a more normal position, others may require implant placement for satisfactory cosmetic outcome. While SSS patients may have diplopia, addressing the underlying disease and eye position should resolve this issue. PAGE 195","bn":53},{"n":54,"s":"A 7-year-old presenting with periorbital swelling and fever is found to have acute sinusitis and a 0.75-cm medial subperiosteal abscess. Which of the following is the most appropriate management?","o":["Oral antibiotics and close outpatient follow-up","IV antibiotics and inpatient observation","Endoscopic sinus surgery and abscess drainage","Abscess drainage by interventional radiology with placement of a passive drain"],"k":"B","x":"In children between | and 9 years old, IV antibiotics and inpatient observation is the preferred approach for an uncomplicated subperiosteal abscess of less than 1 cm. Worsening of clinical course would warrant endoscopic sinus surgery with drainage of the abscess. Risk for progression and threatened visit requires close (inpatient) observation. Interventional radiology is not useful in managing infections in this space. PAGES 193-194","bn":54},{"n":55,"s":"A 30-year-old patient is scheduled for tympanoplasty today at 7:00 am. The patient informs you, as you are receiving consent, that they had a cup of coffee with milk this morning at 6:00 am. How long should the patient’s elective surgery be delayed from the time they had the coffee?","o":["2 hours","4 hours","6 hours","8 hours","No delay and can proceed as scheduled"],"k":"B","x":"Milk products are 4 hours nothing by mouth for elective procedures. PAGE 203","bn":55},{"n":56,"s":"A 70-kg, 58-year-old male, with a past medical history of rheumatoid arthritis, hypertension, and hyperlipidemia, is scheduled for a partial thyroidectomy. Are there any concerns regarding his airway examination that must be taken into consideration?","o":["He may have a potentially difficult airway and high Mallampati score.","No specific considerations regarding his airway.","He may require cervical spine stabilization and intubation with a GlideScope or fiberoptic scope.","He is at high risk for obstructive sleep apnea."],"k":"C","x":"Patient’s history of rheumatoid arthritis is concerning for possible atlanto-occipital subluxation. Video-assisted laryngoscopy with cervical stabilization would be a good conservative management choice for intubation. PAGE 204","bn":56},{"n":57,"s":"You are present for the anesthetic induction of your 16-year-old patient for a tonsillectomy. The patient is 60 kg and has no past medical history. The patient is given propofol, fentanyl, and rocuronium for induction and becomes apneic. The anesthesiologist is not able to bag ventilate the patient and attempts oral airway placement with no success. Direct laryngoscopy and video-assisted laryngoscopy are not successful. What is the best next step?","o":["Emergency cricothyrotomy/tracheotomy","Nasal intubation","Laryngeal mask airway placement","Fiberoptic intubation"],"k":"C","x":"According to the emergency airway algorithm, if intubation fails and mask ventilation is difficult despite two provider ventilation, then a laryngeal mask airway should be inserted. PAGE","bn":57},{"n":58,"s":"Your 40-year-old patient with end-stage renal disease on dialysis three times a week is undergoing a bilateral myringotomy and tube exchange. Which neuromuscular blocking agent would be the best option?","o":["Rocuronium","Vecuronium","Cisatracurium","Pancuronium"],"k":"C","x":"Cisatracurium is not dependent on renal function for elimination. PAGE 212","bn":58},{"n":59,"s":"You are draping your patient after an uneventful induction of general anesthesia with succinylcholine and propofol. The patient is being maintained on sevoflurane. Acutely, there is a rise in end-tidal carbon dioxide, tachycardia with a heart rate of 140 beats/min and temperature increase to 40°C. What is the most likely diagnosis?","o":["Anaphylaxis","Local anesthetic toxicity","No acute issue","Malignant hyperthermia"],"k":"D","x":"Signs of malignant hyperthermia include increased end-tidal carbon dioxide, rigidity, tachycardia, respiratory and metabolic acidosis, increased temperature (often a late sign), and myoglobinuria. PAGE 216","bn":59},{"n":60,"s":"A 35-year-old male with a large craniopharyngioma is admitted following transsphenoidal pituitary resection. He develops polyuria and elevated sodium levels. What is the most likely pathophysiology leading to his symptoms and the best method of treatment?","o":["Neuronal necrosis leading to release of excess antidiuretic hormone (ADH) from neurosecretory granules; ADH analogues and water restriction","Neuronal axon shock leading to inability to secrete ADH; ADH analogues and water restriction","Neuronal necrosis leading to release of excess ADH from neurosecretory granules; fluid replacement and ADH antagonists","Neuronal axon shock leading to inability to secrete ADH, fluid replacement, and ADH antagonists"],"k":"B","x":"The patient is most likely in diabetes insipidus due to injury of the pituitary stalk. The initial phase of hypothalamic diabetes insipidus is neuronal axon shock leading to the inability to secrete ADH. Decreased ADH will lead to large volume dilute urine and hypernatremia. This can be treated with ADH analogues like desmopressin and water restrictions. A small percent of patients will go on to develop neuronal necrosis, which results in excess release of ADH (syndrome of inappropriate antidiuretic hormone secretion) characterized by concentrated urine and hyponatremia. This can be treated with ADH antagonists. PAGE 223","bn":60},{"n":61,"s":"A 65-year-old female presents to the hospital with acute mental status changes, bone and muscle pain, constipation, and fatigue. Initial examination shows calcium level of 14 mg/ dL and creatinine of 2.6. Which of the following is the appropriate next step in management?","o":["Loop diuretics to increase urinary calcium excretion","Parathyroidectomy","Rehydration with normal saline 2 to 4 L/d","IV bisphosphonate therapy"],"k":"C","x":"The first step in managing acute hypercalcemia is rehydration. These patients will often have renal insufficiency due to increased filtration of calcium, which impairs renal tubular sodium reabsorption. Decreased sodium reabsorption causes extracellular volume depletion and reduced glomerular filtration rate, which then worsens calcium clearance and further contributes to hypercalcemia. If a loop diuretic is administered prior to hydration, further kidney damage can occur. IV bisphosphonates are nephrotoxic and should not be given to patients with AKI. Parathyroidectomy is not indicated unless the hypercalcemia is mediated by parathyroid hormone. PAGE","bn":61},{"n":62,"s":"Which of the following are irreversible effects of untreated primary hyperparathyroidism?","o":["Osteoporosis","Renal disease causing hypertension","Atherosclerosis and left ventricular hypertrophy","Cholelithiasis and pancreatitis"],"k":"B","x":"Untreated primary hyperparathyroidism can have significant adverse outcomes including renal disease with hypertension, bone disease with osteopenia, osteoporosis or osteitis fibrosa cystica, gastrointestinal complications including pancreatitis and cholelithiasis, neuropsychiatric abnormalities, and cardiac disease with blood vessel calcifications and left ventricular hypertrophy. Most of these symptoms, with the exception of renal disease and hypertension, will improve following parathyroidectomy. PAGE 226","bn":62},{"n":63,"s":"A 25-year-old female presents with palpitations, fever, and tachycardia with atrial fibrillation. On examination, she has a prominent thyroid goiter and reports dysphagia and dyspnea when laying down. She is diagnosed with acute thyroid storm due to Graves disease. Which of the following is the best treatment option for this patient?","o":["Propylthiouracil and beta-blockade only","Methimazole and beta-blockade only","Methimazole and beta-blockade followed by total thyroidectomy when euthyroid","Potassium iodide only followed by total thyroidectomy","Immediate total thyroidectomy","Radioactive iodine only"],"k":"C","x":"Total thyroidectomy is the preferred management for patients who have large goiters with compressive symptoms. Patients with thyrotoxicosis undergoing surgery should be treated with antithyroid drugs until euthyroid. PAGE 231","bn":63},{"n":64,"s":"A 20-year-old male presents with elevated parathyroid hormone and calcium. You are considering a diagnosis of multiple endocrine neoplasia type 1. If the diagnosis is confirmed, what would be the next steps in management be?","o":["Genetic testing of the patient and all relatives","Dual-energy x-ray absorptiometry scan, vitamin D levels, and parathyroid localization imaging","Annual plasma biochemical evaluations of gastrointestinal tract hormones and abdominal MRI, CT, or endoscopic ultrasound","Annual pituitary MRI"],"k":"B","x":"The next best step would be further workup of the primary hyperparathyroidism with dual-energy x-ray absorptiometry scan, vitamin D, and parathyroid localization imaging. Genetic testing is indicated for first-degree relatives but not all relatives. Annual plasma biochemical evaluation is important for detection of pancreatic neuroendocrine tumors. Imaging is indicated if biochemical testing is positive. Screening for pituitary adenomas is done with biochemical evaluation of prolactin or insulinlike growth factor with pituitary imaging every 3 to 5 years as indicated. PAGES 236-237","bn":64},{"n":65,"s":"Sarcopenia refers to a decline in which of the following?","o":["Muscle mass","Kidney function","Hair follicles","Bone density"],"k":"A","x":"Sarcopenia is an important geriatric concept that all otolaryngologists should be familiar with. The term sarcopenia was first introduced in 1989 as an age-dependent decline in muscle mass. It is a combination of the Greek word sarx, meaning muscle, and penia, meaning to lose. Sarcopenia is a clinical syndrome that refers to a decline of physical function due to decreased muscle strength resulting from decreased skeletal muscle mass. PAGE 243","bn":65},{"n":66,"s":"Which term measures the number of older people against working adults in a society?","o":["Compression of morbidity","Elder dependency ratio","Senescence","Age factor"],"k":"B","x":"The “elder dependency ratio” measures the number of older people against working adults. The elder dependency ratio, like the total dependency ratio that includes dependent children, evaluates care needs at a population level. These population measures are critical to understanding health care needs and projecting necessary services in any society. The term compression of morbidity refers to the burden of lifetime illness and functional loss can be compressed as close as possible to the time of death, if the age of onset of the first chronic ailment can be delayed. Senescence refers to the process of aging and generally refers to cellular processes. PAGE 243","bn":66},{"n":67,"s":"Which factor is most consistently association with adverse outcomes and increased resource utilization after sinonasal cancer surgery?","o":["Age","Frailty","Gender","Comorbidity index"],"k":"B","x":"Goel et al concluded that frailty appeared to have a stronger and more consistent association with adverse outcomes and increased resource utilization after sinonasal cancer surgery than age or comorbidity index. They suggest using frailty scoring in surgical risk stratification to guide strategies to prevent or mitigate adverse events in high-risk groups. PAGE 244","bn":67},{"n":68,"s":"What is the most widely used method to assess muscle strength in the geriatric population?","o":["Handgrip","Bicep curl","Chair stand test","Gait speed measurement test"],"k":"A","x":"Handgrip strength seems to be the most widely used method to assess muscle strength. This measurement is easy to perform, low cost, and does not require special training. A strength measuring device, termed a dynamometer, can be purchased online for approximately $25. Several other easily performed tests include the repeated chair stand test, the timed get-up-and-go test, and the gait speed measurement test. PAGE 244","bn":68},{"n":69,"s":"Approximately what proportion of adults in the United States may not inform their physicians of their use of complementary and integrative medicine (CIM) treatments?","o":["33%","40%","75%","95%"],"k":"C","x":"About three-quarters of American adults using CIM therapies do not report such utilization. Surveys indicate that 33% to 40% of adults in the United States may use CIM treatments for health and well-being. Less than 5% of U.S. adults forgo conventional allopathic health care altogether. Since a significant proportion of patients utilize CIM therapies, the practicing otolaryngologist must be facile at elucidating such information and providing counseling and recommendations on CIM treatments for their patients. PAGE 248","bn":69},{"n":70,"s":"Which of the following herbal therapies may inhibit postsurgical wound healing due to its immunomodulatory effects?","o":["Arnica","Echinacea","Honey","St. John’s wort"],"k":"B","x":"Echinacea may affect wound healing due to its immunostimulatory effects. Arnica has been shown to reduce postrhinoplasty edema but also promoted the intensity and persistence of ecchymoses. Honey is thought to promote wound healing via its antioxidant and antibacterial effects. St. John’s wort has been shown to induce photosensitivity. While it has been studied in wound healing, its mechanism is unclear. PAGE 255","bn":70},{"n":71,"s":"Vertigoheel is felt to be efficacious in the treatment of vertigo through what mechanism(s)?","o":["Improve vestibular microcirculation","Promote resorption of otoliths","Activate vestibular regulatory systems within the brainstem","Both A and C"],"k":"D","x":"Vertigoheel is thought to improve microcirculation and activate vestibular regulatory systems within the brainstem. PAGE 255","bn":71},{"n":72,"s":"What CIM therapy is recommended as an option for allergic rhinitis patients desiring nonpharmacologic therapy?","o":["Acupuncture","Black caraway or cumin seed","Butterbur","Honey produced with local pollens"],"k":"A","x":"Recent meta-analyses of RCTs indicate that acupuncture may reduce nasal symptoms, improve quality of life, and reduce the need for rescue medications in allergic rhinitis. Clinical practice guidelines and international consensus statements recommend acupuncture as an option. Black caraway or cumin seed (Nigella sativa) and butterbur may improve allergic rhinitis symptoms, but study results are mixed for both treatments. Likewise, results for honey in the management of allergic rhinitis are variable. Overall, most studies exploring the efficacy of natural product therapies for allergic rhinitis are small and of limited methodological quality, resulting in no recommendation for natural products in allergic rhinitis treatment guidelines. PAGE 257","bn":72},{"n":73,"s":"Complementary and integrative medicine treatments show the most promise in what aspect(s) of HNC management?","o":["Cancer prevention","Cancer treatment","Mitigation of radiation-associated mucositis and xerostomia","Mitigation of surgery-related pain and decreased range of motion"],"k":"B","x":"CIM treatments such as acupuncture and herbal therapies have shown some efficacy in managing xerostomia and mucositis. While antioxidants such as curcumin and green tea have been studied for cancer prevention, the relatively low incidence of HNC and potentially confounding variables of diet and lifestyle choices make establishing evidence of a clinically significant preventive effect difficult. Herbal remedies for the treatment of cancer show mixed results. There are less data for CIM therapies for the management of pain and decreased range of motion than for the mitigation of radiation-associated mucositis and xerostomia. PAGES 257-258","bn":73},{"n":74,"s":"As of 2017, tobacco use was responsible for how many deaths worldwide per year?","o":["300,000","1 million","7 million","167,000"],"k":"C","x":"As of 2017, tobacco use was responsible for over 7 million deaths worldwide per year. In the United States, tobacco use results in 480,000 deaths yearly. PAGE 263","bn":74},{"n":75,"s":"A patient presents to your clinic 6 days postoperatively after a paramedian forehead flap reconstruction of a nasal defect for suture removal. When asked how they are doing with recovery, they regretfully inform you that they have not been able to refrain from smoking postoperatively but would like assistance with this. You prescribe them a gum that has the chemical primarily responsible for tobacco dependence. What is this chemical?","o":["Nicotine","Dopamine","Cocaine","Tobacco"],"k":"A","x":"Nicotine is the chemical primarily responsible for tobacco dependence. PAGE 263","bn":75},{"n":76,"s":"The literature supports using the “5 A’s” as an approach to smoking cessation. Choose the following answer choice that is not 1 of the “5 A’s”?","o":["Ask","Assess","Advise","Abstain"],"k":"D","x":"The question asks which is not one of the 5 A’s of smoking cessation. The 5 A’s in order are Ask, Advise, Assess, Assist, and Arrange. First, you want to ask how the patient is doing and about their opinion of smoking. Next, advise them by discussing the risks of smoking and the benefits of smoking cessation. Third, assess the patient’s willingness to quit. After determining the patient’s desire to stop smoking, you should assist them by offering a multimodality treatment plan. This plan may include counseling, nicotine replacement therapy, pharmacotherapy, or support groups. Lastly, arrange for a follow-up visit to help them remain consistent. PAGES 265-267","bn":76},{"n":77,"s":"A 37-year-old male presents to your clinic complaining of “something in his throat.” His father is recovering from a total laryngectomy. The patient has smoked two packs of cigarettes per day for the past 17.5 years. He believes that he has laryngeal cancer. You open a nonjudgmental conversation about smoking cessation. Next, you advise him on the risks of tobacco usage and the benefits of quitting. Using the “5 A’s,” what is your ideal next step in the conversation?","o":["Tell him that he can die if he continues smoking.","Call his father on the phone and get him to convince his son to stop smoking.","Assess the patient’s willingness to quit and assist them with these efforts.","Prescribe varenicline."],"k":"C","x":"In this question stem, you have already asked about smoking cessation and advised him on the risks of smoking and the benefits of quitting. The next step is to ass to quit. PAGES 265-267 ‘ss this patient’s willingness","bn":77},{"n":78,"s":"What is the mechanism of action of varenicline?","o":["Competitive inhibitor of nicotine","A dopamine receptor partial agonist","Inhibits the neuronal uptake of dopamine and norepinephrine","A nicotine receptor partial agonist"],"k":"D","x":"Varenicline acts as a nicotine receptor partial agonist. Bupropion works to inhibit neuronal uptake of dopamine and norepinephrine. PAGE 269","bn":78},{"n":79,"s":"A 55-year-old patient with a history of T3N1M0 oral cavity squamous cell carcinoma (SCC) previously treated with surgery and adjuvant radiation therapy presents with locoregional recurrence at the primary site that is determined to be unresectable based on imaging. The most appropriate first-line systemic treatment in this patient is which of the following?","o":["Paclitaxel","Cetuximab","Pembrolizumab","Both A and B"],"k":"D","x":"When possible, multiagent therapy should be utilized over monotherapy given that higher rates of disease response can be achieved when more than one systemic agent is used. The role of immunotherapy is rapidly emerging; however, it should not be used a first-line agent. PAGE 277","bn":79},{"n":80,"s":"A 40-year-old female with a history of T4N1MO0 sinonasal melanoma that has not responded to chemotherapy and immunotherapy presents to your clinic with multiple concerns. Of note, she has lost vision in her right eye and is bothered by facial disfigurement caused by her tumor. In addition, she reports constant facial pain, odor, and intermittent nasal bleeding. Which of the following reasons would not be an indication to proceed with palliative surgery?","o":["Intermittent hemorrhage","Cosmesis","Intractable pain","All of the above can be considered indications for palliative surgery"],"k":"D","x":"Palliative surgery can be considered in a number of clinical scenarios after careful evaluation of risks and benefits. Aggressive surgery can be considered if symptoms, quality of life, and longevity are positively influenced by treatment of locoregional disease or tumor debulking. PAGE 278","bn":80},{"n":81,"s":"A 90-year-old male presents to your clinic with a large soft palate ulcer, which is subsequently diagnosed as a T4NIMO oropharyngeal SCC. Radiographic survey reveals intimate involvement with the ipsilateral carotid artery. The patient’s medical history includes congestive heart failure, end-stage renal disease, severe atherosclerotic disease, and multiple prior strokes. Appropriate justification for withholding surgery as a treatment option include all of the following except:","o":["Technical difficulties in proceeding with surgical resection","Aggressive nature and extent of tumor","Multiple medical comorbidities","Advanced age"],"k":"D","x":"Although it may be associated with multiple medical comorbidities, advanced patient age by itself is not an indication to withhold surgical treatment of disease. There is limited evidence to suggest that older individuals have worse outcomes from surgery based on age alone. PAGES 276-277","bn":81},{"n":82,"s":"A 55-year-old male with a history of T2NOMO0 oropharyngeal SCC treated with radiation therapy 8 months ago presents with ongoing hyperalgesia and allodynia, especially with meals. His clinical and radiographic examination reveals no evidence of recurrent disease. He currently takes 5 mg of oral oxycodone every 4 hours; however, this has had minimal impact on his pain. His medical history includes a history of depression treated with an monoamine oxidase inhibitor and a myocardial infarction, which required angioplasty 2 years ago. What is the next best step in treatment?","o":["Amitriptyline","Gabapentin","Increase dose of oxycodone","Venlafaxine"],"k":"B","x":"Neuropathic pain, which is refractory to single-agent therapy, should be treated with a second agent. Tricyclic antidepressants (amitriptyline) should be used with caution in patients with a cardiac history, given their negative impact on myocardium contractility and conduction. Furthermore, selective serotonin reuptake inhibitors and serotonin and norepinephrine reuptake inhibitors (venlafaxine) should be avoided in patients on monoamine oxidase inhibitors given the risk for serotonin syndrome. PAGES 283-286","bn":82},{"n":83,"s":"All of the following is true regarding cannabis use in head cancer except:","o":["Legality of medicinal cannabis in the United States varies at the federal and state level.","The optimal dose and route of delivery of medicinal cannabis for HNC-related pain is not clearly defined.","Medicinal cannabis may ameliorate treatment-related anorexia.","Recreational use has been proven to cause development of"],"k":"D","x":"There is no evidence to suggest that marijuana leads to the development of HNC. PAGE 286","bn":83},{"n":84,"s":"Which receptor is most commonly associated with severe acute respiratory syndrome coronavirus 2 (SARS-CoV-2) virus entry in humans?","o":["Angiotensin-converting enzyme-2","CD4","Integrins","CCR5"],"k":"A","x":"The two main receptors associated with SARS-CoV-2 viral entry are angiotensin-converting enzyme-2 and TMPRSS2, which are expressed in high levels in the nasal cavity in healthy subjects. PAGE 293","bn":84},{"n":85,"s":"What is the most common serious side effect of SARS-CoV-2?","o":["Pneumonia","Myocardial infarction","Renal failure","Headache"],"k":"A","x":"Initial presenting symptoms for COVID-19 are variable and can be difficult to distinguish from other common respiratory illnesses like influenza. The most common symptoms include fever, cough, and myalgia, while pneumonia is the most common serious complication of COVID-19. Other less prevalent but still common symptoms include shortness of breath, runny nose, sore throat, headache, nausea/vomiting, and diarrhea. When compared directly to symptoms of influenza, anosmia, dysgeusia, frontal headaches, and bilateral crackling sounds on auscultation were statistically more frequent in COVID-19. PAGE 295","bn":85},{"n":86,"s":"The American College of Rheumatology recommends which of the following basic tests for children with suspected multisystem inflammatory syndrome?","o":["EKG","Antinuclear antibody testing","Vision testing","C-reactive protein"],"k":"D","x":"The American College of Rheumatology recommends that children with suspected multisystem inflammatory syndrome should have basic laboratory testing (complete blood count, basic metabolic panel, and C-reactive protein) as well as reverse transcription-polymerase chain reaction and serology testing for SARS- CoV-2. PAGE 297","bn":86},{"n":87,"s":"Which topical treatment may be implemented to reduce potential SARS-CoV-2 viral exposure during mucosal surgery?","o":["Povidone-iodine solution (PVP-I)","Chlorhexidine","Hydrogen peroxide","Ethyl alcohol"],"k":"A","x":"There are some mitigation strategies that have been implemented to reduce potential viral exposure during mucosal surgery. Most notably, topical PVP-I has been recommended to preoperatively reduce viral load. PVP-I solution as a gargle has been implemented in multiple settings to safely decrease bacterial burden and reduce infection risk. In addition, PVP-I has demonstrated bactericidal and virucidal properties in in vitro models. More specifically, PVP-I has recently been shown to effectively eliminate SARS-CoV-2 in dilute concentrations with only 15 seconds of contact time. PVP-I is therefore a safe and reasonable option in surgical procedures where topical application of PVP-I is feasible and appropriate. PAGE 296","bn":87}]},{"t":"Rhinology and Allergy","q":[{"n":1,"s":"The anterior ethmoid artery originates from which vessel?","o":["Internal maxillary artery IMA)","Ascending pharyngeal artery","Ophthalmic artery","Middle meningeal artery"],"k":"C","x":"The anterior ethmoid artery branches off of the ophthalmic artery. For patient with refractory epistaxis from this site, embolization is infrequently used due to risk of blindness from occlusion of the ophthalmic artery. PAGE 302","bn":1},{"n":2,"s":"What percentage of carotid arteries are partially dehiscent into the sphenoid sinus?","o":["5%","25%","50%","75%"],"k":"B","x":"The carotid artery runs lateral to the sphenoid sinus and is partially dehiscent into the sinus in 25% of patients. Care when instrumenting this area is advised. PAGE 304","bn":2},{"n":3,"s":"Which is the most common superior attachment of the uncinate process?","o":["To the orbit","To the skull base","To the middle turbinate","To the superior turbinate"],"k":"A","x":"The superior attachment site of the uncinate process is variable. The most common configuration is attachment to the orbit. This creates a medial drainage pathway for the frontal sinus. PAGE","bn":3},{"n":4,"s":"Which area is the thinnest bone of the anterior skull base?","o":["Lateral lamella of the cribriform plate","Planum sphenoidale","Lateral ethmoid roof","Medial lamella of the cribriform plate"],"k":"A","x":"The lateral lamella of the cribriform plate is the thinnest bone of the anterior skull base and is a site of increased risk for skull base injury and CSF leak during endoscopic sinus surgery. PAGE 302","bn":4},{"n":5,"s":"Which of the following separates the anterior and posterior ethmoid cells?","o":["Uncinate process","Onodi cell","Sinus lateralis","Basal lamella"],"k":"D","x":"The basal lamella separates the anterior and posterior ethmoid air cells. Ethmoid cells anterior to the basal lamella drain through the middle meatus, while ethmoid cells posterior to the basal lamella drain through the sphenoethmoid recess. PAGE 302","bn":5},{"n":6,"s":"The olfactory cleft is composed of specialized epithelium which includes the following regions:","o":["Mucosa of the superior/posterior septum as well as the opposing areas of the superior and middle turbinates","Mucosa of the inferior/anterior septum as well as the opposing areas of the superior and middle turbinates","Mucosa of the superior/posterior septum as well as the opposing areas of the superior turbinate only","Mucosa of the superior/posterior septum as well as the opposing areas of the middle turbinate only"],"k":"A","x":"The olfactory cleft includes the posterior septum just below the cribriform and opposing mucosa of the superior and middle turbinates. PAGE 314","bn":6},{"n":7,"s":"During signal transduction, binding of an odorant molecule to the olfactory receptor stimulates which of the following first?","o":["Production of adenylate cyclase to synthesize cyclic adenosine monophosphate (cAMP), which allows influx of Ca2+ resulting in neuronal depolarization","Production of adenylate cyclase to synthesize cAMP, which allows influx of Nat resulting in neuronal depolarization","Production of adenosine monophosphate to synthesize adenosine triphosphate, which allows efflux of Ca2* resulting in depolarization","Production of adenosine monophosphate to synthesize adenosine triphosphate, which allows efflux of Nat resulting in depolarization"],"k":"A","x":"Olfactory receptors collectively form a family of similar G proteins that when activated stimulate adenylate cyclase to synthesize cAMP, which acts as a second messenger to open a cyclic nucleotide—gated ion channel allowing for influx of cations and depolarization of the neuron. PAGE 315","bn":7},{"n":8,"s":"In addition to cumulative environmental injury, olfactory dysfunction with age has been attributed to which of the following?","o":["Decreased regenerative capacity of the olfactory epithelium","Cortical neurodegeneration","Loss of volume of the olfactory bulb","Scarring at the olfactory epithelium"],"k":"A","x":"Possible theories for age-associated olfactory loss include eventual wear-and-tear of the olfactory neurons from the cumulative effect of exposure to environmental toxins and/or progressive depletion of the regenerative capacity of epithelial basal/ stem cells and genetically programmed cell death. PAGE 315","bn":8},{"n":9,"s":"Which of the following does not describe an etiology of traumatic smell loss?","o":["Injury to the frontal lobes of the brain","Injury to the olfactory bulbs","Cortical neurodegeneration","Shearing injury to the olfactory neurons traversing the cribriform plate"],"k":"C","x":"Traumatic smell loss is thought to be a result of injury to the frontal lobes and olfactory bulbs through direct injury or commonly from a blow to the back of the head and rebound contusion to the frontal regions through a coup-contrecoup injury. Another possible mechanism of traumatic smell loss is through the shearing of olfactory neurons at the junction with the cribriform plate as the brain and olfactory bulbs violently shift during trauma. PAGE 315","bn":9},{"n":10,"s":"In the evaluation of a patient with olfactory dysfunction, magnetic resonance imaging (MRI) can be considered in all of the following circumstances except:","o":["The absence of a clear etiology or an unusual presentation","Suspicion of intracranial lesion based on history and examination","Evidence of inflammatory process within the olfactory cleft on endoscopy","Assessment of the olfactory bulbs and gyrus rectus when considering congenital anosmia","History of parosmias following COVID-19 infection with slow but gradual improvement in smell discrimination"],"k":"E","x":"MRI is most useful when the olfactory disorder occurs (a) in the absence of a clear etiology, (b) with an unusual presentation, (c) under suspicion of intracranial lesion based on history and examination, (d) with suspicion of a neurodegenerative process, or (e) in congenital anosmia for assessment of the olfactory bulbs and gyrus rectus. Smell loss associated with viral illness without unusual examination findings does not require imaging. PAGE 318","bn":10},{"n":11,"s":"T-helper 2 (Th2) cells secrete all of the following cytokines except:","o":["Interferon-gamma","Interleukin (IL)-4","IL-5","IL-13"],"k":"A","x":"Interferon-gamma is secreted by T-helper 1 (Th1) cells. IL-4, IL-5, and IL-13 all play important roles in type 2 inflammation. PAGE 334","bn":11},{"n":12,"s":"Which of the following antibodies normally exists as a pentamer?","o":["IgA","IgM","IgE","IgG"],"k":"B","x":"IgM constitutes 10% of serum immunoglobulins, is associated with early immune response, is efficient in complement fixation, and normally exists as a pentamer. IgA is secreted as a dimer; IgD, IgG, and IgE normally exists in monomeric form. PAGE 333","bn":12},{"n":13,"s":"The main IgG subclass that is increased during maintenance immunotherapy is:","o":["IgG1","IgG2","IgG3","IgG4"],"k":"D","x":"High-dose allergen exposure during immunotherapy results in both immune deviation of Th2 responses in favor of a ThO/ Th1 response and the generation of IL-10-and transforming growth factor-B—producing Tregs, with resultant suppression of effector cells and prevention of seasonal increases in ILC2. Maintenance exposure induces preferential switching of B-cell respons antibodies. PAGE 331 s in favor of IgG4","bn":13},{"n":14,"s":"Type 2 innate lymphoid cells (ILC2s) are induced by epithelial-derived cytokines which include?","o":["IL-23","IL-33","IL-24","IL-9"],"k":"B","x":"Innate lymphoid cells are part of the innate immune system and ILC2s are drivers of type 2 inflammation implicated in the pathophysiology of CRSwNP. ILC2s are induced by cytokines secreted from the respiratory epithelium—IL-33, IL-25, and TSLP. These cytokines are potential targets for drug development; an anti-TSLP monoclonal antibody is in clinical trials as a treatment for CRS with polyps. PAGE 325","bn":14},{"n":15,"s":"All of the following are secreted by mast cells, except:","o":["RANTES","Histamine","IL-10","IL-3"],"k":"C","x":"Products of mast cells include histamine; lipid mediators, such as prostaglandins and leukotrienes; chemokines, such as eotaxin and RANTES; as well as cytokines IL-3, IL-4, TNF-a, granulocyte-macrophage colony-stimulating factor, IL-13, TSLP; and macrophage inflammatory protein-la. PAGE 344","bn":15},{"n":16,"s":"A patient undergoing intradermal dilution testing with an allergen has a 13-mm wheel for dilution 4 after a 5-mm wheel for dilution 5. What is the most appropriate next step?","o":["Repeat intradermal testing with the same allergen for dilutions 5 and then 4 on the opposite arm.","The allergen should be retested on a later date.","An EpiPen should be administered, and the patient should be monitored for wheezing, rash, and hypotension.","An oral antihistamine should be administered."],"k":"B","x":"A very large wheel without a preceding positive is considered a flash response and should be retested on another date. PAGES 360-361","bn":16},{"n":17,"s":"Which of the following is not included in the commonly tested allergen groups?","o":["Stinging insects","Arthropods","Citrus","Animal dander"],"k":"C","x":"Commonly tested allergen groups include pollens, animal dander, arthropods (dust mites, cockroaches), molds, and stinging insects. PAGE 356","bn":17},{"n":18,"s":"Which of the following normally releases pollen in the Fall season?","o":["Trees","Grasses","Weeds","Flowers"],"k":"C","x":"Weeds typically produce pollen in the fall, trees produce pollen in the spring, and grasses produce pollen in the summer. PAGE 356","bn":18},{"n":19,"s":"Which of the following statements comparing mold spores and pollen grains is accurate?","o":["Pollen grains are more prevalent in outdoors.","Mold spores commonly cause clinical symptoms at levels of 100 spores/m} or less.","Cross-reactivity between mold antigens is high facilitating screening tests for mold allergies.","Mold spores are commonly seen at levels over 4,000 spores/"],"k":"D","x":"Mold spores are in high abundance relative to pollen grains and have variable cross-reactivity resulting in challenges with allergy testing. Pollen grains can have a clinical impact at relatively low abundance (<100 spores/m3). PAGE 357","bn":19},{"n":20,"s":"In patients with a history of anaphylactic reaction to stinging insects:","o":["Injection immunotherapy should be avoided due to risk of precipitating anaphylaxis","Immunotherapy targeting dust mites can decrease anaphylaxis risk due to cross-reactivity with arthropods","A concomitant positive allergen test predicts a high risk of future anaphylaxis","Allergy testing for stinging insects should be reserved for patients without an anaphylaxis history as this history alone is sufficient for allergy diagnosis"],"k":"C","x":"Allergy testing for stinging insects is generally reserved for patients with a history of reaction to stings. Patients who have both a history of anaphylaxis and positive allergy testing have a very high likelihood of anaphylaxis with future stings. Injection immunotherapy can significantly decrease this risk. PAGE 357","bn":20},{"n":21,"s":"A clinician suspects a sinonasal mass and orders an MRI. Which of the following findings most likely suggests a diagnosis of esthesioneuroblastoma?","o":["A cyst located at the tumor interface with brain parenchyma","T1 hyperintense mass","Expansion of the pterygopalatine fossa","Absence of intracranial extension"],"k":"A","x":"Esthesioneuroblastoma is often characterized by intracranial invasion, cysts at the tumor interface with brain (Fig. 23.23), and a dumbbell shape with a waist at the cribriform plate (see Reference 31). PAGE 383","bn":21},{"n":22,"s":"A computed tomography (CT) of the sinuses shows complete opacification of the left sphenoid sinus and otherwise healthy appearing sinuses. Which of the following factors would most favor further evaluation with MRI?","o":["Speckled hyperdensity within the left sphenoid sinus","Dehiscence of bone overlying the optic canal along the lateral sphenoid wall","Osteoneogenesis surrounding the sphenoid sinus","Left-sided clear nasal drainage"],"k":"D",
