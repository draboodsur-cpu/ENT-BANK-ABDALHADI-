 all of the following except:","o":["Lack of binocular vision","Challenges with hemostasis","Increased risk of thermal injury","Poorer tympanoplasty outcomes than microscopic otologic surgery","Steep learning curve"],"k":"D","x":"Several studies have shown that the outcomes for endoscopic tympanoplasty are on par with microscopic tympanoplasty. PAGES 3141-3143","bn":135},{"n":136,"s":"What is considered the optimal diameter and length of the endoscope for otologic procedures?","o":["2.7 mm and 14cm","3 mm and 14cm","4mm and 14cm","2.7 mm and 18 cm","3 mm and 18 cm","4mm and 18 cm"],"k":"B","x":"The endoscope which is most commonly used for otologic procedures is 3 mm in diameter and 14 cm in length, although this is dependent on surgeon preferences. PAGE 3150","bn":136},{"n":137,"s":"Untreated hearing loss is associated with:","o":["Depression","Anxiety","Social isolation","All of the above"],"k":"D","x":"Hearing loss in older adults may be expected but is not benign. When individuals do not wear hearing aids (ie, when the hearing loss remains untreated), they are more likely to report depression, anxiety, and social isolation than those who do wear hearing aids. PAGES 3157-3158","bn":137},{"n":138,"s":"The primary goal of a hearing aid fitting is:","o":["Returning audibility across frequency and input levels","Returning normal perception","To provide a part-time solution","To promote premium technology"],"k":"A","x":"Although audibility may be achieved across the frequency spectrum and for differing input levels, hearing aids do not restore normal perception of hearing. Additionally, individuals are typically encouraged to wear their hearing aids consistently during all waking hours (and, in some specific cases, some individuals choose to wear them while sleeping). Consistent use facilitates the adaptation process. As such, part-time hearing aid users are not as successful as full-time users. As long as the fittings are verified according to best practices, evidence has indicated that the use of both premium and basic technology hearing aids leads to essentially equal outcomes in daily life (eg, patient preference, speech understanding, listening effort, localization). PAGE 3158","bn":138},{"n":139,"s":"The following signal processing and/or features will improve hearing in noise:","o":["Noise reduction","Directional microphones","Remote microphones","Both B and C"],"k":"D","x":"The use of noise reduction will reduce audibility across the frequency range. This will improve comfort in noisy listening environments but will not improve audibility because hearing aids are unable to fully distinguish between and entirely separate background sounds and the specific signal of interest. As a result, the reduction in audibility will affect both signals. This will not improve hearing in noise. In contrast, directional microphones and remote microphone technology have both been shown to improve signal-to-noise ratio (ie, the level of the signal of interest compared to the background noise level). Higher signal-to-noise ratios indicate more favorable listening conditions, with the signal of interest being louder than the background noise level. PAGES 3170-3171","bn":139},{"n":140,"s":"Audibility is verified using:","o":["Real ear aided response measures","Asking the patient if they can hear","First fit from the manufacturer’s software","None of the above"],"k":"A","x":"When best practices are used to verify hearing aid fittings, real ear-aided response measures are incorporated into the fitting. Research has consistently shown that the use of real-ear probe microphone measurements increases patient loyalty, results in fewer office visits, improves audibility, and increases patient satisfaction. PAGES 3172-3174","bn":140},{"n":141,"s":"Infants will need new earmolds every:","o":["2 years","| year","6 months","2 months"],"k":"D","x":"If earmolds do not fit tightly, sounds will leak out of the ear canal (this causes several problems). Because infants grow so quickly, new earmolds are needed every 2 months. When they reach toddler age, they are likely to need new earmolds every 6 months or so. Older children may be able to wear their earmolds for approximately a year. Regardless of the child’s age, if the earmold seems loose or sounds are leaking out of the ear canal, a new earmold is needed as soon as possible. PAGE 3159","bn":141},{"n":142,"s":"A 65-year-old male presents to the ER with intense vertigo, nausea, and vomiting for the past 3 hours. Physical examination is consistent with a positive head impulse test to the right, negative test of skew, left beating direction fixed nystagmus, and no hearing loss. Which of the following is the most likely diagnosis?","o":["Vestibular neuritis","Anterior inferior cerebellar artery (AICA) stroke","Labyrinthitis","Méniére disease"],"k":"A","x":"Head impulse, nystagmus, test of skew testing includes evaluation of head impulse, nystagmus, and test of skew. This test helps differentiate peripheral from central pathology in patients with acute vestibular syndrome. In this case, the findings of a positive head impulse to the right, negative test of skew, left beating direction-fixed nystagmus, and no hearing loss are most consistent with vestibular neuritis. AICA stroke is a central pathology. Labyrinthitis is associated with hearing loss, and Méniére disease is characterized by a history of fluctuating hearing loss, ear fullness, and vertigo. PAGE","bn":142},{"n":143,"s":"A 75-year-old female presents to your clinic with episodic vertigo. The patient reports symptoms with lying down in bed or rolling over in bed. You lay the patient down to perform the Dix-Hallpike maneuver. What characteristic eye movement should you see for posterior canal benign paroxysmal positional vertigo (BPPV) on the affected side?","o":["Downbeating, geotropic","Horizontal, geotropic","Horizontal, ageotropic","Upbeating, geotropic"],"k":"D","x":"The characteristic eye movement for BPPV is upbeating and geotropic nystagmus. PAGES 3201-3203","bn":143},{"n":144,"s":"A 35-year-old male presents to the clinic with symptoms of autophony and sound-induced vertigo. Which of the following physical examination findings is not suggestive of superior canal dehiscence syndrome?","o":["Valsalva-induced vertigo","Positive malleolar sign","Positive test of skew","Positive Hennebert sign"],"k":"C","x":"Superior canal dehiscence is characterized by third window pathology with symptoms of autophony and hyperacusis. Physical examination findings can include a positive malleolar sign (hearing the 256 Hz tuning fork in the affected ear when placed on the ankle). Hennebert sign is nystagmus evoked by pressure-induced movement of the tympanic membrane while Valsalva-induced vertigo results in nystagmus induced by changes to intracranial or middle ear pressures; both findings can be seen in superior canal dehiscence. A positive test of skew is not consistent with superior canal dehiscence. PAGE 3189","bn":144},{"n":145,"s":"An 85-year-old female presents to your clinic at the request of her internist for evaluation of severe postural instability and difficulty walking in the dark. You identify a medication in her history that leads to direct vestibular loss. Which of the following class of medications is directly cytotoxic to the peripheral vestibular system?","o":["SSRIs","Calcium channel blockers","Aminoglycosides","Monoamine oxidase inhibitors"],"k":"C","x":"Aminoglycoside antibiotics (streptomycin, gentamicin, neomycin, tobramycin, amikacin, and kanamycin) are a family of compounds used to treat gram-negative bacilli infections. These compounds bind to bacterial 30S ribosomal subunit and cause mRNA to be misread. These antibiotics are ototoxic and can cause bilateral vestibulopathy. PAGES 3190-3191","bn":145},{"n":146,"s":"A 45-year-old female presents to the clinic with episodic vertigo of varying duration and intensity and past history of motion intolerance and menstrual headache. She reports associated phonophobia and photophobia. Her physical examination is nonfocal. What is the most likely diagnosis?","o":["Vestibular migraine","Méniére disease","Vestibular neuritis","BPPV"],"k":"A","x":"Vestibular migraine is characterized by vertigo of varying duration that is exacerbated by exposure to visual motion, bright lights, loud sounds, or strong odors. Méniére disease is exacerbated by salt intake, while BPPV patients have vertigo that is positional in nature and lasts seconds to minutes. Finally, vestibular neuritis is characterized by intense vertigo, nausea, and vomiting lasting hours that gradually improves over days and weeks. PAGES 3188-3189","bn":146},{"n":147,"s":"A 56-year-old man presents with six episodes of spinning vertigo lasting approximately 3 hours. Ear fullness and tinnitus accompany the episodes. Headaches can be present. On audiogram, there is sensorineural hearing loss at 250 and 500 Hz in the right ear. Which of the following disorders does this patient have?","o":["Vestibular migraine","Probable Méniére disease","Definite Méniére disease and not enough evidence to support vestibular migraine","Definite Méniére disease and vestibular migraine"],"k":"C","x":"The patient has had at least two episodes of spinning vertigo lasting between 20 minutes and 12 hours and has a documented low-frequency sensorineural hearing loss, in addition to fluctuating ear symptoms in that ear. He meets diagnostic criteria for definite Méniére disease. There is a large overlap in clinical studies between patients with Méniére disease and vestibular migraine; however, there is not enough data presented here to determine whether the patient also meets diagnostic criteria for vestibular migraine. PAGES 3218-3221","bn":147},{"n":148,"s":"A 48-year-old woman has 2 years of symptoms of hearing her pulse, eye movements, and footfalls loudly in her right ear. She has a history of classic migraines as a teenager and now experiences brief vertigo in response to loud sounds, as well as episodes of spinning vertigo that can last for up to 3 days, and are accompanied by light, sound, and visual motion sensitivity. She often has a throbbing headache with the episodes. Vestibular-evoked myogenic potential responses are enhanced for the right ear, and a high-resolution CT scan shows a dehiscence of the right superior semicircular canal. What are appropriate diagnoses?","o":["Méniére disease","Vestibular migraine alone","Right superior semicircular canal dehiscence alone","Right superior semicircular canal dehiscence and vestibular migraine"],"k":"D","x":"For the last 2 years, the patient has been experiencing bone conduction hyperacusis symptoms in the right ear. High-resolution CT imaging shows a dehiscence of the right superior semicircular canal, and there are enhanced VEMP responses for that ear, indicating the dehiscence is transmitting pressure. The combination of CT evidence of a dehiscence and symptoms and signs consistent with a third mobile window syndrome are needed for the diagnosis of superior canal dehiscence syndrome. The patient also has a history of migraine and has episodes of vertigo that can last for days that are accompanied by classic features of migraine such as photophobia and phonophobia. This supports a comorbid diagnosis of vestibular migraine that should be treated, prior to repairing the dehiscence. PAGES 3215-3218","bn":148},{"n":149,"s":"A 77-year-old woman has a history of brief episodes of spinning vertigo last up to a minute, triggered by head rotations. In the right Dix-Hallpike position, you see a right-beating nystagmus. No nystagmus of vertigo is present in the left Dix-Hallpike position. In the right supine roll position, there is a strong, right-beating nystagmus and vertigo. In the left supine roll position, there is a weaker, left-beating nystagmus. With the presence of a geotropic nystagmus, stronger in the right supine roll position, what is the diagnosis?","o":["BPPV of the right posterior semicircular canal","BPPV of the right lateral semicircular canal","BPPV of the left posterior semicircular canal","BPPV of the left lateral semicircular canal"],"k":"B","x":"The description of symptoms is suggestive of BPPV. The Dix-Hallpike test revealed a horizontal nystagmus, which was not in the plane of the posterior semicircular canal. The subsequent supine roll testing revealed a nystagmus that was right-beating in the right supine roll position and left-beating in the left supine roll position. This is a “geotropic” nystagmus since it beats toward the Earth in each supine roll position. The stronger nystagmus was in the right position. A simple rule of thumb to determine the affected ear in lateral canal BPPV is for whichever side the nystagmus is stronger, the eyes will beat toward the affected ear. This patient has BPPV of the right lateral semicircular canal and can be treated with a barbecue maneuver. In this case, the patient would start on the right ear down and then in 90° steps, rotate to the supine position, left ear down, and finally prone position. PAGES 3213-3215","bn":149},{"n":150,"s":"A 53-year-old woman has a history of an episode of spinning vertigo that lasted approximately 1 week, occurring 10 years ago. Hearing was unaffected. She presented to the emergency department at that time, and imaging workup was negative. She was discharged with “vertigo.” She now has spinning vertigo when she lifts her chin upward and when rolling to the right side. On right Dix-Hallpike examination, she has upbeating and torsional nystagmus that appears in the plane of the right posterior semicircular canal. What is the current diagnosis?","o":["BPPV of the right posterior semicircular canal","BPPV of the right lateral semicircular canal","Labyrinthitis","Vestibular paroxysmia"],"k":"A","x":"The patient presents with symptoms of brief spinning vertigo triggered by changes in head position, suggesting BPPV. The Dix-Hallpike reveals an upbeating and torsional nystagmus in the plane of the affected right posterior semicircular canal, consistent with BPPV of this canal. An Epley maneuver for the right side would be appropriate treatment. Posterior canal BPPV can be a complication following a history of vestibular neuritis and may reflect a consequence of prior inflammation of the inner ear. PAGES 3213-3215","bn":150},{"n":151,"s":"A 45-year-old man presents with 6 months of chronic right ear tinnitus, hearing loss, and dizziness when walking at night or on unsteady surfaces. Bedside head thrust demonstrates corrective saccades for rapid head rotations in the planes of the right superior and lateral semicircular canals only. Audiometry shows a high-frequency hearing loss in the right ear. MRI finds a 1.5-cm enhancing tumor filling the IAC on the right. There is also a loop of the AICA against the vestibulo-cochlear nerve in the left IAC. What is the most likely diagnosis?","o":["Vestibular schwannoma of the right superior vestibular nerve","Vestibular schwannoma of the right inferior vestibular nerve","Right superior vestibular neuritis","Vestibular paroxysmia"],"k":"A","x":"Vestibular schwannoma rarely causes spinning vertigo. Patients more commonly present with tinnitus and hearing loss and may experience more subtle symptoms of gait instability. This lack of vertigo is likely from the chronic central adaptation to slowly worsening vestibular function. This patient has MRI findings of a tumor and on clinical examination has weakness of the right superior and lateral semicircular canals, two structures innervated by the superior vestibular nerve. The posterior semicircular canal is innervated by the inferior vestibular nerve and appears unaffected. This combination of findings suggests that the superior vestibular nerve is affected by this tumor, most likely a vestibular schwannoma. The loop of AICA is present in many individuals and by itself is insufficient for a diagnosis of vestibular paroxysmia. PAGE 3224","bn":151},{"n":152,"s":"Vertigo is likely to occur as a result of ischemia in the distribution of all the following arteries except:","o":["Posterior inferior cerebellar artery","Labyrinthine artery","Anterior cerebral artery","AICA"],"k":"C","x":"The posterior inferior cerebellar artery, labyrinthine artery, and AICA supply different regions of the vestibular system, and ischemia in these blood vessels would cause vertigo. The anterior cerebral artery does not supply the vestibular system, and ischemia in this blood vessel is not expected to cause vertigo. PAGES 3240-3245","bn":152},{"n":153,"s":"All of the following are signs of cerebellar dysfunction except:","o":["Hypometric saccades","Dysmetria of finger to nose testing","Right beating nystagmus after head shaking","Impaired VOR suppression"],"k":"C","x":"Nystagmus after head shaking is usually a sign of peripheral vestibulopathy and not cerebellar dysfunction. PAGES 3234-3237","bn":153},{"n":154,"s":"The most likely cause of vertigo lasting hours, associated with photophobia, phonophobia, aural pressure, and neck stiffness,","o":["Multiple sclerosis","Basilar artery transient ischemic attack","Vestibular migraine","Méniére disease"],"k":"C","x":"Vestibular migraine typically presents with vertigo lasting hours, photophobia, phonophobia, aural fullness, and neck stiffness. Méniére disease typically presents with fluctuating hearing loss, and it typically does not present with photophobia/phonophobia. Basilar artery transient ischemic attack typically presents with vertigo, drop attacks, diplopia, paresthesia, headaches, and ataxia. Multiple sclerosis can sometimes present with vertigo, along with visual changes, paresthesia, muscle spasm, and weakness. PAGES 3238-3240","bn":154},{"n":155,"s":"CANVAS syndrome includes all of the following signs and symptoms except:","o":["Sensory loss","Ataxia","Torsional, upbeating positioning nystagmus","Bilateral vestibular loss"],"k":"C","x":"CANVAS stands for cerebellar ataxia, neuropathy, and vestibular areflexia syndrome. Torsional, upbeating positional nystagmus is usually seen in BPPV. PAGE 3248","bn":155},{"n":156,"s":"Wernicke encephalopathy includes all of the following except:","o":["V3 distribution sensory loss","Confusion","Ophthalmoplegia","Ataxia"],"k":"A","x":"Wernicke encephalopathy is caused by thiamine deficiency. It typically presents with eye movement paresis (ophthalmoplegia), confusion, and ataxia of gait and stance. V3 distribution sensory loss is usually not seen in these patients. PAGE","bn":156},{"n":157,"s":"Vestibular rehabilitation (VR) is used to:","o":["Improve maintenance of balance","Improve locomotion","Improve the performance of activities that require active motion","All of the above"],"k":"D","x":"VR has the ability to improve more than simply balance function. If done properly, all of the above outcomes can be achieved. PAGES 3259-3260","bn":157},{"n":158,"s":"VR takes advantage of which of the following process?","o":["Peripheral sensation independence","Redundancy","Static number of central nervous system neurons","Synaptopathy"],"k":"B","x":"VR relies on redundancy and plasticity to allow for improving vestibular function. PAGES 3259-3260","bn":158},{"n":159,"s":"Which of the following recovery mechanisms occur between symptom resolution and terminal compensation?","o":["Direct repair and remodeling","Repair of ancillary systems","Disintegration of related systems","Increase use of other senses"],"k":"A","x":"VR takes advantage of two important repair mechanisms direct repair and remodeling. PAGES 3259-3260","bn":159},{"n":160,"s":"Chronic vestibular disorders:","o":["Are not treatable with VR","Require shorter rehabilitation sessions","Only respond to rehabilitation if there are fluctuating symptoms","Take longer length of rehabilitation"],"k":"D","x":"VR can work on chronic vestibular disorders, but evidence suggests that these usually take more rehabilitation sessions and a longer total rehabilitation time frame. PAGES 3259-3260","bn":160},{"n":161,"s":"A multidisciplinary team approach is useful in treating balance disorders for all of the following reasons except:","o":["Each type of specialist can make their own diagnosis","Each type of specialist can devise their own plan for treatment","Diagnosis and treatment need to be considered on a continuum","Progress in treatment can be more easily assessed indecently"],"k":"C","x":"Patient outcomes have shown to be improved when diagnosis and treatment are considered on a continuum, and this is fostered by a multidisciplinary team approach. PAGES 3259-3260","bn":161},{"n":162,"s":"The mammalian cochlea contains hair cells, supporting cells, and spiral ganglia neurons. Which cell types are required for normal hearing function?","o":["Hair cells","Supporting cells","Spiral ganglia neurons","All of the above"],"k":"D","x":"The mammalian cochlea contains a diverse number of cell types, such as the mechanosensory hair cells, different types of supporting cells, and the spiral ganglion neurons. All of these cells play critical roles for normal auditory function. PAGE 3265","bn":162},{"n":163,"s":"The organ of Corti is located in which of the following fluid compartment?","o":["Scala vestibuli","Scala media","Scala tympani","Middle ear space"],"k":"B","x":"The organ of Corti is located in the scala media, which contains endolymph with high potassium. PAGES 3268-3269","bn":163},{"n":164,"s":"The process of lateral inhibition regulates cell fates between hair cells and supporting cells in the developing cochlea and is mainly regulated by:","o":["Brain-derived growth factor","Wnt signaling","Notch signaling","Atohl"],"k":"C","x":"Notch signaling plays an important role in inner ear development. One of the ways that Notch signaling exerts its effects is by lateral inhibition, which limits supporting cells to differentiate into hair cells. PAGES 3266-3267","bn":164},{"n":165,"s":"Sensory hair cells are characterized by:","o":["Expression of Atoh]","Responsive to mechanical stimulation","Form synaptic connections with neurites from spiral ganglia neurons","Contain staircaselike stereocilia","All of the above"],"k":"E","x":"The hair cells are the main sensory cells for auditory perception. They express the transcription factor Atoh/. Their stereocilia bundles (which have a staircase-lake pattern) are responsive to mechanical stimulation. They form synaptic connections with the neurites from spiral ganglion neurons. PAGES 3265-3267","bn":165},{"n":166,"s":"Cell division can be induced by which of the following in the mammalian cochlea?","o":["Wnt signaling","Hippo signaling","Damage in the neonatal period","All of the above"],"k":"D","x":"The Wnt and Hippo/Yap signaling pathways have been shown to induce cell division in the mammalian cochlea. The neonatal cochlea has also been shown to have some regenerative capacity in response to damage. PAGES 3265-3268","bn":166}]},{"t":"Facial Plastic and Reconstructive Surgery","q":[{"n":1,"s":"A 35-year-old woman presents to the clinic for consideration of a rhinoplasty. The surgeon performs the rhinoplasty and publishes pre-and postoperative photos without the patient’s consent. The surgeon is subject to litigation by violation of the following:","o":["Copyright law","HIPAA","Freedom of Information Act","Affordable Care Act"],"k":"B","x":"The HIPAA Privacy Rule establishes national standards to protect individuals’ medical records and other individually identifiable health information (collectively defined as “protected health information’). Sharing photos without the patient’s consent is a violation of HIPAA. PAGE 3291","bn":1},{"n":2,"s":"A shorter focal length will do all the following except:","o":["Widen the field of view","Distort facial features when filling the frame with the face","Increase the depth of field","Magnify the image"],"k":"D","x":"A shorter focal length does not magnify the image. Focal length is the distance measured in millimeters, between the optical center of the lens and the camera sensor, where the light information is recorded. A short focal length captures a wider view of what is in front of the lens. A long focal length zooms in on your subject, capturing a narrow angle of view. PAGE 3292","bn":2},{"n":3,"s":"A patient presents for facial photographs prior to surgery. The surgeon observes that the tip of the nose is in focus but the remainder of the face is out of focus. What is the best option of quickly increasing the depth of field?","o":["Increase distance from the subject.","Decrease the size of the aperture page.","Shorten focal length of the lens.","Increase shutter speed."],"k":"B","x":"Decreasing the aperture increases the depth of field. PAGE 3294","bn":3},{"n":4,"s":"Distracting background shadows are most often caused by:","o":["Ring flash","Using a camera-mounted flash","Centrally placed backlight above the patient","Dual light sources"],"k":"B","x":"Camera mounted flashes can cause background shadows. A ring flash, dual light sources, and a centrally placed backlight will prevent background shadowing. PAGE 3296","bn":4},{"n":5,"s":"A surgeon obtains preoperative photos prior to a rhytidectomy. The photo is overexposed, and subtle facial details are unable to be visualized well. What options are available to decrease the exposure of the photograph?","o":["Decrease shutter speed.","Increase aperture.","Decrease ISO.","Single ring flash."],"k":"C","x":"Decreasing the ISO will decrease the exposure. Increasing aperture will decrease the depth of field. PAGE 3296","bn":5},{"n":6,"s":"Healing by secondary intention is best used for defects located in what region?","o":["Medial canthus","Nasal tip","Oral commissure","Helical rim"],"k":"A","x":"Small superficial cutaneous defects involving concave facial surfaces may granulate and epithelialize with an acceptable aesthetic result. Ideal locations for healing by secondary intention include the temple and medial canthus. PAGE 3307","bn":6},{"n":7,"s":"Cigarette smoking has which of the following effects on wound healing?","o":["Systemic vasodilation predisposing to hematoma formation","Production of low levels of carboxyhemoglobin leading to decreased tissue oxygenation","Systemic vasoconstriction leading to decreased tissue oxygenation","Production of high levels of carboxyhemoglobin leading to hematoma formation"],"k":"C","x":"Nicotine causes systemic vasoconstriction through activation of the adrenergic nervous system, which may lower tissue oxygenation pressure by greater than 50%. PAGE 3307","bn":7},{"n":8,"s":"Full-thickness skin graft survival at 24 to 48 hours after inset relies on which process?","o":["Plasma imbibition","Nutrient diffusion","Neovascularization","Vascular inosculation"],"k":"D","x":"Full-thickness grafts survive initially by diffusion of nutrition from fluid in the recipient site, a process known as plasma imbibition. This is followed by vascular inosculation, which usually occurs during the first 24 to 48 hours. After 48 to 72 hours, capillaries in the recipient site begin to grow into the graft to provide new circulation. By 3 to 5 days, a new blood supply has been established. Initially, full-thickness skin grafts appear blanched; however, over 3 to 7 days, a pink color develops signaling neovascularization. PAGE 3318","bn":8},{"n":9,"s":"Which of the following best describes rotation flaps?","o":["Rotational flaps are best used for the repair of circular defects.","Rotational flaps involve only advancement of tissue into the defect site.","Rotational flaps are designed so that the length of the arch is four times the width of the defect.","Rotational flaps are best designed so that the base is superiorly based to facilitate lymphatic drainage."],"k":"C","x":"Classically, rotation flaps are designed so that the length of the arc incision is four times the width of the defect. This configuration minimizes the need for any modifications. PAGE 3318","bn":9},{"n":10,"s":"Which of the following statements best describes the Zitelli modification of the bilobed flap?","o":["Allows the incisions to fall within RSTLs","Increases the standing cutaneous deformity","Reduces trap-door deformity of the nasal skin","Uses narrower angles of each pivoting lobe"],"k":"D","x":"The design was modified by Zitelli, having each lobe be 45 to 50°, with total transposition under 100°. This modification decreased the wound closure tension and lessened the standing cutaneous deformity. PAGE 3310","bn":10},{"n":11,"s":"Trap door deformity can be minimized by which of the following techniques?","o":["Designing the base of the flap superiorly","Judicious undermining","Using curvilinear boarders","Increasing the arc of rotation of the flap"],"k":"B","x":"Patient selection, proper flap design, and adequate tissue undermining reduce the incidence of trapdoor deformity. Presumably undermining reduces scar contractile vectors toward the center of the flap by enlarging the area of the underlying sheet of scar (Hosokawa K, Susuki T, Kikui T, et al. Sheet of scar causes trapdoor deformity: a hypothesis. Annals of Plastic Surgery. 1990;25:134-135; Kaufman AJ, Kiene KL, Moy RL. Role of tissue undermining in the trapdoor effect of transposition flaps. The Journal of Dermatologic Surgery and Oncology. 1985;19:128.) PAGE 3312","bn":11},{"n":12,"s":"Which of the following is the predominate cell type in the epidermis?","o":["Melanocytes.","Keratinocytes","Merkel cells","Langerhans cells"],"k":"B","x":"The epidermis consists of predominantly keratinocytes (80%) but also melanocytes, Langerhans cells, and Merkel cells (Table 198.1). PAGE 3303","bn":12},{"n":13,"s":"Delay of cutaneous flaps is thought to have which of the following effects?","o":["Improved survival secondary to transient dilation of “choke” vessels","Improved survival secondary to permanent dilation of “choke” vessels","Decreased survival secondary to transient vasoconstriction of “choke vessels”","Decreases survival secondary to permanent vasoconstriction of “choke vessels”"],"k":"B","x":"Delay of cutaneous flaps is thought to improve survival of the flap at the time of eventual transfer because of permanent and irreversible dilation of the “choke” vessel through hyperplasia and hypertrophy (20). PAGE 3305","bn":13},{"n":14,"s":"Which of the following locations is ideal for head and neck tissue expander placement?","o":["Cheek","Anterior neck","Periauricular region","Forehead"],"k":"D","x":"Tissue expanders are ideally placed in regions with an underlying bony base, a well-vascularized overlying skin envelope, and a lack of underlying important structures (such as nerves and muscles of facial expression). Use of tissue expanders for auricular defects is limited by the lack of adequate adjacent non-hair-bearing soft tissue. PAGE 3331","bn":14},{"n":15,"s":"Which of the following histological changes is associated with the active phase of tissue expansion?","o":["Proliferation of hair follicles","Epidermal thickening","Dermal thickening","Subcutaneous fat hypertrophy"],"k":"B","x":"The epidermal thickness increases during the expansion phase before returning to baseline within | to 2 years. The overall number of hair follicles remains stable during expansion, while the follicle density decreases. There is dermal thinning (on the order of 20%-30%) during active expansion with variable recovery long-term, and there is onset of permanent subcutaneous fat atrophy and fibrosis. PAGE 3331","bn":15},{"n":16,"s":"Which of the following is the most common complication of tissue expansion?","o":["Hematoma","Infection","Extrusion","Necrosis of overlying skin"],"k":"C","x":"Tissue expander extrusion/exposure is the most common complication of tissue expansion in the head and neck, occurring at a rate of around 3.0% (Azzi et al., Head and Neck 2020; 42(4): 747-762). If there is no evidence of infection, observation and judicious continued expansion are appropriate. Tissue expansion in the scalp region and in a nonsubcutaneous plane are associated with higher overall complication rates. PAGE 3337","bn":16},{"n":17,"s":"Scars that extend beyond the natural borders of the wound edges are most accurately categorized as:","o":["Atrophic scars","Hypertrophic scars","Keloids","Fibroids","None of the above"],"k":"C","x":"Keloids. PAGE 3340","bn":17},{"n":18,"s":"Dermabrasion techniques resurface the skin until punctate bleeding is appreciated, this corresponds to what depth of skin?","o":["Epidermis","Directly subdermal","Reticular dermis","Papillary dermis","Subcutaneous tissue"],"k":"D","x":"Papillary dermis. PAGE 3347","bn":18},{"n":19,"s":"The best technique for camouflaging a thin 5-cm straight scar that runs perpendicular to the relaxed skin tension lines along the cheek is:","o":["Geometric broken line closure","Serial Z-plasty","Fusiform excision","W-plasty","Dermabrasion"],"k":"A","x":"Geometric broken line closure. PAGE 3345","bn":19},{"n":20,"s":"A Z-plasty designed with 60° angle limbs will increase the length of the scar:","o":["10%","25%","50%","75%","90%"],"k":"D","x":"75%. PAGE 3343","bn":20},{"n":21,"s":"The ideal limb length for geometric broken line closure is:","o":["lmm","5mm","9mm","11 mm","No ideal length"],"k":"B","x":"5 mm. PAGE 3345","bn":21},{"n":22,"s":"Reconstruction of which of the following defects would most likely require cartilage support of the nasal valve?","o":["| cm skin-only defect of the nasal tip","| cm skin-only defect of the alar groove","1 cm skin-only defect of the nasal dorsum","| cm skin and bony defect of the nasal sidewall"],"k":"B","x":"The alar groove represents a keystone area in nasal reconstruction that is critical for nasal valve function. Prophylactic cartilage grafts in this region are required even for skin-only defects to prevent nasal valve collapse following surgery. The remainder of the defects listed will heal well with cutaneous reconstruction without the need for structural grafting. PAGE 3395","bn":22},{"n":23,"s":"Which of the following statements about staged forehead flaps in nasal reconstruction is correct?","o":["Forehead flaps must incorporate bilateral supratrochlear arteries for adequate perfusion.","Forehead flaps must incorporate a unilateral intact supratrochlear artery for adequate perfusion.","Forehead flaps must include the frontalis muscle along the entire length of the flap to ensure adequate perfusion to the tip of the flap.","Forehead flap pedicle division must be delayed by a minimum of | to 2 weeks after flap transfer to ensure adequate collateral perfusion."],"k":"D","x":"The vascularity of the forehead flap is robust and is based on vascular perfusion pressure around the supratrochlear artery, but the flap is not entirely dependent on this arterial supply. The distal end of the flap can be thinned and elevated in the subcutaneous plane without compromising flap viability, but the proximal flap should include the frontalis and corrugator muscle. For multistage forehead flap reconstruction, successful pedicle division requires a delay of a minimum of | to 2 weeks to allow neovascularization of the flap from the surrounding nasal tissues. Most people wait 3 weeks for pedicle division. PAGE 3394","bn":23},{"n":24,"s":"When selecting among local flap options for a nasal defect, which is the most important factor to consider?","o":["Location of resulting scars in relation to relaxed skin tension lines (RSTL)","Location of resulting scars in relation to lines of minimal tension","Limitations from immobile structures surrounding the defect","Thickness of the skin immediately surrounding the defect"],"k":"C","x":"While all these factors are important to consider in nasal reconstruction, the location of surrounding immobile structures dictates the area of recruitment from where local flaps can be transferred. Disrupting an immobile structure such as the free alar margin, eyelid or lip can create a significant deformity that is very difficult to correct secondarily, so careful flap selection should be done to avoid this. Aligning incisions with natural skin creases and matching the surrounding skin thickness are secondary factors to consider in flap design once the appropriate tissue reservoir is selected. PAGE 3398","bn":24},{"n":25,"s":"Which reconstructive option is the most appropriate for an 8-mm full-thickness defect involving the free margin of the ala?","o":["Three layer composite graft from the auricle","Full-thickness skin graft","Primary closure","Melolabial flap"],"k":"A","x":"For a small, full-thickness defect of the alar rim, the reconstruction must address the internal and external lining along with cartilaginous support to avoid alar notching. Of the options listed, a three-layer composite graft best accomplishes this goal. The biggest drawbacks to composite graft reconstruction include concerns about graft survival and skin color match. Primary closure would create significant nostril asymmetry, full-thickness skin grafting would not address the structural or internal lining requirements, and the defect is not large enough to warrant a melolabial reconstruction. PAGE 3395","bn":25},{"n":26,"s":"One day after forehead flap reconstruction of a hemirhinectomy defect, the patient returns with purple discoloration of the reconstructed ala that demonstrates immediate return of dark blood on pinprick. What is the next best step in management?","o":["Return to the OR to debride the necrotic area.","Remove tight cutaneous sutures around the flap pedicle.","Topical nitroglycerin paste until the color improves.","Hyperbaric oxygen treatment."],"k":"B","x":"The flap in question is demonstrating partial venous congestion. This is most commonly caused by crimping of the venous outflow at the flap pivot point, so removing any tight sutures in this area is the first step to relieve venous congestion. Repeat operation for debridement should be considered for frank necrosis once the necrotic area has fully declared and is not indicated 1 day after surgery. Nitroglycerin paste and hyperbaric oxygen can be used for arterial insufficiency in local flaps but are less effective for venous congestion as in this case. PAGE 3394","bn":26},{"n":27,"s":"Which external landmark can be used to approximate the vertical height of the labial arteries in the region of the lips?","o":["Wet-dry mucosal border","Vermilion border","White roll","Alar base superiorly and mental crease inferiorly"],"k":"B","x":"Vermilion border. PAGE 3401","bn":27},{"n":28,"s":"The relaxed skin tension lines run in which orientation in relation to the lips?","o":["Vertical","Horizontal","Oblique","Radial"],"k":"D","x":"Radial. PAGE 3402","bn":28},{"n":29,"s":"Which of the following structures is critical to align in order to avoid obvious cosmetic deformity when reconstructing the lips?","o":["Median tubercle","Melolabial fold","Mental crease","Vermilion border"],"k":"D","x":"Vermilion border. PAGE 3403","bn":29},{"n":30,"s":"A patient presents with a defect comprising 2/3rd of the upper lip but sparing the oral commissures. Which technique would best address this defect?","o":["Abbé interpolated flap","Estlander transposition flap","Wedge excision and primary closure","V-Y island advancement flap"],"k":"A","x":"Abbé interpolated flap. PAGE 3405","bn":30},{"n":31,"s":"The Karapandzic flap was designed to preserve which of the following?","o":["Vermilion border","Melolabial fold","Neurovascular structures","Inter-commissure width"],"k":"C","x":"Neurovascular structures. PAGE 3408","bn":31},{"n":32,"s":"Which type of cancer is most common on the auricle?","o":["Melanoma","Merkel cell carcinoma","Squamous cell carcinoma","Basal cell carcinoma"],"k":"C","x":"In general, basal cell carcinoma accounts for 75% of skin cancers, and squamous cell carcinoma accounts for 20% of skin cancer; however, on the auricle, squamous cell carcinoma is more common than basal cell carcinoma. PAGE 3416","bn":32},{"n":33,"s":"Which area of the ear would be most amenable to healing by secondary intention or skin graft if the perichondrium is intact?","o":["Helix","Antihelix","Lobule","Concha"],"k":"D","x":"Concave areas of the ear such as the scaphoid fossa, triangular fossa, and concha may heal well by secondary intention. A skin graft may also help concave areas to heal more quickly with an almost imperceptible result. PAGE 3420","bn":33},{"n":34,"s":"For a very large defect of the helical rim, which is the best reconstructive option?","o":["Antia-Buch chondrocutaneous advancement flap","Wedge excision","Staged reconstruction utilizing a postauricular skin pocket","Star excision"],"k":"C","x":"A staged flap such as a peninsular conchal axial flap or the Dieffenbach flap is required for a good repair of a large helical rim defect. Antia-Buch advancement or Star/Wedge excision are used for smaller helical defects. PAGE 3425","bn":34},{"n":35,"s":"For large defects of the auricle in which there is poor local skin due to a burn, what is a reliable source of thin, pliable, vascular tissue?","o":["Temporoparietal fascia","Temporalis muscle","Superficial muscular aponeurotic system (SMAS)","Temporalis fascia"],"k":"A","x":"The temporoparietal fascial flap (TPFF) is a thin, pliable, highly vascular tissue with a reliable blood supply that can support skin and cartilage grafts. PAGE 3429","bn":35},{"n":36,"s":"When temporoparietal fascial flap (TPFF) is unavailable for auricular reconstruction, what type of flap cover is the next best option for salvage auricular reconstruction?","o":["Superficial temporal artery flap","Occipital artery fascial flap","Postauricular artery flap","Lobule artery flap"],"k":"B","x":"When TPFF is not an option due to revision surgery, burn, or other traumatic injury, salvage surgery can be performed with an occipital artery fascial flap. PAGE 3432","bn":36},{"n":37,"s":"The following structure is located in the posterior lamella and full-thickness defects requires a dedicated reconstruction to ensure apposition of the eyelid to the globe:","o":["Tarsal plate","Skin","Orbital septum","Orbicularis oculi"],"k":"A","x":"Tarsal plate. PAGE 3447","bn":37},{"n":38,"s":"The only technique which provides vascularized, multivector reconstruction of a lower eyelid defect with anterior lamella deficiency is the:","o":["Tenzel flap","Cutler-Beard","BOOM flap","V-Y advancement flap"],"k":"C","x":"BOOM flap. PAGE 3455","bn":38},{"n":39,"s":"In the Hughes tarsoconjunctival flap, which structure is the superficial limit of dissection and should NOT be included with the flap?","o":["Orbicularis oculi","Orbital septum","Skin","Levator muscle"],"k":"D","x":"Levator muscle. PAGE 3459","bn":39},{"n":40,"s":"In the setting of a full-thickness lower eyelid defect being reconstructed using a Tenzel flap, which of the following can substitute for the lateral tarsal plate and improve horizontal lid tension?","o":["Orbicularis oculi","Periosteum","Upper eyelid tarsal plate","FTSG"],"k":"B","x":"Periosteum. PAGE 3459","bn":40},{"n":41,"s":"Which of the following techniques can be used for to restore close to normal function and appearance of severe upper eyelid cicatricial ectropion?","o":["Initial STSG followed by serial excision and local tissue advancements","Single-stage free flap using an anterolateral thigh flap","Staged approach with sequential FTSG replacing the cicatricial tissues","BOOM flap followed by FTSG from the contralateral upper eyelid skin"],"k":"A","x":"Initial STSG followed by serial excision and local tissue advancements. PAGE 3463","bn":41},{"n":42,"s":"A 69-year-old female presents with left-sided facial palsy after surgical extirpation of a vestibular schwannoma 10 months. She had dense facial paralysis immediately after surgery and has since been recovering slowly. Examination is notable for a narrowed palpebral fissure, prominent nasolabial fold at rest, and restricted oral commissure movement on the left. What is the most appropriate first step in management?","o":["Targeted physical therapy and chemodenervation","Depressor anguli oris resection","Selective denervation","Gracilis muscle transfer"],"k":"A","x":"The patient has synkinetic/hypertonic facial palsy after vestibular schwannoma surgery (Chapter 205, Section “Synkinetic/ Hypertonic Facial Palsy” and “Selective Myectomy and Neurectomy”). First-line treatment includes physical therapy and chemodenervation of hyperactive/synkinetic muscles. PAGE 3468","bn":42},{"n":43,"s":"A 21-year-old female presents 1 year after resection of a right glomus jugulare tumor with facial nerve transposition. She notes dense right facial paralysis for the past 12 months. She complains of ocular discomfort, lack of smile, and hoarseness. What is the best option for facial reanimation at this time?","o":["Masseteric-to-facial nerve transfer","Hypoglossal-facial nerve transfer","Gracilis muscle transfer","Temporalis transfer"],"k":"A","x":"The patient has an intact facial nerve with dense paralysis 12 months after surgery. Urgent masseteric-to-facial nerve transfer should be considered at this time to salvage smile musculature. Hypoglossal-facial nerve transfer is contraindicated in patients with ipsilateral CN X deficits. Chapter 205, Section “Re-Innervation: Hypoglossal-Facial Nerve Transfer”. PAGE 3476","bn":43},{"n":44,"s":"A 6-year-old boy presents with Moebius syndrome. Examination is notable for bilateral dense facial paralysis and abducens palsy. What is the best option for facial reanimation?","o":["Gracilis by cross face nerve graft","Gracilis by masseteric nerve","Masseteric-to-facial nerve transfer","Hypoglossal-facial nerve transfer"],"k":"B","x":"Patients with congenital facial palsy require muscle transfer for facial reanimation (Chapter 205, Section “The Oral Commissure and Smile”). In a patient with bilateral Mobius syndrome, where CN VI and VII are underdeveloped, free muscle transfer should be driven by the masseteric nerve (CN V). PAGE 3479","bn":44},{"n":45,"s":"A 40-year-old woman presents with right lower lip paralysis. History is notable for carcinoma of the right submandibular gland s/p surgical extirpation and adjuvant chemoradiation 2 years ago. She reports weakness of the right lower lip immediately after surgery and has not noted any changes since that time. What is the best option for facial reanimation?","o":["Cross face nerve graft with direct hook up to marginal mandibular branch","Right depressor labii inferioris resection","Left depressor labii inferioris resection","Left depressor anguli oris resection"],"k":"C","x":"In patients with lower lip paralysis, contralateral weakening of the depressor labii inferioris can help with symmetry, oral competence, and articulation (Chapter 205, Section “The Lower Facial Zone”). Cross face nerve grafting would not be appropriate because the patient has had paralysis for 2 years (out of reinnervation window) and the question stem implies sacrifice of the right marginal mandibular nerve given the pathology and immediate paralysis after surgery. PAGE 3481","bn":45},{"n":46,"s":"What are the anatomic components of the internal nasal valve?","o":["Septum, piriform aperture, cephalic border of the lower lateral cartilage, head of the inferior turbinate","Caudal border of the upper lateral cartilage, septum, pyriform aperture, head of the middle turbinate","Piriform aperture, vomer, caudal border of the upper lateral cartilage, head of the inferior turbinate","Caudal border of the upper lateral cartilage, septum, pyriform aperture, head of the inferior turbinate"],"k":"A","x":"Septum, piriform aperture, cephalic border of the lower lateral cartilage, head of the inferior turbinate. PAGE 3501","bn":46},{"n":47,"s":"What is the region of the nose with the thinnest skin?","o":["Rhinion","Nasion","Tip","Supratip"],"k":"A","x":"Rhinion. PAGE 3488","bn":47},{"n":48,"s":"What is the typical nasolabial angle in men?","o":["85 to 90°","90 to 95°","95 to 100°","100 to 105°"],"k":"B","x":"90 to 95°. PAGE 3486","bn":48},{"n":49,"s":"Which nerve supplies sensation to the nasal tip?","o":["Maxillary nerve","Infratrochlear nerve","External branch of descending ethmoidal nerve","Angular nerve"],"k":"C","x":"External branch of descending ethmoidal nerve. PAGE","bn":49},{"n":50,"s":"Which of the following best describes a Caucasian nose?","o":["Leptorrhine","Platyrrhine","Mesorrhine","Catarrhine"],"k":"A","x":"Leptorrhine. PAGE 3497","bn":50},{"n":51,"s":"The most prominent anterior point on the chin is known as:","o":["The labrale superioris","The menton","The pogonion","The rhinion"],"k":"C","x":"The pogonion is the most anterior or prominent point on the chin, whereas the menton is the lowest midline point on the chin. PAGE 3506","bn":51},{"n":52,"s":"The nasofacial angle is the angle formed by the intersection of:","o":["A line drawn from the nasion through the nasal tip—defining point and a second line drawn from the nasion through the alar facial junction","A line drawn from the nasion through the subnasale and a second line drawn from the nasion through the nasal tip— defining point","A line drawn from the nasion through the nasal tip-defining point and a second line drawn from the glabella through the pogonion","A line drawn from the glabella through the nasal tip and a second line drawn from the glabella through the subnasale"],"k":"C","x":"The nasofacial angle is formed by the intersection of a line drawn from the nasion through the nasal tip—defining point and a second line drawn from the glabella through the pogonion. The other options do not refer to any named facial angles at all. PAGE 3506","bn":52},{"n":53,"s":"The incisions necessary for a delivery approach to the nasal tip are:","o":["An intercartilaginous incision coupled with a transcolumellar incision","A marginal incision coupled with an intercartilaginous incision connecting to a full transfixion incision","A retrograde incision coupled with a marginal incision connecting to a hemitransfixion incision","A rim incision coupled with an intercartilaginous incision connecting to a full Killian incision"],"k":"B","x":"Delivery of the alar cartilages involved refers to pivoting the alar cartilages from the nose (much like a bucket handle) as a bipedicled chondrocutaneous flap attached medially and laterally. In order to do so, one must release the attachments superiorly and inferiorly. This is accomplished with a marginal incision coupled with an intercartilaginous incision that connects to a full transfixion incision. PAGE 3508","bn":53},{"n":54,"s":"A caudally positioned radix (low radix disproportion) will have the effect of:","o":["Making the nasofacial angle more acute and thereby making the nasal tip look relatively overprojected","Making the nasofacial angle more obtuse and thereby making the nasal tip look relatively underprojected","Making the nasofacial angle more acute and thereby making the nasal tip look relatively underprojected","Making the nasofacial angle more obtuse and thereby making the nasal tip look relatively overprojected"],"k":"D","x":"A low or caudally positioned radix will make the nasofacial angle more obtuse. In addition, the relative proportions of the nose change so that the “normal” 3-4-5 ratios (Crumley) are thrown off such that the nasal length from nasion to tip defining point (the “5”) is diminished. In such case, tip projection (the “3”) is greater than 60% (3:5) of nasal length making the tip look overprojected relative to nasal length and “bottom-heavy.” PAGE 3513","bn":54},{"n":55,"s":"The effect of an overprojected (shallow) radix on nasal appearance is:","o":["To exaggerate nasal dorsal height creating the illusion of a “pseudo-hump”","To make the nose look visually longer","To make the nasal tip look more rotated","To make the nasal tip look more projected"],"k":"B","x":"A shallow (overprojected radix) or a high radix (cephalically malpositioned) will both have the effect of making the nose look visually longer by increasing distance from nasion to tip-defining point. PAGE 3513","bn":55},{"n":56,"s":"A 52-year-old woman with a history of prior rhinoplasty presents with a classic inverted V deformity. What most likely occurred in her prior surgery to result in this?","o":["Osteotomies were carried out superior to the medial canthus.","Upper lateral cartilages were dissociated from the caudal edge of the nasal bones.","Large dorsal hump was removed without lateral osteotomies.","Iatrogenic septal perforation was made resulting in midvault collapse."],"k":"B","x":"The inverted V deformity results from dissociation of the upper lateral cartilages from the caudal edge of the nasal bones. If the upper lateral cartilages are not reattached to the septum, they may be inferiorly displaced and result in inadequate middle vault support and the characteristic inverted V appearance. Chapter 18, Section: “Deformities”. PAGE 3529","bn":56},{"n":57,"s":"The borders of the internal nasal valve are marked by the following structures:","o":["Caudal margin of the upper lateral cartilage, anterior head of the inferior turbinate, septum","Caudal margin of the lower lateral cartilage, anterior head of the inferior turbinate, septum","Caudal margin of the upper lateral cartilage, bony piriform aperture, septum","Lower lateral cartilage, nasal sill, columella"],"k":"A","x":"The internal nasal valve is marked by the caudal margin of the upper lateral cartilage, anterior head of the inferior turbinate, and the caudal septum. Option D describes the external nasal valve. Chapter 18, Section: “Nasal bones and Upper Lateral Cartilages”. PAGE 3516","bn":57},{"n":58,"s":"The ideal nasofacial angle is:","o":["115 to 130°","120 to 132°","90 to 105°","36 to 40°"],"k":"D","x":"The nasofacial angle is the angle prescribed by the intersection of the facial plane (glabella to pogonion) and a line tangent to the nasal dorsum. Ideally, it is 36 to 40°. Option A describes the nasofrontal angle, created by a tangent passing from the nasion through the glabella, and the dorsal line of the nose. Option B describes the nasomental angle, determined by the intersection of the line connecting the tip-defining point to the pogonion and the nasal dorsum tangent. Lastly, Option C describes the nasolabial angle, formed by a line tangent to the upper lip and a line tangent to the columella. Chapter 18, Section: “Aesthetic Angles”. PAGE 3518","bn":58},{"n":59,"s":"What is the name of the deformity caused by relative underproduction of the nasal tip with respect to projection of the nasal dorsum?","o":["Rocker deformity","Open roof deformity","Pollybeak deformity","Inverted-V deformity"],"k":"C","x":"Pollybeak deformity is caused by relative underprojection of the nasal tip with respect to the projection of the dorsum. This leads to an appearance of supratip fullness. Chapter 18, Section: “Deformities”. PAGE 3528","bn":59},{"n":60,"s":"With respect to the nasolabial angle, what is the ideal angle of rotation for males and females?","o":["100 to 110 in males, 120 to 130 in females","110 to 120 in males, 120 to 130 in females","90 to 100 in males, 100 to 120 in females","90 to 100 in males, 110 to 130 in females"],"k":"C","x":"90 to 100 in males, 100 to 120 in females. PAGE 3536","bn":60},{"n":61,"s":"For the typical rhinoplasty patient, what is the ideal amount of columellar show?","o":["1to3mm","2to4mm","2to6mm","4to6mm"],"k":"B","x":"2 to 4 mm. PAGE 3536","bn":61},{"n":62,"s":"A patient underwent an endonasal reductive rhinoplasty years ago, which resulted in significant loss of their tip projection. The resulting deformity was treated with two additional resections of the caudal septum. What type of deformity is observed?","o":["Rocker","Inverted V","Pollybeak","Ski slope"],"k":"C","x":"Pollybeak. PAGE 3538","bn":62},{"n":63,"s":"During dissection in an open revision rhinoplasty, the patient is found to have weak, bulbous, and cephalically oriented lower lateral cartilages. Which maneuver is the most effective to address these issues?","o":["Medial crural steal with lateral tensioning","Tongue in groove maneuver","Lateral crural underlay with tip suturing","Lateral crural strut graft with repositioning"],"k":"D","x":"Lateral crural strut graft with repositioning. PAGE","bn":63},{"n":64,"s":"At the conclusion of a primary Asian rhinoplasty, the patient is found to have excessive flare with normal nostril size. What is the preferred maneuver for nasal base reduction?","o":["Sill excision","Alar flap","Lateral wedge excision","Full thickness excision"],"k":"C","x":"Lateral wedge excision. PAGE 3546","bn":64},{"n":65,"s":"The anatomic etiology of asymmetric nostrils and the deviated columella is most often?","o":["Congenital deficiency of the medial crus","Spur of the maxillary crest","Deviation of the caudal septal border","Collapse of the upper lateral cartilages"],"k":"C","x":"The twisted columella is often the result of the caudal septal border, usually the posterior septal angle that may be dislocated off the anterior nasal spine. PAGE 3553","bn":65},{"n":66,"s":"After nasal bones are mobilized, a patient is noted to have a persistently deviated upper third. Which maneuver will help further mobilize the bony pyramid?","o":["Percutaneous transverse osteotomy","Septoplasty","Spreader grafts","Clocking suture"],"k":"A","x":"The superior frontal beak and high dorsal septum may need to be mobilized in the deviated nose. PAGE 3554","bn":66},{"n":67,"s":"The twisted dorsal septum is often associated with which functional problem?","o":["Nasal obstruction at the internal nasal valve on the convex","Nasal obstruction on the internal nasal valve on the concave","Nasal obstruction at the external nasal valve on the concave","Nasal obstruction at the external nasal valve on the convex"],"k":"A","x":"The internal nasal valve is bordered medially by the dorsal septum and a convexity will impinge on the valve. PAGE 3557","bn":67},{"n":68,"s":"All of the following contribute to a risk of persistent or recurrent deviation except?","o":["Soft tissue memory exerting a deviating force toward original position","Asymmetric healing/scarring","Twisting, warping, or migration of onlay grafts","Resorption of sutures"],"k":"D","x":"Resorption of sutures. PAGE 3563","bn":68},{"n":69,"s":"Intrinsic deformity and asymmetries to the upper third/nasal bones are best addressed by which sequence?","o":["Medial osteotomy-lateral osteotomy-rasping","Medial osteotomy-intermediate osteotomy-lateral osteotomy","Lateral osteotomy-medial osteotomy-intermediate osteotomy","Medial osteotomy-dorsal hump reduction-camouflage graft"],"k":"B","x":"Intrinsic deformities of the nasal bones may require an intermediate osteotomy and it should be performed before the bone is fully mobilized with medial and lateral osteotomies. PAGE 3554","bn":69},{"n":70,"s":"Anatomically, the internal nasal valve is:","o":["The caudal border of the upper lateral cartilage, septum, and anterior head of the inferior turbinate","The scroll region","Ideally greater than 10 to 15°","The narrowest part of the nasal airway","All of the above"],"k":"E","x":"The internal nasal valve is defined anatomically by the caudal border of the upper lateral cartilage, septum, and anterior head of the inferior turbinate. The scroll region is a landmark for the internal nasal valve. The ideal angle of the internal nasal valve is greater than 10 to 15°, and it is the most narrow part of the nasal airway. PAGE","bn":70},{"n":71,"s":"The is the workhorse reconstructive graft used to treat internal nasal valve narrowing.","o":["Butterfly graft","Lateral crural strut graft","Spreader graft","Alar rim graft"],"k":"C","x":"The spreader graft is the workhorse reconstructive graft in the management of internal nasal valve narrowing. PAGE 3572","bn":71},{"n":72,"s":"The is a widespread reconstructive graft used to concurrently treat external nasal valve narrowing and lateral wall insufficiency.","o":["Spreader graft","Lateral crural strut graft","Columellar strut graft","Extended spreader graft"],"k":"B","x":"The lateral crural strut graft is the only graft listed that can be used to concurrently treat both external nasal valve narrowing and lateral wall insufficiency. PAGE 3574","bn":72},{"n":73,"s":"Major nasal tip support mechanisms include:","o":["The interdomal ligament between the lower lateral cartilages, the skin/soft tissue envelope, the septum, the nasal spine, and sesamoid complexes","The resiliency of the lower lateral cartilages, the skin/soft tissue envelope, the attachment of the medial crura to the caudal septum","The resiliency of the lower lateral cartilages, the attachment of the medial crura to the caudal septum, the attachment of the lower lateral cartilages, and the upper lateral cartilages at the scroll region","The sesamoid complexes, the septum, the attachment of the lower lateral cartilages, and the upper lateral cartilages at the scroll region"],"k":"C","x":"Major tip support mechanisms include the resiliency of the lower lateral cartilages, the attachment of the medial crura to the caudal septum, the attachment of the lower lateral cartilages, and the upper lateral cartilages at the scroll region. Minor tip support mechanisms include the interdomal ligament between the lower lateral cartilages, the skin/soft tissue envelope, the septum, the nasal spine, and sesamoid complexes. PAGE 3565","bn":73},{"n":74,"s":"The patient-reported outcome measures, in general, are:","o":["An important way to track medical and surgical outcomes over time","Inclusive of both functional and aesthetic measures","Both A and B","Neither A or B"],"k":"C","x":"Patient-reported outcome measures are an important way to track patient response to medical and surgical interventions over time. Specifically in elective surgery, it is important to ensure that patient-centered goals are being met. Patient-reported outcome measures include functional metrics, such as the NOSE scale, and aesthetic metrics, such as the SCHNOS score and FACE-Q Nasal scale. PAGE 3576","bn":74},{"n":75,"s":"What is the most appropriate concentration (mg/mL) for triamcinolone acetonide injection to prevent subcutaneous fibrosis and treat prolonged edema following rhinoplasty?","o":["l","7.5","20","40"],"k":"B","x":"7.5. PAGE 3614","bn":75},{"n":76,"s":"Which of the following complications of HA filler injection in the nose is reversible in the majority of patients with prompt use of local treatments such as hyaluronidase, massage, and warm compress.","o":["Immediate signs of vascular compromise (ie, blanching, pain, etc.)","Necrosis","Blindness","Cerebral infarction"],"k":"A","x":"Immediate signs of vascular compromise (ie, blanching, pain, etc.) PAGE 3611","bn":76},{"n":77,"s":"What is the earliest time after primary rhinoplasty to offer major revision rhinoplasty in the patient with normal skin and inflammatory markers?","o":["1 month","3 months","5 months","12 months"],"k":"D","x":"12 months. PAGE 3589","bn":77},{"n":78,"s":"What is the most common cause for the complication of an inverted V deformity?","o":["Failure to resuspend the upper lateral cartilages","Overgrafting the radix","Insufficient preservation of a septal L-strut","Spreader graft resorption"],"k":"A","x":"Failure to resuspend the upper lateral cartilages. PAGE","bn":78},{"n":79,"s":"What is the most common cause for inadequate treatment of the deviated nasal bone?","o":["Undiagnosed high cephalic septal deviation","Failure to align the nasal tip","Scarring of nasal mucosa","Overly aggressive displacement of lateral osteotomies"],"k":"A","x":"Undiagnosed high cephalic septal deviation. PAGE","bn":79},{"n":80,"s":"Which of the following is a most common cause for alar rim notching?","o":["Lateral crural repositioning","Overresection of the lateral crura of the lower lateral cartilages","Excessive caudal septum","Excessive columellar batten grafting"],"k":"B","x":"Overresection of the lateral crura of the lower lateral cartilages. PAGE 3605","bn":80},{"n":81,"s":"Which of the following is a characteristic of unilateral cleft nasal deformity?","o":["Dome of the lower lateral cartilage on cleft side is displaced anteriorly.","Cleft side lower lateral cartilage with shortened medial crus and elongated lateral crus.","Alar base on the cleft side is displaced anteriorly, medially, and inferiorly.","Caudal nasal septum is deviated to the cleft side."],"k":"B","x":"Several nasal characteristics are associated with patients with unilateral cleft lip, which results from the interplay between skeletal deformities, asymmetric cartilaginous framework, and aberrant muscular attachments. Some of the characteristics of unilateral nasal deformity include dome of the lower lateral cartilage on cleft side is displaced posteriorly; cleft side lower lateral cartilage is dysmorphic with shortened medial crus and elongated lateral crus; cleft side alar base is displaced posteriorly, laterally, and inferiorly; and caudal septum deviated to noncleft side (Reference: Hsieh TY, Dedhia R, Tollefson TT. Cleft rhinoplasty: strategies for the multiply operated nose. Facial Plastic Surgery. 2018;34(3):290-297). PAGES 3640-","bn":81},{"n":82,"s":"Which of the following is a characteristic of bilateral cleft nasal deformity?","o":["Shortened columella from short medial crura","Overprojected nasal tip","Anteromedially displaced nasal tip domes","Shorter lateral crura"],"k":"A","x":"Several nasal characteristics are associated with patients with bilateral cleft lip. Some of the characteristics of bilateral cleft nasal deformity include shortened columella from short medial crura; underprojected nasal tip; posterolaterally displaced nasal tip domes; and longer lateral crura. (Hsieh TY, Dedhia R, Tollefson TT. Cleft rhinoplasty: strategies for the multiply operated nose. Facial Plastic Surgery. 2018;34(3):290-297.) PAGES 3640-2641","bn":82},{"n":83,"s":"In cleft septorhinoplasty, which of the following grafts is often utilized to achieve tip support and tip projection?","o":["Spreader grafts","Caudal septal extension grafts","Premaxillary grafts","Alar batten grafts"],"k":"B","x":"Spreader grafts are often utilized for expansion of the internal nasal valve and/or reinforcing the dorsal septum. A caudal septal extension graft is often utilized in cleft septorhinoplasty to provide tip support and control tip positioning. Premaxillary grafts are often utilized in cleft rhinoplasty to support the alar base, especially in unilateral cleft nasal deformity where there is bony deficiency in the maxilla and alveolus. Alar batten grafts are typically used in supporting the external nasal valve and lateral crura. PAGE 3640","bn":83},{"n":84,"s":"What is the inheritance pattern of cleft lip and/or palate deformity?","o":["Autosomal dominant with incomplete penetrance","Autosomal recessive","Multifactorial","X-linked recessive"],"k":"C","x":"Cleft lip and/or palate is the most common congenital craniofacial deformity, affecting 1 in 500 to 1,000 live births. Orofacial clefting appears to be multifactorial and is associated with many genetic and environmental factors (Murray JC. Gene/Environment causes of cleft lip and/or palate. Clinical Genetics. 2002;61(4):248- 256). PAGE 3638","bn":84},{"n":85,"s":"Which of the following best describes the embryological origin of cleft lip and palate?","o":["Failure of fusion of the maxillary and medial nasal processes","Excessive proliferation of the mesoderm in the maxillary prominence","Defective migration of neural crest cells to the midline","Insufficient growth of the mandibular arch during development"],"k":"A","x":"The embryological origin of cleft lip and palate is indeed due to the failure of fusion of the maxillary and medial nasal processes during embryonic development. This fusion normally occurs during the 4th to 7th weeks of gestation. Option B Excessive proliferation of the mesoderm in the maxillary prominence: This option suggests an abnormal increase in mesodermal tissue in the maxillary prominence, which is not associated with the etiology of cleft lip and palate. Cleft lip and palate result from a failure in fusion rather than excessive tissue growth. Option C Defective migration of neural crest cells to the midline: While neural crest cells play a crucial role in facial development, defects in their migration are not directly linked to the formation of cleft lip and palate. Neural crest cells contribute to the formation of various facial structures, but the fusion of facial prominences is primarily mediated by interactions between the ectoderm and mesenchyme derived from the pharyngeal arches. Option D Insufficient growth of the mandibular arch during development: This option pertains to the mandibular arch, which contributes to the lower jaw formation. However, cleft lip and palate result from the failure of fusion of the maxillary and medial nasal processes, which are distinct from the mandibular arch. Insufficient growth of the mandibular arch typically leads to micrognathia (small jaw) rather than cleft lip and palate. (Sadler TW. Head and neck embryology. In: Sadler TW, ed. Lanman’s Medical Embryology. 6th ed. Baltimore, MD: Williams & Wilkins, 1990: 313-320.) PAGES 3638-3639","bn":85},{"n":86,"s":"During endoscopic brow lift surgery, the temporal branch of the facial nerve:","o":["Can be safely preserved with endoscopic-assisted dissection lateral to the orbital rim and zygomatic arch","Can be safely preserved by dissecting along the undersurface of the temporoparietal fascia","Can be safely preserved by identifying the “sentinel vein” and staying deep in a plane deep to the temporoparietal fascia","Can be safely preserved by dissecting medially within a radius of 3 cm from the lateral orbital rim"],"k":"C","x":"Can be safely preserved by identifying the “sentinel vein” and staying deep in a plane deep to the temporoparietal fascia. PAGE 3652","bn":86},{"n":87,"s":"The best candidate for a coronal forehead lift or one of its modifications from the following is:","o":["A younger female with a long forehead/high hairline","An older female with a short forehead/low hairline","A younger male with a short forehead and a family history of androgenic alopecia","An older male with a long forehead and no history of androgenic alopecia"],"k":"B","x":"An older female with a short forehead/low hairline. PAGE 3654","bn":87},{"n":88,"s":"Myoplasty is not possible with which of the methods of forehead lifting","o":["Coronal forehead lift","Direct brow lift","Indirect brow lift","Endoscopic forehead lift"],"k":"B","x":"Direct brow lift. PAGE 3655","bn":88},{"n":89,"s":"Advantages of the endoscopic forehead lift include:","o":["Avoidance of forehead shortening","Significantly less long-term motor nerve injury","Significantly less long-term sensory nerve injury","Faster recovery of sensory neuropathy"],"k":"D","x":"Faster recovery of sensory neuropathy. PAGE 3667","bn":89},{"n":90,"s":"Studies examining length of time required for adhesion between cranium and overlying periosteum or periosteum with overlying galea have demonstrated that biomechanical strength of the dissected flap matches controls at","o":["| to 2 weeks","2 to 4 weeks","4 to 6 weeks","6 to 8 weeks"],"k":"D","x":"6 to 8 weeks. PAGE 3669","bn":90},{"n":91,"s":"Which component is not part of the posterior lamella of the lower eyelid?","o":["Tarsal plate","Orbicularis oculi muscle","Capsulopalpebral fascia","Palpebral conjunctiva"],"k":"B","x":"Orbicularis oculi muscle (this is part of the anterior lamella). PAGE 3686","bn":91},{"n":92,"s":"Which of the following are indications for lower blepharoplasty? Choose all that apply.","o":["Abnormal skin pigmentation","Rhytids of the skin","Tear trough deformity","Orbital fat pseudoherniation"],"k":"C","x":"Tear trough deformity; (D) orbital fat pseudoherniation. PAGE 3690","bn":92},{"n":93,"s":"Which surgical approach to lower blepharoplasty is indicated in younger patients without any evidence of anterior lamellar pathology?","o":["Transcutaneous technique","Transconjunctival technique","Canthopexy","Canthoplasty"],"k":"B","x":"Transconjunctival technique. PAGE 3693","bn":93},{"n":94,"s":"Which hyaluronic acid filler is best suited for treatment of tear trough deformity and in which plane should it be injected?","o":["Restylane (hyaluronic acid gel); suborbicularis","Restylane (hyaluronic acid gel); supraorbicularis","Juvederm (hydrophilic hyaluronic acid gel); suborbicularis","Sculptra (poly-I-lactic acid); supraorbicularis"],"k":"A","x":"Restylane (hyaluronic acid gel); suborbicularis. PAGE","bn":94},{"n":95,"s":"Which surgical procedure corrects lid malposition secondary to horizontal lower eyelid laxity, rounding, scleral show, and/ or ectropion?","o":["Canthopexy","Canthoplasty","Lower blepharoplasty","Fat grafting"],"k":"B","x":"Canthoplasty. PAGE 3699","bn":95},{"n":96,"s":"The superficial musculoaponeurotic system (SMAS):","o":["Is contagious with the platysma and facial musculature before terminating at the inferior border of the zygoma","Is a robust, constant layer that envelops all muscles of the","Descends more readily with age in the cheek and midface","Is not elevated in deep plane facelifting technique"],"k":"C","x":"Descends more readily with age in the cheek and midface. PAGE 3707","bn":96},{"n":97,"s":"In the temporal region, dissecting in which of the following planes places the facial nerve at greatest risk:","o":["Deep (medial) the deep temporal fascia","Between the deep and superficial layers of the deep temporal fascia","Between the superficial layer of the deep temporal fascia and the superficial temporal fascia","Between the superficial temporal fascia and the dermis"],"k":"C","x":"Between the superficial layer of the deep temporal fascia and the superficial temporal fascia. PAGE 3707","bn":97},{"n":98,"s":"One key difference between deep plane facelifting, SMAS flap variations, and SMAS imbrication is:","o":["The subSMAS entry point of the deep plane flap is anterior and closer to the ptotic tissues in the midface, jowl, and neck, permitting more effective lifting of facial ptosis","The facial nerve injury rate is definitively higher in deep plane facelifting due to the subSMAS dissection","The revision or tuck up rate is lower in patients who underwent SMAS flaps or imbrication because there is no extensive release of the cutaneous retaining ligaments.","The suture placement and technique is the most important technical detail and varies greatly among the types of facelifts."],"k":"A","x":"The subSMAS entry point of the deep plane flap is anterior and closer to the ptotic tissues in the midface, jowl, and neck, permitting more effective lifting of facial ptosis. PAGE 3707","bn":98},{"n":99,"s":"During a deep plane facelift, you have incised the SMAS are dissecting medially in the deep plane. A medical student observing you points to a white structure deep to the plane and asks if it is a facial nerve branch and if it is at risk. You explain:","o":["The nerve travels to innervate the facial musculature on their superficial surface, as dissection is superficial to the musculature, the patient should not have any weakness.","There are redundant branches and so injury to a branch or two during surgery will not cause a clinically significant deficit to the patient.","Facial nerve branches have the ability to regenerate.","If the nerve is covered by intact parotid-masseteric fascia, blunt dissection will not cause permeant injury."],"k":"D","x":"If the nerve is covered by intact parotid-masseteric fascia, blunt dissection will not cause permanent injury. PAGE 3723","bn":99},{"n":100,"s":"What is the most common complication after rhytidectomy?","o":["Infection","Hematoma","Facial nerve injury","Poor cosmetic outcome"],"k":"B","x":"Hematoma. PAGE 3714","bn":100},{"n":101,"s":"The auricular hillocks coalesce to form the ear in the:","o":["First trimester","Third trimester","Second trimester","At birth"],"k":"A","x":"The Hillocks of His coalesce to form the ear by 12 weeks of gestation, the first trimester. They continue to grow until they reach their final shape by 20 weeks of gestation. PAGE 3738","bn":101},{"n":102,"s":"In the incisional techniques, it is imperative that the incisions:","o":["Cross the antihelix","Enter the fossa triangularis","Are perpendicular to the anatomic landmarks","Do not cross anatomic landmarks"],"k":"A","x":"Cross the antihelix. PAGE 3744","bn":102},{"n":103,"s":"The postauricular incision is made:","o":["On the mastoid","Extending on either side of the postauricular crease","On the posterior surface of the auricular cartilage","None of the above"],"k":"C","x":"The incision is made lateral to the postauricular crease on the posterior surface of the auricle. PAGE 3745","bn":103},{"n":104,"s":"Suture placement from the conchal bowl to the mastoid in the conchal setback procedure should be positioned from:","o":["Superior to inferior","Anterior to posterior","Inferior to superior","Posterior to anterior"],"k":"B","x":"After dissecting soft tissue off of the conchal bowl and mastoid, sutures should be placed from anterior (the conchal bowl) to posterior (the mastoid periosteum). PAGE 3745","bn":104},{"n":105,"s":"Mustarde sutures are placed from the lateral conchal bowl to the scaphoid emenience and are placed in a pattern that radiates from the:","o":["Antitragus","Fossa triangularis","Helical crus","External auditory canal"],"k":"D","x":"In a normally formed ear, the curve of the antihelix is radially positioned from the external auditory canal. PAGE 3739","bn":105},{"n":106,"s":"Otoplasty is considered at the age of 5 to 6 years because:","o":["The cartilage remains malleable at this age.","Children begin to notice differences at this time and may be ridiculed.","The ears have reached 80% of their adult size.","All of the above."],"k":"D","x":"It is generally true that the ear cartilage is more compliant in younger patients, school-aged children become subjects of ridicule for physical differences, and the ears have reached 80% of their adult size. PAGE 3744","bn":106},{"n":107,"s":"Molding techniques work best if performed:","o":["In the adult","Before the age of 3 months","Between | and 5 years of age","None of the above"],"k":"B","x":"If molding techniques are to work, they must be employed before 3 months of age. PAGES 3743-3744","bn":107},{"n":108,"s":"The most common complication of otoplasty is:","o":["Hematoma","Infection","Failure to correct the protrusion","Asymmetry"],"k":"D","x":"No two ears are ever perfectly symmetric, especially in surgically corrected ears. PAGES 3752-3754","bn":108},{"n":109,"s":"Constricted ears will need these maneuvers to allow and secure expansion","o":["Release of the overlying skin","Cartilage relaxing incisions","Cartilage grafting","All of the above"],"k":"D","x":"Constricted ears vary in severity. The most constricted ears need skin and cartilage incisions for release and often skin and cartilage grafting for full reconstruction. PAGES 3751-3752","bn":109},{"n":110,"s":"A 4-year-old Caucasian male presents for evaluation of right-sided grade III microtia and aural atresia. Following CT imaging, he is determined to be a good candidate for atresia repair. After discussion of reconstructive options, his family opts for autologous rib cartilage reconstruction for the microtia. When should he be planned for atresiaplasty?","o":["1 year prior to planned microtia reconstruction","Concurrently with first stage microtia reconstruction","Following rib cartilage auricular framework implantation and lobule transposition","Following framework elevation and skin graft placement along posterior auricular sulcus"],"k":"C","x":"Following rib cartilage auricular framework implantation and lobule transposition. PAGE 3765","bn":110},{"n"
