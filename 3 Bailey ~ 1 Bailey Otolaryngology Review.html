"x":"Unilateral clear nasal drainage, especially in the setting of a single obstructed sinus, suggests possible CSF leak from an encephalocele. Another associated finding on CT may be skull base dehiscence adjacent to the opacified sinus. Hyperdensity within the sphenoid sinus is suggestive of a fungus ball, which does not require MR imaging. Osteoneogenesis suggests a chronic process and is often associated with a fungus ball. MR imaging is not helpful in assessing bone dehiscence in this area. PAGE 374","bn":22},{"n":23,"s":"Which of the following findings most strongly suggests odontogenic sinusitis?","o":["Bilateral subtotal opacification of the maxillary sinuses alone","Numbness over a unilateral V2 distribution","Ipsilateral, small periapical abscess","Recent mandibular tooth extraction"],"k":"C","x":"Odontogenic sinusitis is most frequently unilateral, associated with periapical lucency on CT evaluation, and may be associated with maxillary (not mandibular) tooth extraction V2 numbness should raise concern for a neoplasm. PAGE 369; Figure 23.4, PAGE 370","bn":23},{"n":24,"s":"The sphenoethmoidal recess is best assessed using which imaging plane(s)?","o":["Axial alone","Sagittal and axial","Axial and coronal","Coronal and sagittal"],"k":"B","x":"The natural sphenoid ostium is situated in the coronal plane, which makes the two orthogonal planes (axial and sagittal) most useful in visualizing the sphenoethmoidal recess. PAGE 369; Figure 23.6, PAGE 372","bn":24},{"n":25,"s":"What is the significance of identification (on CT imaging) of osteitis adjacent to a biopsy-proven inverted papilloma?","o":["Osteitis indicates a slow growing mass, less likely to harbor malignancy.","Osteitis indicates a slow growing mass, more likely to harbor malignancy.","The area of osteitis indicates possible bone invasion and should be further investigated with an MRI.","The area of osteitis could represent the attachment site of the inverted papilloma."],"k":"D","x":"Inverted papilloma attachment sites are often identifiable on CT scan due to osteoneogenesis at the attachment site. PAGE 384","bn":25},{"n":26,"s":"Which of the following is an advantage of CT over MR imaging for evaluation of sinonasal disease?","o":["Lack of radiation exposure","Excellent bony anatomy definition","Multiplanar reconstruction","Detailed soft tissue definition","Differentiation between secretions and soft tissue"],"k":"B","x":"MR imaging is superior to CT imaging for soft tissue pathology and characterization of opacified sinuses. However, CT provides superior definition of sinonasal bony anatomy. Both imaging options are amenable to multiplanar reconstruction. PAGE 393","bn":26},{"n":27,"s":"The term “allergy” refers to which of the following?","o":["An elevated total serum IgE level","Demonstrable IgE reaction to an allergen","Presence of corresponding symptoms upon allergen exposure","In vitro demonstration of an allergen-specific IgE"],"k":"C","x":"Clinical allergy is defined by symptoms after exposure to a specific allergen. A positive allergy test does not define allergic disease. Some individuals may demonstrate “hypersensitivity” or “sensitization” via testing, yet have no allergic symptoms. This is one reason that allergy testing should be performed only when there is a clinical suspicion of allergy. PAGE 396","bn":27},{"n":28,"s":"Which of the following is an appropriate indication for obtaining a CT scan of the sinuses during the evaluation of sinonasal pathology?","o":["Clinical improvement with medical therapy for acute bacterial rhinosinusitis","Postoperative evaluation following endoscopic sinus surgery for chronic rhinosinusitis (CRS)","Preoperative planning of sinonasal neoplasm resection","Nasal bone fracture"],"k":"C","x":"CT imaging is not indicated in uncomplicated acute sinusitis or following uncomplicated endoscopic sinus surgery for CRS. Nasal bone fractures do not require imaging. CT imaging is often critical in preoperative planning for sinonasal neoplasms. PAGE 393","bn":28},{"n":29,"s":"A false-negative sweat chloride test is most frequently seen with which of the following scenarios?","o":["Hypoparathyroidism","Dehydration","Adrenal insufficiency","Skin edema"],"k":"D","x":"The two most common causes of a false-negative sweat test are (a) lab error and (b) skin edema. False-positive tests can be due to hypoparathyroidism, dehydration, and adrenal insufficiency. PAGE 394","bn":29},{"n":30,"s":"Which medication can be continued without concern for interfering with allergy skin testing?","o":["Leukotriene receptor antagonist","Tricyclic antidepressants","H1-receptor antagonists","H2-receptor antagonists"],"k":"A","x":"First-generation H1-antihistamines should be stopped at least 3 days prior to testing, while second-and third-generation H1-antihistamines should be stopped 7 days prior to testing. H2-receptor antagonists should be stopped 48 hours prior to skin testing. Antihistamine nasal sprays should be withheld for 3 days prior to testing. The following medications have no effect on skin testing: inhaled or intranasal topical steroids, decongestants, inhaled beta agonists, intranasal cromolyn, and leukotriene receptor antagonists. PAGE 397","bn":30},{"n":31,"s":"Allergic rhinitis is mediated by which of the following?","o":["IgG4","IgA","IgE","IgM"],"k":"C","x":"Exposure to an allergen results in antigen-specific IgE production in an atopic individual. Subsequent exposures to the antigen can cause an immunologic reaction that results in the symptoms of allergic rhinitis. PAGE 405","bn":31},{"n":32,"s":"The most critical part of diagnosis of allergic rhinitis is:","o":["History","Physical examination","Nasal endoscopy","Allergy testing"],"k":"A","x":"A history of allergic symptoms is necessary to diagnose allergic rhinitis as testing and physical examination findings independent of history are nonspecific. PAGE 406","bn":32},{"n":33,"s":"A 57-year-old male presents for evaluation of allergic rhinitis. He has been using fluticasone and azelastine nasal spray daily along with daily cetirizine for several years with moderate benefit. He is interested in exploring other treatment options. He also takes metoprolol for atrial fibrillation and daily prednisone for rheumatoid arthritis. You discuss allergy skin testing with him. Which of the medications does he have to stop taking prior to skin testing?","o":["Fluticasone, azelastine, cetirizine, and metoprolol after discussion with his cardiologist","Azelastine, cetirizine, and metoprolol after discussion with his cardiologist","Prednisone and fluticasone","Prednisone only"],"k":"B","x":"Patients must stop oral antihistamines (cetirizine), antihistamine nasal spray (azelastine), and B-adrenergic blocker (metoprolol) prior to allergy skin testing. PAGE 408, Table 25.4","bn":33},{"n":34,"s":"First-line therapy for allergic rhinitis is:","o":["Antihistamine nasal spray","Oral decongestants","Corticosteroids nasal spray","Anticholinergic nasal spray"],"k":"C","x":"Intranasal corticosteroids are the first-line therapy for allergic rhinitis. PAGE 410","bn":34},{"n":35,"s":"Allergy immunotherapy typically results in:","o":["Complete elimination of allergic symptoms","Immunologic shift from Th1 to Th2 predominance","No effect on incidence of additional sensitization","Reduction in development of associated comorbid conditions"],"k":"D","x":"While immunotherapy is the only treatment modality with the potential to cure allergic rhinitis, patients report 30% to 61% decrease in symptoms. Immunotherapy results in a shift from Th2 to Th1 predominance. Immunotherapy can decrease the development of new inhalant allergen sensitivities and decrease the incidence of developing allergic asthma in patients with allergic rhinitis. PAGE 411","bn":35},{"n":36,"s":"As of 2023, FDA-approved treatments for CRS with polyps includes which of the following monoclonal antibodies correctly paired with its target cytokine and/or antibodies?","o":["Dupilumab which targets IL-4 receptor","Benralizumab which targets IL-5","Omalizumab which targets IgE","Mepolizumab which targets thymic stromal lymphoppoietin (TSLP)"],"k":"C","x":"Omalizumab which targets IgE. Dupilumab was the first FDA-approved treatment for CRS with polyps (June 2019) and targets an IL-4 receptor subunit, which is also part of the IL-13 receptor—inhibiting both cytokines. Benralizumab binds to the alpha subunit of the IL-5 receptor (present on eosinophils) and attracts natural killer cells to induce eosinophil apoptosis. Omalizumab targets IgE and was FDA approved for CRS with polyps in December of 2019. Mepolizumab binds IL-5 and was FDA approved for CRS with polyps in 2021. PAGE 422","bn":36},{"n":37,"s":"Which of the following substances is not likely to be the cause of irritant-induced occupational rhinitis:","o":["Chlorine","Sulfur dioxide","Ozone","Cigarette smoke"],"k":"D","x":"Irritant-induced occupational rhinitis should be distinguished from work-exacerbated operating room in which preexisting rhinitis symptoms occur also outside the workplace but are worsened by exposures or nonspecific stimuli (cold air, cigarette smoke, exercise, temperature changes) at work. PAGE 423","bn":37},{"n":38,"s":"Which of the following is a mechanism by which tachyphylaxis is proposed to occur in rhinitis medicamentosa:","o":["Exhaustion of the postsynaptic supplies of norepinephrine from continued stimulation","Decease in sensitivity and number of the a receptors on the postsynaptic side due to the inhibitory effects of a2 receptor on the presynaptic neuron","Prolonged a-adrenergic vasodilation outlasting the B-adrenergic effects","Increased sympathetic tone leading to vascular permeability and increased edema"],"k":"B","x":"While there is no definitive explanation for the tachyphylaxis with rhinitis medicamentosa, increased inhibitory effects of a receptor resulting in decrease in sensitivity and number of postsynaptic a receptors. Other theories include exhaustion of the presynaptic supplies of norepinephrine from continued stimulation, prolonged f-adrenergic vasodilation outlasting the a-adrenergic effects, and increased parasympathetic tone leading to vascular permeability and increased edema. PAGE 428","bn":38},{"n":39,"s":"Which of the following medications is the first-line treatment for nonallergic rhinitis?","o":["Intranasal corticosteroid","Intranasal anticholinergic","Intranasal antihistamine","Oral antileukotriene inhibitor"],"k":"C","x":"Azelastine is FDA approved for the treatment of nonallergic rhinitis, and intranasal antihistamines are considered first-line therapy as monotherapy for nonallergic rhinitis. PAGE 420","bn":39},{"n":40,"s":"A 30-year-old G2P1 female patient with no prior history of rhinitis or seasonal allergies presents with severe nasal congestion during her second trimester of pregnancy. What is the most appropriate initial treatment recommendation?","o":["Montelukast","Triamcinolone nasal spray","Oral decongestants","Nasal saline aerosol"],"k":"D","x":"Saline aerosol sprays and irrigations are effective for thinitis of pregnancy and should be the first-line agent before trying pharmaceuticals. Leukotriene inhibitors may be tolerated during pregnancy but are not thought to be efficacious for rhinitis of pregnancy and carry a general black box warning due to the possibility for potentiating suicidal ideation. Triamcinolone is the only topical nasal steroid that may be associated with congenital pulmonary defects according to a prospective Canadian study. Oral and topical decongestants should be avoided especially in the first trimester due to a risk of birth defects including gastroschisis. PAGE 429","bn":40},{"n":41,"s":"Cystic fibrosis (CF) is associated with which intranasal finding? ssociated childhood development often","o":["Nasal crusting","Epistaxis","Nasal polyps","Concha bullosa"],"k":"C","x":"CF is an autosomal recessive disease characterized by defective ion transport proteins. Multiple organ systems are infected including the lower and upper airways. CF is associated with a very high rate of CRSwNP and CRSsNP with up to 100% of patients demonstrating signs of sinonasal inflammation and 20% of patients developing nasal polyps. In contrast to the typical eosinophilic inflammation, which characterizes idiopathic nasal polyp disease in Western countries, CF-related nasal polyps are associated with neutrophil predominant inflammation. PAGE 439","bn":41},{"n":42,"s":"Saddle nose deformity is most commonly associated with which systemic disease?","o":["Sarcoidosis","Eosinophilic granulomatosis with polyangiitis (EGPA) (formerly Churg-Strauss disease)","Granulomatosis with polyangiitis (formerly Wegner granulomatosis)","Sjogren syndrome"],"k":"C","x":"Septal involvement can result in perforation or saddle nose deformity in up to 10% to 25% of patients with GPA. Other common intranasal symptoms of GPA include mucosal crusting, increased friability, and epistaxis. PAGE 443","bn":42},{"n":43,"s":"Which lab value is most sensitive and specific for GPA (formerly Wegner granulomatosis)?","o":["cytoplasmic antineutrophil cytoplasmic antibody (C-ANCA), and a negative value confidently rules out GPA","C-ANCA, though a negative value cannot rule out GPA","perinuclear anti-neutrophil cytoplasmic antibody (P-ANCA), and a negative value confidently rules out GPA","P-ANCA, though a negative value cannot rule out GPA"],"k":"B","x":"C-ANCA and antibodies against proteinase-3 are the most sensitive and specific tests for GPA. A negative value, however, cannot rule out GPA, and cases of isolated nasal involvement are less likely to have a positive C-ANCA than systemic disease. P-ANCA or antibodies against myeloperoxidase can rarely be found in GPA but are more commonly found in eosinophilic GPA (formerly Churg-Strauss syndrome). PAGE 443","bn":43},{"n":44,"s":"Intranasal manifestations of Sjogren syndrome most commonly includes which symptoms?","o":["Nasal crusting","Hyposmia","Nasal dryness","Recurrent sinusitis"],"k":"C","x":"Sjogren syndrome is a relatively common autoimmune disease marked by progressive inflammation of salivary and lacrimal glands leading to xerostomia and keratoconjunctivitis sicca. Nasal manifestations are not uncommon in Sjogren syndrome, and most commonly include nasal obstruction and nasal dryness. These can be treated with topical saline sprays, rinses, and lubricants. PAGE 446","bn":44},{"n":45,"s":"Where is the most common site of hereditary hemorrhagic telangiectasia (HHT)-associated epistaxis?","o":["Anterior septal mucosa","Woodruff plexus","Middle turbinate","Anterior skull base"],"k":"A","x":"HHT, also known as Osler-Weber-Rendu disease, is an autosomal dominant disorder characterized by vascular malformations in many organ systems (Chapter 31, Section “Hereditary Hemorrhagic Telangiectasia”). Telangiectasias are predominantly found in the anterior septal mucosa, although they are also often found on the skin of the helix of the ear, soft palate mucosa, circumoral region, and nail beds/fingertips. PAGE 447","bn":45},{"n":46,"s":"The most common origin for posterior epistaxis is:","o":["Lateral nasal wall","Inferior septum","Superior septum","Posterior attachment of the inferior turbinate"],"k":"C","x":"The superior septum (Fig. 28.1) is most common location for a posterior bleed (59.5%) followed by the lateral nasal wall (26.2%) and inferior septum (14.3%). PAGE 452","bn":46},{"n":47,"s":"For stable patients with recurrent epistaxis originating from Kiesselbach plexus, the most effective form of cautery for long-term control is:","o":["Chemical cautery (silver nitrate)","Laser-assisted cautery","Radiofrequency ablation","Bipolar cautery"],"k":"D","x":"Bipolar cautery offers superior results to silver nitrate with half the rate of failure (14.5% and 35.1%, respectively) [26]. Radiofrequency ablation for cautery has been associated with the development of nasal septal abscesses and therefore not recommended [27]. Laser-assisted cauterize is typically reserved for patients with HHT. PAGE 456","bn":47},{"n":48,"s":"Management of patients with bilateral nasal packing should include:","o":["Hospital admission with continuous pulse oximetry is recommended because a third of patients will have desaturation events","Admission to the intensive care unit (ICU) is recommended because a third of patients will have desaturation events","Hospital admission with continuous pulse oximetry is recommended because bilateral packing will induce the nasopulmonary reflex leading to hypercarbia, hypoxia, and decreased lung volume","Admission to the ICU is recommended because bilateral packing will induce the nasopulmonary reflex leading to hypercarbia, hypoxia, and decreased lung volume","Patients can be safely sent home"],"k":"A","x":"Bilateral packing necessitates hospital admission with continuous pulse oximetry as studies have shown a third of patients will have desaturation events. PAGE 457","bn":48},{"n":49,"s":"Patients who have a posterior nasal packing:","o":["Should not be admitted by routine unless another indication exists","Should be admitted by routine to the ICU","Require admission with continuous pulse oximetry","Only require admission if they have obstructive sleep apnea or underlying cardiac disease"],"k":"D","x":"Posterior packs can also theoretically induce the nasopulmonary reflex leading to hypercarbia, hypoxia, and decreased lung volume, and thus, hospital admission with telemetry monitoring has been advocated in those with underlying comorbidities, such as obstructive sleep apnea, arrhythmias, and cardiac disease. PAGE 458","bn":49},{"n":50,"s":"What is the most effective intervention for patients with posterior epistaxis:","o":["Placement of a posterior nasal pack","Unilateral IMA embolization","Unilateral sphenopalatine artery (SPA) ligation","Endoscopic monopolar cautery"],"k":"C","x":"The long-term success of SPA ligation is around 75% to 80%. Bilateral SPA ligation can increase the rate of success but runs the risk of a posterior septal perforation and middle turbinate necrosis. Unilateral IMA embolization is around 75% effective; the suc ‘ate is higher if the contralateral IMA and if one or both facial arteries are embolized; however, bilateral IMA embolization may leave patients with jaw claudication, and involvement of the facial arteries risks necrosis to the nasal alar and palate. PAGE 460","bn":50},{"n":51,"s":"A diagnosis of recurrent acute rhinosinusitis (ARS) requires at least how many episodes of acute rhinosinusitis per year with resolution between episodes?","o":["Eight","Six","Four","Two"],"k":"C","x":"Diagnosis of recurrent acute sinusitis requires at least four acute episodes per year with resolution between episodes. PAGE","bn":51},{"n":52,"s":"Acute bacterial rhinosinusitis occurs in approximately what percentage of patients who develop a viral ARS?","o":["1%","5%","10%","25%"],"k":"A","x":"ARS is almost always secondary to viral infection and rarely progresses to acute bacterial rhinosinusitis (0.5% to 2%) of ARS episodes. PAGE 466","bn":52},{"n":53,"s":"Which of the following microbes is not commonly associated with acute bacterial rhinosinusitis?","o":["Moraxella catarrhalis","Hemophilus influenzae","Streptococcus pyogenes","Pseudomonas aeruginosa"],"k":"D","x":"The organisms most associated with ABRS include Streptococcus pneumoniae, H. influenzae, Staphylococcus aureus, M. catarrhalis, and S. pyogenes. PAGE 466","bn":53},{"n":54,"s":"Which of the following is required for a diagnosis of acute bacterial rhinosinusitis?","o":["Radiographic findings demonstrating sinus inflammation","A culture demonstrating a pathogenic bacteria","Purulent nasal drainage","“Double-sickening”—worsening of symptoms after a period of initial improvement"],"k":"C","x":"ABRS is a clinical diagnosis. In uncomplicated cases, CT scan and culture are not recommended. The diagnosis requires the presence of cardinal symptoms (purulent nasal drainage, nasal obstruction, and facial pain/pressure/fullness) for an appropriate time-course: at least 10 days OR with a period of worsening after initial improvement (double sickening). PAGE 468","bn":54},{"n":55,"s":"When compared to watchful waiting, antibiotic treatment for acute bacterial sinusitis (ABRS) is associated with:","o":["Clinical improvement at days 3 to 5 following diagnosis","Decrease indirect cost of disease due to fewer lost work days","A higher likelihood of developing an adverse event from antibiotic treatment than for avoiding a complication of","Decreased need for future interventions (surgery, imaging studies)"],"k":"C","x":"Few patients with ARS progress to ABRS, and ABRS is a self-limited condition that rarely leads to complications. Treatment with antibiotics is associated with decreased symptom burden, but only between days 7 and 12 after diagnosis with no significant effect early (days 3 to 5) or late (after 14 days). Antibiotic treatment is associated with an increased risk of adverse medication events and potential for improving clinical outcomes, but the likelihood of developing an adverse event is greater than the likelihood of improving a clinical sinusitis outcome. Number needed to treat patients to obtain an adverse event is 8, while the number needed to treat to improve the clinical course of sinusitis is 19 in recent Cochrane study. The diagnosis of ABRS does not require antibiotic treatment; decision on which patients with ABRS to treat with antibiotics should be shared between patients and physicians with consideration for severity of symptoms and risk for complications of sinusitis. PAGE 473","bn":55},{"n":56,"s":"A patient is referred for “nasal polyps,” and on endoscopy, you see a unilateral mass. What is an appropriate next step?","o":["Initiate medical management with topical corticosteroids","Biopsy and/or imaging depending on the nature of the mass","Referral to allergy for testing","Testing for CF"],"k":"B","x":"Polyps may be indistinguishable from neoplasms or other nasal masses such as encephaloceles. Because most inflammatory polyps are bilateral, unilateral presentation of a “nasal polyp” requires further evaluation with imaging, biopsy, or both depending on the clinical circumstances. PAGE 484","bn":56},{"n":57,"s":"Patients with CF may have classic findings on sinus CT imaging such as:","o":["Underdeveloped sinuses and poor sinus pneumatization, with absent frontal sinuses","Highly pneumatized (large) frontal sinuses","Asymmetric sinus pneumatization","Very thin bone of the sinuses"],"k":"A","x":"Patients with CF have a higher incidence of underdeveloped sinuses, poorer sinus pneumatization (frequently absent frontal sinuses), bony sclerosis of sinus walls, medial displacement of the lateral nasal wall, and mucocele formation. PAGE","bn":57},{"n":58,"s":"Aspirin-exacerbated respiratory disease (AERD), also known as Samter’s triad, is characterized by which three characteristics:","o":["Chronic rhinosinusitis with nasal polyps (CRSwNP), environmental allergies, and aspirin/nonsteroidal anti-inflammatory drug (NSAID) intolerance","Chronic rhinosinusitis without nasal polyps (CRSsNP), aspirin/NSAID intolerance, and asthma","CRSwNP, aspirin/NSAID intolerance, and asthma","CRSsNP, environmental allergies, and aspirin/NSAID intolerance"],"k":"C","x":"AERD is an adult-onset disorder made up of the triad of nasal polyposis, asthma, and intolerance to cyclooxygenase-1 (COX-1) enzyme inhibitors. PAGE 489","bn":58},{"n":59,"s":"Allergic fungal rhinosinusitis (AFRS), which is often unilateral, is most commonly found in patients from what U.S. region:","o":["West Coast","New England","South","Upper Midwest"],"k":"C","x":"There is a geographic propensity for the development of AFRS in southern areas of the United States thought to be secondary to the high-humidity climate. PAGE 490","bn":59},{"n":60,"s":"What are the most common symptoms of CRSwNP?","o":["Bilateral nasal obstruction, nasal congestion, anterior and posterior nasal drainage, hyposmia, facial pressure, and headache","Dizziness, photophobia, and phonophobia","Unilateral nasal congestion","Epistaxis"],"k":"A","x":"Nasal obstruction, nasal congestion, anterior and posterior nasal drainage, hyposmia, facial pressure, smell loss, and headache are common symptoms of CRSwNP. PAGE 484","bn":60},{"n":61,"s":"When compared to CRSwNP, CRS patients without polyps are more likely to demonstrate which inflammatory mediators and cytokines?","o":["IL-4","Tumor necrosis factor (TNF)-a","IL-5","IL-13"],"k":"B","x":"CRS with polyps is most frequently associated with type 2 inflammation with IL-4, IL-5, and IL-13 important components of this inflammatory pathway. Nonpolypoid CRS is more heterogeneous. While some CRSsNP patients show type 2 inflammation, relative to CRS with polyps, CRSsNP is more likely to be associated with type 1 inflammation and TNF-a. PAGE 494","bn":61},{"n":62,"s":"Patients with primary ciliary dyskinesia are:","o":["More likely to have CRSwNP","More likely to have CRSsNP","Equally as likely to have either CRSwNP or CRSsNP","Not likely to develop any form of CRS"],"k":"B","x":"Patients with primary ciliary dyskinesia are most likely to develop CRSsNP. PAGE 498","bn":62},{"n":63,"s":"Which of the following has little impact on the diagnosis and management of CRSsNP?","o":["CT scan findings","Nasal endoscopy","Patient symptoms","Results of allergy testing"],"k":"D","x":"Symptoms, findings, nasal endoscopy, and CT are the most important factors in the diagnosis of CRSsNP. PAGE 500, Table 31.2","bn":63},{"n":64,"s":"Which subtype of sinusitis is most commonly associated with CRSsNP?","o":["AFRS","CRS associated with EGPA","Fungus ball (Mycetoma)","AERD"],"k":"C","x":"AFRS, EGPA, and AERD are all associated with type 2 inflammation and polyp formation. Fungus balls are usually isolated to a single sinus (sphenoid or maxillary most frequently) and are not associated with type 2 inflammation or polyp formation. PAGE 496","bn":64},{"n":65,"s":"Structural differences within the nasal cavity and sinuses, such as septal deviation, concha bullosa, and Haller cells, are more likely to be factors in developing:","o":["CRSwNP","CRSsNP.","Odontogenic sinusitis","Allergic fungal sinusitis"],"k":"B","x":"Anatomic variants and septal deviations have been implicated as contributing factors in the pathogenesis of some patients with CRSsNP. While the majority of patients with CRSsNP have nonstructural etiologies of disease, those who have anatomic variants and fail to respond adequately to medical therapy may benefit from surgery to address anatomic changes as components of their endoscopic sinus surgery. PAGE 497","bn":65},{"n":66,"s":"With regards to the unified airway:","o":["There is no evidence that immunotherapy for allergic rhinitis in children may reduce the risk of developing asthma","Nasal allergen provocation in allergic nonasthmatic patients induced increased eosinophilia in the bronchial mucosa as well as increased expression of cellular adhesion molecules, signifying increased inflammatory cell migration","When looking at bronchial biopsies, atopic nonasthmatics (patients with AR but without the diagnosis of asthma) had no basement membrane thickening and no eosinophilic inflammation in their lower airways.","The Finnish Twin Cohort Study showed that the allergic rhinitis and the development of asthma have no temporal relationship"],"k":"B","x":"A study by Branstahl showed that nasal allergen provocation in allergic nonasthmatic patients induced increased eosinophilia in the bronchial mucosa as well as increased expression of cellular adhesion molecules, signifying increased inflammatory cell migration. This study demonstrates that inflammation in one part of the airway can lead to inflammation in another site and align with the unified airway concept. A separate study of 205 children aged 6 to 14 years without a diagnosis of asthma were randomized to treatment of a birch or grass pollen allergy versus an open control group and followed. At 3, 5, and 7 years. had developed asthma, while only 26% of the treatment group had approximately 45% of the control group developed asthma. Studies of bronchial biopsies show that atopic nonasthmatics had basement membrane thickening and eosinophilic inflammation in lower airways. The Finnish Twin Cohort Study suggests that AR is a risk factor for the development of asthma. PAGES 512-513","bn":66},{"n":67,"s":"With regard to asthma, tissue eosinophils, and CRS:","o":["In CRS patients, a comorbid diagnosis of asthma is associated with low recurrence rates of CRS and need for revision functional endoscopic sinus surgery (FESS)","The Benninger et al study from 2016 on the impact of recalcitrant CRS on asthma showed that FESS for CRS in asthmatic patients did not help asthma symptoms","High levels of tissue eosinophil aggregates on histopathologic examination of tissue removed from sinus surgery patients are linked to an increased need for prednisone after endoscopic sinus surgery","Acute exacerbations of CRS are associated with good asthma control"],"k":"C","x":"Severe asthma has been shown to cause an increase in eosinophilic activation and adhesion, forming aggregates of eosinophils found on histopathologic inspection. Asthmatic patients have been found to be more susceptible to exacerbations, treatment failure, and surgical recurrence of comorbid CRS. Benninger et al found that incidence of asthma was greatly reduced post FESS. Acute exacerbations of CRS are associated with poor asthma control. PAGE","bn":67},{"n":68,"s":"Central compartment atopic disease is strongly associated with:","o":["Allergic fungal mucin","Ethmoid-orbital mucoceles","Inhalant allergy","Cystic fibrosis"],"k":"C","x":"Known as central compartment atopic disease, this phenotype of nasal inflammatory disease is strongly associated with inhalant allergy. PAGE 514","bn":68},{"n":69,"s":"Dupilumab is a monoclonal antibody that works primarily by blocking:","o":["IL-5","Eotaxin","IgE","IL-4 and IL-13"],"k":"D","x":"Dupilumab is an anti-IL-4 and IL-13 monoclonal antibody, which acts to decrease mucosal eosinophil numbers and serum IgE. Mepolizumab and reslizumab are monoclonal antibodies that target IL-5. Omalizumab is an anti-IgE monoclonal antibody. PAGE 514","bn":69},{"n":70,"s":"Elexacaftor, ivacaftor, and tezacaftor work primarily by:","o":["Treating P. aeruginosa in patients with CF","Reducing the asthma symptoms and aspirin sensitivity in","Impacting the CFTR transmembrane sodium chloride channels in patients with CF","Reducing nasal polyps in AERD"],"k":"C","x":"Elexacaftor and tezacaftor each directly bind to different sites on the CFTR protein and facilitate its transport to the cell surface. Ivacaftor aids in keeping the channel open once it has reached the cell surface. PAGE 515","bn":70},{"n":71,"s":"Acute invasive fungal sinusitis is seen in patients with immune compromise characterized by decreased function of which cell type?","o":["Eosinophils","Natural killer T cells","Neutrophils","Macrophages"],"k":"C","x":"Acute invasive fungal sinusitis is seen almost exclusively in patients with markedly compromised neutrophil function: poorly controlled diabetes, hematologic malignancy/bone marrow transplant, aplastic anemia, etc. PAGE 519","bn":71},{"n":72,"s":"What is the most common presenting symptom in patients with acute invasive fungal sinusitis?","o":["Fever","Pain","Rhinorrhea","Numbness"],"k":"A","x":"For patients with immune compromise, symptoms including nasal congestion, rhinorrhea, facial pain, and headache should all prompt evaluation for acute invasive fungal sinusitis. The most common presenting symptom, however, is fever. PAGE 520","bn":72},{"n":73,"s":"What is the most common pathogen identified in chronic invasive fungal sinusitis?","o":["Candida spp","Aspergillus spp","Mucoraceae spp","Cryptococcus spp"],"k":"B","x":"Aspergillus is the most common pathogen identified with chronic invasive fungal sinusitis. Mucoraceae spp are also frequently associated with invasive fungal disease but typically noted with acute invasive fungal sinusitis.","bn":73},{"n":74,"s":"Fungal balls are most likely to occur in which region?","o":["Maxillary sinus","Ethmoid sinuses","Frontal sinus","Sphenoid sinus"],"k":"A","x":"Maxillary sinus disease (62%-84.4%) is reported to be several times more frequent than sphenoid involvement (14.4%-25%), with the ethmoid (0.6%-4%) infrequently involved. PAGE 527","bn":74},{"n":75,"s":"Which fungal process of the sinuses is characterized by single sinus involvement and associated with prior endodontic treatment?","o":["Allergic fungal sinusitis","Acute invasive fungal sinusitis","Chronic invasive fungal sinusitis","Fungus ball"],"k":"D","x":"Approximately 90% of fungus balls involve only a single sinus, and there is an association with prior endodontic treatment. PAGE 527","bn":75},{"n":76,"s":"One of the most commonly identified organisms in intracranial abscesses due to sinusitis is:","o":["P. aeruginosa","H. influenzae","S. pneumonia","Streptococcus viridians"],"k":"D","x":"Cultures from intracranial abscesses are often polymicrobial. Streptococcus viridans species (including S. milleri) and S. aureus, other Streptococcus species, and anaerobes are the most commonly isolated organisms in intracranial infections secondary to sinusitis in both children and adults. PAGE 541, Table 34.3","bn":76},{"n":77,"s":"An 8-year-old boy presents to the emergency department with headache, exophthalmos, chemosis, complete ophthalmoplegia, and blurred vision 10 days after the start of an upper respiratory infection. What Chandler classification is most likely?","o":["I","II","III","IV"],"k":"D","x":"An orbital abscess (Chandler class [V) occurs when orbital cellulitis coalesces into a discrete collection of pus within the orbital tissues. This is a serious complication that can be associated with severe exophthalmos and chemosis, complete ophthalmoplegia, and visual impairment with a risk for progression to irreversible blindness. PAGE 537, Table 34.1","bn":77},{"n":78,"s":"Intracranial complication with the most favorable outcome is:","o":["Epidural abscess","Cavernous sinus thrombosis","Subdural abscess","Intracerebral abscess"],"k":"A","x":"Epidural and subdural abscesses are the most common intracranial sinusitis complications. These abscesses are generally a complication of frontal sinusitis due to venous communications and loosely adherent dura in the frontal region. Outcomes for epidural abscess tend to be more favorable than other intracranial infections. PAGE 544","bn":78},{"n":79,"s":"Factors of subperiosteal abscess that are associated with higher rates of success with medical management (choose answer in which all factors favor medical management):","o":["Abscess volume less than 750 mm3, age less than 9 years, intraocular pressure normal","Intraocular pressure normal, medial location, frontal sinus involvement","Medial location, superior orbital vein thrombosis, age less than 9 years","Abscess volume less than 750 mm3, age greater than 9 years, medial location"],"k":"A","x":"Small, medial subperiosteal abscess (volume < 750 mm3), age less than 9 years, and lack of vision compromise all favor medical management of a subperiosteal abscess. (Chapter 34, Section “Orbital Complications: Treatment”) PAGE 542","bn":79},{"n":80,"s":"Imaging that the American College of Radiology considers “usually appropriate” for evaluating orbital and intracranial complications of sinusitis includes:","o":["CT or MRI of the head and paranasal sinuses without IV contrast","CT or MRI of the head and paranasal sinuses without and with IV contrast","Ultrasound","PET/CT scan"],"k":"B","x":"MRI and CT with and without contrast are often complementary studies in the setting of acute orbital or intracranial complications of rhinosinusitis. (Chapter 34, Table 34.2) PAGE 540","bn":80},{"n":81,"s":"A patient has complete opacification of the right maxillary sinus, partial opacification of anterior ethmoid sinus, and obstruction of the ostiomeatal complex. This patients Lund- Mackay score is?","o":["4","5","6","7"],"k":"B","x":"The Lund-MacKay CT scoring (for each side) gives 0, 1, or 2 points for no/partial/complete opacification of each of the following sinuses: maxillary, anterior ethmoid, posterior ethmoid, frontal, and sphenoid and 2 points for 0 or 2 points for patency/ obstruction of the OMC. PAGE 541","bn":81},{"n":82,"s":"A 9-year-old patient presents with bilateral thick nasal discharge and congestion. Nasal endoscopy reveals bilateral nasal polyposis. Which of the following is the next best step in management?","o":["Prescribe 3-week course of amoxicillin-clavulanate and prednisone","Order CT sinus","Obtain sweat chloride testing","Start nasal steroid spray"],"k":"C","x":"Nasal polyposis is unusual in the pediatric population and should raise concern for a genetic condition such as CF, which can have significant implications for the patient’s overall health and management. PAGE 555","bn":82},{"n":83,"s":"Dupilumab is a monoclonal antibody approved for use in CRS with nasal polyposis. The target for dupilumab is?","o":["IL-4","IL-4 receptor","IL-5","IL-13"],"k":"B","x":"IL-4, IL-5, and IL-13 are all targets for “biologics” —. monoclonal antibodies designed to treat type 2 inflammation; the inflammatory process common in patients with asthma and CRS with polyps. Dupilumab was the first biologic FDA approved for treatment of CRS with polyps and targets the alpha subunit of the IL-4 receptor. This receptor subunit is also part of the IL-13 receptor, and therefore, dupilumab inhibits both IL-4 and IL-13. PAGE 555","bn":83},{"n":84,"s":"A 49-year-old patient presents 2 years after endoscopic sinus surgery with new-onset facial pain and discolored nasal drainage. The patient has not been on any medical therapy. Nasal endoscopy reveals purulent secretions in the right maxillary sinus. Which of the following is the next best step in management?","o":["Prescribe a 3-week course of augmentin and restart nasal irrigations.","Obtain culture of maxillary sinus and restart nasal irrigations followed by appropriate antibiotics.","Order new CT scan.","Schedule patient for endoscopic mega-antrostomy."],"k":"B","x":"The patient’s symptoms are consistent with acute sinusitis or an acute exacerbation of chronic sinusitis. When possible, antibiotics for recalcitrant infections or acute exacerbations of CRS should be started after cultures have been obtained and be based on sensitivities. The results of antimicrobial susceptibilities and bacterial presence changed the therapy in 40% of patients in retrospective, consecutive series of patients with CRS or acute exacerbations of CRS. Treatment with culture-directed antibiotics is the best choice for management in this scenario. PAGE 553","bn":84},{"n":85,"s":"A 29-year-old patient presents with a 4-month history of sneezing, clear rhinorrhea, bilateral nasal congestion, and bilateral facial pressure. Which of the following would confirm a diagnosis of CRS?","o":["Hyposmia","Headache","Nasal polyps","Cough"],"k":"C","x":"Diagnosis of chronic sinusitis requires 12 weeks of symptoms (congestion and facial pressure in this history) and an objective finding of sinus inflammation—polyps. Other objective criteria include purulence from the middle meatus or sphenoethmoid recess and imaging (most commonly CT) findings of sinus inflammation. PAGE 541","bn":85},{"n":86,"s":"The American Academy of Otolaryngology-Head and Neck Surgery consensus statement states that all of the following are indications for use of image guidance except:","o":["Extensive nasal polyposis","Resection of benign or malignant neoplasms","Revision surgery","Conditions involving a skull base defect","Odontogenic sinusitis"],"k":"E","x":"In 2002, the American Academy of Otolaryngology- Head and Neck Surgery released a consensus statement on the use of image guidance in sinus surgery. The statement has been updated multiple times since its release, but the main indications have remained unchanged. These include the following: • Revision sinus surgery * Distorted sinus anatomy of development, postoperative, or traumatic origin, which includes surgery in the absence of normal landmarks or in the presence of anatomical pitfalls • Extensive sinonasal polyposis * Pathology involving the frontal, posterior ethmoid, or sphenoid sinuses * Disease abutting the cranial base, orbit, optic nerve, or carotid artery • CSF rhinorrhea or conditions where there is a skull base defect • Benign and malignant sinonasal neoplasms Odontogenic sinusitis is not a specific indication for use of image guidance, but some patients with odontogenic sinusitis may meet other criteria for use of image guidance including distorted sinus anatomy and/or pathology involving the frontal sinuses. PAGE 562","bn":86},{"n":87,"s":"What is considered the lateral boundary of the ethmoid air cells?","o":["Middle turbinate","Lamina papyracea","Ethmoid bulla","Lateral lamella","Middle meatus"],"k":"B","x":"The lamina papyracea is a key anatomic boundary when dissecting the ethmoid air cells. It is located lateral to the ethmoid air cells. When dissecting along the lamina, instruments should be selected and handled to avoid inadvertent trauma laterally and avoid injury to the orbit. PAGE 565","bn":87},{"n":88,"s":"If the natural ostium of the sphenoid sinus cannot be easily identified, the safest point of entry through the face of the sphenoid is:","o":["Medial and inferior","Medial and superior","Lateral and inferior","Lateral and superior"],"k":"A","x":"If the natural ostium of the sphenoid sinus cannot be identified, the safest point of entry is through the inferior-medial portion of the face of the sphenoid, away from the skull base and orbit. Once the sphenoid has been entered, the opening is enlarged laterally and superiorly to incorporate the natural ostium. PAGE 567","bn":88},{"n":89,"s":"The anterior and posterior ethmoid sinuses are divided by the:","o":["Uncinate","Basal lamella","Lamina papyracea","Superior turbinate"],"k":"B","x":"The ethmoid air cells are divided into anterior and posterior at the basal lamella of the middle turbinate. PAGE 566","bn":89},{"n":90,"s":"The most common category of complication following balloon sinuplasty is:","o":["Skull base injury","Hemorrhage","Facial paresthesia","Orbital injury","Acute sinusitis"],"k":"D","x":"In a retrospective review of 2,851 patients who underwent balloon sinuplasty from 2011 to 2014, overall complication rates were 5.26%. Of these, orbital complications (eg, fracture, hemorrhage, pain, cellulitis, or erythema around the eye) were most prevalent (2.95%). This was followed by nasal hemorrhage (2.03%) and skull base injury (eg, CSF leak, pneumocephalus; 0.35%). PAGE","bn":90},{"n":91,"s":"A 52-year-old woman presents with a unilateral nasal mass suspicious for inverted papilloma. CT scan reveals complete opacification of the right maxillary sinus with medialization of its posterior fontanelle. Besides endoscopic sinus surgery, what else would you be prepared to perform and add to the surgical consent for this patient?","o":["Lynch incision and biopsy of the medial orbital contents","Sublabial incision and transmaxillary approach","Frontal sinus trephination and endoscopic inspection of the frontal sinus mucosa","Lateral rhinotomy and maxillary transposition"],"k":"B","x":"The sublabial transmaxillary approach is indicated for sinonasal tumors that are not completely accessible using a purely endonasal approach. This includes tumor involvement of the anterior, inferior, and posterolateral walls of the maxillary sinus, which is possible in this case. PAGE 572","bn":91},{"n":92,"s":"During the sublabial approach to the maxillary sinus, the safest entry point to the sinus through its anterior wall is:","o":["Malar eminence","Canine fossa","Alveolar ridge","Next to the piriform opening"],"k":"B","x":"The ideal place to open the maxillary sinus is the canine fossa, which is an area of thin bone just superior to the root of the canine tooth. PAGE 573","bn":92},{"n":93,"s":"A 27-year-old male presents to the emergency department after a motor vehicle accident. The patient has clear drainage from the nose, and CT scan shows a severely comminuted fracture of the posterior table of the frontal sinus. Once the patient is neurologic stable and clear for surgical repair, what would be the most appropriate surgery?","o":["Endoscopic endonasal repair with nasoseptal flap","Combined endoscopic repair with open reduction and internal fixation of the posterior table defect","Obliteration of the frontal sinus","Cranialization of the frontal sinus"],"k":"D","x":"When the posterior table is severely comminuted, cranialization of the sinus is performed with removal of the entire posterior table and all residual mucosa. The anterior table of the frontal sinus is incorporated into the intracranial space. PAGE 577","bn":93},{"n":94,"s":"During an external approach to the ethmoid sinus, what anatomical landmark is used to identify the superior limit of the dissection to avoid opening of the intracranial space?","o":["Supratrochlear artery","Supraorbital artery","Anterior ethmoidal artery","Ophthalmic artery"],"k":"C","x":"The anterior ethmoidal artery sits in the fronto-ethmoidal suture. Once posterior to the frontal sinus, dissection superior to this suture line risks entering the intracranial space. PAGE","bn":94},{"n":95,"s":"A 68-year-old woman presents with severe left-sided nasal obstruction following pituitary surgery 20 years ago. Nasal endoscopy shows a severe deviation of the nasal septum to the left side. What is the most likely cause of her deviated septum?","o":["Insertion of the transsphenoidal speculum through a right submucosal tunnel","Insertion of the transsphenoidal speculum through a left submucosal tunnel","Deep insertion of the transsphenoidal speculum","Failure to dissect an adequate submucosal tunnel for the insertion of the transsphenoidal speculum"],"k":"A","x":"During the transseptal approach to the sphenoid sinus for pituitary surgery, the nasal septum is disarticulated from the maxillary crest inferiorly and dislocated laterally with the placement of a long nasal speculum. This may result in nasal obstruction secondary to a deviated nasal septum. PAGE 579","bn":95},{"n":96,"s":"Which structure forms the inferior/posterior aspect of the nasal septum?","o":["Perpendicular plate of the ethmoid","Quadrangular cartilage","Maxillary crest","Vomer"],"k":"D","x":"The quadrangular cartilage forms the anterior structure of the nasal septum, the maxillary crest forms the inferior aspect, the perpendicular plate of the ethmoid is located posteriorly and superiorly while the vomer is located posterior and inferior. PAGE 583","bn":96},{"n":97,"s":"Spreader grafts sit between which two structures?","o":["Lower lateral cartilage and quadrangular cartilage","Perpendicular plate of the ethmoid and nasal bones","Upper lateral cartilage and quadrangular cartilage","Lower lateral cartilage and maxillary crest"],"k":"C","x":"Spreader grafts sit in a submucosal space between the upper lateral cartilages and the quadrangular cartilage. PAGE 589","bn":97},{"n":98,"s":"Spreader grafts are designed to treat nasal obstruction at what level?","o":["Internal nasal valve","External nasal valve","Inferior nasal airway","Choana"],"k":"A","x":"Spreader grafts widen the internal nasal valve. PAGE","bn":98},{"n":99,"s":"Alar batten grafts are designed to treat nasal obstruction at what level?","o":["Internal nasal valve","External nasal valve","Inferior nasal airway","Choana"],"k":"B","x":"Alar batten grafts support a weakened or absent lateral crus of the lower lateral cartilage, strengthening the external nasal valve. PAGE 589","bn":99},{"n":100,"s":"Compromise of which structure is most commonly associated with empty nose syndrome?","o":["Nasal septum","Inferior turbinate","Middle turbinate","Superior turbinate"],"k":"B","x":"Resection or other aggressive treatment of the inferior turbinate is most commonly associated with empty nose syndrome. PAGE 587","bn":100},{"n":101,"s":"The trochlea attaches to which bone in the orbit?","o":["Lacrimal","Lamina papyracea (ethmoid)","Frontal","Maxilla"],"k":"C","x":"The trochlea, the fibrous pulley upon which the superior oblique muscle acts, attaches to the frontal bone just posterior to the superomedial orbital rim. PAGE 591","bn":101},{"n":102,"s":"Which extraocular muscle does not insert on the annulus of Zinn?","o":["Superior rectus","Superior oblique","Medial rectus","Inferior rectus","Inferior oblique","Lateral rectus"],"k":"E","x":"The annulus of Zinn is the site of origin for the four rectus muscles (superior, inferior, lateral, and medial) as well as the superior oblique muscle. These muscles, along with the inferior oblique muscle that originates from the anteromedial orbital wall, insert onto globe. PAGE 592","bn":102},{"n":103,"s":"Which of the following is incorrect regarding epiphora?","o":["The most common cause in children is an imperforate valve of Hasner.","The most common cause in young adults is idiopathic stenosis of the distal nasolacrimal duct.","The most common cause in middle-aged adults is dacryoliths.","The most common cause in the older adults is idiopathic stenosis of the distal nasolacrimal duct."],"k":"B","x":"The etiology of lacrimal apparatus obstruction can often be determined by a patient’s age: children typically have a congenital imperforate valve of Hasner. Epiphora in young adults is usually posttraumatic or a sequelae of dacryocystitis. Epiphora in middle-aged is usually caused by dacryoliths, stones that form in the lacrimal sac, while the older adults usually develop idiopathic stenosis of the distal nasolacrimal duct. In adults, obstruction is generally more common in females than in males. PAGE 594-595","bn":103},{"n":104,"s":"During nasolacrimal probing and irrigation, a 3-mL saline-filled syringe on a 26G lacrimal cannula is inserted into the upper lacrimal punctum and flushed. Saline is noted to be coming out of the inferior punctum. Where is the site of obstruction?","o":["Superior canaliculus","Inferior canaliculus","Common canaliculus","Distal nasolacrimal duct"],"k":"C","x":"During nasolacrimal probing and irrigation, easy passage of saline suggests patency of the nasolacrimal duct, while reflux of saline back through the same punctum suggests obstruction or stenosis of that canaliculus. Reflux of saline back through the punctum opposite to the one being irrigated suggests an obstruction of the common canaliculus or the lacrimal sac, while reflux of mucoid material suggests an obstruction of the inferior nasolacrimal duct. PAGE 595","bn":104},{"n":105,"s":"Which of the following techniques in endoscopic medial orbital wall decompression does not help reduce the rate of postoperative diplopia?","o":["Performing a concurrent lateral orbital wall decompression to “balance” the medial orbital decompression","Preservation of the inferomedial orbital strut","Preservation of a periorbital sling over the medial rectus","Preservation of the middle turbinate"],"k":"D","x":"A “balanced” decompression, where a concurrent lateral orbital wall decompression is performed, reduces the rate of postoperative diplopia as it preserves the natural vectors of the globe. Retention of the inferomedial strut (between the medial and inferior orbital walls) and preservation of a strip of periorbita over the medial rectus helps keep the globe in a more physiologic position thus decreasing the rate of diplopia. The preservation of the middle turbinate has not been shown to affect rates of diplopia. PAGE 598","bn":105},{"n":106,"s":"An absolute contraindication to a purely endoscopic endonasal approach for resection of a ventral skull base tumor is:","o":["Involvement of the lateral recess of the sphenoid sinus","Involvement of the cavernous sinus","Significant lateral dural involvement","Suprasellar intracranial extension"],"k":"C","x":"An absolute contraindication of a purely endoscopic endonasal approach is significant lateral dural involvement as negative margins cannot be achieved in the most lateral regions. Involvement of the lateral sphenoid recess is not a contraindication for endoscopic endonasal resection of a skull base tumor, since this can easily be accessed through a transpterygoid approach. Involvement of the cavernous sinus represents a relative but not an absolute contraindication for a purely endoscopic endonasal approach as both the medial and lateral cavernous sinus can be approached endoscopically. Tumors with suprasellar intracranial extension can also be removed using an endoscopic endonasal approach. Large or significant intracranial extension is a relative contraindication to a purely endoscopic endonasal approach for resection of a ventral skull base tumor. PAGE 608","bn":106},{"n":107,"s":"Which of the following is most important in preventing postoperative cerebrospinal fluid (CSF) leak following resection of a ventral skull base tumor?","o":["Lumbar drain placement","Avoidance of Valsalva maneuvers","Postoperative bed rest","Watertight dural reconstruction"],"k":"D","x":"Following resection of the ventral skull base, the primary goal of reconstruction is to minimize the risk of CSF leak and meningitis by creating a watertight closure of the dura. Meticulous reconstruction of the skull base defect in a watertight fashion is critical for preventing postoperative CSF leak. PAGE 613","bn":107},{"n":108,"s":"The pedicled nasoseptal flap is commonly used in reconstruction of ventral skull base defects given its versatility and durability. What is the vascular supply of this flap?","o":["Posterior septal artery","Greater palatine artery","Anterior ethmoidal artery","Posterior ethmoidal artery"],"k":"A","x":"The vascular supply of the pedicled nasoseptal flap is the posterior septal branch of the SPA. PAGE 614","bn":108},{"n":109,"s":"Which of the following is the most appropriate prophylactic antibiotic for endoscopic endonasal ventral skull base surgery?","o":["Ampicillin-sulbactam","Trimethoprim-sulfamethoxazole","Clarithromycin","Ceftazidime"],"k":"D","x":"Prophylactic intravenous antibiotics, which can cross the blood-brain barrier, such as third-generation cephalosporins are administered during ventral skull base surgery. PAGE 612","bn":109},{"n":110,"s":"The advantages of the endoscopic endonasal approach to the ventral skull base compared to the open transcranial or transfacial approach include which of the following?","o":["Improved visualization of key anatomic structures","Ability to perform en bloc tumor resection with oncologic margins","Lower risk of postoperative CSF leak","Ease of addressing tumors with significant intracranial extension"],"k":"A","x":"The endoscopic endonasal approach to the ventral skull base provides improved visualization of key anatomic structures during surgical resection. The ability to perform en bloc resection is not an advantage of the endoscopic endonasal approach to the ventral skull base since most tumor resections are typically performed in a piecemeal fashion. The risk of a postoperative CSF leak has been reported to be greater with the endoscopic endonasal approaches to the skull base. Nonetheless, with the advent of the posteriorly-based nasoseptal flap, the high risk of postoperative CSF leak after endoscopic skull base repair has improved significantly. The transcranial approach remains the preferred approach in cases with extensive intracranial tumor extension. PAGE 607","bn":110},{"n":111,"s":"Which of the following diagnostic assays has demonstrated high reliability for detection of CSF rhinorrhea?","o":["Double-ring sign","Glucose test","B2-Transferrin test","Bilateral venous compression test"],"k":"C","x":"B2-Transferrin represents a highly reliable primary screening modality for CSF leak detection, with sensitivity ranging from 87% to 100% and specificity from 97% to 100%. Minimal volume of 0.5 mL is required and testing is only performed in select laboratory facilities in the United States, resulting in a delay of a few days to confirm diagnosis. Double-ring sign and glucose analysis have been found to be highly unreliable in detection of CSF rhinorrhea. PAGE 624","bn":111},{"n":112,"s":"Which of the following is the most common site for development of spontaneous CSF rhinorrhea?","o":["Cribriform plate","Ethmoid roof","Lateral recess of sphenoid","Posterior table of frontal"],"k":"A","x":"The most common location of spontaneous CSF leaks is the cribriform plate region (49%), followed by lateral recess of the sphenoid (20%), and ethmoid roof (15%). The posterior table of the frontal sinus represents an uncommon location for spontaneous CSF leaks. PAGE 622","bn":112},{"n":113,"s":"Which of the following best characterizes iatrogenic CSF leaks after endoscopic sinus surgery?","o":["Incidence ranges between 2% and 3%.","Sphenoid roof is the most common site of injury.","Most commonly occur on the left side.","Low-lying skull base is a potential risk factor."],"k":"D","x":"Risk of iatrogenic CSF leak has decreased significantly and is below 1% in larger series. Lateral lamella of the cribriform plate and posterior ethmoid roof are the most common sites of injury, and more leaks occur on the right side. Asymmetric and low-lying skull base have been recognized as potential risk factors for iatrogenic leaks. Leaks also more commonly result in hands of residents and novice attending surgeons. PAGE 621","bn":113},{"n":114,"s":"Which of the following MRI findings is most commonly observed in patients with spontaneous CSF rhinorrhea?","o":["Empty sella","Arachnoid granulations","Meckel cave diverticula","Optic nerve sheath dilation"],"k":"A","x":"Various MRI findings are associated with spontaneous CSF leaks. None of them are pathognomonic but can be supportive to the diagnosis of underlying benign intracranial hypertension. Partially or completely empty sella is the most common finding and is noted in 82% to 92% of cases. Additional MRI findings seen with less frequency include Meckel cave diverticula, prominent arachnoid granulations, optic nerve sheath dilation, and tortuous/ elongated optic nerve. PAGE 624","bn":114},{"n":115,"s":"A 60-year-old female develops profuse clear rhinorrhea, headaches, and pneumocephalus 3 days after undergoing pituitary adenoma resection. Which of the following is the most appropriate management of this patient?","o":["Bed rest, stool softeners, and lumbar drain","Emergent craniotomy with decompression","Endoscopic repair with nasoseptal flap","Transseptal repair with abdominal fat graft"],"k":"C","x":"Rhinorrhea and pneumocephalus is highly suggestive of development of CSF leak due to communication between the sella and sphenoid region. The nasoseptal flap represents a significant advance in reconstruction for skull base surgery. It provides robust vascularized tissue, facilitating faster healing and tissue integration and decreasing risk of postoperative leak. Endoscopic repair, preferably with a nasoseptal flap, represents the best option for repair in this scenario. Transseptal approaches have larger been replaced by the endoscopic techniques and do not afford optimal visualization for repair. PAGE 628","bn":115},{"n":116,"s":"Which structure forms the lateral aspect of the frontal recess?","o":["Uncinate process","Middle turbinate","Medial orbital wall","Frontal beak"],"k":"C","x":"The frontal ostium is bounded by the lamina papyracea laterally, the middle turbinate medially, the skull base posteriorly, and the frontal beak anteriorly. PAGE 633","bn":116},{"n":117,"s":"Which of the following cell types sits in closest proximity to the anterior ethmoid artery?","o":["Agger nasi cell","Supra agger cell","Supra agger frontal cell","Supra bulla cell"],"k":"D","x":"The supra bulla cell is above the bulla ethmoidalis, extending to the skull base adjacent to the anterior ethmoid artery. The agger system of cells sits anterior to the frontal recess and anterior ethmoid artery. PAGE 634","bn":117},{"n":118,"s":"Which cell type pushes the frontal drainage pathway in a lateral direction?","o":["Supraorbital ethmoid cell","Supra agger frontal cell","Frontal septal cell","Supra bulla cell"],"k":"C","x":"The frontal septal cell sits medially and pushes the frontal drainage pathway in a lateral direction. The supra bulla cell and supraorbital ethmoid cells sit posteriorly and push the frontal drainage pathway anteriorly. The supra agger frontal cell sits anteriorly and pushes the frontal drainage pathway posteriorly. PAGE 634","bn":118},{"n":119,"s":"What structure identifies the posterior midline dissection limit (the “T”’) for a frontal drill-out procedure?","o":["The first olfactory neuron","The cribriform plate","The posterior wall of the frontal sinus","The medial aspect of the anterior ethmoid artery"],"k":"A","x":"The first olfactory neuron is used to identify the posterior limit of bone removal in the midline during a frontal drill out procedure. PAGE 642","bn":119},{"n":120,"s":"Which of following increases complexity of frontal sinus surgery?","o":["Medial attachment of the uncinate process","Presence of a concha bullosa","Presence of a supra agger frontal cell","Wide (>10 mm) anterio-posterior diameter of the frontal recess"],"k":"C","x":"Cells (such as the supra agger frontal cell) that extend into the space of the frontal sinus and a narrow anterio-posterior diameter of the frontal recess result in more complicated frontal sinus dissection. PAGE 638","bn":120}]},{"t":"Comprehensive Otolaryngology","q":[{"n":1,"s":"During parotidectomy, the main trunk of the facial nerve can be identified by which anatomic markers?","o":["1 cm medial and inferior to the tragal pointer","Superior and deep to the anterior belly of the digastric","1 cm anterior to the tragus","Superior to the tympanomastoid suture line"],"k":"A","x":"The tragal pointer is a projection of conchal cartilage that points toward the main trunk of the facial nerve. The facial nerve lies less than 1 cm medial and inferior to the tragal pointer. PAGE 650","bn":1},{"n":2,"s":"During submandibular gland excision, the Hayes-Martin maneuver is used to protect what structure?","o":["The facial artery","The lingual nerve","The hypoglossal nerve","The marginal mandibular nerve"],"k":"D","x":"The Hayes-Martin maneuver is often used during submandibular gland excision to protect the marginal mandibular nerve by ligating the anterior facial vein 2 to 3 cm inferior to the mandible and elevating the vein superiorly off the gland thus protecting the marginal mandibular nerve in the elevated fascia. PAGE 652","bn":2},{"n":3,"s":"Three months after superficial parotidectomy, a patient returns to clinic complaining of sweating while eating meals, what complication has occurred?","o":["A branch of the facial nerve was transected during flap elevation","Aberrant reinnervation of sweat glands by postganglionic parasympathetics exposed during surgery","Aberrant reinnervation of muscles of mastication by preganglionic parasympathetics","Injury to sweat glands during flap elevation in an incorrect plane"],"k":"B","x":"A common complication after parotidectomy is gustatory sweating (Frey syndrome). In the normal patient, the auriculotemporal branch of the trigeminal nerve carries sympathetic fibers to the sweat glands of the scalp and parasympathetics to the parotid gland. Frey syndrome occurs from aberrant reinnervation of the cholinergic sympathetic sweat glands with postganglionic parasympathetic fibers that have been exposed following parotidectomy. While the phenomenon of Frey syndrome is common (up to 80%) based on potassium iodide testing of postoperative patients, the degree that patients are actually symptomatic is quite variable. PAGE 654","bn":3},{"n":4,"s":"Describe the relationship of the facial nerve to the parotid gland.","o":["The nerve runs superficial to the parotid.","The nerve runs within the parotid capsule.","The nerve divides the parotid into superficial and deep lobes.","The nerve divides the parotid into superior and inferior lobes."],"k":"C","x":"The facial nerve divides the parotid gland into superficial and deep lobes and terminates into five branches. PAGES 648-649","bn":4},{"n":5,"s":"A 50-year-old woman undergoes parotidectomy for a Warthin tumor. Postoperatively she complains of numbness of the ear and cheek. Which nerve was likely transected as part of the procedure?","o":["The auriculotemporal nerve","The buccal branch of the facial nerve","The greater auricular nerve","The frontal branch of the facial nerve"],"k":"C","x":"The great auricular nerve (C2, C3), a branch of the cervical plexus that passes around the posterior border of the sternocleidomastoid muscle, ascends diagonally across the sternocleidomastoid muscle toward the parotid gland. It supplies sensation to the skin over the parotid gland, the posterior aspect of the auricle, and an area of skin from the angle of the mandible to the mastoid process. This nerve is often damaged or intentionally sacrificed during parotidectomy causing numbness over the earlobe and skin over the parotid gland. Meticulous intraglandular dissection of the nerve can allow the nerve to be preserved if the location of the tumor permits such a dissection. PAGES 650-651","bn":5},{"n":6,"s":"An 87-year-old man with dementia is hospitalized for a urinary tract infection. During his hospitalization, he develops acute and painful swelling and erythema over his right cheek. What is the likely diagnosis and etiology?","o":["Lymphoma; immunosuppression","Parotitis; dehydration","Warthin tumor; smoking","Hives; drug allergy"],"k":"B","x":"The classical presentation of acute suppurative sialadenitis is the sudden onset of diffuse enlargement of the involved gland with associated induration and tenderness. Salivary stasis, reduced flow, and obstruction can be precipitating events for acute sialadenitis. Dehydration can also lead to sialadenitis. Debilitated individuals who rely on caregivers for hydration and oral hygiene are also at risk for acute suppurative sialadenitis. PAGES 658-659","bn":6},{"n":7,"s":"A 30-year-old woman presents to your office with complaints of recurrent submandibular swelling and tenderness that is worsened by eating. What is the best initial test to determine if she has a sialolith?","o":["Magnetic resonance imaging (MRI)","Sialendoscopy","Ultrasound","Plain films"],"k":"C","x":"Ultrasonography is an excellent tool for imaging of salivary stones. It is useful both for diagnosis and for guidance intraoperatively. It is relatively inexpensive, repeatable, dynamic, versatile as it can be used to guide surgery and accurate in trained hands; it also provides real-time images. MRI is not an optimal tool to detect calculi. However, MRI sialography is a new modification of MRI that allows delineation of the ductal system and consequently stones with high definition. Despite their similar chemical makeup, 90% of parotid calculi are radiolucent with standard facial radiographs. PAGE 664","bn":7},{"n":8,"s":"A patient with recurrent submandibular sialadenitis not responsive to conservative management is suspected to have an 8.0-mm ductal stone. Which of the following would be the appropriate next step in treatment?","o":["Sialendoscopy","Steroid taper with gland massage","Submandibular gland excision","Salivary Botox"],"k":"A","x":"One of the major impacts sialendoscopy has made is in the management of salivary stones. Marchal has provided an algorithm for the management of salivary stones. Stones less than 4 mm for the submandibular gland and 3 mm for the parotid gland can often be managed with complete endoscopic removal. For larger stones up to 5 or 6 mm, laser lithotripsy and endoscopic stone removal can be performed. For larger stones, hybrid techniques that involve a transoral incision or an external approach with the use of sialendoscopy to guide dissection site permit stone removal with gland preservation. PAGE","bn":8},{"n":9,"s":"A 7-year-old woman was referred to an otolaryngologist for recurrent parotid swelling for the last year. How should her parents be counseled?","o":["This will lead to chronic sialadenitis, and parotidectomy is recommended.","This increases her risk of salivary malignancy, and parotidectomy is recommended.","This is a benign process that will likely resolve, and observation is recommended.","This is a benign process that will persist throughout life, and parotidectomy can be offered."],"k":"C","x":"The clinical presentation of juvenile recurrent parotitis involves recurrent, nonobstructive, nonsuppurative swelling of either one or both of the parotid glands. The condition usually affects children from infancy to age 12 years. Most children will stop having further episodes after puberty, so parotidectomy is not recommended given the self-limited nature of this disease. PAGE 663","bn":9},{"n":10,"s":"A 21-year-old man suffers a knife wound to the right cheek and is noted to have saliva draining from the wound. His parotid duct has been transected. How should his wound be managed?","o":["Wound washout and observation","Botox to the parotid gland and observation","Wound exploration with ligation of the transected duct","Wound exploration with ductal repair over a stent"],"k":"D","x":"Any penetrating injury posterior to the anterior border of the masseter muscle should be suspected of causing a ductal injury. Inspection of the wound directly often allows adequate assessment of the duct. If the duct cannot be identified, a probe may be passed transorally and located in the wound. This should confirm the status of the duct. If the duct has been transected, optimal treatment is end-to-end anastomosis over a polyurethane catheter or salivary duct stent with 6-0 or finer sutures. The catheter is then sutured in place to the buccal mucosa, to be removed in 2 weeks. PAGE 667","bn":10},{"n":11,"s":"Which nerve provides taste sensation for the anterior third of the tongue?","o":["Hypoglossal nerve","Chorda tympani","Glossopharyngeal nerve","Lingual nerve"],"k":"B","x":"Over the anterior tongue, the chorda tympani (a branch of the facial nerve) is sensory for taste, and the lingual nerve, a branch of the trigeminal nerve, serves general sensation. The chorda tympani “hitchhikes” along the lingual nerve; travels through the middle ear; joins the facial nerve in the fallopian canal, then to the geniculate ganglion; and terminates in the upper portion of the nucleus solitarius. PAGE 674","bn":11},{"n":12,"s":"Which type of tongue papillae is nongustatory?","o":["Circumvallate","Filiform","Fungiform","Foliate"],"k":"B","x":"Filiform papillae are mechanical and nongustatory. Fungiform, foliate, and circumvallate papillae are gustatory. Foliate papillae are predominantly sensitive to sour tastes and are innervated by the glossopharyngeal (9th cranial) nerve. Circumvallate papillae confer a sour/bitter sensitivity to the posterior one-third of the tongue, and they are innervated by the glossopharyngeal (9th cranial) nerve. Fungiform papillae are most densely distributed on the tip and sides of the tongue. They are innervated by the chorda tympani branch of the facial (7th cranial) nerve and appear as red spots on the tongue because they are richly supplied with blood vessels. PAGE 673","bn":12},{"n":13,"s":"Which taste receptor involves an ion channel?","o":["Sweet","Bitter","Umami","Salty"],"k":"D","x":"Taste receptors trigger transduction cascades, which then activate synapses and cause the excitation of nerve fibers. A signal is produced that is then carried to the brain relaying information on the identity and intensity of the gustatory stimulus. Receptor proteins are located on the apical surface of cells, and from there, the stimulus enters the cell either via an ion channel as it does for the salty and sour tastes or via second messenger systems like cyclic adenosine monophosphate for bitter and sweet. Umami receptors act much the same way as bitter and sweet receptors (they involve G-protein coupled receptor) but not much is known about their specific function. PAGE","bn":13},{"n":14,"s":"When performing taste testing, which substance is commonly used to test bitter taste sensation?","o":["Sucrose","Caffeine","Citric acid","Sodium chloride"],"k":"B","x":"The most common stimulants used during taste testing are sodium chloride for salty, sucrose for sweet, citric acid for sour, and quinine sulfate or caffeine for bitter. PAGE 676","bn":14},{"n":15,"s":"What is the most common site for oral lichen planus?","o":["Gingiva","Dorsal tongue","Labial mucosa","Buccal mucosa"],"k":"D","x":"Oral lichen planus most commonly affects the buccal mucosa (90%) but may also affect the dorsum of the tongue, gingival, labial mucosa, and lower vermillion lip. Typically, lesions are multiple, bilateral, and symmetric. They may develop in sites of trauma in what is described as Koebner phenomenon. PAGE 694","bn":15},{"n":16,"s":"A 70-year-old women presents to Otolaryngology-Head and Neck Surgery clinic with a month of bothersome blisters in her mouth. On examination, you note bullae and areas of mucosal erosion on the buccal mucosa, palate, alveolar ridge, and lower lip. What is the next best step?","o":["Direct immunofluorescence.","Check iron levels.","Check antinuclear antibodies.","Computed tomography (CT) of the head and neck."],"k":"A","x":"Vesiculobullous lesions should have perilesional tissue sent for direct immunofluorescence for deposition of IgG, IgA, and/or complement. This patient has symptoms concerning for mucous membrane or bullous pemphigoid. PAGES 687-690","bn":16},{"n":17,"s":"A 25-year-old man presents to the emergency department with severe diabetic ketoacidosis. He is admitted to the medicine service, and the team notices a palate lesion. On examination, you notice an area of necrosis on the palate. What is the next best step?","o":["Bacterial culture of the lesion","Biopsy","Positron emission topography (PET)/CT scan","Human immunodeficiency virus test"],"k":"B","x":"Mucormycosis is a life-threatening invasive fungal infection that occurs predominantly in patients with diabetes that are prone to ketoacidosis. It may also be present in neutropenic and posttransplant patients or in association with malignancy (leukemia). Palatal ulceration and necrosis are classic for the rhinocerebral presentation. Vascular invasion by hyphae with thrombosis and infarction of tissue is seen on biopsy specimens. A mortality rate of greater than 40% exists. Treatment requires the removal of the underlying risk factor, aggressive surgical intervention, and systemic antifungal therapy. PAGE 685","bn":17},{"n":18,"s":"Which of the following human leukocyte antigen (HLA) subtypes is associated with increased risk of Behcet disease?","o":["HLA-BS1","HLA-B27","HLA-DQ2","HLA-DR4"],"k":"A","x":"Behget disease is a disorder characterized by a classic triad of recurrent aphthous ulceration, uveitis, and genital ulcers. It is most common in the Mediterranean region and in nations along the ancient “Silk Road” (Turkey, Iran, Korea, and Japan). HLA subtype B51 is associated with susceptibility to the disease, and a link to streptococcal infection has been postulated, although the etiology of this disease remains unknown. PAGE 691","bn":18},{"n":19,"s":"Which of the following is true about Group A beta-hemolytic Streptococcus (GABHS) pharyngitis?","o":["It is the most common cause of pharyngitis in children.","It is the most common cause of pharyngitis in children requiring antibiotic treatment.","A negative rapid antigen detection test is sufficient in children to rule out GABHS pharyngitis.","A negative rapid antigen detection test warrants a “back up culture” via pharyngeal throat swab in adults.","Bacterial pharyngitis is the most common cause of pharyngitis in children, but viral pharyngitis is the most common cause in adults."],"k":"B","x":"GABHS aka Streptococcus pyogenes is the only common pathogen in streptococcal pharyngitis that necessitates the use of antibiotics. Viral infection is the most common cause of pharyngitis in adults and children, and it is typically self-limiting. A throat culture is recommended after a negative rapid antigen test for children but not for adults. PAGES 701-704","bn":19},{"n":20,"s":"Which of the following is incorrect about the treatment of pharyngitis?","o":["Penicillin and amoxicillin are the first-line antibiotic treatment for GABHS pharyngitis.","A single dose of corticosteroids has been shown to help with symptom relief in infectious mononucleosis.","A single dose of corticosteroids has been deemed safe in children with severe GABHS pharyngitis.","Clindamycin should be avoided in patients with infectious mononucleosis due to the development of a pruritic, maculopapular rash.","Tonsillectomy may be a useful treatment modality for patients with periodic fever, aphthous stomatitis, pharyngitis, and adenitis syndrome due to a decrease in the frequency of episodes."],"k":"D","x":"The administration of amoxicillin will produce pruritic, maculopapular rash in most patients with acute infectious mononucleosis. PAGE 706","bn":20},{"n":21,"s":"Which of the following is not associated with GABHS infection?","o":["Rheumatic fever","Scarlet fever","Peritonsillar abscess","Retropharyngeal abscess","Kawasaki disease (KD)"],"k":"E","x":"KD, also known as acute mucocutaneous lymph node syndrome, is a systemic vasculitis of unknown etiology, which occurs in children less than 10 years of age. The classic symptoms of KD are high fever, adenopathy, mucositis (strawberry tongue), cheilitis (dry, cracked lips), conjunctivitis, erythematous rash, and erythema and desquamation of the palms and soles. Because of the initial high fevers and mucositis, patients may present for treatment of presumed pharyngitis. However, a high index of suspicion must be had for this syndrome, with examination of the eyes, trunk, and extremities as necessary, to avoid the long-term complications of coronary artery aneurysms and sudden death. PAGE 705","bn":21},{"n":22,"s":"Which of the following causes of pharyngitis is typically associated with pseudomembrane formation?","o":["Coxsackie virus","Group A beta-hemolytic Streptococcus","Corynebacterium","Pediatric Autoimmune Neuropsychiatric Disorders Associated with Streptococcal infections (PANDAS)","Periodic fever, aphthous stomatitis, pharyngitis, and adenitis syndrome"],"k":"C","x":"In addition to the typical symptoms of sore throat and malaise, Corynebacterium diphtheria is characteristically associated with a gray pharyngeal/tonsillar pseudomembrane, which is produced by the local tissue response and necrosis from the bacterial exotoxin (present in approximately one-third of patients). This can extend to cover the oropharynx and larynx and cause rapid death by asphyxiation, particularly in the young child. PAGE 704","bn":22},{"n":23,"s":"Which of the following is not an inflammatory or autoimmune cause of pharyngitis?","o":["Eosinophilic esophagitis","Reflux pharyngitis","PANDAS","Pyostomatitis vegetans","Lichen planus"],"k":"C","x":"The cause of the pharyngitis in PANDAS is streptococcal. After streptococcal infection, including pharyngitis, these patients rapidly develop neuropsychiatric symptoms of obsessive-compulsive disorder and tic disorders. The obsessive-compulsive disorder and tics will last for several weeks before remitting and then abruptly return after the next streptococcal infection. In general, neuropsychiatric symptoms are from minimal to absent between episodes.
