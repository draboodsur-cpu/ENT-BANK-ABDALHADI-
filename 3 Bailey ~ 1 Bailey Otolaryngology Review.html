ic ears. PAGE 1885, Table 119.5","bn":178},{"n":179,"s":"Which combination of elements would satisfy all three requirements to start an airway fire?","o":["Oxygen, sponges, and electrocautery","Nitrous oxide, oxygen, and lasers","Electrocautery, ETT, and sponges","Laser, electrocautery, and oxygen"],"k":"A","x":"Three elements are necessary to cause an airway fire: an oxidizer (oxygen, nitrous oxide), fuel (sponges, ETT), and an ignition source (laser, electrocautery). PAGE 1880","bn":179},{"n":180,"s":"The most common facial fractures in children are:","o":["Mandible fractures","Orbital fractures","Frontal bone fractures","Zygomatic fractures","Nasal bone fractures"],"k":"E","x":"Nasal bone fractures account for up to 50% of all pediatric facial fractures. Twenty percent of pediatric facial fractures involve the orbit. Mandible fractures are the most common fractures in children hospitalized with trauma. Frontal bone fractures are more common in young children with a greater cranium:face ratio and are often associated with intracranial injuries. Nasal and maxillary fractures are the most common facial fractures in infants up to | year old. PAGE 1894","bn":180},{"n":181,"s":"The cranium:face ratio changes during childhood, from during infancy to at maturation.","o":["4:1, 2:1","6:1, 3:1","8:1, 2:1","7:1, 2:1","9:1, 3:1"],"k":"C","x":"The cranium undergoes rapid growth in early infancy. Growth tapers starting at age 3, and by age 7, the cranium is 90% of its adult size. From infancy, the frontal bone increasingly protrudes, with midface structures receding. Over this time, cranium-to-face proportions will shift from 8:1 to 2:1 once maturation is complete. PAGE 1895","bn":181},{"n":182,"s":"Which of the following injuries does not necessitate maxillomandibular fixation (MMF)?","o":["Comminuted unilateral ramus fracture in a 9-year-old boy","Displaced unilateral subcondylar fracture in a 9-month-old","Bilateral nondisplaced parasymphyseal fractures in a 6-year-old boy with malocclusion","Unilateral intracapsular condylar fracture in a 3-year-old girl"],"k":"D","x":"Unilateral intracapsular condylar fractures can be managed with observation, soft diet, and motion rehabilitation. A comminuted ramus fracture would likely entail open or cross bite. A displaced subcondylar fracture would likely impair motion and could lead to ankylosis. Bilateral fractures are more than twice as complicated as unilateral and would likely lead to open bite or cross-bite, with higher likelihood of malocclusion. All other fractures listed would require MMF. PAGE 1898","bn":182},{"n":183,"s":"Which of the following patients is not at increased risk for temporomandibular joint ankylosis?","o":["A 19-month-old girl with an intracapsular mandible fracture","A 4-year-old boy in MMF for 2 weeks","A 6-year-old girl with a unilateral nondisplaced subcondylar fracture","A 12-year-old boy in MMF for 4 weeks"],"k":"C","x":"Intracapsular condylar fractures increase the risk for growth disturbances and ankylosis. The risk for temporomandibular joint ankylosis is also increased in children aged 2 to 5 years old with mandible fractures, those with delayed treatment, those with bilateral fractures, and those with MMF longer than 2 to 3 weeks. PAGE 1898","bn":183},{"n":184,"s":"Which of the following statements regarding nasal trauma in children is not true?","o":["Reassessment of nasal bone fractures 3 to 5 days after injury is recommended.","Severe OSA with nasal obstruction is an indication for rhinoplasty in children.","The optimal timing for reduction of nasal bone fractures in children is within 7 to 10 days of injury.","Nasal growth is complete at age 16 in girls and age 18 in boys."],"k":"C","x":"Children undergo more rapid osteogenesis compared with adults. Thus, the 7-to 10-day treatment window for reduction of adult nasal bone fractures is shortened to 3 to 5 days in children. All other statements are true. PAGE 1898","bn":184},{"n":185,"s":"Which of the following is not true about nasal septal abscess in children?","o":["They are more common in children than adults.","Most occur because of traumatic nasal septal hematomas.","Are considered an otolaryngology emergency.","Staphylococcus aureus is the most commonly related organism.","The lower lateral cartilage is often involved."],"k":"E","x":"Septal abscesses are more common in children due to the loose adherence of mucoperichondrium and 85% of the time related to septal hematomas. S. aureus is the most common organism isolated but rarely do they ever involve the nasal tip or supporting cartilages. Septal abscesses need emergent drainage and can potentially be life threatening secondary to the drainage pathway of the veins from the septum into the cavernous sinus. PAGES 1909-1910","bn":185},{"n":186,"s":"The Chandler classification describes:","o":["The scale of intracranial complications from pediatric acute sinusitis","How to measure the CT appearance of acute sinusitis","Five progressive categories of orbital complications of acute sinusitis","The virulence of bacteria associated with acute sinusitis"],"k":"C","x":"The Chandler classification or orbital complications of acute sinusitis include preseptal cellulitis, subperiosteal abscess, orbital cellulitis, orbital abscess, and cavernous sinus thrombosis. PAGE 1911","bn":186},{"n":187,"s":"What is not true about the retropharyngeal space?","o":["It includes the nodes of Rouviere.","It extends from the skull base to the level of the diaphragm.","Abscesses within this space appear off midline.","Infections in this space can rapidly progress to mediastinitis."],"k":"B","x":"The danger space extends from the skull base to the diaphragm. The retropharyngeal space ends at the tracheal bifurcation within the superior mediastinum. PAGE 1913","bn":187},{"n":188,"s":"Laryngotracheitis:","o":["Is caused by bacterial suprainfection","Narrows the airway at the vocal folds","Can be caused by RSV, adenovirus, influenza, and rhinovirus","Affects children less than 6 months of age"],"k":"C","x":"Croup is predominately a viral illness causing stridor due to subglottic inflammation and stenosis. It impacts mostly children 6 months to 3 years of age. PAGE 1919","bn":188},{"n":189,"s":"The most common organisms in deep neck infections are:","o":["S. aureus and group A Streptococcus","Group B Streptococcus and Peptostreptococcus","Escherichia coli and Mycobacterium","H. influenzae and M. catarrhalis"],"k":"A","x":"S. aureus and group A Streptococcus are the most common bacterial isolates from deep neck space infections. PAGE","bn":189},{"n":190,"s":"The otolaryngology service is consulted for a 3-day infant who has been found to have a small jaw and wide cleft palate. The patient presents with stable oxygenation on room air, stertorous breath sounds, and mild subcostal retractions when supine. Initial supportive management of this patient should include:","o":["Prone positioning and placement of a nasal airway or tongue stitch","Orotracheal intubation with a plan for tracheostomy","Mandibular distraction osteogenesis","Tongue lip adhesion"],"k":"A","x":"Prone positioning, placement of a nasal airway or nasal feeding tube, and/or placement of a tongue stitch are all simple, noninvasive interventions to implement for a neonate with PRS. All the other options are surgical in nature and, while they may prove necessary depending on the clinical course, would not be the first-line options in management. PAGE 1928","bn":190},{"n":191,"s":"A 5-year-old female presents to the multidisciplinary craniofacial clinic with downward slanting palpebral fissures, underdeveloped zygomas, and bilateral complete aural atresia with grade 3 microtia. This patient most likely has:","o":["Crouzon syndrome","Hemifacial microsomia","Treacher Collins syndrome","PRS"],"k":"C","x":"This is a classic description of the craniofacial differences noted in Treacher Collins syndrome. Hemifacial microsomia has some of these features but would be unilateral. Crouzon is a syndromic cause of craniosynostosis and thus has deformities related to the cranium. PRS would have deformity of the mandible as the primary feature and is not classically associated with aural atresia. PAGE 1926","bn":191},{"n":192,"s":"On dental examination, the mesiobuccal groove of the first mandibular molar is found to be posterior to the mesiobuccal groove of the first maxillary molar. The Angle classification of occlusion for this patient is:","o":["Class I","Class II","Class TIT","Neutro-occlusion"],"k":"B","x":"This is the description of a retrognathic profile, which is Angle classification II. PAGE 1926","bn":192},{"n":193,"s":"A neonatal patient with a cranial deformity undergoes a CT study of the skull. Three-dimensional reconstructions demonstrate distortion of the skull bones with normal open sutures. This patient has:","o":["Trigonocephaly","Positional plagiocephaly","Scaphocephaly","Brachycephaly"],"k":"B","x":"Craniosynostosis has abnormal fusion of the skull bones. In this instance, there was no abnormal fusion of the bones, which means the abnormal shape is positional plagiocephaly. PAGE","bn":193},{"n":194,"s":"Dependent on the severity of the deformity, correction of maxillary hypoplasia may be accomplished by:","o":["Orthodontic correction","LeFort I advancement","Maxillary distraction osteogenesis","All of the above"],"k":"D","x":"Maxillary hypoplasia can be corrected in multiple ways. Even some severe cases can be corrected with early orthodontic interventions. LeFort advancements and maxillary distraction can be used in more severe cases for correction of the hypoplasia. PAGE 1935","bn":194},{"n":195,"s":"What diagnostic test can detect acid and nonacid reflux?","o":["pH probe","Upper gastrointestinal fluoroscopy study","Endoscopy with biopsy","Multichannel intraluminal impedance plus pH probe"],"k":"D","x":"Multichannel intraluminal impedance plus pH measurement allows for detection of both acid and nonacid reflux. A traditional pH probe does not measure nonacid reflux. Upper gastrointestinal fluoroscopy is not a tool for reflux assessment at all. Endoscopy with biopsy can identify esophageal pathology but not its cause. PAGE 1939","bn":195},{"n":196,"s":"What is a not a typical treatment of EoE?","o":["Swallowed steroids","Proton pump inhibitors (PPIs)","Leukotriene antagonists","Elimination diet"],"k":"C","x":"Mast cell stabilizers like cromolyn and leukotriene receptor antagonist do not work for EoE both for clinical and histologic remission and are not recommended for management of EoE. PAGE 1945, Table 123.3","bn":196},{"n":197,"s":"What is not a complication of prolonged PPI use?","o":["Decreased bone density","Increased susceptibility to upper respiratory infections","Peptic ulcer disease","Electrolyte depletion"],"k":"C","x":"Acid suppression however is not benign, and the risk for viral respiratory infections and for viral gastroenteritis may increase with therapy, in particular with the prolonged use of PPIs. Bone fractures and electrolyte disturbances are also concerning but have not been investigated as thoroughly in children. PAGE 1939","bn":197},{"n":198,"s":"EoE is diagnosed by a history of esophageal dysfunction and which findings?","o":["Trachealization of the esophagus","Greater than 15 eosinophils per high-power field","Small caliber of the esophagus","Linear fissures"],"k":"C","x":"At present greater than 15 eosinophils/high-power field in an esophageal biopsy along with symptoms of esophageal dysfunction is used for diagnosis of EoE. PAGE 1942","bn":198},{"n":199,"s":"Dietary modifications for EoE include everything except:","o":["Target elimination diet","Elemental diet","Empiric six food elimination diet","Peptic ulcer diet"],"k":"D","x":"Three dietary approaches have emerged over the past decade for management of EoE. These are the elemental diet, the empiric six food elimination diet, and the targeted elimination diet. PAGE 1944","bn":199}]},{"t":"Head and Neck Surgery","q":[{"n":1,"s":"Human papillomavirus (HPV)-associated head and neck cancers occur primarily in:","o":["Oral cavity","Larynx","Oropharynx","Nasopharynx"],"k":"C","x":"HPV-associated head and neck cancers arise primarily in the palatine and lingual tonsils in the oropharynx. While HPV can be detected in other subsites of head and neck cancer, its causal role in those sites has not been as clearly established. PAGE 1952","bn":1},{"n":2,"s":"Epidermal growth factor receptor (EGFR)-targeted therapy that has been approved by the Food and Drug Administration for use in head and neck cancer is:","o":["Gefitinib","Cetuximab","Erlotinib","Lenvatinib"],"k":"B","x":"Cetuximab remains the only FDA-approved EGFR-targeted therapy for the treatment of head and neck cancer, and indeed, the last approved drug for head and neck cancer since 2015. PAGE","bn":2},{"n":3,"s":"Mechanisms contributing to head and neck cancer include:","o":["Suppression of apoptosis","Suppression of cell cycle progression","Activation of antitumor immunity","Inhibition of cell proliferation"],"k":"A","x":"Head and neck tumor cells exhibit resistance to cell death that allows them to continue to proliferate unchecked. Many molecular mechanisms contribute to alter tumor suppressor genes and activate oncogenes. The tumor microenvironment of head and neck tumors is characterized by immunosuppression. PAGES 1968-1969","bn":3},{"n":4,"s":"Currently utilized molecular targeted drugs include:","o":["TGF-B inhibitors","p53-activating agents","EGER inhibitors","HRAS inhibitors"],"k":"C","x":"While all of these are genes and pathways implicated in HNSCC, only the EGFR inhibitor cetuximab is currently in clinical use as an FDA-approved agent. Other drugs are being developed that may eventually target such pathways, but none have reached the point of being approved. PAGE 1957","bn":4},{"n":5,"s":"The development of precision medicine for head and neck cancer will rely on:","o":["Identification of biological features linked to specific therapy","Use of Teflon-coated surgical instruments","Transportation to and from medical facilities","Well-tolerated surgical adhesives"],"k":"A","x":"The identification of genetic and proteomic biomarkers that can be used to predict response to therapy will help develop personalized anticancer medicines for patients. The field has advanced so far in its understanding, and there is hope that these pathways can be capitalized upon to develop novel therapeutics. PAGE 1974","bn":5},{"n":6,"s":"Which of the following characteristics of head and neck squamous cell carcinoma is thought to contribute to its immunogenicity?","o":["Anatomic location","Tumor mutational burden","Presence of oral bacteria","High expression of antigen processing machinery"],"k":"B","x":"Tumor mutational burden. Head and neck cancers have a relatively high tumor mutational burden. These mutations may function as neoantigens, which are detected as foreign by the immune system. Head and neck tumors tend to have low expression of antigen processing machinery, and the effects of anatomic location or presence of oral bacteria have not yet been well established. PAGE 1980","bn":6},{"n":7,"s":"Which of the following is a major advantage of chimeric antigen receptor (CAR) T cells?","o":["CAR T cells have a longer life span versus traditional T cells.","Function of CAR T cells does not require presentation of antigen on the surface of the tumor cell.","Responses to CAR T cells are more predictable.","CAR T cells are not killed by chemotherapy."],"k":"B","x":"The function of CAR T cells does not require presentation of antigen on the surface of the tumor cell. The main advantage of CAR T cells is that they can respond directly to any peptide expressed on the surface of a tumor cell. In this way, killing by a CAR T cell does not require presentation of antigen on a MHC molecule, a process which may be deficient in head and neck cancer. It has been challenging, however, to identify surface molecules that are disproportionately expressed on tumor cells. PAGES 1987-1988","bn":7},{"n":8,"s":"Which of the following cell types are considered immunosuppressive?","o":["Cytotoxic T lymphocytes and dendritic cells","Regulatory T lymphocytes and dendritic cells","Regulatory T lymphocytes and myeloid-derived suppressor cells","Natural killer cells and myeloid-derived suppressor cells"],"k":"C","x":"Regulatory T lymphocytes and myeloid-derived suppressor cells. Myeloid-derived suppressor cells secrete immunosuppressive cytokines, chemokines, and growth factors. Although data on the role of regulatory T cells in head and neck cancer are mixed, they are generally considered immunosuppressive. PAGE 1983 (Fig. 125.4)","bn":8},{"n":9,"s":"Which of the following elements are required for a response to immune checkpoint blockade?","o":["Tumor antigens (viral antigens, neoantigens, or tumor-associated antigens)","Suppression of antigen processing and presentation machinery","Antigen-specific B cells","HPV-related cancer"],"k":"A","x":"In order to generate an effective antitumor immune response, a tumor must have functional antigens. These antigens must then be processed and presented, and antigen-specific T cells must be present in order to respond. This response should not be specific to tumor type, although some cancers may be more sensitive than others. A response to immune checkpoint blockade is unlikely if any of these elements are missing. PAGE 1983","bn":9},{"n":10,"s":"Which of the following mechanisms of immune escape renders a tumor cell susceptible to killing by natural killer cells?","o":["Decreased expression of neoantigens","Decreased expression of major histocompatibility complex (MHC) class I","Decreased expression of TAP","Decreased expression of viral proteins"],"k":"B","x":"Decreased expression of MHC class I. Although decreased expression of neoantigens, viral proteins, MHC class I, or TAP! render tumor cells less susceptible to killing by antigen-specific T cells, natural killer cells specifically recognize and kill cells that express low levels of MHC class I. PAGE 1982","bn":10},{"n":11,"s":"Multidisciplinary head and neck clinics have been shown to be associated with which of the following patient outcomes?","o":["Lower psychosocial distress","Increased cost of health care delivery","Increased likelihood of completion of adjuvant therapy","Reduced enrollment into clinical trials"],"k":"C","x":"Multidisciplinary care has shown to be associated with increased likelihood of completion of adjuvant therapy but has not yet been shown to definitively decrease distress. Starmer et al analyzed 118 oropharyngeal cancer patients and found that those who had a multi-disciplinary team (MDT) had more speech therapy visits than non- MDT patients (mean 1.8 vs 0.2, P < .0001), and MDT participation was the only significant variable associated with speech therapy compliance (OR, 12.9; 95% CI, 3.7-45.2). In a study of 1,616 oral cavity cancer patients, Liao et al found that 89.5% of MDT patients completed adjuvant chemoradiation therapy as recommended compared with 57.6% in the non-MDT group (P < .001). PAGE 1996","bn":11},{"n":12,"s":"What is the most common reason for failure to establish a diagnosis or treatment plan at a multidisciplinary conference?","o":["Uncertainty regarding a patient’s general medical condition","Need for further evaluation of tumor extent or biopsy","Lack of appropriate imaging","Histology reevaluation"],"k":"C","x":"Among all patients evaluated at a multidisciplinary conference, a diagnosis and treatment plan could be determined for 73%, while the remainder needed further work-up before a diagnosis or treatment plan could be established. The most common reasons for failure to establish a diagnosis or treatment plan were lack of proper imaging (42%), need for further evaluation of tumor extent or biopsy (30%), histology reevaluation (7%), and uncertainty regarding the patient’s general medical or cardiovascular status (6%). PAGE 1996","bn":12},{"n":13,"s":"Based on current practice patterns in the United States, which patient is most likely to have a multidisciplinary discussion?","o":["A 55-year-old female with a history of hypertension who presents with a T2NO lateral tongue squamous cell carcinoma","A 75-year-old male with a history of diabetes and prior CABG who presents with a T2NO oropharyngeal squamous cell carcinoma","A 45-year-old male with no past medical history who presents with a TINO glottic squamous cell carcinoma","A 60-year-old woman with no past medical history who presents with a T4N2cM1 oral cavity squamous cell carcinoma"],"k":"B","x":"Multidisciplinary care was more common in male patients, patients older than 70 years of age, and those with multiple comorbidities. While 60% of patients with localized disease had multidisciplinary care, only 28% of those with advanced stage disease had an MDT. Thus, although the use of multidisciplinary care is increasing in the United States, it is less common in younger patients and those with advanced stage disease. PAGE 1998","bn":13},{"n":14,"s":"Who is involved in a multidisciplinary team?","o":["Surgical, medical, and radiation oncologists","Speech therapists","Social workers","Health psychologists","All of the above"],"k":"E","x":"A MDT in head and neck cancer care ideally includes physicians including head and neck surgeons, reconstructive surgeons, medical oncologists, radiation oncologists, oral surgeons, neuroradiologists, nuclear medicine, and pathology; as well as allied health professionals who provide adjunctive care to head and neck cancer patients including speech therapy, nursing, occupational/ physical therapy, nutrition, mental health, clinical trial staff, and dental care (see also Table 126.1). PAGE 1996","f":"The book prints the key as “F”, but only options A–E are listed. E (All of the above) is the intended answer.","bn":14},{"n":15,"s":"What is an important challenge to the usage of telemedicine in multidisciplinary care?","o":["Length of case discussion","Cost","Treatment delays","Decreased access"],"k":"A","x":"One of the struggles with the use of telemedicine in multidisciplinary care is the increased turn length and length of case discussions along with a decrease in informal exchanges. However, the benefits of telemedicine include increased access for both patients and providers to multidisciplinary care and decreased treatment delays. Furthermore, there has not been shown to be a substantial cost difference between in person and virtual tumor boards. PAGE 1998","bn":15},{"n":16,"s":"What are the two major mechanisms by which radiation damages the tumor cell DNA?","o":["Linear and exponential","Direct and indirect","Radiosensitizing and synergistic","Photon-or particle-based"],"k":"B","x":"Radiation enacts DNA strand breaks through an indirect or direct mechanism. One-third of cell kill is considered direct, leading to double-strand breakage and cell apoptosis, Two-thirds of cell kill is considered indirect, mediated through free radicals that damage DNA. PAGE 2001","bn":16},{"n":17,"s":"What is the most classic and common conventional fractionation schedule for definitive-intent head and neck radiation therapy (in the absence of surgery)?","o":["70 Gy in 35 fractions","60 Gy in 30 fractions","59.4 Gy in 33 fractions","55 Gy in 20 fractions","44 Gy in 5 fractions"],"k":"A","x":"Option A is the most classic curative intent schedule in use for head and neck cancer. Option B is common postoperative schedule. Option C is an elective dosing schedule often used for the high-risk region in intensity-modulated radiation therapy. Option D is a hypofractionated regimen that can be used definitively. E is a stereotactic body radiation therapy schedule. PAGE 2003","bn":17},{"n":18,"s":"What occurs in during the radiation simulation process for a head and neck cancer patient?","o":["A mask is formed over head and neck of the patient, and caliper measurements are taken of the patient’s body.","A mask is formed over the head and neck of the patient and a computed tomography (CT) scan is obtained.","The patient is placed into a CT scanner, and the exact conditions of the treatment are then simulated immediately on the radiation machine.","The patient is placed into the radiation machine, and the treatment to be delivered is simulated on the patient.","The patient is placed in the radiation machine, simulated, and the first treatment is delivered."],"k":"B","x":"In a simulation, a mask is formed to ensure a stable position of the patient’s head and neck and then a planning CT scan is obtained. No physical measurements of the body are taken in today’s era (option A). The patient is not placed into the radiation machine during simulation (options C, D, and E), and no treatment is given at the time of simulation (D and E). PAGES 2005-2006","bn":18},{"n":19,"s":"What is the proper order of the delineation of target volumes for head and neck radiotherapy planning?","o":["Planning target volume, clinical target volume","Internal target volume, planning target volume, clinical target volume","Internal target volume, clinical target volume, planning target volume","Gross tumor volume, clinical target volume, planning target volume","Gross tumor volume, internal tumor volume, clinical target volume"],"k":"D","x":"The gross tumor volume (if it exists) is always delineated first. Then an expansion is made to the clinical target volume and another is made to the planning target volume. In options A and B, the planning target volume is larger than the clinical target volume so it cannot be drawn first. In options B, C, and D, the internal target volume is used to account for breathing motion in lung cancer treatment and is not used in head and neck planning. PAGE 2006","bn":19},{"n":20,"s":"What is a standard radiation planning constraint that is frequently specified for the parotid gland?","o":["50 Gy to 50% of both parotid glands","30 Gy to 100% of both parotid glands","30 Gy mean dose to both parotid glands","30 Gy maximum dose to both parotid glands","26 Gy mean dose to one parotid gland"],"k":"E","x":"A mean dose of 26 Gy is a standard constraint often used for the parotid gland. Options A, B, C, and D would allow much higher doses and would not be considered gland sparing. The ipsilateral parotid gland is often within the radiation field, so typically only one parotid gland can be spared. PAGE 2007","bn":20},{"n":21,"s":"Which chemotherapy agent is the standard drug given concurrently with radiation in the treatment of locally advanced head and neck squamous cell carcinoma (HNSCC)?","o":["Carboplatin","Cisplatin","5-Fluorouracil","Paclitaxel"],"k":"B","x":"Cisplatin administered concurrent with radiation is the standard of care in the definitive, organ-preserving management of locally advanced HNSCC. PAGES 2019-2020","bn":21},{"n":22,"s":"A patient with significant hearing loss is likely to be ineligible for which chemotherapy drug?","o":["Carboplatin","Cisplatin","5-Fluorouracil","Paclitaxel"],"k":"B","x":"Cisplatin-related ototoxicity occurs in the outer hair cells of the cochlea and is a common side effect that is usually bilateral and irreversible. The degree of baseline hearing will determine treatment eligibility. Carboplatin or cetuximab may serve as substitutes for cisplatin. PAGE 2023","bn":22},{"n":23,"s":"Which pathological finding supports the addition of chemotherapy to adjuvant radiation?","o":["Perineural invasion","Positive margin","Lymphovascular invasion","Bone invasion"],"k":"B","x":"Positive margins and extranodal extension were the only two adverse pathologic features that correlated with improved survival in the setting an adjuvant chemoradiation. PAGE 2018","bn":23},{"n":24,"s":"Induction chemotherapy improves survival in tumors at this site of the neck and neck.","o":["Nasopharynx","Oral cavity","Oropharynx","Larynx"],"k":"A","x":"While induction chemotherapy may result in objective tumor response, survival advantage has only been demonstrated in nasopharyngeal cancers. Most induction regimens involve a triple combination therapy with cisplatin, 5-fluorouracil, and paclitaxel. PAGES 2022-2023","bn":24},{"n":25,"s":"Which head and neck cancers have favorable outcomes that support investigation for deintensification of therapy?","o":["HPV-related cancers","HPV-related oropharyngeal cancers","HPV-negative cancers","Epstein-Barr virus (EBV)-related cancers"],"k":"B","x":"HPV-related oropharyngeal cancers respond well to both surgical and nonsurgical treatments with a 5-year survival greater than 80%. The mechanism of tumor suppressor gene inactivation due to HPV compared to mutagenesis secondary to tobacco and alcohol carcinogenesis portends greater sensitivity to treatment. PAGE 2020","bn":25},{"n":26,"s":"Patients treated with cetuximab who develop the following side effect have improved survival?","o":["Nausea and vomiting","Diarrhea","Rash","Joint pain"],"k":"C","x":"Cetuximab is associated with the development of an acneiform rash in 84% of patients during treatment. Those who developed a prominent cetuximab-induced acneiform rash had longer overall survival (69 months) compared to those with mild rash (26 months). PAGE 2020","bn":26},{"n":27,"s":"Which of the following is a known effect of radiation therapy on vascular physiology?","o":["Vasodilation","Neovascularization","Atherosclerosis","Decreased pressure of capillary systems"],"k":"C","x":"Radiation therapy is associated with vascular plaques, arterial stenosis, and thickening of the intima of affected vessels, or atherosclerosis. This is related to site and dose of irradiation. Carotid stenosis is a known sequelae of head and neck cancer irradiation due to atherosclerotic changes in the vessels and can put patients at increased risk of stroke. PAGE 2029","bn":27},{"n":28,"s":"A 64-year-old man with a history of T3N1 HPV-negative squamous cell carcinoma of the oropharynx was treated with chemoradiation. Posttreatment imaging revealed persistent disease in the paramedian, left tongue base that was 1 cm in size. The lesion was not well visualized on direct laryngoscopy but was firm to palpation. Which approach to salvage surgery can be considered?","o":["Transoral laser surgery","Transhyoid pharyngotomy","Maxillary swing","Facial translocation"],"k":"B","x":"For a T3 tumor of the oropharynx, not well visualized on direct laryngoscopy, the optimal surgical approach is either a transhyoid pharyngotomy or mandible swing approach to the oropharynx. Transoral laser or robotic surgery can be considered for small, well-visualized oropharynx tumors in the salvage setting but is typically reserved for early-stage tumors. Furthermore, in the immediate posttreatment setting, preoperative imaging can underestimate the size and extent of tumor recurrence making an open approach with good visualization and wide margins the preferred method for treatment of a persistent T3 tumor of the oropharynx. PAGE 2036","bn":28},{"n":29,"s":"Which of the following osteocutaneous free flaps is most commonly used for mandibular reconstruction due to length of bicortical bone that it provides?","o":["Fibula free flap","Iliac crest free flap","Osteocutaneous forearm free flap","Scapula free flap"],"k":"A","x":"The fibula free flap is generally the favored osteocutaneous free flap for mandibular reconstruction due to its relatively rapid harvest and long bicortical bone that can accept multiple osteotomies. The average fibula length is over 35 cm, though at least 6 cm of distal bone must remain in situ for ankle joint stability taking care not to disturb the distal tibiofibular joint. As more bone is required for reconstruction, the vascular pedicle is shortened, which is an important consideration particularly in the salvage setting. The iliac crest free flap provides excellent bone stock, but popularity has waned due to the relative short pedicle, increased harvest time, and risks related to donor site morbidity. The scapula free flap is gaining in popularity, but shorter pedicle, difficulty with simultaneous harvest, and sometimes thin bone stock has kept it from being the workhorse flap for mandible reconstruction at most centers. The osteocutaneous forearm flap offers a long pedicle with an associated thin, pliable skin paddle, but a relatively short segment of monocortical bone. PAGE","bn":29},{"n":30,"s":"Transoral laser microsurgery can be used in salvage surgery for laryngeal cancer. What is one reason to convert to open surgery, such as partial or total laryngectomy?","o":["Tumor involvement of one arytenoid cartilage","Good pulmonary function","Difficulty exposing the larynx","Lack of dentition"],"k":"C","x":"Prior radiotherapy with or without chemotherapy can result in significant fibrosis and stiffness of the larynx, making transoral direct laryngoscopy more difficult than pretreatment. If good endoscopic exposure of the larynx with confident tumor margins cannot be obtained, transoral laser microsurgery should be aborted and (depending on preoperative discussion) converted to an open procedure. In some cases, it can be worthwhile to bring the patient to the operating room to assess exposure and perform tumor mapping biopsies prior to determining the optimal treatment approach and aid in preoperative patient counseling. PAGE 2038","bn":30},{"n":31,"s":"A carotid artery balloon occlusion test can be performed preoperatively to determine if the carotid artery can be safely ligated as part of as a salvage neck dissection. A good result would reduce the risk of what adverse outcome?","o":["Carotid rupture","Disease recurrence","Free flap failure","Stroke"],"k":"D","x":"A preoperative balloon occlusion test is an angiographic test to assess ipsilateral cerebral blood flow after endovascular occlusion of the internal and/or common carotid artery. This test evaluates collateral blood flow from the circle of Willis by mimicking conditions of carotid artery sacrifice. In addition to angiographic evidence of collateral cerebral blood flow, patient neurologic evaluation and EEG evaluation can also be conducted as part of the test. It can also be useful to drop the blood pressure during the test to ensure adequate collateral blood flow and neurologic function is maintained in the setting of relative hypotension. Any change in neurologic function or absence of blood flow during the test leads to immediate deflation of the balloon. Performing this evaluation in cases where the carotid may be at risk of injury or require sacrifice as part of surgery can help with treatment planning in the salvage setting and decrease the risk of postoperative stroke. PAGE 2040","bn":31},{"n":32,"s":"Which of the following is considered a high-risk basal cell carcinoma?","o":["7-mm lesion of the left cheek","8-mm lesion of right temporal scalp","5-mm lesion of left preauricular area","4-mm lesion of central forehead"],"k":"C","x":"The preauricular area falls into the “mask” area of the face, also known as H-zone and is considered high-risk. PAGE 2047 (Table 130.1)","bn":32},{"n":33,"s":"For which nonmelanoma skin cancer is sentinel lymph node biopsy recommended?","o":["Merkel cell carcinoma without evidence of nodal metastases","Low-risk cutaneous squamous cell carcinoma (•SCC) without evidence of nodal metastases","High-risk basal cell carcinoma (BCC) without evidence of nodal metastases","Recurrent BCC of nose with prior radiation therapy"],"k":"A","x":"Sentinel node biopsy is considered standard of care of localized Merkel cell carcinoma. The staging procedure is not thought to be beneficial in low-risk skin cancers to include cSCC and BCC because of the low rate of occult nodal metastasis. While sentinel node biopsy can be considered in high-risk cSCC, the benefit and utility remain to be determined. PAGE 2054","bn":33},{"n":34,"s":"Which of the following immunotherapy agents is involved in the sonic hedgehog pathway?","o":["Pembrolizumab","Cetuximab","Vismodegib","Ipilimumab"],"k":"C","x":"Vismodegib involves the sonic hedgehog pathway. Pembrolizumab is a program death-1 (PD-1) inhibitor; cetuximab is an EGFR inhibitor, and ipilimumab is monoclonal antibody directed against the human T-cell receptor cytotoxic T-lymphocyte—associated antigen 4 (CTLA4). PAGE 2050","bn":34},{"n":35,"s":"Which of the following is not recommended for initial biopsy of suspected nonmelanoma skin cancer?","o":["Wide local excision","Narrow margin excision","Shave biopsy","Punch biopsy"],"k":"A","x":"Wide local excision should be considered a treatment modality reserved for after obtaining the diagnosis and risk stratification of a nonmelanoma skin cancer. Performing wide local excision prior to determining depth of invasion may decrease the accuracy and reliability of sentinel node biopsy for high-risk Merkel cell carcinomas and cSCCs. PAGE 2045","bn":35},{"n":36,"s":"What is the most common subsite of cutaneous squamous cell carcinoma (SCC) in the head and neck?","o":["Upper lip","Lower lip","Temporal scalp","Nose"],"k":"B","x":"The lower lip is the most common subsite of cSCC, possibly due to direct sun exposure. Therefore, one should have a low threshold to biopsy nodules, ulcerations, nonhealing scabs and masses on the lower lip. PAGE 2050","bn":36},{"n":37,"s":"Which melanoma subtype demonstrates neurotropism, a low rate of lymph node metastases, and a high rate of local recurrence?","o":["Superficial spreading","Desmoplastic","Lentigo maligna","Acral lentiginous"],"k":"B","x":"Desmoplastic melanoma has a predisposition for perineural invasion. This accounts for local recurrence despite histologically “negative margins” with recurrence rates reported between 23% and 48%. PAGE 2061","bn":37},{"n":38,"s":"Sentinel lymph node biopsy should be routinely offered when a patient has:","o":["A 0.5-mm-thick melanoma of the scalp without ulceration and no clinical evidence of lymph node metastases","A 2.5-mm-thick melanoma of the scalp without ulceration and no clinical evidence of lymph node metastases","A 2.5-mm-thick melanoma of the scalp without ulceration and with lymph node metastases in two cervical lymph nodes","A 2.5-mm-thick melanoma of the scalp without ulceration, with no clinical evidence of lymph node metastases, and with distant metastases in the spine"],"k":"B","x":"A sentinel lymph node biopsy should be routinely offered to patients with T2 to T3 lesions (1-4 mm of depth) without clinical nodal or distant metastasis. PAGE 2063","bn":38},{"n":39,"s":"What is the appropriate margin of resection for a 3.7-mm-thick melanoma of the scalp?","o":["0.5 cm","1cm","1to2cm","2cm"],"k":"D","x":"For patients with T3 (2.01-4.0 mm) melanomas, the appropriate margin of resection is 2.0 cm. PAGE 2064","bn":39},{"n":40,"s":"What is the surveillance protocol that can be considered for sentinel lymph node biopsy (SLNB)-positive patients without other metastatic disease who did not undergo completion lymph node dissection (CLND)?","o":["CT scan every year for first 2 years","Positron emission topography (PET)/CT scan every year for first 2 years","Nodal basin ultrasound every 4 months for first 2 years","Nodal basin ultrasound every 2 months for first 2 years"],"k":"C","x":"For SLNB-positive patients, regional lymph node assessment via ultrasound can be offered every 4 months in the first 2 years and then every 6 months from years 3 to 5 (consistent with MSLT-II and DeCOG). PAGE 2073","bn":40},{"n":41,"s":"Which is considered a checkpoint inhibitor that is Food and Drug Administration (FDA) approved for use in treating advanced melanoma?","o":["Interferon","Nivolumab","Dacarbazine","Dabrafenib"],"k":"B","x":"Nivolumab is a PD-1 checkpoint inhibitor that was approved for the treatment of advanced unresectable melanoma in 2014 and for the adjuvant treatment of resected melanoma with lymph node involvement in 2017.PAGE 2072","bn":41},{"n":42,"s":"A 60-year-old female nonsmoker presents with a 3-year history of a gradually enlarging right parotid mass. On physical examination, the mass is mobile with no associated adenopathy or cranial neuropathy. What is the most likely diagnosis?","o":["Warthin’s tumor","Pleomorphic adenoma","Mucoepidermoid carcinoma","Lymphangioma","Squamous cell carcinoma"],"k":"B","x":"The most common tumor of the parotid gland is a pleomorphic adenoma. The slow but progressive course of this parotid mass, without evidence of invasion into surrounding structures, indicates a benign process. Warthin tumor is commonly associated with patients who smoke. PAGE 2082","bn":42},{"n":43,"s":"A 40-year-old male presents with a progressively enlarging left parotid mass. Fine needle aspiration (FNA) biopsy reveals a salivary gland neoplasm of undetermined malignant potential (Milan IV). What is the associated risk of malignancy and recommended next step in management?","o":["Less than 10%, observation","Roughly 20%, observation","Roughly 35%, diagnostic/conservative surgery","Over 50%, diagnostic/conservative surgery","Over 90%, radical surgery"],"k":"C","x":"A FNA biopsy of a parotid mass revealing a salivary gland neoplasm of undetermined malignant potential (SUMP, Milan classification of IV) has an associated risk of malignancy of 35%. Depending on clinico-radiologic findings, conservative surgery should be offered. PAGE 2081 (Table 132.1)","bn":43},{"n":44,"s":"A 68-year-old male underwent radical parotidectomy with neck dissection for a suspected high-grade mucoepidermoid carcinoma with involvement of the facial nerve. The patient was found to have a 4.5-cm tumor with extraparenchymal extension as well as 8 out of 28 lymph nodes positive for carcinoma. What further therapy would this patient require after recovering from surgery?","o":["No further treatment","Additional surgery","Adjuvant radiotherapy","Adjuvant chemoradiotherapy","Immunotherapy"],"k":"C","x":"This patient shows evidence of locoregionally advanced and high-grade mucoepidermoid carcinoma. Patients with advanced T-classification, positive margin status, lymph node metastasis, or adverse pathologic features are likely to benefit from adjuvant radiotherapy. The additional of adjuvant platinum-based chemotherapy did not have improved locoregional control in multiple cohort studies. PAGE 2089","bn":44},{"n":45,"s":"Which of the following is a landmark to identify the main trunk of the facial nerve during parotidectomy?","o":["Anterior belly of the digastric muscle","Tragus","Tympanomastoid suture","Stylohyoid muscle"],"k":"C","x":"The posterior belly of the digastric muscle, tragal pointer, tympanomastoid suture, and styloid process are all landmarks for the main trunk of the facial nerve during parotidectomy. The posterior belly of the digastric muscle determines the plane just superficial to the facial nerve, and the tragal pointer can allow for identification of the nerve roughly 1 cm deep and anterior to it. Alternatively, a retrograde facial nerve dissection may be considered for anterior parotid tumors. Another landmark to identify the main trunk of the facial nerve is the tympanomastoid suture, which lies 6 to 8 mm medial to it. The styloid process may be used as a landmark for identification of the facial nerve; however, controversy exists as the facial nerve lies lateral to the root of the styloid process. Rarely, a mastoidectomy is needed to identify the proximal facial nerve. PAGES 2086-2087","bn":45},{"n":46,"s":"A 60-year-old patient with a history of salivary duct carcinoma of the submandibular gland is found to have metastatic disease on PET imaging. What potential systemic treatment may be considered in this patient pending pathologic analysis?","o":["BRAF inhibitor","Androgen receptor inhibitor","Tyrosine kinase inhibitor","Ipilimumab"],"k":"B","x":"A proportion of patients with salivary duct carcinoma show overexpression of androgen receptors. As such, androgen deprivation therapy may be a potential systemic treatment pending pathologic analysis. Androgen deprivation therapy with leuprorelin and bicalutamide showed partial or complete response in 41.7% of patients. PAGE 2084","bn":46},{"n":47,"s":"Which one of the following statements is correct with regard to the common type, site, and gender distribution of lip tumors?","o":["Basal cell carcinoma typically affects the lower lip and is more common in women.","Basal cell carcinoma typically affects the lower lip and is more common in men.","Squamous cell carcinoma typically affects the upper lip and is more common in women.","Squamous cell carcinoma typically affects the lower lip and is more common in men.","Pleomorphic adenoma typically affects the lower lip and is more common in men."],"k":"D","x":"Anatomically, the lower lip is more exposed to the sun than the upper lip, and socially, many more women than men wear some type of lip balm (eg, lipstick), which protects the lip from UV radiation, while more men than women smoke, which is a risk factor for squamous cell carcinoma (SCCA). PAGE 2092","bn":47},{"n":48,"s":"Neck dissection for a T3NOMO well-differentiated left lower lip cancer patient for whom radiation therapy (XRT) is not indicated should include:","o":["Right level I to III and left I to III selective neck dissection","Left parotid and left I to III selective neck dissection","Left modified radical (I to V) neck dissection","Left I to III selective neck dissection","No neck diss ction as the risk of cervical metas is low"],"k":"A","x":"The lower lip has lymphatic drainage to both sides of the neck so a large tumor like this requires bilateral dissection. Levels I-III are appropriate for an NO neck since the first echelon of nodes is level I, followed by levels If and III. Further dissection in an NO neck is unwarranted. The parotid is the first echelon for upper lip drainage. PAGE 2097","bn":48},{"n":49,"s":"A 70-year-old man presents with a 2-week history of a rapidly enlarging otherwise asymptomatic mass on the right upper lip. Physical examination reveals a 2-cm ulcerated circumscribed lesion with rolled margins, a keratinized central region, and an indurated base. The initial biopsy report provided by the referring physician was read as “suspicious for squamous cell carcinoma.” The next best step in management is:","o":["Perform a second incisional biopsy at the margin of the lesion","Observation for 3 months and excisional biopsy if the lesion persists","Wedge resection with 3-mm margins and primary closure","Definitive radiation therapy to the primary site","Refer for Mohs resection"],"k":"A","x":"A definitive diagnosis is needed before an appropriate treatment plan can be developed, and the history suggests a keratoacanthoma. A biopsy of the margin would allow assessment of the periphery of the lesion for accurate characterization. PAGE 2095","bn":49},{"n":50,"s":"A 48-year-old male is diagnosed with a T2 NO MO p16-positive squamous cell carcinoma of the right tonsil. The patient decides to undergo upfront surgery. Which type of neck dissection is most appropriate?","o":["Radical neck dissection","Selective neck dissection levels 2 through 4","Selective neck dissection levels 1 through 4","Modified neck dissection levels 1 through 5"],"k":"B","x":"Primary oropharyngeal cancers have a high rate of microscopic nodal metastasis in early-stage disease most commonly to levels 2 to 4. PAGE 2117","bn":50},{"n":51,"s":"A 53-year-old female with a history of papillary carcinoma of right thyroid status posttotal thyroidectomy a year ago has an enlarged level 2 lymph node on ultrasound. The next step in management should be?","o":["PET/CT","Completion thyroidectomy with right neck dissection","Ultrasound-guided FNA of the right neck node","Removal of the enlarged lymph node"],"k":"C","x":"Initial workup of an enlarged node should include an ultrasound-guided FNA with cytologic evaluation. PAGE 2119","bn":51},{"n":52,"s":"A 74-year-old male with squamous cell carcinoma of the right anterior floor of mouth that crosses midline. He is clinically and radiographically TZ2NOMO0. Surgical management of the necks should include?","o":["Right selective neck dissection levels 1 to 3","Right selective neck dissection levels | to 4","Bilateral modified radical neck dissections 1 to 5","Bilateral selective neck dissection levels 1 to 3."],"k":"D","x":"Oral cavity cancers that cross midline have the potential for bilateral nodal metastasis. Bilateral neck dissection should be performed and address the highest risk levels. PAGE 2117","bn":52},{"n":53,"s":"A 56-year-old male with hypopharyngeal squamous cell carcinoma and a large right-sided neck mass. Which of the following makes this unresectable neck disease?","o":["Three additional lymph nodes seen on PET/CT","Carotid encasement with infraclavicular extension","Invasion into the jugular vein and sternocleidomastoid muscle (SCM)","Spinal accessory nerve involvement"],"k":"B","x":"Carotid encasement especially with extension into the chest makes this unresectable. Other answers do illustrate advanced disease but still resectable. PAGE 2127","bn":53},{"n":54,"s":"A 65-year-old male with papillary thyroid cancer with evidence of central neck lymphadenopathy. What structure is not one of the boundaries of a central neck dissection?","o":["Hyoid bone","Innominate artery","Carotid artery","Thyroid cartilage"],"k":"D","x":"The boundaries of the central compartment starts superiorly at the hyoid bone to inferiorly to the innominate artery. The lateral boundaries are the common carotid arteries on both sides of the neck. Exposure to the central compartment commences after the separation of the strap muscles. PAGE 2126","bn":54},{"n":55,"s":"What is the best method to screen for nasopharyngeal carcinoma in a high-risk population?","o":["IgA EA","IgA VCA","Plasma EBV DNA","Annual flexible endoscopic examination of the nasopharynx","Annual magnetic resonance imaging (MRI) of the nasopharynx"],"k":"C","x":"There are currently no large-scale screening programs for nasopharyngeal carcinoma. There was a study screening 20,174 men using plasma EBV DNA, and of the 34 who had persistently elevated plasma EBV DNA, all were diagnosed with NPC. They had earlier-stage disease and superior 3-year progression-free survival, suggesting that screening could be feasible. PAGE 2136","bn":55},{"n":56,"s":"What is the treatment of choice for stage I primary nasopharyngeal carcinoma?","o":["Radiotherapy alone","Concurrent chemoradiotherapy","Induction chemotherapy then concurrent chemoradiotherapy","Surgery alone","Surgery with adjuvant radiotherapy"],"k":"A","x":"Radiation therapy alone has shown overall local control rates of over 98% at 5 years for early-stage disease. PAGE","bn":56},{"n":57,"s":"What is the treatment of choice for stage III primary nasopharyngeal carcinoma?","o":["Radiotherapy alone","Concurrent chemoradiotherapy","Induction chemotherapy then concurrent chemoradiotherapy","Surgery alone","Surgery with adjuvant radiotherapy"],"k":"C","x":"Most studies within the last decade have shown benefit to adding induction chemotherapy to chemoradiation therapy for advanced stage III-IVb nasopharyngeal carcinoma. PAGE 2143","bn":57},{"n":58,"s":"What is the best management of an rT1 local primary nasopharyngeal carcinoma away from the internal carotid artery?","o":["Robotic nasopharyngectomy","Endoscopic nasopharyngectomy","Maxillary swing approach for nasopharyngectomy","Re-irradiation","Chemoradiotherapy"],"k":"B","x":"One of the factors that makes cancer in the nasopharynx is the proximity to the internal carotid artery. For smaller cancers away from this area, endoscopic nasopharyngectomy is favored as a minimally invasive approach. PAGE 2146","bn":58},{"n":59,"s":"What is the most important procedure in the management of a patient with a suspected carotid blowout from the nasopharynx?","o":["Nasal packing","CT angiography","Digital subtraction angiography +/— embolization","Chest x-ray","Tracheostomy"],"k":"E","x":"When massive bleeding occurs, many patients succumb to aspiration. Thus, securing the airway is critical. A stable airway also allows for subsequent procedures to happen safely. PAGE","bn":59},{"n":60,"s":"Which oral lesion has the greatest risk of malignant transformation?","o":["Squamous papilloma","Leukoplakia","Erythroplakia","Lichen planus"],"k":"C","x":"Many cases of erythroplakia will already harbor invasive disease or carcinoma in situ. Risk of progression and malignant transformation is substantial, and these lesions should be managed aggressively. PAGE 2160","bn":60},{"n":61,"s":"Which of the following are established risk factors for development of oral cancer?","o":["Dental trauma","Betel nut","HPV","Diabetes"],"k":"B","x":"Betel nut use is a known risk factor for oral cancer development, more commonly utilized in India, southeast Asia, and northeast Brazil. HPV is a known oncogenic driver of oropharyngeal cancer, but its implications for oral cancer remain uncertain. PAGE,","bn":61},{"n":62,"s":"A patient presents with an oral tongue squamous cell carcinoma with depth of invasion 9 mm and diameter 2.5 cm. There is no clinical or radiographic lymphadenopathy. The optimal treatment includes:","o":["Partial glossectomy","Partial glossectomy and neck dissection with risk-adjusted adjuvant therapy","Definitive radiation alone","Induction chemotherapy followed by chemoradiotherapy"],"k":"B","x":"The treatment of choice for oral cancer remains upfront surgical resection at this time. For patients with a depth of invasion of 4 mm or more, the risk of microscopic spread to the draining nodal basin is substantial (~20% or greater), and the nodal basin should be addressed. Currently, elective nodal dissection in conjunction with resection of the primary site remains the standard of care. PAGE 2166","bn":62},{"n":63,"s":"A patient undergoes an anterior mandibulectomy and floor of mouth resection. The optimal reconstructive choice includes:","o":["A reconstruction bar and soft tissue flap","A soft tissue reconstruction alone","An osteocutaneous microvascular free flap","A free bone graft and soft tissue flap"],"k":"C","x":"Anterior mandibular reconstruction requires replacement of the anterior bony projecting element of the lower face. For this reason, vascularized bone reconstruction result in the optimal cosmetic and functional outcomes and leads to lower rates of hardware extrusion or failure in long-term follow-up. PAGE 2170","bn":63},{"n":64,"s":"A patient is undergoing surgery for a mandibular alveolus cancer, which is found to be superficially eroding the alveolar bone, but the mandibular marrow is uninvolved. The appropriate extent of resection includes:","o":["A marginal mandibulectomy with preservation of 1 cm of remaining mandibular height","A marginal mandibulectomy with preservation of 5 mm of remaining mandibular height","A segmental mandibulectomy","Abort and proceed with definitive radiation"],"k":"A","x":"When the cortical bone is superficially involved and the bone marrow is clear of disease, a marginal mandibulectomy is both oncologically safe and limits surgical morbidity. At least 1 cm of remaining mandibular height must be maintained to prevent postoperative mandibular fracture. PAGE 2169","bn":64},{"n":65,"s":"Which of the following specimens should be tested for HPV tumor status using p16!NK4a and/or HPV in situ hybridization?","o":["Core needle biopsy of 3-cm cystic cervical lymph node in a 58-year-old female, former smoker, with no visible primary cancer on examination","An 81-year-old male with a 44 pack-year history of smoking presenting with a 0.5-cm soft palatal squamous cell carcinoma that was biopsied in the clinic","A 36-year-old male with multiple prior oral sexual exposures, never smoker, occasional drinker, presenting with 2-cm tonsillar squamous cell carcinoma that was biopsied during direct laryngoscopy","All of the above"],"k":"D","x":"All newly diagnosed patients with oropharyngeal cancers should have tissue testing for HPV tumor status. High-risk HPV E6 and E7 mRNA expression as detected by in situ hybridization is considered the gold standard due to its high specificity, whereas p16!NK4a jmmunohistochemistry is well-correlated and considered a valid surrogate marker for HPV tumor status. As p16 IHC is more widely available, it is more commonly used. P16 immunohistochemistry is considered positive where there is 70% or greater nuclear and cytoplastic expression with moderate to strong intensity. Unknown primary carcinoma metastatic to the neck should also undergo testing for HPV tumor status. As p16 is less specific for HPV in cases of unknown primary, in situ hybridization testing is recommended. PAGE 2187","bn":65},{"n":66,"s":"Which is the most common type of lymphoma arising in the oropharynx?","o":["Hodgkin lymphoma","Diffuse large B-cell lymphoma","Follicular lymphoma","Non-Hodgkin T-cell lymphoma"],"k":"B","x":"Hematolymphoid tumors include lymphomas may arise in Waldeyer ring. These are most commonly diffuse large B-cell lymphoma and primarily arise in the palatine tonsil. PAGE 2184","bn":66},{"n":67,"s":"Which of the following statements is true regarding HPV-related oropharyngeal squamous cell cancer?","o":["They are more likely to be keratinizing than nonkeratinizing.","They arise from premalignant dysplasia which may be visible on examination as leukoplakia or erythroplakia.","They typically have basaloid features.","Histologic grade is a reliable prognostic marker."],"k":"C","x":"HPV-positive tumors are more likely nonkeratinizing and basaloid. Their appearance is a reflection of the lymphoepithelium from which they arise. Histologic grade is not used to describe HPV-positive squamous cell carcinomas in the updated version of the World Health Organization classification, and its use is discouraged by the College of American Pathologists. Though leukoplakia and erythroplakia may represent precursor lesions to HPV-negative squamous cell carcinoma, no such precursor lesions have been described or yet identified for HPV-positive squamous cell carcinomas. PAGE 2184","bn":67},{"n":68,"s":"The blood supply to the tonsil includes which the following?","o":["Lingual artery","Greater palatine artery","Facial artery","Options A and C"],"k":"D","x":"The palatine tonsillar complex is supplied by branches of the ascending pharyngeal (middle and inferior branches of the pharyngeal artery), lingual (dorsal lingual artery), facial (tonsillar artery), and internal maxillary arteries (descending palatine artery). PAGE 2182","bn":68},{"n":69,"s":"A 68-year-old male presents with a 6-mm broad-based mass arising from the junction of his soft palate and anterior tonsillar pillar. It is causing a foreign body sensation, and the patient would like it removed. Biopsy reveals a mix of goblet cells with mucin production, cuboidal intermediate cells, and squamous cells. What is the next most appropriate step in management?","o":["Simple excision","Wide local excision","Radiotherapy","Immunotherapy"],"k":"B","x":"Mucoepidermoid carcinoma is composed of a mix of goblet cells with mucin production, cuboidal intermediate cells, and squamous cells. It is the most common minor salivary gland malignancy found in the oropharynx, followed by adenocarcinoma and adenoid cystic carcinoma. These tumors are treated with primary surgical excision with the addition of postoperative radiotherapy depending on the presence of high-risk features (perineural invasion, close or positive margins, nodal metastases, high-grade disease). PAGE","bn":69},{"n":70,"s":"The following immunohistochemical studies are useful in the histologic/cytopathologic workup of unknown primary head and neck cancer (UPCa):","o":["P16","Epstein Barr Virus encoded small RNAs (EBER)","Pan-cytokeratin","All of the above"],"k":"A","x":"Malignancies from several histologies can present as unknown primary cancers. The potential etiologic role of HPV can be assessed through p16 immunoreactivity. Similarly, EB V-associated nasopharyngeal cancer is associated with EBER immunoreactivity. PAGES 2197-2198","bn":70},{"n":71,"s":"The best initial test to establish tissue diagnosis in UPCa patients:","o":["Incisional biopsy","Excisional biopsy","FNA biopsy","Neck dissection"],"k":"C","x":"The workup of the unknown primary patient requires us to establish a tissue diagnosis. The first choice for obtaining tissue is through FNA biopsy. PAGE 2202","bn":71},{"n":72,"s":"The approximate success rate for identifying the occult primary site with the application of transoral surgery in the context of p16-positive neck nodes is:","o":["20%","40%","80%","100%"],"k":"C","x":"Several studies quoted in the chapter demonstrate that the transoral surgery identifies the primary site in approximately 80% of cases. However, preliminary reports suggest that the yield may be lower in p16-negative cases. PAGE 2204","bn":72},{"n":73,"s":"The risk of hemorrhage following transoral resection for unknown primary carcinoma is:","o":["50%","30%","20%","5%"],"k":"D","x":"The most significant risk of this procedure is hemorrhage. The quoted hemorrhage rate for patients undergoing transoral resection is about 5%. This rate is impacted by prophylactic vessel ligation and the extent of resection. PAGE 2206","bn":73},{"n":74,"s":"What is the probability that the occult primary is found contralateral to the side of the nodal disease?","o":["1%","5%","10%","20%"],"k":"C","x":"The study by Geltzeiler et al highlights the possibility that tumors in the oropharynx can present with contralateral metastases. About 10% of patients with unilateral neck metastases were found to have primary tumors in the contralateral oropharynx. PAGE 2204","bn":74},{"n":75,"s":"In the treatment of oropharyngeal squamous cell carcinoma via transoral robot-assisted surgery (TORS), absolute contraindications to TORS include all of the following except:","o":["Mandibular invasion by tumor","Medial pterygoid muscle invasion by tumor","Invasion of the internal carotid artery","Tumor fixation to prevertebral fascia"],"k":"B","x":"Medial pterygoid muscle invasion by tumor is a relative contraindication to TORS. Achieving a negative margin is difficult with this depth of invasion in addition to the difficulty with exposure given the likely trismus that occurs with pterygoid involvement. PAGE 2212","bn":75},{"n":76,"s":"The risk of pharyngeal hemorrhage after oropharyngeal cancer treatment via TORS is highest at which point?","o":["The day after surgery was performed","During adjuvant therapy after TORS","Within the first 2 weeks after surgery was performed","During emergence from general anesthesia after TORS"],"k":"C","x":"The majority of postoperative pharyngeal hemorrhages after TORS occur within 2 weeks. This is important data for counseling patients, as most TORS patients will have been discharged from the hospital before the risk of bleeding diminishes. PAGE 2224","bn":76},{"n":77,"s":"A patient has a clinically T1 (AJCC 8th Edition) palatine tonsil squamous cell carcinoma that on examination appears exophytic at the mid tonsil. Which of the following deep planes of dissection is reasonable for complete transoral excision?","o":["Dissection should incise superior pharyngeal constrictor muscle and continue deep to the parapharyngeal fat.","Dissection should continue deep to the parapharyngeal fat and include a margin of medial pterygoid muscle.","Dissection should incise the superior pharyngeal constrictor muscle and continue deep to this muscle, superficial to the parapharyngeal fat.","Dissection should extend into the parapharyngeal fat until branches of the external carotid arterial system are identified and can be ligated."],"k":"C","x":"For palatine tonsil squamous cell carcinomas that have not invaded the superior pharyngeal constrictor muscle, including this muscle as the deep margin is the standard approach to complete tumor excision, PAGE 2217","bn":77},{"n":78,"s":"A patient has a clinically T1 tongue base squamous cell carcinoma. Which vital structures may be encountered first during complete TORS excision at the lateral deep margin?","o":["The hypoglossal nerve","The dorsal branch of lingual artery, as well as the lingual artery proper","The medial pterygoid muscle and pterygoid venous plexus","The vallecular mucosa"],"k":"B","x":"While the hypoglossal nerve can be encountered upon deep dissection through intrinsic tongue musculature, the lingual arterial vessels will be encountered at a more superficial level as dissection proceeds into the lateral tongue base/gloss tonsillar sulcus. PAGE 2220","bn":78},{"n":79,"s":"All of the following are acceptable approaches to airway management in transoral robotic surgery (TORS) procedures except tracheostomy, nasotracheal intubation, orotracheal intubation, and laryngeal mask airway.","o":["Tracheostomy performed at the beginning of the case","Orotracheal intubation with a cuffed endotracheal tube","Nasotracheal intubation with a reinforced armored tube","Laryngeal mask airway placed at the beginning of the case"],"k":"D","x":"A laryngeal mask airway does not provide sufficient protection from aspiration during TORS. Nasotracheal and orotracheal intubation are common options requiring judgment as to which will provide optimal working space. A tracheostomy is not a common approach to airway management during TORS but may be considered in TORS patients with higher risk of postoperative aspiration and/or hemorrhage. PAGES 2214-2215","bn":79},{"n":80,"s":"A 58-year-old male presents with unilateral otalgia and odynophagia. The patient undergoes an endoscopic examination in the office. What maneuvers can help visualize the mucosal surfaces of the hypopharynx?","o":["Tongue protrusion and pursed lip maneuver","Neck extension","Puffed cheek maneuver with anterior neck skin traction","Anterior neck skin traction with tongue protrusion"],"k":"C","x":"Adequate visualization of the hypopharynx is critical to rule out small tumors on the mucosa. In section on Physical Examination, the puffed cheek maneuver with anterior neck skin traction best opens the span of the pyriform sinuses and post cricoid mucosal surfaces. PAGE 2231","bn":80},{"n":81,"s":"A patient presents with a new diagnosis of hypopharynx carcinoma. The primary site measures 2.5 cm with vocal cord fixation and a 2-cm ipsilateral node with no obvious extranodal extension. No distant metastases are identified. What is the patient’s TNM classification?","o":["T2NIMO","T3NIMO","TINIMO","T3N2aM0"],"k":"B","x":"The TNM classification according to the AJCC 8th edition upstages tumors to T3 whenever there is laryngeal fixation. Any node less than 3 cm without overt extranodal extension is N1. Therefore, this patient’s TNM classification is T3N1MO0. PAGE 2233","bn":81},{"n":82,"s":"A 65-year-old male with a large hypopharynx carcinoma undergoes surgical resection of his cancer with bilateral node dissection. His final pathology shows a 4-cm primary tumor with cartilage erosion and multiple positive bilateral nodes with macroscopic extranodal extension. No distant metastases were seen on initial evaluation. What is his pathologic TNM classification?","o":["T2N2c","T4aN2c","T4aN2b","T4aN3b"],"k":"D","x":"The updated TNM classification update in the AJCC 8th edition is important to understand for patient prognostic counseling. The presence of cartilage invasion upstages the primary tumor to T4a, and macroscopic extranodal extension in the background of multiple nodes is N3b. PAGES 2233-2234","bn":82},{"n":83,"s":"A 72-year-old male with biopsy proven squamous cell carcinoma of the hypopharynx presents to the multidisciplinary head and neck team for pretreatment workup. What imaging would be the most effective at evaluating for distant disease?","o":["PET-CT","Bone scan","Chest CT","PET"],"k":"A","x":"In the imaging section of this chapter, the incidence of distant metastasis (DM) in patients with hypopharynx cancer is 7%. Therefore, screening for DM is important for patients. Cost analyses have found that PET-CT is superior in quality and reduction in downstream costs compared to chest CT and bone scan. PET alone does not provide the same advantage. PAGE 2232","bn":83},{"n":84,"s":"A 59-year-old male presents with an advanced cervical esophageal carcinoma. Treatment recommendation is for surgery followed by free tissue reconstruction. What microvascular tissue flap best achieves the reconstruction?","o":["Radial forearm flap","Colonic interposition","Jejunal flap","Pectoral myocutaneous flap"],"k":"C","x":"In the reconstruction section, the discussion outlines reconstructive options after cervical esophagectomy. In these situations, the surgery requires complete esophagectomy for complete disease clearance. The radial forearm flap will not provide the coverage. The jejunal flap is the only free tissue flap in the selections. Colon interposition is a pedicled flap. PAGE 2244","bn":84},{"n":85,"s":"A patient presents to the emergency department with worsening ear pain and difficulty in swallowing. A CT reports a large laryngeal mass with thyroid cartilage erosion. During a discussion with the patient, he reports undergoing a biopsy for a spot on his voice box about a year ago. He was told the biopsy was negative for cancer and did not follow-up with his physician after this. The pathology report from that biopsy will most likely show:","o":["Hyperkeratosis","Squamous papilloma","High-grade dysplasia","Vocal polyp","Singers nodule"],"k":"C","x":"High-grade dysplasia is a precancerous state and requires close follow-up. Disease progression is likely (18%), and biopsies can be limited by sampling error. PAGES 2254-2255","bn":85},{"n":86,"s":"A patient returns to the clinic 8 month after undergoing primary transoral laser microsurgery (TLM) for a Ta glottic carcinoma with CO₂ laser. He is doing well but does note persistent hoarseness. The operative report notes resection of a portion of the vocalis muscle and the pathology report indicates clear margins. Which aspect of treatment was most strongly related to this patient’s voice outcome?","o":["Depth of resection","Use of the CO₂ laser","Incomplete resection","Neglecting to perform injection laryngoplasty at the time of resection","Poor diaphragmatic support while speaking"],"k":"A","x":"Depth of resection as typically characterized by the ELS classification has been repeatedly shown to correlate with voice prognosis with deeper resections (higher European Laryngological Society [ELS] cordectomy type) having a higher risk of poorer voice outcome. PAGE 2266","bn":86},{"n":87,"s":"A lawyer presents for a second opinion regarding treatment options for a T1b glottic carcinoma. He notes using his voice heavily for work. He has a history of chronic temporomandibular joint (TMJ) problems after multiple facial fractures 15 years ago. Why should this patient consider RT over endoscopic resection?","o":["Voice preservation","Bilateral disease","Reduced mouth opening","No history of prior radiation"],"k":"C","x":"Exposure/accessibility for resection is a contraindication for endoscopic surgery as described in Dr. Haughey’s 8 “T’s.” Voice preservation is always a required component of preoperative discussion with setting of expectations. PAGE 2267","bn":87},{"n":88,"s":"A 57-year-old female completed XRT for a T1b glottic carcinoma 1 year ago. She presents after missing her last few surveillance appointments with worsening hoarseness. Flexible laryngoscopy reveals a mass of her right true vocal cord (TVC). There is newly found reduced motion of the right TVC, but no fixation. Which of the following should not be considered for her after her confirmatory biopsy of recurrent cancer?","o":["Total laryngectomy","Supraglottic laryngectomy","Supracricoid laryngectomy","TLM"],"k":"B","x":"Impaired motion of the right true vocal fold implies increased tumor bulk/invasion and potential involvement of the ipsilateral paraglottic space. This area has to be completely resected, and a supraglottic laryngectomy will not address this area of recurrence. PAGES 2269-2271","bn":88},{"n":89,"s":"A 64-year-old male presents with 3 months of persistent hoarseness. An in-office laryngoscopy reveals an abnormality of the larynx. Examination shows grossly intact motion bilaterally, and stroboscopy demonstrates abnormal mucosa wave of bilateral true vocal fold (TVFs). The patient is taken for direct laryngoscopy and biopsy, which reveals a firm lesion of the right TVF with involvement of the anterior commissure. Which factor is a poor prognostic indicator for this patient.","o":["Verrucous variant on final pathology","Anterior commissure involvement","Abnormal mucosal wave","Age greater than 60 years","Laryngopharyngeal reflux disease"],"k":"B","x":"Anterior commissure involvement is a poor prognostic sign for both radiation and surgery in comparison with good but lower local control rates compared to mid fold carcinomas. PAGES 2271-2272","bn":89},{"n":90,"s":"All of the following are risk factors for postoperative pharyngocutaneous fistula except:","o":["Prior chemoradiation","Use of proton pump inhibitors (PPI)","Use of COX-2 selective nonsteroidal anti-inflammatory drugs","Concurrent neck dissection","Positive margin resection"],"k":"B","x":"Primary chemoradiation, concurrent neck dissection, positive margins, and the use of COX-2 selective inhibitors are associated with increased risk of pharyngocutaneous fistula. Retrospective data has demonstrated a lower rate of fistula in those taking PPI. PAGE 2290","bn":90},{"n":91,"s":"All of the following are true about the RTOG 91-11 study except:","o":["At 2-year follow up, the concurrent chemoradiation group had a higher laryngectomy free survival rate compared with the induction chemotherapy group or radiation alone group.","At 2-year follow-up, overall survival was statistically significantly higher in the concurrent chemoradiation group than the other groups.","At 5-year follow-up, the laryngectomy-free survival was better in the concurrent and induction groups than the radiation alone group.","At 5-year follow-up, the overall survival was similar among three groups.","The study included patients with early and advanced disease."],"k":"B","x":"Results of the RTOG 91-11 trial are notable for higher laryngectomy-free survival for the concurrent chemoradiation group at the 2-year time point. However, the overall survival at that time point was equal among all three groups (concurrent chemoradiation, induction followed by radiation, and radiation alone) at both 2 and 5 years. PAGE 2293","bn":91},{"n":92,"s":"In patients undergoing laryngectomy for squamous cell carcinoma:","o":["Surgical salvage is contraindicated in peristomal recurrence that is in the mediastinum.","The most common site of local recurrence is in the pharynx.","Peristomal recurrence is never amenable to surgical salvage.","Supraglottic site is a risk factor for peristomal recurrence.","Advanced N stage is a risk factor for peristomal recurrence."],"k":"A","x":"Contraindication to surgical salvage for recurrent larynx cancer is peristomal disease in the mediastinum. PAGE 2291","bn":92},{"n":93,"s":"All of the following are risk factors for development of laryngeal squamous cell carcinoma, except:","o":["Smoking","Alcohol use","HPV 16 and 18","Asbestos exposure","Industrial carcinogens"],"k":"C","x":"In contrast to oropharyngeal squamous cell carcinoma, HPV is not known to be associated with the development of larynx. cancer. PAGE 2282","bn":93},{"n":94,"s":"All of the following have robust data supporting the use as organ preservation surgical treatments for select T2 glottic malignancy, except:","o":["Vertical hemilaryngectomy","Supracricoid laryngectomy","Transoral laser microsurgery","Transoral robotic surgical resection"],"k":"D","x":"There is robust data supporting organ preservation surgical intervention for T2 glottic tumors with vertical hemilaryngectomy, supracricoid laryngectomy, and transoral laser microsurgery. Transoral robotic surgery has been demonstrated safe and effective for management of supraglottic tumors. PAGES 2287-2289","bn":94},{"n":95,"s":"A 58-year-old nonsmoking male presents to your office with a year and a half history of slowly progressive dyspnea with exertion. Office bronchoscopy following topical anesthesia demonstrates a 1.5-cm submucosal mass in the posterolateral trachea, starting around 4 cm below the true vocal folds. What is the most likely diagnosis in this patient?","o":["Invasive squamous cell carcinoma","Chondrosarcoma","Papillary thyroid carcinoma","Adenoid cystic carcinoma"],"k":"D","x":"In this patient, the slow onset of symptoms suggests a more indolent pathology such as adenoid cystic carcinoma. Since these tumors arise from a submucosal origin, they often lack surface ulceration. The position in the midtrachea argues against thyroid origin and also makes chondrosarcoma less likely. PAGE 2300","bn":95},{"n":96,"s":"A 62-year-old male patient undergoes a resection of a 2-cm squamous cell carcinoma of the lower cervical trachea. Resection of approximately 4 cm of trachea is required to achieve negative margins. Which of the following approaches would reduce the likelihood of postoperative dehiscence?","o":["Lateral mobilization of the trachea for 4 cm proximal and distal to the area of resection","Place the patient in a cervical collar in order to reduce neck flexion","Suprahyoid muscle release","Postoperative swallowing therapy"],"k":"C","x":"In patients with a segmental tracheal resection and reanastomosis, it is critical to minimize tension across the repair. This is best accomplished through anterior and posterior mobilization through blunt dissection, trying to avoid injury to the tracheal blood supply that comes in laterally. In instances where tension is still present, additional release maneuvers such as the suprahyoid muscle release can be helpful. In addition, keeping patients on postoperative voice rest and reducing the need for swallowing through the use of a nasogastric tube will further take the tension off of the repair. PAGE","bn":96},{"n":97,"s":"A 53-year-old male is 2 days status post a tracheal resection and reanastomosis for a 2.5-cm tracheal squamous cell carcinoma. Following a coughing spell, he is noticed to have increased neck swelling and worsening shortness of breath. The neck wound is tense with crepitus. What would be an appropriate next step in management?","o":["Bedside opening of a portion of the cervical incision","Emergent orotracheal intubation","Placement of a nasogastric tube for presumed esophageal","Placement of a continuous positive airway pressure mask to assist with breathing"],"k":"A","x":"In this patient, the concern is for partial or complete dehiscence of the tracheal anastomosis. As a result, the air that has extravasated into the neck soft tissue can result in pressure on the airway and also may track into the mediastinum or pleural space. Opening the incision at the bedside may allow for some of this pressure to be removed and in an instance of significant dehiscence, the distal airway can be directly intubated to stabilize the situation. Emergent oral intubation can be problematic as it may require neck extension, worsening the disruption. It also may be challenging to cannulate the distal airway. The above presentation is not likely to be an esophageal leak. The use of continuous positive airway pressure may actually worsen the underlying condition due to the increase in airway pressure. PAGE 2304","bn":97},{"n":98,"s":"A 62-year-old patient presents with a complaint of difficulty breathing with exercise. The patient is on Plavix for recently placed coronary artery stents. A CT scan of the neck and chest demonstrates a 1.5-cm mass in the
