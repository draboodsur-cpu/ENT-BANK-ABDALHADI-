m focuses exclusively on voice awareness and efficient voice production in connected speech in the first session and throughout?","o":["Flow phonation","Resonant Voice Therapy","PhoRTE","Conversation Training Therapy","Vocal function exercises"],"k":"D","x":"Conversation Training Therapy is grounded in the tenants of motor learning and asks the patient to achieve balanced phonation through conversation with clinician guidance. All other options are hierarchal approaches to voice therapy that start where generalization to connected speech is the final therapy goal. PAGE","bn":88},{"n":88,"s":"A 74-year-old man presents to the clinic seeking treatment for presbyphonia and has been previously evaluated for candidacy. Which therapy has been designed for presbyphonia?","o":["Flow phonation","Resonant Voice Therapy","PhoRTE","Conversation Training Therapy","Accent method"],"k":"C","x":"PhoRTE is the only behavioral voice therapy for presbyphonia that has been tested in a randomized, controlled clinical trial,93 showing improvements in respiratory and laryngeal biomechanics. PAGE 1092","bn":89},{"n":89,"s":"Although no standard objective dictate exists to aid SLPs in determining patient readiness to be discharged from voice therapy, SLPs agree that:","o":["Therapy should be four sessions in duration","Each session should be 30 minutes in length","Proficiency in sustaining sounds is necessary","Patients need to be able to use their new efficient voice production in conversation and real-life scenarios outside the therapy room","Patient hydration is vital"],"k":"D","x":"Number of sessions or length of sessions have not been shown in the literature to determine readiness for discharge. Proficiency in sustaining sounds is necessary for discharge but should not be the determining factor, rather the ability to use their voice in their home environments has been shown to be most predictive of readiness for discharge from voice therapy. PAGE 1092","bn":90},{"n":90,"s":"Meta-therapy refers to:","o":["Indirect voice therapy","Clinical dialogues that build conceptual frameworks for patients to understand the rationale behind component parts of indirect and direct voice therapy","Direct voice therapy","External hydration recommendations","Muscle relaxation therapy"],"k":"B","x":"All other options are tangible components of voice therapy. Meta-therapy refers to the conversations had between patient and provider regarding these therapeutic approaches. PAGE 1090","bn":91},{"n":91,"s":"The singer’s formant is composed of which formants?","o":["FO, Fl, F2","FI, F2, F3","F3, F4, FS","F4, F5, F6","GO, G1, G2"],"k":"C","x":"Vowels have characteristic first-and second-formant frequencies. These are represented as F1 and F2. The vowel is determined by the absolute FI and F2 as well as the relative relationship between them (Fig. 72.1). The higher formants (F3-F5) are responsible for the timbre of the sounds and differences in the sound characteristics between speakers. Classically trained singers learn to cluster the third, fourth, and fifth formant regions to amplify the harmonic sounds frequencies between 2,800 and 3,500 Hz4. PAGE, Average male Average female speaking pitch speaking pitch Soprano Ny Mezzo-soprano \\ ‘Ato Tenor Baritone nN Bass","xi":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/wAALCAF5AqMBAREA/8QAHQABAAIDAQEBAQAAAAAAAAAAAAUGBAcIAwIBCf/EAFYQAAEDAwICAwgMCwYFAwUAAwECAwQABREGEhMhMUF0BwgUIjY3UbMVFjI1YXFzdZWxstMjNFRVVnKBkZS00TNCUlOSoRgkk8HCJWOEJkNigsMXovH/2gAIAQEAAD8A6RpSlKUpSlKUpSlKUpSlKUpSlKUpSlM0pSlKUpSlKUpSlKUpSlKUpSlKUpSlKUpSlKUpSlKUpSlKUpSlVjX095jTybfDbfemXV5MNtuOQHSg5U6UkkAENJWQcjniqlbtY3ax2NiC8wvjxuNaW2ZIBdMsbVRAsgkHe0oEnJ5jprJZ1pqAXV1DnDLbcmVDU2oMoH4JCyHAOJxColAUQUY2r5dAJxrnre+2yzsyVT2n5LVvZuD6UR222hxSrahRW4FFPikDYCrPM9QrOm6zu0WcJCJcVwG5yIPsWGxxShptxSSFZzuVsSroxtWMekyGh9S3a9TFNz1NutOQ2paVDggoUonkA24s7D1FWD4p6eqPavup5s1lLd1isNy3LilKRECi e TA-LCA muscle complex relaxes, and the vocal folds are held in nearly approximated position by the interarytenoid muscle. The head voice roughly correlated to the range in which the TA-LCA muscle complex is employed to decrease the glottal distance as the CT muscle lengthens the vocal folds. The area between these two ranges is termed the mixed voice range. At the beginning and the end of the mixed range, the notes involved are termed the passaggio or passage. These characteristic points help to determine the voice user’s range and quality. PAGE 1098","bn":93},{"n":93,"s":"Which is the most efficient mechanism for the regulation of subglottic pressure?","o":["Diaphragm and intercostal muscle contraction","Diaphragm relaxation and abdominal contraction","Increased force of vocal fold adduction","Contraction of extralaryngeal musculature","Vocal fold abduction"],"k":"B","x":"As the diaphragm and intercostal muscles are relaxed, the thorax passively recoils to its resting size. During voice production, the rate of recoil is resisted through incremental relaxation of the muscles of inspiration and through contracting the muscles of the abdominal cavity. This phenomenon is referred to as respiratory support and is believed to be the most efficient mechanism for the regulation of subglottic pressure.","bn":94},{"n":94,"s":"The voicing technique that involves keeping the vocal fold long and stiff with vibration occurring only at a thin medial edge is called:","o":["Falsetto register","Flageolet register","Head voice","Chest voice","Puberphonia"],"k":"A","x":"Male voices have an additional register on top of the head voice referred to the as the falsetto voice. It is often described as breathy and less brilliant or full in sound. The majority of the vocal fold remains long and stiff with vibration occurring only at a thin medial edge with less complete vocal fold approximation compared to head voice. It is frequently used to imitate the female voice. PAGE","bn":95},{"n":95,"s":"The highest female voices in Western classical music are called:","o":["Altos","Tenors","Basses","Sopranos","Contralto"],"k":"D","x":"For men, the lowest voices in classical singing are termed bass voices, the medium-pitched voices are termed baritone voices, and the higher voices are termed tenor voices. In women, the lower voices are termed contralto or alto voices, whereas the higher voices are termed soprano voices (Fig. 72.3). PAGE 1098 6 ie 6 6 =a ‘ow * ‘ HFEFs0 ‘ ‘ Fer, us 2 2 2 2 VFFFeo Inspr 3 J flow 2 2 2 2 us, 7 PIF 4 FIFso a 6 6 6 6 Volume Volume Volume Volume.) A B c D","bn":96},{"n":96,"s":"Mimics of primary muscle tension dysphonia can include which of the following?","o":["Spasmodic dysphonia/laryngeal dystonia","Stuttering","Vocal fold paralysis","Velopharyngeal insufficiency","Laryngeal pharyngeal reflux disease"],"k":"A","x":"Primary muscle tension dysphonia can sound like a type of spasmodic dysphonia/laryngeal dystonia called chronic constricted. PAGE 1120","bn":97},{"n":97,"s":"Which of the following is a characteristic finding in age-related vocal fold changes?","o":["Posterior commissure erythema","Increased mucosal wave vibration on stroboscopy","Vocal fold immobility","Vocal fold hemorrhage","Vocal fold—enhanced vascular ectasia"],"k":"B","x":"Vocal fold atrophy associated with age will often display increased mucosal wave vibration on stroboscopy due to the reduced mass of the vocal fold. PAGE 1110","bn":98},{"n":98,"s":"Fundamental aspects of communication that should be addressed in gender-affirming voice care include:","o":["Correct pronunciation of words","Elimination of foreign or regional accents","Resonance","Ensuring access of extreme high and low ends of pitch range","Guttural sounds alterations"],"k":"C","x":"Gender affirming voice care focus on resonance and pitch perception without strain or increased effort. PAGE 1115","bn":99},{"n":99,"s":"What is the fundamental cause of secondary muscle tension dysphonia?","o":["Previous episode(s) of hoarseness","Glottic insufficiency with incomplete vocal fold closure","Chronic tobacco use","Autoimmune disease","Anxiety"],"k":"B","x":"Secondary muscle tension dysphonia is centrally related to poor/reduced vocal fold closure during phonation. PAGE","bn":100},{"n":100,"s":"Following appropriate evaluation, optimal outcomes in management of primary muscle tension dysphonia are typically achieved by:","o":["Thyroplasty","Oral steroids","Voice rest","Voice therapy","PPI medications"],"k":"D","x":"Voice therapy, usually performed by a voice specialized SLP, is the primary and typically the sole treatment for primary muscle tension dysphonia. PAGE 1119","bn":101},{"n":101,"s":"Which technique is not a method of application of topical anesthesia for awake laryngeal procedures?","o":["Transtracheal injection","Superior laryngeal nerve block","Application via injection port of a flexible scope","Nebulization of topical anesthesia","Application via Abraham cannula"],"k":"B","x":"All methods above except option B rely on direct application of topical anesthesia to the mucosa of the upper airway. PAGES 1126-1127","bn":102},{"n":102,"s":"For the thyrohyoid approach to vocal fold injection, which of the following is the key anatomical landmark to localize the percutaneous insertion point of the needle?","o":["Cricoid cartilage","Trachea","Thyroid notch of the thyroid cartilage","Cricothyroid membrane","Vocal process of the vocal fold"],"k":"C","x":"The thyroid notch must be able to be palpated and accessed to perform a thyrohyoid vocal fold injection. PAGES 1131-1132","bn":103},{"n":103,"s":"For treatment of benign vocal fold pathology with intralesional injection of steroid, the location of injection should be:","o":["Within the vocal fold muscle","In the paraglottic space","At the depth of the vocal fold ligament","In the subepithelial plane","At the vocal process of the vocal fold"],"k":"D","x":"Past research has demonstrated success with this approach when steroid is deposited in the subepithelial plane near or at the vocal fold lesion of interest. PAGE 1133","bn":104},{"n":104,"s":"Which of the following lasers has a wavelength of 532 nm?","o":["Carbon dioxide","Potassium titanyl phosphate (KTP)","Pulse dye laser (PDL)","Thulium","Yttrium aluminum garnet laser"],"k":"B","x":"The KTP laser wavelength is 532 nm.","bn":105},{"n":105,"s":"Advantages of awake laryngeal procedures include all of the following except:","o":["They provide real-time feedback to the surgeon","They avoid the risk of airway compromise during general anesthesia","They can often be done in the office setting","A still surgical field allows for the most precise","Surgery"],"k":"D","x":"Awake procedures have the one limitation of not providing a perfectly still surgical site. PAGE 1135","bn":106},{"n":106,"s":"Which pair of lasers share water as their target chromophore?","o":["Thulium and carbon dioxide","PDL and KTP","Thulium and KTP","PDL and thulium","Ruby and carbon dioxide"],"k":"A","x":"Thulium and CO₂ laser have water as their target chromophore. PAGE 1135","bn":107}]},{"t":"Trauma","q":[{"n":1,"s":"Which of the following is the most fundamental neuroendocrine reaction to trauma?","o":["The release of catecholamines","Decreased heart rate","Inhibition of gluconeogenesis","Vasodilation"],"k":"A","x":"The most fundamental neuroendocrine reaction to trauma is the release of catecholamines, which causes vasoconstriction, increases cardiac rate, increases myocardial contractility and conductivity, and stimulates gluconeogenesis. PAGE 1144","bn":1},{"n":2,"s":"When a trauma patient is approached at the incident scene, what is the most appropriate first step in management?","o":["Assess for shock","Detailed physical examination with the patient fully exposed","Airway establishment","Assess neurological function"],"k":"C","x":"The foremost emergency measure after trauma is airway establishment. The primary risk during early airway management is movement of the neck when there is an occult cervical spinal fracture. When the airway is being controlled, it must be assumed that such a fracture exists. PAGE 1143","bn":2},{"n":3,"s":"A trauma patient arrives in the emergency room, and their total erythrocyte count is 100,000/mL. Which of the following is the next best step?","o":["Thoracic arteriography","Laparotomy","Resuscitation","Administration of methylprednisolone"],"k":"B","x":"A total erythrocyte count of 100,000/mL is the accepted positive result for blunt injuries and indicates that laparotomy is needed. Patients with positive peritoneal lavage results need exploratory laparotomy. Those with negative peritoneal lavage results can be admitted for observation. PAGE 1154","bn":3},{"n":4,"s":"A patient experiencing hemorrhagic trauma also begins to experience paresthesia or sensory deficit in the limb following cast application. Which of the following describes this condition?","o":["Abdominal injury","Neurogenic shock","Cervical spinal injury","Compartment syndrome"],"k":"D","x":"The earliest sign of compartment syndrome is the patient’s report of paresthesia or sensory deficit in the limb. Loss of peripheral pulse is a relatively late finding and often implies irreversible damage to the limb. Compartment syndrome occurs most often with closed fractures of the tibia and fibula. Amputated body parts must be kept in a moist and sterile towel and placed in crushed ice until definitive reimplantation can be provided. PAGE 1154","bn":4},{"n":5,"s":"A child at a trauma scene requires airway management. Which of the following would be the most appropriate procedure for a child?","o":["Needle cricothyrotomy","Surgical cricothyrotomy","Tracheotomy","Percutaneous tracheal ventilation"],"k":"A","x":"Needle cricothyrotomy is the best procedure for children; surgical cricothyrotomy is preferred for adults. Needle cricothyrotomy is performed by placing a number 12 or number 14 intravenous cannula with a plastic sheath through the cricothyroid membrane into the tracheal lumen. Once in the airway, the needle is withdrawn and the plastic sheath is advanced. When properly positioned, the sheath is connected with intravenous tubing to wall or bottled oxygen at 50 pounds per inch of pressure (about 15 L oxygen per minute). Ventilation is accomplished by means of 1-second intermittent injections of oxygen followed by 4-second exhalations. Patients can be maintained for up to 30 minutes with this technique, after which hypercapnia becomes a problem. PAGE 1156","bn":5},{"n":6,"s":"A level I trauma patient has been life-flighted to the emergency department after sustaining an motor vehicle collision with known loss of consciousness and suspected cervical spine injuries. The unidentified patient is in a C-collar on arrival. Upon questioning, the patient becomes rapidly obtunded and is unable to answer questions, your first intervention should be to:","o":["Establish two IV access points","Give supplemental oxygen","Establish a safe airway","Assess for pulse","All of the above"],"k":"E","x":"All of the above with an emphasis on establishing an airway in the setting of facial trauma and new-onset changes in mental status. Remember to follow the Airway, Breathing, Circulation, Disability, Exposures of trauma in all facial trauma patients. PAGE,","bn":6},{"n":7,"s":"A patient presents less than 2 hours after an alleged assault. The patient lost consciousness, but thinks they were punched several times in the face. The patient has a 1-cm open laceration on the bridge of the nose and a suspected nasal bone fracture but no other suspected injuries. How should the laceration be addressed to decrease the risk for wound infection?","o":["To the operating room for wash out and closure","Bedside wash out with normal saline and closure","Hydrogen peroxide rinses and leave open to healing by second intention","Betadine rinses and leave open to healing by second intention"],"k":"B","x":"Bedside wash out with normal saline and primary closure is appropriate in this setting to reduce risk of infection and promote wound healing. PAGE 1160","bn":7},{"n":8,"s":"Prophylactic antibiotics are recommended in which setting?","o":["Grossly contaminated wounds","Wounds crossing mucosal barriers","Patients with a history of prosthetic devices","Patient who is immunocompromised","All of the above"],"k":"E","x":"All of the above. PAGE 1162","bn":8},{"n":9,"s":"In general, scalp wounds with tissue loss can be closed primarily up to:","o":["1 cm² defect","2 cm² defect","3 cm² defect","4 cm² defect"],"k":"C","x":"The scalp is known for its inelasticity. Therefore, in wounds greater than 3 cm2, skin grafts or local flaps should be considered. For extremely large wounds, free tissue transfer may be warranted. PAGE 1165","bn":9},{"n":10,"s":"In a patient with periorbital trauma, intraocular pressures greater than should be a consideration for immediate lateral canthotomy and cantholysis.","o":["10 to 20 mm Hg","20 to 30 mm Hg","0 to 10 mm Hg","Greater than 40 mm Hg"],"k":"D","x":"Intraocular pressures greater than 40 mm Hg should be a consideration for immediate lateral canthotomy and cantholysis. PAGE 1168","bn":10},{"n":11,"s":"Which of the following prompts emergent operative intervention in penetrating head and neck trauma?","o":["Facial nerve paralysis","Dysphagia","Hoarseness","Hypotension"],"k":"D","x":"Hypotension in the setting of penetrating head and neck injury likely represents hemorrhagic shock secondary to vascular injury. In patients who are hemodynamically unstable, additional diagnostic testing is deferred in favor of proceeding to the operating room as a potential lifesaving measure. Table 77.1 lists “hard signs” in penetrating head and neck trauma, which necessitate immediate operative intervention. Focal neurologic deficits (facial nerve paralysis), dysphagia, and hoarseness represent soft signs, which do not pose immediate life-threatening risk and can be evaluated with other diagnostic modalities. PAGE 1188","bn":11},{"n":12,"s":"What is the gold standard in imaging assessment of penetrating head and neck trauma?","o":["Color Doppler ultrasound","Computed tomography (CT) angiography","Magnetic resonance angiography","Catheter angiography"],"k":"B","x":"Currently, CT angiography represents the gold-standard imaging modality for evaluation of penetrating head and neck injuries and has the highest level of recommendation. CT angiography has good sensitivity, has high resolution, and is efficient. CT angiography can yield valuable information of vascular and nonvascular structures such as the upper aerodigestive tract and surrounding osseous structures. PAGE 1188","bn":12},{"n":13,"s":"What is the most common cause of death in penetrating neck injury?","o":["Sepsis","Cerebral ischemia","Airway obstruction","Exsanguination","Spinal cord injury"],"k":"D","x":"The major cause of death in patients with penetrating neck trauma is exsanguinating hemorrhage from a vascular injury. Other causes include spinal cord injury, cerebral ischemia, airway obstruction, air embolism, and pulmonary embolism. PAGE 1188","bn":13},{"n":14,"s":"A patient presents with a penetrating gunshot wound to zone II. He is successfully intubated, blood pressure 130/80, pulse 80, with physical examination showing small area of bleed from his neck wound, which has slowed down with packing. What is the best next step?","o":["Proceed emergently to operating suite for neck exploration.","Proceed to CT angiogram.","Remove neck packing at bedside and identify source of bleed.","Perform a rigid or flexible esophagoscopy to identify upper aerodigestive tract injuries."],"k":"B","x":"For patients who are clinically stable (with stable vital signs, nonexpanding hematomas or bleeding wounds, which can be controlled with conservative/nonoperative measures), the next best step would be to obtain a CT angiogram to evaluate for injuries to vascular and nonvascular structures. For patients who are hemodynamically stable, there is no need to proceed emergently to operating room before a more comprehensive diagnostic workup is complete with imaging. Removal of packing or blunt instrumentation from the wound or probing of wound tracts is not recommended to avoid precipitating significant bleeding and propagating injury. Although a rigid or flexible esophagoscopy are sensitive in detecting upper aerodigestive tract injuries, a CT angiogram can yield valuable information of nonvascular structures such as the upper aerodigestive tract and surrounding osseous structures as well as vascular structures, which makes it the best diagnostic modality in this setting. PAGE 1189","bn":14},{"n":15,"s":"Which of the following structures can be found in zone II of the neck?","o":["Thyroid","Larynx","Salivary glands","Thoracic duct"],"k":"B","x":"Zone II of the neck contains carotid sheath structures including the common and internal carotid artery, internal jugular vein, vagus nerve, esophagus, trachea, and the larynx. Table 77.3 lists key structures located in each anatomic neck zone. PAGE 1188","bn":15},{"n":16,"s":"Pre-and postreduction images of a left subcondylar fracture are shown. What approach listed would provide the best access for open reduction and internal fixation (ORIF) of this fracture?","o":["Preauricular","Retromandibular","Submandibular","Intraoral"],"k":"B","x":"A retromandibular approach is the best access for ORIF of a subcondylar fracture. PAGE 1226","bn":16},{"n":17,"s":"A patient presents to your office to discuss possible revision of ascar of the right lateral eyebrow that is widened with alopecia of the eyebrow scar in this area. The patient’s history is notable for ORIF of a right zygomaticomaxillary complex fracture 5 years ago. What alternative incision is available to access the lateral orbital rim that might result in a better-appearing scar?","o":["Lynch incision","Transcaruncular incision","Upper gingivobuccal sulcus incision","Lateral upper blepharoplasty incision"],"k":"D","x":"The lateral upper blepharoplasty incision would hide the scar in the supratarsal crease. The other incisions would not allow access to the lateral orbital rim. PAGE 1218","bn":17},{"n":18,"s":"A patient with a fracture of the left mandibular body complains of hypesthesia of the lower lip after ORIF, which was not a symptom preoperatively. What explanation could account for the new-onset lower lip numbness?","o":["Dehiscence of the intraoral wound","Cold sensitivity related to the titanium plate","Persistent mobility of the fracture ends","Injury of the mental nerve"],"k":"D","x":"The mental nerve supplies sensation to the lower lip. PAGE 1224","bn":18},{"n":19,"s":"A submandibular approach is utilized to expose comminuted fractures of the left mandibular body and angle. At the 1-week follow-up visit, the patient is concerned that the mouth is “twisted” during smile. Physical examination shows asymmetric elevation of the left oral commissure. How can this type of problem be avoided?","o":["Ensure that paralytic agents are given throughout the case to reduce muscle pull and facilitate fracture reduction.","Proper repair of the masseter muscle during closure.","Dissection below the superficial layer of the deep cervical fascia and anterior facial vein.","Making the cervical incision immediately below the lower border of the mandible."],"k":"C","x":"Dissection below the superficial layer of the deep cervical fascia and anterior facial vein helps to protect the facial nerve. PAGE 1225","bn":19},{"n":20,"s":"You are having a preoperative discussion with a patient prior to repair of a fracture of orbital floor. What is a risk of the subciliary incision that you should discuss with the patient?","o":["Hidden scar","Ectropion","Hypesthesia in the distribution of the infraorbital nerve","Lagophthalmos"],"k":"B","x":"A subciliary incision placed in the skin under the lashes and with scar contracture can cause ectropion. PAGE 1221","bn":20},{"n":21,"s":"The third molars are numbered as follows in the universal system:","o":["8, 9, 24, 25","18, 28, 38, 48","A,J,K,T","1, 16, 17, 32","5, 12, 22, 27"],"k":"D","x":"Using the universal system, D is the third molars. A is central incisors; B is the Federation Dentaire International system. C is deciduous teeth, and there are no third molars in the deciduous teeth. E is bicuspids. PAGE 1231","bn":21},{"n":22,"s":"Three-dimensional renderings of CT scans should have cuts of 1.5 mm or less because:","o":["Thinner cuts cause less radiation exposure","Thicker cuts give a better view of the anatomy and injuries","Thinner cuts reduce potentially inaccurate algorithmic bridging between cuts","Thinner cuts result in a faster scan","Thinner cuts save cost over thicker cuts—no, thin cuts would cost the same or more"],"k":"C","x":"Thinner cuts provide more anatomic detail to the 3D rendering, cause more radiation exposure, are the same duration of examination, and cost the same. PAGES 27 and 1234","bn":22},{"n":23,"s":"Zygomaticomaxillary complex fractures involving the orbital floor often result in:","o":["Lateral displacement of the zygoma resulting in a decrease in orbital volume","Lateral displacement of the zygoma resulting in an increase in orbital volume","Medial displacement of the zygoma resulting in a decrease in orbital volume","Medial displacement of the zygoma resulting in no change in orbital volume","Medial displacement of the zygoma resulting in an increase in orbital volume"],"k":"C","x":"Medialization of the zygoma decrease orbital volume and can occur with ZMC fractures. Lateral displacement of the arch rarely occurs with orbital floor fractures. PAGE 1249","bn":23},{"n":24,"s":"The most common fracture pattern of the zygomatic arch is:","o":["One fracture resulting in two segments with inward displacement","Two fractures resulting in three segments with a V-pattern segment","Comminuted fracture","Three fractures resulting in two segments in a V-pattern segment","One fracture with no displacement"],"k":"B","x":"Two fractures resulting in three segments with a V-pattern segment is the most common pattern of fractures of the zygomatic arch. PAGE 1249","bn":24},{"n":25,"s":"A common risk of the coronal approach to zygomaticomaxillary fractures is:","o":["Risk of injury to the temporal branch of the facial nerve","Hair loss","Numbness along incision","Blood loss","Infection"],"k":"A","x":"The temporal branch of the facial nerve runs deep to the superficial musculoaponeurotic system in the cheek, the temporal parietal fascia in the temporal region and the galea in the forehead. When approaching the arch from a coronal incision, it is important to incise the periosteum on the superior aspect of the zygomatic arch so that the plane of elevation over the arch is deep to the periosteum as the superficial musculoaponeurotic system/temporal parietal fascia become compresses. PAGE 1263","bn":25},{"n":26,"s":"All of the following are incisions that can be used in repair of zygomaticomaxillary complex (ZMC) fractures except:","o":["Subciliary incision","Gingivobuccal incision","Coronal incision","Transcolumellar incision","Blepharoplasty incision"],"k":"D","x":"A transcolumellar incision is for rhinoplasty. PAGE","bn":26},{"n":27,"s":"All of the following articulate with the zygoma except:","o":["Sphenoid","Frontal bone","Maxilla","Infraorbital rim","Palatine bone"],"k":"E","x":"The palatine bone does not articulate with the zygoma. PAGE 1248","bn":27},{"n":28,"s":"Pure Le Fort midface fractures (types I, II, and III) have these fractures in common:","o":["Palate and nasal bones","Alveolar ridge and nasal septum—no, septum yes, alveolar ridge no","Pterygoid plates and orbits—no, pterygoids yes, orbits are not fractured in a Le Fort I fracture","Lateral orbital rim and ethmoid bone","Nasal septum and pterygoid plates"],"k":"E","x":"These structures are fractured in all three Le Fort type fractures. Answers A and D are not involved in Le Fort I. PAGE 1248","bn":28},{"n":29,"s":"Which is a component of the zygomatico-malar complex fracture?","o":["Inferior orbital rim","Medial orbital rim—no, not a component","Superior orbital rim—no, not a component","Medial maxillary buttress—no, not a component","Lateral pterygoid plate—no, not a component"],"k":"A","x":"The components are the inferior and lateral orbital rims, the lateral maxillary buttress, and the zygomatic arch. Options B, C, D, and E are not components. PAGE 1249","bn":29},{"n":30,"s":"What is the most common long-term complication of maxillofacial trauma repair?","o":["Malunion","Nonunion","Fibrous union","Osteomyelitis","Malocclusion"],"k":"A","x":"Inadequate reduction and/or fixation results in nonanatomic healing are the most common. C is a subcategory of nonunion and thus less frequent than malunion. D is rare. E is usually caused by malunion, the malunion category includes misaligned non— tooth-bearing bone as well that therefore will not cause malocclusion. PAGES 1261-1263","bn":30},{"n":31,"s":"A 21-year-old male presents following assault with a displaced noncomminuted right ZMC fracture. There is severe displacement at the zygomaticofrontal and zygomaticosphenoid sutures. What is the preferred approach for ORIF of the zygomaticofrontal suture?","o":["Transconjunctival","Lateral brow","Upper blepharoplasty","Coronal"],"k":"C","x":"The upper blepharoplasty approach provides excellent exposure of both the zygomaticofrontal and zygomaticosphenoid sutures for reduction of displaced ZMC fractures. The lateral brow approach provides adequate exposure but with the risk of alopecia and a more visible scar. The transconjunctival approach provides excellent exposure of the orbital floor but not the zygomaticofrontal and zygomaticosphenoid sutures. The coronal approach provides excellent exposure but is time consuming, has much greater morbidity, and would therefore be unnecessary for repair of an isolated ZMC fracture. PAGE 1278","bn":31},{"n":32,"s":"A 75-year-old female is unrestrained in a car accident and sustains impact to the central midface. A comminuted nasoorbitoethmoid (NOE) fracture is identified on a maxillofacial CT scan. The fracture extends into the bone fragment where the medial canthal tendon inserts. What is the most appropriate surgical technique to restore the contour of the medial canthus?","o":["Transnasal medial canthopexy","ORIF of bone fragment containing medial canthal tendon with miniplate","External splints","Insertion and miniplate fixation of a calvarial bone graft"],"k":"A","x":"Transnasal medial canthopexy securing the medial canthal tendon medially and posteriorly with wire is the preferred technique to restore the contour and position of the medial canthus for a type III NOE fracture as described in the question. ORIF with miniplates of a bone fragment containing the medial canthal tendon attachment would be appropriate for a type I and possibly some type II fractures. External splints can be used to promote soft tissue adherence and reduce edema following internal fixation and/or canthopexy but would not be effective alone for restoration of medial canthal contour. While calvarial bone grafts are useful to restore projection of the nasal dorsum in patients with NOE fractures, bone grafting alone would not restore medial canthal contour. PAGE 1278","bn":32},{"n":33,"s":"There is a higher risk of lower lid malposition following what approach to the orbital floor?","o":["Transconjunctival","Subciliary","Transantral","Orbital rim"],"k":"B","x":"Transcutaneous approaches that require traversing the orbicularis oculi muscle near the lower eyelid margin (eg, subciliary, subtarsal) are more frequently associated with postoperative lower lid malposition in the form of retraction and/or ectropion. Although less common, the transconjunctival approach can cause entropion. The transantral approach is rarely indicated but is performed via a sublabial incision that does not carry a risk of lower lid malposition. The orbital rim incision is unlikely to cause lid malposition but is not recommended due to the risk of highly visible scarring. PAGE 1275","bn":33},{"n":34,"s":"A 30-year-old male presents to the emergency department following an assault. A CT maxillofacial demonstrates an orbital blowout fracture. Color perception testing reveals that the patient sees a dull brown color when presented with a bright red object. What ocular injury might be present?","o":["Hyphema","Corneal abrasion.","Retinal detachment","Optic neuropathy"],"k":"D","x":"Color perception is a useful bedside test. There may be damage to the optic nerve, or optic neuropathy, present if a patient sees dull brown when presented with a bright red object. Hyphema, or blood in the anterior chamber, can be diagnosed with a slit lamp examination. Corneal abrasion causes pain and a foreign body sensation. Patients with retinal detachment often see floaters. PAGE 1271","bn":34},{"n":35,"s":"The dissection plane in the transcaruncular approach to the medial orbital wall is immediately posterior to what structure?","o":["Horner muscle","Anterior limb of the medial canthal tendon","Lacrimal sac","Medial rectus muscle"],"k":"A","x":"The transcaruncular approach has largely replaced the Lynch incision as the standard for access to the medial orbital wall because it eliminates the potential for visible scarring and webbing associated with a transcutaneous incision in this area. Care must be used to avoid injury to the lacrimal apparatus by following the proper dissection plane immediately posterior to Horner muscle (Fig. 82.20) down to the posterior lacrimal crest. Horner muscle is a component of the posterior limb of the medial canthal tendon. While the approach is also posterior to the lacrimal sac and anterior to the limb of the medial canthal tendon, it does not proceed immediately posterior to either of these structures. Dissection never proceeds medial to the medial rectus muscle during the approach. PAGE 1277","bn":35},{"n":36,"s":"Nasal bone fractures that are most likely to be associated with other facial fractures are:","o":["Displaced nasal fractures","Fractures of the caudal aspect of the nasal bones","Fractures of the cephalic end of the nasal bones","Fractures of the nasal sidewall"],"k":"C","x":"The cephalic end of the nasal bones is thicker than the thin caudal end. For this reason, more force is required to fracture the nasal bones at their cephalic end. This therefore implies greater risk of facial bone fractures. PAGE 1285","bn":36},{"n":37,"s":"The decision to reduce a nasal fracture is based on:","o":["A facial bone CT scan","History and clinical examination","Plain radiographs","The age of the patient"],"k":"B","x":"New change in alignment of the nose externally and new-onset nasal airway obstruction are the two most important indications for surgical intervention. Both of these can be determined with an attentive history and physical examination. While radiographs may complement the examination and corroborate the diagnosis, they are not routinely required or essential to direct the management of isolated nasal bone fractures. PAGE 1288","bn":37},{"n":38,"s":"The clinical finding most suggestive of a septal fracture is:","o":["A compound fracture","A tear in the septal mucoperichondrium","Bilateral nasal bone fractures","Epistaxis"],"k":"B","x":"In a 2004 Korean study, all patients undergoing surgical treatment of isolated nasal bone fractures had the septum explored via a hemitransfixion incision. In that study, mucosal tears, noted either on rhinoscopy or endoscopic examination, were the clinical finding most suggestive of an associated septal fracture. PAGE 1288","bn":38},{"n":39,"s":"Septal fractures are most commonly seen:","o":["Above the interface with the maxillary crest","At the caudal septum","At the junction of the cartilage with the perpendicular plate of the ethmoid bone","Right where the cartilage interfaces with the maxillary crest"],"k":"A","x":"Dislocations are more commonly seen where the quadrangular cartilage is thicker—right at the bony-cartilaginous interfaces. Septal fractures on the other hand are more common in areas where the cartilage is thinner—the central portion of the quadrangular cartilage above the maxillary crest. PAGE 1288","bn":39},{"n":40,"s":"Regarding nasal fractures in children:","o":["Earlier intervention is required as compared to adults","Epistaxis occurs more often than with adult nasal fractures","Imaging is of greater benefit than in adults because the clinical examination can be more challenging","The incidence is higher than in adults as accidental injury is more common in childhood"],"k":"A","x":"Facial and nasal fractures are each less common in children than in adults. With respect to nasal fractures, both the clinical examination and imaging can be unreliable. Pediatric nasal bone fractures begin to heal and unite much quicker than in adults, so earlier intervention is recommended when necessary. PAGE 1290","bn":40},{"n":41,"s":"All of the following are anatomic parameters in deciding frontal sinus fracture management except:","o":["Anterior table of frontal sinus","Posterior table of frontal sinus","Frontal sinus outflow tract","Integrity of intersinus septum","Cerebrospinal fluid (CSF) leak"],"k":"D","x":"Integrity of intersinus septum. PAGE 1299","bn":41},{"n":42,"s":"Which of the following is not a method used to outline the frontal sinus in preparation for sinusotomy cuts when performing an obliteration or cranialization?","o":["6-foot penny Caldwell","Towne view radiography","Mechanical palpation","Surgical navigation","Transillumination"],"k":"B","x":"Towne view radiograph. PAGE 1305","bn":42},{"n":43,"s":"Potential complications of the coronal approach to the frontal sinus include the following except:","o":["Paresthesias of the scalp","Alopecia","CSF leak","Hypertrophic scarring","Facial nerve injury"],"k":"C","x":"CSF leak. PAGE 1310","bn":43},{"n":44,"s":"For which of the following fractures would observation be appropriate?","o":["Anterior table fracture displaced by 7 mm with minimal comminution","Posterior table fracture with CSF leak, significant pneumocephalus, and severe comminution","Anterior table fracture displaced 2 mm with comminution","Frontal sinus outflow tract fracture with complete obstruction"],"k":"C","x":"Anterior table fracture displaced 2 mm with comminution. PAGE 1311","bn":44},{"n":45,"s":"Which of the following is true regarding management of frontal sinus fractures?","o":["Mucoceles can occur decades after treatment of frontal sinus fractures.","All frontal sinus outflow tract fractures require obliteration.","An upper blepharoplasty incision provides excellent access to the medial and superior frontal bone.","Traumatic CSF leaks rarely spontaneously heal without surgical intervention.","Endoscopic brow approaches can be used for acute treatment of anterior table fractures and secondary camouflage."],"k":"A","x":"Mucoceles can occur decades after treatment of frontal sinus fractures. PAGE 1318","bn":45}]},{"t":"Pediatric Otolaryngology","q":[{"n":1,"s":"Choanal atresia or choanal stenosis can result from which of the patterns of abnormal development?","o":["Lateralization of the vomer","Lateralization of the posterolateral nasal wall","Lateralization of the pterygoid plates","Medialization of the inferior turbinate"],"k":"A","x":"Lateral growth of the vomer results in narrowing of the choana, which can cause stenosis or atresia. Lateralization of the posterolateral nasal wall and pterygoid plates widens. PAGE 1387","bn":1},{"n":2,"s":"An 18-month-old child presents with parental concerns for speech delay. Which of the following is a finding that could be concerning for autism spectrum disorder (ASD)?","o":["The child has not uttered any words at the time of the encounter.","The child responded to sounds and pointed toward noises at 11 months of age.","The child smiled at 5 months of age.","The child knows the words “mama” and “dada.”"],"k":"A","x":"Children should begin to utter words before 18 months of age. Option A is abnormal development. Options B, C, and D are examples of normal development. PAGE 1339","bn":2},{"n":3,"s":"Which of the following is a primary language disorder?","o":["Receptive language disorder with a focal neurologic deficit","Hearing loss leading to speech delay","Cerebral palsy causing an inability to generate voice","Trisomy 21 with developmental delay"],"k":"A","x":"Options B, C, and D represent secondary language disorders, whereas option A represents a primary language disorder. PAGE 1337","bn":3},{"n":4,"s":"Which of the following is completely developed at the time of birth?","o":["Eustachian tube","Mastoid antrum","Mastoid tip","Ossicular chain"],"k":"D","x":"The ossicular chain is completely developed at birth, whereas the other structures continue to develop after birth. PAGE","bn":4},{"n":5,"s":"Which of the following is the most common cause of congenital stridor in neonates?","o":["Subglottic stenosis (SGS)","Laryngomalacia","Tracheal stenosis","Vocal cord paralysis"],"k":"B","x":"The most common causes of stridor in neonates are laryngomalacia, vocal cord paralysis, and SGS. Laryngomalacia is far and away the most common etiology. PAGE 1347","bn":5},{"n":6,"s":"Which of the following is the most common comorbidity in infants with laryngomalacia?","o":["Prematurity","Congenital heart disease","Neurologic disease","Gastroesophageal reflux disease (GERD)"],"k":"D","x":"GERD is extremely common in this population with studies quoting anywhere between 65% and 100%. Treatment of GERD is an important component of treating these children. Congenital heart disease and neurologic disease are risk factors for poor outcomes following supraglottoplasty. PAGE 1347","bn":6},{"n":7,"s":"Laryngeal webs have a well-established relationship with which of the following syndromes?","o":["22q11 deletion syndrome","Down syndrome","CHARGE association","VACTERL association"],"k":"A","x":"Laryngeal webs are rare but more commonly found in patients with the 22q11 deletion exhibiting velocardiofacial syndrome. Children with Down syndrome and CHARGE do have higher rates of airway lesions than the rest of the population but not laryngeal webs. VACTERL association can have higher rates of laryngeal clefts and TEFs. PAGE 1350","bn":7},{"n":8,"s":"What is the most common natural history/presentation of subglottic hemangiomas?","o":["Symptomatic stridor at birth, proliferate for about 6 to 12 months followed by involution","Symptomatic stridor at birth, proliferate until treated","Asymptomatic at birth, stridor develop symptoms in first few months of life during proliferation for up to 6 to 11 months followed by involution phase beginning at | year.","Asymptomatic at birth, develop symptoms in first few months followed by proliferation until treated"],"k":"C","x":"Subglottic hemangiomas are [Hs that follow a characteristic growth pattern. They are absent or minimal at birth and then rapidly grow over the first few months of life where they become symptomatic. There is then slow growth up to | year when they reach the involution phase. In the airway, this growth correlates with the degree of airway obstruction. PAGE 1351","bn":8},{"n":9,"s":"There is literature demonstrating delayed breakdowns of successful laryngotracheoesophageal cleft repairs. What is the suggested minimum duration of follow-up to not miss this occurrence?","o":["6 months","| year","2 years","4 years"],"k":"D","x":"de Alarcon et al showed that type III laryngotracheoesophageal clefts can break down up to 48 months after repair. Lower-grade clefts tend to breakdown earlier but prudent to monitor these patients for symptoms of late breakdown. PAGE 1355","bn":9},{"n":10,"s":"A 2-month-old infant presents with a midline nasal lesion which does not increase in size or change color with crying. Which of the following is the next best step in workup?","o":["Fine needle aspiration","Excisional biopsy","Magnetic resonance imaging (MRI)","Computed tomography (CT)"],"k":"C","x":"The history suggests a nasal dermoid or glioma. The next appropriate step would be to obtain imaging to rule out intracranial communication, which is best characterized by MRI. Surgical manipulation should be deferred until that point. PAGE 1363","bn":10},{"n":11,"s":"An infant presents with a midline nasal lesion. Which of the following clinical features would warrant more prompt surgical management?","o":["Negative Furstenberg sign","Associated defect through cribriform plate on CT","Hyperintense on T2-weighted MRI","Presence since birth"],"k":"B","x":"A midline nasal lesion with an associated skull base defect seen on CT implies an encephalocele, unlike all the other responses that do not necessarily raise this concern. Encephaloceles carry risk of growth and serious infection (meningitis, osteomyelitis, abscess formation) if left untreated. PAGE 1363","bn":11},{"n":12,"s":"Nasal gliomas are mostly found in which location?","o":["Intracranial","Intranasal","Extranasal","Combined intra-and extranasal"],"k":"C","x":"Nasal gliomas are most seen extranasally, followed by intranasal lesions, and least commonly combined, in a 6:3:1 ratio. PAGE 1361","bn":12},{"n":13,"s":"A midline pit over the nasal dorsum is suggestive of which underlying lesion?","o":["Dermoid","Encephalocele","Glioma","Hemangioma"],"k":"A","x":"A midline pit over the nasal dorsum is a classic finding of a dermoid cyst. PAGE 1361","bn":13},{"n":14,"s":"An infant presents with a midline nasal mass that increases in size while crying and bearing down. This is consistent with which of the following?","o":["Dermoid","Encephalocele","Glioma","Hemangioma"],"k":"B","x":"Growth of the midline nasal mass with bearing down or internal jugular vein compression is known as a Furstenberg sign. These maneuvers increase intracranial pressure, which is transmitted through the encephalocele, causing a transient increase in size. A positive Furstenberg sign is consistent with encephalocele. PAGE 1363","bn":14},{"n":15,"s":"Which of the following esophageal atresia (EA)/ tracheoesophageal fistula (TEF) configurations would most likely have a delayed presentation?","o":["Proximal and distal TEF with EA","Proximal EA with distal TEF","H-type TEF","Proximal TEF with distal EA"],"k":"C","x":"H-type TEF presents with recurrent aspiration, and cyanotic spills related to feeds. In neonates, the presence of EA with or without TEF results in the accumulation copious oral secretions and prevents nourishment resulting in severe symptoms that lead to an earlier diagnosis. PAGE 1373","bn":15},{"n":16,"s":"In the management of long segment tracheal stenosis secondary to complete tracheal ring deformity (CTRD), which of the following procedures is considered the gold standard of treatment?","o":["Tracheal segment resection and end-to-end anastomosis","Slide tracheoplasty","Endoscopic balloon dilatation","Endoscopic division of complete tracheal rings with endoluminal stent placement"],"k":"B","x":"Slide tracheoplasty is considered the gold standard approach in treatment of long segment CTRD. Long segment tracheal resection with end-to-end anastomosis will lead to significant shortening of the tracheal and result in significant tension at the anastomosis site. Endoscopic techniques are useful in isolated acquired tracheal stenosis segments, but a significant failure rate is noted in long segment acquired and congenital tracheal stenosis. PAGE 1375","bn":16},{"n":17,"s":"Which of the following is the most common pediatric primary tracheobronchial malignancy?","o":["Carcinoid tumors","Adenoid cystic carcinoma","Squamous cell carcinoma","Rhabdomyosarcoma"],"k":"A","x":"In children, malignant primary tracheobronchial tumors are more common than benign tumors. The most common malignancy types in this anatomic region is carcinoid tumors, followed by mucoepidermoid carcinoma. PAGE 1381","bn":17},{"n":18,"s":"Which of the following syndromes is more commonly seen in infants with a tracheal sleeve anomaly?","o":["Trisomy 21","Crouzon syndrome","Velocardiofacial syndrome","Usher syndrome"],"k":"B","x":"Craniosynostosis syndromes including Crouzon syndrome and Apert syndrome are the most associated syndromes in infants with tracheal sleeve anomaly characterized by anterior vertical fusion of the tracheal cartilaginous exoskeleton. PAGE 1373","bn":18},{"n":19,"s":"During a diagnostic bronchoscopy under spontaneous ventilation, the anterior midtracheal wall is injured during the examination and a 1-cm tear is seen, and the oxygen saturation begins to decline. What is your next step in airway management?","o":["Immediately consult general surgery for an emergent thoracotomy.","Perform bilateral chest tube insertion.","Intubate with a laryngeal mask until the saturation recovers.","Intubate with an endotracheal tube (ETT) and place the cuff distal to the tear."],"k":"D","x":"Tracheal wall tears can result in significant air escape into the mediastinum and/or pleural space resulting in pneumothorax. If a tear is recognized intraoperatively, the first step is to attempt intubation under direct visualization with a cuffed ETT placing the cuff distal to the tear. This will allow ventilation to continue while complications of the tear (ie, pneumothorax) can be managed with chest tube insertion if needed. Providing any form for positive pressure ventilation proximal to the tear can result in tension pneumothorax. PAGE 1380","bn":19},{"n":20,"s":"An 8-month-old boy with a history of prolonged intubation develops stridor following extubation. The infant is taken to the operating room on the same day and endoscopy reveals localized proximal tracheal granulation tissue and narrowing. He is stable and is maintaining oxygen saturation on room air. Which of the following is the most appropriate next step?","o":["Emergency tracheostomy to secure the airway","Reintubate immediately","Endoscopic balloon dilation with granulation tissue intervention","Perform a slide tracheoplasty"],"k":"C","x":"Children with localized postintubation tracheal stenosis can benefit from endoscopic interventions to relieve the obstruction and possibility prevent progression of the pathology. In a stable airway, reintubation or tracheostomy are not indicated. A slide tracheoplasty can be considered if endoscopic treatment fails, or a mature stenotic segment develops later but not in the acute setting. PAGE 1378","bn":20},{"n":21,"s":"A 12-month-old child undergoes elective bronchoscopy for chronic barky cough and expiratory stridor. Proximal anterior tracheal wall malacia with underlying pulsations are noted. Which of the following is the appropriate next step in management?","o":["Place an endoluminal stent to manage tracheomalacia (TM).","Perform an emergency tracheostomy distal to the pulsations.","Perform balloon dilation.","Order computerized tomography angiography of the chest."],"k":"D","x":"The finding of proximal anterior tracheal wall pulsations is consistent with an aberrant innominate artery causing extrinsic compression and TM. Computerized tomography angiography will help confirm the anomaly. Airway interventions are rarely warranted on the initial evaluation. PAGE 1371","bn":21},{"n":22,"s":"A newborn boy develops severe respiratory distress soon after birth. Multiple endotracheal intubation attempts fail and the diagnosis of tracheal agenesis is suspected, and survival is nearly contingent on the presence of which of the following anomalies?","o":["Isolated EA","Tracheal bronchus","TEF","Tracheal diverticulum"],"k":"C","x":"In newborns with tracheal agenesis, presence of TEF allows ventilation through esophageal intubation. In the absence of concomitant TEF, poor survival outcomes are expected. PAGE 1376","bn":22},{"n":23,"s":"Mutation of which of the following genes is associated with development of CTRD?","o":["Sonic hedgehog gene","PAX3","COLIA2","EYAI"],"k":"A","x":"De novo mutations in the Sonic hedgehog gene along with other genetic variations involved in hedgehog and Wnt signaling affect encoded proteins involved in muscle and cartilage development of the respiratory tract in children with CTRD. PAGE 1374","bn":23},{"n":24,"s":"Which of the following is considered the gold standard in diagnosis of tracheobronchomalacia?","o":["Airway fluoroscopy","Flexible and rigid tracheobronchoscopy","Inspiratory and expiratory chest x-ray films","Computerized tomography"],"k":"B","x":"Flexible and rigid tracheobronchoscopy provides excellent visualization of malacic segments and offer the opportunity to assess the degree of dynamic collapse. Airway fluoroscopy, chest x-ray films, and computerized tomography are beneficial in the initial and subsequent workup in selected patients. PAGE 1371","bn":24},{"n":25,"s":"The first step in caring for the neonate in respiratory distress is to:","o":["Obtain a thorough history of the pregnancy and delivery","Perform flexible laryngoscopy","Rapidly assess the patient’s clinical condition","Obtain a pulse oximetry reading"],"k":"C","x":"While obtaining a thorough history, performing flexible laryngoscopy, and obtaining a pulse oximetry reading can all be helpful, rapid assessment of the neonate’s clinical condition allows the physician to determine the need for and urgency of potentially life saving interventions such as intubation or tracheotomy. PAGE 1385","bn":25},{"n":26,"s":"All neonates with suspected airway obstruction should undergo a:","o":["Flexible airway endoscopy","Airway fluoroscopy","MRI of the brain","Videofluoroscopic evaluation of swallowing function"],"k":"A","x":"Once the airway is deemed safe, flexible laryngoscopy can be extremely helpful to determine the etiology of respiratory distress. MRI brain may be helpful in cases such as vocal fold paralysis, and videofluoroscopic swallow study can be beneficial for patients with dysphagia, though these are not indicated for every neonate with dyspnea. PAGE 1385","bn":26},{"n":27,"s":"Robin sequence is characterized by:","o":["Micrognathia, cleft palate, and glossoptosis","Micrognathia, cleft palate, and airway obstruction","Cleft palate, airway obstruction, and glossoptosis","Micrognathia, glossoptosis, and airway obstruction"],"k":"D","x":"Described by the French dental surgeon, Pierre Robin, this sequence describes micrognathia that causes glossoptosis, leading to upper airway obstruction and often (but not always) cleft palate. PAGE 1388","bn":27},{"n":28,"s":"The most common anatomical site of stridor in the neonate is","o":["Larynx","Trachea","Nose","Oral cavity"],"k":"A","x":"Laryngeal pathology is the most common cause of stridor in neonates. The narrowest portion of the neonatal airway is the subglottic airway at the level of the cricoid cartilage. The most common cause of neonatal stridor is laryngomalacia. SGS and vocal fold paralysis are other common laryngeal causes of stridor. PAGE","bn":28},{"n":29,"s":"Bilateral choanal atresia can cause significant airway distress in the newborn because:","o":["Infants with choanal atresia usually have concomitant cardiac anomalies","Infants are initially obligate nasal breathers","The neonatal larynx is smaller and collapses easily","Neonates have low oxygen reserves"],"k":"B","x":"Although this is debated in the literature, it has been suggested that newborns are obligate nasal breathers for the first few months of life. While some infants can initiate mouth breathing with nasal occlusion, this transition is marked by significant respiratory distress and, often, respiratory failure with hypoxemia. PAGE 1387","bn":29},{"n":30,"s":"The most likely diagnosis in a neonate with expiratory stridor and a brassy cough is:","o":["Congenital SGS","TM","Robin sequence","Bilateral vocal fold paralysis"],"k":"B","x":"Inspiratory stridor suggests supraglottic obstruction, whereas expiratory stridor suggests tracheal obstruction (particularly the intrathoracic trachea). Glottic and subglottic abnormalities may present with biphasic stridor. PAGE 1389","bn":30},{"n":31,"s":"A 4-week-old infant is brought to your office for evaluation of tongue-tie. The mother reports that breastfeeding is painful although the baby is thriving (60th percentile for weight.) On examination, the baby has anterior ankyloglossia, which restricts tongue mobility. What can you tell the mother about expected outcomes if an in-office frenotomy is performed?","o":["The baby will likely have less gas and colic.","The baby may have an improved latch and the mother less nipple pain.","The baby will be less likely to require speech therapy in the future.","The baby will be less likely to have sleep apnea in the future."],"k":"B","x":"Studies have shown that some breastfeeding mothers will experience less nipple pain after an infant with ankyloglossia undergoes frenotomy (Chapter 91, Section “Outcomes of Frenotomy Surgery”). The improvement is thought to be due to the infant’s enhanced ability to latch onto the breast. Frenotomy has not been definitively shown to improve reflux, colic, or prevent the need for speech therapy or sleep apnea. PAGE 1397","bn":31},{"n":32,"s":"A 24-year-old boy is brought in for evaluation because he is not speaking. On questioning, the parents report that the boy has been otherwise healthy, that he has two words, and they think the problem is tongue-tie. On examination, the boy has anterior ankyloglossia. What can you tell the parents about the origin of the child’s speech problem?","o":["No intervention is needed until the child is 3 years of age.","The speech delay is likely due to tongue-tie and the child’s speech would likely benefit from a frenotomy.","Tongue-tie is not the cause of the speech delay.","The speech delay is due to ASD."],"k":"C","x":"Tongue-tie does not cause speech delay. Although it is commonly believed that ankyloglossia causes speech articulation problems, there are no definitive studies to show that speech articulation is related to tongue-tie. For this patient, a hearing evaluation, speech evaluation, and possible developmental pediatrics evaluation are recommended. It is possible that the speech delay is due to ASD, but the child would need further testing before this diagnosis can be made. PAGE 1401","bn":32},{"n":33,"s":"A 3-month-old boy is brought to the office for evaluation of ankyloglossia. Mother reports he is breastfeeding well and is currently in the 70th percentile for weight. She is concerned that he has ankyloglossia that will affect him in the future. On examination, the tongue tip is rounded with no notching of the tip. The tongue frenulum originates 1 cm from the tongue tip and inserts into the floor of the mouth. The baby can lift the tongue symmetrically with crying. What can you tell the parents about the likely outcome of frenotomy?","o":["Frenotomy will likely prevent a future speech problem.","Frenotomy will likely prevent feeding problems in the future.","Frenotomy will likely prevent him from swallowing air and refluxing.","Frenotomy will likely make no difference in his future function."],"k":"D","x":"Although a lingual frenulum is present, the child described does not have limited mobility of the tongue so does not have ankyloglossia. Frenotomy is not recommended to prevent possible future problems when no tongue restriction is present. PAGE 1398","bn":33},{"n":34,"s":"A 1-month-old infant undergoes lingual frenotomy. Which of the following postprocedure exercise regimens have been proven to be effective in preventing sublingual scaring?","o":["Lifting the tongue with parental fingers 5 times a day for 3 weeks","Rubbing under the tongue every 4 hours for 2 weeks","Sucking on a pacifier a minimum of 15 minutes every 3 hours for 1 month","None of the above"],"k":"D","x":"Although frequently discussed on social media, post-frenotomy procedures have not been shown to prevent sublingual scarring. PAGE 1400","bn":34},{"n":35,"s":"Lysis of the buccal frenulum in breastfeeding infants has been shown to improve which of the following?","o":["Increase the speed of feeding.","Decrease the frequency of swallowing air.","Increase the ease of transition from liquid to solid diet.","None of the above."],"k":"D","x":"There is limited literature and no randomized controlled trials examining the relationship of the maxillary buccal frenulum to breastfeeding. PAGE 1404","bn":35},{"n":36,"s":"Central nervous conditions often have accompanying oromotor dysfunction that profoundly affects feeding and speech skills. Which of the following conditions represents a condition that is chronic but static and affects oromotor skills?","o":["Progressive spinal muscular atrophy","Duchenne muscular dystrophy","Myasthenia gravis","Cerebral palsy"],"k":"D","x":"Cerebral palsy occurs secondary to central nervous system injury and includes a diverse group of chronic but nonprogressive disorders of movement, posture, and tone. Oral motor and swallowing dysfunction are common in children with cerebral palsy secondary to the neurologic impairment and the effect on the muscles involved in the oral, pharyngeal, and esophageal stages of the swallow. PAGE 1414","bn":36},{"n":37,"s":"A 6-year-old girl with typical development and no prior feeding problems choked and vomited while eating snacks prior to a soccer practice. She quickly recovered, and no intervention was required. Despite her quick recovery, she developed a fear of subsequent choking, and gradually began accepting only liquids and an extremely narrow range of accepted solid foods. There are no signs of swallowing dysfunction with intake of the accepted solids and liquids, and results of swallowing studies are normal. What is a possible diagnosis to consider?","o":["Avoidant restrictive food intake disorder (ARFID)","Anorexia","Oromotor dysfunction","Oropharyngeal dysphagia"],"k":"A","x":"The eating disturbance that occurs in children with ARFID is not attributable to a concurrent medical problem and does not occur during the course of anorexia nervosa or bulimia nervosa. ARFID is an eating or feeding disturbance characterized by an apparent lack of interest in eating or food, avoidance based on the sensory characteristics of food, and concern about the aversive consequences of eating. PAGE 1419","bn":37},{"n":38,"s":"An infant born at a community hospital has micrognathia and a cleft palate and is subsequently diagnosed with Pierre Robin sequence (PRS). The infant is medically stable and demonstrates appropriate rooting and nonnutritive sucking skills but is not taking sufficient volume of oral feeds following discharge from the newborn nursery. What are the most likely contributing factors?","o":["Lack of typical oral reflexes","Potential airway obstruction during feedings created by the micrognathia and the posterior position of the tongue","Oral hypersensitivity","Oral hyposensitivity"],"k":"B","x":"Nonnutritive and nutritive sucking skills are often intact in infants with PRS, but upper airway obstruction (depending on the degree) may present a challenge to infants considering the extra respiratory effort that is already required for oral feeding. Obstruction in the upper airway will potentially disrupt an infant’s ability to coordinate sucking and swallowing with breathing to maintain airway protection during feeding. PAGE 1417","bn":38},{"n":39,"s":"A 15-month-old boy with typical motor and language development accepts only commercially prepared pureed baby foods and refuses solids. The parents report that they tried to introduce solid table foods at age 1, but the child responded with gagging and refusal. They have continued to offer exclusively pureed foods for the past several months. What factor is most likely contributing to the refusal of solids in this case?","o":["Underlying behavioral disorder","Failure to introduce increased texture at critical times for skill acquisition","Restriction in the range and strength of oral motor musculature","Neurodevelopmental delay"],"k":"B","x":"Delayed introduction of texture beyond 6 to 12 months of age has been associated with the development of gagging, vomiting, and aversion to texture. Exposure to solids with increasing texture during critical time periods for skill acquisition stimulates the development of the necessary oral preparatory skills, such as tongue lateralization. Children receiving only smooth puree foods become habituated to using a predominantly anterior-posterior tongue motion to transfer the bolus. Strong aversive sensory reactions may occur if the child has not acquired the necessary tongue movements to manipulate a textured bolus. In addition, if the unprepared bolus is transferred for the swallow, gagging and choking may occur. PAGE 1412","bn":39},{"n":40,"s":"A 6-year-old boy diagnosed with ASD presents with an array of challenging behaviors, including severe tantrums, aggression, and feeding problems. What is the most likely feature of feeding problems in children with ASD?","o":["Oromotor skills for bolus manipulation","Severe food selectivity with negative responses to nonpreferred foods","Tendency to drink liquids and refuse solids","Intermittent gagging and vomiting, even with preferred foods"],"k":"B","x":"ASDs encompass a range of developmental disorders that include impairments of communication, social behavior, and often sensory processing. The sensory processing dysfunction may present as over-responsiveness to certain food smells, textures, or appearance. Selective or “picky” eating may result, characterized by selective intake of only certain foods and/or limited repertoires of food intake, which may ultimately contribute to nutritional inadequacy. The feeding problems are not related to range and strength of oral motor skills for bolus manipulation. Gagging or vomiting does not occur with preferred foods; in contrast, this may occur when nonpreferred foods (solids or liquids) are offered. PAGE 1419","bn":40},{"n":41,"s":"According to Poiseuille law, which of the following factors will most likely affect flow rate?","o":["Viscosity","Radius","Pressure gradient","Length"],"k":"B","x":"A 4-mm-diameter airway when reduced by 1 mm creates a 75% reduction in airflow. By the same rational, expansion surgery, that is, laryngotracheoplasty, has a dramatic improvement on flow. PAGE 1423","bn":41},{"n":42,"s":"Where is the narrowest portion of the pediatric airway?","o":["Glottis","Midtrachea","Subglottic/cricoid","All of the above as each of these structures have the same diameter"],"k":"C","x":"Subglottic/cricoid. PAGE 1425","bn":42},{"n":43,"s":"A 4-month-old female presents to your clinic with progressive work of breathing and mildly reduced PO intake. She is noted to have biphasic stridor on examination along with a raised erythematous lesion on her cheek. From which subsite is her biphasic stridor likely originating?","o":["Supraglottis","Glottis","Subglottis","Trachea"],"k":"C","x":"This patient likely has a subglottic pathology resulting in biphasic stridor either inflammation from a parainfluenza virus or a subglottic hemangioma. PAGES 1424-1429","bn":43},{"n":44,"s":"A 2-week-old child with a history of having TEF repair at day 2 of life develops post extubation stridor. What could be the etiology if vocal cord immobility was found in this child?","o":["Iatrogenic","Neurogenic (Arnold-Chiari malformation)","Cricoarytenoid fixation","All of the above"],"k":"D","x":"Postsurgical trauma to the nerve with neck or thoracic procedures is a common cause. In cases where there is a history of intubation, cricoarytenoid fixation/posterior glottis stenosis should be ruled out. An MRI is indicated to look for neurological causes (Arnold- Chiari malformation). PAGE 1424","bn":44},{"n":45,"s":"A full-term newborn was found to have a “barky” wet stridor with cyanosis, and an airway assessment showed complete tracheal rings with significant tracheal stenosis with the airway diameter of about 2 mm. What would be the treatment of choice for this child?","o":["Tracheostomy","Slide tracheoplasty","Laser division of rings with balloon dilation","Expansion tracheoplasty with pericardial patch"],"k":"B","x":"Slide tracheoplasty is the surgery of choice for symptomatic complete tracheal rings. Tracheostomy is contraindicated in this condition. The other two methods have been described but do not have the outcomes as good as slide tracheoplasty. PAGE 1431","bn":45},{"n":46,"s":"A child presents with chronic cough for past 5 weeks. Cough is dry in character, and he is otherwise healthy with no fevers or malaise. What is the best option for management of this patient?","o":["Cough suppressant","Observation","Inhaled steroid","Antibiotics"],"k":"B","x":"According to ACCP guidelines, when cough is nonspecific, observation is recommended. If other symptoms are present or cough persists, then further evaluation is warranted. PAGE","bn":46},{"n":47,"s":"Which is not a phase of cough?","o":["Inhalation phase","Inspiratory phase","Compressive phase","Expiratory phase"],"k":"A","x":"The three distinct phases for cough are inspiratory phase, compressive phase, and expiratory phase. PAGE 1435","bn":47},{"n":48,"s":"A nonimmunized, 6-year-old child presents with chronic cough. Cough presents in rapid, uncontrollable fits. What is the leading diagnosis?","o":["Pertussis","Laryngomalacia","TM","Plastic bronchitis"],"k":"A","x":"Pertussis leads to whooping cough and can present in nonimmunized children. TM causes barky cough but not in rapid succession. Laryngomalacia is associated with stridor, cough, and feeding difficulties in infants and toddlers. Plastic bronchitis is associated with cast production and also not seen in rapid succession. PAGE 1436, Table 93.1","bn":48},{"n":49,"s":"Which is not a component of a cough reflex?","o":["Cough center","Cough receptors","Inspiratory center","Afferent nerves","Efferent nerves and effector muscles"],"k":"C","x":"The key components of cough reflex are cough receptors, afferent nerves, a cough center, efferent nerves, and effector muscles. PAGE 1435","bn":49},{"n":50,"s":"A 5-year-old patient presents with a wet cough for past 5 weeks. Parents report that the cough persists despite trial of over-the-counter medications including antihistamines, antitussives, and cough suppressants. What is the best management for this patient?","o":["Inhaled steroids","Reflux medication","Nasal steroids","Antibiotics"],"k":"D","x":"ACCP guidelines recommend antibiotics for chronic wet cough. Multiple studies have shown resolution or improvement with treatment of chronic wet cough with antibiotics. PAGE 1439","bn":50},{"n":51,"s":"Which nerves are involved in pharyngoglottal closure during the pharyngeal phase of a normal swallow?","o":["CN V and VIE","CN IX and XII","CN VII and X","CN IX and X"],"k":"D","x":"Pharyngoglottic closure involves the closure of the soft palate against the nasopharynx, vocal fold adduction, and approximation of the arytenoids through contraction of the thyroarytenoid and interarytenoid muscles, epiglottic inversion over the laryngeal inlet, and laryngeal elevation. This is mediated by afferent and efferent limbs of CN IX and X. PAGE 1442","bn":51},{"n":52,"s":"A 2-month-old term infant with no significant medical history presents with inspiratory stridor since birth that is present at rest but worsens during feeds and with agitation. What is the most likely diagnosis?","o":["TEF","Laryngomalacia","Choanal atresia","Unilateral vocal fold immobility"],"k":"B","x":"Laryngomalacia is the most common cause of inspiratory stridor in infants. It is characterized by inspiratory stridor that worsens during feeding and/or with agitation due to prolapse of supraglottic structures into the glottis upon inspiration. PAGE 1444","bn":52},{"n":53,"s":"A healthy 18-month-old child with a history of cow’s milk protein allergy and eczema is referred for evaluation of pharyngeal dysphagia due to aspiration of all consistencies on video fluoroscopic swallow study. A biopsy of his esophagus from a recent esophagogastroduodenoscopy showed greater than 15 intraepithelial eosinophils per high-power field. What is the most likely etiology of this child’s dysphagia?","o":["Achalasia","Chiari malformation","Eosinophilic esophagitis (EOE)","Barrett esophagus"],"k":"C","x":"EOE is a T helper cell-2—mediated inflammatory immune response marked by the infiltration of eosinophils in esophageal mucosa that can be seen on microscopic biopsy (more than 15 intraepithelial eosinophils per high-power field). Chronic inflammation and remodeling of the esophagus and aerodigestive tract is thought to be the etiology of pharyngeal dysphagia in patients with EoE. PAGE 1447","bn":53},{"n":54,"s":"A 12-month-old child with documented silent aspiration on Video Fluroscopic Swallow Study (VFSS) and laryngomalacia post supraglottoplasty returns to clinic for a 3-month postoperative visit. The child has been on nectar-thickened liquids. The caregiver reports that thin liquids have been trialed at home and the child often coughs/chokes. The speech-language pathologist (SLP) is consulted to for a clinical swallowing evaluation and notes the child to have wet/gurgly vocal quality and throat-clearing following drinking thin liquids. The best next course of action to manage the child’s dysphagia is to:","o":["Instruct the caregivers to resume thickening the child’s liquids and follow up in 2 months","Instruct the caregiver to continue offering the child thin liquids so the child becomes accustomed to this","Schedule a repeat VFSS, as the child has a known history of silent aspiration and respiratory illnesses","Schedule the patient to follow up with the SLP in 1 month for a repeat bedside evaluation"],"k":"C","x":"If the child’s symptoms have improved and respiratory health has been stable, a trial of weaning from thickened liquids may be appropriate. However, if there is a history of silent aspiration, formal reassessment of swallowing function with VFSS or functional endoscopic evaluation of swallowing may be warranted. PAGE 1451","bn":54},{"n":55,"s":"A 6-week-old infant with symptoms of chronic nasal congestion, anterior spillage of formula during feeds, and frequent spit up comes for an initial clinic visit. The infant is gaining weight appropriately and has not had any pulmonary issues, but the caregiver is concerned about the infant’s feeding behaviors. The best next course of action is to:","o":["Instruct the caregiver to begin adding rice cereal or another thickening agent to the infant’s formula","Consult the SLP for a bedside evaluation to trial feeding strategies such as slower nipple flow and external pacing breaks to help the infant’s swallowing coordination","Schedule the patient for an instrumental swallowing assessment as soon as possible","Have the infant follow-up in 1 month and recheck infant’s symptoms at that time"],"k":"B","x":"Using a slower-flowing nipple and providing consistent pacing breaks during the feed can help with breathing/ swallowing coordination. Though thickeners may aid in slowing the flow rate of the liquid, other strategies should be implemented first. PAGE 1452","bn":55},{"n":56,"s":"A 5-year-old patient with no other risk factors has a long-standing high grade III SGS and no vocal fold involvement. Which procedure would have the highest chance of surgical success in this patient?","o":["Endoscopic division with CO₂ laser","Anterior graft laryngotracheoplasty","Endoscopic balloon dilation","Cricotracheal resection"],"k":"D","x":"Cricotracheal resection has the highest chance of surgical success with a 90% success rate. Option A has variable success rates of 60% to 80% and works best in lower-grade stenosis. Option B, although some cases may be treated with an anterior graft high-grade SGS has lower success rates of 60% to 80%. Option C, in an acute balloon dilation maybe successful. In this case, balloon dilation would not be the best choice for success. PAGES 1446-1447","bn":56},{"n":57,"s":"Which of the following is a commonly performed preoperative assessment in patients who will undergo airway reconstruction?","o":["FESS (sinus surgery)","Video Swallow Study (swallow study)","Lateral neck x-ray","Pulmonary function tests"],"k":"B","x":"Assessment of aspiration and swallowing is important prior to airway reconstruction. Patients may be at high risk if the airway is opened further and may result in worsening aspiration. Option A, FESS is a sinus procedure and can be easily confused with functional endoscopic evaluation of swallowing. Option C, lateral neck x-ray: Although these may be obtained in some patient, they are not commonly used in the assessment of airway stenosis that is already known. Option D, pulmonary function tests can be obtained in older patients (older than 6) but are not frequently obtained and can be difficult to get reliable results in children with airway stenosis or tracheotomy. PAGE 1462","bn":57},{"n":58,"s":"A 7-month-old child presents with symptomatic complete tracheal rings. What surgical approach has the highest chance of success?","o":["Tracheal resection of the complete rings","Anterior and posterior costal cartilage laryngotracheoplasty","Slide tracheoplasty","Anterior pericardial patch repair"],"k":"C","x":"Slide tracheoplasty is the definitive treatment for complete tracheal rings. It provides the best success for treatment of symptomatic patients. Option A, tracheal resection of the complete rings does shorten the trachea significantly. Option B is not a treatment for complete rings but rather SGS. Option D, pericardial patch is a historic treatment for patients with complete rings that had a high mortality rate and revision rate and is no longer used. PAGE 1467","bn":58},{"n":59,"s":"What concept is used to best understand decision-making around open versus endoscopic airway management?","o":["Laryngotracheal framework","Surgical medical decision-making","Preoperative screening","Methicillin-resistant Staphylococcus aureus screening"],"k":"A","x":"The framework concept describes understanding the structure of the airway dictates what surgical options are likely to be successful. Option B, decision-making influence what approach is used but is not the concept around structure. Option C, preoperative screening is important in both open and endoscopic surgery. Option D, methicillin-resistant Staphylococcus aureus screening is important in both open and endoscopic surgery. PAGE 1463","bn":59},{"n":60,"s":"Which of the following findings would increase the risk of airway reconstruction in a patient and would need preoperative treatment prior to proceeding with reconstruction?","o":["Aspiration seen on swallow study","Sinus infection","Arytenoid prolapse","EOE"],"k":"D","x":"EOE can negatively affect airway reconstruction and should be treated prior to surgery. Option A, aspiration is a risk factor that may preclude performing a reconstruction. Treatment may not be possible so this is not always a treatable issue that would allow reconstruction. More commonly one would defer to not proceed. Option B, sinus disease is not a known risk factor for reconstruction. Option C, arytenoid prolapse is a frequently common late postoperative event. It can be encountered preoperatively but would not preclude reconstruction and can be treated at the same time as surgery. PAGE","bn":60},{"n":61,"s":"Ina newborn, the location of the cricoid cartilage most commonly corresponds to which spinal level?","o":["C3-C4","C4-CS","C5-C6","C6-C7"],"k":"A","x":"In a neonate, the larynx is high in the neck, with the lower border of the cricoid cartilage approximately at the level of C3- C4. By age 2, it descends to approximately C5, by age 5, it reaches approximately C6, and by age 15, it descends to its final position of C6-C
