<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>MCQs in ENT Head & Neck Surgery (Six Papers) — Interactive Quiz</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--box:#0B1418;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--box:#000;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.chap{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px}
.chap.on{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.chap b{flex:1;font-weight:600}
.chap span{color:var(--muted);font-variant-numeric:tabular-nums}
.chap .done{font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px}
.seg button.on{background:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#06201F}}
.primary{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
@media (prefers-color-scheme:dark){.primary{color:#06201F}}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.topi .t{flex:1;min-width:0;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topi .sc{font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width .25s}
.qn{font:600 .9rem/1 inherit;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.note{font-size:.9rem;color:var(--muted);margin:-4px 0 12px}
.flag{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:6px;font-size:.92rem;margin:0 0 12px}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}
.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}
.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:12px 0 4px}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-cur{outline:2px solid var(--teal);outline-offset:1px}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:8px 0}
table{width:100%;border-collapse:collapse;margin:12px 0 18px;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const DATA=[{"t":"Paper One","q":[{"bn":1,"s":"Which one of the following is inherited as an autosomal dominant condition?","o":["Cystic fibrosis","Jervell and Lange-Nielsen","Treacher Collins","Alport syndrome","Usher syndrome"],"k":"C","x":"","n":1},{"bn":2,"s":"Approximately how many mls of saline are needed to make a safe maximum dose of 1% lignocaine without adrenaline for a 70kg man?","o":["10","20","100","200","400"],"k":"B","x":"Book note: 20mls (max safe dose for lignocaine without adrenaline 3mg/kg)","n":2},{"bn":3,"s":"A researcher reports that a new antibiotic is more effective than an established standard for bacterial sinusitis, p = 0.015. Which of the following statement is true?","o":["The new antibiotic increased relative efficacy by 15%","The new antibiotic increased absolute efficacy by 15%","The likelihood of a type 1 error is 1.5%","The likelihood of a type 11 error is 1.5%","The likelihood of adequate statistical power is 98.5%"],"k":"C","x":"","n":3},{"bn":4,"s":"A 36-year-old man presents with a hoarse voice, difficulty being heard and is often confused for a woman on the telephone. Videostroboscopy shows a linear depression in the free edge of the true vocal cord. Which of the following is the most likely diagnosis?","o":["Reinke's oedema","Singers nodules","Spasmodic dysphonia","Sulcus vocalis","Vocal Cord granuloma"],"k":"D","x":"","n":4},{"bn":5,"s":"Which is the most appropriate therapeutic option for a T2N0M0 glottic carcinoma?","o":["Radiotherapy","Chemotherapy","Surgery and post op radiotherapy","Chemoradiotherapy","Primary surgery and modified radical neck dissection"],"k":"A","x":"","n":5},{"bn":6,"s":"A newborn boy presents with a cardiac murmur, ear abnormalities and choanal atresia. Which of the following is the most likely syndrome?","o":["Alport syndrome","Pierre-Robin sequence","CHARGE syndrome","Cogan's syndrome","Crouzon syndrome"],"k":"C","x":"","n":6},{"bn":7,"s":"Which test is most suitable to assess the linear analogue scale responses of a group of subjects (n =15) asked to report their perceived pain on 2 consecutive days?","o":["Pearsons correlation coefficient","Spearmans rank correlation coefficient","Two sample (unpaired) Student's t- test","Two-way analysis of variance (ANOVA)","Wilcoxon matched pairs test"],"k":"E","x":"","n":7},{"bn":8,"s":"A 45-year-old man presents with acute onset of nausea and vertigo. He is just recovering from infective rhinosinusitis. Examination reveals nystagmus to the left. Which of the following is the most likely diagnosis?","o":["Labyrinthitis","Lateral sinus thrombosis","Meningitis","Perforation of tympanic membrane","Subperiosteal abscess"],"k":"A","x":"","n":8},{"bn":9,"s":"With regards to caloric testing, which one of these statements is true?","o":["Cold water results in nystagmus to the same side","Cold water results in no nystagmus","Warm water results in no nystagmus","Warm water results in nystagmus to the same side","Warm water results in nystagmus to the opposite side"],"k":"D","x":"Book note: Warm water results in nystagmus to the same side (COWS-cold opposite, warm same)","n":9},{"bn":10,"s":"Which congenital deformity typically results in 1.5 turns of the cochlea?","o":["Michel aplasia","Schiebe deformity","Alexander dysplasia","Mondini dysplasia","Enlarged vestibular aqueduct"],"k":"D","x":"","n":10},{"bn":11,"s":"A 3-year-old girl presents with painful left sided swelling in level 2 of the neck associated with otalgia. Ultrasound sound scan reveals the presence of a collection along the left posterior belly of the digastric muscle. Which of the following is the most likely diagnosis?","o":["Bezold's abscess","Citelli's abscess","Subdural abscess","Subperiosteal abscess","Extradural abscess"],"k":"B","x":"","n":11},{"bn":12,"s":"A 28-year-old man presents with a pulsatile swelling in his supraclavicullar fossa. He experiences a cold hand on the same side. Which of the following is the most likely diagnosis?","o":["Branchial cyst","Cervical rib","Sternomastoid tumour","Subclavian artery aneurysm","Glomus jugular tumour"],"k":"D","x":"","n":12},{"bn":13,"s":"Which symptom is not associated with a pharyngeal pouch?","o":["Halitosis","Regurgitation","Weight loss","Weight gain","Aspiration pneumonia"],"k":"D","x":"","n":13},{"bn":14,"s":"A 28-year-old amateur singer presents with a 2-month history of a hoarse voice. What is the most likely diagnosis?","o":["Vocal cord palsy","Vocal cord nodules","Vocal cord granuloma","Squamous cell carcinoma of larynx","Laryngeal papillomatosis"],"k":"B","x":"","n":14},{"bn":15,"s":"Which of the following is an unusual presentation of a glomus vagale?","o":["Pulsatile tinnitus","Recurrent drop attack","Facial nerve palsy","Hypoglossal nerve palsy","Otalgia"],"k":"C","x":"","n":15},{"bn":16,"s":"Where can endolymph be found within the cochlea?","o":["Scala vestibule","Scala media","Scala tympani","Helicotrema","Utricle"],"k":"B","x":"","n":16},{"bn":17,"s":"Which artery(s) supply the tonsil?","o":["Dorsal lingual branches of the lingual artery","Tonsillar branch of the facial artery","Ascending pharyngeal artery from external carotid","Descending palatine branch of maxillary artery","All of the above"],"k":"E","x":"","n":17},{"bn":18,"s":"A 60-year-old man presents with unilateral hearing loss and tinnitus. Pure tone audiometry reveals asymmetrical sensori-neural hearing loss. A MR scan of the CPA/IAM was subsequently organised and the neuroradiologist reported a lesion with a broad base and bilateral dural tails in the cerebellar pontine angle. What is the most likely diagnosis?","o":["Meningioma","Acoustic neuroma","Vestibular schwannoma","Cholesteatoma","Cholesteral granuloma"],"k":"A","x":"","n":18},{"bn":19,"s":"A 65-year-old man presents with dry mouth and dental caries. He takes omeprazole daily for the last 2 years. What is the single most likely diagnosis?","o":["Geographic tongue","Erythroplakia","Mucocoeles","Sjogrens","Xerostomia"],"k":"E","x":"","n":19},{"bn":20,"s":"A 25-year-old man presents with suspicion of otitis media with effusion. Tympanometry reveals peak compliance of -180daPa. What is the single most likely tympanogram?","o":["Type As","Type Ad","Type B","Type C1","Type C2"],"k":"D","x":"Type C tympanograms show negative peak pressure: C1 is roughly −100 to −199 daPa and C2 roughly −200 to −399 daPa (Fiellau-Nikolajsen). A peak at −180 daPa is therefore C1. (Scott-Brown, Impedance Audiometry.)","f":"Key corrected — book key: E; updated answer: D.","n":20},{"bn":21,"s":"What is the risk of malignant transformation in a patient with oral lichen planus for over 10 years?","o":["0%","5%","10%","50%","100%"],"k":"B","x":"","n":21},{"bn":22,"s":"A 65-year-old male farmer presents with a bleeding lesion on the upper part of the pinna. Examination reveals a 1 cm ulcerative lesion with heaped up edges and a palpable level II lymph node. Which of the following is the most likely diagnosis?","o":["Basal cell carcinoma","Keratoacanthoma","Gouty tophi","Squamous cell carcinoma","Pinna cellulitis"],"k":"D","x":"","n":22},{"bn":23,"s":"A 39-year-old patient presents with suspected non-organic hearing loss. Which of the following is the most appropriate OPD diagnostic test?","o":["Free field testing","Pure tone audiogram","Stenger's test","Distraction testing","Conditioned response audiometry"],"k":"C","x":"","n":23},{"bn":24,"s":"What is the most likely corresponding eponymous name for a multinucleated cell found in granulomatous conditions?","o":["Kupffer cells","Langerhans cells","Langhan cells","Michaels's bodies","Mikulicz's cells"],"k":"C","x":"","n":24},{"bn":25,"s":"A 38-year-old man presents with normal symmetry and tone at rest but no forehead movement and incomplete eye closure. What is the House-Brackman (HB) grading of facial nerve palsy?","o":["HB Grade II","HB Grade III","HB Grade IV","HB Grade V","HB Grade VI"],"k":"C","x":"","n":25},{"bn":26,"s":"A 45-year-old Chinese woman presents with epistaxis. Examination and biopsy reveals a nasopharyngeal carcinoma confined to the nasopharynx with no palpable neck nodes. What is the TNM staging?","o":["T1N0M0","T1N1M0","T2N0M0","T3N1M0","T4N0M0"],"k":"A","x":"A tumour confined to the nasopharynx is T1, and with no palpable or imaged nodes the neck is N0, so the stage is T1N0M0 (AJCC 8th Edition, Nasopharynx). N1 would need unilateral cervical or retropharyngeal nodes.","f":"Key corrected — book key: B; updated answer: A.","n":26},{"bn":27,"s":"A 25-year-old male motorcyclist presents with a left facial nerve palsy following an accident that involved him landing on the back of his head. He also has bleeding from his left ear and right beating nystagmus associated with ipsilateral profound hearing loss. What is the most likely diagnosis?","o":["Transverse temporal bone fracture","Facial nerve neuroma","Facial nerve transection","Bell's palsy","Moebius syndrome"],"k":"A","x":"","n":27},{"bn":28,"s":"A 25-year-old male surfer presents with recurrent otitis externa and conductive hearing loss. Exam shows bilateral sessile masses adjacent to tympanic membrane in the external auditory canal. What is the most likely diagnosis?","o":["Pyogenic granuloma","Exostoses","Osteoma","Ear canal polyp","Furunclosis"],"k":"B","x":"","n":28},{"bn":29,"s":"A 27-year-old man presents with intermittent facial nerve palsy and a swollen fissured tongue. Which of the following is the most likely diagnosis?","o":["Guillain Barre syndrome","Lyme disease","Maffucci syndrome","Melkersson-Rosenthal syndrome","Syphilis"],"k":"D","x":"","n":29},{"bn":30,"s":"A 48-year-old caucasian man presents with an irregular lesion on the back of his neck that has enlarged and started bleeding. The lesion is has a variegated appearance. What is the most likely diagnosis?","o":["Acral lentiginous melanoma","Basal cell carcinoma","Benign naevus","Superficial spreading malignant melanoma","Squamous cell carcinoma"],"k":"D","x":"","n":30},{"bn":31,"s":"A 17-year-old girl presents to accident and emergency having taken an overdose. She complains of severe tinnitus. Which of the following drugs is most likely to be responsible?","o":["Aspirin","Propranolol","Phenytoin","Rosperidone","Frusemide"],"k":"A","x":"","n":31},{"bn":32,"s":"A 35-year-old man presents with an injury to his neck that is associated with hoarseness and stridor. Which of the following is the single most likely injury?","o":["Temporal bone fracture","Cerebrospinal fluid leak","Mandibular fracture","Laryngotracheal injury","Oesophageal perforation"],"k":"D","x":"","n":32},{"bn":33,"s":"A 64-year-old man presents with a tumour of the larynx which extends into the subglottis. Examination reveals a single unilateral node that is about 1.5 cm in size. No metastases are evident on CT/MRI. What is the TNM stage?","o":["T1N1M0","T2N0M1","T2N1M0","T2N0M0","T3N1M0"],"k":"C","x":"","n":33},{"bn":34,"s":"A 78-year-old woman presents with tinnitus, headache, jaw claudication and diplopia. Her blood test reveals a raised ESR. What is the most likely diagnosis?","o":["Herpes zoster","Ramsay Hunt syndrome","Sinusitis","Temporal arteritis","Trigeminal neuralgia"],"k":"D","x":"","n":34},{"bn":35,"s":"A 3-month-old boy presents with gradually worsening noisy breathing that is especially noticeable when he eats or is supine. He is on a lower centile for weight gain and has poor food intake. What is the likely diagnosis?","o":["Choanal atresia","Laryngeal papillomatosis","Laryngomalacia","Piriform aperture stenosis","Vocal cord palsy"],"k":"C","x":"","n":35},{"bn":36,"s":"A 28-year-old woman presents with intermittent severe temporofacial pain. Each episode begins with severe pain in and around the right ear radiating across the right side of the face and down to the right jaw. More recently she describes severe pain when touching her lower lip on the right. Her clinical and neurological examination is normal apart from observing an internuclear ophthalmoplegia. What is the most likely diagnosis?","o":["Temporal arteritis","Sphenopalatine ganglion neuralgia","Multiple Sclerosis","Motor neurone disease","Trigeminal neuralgia"],"k":"C","x":"","n":36},{"bn":37,"s":"A 4-year-old boy presents with hearing loss. Examination reveals mandibular and midfacial hypoplasia along with down slanting palpabre fissures. What is the most likely syndrome in this case?","o":["Pendred","CHARGE","Sticklers","Treacher-Collins","Turners"],"k":"D","x":"","n":37},{"bn":38,"s":"A 10-year-old girl presents with red spots on the buccal mucosa, conjunctivitis, otitis media, rhinitis and maculopapular rash. Which is the most likely infectious disease?","o":["Chicken-pox","Mumps","Measles","Scarlet fever","Hand, foot & mouth disease"],"k":"C","x":"","n":38},{"bn":39,"s":"A 54-year-old man presents with several months of a foul smelling discharge from his right ear. The discharge prevents him from going out with his friends. Otoscopy reveals an attic perforation combined with a dark brown wax-like material. What is the most likely diagnosis?","o":["Otitis externa","Chronic serous otitis media","Cholesteatoma","Otospongiosis","Otosyphilis"],"k":"C","x":"","n":39},{"bn":40,"s":"A 70-year-old man presents with an intermittent vertigo which began 2 months ago after a minor head injury. He described attacks lasting for 1-2 minutes usually when turning over to the right side in bed. What is the most likely diagnosis?","o":["Migraine","BPPV","Menieres disease","Acute labyrinthitis","Vertebro-basilar ischaemia"],"k":"B","x":"","n":40},{"bn":41,"s":"A 68-year-old gentleman presents to clinic with a 0.4 cm septal perforation. Which symptom is more often associated with a small septal perforation?","o":["Epistaxis","Crusting","Rhinorrhoea","Whistling","Difficulty with breathing"],"k":"D","x":"","n":41},{"bn":42,"s":"A 39-year-old woman presents complains of a 2-year history of intermittent sore red eyes, bilateral hearing loss, tinnitus and difficulty discriminating sounds in background noise. Otoscopic examination is normal. Pure tone audiogram reveals bilateral hearing loss at 2 kHz and a speech audiogram showed optimal discrimination score of 80 percent. What is the most likely diagnosis?","o":["Cogan's syndrome","Wegener's granulomatosis","Syphilis","Polyarteritis nodosa","Sjögren's syndrome"],"k":"A","x":"","n":42},{"bn":43,"s":"A 50-year-old male patient presents with chronic rhinosinusitis. Recently, he complained of bloody nasal discharge, cough and shortness of breath. The chest X ray shows a diffuse area of consolidation and cavities in the multiple lobes of the lungs. Urinalysis shows red blood cells cast and protein. What is the most likely diagnosis?","o":["Wegener's","Sarcoidosis","Pneumonia","Carcinoma of the bronchus","Tuberculosis"],"k":"A","x":"","n":43},{"bn":44,"s":"Which area of the upper airway is usually involved in sarcoidosis?","o":["Supraglottis","Glottis","Subglottis","Trachea","Saccule"],"k":"A","x":"","n":44},{"bn":45,"s":"During cold steel tonsillectomy, which is the most appropriate instrument to dissect the tonsil from its underlying attachments?","o":["Freer's elevator","Gwynne Evans dissector","Mollison's pillar retractor","St Claire Currette","Boyle's-Davis"],"k":"B","x":"","n":45},{"bn":46,"s":"A 29-year-old childless male presents complaining of recurrent rhinosinusitis. Investigations reveals obstructive azoospermia and bronchiectasis but normal ciliary motility. In this case, which of the following syndromes is most likely?","o":["CHARGE syndrome","Kartagener's syndrome","Osler-Weber-Rendu syndrome","Pierre Robin syndrome","Young's syndrome"],"k":"E","x":"","n":46},{"bn":47,"s":"Hereditary haemorrhagic telangectasia (HHT) is a condition diagnosed on the presence of four criteria, known as \"curacao criteria\". Which is not one of the criteria?","o":["Multiple telangiectasia","Recurrent epistaxis","First-degree family member with HHT","Abnormal clotting","Visceral arteriovenous malformations"],"k":"D","x":"", th bilateral enlargement of the parotid glands. What is the most likely cause?","o":["Mumps","Staphylococcus aureus infection","Drugs","Stones","Pleomorphic adenomas"],"k":"A","x":"","n":32},{"bn":33,"s":"When the change in hearing levels is assessed after ossicular reconstruction, a 95 percent confidence interval aids in data interpretation because it","o":["Gives the range of results consistent with the data","Estimates the accuracy of observed results","Adjusts for systematic error that may have occurred when results were measured","Defines the variability of observed data relative to the mean","Ensures adequate statistical power"],"k":"D","x":"","n":33},{"bn":34,"s":"A 60-year-old man presents with a cystic lesion on the anterior border of the sternocleidomastoid muscle. FNA reveals straw coloured fluid with squamous debris only. What is the most likely diagnosis?","o":["Squamous cell carcinoma","Branchial cyst","Actinomyces","Tuberculosis","Reactive lymphadenopathy"],"k":"A","x":"","n":34},{"bn":35,"s":"What are the origins and insertions of the lateral pterygoid muscle?","o":["Greater wing of sphenoid bone, lateral pterygoid plate, condyloid process of the mandible and TMJ capsule","Lesser wing of sphenoid bone, lateral pterygoid plate, condyloid process of the mandible and TMJ capsule","Greater wing of sphenoid bone, medial pterygoid plate, condyloid process of the mandible and TMJ. capsule","Lesser wing of sphenoid bone, medial pterygoid plate, coronoid process of the mandible and TMJ capsule","Greater wing of sphenoid bone, lateral pterygoid plate, coronoid process of the mandible and TMJ capsule"],"k":"A","x":"","n":35},{"bn":36,"s":"Which muscle divides the submandibular gland into superficial and deep lobes?","o":["Digastric muscle","Mylohyoid","Omohyoid","Thyrohyoid","Sternocleidomastoid"],"k":"B","x":"","n":36},{"bn":37,"s":"Which of the following is preserved during a Level IV cordectomy (according to the European Laryngeal Society Cordectomy classification)?","o":["Vocalis muscle","Vocal ligament","Vocal cover","Thyroarythenoid muscle","Cricoarythenoid muscle"],"k":"E","x":"","n":37},{"bn":38,"s":"A 29-year-old man presents with a lesion associated with an anaerobic gram- negative bacterium that produces sulphur like granules. What is the most likely diagnosis?","o":["Behcet's disease","Hairy leukoplakia","Actinomycosis","Oral candidiasis","Amyloidosis"],"k":"C","x":"","n":38},{"bn":39,"s":"Which of the following develops from the 2nd branchial arch?","o":["Stapes footplate","Manubrium of the malleus","Head of the malleus","Otic capsule","Short process of incus"],"k":"B","x":"","n":39},{"bn":40,"s":"A 21-year-old male presents with a swollen tongue and lips, which settled with to C1 esterase inhibitor therapy. What is the most likely diagnosis?","o":["Erythema multiforme","Pemphigoid","Pemphigus","Hereditary angio-oedema","Median Rhomboid glossitis"],"k":"D","x":"","n":40},{"bn":41,"s":"A 70-year-old man had a neck reconstruction with a free radial forearm flap. The first post-operative night, the SHO raised concerns about the flap and on examination it was pale but the capillary refill time was normal. The neck was re- explored the same night and you find the arterial and venous anastomosis intact. Which is the most likely cause for the flap failure?","o":["Primary tissue rejection","Secondary tissue rejection","Atherosclerotic deposits in the anastomosed arteries","Postoperative arterial vasoconstriction.","Too much intravenous fluids"],"k":"D","x":"","n":41},{"bn":42,"s":"A 2-year-old girl presents with suspicion of a hearing loss. What is the single most appropriate investigation?","o":["Visual reinforcement audiometry","Auditory brainstem response","Pure tone audiometry","Otoacoustic emissions","Speech discrimination test"],"k":"A","x":"","n":42},{"bn":43,"s":"A 75-year-old woman presents complaining of clouding vision in her left eye after developing a rash over her left forehead. She also mention a burning pain over her left forehead and her left eye. Examination reveals no ptosis or diplopia and the corneal reflex is intact. What is the most likely nerve to be involved?","o":["Cervical sympathetic plexus","Ophthalmic nerve","Short sphenopalatine nerve","Greater auricular nerve","Facial nerve"],"k":"B","x":"","n":43},{"bn":44,"s":"The risk of post-adenoidectomy haemorrhage using suction diathermy is?","o":["0.5%","1.0%","2%","3%","4%"],"k":"A","x":"","n":44},{"bn":45,"s":"With regards to House-Brackmann grading system of facial nerve palsy, which grading suggests at least an inability to close eyes completely?","o":["Grade I","Grade II","Grade III","Grade IV","Grade V"],"k":"D","x":"","n":45},{"bn":46,"s":"Otosclerosis is an autosomal dominant metabolic bone disease which affects the endochondral layer of the otic capsule. What clinical sign is it associated with?","o":["Battle sign","Schwartz sign","Rising sun sign","Bird-beak sign","Hitselberger's sign"],"k":"B","x":"","n":46},{"bn":47,"s":"A 78-year-old female presents with epiphora following excision of a basal cell carcinoma from beneath her left eye. Examination shows tension and eversion of the lower eyelid. What is the most likely diagnosis?","o":["Blepharitis","Canalicular stenosis","Conjunctival disease","Ectropion","Punctual stenosis"],"k":"D","x":"","n":47},{"bn":48,"s":"Which of the following does NOT constitute a common finding of transverse temporal bone fracture?","o":["anacusis","vertigo","facial nerve palsy","involvement of the foramen spinosum","fracture of the stylomastoid foramen"],"k":"E","x":"","n":48},{"bn":49,"s":"A 40-year-old barmaid presents with a 4 month history of a right throat discomfort. Examination reveals an indurated firm lesion in the right tonsil measuring 2.5 cm and a single ipsilateral lymph node, more than 3 cm but not more than 6 cm in greatest dimension in level 2 of the neck. What is the TNM stage?","o":["T1N1","T1N2","T2N1","T2N2A","T2N2B"],"k":"D","x":"","n":49},{"bn":50,"s":"A 72-year-old woman presents with a constant, throbbing generalised headache that has been increasing in intensity over a four week period. She also notices pain on chewing over the last 7 days. Examination reveals a low grade pyrexia and a tender scalp as well as decreased visual acuity in her right eye. ESR is elevated but her CRP and temporal artery biopsy are reported as normal. What is the single most likely cause for her headache?","o":["Temperomandibular joint (TMJ) dysfunction","Meningitis","Migraine","Giant cell arteritis","Space occupying lesion (e.g. brain tumour)"],"k":"D","x":"","n":50},{"bn":51,"s":"The mucociliary pathway is an important clearance mechanism. In which of the following is it not affected?","o":["Kartagener's syndrome","Cystic Fibrosis","Young's syndrome","Pendred's syndrome","Cigarette smoking"],"k":"D","x":"","n":51},{"bn":52,"s":"A 20-year-old Down syndrome male presents with difficulty breathing. Suspicious of a foreign body, a rigid bronchoscopy is performed and the trachea is seen to collapse (with the patient breathing spontaneously) but no foreign body is found. Which of the following is the most likely congenital abnormality?","o":["Cleft palate","Submucous cleft","Tracheal stenosis","Tracheal web","Tracheomalacia"],"k":"E","x":"","n":52},{"bn":53,"s":"The nurse on the paediatric ward calls you regarding an 8-year-old boy who is bleeding on the ward post tonsillectomy. His pre-op weight was 30 kg. He is conscious, orientated and alert but slightly pale. His pulse is 150/min, BP 100/80mmHg, capillary refill time is 4 seconds. What is the minimum amount of blood that he could have lost to give this clinical picture?","o":["20 mls","100 mls","200 mls","250 mls","350 mls"],"k":"E","x":"Estimated blood volume is about 80 ml/kg × 30 kg ≈ 2,400 ml. Tachycardia of 150, a narrow pulse pressure and a capillary refill of 4 s indicate at least class II haemorrhage (15–30% loss), so the minimum loss is about 15% of 2,400 ≈ 360 ml. Of ,"n":73},{"bn":75,"s":"The halo or ring sign on CT scan is indicative of...","o":["Congenital otosclerosis","Cochlear otosclerosis","Pagets disease","Oval otosclerosis","Round window otosclerosis"],"k":"B","x":"","n":74},{"bn":76,"s":"With regards measures of central tendency in statistics; which one of the following statements is true?","o":["The mean is always a good measure of central tendency","The mode is the sum of all the variables divided by the number of variables","The is only one mode in any given distribution","The mode is the middle of the distribution","The mean, mode and median are equal in normal distributions"],"k":"E","x":"","n":75},{"bn":77,"s":"In the evaluation of patients with maxillary sinus carcinoma, Ohngren's line can be drawn between?","o":["The lateral and medial vault of the maxillary sinus","The angle of the mandible and the medial canthus","The infraorbital foramen and the nasal spine","The maxillary tuberosity and the condyle of the mandible","The inferior turbinate and the lateral canthus"],"k":"B","x":"","n":76},{"bn":78,"s":"A 23-year-old woman presents with dermatographism complains of excessive sneezing and runny nose. What is the single most appropriate investigation?","o":["c-ANCA","p-ANCA","PR3","RAST","ACE"],"k":"D","x":"","n":77},{"bn":79,"s":"Which segment of the facial nerve is damaged if lacrimation and stapedial reflex are preserved, but movement of the muscle of the face and taste to the anterior 2/3 of the tongue are absent?","o":["Meatal","Labyrnthine","Tympanic","Mastoid","Extracranial"],"k":"D","x":"","n":78},{"bn":80,"s":"Which test is most specific for Wegener's granulomatosis?","o":["p-ANCA","c-ANCA","PR3","ACE","ANA"],"k":"B","x":"","n":79},{"bn":81,"s":"You are performing a laser resection of a papilloma on the nasopharyngeal surface of the soft palate using a laryngeal mirror. The mirror gets heated up during the procedure and the patient develops a 1x2 cm mucosal burn on the posterior pharyngeal wall. What is your management plan?","o":["Give analgesia and observe","Give steroids and observe","Give antibiotics and observe","Resect injured mucosa and allow to granulate","Resect the affected area and graft"],"k":"A","x":"","n":80},{"bn":82,"s":"A 48-year-old male presents with numbness of the upper left medial incisor following transantral surgery on his pterygopalatine fossa. What is the most likely nerve to be involved?","o":["Anterior superior alveolar nerve","Anterior palatine nerve","Short sphenopalatine nerve","Long palatine nerve","Long sphenopalatine nerve"],"k":"A","x":"","n":81},{"bn":83,"s":"A 35-year-old woman presents with increasing difficulty in swallowing over the previous 3 months. This become worse as a meal progressed, and has been associated with 1 stone of weight loss. She also complains of general tiredness and weakness. What is the most likely diagnosis?","o":["Globus pharyngeus","Myasthenia gravis","Pharyngeal pouch","Stroke","Goitre"],"k":"B","x":"","n":82},{"bn":84,"s":"Following a road traffic accident, a patient was noted to have a conductive hearing loss with an air-bone gap of 60 dB. What is the most likely cause?","o":["Fracture of the long process of the Incus","Fracture of the malleus","Dislocation of the stapes footplate","Fracture of the stapes supra-structure","Dislocation of the incudo-stapedial joint"],"k":"E","x":"","n":83},{"bn":85,"s":"Which of the following topical aural preparation contains clioquinol?","o":["Otomize","Otosporin","Sofradex","Betnovate","Locorten-Vioform"],"k":"E","x":"Book note: Locorten-Vioform (also Betnovate-C)","n":84},{"bn":86,"s":"At what age will a normal child be able to recognise his/her parent voice and turn his/her head towards noise?","o":["0-3 months","4-6 months","7-10 months","11-14 months","16-18 months"],"k":"B","x":"","n":85},{"bn":87,"s":"Which salivary gland produces 80 percent of resting saliva?","o":["Parotid glands","Submandibular glands","Sublingual glands","Minor salivary glands","Equal volumes from parotid & submandibular glands"],"k":"B","x":"About 70–80% of unstimulated (resting) saliva comes from the submandibular glands; the parotid dominates stimulated flow.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":86},{"bn":88,"s":"What volume of saline is needed to make 1:200,000 solution using 1ml of 1:1000 adrenaline?","o":["10 mls","20 mls","100 mls","200 mls","400 mls"],"k":"D","x":"1 ml of 1:1000 adrenaline contains 1 mg. A 1:200,000 solution contains 1 mg in 200 ml, so the final volume is 200 ml (199 ml of saline added to the 1 ml).","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":87},{"bn":89,"s":"A 43-year-old businessman, with a BMI of 37, presents with loud snoring. His wife also mentions apnoeic episodes. Overnight pulse oximetry shows oxygen desaturation dips of below 86 percent over a 7 hour sleep period on 220 occasions. He suffers with severe claustrophobia. Select the next best option from the list below?","o":["Refer for a mandibular splint","Refer fora trial of nasal CPAP","Refer for polysomnography","List for UVPP","Refer to dietician for weight reduction"],"k":"B","x":"Oximetry already shows severe OSA (about 31 dips/hour). CPAP is first-line for severe OSA, and nasal CPAP via nasal mask or pillows is the least claustrophobic interface, so a trial is the next step. Weight loss is adjunctive, and a mandibular splint or UVPP is not adequate for severe OSA. (NICE TA139; BTS.)","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":88},{"bn":90,"s":"Which of the following is the commonest side effect of oral steroid usage in ENT practice?","o":["peptic ulceration","tendon rupture","Insomnia","Skin rash","Weight gain"],"k":"C","x":"Short courses of oral steroids used in ENT (sinonasal disease, sudden hearing loss) most commonly cause insomnia and mood or sleep disturbance; peptic ulceration, tendon rupture and weight gain are less frequent with short courses.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":89},{"bn":91,"s":"A 60-year-old patient presents with a 3 cm thyroid nodule. Her past medical history included laryngeal cancer treated with radiotherapy. Fine needle aspiration cytology confirms the presence of malignant cells. Which is the most likely histological form of cancer?","o":["Papillary carcinoma","Follicular carcinoma","Medullary carcinoma","Anaplastic carcinoma","Lymphoma"],"k":"A","x":"Thyroid cancer after neck irradiation is most often papillary carcinoma (radiation-associated thyroid cancer, typically RET/PTC rearrangements).","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":90},{"bn":92,"s":"What is the chemical constituent in Rinatec?","o":["Iodoform, benzoin & storax","Iodoform Paraffin Bismuth","Fluticasone fuorate","Fluticasone proprionate","Ipratropium bromide"],"k":"E","x":"Rinatec is ipratropium bromide nasal spray (anticholinergic, used for watery rhinorrhoea).","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":91},{"bn":93,"s":"A 12-year-old girl presents with a rapidly growing lesion on the soft palate without any lymphadenopathy. The most likely diagnosis is?","o":["Pleomorphic adenoma","Adenoid cystic carcinoma","Acinic cell carcinoma","Mucoepidermoid carcinoma","Lymphoma"],"k":"D","x":"Mucoepidermoid carcinoma is the commonest salivary malignancy in children, and the palate is the commonest minor salivary site. A rapidly growing palatal lesion in a child should be treated as mucoepidermoid carcinoma until proven otherwise; pleomorphic adenoma grows slowly.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":92},{"bn":94,"s":"A 35-year-old male presents with excessive day time somnolence. Polysomnography shows no apnoeic episodes and 2 hypopnoeic episodes per hour. However, there are frequent snoring related arousals. Oesophageal manometry during sleep shows progressive increase in oesophageal pressure terminating in arousal. What is the most likely diagnosis?","o":["Periodic limb movement disorder","Narcolepsy","Upper airways resistance syndrome","Central sleep apnoea","Idiopathic hypersomnolence"],"k":"C","x":"Upper airway resistance syndrome: daytime sleepiness with an AHI below 5 but frequent respiratory-effort-related arousals, shown by progressively more negative oesophageal pressure ending in arousal.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":93},{"bn":95,"s":"What grading system is used for pars tensa retraction pockets?","o":["Tos","Sadé","Chandlers","House-Brackman","Brighton grading"],"k":"B","x":"Sadé’s classification grades pars tensa retraction (stages 1–4: retraction, onto the incus, onto the promontory, adhesive otitis). Tos classifies attic (pars flaccida) retraction.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":94},{"bn":96,"s":"A 34-year-old male diver presents with nausea and vertigo on hearing a loud noise. What is the most likely diagnosis?","o":["Boyce's sign","Tullio phenomena","Alexander's law","Arnold's reflex","Grisel sign"],"k":"B","x":"Tullio phenomenon: vertigo or nystagmus induced by loud sound, seen with a third-window lesion (superior canal dehiscence, perilymph fistula; possibly barotrauma in a diver).","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":95},{"bn":97,"s":"With regards Bone Anchored Hearing aids, which of the following statements is not true?","o":["Should only be used if the bone conduction hearing is better than 45 dB","The screw is made of titanium","Can be used for bilateral canal atresia","Can be used for single sided deafness","Is placed on the mastoid bone most frequently"],"k":"E","x":"A BAHA fixture is placed in the temporal (squamous/parietal) bone about 50–55 mm behind the external canal, not on the mastoid process itself. Standard BAHA criteria (BC ≤45 dB), titanium fixture, and use in bilateral atresia and single-sided deafness are all correct.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":96},{"bn":98,"s":"Which of the following mechanism provides the maximum impedance matching in the middle ear?","o":["Lever effect of the ossicular chain","Baffle effect of the tympanic membrane, i.e., phase difference between conduction at oval window and round window","Size of the ear canal","Area effect of the tympanic membrane relative to the stapes foot plate","Size and direction of the pinna"],"k":"D","x":"The area ratio of the tympanic membrane to the stapes footplate (about 17:1) provides most of the middle ear transformer gain (about 25 dB); the ossicular lever (about 1.3:1) adds only a little.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":97},{"bn":99,"s":"A 5-month old British born child is referred because of parental concerns about his hearing. Which investigation do you organize?","o":["Otoacoustic emmissions","Electrocochleography","Auditory brainstem response","Cortical evoked response audiometry","Distraction test"],"k":"C","x":"At 5 months, with parental concern, diagnostic assessment needs frequency-specific ABR (with OAEs and tympanometry); behavioural distraction testing requires a developmental age of about 7–9 months.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":98},{"bn":100,"s":"A 16-year-old boy presents with severe left-sided maxillary sinusitis following an upper respiratory tract infection. What is the most likely pathogen?","o":["Streptococcus pneumonia","Streptococcus milleri","Haemophilus influenza","Staphylococcus aureus","Pseudomonas aeruginosa"],"k":"A","x":"Acute bacterial maxillary sinusitis after a URTI is most often caused by Streptococcus pneumoniae, followed by H. influenzae and M. catarrhalis.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":99},{"bn":101,"s":"A 65-year-old patient had a total laryngectomy and comprehensive neck dissection for a T4N2bM0 hypopharyngeal carcinoma. Two months after postoperative radiotherapy, he developed a pharyngocutaneous fistula. What is the best course of action?","o":["EUA and biopsy","MRI","CT","Close with a flap","Wait and watch"],"k":"A","x":"A late pharyngocutaneous fistula (months after laryngectomy and radiotherapy) must be presumed to be recurrent tumour until proven otherwise: EUA and biopsy come first, before any reconstruction.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":100},{"bn":102,"s":"A 55-year patient has persistent symptoms from a possible foreign body in the oro- hypopharynx. What would be the next appropriate investigation?","o":["Reassure and discharge","Ultrasound neck","CT scan","MRI","Surgical intervention"],"k":"C","x":"Persistent symptoms of an oro-/hypopharyngeal foreign body despite normal examination need a CT of the neck, which detects radiolucent and poorly calcified bones that plain X-ray misses.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":101},{"bn":103,"s":"Patients with Down syndrome are prone to recurrent episodes of croup. This is most likely due to...","o":["Recurrent tonsillitis with tonsillar hypertrophy","Depressed immunity","Macroglossia","High incidence of OSA","Subglottic narrowing"],"k":"E","x":"Children with Down syndrome have a relatively narrow subglottis (congenital subglottic narrowing), so minor oedema causes croup-like obstruction.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":102},{"bn":104,"s":"Cholesteatoma consists of layers of keratin lined by which type of epithelium?","o":["Squamous epithelium","Simple cuboidal epithelium","Simple columnar epithelium","Ciliated columnar epithelium","Glandular epithelium"],"k":"A","x":"Cholesteatoma is keratinising stratified squamous epithelium (matrix) producing keratin debris, with surrounding perimatrix.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":103},{"bn":105,"s":"A 36-year-old overweight woman presents with episodic vertigo, hearing loss, tinnitus and fullness in her right ear. What would you advise her?","o":["Lose weight","Reduce salt in diet","Note and adhere to the sell by dates on food","Gargle saline","Place icepacks on forehead"],"k":"B","x":"First-line lifestyle advice in Ménière’s disease is a low-salt diet (with caffeine and alcohol reduction).","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":104},{"bn":106,"s":"A 14-year-old boy presents with fever, arthralgia and facial nerve palsy following an adventure holiday in Sweden. What is the most likely infective organism?","o":["Borellia burgdorferi","Atypical mycobacterium","Actinomyces","Rochalimaea (Bartonella) henselae","Rhinosporidium seeberi"],"k":"A","x":"Fever, arthralgia and facial palsy after an outdoor trip (tick bite) suggest Lyme disease, caused by Borrelia burgdorferi.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":105},{"bn":107,"s":"A cystic lesion without a true epithelial lining. What is the most likely corresponding lesion?","o":["Lymphangioma","Salivary mucocele","Ranula","Adenoid cystic carcinoma","Mucoepidermoid carcinoma"],"k":"B","x":"A salivary mucocele (mucus extravasation) is a pseudocyst lined by granulation tissue rather than true epithelium.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":106},{"bn":108,"s":"A 40-year-old male air traffic controller complains of severe nasal blockage and rhinorrhoea when out working in the cold. His symptoms persist to a lesser degree when not working. What is the most likely diagnosis?","o":["Atrophic rhinitis","Allergic rhinitis","Drug induced rhinitis","Hormonal rhinitis","Non allergic occupational rhinitis"],"k":"E","x":"Symptoms provoked by the work environment (cold air on the airfield) and improving away from it, without allergy, fit non-allergic occupational (irritant/physical) rhinitis.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":107},{"bn":109,"s":"Transplant between identical twins is known as...","o":["Allograft","Homograft","Autograft","Isograft","Xenograft"],"k":"D","x":"An isograft (syngeneic graft) is a graft between genetically identical individuals, such as identical twins.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":108},{"bn":110,"s":"A 10-year-old boy presents with progressive sensorineural hearing loss, which suddenly worsens following head trauma whilst playing rugby. What is the single most likely diagnosis?","o":["Hereditodegenerative disease of the cochlea","Ushers syndrome","Cochlear hydrops","Enlarged vestibular aqueduct syndrome","Cogan's syndrome"],"k":"D","x":"Progressive sensorineural loss with sudden deterioration after minor head trauma is classic for enlarged vestibular aqueduct.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":109},{"bn":111,"s":"A patient presents with a short history of acute sinusitis, marked pyrexia, bilateral chemosis and 3rd nerve palsy. What is the most likely diagnosis?","o":["Periorbital cellulitis","Gradenigo's syndrome","Cavernous sinus thrombosis","An orbital abscess","A brain abscess"],"k":"C","x":"Bilateral chemosis with marked pyrexia after sinusitis indicates cavernous sinus thrombosis (spread to both sides via the intercavernous sinuses).","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":110},{"bn":112,"s":"Which of the following are sensori-neural causes for anosmia?","o":["Rhinitis","Nasal polyps","Encephalocoeles","Dermoid cysts","Sarcoidosis"],"k":"E","x":"Rhinitis and polyps cause conductive (obstructive) anosmia, and encephalocoeles and dermoids are mass lesions. Sarcoidosis can involve the olfactory neuroepithelium and pathways, causing sensorineural anosmia.","f":"Key not given in the book (answer section missing or misnumbered) — answer supplied from current references.","n":111}]}];
const L='ABCDE';
let S={sel:new Set(DATA.map((_,i)=>i)),order:'book',list:[],pos:0,ans:{},multiPick:{}};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const id=(c,n)=>c+'-'+n;
function home(){
  document.body.querySelector('.nav')?.remove();
  const total=[...S.sel].reduce((a,c)=>a+DATA[c].q.length,0);
  $('#app').innerHTML=`<h1>ENT head &amp; neck SBA papers</h1><p class="sub">${DATA.reduce((a,c)=>a+c.q.length,0)} single-best-answer questions in six papers, in book wording. Keys rechecked against current references: corrected or supplied keys and repaired items are explained in the answer box. Pick papers, then start.</p>
  ${DATA.map((c,i)=>{const done=c.q.filter(q=>S.ans[id(i,q.n)]).length;return `<button class="chap ${S.sel.has(i)?'on':''}" onclick="tog(${i})" aria-pressed="${S.sel.has(i)}"><b>${c.t}</b>${done?`<span class="done">${done} done</span>`:''}<span>${c.q.length}</span></button>`}).join('')}
  <div class="row"><div class="seg" role="group" aria-label="Order"><button class="${S.order=='book'?'on':''}" onclick="S.order='book';home()">Book order</button><button class="${S.order=='shuf'?'on':''}" onclick="S.order='shuf';home()">Shuffled</button></div>
  <div class="seg"><button onclick="S.sel=new Set(DATA.map((_,i)=>i));home()">All</button><button onclick="S.sel=new Set();home()">None</button></div></div>
  <button class="primary" ${total?'':'disabled'} onclick="start()">Start ${total} questions</button>
  ${Object.keys(S.ans).length?`<div class="row"><button class="ghost" style="flex:1" onclick="results()">See results so far</button><button class="ghost" style="flex:1" onclick="if(confirm('Clear all answers?')){S.ans={};home()}">Clear answers</button></div>`:''}
  <p class="note" style="margin-top:18px">Answers are kept while this page is open. Tap any figure to enlarge.</p>`;
  scrollTo(0,0);
}
function tog(i){S.sel.has(i)?S.sel.delete(i):S.sel.add(i);home()}
function start(list){
  if(!list){list=[];[...S.sel].sort().forEach(c=>DATA[c].q.forEach(q=>list.push([c,q.n])));
    if(S.order=='shuf')for(let i=list.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[list[i],list[j]]=[list[j],list[i]]}}
  S.list=list;S.pos=0;const f=list.findIndex(([c,n])=>!S.ans[id(c,n)]);if(f>0)S.pos=f;show();
}
function score(){let a=0,r=0;S.list.forEach(([c,n])=>{const x=S.ans[id(c,n)];if(x){a++;if(x.ok)r++}});return{a,r}}
function show(){
  const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const A=S.ans[id(c,n)];const {a,r}=score();
  const pick=S.multiPick[id(c,n)]||new Set();
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="home()" aria-label="Back to papers">Papers</button><span class="t">${DATA[c].t}</span><span class="sc">${r}/${a}</span></div><div class="bar"><i style="width:${(S.pos+1)/S.list.length*100}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${S.list.length} &nbsp;·&nbsp; Book Q${q.bn||n}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${n}" onclick="zoom(this.src)">`).join('')}</div>`;
  if(q.m)h+=`<p class="note">More than one answer. Select all that apply, then check.</p>`;
  q.o.forEach((t,i)=>{const l=L[i];let cl='';
    if(A){if(q.k.includes(l))cl='ok';else if(A.pick.includes(l))cl='bad'}else if(pick.has(l))cl='sel';
    h+=`<button class="opt ${cl}" ${A?'disabled':''} onclick="choose('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(q.m&&!A)h+=`<button class="primary" style="margin-top:6px" ${pick.size?'':'disabled'} onclick="check()">Check answer</button>`;
  if(A){h+=`<div class="exp"><h3 class="${A.ok?'ok':'bad'}">${A.ok?'Correct':'Incorrect'} — answer ${q.k.split('').join(', ')}</h3>`;
    if(q.f)h+=`<div class="flag">${esc(q.f)}</div>`;
    h+=q.x?q.x.split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join(''):`<p class="note" style="margin:0">Key only — the book gives no explanation.</p>`;
    if(q.xi)h+=q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join('');
    h+=`</div>`}
  $('#app').innerHTML=h;
  let nav=document.querySelector('.nav');if(!nav){nav=document.createElement('div');nav.className='nav';document.body.appendChild(nav)}
  const last=S.pos==S.list.length-1;
  nav.innerHTML=`<div class="navi"><button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Jump</button><button class="primary" onclick="${last?'results()':'go(1)'}">${last?'Finish':'Next'}</button></div>`;
  scrollTo(0,0);
}
function choose(l){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);if(S.ans[k])return;
  if(q.m){const p=S.multiPick[k]||new Set();p.has(l)?p.delete(l):p.add(l);S.multiPick[k]=p;const y=scrollY;show();scrollTo(0,y);return}
  S.ans[k]={pick:[l],ok:l==q.k};const y=scrollY;show();scrollTo(0,y)}
function check(){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);const p=[...S.multiPick[k]].sort().join('');
  S.ans[k]={pick:p.split(''),ok:p==q.k};const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(S.list.length-1,S.pos+d));show()}
function grid(){const d=$('#dlg');
  d.innerHTML=`<b>Jump to question</b><div class="grid">${S.list.map(([c,n],i)=>{const a=S.ans[id(c,n)];return `<button class="${a?(a.ok?'g-ok':'g-bad'):''} ${i==S.pos?'g-cur':''}" onclick="S.pos=${i};$('#dlg').close();show()">${i+1}</button>`}).join('')}</div><button class="ghost" style="width:100%;margin-top:8px" onclick="$('#dlg').close()">Close</button>`;
  d.showModal()}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
function results(){
  document.querySelector('.nav')?.remove();
  let rows='',ta=0,tr=0,wrong=[];
  DATA.forEach((c,ci)=>{let a=0,r=0;c.q.forEach(q=>{const x=S.ans[id(ci,q.n)];if(x){a++;if(x.ok)r++;else wrong.push([ci,q.n])}});
    ta+=a;tr+=r;if(a)rows+=`<tr><td>${c.t}</td><td>${r}/${a} · ${Math.round(r/a*100)}%</td></tr>`});
  $('#app').innerHTML=`<h1>Results</h1><div class="big">${ta?Math.round(tr/ta*100):0}%</div><p class="sub">${tr} correct of ${ta} answered</p>
  <table>${rows||'<tr><td>No answers yet</td><td></td></tr>'}</table>
  ${wrong.length?`<button class="primary" onclick="redo()">Retry ${wrong.length} incorrect</button>`:''}
  <div class="row"><button class="ghost" style="flex:1" onclick="home()">Back to papers</button></div>`;
  S.wrong=wrong;scrollTo(0,0)}
function redo(){S.wrong.forEach(([c,n])=>{delete S.ans[id(c,n)];delete S.multiPick[id(c,n)]});start(S.wrong.slice())}
document.addEventListener('keydown',e=>{if($('#dlg').open||!document.querySelector('.nav'))return;
  if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else if('abcde'.includes(e.key.toLowerCase())&&e.key.length==1)choose(e.key.toUpperCase())});
home();
</script></body></html>
