postoperative mortality","Cricotracheal resection always requires a tracheostomy postoperatively","Swallowing is worse after cricotracheal resection","Voice changes after cricotracheal resection","There is no difference"],"k":"D","x":"Resection of the cricothyroid muscle is a necessary step for cricotracheal resection. This causes a reduced ability to elongate the vocal fold and elevate pitch. In women, in particular, there is risk of lowering the pitch of the voice. PAGE 958","d":"Laryngology","src":"Bailey · Laryngology · Q50"},{"s":"Compared to oronasal masks, nasal pillows interfaces may be associated with:","o":["Increased leak rate","Increased insomnia symptoms","Lower positive airway pressure (PAP) pressure requirements","Lower equipment costs"],"k":"C","x":"Compared to oronasal masks, nasal pillow interfaces may lower PAP pressure requirements. Studies also show that nasal pillows are associated with lower leak rates and less insomnia. Equipment costs are generally not significantly different between different mask interface types. PAGE 2508","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q7"},{"s":"Stroboscopy allows observation of which vocal fold characteristic in addition to those observed on continuous-light laryngoscopy?","o":["Mucosal color","Mucosal pliability","Gross vocal fold motion","Vascular lesions","Vocal fold hemorrhage"],"k":"B","x":"Stroboscopy uses a pulsed light source timed to flash just slightly off of the vocal fold vibratory frequency to yield an image of mucosal oscillation, which is otherwise too fast to be observed with continuous light. PAGE 994","d":"Laryngology","src":"Bailey · Laryngology · Q60"},{"s":"Evaluation for sleep surgery involves utilization of which of the following tools?","o":["Drug-induced sleep endoscopy","Physical examination","Patient history","In-office flexible nasopharyngoscopy","All of the above"],"k":"E","x":"Preoperative evaluation for patients with OSA is of vital importance in aiding with appropriate patient selection. A thorough patient history and physical examination, in-office flexible laryngoscopy, and drug-induced sleep endoscopy are all important components of this evaluation. PAGES 2552-2554","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q27"},{"s":"What is the most common cause for inadequate treatment of the deviated nasal bone?","o":["Undiagnosed high cephalic septal deviation","Failure to align the nasal tip","Scarring of nasal mucosa","Overly aggressive displacement of lateral osteotomies"],"k":"A","x":"Undiagnosed high cephalic septal deviation. PAGE","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q79"},{"s":"The inner hair cells are innervated by what type of spiral ganglion neurons?","o":["Type | spiral ganglion neurons","Type 2 spiral ganglion neurons","Both type 1 and type 2 spiral ganglion neurons","Neither type | nor type 2 spiral ganglion neuron"],"k":"A","x":"The inner hair cells are innervated by the type 1 spiral ganglion neurons, which are myelinated, bipolar neurons with afferent projections to the cochlear nucleus. PAGE 2627","d":"Otology","src":"Bailey · Otology and Neurotology · Q9"},{"s":"A 40-year-old female with a history of T4N1MO0 sinonasal melanoma that has not responded to chemotherapy and immunotherapy presents to your clinic with multiple concerns. Of note, she has lost vision in her right eye and is bothered by facial disfigurement caused by her tumor. In addition, she reports constant facial pain, odor, and intermittent nasal bleeding. Which of the following reasons would not be an indication to proceed with palliative surgery?","o":["Intermittent hemorrhage","Cosmesis","Intractable pain","All of the above can be considered indications for palliative surgery"],"k":"D","x":"Palliative surgery can be considered in a number of clinical scenarios after careful evaluation of risks and benefits. Aggressive surgery can be considered if symptoms, quality of life, and longevity are positively influenced by treatment of locoregional disease or tumor debulking. PAGE 278","d":"Rhinology","src":"Bailey · Basic Science/General Medicine · Q80"},{"s":"A 5-year-old boy presents with multiple, skin-colored papules clustered around the nose and upper lip. His mother is requesting removal of the lesions given the cosmetic appearance. The patient was diagnosed with vitiligo and infantile spasms within the past few years. What is the next best step?","o":["Complete skin examination","Curettage","Excision","Dermabrasion"],"k":"A","x":"The vignette describes adenoma sebaceum (facial angiofibromas), hypopigmented macules (“vitiligo”), and infantile spasms. This constellation of symptoms is suggestive of a systemic disease like tuberous sclerosis. A full skin examination may reveal a Shagreen patch (collagenoma), periungual fibromas, and or a fibrous forehead plaque. Systemic manifestations can include intellectual disability, cardiac rhabdomyoma, cortical dysplasia, and angiomyolipomas. Genetic testing may reveal a mutation in TSC1 or TSC2. PAGE 3805","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q121"},{"s":"In which scenario is a diagnosis of ILO most likely?","o":["A 23-year-old female presents to the emergency department with dyspnea and wheezing. Symptoms are unresponsive to inhaled albuterol. Chest x-ray is normal. An arterial blood gas was drawn upon arrival while on room air with the following results: PaO₂ 54, PaCO₂ 63, A-a gradient 17.","A 17-year-old competitive rower reports that after approximately 15 minutes of intense rowing, they become progressively short of breath and lose their ability to maintain stamina. The patient also notes noisy breathing during these episodes upon exhalation and chest tightness. This forces the patient to stop exercising. After sitting calmly for 15 to 20 minutes, the patient is usually back to their baseline.","A 21-year-old female presents to a pulmonologist for exercise-induced dyspnea, cough, and noisy breathing. Pulmonary function tests are performed. There is reduced peak expiratory flow and a scooped appearance to the expiratory flow limb. This is reversible upon administration of bronchodilator. The pulmonologist proceeds with bronchoprovocation testing. Immediately following administration of methacholine, the patient develops dyspnea, throat tightness, and inspiratory stridor.","A 45-year-old male reports dyspnea, inspiratory stridor, and dysphonia that began 6 weeks ago. The symptoms worsen with exertion but are present even at baseline. His bed partner does not notice stridor or any apneas at night while sleeping. Laryngoscopy demonstrates adduction of the true vocal folds during inspiration."],"k":"C","x":"Baseline spirometry for the patient in (C) is suggestive of an obstructive pattern, and reversibility suggests asthma. However, the bronchoprovocation challenge with methacholine immediately induces symptoms classic for [LO—dyspnea, symptoms localizing to the throat, and inspiratory stridor. It is key to recognize that a diagnosis of asthma does not preclude a diagnosis of ILO. Both can, and often, coexist. This patient likely has ILO and asthma. Patient (A) is presenting with an acute exacerbation of asthma. Patients presenting with an acute episode of isolated ILO should not be hypoxic, and the A-a gradient is always normal, and PaCO₂ can be variable. Patient (B) is most likely presenting with exercise-induced asthma given the gradual onset of symptoms that peak after maximal exercise has been ongoing for some time and then takes a longer duration of rest before resolution. Patient (D) likely has respiratory laryngeal dystonia given their symptoms have been present greater than 4-week duration, are constant while awake, and abate only at night. PAGES 880-881","d":"Laryngology","src":"Bailey · Laryngology · Q33"},{"s":"During development, which of the following structures receives embryologic contribution from the otic capsule?","o":["Malleus","EAC","Incus","Stapes footplate"],"k":"D","x":"The ossicles, except for the vestibular portion of the stapes footplate, are formed from the first and second branchial arches. The external ear canal and tympanic membrane are derived from the first branchial cleft. The stapes footplate is formed in part from the otic capsule, and in most cases, it is normally developed in ears with congenital atresia. PAGE 1742","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q142"},{"s":"A 60-year-old patient with a history of salivary duct carcinoma of the submandibular gland is found to have metastatic disease on PET imaging. What potential systemic treatment may be considered in this patient pending pathologic analysis?","o":["BRAF inhibitor","Androgen receptor inhibitor","Tyrosine kinase inhibitor","Ipilimumab"],"k":"B","x":"A proportion of patients with salivary duct carcinoma show overexpression of androgen receptors. As such, androgen deprivation therapy may be a potential systemic treatment pending pathologic analysis. Androgen deprivation therapy with leuprorelin and bicalutamide showed partial or complete response in 41.7% of patients. PAGE 2084","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q46"},{"s":"A 68-year-old male presents to the clinic upon referral for vasomotor rhinitis and is accompanied by his wife. During the visit, his wife asks you for current time, which prompts the patient to say, “Why do you want to know about his dimes?” He has no significant medical problems, and his head and neck examination, including otoscopy, is unremarkable. In layman’s terms, you tell the patient and his wife your impression while washing your hands at sink, but the patient looks confused when you turn around to face him. After repeating yourself, you ask the patient if he has had any difficulty hearing, to which he admits he can never hear his wife whenever they go out for dinner. Regarding his hearing, what is the most appropriate next step?","o":["Hearing screening.","Referral for hearing aids.","Obtain MRI of the brain.","Reassure the patient that there are no significant concerns."],"k":"A","x":"Although this patient is being seen for another complaint, his untreated ARHL should not be ignored. Older adults with measurable hearing loss may or may not have subjective hearing concerns. Worsening ARHL, preferentially affecting high-frequency consonants, may lead to misinterpreting words, for example, “time” versus “dime,” and often struggle with hearing-in-noise, such as at social gatherings or restaurants. Based on the U.S. Preventive Services Task Force recommendations, it is expected that patients who have perceived hearing problems or hearing-related cognitive symptoms should be assessed for objective hearing impairment. Sensory management and aural rehabilitation should be discussed and implemented based on the patient’s hearing impairment and subsequent handicap. PAGES 3090-3094","d":"Otology","src":"Bailey · Otology and Neurotology · Q122"},{"s":"Central nervous conditions often have accompanying oromotor dysfunction that profoundly affects feeding and speech skills. Which of the following conditions represents a condition that is chronic but static and affects oromotor skills?","o":["Progressive spinal muscular atrophy","Duchenne muscular dystrophy","Myasthenia gravis","Cerebral palsy"],"k":"D","x":"Cerebral palsy occurs secondary to central nervous system injury and includes a diverse group of chronic but nonprogressive disorders of movement, posture, and tone. Oral motor and swallowing dysfunction are common in children with cerebral palsy secondary to the neurologic impairment and the effect on the muscles involved in the oral, pharyngeal, and esophageal stages of the swallow. PAGE 1414","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q36"},{"s":"In addition to cumulative environmental injury, olfactory dysfunction with age has been attributed to which of the following?","o":["Decreased regenerative capacity of the olfactory epithelium","Cortical neurodegeneration","Loss of volume of the olfactory bulb","Scarring at the olfactory epithelium"],"k":"A","x":"Possible theories for age-associated olfactory loss include eventual wear-and-tear of the olfactory neurons from the cumulative effect of exposure to environmental toxins and/or progressive depletion of the regenerative capacity of epithelial basal/ stem cells and genetically programmed cell death. PAGE 315","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q8"},{"s":"Which of the following is the most common complication of otitis media?","o":["Petrositis","Labyrinthitis","Facial paralysis","Mastoiditis"],"k":"D","x":"Mastoiditis is the most common complication of otitis media given the continuity between the middle ear cavity and the mastoid air spaces. During an episode of otitis media, the mucosa lining the middle ear and the mastoid can become inflamed. When inflammation persists, purulent material can accumulate within the mastoid cavities and destroy the thin bony septae between air cells. In 58% of the cases, dissection through the lateral cortex of the mastoid results in a subperiosteal abscess posterior to the pinna. PAGES 2773-2775","d":"Otology","src":"Bailey · Otology and Neurotology · Q42"},{"s":"A nonimmunized, 6-year-old child presents with chronic cough. Cough presents in rapid, uncontrollable fits. What is the leading diagnosis?","o":["Pertussis","Laryngomalacia","TM","Plastic bronchitis"],"k":"A","x":"Pertussis leads to whooping cough and can present in nonimmunized children. TM causes barky cough but not in rapid succession. Laryngomalacia is associated with stridor, cough, and feeding difficulties in infants and toddlers. Plastic bronchitis is associated with cast production and also not seen in rapid succession. PAGE 1436, Table 93.1","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q48"},{"s":"Which cell type pushes the frontal drainage pathway in a lateral direction?","o":["Supraorbital ethmoid cell","Supra agger frontal cell","Frontal septal cell","Supra bulla cell"],"k":"C","x":"The frontal septal cell sits medially and pushes the frontal drainage pathway in a lateral direction. The supra bulla cell and supraorbital ethmoid cells sit posteriorly and push the frontal drainage pathway anteriorly. The supra agger frontal cell sits anteriorly and pushes the frontal drainage pathway posteriorly. PAGE 634","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q118"},{"s":"Which is a reliable anatomic relationship during mastoid surgery?","o":["The sigmoid sinus lies under a thin layer of air cells.","MacEwen triangle sits posterior to the spine of Henle.","The tegmen mastoideum forms a flat plane over the mastoid cavity.","The facial nerve is medial to the lateral (horizontal) semicircular canal."],"k":"B","x":"The position of MacEwen triangle is reliably found posterior to the spine of Henle at the posterosuperior limit of the bony EAC. The triangle can be used as an approximate indicator of the antrum directly medially. However, the dimensions of the spine of Henle vary and in some people are relatively indistinct. The sigmoid sinus can lie directly under the cortical bone of the skull, and the lateral portion of the tegmen mastoideum can lie lower than the medial part. The facial nerve is medial to the lateral extent of the otic capsule at the second genu but travels laterally as it moves inferiorly. PAGES 2819-2820","d":"Otology","src":"Bailey · Otology and Neurotology · Q60"},{"s":"What structure identifies the posterior midline dissection limit (the “T”’) for a frontal drill-out procedure?","o":["The first olfactory neuron","The cribriform plate","The posterior wall of the frontal sinus","The medial aspect of the anterior ethmoid artery"],"k":"A","x":"The first olfactory neuron is used to identify the posterior limit of bone removal in the midline during a frontal drill out procedure. PAGE 642","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q119"},{"s":"What is are the predominant feature of classic, or type I achalasia on high-resolution manometry?","o":["Elevated integrated relaxation pressure and absent esophageal peristal","Decreased integrated relaxation pressure and hypercontractile peristalsis","Elevated integrated relaxation pressure and intact esophageal peristalsis","Decreased integrated relaxation pressure and spastic esophageal peristalsis"],"k":"A","x":"Elevated integrated relaxation pressure and absent esophageal peristalsis. PAGES 850-851","d":"Laryngology","src":"Bailey · Laryngology · Q26"},{"s":"What key sign of petrositis may not be volunteered by a patient and should be specifically solicited during patient history taking and physical examination?","o":["Retro-orbital pain","Headache","Ear pain","Hearing loss"],"k":"A","x":"Petrous apicitis typically presents with deep, retro-orbital pain in the setting of COM. Gradenigo syndrome is a triad of symptoms seen with petrous apicitis and consists of retro-orbital pain, otorrhea, and abducens palsy. Other manifestations can include facial paralysis, and sensory hearing loss and vertigo due to labyrinthitis. PAGE 2775","d":"Otology","src":"Bailey · Otology and Neurotology · Q46"},{"s":"Dupilumab is a monoclonal antibody approved for use in CRS with nasal polyposis. The target for dupilumab is?","o":["IL-4","IL-4 receptor","IL-5","IL-13"],"k":"B","x":"IL-4, IL-5, and IL-13 are all targets for “biologics” —. monoclonal antibodies designed to treat type 2 inflammation; the inflammatory process common in patients with asthma and CRS with polyps. Dupilumab was the first biologic FDA approved for treatment of CRS with polyps and targets the alpha subunit of the IL-4 receptor. This receptor subunit is also part of the IL-13 receptor, and therefore, dupilumab inhibits both IL-4 and IL-13. PAGE 555","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q83"},{"s":"A 5-year-old patient with no other risk factors has a long-standing high grade III SGS and no vocal fold involvement. Which procedure would have the highest chance of surgical success in this patient?","o":["Endoscopic division with CO₂ laser","Anterior graft laryngotracheoplasty","Endoscopic balloon dilation","Cricotracheal resection"],"k":"D","x":"Cricotracheal resection has the highest chance of surgical success with a 90% success rate. Option A has variable success rates of 60% to 80% and works best in lower-grade stenosis. Option B, although some cases may be treated with an anterior graft high-grade SGS has lower success rates of 60% to 80%. Option C, in an acute balloon dilation maybe successful. In this case, balloon dilation would not be the best choice for success. PAGES 1446-1447","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q56"},{"s":"With regards to the unified airway:","o":["There is no evidence that immunotherapy for allergic rhinitis in children may reduce the risk of developing asthma","Nasal allergen provocation in allergic nonasthmatic patients induced increased eosinophilia in the bronchial mucosa as well as increased expression of cellular adhesion molecules, signifying increased inflammatory cell migration","When looking at bronchial biopsies, atopic nonasthmatics (patients with AR but without the diagnosis of asthma) had no basement membrane thickening and no eosinophilic inflammation in their lower airways.","The Finnish Twin Cohort Study showed that the allergic rhinitis and the development of asthma have no temporal relationship"],"k":"B","x":"A study by Branstahl showed that nasal allergen provocation in allergic nonasthmatic patients induced increased eosinophilia in the bronchial mucosa as well as increased expression of cellular adhesion molecules, signifying increased inflammatory cell migration. This study demonstrates that inflammation in one part of the airway can lead to inflammation in another site and align with the unified airway concept. A separate study of 205 children aged 6 to 14 years without a diagnosis of asthma were randomized to treatment of a birch or grass pollen allergy versus an open control group and followed. At 3, 5, and 7 years. had developed asthma, while only 26% of the treatment group had approximately 45% of the control group developed asthma. Studies of bronchial biopsies show that atopic nonasthmatics had basement membrane thickening and eosinophilic inflammation in lower airways. The Finnish Twin Cohort Study suggests that AR is a risk factor for the development of asthma. PAGES 512-513","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q66"},{"s":"Saddle nose deformity is most commonly associated with which systemic disease?","o":["Sarcoidosis","Eosinophilic granulomatosis with polyangiitis (EGPA) (formerly Churg-Strauss disease)","Granulomatosis with polyangiitis (formerly Wegner granulomatosis)","Sjogren syndrome"],"k":"C","x":"Septal involvement can result in perforation or saddle nose deformity in up to 10% to 25% of patients with GPA. Other common intranasal symptoms of GPA include mucosal crusting, increased friability, and epistaxis. PAGE 443","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q42"},{"s":"While raising a tympanomeatal flap with an endoscope, all of the following techniques may be used to achieve adequate hemostasis except:","o":["Use of cotton balls or another small pledgets soaked in concentrated epinephrine solution","Injection of the tympanomeatal flap prior to incision with epinephrine solution","Placing the operating table in the Trendelenburg position","Maintaining the systemic blood pressure as low as possible","Use of a specialized suction dissector to simultaneously dissect the flap and evacuate blood"],"k":"C","x":"Achieving hemostasis with endoscopic ear surgery can be challenging, particularly for novice endoscopic ear surgeons. Placing the patient in reverse Trendelenburg, maintaining the systemic blood pressure as low as possible, and use of epinephrine can improve hemostasis. PAGES 3151-3152","d":"Otology","src":"Bailey · Otology and Neurotology · Q134"},{"s":"Which congenital viral etiology of sensorineural hearing loss is potentially preventable with prompt recognition and intervention?","o":["Cytomegalovirus","HSV","Varicella-zoster virus","Influenza virus"],"k":"A","x":"In symptomatic cytomegalovirus in neonates, treatment with parenteral ganciclovir has been shown to decrease hearing loss. PAGE 2897","d":"Otology","src":"Bailey · Otology and Neurotology · Q78"},{"s":"Transnasal esophagoscopy affords many advantages over conventional peroral esophagoscopy though traditional Esophagogastroduodenoscopy remains preferred for:","o":["Complication profile","Patient tolerance","Barrett esophagus screening at the gastroesophageal junction","Interventional procedures requiring sedation","Velopharyngeal insufficiency assessment"],"k":"D","x":"Interventional procedures requiring sedation. (Amin M, Postma G, Setzen M, et al. Transnasal esophagoscopy: a position statement from the American Bronchoesophagological Association (ABEA). Otolaryngol Head Neck Surg. 2008;138(4):411-414.) PAGES 815-817","d":"Laryngology","src":"Bailey · Laryngology · Q11"},{"s":"To appropriately stage a posterior glottic stenosis, the following is required:","o":["CT scan of the larynx","Office flexible laryngoscopy without laryngeal topical anesthesia","Laryngeal electromyography","Operative direct laryngoscopy","Pulmonary function testing"],"k":"D","x":"Bogdasarian and Olson staging of posterior glottic stenosis requires an assessment of the mobility of the cricoarytenoid joints. While all of these tests are useful patient assessment tools, only operative laryngoscopy with palpation of the joints provides the necessary information to complete staging. PAGE 954","d":"Laryngology","src":"Bailey · Laryngology · Q51"},{"s":"The disadvantages of endoscopic ear surgery include all of the following except:","o":["Lack of binocular vision","Challenges with hemostasis","Increased risk of thermal injury","Poorer tympanoplasty outcomes than microscopic otologic surgery","Steep learning curve"],"k":"D","x":"Several studies have shown that the outcomes for endoscopic tympanoplasty are on par with microscopic tympanoplasty. PAGES 3141-3143","d":"Otology","src":"Bailey · Otology and Neurotology · Q135"},{"s":"For which of the following fractures would observation be appropriate?","o":["Anterior table fracture displaced by 7 mm with minimal comminution","Posterior table fracture with CSF leak, significant pneumocephalus, and severe comminution","Anterior table fracture displaced 2 mm with comminution","Frontal sinus outflow tract fracture with complete obstruction"],"k":"C","x":"Anterior table fracture displaced 2 mm with comminution. PAGE 1311","d":"H&N / Plastics / Trauma","src":"Bailey · Trauma · Q44"},{"s":"The is the workhorse reconstructive graft used to treat internal nasal valve narrowing.","o":["Butterfly graft","Lateral crural strut graft","Spreader graft","Alar rim graft"],"k":"C","x":"The spreader graft is the workhorse reconstructive graft in the management of internal nasal valve narrowing. PAGE 3572","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q71"},{"s":"A false-negative sweat chloride test is most frequently seen with which of the following scenarios?","o":["Hypoparathyroidism","Dehydration","Adrenal insufficiency","Skin edema"],"k":"D","x":"The two most common causes of a false-negative sweat test are (a) lab error and (b) skin edema. False-positive tests can be due to hypoparathyroidism, dehydration, and adrenal insufficiency. PAGE 394","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q29"},{"s":"While performing the canalplasty for atresia repair, an abnormally positioned facial nerve is most encountered in which of the following locations?","o":["Surface of the mastoid cortex","Superiorly, along the tegmen mastoideum","Posteriorly and inferiorly, along the newly formed EAC","None of the above"],"k":"C","x":"Facial nerve abnormalities are common in cases of aural atresia, and the facial nerve may take an anomalous course. Typically, the facial nerve makes an acute angle at the second genu, crossing the middle ear in a more anterior and lateral direction to exit into the glenoid fossa. This abnormal position of the mastoid segment of the facial nerve places it at jeopardy when drilling the posterior inferior portion of the new external ear canal. PAGE 1747","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q143"}]},{"title":"Paper 7 — Head & Neck and Paediatrics focus","q":[{"s":"Which condition is caused by a biallelic mutation in SLC26A4?","o":["Alport syndrome","Achondroplasia","Beckwith-Wiedemann syndrome","Pendred syndrome"],"k":"D","x":"Pendred is an autosomal recessive disorder characterized by thyroid goiter and sensorineural hearing loss caused by the biallelic mutation in the PDS gene (SLC26A4) affecting pendrin protein function. Achondroplasia is associated with FGF3 mutation. The other two do not have clearly identified mutations. PAGE 1858","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q174"},{"s":"Where is the most common site of hereditary hemorrhagic telangiectasia (HHT)-associated epistaxis?","o":["Anterior septal mucosa","Woodruff plexus","Middle turbinate","Anterior skull base"],"k":"A","x":"HHT, also known as Osler-Weber-Rendu disease, is an autosomal dominant disorder characterized by vascular malformations in many organ systems (Chapter 31, Section “Hereditary Hemorrhagic Telangiectasia”). Telangiectasias are predominantly found in the anterior septal mucosa, although they are also often found on the skin of the helix of the ear, soft palate mucosa, circumoral region, and nail beds/fingertips. PAGE 447","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q45"},{"s":"What is the proper order of the delineation of target volumes for head and neck radiotherapy planning?","o":["Planning target volume, clinical target volume","Internal target volume, planning target volume, clinical target volume","Internal target volume, clinical target volume, planning target volume","Gross tumor volume, clinical target volume, planning target volume","Gross tumor volume, internal tumor volume, clinical target volume"],"k":"D","x":"The gross tumor volume (if it exists) is always delineated first. Then an expansion is made to the clinical target volume and another is made to the planning target volume. In options A and B, the planning target volume is larger than the clinical target volume so it cannot be drawn first. In options B, C, and D, the internal target volume is used to account for breathing motion in lung cancer treatment and is not used in head and neck planning. PAGE 2006","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q19"},{"s":"The rotational chair test is best suited for describing the extent of what peripheral structures?","o":["Eyes","Saccules","Horizontal canals","Utricles"],"k":"C","x":"Rotary chair testing is capable of delivering rotational stimuli that can effectively evaluate the horizontal semicircular canals and horizontal VOR. Additional information gained is an evaluation of vestibular compensation mechanisms, disease progression, or therapeutic responses, as these can be efficiently monitored with rotational testing. Rotational testing can assess a wide response frequency and is the gold standard for describing suspected bilateral vestibular areflexia. PAGES 2687-2690","d":"Otology","src":"Bailey · Otology and Neurotology · Q24"},{"s":"There is literature demonstrating delayed breakdowns of successful laryngotracheoesophageal cleft repairs. What is the suggested minimum duration of follow-up to not miss this occurrence?","o":["6 months","| year","2 years","4 years"],"k":"D","x":"de Alarcon et al showed that type III laryngotracheoesophageal clefts can break down up to 48 months after repair. Lower-grade clefts tend to breakdown earlier but prudent to monitor these patients for symptoms of late breakdown. PAGE 1355","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q9"},{"s":"Choose the option with common types and subtypes of rhabdomyosarcomas:","o":["Myosarcoma, embryonal, rhabdomyoblastoma, spitzoid","Epithelioid, botryoid, spitzoid, alveolar","Embryonal, botryoid, spindle cell, alveolar","Myosarcoma, epithelioid, rhabdomyoblastoma, spindle cell","Embryonal, botryoid, rhabdomyoblastoma, alveolar"],"k":"C","x":"Embryonal, botryoid, spindle cell, alveolar is the correct answer as it is the only option with four types of rhabdomyosarcoma. PAGE 1799","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q155"},{"s":"During a planned near-total parathyroidectomy for a patient with tertiary hyperparathyroidism, you successfully identify two superior glands along the posterior aspects of the superior poles bilaterally. You are also able to identify an enlarged left inferior gland just inferior to the left thyroid lobe. However, you are unable to positively identify a right inferior parathyroid gland despite a thorough search along the inferior aspect of the right thyroid lobe. In which of the following areas should you begin your search for the suspected ectopic gland?","o":["Retroesophageal","Thymus and superior mediastinum","Carotid sheath","Intrathyroidal"],"k":"B","x":"The inferior parathyroid glands and the thymus are embryologically derived from the 3rd pharyngeal pouches. As these structures descend caudally, the inferior parathyroid glands generally come to rest at or near the inferior pole of the thyroid gland. However, this embryologic origin results in increased variability in the location of the inferior parathyroid glands, and ectopic inferior glands are most frequently identified in the anterior mediastinum either in close proximity to or within the substance of the residual thymic gland. If the search in the expected locations fails to identify an inferior gland, the next location that should be interrogated is the upper anterior mediastinum and within the thymus. Option A denotes an ectopic location of a superior gland. Options C and D are rarer ectopic locations that can be considered and evaluated if a gland is not found in the more common ectopic locations. PAGE 2423","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q136"},{"s":"What is a not a typical treatment of EoE?","o":["Swallowed steroids","Proton pump inhibitors (PPIs)","Leukotriene antagonists","Elimination diet"],"k":"C","x":"Mast cell stabilizers like cromolyn and leukotriene receptor antagonist do not work for EoE both for clinical and histologic remission and are not recommended for management of EoE. PAGE 1945, Table 123.3","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q196"},{"s":"Multidisciplinary head and neck clinics have been shown to be associated with which of the following patient outcomes?","o":["Lower psychosocial distress","Increased cost of health care delivery","Increased likelihood of completion of adjuvant therapy","Reduced enrollment into clinical trials"],"k":"C","x":"Multidisciplinary care has shown to be associated with increased likelihood of completion of adjuvant therapy but has not yet been shown to definitively decrease distress. Starmer et al analyzed 118 oropharyngeal cancer patients and found that those who had a multi-disciplinary team (MDT) had more speech therapy visits than non- MDT patients (mean 1.8 vs 0.2, P < .0001), and MDT participation was the only significant variable associated with speech therapy compliance (OR, 12.9; 95% CI, 3.7-45.2). In a study of 1,616 oral cavity cancer patients, Liao et al found that 89.5% of MDT patients completed adjuvant chemoradiation therapy as recommended compared with 57.6% in the non-MDT group (P < .001). PAGE 1996","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q11"},{"s":"A 12-year-old child presents to the clinic with a history of intermittent, unilateral swelling in the right upper neck associated with ipsilateral pain, every time he eats. The most likely diagnosis is:","o":["Right parotid lithiasis","A 3-mm stone in Warthin’s duct","Sjégren syndrome","Recurrent parotitis of childhood"],"k":"B","x":"In children, sialolithiasis of the submandibular gland is more common than parotid sialolithiasis. Common symptoms include intermittent, unilateral swelling in the affected gland with ipsilateral pain, mostly associated with meals. PAGE 1657","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q120"},{"s":"The most common complication of otoplasty is:","o":["Hematoma","Infection","Failure to correct the protrusion","Asymmetry"],"k":"D","x":"No two ears are ever perfectly symmetric, especially in surgically corrected ears. PAGES 3752-3754","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q108"},{"s":"An 11-year-old female with CRS continues to have significant symptoms affecting her quality of life despite multiple medical interventions. What is the most appropriate first-line surgical treatment for this patient?","o":["In-office balloon sinuplasty","Bilateral maxillary antrostomy, anterior ethmoidectomy","Adenoidectomy","Tonsillectomy and adenoidectomy"],"k":"C","x":"Adenoidectomy is considered the first-line surgical intervention for pediatric patients with CRS who have failed medical management under 12 years of age. Balloon sinuplasty is a relatively recent intervention with inconclusive data published about its effectiveness in treating CRS as an isolated procedure. Functional endoscopic sinus surgery may be considered if her symptoms persist after adenoidectomy. Tonsillectomy is not used to treat CRS. PAGE","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q104"},{"s":"Which of the following elements are required for a response to immune checkpoint blockade?","o":["Tumor antigens (viral antigens, neoantigens, or tumor-associated antigens)","Suppression of antigen processing and presentation machinery","Antigen-specific B cells","HPV-related cancer"],"k":"A","x":"In order to generate an effective antitumor immune response, a tumor must have functional antigens. These antigens must then be processed and presented, and antigen-specific T cells must be present in order to respond. This response should not be specific to tumor type, although some cancers may be more sensitive than others. A response to immune checkpoint blockade is unlikely if any of these elements are missing. PAGE 1983","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q9"},{"s":"The main IgG subclass that is increased during maintenance immunotherapy is:","o":["IgG1","IgG2","IgG3","IgG4"],"k":"D","x":"High-dose allergen exposure during immunotherapy results in both immune deviation of Th2 responses in favor of a ThO/ Th1 response and the generation of IL-10-and transforming growth factor-B—producing Tregs, with resultant suppression of effector cells and prevention of seasonal increases in ILC2. Maintenance exposure induces preferential switching of B-cell respons antibodies. PAGE 331 s in favor of IgG4","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q13"},{"s":"Which is true regarding surgical technique when performing pediatric tracheotomy?","o":["Horizontal tracheotomy incision is preferred in infants.","Right and left “stay sutures” are infrequently placed by surgeons who perform tracheotomy in young children.","Surgeons who mature the stoma during tracheotomy procedures feel that this step may decrease significant morbidity if there is an accidental decannulation.","Stoma maturation has been shown to increase rates of postoperative complications, including development of stomal granulation and persistent tracheocutaneous fistulae."],"k":"C","x":"Studies suggest that maturation of the stoma may decrease the morbidity of early accidental decannulation, making it easier to replace the tracheostomy tube in this case. This practice does not appear to increase rates of tracheocutaneous fistula after decannulation. PAGES 1490-1491","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q67"},{"s":"Sentinel lymph node biopsy should be routinely offered when a patient has:","o":["A 0.5-mm-thick melanoma of the scalp without ulceration and no clinical evidence of lymph node metastases","A 2.5-mm-thick melanoma of the scalp without ulceration and no clinical evidence of lymph node metastases","A 2.5-mm-thick melanoma of the scalp without ulceration and with lymph node metastases in two cervical lymph nodes","A 2.5-mm-thick melanoma of the scalp without ulceration, with no clinical evidence of lymph node metastases, and with distant metastases in the spine"],"k":"B","x":"A sentinel lymph node biopsy should be routinely offered to patients with T2 to T3 lesions (1-4 mm of depth) without clinical nodal or distant metastasis. PAGE 2063","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q38"},{"s":"HPV has been detected in up to what percentage of squamous cell carcinomas of the sinonasal cavity?","o":["5%","15%","25%","50%","75%"],"k":"C","x":"HPV has been detected in up to 25% of sinonasal squamous cell carcinomas. There is some suggestion that these may also be associated with better prognosis. PAGE 2346","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q111"},{"s":"What occurs in during the radiation simulation process for a head and neck cancer patient?","o":["A mask is formed over head and neck of the patient, and caliper measurements are taken of the patient’s body.","A mask is formed over the head and neck of the patient and a computed tomography (CT) scan is obtained.","The patient is placed into a CT scanner, and the exact conditions of the treatment are then simulated immediately on the radiation machine.","The patient is placed into the radiation machine, and the treatment to be delivered is simulated on the patient.","The patient is placed in the radiation machine, simulated, and the first treatment is delivered."],"k":"B","x":"In a simulation, a mask is formed to ensure a stable position of the patient’s head and neck and then a planning CT scan is obtained. No physical measurements of the body are taken in today’s era (option A). The patient is not placed into the radiation machine during simulation (options C, D, and E), and no treatment is given at the time of simulation (D and E). PAGES 2005-2006","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q18"},{"s":"A 59-year-old male presents with an advanced cervical esophageal carcinoma. Treatment recommendation is for surgery followed by free tissue reconstruction. What microvascular tissue flap best achieves the reconstruction?","o":["Radial forearm flap","Colonic interposition","Jejunal flap","Pectoral myocutaneous flap"],"k":"C","x":"In the reconstruction section, the discussion outlines reconstructive options after cervical esophagectomy. In these situations, the surgery requires complete esophagectomy for complete disease clearance. The radial forearm flap will not provide the coverage. The jejunal flap is the only free tissue flap in the selections. Colon interposition is a pedicled flap. PAGE 2244","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q84"},{"s":"What is the surveillance protocol that can be considered for sentinel lymph node biopsy (SLNB)-positive patients without other metastatic disease who did not undergo completion lymph node dissection (CLND)?","o":["CT scan every year for first 2 years","Positron emission topography (PET)/CT scan every year for first 2 years","Nodal basin ultrasound every 4 months for first 2 years","Nodal basin ultrasound every 2 months for first 2 years"],"k":"C","x":"For SLNB-positive patients, regional lymph node assessment via ultrasound can be offered every 4 months in the first 2 years and then every 6 months from years 3 to 5 (consistent with MSLT-II and DeCOG). PAGE 2073","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q40"},{"s":"Which head and neck cancers have favorable outcomes that support investigation for deintensification of therapy?","o":["HPV-related cancers","HPV-related oropharyngeal cancers","HPV-negative cancers","Epstein-Barr virus (EBV)-related cancers"],"k":"B","x":"HPV-related oropharyngeal cancers respond well to both surgical and nonsurgical treatments with a 5-year survival greater than 80%. The mechanism of tumor suppressor gene inactivation due to HPV compared to mutagenesis secondary to tobacco and alcohol carcinogenesis portends greater sensitivity to treatment. PAGE 2020","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q25"},{"s":"In the incisional techniques, it is imperative that the incisions:","o":["Cross the antihelix","Enter the fossa triangularis","Are perpendicular to the anatomic landmarks","Do not cross anatomic landmarks"],"k":"A","x":"Cross the antihelix. PAGE 3744","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q102"},{"s":"What is the most commonly reported long-term toxicity of radiation therapy to the head and neck?","o":["Dyspnea","Dysphagia","Pain","Sleep disturbance","Anxiety"],"k":"B","x":"Dysphagia is the most common long-term toxicity experienced by patients. A precise estimate of prevalence is hampered by a variety of reporting metrics such as response to PROM’s or surrogate outcomes such as feeding tube use. PAGE 2444","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q140"},{"s":"The approximate success rate for identifying the occult primary site with the application of transoral surgery in the context of p16-positive neck nodes is:","o":["20%","40%","80%","100%"],"k":"C","x":"Several studies quoted in the chapter demonstrate that the transoral surgery identifies the primary site in approximately 80% of cases. However, preliminary reports suggest that the yield may be lower in p16-negative cases. PAGE 2204","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q72"},{"s":"The patient had an uneventful AT and 6 months after the surgery, the parents reported that he continued to have snoring after the initial first month of improvement. Which of the following could be considered the next best step in managing this patient?","o":["Repeat PSG","Observation only","Revision adenoidectomy","Hyoid suspension"],"k":"A","x":"An in-laboratory, nighttime PSG remains the gold standard for diagnosis of OSA both before and after AT. PAGE 1569","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q84"},{"s":"What CIM therapy is recommended as an option for allergic rhinitis patients desiring nonpharmacologic therapy?","o":["Acupuncture","Black caraway or cumin seed","Butterbur","Honey produced with local pollens"],"k":"A","x":"Recent meta-analyses of RCTs indicate that acupuncture may reduce nasal symptoms, improve quality of life, and reduce the need for rescue medications in allergic rhinitis. Clinical practice guidelines and international consensus statements recommend acupuncture as an option. Black caraway or cumin seed (Nigella sativa) and butterbur may improve allergic rhinitis symptoms, but study results are mixed for both treatments. Likewise, results for honey in the management of allergic rhinitis are variable. Overall, most studies exploring the efficacy of natural product therapies for allergic rhinitis are small and of limited methodological quality, resulting in no recommendation for natural products in allergic rhinitis treatment guidelines. PAGE 257","d":"Rhinology","src":"Bailey · Basic Science/General Medicine · Q72"},{"s":"Which laryngeal muscle is bilaterally innervated?","o":["Thyroarytenoid","Interarytenoid","Cricothyroid","Lateral cricoarytenoid","Posterior cricoarytenoid"],"k":"B","x":"The interarytenoid muscle receives innervation from each RLN (right and left), given that it is a midline muscle. PAGES 865-866 32. Answer: Figure (D). ILO classically presents with a variable extrathoracic obstructive pattern flow volume loop, as depicted in Figure (D). Figure (A) represents a normal flow volume loop. While this is possible for a patient with ILO who is asymptomatic (ie, not acutely experiencing a dyspnea episode), it would be a less likely tracing for an acute ILO episode. Figure (B) depicts a fixed obstruction. This is classic for subglottic stenosis, where the stricture is nondynamic due to the circumferential rigid cricoid which minimizes variation of the degree of obstruction with respiration. Figure (C) represents variable intrathoracic obstruction (ie, airway below thoracic inlet) such as seen with tracheomalacia or tumors of the trachea/mainstem bronchus. PAGE 880","d":"Laryngology","src":"Bailey · Laryngology · Q31"},{"s":"In the management of long segment tracheal stenosis secondary to complete tracheal ring deformity (CTRD), which of the following procedures is considered the gold standard of treatment?","o":["Tracheal segment resection and end-to-end anastomosis","Slide tracheoplasty","Endoscopic balloon dilatation","Endoscopic division of complete tracheal rings with endoluminal stent placement"],"k":"B","x":"Slide tracheoplasty is considered the gold standard approach in treatment of long segment CTRD. Long segment tracheal resection with end-to-end anastomosis will lead to significant shortening of the tracheal and result in significant tension at the anastomosis site. Endoscopic techniques are useful in isolated acquired tracheal stenosis segments, but a significant failure rate is noted in long segment acquired and congenital tracheal stenosis. PAGE 1375","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q16"},{"s":"What is the most important procedure in the management of a patient with a suspected carotid blowout from the nasopharynx?","o":["Nasal packing","CT angiography","Digital subtraction angiography +/— embolization","Chest x-ray","Tracheostomy"],"k":"E","x":"When massive bleeding occurs, many patients succumb to aspiration. Thus, securing the airway is critical. A stable airway also allows for subsequent procedures to happen safely. PAGE","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q59"},{"s":"A 12-month-old child with documented silent aspiration on Video Fluroscopic Swallow Study (VFSS) and laryngomalacia post supraglottoplasty returns to clinic for a 3-month postoperative visit. The child has been on nectar-thickened liquids. The caregiver reports that thin liquids have been trialed at home and the child often coughs/chokes. The speech-language pathologist (SLP) is consulted to for a clinical swallowing evaluation and notes the child to have wet/gurgly vocal quality and throat-clearing following drinking thin liquids. The best next course of action to manage the child’s dysphagia is to:","o":["Instruct the caregivers to resume thickening the child’s liquids and follow up in 2 months","Instruct the caregiver to continue offering the child thin liquids so the child becomes accustomed to this","Schedule a repeat VFSS, as the child has a known history of silent aspiration and respiratory illnesses","Schedule the patient to follow up with the SLP in 1 month for a repeat bedside evaluation"],"k":"C","x":"If the child’s symptoms have improved and respiratory health has been stable, a trial of weaning from thickened liquids may be appropriate. However, if there is a history of silent aspiration, formal reassessment of swallowing function with VFSS or functional endoscopic evaluation of swallowing may be warranted. PAGE 1451","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q54"},{"s":"Nasal surgery in OSA patients has been shown to:","o":["Consistently reduce sleep apnea severity","Improve daytime somnolence scores","Improve CPAP tolerance","All of the above","B and C"],"k":"E","x":"Meta-analyses have demonstrated a significant decrease in daytime somnolence scores (generally measured by Epworth sleepiness score) after nasal surgery. Nasal surgery has also been shown to reduce average CPAP pressures and improve CPAP adherence/tolerance. Most studies have shown that there is no consistent significant reduction in sleep apnea severity after nasal surgery. PAGES 2545-2546","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q21"},{"s":"You are asked to review a research article that compares the Epley maneuver to a sham procedure for benign, paroxysmal, positional vertigo, in which the authors present the beneficial effect of the therapy, reported as an absolute rate difference of 40% (P < .001) and a 95% confidence interval (CI) of 25% to 55%. Which statement below properly interprets these results?","o":["The effect is likely biased because low statistical power may be present.","The 95% CI is too broad to conclude that the effect is clinically important.","If 20 of 100 patients in the sham group improved, we would expect 28 of 100 to improve after the Epley maneuver.","The 95% CI shows the zone of compatible results to be 25% to 55%."],"k":"D","x":"The CI describes a zone of compatibility with the data; for example, a 95% CI of 28% to 99% means that we do not know much about the real outcome of a treatment because the intervention is compatible with a very broad range of results. CI is a measure of the precision of a study, and the most common method to improve the Cl is to increase the sample size. PAGE 85","d":"General","src":"Bailey · Basic Science/General Medicine · Q20"},{"s":"Which of the following cell types are considered immunosuppressive?","o":["Cytotoxic T lymphocytes and dendritic cells","Regulatory T lymphocytes and dendritic cells","Regulatory T lymphocytes and myeloid-derived suppressor cells","Natural killer cells and myeloid-derived suppressor cells"],"k":"C","x":"Regulatory T lymphocytes and myeloid-derived suppressor cells. Myeloid-derived suppressor cells secrete immunosuppressive cytokines, chemokines, and growth factors. Although data on the role of regulatory T cells in head and neck cancer are mixed, they are generally considered immunosuppressive. PAGE 1983 (Fig. 125.4)","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q8"},{"s":"Approximately what percentage of medullary thyroid carcinomas are associated with a hereditary (germline) RET mutation?","o":["Less than 5%","20%","60%","99%"],"k":"B","x":"Approximately 20% of medullary thyroid carcinoma cases are associated with a hereditary (germline) RET mutation. PAGE","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q131"},{"s":"Robin sequence is characterized by:","o":["Micrognathia, cleft palate, and glossoptosis","Micrognathia, cleft palate, and airway obstruction","Cleft palate, airway obstruction, and glossoptosis","Micrognathia, glossoptosis, and airway obstruction"],"k":"D","x":"Described by the French dental surgeon, Pierre Robin, this sequence describes micrognathia that causes glossoptosis, leading to upper airway obstruction and often (but not always) cleft palate. PAGE 1388","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q27"},{"s":"The most common facial fractures in children are:","o":["Mandible fractures","Orbital fractures","Frontal bone fractures","Zygomatic fractures","Nasal bone fractures"],"k":"E","x":"Nasal bone fractures account for up to 50% of all pediatric facial fractures. Twenty percent of pediatric facial fractures involve the orbit. Mandible fractures are the most common fractures in children hospitalized with trauma. Frontal bone fractures are more common in young children with a greater cranium:face ratio and are often associated with intracranial injuries. Nasal and maxillary fractures are the most common facial fractures in infants up to | year old. PAGE 1894","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q180"},{"s":"Which of the following features help to differentiate a follicular carcinoma from a follicular adenoma?","o":["Presence of RAS mutation","Presence of nuclear grooves and inclusion bodies","Multifocality","Capsular and/or vascular invasion"],"k":"D","x":"Capsular or vascular invasion defines a follicular carcinoma. Follicular carcinoma cannot be diagnosed by FNA without the assistance of molecular testing. PAGE 2417","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q133"},{"s":"A 7-year-old presenting with periorbital swelling and fever is found to have acute sinusitis and a 0.75-cm medial subperiosteal abscess. Which of the following is the most appropriate management?","o":["Oral antibiotics and close outpatient follow-up","IV antibiotics and inpatient observation","Endoscopic sinus surgery and abscess drainage","Abscess drainage by interventional radiology with placement of a passive drain"],"k":"B","x":"In children between | and 9 years old, IV antibiotics and inpatient observation is the preferred approach for an uncomplicated subperiosteal abscess of less than 1 cm. Worsening of clinical course would warrant endoscopic sinus surgery with drainage of the abscess. Risk for progression and threatened visit requires close (inpatient) observation. Interventional radiology is not useful in managing infections in this space. PAGES 193-194","d":"Rhinology","src":"Bailey · Basic Science/General Medicine · Q54"},{"s":"All of the following have robust data supporting the use as organ preservation surgical treatments for select T2 glottic malignancy, except:","o":["Vertical hemilaryngectomy","Supracricoid laryngectomy","Transoral laser microsurgery","Transoral robotic surgical resection"],"k":"D","x":"There is robust data supporting organ preservation surgical intervention for T2 glottic tumors with vertical hemilaryngectomy, supracricoid laryngectomy, and transoral laser microsurgery. Transoral robotic surgery has been demonstrated safe and effective for management of supraglottic tumors. PAGES 2287-2289","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q94"},{"s":"The best initial test to establish tissue diagnosis in UPCa patients:","o":["Incisional biopsy","Excisional biopsy","FNA biopsy","Neck dissection"],"k":"C","x":"The workup of the unknown primary patient requires us to establish a tissue diagnosis. The first choice for obtaining tissue is through FNA biopsy. PAGE 2202","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q71"},{"s":"Which was not a finding of the childhood AT trial study?","o":["AT was 79% successful.","Forty-seven percent of children in the watchful waiting group had spontaneous resolution of their OSA at 7 months.","Risk factors for residual postoperative OSA were obesity, Black race, and an AHI greater than 4.7 events per hour.","The surgical group had greater improvement in neurocognitive attention and executive function."],"k":"D","x":"The childhood AT trial study found the attention and executive function score on the Developmental Neuropsychological Assessment, did not differ significantly between the early-AT group and the watchful-waiting group. However, there were significantly greater improvements in behavioral, quality-of-life, and polysomnographic findings and significantly greater reduction in symptoms in the early-AT group compared to the watchful-waiting group. PAGE 1568","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q90"},{"s":"When is retrocochlear evaluation, ideally in the form of an MRI of the IACs with and without contrast indicated in patients with a sudden hearing loss (SHL)?","o":["Retrocochlear evaluation should only be done in cases where the hearing does not improve.","Retrocochlear evaluation is only indicated if serial audiograms show progression of hearing loss after the initial decline in hearing.","Retrocochlear evaluation should be done even when there appears to have been a clear viral etiology for the SHL.","Retrocochlear evaluation should be done emergently before treatment is initiated."],"k":"C","x":"Because retrocochlear lesions can present in patients with SHL with complete recovery of hearing, regardless of hearing recovery or progression, it should be done. However, as the treatment is time sensitive and the lesions found on MRI that can cause SHL are typically not emergent diagnoses, treatment should not be held up before imaging is obtained. PAGES 3062-3063","d":"Otology","src":"Bailey · Otology and Neurotology · Q112"},{"s":"A 5-year-old patient presents to the clinic with left preauricular swelling. He has not had this occur before and is otherwise healthy. Physical examination is notable for erythema and tenderness at the root of the helix, with a small overlying pit in the skin. Bedside ultrasound reveals an underlying area concerning for a subcentimeter fluid collection. What is the best treatment option?","o":["Observation","Oral antibiotics","Incision and drainage","Surgical excision including removal of tract and perichondrium of the root of the helix"],"k":"B","x":"Oral antibiotics are the first line of treatment for an infected preauricular sinus, especially since the patient is antibiotic naive and any underlying fluid collection is small. Avoidance of incision and drainage is preferable since violation of the sinus may make definitive surgical excision more difficult. An interval of at least 6 weeks should be allowed following infection of preauricular sinuses to ensure resolution of inflammation. PAGE 1834","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q167"},{"s":"Which of the following is true regarding outcomes related to hypoglossal nerve stimulation therapy?","o":["The STAR trial published in 2014 demonstrated overall reduction in median apnea hypopnea index from 29.3 down to 9. However, the data did not support improvement in measurements related to quality of life/daytime sleepiness.","Increasing age has been associated with worse outcomes associated with this therapy.","While BMI above 35 is a contraindication to therapy, increasing BMI has not been correlated with outcomes.","Mixed activation in the STAR trial was associated with nonresponders to therapy."],"k":"D","x":"Outcomes associated with this therapy continue to support high rates of success in the treatment of OSA for CPAP-intolerant patients. This is supported in multiple publications including the STAR trial, which demonstrated overall reduction in median AHI from 29.3 down to 9 AND improvements in QOL measures including the Epworth Sleepiness Score and the FOSQ sleep questionnaire. Increasing age has been associated with better outcomes with the therapy. While there is some conflicting data regarding the impact of BMI on this therapy, it is generally accepted that extreme BMI is associated with poor outcomes in all surgical treatments for OSA and HNS. Mixed activation in the STAR trial was associated with nonresponders and is a testament to the importance of careful positioning of the stimulation cuff during the implantation procedure. PAGE 2573","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q35"},{"s":"A 12-month-old child undergoes elective bronchoscopy for chronic barky cough and expiratory stridor. Proximal anterior tracheal wall malacia with underlying pulsations are noted. Which of the following is the appropriate next step in management?","o":["Place an endoluminal stent to manage tracheomalacia (TM).","Perform an emergency tracheostomy distal to the pulsations.","Perform balloon dilation.","Order computerized tomography angiography of the chest."],"k":"D","x":"The finding of proximal anterior tracheal wall pulsations is consistent with an aberrant innominate artery causing extrinsic compression and TM. Computerized tomography angiography will help confirm the anomaly. Airway interventions are rarely warranted on the initial evaluation. PAGE 1371","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q21"},{"s":"Which of the following findings is most likely present in a patient with a cranial neuropathy secondary to malignant otitis externa?","o":["Dysphonia and dysphagia","Trapezius weakness","Facial weakness","Tongue deviation"],"k":"C","x":"The incidence of cranial nerve involvement with malignant otitis externa has been reported to be 7% to 46%. Due to its intratemporal course, the facial nerve is the most commonly affected cranial nerve in malignant otitis externa. PAGE 2730","d":"Otology","src":"Bailey · Otology and Neurotology · Q32"},{"s":"Intralesional cidofovir is recommended for which patients and at what concentration?","o":["Both children and adults requiring surgery less than every 2 months; 7.5 mg/mL","All patients at the onset of surgical intervention; 4 mg/mL","Only children less than 2 years of age with vestibule involvement; 1 mg/mL","To prevent recurrence when there is evidence of surgical improvement; 3 mg/mL","None of the above"],"k":"A","x":"Intralesional cidofovir is recommended in children and adults who require surgery at 2-month intervals or less, are experiencing decreasing intervals between surgery, or have extralaryngeal spread. The standard concentration is 7.5 mg/mL with doses not to exceed 40 mg/kg in adults and 3 mg/kg in children. PAGE","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q80"},{"s":"After treatment for head and neck cancer, what is the prevalence of depression?","o":["Less than 5%","6% to 25%","26% to 50%","51% to 70%","Over 71%"],"k":"B","x":"The prevalence of depression has ranged from 13% to 24% and has been associated with decreased survival. PAGE 2445","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q142"},{"s":"In the Fisher anatomic subunit approach to the unilateral cleft lip, the height of the upper lip triangle is calculated by which equation?","o":["(Greater lip height) — (lesser lip height) - 1 mm","(Noncleft vermillion thickness) — (cleft vermillion thickness)","(Greater lip height) + (lesser lip height) — 1 mm","(Greater lip height) — (lesser lip height) + 1 mm"],"k":"A","x":"This equation identifies the height discrepancy between the greater lip height and the lesser lip height and allows one to calculate the size of the cutaneous triangle to be inserted into the noncleft side of the lip. Subtracting 1 mm accounts for the stretch of the soft tissue, also known as the Rose-Thompson effect. PAGE 1767","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q147"},{"s":"Margins of a craniofacial resection for olfactory neuroblastoma include all of the following except:","o":["Crista galli","Planum sphenoidale","Inferior orbital fissure","Medial wall of orbit"],"k":"C","x":"A craniofacial resection is bounded by the frontal bone (anterior and posterior walls of frontal sinus) and crista galli anteriorly, the medial walls of the orbit laterally, and the roof of the sphenoid sinus (planum sphenoidale) and optic canals posteriorly. It may be extended laterally to include the orbital roofs. PAGE 2383","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q120"},{"s":"The radiation side effect associated with postradiotherapy dental disease is:","o":["Mucositis","Skin erythema","Xerostomia","Fibrosis"],"k":"C","x":"While fibrosis and pain from acute toxicities may reduce the ability to provide dental care. Xerostomia is associated with progression of poor dental hygiene and dental caries. PAGE 2454","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q146"},{"s":"Which one of the following can establish the diagnosis of obstructive sleep apnea (OSA)?","o":["Multiple sleep latency test","Stop-Bang questionnaire","Type III home sleep test","Epworth Sleepiness Test"],"k":"C","x":"OSA can only be diagnosed with testing of the breathing during sleep. This includes home sleep testing type III or type I in-lab testing. Multiple sleep latency test can diagnose narcolepsy or idiopathic hypersomnia. Epworth sleepiness test measures level of daytime sleepiness. The Stop-Bang questionnaire is a screening tool for potential OSA but does not diagnose OSA. PAGE","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q2"},{"s":"A 17-year-old male presents to the hospital with 1 week of progressive vision loss and proptosis of his left eye. He is found on MRI to have a mass in the left ethmoid cavity with direct infiltration of the intracranial and orbital compartments. Endoscopic biopsy is performed and shows rhabdomyosarcoma. What treatment regimen should this patient receive?","o":["Combined radiation and multiagent chemotherapy","Radiation therapy alone","Wide surgical excision with orbital exenteration followed by adjuvant radiation","Palliative treatment, since curative intent treatment is not possible"],"k":"A","x":"The mainstay of treatment for soft tissue sarcomas is surgical resection with wide margins and adjuvant radiation for high-grade disease or positive margins. However, chemotherapy has emerged as a highly effective treatment for certain sarcomas including rhabdomyosarcoma. Given the tumor location in the orbital and intracranial compartments, the preferred treatment is combined chemotherapy and radiation rather than surgical excision, which would carry significant morbidity. Radiation alone would not be appropriate as there are other more effective treatment options. PAGE 2324","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q104"},{"s":"According to Poiseuille law, which of the following factors will most likely affect flow rate?","o":["Viscosity","Radius","Pressure gradient","Length"],"k":"B","x":"A 4-mm-diameter airway when reduced by 1 mm creates a 75% reduction in airflow. By the same rational, expansion surgery, that is, laryngotracheoplasty, has a dramatic improvement on flow. PAGE 1423","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q41"},{"s":"A 44-year-old female presents with painless mandibular lesion. She states that over the last 4 years, it has slowly increased in size. Radiographic film reveals a unilocular radiolucency with ill-defined borders. Biopsy of the lesion shows columnar hyperchromatic basal cells in the epithelium with a basement membrane demonstrating nuclei with reversed polarity. What is the recommended treatment?","o":["Observation","Enucleation and curettage","Surgical resection with 1 to 1.5 cm margins","Sclerotherapy followed by excision"],"k":"C","x":"Ameloblastoma is a locally aggressive benign tumor that can reach substantial size and cause gross facial deformities. Undertreatment with enucleation and curettage has resulted in high recurrence rates and morbidity. Radical surgical resection with 1.0-to 1.5-cm margin of normal-appearing tissue is recommended. PAGE","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q128"},{"s":"A 1-month-old infant undergoes lingual frenotomy. Which of the following postprocedure exercise regimens have been proven to be effective in preventing sublingual scaring?","o":["Lifting the tongue with parental fingers 5 times a day for 3 weeks","Rubbing under the tongue every 4 hours for 2 weeks","Sucking on a pacifier a minimum of 15 minutes every 3 hours for 1 month","None of the above"],"k":"D","x":"Although frequently discussed on social media, post-frenotomy procedures have not been shown to prevent sublingual scarring. PAGE 1400","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q34"},{"s":"Neck dissection for a T3NOMO well-differentiated left lower lip cancer patient for whom radiation therapy (XRT) is not indicated should include:","o":["Right level I to III and left I to III selective neck dissection","Left parotid and left I to III selective neck dissection","Left modified radical (I to V) neck dissection","Left I to III selective neck dissection","No neck diss ction as the risk of cervical metas is low"],"k":"A","x":"The lower lip has lymphatic drainage to both sides of the neck so a large tumor like this requires bilateral dissection. Levels I-III are appropriate for an NO neck since the first echelon of nodes is level I, followed by levels If and III. Further dissection in an NO neck is unwarranted. The parotid is the first echelon for upper lip drainage. PAGE 2097","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q48"},{"s":"Bilateral choanal atresia can cause significant airway distress in the newborn because:","o":["Infants with choanal atresia usually have concomitant cardiac anomalies","Infants are initially obligate nasal breathers","The neonatal larynx is smaller and collapses easily","Neonates have low oxygen reserves"],"k":"B","x":"Although this is debated in the literature, it has been suggested that newborns are obligate nasal breathers for the first few months of life. While some infants can initiate mouth breathing with nasal occlusion, this transition is marked by significant respiratory distress and, often, respiratory failure with hypoxemia. PAGE 1387","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q29"},{"s":"For which nonmelanoma skin cancer is sentinel lymph node biopsy recommended?","o":["Merkel cell carcinoma without evidence of nodal metastases","Low-risk cutaneous squamous cell carcinoma (•SCC) without evidence of nodal metastases","High-risk basal cell carcinoma (BCC) without evidence of nodal metastases","Recurrent BCC of nose with prior radiation therapy"],"k":"A","x":"Sentinel node biopsy is considered standard of care of localized Merkel cell carcinoma. The staging procedure is not thought to be beneficial in low-risk skin cancers to include cSCC and BCC because of the low rate of occult nodal metastasis. While sentinel node biopsy can be considered in high-risk cSCC, the benefit and utility remain to be determined. PAGE 2054","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q33"},{"s":"What is the fundamental cause of secondary muscle tension dysphonia?","o":["Previous episode(s) of hoarseness","Glottic insufficiency with incomplete vocal fold closure","Chronic tobacco use","Autoimmune disease","Anxiety"],"k":"B","x":"Secondary muscle tension dysphonia is centrally related to poor/reduced vocal fold closure during phonation. PAGE","d":"Laryngology","src":"Bailey · Laryngology · Q100"},{"s":"Active middle ear implants are contraindicated in each of the following conditions except:","o":["Poor speech discrimination","Active middle ear disease","Adequate performance with conventional amplification","Failed stapedectomy"],"k":"D","x":"Round window vibroplasty with the Vibrant Soundbridge system is a way to bypass the ossicular chain in the setting of stapedectomy failure. PAGE 3133","d":"Otology","src":"Bailey · Otology and Neurotology · Q130"},{"s":"Laryngeal webs are commonly associated with which genetic abnormality?","o":["Chiari II malformation","CHARGE syndrome","22q11.2 deletion syndrome","Down syndrome"],"k":"C","x":"Congenital webs are caused by failed resorption of epithelium and recanalization of the laryngotracheal lumen, which typically occurs during the 8 weeks of embryogenesis. An important association for patient with congenital webs is the common association with 22q11.2 deletion syndrome or velocardiofacial syndrome. PAGE","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q64"},{"s":"Which of the following is incorrect about the treatment of pharyngitis?","o":["Penicillin and amoxicillin are the first-line antibiotic treatment for GABHS pharyngitis.","A single dose of corticosteroids has been shown to help with symptom relief in infectious mononucleosis.","A single dose of corticosteroids has been deemed safe in children with severe GABHS pharyngitis.","Clindamycin should be avoided in patients with infectious mononucleosis due to the development of a pruritic, maculopapular rash.","Tonsillectomy may be a useful treatment modality for patients with periodic fever, aphthous stomatitis, pharyngitis, and adenitis syndrome due to a decrease in the frequency of episodes."],"k":"D","x":"The administration of amoxicillin will produce pruritic, maculopapular rash in most patients with acute infectious mononucleosis. PAGE 706","d":"General","src":"Bailey · Comprehensive Otolaryngology · Q20"},{"s":"Which of the following immunotherapy agents is involved in the sonic hedgehog pathway?","o":["Pembrolizumab","Cetuximab","Vismodegib","Ipilimumab"],"k":"C","x":"Vismodegib involves the sonic hedgehog pathway. Pembrolizumab is a program death-1 (PD-1) inhibitor; cetuximab is an EGFR inhibitor, and ipilimumab is monoclonal antibody directed against the human T-cell receptor cytotoxic T-lymphocyte—associated antigen 4 (CTLA4). PAGE 2050","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q34"},{"s":"The patient is planning to proceed with an AT. Which of the following is an important part of the preoperative discussion?","o":["No discussion needed","Verbal and written information on posttonsillectomy care prior to the day of surgery","Prescription for postoperative antibiotics should be provided to the family","Try to talk them out of surgery and only recommend continuous positive airway pressure"],"k":"B","x":"Patient and caregiver education and counseling on posttonsillectomy care should include verbal and written information prior to the day of surgery, and clinicians should reinforce postoperative instructions on the day of surgery. Education interventions for patients and their caregivers should focus on increasing their knowledge on how to assess pain and achieving adequate pain management utilizing pharmacologic and nonpharmacologic interventions. A Cochrane review of 10 randomized controlled trials suggests that antibiotics do not reduce pain, the need for pain medication, or bleeding. In the pooled analyses, antibiotics had no impact on rates of secondary bleeding (of any severity; seven trials) or on significant secondary bleeding (requiring readmission, blood transfusion, or return to the operating room; three trials). PAGE 1557","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q83"},{"s":"A 52-year-old Caucasian female presents to the clinic interested in a chemical peel. She is an excellent candidate for a Jessner prepeel followed by a 35% TCA chemical peel. What area is at high risk for delayed wound healing when using this chemical peel?","o":["Periocular region","Forehead","Nasal dorsum","Neck"],"k":"D","x":"The skin of the neck has decreased pilosebaceous units compared to that of facial skin. With this medium-depth chemical peel, reepithelialization is dependent on the density of pilosebaceous units. It is general, and it is recommended that chemical peels applied to the neck are limited to conservative, superficial depth chemical peels. PAGE 3792","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q115"},{"s":"During preoperative discussions with the family of a child with a large parotid mass, the parents ask about the potential for additional therapy. Which of the following salivary gland neoplasms is most likely to require adjuvant radiotherapy following surgical resection?","o":["Intermediate grade mucoepidermoid carcinoma","Acinic cell carcinoma","Adenoid cystic carcinoma","Papillary cystadenoma lymphomatosum"],"k":"C","x":"Though the role of radiotherapy is not well established in most salivary gland malignancies, according to NCCN guidelines, it should be considered for patients with adenoid cystic carcinoma. PAGE 1651","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q121"},{"s":"How have indications for pediatric tracheotomy evolved in the past 30 years?","o":["There has been an increase in children undergoing tracheotomy for management of acute airway obstruction related to infectious airway diseases.","There has been an increase in children undergoing tracheotomy for issues related to prolonged ventilation for patients with chronic lung and neuromuscular diseases.","Treatment of pulmonary toilet issues has become the most common indication for tracheotomy in children.","It has been recognized that it is imperative to proceed with tracheotomy placement for infants who will be endotracheally intubated for more than 1 to 2 weeks."],"k":"B","x":"Compared with the 1980s, there has been a decrease in tracheotomies for infectious diseases, prolonged intubation, and short-term airway management and an increase in the incidence of the procedure for prolonged ventilation related to prematurity and chronic lung disease, congenital anomalies, and neuromuscular disease. PAGE","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q66"},{"s":"What is considered the optimal diameter and length of the endoscope for otologic procedures?","o":["2.7 mm and 14cm","3 mm and 14cm","4mm and 14cm","2.7 mm and 18 cm","3 mm and 18 cm","4mm and 18 cm"],"k":"B","x":"The endoscope which is most commonly used for otologic procedures is 3 mm in diameter and 14 cm in length, although this is dependent on surgeon preferences. PAGE 3150","d":"Otology","src":"Bailey · Otology and Neurotology · Q136"},{"s":"Which is not a daytime symptom of sleep-disordered breathing in children?","o":["Tics","Attention deficit","Irritability","Poor school performance"],"k":"A","x":"The two main categories of neurobehavioral impairment in children are behavioral and cognitive deficits. Behavioral symptoms include irritability, aggression, impulsivity, and hyperactivity. Cognitive symptoms include deficits in executive function, attention, and language. Hypersomnolence is present in some children with OSA; however, it is more commonly seen in adolescent and adult patients. PAGE 1564","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q88"},{"s":"What is the most common source of dysphonia in the pediatric population?","o":["Recurrent respiratory papillomatosis (RRP)","Unilateral vocal fol
