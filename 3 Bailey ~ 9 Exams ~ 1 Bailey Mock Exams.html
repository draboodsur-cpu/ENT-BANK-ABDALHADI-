d motion impairment","Vocal fold nodules","Vocal fold polyps"],"k":"C","x":"Vocal fold nodules are the most common benign laryngeal lesion leading to dysphonia in children. They are present in up to 60% of pediatric patients with hoarseness. Vocal fold nodules are phonotraumatic lesions related to voice use patterns. PAGE 1475","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q62"},{"s":"An infant born at a community hospital has micrognathia and a cleft palate and is subsequently diagnosed with Pierre Robin sequence (PRS). The infant is medically stable and demonstrates appropriate rooting and nonnutritive sucking skills but is not taking sufficient volume of oral feeds following discharge from the newborn nursery. What are the most likely contributing factors?","o":["Lack of typical oral reflexes","Potential airway obstruction during feedings created by the micrognathia and the posterior position of the tongue","Oral hypersensitivity","Oral hyposensitivity"],"k":"B","x":"Nonnutritive and nutritive sucking skills are often intact in infants with PRS, but upper airway obstruction (depending on the degree) may present a challenge to infants considering the extra respiratory effort that is already required for oral feeding. Obstruction in the upper airway will potentially disrupt an infant’s ability to coordinate sucking and swallowing with breathing to maintain airway protection during feeding. PAGE 1417","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q38"},{"s":"Case: A 2-year-old male presents to your office with a 1-year history of snoring, witnessed apneas, hyperactivity, and loud mouth breathing when awake. His past medical history is notable for trisomy 21. On physical examination of his oropharynx, you see the following: (Reproduced with permission from P. Marazzi/Photo Researchers, Inc.) What would you consider the next step in the care of this patient?","o":["Polysomnogram (PSG)","Pulse oximetry at night","Observation for 6 months","Adenotonsillectomy (AT) at an outpatient surgery center"],"k":"A","x":"Overnight, in-laboratory PSG is the gold standard for diagnosing OSA in children. Evaluation of children with OSA should include a history and physical examination. Although this evaluation is important, history and physical examination alone are rarely sufficient to diagnose OSA. Prolonged wait times and poor availability of pediatric sleep laboratories for overnight PSG have prompted a search for alternative diagnostic screening tools. These tools typically include a combination of history and physical examination findings, but none have been found to be sufficient to predict OSA. Children with OSA should be closely monitored postoperatively for hypoxemia and hypercarbia, because they are at greater risk for complications compared with healthy children. Because of an increased risk of perioperative complications, postoperative admission and observation are recommended for children in the following groups: age younger than 3 years, severe OSA, cardiac complications of OSA, failure to thrive, obesity, prematurity, recent respiratory infection, neuromuscular or craniofacial disorders, Down syndrome, mucopolysaccharidoses, and sickle cell disease. PAGE 1552","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q81","i":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/wAALCAFeAnUBAREA/8QAHAAAAgMBAQEBAAAAAAAAAAAAAwQAAQIFBgcI/8QATxAAAgIBAwIDAwcHCAcHAwUAAQIAAxEEEiEFMQYTQSJRYQcUMlKRk7IWFyNCRXHhFSY1VXSB0uIzRFNUYnKDJDZkgpKUs3OhwSVDhKLR/9oACAEBAAA/AP0jM+bWDjev2yebX/tF+2TzE+uv2yb0+sv2y96/WH2yt6fWX7ZPMT66/bJ5ifXX7ZPMT66/bJ5ifXX7ZPMT66/bJ5ifXX7ZPMT66/bJ5ifXX7ZPMT66/bJ5ifXX7ZPMT66/bJ5ifXX7ZPMT66/bJ5ifXX7ZPMT66/bJ5ifXX7ZPMT66/bJ5ifXX7ZPMT66/bJ5ifXX7ZPMT66/bJ5ifXX7ZPMT66/bJ5ifXX7ZPMT66/bJ5ifXX7ZPNr+uv2yebX9dftk82v66/bJ5ifXX7ZPMT66/bJ5ifXX7ZPMT66/bJ5ifXX7ZPMT66/bJ5ifXX7ZPMT66/bJ5ifXX7ZPMT66/bJ5lf11+2Tza/rr9snm1/X troke","Vocal fold nodules"],"k":"B","x":"Laryngeal dystonia/spasmodic dysphonia involves excessive vocal fold spasm associated with connected speech. PAGES 1076-1077","d":"Laryngology","src":"Bailey · Laryngology · Q83"},{"s":"A 15-month-old boy with typical motor and language development accepts only commercially prepared pureed baby foods and refuses solids. The parents report that they tried to introduce solid table foods at age 1, but the child responded with gagging and refusal. They have continued to offer exclusively pureed foods for the past several months. What factor is most likely contributing to the refusal of solids in this case?","o":["Underlying behavioral disorder","Failure to introduce increased texture at critical times for skill acquisition","Restriction in the range and strength of oral motor musculature","Neurodevelopmental delay"],"k":"B","x":"Delayed introduction of texture beyond 6 to 12 months of age has been associated with the development of gagging, vomiting, and aversion to texture. Exposure to solids with increasing texture during critical time periods for skill acquisition stimulates the development of the necessary oral preparatory skills, such as tongue lateralization. Children receiving only smooth puree foods become habituated to using a predominantly anterior-posterior tongue motion to transfer the bolus. Strong aversive sensory reactions may occur if the child has not acquired the necessary tongue movements to manipulate a textured bolus. In addition, if the unprepared bolus is transferred for the swallow, gagging and choking may occur. PAGE 1412","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q39"},{"s":"Which does not increase the risk of perforation with dilation?","o":["Use of bougie dilators","Previous radiation","Friable esophageal mucosa","Complex strictures"],"k":"A","x":"Studies have not shown an increased risk of bougie dilators compared to balloon dilators. The other features all increase the risk of perforation. PAGE 838","d":"Laryngology","src":"Bailey · Laryngology · Q21"},{"s":"Initial management of corneal exposure in the setting of an acute Bell palsy should begin with:","o":["Tarsorrhaphy","Gold weight placement in the upper eyelid","Lower lid ectropion repair","Ocular lubrication with artificial tears and ointments"],"k":"D","x":"Proper ocular surface lubrication is the initial step in managing corneal exposure due to paralytic lagophthalmos in the setting of an acute Bell palsy. If function is expected to recover but lubrication is still inadequate, a temporary tarsorrhaphy can be placed. Permanent tarsorrhaphy, eyelid weight placement, and ectropion repair are most appropriate for chronic facial nerve paralysis when conservative management with lubrication is inadequate. PAGES 198-199","d":"General","src":"Bailey · Basic Science/General Medicine · Q51"},{"s":"Which of the following syndromes is associated with the development of papillary thyroid carcinoma?","o":["Cowden syndrome","Multiple endocrine neoplasia type 1","Von Hippel-Lindau disease","Waardenburg syndrome"],"k":"A","x":"Cowden syndrome is an autosomal dominantly inherited mutation of PTEN. Clinical features include cerebellar tumors, facial trichilemmomas (benign hamartomatous lesions of hair follicles), acral keratoses, and papillomatous papules. Other malignancies associated with Cowden syndrome include breast and endometrial carcinoma. PAGE 2415","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q130"},{"s":"What percentage of patients with olfactory neuroblastoma ultimately develop cervical nodal disease within the first year of diagnosis?","o":["5% to 10%","20% to 25%","40% to 50%","70%"],"k":"B","x":"20% to 25% of patients with olfactory neuroblastoma (aka esthesioneuroblastoma) develop cervical nodal disease within the first year of diagnosis. These patients should be followed for many years after diagnosis, as local, regional, and distant recurrence is possible even years after initial diagnosis. PAGE 2348","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q114"},{"s":"Choose the option with syndromes commonly related to head and neck malignancies in children:","o":["Cystic fibrosis, Li-Fraumeni, sickle cell disease","DICERI, sickle cell disease, cystic fibrosis","Li-Fraumeni, DICER1, xeroderma pigmentosum","DICER1, sickle cell disease, cystic fibrosis","Li-Fraumeni, PRS, Beckwith-Wideman syndrome"],"k":"C","x":"Out of all the options noted, option C is the only one with the most common syndromes associated with the development of head and neck malignancies in children. PAGE 1809","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q159"},{"s":"Which of the following is a major advantage of chimeric antigen receptor (CAR) T cells?","o":["CAR T cells have a longer life span versus traditional T cells.","Function of CAR T cells does not require presentation of antigen on the surface of the tumor cell.","Responses to CAR T cells are more predictable.","CAR T cells are not killed by chemotherapy."],"k":"B","x":"The function of CAR T cells does not require presentation of antigen on the surface of the tumor cell. The main advantage of CAR T cells is that they can respond directly to any peptide expressed on the surface of a tumor cell. In this way, killing by a CAR T cell does not require presentation of antigen on a MHC molecule, a process which may be deficient in head and neck cancer. It has been challenging, however, to identify surface molecules that are disproportionately expressed on tumor cells. PAGES 1987-1988","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q7"},{"s":"Antoni A and Antoni B areas are classically seen in which of the following laryngeal pathologies?","o":["Chondroma","Schwannoma","Recurrent respiratory papillomatosis","Systemic lupus erythematous","Squamous cell carcinoma"],"k":"B","x":"These are classic histology findings of schwannomas and are usually positive for S-100. PAGE 1028","d":"Laryngology","src":"Bailey · Laryngology · Q70"},{"s":"What percentage of children born with genetic hearing loss are born to parents with normal hearing?","o":["25%","50%","70%","90%"],"k":"D","x":"If cytomegalovirus testing is negative, a genetics evaluation is recommended, especially if the hearing loss is bilateral. PAGE 1674, https://www.who.int/news-room/fact-sheets/detail/ deafness-and-hearing-loss","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q127"},{"s":"A 68-year-old male underwent radical parotidectomy with neck dissection for a suspected high-grade mucoepidermoid carcinoma with involvement of the facial nerve. The patient was found to have a 4.5-cm tumor with extraparenchymal extension as well as 8 out of 28 lymph nodes positive for carcinoma. What further therapy would this patient require after recovering from surgery?","o":["No further treatment","Additional surgery","Adjuvant radiotherapy","Adjuvant chemoradiotherapy","Immunotherapy"],"k":"C","x":"This patient shows evidence of locoregionally advanced and high-grade mucoepidermoid carcinoma. Patients with advanced T-classification, positive margin status, lymph node metastasis, or adverse pathologic features are likely to benefit from adjuvant radiotherapy. The additional of adjuvant platinum-based chemotherapy did not have improved locoregional control in multiple cohort studies. PAGE 2089","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q44"},{"s":"Dependent on the severity of the deformity, correction of maxillary hypoplasia may be accomplished by:","o":["Orthodontic correction","LeFort I advancement","Maxillary distraction osteogenesis","All of the above"],"k":"D","x":"Maxillary hypoplasia can be corrected in multiple ways. Even some severe cases can be corrected with early orthodontic interventions. LeFort advancements and maxillary distraction can be used in more severe cases for correction of the hypoplasia. PAGE 1935","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q194"},{"s":"Which of the following best describes vocal fold granuloma?","o":["Is often related to recent endotracheal intubation","Occurs at the vocal process of the arytenoid cartilage","Involves caseating nodules on histology","Can often be a recurrent problem","A, B,D"],"k":"E","x":"Caseating nodules on histology should lead the clinician to suspect a diagnosis other than granuloma. The most common location of vocal fold granulomas is near the vocal process, often related to intubation, and can be recurrent—particularly in cases with nonintubated etiology. PAGE 1040","d":"Laryngology","src":"Bailey · Laryngology · Q76"},{"s":"The otolaryngology service is consulted for a 3-day infant who has been found to have a small jaw and wide cleft palate. The patient presents with stable oxygenation on room air, stertorous breath sounds, and mild subcostal retractions when supine. Initial supportive management of this patient should include:","o":["Prone positioning and placement of a nasal airway or tongue stitch","Orotracheal intubation with a plan for tracheostomy","Mandibular distraction osteogenesis","Tongue lip adhesion"],"k":"A","x":"Prone positioning, placement of a nasal airway or nasal feeding tube, and/or placement of a tongue stitch are all simple, noninvasive interventions to implement for a neonate with PRS. All the other options are surgical in nature and, while they may prove necessary depending on the clinical course, would not be the first-line options in management. PAGE 1928","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q190"},{"s":"What is the correct definition of mild, moderate, and severe OSA severity in children in terms of the obstructive apnea-hypopnea index score?","o":["5 to 15, 15 to 30, greater than 30","1 to 5, 5 to 10, greater than 10","1 to 10, 10 to 20, greater than 20","1 to 5, 5 to 15, greater than 15"],"k":"B","x":"Current research definitions for OSA commonly define mild OSA when obstructive AHI is between | and less than 5 events per hour, moderate OSA if the AHI is 5 to less than 10, and severe OSA when the AHI is greater than 10. PAGE 1566","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q89"},{"s":"Which of the following is not an absolute contraindication for attempted curative surgical resection?","o":["Presence of distant metastases","Invasion of brain","Bilateral invasion of the optic nerves","Invasion of dura"],"k":"C","x":"Absolute contraindications for surgical resection are medical or nutritional problems that would eliminate the patient as a surgical candidate, presence of distant metastases, invasion of the prevertebral fascia, invasion of the cavernous sinus by a high-grade malignancy, involvement of the carotid artery in a high-risk patient (as determined by carotid flow studies), and bilateral invasion of the optic nerves or optic chiasm. PAGE 2353","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q112"},{"s":"What diagnostic test can detect acid and nonacid reflux?","o":["pH probe","Upper gastrointestinal fluoroscopy study","Endoscopy with biopsy","Multichannel intraluminal impedance plus pH probe"],"k":"D","x":"Multichannel intraluminal impedance plus pH measurement allows for detection of both acid and nonacid reflux. A traditional pH probe does not measure nonacid reflux. Upper gastrointestinal fluoroscopy is not a tool for reflux assessment at all. Endoscopy with biopsy can identify esophageal pathology but not its cause. PAGE 1939","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q195"},{"s":"What is the most classic and common conventional fractionation schedule for definitive-intent head and neck radiation therapy (in the absence of surgery)?","o":["70 Gy in 35 fractions","60 Gy in 30 fractions","59.4 Gy in 33 fractions","55 Gy in 20 fractions","44 Gy in 5 fractions"],"k":"A","x":"Option A is the most classic curative intent schedule in use for head and neck cancer. Option B is common postoperative schedule. Option C is an elective dosing schedule often used for the high-risk region in intensity-modulated radiation therapy. Option D is a hypofractionated regimen that can be used definitively. E is a stereotactic body radiation therapy schedule. PAGE 2003","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q17"},{"s":"A 40-year-old female presents to the office with left-sided pulsatile tinnitus and subjective hearing loss for 4 months. On examination, there is a reddish/blue soft tissue mass behind the tympanic membrane that blanches on pneumatic otoscopy. CT scan reveals a left-sided mass in the middle ear surrounding and partially destroying the ossicles with extension into the hypotympanic cavity. The jugular bulb and carotid canal are intact. Based on the Fisch classification system for jugulotympanic paragangliomas, this tumor is a:","o":["Class A","Class B","Class Cl","Class C2","Class D"],"k":"B","x":"Fisch class B tumors arise from the inferior tympanic canal in the hypotympanum with middle ear and/or mastoid invasion but jugular bulb and carotid canal remain intact. Class C tumors arise in the jugular bulb and involve the carotid canal or carotid artery. Class D tumors are those with intracranial extension. PAGE 2312","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q103"},{"s":"Which of the following is a classic histologic feature of papillary thyroid carcinoma?","o":["Amyloid deposits","Psammoma bodies and “Orphan Annie eyes”","Predominance of large, granular, eosinophilic cells","Tumor necrosis, high nuclear pleomorphism, and high mitotic activity"],"k":"B","x":"Psammoma bodies and “Orphan Annie eyes” are commonly found in papillary thyroid carcinoma. PAGE 2416","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q134"},{"s":"Which of the following is most commonly associated with complete cricotracheal separation?","o":["Bilateral RLN injury","Supraglottic stenosis","Esophageal injury","Successful orotracheal intubation","Epiglottic inversion"],"k":"A","x":"This injury has a high incidence of bilateral RLN injury. PAGE 980","d":"Laryngology","src":"Bailey · Laryngology · Q56"},{"s":"If the natural ostium of the sphenoid sinus cannot be easily identified, the safest point of entry through the face of the sphenoid is:","o":["Medial and inferior","Medial and superior","Lateral and inferior","Lateral and superior"],"k":"A","x":"If the natural ostium of the sphenoid sinus cannot be identified, the safest point of entry is through the inferior-medial portion of the face of the sphenoid, away from the skull base and orbit. Once the sphenoid has been entered, the opening is enlarged laterally and superiorly to incorporate the natural ostium. PAGE 567","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q88"},{"s":"Pill dysphagia without solid food dysphagia suggests a problem in which phase of swallowing?","o":["Anticipatory","Oropharyngeal","Pharyngeal","Esophageal","None of the above"],"k":"A","x":"Anticipation of swallowing especially food/water improves swallowing function, and this may not happen with pill intake. PAGE 802","d":"Laryngology","src":"Bailey · Laryngology · Q5"},{"s":"A 65-year-old male with papillary thyroid cancer with evidence of central neck lymphadenopathy. What structure is not one of the boundaries of a central neck dissection?","o":["Hyoid bone","Innominate artery","Carotid artery","Thyroid cartilage"],"k":"D","x":"The boundaries of the central compartment starts superiorly at the hyoid bone to inferiorly to the innominate artery. The lateral boundaries are the common carotid arteries on both sides of the neck. Exposure to the central compartment commences after the separation of the strap muscles. PAGE 2126","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q54"},{"s":"What is the treatment of choice for stage I primary nasopharyngeal carcinoma?","o":["Radiotherapy alone","Concurrent chemoradiotherapy","Induction chemotherapy then concurrent chemoradiotherapy","Surgery alone","Surgery with adjuvant radiotherapy"],"k":"A","x":"Radiation therapy alone has shown overall local control rates of over 98% at 5 years for early-stage disease. PAGE","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q56"},{"s":"An 85-year-old female presents to your clinic at the request of her internist for evaluation of severe postural instability and difficulty walking in the dark. You identify a medication in her history that leads to direct vestibular loss. Which of the following class of medications is directly cytotoxic to the peripheral vestibular system?","o":["SSRIs","Calcium channel blockers","Aminoglycosides","Monoamine oxidase inhibitors"],"k":"C","x":"Aminoglycoside antibiotics (streptomycin, gentamicin, neomycin, tobramycin, amikacin, and kanamycin) are a family of compounds used to treat gram-negative bacilli infections. These compounds bind to bacterial 30S ribosomal subunit and cause mRNA to be misread. These antibiotics are ototoxic and can cause bilateral vestibulopathy. PAGES 3190-3191","d":"Otology","src":"Bailey · Otology and Neurotology · Q145"}]}];let PI=0;let P=PAPERS[0];let Q=P.q;const L='ABCDEF';
const DOMS=['Otology','Rhinology','Laryngology','Paediatric','H&N / Plastics / Trauma','General'];
let S={mode:'exam',mins:180,phase:'start',pos:0,ans:{},flag:{},end:0,start:0,tick:null,used:0,list:[],rpos:0,rtitle:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')};
function nav(html){let n=document.querySelector('.nav');if(!html){n&&n.remove();return}if(!n){n=document.createElement('div');n.className='nav';document.body.appendChild(n)}n.innerHTML='<div class="navi">'+html+'</div>'}
function startScreen(){
  S.phase='start';nav();clearInterval(S.tick);
  const cnt={};Q.forEach(q=>cnt[q.d]=(cnt[q.d]||0)+1);
  $('#app').innerHTML=`<div class="kicker">Palestinian Board · Final MCQ mock</div><h1>Bailey mock exams</h1><b>Paper</b><div class="seg" role="group" aria-label="Paper" style="flex-wrap:wrap">${PAPERS.map((p,i)=>`<button class="${PI==i?'on':''}" onclick="pickPaper(${i})">${i+1}</button>`).join('')}</div><h2 style="margin:14px 0 6px;font-size:1.15rem">${esc(P.title)}</h2>
  <p class="sub">Seven papers of 100 single-best-answer questions from the Bailey review book only, one correct option each. Papers 1–6 follow the standard subspecialty split; Paper 7 is weighted toward head &amp; neck and paediatrics. No question repeats across the seven papers. Book wording and book keys throughout.</p>
  <div class="card"><table>${DOMS.filter(d=>cnt[d]).map(d=>`<tr><td>${d}</td><td>${cnt[d]}</td></tr>`).join('')}</table></div>
  <b>Mode</b><div class="seg" role="group" aria-label="Mode"><button class="${S.mode=='exam'?'on':''}" onclick="S.mode='exam';startScreen()">Exam — marked at the end</button><button class="${S.mode=='practice'?'on':''}" onclick="S.mode='practice';startScreen()">Practice — instant feedback</button></div>
  ${S.mode=='exam'?`<b>Time</b><div class="seg" role="group" aria-label="Time limit">${[180,150,120,90].map(m=>`<button class="${S.mins==m?'on':''}" onclick="S.mins=${m};startScreen()">${m==180?'3 h':m+' min'}</button>`).join('')}</div>`:''}
  <button class="primary" onclick="begin()">Start paper</button>
  <p class="note">${S.mode=='exam'?'You can change answers and flag questions until you submit. The paper submits itself when time runs out.':'Each answer is marked when you tap it and locks. Untimed.'} Progress is kept while this page stays open.</p>`;
  scrollTo(0,0)}
function begin(){S.ans={};S.flag={};S.pos=0;S.phase='run';S.start=Date.now();
  if(S.mode=='exam'){S.end=S.start+S.mins*60000;S.tick=setInterval(()=>{const r=S.end-Date.now();const t=$('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}
  show()}
function answered(){return Object.keys(S.ans).length}
function show(){
  const q=Q[S.pos],a=S.ans[S.pos],prac=S.mode=='practice';
  let h=`<div class="top"><div class="topi">${S.mode=='exam'?`<span class="timer" id="tm">${fmt(S.end-Date.now())}</span>`:`<span class="timer">${Object.entries(S.ans).filter(([i,v])=>v==Q[i].k).length}/${answered()}</span>`}<span class="t">${answered()} of ${Q.length} answered</span><button class="flagbtn ${S.flag[S.pos]?'on':''}" onclick="flag()" aria-pressed="${!!S.flag[S.pos]}">${S.flag[S.pos]?'Flagged':'Flag'}</button></div><div class="bar"><i style="width:${(S.pos+1)}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${Q.length}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${S.pos+1}" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,i)=>{const l=L[i];let c='';if(prac&&a){if(l==q.k)c='ok';else if(l==a)c='bad'}else if(a==l)c='sel';
    h+=`<button class="opt ${c}" ${prac&&a?'disabled':''} onclick="pick('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(prac&&a)h+=expl(q,a);
  $('#app').innerHTML=h;
  const last=S.pos==Q.length-1;
  nav(`<button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Questions</button>${last?`<button class="primary" onclick="confirmSubmit()">Submit</button>`:`<button class="primary" onclick="go(1)">Next</button>`}`);
}
function expl(q,a){const ok=a==q.k;
  return `<div class="exp"><h3 class="${a?(ok?'ok':'bad'):'na'}">${a?(ok?'Correct':'Incorrect'):'Not answered'} — answer ${q.k}</h3>${q.x?`<p>${esc(q.x)}</p>`:`<p class="note">The source gives the key only for this question.</p>`}${q.xi?q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join(''):''}<div class="src">${esc(q.d)} · ${esc(q.src)}</div></div>`}
function pick(l){if(S.mode=='practice'&&S.ans[S.pos])return;if(S.mode=='exam'&&S.ans[S.pos]==l)delete S.ans[S.pos];else S.ans[S.pos]=l;const y=scrollY;show();scrollTo(0,y)}
function flag(){S.flag[S.pos]?delete S.flag[S.pos]:S.flag[S.pos]=1;const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(Q.length-1,S.pos+d));show();scrollTo(0,0)}
function grid(){const d=$('#dlg');const nf=Object.keys(S.flag).length,na=Q.length-answered();
  d.innerHTML=`<b>Questions</b><div class="legend" style="margin-top:6px"><span class="a">Answered (${answered()})</span><span class="f">Flagged (${nf})</span><span>Unanswered (${na})</span></div>
  <div class="grid">${Q.map((_,i)=>`<button class="${S.ans[i]?'ans':''} ${S.flag[i]?'flg':''} ${i==S.pos?'cur':''}" onclick="S.pos=${i};$('#dlg').close();show();scrollTo(0,0)" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div>
  <div class="row"><button class="ghost" onclick="$('#dlg').close()">Close</button><button class="primary" onclick="$('#dlg').close();confirmSubmit()">Submit paper</button></div>`;d.showModal()}
function confirmSubmit(){const d=$('#dlg');const na=Q.length-answered(),nf=Object.keys(S.flag).length;
  d.innerHTML=`<b>Submit this paper?</b><p class="note">${na?`${na} question${na>1?'s are':' is'} unanswered. `:'All questions answered. '}${nf?`${nf} flagged.`:''} You can't change answers after submitting.</p><div class="row"><button class="ghost" onclick="$('#dlg').close()">Keep going</button><button class="primary" onclick="$('#dlg').close();submit()">Submit</button></div>`;d.showModal()}
function submit(auto){clearInterval(S.tick);S.used=Date.now()-S.start;S.phase='done';S.auto=!!auto;if($('#dlg').open)$('#dlg').close();results()}
function results(){nav();
  let r=0;const by={};Q.forEach((q,i)=>{const b=by[q.d]=by[q.d]||{n:0,r:0};b.n++;if(S.ans[i]==q.k){r++;b.r++}});
  const wrong=Q.map((q,i)=>i).filter(i=>S.ans[i]&&S.ans[i]!=Q[i].k),skip=Q.map((q,i)=>i).filter(i=>!S.ans[i]),fl=Object.keys(S.flag).map(Number).sort((a,b)=>a-b);
  $('#app').innerHTML=`<div class="kicker">${esc(P.title)}</div><h1>Results</h1>${S.auto?'<p class="note">Time ran out — the paper was submitted automatically.</p>':''}
  <div class="big">${r}<span style="font-size:1.4rem;color:var(--muted)">/100</span></div><p class="sub">${wrong.length} incorrect · ${skip.length} unanswered · time used ${fmt(S.used)}</p>
  <div class="card"><table>${DOMS.filter(d=>by[d]).map(d=>{const b=by[d],p=Math.round(b.r/b.n*100);return `<tr><td>${d}<div class="meter"><i style="width:${p}%"></i></div></td><td>${b.r}/${b.n} · ${p}%</td></tr>`}).join('')}</table></div>
  <div class="row"><button class="primary" ${wrong.length+skip.length?'':'disabled'} onclick="review('Incorrect and unanswered',${JSON.stringify(wrong.concat(skip).sort((a,b)=>a-b))})">Review incorrect (${wrong.length+skip.length})</button></div>
  <div class="row"><button class="ghost" ${fl.length?'':'disabled'} onclick="review('Flagged',${JSON.stringify(fl)})">Flagged (${fl.length})</button><button class="ghost" onclick="review('All questions',${JSON.stringify(Q.map((_,i)=>i))})">All 100</button></div>
  <div class="row"><button class="ghost" onclick="startScreen()">Retake paper</button></div>`;scrollTo(0,0)}
function review(t,list){S.list=list;S.rpos=0;S.rtitle=t;rshow()}
function rshow(){const i=S.list[S.rpos],q=Q[i],a=S.ans[i];
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="results()">Results</button><span class="t">${S.rtitle} · ${S.rpos+1}/${S.list.length}</span>${S.flag[i]?'<span class="flagbtn on">Flagged</span>':''}</div></div>
  <div class="qn">Question ${i+1}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,j)=>{const l=L[j];const c=l==q.k?'ok':(l==a?'bad':'');h+=`<button class="opt ${c}" disabled><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  h+=expl(q,a);$('#app').innerHTML=h;
  nav(`<button class="ghost" ${S.rpos?'':'disabled'} onclick="S.rpos--;rshow();scrollTo(0,0)">Previous</button><button class="primary" ${S.rpos<S.list.length-1?'':'disabled'} onclick="S.rpos++;rshow();scrollTo(0,0)">Next</button>`)}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
window.addEventListener('beforeunload',e=>{if(S.phase=='run'){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(S.phase!='run'||$('#dlg').open)return;if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else{const i=L.indexOf(e.key.toUpperCase());if(e.key.length==1&&i>=0&&i<Q[S.pos].o.length)pick(L[i])}});
startScreen();

function pickPaper(i){PI=i;P=PAPERS[i];Q=P.q;S.ans={};S.flag={};S.pos=0;startScreen()}</script></body></html>
