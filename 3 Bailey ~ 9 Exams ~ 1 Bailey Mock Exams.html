ss to an exposed area of nerve in its tympanic segment, and stimulating at the site of exposure itself risks a falsely reassuring result from activation of fibers distal to the suspected site of injury. PAGES 2832-2833","d":"Otology","src":"Bailey · Otology and Neurotology · Q59"},{"s":"Which of the following is the most common site for development of spontaneous CSF rhinorrhea?","o":["Cribriform plate","Ethmoid roof","Lateral recess of sphenoid","Posterior table of frontal"],"k":"A","x":"The most common location of spontaneous CSF leaks is the cribriform plate region (49%), followed by lateral recess of the sphenoid (20%), and ethmoid roof (15%). The posterior table of the frontal sinus represents an uncommon location for spontaneous CSF leaks. PAGE 622","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q112"},{"s":"The incidence and severity of radiation-associated side effects are affected by which of the following factors?","o":["Cumulative dose","Use of concurrent chemotherapy such as cisplatin","Radiation modality (intensity modulated radiation therapy [IMRT] vs non—-image-guided modalities)","All of the above"],"k":"D","x":"Concurrent chemotherapy is associated with worse functional outcomes. Focused radiation with IMRT may allow for less cumulative dose to sensitive structures that reduces the incidence and severity of radiation-associated side effects. PAGE 2454","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q145"},{"s":"Which subtype of craniopharyngioma is more prevalent in the pediatric population and how is it thought to develop?","o":["Papillary craniopharyngioma—arising from cellular metaplasia or mutation","Adamantinomatous craniopharyngioma—developing from remnants of Rathke pouch","Papillary craniopharyngioma—developing from remnants of Rathke pouch","Adamantinomatous craniopharyngioma—arising from cellular metaplasia or mutation"],"k":"B","x":"Adamantinomatous craniopharyngiomas arise from Rathke pouch and are the most common subtype found in children. Adult craniopharyngiomas are thought to arise from metaplasia or mutation of fully differentiated adult cells. PAGE 1635","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q113"},{"s":"Which are commonly used medical management approaches to assist with dysphagia:","o":["Drying agents","Chronic antibiotic treatment","Oral care","Pulmonary rehabilitation","Options A, C, D"],"k":"E","x":"Options A, C, and D are commonly used medical management approaches for patients with dysphagia. PAGES 829-830","d":"Laryngology","src":"Bailey · Laryngology · Q14"},{"s":"What is the most common cause of leakage around a tracheoesophageal voice prosthesis?","o":["The diameter of the prosthesis is too small.","The length of the prosthesis is excessive.","Recurrent tumor.","Poor nutritional status."],"k":"B","x":"When a prosthesis is too long, it may piston in the fistulous tract leading to dilation of the tissues. This can in turn allow liquids to flow around the dilated puncture tract. While recurrent tumor and poor nutritional status can contribute to leakage around the prosthesis, these are much less common. PAGE 2471","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q154"},{"s":"Which of the following are not benefits of a multidisciplinary tracheotomy team?","o":["Decreased postoperative morbidity","Prolonged period of time to decannulation","Reduced incidence of tracheostomy tube obstruction","Decreased postoperative mortality","Increased use of speaking valves"],"k":"B","x":"All the options other than B represent benefits of a multidisciplinary tracheotomy team. This team also leads to more rapid decannulation time. PAGE 930","d":"Laryngology","src":"Bailey · Laryngology · Q44"},{"s":"Where is the narrowest portion of the pediatric airway?","o":["Glottis","Midtrachea","Subglottic/cricoid","All of the above as each of these structures have the same diameter"],"k":"C","x":"Subglottic/cricoid. PAGE 1425","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q42"},{"s":"Which studies are diagnostic of autoimmune inner ear disease?","o":["Erythrocyte sedimentation rate","Anti-Sjégren syndrome associated antigen A/B antibodies","Anti-heat shock protein 70 antibody","None of the above"],"k":"D","x":"Autoimmune inner ear disease is a clinical diagnosis. None of these tests are diagnostic. Routine serologic tests should be ordered in patients who may have suspected autoimmune inner ear disease in order to rule out other causes of otologic dysfunction. These include a complete blood count with differential white count, erythrocyte sedimentation rate, C-reactive protein, thyroid function studies, rheumatoid factor, antinuclear antibody test, anti-double-stranded DNA antibodies, anti-Sjégren syndrome associated antigen A/ B antibodies, antiphospholipid antibodies, and C3 and C4 complement levels. An FTA-ABS test (or a Treponema pallidum hemagglutination test) must be obtained to rule out otosyphilis. An MRI with paramagnetic enhancement must be obtained to rule out the retrocochlear lesions discussed earlier in this chapter. An HIV test may be considered to rule out AIDS-associated hearing loss. In endemic regions, a Lyme antibody test may be considered. PAGES 2901-2902","d":"Otology","src":"Bailey · Otology and Neurotology · Q80"},{"s":"A 56-year-old man presents with six episodes of spinning vertigo lasting approximately 3 hours. Ear fullness and tinnitus accompany the episodes. Headaches can be present. On audiogram, there is sensorineural hearing loss at 250 and 500 Hz in the right ear. Which of the following disorders does this patient have?","o":["Vestibular migraine","Probable Méniére disease","Definite Méniére disease and not enough evidence to support vestibular migraine","Definite Méniére disease and vestibular migraine"],"k":"C","x":"The patient has had at least two episodes of spinning vertigo lasting between 20 minutes and 12 hours and has a documented low-frequency sensorineural hearing loss, in addition to fluctuating ear symptoms in that ear. He meets diagnostic criteria for definite Méniére disease. There is a large overlap in clinical studies between patients with Méniére disease and vestibular migraine; however, there is not enough data presented here to determine whether the patient also meets diagnostic criteria for vestibular migraine. PAGES 3218-3221","d":"Otology","src":"Bailey · Otology and Neurotology · Q147"},{"s":"A patient reports severe pain in both ears during flights, particularly on descent. Fullness and hearing loss in the ears sometimes persist for several days before slowly improving. On a visit to a general practitioner a week after flying, the ears were found to be normal on otoscopy. What could be the most likely cause for the pain in the ears?","o":["Obstruction of the bony eustachian tube","Superior semicircular canal dehiscence","Baro-challenge-induced obstructive eustachian tube dysfunction","Adenoid hypertrophy"],"k":"C","x":"Patients with eustachian tube dysfunction that occurs only during baro-challenge usually have normal findings on otoscopy, once the ear has recovered from any barotrauma that may have occurred. Endoscopic evaluation can reveal a lesser degree of pathology in the eustachian tube lumen than in patients with chronic obstructive dysfunction associated with negative middle ear pressure. A consistent history of baro-challenge is important in diagnosing the condition. PAGES 2757-2758","d":"Otology","src":"Bailey · Otology and Neurotology · Q41"},{"s":"The following signal processing and/or features will improve hearing in noise:","o":["Noise reduction","Directional microphones","Remote microphones","Both B and C"],"k":"D","x":"The use of noise reduction will reduce audibility across the frequency range. This will improve comfort in noisy listening environments but will not improve audibility because hearing aids are unable to fully distinguish between and entirely separate background sounds and the specific signal of interest. As a result, the reduction in audibility will affect both signals. This will not improve hearing in noise. In contrast, directional microphones and remote microphone technology have both been shown to improve signal-to-noise ratio (ie, the level of the signal of interest compared to the background noise level). Higher signal-to-noise ratios indicate more favorable listening conditions, with the signal of interest being louder than the background noise level. PAGES 3170-3171","d":"Otology","src":"Bailey · Otology and Neurotology · Q139"},{"s":"In which of the following situations would the use of inhaled nitrous oxide be advantageous?","o":["Tympanoplasty and mastoidectomy","Supraglottoplasty","B12 deficiency","Myringotomy and tube placement"],"k":"D","x":"Nitrous oxide is more soluble in blood than nitrogen and will cause distension of any air-containing space. Often avoided in tympanoplasty but can be advantageous in ear tube placement of atelectatic ears. PAGE 1885, Table 119.5","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q178"},{"s":"A 13-year-old man with a history of osteogenesis imperfecta (OD) presents to clinic after having undergone audiometric evaluation, which demonstrated mild mixed hearing loss in the right ear and profound sensorineural hearing loss in the left ear. Which intervention is likely to yield a better hearing left","o":["Cochlear implantation","Bone conduction hearing aid","BiCROS hearing aid","No intervention will improve left-sided hearing"],"k":"A","x":"Hearing loss due to OI is typically mixed. Proposed mechanism is due to changes of the bony cochlea and vestibule. Early presentation of hearing loss in OI is typically due to conduction disturbances, most commonly stapes and footplate fixation. Therefore, stapedectomy yields meaningful improvement in long-term follow-up studies. However, severe-profound sensorineural loss will occur in half of patients with OI. Recent evidence supports the use of cochlear implantation for these patients, but the surgeon should be prepared for the potential altered anatomy of the operative field due to the disease. PAGES 771-772","d":"Otology","src":"Bailey · Comprehensive Otolaryngology · Q47"},{"s":"Contraindications for a cricothyrotomy include the following:","o":["Laryngeal trauma","Trismus","Transection of the airway","Neonate/very young age of patient","A, C, D"],"k":"E","x":"Trismus is not a contraindication for cricothyrotomy. The other options are classic contraindications for cricothyrotomy. PAGE 921","d":"Laryngology","src":"Bailey · Laryngology · Q43"},{"s":"For low-frequency sounds (<2 kHz), the head shadow effect will result in how big of a difference in sound level between the two ears?","o":["0dB","5 dB","10 dB","15 dB"],"k":"A","x":"The head shadow effect only plays a role for higher frequency sounds (>2 kHz). It does not play a significant role in lower frequency sounds. PAGE 2618","d":"Otology","src":"Bailey · Otology and Neurotology · Q7"},{"s":"A 65-year-old male presents with new-onset episodic vertigo lasting 30 minutes to 2 hours with concomitant hearing fluctuations. He does not have hearing loss today. His examination is grossly normal, and an audiogram demonstrates bilateral symmetric high-frequency sensorineural hearing loss. A contrast-enhanced MRI of the brain demonstrates enhancement of cranial nerves VII and VIII, as well as multifocal leptomeningeal enhancement. On further history, he endorses having had a painless genital ulcer many years ago that self-resolved. What serological test would you order to help establish your diagnosis?","o":["ELISA test for antibodies against Borrelia burgdorferi","Fluorescent treponemal antibody absorption (FTA-ABS) test","PCR testing for HSV","Nucleic acid amplification test for Chlamydia"],"k":"B","x":"This patient likely has syphilis. The proper serological test to order is the FTA-ABS test. Another test to be considered is the microhemagglutination test. PAGES 2895-2897","d":"Otology","src":"Bailey · Otology and Neurotology · Q77"},{"s":"Which fungal process of the sinuses is characterized by single sinus involvement and associated with prior endodontic treatment?","o":["Allergic fungal sinusitis","Acute invasive fungal sinusitis","Chronic invasive fungal sinusitis","Fungus ball"],"k":"D","x":"Approximately 90% of fungus balls involve only a single sinus, and there is an association with prior endodontic treatment. PAGE 527","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q75"},{"s":"Sensory hair cells are characterized by:","o":["Expression of Atoh]","Responsive to mechanical stimulation","Form synaptic connections with neurites from spiral ganglia neurons","Contain staircaselike stereocilia","All of the above"],"k":"E","x":"The hair cells are the main sensory cells for auditory perception. They express the transcription factor Atoh/. Their stereocilia bundles (which have a staircase-lake pattern) are responsive to mechanical stimulation. They form synaptic connections with the neurites from spiral ganglion neurons. PAGES 3265-3267","d":"Otology","src":"Bailey · Otology and Neurotology · Q165"},{"s":"Which palatal phenotype achieves greatest success when employing the transpalatal advancement pharyngoplasty technique?","o":["Vertical","Oblique","Horizontal","Sail-shaped"],"k":"A","x":"Understanding palatal phenotypes are important when selecting patients for palatal surgery. Patients with an oblique pattern noted on physical examination and preoperative imaging are more appropriate for a modified palatopharyngoplasty procedure, while a vertical pattern with collapse at the level of the velum will be more successfully addressed with transpalatal advancement pharyngoplasty or skeletal surgery. PAGES 2556-2557","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q28"},{"s":"Which of the following injuries does not necessitate maxillomandibular fixation (MMF)?","o":["Comminuted unilateral ramus fracture in a 9-year-old boy","Displaced unilateral subcondylar fracture in a 9-month-old","Bilateral nondisplaced parasymphyseal fractures in a 6-year-old boy with malocclusion","Unilateral intracapsular condylar fracture in a 3-year-old girl"],"k":"D","x":"Unilateral intracapsular condylar fractures can be managed with observation, soft diet, and motion rehabilitation. A comminuted ramus fracture would likely entail open or cross bite. A displaced subcondylar fracture would likely impair motion and could lead to ankylosis. Bilateral fractures are more than twice as complicated as unilateral and would likely lead to open bite or cross-bite, with higher likelihood of malocclusion. All other fractures listed would require MMF. PAGE 1898","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q182"},{"s":"A patient has complete opacification of the right maxillary sinus, partial opacification of anterior ethmoid sinus, and obstruction of the ostiomeatal complex. This patients Lund- Mackay score is?","o":["4","5","6","7"],"k":"B","x":"The Lund-MacKay CT scoring (for each side) gives 0, 1, or 2 points for no/partial/complete opacification of each of the following sinuses: maxillary, anterior ethmoid, posterior ethmoid, frontal, and sphenoid and 2 points for 0 or 2 points for patency/ obstruction of the OMC. PAGE 541","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q81"},{"s":"What percentage of carotid arteries are partially dehiscent into the sphenoid sinus?","o":["5%","25%","50%","75%"],"k":"B","x":"The carotid artery runs lateral to the sphenoid sinus and is partially dehiscent into the sinus in 25% of patients. Care when instrumenting this area is advised. PAGE 304","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q2"},{"s":"In neuropraxia, one expects the nerve to:","o":["Undergo Wallerian degeneration distal to the site of lesion","Recover to normal function","Have abnormal ENoG findings","Have abnormal nerve excitability test (NET) results"],"k":"B","x":"In neuropraxia, the nerve is viable and is expected to recover normal function when nerve blockade is removed. PAGES 2882-2884","d":"Otology","src":"Bailey · Otology and Neurotology · Q73"},{"s":"A 26-year-old female in the third trimester of pregnancy presents with pulsatile tinnitus. Her symptoms are most likely caused by which of the following?","o":["Preeclampsia","Weight gain","High-flow state","Multiple gestations"],"k":"C","x":"Hyperdynamic states leading to increased cardiac output can cause pulsatile tinnitus. These states include anemia, thyrotoxicosis, and pregnancy. Tinnitus in pregnancy is not specifically related to multiple gestations, weight gain, or preeclampsia. PAGE","d":"Otology","src":"Bailey · Otology and Neurotology · Q120"},{"s":"A 4-week-old infant is brought to your office for evaluation of tongue-tie. The mother reports that breastfeeding is painful although the baby is thriving (60th percentile for weight.) On examination, the baby has anterior ankyloglossia, which restricts tongue mobility. What can you tell the mother about expected outcomes if an in-office frenotomy is performed?","o":["The baby will likely have less gas and colic.","The baby may have an improved latch and the mother less nipple pain.","The baby will be less likely to require speech therapy in the future.","The baby will be less likely to have sleep apnea in the future."],"k":"B","x":"Studies have shown that some breastfeeding mothers will experience less nipple pain after an infant with ankyloglossia undergoes frenotomy (Chapter 91, Section “Outcomes of Frenotomy Surgery”). The improvement is thought to be due to the infant’s enhanced ability to latch onto the breast. Frenotomy has not been definitively shown to improve reflux, colic, or prevent the need for speech therapy or sleep apnea. PAGE 1397","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q31"},{"s":"A 2.5-cm, hyperpigmented, variegated brown, patch with irregular borders has developed on the nasal sidewall of a 70-year-old male. The patient states it has evolved over the past few years, and he would like it removed for cosmetic reasons. What is the best next step?","o":["Electrodessication and curettage","Biopsy (broad shave, multiple scouting shave or punch)","Pulse dye laser","Excision and closure along relaxed skin tension lines","Excisional biopsy"],"k":"B","x":"The lesion described is suspicious for an evolving melanoma in situ, lentigo maligna type. Suspicious (ie, size > 0.5 cm, irregular border, variegated color, evolving) pigmented/melanocytic lesions should be biopsied to determine if malignant or benign. Broad shave biopsies, multiple scouting shave biopsies, or punch biopsies are most likely to capture any pathologic process. In this case, a 2.5-cm lesion on the nasal sidewall would be difficult to perform an excisional biopsy. The majority of brown macules or patches on patients are benign solar lentigines, ephelides, or macular seborrheic keratoses. PAGE 3807","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q122"},{"s":"A patient has a clinically T1 (AJCC 8th Edition) palatine tonsil squamous cell carcinoma that on examination appears exophytic at the mid tonsil. Which of the following deep planes of dissection is reasonable for complete transoral excision?","o":["Dissection should incise superior pharyngeal constrictor muscle and continue deep to the parapharyngeal fat.","Dissection should continue deep to the parapharyngeal fat and include a margin of medial pterygoid muscle.","Dissection should incise the superior pharyngeal constrictor muscle and continue deep to this muscle, superficial to the parapharyngeal fat.","Dissection should extend into the parapharyngeal fat until branches of the external carotid arterial system are identified and can be ligated."],"k":"C","x":"For palatine tonsil squamous cell carcinomas that have not invaded the superior pharyngeal constrictor muscle, including this muscle as the deep margin is the standard approach to complete tumor excision, PAGE 2217","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q77"},{"s":"Which agent(s) can safely be used for otorrhea in the setting of a tympanic membrane perforation or a tympanostomy tube?","o":["Acetic acid","Alcohol","Aminoglycosides","Fluoroquinolones"],"k":"D","x":"Fluoroquinolones have been shown to be safe to otologic applications in the setting of a tympanic membrane perforation or in the presence of a tympanostomy tube. PAGE 2729","d":"Otology","src":"Bailey · Otology and Neurotology · Q36"},{"s":"The middle ear acts as an impedance matching device and causes a gain of incoming sound pressure by:","o":["5 dB","10 dB","15 dB","20 dB"],"k":"D","x":"The area ratio (the ratio between the surface area of the tympanic membrane and the stapes footplate) and the lever ratio (the ratio between the length of malleus manubrium and incus long process) lead to a pressure gain of approximately 20 dB in the middle ear. PAGE 2623","d":"Otology","src":"Bailey · Otology and Neurotology · Q8"},{"s":"Which is the gene name and form of inheritance for the most common cause of genetic auditory neuropathy spectrum disorder?","o":["OTOPI, recessive inheritance","OTOF, recessive inheritance","OTOP, dominant inheritance","OTOF, dominant inheritance"],"k":"B","x":"OTOF encodes the gene otoferlin, which is the most common genetic cause of auditory neuropathy spectrum disorder. Otoferlin functions at the synapse at the base of the inner hair cells in the organ of Corti. Mutations in OTOF lead to reduction or disordered release of glutamate and therefore impeded transduction of the auditory signal to the brain. PAGE 1724","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q138"},{"s":"Intranasal manifestations of Sjogren syndrome most commonly includes which symptoms?","o":["Nasal crusting","Hyposmia","Nasal dryness","Recurrent sinusitis"],"k":"C","x":"Sjogren syndrome is a relatively common autoimmune disease marked by progressive inflammation of salivary and lacrimal glands leading to xerostomia and keratoconjunctivitis sicca. Nasal manifestations are not uncommon in Sjogren syndrome, and most commonly include nasal obstruction and nasal dryness. These can be treated with topical saline sprays, rinses, and lubricants. PAGE 446","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q44"},{"s":"Which salivary substance may have potential diagnostic value in the work up of LPR?","o":["Hydrochloric acid","Pepsin","Bile salts","Trypsin","All of the above"],"k":"B","x":"Given the central role of pepsin in reflux symptoms and negative impact, pepsin testing has been a goal for reflux detection. PAGE 1008","d":"Laryngology","src":"Bailey · Laryngology · Q64"},{"s":"Which of the following has not been associated with surgical success after MMA surgery?","o":["Younger age","Lower preoperative BMI","Lower preoperative AHI","Higher preoperative AHI"],"k":"D","x":"Younger age, lower BMI, and lower AHI have been associated with surgical success as defined by Sher criteria (a greater than 50% reduction in AHI to fewer than 20 events per hour) after MMA surgery. Patients with higher preoperative AHI are less likely to achieve success as defined by Sher criteria but tend to experience a greater reduction in AHI. PAGE 2588","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q38"},{"s":"Advantages of endoscopic ear surgery include all of the following except:","o":["The ability to “look around corners” within the middle ear","Binocular vision with true depth perception","Superior visualization due to position of the light source at the distal tip of the endoscope","Opportunity for less invasive approach with reduced need for postauricular incisions and bony removal","Potential for improved surgical ergonomics with “heads up” ear surgery"],"k":"B","x":"Endoscopic ear surgery improves the visualization of hidden cavities of the middle ear by allowing the surgeon to “look around corners.” The endoscope provides enhanced image clarity and superior visualization due to the position of the light source at the distal tip of the endoscope and improves access to pathology with less soft tissue retraction and bony drilling. Endoscopic ear surgery also affords superior ergonomics compared to microscopic surgery. The major disadvantage of the endoscope is the loss of binocular vision and bimanual approach to dissection. PAGES 3141-3143","d":"Otology","src":"Bailey · Otology and Neurotology · Q132"},{"s":"Which of the following is an indication for overnight observation following AT?","o":["Attention deficit/hyperactivity disorder","Less than 3 years of age","Postoperative snoring","Periodic fever, aphthous stomatitis, pharyngitis, adenitis"],"k":"B","x":"Postoperative overnight observation is recommended for children younger than 3 years of age, those with severe OSA, cardiac complications associated with OSA, failure to thrive, obesity, a current respiratory infection, craniofacial anomalies, or neuromuscular disorders. Overnight observation should also be considered for children with behavioral factors that may predispose them to poor oral intake and/or difficultly with pain control. PAGE 1577","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q92"},{"s":"A survivor of oropharyngeal squamous cell carcinoma who received concurrent chemoradiation 5 years prior and who presents with dysphagia would likely demonstrate which of the following on high-resolution manometry?","o":["Reduced pharyngeal contraction","Silent airway invasion","Exaggerated hyolaryngeal elevation","Premature swallow trigger","Vocal fold immobility"],"k":"A","x":"Manometry uniquely provides objective and detailed information about time and amount of muscle constriction associated with swallowing. (Schaen-Heacock NE, Jones CA, McCulloch TM. Pharyngeal swallowing pressures in patients with radiation-associated dysphagia. Dysphagia. 2021;36(2):242-249.) PAGES 818-819","d":"Laryngology","src":"Bailey · Laryngology · Q10"},{"s":"On average, nasal surgery decreases CPAP pressure requirements by approximately:","o":["0.5 to 1 em H20","2 to 3 cm H20","4 to 55cm H20","6 to 8cm H20"],"k":"B","x":"In a systematic review and meta-analysis of patients with OSA and nasal obstruction, nasal surgery was shown to reduce average therapeutic CPAP pressures from 11.6 + 2.2 to 9.5 +2.0cm H20 and converted 89% of non-PAP users to PAP-tolerant users. PAGES 2545-2546","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q25"},{"s":"Which nerve supplies sensation to the nasal tip?","o":["Maxillary nerve","Infratrochlear nerve","External branch of descending ethmoidal nerve","Angular nerve"],"k":"C","x":"External branch of descending ethmoidal nerve. PAGE","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q49"},{"s":"The development of precision medicine for head and neck cancer will rely on:","o":["Identification of biological features linked to specific therapy","Use of Teflon-coated surgical instruments","Transportation to and from medical facilities","Well-tolerated surgical adhesives"],"k":"A","x":"The identification of genetic and proteomic biomarkers that can be used to predict response to therapy will help develop personalized anticancer medicines for patients. The field has advanced so far in its understanding, and there is hope that these pathways can be capitalized upon to develop novel therapeutics. PAGE 1974","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q5"},{"s":"The trochlea attaches to which bone in the orbit?","o":["Lacrimal","Lamina papyracea (ethmoid)","Frontal","Maxilla"],"k":"C","x":"The trochlea, the fibrous pulley upon which the superior oblique muscle acts, attaches to the frontal bone just posterior to the superomedial orbital rim. PAGE 591","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q101"},{"s":"Which combination of elements would satisfy all three requirements to start an airway fire?","o":["Oxygen, sponges, and electrocautery","Nitrous oxide, oxygen, and lasers","Electrocautery, ETT, and sponges","Laser, electrocautery, and oxygen"],"k":"A","x":"Three elements are necessary to cause an airway fire: an oxidizer (oxygen, nitrous oxide), fuel (sponges, ETT), and an ignition source (laser, electrocautery). PAGE 1880","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q179"},{"s":"The incisions necessary for a delivery approach to the nasal tip are:","o":["An intercartilaginous incision coupled with a transcolumellar incision","A marginal incision coupled with an intercartilaginous incision connecting to a full transfixion incision","A retrograde incision coupled with a marginal incision connecting to a hemitransfixion incision","A rim incision coupled with an intercartilaginous incision connecting to a full Killian incision"],"k":"B","x":"Delivery of the alar cartilages involved refers to pivoting the alar cartilages from the nose (much like a bucket handle) as a bipedicled chondrocutaneous flap attached medially and laterally. In order to do so, one must release the attachments superiorly and inferiorly. This is accomplished with a marginal incision coupled with an intercartilaginous incision that connects to a full transfixion incision. PAGE 3508","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q53"},{"s":"Which of the following is not a method used to outline the frontal sinus in preparation for sinusotomy cuts when performing an obliteration or cranialization?","o":["6-foot penny Caldwell","Towne view radiography","Mechanical palpation","Surgical navigation","Transillumination"],"k":"B","x":"Towne view radiograph. PAGE 1305","d":"Rhinology","src":"Bailey · Trauma · Q42"},{"s":"A 60-year-old male underwent a right-sided upper airway stimulator implantation 5 weeks ago. At his 1-week postoperative visit, there was mild deviation of the tongue to the right indicative of mild hypoglossal nerve paresis. He denied complaints of dysarthria or dysphagia. He presents today for activation of his device, and there is no improvement in his tongue examination. What is the best course of action?","o":["Activate the upper airway stimulation device as planned.","Delay activation and reevaluate in 4 weeks for improved tongue motion. Consider a course of steroids.","Go back to the operating room to reexplore the cervical wound and evaluate the hypoglossal nerve.","Obtain an electromyography (EMG) of the tongue musculature to assi s for hypoglossal nerve integrity."],"k":"B","x":"Mild paresis can be seen after upper airway stimulation implantation and is typically due to dissection along the nerve and placement of the stimulation cuff. The paresis will recover with time. There is no role for operative reexploration, and tongue EMG is not indicated. If this occurs, activation of the device should be delayed allowing for recovery of function. A course of steroids can be considered. Activation of the device in the setting of residual paresis may require elevated stimulation thresholds and could, in theory, delay recovery of nerve function. PAGE 2574","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q34"},{"s":"A 33-year-old female with cervical lymphadenopathy is taken to the operating room as you suspect possible lymphoma. How should the subsequent excisional lymph node biopsy be processed?","o":["The specimen should be sent “fresh” to the pathology laboratory and processed in a timely manner.","The specimen should be sent intact in a fixative solution to the pathology laboratory.","The specimen should be divided into several pieces by the surgeon and sent in a fixative solution to the pathology laboratory.","The specimen should be sent “fresh” to the pathology laboratory but can be processed in a few days."],"k":"A","x":"If a lymphoproliferative disorder is in the differential diagnosis, an excised lymph node should not be placed into a fixative solution. Instead, it should immediately be sent to the surgical pathology laboratory “fresh”—with the concern for lymphoma clearly indicated on the requisition. PAGE 154","d":"General","src":"Bailey · Basic Science/General Medicine · Q42"},{"s":"The status of the utricle can be assessed using which of the following vestibular laboratory tests?","o":["oVEMP","cVEMP","Caloric test","Rotational chair test","ECochG"],"k":"A","x":"The oVEMP is recorded from extraocular muscles with skin surface electrodes. The predominant peripheral generator of the oVEMP is the ipsilateral utricular macula. The projections from the utricle are routed through the utricular branch of the superior vestibular nerve and terminate at its root entry zone at the junction of the pons and the medulla in the vestibular nuclei. The oVEMP efferent limb begins when the activity from the vestibular nuclei is routed ipsilaterally and contralaterally through the medial longitudinal fasciculus to the motor nuclei of cranial nerves III, TV, and VI and terminate on the extraocular muscles. PAGES 2691-2693","d":"Otology","src":"Bailey · Otology and Neurotology · Q23"},{"s":"The first step in caring for the neonate in respiratory distress is to:","o":["Obtain a thorough history of the pregnancy and delivery","Perform flexible laryngoscopy","Rapidly assess the patient’s clinical condition","Obtain a pulse oximetry reading"],"k":"C","x":"While obtaining a thorough history, performing flexible laryngoscopy, and obtaining a pulse oximetry reading can all be helpful, rapid assessment of the neonate’s clinical condition allows the physician to determine the need for and urgency of potentially life saving interventions such as intubation or tracheotomy. PAGE 1385","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q25"},{"s":"A 53-year-old woman has a history of an episode of spinning vertigo that lasted approximately 1 week, occurring 10 years ago. Hearing was unaffected. She presented to the emergency department at that time, and imaging workup was negative. She was discharged with “vertigo.” She now has spinning vertigo when she lifts her chin upward and when rolling to the right side. On right Dix-Hallpike examination, she has upbeating and torsional nystagmus that appears in the plane of the right posterior semicircular canal. What is the current diagnosis?","o":["BPPV of the right posterior semicircular canal","BPPV of the right lateral semicircular canal","Labyrinthitis","Vestibular paroxysmia"],"k":"A","x":"The patient presents with symptoms of brief spinning vertigo triggered by changes in head position, suggesting BPPV. The Dix-Hallpike reveals an upbeating and torsional nystagmus in the plane of the affected right posterior semicircular canal, consistent with BPPV of this canal. An Epley maneuver for the right side would be appropriate treatment. Posterior canal BPPV can be a complication following a history of vestibular neuritis and may reflect a consequence of prior inflammation of the inner ear. PAGES 3213-3215","d":"Otology","src":"Bailey · Otology and Neurotology · Q150"},{"s":"Which of the following is most important in preventing postoperative cerebrospinal fluid (CSF) leak following resection of a ventral skull base tumor?","o":["Lumbar drain placement","Avoidance of Valsalva maneuvers","Postoperative bed rest","Watertight dural reconstruction"],"k":"D","x":"Following resection of the ventral skull base, the primary goal of reconstruction is to minimize the risk of CSF leak and meningitis by creating a watertight closure of the dura. Meticulous reconstruction of the skull base defect in a watertight fashion is critical for preventing postoperative CSF leak. PAGE 613","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q107"},{"s":"For stable patients with recurrent epistaxis originating from Kiesselbach plexus, the most effective form of cautery for long-term control is:","o":["Chemical cautery (silver nitrate)","Laser-assisted cautery","Radiofrequency ablation","Bipolar cautery"],"k":"D","x":"Bipolar cautery offers superior results to silver nitrate with half the rate of failure (14.5% and 35.1%, respectively) [26]. Radiofrequency ablation for cautery has been associated with the development of nasal septal abscesses and therefore not recommended [27]. Laser-assisted cauterize is typically reserved for patients with HHT. PAGE 456","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q47"},{"s":"Which of the following is a disadvantage of radiosurgery?","o":["Tissue diagnosis is not available.","The treatment is less effective than microsurgery.","It is only suitable for patients under 70 years old.","It is not effective against meningiomas."],"k":"A","x":"The main disadvantage for radiosurgery is the fact that tissue diagnosis is not possible. PAGE 3036","d":"Otology","src":"Bailey · Otology and Neurotology · Q108"},{"s":"Which of the following complications of HA filler injection in the nose is reversible in the majority of patients with prompt use of local treatments such as hyaluronidase, massage, and warm compress.","o":["Immediate signs of vascular compromise (ie, blanching, pain, etc.)","Necrosis","Blindness","Cerebral infarction"],"k":"A","x":"Immediate signs of vascular compromise (ie, blanching, pain, etc.) PAGE 3611","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q76"},{"s":"Aspirin-exacerbated respiratory disease (AERD), also known as Samter’s triad, is characterized by which three characteristics:","o":["Chronic rhinosinusitis with nasal polyps (CRSwNP), environmental allergies, and aspirin/nonsteroidal anti-inflammatory drug (NSAID) intolerance","Chronic rhinosinusitis without nasal polyps (CRSsNP), aspirin/NSAID intolerance, and asthma","CRSwNP, aspirin/NSAID intolerance, and asthma","CRSsNP, environmental allergies, and aspirin/NSAID intolerance"],"k":"C","x":"AERD is an adult-onset disorder made up of the triad of nasal polyposis, asthma, and intolerance to cyclooxygenase-1 (COX-1) enzyme inhibitors. PAGE 489","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q58"},{"s":"A patient with recurrent submandibular sialadenitis not responsive to conservative management is suspected to have an 8.0-mm ductal stone. Which of the following would be the appropriate next step in treatment?","o":["Sialendoscopy","Steroid taper with gland massage","Submandibular gland excision","Salivary Botox"],"k":"A","x":"One of the major impacts sialendoscopy has made is in the management of salivary stones. Marchal has provided an algorithm for the management of salivary stones. Stones less than 4 mm for the submandibular gland and 3 mm for the parotid gland can often be managed with complete endoscopic removal. For larger stones up to 5 or 6 mm, laser lithotripsy and endoscopic stone removal can be performed. For larger stones, hybrid techniques that involve a transoral incision or an external approach with the use of sialendoscopy to guide dissection site permit stone removal with gland preservation. PAGE","d":"General","src":"Bailey · Comprehensive Otolaryngology · Q8"},{"s":"An examiner may record their qualitative assessment of a patient vocal quality using which rating instrument?","o":["Voice Handicap Index-10","Voice-Related Quality of Life","Consensus Auditory-Perceptual Evaluation of Voice","Stroboscopy","Jitter"],"k":"C","x":"The Consensus Auditory-Perceptual Evaluation of Voice is a standardized instrument for listener’s description of patient’s voice. PAGE 993","d":"Laryngology","src":"Bailey · Laryngology · Q59"},{"s":"An 18-month-old child presents with parental concerns for speech delay. Which of the following is a finding that could be concerning for autism spectrum disorder (ASD)?","o":["The child has not uttered any words at the time of the encounter.","The child responded to sounds and pointed toward noises at 11 months of age.","The child smiled at 5 months of age.","The child knows the words “mama” and “dada.”"],"k":"A","x":"Children should begin to utter words before 18 months of age. Option A is abnormal development. Options B, C, and D are examples of normal development. PAGE 1339","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q2"},{"s":"A 45-year-old man presents with 6 months of chronic right ear tinnitus, hearing loss, and dizziness when walking at night or on unsteady surfaces. Bedside head thrust demonstrates corrective saccades for rapid head rotations in the planes of the right superior and lateral semicircular canals only. Audiometry shows a high-frequency hearing loss in the right ear. MRI finds a 1.5-cm enhancing tumor filling the IAC on the right. There is also a loop of the AICA against the vestibulo-cochlear nerve in the left IAC. What is the most likely diagnosis?","o":["Vestibular schwannoma of the right superior vestibular nerve","Vestibular schwannoma of the right inferior vestibular nerve","Right superior vestibular neuritis","Vestibular paroxysmia"],"k":"A","x":"Vestibular schwannoma rarely causes spinning vertigo. Patients more commonly present with tinnitus and hearing loss and may experience more subtle symptoms of gait instability. This lack of vertigo is likely from the chronic central adaptation to slowly worsening vestibular function. This patient has MRI findings of a tumor and on clinical examination has weakness of the right superior and lateral semicircular canals, two structures innervated by the superior vestibular nerve. The posterior semicircular canal is innervated by the inferior vestibular nerve and appears unaffected. This combination of findings suggests that the superior vestibular nerve is affected by this tumor, most likely a vestibular schwannoma. The loop of AICA is present in many individuals and by itself is insufficient for a diagnosis of vestibular paroxysmia. PAGE 3224","d":"Otology","src":"Bailey · Otology and Neurotology · Q151"},{"s":"A diagnosis of recurrent acute rhinosinusitis (ARS) requires at least how many episodes of acute rhinosinusitis per year with resolution between episodes?","o":["Eight","Six","Four","Two"],"k":"C","x":"Diagnosis of recurrent acute sinusitis requires at least four acute episodes per year with resolution between episodes. PAGE","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q51"},{"s":"Which nerves are involved in pharyngoglottal closure during the pharyngeal phase of a normal swallow?","o":["CN V and VIE","CN IX and XII","CN VII and X","CN IX and X"],"k":"D","x":"Pharyngoglottic closure involves the closure of the soft palate against the nasopharynx, vocal fold adduction, and approximation of the arytenoids through contraction of the thyroarytenoid and interarytenoid muscles, epiglottic inversion over the laryngeal inlet, and laryngeal elevation. This is mediated by afferent and efferent limbs of CN IX and X. PAGE 1442","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q51"},{"s":"Hallmark characteristics of late radiation dysphagia include:","o":["Lower cranial neuropathies in majority of patients","Often refractory to conservative swallowing interventions","Muscle fibrosis, denervation, and atrophy of the swallowing apparatus","All of the above"],"k":"D","x":"Late-radiation dysphagia is an insidious process that results in fibrosis, denervation, and atrophy leading to impaired mobility and contractility of the swallowing musculature. Lower cranial neuropathies are common and occur in 83% of patients with late-radiation dysphagia. Unfortunately, late-radiation dysphagia often does not improve in response to traditional swallowing exercises and interventions. PAGE 2456","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q149"},{"s":"What is the most common long-term complication of maxillofacial trauma repair?","o":["Malunion","Nonunion","Fibrous union","Osteomyelitis","Malocclusion"],"k":"A","x":"Inadequate reduction and/or fixation results in nonanatomic healing are the most common. C is a subcategory of nonunion and thus less frequent than malunion. D is rare. E is usually caused by malunion, the malunion category includes misaligned non— tooth-bearing bone as well that therefore will not cause malocclusion. PAGES 1261-1263","d":"H&N / Plastics / Trauma","src":"Bailey · Trauma · Q30"},{"s":"Posturography is an evaluation of functional balance that incorporates the input from vison, somatosensory, and. systems.","o":["Vestibular","Gustatory","Olfactory","Hearing"],"k":"A","x":"Computerized dynamic posturography is utilized to evaluate a patient’s functional balance; it is not a diagnostic test. Balance performance is measured by subjecting a patient to six different conditions where a visual surround and platform are moved with the body (ie, sway referencing). The output for analysis provides information regarding the ability of the patient to utilize visual, vestibular, and somatosensory information for the maintenance of upright stance. PAGES 2695-2697","d":"Otology","src":"Bailey · Otology and Neurotology · Q25"},{"s":"Which drug is most likely to be effective for treatment of migraine-associated vertigo?","o":["Sumatriptan","Meclizine","Nortriptyline","Diazepam"],"k":"C","x":"Tricyclic antidepressants are currently the mainstay of migraine prophylaxis. Nortriptyline is usually better tolerated than amitriptyline due to the more mild side effect profile. Sumatriptan (Imitrex), a SHT1D receptor agonist, has become the principal drug to abort severe migraine headache, but it has limited efficacy for concurrent vestibular symptoms. Antivertiginous medications, such as meclizine, may be used for symptom management. Benzodiazepines are not generally used for migraine-associated vertigo. PAGES 179-180","d":"Otology","src":"Bailey · Basic Science/General Medicine · Q46"},{"s":"Which of the following are not potential intraoperative complications of tracheotomy?","o":["Intraoperative tracheoesophageal fistula","Hemorrhage","Pneumothorax","Hypertension","Postobstructive pulmonary edema"],"k":"D","x":"All the above except hypertension is a known intraoperative complication. Fire is an additional risk of this procedure. Postobstructive pulmonary edema can occur shortly after relief of airway obstruction. PAGE 933","d":"Laryngology","src":"Bailey · Laryngology · Q45"}]},{"title":"Paper 5","q":[{"s":"Patients who have a posterior nasal packing:","o":["Should not be admitted by routine unless another indication exists","Should be admitted by routine to the ICU","Require admission with continuous pulse oximetry","Only require admission if they have obstructive sleep apnea or underlying cardiac disease"],"k":"D","x":"Posterior packs can also theoretically induce the nasopulmonary reflex leading to hypercarbia, hypoxia, and decreased lung volume, and thus, hospital admission with telemetry monitoring has been advocated in those with underlying comorbidities, such as obstructive sleep apnea, arrhythmias, and cardiac disease. PAGE 458","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q49"},{"s":"Which patient should most likely be rescheduled for surgery?","o":["An 8-year-old male with a history of controlled asthma presenting for an urgent appendectomy who has a |-week history of productive cough, fevers, and wheezing","A 4-year-old female with no past medical history presenting for bilateral myringotomy tube placement with a 3-day history of rhinitis with no other symptoms","An 8-month-old male with no past medical history presenting for cleft palate repair with a 5-day history of fevers, fussiness, and decreased feeding","A 3-year-old female with OSA presenting for AT who was sick with dry cough and rhinorrhea that resolved 2 weeks ago"],"k":"C","x":"Symptoms that are considered more concerning and would trigger rescheduling include fever, malaise, cough, poor appetite, purulent nasal discharge, and wheezing. Option C has fevers and malaise, and poor appetite. Option D has resolved symptoms. PAGE 1871","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q176"},{"s":"During a routine stapedectomy, the facial nerve is found to completely cover the stapes footplate. What is the best option in this setting?","o":["Decompress the facial nerve and perform a stapedotomy.","Decompress the facial nerve and perform a stapedectomy.","Amplification with a hearing aid.","Stapedotomy between the facial nerve and the round window."],"k":"C","x":"The tympanic segment of the facial nerve can sometimes be dehiscent and loop inferiorly to cover the oval window. In this e, it is best to abort the case and advise the patient to undergoing hearing aid evaluation. PAGES 2867-2873","d":"Otology","src":"Bailey · Otology and Neurotology · Q67"},{"s":"A 9-year-old girl presents with blunting of the nasolabial crease caused by an odontogenic infection in which space:","o":["Buccal space","Masticator space","Canine space","Sublingual space"],"k":"C","x":"The canine space represents a potential space bounded by the muscle heads of the upper lip elevators. These lip elevator muscles originate high on the maxilla and insert at the upper lip at the angle of the mouth. Although this space is infrequently involved with dental infections, it becomes involved if an infection from a maxillary cuspid tooth perforates the lateral cortex superior to the attachment of those upper lip elevators. Such an infection usually produces a firm swelling of the medial cheek and lateral surface of the nose that blunts the nasal labial crease. PAGE 716","d":"Rhinology","src":"Bailey · Comprehensive Otolaryngology · Q24"},{"s":"Which of the following is typically reported as the narrowest cross-sectional area in the nasal airway and accounts for what % of airway resistance?","o":["Internal nasal valve; 50%","External nasal valve; 30%","Choanae; 50%","Internal nasal valve; 30%"],"k":"A","x":"The internal nasal valve is often described as the narrowest segment of the upper airway, accounting for approximately 50% of nasal airway resistance with a typical superior angle of 10° to 15°. PAGE 2542","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q24"},{"s":"Oral finasteride 1 mg/day is most indicated in which of the following patients?","o":["A 72-year-old male with diffuse thinning","A 61-year-old female with frontal fibrosing alopecia","A 24-year-old male with miniaturization and thinning of the crown","A 16-year-old male worried about his family history of hair"],"k":"D","x":"Women should not take finasteride, it probably is not effective in frontal fibrosing alopecia, and young men have the most to lose by not being on preventative therapy for MPB. PAGE 3840","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q130"},{"s":"Which of the following diagnostic assays has demonstrated high reliability for detection of CSF rhinorrhea?","o":["Double-ring sign","Glucose test","B2-Transferrin test","Bilateral venous compression test"],"k":"C","x":"B2-Transferrin represents a highly reliable primary screening modality for CSF leak detection, with sensitivity ranging from 87% to 100% and specificity from 97% to 100%. Minimal volume of 0.5 mL is required and testing is only performed in select laboratory facilities in the United States, resulting in a delay of a few days to confirm diagnosis. Double-ring sign and glucose analysis have been found to be highly unreliable in detection of CSF rhinorrhea. PAGE 624","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q111"},{"s":"Both surgical intervention and radiation therapy for head and neck cancers can result in swallowing dysfunction. When are swallowing assessment and treatment most beneficial to patients with head and neck cancers?","o":["When a patient presents with a subjective complaint of dysphagia","Both before and after cancer treatment","When a patient develops aspiration pneumonia","When a patient demonstrates greater than 10% of their body weight"],"k":"B","x":"Prophylactic swallowing intervention delivered prior to oncologic therapy, in addition to reactive swallowing intervention, has been shown to facilitate quicker return to oral intake by mitigating anticipated swallowing dysfunction through compensatory strategies and swallowing exercises. PAGE 2457","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q148"},{"s":"Postoperatively, which of the following is true regarding care of pediatric tracheotomy patients?","o":["Patients are usually monitored on a general medical/surgical floor in the immediate postoperative period.","Acquired pressure wounds from the tracheostomy tube and/ or ties are expected and typically cannot be prevented.","Caregiver education on both daily and emergency tracheostomy care is a critical prior to discharge for a child who has undergone tracheotomy.","There is agreement among surgeons who perform pediatric tracheotomy that early elective airway endoscopy should be performed in all patients."],"k":"C","x":"It is important for any caregiver who will be involved in the tracheostomy patient’s care to understand both routine and emergency skills. Different types of educational programs have been described and are effective in the teaching of these caregivers. PAGE","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q68"},{"s":"Advantages of the endoscopic forehead lift include:","o":["Avoidance of forehead shortening","Significantly less long-term motor nerve injury","Significantly less long-term sensory nerve injury","Faster recovery of sensory neuropathy"],"k":"D","x":"Faster recovery of sensory neuropathy. PAGE 3667","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q89"},{"s":"Which factor is cited most frequently as impactful with respect to ossiculoplasty outcomes?","o":["Presence of the malleus","Presence of the stapes superstructure","Past history of cholesteatoma","Age of the patient"],"k":"A","x":"The malleus is very useful for ossiculoplasty. The malleus neck offers a consistent landmark for prosthesis placement. Typically, better hearing results can be expected if the partial ossicular chain reconstruction prosthesis is in contact with the malleus instead of being in contact directly with the tympanic membrane. This also helps to prevent prosthesis extrusion. PAGES 2849-2852","d":"Otology","src":"Bailey · Otology and Neurotology · Q64"},{"s":"What are the most common symptoms of CRSwNP?","o":["Bilateral nasal obstruction, nasal congestion, anterior and posterior nasal drainage, hyposmia, facial pressure, and headache","Dizziness, photophobia, and phonophobia","Unilateral nasal congestion","Epistaxis"],"k":"A","x":"Nasal obstruction, nasal congestion, anterior and posterior nasal drainage, hyposmia, facial pressure, smell loss, and headache are common symptoms of CRSwNP. PAGE 484","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q60"},{"s":"Which of the following has little impact on the diagnosis and management of CRSsNP?","o":["CT scan findings","Nasal endoscopy","Patient symptoms","Results of allergy testing"],"k":"D","x":"Symptoms, findings, nasal endoscopy, and CT are the most important factors in the diagnosis of CRSsNP. PAGE 500, Table 31.2","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q63"},{"s":"Which of the following maneuvers may require reestablishment of an intraoperative baseline ABR prior to manipulation of the auditory system?","o":["Retraction of the cerebellum","Opening of the dura","Irrigation","Acoustic masking from drilling noise"],"k":"B","x":"Nontraumatic maneuvers such as opening of the dura alter the conduction patterns of the ABR appearing as changes on the monitor; in these situations, an intraoperative baseline may need to be reestablished prior to further manipulation of the auditory system. PAGE 2706","d":"Otology","src":"Bailey · Otology and Neurotology · Q31"},{"s":"A 2-year-old male presents to the clinic after having been seen in the emergency department for sudden swelling on the right side of his face after a upper respiratory infection. An MRI at the time identified a macrocystic cervicofacial lymphatic malformation involving the right parotid gland. Genetic testing performed on tissue obtained from this lesion would be most likely to show which of the following?","o":["Gain-of-function PIK3CA gene mutation","MAML2 rearrangement","NMyc gene amplification","BRAF mutation"],"k":"A","x":"Gain-of-function somatic mutations in the PIK3CA gene have been implicated in most ventral head and neck lymphatic malformations. PAGE 1648","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q119"},{"s":"A 50-year-old male presents with unilateral right-sided pulsatile tinnitus that is improved with ipsilateral compression of her right neck. Which of the following is the most likely diagnosis?","o":["Temporomandibular joint disorder","Glomus tympanicum","Dehiscent jugular bulb","Superior semicircular canal dehiscence"],"k":"C","x":"Pulsatile tinnitus may be attributable to a vascular etiology. Light ipsilateral neck compression should be performed to assess the effect of decreased jugular venous flow on presence or intensity of the pulsatile tinnitus. Decreasing tinnitus with ipsilateral neck compression suggests a venous etiology such as a dehiscent jugular bulb. Temporomandibular joint disorder, superior semicircular canal dehiscence, or glomus tumors may present with pulsatile tinnitus but do not typically improve with neck compression. PAGE 3072","d":"Otology","src":"Bailey · Otology and Neurotology · Q117"},{"s":"Advantages of awake laryngeal procedures include all of the following except:","o":["They provide real-time feedback to the surgeon","They avoid the risk of airway compromise during general anesthesia","They can often be done in the office setting","A still surgical field allows for the most precise","Surgery"],"k":"D","x":"Awake procedures have the one limitation of not providing a perfectly still surgical site. PAGE 1135","d":"Laryngology","src":"Bailey · Laryngology · Q106"},{"s":"The vestibular surface of stapes arises from:","o":["First branchial arch","Second branchial arch","Second pharyngeal pouch","Otic placode"],"k":"D","x":"The vestibular surface of stapes arises from the second pharyngeal pouch. The first branchial arch gives rise to the mandible. The second branchial arch gives rise to the stapes (except its vestibular surface), styloid process, stylohyoid ligament, and the superior portion of the body of the hyoid. The otic placode gives rise to the auditory and vestibular systems. PAGE 2608","d":"Otology","src":"Bailey · Otology and Neurotology · Q1"},{"s":"Spreader grafts are designed to treat nasal obstruction at what level?","o":["Internal nasal valve","External nasal valve","Inferior nasal airway","Choana"],"k":"A","x":"Spreader grafts widen the internal nasal valve. PAGE","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q98"},{"s":"What is the most common cause of failure of newborn hearing screening?","o":["Cerumen or other fluid in the EAC","Otitis media with effusion","Mild-to-moderate sensorineural hearing loss","Severe-to-profound sensorineural hearing loss"],"k":"B","x":"There is no known percentage of patients who fail newborn hearing screening due to OME, but it is one of the most common causes of failure, and all babies who fail the newborn screen should be assessed for middle ear disease. Most babies (~85%) have bilateral OME if it is present. PAGE 1676","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q130"},{"s":"A recent well-designed randomized controlled trial by Mackay et al demonstrated which of the following findings?","o":["Surgical intervention was significantly less effective than medical management in improving both objective and subjective measures in patients who had failed conventional therapy for sleep apnea.","Surgical intervention was equally effective compared to medical management in improving both objective and subjective measures in patients who had failed conventional therapy for sleep apnea.","Surgical intervention was significantly more effective than medical management in improving both objective and subjective measures in patients who had failed conventional therapy for sleep apnea.","Surgical management is not effective in treating sleep apnea."],"k":"C","x":"The landmark study by Mackay et al published in 2020 demonstrated that surgical intervention (modified palatopharyngoplasty with tongue base radiofrequency ablation) led to significant improvements in both objective measures (AHI) and subjective measures (quality of life indices) compared to medical management in patients who had previously failed conventional therapy for their sleep apnea. PAGE 2559","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q29"},{"s":"What is the clinical difference between rigid bougies and balloon for dilations?","o":["Longer relief of dysphagia symptoms with balloon dilation.","Fewer complications with balloon dilation.","Less postoperative pain associated with balloon dilation.","There are no reported differences between them.","Decreased environmental impact with balloon dilation."],"k":"C","x":"Although there are no differences in symptomatic relief, recurrence rate, bleeding, or perforation, the balloon dilators have been shown to be less painful in the postoperative period. PAGE","d":"Laryngology","src":"Bailey · Laryngology · Q17"},{"s":"Which of the following is the most appropriate prophylactic antibiotic for endoscopic endonasal ventral skull base surgery?","o":["Ampicillin-sulbactam","Trimethoprim-sulfamethoxazole","Clarithromycin","Ceftazidime"],"k":"D","x":"Prophylactic intravenous antibiotics, which can cross the blood-brain barrier, such as third-generation cephalosporins are administered during ventral skull base surgery. PAGE 612","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q109"},{"s":"A 52-year-old woman presents with a unilateral nasal mass suspicious for inverted papilloma. CT scan reveals complete opacification of the right maxillary sinus with medialization of its posterior fontanelle. Besides endoscopic sinus surgery, what else would you be prepared to perform and add to the surgical consent for this patient?","o":["Lynch incision and biopsy of the medial orbital contents","Sublabial incision and transmaxillary approach","Frontal sinus trephination and endoscopic inspection of the frontal sinus mucosa","Lateral rhinotomy and maxillary transposition"],"k":"B","x":"The sublabial transmaxillary approach is indicated for sinonasal tumors that are not completely accessible using a purely endonasal approach. This includes tumor involvement of the anterior, inferior, and posterolateral walls of the maxillary sinus, which is possible in this case. PAGE 572","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q91"},{"s":"Elastin fibers are most numerous in which layer of the vocal fold?","o":["Quadrangular ligament","Superficial lamina propria","Intermediate lamina propria","Deep lamina propria","Vocal ligament"],"k":"C","x":"The intermediate layer is thought to provide the “elastic” connection between the cover (epithelium/SLP and the deep layer of the lamina propria). PAGES 866-867","d":"Laryngology","src":"Bailey · Laryngology · Q28"},{"s":"A healthy 33-year-old female is 2 days s/p total thyroidectomy complicated by bilateral vocal fold motion impairment and now has symptomatic airway obstruction. Of the following, which provides immediate relief of obstruction, is reversible, and a good alternative to a tracheotomy?","o":["Vocal fold suture lateralization","Posterior cordotomy","Adductor laryngeal Botox","Total arytenoidectomy","Nimodipine"],"k":"A","x":"Suture lateralization provides at least a short-term solution for improving a neurogenic acute glottic obstruction and is reversible. While adductor Botox could be an additional answer, Botox takes 24 to 72 hours to take effect. Medical therapy for acute vocal fold paralysis is not an acute acting treatment. PAGE 956","d":"Laryngology","src":"Bailey · Laryngology · Q47"},{"s":"Which of these factors has the greatest impact on prognosis for patients with oropharyngeal cancer?","o":["Patient age","Human papillomavirus (HPV) status","Alcohol use","Ethnicity"],"k":"B","x":"Despite the fact that they are squamous carcinomas, HPV-related cancers are clinicopathologically unique from conventional SCC. Patients with HPV-related SCC have improved prognosis when compared to cohorts with HPV-negative tumors. PAGE 168","d":"General","src":"Bailey · Basic Science/General Medicine · Q44"},{"s":"When discussing the option of tracheotomy with caregivers, which of the following should be discussed about communication and swallowing in children with tracheostomy?","o":["Use of a speaking valve with a tracheostomy tube is a good option in many children to both allow for vocalization and improve swallowing function.","Children with tracheostomy tubes should not attend school and should instead have home instruction only.","Swallowing function and oral feeding is not affected by the presence of a tracheostomy tube.","There is no association between speech and language development and tracheostomy tube status."],"k":"A","x":"Use of a one-way valve that attaches to the tracheostomy tube forces air through the glottis on exhalation, which allows for vocalization and restores subglottic pressures to near-normal. This restoration of subglottic pressures may also help improve swallowing function. PAGES 1502-1503","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q70"},{"s":"During signal transduction, binding of an odorant molecule to the olfactory receptor stimulates which of the following first?","o":["Production of adenylate cyclase to synthesize cyclic adenosine monophosphate (cAMP), which allows influx of Ca2+ resulting in neuronal depolarization","Production of adenylate cyclase to synthesize cAMP, which allows influx of Nat resulting in neuronal depolarization","Production of adenosine monophosphate to synthesize adenosine triphosphate, which allows efflux of Ca2* resulting in depolarization","Production of adenosine monophosphate to synthesize adenosine triphosphate, which allows efflux of Nat resulting in depolarization"],"k":"A","x":"Olfactory receptors collectively form a family of similar G proteins that when activated stimulate adenylate cyclase to synthesize cAMP, which acts as a second messenger to open a cyclic nucleotide—gated ion channel allowing for influx of cations and depolarization of the neuron. PAGE 315","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q7"},{"s":"The most common origin for posterior epistaxis is:","o":["Lateral nasal wall","Inferior septum","Superior septum","Posterior attachment of the inferior turbinate"],"k":"C","x":"The superior septum (Fig. 28.1) is most common location for a posterior bleed (59.5%) followed by the lateral nasal wall (26.2%) and inferior septum (14.3%). PAGE 452","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q46"},{"s":"Which melanoma subtype demonstrates neurotropism, a low rate of lymph node metastases, and a high rate of local recurrence?","o":["Superficial spreading","Desmoplastic","Lentigo maligna","Acral lentiginous"],"k":"B","x":"Desmoplastic melanoma has a predisposition for perineural invasion. This accounts for local recurrence despite histologically “negative margins” with recurrence rates reported between 23% and 48%. PAGE 2061","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q37"},{"s":"What structure is most at risk during an open transcervical approach for repair of Killian-Jamieson diverticula?","o":["Recurrent laryngeal nerve (RLN)","Hypoglossal nerve","Carotid artery","Marginal mandibular branch of facial nerve","Thoracic duct"],"k":"A","x":"The RLN is typically in the vicinity of the diverticula and at risk during the procedure. PAGE 839","d":"Laryngology","src":"Bailey · Laryngology · Q18"},{"s":"What are the risk factors that warrant repeat hearing screen between 24 and 30 months?","o":["External ear deformity: preauricular pit/tag","| day in the NICU","Born at 37 weeks","Family history of ear infections","None of the above"],"k":"E","x":"Children with indicators of progressive or delayed-onset hearing loss should be referred for an audiologic assessment at least once by 24 to 30 months of age. Children with risk indicators that are highly associated with delayed-onset hearing loss, having received extracorporeal membrane oxygenation, or having congenital CMV infection, should have more frequent audiologic assessments. PAGE 1677, Table 109.4","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q129"},{"s":"The cranium:face ratio changes during childhood, from during infancy to at maturation.","o":["4:1, 2:1","6:1, 3:1","8:1, 2:1","7:1, 2:1","9:1, 3:1"],"k":"C","x":"The cranium undergoes rapid growth in early infancy. Growth tapers starting at age 3, and by age 7, the cranium is 90% of its adult size. From infancy, the frontal bone increasingly protrudes, with midface structures receding. Over this time, cranium-to-face proportions will shift from 8:1 to 2:1 once maturation is complete. PAGE 1895","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q181"},{"s":"In regards to the utilization of digital health tools on snoring detection and monitoring, which of the following is correct?","o":["There are no prior studies on their reliability and therefore should not be used.","They have been validated to diagnose OSA.","Can be useful to quantify snoring severity and possible triggers such as alcohol intake.","They generally use piezoelectric current as the main measurement."],"k":"C","x":"Digital health tools for snoring detection and monitoring can help quantify snoring severity. The devices (such as smartphone apps) can be used to record the snoring sounds and can be used to calculate the snores per hour (snoring index). These apps can then be used to measure how much the snoring volume/frequency changes with certain behaviors (eg, alcohol intake) or medical/surgical treatments. PAGE 2537","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q20"},{"s":"Performing a dermabrasion, a yellow-whitish color with decreasing number of bleeding vessels is encountered. What level of the skin is represented by this visual indicator?","o":["Epidermis","Papillary dermis","Reticular dermis","Subcutaneous fat"],"k":"C","x":"A yellow-whitish color with decreasing number of blood vessels represents the reticular dermis. Generally, this depth should be avoided during dermabrasion because of the increased risk for scarring. PAGE 3796","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q117"},{"s":"To evaluate complaints of dysphagia following ischemic stroke, videofluoroscopic swallow study (VFSS) offers what advantage over fiberoptic endoscopic evaluation of swallowing?","o":["Assessment of vocal fold mobility","Detection of frank aspiration","Evaluation of hyolaryngeal elevation","Measurement of oral and pharyngeal transit times","Assessment of potential mucosal disease of the oropharynx"],"k":"C","x":"Evaluation of hyolaryngeal elevation is an essential aspect of dysphagia evaluation and is best determined on VFSS. (Madden C, Fenton J, Hughes J, Timon C. Comparison between videofluoroscopy and milk-swallow endoscopy in the assessment of swallowing function. Clin Otolaryngol Allied Sci. 2000;25(6):504-506.) PAGE 815","d":"Laryngology","src":"Bailey · Laryngology · Q8"},{"s":"Which patient is at the highest risk of postoperative apnea?","o":["A 3-month-old male who was born at 40 weeks of gestation, now presenting for inguinal hernia repair.","A 4-month-old male who was born at 32 weeks of gestation presenting for cleft lip repair.","An 8-month-old female who was born at 35 weeks of gestation presenting for emergency exploratory laparotomy.","A 13-month-old male who was born at 33 weeks presenting for umbilical hernia repair."],"k":"B","x":"Risk is greatest for former preterm infants who are less than 60 weeks postconception at the time of surgery. Risk is reduced to 1% at 56 weeks postconception age. PAGE 1872","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q175"},{"s":"The status of the saccule can be assessed using which of the following vestibular laboratory tests?","o":["Ocular vestibular-evoked myogenic potential (0oVEMP)","Cervical vestibular-evoked myogenic potential (CVEMP)","Caloric test","Rotational chair test","Electrocochleography (ECochG)"],"k":"B","x":"The cVEMP is a reflexive response of the musculature in the neck triggered by activation of the saccule. The afferent limb of the cVEMP extends from the saccule (ie, receptor organ) to Scarpa ganglion where neural projections course through the inferior branch of the vestibular nerve and terminate on the vestibular nuclei. The efferent limb of the cVEMP reflex descends from the vestibular nucleus to the motor nucleus of CN XI and then terminates on the sternocleidomastoid muscle. PAGES 2691-2693","d":"Otology","src":"Bailey · Otology and Neurotology · Q22"},{"s":"Significant interactions between noise exposure and prescribed medication have been shown even after medication use is ceased for which of the following prescription medications?","o":["Aspirin","Cisplatin","Tylenol","Ibuprofen"],"k":"B","x":"Interactions between cisplatin and noise exposure have been shown, including data that suggest vulnerability to noise injury remains increased even after cisplatin dosing ends. The long-term interaction may be related to the long-term accumulation of cisplatin in the cochlea, which appears to be relatively unique to the cochlea. PAGES 2916-2917","d":"Otology","src":"Bailey · Otology and Neurotology · Q84"},{"s":"Compared to adult thyroid cancer, pediatric thyroid cancer is more likely to:","o":["Be limited to the thyroid gland without metastatic lymphadenopathy at presentation","Contain a BRAF oncogene mutation","Cause disease-specific mortality","Require lateral neck dissection"],"k":"D","x":"Pediatric thyroid cancer is more likely to present with cervical metastasis than in adults. PAGES 1817, 1827","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q164"},{"s":"Cystic fibrosis (CF) is associated with which intranasal finding? ssociated childhood development often","o":["Nasal crusting","Epistaxis","Nasal polyps","Concha bullosa"],"k":"C","x":"CF is an autosomal recessive disease characterized by defective ion transport proteins. Multiple organ systems are infected including the lower and upper airways. CF is associated with a very high rate of CRSwNP and CRSsNP with up to 100% of patients demonstrating signs of sinonasal inflammation and 20% of patients developing nasal polyps. In contrast to the typical eosinophilic inflammation, which characterizes idiopathic nasal polyp disease in Western countries, CF-related nasal polyps are associated with neutrophil predominant inflammation. PAGE 439","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q41"},{"s":"How does reflux cause laryngeal symptoms and induce extraesophageal pathology?","o":["Direct contact of acid and pepsin with the epithelium","Additional factors such as vocal abuse or concomitant viral infection","Acid within the distal esophagus stimulates vagally mediated reflexes leading to cough and other laryngeal pathology","Both A and C","All of the above"],"k":"E","x":"Options A-B are thought to be each involved in the symptoms of LPR. PAGE 1000","d":"Laryngology","src":"Bailey · Laryngology · Q62"},{"s":"After nasal bones are mobilized, a patient is noted to have a persistently deviated upper third. Which maneuver will help further mobilize the bony pyramid?","o":["Percutaneous transverse osteotomy","Septoplasty","Spreader grafts","Clocking suture"],"k":"A","x":"The superior frontal beak and high dorsal septum may need to be mobilized in the deviated nose. PAGE 3554","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q66"},{"s":"What is the earliest time after primary rhinoplasty to offer major revision rhinoplasty in the patient with normal skin and inflammatory markers?","o":["1 month","3 months","5 months","12 months"],"k":"D","x":"12 months. PAGE 3589","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q77"},{"s":"Which of the following is not an indication for tracheotomy?","o":["Airway protection","Upper airway protection, acute or chronic","Dysphagia","Pulmonary toilet","Prolonged mechanical ventilation"],"k":"C","x":"Dysphagia (temporary) results from tracheotomy. All other options are indications for tracheotomy. PAGE 920","d":"Laryngology","src":"Bailey · Laryngology · Q42"},{"s":"Which subtype of sinusitis is most commonly associated with CRSsNP?","o":["AFRS","CRS associated with EGPA","Fungus ball (Mycetoma)","AERD"],"k":"C","x":"AFRS, EGPA, and AERD are all associated with type 2 inflammation and polyp formation. Fungus balls are usually isolated to a single sinus (sphenoid or maxillary most frequently) and are not associated with type 2 inflammation or polyp formation. PAGE 496","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q64"},{"s":"A 5-year-old patient presents with a wet cough for past 5 weeks. Parents report that the cough persists despite trial of over-the-counter medications including antihistamines, antitussives, and cough suppressants. What is the best management for this patient?","o":["Inhaled steroids","Reflux medication","Nasal steroids","Antibiotics"],"k":"D","x":"ACCP guidelines recommend antibiotics for chronic wet cough. Multiple studies have shown resolution or improvement with treatment of chronic wet cough with antibiotics. PAGE 1439","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q50"},{"s":"A newborn is found to have congenital severe-to-profound bilateral sensorineural hearing loss due to a genetic cause. After genetic testing, a diagnosis of the most common cause of genetic hearing loss is made. What gene is involved and what cell type of the organ of Corti is affected?","o":["KCNQI, inner hair cells","KCNQ1, supporting cells","GJB2, inner hair cells","GJB2, supporting cells"],"k":"D","x":"The gene GJB2 encodes connexin 26. Mutations in this gene are the most common genetic cause of congenital severe-to-profound bilateral sensorineural hearing loss in many ethnicities around the world. Connexin 26 is a subunit or a pore that allows for the transfer of potassium ions between supporting cells in the organ of Corti. PAGE 1722","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q137"},{"s":"Dietary modifications for EoE include everything except:","o":["Target elimination diet","Elemental diet","Empiric six food elimination diet","Peptic ulcer diet"],"k":"D","x":"Three dietary approaches have emerged over the past decade for management of EoE. These are the elemental diet, the empiric six food elimination diet, and the targeted elimination diet. PAGE 1944","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q199"},{"s":"Which of the following agents has a potential role in the etiology of otosclerosis?","o":["Influenza virus","Measles virus","Mumps virus","Parainfluenza virus"],"k":"B","x":"Measles antigens and RNA, as well as nucleocapsid, have all been identified in otosclerotic lesions. PAGE 2859","d":"Otology","src":"Bailey · Otology and Neurotology · Q69"},{"s":"The process of lateral inhibition regulates cell fates between hair cells and supporting cells in the developing cochlea and is mainly regulated by:","o":["Brain-derived growth factor","Wnt signaling","Notch signaling","Atohl"],"k":"C","x":"Notch signaling plays an important role in inner ear development. One of the ways that Notch signaling exerts its effects is by lateral inhibition, which limits
