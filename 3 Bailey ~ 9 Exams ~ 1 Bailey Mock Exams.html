supporting cells to differentiate into hair cells. PAGES 3266-3267","d":"Otology","src":"Bailey · Otology and Neurotology · Q164"},{"s":"Which of the following is incorrect regarding epiphora?","o":["The most common cause in children is an imperforate valve of Hasner.","The most common cause in young adults is idiopathic stenosis of the distal nasolacrimal duct.","The most common cause in middle-aged adults is dacryoliths.","The most common cause in the older adults is idiopathic stenosis of the distal nasolacrimal duct."],"k":"B","x":"The etiology of lacrimal apparatus obstruction can often be determined by a patient’s age: children typically have a congenital imperforate valve of Hasner. Epiphora in young adults is usually posttraumatic or a sequelae of dacryocystitis. Epiphora in middle-aged is usually caused by dacryoliths, stones that form in the lacrimal sac, while the older adults usually develop idiopathic stenosis of the distal nasolacrimal duct. In adults, obstruction is generally more common in females than in males. PAGE 594-595","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q103"},{"s":"The organ of Corti is located in which of the following fluid compartment?","o":["Scala vestibuli","Scala media","Scala tympani","Middle ear space"],"k":"B","x":"The organ of Corti is located in the scala media, which contains endolymph with high potassium. PAGES 3268-3269","d":"Otology","src":"Bailey · Otology and Neurotology · Q163"},{"s":"Which of the following is true regarding management of frontal sinus fractures?","o":["Mucoceles can occur decades after treatment of frontal sinus fractures.","All frontal sinus outflow tract fractures require obliteration.","An upper blepharoplasty incision provides excellent access to the medial and superior frontal bone.","Traumatic CSF leaks rarely spontaneously heal without surgical intervention.","Endoscopic brow approaches can be used for acute treatment of anterior table fractures and secondary camouflage."],"k":"A","x":"Mucoceles can occur decades after treatment of frontal sinus fractures. PAGE 1318","d":"Rhinology","src":"Bailey · Trauma · Q45"},{"s":"What is the greatest average bone conduction threshold for which osseointegrated implantation is still possible?","o":["35 dB HL","45 dB HL","55 dB HL","65 dB HL"],"k":"D","x":"The percutaneous passive bone conduction implants allow for a conductive or mixed hearing loss threshold < 65 dB. For the transcutaneous active BCIs, the Cochlear OSIA device is approved for < 55 dB thresholds, whereas Med-EL Bonebridge is approved for < 45 dB thresholds. PAGES 3121-3123","d":"Otology","src":"Bailey · Otology and Neurotology · Q129"},{"s":"Which of the following is a useful treatment for ineffective esophageal motility?","o":["Nifedipine","Bethanechol","Sildenafil","Fluconazole","Amoxicillin"],"k":"B","x":"Prokinetic medication including bethanechol can be used for ineffective esophageal motility. PAGE 854","d":"Laryngology","src":"Bailey · Laryngology · Q25"},{"s":"Wernicke encephalopathy includes all of the following except:","o":["V3 distribution sensory loss","Confusion","Ophthalmoplegia","Ataxia"],"k":"A","x":"Wernicke encephalopathy is caused by thiamine deficiency. It typically presents with eye movement paresis (ophthalmoplegia), confusion, and ataxia of gait and stance. V3 distribution sensory loss is usually not seen in these patients. PAGE","d":"Otology","src":"Bailey · Otology and Neurotology · Q156"},{"s":"Which one of the following is true when describing an optimal EHR system?","o":["EHR should always be client-server based.","EHR cannot be used for billing purposes.","EHR should provide secure patient communication.","EHR does not allow for prescription tracking."],"k":"C","x":"Optimal EHR systems feature secure patient communications, medication tracking, automated billing, appointment scheduling features, document scanning/filing, and physician orders and surgical booking. They can be client-server based or web based. PAGE 3910","d":"General","src":"Bailey · Contemporary Issues in Medical Practice · Q16"},{"s":"Which of the following statements comparing mold spores and pollen grains is accurate?","o":["Pollen grains are more prevalent in outdoors.","Mold spores commonly cause clinical symptoms at levels of 100 spores/m} or less.","Cross-reactivity between mold antigens is high facilitating screening tests for mold allergies.","Mold spores are commonly seen at levels over 4,000 spores/"],"k":"D","x":"Mold spores are in high abundance relative to pollen grains and have variable cross-reactivity resulting in challenges with allergy testing. Pollen grains can have a clinical impact at relatively low abundance (<100 spores/m3). PAGE 357","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q19"},{"s":"Structural differences within the nasal cavity and sinuses, such as septal deviation, concha bullosa, and Haller cells, are more likely to be factors in developing:","o":["CRSwNP","CRSsNP.","Odontogenic sinusitis","Allergic fungal sinusitis"],"k":"B","x":"Anatomic variants and septal deviations have been implicated as contributing factors in the pathogenesis of some patients with CRSsNP. While the majority of patients with CRSsNP have nonstructural etiologies of disease, those who have anatomic variants and fail to respond adequately to medical therapy may benefit from surgery to address anatomic changes as components of their endoscopic sinus surgery. PAGE 497","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q65"},{"s":"Which of the following structures can be found in zone II of the neck?","o":["Thyroid","Larynx","Salivary glands","Thoracic duct"],"k":"B","x":"Zone II of the neck contains carotid sheath structures including the common and internal carotid artery, internal jugular vein, vagus nerve, esophagus, trachea, and the larynx. Table 77.3 lists key structures located in each anatomic neck zone. PAGE 1188","d":"H&N / Plastics / Trauma","src":"Bailey · Trauma · Q15"},{"s":"The best candidate for a coronal forehead lift or one of its modifications from the following is:","o":["A younger female with a long forehead/high hairline","An older female with a short forehead/low hairline","A younger male with a short forehead and a family history of androgenic alopecia","An older male with a long forehead and no history of androgenic alopecia"],"k":"B","x":"An older female with a short forehead/low hairline. PAGE 3654","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q87"},{"s":"Which of the following is considered a high-risk basal cell carcinoma?","o":["7-mm lesion of the left cheek","8-mm lesion of right temporal scalp","5-mm lesion of left preauricular area","4-mm lesion of central forehead"],"k":"C","x":"The preauricular area falls into the “mask” area of the face, also known as H-zone and is considered high-risk. PAGE 2047 (Table 130.1)","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q32"},{"s":"During a revision stapedectomy, the previously placed piston prosthesis is noted to be displaced out of the stapedotomy and the lenticular process is absent, but a majority of the incus long process is still present. What is the best way to proceed?","o":["Use a notched bucket handle prosthesis between the incus long process and the stapedotomy.","Use a total ossicular chain reconstruction prosthesis prosthesis between the stapes footplate and the malleus.","Use a partial ossicular chain reconstruction prosthesis prosthesis between the stapes footplate and the incus.","Place a piston on the malleus neck down to the stapes footplate."],"k":"A","x":"While all of the options are possible, a notched bucket handle prosthesis placement between the incus long process and stapedotomy is likely to give the best hearing outcomes. PAGES 2867-2873","d":"Otology","src":"Bailey · Otology and Neurotology · Q68"},{"s":"The following audiometric results are indicative of a retrocochlear pathology except:","o":["Positive acoustic reflex decay","Increased wave V latency difference","Shortened interpeak latencies waves I-V","Absent acoustic reflexes","Unilateral sensorineural hearing loss with disproportionately lower discrimination"],"k":"C","x":"All except shortened interpeak latencies waves I-V are audiometric characteristics of a retrocochlear pathology. PAGES 2962-2963","d":"Otology","src":"Bailey · Otology and Neurotology · Q99"},{"s":"Which surgical procedure corrects lid malposition secondary to horizontal lower eyelid laxity, rounding, scleral show, and/ or ectropion?","o":["Canthopexy","Canthoplasty","Lower blepharoplasty","Fat grafting"],"k":"B","x":"Canthoplasty. PAGE 3699","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q95"},{"s":"Which of the following adverse side effects of oral appliance therapy most often necessitates discontinuation of therapy?","o":["Tooth discomfort","Gingival or other mucosal irritation","Dry mouth","Occlusal change"],"k":"D","x":"Many oral appliance side effects are minor and often transient including tooth pain, headache, dry mouth, and gingival irrigation. More severe and persistent adverse sequelae include clinically significant temporomandibular joint dysfunction, tooth movement, and permanent occlusal changes and often necessitate device discontinuation. PAGES 2515-2516","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q8"},{"s":"Compromise of which structure is most commonly associated with empty nose syndrome?","o":["Nasal septum","Inferior turbinate","Middle turbinate","Superior turbinate"],"k":"B","x":"Resection or other aggressive treatment of the inferior turbinate is most commonly associated with empty nose syndrome. PAGE 587","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q100"},{"s":"Which of the following is true about nasal obstruction?","o":["Nasal obstruction increases the maximal flowrate through the pharynx.","Nasal obstruction is uncommon in sleep apnea patients.","Nasal obstruction may contribute to sleep disordered breathing (SDB).","All of the above.","B andC."],"k":"C","x":"Population-based studies suggest that nasal obstruction may independently contribute to SDB, with chronic nocturnal nasal obstruction notably more prevalent in individuals with SDB, habitual snoring, chronic daytime sleepiness, and chronic nonrestorative sleep. Nasal airway obstruction is common in sleep apnea patients (reported in up to 70%). Based on the Starling resistor model, nasal resistance may decrease the maximal flowrate through the pharynx. PAGES 2542-2543","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q22"},{"s":"What skull base lesion is hypointense on T1, hyperintense on T2, and bright on diffusion-weighted image?","o":["Epidermoid","Arachnoid cyst","Lipoma","Cholesterol granuloma","Chordoma"],"k":"A","x":"This MRI pattern is consistent with an epidermoid. Please refer to Table 182.2 for a summary of CPA lesion characteristics. PAGE 2984","d":"Otology","src":"Bailey · Otology and Neurotology · Q101"},{"s":"On a modified barium swallow study, the epiglottis does not invert during the pharyngeal phase of swallowing. This suggests:","o":["Paresis of the aryepiglottic folds","Pharyngeal delay","Preferential filling of only one pyriform sinus","Tongue base weakness","Cognitive impairment"],"k":"D","x":"This abnormal position/movement of the epiglottis is a hallmark feature of dysphagia related to base of the tongue weakness, which is often seen after radiation therapy. PAGE 805","d":"Laryngology","src":"Bailey · Laryngology · Q4"},{"s":"Shear failure of resorbable screws with open reduction and internal fixation of laryngeal cartilage is best prevented by utilizing:","o":["Tapped, undersized drill bits","Untapped, undersized drill bits","Tapped, same sized drill bits","Untapped, same sized drill bits","Tapped, upsized drill bits"],"k":"B","x":"This approach maximizes the security of fixation. PAGE 978","d":"Laryngology","src":"Bailey · Laryngology · Q55"},{"s":"The most critical part of diagnosis of allergic rhinitis is:","o":["History","Physical examination","Nasal endoscopy","Allergy testing"],"k":"A","x":"A history of allergic symptoms is necessary to diagnose allergic rhinitis as testing and physical examination findings independent of history are nonspecific. PAGE 406","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q32"},{"s":"Mutation of which gene increases the risks of aminoglycoside ototoxicity?","o":["28S rRNA","18S rRNA","12S rRNA","16S rRNA"],"k":"C","x":"The A1555G mutation in the mitochondrial 12S rRNA results in significantly increased susceptibility of aminoglycosides. PAGE 2939","d":"Otology","src":"Bailey · Otology and Neurotology · Q87"},{"s":"What is the most common cause of acute facial paralysis?","o":["Bell palsy","Facial nerve schwannoma","Lyme disease","Otitis media"],"k":"A","x":"Bell palsy is the most common cause of acute facial paralysis. PAGES 2884-2886","d":"Otology","src":"Bailey · Otology and Neurotology · Q75"},{"s":"Where is the most common site for a dehiscent facial nerve?","o":["Mental segment","Tympanic segment","Labyrinthine segment","Mastoid segment"],"k":"B","x":"Treat the facial nerve as if it is dehiscent until proven otherwise, especially in the tympanic segment. This is important in middle ear and stapes surgery. PAGES 2713-2714","d":"Otology","src":"Bailey · Otology and Neurotology · Q28"},{"s":"Ongoing drainage after performing a radical mastoidectomy may be related to:","o":["Oversized meatoplasty","Oversized facial recess","Oversized facial ridge","Oversized eustachian tube"],"k":"C","x":"To improve healing and reduce postoperative drainage, CWD procedures must have a well-ventilated cavity. A facial ridge that is not sufficiently lowered isolates the mastoid cavity and reduces ventilation, whereas a large meatoplasty does the opposite. A radical mastoidectomy removes the incus buttress, eliminating the facial recess, and plugs the eustachian tube. PAGE 2826","d":"Otology","src":"Bailey · Otology and Neurotology · Q61"},{"s":"What is the correct dose of oral steroids as initial therapy that may be offered to patients with SSHNL within 2 weeks of symptoms onset?","o":["Prednisone | mg/kg/d x 7 to 10 days, then taper","Prednisone 1 mg/kg/d x 7 to 10 days, with no taper","Prednisone 0.5 mg/kg/d x 7 to 10 days, then taper","Prednisone 0.5 mg/kg/d x 7 to 10 days, with no taper"],"k":"A","x":"There is some evidence that the value of steroids may be helpful for initial treatment of SSNHL. There are side effects/risks of high-dos hyperglycemia, and Cushing like syndrome, which may outweigh the systemic steroid use such as avascular hip necrosis, benefits of the therapy in some patients. When oral steroids are given as initial therapy, the correct dose is prednisone 1 mg/kg/d x 7 to 10 days, then taper to allow the adrenal gland time to resume normal function. PAGE 3064","d":"Otology","src":"Bailey · Otology and Neurotology · Q113"},{"s":"According to the consensus statement from American Academy of Otolaryngology-Head & Neck Surgery in 2004, which of the following is recommended when prescribing a potentially ototoxic antibiotic drops to patients with a tympanic membrane perforation?","o":["The patient should be warned of the risks of ototoxicity.","The potentially ototoxic eardrops should only be used in infected ears.","The patient should be instructed to call if they develop dizziness, vertigo, hearing loss, and tinnitus.","All of the above."],"k":"D","x":"All of these considerations should be given when prescribing potentially ototoxic antibiotic eardrops to patients with tympanic membrane perforation. PAGE 2939","d":"Otology","src":"Bailey · Otology and Neurotology · Q89"},{"s":"A patient presents for facial photographs prior to surgery. The surgeon observes that the tip of the nose is in focus but the remainder of the face is out of focus. What is the best option of quickly increasing the depth of field?","o":["Increase distance from the subject.","Decrease the size of the aperture page.","Shorten focal length of the lens.","Increase shutter speed."],"k":"B","x":"Decreasing the aperture increases the depth of field. PAGE 3294","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q3"},{"s":"As compared to pituitary adenomas in the adult population, which statement best reflects the incidence of pediatric pituitary adenoma?","o":["Pediatric pituitary adenomas are found to be functional adenomas more often than adult pituitary adenomas.","Pediatric pituitary adenomas are found to be functional adenomas less often than adult pituitary adenomas.","Pediatric pituitary adenomas are found to be functional adenomas with the same frequency as adult pituitary adenomas.","None of the above."],"k":"A","x":"Pediatric pituitary adenomas are much more likely than adult pituitary masses to be secreting tumors. Reports estimate that 89.5% to 95% of adenomas are secreting in the pediatric age group with corticotrophinomas (adrenocorticotropic hormone-secreting) being the most common. PAGE 1635","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q111"},{"s":"A prominent low-tone air-bone gap should raise suspicion for which of the following situations?","o":["Stapes footplate fixation","Lateral ossicular chain (malleus and/or incus) head fixation","Incus erosion","Incus and stapes superstructure erosion"],"k":"B","x":"A low-tone air-bone gap typically indicates lateral ossicular chain fixation (malleus and/or incus), whereas stapes fixation typically affects mid and high frequencies. PAGES 2839-2841","d":"Otology","src":"Bailey · Otology and Neurotology · Q65"},{"s":"The Chandler classification describes:","o":["The scale of intracranial complications from pediatric acute sinusitis","How to measure the CT appearance of acute sinusitis","Five progressive categories of orbital complications of acute sinusitis","The virulence of bacteria associated with acute sinusitis"],"k":"C","x":"The Chandler classification or orbital complications of acute sinusitis include preseptal cellulitis, subperiosteal abscess, orbital cellulitis, orbital abscess, and cavernous sinus thrombosis. PAGE 1911","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q186"},{"s":"Allergic fungal rhinosinusitis (AFRS), which is often unilateral, is most commonly found in patients from what U.S. region:","o":["West Coast","New England","South","Upper Midwest"],"k":"C","x":"There is a geographic propensity for the development of AFRS in southern areas of the United States thought to be secondary to the high-humidity climate. PAGE 490","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q59"},{"s":"What are the anatomic components of the internal nasal valve?","o":["Septum, piriform aperture, cephalic border of the lower lateral cartilage, head of the inferior turbinate","Caudal border of the upper lateral cartilage, septum, pyriform aperture, head of the middle turbinate","Piriform aperture, vomer, caudal border of the upper lateral cartilage, head of the inferior turbinate","Caudal border of the upper lateral cartilage, septum, pyriform aperture, head of the inferior turbinate"],"k":"A","x":"Septum, piriform aperture, cephalic border of the lower lateral cartilage, head of the inferior turbinate. PAGE 3501","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q46"},{"s":"Imaging that the American College of Radiology considers “usually appropriate” for evaluating orbital and intracranial complications of sinusitis includes:","o":["CT or MRI of the head and paranasal sinuses without IV contrast","CT or MRI of the head and paranasal sinuses without and with IV contrast","Ultrasound","PET/CT scan"],"k":"B","x":"MRI and CT with and without contrast are often complementary studies in the setting of acute orbital or intracranial complications of rhinosinusitis. (Chapter 34, Table 34.2) PAGE 540","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q80"},{"s":"Intratympanic steroid injection used as salvage therapy for","o":["Has been shown to be equivalent to HBO alone","Offers significant improvement in hearing compared to systemic steroids as salvage","Is recommended only after 3 months of no hearing improvement","Is better when offered as methylprednisolone compared to dexamethasone"],"k":"B","x":"Multiple studies have shown that after 2 weeks of onset of the SHL, intratympanic steroids have a better recovery rate than either oral steroids alone or HBO, whose rates of recovery decline significantly at weeks 3 and 4. For that reason, the clinical practice guidelines recommend the use of intratympanic steroids as salvage therapy between 2 and 6 weeks of onset. One meta-analysis (Ng et al, 2015) showed that dexamethasone has significantly better outcomes compared to methylprednisolone. PAGES 3065-3066","d":"Otology","src":"Bailey · Otology and Neurotology · Q115"},{"s":"A 6-week-old infant with symptoms of chronic nasal congestion, anterior spillage of formula during feeds, and frequent spit up comes for an initial clinic visit. The infant is gaining weight appropriately and has not had any pulmonary issues, but the caregiver is concerned about the infant’s feeding behaviors. The best next course of action is to:","o":["Instruct the caregiver to begin adding rice cereal or another thickening agent to the infant’s formula","Consult the SLP for a bedside evaluation to trial feeding strategies such as slower nipple flow and external pacing breaks to help the infant’s swallowing coordination","Schedule the patient for an instrumental swallowing assessment as soon as possible","Have the infant follow-up in 1 month and recheck infant’s symptoms at that time"],"k":"B","x":"Using a slower-flowing nipple and providing consistent pacing breaks during the feed can help with breathing/ swallowing coordination. Though thickeners may aid in slowing the flow rate of the liquid, other strategies should be implemented first. PAGE 1452","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q55"},{"s":"A patient presents with a conductive hearing loss and negative Rinne tuning fork test. They also report episodic vertigo, low-pitched tinnitus, and ear fullness. What is the best management option for their hearing loss?","o":["Stapedotomy","Amplification with a hearing aid","Partial stapedectomy","Stapes mobilization"],"k":"B","x":"This patient likely has superior canal dehiscence. Therefore, hearing amplification is recommended instead of any stapes procedures. PAGES 2860-2861","d":"Otology","src":"Bailey · Otology and Neurotology · Q71"},{"s":"A patient with an attic cholesteatoma is consented for an endoscopic atticotomy and tympanoplasty with ossicular chain reconstruction. What finding would most likely drive the surgeon toward adapting the surgical plan to include performing a mastoidectomy using the microscope?","o":["Cholesteatoma extending into the aditus ad antrum","Cholesteatoma enveloping the incudostapedial joint","Cholesteatoma in the anterior epitympanum","Prominent anterior canal wall"],"k":"A","x":"Cholesteatoma extending into the aditus ad antrum is difficult to remove endoscopically and is a good indication for performing a mastoidectomy under the microscope. A mastoidectomy may improve access to the incudostapedial joint via a facial recess approach and allow access to the anterior epitympanum via a posterior atticotomy approach, but these areas can often be accessed endoscopically as well. Visualization of the anterior sulcus may not be critical for treating an attic cholesteatoma and could also be achieved endoscopically. Given the occasional need for mastoidectomy in patients with advanced disease undergoing endoscopic tympanoplasty, it is advisable to consent them for this eventuality. PAGES 2822-2825","d":"Otology","src":"Bailey · Otology and Neurotology · Q58"},{"s":"Audibility is verified using:","o":["Real ear aided response measures","Asking the patient if they can hear","First fit from the manufacturer’s software","None of the above"],"k":"A","x":"When best practices are used to verify hearing aid fittings, real ear-aided response measures are incorporated into the fitting. Research has consistently shown that the use of real-ear probe microphone measurements increases patient loyalty, results in fewer office visits, improves audibility, and increases patient satisfaction. PAGES 3172-3174","d":"Otology","src":"Bailey · Otology and Neurotology · Q140"},{"s":"The literature supports using the “5 A’s” as an approach to smoking cessation. Choose the following answer choice that is not 1 of the “5 A’s”?","o":["Ask","Assess","Advise","Abstain"],"k":"D","x":"The question asks which is not one of the 5 A’s of smoking cessation. The 5 A’s in order are Ask, Advise, Assess, Assist, and Arrange. First, you want to ask how the patient is doing and about their opinion of smoking. Next, advise them by discussing the risks of smoking and the benefits of smoking cessation. Third, assess the patient’s willingness to quit. After determining the patient’s desire to stop smoking, you should assist them by offering a multimodality treatment plan. This plan may include counseling, nicotine replacement therapy, pharmacotherapy, or support groups. Lastly, arrange for a follow-up visit to help them remain consistent. PAGES 265-267","d":"General","src":"Bailey · Basic Science/General Medicine · Q76"},{"s":"What is the appropriate margin of resection for a 3.7-mm-thick melanoma of the scalp?","o":["0.5 cm","1cm","1to2cm","2cm"],"k":"D","x":"For patients with T3 (2.01-4.0 mm) melanomas, the appropriate margin of resection is 2.0 cm. PAGE 2064","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q39"},{"s":"A 50-year-old man presents with neck swelling on the right side. The patient denies any associated pain or constitutional symptoms. On examination, you palpate an enlarged, nontender, firm lymph node in the posterior triangle on the right side. You also note a serous middle ear effusion on the right side and a normal tympanic membrane on the left side. What is the next best step?","o":["Nasal endoscopy","Cross-sectional imaging of the neck","Myringotomy","Nasal steroid spray and observation"],"k":"A","x":"Carcinoma must always be considered on the differential diagnosis for lymphadenopathy, particularly in adult patients with risk factors. Unilateral serous middle ear effusion may be due to a nasopharyngeal mass, so nasal endoscopy should be performed during the clinical examination. PAGE 735","d":"H&N / Plastics / Trauma","src":"Bailey · Comprehensive Otolaryngology · Q33"},{"s":"A patient presents to your clinic 6 days postoperatively after a paramedian forehead flap reconstruction of a nasal defect for suture removal. When asked how they are doing with recovery, they regretfully inform you that they have not been able to refrain from smoking postoperatively but would like assistance with this. You prescribe them a gum that has the chemical primarily responsible for tobacco dependence. What is this chemical?","o":["Nicotine","Dopamine","Cocaine","Tobacco"],"k":"A","x":"Nicotine is the chemical primarily responsible for tobacco dependence. PAGE 263","d":"H&N / Plastics / Trauma","src":"Bailey · Basic Science/General Medicine · Q75"},{"s":"When evaluating sensorineural hearing loss in adults, the advantage of MRI of the internal auditory canal with and without contrast is which of the following:","o":["Evaluate the bony anatomy","Can evaluate 7th and 8th cranial nerves along with membranous labyrinth","Can assess for brainstem lesion","Band C","A and B"],"k":"D","x":"MRI has the advantage of not only being able to evaluate the 7th and 8th cranial nerve complexes and the membranous labyrinth but also for pathology affecting the brainstem (ischemic or demyelinating disease) where the nuclei and parenchymal courses of the nerves reside. PAGE 135","d":"Otology","src":"Bailey · Basic Science/General Medicine · Q37"},{"s":"There is a commercially available salivary pepsin assay in the United States.","o":["True","False","True but requires a doctors order","False this technology has been developed yet","False since pepsin can now be determined with a breath test"],"k":"A","x":"True. PAGE 1008","d":"Laryngology","src":"Bailey · Laryngology · Q65"},{"s":"A 54-year-old man presents to the emergency department 6 days after removal of a second mandibular molar. His temperature is 38.7 °C, heart rate 101, respiratory rate 22, with oxygen saturation of 98% on 6-L nasal cannula. On assessment, he has no stridor but is uncomfortable lying flat and is spitting his secretions into a basin. There is edema of the left submandibular area extending across the submental neck, without appreciable fluctuance. Flexible laryngoscopy shows significant supraglottic edema with patent glottic inlet. The most appropriate next step in management is:","o":["Admission to observation unit with IV steroids and high-flow oxygen","Rapid sequence induction with sedation and nasotracheal intubation","Awake flexible fiberoptic nasotracheal intubation","Cricothyroidotomy","Emergent tracheostomy in the emergency department"],"k":"C","x":"The patient has an odontogenic infection concerning for Ludwig angina. The clinical scenario describes evolving airway compromise with symptoms of submental edema, significant dysphagia, inability to lie flat, and supraglottic edema. The airway should be secured in a controlled fashion with awake flexible fiberoptic nasotracheal intubation. Induction of anesthesia with blind attempts at nasotracheal or orotracheal intubation should not be performed. As an otolaryngologist, one should be prepared to perform bedside cricothyroidotomy or tracheostomy if intubation is unsuccessful. It may be reasonable to observe odontogenic infections in early stages without airway compromise, however that is not the scenario presented here. PAGE 720","d":"Rhinology","src":"Bailey · Comprehensive Otolaryngology · Q27"},{"s":"The American College of Rheumatology recommends which of the following basic tests for children with suspected multisystem inflammatory syndrome?","o":["EKG","Antinuclear antibody testing","Vision testing","C-reactive protein"],"k":"D","x":"The American College of Rheumatology recommends that children with suspected multisystem inflammatory syndrome should have basic laboratory testing (complete blood count, basic metabolic panel, and C-reactive protein) as well as reverse transcription-polymerase chain reaction and serology testing for SARS- CoV-2. PAGE 297","d":"General","src":"Bailey · Basic Science/General Medicine · Q86"}]},{"title":"Paper 6","q":[{"s":"An infant presents with a midline nasal mass that increases in size while crying and bearing down. This is consistent with which of the following?","o":["Dermoid","Encephalocele","Glioma","Hemangioma"],"k":"B","x":"Growth of the midline nasal mass with bearing down or internal jugular vein compression is known as a Furstenberg sign. These maneuvers increase intracranial pressure, which is transmitted through the encephalocele, causing a transient increase in size. A positive Furstenberg sign is consistent with encephalocele. PAGE 1363","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q14"},{"s":"What is the most common cause for the complication of an inverted V deformity?","o":["Failure to resuspend the upper lateral cartilages","Overgrafting the radix","Insufficient preservation of a septal L-strut","Spreader graft resorption"],"k":"A","x":"Failure to resuspend the upper lateral cartilages. PAGE","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q78"},{"s":"You suspect that a patient may have Laryngopharyngeal reflux (LPR) based on symptoms and findings on flexible laryngoscopy. Which initial testing modality provides the most data to help establish a diagnosis?","o":["Dual pH metry","Oropharyngeal pH monitoring","MII-pH monitoring","Bilitec monitoring","Esophagoscopy"],"k":"C","x":"MII-pH monitor provides the clinician and patient with the most detailed information about reflux activity or lack thereof. PAGES 1006-1007","d":"Laryngology","src":"Bailey · Laryngology · Q63"},{"s":"What is the main neurotransmitter involved with the synapse between hair cells and spiral ganglion neurons?","o":["Acetylcholine","Glutamate","Epinephrine","Gamma-aminobutyric acid"],"k":"B","x":"Glutamate is the main neurotransmitter involved with the synapse between hair cells and spiral ganglion neurons. PAGE","d":"Otology","src":"Bailey · Otology and Neurotology · Q10"},{"s":"A 30-year-old G2P1 female patient with no prior history of rhinitis or seasonal allergies presents with severe nasal congestion during her second trimester of pregnancy. What is the most appropriate initial treatment recommendation?","o":["Montelukast","Triamcinolone nasal spray","Oral decongestants","Nasal saline aerosol"],"k":"D","x":"Saline aerosol sprays and irrigations are effective for thinitis of pregnancy and should be the first-line agent before trying pharmaceuticals. Leukotriene inhibitors may be tolerated during pregnancy but are not thought to be efficacious for rhinitis of pregnancy and carry a general black box warning due to the possibility for potentiating suicidal ideation. Triamcinolone is the only topical nasal steroid that may be associated with congenital pulmonary defects according to a prospective Canadian study. Oral and topical decongestants should be avoided especially in the first trimester due to a risk of birth defects including gastroschisis. PAGE 429","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q40"},{"s":"All of the following are secreted by mast cells, except:","o":["RANTES","Histamine","IL-10","IL-3"],"k":"C","x":"Products of mast cells include histamine; lipid mediators, such as prostaglandins and leukotrienes; chemokines, such as eotaxin and RANTES; as well as cytokines IL-3, IL-4, TNF-a, granulocyte-macrophage colony-stimulating factor, IL-13, TSLP; and macrophage inflammatory protein-la. PAGE 344","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q15"},{"s":"An otherwise healthy patient presents with several days of severe otalgia and facial asymmetry. Examination reveals facial paresis, crusted lesions of the concha, and unremarkable otoscopy. What is the next best step in management?","o":["Antibiotic and steroid otic drops","Electroneuronography (ENoG)","Systemic antivirals and steroids","Systemic and topical antibiotics"],"k":"C","x":"This patient likely has Ramsey-Hunt syndrome (also known as herpes zoster oticus), which is caused by varicella-zoster virus. The proper treatment for this condition is systemic antivirals and steroids. PAGES 2736-2737","d":"Otology","src":"Bailey · Otology and Neurotology · Q33"},{"s":"A multidisciplinary team approach is useful in treating balance disorders for all of the following reasons except:","o":["Each type of specialist can make their own diagnosis","Each type of specialist can devise their own plan for treatment","Diagnosis and treatment need to be considered on a continuum","Progress in treatment can be more easily assessed indecently"],"k":"C","x":"Patient outcomes have shown to be improved when diagnosis and treatment are considered on a continuum, and this is fostered by a multidisciplinary team approach. PAGES 3259-3260","d":"Otology","src":"Bailey · Otology and Neurotology · Q161"},{"s":"The best method to identify latent safety threats is:","o":["In situ simulation","Task training","Participation in Resident boot camps","Simulations in ad hoc simulation centers"],"k":"A","x":"Jn situ simulations occur in actual patient care spaces and often incorporate actual patient care teams and equipment. In situ simulation allows testing of health care delivery systems and identification of latent safety threats such as lack of readily available equipment. PAGES 3986-3988","d":"General","src":"Bailey · Contemporary Issues in Medical Practice · Q50"},{"s":"What is the significance of identification (on CT imaging) of osteitis adjacent to a biopsy-proven inverted papilloma?","o":["Osteitis indicates a slow growing mass, less likely to harbor malignancy.","Osteitis indicates a slow growing mass, more likely to harbor malignancy.","The area of osteitis indicates possible bone invasion and should be further investigated with an MRI.","The area of osteitis could represent the attachment site of the inverted papilloma."],"k":"D","x":"Inverted papilloma attachment sites are often identifiable on CT scan due to osteoneogenesis at the attachment site. PAGE 384","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q25"},{"s":"A 20-year-old male with a strong family history of an autosomal dominant disorder is noted to have multiple osteomas in the mandible and maxilla. He is subsequently diagnosed with the same genetic syndrome. A referral should be made to which specialist?","o":["Endocrinologist","Gastroenterologist","Dermatologist","Neurologist"],"k":"B","x":"Gardner syndrome is an autosomal dominant disorder characterized by intestinal polyposis, epidermoid cysts, desmoid tumors, and multiple osteomas. The formation of osteomas usually precedes other manifestations of the syndromes. Intestinal lesions, especially polyps have a high rate of malignant transformation. PAGE","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q129"},{"s":"The purpose of the vestibulo-ocular reflex (VOR) is to:","o":["Relay changes in gravity and linear forces to the muscles of the neck, thorax, and lower limbs","Use rapid eye movements to redirect the fovea at an object of interest","Coordinate the interaction between the visual, vestibular, and somatosensory systems","Stabilize gaze during head movement or tilt"],"k":"D","x":"When the head moves, the VOR stabilizes the image of an object in space on the retina by producing an eye movement compensatory to the head movement. The reflex is mediated by stimulation of the semicircular canals or otolith organs, CN VIII, and the resulting compensatory eye movement via CN III, IV, and VI. PAGE 2679","d":"Otology","src":"Bailey · Otology and Neurotology · Q16"},{"s":"A 35-year-old male presents to the clinic with symptoms of autophony and sound-induced vertigo. Which of the following physical examination findings is not suggestive of superior canal dehiscence syndrome?","o":["Valsalva-induced vertigo","Positive malleolar sign","Positive test of skew","Positive Hennebert sign"],"k":"C","x":"Superior canal dehiscence is characterized by third window pathology with symptoms of autophony and hyperacusis. Physical examination findings can include a positive malleolar sign (hearing the 256 Hz tuning fork in the affected ear when placed on the ankle). Hennebert sign is nystagmus evoked by pressure-induced movement of the tympanic membrane while Valsalva-induced vertigo results in nystagmus induced by changes to intracranial or middle ear pressures; both findings can be seen in superior canal dehiscence. A positive test of skew is not consistent with superior canal dehiscence. PAGE 3189","d":"Otology","src":"Bailey · Otology and Neurotology · Q144"},{"s":"Which of the following is not an important clinical sign of an impending intratemporal or intracranial complication of otitis media?","o":["Persistent otalgia after 2 weeks of antibiotics","Opacification of the mastoid air cells","Foul-smelling discharge after a round of treatment","Peripheral vertigo"],"k":"B","x":"Opacification of the mastoid air cells is a nonspecific radiographic finding. In the absence of clinical findings, mastoid effusion does not suggest an impeding otitis media complication. PAGES 2772-2773","d":"Otology","src":"Bailey · Otology and Neurotology · Q44"},{"s":"Which of the following should be considered in an adult patient who presents with new-onset, persistent unilateral middle ear effusion?","o":["Nasopharyngeal carcinoma","Deviated nasal septum","Adenoid hypertrophy","Samter triad"],"k":"A","x":"An anatomical obstruction from a neoplasm is uncommon but needs to be taken into consideration as a potential cause for persistent unilateral obstruction of the eustachian tube resulting in middle ear effusion. Other more common causes would be more likely to cause bilateral obstruction. PAGES 2757-2758","d":"Otology","src":"Bailey · Otology and Neurotology · Q39"},{"s":"Which of the following is not considered a treatment for essential tremor of the vocal tract?","o":["Botulinum toxin","Primidone","Propranolol","Pilocarpine","Voice therapy"],"k":"D","x":"Pilocarpine has no role in treating essential tremor of the vocal tract. PAGE 1078","d":"Laryngology","src":"Bailey · Laryngology · Q85"},{"s":"Which of the following medications is commonly used for drug-induced sleep endoscopy?","o":["Zolpidem","Eszopiclone","Propofol","Zaleplon","Trazadone"],"k":"C","x":"All of the other choices are hypnotics, most often used for insomnia and experimentally used to treat certain types of sleep apnea. Propofol, midazolam, and dexmedetomidine are the most commonly used pharmacologic agents in drug-induced sleep endoscopy. PAGE 2528","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q13"},{"s":"A classic model for a QI initiative is called the PDSA. What does the “S” stands for?","o":["Survey","Study","Statistics","Simple"],"k":"B","x":"A basic and classic model for a QI initiative is the PDSA cycle. This involves the steps of (P)lanning an intervention, (D)oing the intervention, (S)tudying the impact of the intervention, and (A)cting to improve the outcomes further. This iterative cycle is one of the most basic QI tools and has been successfully applied in myriad ways in our specialty. PAGE 3950","d":"General","src":"Bailey · Contemporary Issues in Medical Practice · Q33"},{"s":"A 63-year-old man who is a current tobacco user presents with right-sided neck swelling for the last month. He first noticed the mass while shaving, and it has been enlarging. It is not causing him any pain, and he denies any constitutional symptoms. Apart from a 3-to 4-cm firm, nontender mass inferior to the right mandible, the rest of the head and neck examination is unrevealing. Cross-sectional imaging shows a 3.8-cm right level I lymph node with necrosis and ill-defined borders. There is no additional lymphadenopathy. What is the next best step in diagnosis?","o":["Open incisional biopsy","Open excisional biopsy","Fine needle aspiration (FNA)","Core needle biopsy"],"k":"C","x":"FNA with or without ultrasound guidance is often the initial procedure of choice for adult patients presenting with lymphadenopathy. In cases of nondiagnostic FNA or when additional sample is needed for immunohistochemical (IHC) analysis, a core needle biopsy can be considered. Lastly, open incisional and excisional biopsies can provide additional tissue for a definitive diagnosis and are the gold standard for lymphoproliferative disorders. This is because a diagnosis of lymphoma classically requires analysis by flow cytometry, which cannot be obtained from the cells provided by needle biopsy alone. However, in recent years, core needle biopsies have been shown by some to be sufficient in the diagnosis of many subtypes of lymphoma. PAGE 730","d":"General","src":"Bailey · Comprehensive Otolaryngology · Q30"},{"s":"Ina normally developing healthy preschooler presenting to you with drooling, constant mouth breathing, and snoring at night, the best initial management to help with the drooling is:","o":["Parental reassurance","Bilateral submandibular gland excision and parotid duct ligation","Pharmacotherapy to decrease the sialorrhea","Nasal fiberoptic endoscopy and treatment of the etiology of nasal obstruction"],"k":"D","x":"As mouth breathing can also be an important contributor, potential sites of nasal pathology should be addressed before intervening on salivary flow. These include adenoid hypertrophy, allergic rhinitis, turbinate hypertrophy, nasal blockage. PAGE 1653","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q117"},{"s":"Which condition and gene mutation are characterized by an elongated upper lip and philtrum, learning disability, and velopharyngeal dysfunction?","o":["DiGeorge syndrome, 22q11.2","Robin sequence, 21q13.3","Crouzon syndrome, 23q12.1","Down syndrome, 21q13.3"],"k":"A","x":"Velocardiofacial syndrome (aka DiGeorge syndrome, Shprintzen syndrome) is associated with hypoplastic nasal alae, elongated upper lip, adenoid hypoplasia, VPI, and hypernasal speech with 35% having cleft palate. The correct mutation is 22q11.2. PAGE","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q173"},{"s":"Which of the following patients is not a cochlear implant candidate?","o":["Adult patient with profound hearing loss, patent cochlea, and arecent history of meningitis","A 25-year-old male with congenital profound sensorineural hearing loss and lack of spoken language","A 1-year-old female with proven connexin 26 mutations and profound sensorineural hearing loss","An 80-year-old male with progressive, moderate sloping to profound sensorineural hearing loss and lack of benefit from conventional amplification via hearing aids"],"k":"B","x":"A 25-year-old patient born without hearing or spoken language likely lacks the necessary cortical pathways available for auditory stimulation and spoken language development. This patient would be well past the plasticity period for cortical auditory maturation. PAGES 3109-3111","d":"Otology","src":"Bailey · Otology and Neurotology · Q128"},{"s":"A 75-year-old female presents to your clinic with episodic vertigo. The patient reports symptoms with lying down in bed or rolling over in bed. You lay the patient down to perform the Dix-Hallpike maneuver. What characteristic eye movement should you see for posterior canal benign paroxysmal positional vertigo (BPPV) on the affected side?","o":["Downbeating, geotropic","Horizontal, geotropic","Horizontal, ageotropic","Upbeating, geotropic"],"k":"D","x":"The characteristic eye movement for BPPV is upbeating and geotropic nystagmus. PAGES 3201-3203","d":"Otology","src":"Bailey · Otology and Neurotology · Q143"},{"s":"A 35-year-old woman presents with a 3-month history of progressing double vision. On examination, you note normal acuity but a left cranial nerve 6 palsy. What is the next step?","o":["Obtain an MRI and CT","EMG of lateral rectus","Serial clinical examination in 2 weeks","Begin high-dose steroids"],"k":"A","x":"Double vision with normal acuity and cranial nerve deficit suggests a mass lesion within the orbit or skull base. CT and MR imaging frequently help confirm the presence of a mass and define its extent. (pages throughout chapter which describe the role of CT/MR depending on the etiology) PAGES 2342-2343","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q115"},{"s":"A patient suffers a temporal bone fracture from a high-speed motor vehicle accident. They are currently unresponsive and intubated in the intensive care unit. There is steady drainage from the ear on the injured side, which was initially bloodtinge but is now clearer. What is the most appropriate initial treatment for this patient’s condition?","o":["Surgery","Lumbar drain","High-dose steroid","Elevate head of bed 30°","Course of acetazolamide"],"k":"D","x":"This patient has a presumed traumatic CSF leak. This often resolves with conservative measures such as elevation of the head of bed. If this fails, acetazolamide or lumbar drain should be considered before surgical repair. PAGES 2953-2954","d":"Otology","src":"Bailey · Otology and Neurotology · Q92"},{"s":"All of the following are symptoms of pulmonary insufficiency except:","o":["Tachypnea","Tachycardia","Appropriate capillary refill","Dyspnea"],"k":"C","x":"Postoperative pulmonary insufficiency is characterized by dyspnea, tachypnea, tachycardia, and cyanosis. Common causes of pulmonary insufficiency include atelectasis, bronchospasm, pulmonary edema, exacerbation of preexisting pulmonary disease, pulmonary embolization, and aspiration. While delayed capillary refill is concerning for pulmonary insufficiency or reduced perfusion of a cardiovascular source, appropriate capillary refill is not. PAGE 31","d":"General","src":"Bailey · Basic Science/General Medicine · Q8"},{"s":"A patient underwent an endonasal reductive rhinoplasty years ago, which resulted in significant loss of their tip projection. The resulting deformity was treated with two additional resections of the caudal septum. What type of deformity is observed?","o":["Rocker","Inverted V","Pollybeak","Ski slope"],"k":"C","x":"Pollybeak. PAGE 3538","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q62"},{"s":"Which of the following findings most strongly suggests odontogenic sinusitis?","o":["Bilateral subtotal opacification of the maxillary sinuses alone","Numbness over a unilateral V2 distribution","Ipsilateral, small periapical abscess","Recent mandibular tooth extraction"],"k":"C","x":"Odontogenic sinusitis is most frequently unilateral, associated with periapical lucency on CT evaluation, and may be associated with maxillary (not mandibular) tooth extraction V2 numbness should raise concern for a neoplasm. PAGE 369; Figure 23.4, PAGE 370","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q23"},{"s":"A 68-year-old male complains of cough of 8-month duration, which is progressively worsening. He notes that the cough occurs with almost every meal, especially with liquid intake. He is a lifelong nonsmoker. His only medication is pantoprazole 40 mg daily, which adequately controls his heartburn symptom. He denies dyspnea, stridor, or voice change. He has no other throat-related symptoms besides choking on his saliva at night when lying down. Sinonasal history is noncontributory. Flexible nasal endoscopy demonstrates healthy nasal mucosa, no polyposis, or other significant findings. Laryngoscopy demonstrates normal vocal fold motion, pooling of secretions in the left pyriform sinus, and no other concerning findings. Recent chest x-ray was normal. What is the next best step in the management of this patient?","o":["Increase his pantoprazole to 40 mg twice daily for control of gastric reflux—related chronic cough","Computed tomography (CT) thorax","Behavioral cough management therapy under the supervision of a speech-language pathologist (SLP) with training in voice and upper airway disorders","Video-fluoroscopic swallow study","Physical therapy for neck range of motion optimization"],"k":"D","x":"This gentleman’s history is concerning for aspiration. His cough is associated with oral intake, especially liquids. Other findings concerning for aspiration/dysphagia include pooling of hypopharyngeal secretions and choking on saliva when supine. These symptoms warrant an objective swallowing evaluation, such as video-fluoroscopic swallow study or functional endoscopic evaluation of swallowing. If the cough was related to reflux-provoking foods, occurring after the meal, especially if lying supine, or the patient complained of other LPR-related symptoms (refer to Reflux Severity Index), then PPI intensification would be appropriate. This is a nonsmoker with a normal chest x-ray, and no dyspnea, therefore CT thorax is unlikely to be contributory. Behavioral cough management in the setting of suspected aspiration-related cough is not an appropriate next step in management. He may be a candidate for swallowing therapy depending on the video-fluoroscopic swallow study results. PAGE 874","d":"Laryngology","src":"Bailey · Laryngology · Q36"},{"s":"Apneic oxygenation (aka high-flow nasal oxygenation/ Transnasal Humidified Rapid-Insufflation Ventilatory Exchange):","o":["Shortens the safe apnea time","Effectively clears CO2","Does not require a patent upper airway","Occurs by bulk flow of oxygen down a pressure gradient into the alveoli","Prevents atelectasis"],"k":"D","x":"This airway technique benefits from a patent airway, has a risk of CO₂ build up, and is effective via the means listed in answer D. PAGES 914-915","d":"Laryngology","src":"Bailey · Laryngology · Q41"},{"s":"Which of the following is not a surgical technique proposed to improve VPI?","o":["Furlow palatoplasty","Double-opposing buccal flap","Lateral wall augmentation","Posterior wall augmentation","Sphincter pharyngoplasty"],"k":"C","x":"Lateral wall augmentation has not been proposed as a technique to improve VPI. PAGES 1602-1604","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q99"},{"s":"When compared to CRSwNP, CRS patients without polyps are more likely to demonstrate which inflammatory mediators and cytokines?","o":["IL-4","Tumor necrosis factor (TNF)-a","IL-5","IL-13"],"k":"B","x":"CRS with polyps is most frequently associated with type 2 inflammation with IL-4, IL-5, and IL-13 important components of this inflammatory pathway. Nonpolypoid CRS is more heterogeneous. While some CRSsNP patients show type 2 inflammation, relative to CRS with polyps, CRSsNP is more likely to be associated with type 1 inflammation and TNF-a. PAGE 494","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q61"},{"s":"An 8-month-old boy with a history of prolonged intubation develops stridor following extubation. The infant is taken to the operating room on the same day and endoscopy reveals localized proximal tracheal granulation tissue and narrowing. He is stable and is maintaining oxygen saturation on room air. Which of the following is the most appropriate next step?","o":["Emergency tracheostomy to secure the airway","Reintubate immediately","Endoscopic balloon dilation with granulation tissue intervention","Perform a slide tracheoplasty"],"k":"C","x":"Children with localized postintubation tracheal stenosis can benefit from endoscopic interventions to relieve the obstruction and possibility prevent progression of the pathology. In a stable airway, reintubation or tracheostomy are not indicated. A slide tracheoplasty can be considered if endoscopic treatment fails, or a mature stenotic segment develops later but not in the acute setting. PAGE 1378","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q20"},{"s":"What is the most common cause of a congenital neck mass?","o":["Thyroglossal duct cyst","Type 1 BCA","Type 2 BCA","Dermoid cyst"],"k":"A","x":"Thyroglossal duct cysts are the most common congenital malformation of the neck, accounting for approximately 70% of cases. PAGE 1835","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q168"},{"s":"A 49-year-old patient presents 2 years after endoscopic sinus surgery with new-onset facial pain and discolored nasal drainage. The patient has not been on any medical therapy. Nasal endoscopy reveals purulent secretions in the right maxillary sinus. Which of the following is the next best step in management?","o":["Prescribe a 3-week course of augmentin and restart nasal irrigations.","Obtain culture of maxillary sinus and restart nasal irrigations followed by appropriate antibiotics.","Order new CT scan.","Schedule patient for endoscopic mega-antrostomy."],"k":"B","x":"The patient’s symptoms are consistent with acute sinusitis or an acute exacerbation of chronic sinusitis. When possible, antibiotics for recalcitrant infections or acute exacerbations of CRS should be started after cultures have been obtained and be based on sensitivities. The results of antimicrobial susceptibilities and bacterial presence changed the therapy in 40% of patients in retrospective, consecutive series of patients with CRS or acute exacerbations of CRS. Treatment with culture-directed antibiotics is the best choice for management in this scenario. PAGE 553","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q84"},{"s":"How are the vestibular hair cells are activated?","o":["By movement of the hair bundle toward the kinocilium","By movement of the hair bundle away from the kinocilium","Changes in the pH surrounding the hair bundles leading to an acidic environment","Magic"],"k":"A","x":"By movement of the hair bundle toward the kinocilium, which increases the firing rate of the associated vestibular afferent neuron. PAGES 2674-2675","d":"Otology","src":"Bailey · Otology and Neurotology · Q17"},{"s":"A 62-year-old patient presents with a complaint of difficulty breathing with exercise. The patient is on Plavix for recently placed coronary artery stents. A CT scan of the neck and chest demonstrates a 1.5-cm mass in the upper thoracic trachea that avidly enhances with contrast and narrows the airway by around 50%. In preparation for biopsy of this lesion, what would be the most appropriate way to manage their airway?","o":["Awake tracheostomy in the upper cervical trachea.","Extracorporeal membrane oxygenation.","Transoral intubation with a 5.0 endotracheal tube.","Awake office bronchoscopy with topical anesthesia should be performed for the biopsy."],"k":"C","x":"In this patient, there is moderate airway compromise but still is an adequate lumen for direct intubation with a small endotracheal tube. Tracheostomy, while feasible, would be above the site of the tumor, not helping with airway control and also may impact future options for definitive resection. The use of ECMO would not be recommended here as there are much less invasive ways of securing an airway. While awake bronchoscopy is an excellent option for biopsy in some patients as they are able to maintain spontaneous ventilation, here, due to his anticoagulation, the risk of airway bleeding in an uncontrolled office setting makes it not advisable. PAGE 2301","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q98"},{"s":"Which test is required to be used in a hearing conservation program?","o":["Pure tone audiometry","Distortion product OAE","Speech-in-noise","Auditory brainstem response"],"k":"A","x":"Hearing conservation programs required under 29 Code of Federal Regulations 1910.95 must include pure tone audiometric testing at 0.5, 1, 2, 3, 4, and 6 kHz. Testing at 8 kHz is recommended by National Institute for Occupational Health and Safety but is not required as part of Occupational Safety and Health Administration-mandated audiometric monitoring. PAGE 2922","d":"Otology","src":"Bailey · Otology and Neurotology · Q82"},{"s":"Reconstruction of which of the following defects would most likely require cartilage support of the nasal valve?","o":["| cm skin-only defect of the nasal tip","| cm skin-only defect of the alar groove","1 cm skin-only defect of the nasal dorsum","| cm skin and bony defect of the nasal sidewall"],"k":"B","x":"The alar groove represents a keystone area in nasal reconstruction that is critical for nasal valve function. Prophylactic cartilage grafts in this region are required even for skin-only defects to prevent nasal valve collapse following surgery. The remainder of the defects listed will heal well with cutaneous reconstruction without the need for structural grafting. PAGE 3395","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q22"},{"s":"For patients with posttraumatic delayed-onset, complete facial paralysis, what percentage of patients have a full recovery?","o":["Less than 50%","Less than 75%, greater than 50%","Greater than 75%, less than 90%","Greater than 90%"],"k":"D","x":"The prognosis for patients with delayed-onset, complete facial paralysis is excellent, with spontaneous full recovery rate of over 90%. PAGES 2787-2790","d":"Otology","src":"Bailey · Otology and Neurotology · Q50"},{"s":"The third molars are numbered as follows in the universal system:","o":["8, 9, 24, 25","18, 28, 38, 48","A,J,K,T","1, 16, 17, 32","5, 12, 22, 27"],"k":"D","x":"Using the universal system, D is the third molars. A is central incisors; B is the Federation Dentaire International system. C is deciduous teeth, and there are no third molars in the deciduous teeth. E is bicuspids. PAGE 1231","d":"H&N / Plastics / Trauma","src":"Bailey · Trauma · Q21"},{"s":"A 5-year-old male patient is referred for evaluation of left-sided hearing loss identified by a school screening examination. His parents deny a history of otalgia or otorrhea. On physical examination, a white mass is most likely to be seen in which area of the middle ear?","o":["Posterior-superior quadrant","Anterior-superior quadrant","Posterior-inferior quadrant","Anterior-inferior quadrant"],"k":"B","x":"Congenital cholesteatomas occur in the absence of a retraction pocket in patients without a history of otorrhea or prior otologic surgery. The average age at presentation is 4.5 years, and there is a male-to-female preponderance of 3:1. The most common location of congenital cholesteatoma is in the anterior-superior quadrant. PAGES 2801-2802","d":"Otology","src":"Bailey · Otology and Neurotology · Q52"},{"s":"Sequela of radiation to the larynx can include:","o":["Erythematous, edematous mucosa","Altered mucous gland secretion","Decreased mucosal clearance of secretions","Decreased vibration of phonatory mucosa","All of the above"],"k":"E","x":"These answers are the classic postradiation changes to the larynx. PAGES 1024-1025","d":"Laryngology","src":"Bailey · Laryngology · Q71"},{"s":"A 40-year-old man undergoes a biopsy of a mass in the left lingual tonsil, which confirms a diagnosis of DLBCL. Subsequently, he undergoes a PET-CT, which demonstrates a 2-cm mass of high FDG avidity in the left lingual tonsil as well as in two adjacent subcentimeter lymph nodes. What stage of lymphoma does this patient have?","o":["I","IE","II","IIE","III","IV"],"k":"A","x":"This patient has stage I diffuse large B-cell lymphoma (DLBCL) in Waldeyer ring. Waldeyer ring was reclassified as a nodal site in the Lugano classification staging system of 2014. Stage I lymphoma is defined as one node or a group of adjacent nodes, which describes the involvement pattern presented. PAGE 2331","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q108"},{"s":"What is a disadvantage to the middle fossa craniotomy approach for resection of vestibular schwannoma?","o":["Increased risk of CSF leak","Increased risk of postoperative headaches","Increased risk of injury to temporal lobe","Access to tumors extending into the cerebellopontine angle (CPA)","Both C and D"],"k":"E","x":"Because the overlying temporal lobe is elevated, it is theoretically at increased risk of injury from a middle fossa craniotomy approach, compared to the translabyrinthine and retrosigmoid approaches. Tumor access beyond the IAC is poorer with the MCF approach unless the tentorium is divided. PAGES 2968-2970","d":"Otology","src":"Bailey · Otology and Neurotology · Q98"},{"s":"Which of the following medications is the first-line treatment for nonallergic rhinitis?","o":["Intranasal corticosteroid","Intranasal anticholinergic","Intranasal antihistamine","Oral antileukotriene inhibitor"],"k":"C","x":"Azelastine is FDA approved for the treatment of nonallergic rhinitis, and intranasal antihistamines are considered first-line therapy as monotherapy for nonallergic rhinitis. PAGE 420","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q39"},{"s":"A 62-year-old male patient undergoes a resection of a 2-cm squamous cell carcinoma of the lower cervical trachea. Resection of approximately 4 cm of trachea is required to achieve negative margins. Which of the following approaches would reduce the likelihood of postoperative dehiscence?","o":["Lateral mobilization of the trachea for 4 cm proximal and distal to the area of resection","Place the patient in a cervical collar in order to reduce neck flexion","Suprahyoid muscle release","Postoperative swallowing therapy"],"k":"C","x":"In patients with a segmental tracheal resection and reanastomosis, it is critical to minimize tension across the repair. This is best accomplished through anterior and posterior mobilization through blunt dissection, trying to avoid injury to the tracheal blood supply that comes in laterally. In instances where tension is still present, additional release maneuvers such as the suprahyoid muscle release can be helpful. In addition, keeping patients on postoperative voice rest and reducing the need for swallowing through the use of a nasogastric tube will further take the tension off of the repair. PAGE","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q96"},{"s":"A patient presents less than 2 hours after an alleged assault. The patient lost consciousness, but thinks they were punched several times in the face. The patient has a 1-cm open laceration on the bridge of the nose and a suspected nasal bone fracture but no other suspected injuries. How should the laceration be addressed to decrease the risk for wound infection?","o":["To the operating room for wash out and closure","Bedside wash out with normal saline and closure","Hydrogen peroxide rinses and leave open to healing by second intention","Betadine rinses and leave open to healing by second intention"],"k":"B","x":"Bedside wash out with normal saline and primary closure is appropriate in this setting to reduce risk of infection and promote wound healing. PAGE 1160","d":"Rhinology","src":"Bailey · Trauma · Q7"},{"s":"Which of the following medications have been reported to cause ototoxicity?","o":["Streptomycin","Cisplatin","Furosemide","All of the above"],"k":"D","x":"Aminoglycosides, platinum compounds, vinca alkaloids, loop diuretics, macrolides, and salicylates have been reported to cause ototoxicity. PAGES 2936-2938","d":"Otology","src":"Bailey · Otology and Neurotology · Q88"},{"s":"Which of the following is a mechanism by which tachyphylaxis is proposed to occur in rhinitis medicamentosa:","o":["Exhaustion of the postsynaptic supplies of norepinephrine from continued stimulation","Decease in sensitivity and number of the a receptors on the postsynaptic side due to the inhibitory effects of a2 receptor on the presynaptic neuron","Prolonged a-adrenergic vasodilation outlasting the B-adrenergic effects","Increased sympathetic tone leading to vascular permeability and increased edema"],"k":"B","x":"While there is no definitive explanation for the tachyphylaxis with rhinitis medicamentosa, increased inhibitory effects of a receptor resulting in decrease in sensitivity and number of postsynaptic a receptors. Other theories include exhaustion of the presynaptic supplies of norepinephrine from continued stimulation, prolonged f-adrenergic vasodilation outlasting the a-adrenergic effects, and increased parasympathetic tone leading to vascular permeability and increased edema. PAGE 428","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q38"},{"s":"A 45-year-old female presents to the clinic with episodic vertigo of varying duration and intensity and past history of motion intolerance and menstrual headache. She reports associated phonophobia and photophobia. Her physical examination is nonfocal. What is the most likely diagnosis?","o":["Vestibular migraine","Méniére disease","Vestibular neuritis","BPPV"],"k":"A","x":"Vestibular migraine is characterized by vertigo of varying duration that is exacerbated by exposure to visual motion, bright lights, loud sounds, or strong odors. Méniére disease is exacerbated by salt intake, while BPPV patients have vertigo that is positional in nature and lasts seconds to minutes. Finally, vestibular neuritis is characterized by intense vertigo, nausea, and vomiting lasting hours that gradually improves over days and weeks. PAGES 3188-3189","d":"Otology","src":"Bailey · Otology and Neurotology · Q146"},{"s":"Compared to the thyroid gland and adjacent tissues, which of the following best describes the typical appearance of a parathyroid adenoma on an ultrasound examination of the neck?","o":["Hypoechoic; nonvascular","Hyperechoic; increased vascularity","Isoechoic; nonvascular","Hypoechoic; increased vascularity"],"k":"D","x":"With rare exceptions, parathyroid adenomas characteristically appear hypoechoic and hypervascular when compared to other central neck structures. It is important to note that normal parathyroid glands are not typically visible. Ultrasound has an overall high sensitivity in detecting parathyroid adenomas; however, its accuracy and efficacy are highly dependent on the skill and experience of the operator. The primary limitation of ultrasound is detecting ectopic adenomas located retroesophageally or deep in the mediastinum. PAGE 2426","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q137"},{"s":"Regarding the specific complaint of difficulty swallowing medications, which of the following is true?","o":["Pill dysphagia cannot be evaluated by videofluoroscopy.","Dysphagia to pills predicts dysphagia to solid food.","The PILL-5 was validated to screen for pill dysphagia by pharmacists.","Dysphagia to pills is common among otherwise healthy patients.","“Bedside” swallow evaluation is usually adequate for pill dysphagia evaluation."],"k":"D","x":"Videofluoroscopy and/or transnasal esophagoscopy are important tools to evaluate pill dysphagia. (Nativ-Zeltzer N, Bayoumi A, Mandin VP, et al. Validation of the PILL-5: a 5-Item Patient Reported Outcome Measure for Pill Dysphagia. Front Surg. 2019;6:43.) PAGE 809","d":"Laryngology","src":"Bailey · Laryngology · Q7"},{"s":"The American Society of Anesthesiologists Task Force defined the difficult airway as all of the following except:","o":["Difficult oral airway placement","Difficult face mask ventilation","Difficult laryngoscopy","Difficult intubation","More than three attempts at securing the airway"],"k":"A","x":"All other options are key aspects of a difficult airway patient. PAGE 906","d":"Laryngology","src":"Bailey · Laryngology · Q39"},{"s":"A 57-year-old male presents for evaluation of allergic rhinitis. He has been using fluticasone and azelastine nasal spray daily along with daily cetirizine for several years with moderate benefit. He is interested in exploring other treatment options. He also takes metoprolol for atrial fibrillation and daily prednisone for rheumatoid arthritis. You discuss allergy skin testing with him. Which of the medications does he have to stop taking prior to skin testing?","o":["Fluticasone, azelastine, cetirizine, and metoprolol after discussion with his cardiologist","Azelastine, cetirizine, and metoprolol after discussion with his cardiologist","Prednisone and fluticasone","Prednisone only"],"k":"B","x":"Patients must stop oral antihistamines (cetirizine), antihistamine nasal spray (azelastine), and B-adrenergic blocker (metoprolol) prior to allergy skin testing. PAGE 408, Table 25.4","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q33"},{"s":"A 4-year-old Caucasian male presents for evaluation of right-sided grade III microtia and aural atresia. Following CT imaging, he is determined to be a good candidate for atresia repair. After discussion of reconstructive options, his family opts for autologous rib cartilage reconstruction for the microtia. When should he be planned for atresiaplasty?","o":["1 year prior to planned microtia reconstruction","Concurrently with first stage microtia reconstruction","Following rib cartilage auricular framework implantation and lobule transposition","Following framework elevation and skin graft placement along posterior auricular sulcus"],"k":"C","x":"Following rib cartilage auricular framework implantation and lobule transposition. PAGE 3765","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q110"},{"s":"What is a primary side effect of concern during antiviral treatment of congenital CMV?","o":["Ototoxicity","Leukemia","Neutropenia","Nephrotoxicity"],"k":"C","x":"Congenital CMV can be treated with the antiviral drugs ganciclovir and valganciclovir. This treatment has been shown to halt or reverse congenital CMV hearing loss in children with other symptoms of congenital CMV infection. This treatment is not currently FDA approved for congenital CMV that only causes hearing loss. The most concerning side effect of ganciclovir and valganciclovir is neutropenia, which may require frequent monitoring during treatment. PAGE 1731","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q139"},{"s":"Which option shows the appropriate margins for a melanoma 1.0 mm in depth on the cheek?","o":["0.5 cm","0.5 to 0.9 cm","1to2cm","2 to3cm","2to4cm"],"k":"C","x":"| to 2 cm is correct. Options A and B are incorrect as the margins are too small. Options D and E are incorrect as the margins are too wide. PAGE 1810","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q157"},{"s":"A 12-year-old boy is brought into the clinic by his mother and father for concerns for ear fullness and difficulty hearing on both sides. He is otherwise healthy, and denies fevers, pain, or vertigo. He describes ear fullness, like he is “hearing underwater.” On 512-Hz tuning fork examination, Weber is midline, and bone conduction is greater than air conduction bilaterally. Otoscopy shows patent external auditory canals (EACs), intact tympanic membrane, and bilateral yellowish clear middle ear effusions. Which of the following is true regarding this condition?","o":["Bacterial biofilms have a major role in pathogenesis.","A bacterial pathogen is identified in most middle ear effusions in those with otitis media with effusion (OME).","When patients are symptomatic, they typically complain of vertigo.","Tympanometry is helpful in differentiating an infectious from noninfectious cause."],"k":"A","x":"The patient’s presentation is most consistent with OME. The pathogenesis of OME appears to be the result of a variety of inciting events involving inflammation and tissue hyperplasia, with bacterial biofilms playing a major role. Biofilms consist of bacterial cells within a biopolymer matrix, which provides a potential means of antimicrobial resistance and can create a communicating system in which nutrients and other biological materials can be shared. Biofilms of H. influenzae, S. pneumoniae, M. catarrhalis, and S. aureus have been identified in the nasopharynx of children with “chronic otitis media” (recurrent AOM and/or OME), and it has been suggested that the biofilm may act as a reservoir for bacterial pathogens resistant to antibiotics. It is this suspected association for which the mechanical debridement of nasopharyngeal biofilms may explain the observed clinical benefit associated with adenoidectomy in subsets of pediatric patients. PAGE 1663","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q124"},{"s":"Major nasal tip support mechanisms include:","o":["The interdomal ligament between the lower lateral cartilages, the skin/soft tissue envelope, the septum, the nasal spine, and sesamoid complexes","The resiliency of the lower lateral cartilages, the skin/soft tissue envelope, the attachment of the medial crura to the caudal septum","The resiliency of the lower lateral cartilages, the attachment of the medial crura to the caudal septum, the attachment of the lower lateral cartilages, and the upper lateral cartilages at the scroll region","The sesamoid complexes, the septum, the attachment of the lower lateral cartilages, and the upper lateral cartilages at the scroll region"],"k":"C","x":"Major tip support mechanisms include the resiliency of the lower lateral cartilages, the attachment of the medial crura to the caudal septum, the attachment of the lower lateral cartilages, and the upper lateral cartilages at the scroll region. Minor tip support mechanisms include the interdomal ligament between the lower lateral cartilages, the skin/soft tissue envelope, the septum, the nasal spine, and sesamoid complexes. PAGE 3565","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q73"},{"s":"A preauricular sinus is most commonly located:","o":["Lateral, superior, and posterior to the parotid gland","Parallel to the external auditory canal (EAC) as a “duplication”","At the mandibular angle","Tracking deep to the facial nerve"],"k":"A","x":"The preauricular sinus is typically found lateral, superior, and posterior to the parotid gland and the facial nerve, into which they can rarely extend. PAGES 2745-2746","d":"Otology","src":"Bailey · Otology and Neurotology · Q34"},{"s":"A treatment seeking 34-year-old woman presents with a diagnosis of vocal nodules. What should a voice specialized SLP do first?","o":["Start patient on Resonant Voice Therapy","Assess patient’s candidacy for voice therapy","Start patient on Phonation Resistant Training Exercises (PhoRTE)","Recommend patients to steam","Provide instruction about voice rest"],"k":"B","x":"Prior to suggesting voice therapy for a patient, an assessment of the likelihood of success with voice therapy should be performed. This involves a variety of “voice stimulability probes” that often simulates what is done in voice therapy. PAGES 1089-1090","d":"Laryngology","src":"Bailey · Laryngology · Q87"},{"s":"The following structure is located in the posterior lamella and full-thickness defects requires a dedicated reconstruction to ensure apposition of the eyelid to the globe:","o":["Tarsal plate","Skin","Orbital septum","Orbicularis oculi"],"k":"A","x":"Tarsal plate. PAGE 3447","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q37"},{"s":"Which of the following is a characteristic of bilateral cleft nasal deformity?","o":["Shortened columella from short medial crura","Overprojected nasal tip","Anteromedially displaced nasal tip domes","Shorter lateral crura"],"k":"A","x":"Several nasal characteristics are associated with patients with bilateral cleft lip. Some of the characteristics of bilateral cleft nasal deformity include shortened columella from short medial crura; underprojected nasal tip; posterolaterally displaced nasal tip domes; and longer lateral crura. (Hsieh TY, Dedhia R, Tollefson TT. Cleft rhinoplasty: strategies for the multiply operated nose. Facial Plastic Surgery. 2018;34(3):290-297.) PAGES 3640-2641","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q82"},{"s":"A 2-month-old term infant with no significant medical history presents with inspiratory stridor since birth that is present at rest but worsens during feeds and with agitation. What is the most likely diagnosis?","o":["TEF","Laryngomalacia","Choanal atresia","Unilateral vocal fold immobility"],"k":"B","x":"Laryngomalacia is the most common cause of inspiratory stridor in infants. It is characterized by inspiratory stridor that worsens during feeding and/or with agitation due to prolapse of supraglottic structures into the glottis upon inspiration. PAGE 1444","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q52"},{"s":"A 76-year-old male presents with bilateral subjective nonpulsatile tinnitus. What is the most appropriate first step in management?","o":["ABR testing","Comprehensive behavioral audiometry","MRI of the IAC","Tinnitus pitch matching test"],"k":"B","x":"The initial evaluation of a patient presenting with tinnitus should include a complete or comprehensive behavioral audiogram, including pure-tone and spondee thresholds, word recognition scores, and tympanometry. Other audiologic tests, including auditory brainstem responses or tinnitus pitch matching, may be employed in rare cases but should not precede behavioral audiometry. MRI may be indicated for certain patients who present with tinnitus but are not required for all and should not precede an audiogram. PAGES 3072-3073","d":"Otology","src":"Bailey · Otology and Neurotology · Q118"},{"s":"Cricotracheal resection differs from tracheal resection in regard to morbidity in that:","o":["There is a difference in
