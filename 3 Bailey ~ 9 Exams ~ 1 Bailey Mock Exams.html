<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bailey Mock Exams</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--amber:#B06A00;--amber-soft:#FBEFD9;--box:#0B1418;--on-teal:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--amber:#E8A94A;--amber-soft:#3A2C14;--box:#000;--on-teal:#06201F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td:last-child{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px 8px;text-align:center}
.seg button.on{background:var(--teal);color:var(--on-teal);font-weight:600}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note{font-size:.9rem;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.timer{font:700 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.topi .t{flex:1;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.flagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
.flagbtn.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.qn{font-weight:600;font-size:.9rem;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{opacity:1}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}.exp h3.na{color:var(--amber)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;position:relative}
.grid .ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.grid .flg{box-shadow:inset 0 0 0 2px var(--amber)}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-na{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid .cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.legend .a::before{background:var(--teal-soft);border-color:var(--teal)}.legend .f::before{box-shadow:inset 0 0 0 2px var(--amber)}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3.2rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>button{flex:1}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--teal)}
</style></head><body>
<div class="wrap" id="app"></div>
<div class="zoom" id="zoom" onclick="this.style.display='none'"><img alt="Enlarged figure"></div>
<dialog id="dlg"></dialog>
<script>
const PAPERS=[{"title":"Paper 1","q":[{"s":"A 21-year-old Olympic swimmer presents with progressive right-sided hearing loss and persistent otorrhea despite one previous tympanoplasty and a revision tympanoplasty and mastoidectomy 2 years prior. He is found by audiogram to have a severe to profound sensorineural hearing loss and by CT to have extensive bony erosion of his posterior EAC. Which of the following would be the most appropriate surgical management?","o":["Revision tympanoplasty","Revision CWU mastoidectomy and tympanoplasty","CWD mastoidectomy","Subtotal petrosectomy"],"k":"D","x":"Subtotal petrosectomy allows for effective removal of cholesteatoma, diseased temporal bone air cells, and separation of the middle ear from the external environment by an EAC blind sac closure and plugging of the eustachian tube. It avoids the cavity cleanings that a CWD would require and allows patients to participate in water activities. A CWU procedure would not be appropriate in a patient with extensive posterior bony EAC erosion. PAGES 2809-2811","d":"Otology","src":"Bailey · Otology and Neurotology · Q55"},{"s":"Which of the following is not considered a pathophysiologic mechanism contributing to OSA?","o":["Upper airway anatomic collapse","Ventilatory instability","Low arousal threshold","Hypocretin deficiency","Inadequate pharyngeal dilator muscle response"],"k":"D","x":"Hypocretin deficiency is one of the cerebrospinal fluid findings in type | narcolepsy, which is a sleep disorder of excessive sleepiness. One of the most popular models for OSA outlines four major pathophysiologic contributions to OSA: low arousal threshold, ventilatory instability (high loop gain), inadequate pharyngeal dilator muscle response, and anatomy. PAGES 2530-2532","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q11"},{"s":"A 43-year-old overweight female presents with bilateral pulsatile tinnitus. She is found to have idiopathic intracranial hypertension (ITH). What is the most appropriate initial step in the treatment?","o":["Oral diuretic","CSF diversionary procedures","High-fat diet","Bariatric surgery"],"k":"A","x":"Most common in young, obese women, symptoms of IIH include headache, papilledema and visual disturbances, pulsatile tinnitus, hearing loss, and vestibular abnormalities. These symptoms may present individually or in combination. Acetazolamide, corticosteroids, and diuretics have been shown to improve tinnitus resulting from ITH. Additional treatment options include CSF diversion procedures or bariatric surgery for weight loss. Both may result in reduction of tinnitus, however are not typically considered until after failure of oral therapy. PAGE 3086","d":"Otology","src":"Bailey · Otology and Neurotology · Q121"},{"s":"Which nasal sinus means “form of a sieve”?","o":["Ethmoid","Maxillary","Frontal","Sphenoid"],"k":"A","x":"Ethmoid comes from the Greek word ethmos meaning sieve. Sphenoid also is of Greek origin meaning “form of a wedge.” PAGE 3963","d":"Rhinology","src":"Bailey · Contemporary Issues in Medical Practice · Q39"},{"s":"A patient presents with intermittent severe right-sided temporal and orbital pain and headaches that last on average 1 to 2 hours and often will wake them up from sleep. There is associated right eye tearing and rhinorrhea with the headaches. Which of the following would most likely be the best acute treatment to resolve the patient’s symptoms?","o":["Indomethacin","100% oxygen via nonrebreather mask","Oxycodone","Pseudoephedrine"],"k":"B","x":"A cluster headache is a form of trigeminal autonomic cephalgia that is rare and mostly affects men with age of onset typically between 20 and 40 years of age. It is characterized by attacks of severe unilateral orbital, supraorbital, or temporal pain that last 15 to 180 minutes. The pain can be associated with autonomic symptoms of ipsilateral conjunctival injection, lacrimation, nasal congestion, rhinorrhea, forehead and facial sweating, miosis, ptosis, or eyelid edema. Some patients also may experience restlessness or agitation, which is different from migraine where patients prefer minimal movement and lack of stimuli from light and sound. Treatment with 100% oxygen for a period of 15 minutes via a tightly fitting nonrebreather mask usually allows for resolution of the attack. Triptans and other vasoconstrictive medications, such as ergotamine, have also been described for abortive treatments, while steroid taper at the onset of symptoms has been shown to shorten the attack. PAGE 744","d":"Rhinology","src":"Bailey · Comprehensive Otolaryngology · Q38"},{"s":"Which hyaluronic acid filler is best suited for treatment of tear trough deformity and in which plane should it be injected?","o":["Restylane (hyaluronic acid gel); suborbicularis","Restylane (hyaluronic acid gel); supraorbicularis","Juvederm (hydrophilic hyaluronic acid gel); suborbicularis","Sculptra (poly-I-lactic acid); supraorbicularis"],"k":"A","x":"Restylane (hyaluronic acid gel); suborbicularis. PAGE","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q94"},{"s":"What is the region of the nose with the thinnest skin?","o":["Rhinion","Nasion","Tip","Supratip"],"k":"A","x":"Rhinion. PAGE 3488","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q47"},{"s":"What is the typical nasolabial angle in men?","o":["85 to 90°","90 to 95°","95 to 100°","100 to 105°"],"k":"B","x":"90 to 95°. PAGE 3486","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q48"},{"s":"Which of the following best characterizes iatrogenic CSF leaks after endoscopic sinus surgery?","o":["Incidence ranges between 2% and 3%.","Sphenoid roof is the most common site of injury.","Most commonly occur on the left side.","Low-lying skull base is a potential risk factor."],"k":"D","x":"Risk of iatrogenic CSF leak has decreased significantly and is below 1% in larger series. Lateral lamella of the cribriform plate and posterior ethmoid roof are the most common sites of injury, and more leaks occur on the right side. Asymmetric and low-lying skull base have been recognized as potential risk factors for iatrogenic leaks. Leaks also more commonly result in hands of residents and novice attending surgeons. PAGE 621","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q113"},{"s":"A 65-year-old male presents to the ER with intense vertigo, nausea, and vomiting for the past 3 hours. Physical examination is consistent with a positive head impulse test to the right, negative test of skew, left beating direction fixed nystagmus, and no hearing loss. Which of the following is the most likely diagnosis?","o":["Vestibular neuritis","Anterior inferior cerebellar artery (AICA) stroke","Labyrinthitis","Méniére disease"],"k":"A","x":"Head impulse, nystagmus, test of skew testing includes evaluation of head impulse, nystagmus, and test of skew. This test helps differentiate peripheral from central pathology in patients with acute vestibular syndrome. In this case, the findings of a positive head impulse to the right, negative test of skew, left beating direction-fixed nystagmus, and no hearing loss are most consistent with vestibular neuritis. AICA stroke is a central pathology. Labyrinthitis is associated with hearing loss, and Méniére disease is characterized by a history of fluctuating hearing loss, ear fullness, and vertigo. PAGE","d":"Otology","src":"Bailey · Otology and Neurotology · Q142"},{"s":"Allergy immunotherapy typically results in:","o":["Complete elimination of allergic symptoms","Immunologic shift from Th1 to Th2 predominance","No effect on incidence of additional sensitization","Reduction in development of associated comorbid conditions"],"k":"D","x":"While immunotherapy is the only treatment modality with the potential to cure allergic rhinitis, patients report 30% to 61% decrease in symptoms. Immunotherapy results in a shift from Th2 to Th1 predominance. Immunotherapy can decrease the development of new inhalant allergen sensitivities and decrease the incidence of developing allergic asthma in patients with allergic rhinitis. PAGE 411","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q35"},{"s":"Which of the following normally releases pollen in the Fall season?","o":["Trees","Grasses","Weeds","Flowers"],"k":"C","x":"Weeds typically produce pollen in the fall, trees produce pollen in the spring, and grasses produce pollen in the summer. PAGE 356","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q18"},{"s":"How are vestibular schwannomas described on histology?","o":["Presence of Verocay bodies","Presence of zellballen cells","Positive stain for S100","Presence of calcified psammoma bodies","Positive stain for succinyl dehydrogenase","Both A and C"],"k":"F","x":"Options A and C refer to vestibular schwannoma pathology. Options B and E refer to paragangliomas; option D can be seen in meningiomas. PAGE 2961","d":"Otology","src":"Bailey · Otology and Neurotology · Q100"},{"s":"Which of the following is the most common comorbidity in infants with laryngomalacia?","o":["Prematurity","Congenital heart disease","Neurologic disease","Gastroesophageal reflux disease (GERD)"],"k":"D","x":"GERD is extremely common in this population with studies quoting anywhere between 65% and 100%. Treatment of GERD is an important component of treating these children. Congenital heart disease and neurologic disease are risk factors for poor outcomes following supraglottoplasty. PAGE 1347","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q6"},{"s":"A 2-week-old child with a history of having TEF repair at day 2 of life develops post extubation stridor. What could be the etiology if vocal cord immobility was found in this child?","o":["Iatrogenic","Neurogenic (Arnold-Chiari malformation)","Cricoarytenoid fixation","All of the above"],"k":"D","x":"Postsurgical trauma to the nerve with neck or thoracic procedures is a common cause. In cases where there is a history of intubation, cricoarytenoid fixation/posterior glottis stenosis should be ruled out. An MRI is indicated to look for neurological causes (Arnold- Chiari malformation). PAGE 1424","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q44"},{"s":"What are some mitigation strategies for implicit bias?","o":["Emphasis on shared decision-making","Intentional perspective-taking","Counterstereotypic training","Taking responsibility for each patient as an individual","All of the above","None of the above"],"k":"E","x":"As with cognitive biases, increased awareness and “debiasing” are important steps in mitigating the effects of implicit bias on clinical care. These efforts may include greater emphasis on shared decision-making, intentional perspective-taking to avoid actor-observer bias effects related to implicit bias and to increase empathy, deliberate counterstereotypic training through study of positive examples drawn from a given identity group, and taking responsibility for each patient as an individual. Most likely a combined approach is necessary, but individual providers cannot easily make the structural and social changes necessary to reduce implicit bias across the health care system. Medical education must certainly be involved, and hospital and university leaders must actively demonstrate investment. PAGE 3998","d":"General","src":"Bailey · Contemporary Issues in Medical Practice · Q57"},{"s":"A 5-year-old child presents with a sellar and suprasellar mass extending lateral to the carotid and optic nerves on the right with extension into the partially pneumatized (presellar pneumatization pattern) sphenoid sinus. Imaging findings are consistent with craniopharyngioma. What would be the best approach(es) to achieve gross total resection or near total resection of this tumor?","o":["Open cranio-orbito-zygomatic approach on the left","Endonasal trans-sellar and transplanum approach","Combined open cranio-orbito-zygomatic and endonasal trans-sellar and transplanum approach","Frontal craniotomy"],"k":"C","x":"Given the extension of this tumor lateral to the carotid and optic nerves, EEA is unlikely to be able to achieve gross total resection and an open approach (such as cranio-orbitozygomatic) is needed. The sellar and suprasellar midline portions of the tumor are still best approached endonasally, thus the need for combined approach. PAGE 1640","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q112"},{"s":"Unilateral SLN injury (paralysis or paresis) may result in all of the following, except:","o":["Inability to reach highest vocal register","Loss of laryngeal sensation","Loss of pharyngeal contraction","Pooling of secretions on the affected side"],"k":"C","x":"Options A, B, and D are classic findings associated with an SNL palsy. PAGES 1083-1084","d":"Laryngology","src":"Bailey · Laryngology · Q86"},{"s":"A midline neck mass is surgically excised, and final pathology shows epidermal tissue, hair follicles, and sebaceous glands. What is the likely diagnosis?","o":["Branchial cleft cyst","Thyroglossal duct cyst","Epidermoid cyst","Dermoid cyst"],"k":"D","x":"Epidermoid cysts contain only epidermal tissue, while dermoid cysts may also contain hair follicles and sebaceous glands. In the head and neck, these cysts usually occur in the so-called T distribution involving the midline of the face, anterior neck, orbits, and periauricular area. PAGE 1837","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q169"},{"s":"In cases on immunocompromise, these infections can result in dysphagia.","o":["Cytomegalovirus","Candida","Smallpox","Herpes simplex","A, B, D"],"k":"E","x":"Options A, B, and D are three infections commonly seen in the individual who is immunocompromised and can lead to dysphagia. PAGE 830","d":"Laryngology","src":"Bailey · Laryngology · Q16"},{"s":"All of the following are signs of cerebellar dysfunction except:","o":["Hypometric saccades","Dysmetria of finger to nose testing","Right beating nystagmus after head shaking","Impaired VOR suppression"],"k":"C","x":"Nystagmus after head shaking is usually a sign of peripheral vestibulopathy and not cerebellar dysfunction. PAGES 3234-3237","d":"Otology","src":"Bailey · Otology and Neurotology · Q153"},{"s":"In the field of audiology, telemedicine","o":["Has no role in hearing aid fittings and follow-up","Offers options for vestibular assessment, rehabilitation, and balance training","Is limited due to the fact that automated pure tone air and bone testing correlated poorly with that obtained manually","Provided through smart phone applications shows little promise for hearing screening and diagnostic testing"],"k":"B","x":"Telemedicine offers exciting promise in audiology. Hearing and vestibular assessment and rehabilitation, cochlear implantation, and remote hearing aid programing are all active areas of investigation and use. PAGES 3938-3939","d":"General","src":"Bailey · Contemporary Issues in Medical Practice · Q30"},{"s":"An 82-year-old female with a past medical history of diabetes, hypertension, and depression is seen in consultation for recurrent falls and chronic dizziness for the past year. She was seen by an outside otolaryngologist who noted a gain of 0.7 bilaterally on video head-impulse testing. Other than this, her workup has remained unremarkable. Which of the following is the most appropriate next step in the care of this patient?","o":["Provide Dizziness Handicap Inventory questionnaire to identify any underlying balance disorder.","Refer for vestibular physical therapy.","Referral to a multidisciplinary falls prevention clinic.","Prescribe meclizine as a “rescue” medication."],"k":"C","x":"This patient meets diagnostic criteria for presbyvestibulopathy. In this type of patient, if present at ones’ institution, referral to multidisciplinary falls prevention clinics should be integral part of treatment. Although it may be appropriate to provide a Dizziness Handicap Inventory questionnaire, this will not rule out all possible underlying disorders, so would not be the best answer here. In a patient with multiple comorbidities that place her at risk of peripheral neuropathy, retinopathy, and use of fall-risk increasing medications (antihypertensives and antidepressives), vestibular physical therapy alone will likely not be sufficient. Vestibular suppressants (eg, meclizine, scopolamine, lorazepam) are effective at reducing acute symptoms of vertigo and motion sickness but are not recommended in the geriatric population. PAGES 3099-3100","d":"Otology","src":"Bailey · Otology and Neurotology · Q126"},{"s":"Alar batten grafts are designed to treat nasal obstruction at what level?","o":["Internal nasal valve","External nasal valve","Inferior nasal airway","Choana"],"k":"B","x":"Alar batten grafts support a weakened or absent lateral crus of the lower lateral cartilage, strengthening the external nasal valve. PAGE 589","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q99"},{"s":"The primary goal of a hearing aid fitting is:","o":["Returning audibility across frequency and input levels","Returning normal perception","To provide a part-time solution","To promote premium technology"],"k":"A","x":"Although audibility may be achieved across the frequency spectrum and for differing input levels, hearing aids do not restore normal perception of hearing. Additionally, individuals are typically encouraged to wear their hearing aids consistently during all waking hours (and, in some specific cases, some individuals choose to wear them while sleeping). Consistent use facilitates the adaptation process. As such, part-time hearing aid users are not as successful as full-time users. As long as the fittings are verified according to best practices, evidence has indicated that the use of both premium and basic technology hearing aids leads to essentially equal outcomes in daily life (eg, patient preference, speech understanding, listening effort, localization). PAGE 3158","d":"Otology","src":"Bailey · Otology and Neurotology · Q138"},{"s":"Which of the following is the most fundamental neuroendocrine reaction to trauma?","o":["The release of catecholamines","Decreased heart rate","Inhibition of gluconeogenesis","Vasodilation"],"k":"A","x":"The most fundamental neuroendocrine reaction to trauma is the release of catecholamines, which causes vasoconstriction, increases cardiac rate, increases myocardial contractility and conductivity, and stimulates gluconeogenesis. PAGE 1144","d":"H&N / Plastics / Trauma","src":"Bailey · Trauma · Q1"},{"s":"The advantages of the endoscopic endonasal approach to the ventral skull base compared to the open transcranial or transfacial approach include which of the following?","o":["Improved visualization of key anatomic structures","Ability to perform en bloc tumor resection with oncologic margins","Lower risk of postoperative CSF leak","Ease of addressing tumors with significant intracranial extension"],"k":"A","x":"The endoscopic endonasal approach to the ventral skull base provides improved visualization of key anatomic structures during surgical resection. The ability to perform en bloc resection is not an advantage of the endoscopic endonasal approach to the ventral skull base since most tumor resections are typically performed in a piecemeal fashion. The risk of a postoperative CSF leak has been reported to be greater with the endoscopic endonasal approaches to the skull base. Nonetheless, with the advent of the posteriorly-based nasoseptal flap, the high risk of postoperative CSF leak after endoscopic skull base repair has improved significantly. The transcranial approach remains the preferred approach in cases with extensive intracranial tumor extension. PAGE 607","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q110"},{"s":"What is the treatment of choice for stage III primary nasopharyngeal carcinoma?","o":["Radiotherapy alone","Concurrent chemoradiotherapy","Induction chemotherapy then concurrent chemoradiotherapy","Surgery alone","Surgery with adjuvant radiotherapy"],"k":"C","x":"Most studies within the last decade have shown benefit to adding induction chemotherapy to chemoradiation therapy for advanced stage III-IVb nasopharyngeal carcinoma. PAGE 2143","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q57"},{"s":"For which of the following has age-related hearing loss (ARHL) been identified as the largest potentially modifiable risk factor?","o":["Social isolation","Depression","Physical disability","Dementia"],"k":"D","x":"Although ARHL is independently associated with greater odds of depression, social isolation, and mobility disability, ARHL has been identified as the largest potentially modifiable risk factor for dementia at a population level. PAGES 3094-3096","d":"Otology","src":"Bailey · Otology and Neurotology · Q124"},{"s":"All of the following are risk factors for postoperative pharyngocutaneous fistula except:","o":["Prior chemoradiation","Use of proton pump inhibitors (PPI)","Use of COX-2 selective nonsteroidal anti-inflammatory drugs","Concurrent neck dissection","Positive margin resection"],"k":"B","x":"Primary chemoradiation, concurrent neck dissection, positive margins, and the use of COX-2 selective inhibitors are associated with increased risk of pharyngocutaneous fistula. Retrospective data has demonstrated a lower rate of fistula in those taking PPI. PAGE 2290","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q90"},{"s":"What is the most appropriate concentration (mg/mL) for triamcinolone acetonide injection to prevent subcutaneous fibrosis and treat prolonged edema following rhinoplasty?","o":["l","7.5","20","40"],"k":"B","x":"7.5. PAGE 3614","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q75"},{"s":"Mutations in which of the following gene have been identified to be associated with Pendred syndrome?","o":["GJB2","COCH","SLC26A4","PAX3"],"k":"C","x":"Pendred syndrome is caused by mutations in the SLC26A4 gene, which encodes for an anion exchanger channel. Mutations in GJB2 cause DFNB1 and DFNA3. Mutations in COCH cause DFNA9. Mutations in PAX3 cause Waardenburg syndrome. PAGE 2611","d":"Otology","src":"Bailey · Otology and Neurotology · Q5"},{"s":"The voicing technique that involves keeping the vocal fold long and stiff with vibration occurring only at a thin medial edge is called:","o":["Falsetto register","Flageolet register","Head voice","Chest voice","Puberphonia"],"k":"A","x":"Male voices have an additional register on top of the head voice referred to the as the falsetto voice. It is often described as breathy and less brilliant or full in sound. The majority of the vocal fold remains long and stiff with vibration occurring only at a thin medial edge with less complete vocal fold approximation compared to head voice. It is frequently used to imitate the female voice. PAGE","d":"Laryngology","src":"Bailey · Laryngology · Q95"},{"s":"The osteotomies employed during genioglossus advancement surgery for OSA must ensure capture of which bony landmark?","o":["Pogonion","Gnathion","Menton","Genial tubercle"],"k":"D","x":"The goal of genioglossus advancement surgery is to capture and advance the genial tubercle in a forward position, thereby suspending the genioglossus muscle anteriorly and combating tongue base collapse during sleep. The other landmarks are commonly used in cephalometry. The pogonion is the most anterior point on the contour of the chin. The gnathion is the most outward/everted point on the profile of the symphysis of the mandible. The menton is the lowest point on the symphysis of the mandible. PAGE 2588","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q39"},{"s":"A 6-year-old boy diagnosed with ASD presents with an array of challenging behaviors, including severe tantrums, aggression, and feeding problems. What is the most likely feature of feeding problems in children with ASD?","o":["Oromotor skills for bolus manipulation","Severe food selectivity with negative responses to nonpreferred foods","Tendency to drink liquids and refuse solids","Intermittent gagging and vomiting, even with preferred foods"],"k":"B","x":"ASDs encompass a range of developmental disorders that include impairments of communication, social behavior, and often sensory processing. The sensory processing dysfunction may present as over-responsiveness to certain food smells, textures, or appearance. Selective or “picky” eating may result, characterized by selective intake of only certain foods and/or limited repertoires of food intake, which may ultimately contribute to nutritional inadequacy. The feeding problems are not related to range and strength of oral motor skills for bolus manipulation. Gagging or vomiting does not occur with preferred foods; in contrast, this may occur when nonpreferred foods (solids or liquids) are offered. PAGE 1419","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q40"},{"s":"Cell division can be induced by which of the following in the mammalian cochlea?","o":["Wnt signaling","Hippo signaling","Damage in the neonatal period","All of the above"],"k":"D","x":"The Wnt and Hippo/Yap signaling pathways have been shown to induce cell division in the mammalian cochlea. The neonatal cochlea has also been shown to have some regenerative capacity in response to damage. PAGES 3265-3268","d":"Otology","src":"Bailey · Otology and Neurotology · Q166"},{"s":"Vertigo is likely to occur as a result of ischemia in the distribution of all the following arteries except:","o":["Posterior inferior cerebellar artery","Labyrinthine artery","Anterior cerebral artery","AICA"],"k":"C","x":"The posterior inferior cerebellar artery, labyrinthine artery, and AICA supply different regions of the vestibular system, and ischemia in these blood vessels would cause vertigo. The anterior cerebral artery does not supply the vestibular system, and ischemia in this blood vessel is not expected to cause vertigo. PAGES 3240-3245","d":"Otology","src":"Bailey · Otology and Neurotology · Q152"},{"s":"Which of the following is not a known cause of velopharyngeal insufficiency (VPI)?","o":["Cleft palate","Cerebral palsy","Postadenoidectomy","Apraxia","Postseptoplasty"],"k":"E","x":"Septoplasty is not known to cause VPI. Although septal perforations may rarely occur, they do not cause VPI. Cerebral palsy is a neuromuscular source of VPI. Motor programming difficulties known as apraxia can affect time of closing the velopharyngeal port. Cleft palate by nature causes VPI. Rarely a postadenoidectomy can cause VPI especially in the setting of a submucous cleft. PAGE 1596, Table 103.1","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q95"},{"s":"In patients with a history of anaphylactic reaction to stinging insects:","o":["Injection immunotherapy should be avoided due to risk of precipitating anaphylaxis","Immunotherapy targeting dust mites can decrease anaphylaxis risk due to cross-reactivity with arthropods","A concomitant positive allergen test predicts a high risk of future anaphylaxis","Allergy testing for stinging insects should be reserved for patients without an anaphylaxis history as this history alone is sufficient for allergy diagnosis"],"k":"C","x":"Allergy testing for stinging insects is generally reserved for patients with a history of reaction to stings. Patients who have both a history of anaphylaxis and positive allergy testing have a very high likelihood of anaphylaxis with future stings. Injection immunotherapy can significantly decrease this risk. PAGE 357","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q20"},{"s":"For a very large defect of the helical rim, which is the best reconstructive option?","o":["Antia-Buch chondrocutaneous advancement flap","Wedge excision","Staged reconstruction utilizing a postauricular skin pocket","Star excision"],"k":"C","x":"A staged flap such as a peninsular conchal axial flap or the Dieffenbach flap is required for a good repair of a large helical rim defect. Antia-Buch advancement or Star/Wedge excision are used for smaller helical defects. PAGE 3425","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q34"},{"s":"What is the most common pathogen identified in chronic invasive fungal sinusitis?","o":["Candida spp","Aspergillus spp","Mucoraceae spp","Cryptococcus spp"],"k":"B","x":"Aspergillus is the most common pathogen identified with chronic invasive fungal sinusitis. Mucoraceae spp are also frequently associated with invasive fungal disease but typically noted with acute invasive fungal sinusitis.","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q73"},{"s":"Which of the following statements is correct regarding keratosis of the vocal folds?","o":["Change in size and nature of keratosis should prompt surgical excision.","Erythroplakia is a worse prognosis than leukoplakia.","Leukoplakia is a worse prognosis than erythroplakia.","All keratotic lesions must be completely surgically removed at all times.","Observation is appropriate because this is solely a benign process."],"k":"A","x":"Any epithelial lesion with demonstrating changes in growth or characteristic may represent transformation to more aggressive disease, including carcinoma, and requires surgical excision. Leukoplakia has not been proven to have a worse or better prognosis than erythroplakia and vice versa. Keratotic lesion can be benign and observed in some settings. PAGE 1034","d":"Laryngology","src":"Bailey · Laryngology · Q74"},{"s":"A healthy 18-month-old child with a history of cow’s milk protein allergy and eczema is referred for evaluation of pharyngeal dysphagia due to aspiration of all consistencies on video fluoroscopic swallow study. A biopsy of his esophagus from a recent esophagogastroduodenoscopy showed greater than 15 intraepithelial eosinophils per high-power field. What is the most likely etiology of this child’s dysphagia?","o":["Achalasia","Chiari malformation","Eosinophilic esophagitis (EOE)","Barrett esophagus"],"k":"C","x":"EOE is a T helper cell-2—mediated inflammatory immune response marked by the infiltration of eosinophils in esophageal mucosa that can be seen on microscopic biopsy (more than 15 intraepithelial eosinophils per high-power field). Chronic inflammation and remodeling of the esophagus and aerodigestive tract is thought to be the etiology of pharyngeal dysphagia in patients with EoE. PAGE 1447","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q53"},{"s":"Which muscle elevates the mandible?","o":["Posterior digastric muscle","Mylohyoid muscle","Masseter muscle","Lateral pterygoid muscle"],"k":"C","x":"Several muscles attach to the mandible, enabling it to serve its multiple functions. The temporalis, masseter, and medial pterygoid muscles all elevate the mandible. The lateral pterygoid, mylohyoid, digastric, and geniohyoid muscles all depress the mandible. And note, the lateral pterygoid also acts to protrude the mandible, while the mylohyoid also serves to retract the mandible. PAGE 14","d":"General","src":"Bailey · Basic Science/General Medicine · Q3"},{"s":"A 50-year-old woman undergoes parotidectomy for a Warthin tumor. Postoperatively she complains of numbness of the ear and cheek. Which nerve was likely transected as part of the procedure?","o":["The auriculotemporal nerve","The buccal branch of the facial nerve","The greater auricular nerve","The frontal branch of the facial nerve"],"k":"C","x":"The great auricular nerve (C2, C3), a branch of the cervical plexus that passes around the posterior border of the sternocleidomastoid muscle, ascends diagonally across the sternocleidomastoid muscle toward the parotid gland. It supplies sensation to the skin over the parotid gland, the posterior aspect of the auricle, and an area of skin from the angle of the mandible to the mastoid process. This nerve is often damaged or intentionally sacrificed during parotidectomy causing numbness over the earlobe and skin over the parotid gland. Meticulous intraglandular dissection of the nerve can allow the nerve to be preserved if the location of the tumor permits such a dissection. PAGES 650-651","d":"H&N / Plastics / Trauma","src":"Bailey · Comprehensive Otolaryngology · Q5"},{"s":"A 45-year-old female noted a weak, breathy sounding voice after she underwent total thyroidectomy for multinodular goiter. The case proceeded uneventfully without apparent nerve injury. At her 1-week postoperative visit, her incision is healing well without infectious concerns. Her flexible laryngoscopy demonstrates right vocal fold immobility, in the paramedian position, with supraglottic hyperfunction with phonation. She is concerned about her ability to go back to work as a high school teacher. What is the next best step in management?","o":["Laryngeal EMG","Observation","Right vocal fold injection augmentation with calcium hydroxyapatite","Right vocal fold injection augmentation with temporary injectable","Medialization Laryngoplasty with Silastic or Gore-Tex™"],"k":"D","x":"Vocal fold injection augmentation can be performed awake or under general anesthetic and improves voice and swallowing outcomes among patients with acute UVFP. While observation may be reasonable for certain patients, this patient’s ability to work may be significantly affected by her dysphonia. Therefore, the next best step in management is vocal fold injection augmentation. Injection augmentation with calcium hydroxyapatite is not indicated, given its long duration as this patient may have a high chance of vocal recovery. (Young VN, Smith LJ, Rosen C. Voice outcome following acute unilateral vocal fold paralysis. Ann Otol Rhinol Laryngol. 2013;122:197-204; Wang CC, Wu SH, Tu YK, et al. Hyaluronic acid injection laryngoplasty for unilateral vocal fold paralysis—a systematic review and meta-analysis. Cells. 2020;9.) PAGES 1058-1059","d":"Laryngology","src":"Bailey · Laryngology · Q79"},{"s":"Which of the following mechanisms of immune escape renders a tumor cell susceptible to killing by natural killer cells?","o":["Decreased expression of neoantigens","Decreased expression of major histocompatibility complex (MHC) class I","Decreased expression of TAP","Decreased expression of viral proteins"],"k":"B","x":"Decreased expression of MHC class I. Although decreased expression of neoantigens, viral proteins, MHC class I, or TAP! render tumor cells less susceptible to killing by antigen-specific T cells, natural killer cells specifically recognize and kill cells that express low levels of MHC class I. PAGE 1982","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q10"},{"s":"A 15-year-old male is currently on sublingual immunotherapy (SLIT) tablets for treatment of his grass pollen allergic rhinitis. At his follow-up visit, he reports new abdominal pain and difficulty swallowing over the past month. Diagnosis of what condition should lead to discontinuation of SLIT.","o":["Gastroesophageal reflux","EOE","Achalasia","Pill esophagitis"],"k":"B","x":"EOE has been reported as a potential side effect of SLIT. Patients that develop EoE while on SLIT should stop this therapy. Likewise, SLIT should not be used in patients who already have a diagnosis of EoE. PAGE 1623","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q107"},{"s":"Which disease of bone is associated with conductive hearing loss resultant of impact on the stapes?","o":["Paget disease","Osteoporosis","Ankylosing spondylitis","Osteopetrosis"],"k":"A","x":"Paget disease patients can develop stapes footplate fixation with or without fracture. Another bone condition which can affect the stapes is osteogenesis imperfect, where bone demineralization with fracture of the stapes crura can be seen. PAGES 2903-2904","d":"Otology","src":"Bailey · Otology and Neurotology · Q81"},{"s":"Which of the following paralytic agents is acceptable during induction when intraoperative facial nerve monitoring is being utilized?","o":["Succinylcholine","Vecuronium","Gallamine","Atracurium"],"k":"A","x":"Succinylcholine is used for induction because of its short duration of effect with complete recovery from neuromuscular blockade within 15 minutes. Atracurium and vecuronium typically induce paralysis for up to 30 minutes. PAGE 2716","d":"Otology","src":"Bailey · Otology and Neurotology · Q30"},{"s":"A 74-year-old man presents to the clinic seeking treatment for presbyphonia and has been previously evaluated for candidacy. Which therapy has been designed for presbyphonia?","o":["Flow phonation","Resonant Voice Therapy","PhoRTE","Conversation Training Therapy","Accent method"],"k":"C","x":"PhoRTE is the only behavioral voice therapy for presbyphonia that has been tested in a randomized, controlled clinical trial,93 showing improvements in respiratory and laryngeal biomechanics. PAGE 1092","d":"Laryngology","src":"Bailey · Laryngology · Q89"},{"s":"Which complication would be expected to occur more often with overlay as compared to underlay tympanoplasty techniques?","o":["Blunted malleus fixation to the anterior canal wall by scar tissue","Graft failure due to medial displacement","Excessive postoperative middle ear adhesions","Postoperative middle ear effusion"],"k":"A","x":"Blunting of the anterior ear canal is a common complication with overlay tympanoplasty. This is caused by dense scarring of the anterior tympanic membrane that results in reduction of the functional surface area of the drumhead and “pseudo-malleus” fixation caused by adhesion between the manubrium and the anterior canal wall. PAGES 2846-2848","d":"Otology","src":"Bailey · Otology and Neurotology · Q62"},{"s":"Fungal balls are most likely to occur in which region?","o":["Maxillary sinus","Ethmoid sinuses","Frontal sinus","Sphenoid sinus"],"k":"A","x":"Maxillary sinus disease (62%-84.4%) is reported to be several times more frequent than sphenoid involvement (14.4%-25%), with the ethmoid (0.6%-4%) infrequently involved. PAGE 527","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q74"},{"s":"The most common category of complication following balloon sinuplasty is:","o":["Skull base injury","Hemorrhage","Facial paresthesia","Orbital injury","Acute sinusitis"],"k":"D","x":"In a retrospective review of 2,851 patients who underwent balloon sinuplasty from 2011 to 2014, overall complication rates were 5.26%. Of these, orbital complications (eg, fracture, hemorrhage, pain, cellulitis, or erythema around the eye) were most prevalent (2.95%). This was followed by nasal hemorrhage (2.03%) and skull base injury (eg, CSF leak, pneumocephalus; 0.35%). PAGE","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q90"},{"s":"Use of tracheal stenting is best suited for which of the following clinical indication?","o":["Worsening of a 3 cm tracheal stenosis related to active granulomatosis with polyangiitis","2 cm idiopathic tracheal stenosis refractory to dilation","Midtracheal compression with airway obstruction from anaplastic thyroid carcinoma","Worsening cricoid stenosis and narrowing from a chondroma","Bilateral vocal fold paralysis"],"k":"C","x":"Tracheal stents are best used for palliative cases. PAGES 962-963","d":"Laryngology","src":"Bailey · Laryngology · Q49"},{"s":"The most common anatomical site of stridor in the neonate is","o":["Larynx","Trachea","Nose","Oral cavity"],"k":"A","x":"Laryngeal pathology is the most common cause of stridor in neonates. The narrowest portion of the neonatal airway is the subglottic airway at the level of the cricoid cartilage. The most common cause of neonatal stridor is laryngomalacia. SGS and vocal fold paralysis are other common laryngeal causes of stridor. PAGE","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q28"},{"s":"Which pair of lasers share water as their target chromophore?","o":["Thulium and carbon dioxide","PDL and KTP","Thulium and KTP","PDL and thulium","Ruby and carbon dioxide"],"k":"A","x":"Thulium and CO₂ laser have water as their target chromophore. PAGE 1135","d":"Laryngology","src":"Bailey · Laryngology · Q107"},{"s":"At the conclusion of a primary Asian rhinoplasty, the patient is found to have excessive flare with normal nostril size. What is the preferred maneuver for nasal base reduction?","o":["Sill excision","Alar flap","Lateral wedge excision","Full thickness excision"],"k":"C","x":"Lateral wedge excision. PAGE 3546","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q64"},{"s":"Which of the following microbes is not commonly associated with acute bacterial rhinosinusitis?","o":["Moraxella catarrhalis","Hemophilus influenzae","Streptococcus pyogenes","Pseudomonas aeruginosa"],"k":"D","x":"The organisms most associated with ABRS include Streptococcus pneumoniae, H. influenzae, Staphylococcus aureus, M. catarrhalis, and S. pyogenes. PAGE 466","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q53"},{"s":"Which procedures should be completed alongside a hypopharyngeal pharyngoplasty?","o":["Medialization laryngoplasty and tracheotomy","Hyoid suspension and cricopharyngeal myotomy","Tracheotomy and hyoid suspension","Cricopharyngeal myotomy and medialization laryngoplasty","Hyoid suspension and medialization laryngoplasty"],"k":"D","x":"The combination of these procedures decreases pooling of secretions in the pyriform sinus and allows better protection of the airway by laryngeal mechanisms. PAGE 837","d":"Laryngology","src":"Bailey · Laryngology · Q19"},{"s":"Which of the following esophageal atresia (EA)/ tracheoesophageal fistula (TEF) configurations would most likely have a delayed presentation?","o":["Proximal and distal TEF with EA","Proximal EA with distal TEF","H-type TEF","Proximal TEF with distal EA"],"k":"C","x":"H-type TEF presents with recurrent aspiration, and cyanotic spills related to feeds. In neonates, the presence of EA with or without TEF results in the accumulation copious oral secretions and prevents nourishment resulting in severe symptoms that lead to an earlier diagnosis. PAGE 1373","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q15"},{"s":"What is the most common complication after rhytidectomy?","o":["Infection","Hematoma","Facial nerve injury","Poor cosmetic outcome"],"k":"B","x":"Hematoma. PAGE 3714","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q100"},{"s":"Which of the following OSA medical comorbidities would be most appropriate for the standard fixed (continuous positive airway pressure [CPAP)) or autotitrating (automatic positive airway pressure) positive pressure therapy?","o":["OSA and congestive heart failure","OSA and atrial fibrillation","OSA and chronic obstructive pulmonary disease","OSA and neuromuscular disease"],"k":"B","x":"The recommendation for home sleep study test followed by automatic positive airway pressure does NOT apply to complicated patients, including those with congestive heart failure, lung disease (such as chronic obstructive pulmonary disease), baseline oxygen requirements, neuromuscular disease, obesity hypoventilation, central or complex sleep apnea, or history of uvulopalatopharyngoplasty. PAGE 2507","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q10"},{"s":"A patient with a history of chronic ear disease presents with several weeks of hearing loss, aural drainage and headache with a new onset of inability to abduct the ipsilateral eye. Prior workup for his chronic ear disease indicated normal bone lines bilaterally, with a CT demonstrating poor development of the mastoid bone and a high-riding jugular bulb. Appropriate surgical management could be:","o":["Transotic","Transmastoid","Infracochlear","Transnasal"],"k":"D","x":"This presentation is consistent with Gradenigo triad, typically due to infectious involvement of the petrous apex. While antibiotics are important, surgical drainage of the area is often required. The transotic approach would unnecessarily sacrifice his hearing, and the transmastoid approach would not be favored given its poor development and consequent-reduced visualization and increased risk to the facial nerve. The infracochlear approach is not appropriate where a high-riding jugular bulb minimizes access to the petrous apex. Depending on the anatomy of the paranasal sinuses, the petrous apex, and the carotid arteries, the endoscopic transnasal approach may form an advantageous route to the petrous apex. PAGE 2831","d":"Otology","src":"Bailey · Otology and Neurotology · Q57"},{"s":"Rigorous evaluation of published data, such as that performed. by Cochrane systemic reviews, has evaluated various treatments for subjective tinnitus. Study suggests that the most effective treatment for subjective tinnitus is:","o":["Cognitive behavioral therapy","Gingko biloba","HBO therapy","Betahistine"],"k":"A","x":"Systemic reviews and meta-analysis, such as those performed by Cochrane Systematic Review, provides high-quality evaluation of the efficacy of currently available treatments for subjective tinnitus. These are reviewed in Table 161.4. Cognitive behavioral treatment has been shown to be effective in reducing the negative impact of tinnitus on quality of life as well as small benefits on depressive symptoms related to tinnitus. There is no evidence to support an effect of Gingko Biloba, HBO, or betahistine on subjective tinnitus. PAGE 3078","d":"Otology","src":"Bailey · Otology and Neurotology · Q119"},{"s":"A 6-year-old boy presents with Moebius syndrome. Examination is notable for bilateral dense facial paralysis and abducens palsy. What is the best option for facial reanimation?","o":["Gracilis by cross face nerve graft","Gracilis by masseteric nerve","Masseteric-to-facial nerve transfer","Hypoglossal-facial nerve transfer"],"k":"B","x":"Patients with congenital facial palsy require muscle transfer for facial reanimation (Chapter 205, Section “The Oral Commissure and Smile”). In a patient with bilateral Mobius syndrome, where CN VI and VII are underdeveloped, free muscle transfer should be driven by the masseteric nerve (CN V). PAGE 3479","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q44"},{"s":"Which of the following fulfills the criteria for diagnosis of chronic rhinosinusitis?","o":["Four months of nasal congestion, headache, and cough with normal nasal endoscopy and findings of scattered maxillary and ethmoid opacification on CT sinus","One month of nasal congestion, postnasal drip, and rhinorrhea with findings of purulent drainage from bilateral middle meatus on nasal endoscopy","Four months of sinus headache, facial pain, and fatigue with normal nasal endoscopy and no evidence of sinonasal opacification on CT sinus","Six months of nasal congestion and rhinorrhea with normal nasal endoscopy and CT sinus remarkable for nasal septal deviation"],"k":"A","x":"The rhinosinusitis task force definition of chronic rhinosinusitis is as follows: 12 weeks or more of symptoms (two or more major factors or one major and two minor factors) and at least one of the following: purulence in sinonasal cavity, edema/erythema in sinonasal cavity, nasal polyps, inflammation of sinuses on imaging. Major factors are nasal obstruction, nasal drainage/purulence/ discolored postnasal drainage, hyposmia/anosmia, facial pain/pressure, and fever (in acute only). Minor factors are headache, halitosis, fatigue, dental pain, cough, and ear pain/fullness. PAGE 741","d":"Rhinology","src":"Bailey · Comprehensive Otolaryngology · Q37"},{"s":"Regarding “infantile hemangiomas,” which of the following is true?","o":["All vascular lesions can be referred to as “hemangiomas.”","They can be subdivided into focal and segmental lesions.","They continue to grow throughout a patient’s lifetime.","They should all be treated."],"k":"B","x":"They can be focal or segmental. All vascular lesions are not “hemangiomas.” Refer to the ISSVA classification, which divides vascular lesions into tumors and malformations. Infantile hemangiomas (IHs) are the most common benign vascular tumor. Only malformations continue to grow. IHs proliferate and involute. Focal lesions proliferate for a year and segmental lesions for 2 to 3 years. Not all THs need treatment: depends on the growth phase, superficial or compound, and location. PAGE 3825","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q126"},{"s":"Electronic hearing protection products, which deliver quiet sounds at audible levels but attenuate high-level sounds to 85 dBA or less, are particularly recommended for which of the following groups?","o":["Hunters","Musicians","Factory workers","Forestry workers"],"k":"A","x":"Hunters often forego hearing protection devices (HPD) use because they do not perceive their hearing to be at risk from a small number of firearm discharges, and because they cannot hear environmental sounds, including the noise they are generating themselves which could alert and scare away the species they are pursuing. Electronic HPD deliver environmental sounds behind the HPD at safe levels, and many electronic HPD have a volume setting that allows quiet sounds to be amplified for the HPD user. When a firearm is discharged, the HPD attenuate the high-level sound. Firearm discharge is one of the most hazardous nonoccupational exposures. PAGES 2920-2922","d":"Otology","src":"Bailey · Otology and Neurotology · Q86"},{"s":"Which technique is not a method of application of topical anesthesia for awake laryngeal procedures?","o":["Transtracheal injection","Superior laryngeal nerve block","Application via injection port of a flexible scope","Nebulization of topical anesthesia","Application via Abraham cannula"],"k":"B","x":"All methods above except option B rely on direct application of topical anesthesia to the mucosa of the upper airway. PAGES 1126-1127","d":"Laryngology","src":"Bailey · Laryngology · Q102"},{"s":"What is the only intraoperative electromyography (EMG) pattern that corresponds to deterioration of facial nerve function?","o":["Prolonged, audible activity in the EMG patterns","C train","A train","Burst activity"],"k":"C","x":"The A train has been shown to be the only intraoperative EMG pattern associated with deterioration of facial nerve function. PAGES 2714-2716","d":"Otology","src":"Bailey · Otology and Neurotology · Q29"},{"s":"The olfactory cleft is composed of specialized epithelium which includes the following regions:","o":["Mucosa of the superior/posterior septum as well as the opposing areas of the superior and middle turbinates","Mucosa of the inferior/anterior septum as well as the opposing areas of the superior and middle turbinates","Mucosa of the superior/posterior septum as well as the opposing areas of the superior turbinate only","Mucosa of the superior/posterior septum as well as the opposing areas of the middle turbinate only"],"k":"A","x":"The olfactory cleft includes the posterior septum just below the cribriform and opposing mucosa of the superior and middle turbinates. PAGE 314","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q6"},{"s":"What is the most common presenting symptom in patients with acute invasive fungal sinusitis?","o":["Fever","Pain","Rhinorrhea","Numbness"],"k":"A","x":"For patients with immune compromise, symptoms including nasal congestion, rhinorrhea, facial pain, and headache should all prompt evaluation for acute invasive fungal sinusitis. The most common presenting symptom, however, is fever. PAGE 520","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q72"},{"s":"Which characteristic is a favorable prognostic factor for survival in soft tissue sarcomas?","o":["Size greater than 5 cm","Low-grade histology","Positive margins","Location in the head and neck"],"k":"B","x":"Negative prognostic factors that have been consistently reported to influence survival include high-grade histology, size greater than 5 cm, and positive margins. Overall survival for soft tissue sarcomas in the head and neck is poorer than for those in other anatomic subsites, likely because of a combination of factors including a greater proportion of high-grade tumors occurring in the head and neck as well as difficulty obtaining negative margins given anatomic limits. Low-grade histology is associated with improved survival. PAGE 2321","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q102"},{"s":"What is considered the most effective management strategy for Extra Esophageal Reflux?","o":["Diet and lifestyle changes including weight loss","PPIs","H2 antagonists","Alginate suspensions","Nissen or Toupet fundoplication"],"k":"E","x":"These are surgical techniques to prevent gastric contents from refluxing in a cephalad direction. PAGES 1012-1013","d":"Laryngology","src":"Bailey · Laryngology · Q66"},{"s":"A rapidly expanding and contrast-enhancing mass in the IAC with accompanying progressive 7th and 8th cranial nerve neuropathies is most likely to be caused by:","o":["Meningioma","Lipoma","Vestibular schwannoma","Metastatic breast cancer"],"k":"D","x":"Lipoma, meningioma, and vestibular schwannomas are all slowly growing tumors of the IAC. Metastatic breast cancer has a more aggressive growth pattern and presentation and should be considered. PAGES 3026-3027","d":"Otology","src":"Bailey · Otology and Neurotology · Q105"},{"s":"In normal adult sleep, which stage comprises the largest proportion of total sleep time?","o":["NI","N2","N3","Wake after sleep onset","Rapid eye movement"],"k":"B","x":"In adults, about 45% to 55% of total sleep time is normally spent in N2 sleep. N1 sleep accounts for about 1% to 5% of the night, N3 sleep for about 20% to 25%, and 20% to 25% of total sleep time is normally spent in rapid eye movement sleep. PAGE 2480 (Table 155.1)","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q4"},{"s":"The mammalian cochlea contains hair cells, supporting cells, and spiral ganglia neurons. Which cell types are required for normal hearing function?","o":["Hair cells","Supporting cells","Spiral ganglia neurons","All of the above"],"k":"D","x":"The mammalian cochlea contains a diverse number of cell types, such as the mechanosensory hair cells, different types of supporting cells, and the spiral ganglion neurons. All of these cells play critical roles for normal auditory function. PAGE 3265","d":"Otology","src":"Bailey · Otology and Neurotology · Q162"},{"s":"What is the most effective intervention for patients with posterior epistaxis:","o":["Placement of a posterior nasal pack","Unilateral IMA embolization","Unilateral sphenopalatine artery (SPA) ligation","Endoscopic monopolar cautery"],"k":"C","x":"The long-term success of SPA ligation is around 75% to 80%. Bilateral SPA ligation can increase the rate of success but runs the risk of a posterior septal perforation and middle turbinate necrosis. Unilateral IMA embolization is around 75% effective; the suc ‘ate is higher if the contralateral IMA and if one or both facial arteries are embolized; however, bilateral IMA embolization may leave patients with jaw claudication, and involvement of the facial arteries risks necrosis to the nasal alar and palate. PAGE 460","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q50"},{"s":"A patient presents with a conductive hearing loss with intact acoustic reflexes. A stapedectomy is performed with no improvement in hearing. What is the most likely cause of this poor result?","o":["Prosthesis displacement.","Prosthesis is too short.","Undiagnosed lateral chain fixation.","Inner ear third window."],"k":"D","x":"In this patient’s case, the conductive hearing loss is likely not caused by otosclerosis but rather by an inner ear third window such as superior canal dehiscence. This is why it is critical to obtain acoustic reflex testing in patients suspected to have otosclerosis. PAGE 2861","d":"Otology","src":"Bailey · Otology and Neurotology · Q70"},{"s":"VR takes advantage of which of the following process?","o":["Peripheral sensation independence","Redundancy","Static number of central nervous system neurons","Synaptopathy"],"k":"B","x":"VR relies on redundancy and plasticity to allow for improving vestibular function. PAGES 3259-3260","d":"Otology","src":"Bailey · Otology and Neurotology · Q158"},{"s":"Which of the following physical properties of the vibratory mucosal wave correlates most often with hoarseness or rough voice quality?","o":["Amplitude","Frequency","Asymmetry","Aperiodicity","Mucosal erythema"],"k":"D","x":"Loss of regularity of mucosal wave vibration results in turbulent airflow through the glottis, irregular pressure changes, and rough sound quality. PAGE 994","d":"Laryngology","src":"Bailey · Laryngology · Q61"},{"s":"In the otolith organs, the “striola” is:","o":["The gelatinous material surrounding the otoconia and is adherent to the hair cells","A collection of supporting cells abutting the sensory hair cells","The sensory epithelium that divides the macular surface","The geometric arrangement of the hair cells as noted on electron microscopy"],"k":"C","x":"The striola is the thin strip of sensory epithelium that divides the macular surface into two parts and contains predominantly type I sensory hair cells and irregularly firing afferents. Hairs on opposite sides of the striola have opposite polarization, and the boundary line distinguishing these opposing vectors is known as the line of polarity reversal. PAGES 2677-2678","d":"Otology","src":"Bailey · Otology and Neurotology · Q19"},{"s":"Routine strategies to improve posttreatment nutritional deficiencies include all of the following except:","o":["Change in dietary consistency","Behavioral strategies","Use of alternative methods of nutrition","Total parenteral nutrition"],"k":"D","x":"Total parenteral nutrition is rarely required and is not recommended when a functioning GI tract exists. PAGE 2457","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q147"},{"s":"A patient presents to your office with left conductive hearing loss and left facial paralysis. Temporal bone CT showed opacification of the left middle ear and mastoid. Blood work showed elevated angiotensin converting enzyme level and hypercalcemia. What is the pathology likely to show from middle ear and mastoid specimens?","o":["Poorly differentiated keratinocytes","Nests of small basal cells with high nuclear to cytoplasmic ratio","Granuloma","Meningothelial nests of cells resembling arachnoid cap cells"],"k":"C","x":"This patient likely has sarcoidosis. Therefore, granuloma is expected to be observed on middle ear and mastoid specimens. PAGES 2898-2899","d":"Otology","src":"Bailey · Otology and Neurotology · Q79"},{"s":"What is the most common etiology of unilateral vocal fold paralysis (UVFP)?","o":["Iatrogenic (surgical trauma)","Malignancy","Intubation related","Idiopathic/post-viral","Post-vaccination"],"k":"A","x":"Nearly 45% of UVFP is attributable to surgical trauma. Thyroid surgery is the most common procedure causing UVFP, comprising one-third of iatrogenic cases. Idiopathic is the second most common overall cause. (Rosenthal LHS, Benninger MS, Deeb RH. Vocal fold immobility: a longitudinal analysis of etiology over 20 years. Laryngoscope. 2007;117:1864-1870.) PAGES 1050-1051","d":"Laryngology","src":"Bailey · Laryngology · Q77"},{"s":"A 34-year-old woman presents with enlarged submandibular glands and xerostomia. She has yet to undergo diagnostic work-up for immunologic disease. Based on clinical suspicion, which serologic test is most likely to yield positive results?","o":["SSA/anti-Ro Ab","Anti-centromere Ab","Anti-dsDNA Ab","Anti-desmoglein-3 Ab"],"k":"A","x":"The classic finding of Sjégren’s is sicca syndrome, which includes xerophthalmia with keratoconjunctivitis and xerostomia with or without salivary gland swelling. Diagnosis requires hallmark signs and symptoms as well as confirmation with a positive SSA/SSB antibody or characteristic minor salivary gland biopsy. PAGE 767","d":"General","src":"Bailey · Comprehensive Otolaryngology · Q44"},{"s":"The anterior and posterior ethmoid sinuses are divided by the:","o":["Uncinate","Basal lamella","Lamina papyracea","Superior turbinate"],"k":"B","x":"The ethmoid air cells are divided into anterior and posterior at the basal lamella of the middle turbinate. PAGE 566","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q89"},{"s":"Which of the following is false about the risk of malignant transformation in patients undergoing radiosurgery?","o":["The diagnosis of malignant transformation is based on the Cahan criteria.","The incidence in most studies is approximately 10%.","It typically occurs after 5 years of initially radiosurgery treatment.","The incidence of malignant transformation increases with time after radiosurgery treatment."],"k":"B","x":"The incidence of malignant transformation in patients receiving radiosurgery has been reported to be less than 1% in most studies. PAGES 3037-3038","d":"Otology","src":"Bailey · Otology and Neurotology · Q109"},{"s":"Which test has been recommended for use in hearing conservation programs because it reveals early evidence of injury to outer hair cells and may have some utility in identifying individuals who are at increased risk for significant threshold shift?","o":["Pure tone audiometry","Distortion product OAE","Speech-in-noise","Auditory brainstem response"],"k":"B","x":"Distortion product OAEs provide a sensitive measure of outer hair cell function and have been recommended for inclusion in audiometric monitoring programs to provide an earlier warning of cochlear injury; that is, before overt threshold shift has developed. In addition to providing earlier identification of cochlear damage, there are some data that suggest workers with decreased distortion-product otoacoustic emission amplitude are at increased risk for NIHL, presumably because there is existing outer hair cell damage and additional damage occurring during subsequent noise exposure results in Significant Threshold Shift when remaining hair cells are damaged by this exposure to loud sound. PAGES 2917-2918","d":"Otology","src":"Bailey · Otology and Neurotology · Q85"},{"s":"Which site is not a common aerodigestive site for RRP infection?","o":["Nasopharyngeal surface of soft palate","Limen vestibuli","Undersurface of vocal folds","Laryngeal surface of epiglottis","Cervical esophagus"],"k":"E","x":"Although it may occur, the cervical esophagus is not a common location for RRP. Other common aerodigestive sites include the carina, bronchial spurs, and upper and lower margins of the ventricle. PAGE 1525","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q77"},{"s":"The pedicled nasoseptal flap is commonly used in reconstruction of ventral skull base defects given its versatility and durability. What is the vascular supply of this flap?","o":["Posterior septal artery","Greater palatine artery","Anterior ethmoidal artery","Posterior ethmoidal artery"],"k":"A","x":"The vascular supply of the pedicled nasoseptal flap is the posterior septal branch of the SPA. PAGE 614","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q108"},{"s":"You are seeing a 4-year-old girl in clinic, 2 years after successful right-sided cochlear implantation. She has no complaints. On otoscopy, you notice that she has an intact tympanic membrane on the right, with a serous effusion. The patient has no history of AOM or prior effusions. What do you recommend?","o":["CT scan of the temporal bones","Course of amoxicillin/clavulanate","Placement of tympanostomy tube","Follow-up to ensure resolution of the effusion"],"k":"D","x":"AOM in children with cochlear implants has increased potential for severe complications and should be treated appropriately with antibiotics. However, a serous effusion in an ear with a previously implanted device does not warrant antibiotic use, provided it remains uninfected. Tympanostomy tube placement can be considered in a patient with a cochlear implant and a history of recurrent ear infections or persistent effusions. PAGE 1669","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q126"},{"s":"Which of the following antibodies normally exists as a pentamer?","o":["IgA","IgM","IgE","IgG"],"k":"B","x":"IgM constitutes 10% of serum immunoglobulins, is associated with early immune response, is efficient in complement fixation, and normally exists as a pentamer. IgA is secreted as a dimer; IgD, IgG, and IgE normally exists in monomeric form. PAGE 333","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q12"},{"s":"A 75-year-old female is unrestrained in a car accident and sustains impact to the central midface. A comminuted nasoorbitoethmoid (NOE) fracture is identified on a maxillofacial CT scan. The fracture extends into the bone fragment where the medial canthal tendon inserts. What is the most appropriate surgical technique to restore the contour of the medial canthus?","o":["Transnasal medial canthopexy","ORIF of bone fragment containing medial canthal tendon with miniplate","External splints","Insertion and miniplate fixation of a calvarial bone graft"],"k":"A","x":"Transnasal medial canthopexy securing the medial canthal tendon medially and posteriorly with wire is the preferred technique to restore the contour and position of the medial canthus for a type III NOE fracture as described in the question. ORIF with miniplates of a bone fragment containing the medial canthal tendon attachment would be appropriate for a type I and possibly some type II fractures. External splints can be used to promote soft tissue adherence and reduce edema following internal fixation and/or canthopexy but would not be effective alone for restoration of medial canthal contour. While calvarial bone grafts are useful to restore projection of the nasal dorsum in patients with NOE fractures, bone grafting alone would not restore medial canthal contour. PAGE 1278","d":"Rhinology","src":"Bailey · Trauma · Q32"},{"s":"What laser can be used to treat cutaneous or mucosal venous malformations?","o":["Nd:YAG laser","Pulsed dye laser","CO} laser","Er:YAG laser"],"k":"A","x":"Superficial cutaneous lesions or the superficial component of deep lesions as well as mucosal lesions can be treated with the Nd:YAG laser. Its wavelength is 1064 nm, and its chromophore is deoxyhemoglobin. PAGE 1789","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q152"},{"s":"What is considered the lateral boundary of the ethmoid air cells?","o":["Middle turbinate","Lamina papyracea","Ethmoid bulla","Lateral lamella","Middle meatus"],"k":"B","x":"The lamina papyracea is a key anatomic boundary when dissecting the ethmoid air cells. It is located lateral to the ethmoid air cells. When dissecting along the lamina, instruments should be selected and handled to avoid inadvertent trauma laterally and avoid injury to the orbit. PAGE 565","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q87"},{"s":"What is the ideal timing for facial nerve ENoG after posttraumatic facial nerve paralysis?","o":["Within 12 hours","12 to 48 hours","4 to 7 days","Greater than 7 days"],"k":"C","x":"Since Wallerian degeneration occurs over approximately 3 to 5 days, the distal segment of the nerve may be able to be stimulated electrically for 3 to 5 days after injury. Therefore, ENOoG is most useful when performed at 4 to 7 days after nerve injury. PAGES 2787-2790","d":"Otology","src":"Bailey · Otology and Neurotology · Q49"},{"s":"An intercarotid distance less than what value is considered a contraindication to endonasal approaches to the sella?","o":["0.5 cm","1cm","1.5 cm","2cm"],"k":"B","x":"Traditionally, 1 cm has been used as a cutoff for the minimum intercarotid distance that allows access to the sella with adequate room for dissection. PAGE 1640","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q110"},{"s":"The most likely diagnosis in a neonate with expiratory stridor and a brassy cough is:","o":["Congenital SGS","TM","Robin sequence","Bilateral vocal fold paralysis"],"k":"B","x":"Inspiratory stridor suggests supraglottic obstruction, whereas expiratory stridor suggests tracheal obstruction (particularly the intrathoracic trachea). Glottic and subglottic abnormalities may present with biphasic stridor. PAGE 1389","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q30"}]},{"title":"Paper 2","q":[{"s":"As of 2023, FDA-approved treatments for CRS with polyps includes which of the following monoclonal antibodies correctly paired with its target cytokine and/or antibodies?","o":["Dupilumab which targets IL-4 receptor","Benralizumab which targets IL-5","Omalizumab which targets IgE","Mepolizumab which targets thymic stromal lymphoppoietin (TSLP)"],"k":"C","x":"Omalizumab which targets IgE. Dupilumab was the first FDA-approved treatment for CRS with polyps (June 2019) and targets an IL-4 receptor subunit, which is also part of the IL-13 receptor—inhibiting both cytokines. Benralizumab binds to the alpha subunit of the IL-5 receptor (present on eosinophils) and attracts natural killer cells to induce eosinophil apoptosis. Omalizumab targets IgE and was FDA approved for CRS with polyps in December of 2019. Mepolizumab binds IL-5 and was FDA approved for CRS with polyps in 2021. PAGE 422","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q36"},{"s":"Vertigoheel is felt to be efficacious in the treatment of vertigo through what mechanism(s)?","o":["Improve vestibular microcirculation","Promote resorption of otoliths","Activate vestibular regulatory systems within the brainstem","Both A and C"],"k":"D","x":"Vertigoheel is thought to improve microcirculation and activate vestibular regulatory systems within the brainstem. PAGE 255","d":"Otology","src":"Bailey · Basic Science/General Medicine · Q71"},{"s":"What is the inheritance pattern of cleft lip and/or palate deformity?","o":["Autosomal dominant with incomplete penetrance","Autosomal recessive","Multifactorial","X-linked recessive"],"k":"C","x":"Cleft lip and/or palate is the most common congenital craniofacial deformity, affecting 1 in 500 to 1,000 live births. Orofacial clefting appears to be multifactorial and is associated with many genetic and environmental factors (Murray JC. Gene/Environment causes of cleft lip and/or palate. Clinical Genetics. 2002;61(4):248- 256). PAGE 3638","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q84"},{"s":"Which of the following are key factors that influence the effectiveness of sphincter pharyngoplasty augmentation?","o":["The width of the recipient site mucosal defect","The musculature included in the flap","The degree of flap overlap","The cephalocaudal position of the neosphincter","All of the above"],"k":"E","x":"All these variables contribute to the flexibility and customizability of the sphincter pharyngoplasty. PAGE 1602","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q98"},{"s":"A child who presents with acute facial palsy, facial edema, fissured tongue likely has:","o":["Bell palsy","Ramsay Hunt syndrome","Melkersson-Rosenthal syndrome","Lyme disease"],"k":"C","x":"Acute facial palsy, facial edema, and fissured tongue are features of Melkersson-Rosenthal syndrome. PAGE 2880","d":"Otology","src":"Bailey · Otology and Neurotology · Q72"},{"s":"Which of the following is the most common pediatric primary tracheobronchial malignancy?","o":["Carcinoid tumors","Adenoid cystic carcinoma","Squamous cell carcinoma","Rhabdomyosarcoma"],"k":"A","x":"In children, malignant primary tracheobronchial tumors are more common than benign tumors. The most common malignancy types in this anatomic region is carcinoid tumors, followed by mucoepidermoid carcinoma. PAGE 1381","d":"Paedi
