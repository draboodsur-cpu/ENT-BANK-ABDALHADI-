ds are no longer working, and a repeat audiogram shows bilateral severe to profound hearing loss. Which of the following is the most appropriate statement to counsel this patient on cochlear implantation (CI)?","o":["Cl in an older adult would provide worse hearing outcomes compared to a younger adult.","Cl in this patient would be unsafe due to her old age.","Vestibular dysfunction after CI in an older adult may last longer than in a younger patient.","Cl in an older adult would make no difference in overall quality of life."],"k":"C","x":"Age alone should not be considered a limiting factor when considering CI candidacy; for in older adults, it is safe, cost-effective, and associated with improvements in a range of important functional domains, including social and emotional function, cognition, and overall quality of life. CIs can provide the same level of hearing performance as younger adults undergoing the procedure; however, postoperative duration of vestibular dysfunction may be longer among older patients. PAGES 3094-3096","d":"Otology","src":"Bailey · Otology and Neurotology · Q123"},{"s":"Which of the following is a risk factor for development of vertebral osteophytes?","o":["Trauma","Reflux","Osteoporosis","Obesity","Smartphone use"],"k":"D","x":"Obesity, advanced age, and diabetes are the most common risk factors of vertebral osteophytes impacting swallowing function. PAGE 856","d":"Laryngology","src":"Bailey · Laryngology · Q24"},{"s":"What is the usual location of pathology in obstructive eustachian tube dysfunction and therefore the site to target treatment with balloon dilation?","o":["Nasopharyngeal orifice of the eustachian tube","Bony eustachian tube","The eustachian tube isthmus","Cartilaginous eustachian tube"],"k":"D","x":"The most common cause for obstructive eustachian tube dysfunction is mucosal inflammation within the cartilaginous portion, which is the location of the functional valve. Much less commonly, obstructive pathology can occur within the bony portion. Dilation is not recommended within the bony portion as it is in close proximity with the internal carotid artery. PAGES 2758-2761","d":"Otology","src":"Bailey · Otology and Neurotology · Q40"},{"s":"Which of the following is considered the gold standard in diagnosis of tracheobronchomalacia?","o":["Airway fluoroscopy","Flexible and rigid tracheobronchoscopy","Inspiratory and expiratory chest x-ray films","Computerized tomography"],"k":"B","x":"Flexible and rigid tracheobronchoscopy provides excellent visualization of malacic segments and offer the opportunity to assess the degree of dynamic collapse. Airway fluoroscopy, chest x-ray films, and computerized tomography are beneficial in the initial and subsequent workup in selected patients. PAGE 1371","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q24"},{"s":"Which of the following patients is home sleep testing contraindicated?","o":["Male with snoring, hypertension, and diabetes","Female with snoring, obesity, and polycystic ovarian syndrome","Male with snoring, hypertension, and peripheral vascular disease","Female with snoring, pain requiring narcotic therapy, and daytime sleepiness"],"k":"D","x":"Guideline for home sleep testing—patients with comorbid medical conditions such as significant cardiorespiratory disease, nocturnal oxygen use, potential respiratory muscle weakness due to neuromuscular condition, awake hypoventilation or suspicion of sleep-related hypoventilation, chronic opioid medication use, history of stroke, or severe insomnia are not candidates for home testing. PAGES 2499-2500","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q1"},{"s":"A surgeon in practice at Lakes Regional Hospital for 8 years has just attended a course on medialization laryngoplasty. She wants to add this to her list of approved procedures. Which medical staff or credentialing mechanism is most appropriate to achieve this at this hospital?","o":["FPPE","OPPE","Letter from chair","Certification from course director","Nothing additional: her Board certification is sufficient"],"k":"A","x":"The Joint Commission requires at least two mechanisms for competency evaluation, as competency entails behavioral and technical skills. The first mechanism follows the initial hiring and is referred to as the Initial Focused Practitioner Performance Evaluation (FPPE). Following this initial FPPE (the initial medical staff appointment), there may be additional FPPE for new procedures as they are incorporated. PAGE 3892","d":"General","src":"Bailey · Contemporary Issues in Medical Practice · Q10"},{"s":"Infants will need new earmolds every:","o":["2 years","| year","6 months","2 months"],"k":"D","x":"If earmolds do not fit tightly, sounds will leak out of the ear canal (this causes several problems). Because infants grow so quickly, new earmolds are needed every 2 months. When they reach toddler age, they are likely to need new earmolds every 6 months or so. Older children may be able to wear their earmolds for approximately a year. Regardless of the child’s age, if the earmold seems loose or sounds are leaking out of the ear canal, a new earmold is needed as soon as possible. PAGE 3159","d":"Otology","src":"Bailey · Otology and Neurotology · Q141"},{"s":"A 3-year-old male with right-sided grade III microtia is being evaluated for possible reconstruction with autologous rib cartilage. Which is the earliest age by which he would likely have appropriate chest wall development for the Nagata technique?","o":["5 years old","6 years old","8 years old","10 years old"],"k":"D","x":"10 years old. PAGE 3765","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q113"},{"s":"Which of the following has histaminergic neurons that are involved in migraine?","o":["Thalamus","Superior salivatory nucleus","Trigeminal nucleus caudalis","Tuberomammillary nucleus"],"k":"D","x":"The central nervous system (CNS) has histaminergic neurons in the tuberomammillary nucleus located in the posterior hypothalamus. These histaminergic neurons project throughout the CNS. Studies using PET suggest that there is activation of the posterior hypothalamus during the prodrome phase of migraines. PAGE 741","d":"General","src":"Bailey · Comprehensive Otolaryngology · Q35"},{"s":"When selecting among local flap options for a nasal defect, which is the most important factor to consider?","o":["Location of resulting scars in relation to relaxed skin tension lines (RSTL)","Location of resulting scars in relation to lines of minimal tension","Limitations from immobile structures surrounding the defect","Thickness of the skin immediately surrounding the defect"],"k":"C","x":"While all these factors are important to consider in nasal reconstruction, the location of surrounding immobile structures dictates the area of recruitment from where local flaps can be transferred. Disrupting an immobile structure such as the free alar margin, eyelid or lip can create a significant deformity that is very difficult to correct secondarily, so careful flap selection should be done to avoid this. Aligning incisions with natural skin creases and matching the surrounding skin thickness are secondary factors to consider in flap design once the appropriate tissue reservoir is selected. PAGE 3398","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q24"},{"s":"During dissection in an open revision rhinoplasty, the patient is found to have weak, bulbous, and cephalically oriented lower lateral cartilages. Which maneuver is the most effective to address these issues?","o":["Medial crural steal with lateral tensioning","Tongue in groove maneuver","Lateral crural underlay with tip suturing","Lateral crural strut graft with repositioning"],"k":"D","x":"Lateral crural strut graft with repositioning. PAGE","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q63"},{"s":"The following principle should guide social media marketing efforts:","o":["Always include a patient name to posted patient photographs.","Review all information prior to sharing or posting on your account.","Link personal and professional profiles so patients can learn about their doctor.","Use social media to share the surgical complications of competitors."],"k":"B","x":"Practical suggestions for physicians who wish to engage in social media include the following: maintain patient privacy at all costs, separate personal and professional profiles, deidentify all patient information, examine the information you are sharing, control your photos, have a physician strategic plan for social media engagement, and err on the side of caution. PAGE 3912","d":"General","src":"Bailey · Contemporary Issues in Medical Practice · Q20"},{"s":"Acute bacterial rhinosinusitis occurs in approximately what percentage of patients who develop a viral ARS?","o":["1%","5%","10%","25%"],"k":"A","x":"ARS is almost always secondary to viral infection and rarely progresses to acute bacterial rhinosinusitis (0.5% to 2%) of ARS episodes. PAGE 466","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q52"},{"s":"Which of the following is an advantage of fractionated radiotherapy?","o":["It allows the delivery of a higher total radiation dose compared to radiosurgery.","It allows time for tissue repair.","It has lower toxicity compared to radiosurgery.","All of the above."],"k":"D","x":"All of the answers are advantage of fractionated radiotherapy. PAGE 3036","d":"Otology","src":"Bailey · Otology and Neurotology · Q107"},{"s":"Elexacaftor, ivacaftor, and tezacaftor work primarily by:","o":["Treating P. aeruginosa in patients with CF","Reducing the asthma symptoms and aspirin sensitivity in","Impacting the CFTR transmembrane sodium chloride channels in patients with CF","Reducing nasal polyps in AERD"],"k":"C","x":"Elexacaftor and tezacaftor each directly bind to different sites on the CFTR protein and facilitate its transport to the cell surface. Ivacaftor aids in keeping the channel open once it has reached the cell surface. PAGE 515","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q70"},{"s":"The semicircular canals detect acceleration while the otolith organs detect acceleration.","o":["Angular and linear.","Linear and angular.","Both detect uniform or constant acceleration.","These organs do not detect acceleration."],"k":"A","x":"The semicircular canals detect angular acceleration and are activated when the head is rotated to the left or right (horizontal canals), pitched forward (anterior canals), or arched backward (posterior canals). The otolith organs detect linear acceleration, in the form of translation (linear motion of the head) or gravity (tilt of the head), and consist of two sacs within the vestibule, utricle, and saccule. PAGE 2670","d":"Otology","src":"Bailey · Otology and Neurotology · Q18"},{"s":"Snoring is defined as noisy breathing louder than how many decibels (dB)?","o":["50 dB","60 dB","37 dB","90 dB","76 dB"],"k":"A","x":"59dB. Snoring is defined by vibrating soft tissue sounds in the upper airway typically during inspiration that are 50 dB or louder. PAGE 2537","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q18"},{"s":"Which of the following is true regarding complications of pediatric tracheotomy?","o":["Early (within the first 7 days) postoperative complications are common; however, after healing, later complications are rare and tend to be mild.","Tracheostomy tube-related complications, such as tracheostomy tube plugging, are more commonly seen in older children than in infants.","Patients with tracheostomy tubes rarely require readmission after the initial surgical period.","Prior to considering tracheostomy decannulation in a pediatric patient, the airway should be evaluated to ensure that there is no area of obstruction that would prevent successful decannulation."],"k":"D","x":"Complete airway evaluation (awake and sedated) should be performed to ensure that there is no obstruction from the stoma to the oral cavity that might prevent decannulation. Types of obstruction include vocal fold immobility, subglottic stenosis, suprastomal obstruction from granulation tissue or cartilaginous collapse, supraglottic collapse, and tonsillar hypertrophy. PAGE 1501","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q69"},{"s":"Which of the following statements about staged forehead flaps in nasal reconstruction is correct?","o":["Forehead flaps must incorporate bilateral supratrochlear arteries for adequate perfusion.","Forehead flaps must incorporate a unilateral intact supratrochlear artery for adequate perfusion.","Forehead flaps must include the frontalis muscle along the entire length of the flap to ensure adequate perfusion to the tip of the flap.","Forehead flap pedicle division must be delayed by a minimum of | to 2 weeks after flap transfer to ensure adequate collateral perfusion."],"k":"D","x":"The vascularity of the forehead flap is robust and is based on vascular perfusion pressure around the supratrochlear artery, but the flap is not entirely dependent on this arterial supply. The distal end of the flap can be thinned and elevated in the subcutaneous plane without compromising flap viability, but the proximal flap should include the frontalis and corrugator muscle. For multistage forehead flap reconstruction, successful pedicle division requires a delay of a minimum of | to 2 weeks to allow neovascularization of the flap from the surrounding nasal tissues. Most people wait 3 weeks for pedicle division. PAGE 3394","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q23"},{"s":"When selecting a surgical code, the following below is correct:","o":["Choose any code that is close to what you have performed.","If there is not a code that describes exactly what you did, you need to use an unlisted code.","If you perform something similar to another code, then you can pick that code but add a modifier when submitting it.","You are allowed to unbundle codes and use multiple codes to describe what you did even if there is a more specific code that describes what you did."],"k":"B","x":"In cases where a surgery significantly deviates from any established CPT code, an unlisted code is applied. It is important to not attempt to apply a code to a procedure if it is “like” or “similar” but differs in a foundational way. Unlisted codes are most commonly applicable to surgeries that are novel or are based on new technology that significantly defines the nature of the procedure. PAGE 3903","d":"General","src":"Bailey · Contemporary Issues in Medical Practice · Q15"},{"s":"With regard to asthma, tissue eosinophils, and CRS:","o":["In CRS patients, a comorbid diagnosis of asthma is associated with low recurrence rates of CRS and need for revision functional endoscopic sinus surgery (FESS)","The Benninger et al study from 2016 on the impact of recalcitrant CRS on asthma showed that FESS for CRS in asthmatic patients did not help asthma symptoms","High levels of tissue eosinophil aggregates on histopathologic examination of tissue removed from sinus surgery patients are linked to an increased need for prednisone after endoscopic sinus surgery","Acute exacerbations of CRS are associated with good asthma control"],"k":"C","x":"Severe asthma has been shown to cause an increase in eosinophilic activation and adhesion, forming aggregates of eosinophils found on histopathologic inspection. Asthmatic patients have been found to be more susceptible to exacerbations, treatment failure, and surgical recurrence of comorbid CRS. Benninger et al found that incidence of asthma was greatly reduced post FESS. Acute exacerbations of CRS are associated with poor asthma control. PAGE","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q67"},{"s":"A 7-month-old child presents with symptomatic complete tracheal rings. What surgical approach has the highest chance of success?","o":["Tracheal resection of the complete rings","Anterior and posterior costal cartilage laryngotracheoplasty","Slide tracheoplasty","Anterior pericardial patch repair"],"k":"C","x":"Slide tracheoplasty is the definitive treatment for complete tracheal rings. It provides the best success for treatment of symptomatic patients. Option A, tracheal resection of the complete rings does shorten the trachea significantly. Option B is not a treatment for complete rings but rather SGS. Option D, pericardial patch is a historic treatment for patients with complete rings that had a high mortality rate and revision rate and is no longer used. PAGE 1467","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q58"},{"s":"In patients with OSA and symptomatic nasal obstruction, treatment to lower nasal resistance is most often associated with all the following except:","o":["Reduction in the apnea-hypopnea index (AHI) by at least","Improvement in patient-reported sleep measures","Reduction in daytime sleepiness (epworth sleepiness scale)","Improved success rates with positive pressure therapy and oral appliance therapy"],"k":"A","x":"Medical and/or surgical treatment to lower nasal resistance may lead to improved patient-reported sleep and quality of life measures, reduced daytime sleepiness, and improved success rates with positive pressure therapy and oral appliance therapy. Improvement in nasal resistance general does not significantly impact the AHI. PAGE 2518","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q6"},{"s":"A 29-year-old patient presents with a 4-month history of sneezing, clear rhinorrhea, bilateral nasal congestion, and bilateral facial pressure. Which of the following would confirm a diagnosis of CRS?","o":["Hyposmia","Headache","Nasal polyps","Cough"],"k":"C","x":"Diagnosis of chronic sinusitis requires 12 weeks of symptoms (congestion and facial pressure in this history) and an objective finding of sinus inflammation—polyps. Other objective criteria include purulence from the middle meatus or sphenoethmoid recess and imaging (most commonly CT) findings of sinus inflammation. PAGE 541","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q85"},{"s":"Which of the following features is not associated with a difficult intubation:","o":["Short thyromental distance","Short sternomental distance","Limited neck extension","Previous difficult intubation","Obesity"],"k":"E","x":"Obesity is not a known risk fact for difficult intubation. Answers A-D are known risks factors for difficult intubation. PAGE","d":"Laryngology","src":"Bailey · Laryngology · Q37"},{"s":"A patient presents with an oral tongue squamous cell carcinoma with depth of invasion 9 mm and diameter 2.5 cm. There is no clinical or radiographic lymphadenopathy. The optimal treatment includes:","o":["Partial glossectomy","Partial glossectomy and neck dissection with risk-adjusted adjuvant therapy","Definitive radiation alone","Induction chemotherapy followed by chemoradiotherapy"],"k":"B","x":"The treatment of choice for oral cancer remains upfront surgical resection at this time. For patients with a depth of invasion of 4 mm or more, the risk of microscopic spread to the draining nodal basin is substantial (~20% or greater), and the nodal basin should be addressed. Currently, elective nodal dissection in conjunction with resection of the primary site remains the standard of care. PAGE 2166","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q62"},{"s":"Which of the following is an appropriate indication for obtaining a CT scan of the sinuses during the evaluation of sinonasal pathology?","o":["Clinical improvement with medical therapy for acute bacterial rhinosinusitis","Postoperative evaluation following endoscopic sinus surgery for chronic rhinosinusitis (CRS)","Preoperative planning of sinonasal neoplasm resection","Nasal bone fracture"],"k":"C","x":"CT imaging is not indicated in uncomplicated acute sinusitis or following uncomplicated endoscopic sinus surgery for CRS. Nasal bone fractures do not require imaging. CT imaging is often critical in preoperative planning for sinonasal neoplasms. PAGE 393","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q28"},{"s":"Which reconstructive option is the most appropriate for an 8-mm full-thickness defect involving the free margin of the ala?","o":["Three layer composite graft from the auricle","Full-thickness skin graft","Primary closure","Melolabial flap"],"k":"A","x":"For a small, full-thickness defect of the alar rim, the reconstruction must address the internal and external lining along with cartilaginous support to avoid alar notching. Of the options listed, a three-layer composite graft best accomplishes this goal. The biggest drawbacks to composite graft reconstruction include concerns about graft survival and skin color match. Primary closure would create significant nostril asymmetry, full-thickness skin grafting would not address the structural or internal lining requirements, and the defect is not large enough to warrant a melolabial reconstruction. PAGE 3395","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q25"},{"s":"A 77-year-old woman has a history of brief episodes of spinning vertigo last up to a minute, triggered by head rotations. In the right Dix-Hallpike position, you see a right-beating nystagmus. No nystagmus of vertigo is present in the left Dix-Hallpike position. In the right supine roll position, there is a strong, right-beating nystagmus and vertigo. In the left supine roll position, there is a weaker, left-beating nystagmus. With the presence of a geotropic nystagmus, stronger in the right supine roll position, what is the diagnosis?","o":["BPPV of the right posterior semicircular canal","BPPV of the right lateral semicircular canal","BPPV of the left posterior semicircular canal","BPPV of the left lateral semicircular canal"],"k":"B","x":"The description of symptoms is suggestive of BPPV. The Dix-Hallpike test revealed a horizontal nystagmus, which was not in the plane of the posterior semicircular canal. The subsequent supine roll testing revealed a nystagmus that was right-beating in the right supine roll position and left-beating in the left supine roll position. This is a “geotropic” nystagmus since it beats toward the Earth in each supine roll position. The stronger nystagmus was in the right position. A simple rule of thumb to determine the affected ear in lateral canal BPPV is for whichever side the nystagmus is stronger, the eyes will beat toward the affected ear. This patient has BPPV of the right lateral semicircular canal and can be treated with a barbecue maneuver. In this case, the patient would start on the right ear down and then in 90° steps, rotate to the supine position, left ear down, and finally prone position. PAGES 3213-3215","d":"Otology","src":"Bailey · Otology and Neurotology · Q149"},{"s":"A newborn boy develops severe respiratory distress soon after birth. Multiple endotracheal intubation attempts fail and the diagnosis of tracheal agenesis is suspected, and survival is nearly contingent on the presence of which of the following anomalies?","o":["Isolated EA","Tracheal bronchus","TEF","Tracheal diverticulum"],"k":"C","x":"In newborns with tracheal agenesis, presence of TEF allows ventilation through esophageal intubation. In the absence of concomitant TEF, poor survival outcomes are expected. PAGE 1376","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q22"},{"s":"The anatomic etiology of asymmetric nostrils and the deviated columella is most often?","o":["Congenital deficiency of the medial crus","Spur of the maxillary crest","Deviation of the caudal septal border","Collapse of the upper lateral cartilages"],"k":"C","x":"The twisted columella is often the result of the caudal septal border, usually the posterior septal angle that may be dislocated off the anterior nasal spine. PAGE 3553","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q65"},{"s":"Which is a component of the zygomatico-malar complex fracture?","o":["Inferior orbital rim","Medial orbital rim—no, not a component","Superior orbital rim—no, not a component","Medial maxillary buttress—no, not a component","Lateral pterygoid plate—no, not a component"],"k":"A","x":"The components are the inferior and lateral orbital rims, the lateral maxillary buttress, and the zygomatic arch. Options B, C, D, and E are not components. PAGE 1249","d":"H&N / Plastics / Trauma","src":"Bailey · Trauma · Q29"},{"s":"Which of the following is the predominate cell type in the epidermis?","o":["Melanocytes.","Keratinocytes","Merkel cells","Langerhans cells"],"k":"B","x":"The epidermis consists of predominantly keratinocytes (80%) but also melanocytes, Langerhans cells, and Merkel cells (Table 198.1). PAGE 3303","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q12"},{"s":"The blood supply to the tonsil includes which the following?","o":["Lingual artery","Greater palatine artery","Facial artery","Options A and C"],"k":"D","x":"The palatine tonsillar complex is supplied by branches of the ascending pharyngeal (middle and inferior branches of the pharyngeal artery), lingual (dorsal lingual artery), facial (tonsillar artery), and internal maxillary arteries (descending palatine artery). PAGE 2182","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q68"},{"s":"A 3-month-old male with no significant past medical history presents with bilateral complete aural atresia. After audiometric evaluation, what is the next best step in management?","o":["Atresia repair","Hearing amplification with a nonsurgical bone conduction device","CT","Observation"],"k":"B","x":"Early amplification within the first 3 to 4 months of life is essential in infants with bilateral atresia. Initial medical and audiologic evaluations can be completed within the first few months of life, and a bone conduction hearing aid or other nonsurgical bone conduction device (eg, Cochlear Baha Softband, MedEI Adhear) can be fitted soon thereafter. Radiographic studies on infants are usually not recommended because the information is rarely applicable to immediate rehabilitative plans. In very young children, poor patient cooperation often necessitates anesthesia or results in a suboptimal study that must be repeated later. Almost all patients with cholesteatoma formation are older than 3 years, which is another reason to delay the CT evaluation until the patient is beyond that age. If elected, surgery is typically deferred until 6 to 7 years of age. By this time, accurate audiometric tests have been obtained, pneumatization of the temporal bone is well advanced, adequate development of the costal cartilage (for microtia repair) has occurred, and most children are able to cooperate with postoperative care. This timing also permits microtia repair to be well under way. PAGE 1744","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q144"},{"s":"Which structure forms the lateral aspect of the frontal recess?","o":["Uncinate process","Middle turbinate","Medial orbital wall","Frontal beak"],"k":"C","x":"The frontal ostium is bounded by the lamina papyracea laterally, the middle turbinate medially, the skull base posteriorly, and the frontal beak anteriorly. PAGE 633","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q116"},{"s":"The borders of the internal nasal valve are marked by the following structures:","o":["Caudal margin of the upper lateral cartilage, anterior head of the inferior turbinate, septum","Caudal margin of the lower lateral cartilage, anterior head of the inferior turbinate, septum","Caudal margin of the upper lateral cartilage, bony piriform aperture, septum","Lower lateral cartilage, nasal sill, columella"],"k":"A","x":"The internal nasal valve is marked by the caudal margin of the upper lateral cartilage, anterior head of the inferior turbinate, and the caudal septum. Option D describes the external nasal valve. Chapter 18, Section: “Nasal bones and Upper Lateral Cartilages”. PAGE 3516","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q57"},{"s":"Currently utilized molecular targeted drugs include:","o":["TGF-B inhibitors","p53-activating agents","EGER inhibitors","HRAS inhibitors"],"k":"C","x":"While all of these are genes and pathways implicated in HNSCC, only the EGFR inhibitor cetuximab is currently in clinical use as an FDA-approved agent. Other drugs are being developed that may eventually target such pathways, but none have reached the point of being approved. PAGE 1957","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q4"},{"s":"A 2-month-old female with a facial segmental IH in the beard distribution presents to the clinic. Which of the following is commonly associated with this facial segmental lesion?","o":["Polydactyly","Airway hemangioma","Jaundice","LUMBAR (lower body hemangioma, urogenital abnormalities, myelopathy, bone deformities, anorectal malformations, arterial anomalies, and renal anomalies) syndrome"],"k":"B","x":"Approximately 65% of patients with THs that occur in a beard distribution (ie, the chin, jawline, and preauricular areas) have associated airway involvement, and most airway IHs are localized in the supraglottic or subglottic regions. Patients must be closely followed, and treatment should be initiated when airway involvement is suspected. PAGE 1782","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q151"},{"s":"All of the following electrophysiologic tests are most helpful in the setting of acute facial paralysis (<2 weeks complete facial paralysis) except:","o":["NET","Maximal stimulation test","ENoG","EMG"],"k":"D","x":"NET, maximal stimulation test, and ENoG are all useful for assessing acute facial nerve paralysis. EMG cannot definitively differentiate between a neuropraxic nerve from a completely degenerated one in the acute phase. Therefore, it is not as useful. PAGES 2882-2884","d":"Otology","src":"Bailey · Otology and Neurotology · Q74"},{"s":"The ideal nasofacial angle is:","o":["115 to 130°","120 to 132°","90 to 105°","36 to 40°"],"k":"D","x":"The nasofacial angle is the angle prescribed by the intersection of the facial plane (glabella to pogonion) and a line tangent to the nasal dorsum. Ideally, it is 36 to 40°. Option A describes the nasofrontal angle, created by a tangent passing from the nasion through the glabella, and the dorsal line of the nose. Option B describes the nasomental angle, determined by the intersection of the line connecting the tip-defining point to the pogonion and the nasal dorsum tangent. Lastly, Option C describes the nasolabial angle, formed by a line tangent to the upper lip and a line tangent to the columella. Chapter 18, Section: “Aesthetic Angles”. PAGE 3518","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q58"},{"s":"A 65-year-old male with atrial fibrillation was diagnosed with sleep apnea. Home sleep study 2 years ago revealed AHI 50 events/h (central AHI 13 events/h), ODI 45 events/h. The patient was unable to tolerate nasal PAP treatment. He is interested in hypoglossal nerve stimulation implant. His BMI is 30 kg/m2. Which of the below conditions will not qualify him for the procedure?","o":["No documented oral appliance treatment","High number of central apneas","Anticoagulation requirement due to persistent atrial fibrillation","History of BMI 38 kg/m² prior to gastric bypass 5 years ago"],"k":"B","x":"Patient’s AHI has greater than 25% central apneas on home sleep test, which might overestimate degree of central apneas. Oral appliance treatment is not a prerequisite for HNS therapy. Anticoagulation and heart disease are not contraindications for surgery. Patient’s current BMI is below 35 kg/m2, and current sleep study has been performed after the bariatric surgery. PAGE 2568","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q31"},{"s":"Which of the following best monitors and/or best measures the integrity of cochlear blood supply?","o":["ECochG","Continuous noninvasive arterial pressure monitoring","Auditory brainstem response","Intraoperative facial nerve monitoring"],"k":"A","x":"Clinically, ECochG may be used to predict postoperative audition and is sensitive to changes in cochlear blood supply. PAGES 2709-2710","d":"Otology","src":"Bailey · Otology and Neurotology · Q27"},{"s":"A midline pit over the nasal dorsum is suggestive of which underlying lesion?","o":["Dermoid","Encephalocele","Glioma","Hemangioma"],"k":"A","x":"A midline pit over the nasal dorsum is a classic finding of a dermoid cyst. PAGE 1361","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q13"},{"s":"What concept is used to best understand decision-making around open versus endoscopic airway management?","o":["Laryngotracheal framework","Surgical medical decision-making","Preoperative screening","Methicillin-resistant Staphylococcus aureus screening"],"k":"A","x":"The framework concept describes understanding the structure of the airway dictates what surgical options are likely to be successful. Option B, decision-making influence what approach is used but is not the concept around structure. Option C, preoperative screening is important in both open and endoscopic surgery. Option D, methicillin-resistant Staphylococcus aureus screening is important in both open and endoscopic surgery. PAGE 1463","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q59"},{"s":"What peripheral vestibular structures does the caloric test evaluate?","o":["Utricle and superior vestibular nerve","Saccule and inferior vestibular nerve","Horizontal semicircular canal and superior vestibular nerve","Posterior semicircular canal and inferior vestibular nerve"],"k":"C","x":"The caloric examination delivers a stimulus that is a temperature above or below normal body temperature into the external auditory meatus. The horizontal semicircular canal is sensitive to any temperature variations in the EAC because of its close proximity to the middle ear space. The temperature change stimulates the horizontal VOR. The nystagmus generated is captured and analyzed. PAGES 2685-2687","d":"Otology","src":"Bailey · Otology and Neurotology · Q21"},{"s":"Which of the following patients require emergent facial nerve exploration?","o":["Immediate, complete facial paralysis","Progressive, complete facial paralysis","Penetrating facial wound with immediate, complete facial paralysis","All of the above"],"k":"C","x":"Patients with delayed-onset or incomplete facial paralysis merits steroid administration and observation given the high recovery rates. Patients with immediate onset complete facial paralysis require assessment of nerve excitability. If the nerve can be stimulated, then observation is indicated. If the nerve cannot be stimulated, as is likely with a penetrating facial wound, then surgical exploration is indicated. PAGES 2790-2793","d":"Otology","src":"Bailey · Otology and Neurotology · Q48"},{"s":"What is the most common cause of infectious esophagitis in immunocompetent individuals?","o":["Candida albicans","Cytomegalovirus","Staphylococci species","Human papillomavirus","Streptococcus pyogenes"],"k":"A","x":"This is most likely due to prolonged antibiotic use, GERD/LPRD, dysmotility or diabetes. PAGES 848-849","d":"Laryngology","src":"Bailey · Laryngology · Q22"},{"s":"What is the best first-line antibiotic choice to treat a child with acute bacterial rhinosinusitis?","o":["Amoxicillin","Amoxicillin/clavulanate","Levofloxacin","Linezolid"],"k":"B","x":"M. catarrhalis and H. influenzae have high rates of B-lactamase. For these reasons, amoxicillin/clavulanate over amoxicillin is the first-line treatment for acute bacterial sinusitis. Levofloxacin or linezolid (in combination with cefixime) may be considered for patients who are allergic to penicillin. PAGE 1609","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q100"},{"s":"What is the interaural attenuation level for supra-aural headphones above which masking is necessary for air conduction testing?","o":["10 dB","20 dB","30 dB","40 dB"],"k":"D","x":"When there is a threshold difference of more than 40 dB HL between the ears during air conduction testing, masking is necessary. PAGE 2649","d":"Otology","src":"Bailey · Otology and Neurotology · Q15"},{"s":"Which of the following best describes a sulcus deformity of the vocal fold?","o":["Involves a predisposition for vocal fold cancer","A derangement of the vocal fold lamina propria","Related to problems with the neuromuscular status of the vocal fold","Is solely a congenital disorder","Always occurs bilaterally"],"k":"B","x":"Sulcus vocalis implies loss of lamina propria, leading to vocal fold mucosal defects that can significantly affect healthy vocal production depending on size and location. PAGE 1038","d":"Laryngology","src":"Bailey · Laryngology · Q75"},{"s":"The supraglottic swallow maneuver sequence includes the following:","o":["Bare down, hold breath, swallow, cough","Cough, hold breath, bare down, swallow","Hold breath, bare down, cough, swallow","Hold breath, bare down, swallow, cough","None of the above"],"k":"D","x":"Option D is the appropriate sequence for the very important supraglottic swallow maneuver that is often a lifesaving maneuver to assist patients with dysphagia. PAGES 827-828","d":"Laryngology","src":"Bailey · Laryngology · Q13"},{"s":"Which of the following osteocutaneous free flaps is most commonly used for mandibular reconstruction due to length of bicortical bone that it provides?","o":["Fibula free flap","Iliac crest free flap","Osteocutaneous forearm free flap","Scapula free flap"],"k":"A","x":"The fibula free flap is generally the favored osteocutaneous free flap for mandibular reconstruction due to its relatively rapid harvest and long bicortical bone that can accept multiple osteotomies. The average fibula length is over 35 cm, though at least 6 cm of distal bone must remain in situ for ankle joint stability taking care not to disturb the distal tibiofibular joint. As more bone is required for reconstruction, the vascular pedicle is shortened, which is an important consideration particularly in the salvage setting. The iliac crest free flap provides excellent bone stock, but popularity has waned due to the relative short pedicle, increased harvest time, and risks related to donor site morbidity. The scapula free flap is gaining in popularity, but shorter pedicle, difficulty with simultaneous harvest, and sometimes thin bone stock has kept it from being the workhorse flap for mandible reconstruction at most centers. The osteocutaneous forearm flap offers a long pedicle with an associated thin, pliable skin paddle, but a relatively short segment of monocortical bone. PAGE","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q29"},{"s":"A clinician suspects a sinonasal mass and orders an MRI. Which of the following findings most likely suggests a diagnosis of esthesioneuroblastoma?","o":["A cyst located at the tumor interface with brain parenchyma","T1 hyperintense mass","Expansion of the pterygopalatine fossa","Absence of intracranial extension"],"k":"A","x":"Esthesioneuroblastoma is often characterized by intracranial invasion, cysts at the tumor interface with brain (Fig. 23.23), and a dumbbell shape with a waist at the cribriform plate (see Reference 31). PAGE 383","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q21"},{"s":"Which of the following is a shortcoming associated with cartilage graft tympanoplasty?","o":["Always results in poor hearing outcomes compared with fascia grafting due to thickness and rigidity.","Opaqueness may complicate postoperative otoscopic surveillance.","Not suitable for use with hostile middle ear environment.","Cannot be utilized for total tympanic membrane repair."],"k":"B","x":"Cartilage graft tympanoplasty is a useful technique for repairing tympanic membrane perforation, and it has a high success rate with excellent hearing outcomes. Its main shortcoming is the fact that the opaqueness of the tympanic membrane which results may complicate postoperative otoscopic surveillance. PAGES 2844-2845","d":"Otology","src":"Bailey · Otology and Neurotology · Q66"},{"s":"The auricular hillocks coalesce to form the ear in the:","o":["First trimester","Third trimester","Second trimester","At birth"],"k":"A","x":"The Hillocks of His coalesce to form the ear by 12 weeks of gestation, the first trimester. They continue to grow until they reach their final shape by 20 weeks of gestation. PAGE 3738","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q101"},{"s":"Hyperbaric oxygen (HBO) therapy may improve outcomes for patients with sudden sensorineural hearing loss (SSNHL) when:","o":["Given 2 months after onset of hearing loss","Used independently without steroids","Given within 2 weeks of onset of symptoms","Fewer than 10 treatments are given"],"k":"C","x":"There is some evidence that HBO can be helpful when used with steroids early after an episode of SSNHL. The evidence becomes weaker after 2 weeks, and there is no evidence of benefit for chronic hearing loss. When HBO is given, appropriate treatment involves 10 to 20 treatments at 2.0 to 2.5 ATM generally for 90 minutes. PAGE 3064","d":"Otology","src":"Bailey · Otology and Neurotology · Q114"},{"s":"Untreated hearing loss is associated with:","o":["Depression","Anxiety","Social isolation","All of the above"],"k":"D","x":"Hearing loss in older adults may be expected but is not benign. When individuals do not wear hearing aids (ie, when the hearing loss remains untreated), they are more likely to report depression, anxiety, and social isolation than those who do wear hearing aids. PAGES 3157-3158","d":"Otology","src":"Bailey · Otology and Neurotology · Q137"},{"s":"Which of the following represents the approach to jet ventilation with the most risk?","o":["Infraglottic","Supraglottic","Transtracheal","High frequency","Low frequency"],"k":"C","x":"Transtracheal jet ventilation is excellent for direct application of ventilation but also has the risk of barotrauma if not used properly. PAGE 913","d":"Laryngology","src":"Bailey · Laryngology · Q40"},{"s":"Which maneuver during a long-segment cervical tracheal resection provides the most release with the least additional morbidity?","o":["Suprahyoid release","Infrahyoid release","Hilar release","Pulmonary artery release","Tracheotomy"],"k":"A","x":"Suprahyoid release provides the most release with the least morbidity. Infrahyoid release is associated with increased rates of dysphagia. For hilar and pulmonary artery releases, additional dissection and incisions are required. Tracheotomy tethers the airway. PAGE 961","d":"Laryngology","src":"Bailey · Laryngology · Q48"},{"s":"Which cell type of the cochlea is most sensitive aminoglycoside ototoxicity?","o":["Inner hair cells from the apex of cochlea","Inner hair cells from the base of cochlea","Outer hair cells from the apex of cochlea","Outer hair cells from the base of cochlea"],"k":"D","x":"The outer hair cells from the base of cochlea are the most susceptible for aminoglycoside ototoxicity. PAGE 2940","d":"Otology","src":"Bailey · Otology and Neurotology · Q91"},{"s":"Which of the following genes have been shown to play a role in modulating cisplatin ototoxicity?","o":["GSTM1","GSTT1","GSTM3","GSTP1","All of the above"],"k":"E","x":"All of these genes have been shown to potentially play a role in modulating cisplatin ototoxicity. PAGES 2939-2940","d":"Otology","src":"Bailey · Otology and Neurotology · Q90"},{"s":"What type of audiometry is used for newborn hearing screening?","o":["Acoustic reflexes","OAEs","Pure tone audiometry","Auditory brainstem responses"],"k":"B","x":"OAEs are typically used for newborn hearing screening. PAGES 2644-2646","d":"Otology","src":"Bailey · Otology and Neurotology · Q14"},{"s":"One day after forehead flap reconstruction of a hemirhinectomy defect, the patient returns with purple discoloration of the reconstructed ala that demonstrates immediate return of dark blood on pinprick. What is the next best step in management?","o":["Return to the OR to debride the necrotic area.","Remove tight cutaneous sutures around the flap pedicle.","Topical nitroglycerin paste until the color improves.","Hyperbaric oxygen treatment."],"k":"B","x":"The flap in question is demonstrating partial venous congestion. This is most commonly caused by crimping of the venous outflow at the flap pivot point, so removing any tight sutures in this area is the first step to relieve venous congestion. Repeat operation for debridement should be considered for frank necrosis once the necrotic area has fully declared and is not indicated 1 day after surgery. Nitroglycerin paste and hyperbaric oxygen can be used for arterial insufficiency in local flaps but are less effective for venous congestion as in this case. PAGE 3394","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q26"},{"s":"Which lab value is most sensitive and specific for GPA (formerly Wegner granulomatosis)?","o":["cytoplasmic antineutrophil cytoplasmic antibody (C-ANCA), and a negative value confidently rules out GPA","C-ANCA, though a negative value cannot rule out GPA","perinuclear anti-neutrophil cytoplasmic antibody (P-ANCA), and a negative value confidently rules out GPA","P-ANCA, though a negative value cannot rule out GPA"],"k":"B","x":"C-ANCA and antibodies against proteinase-3 are the most sensitive and specific tests for GPA. A negative value, however, cannot rule out GPA, and cases of isolated nasal involvement are less likely to have a positive C-ANCA than systemic disease. P-ANCA or antibodies against myeloperoxidase can rarely be found in GPA but are more commonly found in eosinophilic GPA (formerly Churg-Strauss syndrome). PAGE 443","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q43"},{"s":"Which area is the thinnest bone of the anterior skull base?","o":["Lateral lamella of the cribriform plate","Planum sphenoidale","Lateral ethmoid roof","Medial lamella of the cribriform plate"],"k":"A","x":"The lateral lamella of the cribriform plate is the thinnest bone of the anterior skull base and is a site of increased risk for skull base injury and CSF leak during endoscopic sinus surgery. PAGE 302","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q4"},{"s":"Dupilumab is a monoclonal antibody that works primarily by blocking:","o":["IL-5","Eotaxin","IgE","IL-4 and IL-13"],"k":"D","x":"Dupilumab is an anti-IL-4 and IL-13 monoclonal antibody, which acts to decrease mucosal eosinophil numbers and serum IgE. Mepolizumab and reslizumab are monoclonal antibodies that target IL-5. Omalizumab is an anti-IgE monoclonal antibody. PAGE 514","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q69"},{"s":"Septal fractures are most commonly seen:","o":["Above the interface with the maxillary crest","At the caudal septum","At the junction of the cartilage with the perpendicular plate of the ethmoid bone","Right where the cartilage interfaces with the maxillary crest"],"k":"A","x":"Dislocations are more commonly seen where the quadrangular cartilage is thicker—right at the bony-cartilaginous interfaces. Septal fractures on the other hand are more common in areas where the cartilage is thinner—the central portion of the quadrangular cartilage above the maxillary crest. PAGE 1288","d":"Rhinology","src":"Bailey · Trauma · Q39"},{"s":"The first-line treatment for recurrent respiratory papillomatosis is:","o":["Debridement","Inhaled cidofovir","High-dose oral steroid burst","Azathioprine","Interferon"],"k":"A","x":"Surgical removal is the first-line treatment for recurrent respiratory papillomatosis that causes respiratory or voice problems. The other options are not regularly used treatments. PAGE","d":"Laryngology","src":"Bailey · Laryngology · Q68"},{"s":"Which of the following is required for a diagnosis of acute bacterial rhinosinusitis?","o":["Radiographic findings demonstrating sinus inflammation","A culture demonstrating a pathogenic bacteria","Purulent nasal drainage","“Double-sickening”—worsening of symptoms after a period of initial improvement"],"k":"C","x":"ABRS is a clinical diagnosis. In uncomplicated cases, CT scan and culture are not recommended. The diagnosis requires the presence of cardinal symptoms (purulent nasal drainage, nasal obstruction, and facial pain/pressure/fullness) for an appropriate time-course: at least 10 days OR with a period of worsening after initial improvement (double sickening). PAGE 468","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q54"},{"s":"A patient demonstrates aspiration after the swallow on a modified barium swallow study. This could be the result of:","o":["Inadequate hyolaryngeal elevation","Glottal incompetence","Incomplete mastication","Reduced labial closure","Velopharyngeal insufficiency"],"k":"A","x":"Aspiration can occur when inadequate hyolaryngeal elevation results in delayed or limited opening of the UES. PAGE 805","d":"Laryngology","src":"Bailey · Laryngology · Q3"},{"s":"A 37-year-old woman presents with right-sided intermittent headaches and tinnitus for several years. Examination of the head and neck is unremarkable. Otologic examination showed normal-appearing tympanic membrane. She does have a history of migraines, which has been well controlled. A CT of the temporal bone revealed a smooth bony expansion lesion in the right petrous apex. MRI with contrast demonstrated a nonenhancing, T1 hyperintense, and T2 hyperintense lesion in the same region. What is the most likely diagnosis?","o":["Arachnoid cyst","Cholesteatoma of the petrous apex","Cholesterol granuloma","Chordoma"],"k":"C","x":"The lesion described is most likely a cholesterol granuloma. It has characteristic MRI findings including hyperintensity on T1 and T2 and does not enhance with contrast. Arachnoid cyst is hypointense on T1 and hyperintense on T2. Cholesteatoma is hypointense on T1 and hyperintense on T2 and does not enhance with contrast. Chordoma is destructive and often infiltrative and does not appear as a smooth lesion. PAGES 3011-3012","d":"Otology","src":"Bailey · Otology and Neurotology · Q102"},{"s":"In congenital malformation of the ear, compared to normal course, the facial nerve course is typically which of the following?","o":["More anteriorly displaced only","More anteriorly and laterally (superficially) displaced","More posteriorly displaced only","More posteriorly and medially (deeply) displaced"],"k":"B","x":"The anterior and lateral displacement of facial nerve is most common. The anterior and lateral displacement of the facial nerve can prevent the developing stapes from coming into contact with the otic capsule, resulting in rudimentary formation. It is associated with EYAI mutations. PAGE 2026","d":"Otology","src":"Bailey · Otology and Neurotology · Q3"},{"s":"A patient undergoing total laryngectomy should first meet with the speech pathologist:","o":["Prior to surgery","During their hospital stay following surgery","At their initial postoperative visit with the surgeon","After all oncologic treatment is completed"],"k":"A","x":"A preoperative meeting with the speech pathologist allows the speech pathologist to evaluate the patient for the most appropriate communication option(s). Additionally, this educational visit will provide the patient with realistic expectations about recovery and rehabilitation. PAGE 2466","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q150"},{"s":"A 30-year-old patient is scheduled for tympanoplasty today at 7:00 am. The patient informs you, as you are receiving consent, that they had a cup of coffee with milk this morning at 6:00 am. How long should the patient’s elective surgery be delayed from the time they had the coffee?","o":["2 hours","4 hours","6 hours","8 hours","No delay and can proceed as scheduled"],"k":"B","x":"Milk products are 4 hours nothing by mouth for elective procedures. PAGE 203","d":"Otology","src":"Bailey · Basic Science/General Medicine · Q55"},{"s":"Which of the following muscles abducts the vocal fold?","o":["Cricothyroid muscle","Thyrohyoid muscle","Lateral thyroarytenoid muscle","Lateral cricoarytenoid muscle","Posterior cricoarytenoid muscle"],"k":"E","x":"The posterior cricoarytenoid muscle is the only true abductor of the vocal folds. PAGES 864-866","d":"Laryngology","src":"Bailey · Laryngology · Q27"},{"s":"Selective laryngeal reinnervation is achieved by creating a neuronal connection between which two anatomic structures?","o":["Ansa cervicalis and recurrent laryngeal nerve","Phrenic nerve and posterior cricoarytenoid","Hypoglossal nerve and recurrent laryngeal nerve","Ansa cervicalis and posterior cricoarytenoid"],"k":"A","x":"The recurrent laryngeal nerve is sutured to the unilateral (or contralateral in select cases) ANSA cervicalis nerve. PAGE 1470","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q63"},{"s":"The most common organisms in deep neck infections are:","o":["S. aureus and group A Streptococcus","Group B Streptococcus and Peptostreptococcus","Escherichia coli and Mycobacterium","H. influenzae and M. catarrhalis"],"k":"A","x":"S. aureus and group A Streptococcus are the most common bacterial isolates from deep neck space infections. PAGE","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q189"}]},{"title":"Paper 4","q":[{"s":"Which structure forms the inferior/posterior aspect of the nasal septum?","o":["Perpendicular plate of the ethmoid","Quadrangular cartilage","Maxillary crest","Vomer"],"k":"D","x":"The quadrangular cartilage forms the anterior structure of the nasal septum, the maxillary crest forms the inferior aspect, the perpendicular plate of the ethmoid is located posteriorly and superiorly while the vomer is located posterior and inferior. PAGE 583","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q96"},{"s":"A 30-year-old woman with a history of retinal hemangioblastomas and pheochromocytomas is found to have a growing erosive posterior petrous lesion. An MRI shows a T1 and T2 hyperintense lesion. Which of the following is true?","o":["This lesion is benign and should be followed with serial imaging.","This lesion should be resected via a transmastoid approach.","This lesion is typically radioresistant.","Diffusion tensor imaging sequence should be obtained to evaluate the extent of the tumor.","On histology, this lesion is likely to show cholesterol crystals."],"k":"B","x":"This patient’s history and imaging are consistent with an endolymphatic sac tumor. Her history of hemangioblastomas and pheochromocytomas suggest von Hippel-Lindau disease, a genetic disease caused by a mutation in the tumor suppressor gene located on chromosome 3. Endolymphatic sac tumors are strongly hyperintense on TI and T2 MRI and enhance with gadolinium (Table 182.2). The treatment for these tumors is surgical via a transmastoid and possibly translabyrinthine approach and postoperative radiation. PAGES 2980-2983","d":"Otology","src":"Bailey · Otology and Neurotology · Q97"},{"s":"A patient presents with a new diagnosis of hypopharynx carcinoma. The primary site measures 2.5 cm with vocal cord fixation and a 2-cm ipsilateral node with no obvious extranodal extension. No distant metastases are identified. What is the patient’s TNM classification?","o":["T2NIMO","T3NIMO","TINIMO","T3N2aM0"],"k":"B","x":"The TNM classification according to the AJCC 8th edition upstages tumors to T3 whenever there is laryngeal fixation. Any node less than 3 cm without overt extranodal extension is N1. Therefore, this patient’s TNM classification is T3N1MO0. PAGE 2233","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q81"},{"s":"Which of the following is a far-field monitoring technique used for intraoperative monitoring of the auditory system during vestibular schwannoma resections?","o":["ECochG","Continuous noninvasive arterial pressure monitoring","Auditory brainstem response (ABR)","Intraoperative facial nerve monitoring"],"k":"C","x":"Several studies have attempted to evaluate the prognostic value of intraoperative ABR although their significance is unclear, but certain intraoperative ABR patterns are associated with postoperative hearing outcomes. Persistence of wave V at the conclusion of the procedure has been associated with serviceable hearing. Similarly, complete elimination or irreversible and progressive loss of wave V indicates a high likelihood of postoperative hearing loss. PAGES 2705-2708","d":"Otology","src":"Bailey · Otology and Neurotology · Q26"},{"s":"What is the volume of normal peak compliance in a type A tympanogram?","o":["0.5 mL","1.0 mL","1.5 mL","2.0 mL"],"k":"C","x":"Type A tympanograms, which represent normal middle ear function, should have a normal peak compliance of approximately 1.5 mL. Type B tympanograms, which are flat or show significantly reduced peak compliance, can be indicative of middle ear effusion, increased stiffness of the eardrum from scarring, tympanosclerosis, cholesteatoma, or middle ear tumor. Type C tympanograms demonstrate negative pressure of the middle ear and are indicative of tympanic membrane retraction. PAGE 1684","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q131"},{"s":"A 27-year-old male presents to the emergency department after a motor vehicle accident. The patient has clear drainage from the nose, and CT scan shows a severely comminuted fracture of the posterior table of the frontal sinus. Once the patient is neurologic stable and clear for surgical repair, what would be the most appropriate surgery?","o":["Endoscopic endonasal repair with nasoseptal flap","Combined endoscopic repair with open reduction and internal fixation of the posterior table defect","Obliteration of the frontal sinus","Cranialization of the frontal sinus"],"k":"D","x":"When the posterior table is severely comminuted, cranialization of the sinus is performed with removal of the entire posterior table and all residual mucosa. The anterior table of the frontal sinus is incorporated into the intracranial space. PAGE 577","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q93"},{"s":"Although no standard objective dictate exists to aid SLPs in determining patient readiness to be discharged from voice therapy, SLPs agree that:","o":["Therapy should be four sessions in duration","Each session should be 30 minutes in length","Proficiency in sustaining sounds is necessary","Patients need to be able to use their new efficient voice production in conversation and real-life scenarios outside the therapy room","Patient hydration is vital"],"k":"D","x":"Number of sessions or length of sessions have not been shown in the literature to determine readiness for discharge. Proficiency in sustaining sounds is necessary for discharge but should not be the determining factor, rather the ability to use their voice in their home environments has been shown to be most predictive of readiness for discharge from voice therapy. PAGE 1092","d":"Laryngology","src":"Bailey · Laryngology · Q90"},{"s":"A 30-year-old woman presents to your office with complaints of recurrent submandibular swelling and tenderness that is worsened by eating. What is the best initial test to determine if she has a sialolith?","o":["Magnetic resonance imaging (MRI)","Sialendoscopy","Ultrasound","Plain films"],"k":"C","x":"Ultrasonography is an excellent tool for imaging of salivary stones. It is useful both for diagnosis and for guidance intraoperatively. It is relatively inexpensive, repeatable, dynamic, versatile as it can be used to guide surgery and accurate in trained hands; it also provides real-time images. MRI is not an optimal tool to detect calculi. However, MRI sialography is a new modification of MRI that allows delineation of the ductal system and consequently stones with high definition. Despite their similar chemical makeup, 90% of parotid calculi are radiolucent with standard facial radiographs. PAGE 664","d":"General","src":"Bailey · Comprehensive Otolaryngology · Q7"},{"s":"Which procedure/treatment has not been previously shown to reduce snoring?","o":["Injection snoreplasty","Pillar procedure","Nasopharyngeal Botox","Mandibular advancement devices"],"k":"C","x":"Injection snoreplasty is a procedure where sclerosing agents are injected into the soft palate to help reduce palatal flutter and snoring. Pillar implants are polyethylene terephthalate implants placed into the soft palate and have been shown to reduce snoring by 25% to 51%. Mandibular advancement devices can improve sleep apnea and/or snoring. Nasopharyngeal Botox is not beneficial for snoring. PAGE 2538-2540","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q19"},{"s":"Which of the following statements regarding neuromodulator treatment of chronic cough is FALSE?","o":["Gabapentin, pregabalin, and amitriptyline are recognized first-line neuromodulators for the treatment of chronic cough, with level 1 evidence supporting their treatment efficacy.","Following adequate cough control with neuromodulator use, long-term resolution of the cough is often achieved by slowly weaning off the neuromodulator.","The combination of behavioral cough management therapy in conjunction with neuromodulator use is synergistic in achieving improvement in cough frequency and severity.","Side effects are common with neuromodulator use and can be mitigated by down-titrating the dose."],"k":"B","x":"False. Many questions regarding neuromodulating medications remain unknown. Most randomized controlled trials demonstrate benefit of these medications; however, effect is generally lost following discontinuation of the medication. Gabapentin, pregabalin, and amitriptyline have level 1 randomized controlled trial evidence supporting their efficacy in the treatment of chronic cough and are therefore first-line agents. There is insufficient evidence to support a superior agent over another. Side effects are very common with neuromodulator use, and therefore, it is recommended that they be titrated accordingly, balancing cough control with adverse events. In combination with behavioral cough management under supervision of an SLP, there is a synergistic effect on cough improvement, with more durable/long-lasting cough control demonstrated. PAGE 876","d":"Laryngology","src":"Bailey · Laryngology · Q35"},{"s":"Potential complications of the coronal approach to the frontal sinus include the following except:","o":["Paresthesias of the scalp","Alopecia","CSF leak","Hypertrophic scarring","Facial nerve injury"],"k":"C","x":"CSF leak. PAGE 1310","d":"Rhinology","src":"Bailey · Trauma · Q43"},{"s":"A 21-year-old female presents 1 year after resection of a right glomus jugulare tumor with facial nerve transposition. She notes dense right facial paralysis for the past 12 months. She complains of ocular discomfort, lack of smile, and hoarseness. What is the best option for facial reanimation at this time?","o":["Masseteric-to-facial nerve transfer","Hypoglossal-facial nerve transfer","Gracilis muscle transfer","Temporalis transfer"],"k":"A","x":"The patient has an intact facial nerve with dense paralysis 12 months after surgery. Urgent masseteric-to-facial nerve transfer should be considered at this time to salvage smile musculature. Hypoglossal-facial nerve transfer is contraindicated in patients with ipsilateral CN X deficits. Chapter 205, Section “Re-Innervation: Hypoglossal-Facial Nerve Transfer”. PAGE 3476","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q43"},{"s":"Which virus has been implicated in Bell palsy?","o":["Streptococcus pneumoniae","Haemophilus influenzae","Herpes simplex virus (HSV)","Borrelia burgdorferi"],"k":"C","x":"HSV DNA has been isolated from geniculate ganglion, as well as from endoneurial fluid and muscle from patients undergoing facial nerve decompression surgery for Bell palsy. PAGES 2884-2886","d":"Otology","src":"Bailey · Otology and Neurotology · Q76"},{"s":"Which therapy program focuses exclusively on voice awareness and efficient voice production in connected speech in the first session and throughout?","o":["Flow phonation","Resonant Voice Therapy","PhoRTE","Conversation Training Therapy","Vocal function exercises"],"k":"D","x":"Conversation Training Therapy is grounded in the tenants of motor learning and asks the patient to achieve balanced phonation through conversation with clinician guidance. All other options are hierarchal approaches to voice therapy that start where generalization to connected speech is the final therapy goal. PAGE","d":"Laryngology","src":"Bailey · Laryngology · Q88"},{"s":"First-line therapy for allergic rhinitis is:","o":["Antihistamine nasal spray","Oral decongestants","Corticosteroids nasal spray","Anticholinergic nasal spray"],"k":"C","x":"Intranasal corticosteroids are the first-line therapy for allergic rhinitis. PAGE 410","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q34"},{"s":"A 38-year-old female patient presents with 1 year of progressive right-sided hearing loss and intermittent foul-smelling otorrhea despite several courses of ototopical antibiotics. She describes a remote history of a traumatic perforation secondary to a hairpin and for which she did not pursue long-term follow-up. What is the most likely classification of her current diagnosis?","o":["Congenital cholesteatoma","Primary acquired cholesteatoma","Secondary acquired cholesteatoma","Chronic otitis externa"],"k":"C","x":"Acquired cholesteatomas are categorized as either primary or secondary. Primary acquired cholesteatomas arising from retraction pockets are theorized to occur from invagination, basal cell hyperplasia, otitis media with effusion, or epithelial invasion. Secondary acquired cholesteatomas are thought to arise secondary to iatrogenic implantation of skin in the middle ear as a result of surgery, ventilation tube placement, or trauma or from epithelial invasion along the rim of a marginal perforation. Congenital cholesteatomas present in childhood and are not usually associated with otorrhea. (Chapter 151, Section “Acquired Cholesteatoma”) PAGES 2802-2804","d":"Otology","src":"Bailey · Otology and Neurotology · Q53"},{"s":"A button battery can be most reliably distinguished from a coin on x-ray based on which of the following radiographic characteristics?","o":["Measured diameter alone","Double ring or halo sign","Visible imprint from code engraved on battery","Absence of a jagged edge"],"k":"B","x":"The most consistent feature of button battery (BB) ingestion is the double ring or halo seen with zooming in on chest x-ray to differentiate it from a coin. PAGE 1515, Figure 98.6","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q73"},{"s":"Vestibular rehabilitation (VR) is used to:","o":["Improve maintenance of balance","Improve locomotion","Improve the performance of activities that require active motion","All of the above"],"k":"D","x":"VR has the ability to improve more than simply balance function. If done properly, all of the above outcomes can be achieved. PAGES 3259-3260","d":"Otology","src":"Bailey · Otology and Neurotology · Q157"},{"s":"Which is the following is not a contraindication of percutaneous tracheotomy?","o":["A patient in cervical collar with a stable airway","Unprotected airway and airway emergency","Inability to palpate the cricoid cartilage","Midline neck mass","High innominate artery"],"k":"A","x":"All the above are contraindication except for a patient in a cervical collar. Additional contraindications are children. PAGE","d":"Laryngology","src":"Bailey · Laryngology · Q46"},{"s":"The goals of cleft palate repair include which of the following?","o":["Fill the cleft palate defect and shorten the palate.","Improve speech resonance.","Realign the palatopharyngeus muscle into a more anatomic position.","Prevent OSA."],"k":"B","x":"Though infants with cleft palate cannot effectively breastfeed, they can feed adequately with specialized feeders, thus repair is not needed for feeding. The repair realigns the levator veli palatini muscle into a more anatomic position. Cleft palate repair can cause at least temporary sleep apnea as it closes off the airway. The goal of cleft palate repair is to improve speech resonance by decreasing VPI; this is performed by repairing the cleft and realigning the abnormally inserted levator veli palatini musculature into a horizontal sling. PAGE 1769","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q148"},{"s":"Which of the following is not an application of simulation in otolaryngology?","o":["Junior resident education in high-stakes procedures","Improving education in resource-limited regions","Evaluating for process errors in hospital workflow","Assessment of safety of otolaryngologist during American Board of Otolaryngology — Head and Neck Surgery examination"],"k":"D","x":"Although simulation is currently being utilized by anesthesiology in board examinations, this has not yet been adapted in otolaryngology, head and neck surgery. PAGE 3989.","d":"General","src":"Bailey · Contemporary Issues in Medical Practice · Q51"},{"s":"Which of the following characteristics of head and neck squamous cell carcinoma is thought to contribute to its immunogenicity?","o":["Anatomic location","Tumor mutational burden","Presence of oral bacteria","High expression of antigen processing machinery"],"k":"B","x":"Tumor mutational burden. Head and neck cancers have a relatively high tumor mutational burden. These mutations may function as neoantigens, which are detected as foreign by the immune system. Head and neck tumors tend to have low expression of antigen processing machinery, and the effects of anatomic location or presence of oral bacteria have not yet been well established. PAGE 1980","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q6"},{"s":"Allergic rhinitis is mediated by which of the following?","o":["IgG4","IgA","IgE","IgM"],"k":"C","x":"Exposure to an allergen results in antigen-specific IgE production in an atopic individual. Subsequent exposures to the antigen can cause an immunologic reaction that results in the symptoms of allergic rhinitis. PAGE 405","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q31"},{"s":"The decision to reduce a nasal fracture is based on:","o":["A facial bone CT scan","History and clinical examination","Plain radiographs","The age of the patient"],"k":"B","x":"New change in alignment of the nose externally and new-onset nasal airway obstruction are the two most important indications for surgical intervention. Both of these can be determined with an attentive history and physical examination. While radiographs may complement the examination and corroborate the diagnosis, they are not routinely required or essential to direct the management of isolated nasal bone fractures. PAGE 1288","d":"Rhinology","src":"Bailey · Trauma · Q37"},{"s":"During the initial presentation of a sudden hearing loss:","o":["A trial of antibiotics to clear the possible ear infection is indicated","Tuning fork examinations are incredibly inaccurate and have no role in the physical examination","Initiation of antiviral therapy can reverse the process quickly as most cases are suspected to be due to viral etiology","Early initiation of steroid therapy while trying to evaluate for possible etiologies is recommended"],"k":"D","x":"A thorough evaluation including a history and physical examination is important in evaluating a SHL. While tuning fork examinations are not perfect, when the Rinne and Weber are congruent (about 50% of the time), they can be 95% sensitive for a sensorineural loss. Empiric treatment for possible ear infection in the absence of physical examination findings causes unnecessary delay in the diagnosis and treatment of SHL. There has been no data suggesting that the addition of antiviral therapy improves the recovery of these patients. However, multiple studies have shown that the early initiation of steroid therapy results in better hearing outcomes. PAGES 3062-3063","d":"Otology","src":"Bailey · Otology and Neurotology · Q116"},{"s":"Which type of lymphoma is often treated with close observation rather than medical therapy, even in an advanced stage of disease?","o":["Diffuse large B-cell lymphoma","Follicular lymphoma","Burkitt lymphoma","Hodgkin lymphoma"],"k":"B","x":"Follicular lymphoma typically follows an indolent course, and patients often present with disseminated disease. Close observation has been shown to be noninferior treatment in asymptomatic patients and is associated with a 10-year survival rate of 85%. PAGE 2332","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q105"},{"s":"OAEs are produced by what type of cells in the cochlea?","o":["Inner hair cells","Outer hair cells","Deiter cells","Spiral ganglion cells"],"k":"B","x":"OAEs are produced by the outer hair cells. PAGES 2644-2646","d":"Otology","src":"Bailey · Otology and Neurotology · Q13"},{"s":"Appropriate management of silent sinus syndrome (SSS) includes:","o":["Early orbital implant placement","Sublabial approach to the maxillary sinus","Endoscopic maxillary antrostomy","Strabismus surgery to address diplopia"],"k":"C","x":"Initial treatment of SSS should include endoscopic surgery to ventilate the maxillary sinus. Care with uncinate removal is paramount as anatomic changes associated with SSS place patients at increased risk for orbital injury. Following maxillary sinus ventilation, some patients will have reversal of enophthalmos with return of the orbital floor to a more normal position, others may require implant placement for satisfactory cosmetic outcome. While SSS patients may have diplopia, addressing the underlying disease and eye position should resolve this issue. PAGE 195","d":"Rhinology","src":"Bailey · Basic Science/General Medicine · Q53"},{"s":"Where is the location of a Zenker diverticulum?","o":["Inferior to the CP muscle and protrudes posteriorly","Inferior to the CP muscle and protrudes anterolaterally","Superior to the CP muscle and inferior to the inferior pharyngeal constrictor muscle","Superior to the CP muscle and superior to the inferior pharyngeal constrictor muscle","Through the CP muscle fibers"],"k":"C","x":"A Zenker diverticulum is superior to the CP muscle because it is a pulsion diverticulum that is believed to be formed secondary to a dysfunctional CP muscle. Option A corresponds to a Laimer diverticulum. Option B corresponds to a Killian-Jameson diverticulum. PAGE 840","d":"Laryngology","src":"Bailey · Laryngology · Q20"},{"s":"Decisions regarding adjuvant therapy and postoperative surveillance of patients with pediatric papillary thyroid cancer are primarily influenced by:","o":["Risk group as determined by patient age","Risk group as determined by modified AJCC TNM Staging of well-differentiated thyroid cancer","Thyroid cancer predisposition syndrome","Presence of parathyroid function abnormalities"],"k":"B","x":"After determination of the modified AJCC TNM Stage, a risk group is assigned. Subsequent evaluation and treatment decisions are based on initial risk group. PAGE 1825","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q163"},{"s":"Which is the most common superior attachment of the uncinate process?","o":["To the orbit","To the skull base","To the middle turbinate","To the superior turbinate"],"k":"A","x":"The superior attachment site of the uncinate process is variable. The most common configuration is attachment to the orbit. This creates a medial drainage pathway for the frontal sinus. PAGE","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q3"},{"s":"A lawyer presents for a second opinion regarding treatment options for a T1b glottic carcinoma. He notes using his voice heavily for work. He has a history of chronic temporomandibular joint (TMJ) problems after multiple facial fractures 15 years ago. Why should this patient consider RT over endoscopic resection?","o":["Voice preservation","Bilateral disease","Reduced mouth opening","No history of prior radiation"],"k":"C","x":"Exposure/accessibility for resection is a contraindication for endoscopic surgery as described in Dr. Haughey’s 8 “T’s.” Voice preservation is always a required component of preoperative discussion with setting of expectations. PAGE 2267","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q87"},{"s":"Which of the following is not included in the commonly tested allergen groups?","o":["Stinging insects","Arthropods","Citrus","Animal dander"],"k":"C","x":"Commonly tested allergen groups include pollens, animal dander, arthropods (dust mites, cockroaches), molds, and stinging insects. PAGE 356","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q17"},{"s":"Nasal bone fractures that are most likely to be associated with other facial fractures are:","o":["Displaced nasal fractures","Fractures of the caudal aspect of the nasal bones","Fractures of the cephalic end of the nasal bones","Fractures of the nasal sidewall"],"k":"C","x":"The cephalic end of the nasal bones is thicker than the thin caudal end. For this reason, more force is required to fracture the nasal bones at their cephalic end. This therefore implies greater risk of facial bone fractures. PAGE 1285","d":"Rhinology","src":"Bailey · Trauma · Q36"},{"s":"A 70-year-old man presents with a 2-week history of a rapidly enlarging otherwise asymptomatic mass on the right upper lip. Physical examination reveals a 2-cm ulcerated circumscribed lesion with rolled margins, a keratinized central region, and an indurated base. The initial biopsy report provided by the referring physician was read as “suspicious for squamous cell carcinoma.” The next best step in management is:","o":["Perform a second incisional biopsy at the margin of the lesion","Observation for 3 months and excisional biopsy if the lesion persists","Wedge resection with 3-mm margins and primary closure","Definitive radiation therapy to the primary site","Refer for Mohs resection"],"k":"A","x":"A definitive diagnosis is needed before an appropriate treatment plan can be developed, and the history suggests a keratoacanthoma. A biopsy of the margin would allow assessment of the periphery of the lesion for accurate characterization. PAGE 2095","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q49"},{"s":"A surgeon performing a mastoidectomy observes exposure of the nerve sheath while performing a facial recess approach to place a cochlear implant. The surgeon was using copious irrigation and a diamond bur while opening the recess. Appropriate management would be:","o":["Decompression of the facial nerve 5 mm above and below the exposed tissue","Removing the incus and incus buttress to allow the facial nerve to be stimulated in the tympanic segment","Electrically stimulate the exposed segment to ensure nerve viability","Continue with surgery and carefully observe for facial nerve weakness postoperatively"],"k":"D","x":"Exposure of the facial nerve sheath, while undesirable, is not uncommon when performing a facial recess approach. Decompression of the nerve would not be required without mechanical trauma, which is unlikely with an intact nerve sheath, or thermal damage, which is unlikely when using copious irrigation and keeping the rotating bur shaft away from the nerve. Stimulation of the nerve intraoperatively might be reassuring but is not required. However, removing the incus and incus buttress will not necessarily afford acce
