atric","src":"Bailey · Pediatric Otolaryngology · Q17"},{"s":"Patients with primary ciliary dyskinesia are:","o":["More likely to have CRSwNP","More likely to have CRSsNP","Equally as likely to have either CRSwNP or CRSsNP","Not likely to develop any form of CRS"],"k":"B","x":"Patients with primary ciliary dyskinesia are most likely to develop CRSsNP. PAGE 498","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q62"},{"s":"Which of the following techniques in endoscopic medial orbital wall decompression does not help reduce the rate of postoperative diplopia?","o":["Performing a concurrent lateral orbital wall decompression to “balance” the medial orbital decompression","Preservation of the inferomedial orbital strut","Preservation of a periorbital sling over the medial rectus","Preservation of the middle turbinate"],"k":"D","x":"A “balanced” decompression, where a concurrent lateral orbital wall decompression is performed, reduces the rate of postoperative diplopia as it preserves the natural vectors of the globe. Retention of the inferomedial strut (between the medial and inferior orbital walls) and preservation of a strip of periorbita over the medial rectus helps keep the globe in a more physiologic position thus decreasing the rate of diplopia. The preservation of the middle turbinate has not been shown to affect rates of diplopia. PAGE 598","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q105"},{"s":"Which of these orbital bones contributes to the orbital rims?","o":["Sphenoid","Zygomatic","Palatine","Lacrimal"],"k":"B","x":"The zygomatic bone projects from the malar eminence superiorly toward the frontal process and medially to the maxilla to frame the inferior and lateral aspect of the orbit including the lateral aspect of the orbital rim. PAGE 2359","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q116"},{"s":"The importance of nasal breathing in OSA may be explained in part by which of following mechanisms?","o":["Nasal obstruction predisposes patients to oral breathing.","Nasal resistance impacts airflow and pharyngeal collapsibility.","Nitric oxide levels may change with nasal airflow.","All of the above."],"k":"D","x":"Nasal breathing is the ideal route for airflow during sleep. Nasal obstruction will predispose patients to mouth breathing and associated worsening airway obstruction. The Starling Resistor Model also demonstrates that nasal resistance impacts airflow and pharyngeal collapsibility. Nasal obstruction/resistance may decrease the maximal flowrate through the pharynx leading to pharyngeal collapsibility. Also, nitrous oxide is produced in the nasal cavity and may play a role in maintaining upper airway patency by regulating pharyngeal tone. When nasal breathing is obstructed, NO levels will decrease potentially leading to increased pharyngeal collapsibility. PAGES 2543-2544","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q23"},{"s":"One of the most commonly identified organisms in intracranial abscesses due to sinusitis is:","o":["P. aeruginosa","H. influenzae","S. pneumonia","Streptococcus viridians"],"k":"D","x":"Cultures from intracranial abscesses are often polymicrobial. Streptococcus viridans species (including S. milleri) and S. aureus, other Streptococcus species, and anaerobes are the most commonly isolated organisms in intracranial infections secondary to sinusitis in both children and adults. PAGE 541, Table 34.3","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q76"},{"s":"Which of the following separates the anterior and posterior ethmoid cells?","o":["Uncinate process","Onodi cell","Sinus lateralis","Basal lamella"],"k":"D","x":"The basal lamella separates the anterior and posterior ethmoid air cells. Ethmoid cells anterior to the basal lamella drain through the middle meatus, while ethmoid cells posterior to the basal lamella drain through the sphenoethmoid recess. PAGE 302","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q5"},{"s":"A 68-year-old woman presents with severe left-sided nasal obstruction following pituitary surgery 20 years ago. Nasal endoscopy shows a severe deviation of the nasal septum to the left side. What is the most likely cause of her deviated septum?","o":["Insertion of the transsphenoidal speculum through a right submucosal tunnel","Insertion of the transsphenoidal speculum through a left submucosal tunnel","Deep insertion of the transsphenoidal speculum","Failure to dissect an adequate submucosal tunnel for the insertion of the transsphenoidal speculum"],"k":"A","x":"During the transseptal approach to the sphenoid sinus for pituitary surgery, the nasal septum is disarticulated from the maxillary crest inferiorly and dislocated laterally with the placement of a long nasal speculum. This may result in nasal obstruction secondary to a deviated nasal septum. PAGE 579","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q95"},{"s":"A 48-year-old woman has 2 years of symptoms of hearing her pulse, eye movements, and footfalls loudly in her right ear. She has a history of classic migraines as a teenager and now experiences brief vertigo in response to loud sounds, as well as episodes of spinning vertigo that can last for up to 3 days, and are accompanied by light, sound, and visual motion sensitivity. She often has a throbbing headache with the episodes. Vestibular-evoked myogenic potential responses are enhanced for the right ear, and a high-resolution CT scan shows a dehiscence of the right superior semicircular canal. What are appropriate diagnoses?","o":["Méniére disease","Vestibular migraine alone","Right superior semicircular canal dehiscence alone","Right superior semicircular canal dehiscence and vestibular migraine"],"k":"D","x":"For the last 2 years, the patient has been experiencing bone conduction hyperacusis symptoms in the right ear. High-resolution CT imaging shows a dehiscence of the right superior semicircular canal, and there are enhanced VEMP responses for that ear, indicating the dehiscence is transmitting pressure. The combination of CT evidence of a dehiscence and symptoms and signs consistent with a third mobile window syndrome are needed for the diagnosis of superior canal dehiscence syndrome. The patient also has a history of migraine and has episodes of vertigo that can last for days that are accompanied by classic features of migraine such as photophobia and phonophobia. This supports a comorbid diagnosis of vestibular migraine that should be treated, prior to repairing the dehiscence. PAGES 3215-3218","d":"Otology","src":"Bailey · Otology and Neurotology · Q148"},{"s":"What is the correct deep anatomic course of a second branchial cleft anomaly (BCA)?","o":["Runs between the branches of the facial nerve, terminating at external auditory canal","Runs between the internal and external carotid arteries and superior to the glossopharyngeal and hypoglossal nerves, terminating at the tonsillar fossa","Runs between the internal and external carotid arteries and between the glossopharyngeal and hypoglossal nerves, terminating at the tonsillar fossa","Runs deep to the internal and external carotid arteries and between the glossopharyngeal and hypoglossal nerves, terminating at the pyriform sinus"],"k":"B","x":"Second BCAs are the most common branchial anomalies, composing 70% to 90% of branchial cleft lesions. They most frequently occur along the anterior border of the sternocleidomastoid muscle in the midneck region. If present, the deep tact runs between the internal and external carotid arteries and superior to the glossopharyngeal and hypoglossal nerves, terminating at the tonsillar fossa. Bilateral second BCAs, especially fistulae, should raise suspicion for an underlying syndrome such as branchio-oto-renal. PAGE 1832, Table 117.1","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q165"},{"s":"During tympanomastoidectomy surgery for cholesteatoma, the temporal lobe dura is violated, and a CSF leak is appreciated intraoperatively. What is the most appropriate form of treatment?","o":["Immediate surgical repair.","Continue the surgery and allow the leak to heal on its own.","Continue the surgery and repair the leak at another date.","Place lumbar drain.","Begin course of acetazolamide."],"k":"A","x":"Immediate surgical repair. When a leak is appreciated intraoperatively, repair should be attempted during the case, which offers the best chance at resolution. Medication or a lumbar drain can be utilized as well but not alone. PAGES 2954-2957","d":"Otology","src":"Bailey · Otology and Neurotology · Q93"},{"s":"A 6-year-old girl with typical development and no prior feeding problems choked and vomited while eating snacks prior to a soccer practice. She quickly recovered, and no intervention was required. Despite her quick recovery, she developed a fear of subsequent choking, and gradually began accepting only liquids and an extremely narrow range of accepted solid foods. There are no signs of swallowing dysfunction with intake of the accepted solids and liquids, and results of swallowing studies are normal. What is a possible diagnosis to consider?","o":["Avoidant restrictive food intake disorder (ARFID)","Anorexia","Oromotor dysfunction","Oropharyngeal dysphagia"],"k":"A","x":"The eating disturbance that occurs in children with ARFID is not attributable to a concurrent medical problem and does not occur during the course of anorexia nervosa or bulimia nervosa. ARFID is an eating or feeding disturbance characterized by an apparent lack of interest in eating or food, avoidance based on the sensory characteristics of food, and concern about the aversive consequences of eating. PAGE 1419","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q37"},{"s":"Which is the most efficient mechanism for the regulation of subglottic pressure?","o":["Diaphragm and intercostal muscle contraction","Diaphragm relaxation and abdominal contraction","Increased force of vocal fold adduction","Contraction of extralaryngeal musculature","Vocal fold abduction"],"k":"B","x":"As the diaphragm and intercostal muscles are relaxed, the thorax passively recoils to its resting size. During voice production, the rate of recoil is resisted through incremental relaxation of the muscles of inspiration and through contracting the muscles of the abdominal cavity. This phenomenon is referred to as respiratory support and is believed to be the most efficient mechanism for the regulation of subglottic pressure.","d":"Laryngology","src":"Bailey · Laryngology · Q94"},{"s":"Which of the following is false regarding botulinum toxin injection for abductor-type spasmodic dysphonia/laryngeal dystonia?","o":["The thyroarytenoid/lateral cricoarytenoid complex is the site of injection.","Bilateral injection may lead to bilateral vocal paralysis and breathing difficulties.","Unilateral injection may limit some side effects.","Incidental injection of toxin to the cricopharyngeal muscle can result in dysphagia.","The injection procedure is technically challenging."],"k":"A","x":"The target injection site is the posterior cricoarytenoid muscle. PAGE 1077","d":"Laryngology","src":"Bailey · Laryngology · Q84"},{"s":"A 45-year-old female presents with a painless left neck mass. Diagnostic angiography demonstrates a 2.5-cm mass splaying the internal and external carotid arteries. What additional imaging study would be most useful to evaluate for distant metastatic disease?","o":["18F-FDG PET/CT","Iodine meta-iodobenzylguanidine scan (MIBG)","68Ga-DOTATATE","Octreoscan"],"k":"C","x":"The patient described has imaging findings consistent with a carotid body tumor. &8Ga-DOTATATE imaging has high sensitivity and specificity for identification of multiple tumors or metastatic disease in patients with paragangliomas and is superior to the other modalities listed. PAGE 2313","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q101"},{"s":"What is the routine prescription of radiation delivered to vestibular schwannoma patients at the 50% isodose line with Gamma Knife?","o":["5 to 6 Gy","8 to 9 Gy","12 to 13 Gy","15 to 16 Gy"],"k":"C","x":"The routine prescription of radiation delivered to vestibular schwannoma patients at the 50% isodose line with Gamma Knife is 12 to 13 Gy. PAGES 3043-3045","d":"Otology","src":"Bailey · Otology and Neurotology · Q110"},{"s":"Which of the following is a potential inherent shortcoming of ossiculoplasty with a sculpted incus interposition graft?","o":["High risk of graft extrusion","Challenging revision surgery due to fixed integration with stapes head","Established track record of poor hearing outcomes in the medical literature","Inability to engage the malleus as part of ossicular reconstruction"],"k":"B","x":"The incus interposition graft is a useful technique for iculoplasty. The disadvantages of this technique are: (1) there is a low possibility of continued necrosis, (2) the incus may not be available in all cases, and (3) autologous ossicular grafts tend to fuse strongly to engage native ossicles, making revision surgery more challenging. PAGES 2849-2852","d":"Otology","src":"Bailey · Otology and Neurotology · Q63"},{"s":"A patient who reports hearing their own voice and breathing abnormally loudly especially during exercising may suffer from:","o":["Baro-challenge-induced eustachian tube dysfunction","Obstructive eustachian tube dysfunction","Patulous eustachian tube dysfunction","Cholesteatoma"],"k":"C","x":"Autophony of voice and breathing along with symptoms of aural fullness are a usual finding in patients with patulous eustachian tube dysfunction. Symptoms can often be induced by physical activity, dehydration, and prolonging talking, among others. PAGES 2755-2757","d":"Otology","src":"Bailey · Otology and Neurotology · Q38"},{"s":"T-helper 2 (Th2) cells secrete all of the following cytokines except:","o":["Interferon-gamma","Interleukin (IL)-4","IL-5","IL-13"],"k":"A","x":"Interferon-gamma is secreted by T-helper 1 (Th1) cells. IL-4, IL-5, and IL-13 all play important roles in type 2 inflammation. PAGE 334","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q11"},{"s":"Which of the following substances is not likely to be the cause of irritant-induced occupational rhinitis:","o":["Chlorine","Sulfur dioxide","Ozone","Cigarette smoke"],"k":"D","x":"Irritant-induced occupational rhinitis should be distinguished from work-exacerbated operating room in which preexisting rhinitis symptoms occur also outside the workplace but are worsened by exposures or nonspecific stimuli (cold air, cigarette smoke, exercise, temperature changes) at work. PAGE 423","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q37"},{"s":"The nasofacial angle is the angle formed by the intersection of:","o":["A line drawn from the nasion through the nasal tip—defining point and a second line drawn from the nasion through the alar facial junction","A line drawn from the nasion through the subnasale and a second line drawn from the nasion through the nasal tip— defining point","A line drawn from the nasion through the nasal tip-defining point and a second line drawn from the glabella through the pogonion","A line drawn from the glabella through the nasal tip and a second line drawn from the glabella through the subnasale"],"k":"C","x":"The nasofacial angle is formed by the intersection of a line drawn from the nasion through the nasal tip—defining point and a second line drawn from the glabella through the pogonion. The other options do not refer to any named facial angles at all. PAGE 3506","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q52"},{"s":"Which of the following is true regarding cranial nerve outcomes in vestibular schwannoma patients undergoing Gamma Knife radiosurgery?","o":["The most common cranial nerve complication after Gamma Knife radiosurgery involves the trigeminal nerve.","The cranial nerve complications after radiosurgery does not correlate with radiation dose.","Most hearing loss and balance issues after radiosurgery occur within the first 6 months after treatment.","Radiosurgery poses higher risks to cranial nerves compared to microsurgery."],"k":"C","x":"Most hearing loss and balance issues after radiosurgery occur within the first 6 months after treatment. PAGES 3048-3051","d":"Otology","src":"Bailey · Otology and Neurotology · Q111"},{"s":"Which is not a compensatory posture to improve swallowing function?","o":["Chin tuck","Head turn","Head tilt","Head back","Tongue protrusion"],"k":"E","x":"Options A, B, C, and D are all commonly used compensatory postures to improve swallowing function. PAGES 825-826","d":"Laryngology","src":"Bailey · Laryngology · Q12"},{"s":"Central compartment atopic disease is strongly associated with:","o":["Allergic fungal mucin","Ethmoid-orbital mucoceles","Inhalant allergy","Cystic fibrosis"],"k":"C","x":"Known as central compartment atopic disease, this phenotype of nasal inflammatory disease is strongly associated with inhalant allergy. PAGE 514","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q68"},{"s":"On radiographic imaging, meningioma of the petrous bone in the CPA can be distinguished from vestibular schwannomas by which of the following features?","o":["Enhancement with intravenous gadolinium contrast","Salt and pepper appearance on MRI","Hyperostosis of the petrous bone","Extension of tumor into the IAC"],"k":"C","x":"Vestibular schwannomas are usually isodense or hypodense to brain and demonstrate enhancement with contrast. They do not have calcifications or hyperostosis of the petrous bone. Both tumors can extend and expand the IAC. Meningiomas are calcified and have characteristic hyperostosis of the adjacent bone. PAGE 2963","d":"Otology","src":"Bailey · Otology and Neurotology · Q106"},{"s":"A 60-year-old female develops profuse clear rhinorrhea, headaches, and pneumocephalus 3 days after undergoing pituitary adenoma resection. Which of the following is the most appropriate management of this patient?","o":["Bed rest, stool softeners, and lumbar drain","Emergent craniotomy with decompression","Endoscopic repair with nasoseptal flap","Transseptal repair with abdominal fat graft"],"k":"C","x":"Rhinorrhea and pneumocephalus is highly suggestive of development of CSF leak due to communication between the sella and sphenoid region. The nasoseptal flap represents a significant advance in reconstruction for skull base surgery. It provides robust vascularized tissue, facilitating faster healing and tissue integration and decreasing risk of postoperative leak. Endoscopic repair, preferably with a nasoseptal flap, represents the best option for repair in this scenario. Transseptal approaches have larger been replaced by the endoscopic techniques and do not afford optimal visualization for repair. PAGE 628","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q115"},{"s":"Which of the following does not match a pathophysiologic mechanism with a potentially appropriate OSA treatment?","o":["Massive tonsillar hypertrophy: tonsillectomy","High loop gain: acetazolamide","Inadequate pharyngeal muscle response: hypoglossal nerve stimulation","High arousal threshold: hypnotic medications"],"k":"D","x":"This option represents a potentially dangerous combination. An individual with a high arousal threshold tends to have long and deep OSA events. Adding hypnotics would potentially further increase the arousal threshold and worsen OSA events leading to hypoxemia and/or hypercapnia. The other options are appropriate treatments for the listed pathophysiologic mechanism of OSA. PAGE","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q15"},{"s":"For the typical rhinoplasty patient, what is the ideal amount of columellar show?","o":["1to3mm","2to4mm","2to6mm","4to6mm"],"k":"B","x":"2 to 4 mm. PAGE 3536","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q61"},{"s":"A 65-year-old male presents to clinic complaining of dizziness when getting into and out of bed each day. A Dix-Hallpike test using Frenzel goggles elicits upbeating, geotropic torsional nystagmus. What is the most appropriate next step?","o":["Canalith repositioning maneuver (eg, Epley maneuver).","MRI.","Place an order for vestibular function testing.","Contact his PCP to adjust his blood pressure medications."],"k":"A","x":"This patient presents with classic symptoms and signs of BPPV, the most common form of dizziness in the elderly. The practicing otolaryngologist should readily recognize this diagnostic entity and feel comfortable treating the patient with a canalith repositioning maneuver (eg, Epley) at the time of diagnosis. In the event that clinic space cannot allow for such maneuver, the patient is intolerant, or returns with recurrent spells, referral to a vestibular physical therapist is appropriate. PAGES 3098-3099","d":"Otology","src":"Bailey · Otology and Neurotology · Q125"},{"s":"The highest female voices in Western classical music are called:","o":["Altos","Tenors","Basses","Sopranos","Contralto"],"k":"D","x":"For men, the lowest voices in classical singing are termed bass voices, the medium-pitched voices are termed baritone voices, and the higher voices are termed tenor voices. In women, the lower voices are termed contralto or alto voices, whereas the higher voices are termed soprano voices (Fig. 72.3). PAGE 1098 6 ie 6 6 =a ‘ow * ‘ HFEFs0 ‘ ‘ Fer, us 2 2 2 2 VFFFeo Inspr 3 J flow 2 2 2 2 us, 7 PIF 4 FIFso a 6 6 6 6 Volume Volume Volume Volume.) A B c D","d":"Laryngology","src":"Bailey · Laryngology · Q96"},{"s":"Management of patients with bilateral nasal packing should include:","o":["Hospital admission with continuous pulse oximetry is recommended because a third of patients will have desaturation events","Admission to the intensive care unit (ICU) is recommended because a third of patients will have desaturation events","Hospital admission with continuous pulse oximetry is recommended because bilateral packing will induce the nasopulmonary reflex leading to hypercarbia, hypoxia, and decreased lung volume","Admission to the ICU is recommended because bilateral packing will induce the nasopulmonary reflex leading to hypercarbia, hypoxia, and decreased lung volume","Patients can be safely sent home"],"k":"A","x":"Bilateral packing necessitates hospital admission with continuous pulse oximetry as studies have shown a third of patients will have desaturation events. PAGE 457","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q48"},{"s":"The advantages of nasoalveolar molding include:","o":["Increase in lip height of the cleft side","Decreasing lip volume on the cleft side","Decreasing tension on lip repair","Ease of placement by the family at home"],"k":"C","x":"Nasoalveolar molding brings the lateral segments of the palate and alveolus together. This decreases the gap that the muscle, mucosa, and skin must span in order to be approximated, therefore decreasing tension at the incision of the lip repair. PAGE 1765, Reference: Kapadia H, Olson D, Tse R, Susarla SM. Nasoalveolar molding for unilateral and bilateral cleft lip repair. Oral Maxillofac Surg Clin North Am. 2020;32(2):197-204.","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q146"},{"s":"What shape are type II hair cells?","o":["Flask shaped","Cylinder shaped","Spiral shaped","Spindle shaped"],"k":"B","x":"Type II hair cells are cylinder-shaped hair cell that receives its afferent innervation from bouton terminals along its basolateral edges. PAGES 2674-2675","d":"Otology","src":"Bailey · Otology and Neurotology · Q20"},{"s":"Which human papillomavirus (HPV) subtypes are responsible for 90% of laryngeal infections in RRP?","o":["HPV types 16 and 18","HPV types 31 and 33","HPV types 6 and 11","HPV types 9 and 12","All of the above"],"k":"C","x":"HPV 6 and 11 are responsible for 90% of RRP and are classified as low risk. Types 16, 18, 31, and 33 have oncogenic potential. PAGE 1524","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q76"},{"s":"The singer’s formant is composed of which formants?","o":["FO, Fl, F2","FI, F2, F3","F3, F4, FS","F4, F5, F6","GO, G1, G2"],"k":"C","x":"Vowels have characteristic first-and second-formant frequencies. These are represented as F1 and F2. The vowel is determined by the absolute FI and F2 as well as the relative relationship between them (Fig. 72.1). The higher formants (F3-F5) are responsible for the timbre of the sounds and differences in the sound characteristics between speakers. Classically trained singers learn to cluster the third, fourth, and fifth formant regions to amplify the harmonic sounds frequencies between 2,800 and 3,500 Hz4. PAGE, Average male Average female speaking pitch speaking pitch Soprano Ny Mezzo-soprano \\ ‘Ato Tenor Baritone nN Bass","d":"Laryngology","src":"Bailey · Laryngology · Q92","xi":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/wAALCAF5AqMBAREA/8QAHQABAAIDAQEBAQAAAAAAAAAAAAUGBAcIAwIBCf/EAFYQAAEDAwICAwgMCwYFAwUAAwECAwQABREGEhMhMUF0BwgUIjY3UbMVFjI1YXFzdZWxstMjNFRVVnKBkZS00TNCUlOSoRgkk8HCJWOEJkNigsMXovH/2gAIAQEAAD8A6RpSlKUpSlKUpSlKUpSlKUpSlKUpSlM0pSlKUpSlKUpSlKUpSlKUpSlKUpSlKUpSlKUpSlKUpSlKUpSlVjX095jTybfDbfemXV5MNtuOQHSg5U6UkkAENJWQcjniqlbtY3ax2NiC8wvjxuNaW2ZIBdMsbVRAsgkHe0oEnJ5jprJZ1pqAXV1DnDLbcmVDU2oMoH4JCyHAOJxColAUQUY2r5dAJxrnre+2yzsyVT2n5LVvZuD6UR222hxSrahRW4FFPikDYCrPM9QrOm6zu0WcJCJcVwG5yIPsWGxxShptxSSFZzuVsSroxtWMekyGh9S3a9TFNz1NutOQ2paVDggoUonkA24s7D1FWD4p6eqPavup5s1lLd1isNy3LilKRECi0mM8UIwSrmT155Y6ADzrGY7oNzlS7VIQ62GZD0GO+1w20tpU+22tQypfEKgHARtTtwOeeeMCFrG9wLYxHiAFMOG3I/ClrEhS3XEkKU44lQHiBIKATk9fIHZWpDjT8g9fifbFSlKUpSlKUpSlKVF3c/8AOWrtf/8ANdUTWd7uCNXG5wos96FpjhqfWwpPByvCpAcBUCrawUkYCuaj0V63LXd6isz2I6GHZNqUvwtwIBTscdQmMrmoDBbcLhyQPwZGQDke8HUuoZk+JbfCWmSu4rjKkONtOOFtMbjEFLTikBeeXT0EHFRjfdEu+HXEPtOtSYBmsuPNN  artery"],"k":"C","x":"The anterior ethmoid artery branches off of the ophthalmic artery. For patient with refractory epistaxis from this site, embolization is infrequently used due to risk of blindness from occlusion of the ophthalmic artery. PAGE 302","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q1"},{"s":"What percentage of children have obstructive sleep apnea (OSA)?","o":["Less than 1%","1.2% to 5.7%","5% to 10%","Greater than 10%"],"k":"B","x":"OSA affects about 1.2% to 5.7% and reported higher if diagnosed based upon history alone. PAGE 1562","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q86"},{"s":"The main indication for lateral neck dissection in the case of well-differentiated papillary thyroid cancer is:","o":["Patient preference","Prophylactic dissection","Histologic confirmation of lateral neck metastasis","Radiographic concern for lateral neck metastasis"],"k":"C","x":"The 2015 ATA Management Guidelines for Children with Thyroid Nodules and Differentiated Thyroid Cancer specifically requires histologic confirmation of lateral neck metastasis prior to lateral neck dissection. PAGE 1822","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q162"},{"s":"Which factor is most consistently association with adverse outcomes and increased resource utilization after sinonasal cancer surgery?","o":["Age","Frailty","Gender","Comorbidity index"],"k":"B","x":"Goel et al concluded that frailty appeared to have a stronger and more consistent association with adverse outcomes and increased resource utilization after sinonasal cancer surgery than age or comorbidity index. They suggest using frailty scoring in surgical risk stratification to guide strategies to prevent or mitigate adverse events in high-risk groups. PAGE 244","d":"General","src":"Bailey · Basic Science/General Medicine · Q67"},{"s":"On temporal bone computerized tomography of the temporal bone, morphologic abnormalities of the bony labyrinth are identified in what percentage of cases?","o":["Less than 20% of cases","20% to 40% of cases","41% to 60% of cases","61% to 80% of cases"],"k":"B","x":"Morphologic abnormalities of the bony labyrinth on temporal bone CT are identified in 20% to 40% of patients with childhood sensorineural hearing loss. PAGE 2610","d":"Otology","src":"Bailey · Otology and Neurotology · Q4"},{"s":"Intrinsic deformity and asymmetries to the upper third/nasal bones are best addressed by which sequence?","o":["Medial osteotomy-lateral osteotomy-rasping","Medial osteotomy-intermediate osteotomy-lateral osteotomy","Lateral osteotomy-medial osteotomy-intermediate osteotomy","Medial osteotomy-dorsal hump reduction-camouflage graft"],"k":"B","x":"Intrinsic deformities of the nasal bones may require an intermediate osteotomy and it should be performed before the bone is fully mobilized with medial and lateral osteotomies. PAGE 3554","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q69"},{"s":"All of the following are risks of a lumbar drain except:","o":["Meningitis","Low CSF pressure headache","CSF leakage from the spine","Brainstem herniation","Dehydration"],"k":"E","x":"Dehydration is not a risk. Meningitis can occur through ascending infection of the lumbar drain system. Headache may occur when CSF is being drawn due to low-CSF pressure. After removal, leakage of CSF can occur via the spine. If there is high pressure above the tentorium, lumbar drain placement can result in brainstem herniation, and CT imaging should be obtained prior to lumbar drain placement. PAGE 2954","d":"Otology","src":"Bailey · Otology and Neurotology · Q94"},{"s":"Which of the following statements is correct regarding RLS (restless legs syndrome)?","o":["Polysomnogram (PSG) is required for the diagnosis of RLS.","Selective serotonin reuptake inhibitors (SSRIs) may be used to treat RLS.","Serotonin is the neurotransmitter primarily involved.","Opiates may be used to treat RLS.","Hemoglobin is the serum marker most closely associated with risk for RLS."],"k":"D","x":"Opiates may be used to treat RLS. RLS is a clinical diagnosis. A low serum ferritin (<50 ug/L) may be associated with RLS; in this case, supplemental iron is often the first-line therapy. The pathophysiology of RLS involves a dopaminergic deficit. Therapies for RLS include dopamine agonists, gabapentin, and occasionally opiates or benzodiazepines. Antihistamines, some centrally acting dopamine antagonists, and most antidepressants—including SSRIs—may aggravate RLS. PAGE 2484","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q5"},{"s":"Which of the following cell types sits in closest proximity to the anterior ethmoid artery?","o":["Agger nasi cell","Supra agger cell","Supra agger frontal cell","Supra bulla cell"],"k":"D","x":"The supra bulla cell is above the bulla ethmoidalis, extending to the skull base adjacent to the anterior ethmoid artery. The agger system of cells sits anterior to the frontal recess and anterior ethmoid artery. PAGE 634","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q117"},{"s":"Constricted ears will need these maneuvers to allow and secure expansion","o":["Release of the overlying skin","Cartilage relaxing incisions","Cartilage grafting","All of the above"],"k":"D","x":"Constricted ears vary in severity. The most constricted ears need skin and cartilage incisions for release and often skin and cartilage grafting for full reconstruction. PAGES 3751-3752","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q109"},{"s":"Which medication can be continued without concern for interfering with allergy skin testing?","o":["Leukotriene receptor antagonist","Tricyclic antidepressants","H1-receptor antagonists","H2-receptor antagonists"],"k":"A","x":"First-generation H1-antihistamines should be stopped at least 3 days prior to testing, while second-and third-generation H1-antihistamines should be stopped 7 days prior to testing. H2-receptor antagonists should be stopped 48 hours prior to skin testing. Antihistamine nasal sprays should be withheld for 3 days prior to testing. The following medications have no effect on skin testing: inhaled or intranasal topical steroids, decongestants, inhaled beta agonists, intranasal cromolyn, and leukotriene receptor antagonists. PAGE 397","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q30"},{"s":"Which statement is incorrect regarding microflap surgery of the vocal fold?","o":["Involves a surgical approach for submucosal benign pathology.","Involves complete removal of vocal fold mucosa for the treatment of dysphonia.","Surgical precision and patience are required.","Microinstrumentation with various angulations is involved.","Saline or epinephrine submucosal infusion can help with the microflap elevation."],"k":"B","x":"Option B refers to vocal fold stripping, a historical procedure involving complete removal of the vocal fold mucosa. Microflap surgery is a conservation resection of submucosal pathology, limiting dissection of normal lamina propria and preserving normal tissue. Patience and specialized microinstrumentation are required. Rarely to never does a microflap surgery needs to be staged. PAGES 1044-1045","d":"Laryngology","src":"Bailey · Laryngology · Q73"},{"s":"A 53-year-old male is 2 days status post a tracheal resection and reanastomosis for a 2.5-cm tracheal squamous cell carcinoma. Following a coughing spell, he is noticed to have increased neck swelling and worsening shortness of breath. The neck wound is tense with crepitus. What would be an appropriate next step in management?","o":["Bedside opening of a portion of the cervical incision","Emergent orotracheal intubation","Placement of a nasogastric tube for presumed esophageal","Placement of a continuous positive airway pressure mask to assist with breathing"],"k":"A","x":"In this patient, the concern is for partial or complete dehiscence of the tracheal anastomosis. As a result, the air that has extravasated into the neck soft tissue can result in pressure on the airway and also may track into the mediastinum or pleural space. Opening the incision at the bedside may allow for some of this pressure to be removed and in an instance of significant dehiscence, the distal airway can be directly intubated to stabilize the situation. Emergent oral intubation can be problematic as it may require neck extension, worsening the disruption. It also may be challenging to cannulate the distal airway. The above presentation is not likely to be an esophageal leak. The use of continuous positive airway pressure may actually worsen the underlying condition due to the increase in airway pressure. PAGE 2304","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q97"},{"s":"All of the following are nucleotide components of RNA except:","o":["Adenine","Guanine","Cytosine","Thymine"],"k":"D","x":"Adenine, guanine, uracil, and cytosine are the nucleotides found in RNA molecules. Thymine is found in DNA. PAGE 101","d":"General","src":"Bailey · Basic Science/General Medicine · Q30"},{"s":"A 70-year-old man presents with a 2-year history of right-sided pulsatile tinnitus. Workup demonstrates a lesion in the region of the jugular foramen. MRI showed a bright, contrast-enhancing lesion with multiple flow voids. Surgical resection is undertaken. Intraoperatively, the internal jugular vein is tied off, and the proximal sigmoid sinus is ligated. Bleeding from which of the following is likely to occur and complicate resection of the lesion?","o":["Cavernous sinus","Superior petrosal sinus","Inferior petrosal sinus","Transverse sinus","Vertebral artery"],"k":"C","x":"The tumor is likely a glomus jugulare. Ligation of the sigmoid sinus would occlude blood flow from the transverse sinus and superior petrosal sinus. The cavernous sinus is distant from this region. The inferior petrosal sinus would provide drainage into the medial aspect of the tumor and is often encountered during surgical resection. PAGES 3027-3028","d":"Otology","src":"Bailey · Otology and Neurotology · Q103"},{"s":"A 62-year-old healthy female patient with a right cholesteatoma is recently diagnosed with a right Bell palsy by her primary care physician (PCP), who requests management advice. Which of the following is the most appropriate advice to provide to her PCP?","o":["Bell palsy is not an appropriate diagnosis. Imaging should be obtained, and the patient should be evaluated for surgery.","Bell palsy is a known complication of cholesteatoma, and steroid management should be initiated.","Facial paral: unrelated to her cholesteatoma, and a magnetic resonance imaging (MRI) should be ordered to investigate other causes.","Bell palsy is most likely due to malignant otitis externa. She should be admitted for intravenous antibiotics."],"k":"A","x":"Facial paralysis in patients with cholesteatoma can develop acutely due to infection or slowly due to chronic expansion. Surgery is indicated in either scenario. CT imaging can be helpful to identify the site of the lesion. In a patient with a history of or a known cholesteatoma, facial paralysis should not be considered idiopathic. (Chapter 151, Section “Complications—Facial Paralysis”) PAGES 2811-2814","d":"Otology","src":"Bailey · Otology and Neurotology · Q56"},{"s":"Which of the following is an advantage of CT over MR imaging for evaluation of sinonasal disease?","o":["Lack of radiation exposure","Excellent bony anatomy definition","Multiplanar reconstruction","Detailed soft tissue definition","Differentiation between secretions and soft tissue"],"k":"B","x":"MR imaging is superior to CT imaging for soft tissue pathology and characterization of opacified sinuses. However, CT provides superior definition of sinonasal bony anatomy. Both imaging options are amenable to multiplanar reconstruction. PAGE 393","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q26"},{"s":"What is the most common etiology of unilateral vocal fold paresis?","o":["Iatrogenic (surgical trauma)","Malignancy","Intubation related","Idiopathic/post-viral","Drug reaction"],"k":"D","x":"In all three case series documented, idiopathic or postviral is the most common etiology of vocal fold paresis (36%-68%). Iatrogenic causes (20%-39%) are the second most common. (Koufman JA, Postma GN, Cummins MM, et al. Vocal fold paresis. Otolaryngol Head Neck Surg. 2000;122:537-541; Stager SV. Vocal fold paresis: etiology, clinical diagnosis and clinical management. Curr Opin Otolaryngol Head Neck Surg. 2014;22:444-449; Heman-Ackah YD, Barr A. Mild vocal fold paresis: understanding clinical presentation and electromyographic findings. J Voice. 2006;20:269-281.) PAGE 1062","d":"Laryngology","src":"Bailey · Laryngology · Q80"},{"s":"For patients with a history of recurrent otitis media (last episode within 6 months) or recent antibiotic therapy, what is the suggested empiric parenteral antibiotic regimen?","o":["Vancomycin","Unasyn and Zosyn","Vancomycin and ceftazidime","Unasyn and ceftazidime"],"k":"C","x":"For patients with a history of recurrent otitis media or recent antibiotic therapy and no penicillin allergy, the recommended empiric antibiotic regimen vancomycin or linezolid plus ceftazidime or cefepime or piperacillin-tazobactam. Patients without a history of recurrent otitis media or recent antibiotic therapy can be treated with one agent: vancomycin or linezolid. In general, patients are treated with intravenous antibiotics for 7 to 10 days and then transitioned to oral antibiotics to complete a 4-week course. Treatment duration, however, can vary depending on the severity of the infection with extended courses for patients with intracranial complications. PAGES 2777-2778","d":"Otology","src":"Bailey · Otology and Neurotology · Q45"},{"s":"Which of the following is at greatest risk of injury during an endonasal midclival approach to the posterior cranial fossa?","o":["Optic nerve","Oculomotor nerve","Abducens nerve","Hypoglossal nerve"],"k":"C","x":"The 6th cranial nerve (abducens) is associated with the midclival region. It courses obliquely from intradural to interdural to Dorello canal deep to the paraclival segment of the internal carotid artery. PAGE 2389","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q122"},{"s":"Factors of subperiosteal abscess that are associated with higher rates of success with medical management (choose answer in which all factors favor medical management):","o":["Abscess volume less than 750 mm3, age less than 9 years, intraocular pressure normal","Intraocular pressure normal, medial location, frontal sinus involvement","Medial location, superior orbital vein thrombosis, age less than 9 years","Abscess volume less than 750 mm3, age greater than 9 years, medial location"],"k":"A","x":"Small, medial subperiosteal abscess (volume < 750 mm3), age less than 9 years, and lack of vision compromise all favor medical management of a subperiosteal abscess. (Chapter 34, Section “Orbital Complications: Treatment”) PAGE 542","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q79"},{"s":"The best technique for camouflaging a thin 5-cm straight scar that runs perpendicular to the relaxed skin tension lines along the cheek is:","o":["Geometric broken line closure","Serial Z-plasty","Fusiform excision","W-plasty","Dermabrasion"],"k":"A","x":"Geometric broken line closure. PAGE 3345","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q19"},{"s":"A 26-year-old male suffers laryngeal trauma in a bull riding injury. Physical examination finding includes mild anterior cervical ecchymosis, palpable laryngeal landmarks, and quiet breathing. Computed tomography displays a nondisplaced fracture of the cricoid cartilage. Bedside fiberoptic flexible laryngoscopy shows a small hematoma of the right true vocal fold but with good mobility. Which of the following is the next best step in management?","o":["Direct laryngoscopy to evaluate for mucosal lacerations and arytenoid mobility","Conservative management with close observation, humidified room air, PPIs, steroids, and voice rest","Fiberoptic intubation with a small diameter ETT","Awake tracheostomy under local anesthesia","MRI with a minimum 3 tesla device"],"k":"B","x":"The patient has a stable airway, and the imaging shows no encroachment of the airway despite the cricoid fracture. PAGE 976","d":"Laryngology","src":"Bailey · Laryngology · Q53"},{"s":"Sensation of upper airway pressure is primarily mediated through the:","o":["Superior laryngeal nerve (SLN)","RLN","Glossopharyngeal nerve","Inferior alveolar nerve","Pharyngeal plexus"],"k":"A","x":"The SLN provides sensory innervation to all mucosal aspects of the larynx to the level of the glottis. PAGE 866","d":"Laryngology","src":"Bailey · Laryngology · Q30"},{"s":"The clinical finding most suggestive of a septal fracture is:","o":["A compound fracture","A tear in the septal mucoperichondrium","Bilateral nasal bone fractures","Epistaxis"],"k":"B","x":"In a 2004 Korean study, all patients undergoing surgical treatment of isolated nasal bone fractures had the septum explored via a hemitransfixion incision. In that study, mucosal tears, noted either on rhinoscopy or endoscopic examination, were the clinical finding most suggestive of an associated septal fracture. PAGE 1288","d":"Rhinology","src":"Bailey · Trauma · Q38"},{"s":"A patient with ossicular discontinuity is expected to have what type of tympanogram?","o":["Type Ag","Type As","Type B","Type C"],"k":"A","x":"Patients with ossicular discontinuity is expected to have hypercompliant tympanic membrane, leading to a type Ag tympanogram. PAGES 2640-2642","d":"Otology","src":"Bailey · Otology and Neurotology · Q12"},{"s":"Mechanisms contributing to head and neck cancer include:","o":["Suppression of apoptosis","Suppression of cell cycle progression","Activation of antitumor immunity","Inhibition of cell proliferation"],"k":"A","x":"Head and neck tumor cells exhibit resistance to cell death that allows them to continue to proliferate unchecked. Many molecular mechanisms contribute to alter tumor suppressor genes and activate oncogenes. The tumor microenvironment of head and neck tumors is characterized by immunosuppression. PAGES 1968-1969","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q3"},{"s":"A patient has a clinically T1 tongue base squamous cell carcinoma. Which vital structures may be encountered first during complete TORS excision at the lateral deep margin?","o":["The hypoglossal nerve","The dorsal branch of lingual artery, as well as the lingual artery proper","The medial pterygoid muscle and pterygoid venous plexus","The vallecular mucosa"],"k":"B","x":"While the hypoglossal nerve can be encountered upon deep dissection through intrinsic tongue musculature, the lingual arterial vessels will be encountered at a more superficial level as dissection proceeds into the lateral tongue base/gloss tonsillar sulcus. PAGE 2220","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q78"},{"s":"A 9-year-old female presents to the clinic with 2 weeks of fever, irritability, nasal congestion, and nasal drainage. Her mom describes a similar episode 2 years ago for which she was given antibiotics. On examination, purulent nasal drainage is present. What is the best diagnosis?","o":["Acute bacterial sinusitis","Viral upper respiratory tract infection","Recurrent acute bacterial sinusitis","Chronic rhinosinusitis"],"k":"A","x":"Given the duration of symptoms longer than 10 days, this patient’s symptoms are more consistent with acute bacterial sinusitis than a viral upper respiratory tract infection. Recurrent acute bacterial sinusitis involves four or more episodes per year with complete symptom resolution between episodes. CRS involves symptom duration for > 12 weeks. PAGE 1608","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q103"},{"s":"Which of the following lasers has a wavelength of 532 nm?","o":["Carbon dioxide","Potassium titanyl phosphate (KTP)","Pulse dye laser (PDL)","Thulium","Yttrium aluminum garnet laser"],"k":"B","x":"The KTP laser wavelength is 532 nm.","d":"Laryngology","src":"Bailey · Laryngology · Q105"},{"s":"Chronic vestibular disorders:","o":["Are not treatable with VR","Require shorter rehabilitation sessions","Only respond to rehabilitation if there are fluctuating symptoms","Take longer length of rehabilitation"],"k":"D","x":"VR can work on chronic vestibular disorders, but evidence suggests that these usually take more rehabilitation sessions and a longer total rehabilitation time frame. PAGES 3259-3260","d":"Otology","src":"Bailey · Otology and Neurotology · Q160"},{"s":"A computed tomography (CT) of the sinuses shows complete opacification of the left sphenoid sinus and otherwise healthy appearing sinuses. Which of the following factors would most favor further evaluation with MRI?","o":["Speckled hyperdensity within the left sphenoid sinus","Dehiscence of bone overlying the optic canal along the lateral sphenoid wall","Osteoneogenesis surrounding the sphenoid sinus","Left-sided clear nasal drainage"],"k":"D","x":"Unilateral clear nasal drainage, especially in the setting of a single obstructed sinus, suggests possible CSF leak from an encephalocele. Another associated finding on CT may be skull base dehiscence adjacent to the opacified sinus. Hyperdensity within the sphenoid sinus is suggestive of a fungus ball, which does not require MR imaging. Osteoneogenesis suggests a chronic process and is often associated with a fungus ball. MR imaging is not helpful in assessing bone dehiscence in this area. PAGE 374","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q22"},{"s":"Induction chemotherapy improves survival in tumors at this site of the neck and neck.","o":["Nasopharynx","Oral cavity","Oropharynx","Larynx"],"k":"A","x":"While induction chemotherapy may result in objective tumor response, survival advantage has only been demonstrated in nasopharyngeal cancers. Most induction regimens involve a triple combination therapy with cisplatin, 5-fluorouracil, and paclitaxel. PAGES 2022-2023","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q24"},{"s":"Which of the following embryonic layers contribute to the tympanic membrane?","o":["Ectoderm","Mesoderm","Endoderm","All of the above"],"k":"D","x":"The tympanic membrane is derived from the first pharyngeal groove and the first pharyngeal pouch. The epidermal layer of the tympanic membrane comes from ectoderm. The fibrous layer of the tympanic membrane comes from mesoderm. The mucosal layer of the tympanic membrane comes from endoderm. PAGES 2063-2064","d":"Otology","src":"Bailey · Otology and Neurotology · Q2"},{"s":"Which of the following condition is most likely to present with hearing loss?","o":["Migraine","Vertebrobasilar insufficiency","Anteroinferior cerebellar artery occlusion","Cerebellar infarction"],"k":"C","x":"Occlusion of the anteroinferior cerebellar artery results in infarction of the dorsolateral pontomedullary region and the inferolateral cerebellum. Because the labyrinthine artery originates from the anteroinferior cerebellar artery in 80% of patients, infarction of the membranous labyrinth is a common accompaniment. Severe vertigo, nausea, and vomiting are common initial symptoms. Other symptoms include ipsilateral hearing loss, tinnitus, facial paralysis, and cerebellar asynergy. Vertebrobasilar insufficiency generally causes vertigo without hearing loss. Cerebellar infarction can cause vertigo, vomiting, and ataxia. Migraine can cause vertigo, but hearing loss is rarely present. PAGES 171-179","d":"Otology","src":"Bailey · Basic Science/General Medicine · Q45"},{"s":"Intracranial complication with the most favorable outcome is:","o":["Epidural abscess","Cavernous sinus thrombosis","Subdural abscess","Intracerebral abscess"],"k":"A","x":"Epidural and subdural abscesses are the most common intracranial sinusitis complications. These abscesses are generally a complication of frontal sinusitis due to venous communications and loosely adherent dura in the frontal region. Outcomes for epidural abscess tend to be more favorable than other intracranial infections. PAGE 544","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q78"},{"s":"The Friedman staging system to predict outcomes in palatal surgery includes all the following patient characteristics EXCEPT?","o":["Tonsil size","Friedman tongue position","Collapse pattern on flexible nasopharyngoscopy","BMI"],"k":"C","x":"The Friedman staging system, first described in 2004, continues to be commonly employed in sleep surgery clinics to aid in patient selection for palatal surgery. Components include tonsil size (1-4+), Friedman tongue position (I-IV), and BMI. Patients with lower Friedman stages have been shown to have higher success rates following palatal surgery. PAGE 2552","d":"Laryngology","src":"Bailey · Sleep Medicine and Surgery · Q30"},{"s":"When comparing the middle fossa approach compared to the transmastoid approach for CSF leak repair, all of the following are true of the middle fossa approach except:","o":["Wider access/exposure of the skull base","Technically more difficult","Higher risk of hearing loss","Generally avoided in older patients with significant comorbidities","Higher success rate"],"k":"C","x":"Higher risk of hearing loss. This is untrue, as the middle fossa approach allows access to the entire lateral skull base without having to disrupt the ossicular chain; thus, it has a lower chance of hearing loss compared to the transmastoid approach. It is technically more difficult, though has a higher success rate, likely due to the wide access it affords for addressing multiple leaks. It is generally avoided in older, less healthy patients as it requires retraction of the temporal lobe. PAGES 2954-2957","d":"Otology","src":"Bailey · Otology and Neurotology · Q95"},{"s":"Which of the following imaging modalities is most likely to remain positive, that is, with hyperintense signal, long after resolution of malignant otitis externa?","o":["Fludeoxyglucose-positron emission tomography","Technetium-99m","Gallium-67","Indium-111"],"k":"B","x":"Technetium-99m is a cheap, easily available imaging modality, which is helpful for early detection of osteomyelitis. However, it cannot be used to follow-up malignant otitis externa because the scan remains positive long after disease resolution. PAGES 2731-2733","d":"Otology","src":"Bailey · Otology and Neurotology · Q35"},{"s":"Our ability to safely swallow different consistencies and volumes of food and liquid is based upon a:","o":["Autonomic response","Involuntary response","Patterned motor response","Voluntary response","None of the above"],"k":"C","x":"Normal swallowing function utilizes a variety of behaviors and reflexes. PAGE 801","d":"Laryngology","src":"Bailey · Laryngology · Q1"},{"s":"What is involved with the basic audiologic test battery?","o":["Acoustic immittance measurements","Otoacoustic emissions (OAEs)","Pure tone audiometry","Speech audiometry","All of the above"],"k":"E","x":"The basic audiologic test battery includes acoustic immittance measurements, OAEs, pure tone audiometry, and speech audiometry. PAGES 2639-2644","d":"Otology","src":"Bailey · Otology and Neurotology · Q11"},{"s":"Which of the following surgical clinical registries is considered the precursor to the National Surgical Quality Improvement Program (NSQIP)?","o":["NSQIP-Pediatric (NSQIP-P)","VASQIP","SEER","Nationwide Inpatient Sample"],"k":"B","x":"The NSQIP is predicated on the VASQIP, which was borne out of a 1986 US Congress mandate that that VA hospital system report its surgical outcomes such that they could be compared with national averages. The program led to such strong results that it was subsequently adopted on a nationwide scale as the NSQIP. PAGE 3924","d":"General","src":"Bailey · Contemporary Issues in Medical Practice · Q23"},{"s":"During the sublabial approach to the maxillary sinus, the safest entry point to the sinus through its anterior wall is:","o":["Malar eminence","Canine fossa","Alveolar ridge","Next to the piriform opening"],"k":"B","x":"The ideal place to open the maxillary sinus is the canine fossa, which is an area of thin bone just superior to the root of the canine tooth. PAGE 573","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q92"},{"s":"Which extraocular muscle does not insert on the annulus of Zinn?","o":["Superior rectus","Superior oblique","Medial rectus","Inferior rectus","Inferior oblique","Lateral rectus"],"k":"E","x":"The annulus of Zinn is the site of origin for the four rectus muscles (superior, inferior, lateral, and medial) as well as the superior oblique muscle. These muscles, along with the inferior oblique muscle that originates from the anteromedial orbital wall, insert onto globe. PAGE 592","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q102"},{"s":"A 5-year-old female presents to the multidisciplinary craniofacial clinic with downward slanting palpebral fissures, underdeveloped zygomas, and bilateral complete aural atresia with grade 3 microtia. This patient most likely has:","o":["Crouzon syndrome","Hemifacial microsomia","Treacher Collins syndrome","PRS"],"k":"C","x":"This is a classic description of the craniofacial differences noted in Treacher Collins syndrome. Hemifacial microsomia has some of these features but would be unilateral. Crouzon is a syndromic cause of craniosynostosis and thus has deformities related to the cranium. PRS would have deformity of the mandible as the primary feature and is not classically associated with aural atresia. PAGE 1926","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q191"},{"s":"Which of the following statements best describes the Zitelli modification of the bilobed flap?","o":["Allows the incisions to fall within RSTLs","Increases the standing cutaneous deformity","Reduces trap-door deformity of the nasal skin","Uses narrower angles of each pivoting lobe"],"k":"D","x":"The design was modified by Zitelli, having each lobe be 45 to 50°, with total transposition under 100°. This modification decreased the wound closure tension and lessened the standing cutaneous deformity. PAGE 3310","d":"H&N / Plastics / Trauma","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q10"},{"s":"Since 2000, how has the microbiology of otitis media changed?","o":["There has been a reduction of pneumococcal otitis media cases.","There has been no change in the incidence of pneumococcal otitis media cases.","There has been an increase of pneumococcal otitis media cases.","There has been a reduction of Haemophilus influenzae otitis media cases."],"k":"A","x":"Since the introduction of PCV7 (2000) and PCV13 (2010), the number of pneumococcal otitis media cases have decreased. Notably, the prevalence of nonvaccine type Streptococcus pneumoniae otitis media has remained the same, and the effects of these vaccines on all causes of otitis media remains unclear. PAGES 2770-2772","d":"Otology","src":"Bailey · Otology and Neurotology · Q43"},{"s":"Muscular contractions of the levator veli palatini and tensor veli palatini muscles during swallowing usually result in which of the following?","o":["Opening of the eustachian tube","Closing of the eustachian tube","Tympanic membrane retraction","Middle ear effusion"],"k":"A","x":"Activation of the levator veli palatini muscle elevates the soft palate causing the torus tubarius to rotate medially. This acts as a scaffold upon which the tensor veli palatini muscle contraction then opens the eustachian tube valve. PAGE 2753","d":"Otology","src":"Bailey · Otology and Neurotology · Q37"},{"s":"The most likely cause of vertigo lasting hours, associated with photophobia, phonophobia, aural pressure, and neck stiffness,","o":["Multiple sclerosis","Basilar artery transient ischemic attack","Vestibular migraine","Méniére disease"],"k":"C","x":"Vestibular migraine typically presents with vertigo lasting hours, photophobia, phonophobia, aural fullness, and neck stiffness. Méniére disease typically presents with fluctuating hearing loss, and it typically does not present with photophobia/phonophobia. Basilar artery transient ischemic attack typically presents with vertigo, drop attacks, diplopia, paresthesia, headaches, and ataxia. Multiple sclerosis can sometimes present with vertigo, along with visual changes, paresthesia, muscle spasm, and weakness. PAGES 3238-3240","d":"Otology","src":"Bailey · Otology and Neurotology · Q154"},{"s":"Which is not a recommended strategy in treating adult acute respiratory distress syndrome (ARDS)?","o":["High-flow oxygen","Positive end-expiratory pressure greater than 10 cm H₂O","Plateau pressure less than 30 cm H₂O","Prone positioning"],"k":"A","x":"ARDS is a highly morbid condition, contributing to 10% of all intensive care unit admissions, with mortality that approaches 40%. The key in managing ARDS is to provide ventilation without excessive barotrauma; therefore, plateau pressure should be maintained below 30 cm HO, and prone positioning can recruit healthier lung tissue in refractory cases. Positive end-expiratory pressure greater than 10 cm H₂O is commonly required in ARDS. High-flow oxygen is not recommended in adult ARDS as it may delay mechanical ventilation and is associated with increased mortality. PAGE 43","d":"General","src":"Bailey · Basic Science/General Medicine · Q12"},{"s":"Which clinical scenario is the most appropriate for use of a stent in laryngeal trauma?","o":["Extensive lacerations and disruption of the anterior commissure and loss of anterior-posterior support of the larynx","Bilateral vocal fold hematomas","Massive laryngeal cartilage fractures with adequate stabilization","Cricotracheal separation","Exposed arytenoid cartilage"],"k":"A","x":"Stenting is essential when there is loss of integrity of the laryngeal structure and/or extensive mucosal loss. PAGE 979","d":"Laryngology","src":"Bailey · Laryngology · Q54"},{"s":"Which of the following findings would increase the risk of airway reconstruction in a patient and would need preoperative treatment prior to proceeding with reconstruction?","o":["Aspiration seen on swallow study","Sinus infection","Arytenoid prolapse","EOE"],"k":"D","x":"EOE can negatively affect airway reconstruction and should be treated prior to surgery. Option A, aspiration is a risk factor that may preclude performing a reconstruction. Treatment may not be possible so this is not always a treatable issue that would allow reconstruction. More commonly one would defer to not proceed. Option B, sinus disease is not a known risk factor for reconstruction. Option C, arytenoid prolapse is a frequently common late postoperative event. It can be encountered preoperatively but would not preclude reconstruction and can be treated at the same time as surgery. PAGE","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q60"},{"s":"Which of the following is an indication for PSG in the pediatric population?","o":["Down syndrome","Nasal septal deviation","ASD","Current tracheostomy"],"k":"A","x":"Current guidelines by the American Academy of Otolaryngology-Head and Neck Surgery recommend a referral for a PSG prior to AT in all children under 2 years of age and/or those with obesity, Down syndrome, craniofacial abnormalities, neuromuscular disorders, sickle cell disease, or mucopolysaccharidoses. Other indications for PSG include situations in which the need for surgery is uncertain or when there is disagreement between the physical examination and the severity of symptoms. PAGE 1566","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q91"},{"s":"Prior to esophageal button battery removal, mitigation strategies of honey or sucralfate should be considered within how many hours of known or suspected ingestion?","o":["12 hours","15 hours","18 hours","24 hours"],"k":"A","x":"Honey and/or sucralfate can be administered orally to patients from the time of ingestion until BB removal, and if time of ingestion is less than 12 hours (no honey should be given to patients <1 year of age). PAGE 1516","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q74"},{"s":"Which of the following medical therapies is credited with the dramatic increase in 5-year survival for AIDS patients with non-Hodgkin lymphoma (NHL) in the last 30 years?","o":["R-CHOP","R-EPOCH","Involved site radiation therapy","Highly active antiretroviral therapy (HAART)","Rituximab monotherapy"],"k":"D","x":"Survival rates for AIDS patients with NHL have improved dramatically from 40% in the preantiretroviral therapy to 80% in the current era of HAART. In addition to increased survival, HAART has been credited with a reduction in the rate of toxicity to chemotherapeutic regimens in AIDS patients. Chemotherapeutic outcomes are superior in AIDS patients who continue or start HAART than those who discontinue or postpone treatment. PAGE 2336","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q109"},{"s":"Laryngotracheitis:","o":["Is caused by bacterial suprainfection","Narrows the airway at the vocal folds","Can be caused by RSV, adenovirus, influenza, and rhinovirus","Affects children less than 6 months of age"],"k":"C","x":"Croup is predominately a viral illness causing stridor due to subglottic inflammation and stenosis. It impacts mostly children 6 months to 3 years of age. PAGE 1919","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q188"},{"s":"Which cranial nerve is involved with sensory innervation to the pinna?","o":["CNV","CN VII","CNX","All of the above"],"k":"D","x":"The sensory innervation to the pinna involves cranial nerves V, VII, and X. PAGES 2616-2617","d":"Otology","src":"Bailey · Otology and Neurotology · Q6"},{"s":"In cleft septorhinoplasty, which of the following grafts is often utilized to achieve tip support and tip projection?","o":["Spreader grafts","Caudal septal extension grafts","Premaxillary grafts","Alar batten grafts"],"k":"B","x":"Spreader grafts are often utilized for expansion of the internal nasal valve and/or reinforcing the dorsal septum. A caudal septal extension graft is often utilized in cleft septorhinoplasty to provide tip support and control tip positioning. Premaxillary grafts are often utilized in cleft rhinoplasty to support the alar base, especially in unilateral cleft nasal deformity where there is bony deficiency in the maxilla and alveolus. Alar batten grafts are typically used in supporting the external nasal valve and lateral crura. PAGE 3640","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q83"},{"s":"Mutation of which of the following genes is associated with development of CTRD?","o":["Sonic hedgehog gene","PAX3","COLIA2","EYAI"],"k":"A","x":"De novo mutations in the Sonic hedgehog gene along with other genetic variations involved in hedgehog and Wnt signaling affect encoded proteins involved in muscle and cartilage development of the respiratory tract in children with CTRD. PAGE 1374","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q23"}]},{"title":"Paper 3","q":[{"s":"During an external approach to the ethmoid sinus, what anatomical landmark is used to identify the superior limit of the dissection to avoid opening of the intracranial space?","o":["Supratrochlear artery","Supraorbital artery","Anterior ethmoidal artery","Ophthalmic artery"],"k":"C","x":"The anterior ethmoidal artery sits in the fronto-ethmoidal suture. Once posterior to the frontal sinus, dissection superior to this suture line risks entering the intracranial space. PAGE","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q94"},{"s":"Which of the following is not one of the most common causative bacteria for bacterial laryngitis?","o":["Haemophilus influenzae","Staphylococcal species","Klebsiella pneumoniae","Streptococcal species"],"k":"C","x":"Klebsiella is a not commonly seen in the larynx. Methicillin-resistant Staphylococcus aureus has been reported. PAGE","d":"Laryngology","src":"Bailey · Laryngology · Q67"},{"s":"A father brings his 4-year-old daughter to your clinic for a routine follow-up after tympanostomy tube placement 6 months prior. She did have an episode of right ear drainage 4 weeks ago that resolved with antibiotic drops. She currently has no complaints. Right tympanometry shows a flat pattern with a large ear canal volume. Which of the following is most likely given the tympanometry results?","o":["Persistent AOM","Patent tympanostomy tube","Extruded tympanostomy tube with healed tympanic membrane","Insufficient seal of the tympanometry device to the ear canal"],"k":"B","x":"The tympanogram is a graph of the acoustic energy of the reflected tone (immittance) admitted to the tympanic membrane and middle ear in response to air pressure introduced to the ear canal. Acoustic energy is transmitted to the ear canal, and an internal microphone measures the reflected sound while the pressure is varied from negative to positive. The effect on middle ear function can then be recorded graphically. A flat or rounded pattern (TW >350 daPa) with a small ear canal volume indicates a middle ear effusion, while a flat pattern with a large ear canal volume suggests a perforation or a patent tympanostomy tube. In a normal air-filled middle ear with equal pressure on both sides of the TM, the peak pressure of the tympanogram is 0 daPa. PAGE 1667","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q123"},{"s":"Gold standard confirmation of endotracheal intubation is confirmed via:","o":["Bronchoscopic confirmation of the carina via the endotracheal tube (ETT)","Bilateral air entry on auscultation","Bilateral air entry on auscultation and qualitative capnography greater than 5 breaths","Quantitative waveform capnography greater than 5 breaths","Fogging of the ETT and chest wall movement"],"k":"D","x":"This is gold standard for ETT placement. Bronchoscopy is labor and equipment intensive and not standard of care. Auscultation can be faulty of endotracheal intubation. PAGE 905","d":"Laryngology","src":"Bailey · Laryngology · Q38"},{"s":"A 59-year-old male referred for a tympanoplasty for a middle ear cholesteatoma presents for his preoperative audiogram and surgical discussion. During tympanometry, he becomes acutely dizzy. What is the most appropriate next step in surgical planning and counseling?","o":["Proceed with transcanal endoscopic ear surgery without any further workup.","Obtain a computed tomography (CT) temporal bone scan and plan for transcanal endoscopic ear surgery.","Obtain a CT temporal bone scan and plan for canal wall up (CWU) or canal wall down (CWD) mastoidectomy and tympanoplasty.","Abort surgery."],"k":"C","x":"Pressure-induced vertigo and nystagmus represents a positive fistula response indicating likely inner ear erosion by the cholesteatoma. A preoperative CT can assist in identification of the site of the fistula. The most likely site of a labyrinthine fistula is the horizontal semicircular canal. The limit of transcanal endoscopic ear surgery is the horizontal semicircular canal, and it would therefore not be an appropriate choice in this patient. Based on intraoperative findings, a CWU or CWD mastoidectomy can be performed. PAGES 2808-2809","d":"Otology","src":"Bailey · Otology and Neurotology · Q54"},{"s":"CANVAS syndrome includes all of the following signs and symptoms except:","o":["Sensory loss","Ataxia","Torsional, upbeating positioning nystagmus","Bilateral vestibular loss"],"k":"C","x":"CANVAS stands for cerebellar ataxia, neuropathy, and vestibular areflexia syndrome. Torsional, upbeating positional nystagmus is usually seen in BPPV. PAGE 3248","d":"Otology","src":"Bailey · Otology and Neurotology · Q155"},{"s":"Measures for preventing post-CI meningitis include all of the following except:","o":["Vaccination against pneumococcus","Avoiding a separate intracochlear electrode positioner","Coating the array with antibiotic solutions","Sealing the cochleostomy"],"k":"C","x":"Coating the array with antibiotic solution has not been shown to prevent postimplantation meningitis. PAGE 3119","d":"Otology","src":"Bailey · Otology and Neurotology · Q127"},{"s":"Which of the following is a commonly performed preoperative assessment in patients who will undergo airway reconstruction?","o":["FESS (sinus surgery)","Video Swallow Study (swallow study)","Lateral neck x-ray","Pulmonary function tests"],"k":"B","x":"Assessment of aspiration and swallowing is important prior to airway reconstruction. Patients may be at high risk if the airway is opened further and may result in worsening aspiration. Option A, FESS is a sinus procedure and can be easily confused with functional endoscopic evaluation of swallowing. Option C, lateral neck x-ray: Although these may be obtained in some patient, they are not commonly used in the assessment of airway stenosis that is already known. Option D, pulmonary function tests can be obtained in older patients (older than 6) but are not frequently obtained and can be difficult to get reliable results in children with airway stenosis or tracheotomy. PAGE 1462","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q57"},{"s":"The longitudinal axis of the auricle is generally within how many degrees of the angle of the nasal dorsum?","o":["5°","15°","25°","35°"],"k":"B","x":"15°. PAGES 3758, 3763","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q112"},{"s":"Which of the following recovery mechanisms occur between symptom resolution and terminal compensation?","o":["Direct repair and remodeling","Repair of ancillary systems","Disintegration of related systems","Increase use of other senses"],"k":"A","x":"VR takes advantage of two important repair mechanisms direct repair and remodeling. PAGES 3259-3260","d":"Otology","src":"Bailey · Otology and Neurotology · Q159"},{"s":"A 35-year-old woman presents to the clinic for consideration of a rhinoplasty. The surgeon performs the rhinoplasty and publishes pre-and postoperative photos without the patient’s consent. The surgeon is subject to litigation by violation of the following:","o":["Copyright law","HIPAA","Freedom of Information Act","Affordable Care Act"],"k":"B","x":"The HIPAA Privacy Rule establishes national standards to protect individuals’ medical records and other individually identifiable health information (collectively defined as “protected health information’). Sharing photos without the patient’s consent is a violation of HIPAA. PAGE 3291","d":"Rhinology","src":"Bailey · Facial Plastic and Reconstructive Surgery · Q1"},{"s":"What is the typical audiometric configuration for an individual with early noise-induced hearing loss (NIHL)?","o":["Flat","Sloping","Notched","Reverse sloping"],"k":"C","x":"Pure tone audiometric testing will often reveal a “notched” configuration with the maximum hearing loss at 3, 4, or 6 kHz in individuals with a significant history of noise exposure. However, notched audiometric configurations can be observed in the absence of significant noise exposure. The gold standard for diagnosis of NIHL includes both significant history of noise exposure reported during case history and a notched audiometric configuration. In later years, the notch is often lost as ARHL accrues at higher frequencies. PAGE 2922","d":"Otology","src":"Bailey · Otology and Neurotology · Q83"},{"s":"Spreader grafts sit between which two structures?","o":["Lower lateral cartilage and quadrangular cartilage","Perpendicular plate of the ethmoid and nasal bones","Upper lateral cartilage and quadrangular cartilage","Lower lateral cartilage and maxillary crest"],"k":"C","x":"Spreader grafts sit in a submucosal space between the upper lateral cartilages and the quadrangular cartilage. PAGE 589","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q97"},{"s":"Continuous positive airway pressure is effective for obstructive sleep apnea because it:","o":["Supports the soft palate","Compresses the tongue base","Stimulates activity of dilating muscles","Prevents pharyngeal collapse during expiration","Forces the pharynx to open after obstruction"],"k":"D","x":"Pharyngeal collapse is common in obstructive sleep apnea, and the positive pressure keeps this aspect of the airway patent during sleep. PAGE 862","d":"Laryngology","src":"Bailey · Laryngology · Q29"},{"s":"Choanal atresia or choanal stenosis can result from which of the patterns of abnormal development?","o":["Lateralization of the vomer","Lateralization of the posterolateral nasal wall","Lateralization of the pterygoid plates","Medialization of the inferior turbinate"],"k":"A","x":"Lateral growth of the vomer results in narrowing of the choana, which can cause stenosis or atresia. Lateralization of the posterolateral nasal wall and pterygoid plates widens. PAGE 1387","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q1"},{"s":"All of the following are anatomic parameters in deciding frontal sinus fracture management except:","o":["Anterior table of frontal sinus","Posterior table of frontal sinus","Frontal sinus outflow tract","Integrity of intersinus septum","Cerebrospinal fluid (CSF) leak"],"k":"D","x":"Integrity of intersinus septum. PAGE 1299","d":"Rhinology","src":"Bailey · Trauma · Q41"},{"s":"Which of the following is an effective nonsurgical therapy for pediatric OSA?","o":["Oral steroids","Modafinil","Leukotriene inhibitors","Topical oxymetazoline"],"k":"C","x":"Nasal steroids and oral leukotriene modifiers, such as montelukast, are effective medical therapies for the primary treatment of mild pediatric OSA and have also been shown to have benefit for persistent OSA following AT. Other effective, nonsurgical therapies for pediatric OSA include weight loss, oral appliance therapy, and positive airway pressure. PAGE 1567","d":"Paediatric","src":"Bailey · Pediatric Otolaryngology · Q93"},{"s":"A 45-year-old woman presents with a 2-year history of disequilibrium and left-sided hearing loss. She also reports worsening unilateral left-sided tinnitus over the last 3 months. An MRI of the brain with contrast revealed an enhancing lesion measuring 2.5 cm that involves both the left internal auditory canal (IAC) with extension into the CPA. Audiometric testing showed asymmetric left-sided sensorineural hearing loss, with a pure tone average of 65 dB and word recognition score of 8%. The hearing on the right side is normal. She would most benefit from:","o":["Continued observation","Translabyrinthine craniotomy for resection of the mass","Middle cranial fossa approach","Retrolabyrinthine approach to the CPA"],"k":"B","x":"The translabyrinthine approach is the most direct and preferred approach for resecting the tumor, especially since hearing on the left is already poor and hearing preservation is not possible. A middle fossa approach is not indicated due to large tumor size and poor hearing status. A retrolabyrinthine approach provides limited exposure to the IAC. Observation is not recommended given her symptoms. PAGES 3028-3029","d":"Otology","src":"Bailey · Otology and Neurotology · Q104"},{"s":"An 8-year-old boy presents to the emergency department with headache, exophthalmos, chemosis, complete ophthalmoplegia, and blurred vision 10 days after the start of an upper respiratory infection. What Chandler classification is most likely?","o":["I","II","III","IV"],"k":"D","x":"An orbital abscess (Chandler class [V) occurs when orbital cellulitis coalesces into a discrete collection of pus within the orbital tissues. This is a serious complication that can be associated with severe exophthalmos and chemosis, complete ophthalmoplegia, and visual impairment with a risk for progression to irreversible blindness. PAGE 537, Table 34.1","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q77"},{"s":"The light source intensity should be adjusted to a level less than or equal to which of the following to decrease risk of thermal injury and tissue desiccation during endoscopic ear surgery?","o":["20%","40%","50%","70%","90%"],"k":"C","x":"The light source of the endoscope is located at its distal end such that it is in closer proximity to critical structures of the middle ear compared to the microscope. Thermal injury and tissue desiccation is a concern with endoscopic ear surgery. Adjustment of the light source intensity to less than or equal to 50% appears to decrease the risk of these injuries. PAGE 3142","d":"Otology","src":"Bailey · Otology and Neurotology · Q133"},{"s":"Which of following increases complexity of frontal sinus surgery?","o":["Medial attachment of the uncinate process","Presence of a concha bullosa","Presence of a supra agger frontal cell","Wide (>10 mm) anterio-posterior diameter of the frontal recess"],"k":"C","x":"Cells (such as the supra agger frontal cell) that extend into the space of the frontal sinus and a narrow anterio-posterior diameter of the frontal recess result in more complicated frontal sinus dissection. PAGE 638","d":"Rhinology","src":"Bailey · Rhinology and Allergy · Q120"},{"s":"For an equivalently staged primary tumor, which of the following histopathologies would have the highest rate of regional nodal metastases?","o":["Adenoid cystic carcinoma","Chondrosarcoma","Adenocarcinoma","Squamous cell carcinoma"],"k":"D","x":"Of the choices listed, squamous cell carcinomas of the trachea have the highest rate of regional metastases and the worst prognosis. PAGE 2306","d":"H&N / Plastics / Trauma","src":"Bailey · Head and Neck Surgery · Q99"},{"s":"A 77-year-old female with bilateral hearing loss presents for further management. Previous management included bilateral hearing aids, which worked well for several years. However, she complains that her hearing ai
