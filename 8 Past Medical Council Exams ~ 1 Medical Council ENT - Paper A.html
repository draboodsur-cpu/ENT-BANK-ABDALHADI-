<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Palestine Medical Council Certificate — ENT Paper A</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--amber:#B06A00;--amber-soft:#FBEFD9;--box:#0B1418;--on-teal:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--amber:#E8A94A;--amber-soft:#3A2C14;--box:#000;--on-teal:#06201F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td:last-child{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px 8px;text-align:center}
.seg button.on{background:var(--teal);color:var(--on-teal);font-weight:600}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note{font-size:.9rem;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.timer{font:700 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.topi .t{flex:1;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.flagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
.flagbtn.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.qn{font-weight:600;font-size:.9rem;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{opacity:1}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}.exp h3.na{color:var(--amber)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;position:relative}
.grid .ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.grid .flg{box-shadow:inset 0 0 0 2px var(--amber)}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-na{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid .cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.legend .a::before{background:var(--teal-soft);border-color:var(--teal)}.legend .f::before{box-shadow:inset 0 0 0 2px var(--amber)}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3.2rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>button{flex:1}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--teal)}
</style></head><body>

<script>
const P={"title": "Palestine Medical Council Certificate — ENT Paper A", "q": [{"s": "Which of the following is not a common toxicity associated with cisplatin therapy?", "o": ["Nausea", "Vomiting", "Renal dysfunction", "Ototoxicity", "Severe neutropenia"], "k": "E", "x": "Cisplatin is relatively marrow-sparing.", "d": "General", "src": "Cummings 4th-ed review · 4th ed. Ch 4 · Chemotherapy · Cummings 7th"}, {"s": "Which soft-tissue donor site has proven to be the most versatile, reliable, and commonly used?", "o": ["The ulnar forearm flap", "The radial forearm flap", "The lateral arm flap", "The rectus flap"], "k": "B", "x": "Thin, pliable, long pedicle, sensate.\nExam tip: ALT is now an equal workhorse (low donor morbidity, two-team).", "d": "General", "src": "Cummings 4th-ed review · 4th ed. Ch 6 · Free tissue transfer · Cummings 7th"}, {"s": "The postanesthesia care unit nurse calls you to evaluate your patient for disorientation after an uvulopalatopharyngoplasty. On your arrival, the patient is snoring heavily, with 91% oxygen saturation (SaO 2 ), on 40% oxygen by face mask (FM). Appropriate immediate management is", "o": ["Administer naloxone", "Administer 100% SaO 2 via FM Ambu Bag; perform chin lift and jaw thrust to alleviate the airway obstruction", "Perform flexible nasopharyngoscopy to evaluate for edema in the posterior pharynx", "Perform immediate cricothyrotomy to secure an airway in the presence of mental status changes"], "k": "B", "x": "Basic airway maneuvers first, then adjuncts (nasal trumpet).", "d": "General", "src": "Cummings 4th-ed review · 4th ed. Ch 8 · Difficult airway · Cummings 7th"}, {"s": "Which of the following cells are important in antigen presentation (antigen- presenting cells)?", "o": ["Monocytes", "Macrophages", "Dendritic cells", "B cells", "Langerhans’ cells", "All of the above"], "k": "F", "x": "All express MHC II and present antigen; dendritic cells are the most potent.", "d": "Rhinology", "src": "Cummings 5th-ed review file · Ch 13 · Allergy & immunology · Scott-Brown 8th"}, {"s": "An otolaryngologist wishes to determine whether a history of childhood tonsillectomy affects rates of adult atopic disease. He assembles a group of adults with and without atopic disease and then compares the rates of tonsillectomy by reviewing their records. This is an example of a", "o": ["Prospective observational study", "Retrospective observational study", "Case-control study", "Case series study", "Poorly designed study"], "k": "C", "x": "Selected by outcome, look back at exposure.", "d": "General", "src": "Cummings 4th-ed review · 4th ed. Ch 15 · Outcomes research · Cummings 7th"}, {"s": "What is the preferred biopsy technique for melanoma?", "o": ["Excisional biopsy", "Shave biopsy", "Cryotherapy", "Curettage", "Electrodessication"], "k": "A", "x": "Full-thickness for Breslow depth, 1–3 mm margins.", "d": "General", "src": "Cummings 4th-ed review · 4th ed. Ch 22 · Skin lesions · Cummings 7th, NCCN"}, {"s": "Epistaxis presenting in a delayed fashion after maxillofacial trauma should raise suspicion for", "o": ["Undiagnosed nasal fracture", "Arterial aneurysm", "Continued traumatic insult to nasal mucosa", "Altered nasal airflow", "Bacterial infection"], "k": "B", "x": "Can be massive and fatal: CTA/angiography.", "d": "Rhinology", "src": "Cummings 4th-ed review · 4th ed. Ch 40 · Epistaxis · Cummings 7th"}, {"s": "An open roof deformity can occur after", "o": ["Bony hump removal with inadequate osteotomies", "Excessive resection of lower lateral crura", "Avulsion of the upper lateral cartilages", "Excessive soft tissue in the supratip", "Over-resection of septal cartilage"], "k": "A", "x": "Nasal bones not medialized.", "d": "General", "src": "Cummings 4th-ed review · 4th ed. Ch 47 · Revision rhinoplasty · Cummings 7th"}, {"s": "The most common bacterial causes of acute rhinosinusitis are", "o": ["Staphylococcus aureus and anaerobes", "Streptococcus viridans, S. aureus, and anaerobes", "Haemophilus influenza and Streptococcus pneumonia", "Pseudomonas and coagulase-negative staphylococci"], "k": "C", "x": "Plus M. catarrhalis.", "d": "Rhinology", "src": "Cummings 4th-ed review · 4th ed. Ch 50 · Infectious rhinosinusitis · Cummings 7th"}, {"s": "Children may have a physiologic immunodeficiency predisposing them to chronic rhinosinusitis until what age?", "o": ["6", "8", "10", "12", "14"], "k": "D", "x": "Book key D.", "d": "Rhinology", "src": "Cummings 4th-ed review · 4th ed. Ch 52 · Medical management · Cummings 7th"}, {"s": "Absolute indications for endoscopic sinus surgery include all of the following except", "o": ["Mucoceles", "Headaches", "CSF rhinorrhea", "Complications of rhinosinusitis", "Tumors"], "k": "B", "x": "Headache alone is not an indication.", "d": "Rhinology", "src": "Cummings 4th-ed review · 4th ed. Ch 53 · Primary sinus surgery · Cummings 7th"}, {"s": "Which of the following is not necessary to make the diagnosis of chronic rhinosinusitis?", "o": ["CT scans with mucosal thickening", "Culture result for resistant bacteria", "History with length of symptoms greater than 3 months", "Characteristic findings on nasal endoscopy"], "k": "B", "x": "Symptoms ≥12 weeks plus objective evidence (endoscopy or CT).", "d": "Rhinology", "src": "Cummings 4th-ed review · 4th ed. Ch 54 · Revision ESS · Cummings 7th"}, {"s": "Which would be the best antimicrobial for the treatment of acute suppurative sialadenitis?", "o": ["Erythromycin", "Tetracycline", "β-Lactamase-resistant penicillin", "Fluoroquinolone"], "k": "C", "x": "β-lactamase producers in ~75%; vancomycin/linezolid if MRSA.", "d": "H&N / Plastics / Trauma", "src": "Cummings 4th-ed review · 4th ed. Ch 58 · Salivary inflammation · Cummings 7th"}, {"s": "Warthin’s tumors are thought to arise from which of the following cell types?", "o": ["Acinar cells", "Intercalated duct cells", "Striated duct cells", "Excretory duct cells", "Myoepithelial cells"], "k": "C", "x": "Ductal inclusions within intraparotid lymph nodes.", "d": "H&N / Plastics / Trauma", "src": "Cummings 4th-ed review · 4th ed. Ch 60 · Benign salivary tumors · Cummings 7th"}, {"s": "Which statement regarding postoperative radiation is true?", "o": ["Postoperative radiation is given for any parotid malignancy.", "Postoperative radiation improves overall survival and regional control.", "Postoperative radiation is only given for positive margins and unresectable disease.", "Postoperative radiation improves regional control in advanced stage tumors.", "Because neuron therapy has an improved radiobiologic effect on salivary cancers, it has become the standard technique for postoperative radiation."], "k": "D", "x": "Indications: high grade, nodes, T3/4, close/positive margins, PNI.", "d": "H&N / Plastics / Trauma", "src": "Cummings 4th-ed review · 4th ed. Ch 61 · Salivary malignancy · Cummings 7th, NCCN"}, {"s": "Which of the following classifications of medications does not cause salivary hypofunction?", "o": ["Tricyclic antidepressants", "Antihistamines", "Cox-2 nonsteroidal antiinflammatories", "Diuretics"], "k": "C", "x": "Others are anticholinergic or dehydrating.", "d": "H&N / Plastics / Trauma", "src": "Cummings 4th-ed review · 4th ed. Ch 65 · Systemic disease in mouth · Cummings 7th"}, {"s": "In patients with an oral tongue squamous cell carcinoma and a depth of invasion of 4 mm", "o": ["Elective treatment of the neck is not necessary.", "The risk of perineural invasion within the primary is significantly increased.", "Elective treatment of the N 0 neck is advocated, because the risk of occult metastasis exceeds 20%.", "Resection of the primary tumor with a minimum of 2-cm margins is required.", "The likelihood of bilateral neck metastases is greater than 30%."], "k": "C", "x": "DOI predicts nodes.\nExam tip: D'Cruz (NEJM 2015): elective neck dissection improved survival in cN0 early oral SCC. AJCC 8th: DOI ≤5 mm T1, >5–10 mm T2, >10 mm T3.", "d": "H&N / Plastics / Trauma", "src": "Cummings 4th-ed review · 4th ed. Ch 70 · Oral cavity cancer · AJCC 8th, NCCN"}, {"s": "Which of the following statements regarding the management of juvenile nasopharyngeal angiofibroma are true?", "o": ["Best results are obtained by the combination of surgery and adjuvant radiotherapy.", "The main consideration to the surgical approach is the age of the patient.", "Endoscopic resection is ideal for all tumors as it avoids facial incisions and soft tissue and bony disruption.", "Locally advanced tumors with intracranial extension can be effectively managed with radiotherapy alone.", "Recurrence seldom occurs if the tumor is completely removed."], "k": "D", "x": "RT alone achieves ~80% control for advanced disease.\nExam tip: Endoscopic resection after embolization now handles most tumors, including many with skull base extension.", "d": "H&N / Plastics / Trauma", "src": "Cummings 4th-ed review · 4th ed. Ch 73 · Nasopharyngeal tumors · Cummings 7th, Scott-Brown 8th"}, {"s": "A 24-year-old, otherwise healthy man is seen with a 3-day history of sore throat, low-grade fever, nasal stuffiness, and a nonproductive cough. The oropharynx has mild erythema on examination. Which of the following is the most likely diagnosis?", "o": ["Laryngopharyngeal reflux", "Group A-α-hemolytic Streptococcus pyogenes pharyngitis", "Fungal pharyngitis", "Allergy exacerbation", "Viral pharyngitis"], "k": "E", "x": "Cough and coryza argue against strep.", "d": "H&N / Plastics / Trauma", "src": "Cummings 4th-ed review · 4th ed. Ch 74 · Adult pharyngitis · Cummings 7th"}, {"s": "What is the international classification of obstructive sleep apnea syndrome as a sleep disorder?", "o": ["Intrinsic dyssomnia", "Extrinsic dyssomnia", "Intrinsic parasomnia", "Extrinsic parasomnia"], "k": "A", "x": "Book key A.\nExam tip: ICSD-3 (2014) lists OSA under 'sleep-related breathing disorders'.", "d": "General", "src": "Cummings 4th-ed review · 4th ed. Ch 75 · Sleep apnea · Cummings 7th"}, {"s": "Which of the following statements regarding treatment of oropharyngeal carcinoma is true?", "o": ["For early tonsil cancer, there is no significant difference in survival between surgery and primary therapy.", "Primary closure of a tongue base defect can be performed only if less than 25% of the tongue base is removed.", "Tumors of the upper pharyngeal wall are usually accessible through a transoral route.", "For soft palate cancer, radiotherapy should be considered for lesions less than 2 cm in diameter.", "Wide resection of the tonsil and surrounding soft tissues can result in significant adverse effects on function"], "k": "A", "x": "Equivalent outcomes; choose by function.\nExam tip: ORATOR trial: TORS ± neck vs RT for early OPSCC: similar swallowing QOL, different toxicity profiles.", "d": "H&N / Plastics / Trauma", "src": "Cummings 4th-ed review · 4th ed. Ch 76 · Oropharyngeal cancer · Cummings 7th, NCCN"}, {"s": "A patient receives surgery, radiation, and chemotherapy for an oropharyngeal squamous cell carcinoma. One month after the completion of therapy, the most accurate way to assess for residual tumor is", "o": ["Computed tomography (CT)", "Magnetic resonance imaging", "Endoscopy", "Positron emission tomography (PET)", "Combined PET/CT"], "k": "E", "x": "Book key E: combined metabolic and anatomic.\nUpdate: Timing matters: PET/CT at ~12 weeks after (chemo)RT avoids inflammatory false positives (PET-NECK trial). At 1 month, imaging mainly serves as a baseline.", "d": "H&N / Plastics / Trauma", "src": "Cummings 4th-ed review · 4th ed. Ch 78 · Pharynx/esophagus imaging · Cummings 7th, NCCN"}, {"s": "CT is superior to an esophagram in the assessment of", "o": ["Prevertebral spread of a hypopharyngeal tumor", "Staging of an esophageal carcinoma", "Postsurgical leak", "Fourth brachial cleft fistula", "Recurrence in a jejunal interposition graft"], "k": "B", "x": "Cross-sectional extent and nodes.", "d": "H&N / Plastics / Trauma", "src": "Cummings 4th-ed review · 4th ed. Ch 78 · Pharynx/esophagus imaging · Cummings 7th"}, {"s": "A white man with a history of GERD and Barrett’s esophagus is initially seen with rapidly progressive solid food dysphagia. He is found to have a neoplastic lesion in the distal esophagus at the gastroesophageal junction. Biopsy of this lesion is most likely to reveal which of the following", "o": ["Leiomyoma", "Adenocarcinoma", "Squamous cell carcinoma", "Lymphoma"], "k": "B", "x": "Barrett's → adenocarcinoma.", "d": "Laryngology", "src": "Cummings 4th-ed review · 4th ed. Ch 80 · Esophagus · Cummings 7th"}, {"s": "Which of the following tumor types is treated primarily with radiation therapy in the hypopharynx?", "o": ["Squamous cell carcinoma", "Lymphoepithelioma", "Adenosquamous carcinoma", "Basosquamous carcinoma", "Synovial cell carcinoma"], "k": "B", "x": "Highly radiosensitive.", "d": "H&N / Plastics / Trauma", "src": "Cummings 4th-ed review · 4th ed. Ch 82 · Hypopharyngeal cancer · Cummings 7th"}, {"s": "Which of the following statements regarding the treatment of advanced hypopharynx cancer is true?", "o": ["Conventional external beam irradiation is the treatment of choice for T 4 hypopharyngeal cancer.", "When treated by radical surgery and postoperative irradiation, these cancers usually recur in half the cases at the primary site.", "The most frequent evolution after radical surgery and postoperative irradiation is the appearance of distant metastases.", "Large randomized trials have concluded in a similar outcome either after radical surgery and postoperative irradiation or after definitive irradiation alone.", "Adjuvant chemotherapy has improved the outcome after either radical surgery and postoperative irradiation or definitive irradiation alone."], "k": "C", "x": "~80% locoregional control, then distant failure.", "d": "H&N / Plastics / Trauma", "src": "Cummings 4th-ed review · 4th ed. Ch 83 · RT/chemo hypopharynx & esophagus · Cummings 7th"}, {"s": "Which of the following flaps is the most susceptible to ischem sure (CPAP)", "Adenotonsillectomy", "Tracheotomy", "Supplemental oxygen"], "k": "B", "x": "Usually curative in healthy children.", "d": "Paediatric", "src": "Cummings 4th-ed review · 4th ed. Ch 182 · Pediatric OSA · Cummings 7th"}, {"s": "Which radiologic study is the most efficient for identifying a normal thyroid gland before performing excision of the thyroglossal duct cyst?", "o": ["Technetium-99 scan", "Iodine-131 scan", "Magnetic resonance imaging with gadolinium", "Ultrasonography of the neck"], "k": "D", "x": "Practical and radiation-free.", "d": "Paediatric", "src": "Cummings 4th-ed review · 4th ed. Ch 184 · Pediatric neck masses · Cummings 7th"}, {"s": "After the neonatal period, suppurative lymphadenopathy may occur as the result of infection with any of the following organisms except", "o": ["Pseudomonas species", "Staphylococcus aureus", "Haemophilus influenza", "Group A β-streptococcus"], "k": "A", "x": "Not a pathogen in immunocompetent children.", "d": "Paediatric", "src": "Cummings 4th-ed review · 4th ed. Ch 184 · Pediatric neck masses · Cummings 7th"}, {"s": "Which of the following is frequently associated with laryngomalacia?", "o": ["Nasal septal deviation", "Developmental delay", "Gastroesophageal reflux disease", "Auricular deformities", "Disorders of the pituitary gland"], "k": "C", "x": "Treat reflux; supraglottoplasty if severe (failure to thrive, apnea, cor pulmonale).", "d": "Paediatric", "src": "Cummings 4th-ed review · 4th ed. Ch 185 · Congenital larynx · Cummings 7th"}, {"s": "Which congenital anomaly has been associated with sudden infant death?", "o": ["Thyroglossal duct cyst (in vallecula)", "Laryngeal cleft", "Laryngomalacia", "Bilateral vocal cord paralysis", "Unilateral vocal cord paralysis"], "k": "A", "x": "Autopsy reports; foramen cecum cyst.", "d": "Paediatric", "src": "Cummings 4th-ed review · 4th ed. Ch 185 · Congenital larynx · Cummings 7th"}, {"s": "Unilateral vocal cord paralysis in children with a weak, breathy, and hoarse voice is initially managed by", "o": ["Gelfoam injection", "Fat injection", "Isshiki thyroplasty", "Speech therapy"], "k": "B", "x": "Exam (book) key B. Current evidence favours D: Book key B contradicts its explanation. Answer D.\nThe book's own explanation: most recover or compensate over 6–12 months, hastened by voice therapy; surgery only for persistent dysphonia or aspiration.", "d": "Paediatric", "src": "Cummings 4th-ed review · 4th ed. Ch 190 · Pediatric voice · Cummings 7th"}, {"s": "What is the classic presentation of an infant with tracheal stenosis?", "o": ["Inspiratory stridor", "Expiratory stridor", "Cough and feeding difficulty", "Biphasic stridor with a marked expiratory component", "Hoarseness"], "k": "B", "x": "Exam (book) key B. Current evidence favours D: Book key B contradicts its own explanation (biphasic with expiratory emphasis). Answer D.\nFixed intrathoracic-cervical narrowing; often with complete tracheal rings.", "d": "Paediatric", "src": "Cummings 4th-ed review · 4th ed. Ch 191 · Congenital trachea · Cummings 7th"}, {"s": "An 18-month-old child is seen with dysphagia in the emergency department at 10:00 PM. He appears in no distress, but according to his parents has refused all food and drink for the past 14 hours. Results of his examination are normal, and you decide to order a chest radiograph to check for a foreign body. A small metallic disk in the midesophagus looks suspiciously like a battery. What is the best plan of action?", "o": ["Observation with recheck in the morning after another chest radiograph", "Removal by endoscopy in the morning as an elective procedure", "Immediate removal in the operating room that evening by rigid endoscopy", "Attempted removal with a small transoral Foley catheter placed distal to the disk and then slowly pulled out", "Immediate fiberoptic esophagoscopy with the patient under sedation"], "k": "C", "x": "Progressive liquefactive injury; protect airway.\nExam tip: Double halo sign; honey or sucralfate before removal if within 12 h (NASPGHAN); watch for aortoesophageal fistula.", "d": "Paediatric", "src": "Cummings 4th-ed review · 4th ed. Ch 193 · Caustic ingestion · Cummings 7th"}, {"s": "At approximately what pH is the threshold for alkalinity severe enough to cause rapid mucosal necrosis?", "o": ["13", "10", "12.5", "13.5"], "k": "C", "x": "Vancura 1980.", "d": "Paediatric", "src": "Cummings 4th-ed review · 4th ed. Ch 193 · Caustic ingestion · Cummings 7th"}, {"s": "Which of the following statements regarding bronchial foreign bodies is true?", "o": ["Bronchial foreign bodies are more prevalent than esophageal foreign bodies.", "The three phases of foreign body aspiration are the initial, asymptomatic, and complication phases.", "Radiographs are essential in ruling out a bronchial foreign body.", "Hyperinflation of the affected lung from a check-valve is a late finding.", "Optical forceps aid the endoscopist by increasing the ventilatory capacity of the bronchoscope."], "k": "B", "x": "Asymptomatic interval misleads.", "d": "Paediatric", "src": "Cummings 4th-ed review · 4th ed. Ch 194 · Foreign bodies · Cummings 7th"}, {"s": "What is the narrowest portion of the upper respiratory tract in a child?", "o": ["Glottis", "Subglottis", "Supraglottis", "Trachea", "Oropharynx"], "k": "B", "x": "Complete cricoid ring.", "d": "Paediatric", "src": "Cummings 4th-ed review · 4th ed. Ch 195 · Pediatric airway infections · Cummings 7th"}, {"s": "If supraglottitis is suspected, what should be the first course of action?", "o": ["Establish IV access", "Perform nasopharyngolaryngoscopy to confirm diagnosis", "Culture the surface of the epiglottis", "Establish airway through endotracheal or nasotracheal intubation", "Perform emergency tracheotomy"], "k": "D", "x": "Controlled setting (OR) with surgical airway backup; avoid agitating the child (no IV or examination first).", "d": "Paediatric", "src": "Cummings 4th-ed review · 4th ed. Ch 195 · Pediatric airway infections · Cummings 7th"}, {"s": "Most cases of genetic deafness exhibit which inheritance pattern?", "o": ["Autosomal recessive", "Autosomal dominant", "X-linked", "Mitochondrial", "Paternal"], "k": "A", "x": "~75–80% AR (GJB2 commonest).", "d": "Paediatric", "src": "Cummings 4th-ed review · 4th ed. Ch 197 · Infant hearing screening · Cummings 7th"}, {"s": "Regarding tympanostomy tubes, which of the following statements are false?", "o": ["The rate of recurrent acute otitis media (AOM) is roughly halved for the duration the tubes remain in situ.", "The hearing loss produced by otitis media with effusion (OME) is effectively reversed by the insertion of the tubes in most instances.", "The benefit to hearing and reduced rate of infection may extend for a period of months after extrusion of the tubes.", "Nearly half of all children who undergo tympanostomy tube placement will have at least one bout of otorrhea at some time after the postsurgical period while the tubes are in place.", "The perforation rate for grommet-style tubes is less than 5%, and greater with T-shaped tubes."], "k": "C", "x": "No protection after extrusion.\nExam tip: Tube otorrhea: topical quinolone drops first-line, not oral antibiotics (AAO-HNS).", "d": "Paediatric", "src": "Cummings 4th-ed review · 4th ed. Ch 200 · AOM and OME · Cummings 7th"}, {"s": "The most common manifestation of vestibular dysfunction in the elderly is", "o": ["Loss of balance", "Oscillopsia", "Benign paroxysmal positional vertigo", "Ménière’s disease", "Labyrinthine fistula"], "k": "A", "x": "Presbystasis presents as disequilibrium and unsteadiness rather than true vertigo.", "d": "General", "src": "Cummings 5th-ed review file · Ch 15 · Geriatrics (also Shamsan Q12) · Cummings 7th, Scott-Brown 8th"}, {"s": "Changes in nasal physiology associated with aging include", "o": ["Reduction in nasal cilia", "Increase in mucociliary clearance", "Decrease in olfactory epithelium", "Decrease in nasal airflow resistance", "General decrease in autonomic function"], "k": "C", "x": "Olfactory epithelium is replaced by respiratory epithelium with age: presbyosmia.", "d": "General", "src": "Cummings 5th-ed review file · Ch 15 · Geriatrics (also Shamsan Q14) · Cummings 7th"}, {"s": "Palliative care is a comprehensive approach to treating serious illness that focuses on treating patients’", "o": ["Physical needs", "Psychological needs", "Social needs", "Spiritual needs", "All of the above"], "k": "E", "x": "Holistic.", "d": "General", "src": "Cummings 4th-ed review · 4th ed. Ch 18 · Palliative care · Cummings 7th"}, {"s": "Management of deviated nasal fractures in children should include all of the following except", "o": ["Early closed nasal reduction (<4 days)", "General anesthesia during closed nasal reduction", "Immediate incision and drainage of septal hematoma", "Nasal stenting after closed nasal reduction for infants less than 6 months of age", "Open reduction for injuries with deviation greater than one-half the width of the nasal bridge"], "k": "E", "x": "Conservative; open only for extensive (NOE) injuries.", "d": "Rhinology", "src": "Cummings 4th-ed review · 4th ed. Ch 41 · Nasal fractures · Cummings 7th"}, {"s": "Nonallergeic rhinitis usually presents with all of the following symptoms except", "o": ["Rhinorrhea", "Nasal congestion", "Nasal obstruction", "Itching", "Negative skin testing"], "k": "D", "x": "Itch suggests allergy.", "d": "Rhinology", "src": "Cummings 4th-ed review · 4th ed. Ch 43 · Non-allergic rhinitis · Cummings 7th"}, {"s": "Complications of bacterial sinusitis include all of the following except", "o": ["Pseudotumor cerebri", "Subperiosteal orbital abscess", "Cavernous sinus thrombosis", "Epidural abscess"], "k": "A", "x": "Not a complication.\nExam tip: Chandler classification for orbital complications.", "d": "Rhinology", "src": "Cummings 4th-ed review · 4th ed. Ch 50 · Infectious rhinosinusitis · Cummings 7th"}]};const Q=P.q;const L='ABCDEFGH';
const DOMS=['Otology','Rhinology','Laryngology','Paediatric','H&N / Plastics / Trauma','General'];
let S={mode:'exam',mins:180,phase:'start',pos:0,ans:{},flag:{},end:0,start:0,tick:null,used:0,list:[],rpos:0,rtitle:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')};
function nav(html){let n=document.querySelector('.nav');if(!html){n&&n.remove();return}if(!n){n=document.createElement('div');n.className='nav';document.body.appendChild(n)}n.innerHTML='<div class="navi">'+html+'</div>'}
function startScreen(){
  S.phase='start';nav();clearInterval(S.tick);
  const cnt={};Q.forEach(q=>cnt[q.d]=(cnt[q.d]||0)+1);
  $('#app').innerHTML=`<div class="kicker">Palestinian Board · Final MCQ mock</div><h1>${esc(P.title)}</h1>
  <p class="sub">100 single-best-answer questions, one correct option each. Original exam wording. Each answer gives the source key and the Cummings/Shamsan chapter where the question appears; where current evidence differs from the book key, the explanation says so.</p>
  <div class="card"><table>${DOMS.filter(d=>cnt[d]).map(d=>`<tr><td>${d}</td><td>${cnt[d]}</td></tr>`).join('')}</table></div>
  <b>Mode</b><div class="seg" role="group" aria-label="Mode"><button class="${S.mode=='exam'?'on':''}" onclick="S.mode='exam';startScreen()">Exam — marked at the end</button><button class="${S.mode=='practice'?'on':''}" onclick="S.mode='practice';startScreen()">Practice — instant feedback</button></div>
  ${S.mode=='exam'?`<b>Time</b><div class="seg" role="group" aria-label="Time limit">${[180,150,120,90].map(m=>`<button class="${S.mins==m?'on':''}" onclick="S.mins=${m};startScreen()">${m==180?'3 h':m+' min'}</button>`).join('')}</div>`:''}
  <button class="primary" onclick="begin()">Start paper</button>
  <p class="note">${S.mode=='exam'?'You can change answers and flag questions until you submit. The paper submits itself when time runs out.':'Each answer is marked when you tap it and locks. Untimed.'} Progress is kept while this page stays open.</p>`;
  scrollTo(0,0)}
function begin(){S.ans={};S.flag={};S.pos=0;S.phase='run';S.start=Date.now();
  if(S.mode=='exam'){S.end=S.start+S.mins*60000;S.tick=setInterval(()=>{const r=S.end-Date.now();const t=$('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}
  show()}
function answered(){return Object.keys(S.ans).length}
function show(){
  const q=Q[S.pos],a=S.ans[S.pos],prac=S.mode=='practice';
  let h=`<div class="top"><div class="topi">${S.mode=='exam'?`<span class="timer" id="tm">${fmt(S.end-Date.now())}</span>`:`<span class="timer">${Object.entries(S.ans).filter(([i,v])=>v==Q[i].k).length}/${answered()}</span>`}<span class="t">${answered()} of ${Q.length} answered</span><button class="flagbtn ${S.flag[S.pos]?'on':''}" onclick="flag()" aria-pressed="${!!S.flag[S.pos]}">${S.flag[S.pos]?'Flagged':'Flag'}</button></div><div class="bar"><i style="width:${(S.pos+1)}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${Q.length}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${S.pos+1}" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,i)=>{const l=L[i];let c='';if(prac&&a){if(l==q.k)c='ok';else if(l==a)c='bad'}else if(a==l)c='sel';
    h+=`<button class="opt ${c}" ${prac&&a?'disabled':''} onclick="pick('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(prac&&a)h+=expl(q,a);
  $('#app').innerHTML=h;
  const last=S.pos==Q.length-1;
  nav(`<button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Questions</button>${last?`<button class="primary" onclick="confirmSubmit()">Submit</button>`:`<button class="primary" onclick="go(1)">Next</button>`}`);
}
function expl(q,a){const ok=a==q.k;
  return `<div class="exp"><h3 class="${a?(ok?'ok':'bad'):'na'}">${a?(ok?'Correct':'Incorrect'):'Not answered'} — answer ${q.k}</h3>${q.x?q.x.split('\n').map(p=>`<p>${esc(p)}</p>`).join(''):`<p class="note">The source gives the key only for this question.</p>`}${q.xi?q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join(''):''}<div class="src">${esc(q.d)} · ${esc(q.src)}</div></div>`}
function pick(l){if(S.mode=='practice'&&S.ans[S.pos])return;if(S.mode=='exam'&&S.ans[S.pos]==l)delete S.ans[S.pos];else S.ans[S.pos]=l;const y=scrollY;show();scrollTo(0,y)}
function flag(){S.flag[S.pos]?delete S.flag[S.pos]:S.flag[S.pos]=1;const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(Q.length-1,S.pos+d));show();scrollTo(0,0)}
function grid(){const d=$('#dlg');const nf=Object.keys(S.flag).length,na=Q.length-answered();
  d.innerHTML=`<b>Questions</b><div class="legend" style="margin-top:6px"><span class="a">Answered (${answered()})</span><span class="f">Flagged (${nf})</span><span>Unanswered (${na})</span></div>
  <div class="grid">${Q.map((_,i)=>`<button class="${S.ans[i]?'ans':''} ${S.flag[i]?'flg':''} ${i==S.pos?'cur':''}" onclick="S.pos=${i};$('#dlg').close();show();scrollTo(0,0)" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div>
  <div class="row"><button class="ghost" onclick="$('#dlg').close()">Close</button><button class="primary" onclick="$('#dlg').close();confirmSubmit()">Submit paper</button></div>`;d.showModal()}
function confirmSubmit(){const d=$('#dlg');const na=Q.length-answered(),nf=Object.keys(S.flag).length;
  d.innerHTML=`<b>Submit this paper?</b><p class="note">${na?`${na} question${na>1?'s are':' is'} unanswered. `:'All questions answered. '}${nf?`${nf} flagged.`:''} You can't change answers after submitting.</p><div class="row"><button class="ghost" onclick="$('#dlg').close()">Keep going</button><button class="primary" onclick="$('#dlg').close();submit()">Submit</button></div>`;d.showModal()}
function submit(auto){clearInterval(S.tick);S.used=Date.now()-S.start;S.phase='done';S.auto=!!auto;if($('#dlg').open)$('#dlg').close();results()}
function results(){nav();
  let r=0;const by={};Q.forEach((q,i)=>{const b=by[q.d]=by[q.d]||{n:0,r:0};b.n++;if(S.ans[i]==q.k){r++;b.r++}});
  const wrong=Q.map((q,i)=>i).filter(i=>S.ans[i]&&S.ans[i]!=Q[i].k),skip=Q.map((q,i)=>i).filter(i=>!S.ans[i]),fl=Object.keys(S.flag).map(Number).sort((a,b)=>a-b);
  $('#app').innerHTML=`<div class="kicker">${esc(P.title)}</div><h1>Results</h1>${S.auto?'<p class="note">Time ran out — the paper was submitted automatically.</p>':''}
  <div class="big">${r}<span style="font-size:1.4rem;color:var(--muted)">/100</span></div><p class="sub">${wrong.length} incorrect · ${skip.length} unanswered · time used ${fmt(S.used)}</p>
  <div class="card"><table>${DOMS.filter(d=>by[d]).map(d=>{const b=by[d],p=Math.round(b.r/b.n*100);return `<tr><td>${d}<div class="meter"><i style="width:${p}%"></i></div></td><td>${b.r}/${b.n} · ${p}%</td></tr>`}).join('')}</table></div>
  <div class="row"><button class="primary" ${wrong.length+skip.length?'':'disabled'} onclick="review('Incorrect and unanswered',${JSON.stringify(wrong.concat(skip).sort((a,b)=>a-b))})">Review incorrect (${wrong.length+skip.length})</button></div>
  <div class="row"><button class="ghost" ${fl.length?'':'disabled'} onclick="review('Flagged',${JSON.stringify(fl)})">Flagged (${fl.length})</button><button class="ghost" onclick="review('All questions',${JSON.stringify(Q.map((_,i)=>i))})">All 100</button></div>
  <div class="row"><button class="ghost" onclick="startScreen()">Retake paper</button></div>`;scrollTo(0,0)}
function review(t,list){S.list=list;S.rpos=0;S.rtitle=t;rshow()}
function rshow(){const i=S.list[S.rpos],q=Q[i],a=S.ans[i];
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="results()">Results</button><span class="t">${S.rtitle} · ${S.rpos+1}/${S.list.length}</span>${S.flag[i]?'<span class="flagbtn on">Flagged</span>':''}</div></div>
  <div class="qn">Question ${i+1}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,j)=>{const l=L[j];const c=l==q.k?'ok':(l==a?'bad':'');h+=`<button class="opt ${c}" disabled><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  h+=expl(q,a);$('#app').innerHTML=h;
  nav(`<button class="ghost" ${S.rpos?'':'disabled'} onclick="S.rpos--;rshow();scrollTo(0,0)">Previous</button><button class="primary" ${S.rpos<S.list.length-1?'':'disabled'} onclick="S.rpos++;rshow();scrollTo(0,0)">Next</button>`)}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
window.addEventListener('beforeunload',e=>{if(S.phase=='run'){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(S.phase!='run'||$('#dlg').open)return;if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else{const i=L.indexOf(e.key.toUpperCase());if(e.key.length==1&&i>=0&&i<Q[S.pos].o.length)pick(L[i])}});
startScreen();
</script></body></html>
