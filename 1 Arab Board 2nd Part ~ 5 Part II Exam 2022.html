<html lang="en"><head><meta charset="utf-8">

<title>ENT Part II Exam 2022 — Answered &amp; Referenced</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--amber:#B06A00;--amber-soft:#FBEFD9;--box:#0B1418;--on-teal:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--amber:#E8A94A;--amber-soft:#3A2C14;--box:#000;--on-teal:#06201F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td:last-child{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px 8px;text-align:center}
.seg button.on{background:var(--teal);color:var(--on-teal);font-weight:600}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note{font-size:.9rem;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.timer{font:700 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.topi .t{flex:1;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.flagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
.flagbtn.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.qn{font-weight:600;font-size:.9rem;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{opacity:1}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}.exp h3.na{color:var(--amber)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;position:relative}
.grid .ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.grid .flg{box-shadow:inset 0 0 0 2px var(--amber)}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-na{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid .cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.legend .a::before{background:var(--teal-soft);border-color:var(--teal)}.legend .f::before{box-shadow:inset 0 0 0 2px var(--amber)}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3.2rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>button{flex:1}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--teal)}
</style></head><body>

<script>
const PAPERS=[{"title":"2022 Exam · Paper 1","q":[{"s":"Cavernous sinus thrombosis","o":["Causes hyposthesia in V3 distribution","causes increase IOP","causes vocal cord palsy","causes facial nerve palsy","follows streptococcus pneumonia sinusitis"],"k":"B","x":"Cavernous sinus thrombosis causes proptosis, chemosis and raised intraocular pressure from venous congestion, with III/IV/VI and V1–V2 deficits (not V3); S. aureus is the usual organism (Scott-Brown).","src":"2022 exam recall · Q1","d":"Rhinology"},{"s":"40 years old male underwent excision of skull base lesion & reconstruction with Haddad flap which is based on the following","o":["Posterior septal artery (branch of the sphenopalatine)","Nasopalatine artery","Anterior ethmoidal artery","Greater palatine artery","Superior labial artery"],"k":"A","x":"⚑ Recalled answer: \"nasoseptal artery\"; updated answer: posterior septal artery (option A repaired). — The Hadad–Bassagasteguy nasoseptal flap is pedicled on the posterior septal artery, a branch of the sphenopalatine artery (Cummings).","src":"2022 exam recall · Q2","d":"Rhinology"},{"s":"The surgical approach to schwannomas of the trigeminal nerve with extension through the foramen ovale in the floor of the middle cranial fossa requires","o":["A maxillary swing approach","A mandibulotomy approach","A craniotomy","Maxillary swing and craniotomy","mandibulotomy approach and craniotomy"],"k":"D","x":"Trigeminal schwannomas extending through foramen ovale into the infratemporal fossa need combined access — a cranial (middle fossa) approach plus a transfacial/maxillary swing (Shah).","src":"2022 exam recall · Q3","d":"Others"},{"s":"10 years old boy presented with Rt eye swelling of 2 days duration examination revealed swelling and redness of eyelid .. which of the following differentiate orbital cellulitis from preseptal cellulitis?","o":["presence of fever & chills","decrease ocular mobility","redness & swelling of eyelid","normal color vision","normal visual acuity"],"k":"B","x":"Reduced ocular motility (with proptosis/chemosis, reduced acuity) indicates orbital (postseptal) involvement rather than preseptal cellulitis (Chandler).","src":"2022 exam recall · Q4","d":"Paediatric"},{"s":"In Sup. SCC Dehiscence Syndrome, VEMP are typically","o":["not changed","absent","not indicated","high","low"],"k":"D","x":"In superior canal dehiscence, cVEMP thresholds are low and oVEMP amplitudes high (enhanced VEMPs) (Cummings).","src":"2022 exam recall · Q5","d":"Head & Neck"},{"s":"25 years old woman presented with recurrent maxillary sinusitis .. CT scan of PNS showed bilateral huge Haller cells .. which of the following best describe the location of this cell","o":["located along the inferolateral orbital floor","located along the posteroinferior orbital floor","located along the posterolateral orbital floor","located along the inferomedial orbital floor","located along the posteromedial orbital floor"],"k":"D","x":"Haller (infraorbital ethmoid) cells lie along the inferomedial orbital floor/roof of the maxillary sinus and can narrow the infundibulum (Cummings).","src":"2022 exam recall · Q6","d":"Rhinology"},{"s":"Cochlear implant","o":["There must be functioning hair cells for cochlear implant function","bilateral cochlear implant is recommended for everyone with bilateral profound hearing loss","cochlear implant has speech processor that filter sounds for audible speech and priorities it","contraindicated in cochlear aperture stenosis","in congenitally deaf child cochlear implant is of no use after 2 years of age"],"k":"C","x":"A cochlear implant has a speech processor converting sound to electrical signals that directly stimulate spiral ganglion cells — functioning hair cells are not required (Cummings).","src":"2022 exam recall · Q7","d":"Otology"},{"s":"Factors support allergy as an etiology for OME include all except","o":["mast cells degranulation causing nasal obstruction ⬆","IgG level in child with OME","ET edema secondary to retrograde extension of inflammatory mediators ⬆","IgE level in child with OME","Immune complex found in serum of ME effusion"],"k":"D","x":"Elevated serum IgE is not a consistent finding supporting allergy in OME; mast-cell degranulation, Eustachian tube oedema and immune complexes in effusions are cited mechanisms (Ballenger).","src":"2022 exam recall · Q8","d":"Others"},{"s":"Enlarged vestibular aqueduct syndrome","o":["ll are true except : A associated with gusher during cochlear implant","is the most common finding on imaging of unilateral SNHL","Is defined as having midpoint and operculum with > 1 & 2 mm respectively","most frequently occur bilaterally","is frequently associated with common cavity deformity otolaryngology cases"],"k":"E","x":"EVA is the commonest inner-ear imaging finding in congenital SNHL, usually bilateral, defined by a midpoint >1.5 mm/operculum >2 mm — it is associated with incomplete partition II, not common cavity (Cummings).","src":"2022 exam recall · Q9","d":"Otology"},{"s":"15 years old child has 7-cm juvenile nasopharyngeal angiofibroma involving the ipsilateral nasal cavity , sphenoid Sinus with erosion of skull base and significant extension to infratemporal fossa. Appropriate preoperative embolization is performed. Which of the following statements about surgical management of this tumor is true?","o":["Craniofacial resection offers the best the best exposure of this tumor extension","An expand endonasal approach will provide optimal surgical access","An endoscopic or endoscopic-assisted approach is likely to result in greater blood loss than open resection","the key advantage of endoscopic technique is avoidance of facial incision","frontotemporal craniotomy approach is mandatory in this case"],"k":"B","x":"⚑ Recalled answer: A (craniofacial resection); updated answer: B (expanded endonasal approach). — After embolization, most JNAs including those with infratemporal fossa and limited skull base extension are now resected via expanded endonasal (endoscopic) approaches, with less blood loss (Cummings).","src":"2022 exam recall · Q10","d":"Paediatric"},{"s":"A cerebellopontine angle lesion has the characteristic MRI finding of high signal intensity on both T1and T2-weighted images","o":["Lipoma","Cholesterol granuloma","Arachnoid cyst","Epidermoid cyst","Vestibular schwannoma","Meningioma"],"k":"B","x":"⚑ Option D repaired: the recall listed cholesterol granuloma twice. — Cholesterol granuloma is hyperintense on both T1 and T2 (Essential Otolaryngology).","src":"2022 exam recall · Q11","d":"Others"},{"s":"An advantage of cochleostomy over round window approach in cochlear implantation is","o":["Reduced drilling","Minimal perilymph loss","Less bone dust entry","More basically located spiral ganglion cells are stimulated","Reduced disruption to cochlear aqueduct"],"k":"D","x":"Cochleostomy allows deeper electrode insertion reaching more basal–middle spiral ganglion populations; round-window insertion reduces drilling and trauma (Cummings).","src":"2022 exam recall · Q12","d":"Otology"},{"s":"After frontal sinus osteoplastic flap surgery a patient noted a depression in herforehead, MOST LIKELY related to","o":["Fat resorption","Failure to close the periostium","Failure to use fat","Failure to bevel bone cuts","Wound infection"],"k":"D","x":"Forehead depression after an osteoplastic flap usually results from failure to bevel the bone cuts, letting the bone flap sink (Byron).","src":"2022 exam recall · Q13","d":"Rhinology"},{"s":"cerebrospinal fluid leak during ethmoidectomy is most likely to occur at","o":["The junction of fovea ethmoidalis and lamina papyracea","The medial fovea ethmoidalis","The insertion of the uncinate process","The planum sphenoidale …………………………baily( b)"],"k":"B","x":"⚑ No answer given in the recall; answered from the references. — The medial fovea ethmoidalis/lateral lamella of the cribriform plate is the commonest site of CSF leak during ethmoidectomy (Bailey).","src":"2022 exam recall · Q14","d":"Rhinology"},{"s":"70-year-old man complains of soreness in the left vestibule over the last 3 to 4 months that has failed to respond to a variety of topical preparations. A small ulcerated area is noted on the inner vestibule skin from which a biopsy is taken. The histology report suggests chronic inflammation, a few basaloid cells, and areas of necrosis. As a consequence, one should","o":["Reassure him that there is nothing seriously wrong","Arrange a computed tomography scan","Perform a second biopsy","Refer him to a dermatologist","Place him on long-term oral antibiotics …………………ballenger (c)"],"k":"C","x":"⚑ No answer given in the recall; answered from the references. — A chronic non-healing vestibular ulcer with basaloid cells and necrosis on biopsy is suspicious for carcinoma (BCC/SCC) — re-biopsy deeper (Ballenger).","src":"2022 exam recall · Q15","d":"Others"},{"s":"Diagnostic testing for autoimmune inner ear disease includes all of the following except","o":["Otoblot to measure anti–68 kD inner ear antibodies","Serum protein electrophoresis","Antinuclear antibodies","Lymphocyte transformation","Temporal bone immunohistochemistry employing patient serum"],"k":"B","x":"Serum protein electrophoresis is not part of the workup for autoimmune inner ear disease; Otoblot (68 kD/HSP-70), ANA and lymphocyte transformation tests are (Ballenger).","src":"2022 exam recall · Q16","d":"Otology"},{"s":"In the diagnosis of perilymphatic fistulae, the vestibulospinal response to fistula testing","o":["Is as sensitive as the vestibulo-ocular response","Is insensitive","Is more sensitive than the vestibulo-ocular response","May be attributable to malingering","Is irrelevant ……………………………………"],"k":"C","x":"In perilymph fistula, the vestibulospinal response (postural sway) to fistula testing is more sensitive than the vestibulo-ocular response (Ballenger).","src":"2022 exam recall · Q17","d":"Otology"},{"s":"Which of the following conditions support a diagnosis of superior canal dehiscence syndrome?","o":["Spontaneous horizontal nystagmus","Weber test lateralizing to the contralateral ear","Symptom provoked by loud noise","A positive head thrust maneuver","Patient is off-balanced with gait"],"k":"C","x":"Sound- (Tullio) or pressure-induced vertigo supports superior canal dehiscence (Cummings).","src":"2022 exam recall · Q18","d":"Others"},{"s":"Blunting of the anterior angle of the ear canal results in","o":["Poorer rate of perforation closure","Poorer hearing","Cholesteatoma formation","Increased incidence of otitis externa","Difficulty in visualizing the tympanic membrane Post operatively"],"k":"B","x":"Anterior blunting reduces the vibratory area of the TM, causing a conductive hearing loss (Brackmann).","src":"2022 exam recall · Q19","d":"Otology"},{"s":"An adult woman who had a canal wall down procedure 5 years ago is experiencing recurrent otorrhea in the right ear. Examination reveals a normal appearing tympanic membrane. There is a narrow opening into the mastoid bowl. Most of the obstruction to the opening appears to be inferior. The MOST likely cause for the continued drainage is","o":["Retained foreign body","Inadequate meatoplasty","Age of the patient at the time of surgery","Inadequate removal of the facial ridge","Inadequate opening of the cells in the sinodural angle"],"k":"D","x":"Persistent otorrhoea after CWD with a normal-looking cavity is often due to an inadequately lowered facial ridge, which creates an undependent sump (Brackmann).","src":"2022 exam recall · Q20","d":"Otology"},{"s":"Intratympanic steroids have been proven to","o":["Increase perilymphatic steroid concentration compared with systemic administration","Not to cross the round window membrane","Improve hearing recovery in all patient with sudden hearing loss","Cause a vascular necrosis of the ossicles","Have systemic side effects"],"k":"A","x":"Intratympanic steroid achieves far higher perilymph concentrations than systemic dosing with minimal systemic effects (Cummings).","src":"2022 exam recall · Q21","d":"Others"},{"s":"Outcomes after endoscopic dacryocystorhinostomy (DCR) without mucosal flap preservation are","o":["equivalent to endoscopic mucosal flap-preserving techniques","equivalent to medical therapy","inferior to external DCR techniques","inferior to endoscopic mucosal flap-preserving techniques……. academy A"],"k":"A","x":"Endoscopic DCR without mucosal flaps has success comparable to flap-preserving techniques and to external DCR (Cummings).","src":"2022 exam recall · Q22","d":"Head & Neck"},{"s":"4 year boy with sudden onset high grade fever, inspiratory stridor and refusal to feed most likely diagnosis is","o":["Epiglottitis","Foriegn body","Croup","Vascular ring","Parapharyngeal abscess"],"k":"A","x":"Sudden high fever, stridor, drooling and refusal to swallow in a child is epiglottitis (Scott-Brown).","src":"2022 exam recall · Q23","d":"Paediatric"},{"s":"Compensation to unilateral vestibular injury, nystagmus can still be elicited","o":["with Eyes closed","On gaze toward the lesion","On central gaze","During visual fixation","On vertical gaze"],"k":"A","x":"After vestibular compensation, residual spontaneous nystagmus can still be seen when fixation is removed (eyes closed/Frenzel goggles) (Cummings).","src":"2022 exam recall · Q25","d":"Otology"},{"s":"Inheritance pattren of osler weber Rendu is","o":["Autosomal dominant","Autosomal recessive","Mitochondrial","X-linked"],"k":"A","x":"Hereditary haemorrhagic telangiectasia (Osler–Weber–Rendu) is autosomal dominant (ENG, ACVRL1) (Cummings).","src":"2022 exam recall · Q26","d":"Others"},{"s":"Which symptom of SCCD is least likely to improve following surgical intervention","o":["Hearing loss","Unsteadiness","Autophony","Tinnitus","Hyperacusis"],"k":"B","x":"⚑ Recalled answer: D (tinnitus); updated answer: B (unsteadiness). — After SSCD repair, autophony and sound/pressure symptoms improve most; chronic disequilibrium (unsteadiness) is least likely to improve (Crane 2008).","src":"2022 exam recall · Q27","d":"Others"},{"s":"The main differential diagnosis of Bullous myringitis is","o":["Acute otitis media","Otitis externa","Ramsey-Hunt Syndrome","Eczema","Idiopathic thrombocytopenic purpura"],"k":"C","x":"Bullous myringitis must be distinguished from herpes zoster oticus (Ramsay Hunt) (Scott-Brown).","src":"2022 exam recall · Q28","d":"Others"},{"s":"Incomplete eyelid closure secondary to facial nerve dysfunction should be initially managed with","o":["Tarsorraphy","The lower lid–shortening procedure","Taping of the eyelid","Browlift","Artificial tears and ointment………………………"],"k":"E","x":"Initial eye care for lagophthalmos: lubricating drops/ointment and moisture chamber; surgery (gold weight, tarsorrhaphy) for persistent cases (Cummings).","src":"2022 exam recall · Q29","d":"Otology"},{"s":"The most effective treatment for auricular hematoma is","o":["Simple aspiration","To place a drain between the perichondrium and the cartilage","Intravenous streptokinase","To aspirate the hematoma and apply a pressure dressing","Adequate incision and drainage with suture-secured bolsters"],"k":"E","x":"Auricular haematoma: incision and drainage with bolster/through-and-through sutures to prevent re-accumulation (Cummings).","src":"2022 exam recall · Q30","d":"Others"},{"s":"Which of the following patient symptom descriptors would suggest that vestibular and balance rehabilitation should be considered as a treatment option?","o":["Patient reports spontaneous spells of vertigo lasting 1 to 2 hours, with no symptoms between the events","Patient reports a rocking sensation when standing or sitting still with all symptoms absent when in motion","Patient reports symptoms that are provoked by head or visual motion stimuli producing brief spells of vertigo with no symptoms when the head is still","Patient reports imbalance only when arising from lying or sitting, lasting seconds, with no other symptoms noted","Patient reports spontaneous spells of imbalance and vertigo lasting 2 to 3 minutes multiple times per day independent of head position or movement. ………………"],"k":"C","x":"Vestibular rehabilitation suits brief vertigo provoked by head/visual motion with no symptoms at rest (Ballenger).","src":"2022 exam recall · Q31","d":"Otology"},{"s":"Which of the following causes of acute facial paralysis carries the best prognosis for recovery","o":["Acute otitis media","Penetrating trauma","Temporal bone fracture","Metastatic cancer","Ramsay-Hunt syn"],"k":"A","x":"Facial palsy from acute otitis media has an excellent prognosis with antibiotics and myringotomy (Cummings).","src":"2022 exam recall · Q32","d":"Others"},{"s":"Year-old male with a history of right sided Herpes zoster oticus two months ago, comes to clinic with burning pain in right ear. Examination of the ear showed no abnormality. What is the most appropriate therapy?","o":["Ibuprofen","Gabapentin","Varicella vaccine","Valacyclovir","Prednisolone"],"k":"B","x":"Post-herpetic neuralgia after Ramsay Hunt is treated with gabapentinoids (gabapentin/pregabalin) or tricyclics (Cummings).","src":"2022 exam recall · Q33","d":"Otology"},{"s":"The efficacy of intranasal steroid used to control eye symptoms in patients with allergic rhinoconjuctivitis most likely is by which the following mechanisms or activity","o":["Systemic absorption of intranasal steroid","intranasal steroid reaching through nasolacrimal duct","intranasal steroid inhibiting ocular reflex induced by allergy in the nose","intranasal steroid reducing system allergic inflammation","all of the above"],"k":"C","x":"Intranasal steroids reduce ocular symptoms mainly by inhibiting the naso-ocular reflex (Cummings).","src":"2022 exam recall · Q34","d":"Rhinology"},{"s":"The presence of peripheral cysts around the intracranial component of a sinonasal lesion is generally associated with which of the following tumors?","o":["Sinonasal undifferentiated carcinoma","Melanoma","Esthesioneuroblastoma","Squamous cell carcinoma","Adenoid cystic carcinoma"],"k":"C","x":"Peripheral cysts at the tumour–brain interface are characteristic of esthesioneuroblastoma on MRI (Cummings).","src":"2022 exam recall · Q35","d":"Head & Neck"},{"s":"A 68-year old patient present complaining of abrupt drop attacks. The episodes are also accompanied by double vision, vertigo and disturbed speech. In between attacks he feels normal. You suspect","o":["Degeneration associated with aging","Tumarkin's otolith crisis","Vertebrobasilar insufficiency","Cerebellar infarction","Multiple sclerosis"],"k":"C","x":"Drop attacks with diplopia, vertigo and dysarthria in an older patient indicate vertebrobasilar insufficiency (Scott-Brown).","src":"2022 exam recall · Q36","d":"Otology"},{"s":"A 3-year-old with congenital hearing loss was found to have abnormal electroretinography. This child most likely has","o":["Pendred syndrome","Usher syndrome","Jervell and Lange-Nielsen syndrome","Nonsyndromic hearing loss","Mondini syn"],"k":"B","x":"Congenital SNHL with abnormal electroretinography (retinitis pigmentosa) is Usher syndrome (Scott-Brown).","src":"2022 exam recall · Q37","d":"Paediatric"},{"s":"Anosmia","o":["always permanent post covid_19","early manifestation of dementia","Classified into neural and sensory","May be caused by vit. D deficiency"],"k":"B","x":"Olfactory loss is an early manifestation of neurodegenerative disease (Parkinson, Alzheimer) (Cummings).","src":"2022 exam recall · Q38","d":"Rhinology"},{"s":"congenital rubella syndrome affecting inner ear may result in","o":["Mondini malformation","Common cavity malformation","Sheibe dysplasia","semicircular canal aplasia"],"k":"C","x":"Congenital rubella classically causes cochleosaccular (Scheibe) dysplasia (Scott-Brown).","src":"2022 exam recall · Q39","d":"Otology"},{"s":"Clear rhinorrhea may result from fracture of","o":["Naso-orbito-ethmoid complex","Maxilla","Mandible","Zygoma"],"k":"A","x":"Naso-orbito-ethmoid fractures involve the cribriform plate/ethmoid roof and can cause CSF rhinorrhoea (Scott-Brown).","src":"2022 exam recall · Q40","d":"Rhinology"},{"s":"What's the most common cause of otapostasis (bat ear)?","o":["A Wide protruding concha","Lack of development of the antihelical fold","Overdevelopment of the antihelical fold","Overdevelopment of the cauda helices","Underdevelopment of the concha"],"k":"B","x":"Prominent (bat) ears are most commonly due to an underdeveloped antihelical fold (± deep concha) (Cummings).","src":"2022 exam recall · Q41","d":"Otology"},{"s":"The most common form of BPPV results from","o":[", Anterior canal canalithiasis","Lateral canal cupulolithiasis","Lateral canal canalithiasis","Posterior canal cupulolithiasis","Posterior canal canalithiasis…………………. brackman e"],"k":"E","x":"Posterior canal canalithiasis is the commonest form of BPPV (AAO-HNS).","src":"2022 exam recall · Q42","d":"Others"},{"s":"High frequency sensorineural hearing loss after head Injury is MOST often caused by","o":["Injury to the auditory nerve","Concussion of bony cochlea","Fracture of bony cochlea","Brain hemorrhage","Hemotympanum …………………………"],"k":"B","x":"Post-traumatic high-frequency SNHL without fracture usually results from labyrinthine (cochlear) concussion (Scott-Brown).","src":"2022 exam recall · Q43","d":"Otology"},{"s":"Successful sublingual immunotherapy results in which of the following immunologic changes?","o":["Increased serum neutrophils","Increased serum IgE-blocking antibodies","Decreased serum IgG4 antibodies","Changes different to that observed after subcutaneous immunotherapy","No change in serum IgG4 antibodies"],"k":"B","x":"Successful SLIT induces IgG4 \"blocking\" antibodies and regulatory T cells (Cummings).","src":"2022 exam recall · Q44","d":"Others"},{"s":"A cauliflower ear deformity following an auricular haematoma is a result of","o":["Loss of auricular cartilage secondary to infection","Fibrous tissue formation","New cartilage formation","Repeated episodes with subsequent scarring of the dermis","Subcutaneous collection of blood and its effect on the perichondrium"],"k":"C","x":"Cauliflower ear results from neocartilage formation by stripped perichondrium after an untreated haematoma (Cummings).","src":"2022 exam recall · Q45","d":"Otology"},{"s":"Options for reconstructing the ossicular chain when the long process of the incus is eroded include all except","o":["Performing an autograft incus interposition","Using bone cement to restore ossicular continuity","Placing a total ossicular replacement prosthesis between the malleus and the head of the stapes","Placing a partial ossicular replacement prosthesis between the tympanic membrane and the head of the stapes","Using a synthetic incudostapedial joint prosthesis"],"k":"C","x":"With an intact stapes superstructure, a TORP is not used — options are incus interposition, PORP, bone cement or an incudostapedial joint prosthesis (Brackmann).","src":"2022 exam recall · Q46","d":"Others"},{"s":"First line of treatment of petrous apicitis is","o":["Radical mastoidectomy","Limited petrous apex approach","Antibiotic therapy against pseudomonas aeruginosa","Middle fossa approach","Extensive surgical dissection surrounding the internal carotid atery"],"k":"C","x":"Petrous apicitis is first treated with culture-directed IV antibiotics (antipseudomonal) plus mastoidectomy; extended petrous surgery for failure (Cummings).","src":"2022 exam recall · Q47","d":"Otology"},{"s":"Mitomycin C has the following characteristics EXCEPT","o":["Is an antibiotic","Has an antitumour effect","Selectively inhibits DNA synthesis","Is used topically in some microlaryngeal procedures","Enhances fibrosis"],"k":"E","x":"Mitomycin C inhibits fibroblast proliferation (reduces fibrosis); it is an antitumour antibiotic used topically in airway surgery (Cummings).","src":"2022 exam recall · Q48","d":"Others"},{"s":"Which of the following statements is true regarding trans-labyrinthine approach?","o":["Large tumors are inadequately exposed with this approach","The facial nerve in the internal auditory canal (IAC) fundus is typically obscured in this approach","Bill's bar helps localize the facial nerve in the porous acousticus","The dura is best opened after exposing the distal IAC but before uncovering the posterior fossa dura","The superior vestibular nerve is posterior to the facial nerve in the IAC ………………"],"k":"E","x":"In the IAC, Bill’s bar separates the facial nerve (anterior) from the superior vestibular nerve (posterior) at the fundus (Brackmann).","src":"2022 exam recall · Q49","d":"Otology"},{"s":"The Charcot triad (nystagmus, scanning speech, intention tremor) may be associated with","o":["multiple sclerosis","Parkinson disease","congenital syphilis","basilar-vertebral insufficiency","Wallenberg syndrome ……………………………"],"k":"A","x":"The Charcot triad (nystagmus, scanning speech, intention tremor) suggests multiple sclerosis (Scott-Brown).","src":"2022 exam recall · Q50","d":"Otology"},{"s":"A 60-year-old male is suspected of having a central lesion. One of the most reliable signs would be","o":["failure of ocular fixation","right-beating nystagmus","direction-fixed nystagmus","direction-changing position nystagmus","ocular fixation"],"k":"A","x":"Failure of visual fixation suppression of nystagmus is one of the most reliable central signs (Scott-Brown).","src":"2022 exam recall · Q51","d":"Others"},{"s":"The technique of removal of the intrasinus septum of the frontal sinus is termed as","o":["the Ridell procedure","the Lothrop procedure","killian's procedure","Lynch frontoethmoidectomy","Kummel-Beck. Trephination"],"k":"B","x":"Removal of the frontal intersinus septum (and upper septum) is the modified Lothrop (Draf III) procedure (Cummings).","src":"2022 exam recall · Q52","d":"Rhinology"},{"s":"Virus associated with lethal midline granuloma","o":["EBV","HSV2","VZV","hepatitis c","Human papilloma virus"],"k":"A","x":"Lethal midline granuloma is extranodal NK/T-cell lymphoma, nasal type — EBV-associated (Cummings).","src":"2022 exam recall · Q53","d":"Others"},{"s":"The criteria to diagnose allergic fungal sinusitis include all Except","o":["Nasal polyposis","Cluster of eosinophils","Charcot Leyden","Type II hypersensitivity","fungal organism detectable on staining and culture"],"k":"D","x":"Bent–Kuhn AFRS criteria: type I (IgE) hypersensitivity, nasal polyps, characteristic CT, eosinophilic mucin, positive fungal stain — not type II (Cummings).","src":"2022 exam recall · Q54","d":"Rhinology"},{"s":"10-month old infant failed a neonatal hearing screening at the hospital but follow-up ABR revealed normal hearing thresholds. Which of the following would be the most appropriate type of test on today visit?","o":["Behavioral observation audiometry","Distortion-product otoacoustic emissions (DPOAEs)","Visual reinforcement audiometry","Automated auditory brainstem response (AABR)","Conditioned play audiometry"],"k":"C","x":"A 10-month-old with normal ABR is followed with visual reinforcement audiometry (age 6 months–2 years) (Oxford).","src":"2022 exam recall · Q55","d":"Paediatric"},{"s":"Which of the following histological types is not within the differential diagnosis of a small blue cell tumor of the sinonasal cavity?","o":["SNUC","Sinonasal neuroendocrine carcinoma","Mucoepidermoid carcinoma","Olfactory neuroblastoma","Rhabdomyosarcoma","Lymphoma"],"k":"C","x":"Mucoepidermoid carcinoma is not a small round blue cell tumour; SNUC, SNEC, ONB, RMS, lymphoma and melanoma are in the differential (Shah).","src":"2022 exam recall · Q56","d":"Head & Neck"},{"s":"An 11 year old boy presented with unilateral hearing loss he has type A tympanometry, the most likely diagnosis is","o":["SNHL due to mumps","Congenital fixation of the malleus","Otosclerosis","Ototoxicity","Measles"],"k":"A","x":"Unilateral profound SNHL in a child with normal tympanometry is classically post-mumps (Scott-Brown).","src":"2022 exam recall · Q58","d":"Paediatric"},{"s":"Most autosomal recessive nonsyndromic hearing loss is due to","o":["Mutations in the GJB6 gene","Mutations in the EYA1 gene","Mutations that affect gap junctions in the stria vascularis","Mutations in the WFS1 gene","Mitochondrial non-nuclear DNA (C )"],"k":"C","x":"⚑ No answer given in the recall; answered from the references. — Most autosomal recessive non-syndromic HL is due to GJB2 (connexin 26) mutations affecting gap junctions (Cummings).","src":"2022 exam recall · Q59","d":"Otology"},{"s":"Regarding otoacoustic emissions (OAEs)","o":["OAEs test is a non objective measure that allows inner hair cell function of the cochlea to be assessed","Evoked otoacoustic emissions testing is a quick test to determine the accurate hearing threshold","Normal otoacoustic emissions mean that hearing is normal","Otoacoustic emissions testing is used as a screening test on newborns","OAEs test is diagnostic and accurate than ABR test"],"k":"D","x":"OAEs are an objective screening test of cochlear (outer hair cell) function; they do not quantify thresholds (Cummings).","src":"2022 exam recall · Q60","d":"Otology"},{"s":"Which is the MOST common traumatic ossicular abnormality?","o":["Necrosis of the long process of the incus","Incudostapedial joint separation","Fracture of the stapes superstructure","Fracture of the malleus handle"],"k":"B","x":"Incudostapedial joint separation is the commonest traumatic ossicular injury (Bailey).","src":"2022 exam recall · Q61","d":"Others"},{"s":"Reduction of blood flow through the spheno-palatine artery may be achieved by injection of local anaesthetic into the","o":["Foramen rotundum","Lesser palatine foramen","Greater palatine foramen","Infraorbital foramen","Incisive foramen"],"k":"C","x":"Injection through the greater palatine foramen into the pterygopalatine fossa reduces sphenopalatine flow (Scott-Brown).","src":"2022 exam recall · Q62","d":"Others"},{"s":"55 year female with cheif complain of facial pain around her left forhead and periorbital area . Pain was intense and sharp and lasting only a minute or two. She denies any nasal nor dental symptoms. Pain attack occur 3 to 4 time per day the most proper treatment is","o":["carbamazepine","Psychiatric evaluation","NSAIDs","FESS","Nasal steroid"],"k":"A","x":"Brief, intense, sharp paroxysms of facial pain suggest trigeminal neuralgia — carbamazepine first line (Scott-Brown).","src":"2022 exam recall · Q63","d":"Rhinology"},{"s":"patient who underwent uneventful stapedectomy 14 days ago, with immediate improvement in hearing, is now complaining of worsening hearing loss, otalgia, aural fullness, and vertigo. This most likely represents","o":["Endolymphatic hydrops","Surgical injury to the saccule","A depressed footplate fragment","Reparative granuloma","Cupulolithiasis"],"k":"D","x":"Delayed hearing loss, otalgia and vertigo 1–6 weeks after stapedectomy suggest reparative granuloma (Brackmann).","src":"2022 exam recall · Q64","d":"Otology"},{"s":"46-year-old patient with left sided SNHL. Which of the following signs is suggestive of left side Vestibular schwanoma?","o":["Hypoesthesia of posterior canal skin","Nystagmus to the affected side","Recruitment in audiological testing","High SP/AP ratio on electrocochleography","Absent stapedial reflex"],"k":"A","x":"Hitselberger sign — hypoaesthesia of the posterior canal skin — suggests a vestibular schwannoma compressing the facial nerve sensory fibres (Scott-Brown).","src":"2022 exam recall · Q65","d":"Otology"},{"s":"52-year-old woman presents with an asymmetric sensorineural hearing loss. What is the MOST, accurate step in her evaluation? a MRI. b. Hearing aid evaluation. c. CT with contrast . d. Otoacoustic emission. e. Auditory brainstem response……………………………….","o":["MRI with gadolinium","Hearing aid evaluation","CT with contrast","Otoacoustic emissions","Auditory brainstem response"],"k":"A","x":"Asymmetric SNHL is evaluated with gadolinium-enhanced MRI of the IAC (Bailey).","src":"2022 exam recall · Q66","d":"Otology"},{"s":"52 year old male was recently diagnosed with an osteoma of the frontal sinus discovered incidentally on a CT scan. With supernumerary teeth. Which one of the following additional tests should be recommended to this patient?","o":["Echocardiogram","MRI of the brain","Colonoscopy","Parathyroid hormone level","Thyroid ultrasound"],"k":"C","x":"Frontal osteoma with supernumerary teeth suggests Gardner syndrome — colonoscopy for adenomatous polyps (Cummings).","src":"2022 exam recall · Q67","d":"Rhinology"},{"s":"Otitis media with effusion 2 months without significant hearing loss in a 4-yearold child is treated by","o":["Observation","Oral steroid","Oral antibiotic","Myringotomy and ventilation tubes","Myringotomy with tube and adenoidectomy"],"k":"A","x":"OME without significant hearing loss in an otherwise well child: watchful waiting for 3 months (AAO-HNS).","src":"2022 exam recall · Q68","d":"Paediatric"},{"s":"36-year-old woman has developed variously sized 'recurring mucosal vesicles and bullae that leave raw eroded tissue surfaces.(Nikolsky.!s''sign is positive on die skin lesions. These findings are consistent with a diagnosis of","o":["Darier's disease","pemphigus","Crohn's disease","Kawasaki's disease","epidermolysis bullosa ………………………."],"k":"B","x":"Recurrent flaccid bullae with a positive Nikolsky sign = pemphigus vulgaris (Byron).","src":"2022 exam recall · Q69","d":"Others"},{"s":"Nasal obstruction from a 3-cm anterior septal perforation is most likely due to","o":["crusting","atrophic changes of the surrounding epithelium","resultant valvular collapse","intranasal turbulence","loss of dorsal support ………………."],"k":"D","x":"Obstruction from a large anterior septal perforation is from turbulent airflow and crusting (Byron).","src":"2022 exam recall · Q70","d":"Rhinology"},{"s":"septic thrombophlebitis of the internal jugular vein should be treated with","o":["intravenous antibiotics only","anticoagulants only","local irrigation","ligation and excision of the jugular vein","phlebotomy …………."],"k":"A","x":"⚑ Recalled answer: D (ligation/excision, Byron); updated answer: A (IV antibiotics). — Septic IJV thrombophlebitis (Lemierre) is treated with prolonged IV antibiotics; ligation/excision is reserved for persistent septic emboli despite therapy (Cummings).","src":"2022 exam recall · Q71","d":"Others"},{"s":"Wallenberg syndrome (lateral medullary syndrome) results from embolic events or thrombosis of","o":["Controlateral vertebral or inferior cerebellar artery","Ipsilateral vertebral or posterior inferior cerebellar artery","Ipsilateral posterior cerebellar artery","Ipsilateral posterior inferior cerebellar artery","Controlateral posterior superior cerebellar artery"],"k":"B","x":"Lateral medullary (Wallenberg) syndrome results from ipsilateral vertebral or PICA occlusion (Scott-Brown).","src":"2022 exam recall · Q72","d":"Others"},{"s":"Which of the following clinical features does not influence staging of nasopharyngeal angiofibroma ?","o":["The measured size of the tumor","Involvement of the paranasal sinuses","Degree of extension into the pterygomaxilliary fossa","Erosion of orbital bones","Intracranial extension ……………………….cumming 3rd a"],"k":"A","x":"JNA staging (Fisch, Radkowski, UPMC) is based on extension (sinuses, PPF/ITF, orbit, intracranial), not measured size (Cummings).","src":"2022 exam recall · Q73","d":"Rhinology"},{"s":"The creation of a middle meatus antrostomy includes removal of","o":["Middle conchal bone","Inferior conchal bone","Anterior pole of middle turbinate","Agger nasi cells","Uncinate process ………………………….."],"k":"E","x":"Middle meatal antrostomy starts with uncinectomy to expose and enlarge the natural ostium (Bailey).","src":"2022 exam recall · Q74","d":"Others"},{"s":"A 46-year-old man has squamous cell carcinoma of the right maxillary sinus extending to the hard palate and anterior maxillary wall only. It has not invaded the orbital walls or involved subcutaneous tissues. According the TNM classification what stage would his tumor be?","o":["T1","T2","T3","T4a","T4b ………………………………"],"k":"B","x":"Maxillary SCC eroding the hard palate and anterior wall without posterior wall, orbit or skin involvement = T2 (AJCC 8).","src":"2022 exam recall · Q75","d":"Rhinology"},{"s":"Which of the following is the best initial surgical procedure for chronic pediatric rhinosinusitis?","o":["Adenoidectomy","Anterior ethmoidectomy","Maxillary antrostomy","Anterior ethmoidectomy with maxillary antrostomy ……………….."],"k":"A","x":"Adenoidectomy is the first-line surgical procedure for paediatric CRS (AAO-HNS consensus).","src":"2022 exam recall · Q76","d":"Paediatric"},{"s":"During an anterior transmaxillary approach, the anterior wall of the maxillary sinus should be reconstructed with","o":["Bone graft","Cartilage graft","Titanium mesh","No need for reconstruction……………………"],"k":"D","x":"The anterior maxillary wall after a Caldwell-Luc/transmaxillary approach generally needs no reconstruction (Bailey).","src":"2022 exam recall · Q77","d":"Rhinology"},{"s":"patient with HL in the only hearing ear due to diffuse tympanosclerosis , the best option is","o":["Removal of the plaques from tympanic membrane","Removal of the whole tympanic membrane","Removal of the whole ossicular chain and replace it by TORP","Removal of the sclerotic plaques and ossicle","Hearing aid"],"k":"E","x":"In the only hearing ear, diffuse tympanosclerosis is managed with a hearing aid; surgery risks SNHL (Brackmann).","src":"2022 exam recall · Q78","d":"Otology"},{"s":"The best line of treatment of uncontrolled unilateral Meniere's disease with severe vertigo & profound sensory neural hearing loss is ?","o":["Intratympanic injection of corticosteroids","Intratympanic injection of gentamicin","Labyrinthectomy","Vestibular nerve neurectomy","Ultrasound destruction of the semicircular canals"],"k":"C","x":"Unilateral Ménière disease with intractable vertigo and non-serviceable (profound) hearing: labyrinthectomy is definitive (Cummings).","src":"2022 exam recall · Q79","d":"Otology"},{"s":"Laryngeal cleft extend from interarytenoid till cricoid cartilage .What grade laryngeal cleft does the child have?","o":["Grade I","Grade II","Grade III","Grade IV ……………."],"k":"B","x":"⚑ Recalled answer: A (grade I); updated answer: B (grade II). — Benjamin–Inglis: type I interarytenoid above the cords; type II extends below the cords into (part of) the cricoid lamina; type III through the cricoid into the cervical trachea; type IV into the thoracic trachea (Cummings).","src":"2022 exam recall · Q80","d":"Paediatric"},{"s":"What are the histologic features of esethinoneuroblastema?","o":["Well differentiate cell with abundant cytoplasm","Poorly differentiated cells with multiple mitotic figures","Undifferentiated small neuroepithelial cells with densely staining nucleoli and scant cytoplasm","Granular cells in various stages of differentiation with high mitotic figures E. Moderately differentiated cell with abundant cytoplasm ……"],"k":"C","x":"Esthesioneuroblastoma: small round blue neuroepithelial cells with neurofibrillary matrix and Homer Wright/Flexner rosettes (Cummings).","src":"2022 exam recall · Q81","d":"Others"},{"s":"An injury that results in 3x3 cm loss of skin and perichondrium from auricle is best treated by a; A. Split thickness skin graft B. Full thickness skin graft C. Pedicled postauricular skin flap D. Excision of the exposed cartilage and primary closure E. Excision of the exposed cartilage and reconstruction with composite graft","o":["Split-thickness skin graft","Full-thickness skin graft","Pedicled postauricular skin flap","Excision of the exposed cartilage and primary closure","Excision of the exposed cartilage and reconstruction with a composite graft"],"k":"C","x":"When skin and perichondrium are lost, grafts cannot take on bare cartilage; a pedicled postauricular skin flap (or excision with composite repair for small defects) is used (Cummings).","src":"2022 exam recall · Q82","d":"Head & Neck"},{"s":"Pott's puffy tumor refer to","o":["Antrochoanal polyp","Osteomyelitis and subperosteal abscess","Retro orbital tumors","Frontal sinus mucocele","Inverted papilloma"],"k":"B","x":"Pott puffy tumour = frontal bone osteomyelitis with subperiosteal abscess (Scott-Brown).","src":"2022 exam recall · Q83","d":"Head & Neck"},{"s":"Vertiginous symptoms combined with SNHL, vertigo and tinnitus occurring in the first week following stapedectomy result from","o":["Serous labyrinthitis","Perylymph fistula","Suppurative labyrinthitis","Depressed footplate","Overlong prosthesis"],"k":"A","x":"Early vertigo, SNHL and tinnitus in the first week after stapedectomy are usually serous labyrinthitis (Brackmann).","src":"2022 exam recall · Q84","d":"Otology"},{"s":"Which of the following statement comparing congenital cholesteatomas anterior to the manubrium of the malleus to those that are posterior is true?","o":["Posterior cholesteatomas are more likely to recur","Posterior cholesteatomas occur in younger children","Both types are equally likely to involve the mastoid","Both types are equally likely to involve the ossicular chain","Anterior cholesteatomas are more likely to result in conductive hearing loss"],"k":"A","x":"Posterior congenital cholesteatomas present later and more often involve the ossicles and posterior mesotympanum (Ballenger).","src":"2022 exam recall · Q85","d":"Others"},{"s":"The most common characteristic of autoimmune deafness is","o":["Sudden sensory neural hearing loss","Rapidly progressive sensory neural hearing loss","Slowly progressive sensory neural hearing loss","Sudden deafness with severe vertigo","Associated with pulsatile tinnitus"],"k":"B","x":"Autoimmune inner ear disease = rapidly progressive (weeks–months), often bilateral SNHL (McCabe).","src":"2022 exam recall · Q86","d":"Others"},{"s":"As the intranasal surgeon is operating in the ethmoid sinus adjacent to the middle turbinate, he notes clear drainage from a white pulsating tissue. He has most likely entered the cribriform plate at a point that is associated with what structure?","o":["frontal recess",", dome of the ethmoid sinus","anterior ethmoidal artery","posterior base of skull","posterior ethmoidal artery……………….."],"k":"C","x":"Pulsating tissue with clear fluid near the middle turbinate attachment indicates skull base injury in the region of the anterior ethmoidal artery/lateral lamella (Byron).","src":"2022 exam recall · Q87","d":"Rhinology"},{"s":"The primary audiologic determinant of cochlear implant candidacy is","o":["Aided speech recognition scores","Speech reception thresholds","Frequency discrimination ability","Intensity discrimination ability","Sentence recognition scores …………………………"],"k":"A","x":"Cochlear implant candidacy is based mainly on best-aided speech recognition scores (Cummings).","src":"2022 exam recall · Q88","d":"Otology"},{"s":"Which of the following agents has a potential role in the etiology of otosclerosis (OS)?","o":["Influenza virus","Measles virus","Mumps virus","Epstein-Barr virus ………………….."],"k":"B","x":"Measles virus has been implicated in otosclerosis (Bailey).","src":"2022 exam recall · Q89","d":"Otology"},{"s":"In a dizzy patient with cholesteatoma, mastoid exploration might reveal lateral canal fistula. What other abnormality is likely to be found","o":["Oval window fistula","Posterior canal fistula","Dehiscence of the fallopian canal","Sigmoid sinus thrombophlebitis","Extradural granulation tissue"],"k":"C","x":"A lateral canal fistula is often accompanied by a dehiscent fallopian (facial) canal (Brackmann).","src":"2022 exam recall · Q90","d":"Otology"},{"s":"The organism involved in the pathogenesis of atrophic rhinitis is","o":["klebsiella rhinoscleromatis","klebsiella ozynae","none of the above","all of the above"],"k":"B","x":"Atrophic rhinitis (ozaena) is associated with Klebsiella ozaenae (Scott-Brown).","src":"2022 exam recall · Q91","d":"Others"},{"s":"What is the most common cause of dizziness in elderly patients?","o":["Meniere disease","Benign paroxysmal positional vertigo (BPPV)","Cerebrovascular accident (CVA)","Central neurologic disorder ……………………"],"k":"B","x":"BPPV is the commonest cause of dizziness in the elderly (Bailey).","src":"2022 exam recall · Q92","d":"Others"},{"s":"Within the middle cranial fossa, the arcuate eminence of the superior surface of the temporal bone corresponds to","o":["Cochlea","Superior semicircular canal","Tegmen tympani","Geniculate ganglion ………………………… b"],"k":"B","x":"The arcuate eminence overlies the superior semicircular canal (Cummings).","src":"2022 exam recall · Q93","d":"Others"},{"s":"In Zollenger wullestain classification which one is true","o":["Type V repair involves stapes footplate which is fixed","Type 3","Type 2 graft over stapes superstructure"],"k":"B","x":"⚑ No answer given in the recall; answered from the references. — Wullstein type III: graft placed on an intact mobile stapes (myringostapediopexy) (Brackmann).","src":"2022 exam recall · Q94","d":"Others"},{"s":"caloric test examine","o":["lateral SCC","posterior SCC","Superior SCC"],"k":"A","x":"Caloric testing assesses the lateral (horizontal) semicircular canal (Scott-Brown).","src":"2022 exam recall · Q95","d":"Otology"},{"s":"What laboratory finding is usually seen in Wegener’s granulomatosis cause otitis media?","o":["Positive purified protein derivative","Increased angiotensin-converting enzyme (ACE) level","Increased cytoplasmic-staining antineutrophil cytoplasmic antibody (C-ANCA)","Increased antinuclear antibody (ANA) titers"],"k":"C","x":"GPA (including otologic GPA) shows c-ANCA (PR3) positivity (Cummings).","src":"2022 exam recall · Q96","d":"Otology"},{"s":"A 40-year-old woman has complete transection of her facial nerve from a transverse temporal bone fracture 2 years ago. What test would be most helpful to determine the best treatment for facial reanimation?","o":["Temporal bone computed tomography scan with contrast","Electroneuronography","Electromyography (EMG)","Hilger stimulation test","Schirmer test………………………"],"k":"C","x":"Two years after transection, EMG assesses viability of the facial muscles to plan reanimation (Cummings).","src":"2022 exam recall · Q97","d":"Otology"},{"s":"the common otologic manifestation of fibrous dysplasia of temporal bone?","o":["facial palsy","expand EAC","Narrowing of EAC"],"k":"C","x":"Temporal bone fibrous dysplasia most commonly causes progressive narrowing of the external canal (± secondary cholesteatoma) (Brackmann).","src":"2022 exam recall · Q98","d":"Others"},{"s":"Patient with otitis externa worsen with use of corticosporin ear drop on examination there sever redness and no fungal material seen most likely diagnosis is","o":["allergy to neomycin","fungal infection","viral infection","subacute fungal infection"],"k":"A","x":"Worsening redness with neomycin-containing drops (Cortisporin) suggests contact allergy to neomycin (Bailey).","src":"2022 exam recall · Q99","d":"Otology"},{"s":"A 35 year-old woman has a 5 day history of sudden facial paralysis with no hearing loss nor tinnitus. MRI scan reveals enhancement near the distal end of the internal auditory canal on the affected side. Which of the following statements is TRUE?","o":["Prognosis for recovery is poor","Air contrast CT scan should be performed","Gadolinium-enhanced MRI scan 4 months later is likely to be normal","Further neurological deficits develop frequently","Selective vertebral artery angiography should be performed","inal written exam"],"k":"C","x":"Facial nerve enhancement on MRI in Bell palsy is common; follow-up MRI (about 4 months) confirms resolution and excludes tumour (Cummings).","src":"2022 exam recall · Q100","d":"Otology"}]},{"title":"2022 Exam · Paper 2","q":[{"s":"Fungal infection associated with prosthesis failure tracheoesophageal puncture","o": oadjuvant chemotherapy","radical RT","chemoradiotherapy","surgery and adjuvant RT"],"k":"E","x":"Laryngeal SCC with extralaryngeal spread (T4a) is treated by total laryngectomy and adjuvant (chemo)radiation (NCCN).","src":"2022 exam recall · Q5","d":"Laryngology"},{"s":"The MOST specific test for infectious mononucleosis is","o":["Monospot test","Paul Bunnell test","EBV IgM to viral capsid antigens","Atypical lymphocytes in the peripheral blood picture","Leucopenia with relative monocytosis"],"k":"C","x":"EBV viral capsid antigen IgM is the most specific test for acute infectious mononucleosis (Scott-Brown).","src":"2022 exam recall · Q6","d":"Others"},{"s":"Which of the following factors indicates the poorest prognosis for patients with nasopharyngeal carcinoma ?","o":["Tumour grade","Fixed nodal metastasis","Cranial nerve involvement","Bilateral neck nodes involvement","Contralateral neck node involvement answer c"],"k":"C","x":"Cranial nerve involvement (skull base/intracranial extension, T4) carries the poorest NPC prognosis (Scott-Brown).","src":"2022 exam recall · Q7","d":"Rhinology"},{"s":"Which one describe partial parotidectomy","o":["parotid tumor removal with 1cm cuff of normal surrounding parotid tissue after main trunk identification and branches that only surround tumor","Dissection a round tumor capsule , without facial nerve identification under facial nerve monitor","Excision superficial and accessory lobe of parotid gland","Complete removal of parotid gland superfacial to plane of facial nerve","excision of superfacial and deep lobes while preserving facial nerve"],"k":"A","x":"Partial (extracapsular/partial superficial) parotidectomy removes the tumour with a cuff of normal parotid tissue after identifying the facial nerve (Cummings).","src":"2022 exam recall · Q8","d":"Head & Neck"},{"s":"For patients undergoing head and neck procedures, postoperative stroke from vascular emboli is most likely to result from","o":["Preoperative radiation therapy","Hyperextension of the neck","A stage III or higher malignancy","Bilateral internal jugular vein resection","Anterior dislocation of the temporo-mandibular joint answer b cumming 3rd"],"k":"B","x":"Neck hyperextension/rotation can dislodge carotid plaque or compress vertebral flow, producing embolic stroke (Byron).","src":"2022 exam recall · Q9","d":"Head & Neck"},{"s":"Before undergoing adenotonsillectomy, all patients with Down's syndrome should undergo which of the following tests?","o":["Pulmonary function","MRI head and neck","Rhinomanometry","Immunoglobulin levels","Flexion & extension cervical spine X-ray answer E cumming 3rd"],"k":"E","x":"Children with Down syndrome need assessment for atlantoaxial instability (flexion–extension cervical spine X-ray) before adenotonsillectomy (Scott-Brown).","src":"2022 exam recall · Q10","d":"Others"},{"s":"Vocal tremor caused by which one of the following","o":["mysthenia gravis","VC palsy","GERD","Spasmodic dysphonia","Parkinson disease"],"k":"E","x":"Vocal tremor occurs in neurological disorders such as Parkinson disease and essential tremor (Cummings).","src":"2022 exam recall · Q11","d":"Laryngology"},{"s":"50 year female diagnose with stage 4A SCC of oral cavity, she is scheduled for wide local excision with segmental mandibulotomy, neck dissection and reconstruction with free fibula flap .which one is the pedicle of free fibula flap","o":["peroneal artery","Ant. Tibial a","Post. Tibial a","Tibioperoneal trunck","Middle tibial a"],"k":"A","x":"The fibula free flap is based on the peroneal artery (Cummings).","src":"2022 exam recall · Q12","d":"Head & Neck"},{"s":"Submandibular gland with intraductal swelling or stricture is an indication for","o":["Sialography","Sialoendoscopy","MRI","CT scan","Removal of gland"],"k":"B","x":"Duct stricture or intraductal pathology of the submandibular gland is an indication for sialendoscopy (Cummings).","src":"2022 exam recall · Q13","d":"Others"},{"s":"1 year child diagnose with r old women with musculine voice undergone isski thyroplasty type 4 .which of the following done in thus procedure","o":["VC shortening","VC lengthening","VC medilization","VC lateralization","Medilization with relaxation thyroplasty"],"k":"B","x":"Isshiki type IV thyroplasty (cricothyroid approximation) lengthens and tenses the vocal folds to raise pitch (Cummings).","src":"2022 exam recall · Q18","d":"Laryngology"},{"s":"Lemierre 's syndrome is caused by which of the following","o":["Spread of infection to the mediastinum","Thrombosis of the carotid artery","Most commonly caused by Fusobacterium necrophorum (septic IJV thrombophlebitis)","Metastatic lung disease","Rupture of the carotid artery"],"k":"C","x":"Lemierre syndrome is septic IJV thrombophlebitis most commonly caused by Fusobacterium necrophorum (Cummings).","src":"2022 exam recall · Q19","d":"Others"},{"s":"Which of the following would most contribute to the development of a postintubation laryngeal stenosis?","o":["Frequent suctioning","Use of a cuffed endotracheal tube","Use of inert material i n tube construction","Employing high concentrations of oxygen","Patient agitation"],"k":"E","x":"Patient agitation/movement with the tube in place increases mucosal injury and post-intubation stenosis (along with tube size and duration) (Dr Zuhdi; Cummings).","src":"2022 exam recall · Q24","d":"Laryngology"},{"s":"The chin tuck maneuver brings the patients chin to his chest. This action helps preventaspiration during swallowing by","o":["Pushing tongue base to the pharyngeal wall and moving the epiglottis posteriorly","tilting the arytenoids forward","Stretching open the Cricopharyngeas muscle","Keeping the vocal cords closed","Stretching the base of the tongue to improve swallowing answer a shah"],"k":"A","x":"The chin tuck pushes the tongue base toward the posterior pharyngeal wall and narrows the laryngeal entrance, reducing aspiration (Cummings).","src":"2022 exam recall · Q25","d":"Laryngology"},{"s":"Biopsy proven granulomatous inflammation of a cervical Lymph node in a child, the MOST COMMON cause is","o":["Mycobacterium tuberculosis,","Staph aureus","Anaerobes","Cat-scratch disease","Nontuberculous mycobacteria answer e"],"k":"E","x":"Granulomatous cervical lymphadenitis in children is most often due to non-tuberculous mycobacteria (Cummings).","src":"2022 exam recall · Q26","d":"Paediatric"},{"s":"All the following about laser surgery is true EXCEPT","o":["Laser beam is collomnated","Thermal effects include contraction of collagen","CO2 laser can seal blood vessels up to 2mm in diameter","Vaporization is produced by boiling of intracellular water","At lower power surgical lasers may produce biostimulation"],"k":"C","x":"The CO2 laser coagulates vessels only up to about 0.5 mm; larger vessels need other haemostasis (Cummings).","src":"2022 exam recall · Q27","d":"Others"},{"s":"Which of the following is the most probable explanation for respiratory arrest in a patient with chronic pulmonary disease during or immediately following tracheotomy?","o":["Vasovagal reflex","Hypotension","Intraluminal bleeding","Rapid clearing of retained CO2","Obstruction of tracheotomy tube"],"k":"D","x":"Rapid washout of retained CO2 after tracheotomy in chronic lung disease removes the hypercapnic drive, causing apnoea (Scott-Brown).","src":"2022 exam recall · Q28","d":"Laryngology"},{"s":"Which one of the following conditions of the vocal cord has the maximum malignant transformation potential?","o":["Leukoplakia","Erythroplakia","Leukoerythroplakia","Keratosis","Moderate dysplasia"],"k":"B","x":"Erythroplakia carries the highest risk of malignant transformation (Cummings).","src":"2022 exam recall · Q29","d":"Laryngology"},{"s":"The commonest site for TGDC ( Thyroglossal duct cyst) is","o":["Lingual","Suprahyoid","Infrahyoid","Prethyroid","Pretracheal answer c shah 2017"],"k":"C","x":"Most thyroglossal duct cysts are infrahyoid (thyrohyoid region) (Shah).","src":"2022 exam recall · Q30","d":"Others"},{"s":"When should permanent treatment for vocal old paralysis be undertaken?","o":["At one month after onset","Not earlier than 2 years after onset","Only for severe symptomatology,","After resolution of dysphagia symptoms","When electromyography demonstrates poor prognosis for recovery answer e"],"k":"E","x":"Permanent treatment of vocal fold paralysis is undertaken when recovery is unlikely — e.g., EMG shows poor prognosis — or after 9–12 months (Cummings).","src":"2022 exam recall · Q31","d":"Laryngology"},{"s":"All are true inclusion criteria for transoral laser excision of glottic carcinoma EXCEPT","o":["Complete visualization","Tumor extension to other cord <3mm","Supraglottic extension no further than lateral extension of ventricle","Absence of arytenoid involvement except muscular process","Subglottic extension < than 5 mm"],"k":"D","x":"TLM criteria include complete exposure, limited anterior commissure/subglottic extension; arytenoid involvement is not an absolute exclusion (Cummings).","src":"2022 exam recall · Q32","d":"Laryngology"},{"s":"Blair incision used for","o":["Parotidectomy","Facial degloving","Maxillectomy","Zenker diverticulum","Lateral pharyngotomy"],"k":"A","x":"The Blair (modified Blair/lazy-S) incision is used for parotidectomy (Cummings).","src":"2022 exam recall · Q33","d":"Others"},{"s":"Which of the following factors is most responsible for the subsequent formation of granulation tissue following laryngeal injury?","o":["Cartilage fracture","Haematoma","Exposed cartilage","Mucosal oedema"],"k":"C","x":"Exposed cartilage after laryngeal injury drives granulation tissue formation and stenosis (Cummings).","src":"2022 exam recall · Q34","d":"Laryngology"},{"s":"Which of the following dysphonia s is sometimes associated with bowed vocal cords?","o":["Conversion aphonia","Psychogenic dysphonia","Muscular tension dysphonia","Adolescent transitional dysphonia","Supraglottic lateral contraction"],"k":"B","x":"Bowed vocal folds can be seen in psychogenic dysphonia (Byron).","src":"2022 exam recall · Q35","d":"Laryngology"},{"s":"Which of the following factors is the most important predictor of tumor recurrence in the neck following neck dissection?","o":["Location of the primary","Single histologically positive lymph node",", Positive nodes at multiple levels in the neck","Extracapsular extension of tumor","Multiple histologically positive lymph nodes answer d"],"k":"D","x":"Extracapsular extension is the strongest predictor of neck recurrence (Bailey).","src":"2022 exam recall · Q36","d":"Head & Neck"},{"s":"The most common abnormality associated with Laryngopharyngeal reflux (LPR) is","o":["Vocal cord nodules","Posterior laryngeal granuloma","Vocal cord paralysis","Vocal cord atrophy","Sulcus vocalis."],"k":"B","x":"LPR is most commonly associated with posterior laryngitis and contact granuloma (Byron).","src":"2022 exam recall · Q37","d":"Laryngology"},{"s":"Most common cause of vertigo in children is","o":["Usher syndrome","Benign paroxysmal positional vertigo","Basilar migraine","Drug induced ototoxicity","Dehiscent superior semicircular canal syn"],"k":"C","x":"The commonest cause of vertigo in children is migraine-related (benign paroxysmal vertigo of childhood/vestibular migraine) (Cummings).","src":"2022 exam recall · Q39","d":"Paediatric"},{"s":"Which of the following variables present a significant risk factor for malignant transformation of recurrent respiratory papillomatosis in adults?","o":["Number of surgical interventions","Age of the patient","Treatment with cidofovir","Absence of HPV DNA on PCR of papilloma specimen","Tobacco use"],"k":"D","x":"⚑ Debatable item; the recalled (Academy) key is kept. — In adult RRP, malignant transformation is associated with HPV-negative/integrated HPV-11, smoking and radiation (Academy review).","src":"2022 exam recall · Q40","d":"Laryngology"},{"s":"The most common cause of facial paralysis in children is","o":["Bell palsy","Acute otitis media","Trauma","Möbius syndrome"],"k":"A","x":"Bell palsy is the commonest cause of facial paralysis in children, followed by otitis media and trauma (Cummings).","src":"2022 exam recall · Q41","d":"Paediatric"},{"s":"Which of the following salivary cancers arising in the parotid gland is MOST LIKELY to metastasize to cervical nodes?","o":["Adenoid cystic carcinoma,","Low-gradc mucoepidermoid carcinoma","Epithelial-myoepithelial carcinoma","Carcinoma ex pleomorphic adenoma,","Acinic cell carcinoma"],"k":"D","x":"High-grade carcinoma ex pleomorphic adenoma frequently metastasizes to cervical nodes (Shah).","src":"2022 exam recall · Q42","d":"Head & Neck"},{"s":"46-year-old male presents with a nasopharyngeal mass and a 5 cm ipsilateral lymph node. Biopsy of the nasopharynx is reported as nonkeratinizing squamous cell carcinoma. What is the MOST appropriate treatment ?","o":["Chemoradiotherapy to the post nasal space, ipsilateral modified radical neck dissection and contralateral selective neck dissection","Palliative care","Primary chemo-radiotherapy","Radiotherapy to the post nasal space and ipsilateral modified radical neck dissection","Surgical debulking of the post nasal space, bilateral modified radical neck dissections and postoperative radiotherapy. Answer c"],"k":"C","x":"Locoregionally advanced NPC: concurrent chemoradiotherapy (Oxford; NCCN).","src":"2022 exam recall · Q43","d":"Rhinology"},{"s":"In extend supraomohyoid selective neck dissection you remove lymph nodes of levels","o":["11, III&IV","I, II, III &.IV","I-V","I.II &III","11, III, IV&V"],"k":"B","x":"Extended supraomohyoid neck dissection = levels I–IV (Shah).","src":"2022 exam recall · Q44","d":"Head & Neck"},{"s":"5 year old boy with recurrent painful parotid swelling of 1 year duration diagnosis","o":["Sjogren","Juvenile recurrnt parotiditis","Sialolithiasis","Mump","Stone!!"],"k":"B","x":"Recurrent painful parotid swelling in a young child = juvenile recurrent parotitis (Cummings).","src":"2022 exam recall · Q45","d":"Paediatric"},{"s":"In a child with malignant nasopharyngeal mass the Most likely tumor is","o":["Adenocarcinoma","Chondroma","Rhabdomyosarcoma","Lymphoma","Craniopharyngoma"],"k":"C","x":"Rhabdomyosarcoma is the commonest malignant nasopharyngeal/paediatric head and neck sarcoma in young children (Dhingra).","src":"2022 exam recall · Q46","d":"Paediatric"},{"s":"What is the MOST common site for rhabdomyosarcoma of the head and neck ?","o":["Frontal sinus","Middle ear and mastoid","Nasopharynx","Orbit","Paranasal sinuses"],"k":"D","x":"The orbit is the commonest head and neck site of rhabdomyosarcoma (Dhingra).","src":"2022 exam recall · Q47","d":"Head & Neck"},{"s":"All are contraindications of radical neck dissection EXCEPT","o":["Carotid artery encasement","Paraspinus muscle invasion","Uncontrolled primary tumor site","Phrenic nerve and brachial plexus palsy","Gross invasion of spinal accessory nerve"],"k":"E","x":"Gross invasion of the spinal accessory nerve is an indication for, not a contraindication to, radical neck dissection (Shah).","src":"2022 exam recall · Q48","d":"Head & Neck"},{"s":"Which of the following factors most adversely influences survival for patients who have a malignant parotid tumour ?","o":["Presence of pain","High grade malignancy","Presence of facial nerve paralysis","Deep lobe involvement by tumour","Presence of lymph node metastases"],"k":"C","x":"Facial nerve paralysis with a parotid malignancy is among the strongest adverse prognostic factors (Cummings).","src":"2022 exam recall · Q49","d":"Head & Neck"},{"s":"Which of these is the most common presenting symptom( s) for tracheal adenoid cystic carcinoma?","o":["Hemoptysis","Dyspnea","Fever","Dysphagia","Neck mass"],"k":"B","x":"Tracheal adenoid cystic carcinoma most often presents with dyspnoea/wheeze (Bailey).","src":"2022 exam recall · Q50","d":"Laryngology"},{"s":"The optimal treatment for a small recurrent nasopharyngeal (NP) carcinoma in the nas   <div class="row"><button class="ghost" onclick="startScreen()">Retake paper</button></div>`;scrollTo(0,0)}
function review(t,list){S.list=list;S.rpos=0;S.rtitle=t;rshow()}
function rshow(){const i=S.list[S.rpos],q=Q[i],a=S.ans[i];
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="results()">Results</button><span class="t">${S.rtitle} · ${S.rpos+1}/${S.list.length}</span>${S.flag[i]?'<span class="flagbtn on">Flagged</span>':''}</div></div>
  <div class="qn">Question ${i+1}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,j)=>{const l=L[j];const c=l==q.k?'ok':(l==a?'bad':'');h+=`<button class="opt ${c}" disabled><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  h+=expl(q,a);$('#app').innerHTML=h;
  nav(`<button class="ghost" ${S.rpos?'':'disabled'} onclick="S.rpos--;rshow();scrollTo(0,0)">Previous</button><button class="primary" ${S.rpos<S.list.length-1?'':'disabled'} onclick="S.rpos++;rshow();scrollTo(0,0)">Next</button>`)}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
window.addEventListener('beforeunload',e=>{if(S.phase=='run'){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(S.phase!='run'||$('#dlg').open)return;if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else{const i=L.indexOf(e.key.toUpperCase());if(e.key.length==1&&i>=0&&i<Q[S.pos].o.length)pick(L[i])}});
startScreen();

function pickPaper(i){PI=i;P=PAPERS[i];Q=P.q;S.ans={};S.flag={};S.pos=0;startScreen()}</script></body></html>
