<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Otolaryngology Specialty Board Review (630 MCQs) — Interactive Quiz</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--box:#0B1418;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--box:#000;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.chap{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px}
.chap.on{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.chap b{flex:1;font-weight:600}
.chap span{color:var(--muted);font-variant-numeric:tabular-nums}
.chap .done{font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px}
.seg button.on{background:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#06201F}}
.primary{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
@media (prefers-color-scheme:dark){.primary{color:#06201F}}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.topi .t{flex:1;min-width:0;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topi .sc{font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width .25s}
.qn{font:600 .9rem/1 inherit;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.note{font-size:.9rem;color:var(--muted);margin:-4px 0 12px}
.flag{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:6px;font-size:.92rem;margin:0 0 12px}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}
.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}
.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:12px 0 4px}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-cur{outline:2px solid var(--teal);outline-offset:1px}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:8px 0}
table{width:100%;border-collapse:collapse;margin:12px 0 18px;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const DATA=[{"t":"Q1–15 · Anatomy of the Ear","q":[{"bn":1,"s":"The temporalis muscle attaches to the","o":["mastoid process","tympanic portion of the temporal bone","styloid process","squamosa portion of the temporal bone","greater wing of the sphenoid bone"],"k":"D","x":"","n":1},{"bn":2,"s":"The anterior boundary of the tympanic cavity is the","o":["styloid process, carotid wall","styloid process, tensor palati","carotid wall, tympanic part of the temporal bone","eustachian tube, carotid wall, pyramidal prominence","carotid wall, eustachian tube, tensor tympani"],"k":"E","x":"This is important to be aware of in performing middle ear surgery, but it is also important clinically to appreciate the close proximity. of the carotid artery in relationship to the middle ear. A patient with pulsatile tinnitus should be investigated from the point of view of any carotid abnormalities. (Ref: Essential Otolaryngology, p. 2)","n":2},{"bn":3,"s":"The Meckel cave (where the gasserian ganglion [V] is located) is a concavity in the following part of the temporal bone","o":["anterior","superior","lateral","medial","anterior lateral"],"k":"B","x":"","n":3},{"bn":4,"s":"Gradenigo syndrome is associated with inflammation of the following cranial nerve in the Dorello canal","o":["IV","V","VII","VI","Il"],"k":"D","x":"The Dorello canal is between the petrous tip and the sphenoid bone. Gradenigo syndrome is related to petrositis in the ear with involvement of the VI nerve and is associated with pain behind the eye, diplopia, and aural discharge. (Ref: Essential Otolaryngology, p. 3)","n":4},{"bn":5,"s":"Trautmann triangle is determined by the","o":["middle fossa dura plate, sigmoid sinus, and semicircular canals","spine of Henle, dura plate, and semicircular canals","sigmoid sinus, bony labyrinth, and superior petrosal sinus or dura","bony labyrinth, spine of Henle, and semicircular canals","lateral wall of epitympanum, dura plate, and sigmoid sinus"],"k":"C","x":"This is important because in mastoid surgery there is a very close relationship between the sigmoid sinus, the superior pet- 5 ef ct 7 H rosal sinus, and the bony labyrinth. (Ref: Essential Otolaryngology, p. 3)","n":5},{"bn":6,"s":"The upper limit of normal for the diameter of the internal auditory canal in an adult male is","o":["9mm","6mm","7mm","5mm","8mm"],"k":"E","x":"","n":6},{"bn":7,"s":"The posterior semicircular canal and saccule are innervated by the","o":["Jacobson nerve","auricular temporal nerve","inferior vestibular nerve","auricular nerve","superior vestibular nerve"],"k":"C","x":"Surgical intervention in patients with persistent BPV or recurrent vestibulopathy involves singular neurectomy, vestibular neurectomy, and most recently posterior semicircular canal occlusion. (Ref: Otolaryngology—Head and Neck Surgery, p. 3166)","n":7},{"bn":8,"s":"The inferior tympanic artery to the middle ear is a branch of the","o":["postauricular artery","caroticotympanic artery","ascending pharyngeal artery","external maxillary artery","middle meningeal artery"],"k":"C","x":"The arterial supply to the middle ear is very generous and has blood supply from both the external and internal carotid artery. The long process of the incus receives the least blood supply and is most frequently necrosed. (Ref: Essential Otolaryngology, p. 6)","n":8},{"bn":9,"s":"The superior portions of the utricle and saccule and the superior and horizontal semicircular canals are supplied by the following artery","o":["anterior vestibular","common cochlear","cochlear vestibular","posterior vestibular","common cochlear"],"k":"A","x":"A branch from the anterior vestibular artery forms the cochlear vestibular artery. The posterior vestibular artery supplies the inferior. portion of the utricle and saccule and the posterior , semicircular canal. (Ref: Essential Otolaryngology, p.7)","n":9},{"bn":10,"s":"The lobule of the ear has sensory innervation from","o":["C, via the greater auricular nerve","V,, auricular temporal nerve","X auricular branch","VI auricular sensory nerve","C.,,, via lesser occipital nerve"],"k":"E","x":"This nerve can be severed while doing a thytidectomy and it is important to explain to a patient preoperatively that there may be some numbness to the ear lobe after surgery. (Ref: Essential Otolaryngology, p.7)","n":10},{"bn":12,"s":"The scala vestibuli and the scala media are separated by the","o":["Reissner membrane","tectorial membrane","basilar membrane","spiral ligament","Deiters membrane"],"k":"A","x":"The Reissner membrane is a three-layered structure, consisting of two cell layers separated by a basal lamina. The Reissner membrane is attached medially to the modiolar edge of the spiral limbus and laterally to the spiral ligament at the apical edge of the stria vascularis. (Ref: Otolaryngology—Head and Neck Surgery, pp. 2499-2502)","n":11},{"bn":13,"s":"In the adult, the eustachian tube is approximately the following length","o":["50mm","20mm","35mm","40mm","45mm"],"k":"C","x":"At birth, the eustachian tube is horizontal and it grows to be","n":12},{"bn":14,"s":"The auricle of the ear has reached adult shape by the following week of gestation","o":["8th","24th","20th","10th","30th"],"k":"C","x":"","n":13},{"bn":15,"s":"Congenital microtia occurs in the following incidence","o":["1:20,000","1:50,000","1:40,000","1:100,000","1:60,000"],"k":"A","x":"","n":14}]},{"t":"Q16–35 · Audiology","q":[{"bn":16,"s":"The human ear is capable of hearing the frequency range from","o":["500 to 5000 Hz","100 to 10,000 Hz","10 to 30,000 Hz","1000 to 10,000 Hz","20 to 20,000 Hz"],"k":"E","x":"Frequency refers to the number of cycles (complete oscillations) of a vibrating body per unit of time; the psychoacoustic","n":1},{"bn":17,"s":"In audiology, speech noise is white noise with the following frequencies filtered out","o":["below 300 Hz and above 3000 Hz","below 800 Hz and above 4000 Hz","below 100 Hz and above 5000 Hz","below 50 Hz and above 8000 Hz —","below 20 Hz and above 20,000 Hz"],"k":"A","x":"In audiology, white noise contains all frequencies in the spectrum. With speech noise, frequencies above 3000 Hz and below 300 Hz are filtered out. (Ref: Essential Otolaryngology, p. 26)","n":2},{"bn":18,"s":"The decibel scale is logarithmic and incorporates a ratio. All of the following are used for reference levels except","o":["intensity","barometric pressure","sound pressure","hearing","sensation level"],"k":"B","x":"Barometric pressure is incorrect. All the other factors are important, and it is important to remember a decibel is a logarithm of a ratio of two numbers or sounds: a referent and the sound being described. (Ref: Essential Otolaryngology, p. 26)","n":3},{"bn":19,"s":"The effective vibrating part of the tympanic membrane is approximately","o":["90 mm?","80mm?","70mm","55 mm²","40mm?"],"k":"D","x":"","n":4},{"bn":21,"s":"In 1960, Bekesy outlined his theory of hearing. He stated that when the stapes footplate moves in and out of the oval window, there is a resulting upward and downward movement of the basilar membrane, which causes distortion of the endolymph. This theory is called the","o":["Resonance Theory of Hearing","Place Theory of Hearing","Traveling Wave Theory of Hearing","Frequency Theory of Hearing","Volley Theory of Hearing RIGHT EAR Frequency in Hertz 250 500 1K 2K 4K 8K"],"k":"C","x":"This is called the Traveling Wave Theory of Hearing. Current belief is that we hear by a combination of the above mechanisms. (Ref: Essential Otolaryngology, p. 30) r","n":5},{"bn":26,"s":"During a Carhart Tone Decay Test, one presents a tone at the threshold for the following number of seconds","o":["20","40","60","80","90"],"k":"C","x":"A tone is presented for 60 seconds in the Carhart Tone Decay Test. If the tone disappears, raise the stimulus level and continue until the patient can hear for 60 seconds. If this last level is 20 dB or more above threshold, the test is positive for retrocochlear pathology. (Ref: Essential Otolaryngology, p. 48)","n":6},{"bn":27,"s":"The following test is similar to the Carhart test but it incorporates rest periods during the testing. It is the","o":["Olson—Noffsinger Test","Owen Test","Rosenberg One-Minute Test","Green Modified Tone Decay Test","Suprathreshold Adaptation Test es"],"k":"B","x":"The Owen Test is a test to help rule out retrocochlear pathology. It is similar to the Carhart and Olson—Noffsinger Tests. (Ref: Essential Otolaryngology, p. 48)","n":7},{"bn":28,"s":"In Bekesy Audiometry when there is a continuous tracing above the pulsed tracing, this is indicative of a functional hearing loss. This is called a Bekesy type","o":["I","II","Oi","IV","V"],"k":"E","x":"","n":8},{"bn":29,"s":"In acoustic reflex testing, the reflex will likely be absent if there is conductive pathology or a sensorineural hearing loss greater than","o":["20dB","40dB","60dB","70dB","80dB"],"k":"C","x":"The acoustic reflex is usually absent if there is a greater than 60 dB sensorineural hearing loss. normal hearing, stimulation of either side elicits a bilateral reflex. (Ref: Essential Otolaryngology, p. 42)","n":9},{"bn":30,"s":"In high risk neonates, the following percentage of the screen group will have hearing loss using Brainstem Evoked Response Audiometry","o":["1to2%","2to3%","3to4%","5to7%",">7%"],"k":"C","x":"","n":10},{"bn":32,"s":"A positive Bing test is indicative of","o":["conductive hearing loss","tympanic membrane perforation","normal hearing a OO","sensorineural hearing loss","mixed hearing loss"],"k":"C","x":"A positive Bing test is indicative of normal hearing. It is a tuning fork test in which the tone is louder with the ear canal occluded: (Ref: Essential Otolaryngology, p. 33)","n":11},{"bn":33,"s":"The tuning fork test in which the tuning fork is placed against the mastoid and then, when it is no longer heard, is placed against the tragus while the examiner gently occludes the meatus is called the","o":["Lewis Test","Gelle Test","Schwabach Test","Bing Test","Weber Test"],"k":"A","x":"This is the Lewis Test. This is not a good test, and interpretation of the test is neither simple nor consistent. (Ref: Essential Otolaryngology, p. 34)","n":12},{"bn":34,"s":"According to OSHA, Permissible Noise Exposure over an 8-hour day should not.exceed","o":["704B","80dB","90dB","100dB","1104B"],"k":"C","x":"The maximal permissible limit for exposure to noise over an 8-hour period is 90 dB. If one increased the noise to 95 dB, then the maximal exposure period would be 4 hours. (Ref: Otolaryngology—Head and Neck Surgery, p. 2897)","n":13},{"bn":35,"s":"Earmuffs, custom-fitted earplugs, or disposable earplugs each provide the following amount of sound attenuation","o":["5to10dB","10to20dB","20to 40 dB","40to50dB","50 to 70 dB"],"k":"C","x":"Most commercially available ear plugs will provide only 20 to 40 dB of sound attenuation. (Ref: Essential Otolaryngology, p. 67) Mt . Ht LY I! l Electrical Response Audiometry","n":14}]},{"t":"Q36–45 · Electrical Response Audiometry","q":[{"bn":36,"s":"The origin of the summating potential is the","o":["hair cells","stria vascularis","auditory nerve","supporting cells","cochlear nucleus"],"k":"A","x":"The summating potential (SP) is generated by the hair cells and is a direct current shift of the baseline of the recording. It is almost always negative for all frequencies and intensity levels. (Ref: Essential Otolaryngology, p.'16)","n":1},{"bn":37,"s":"The generator site for wave V of the brainstem evoked response audiometry (ABR) is thought to be the","o":["auditory nerve","superior olive","inferior colliculus","hair cells","cochlear nucleus"],"k":"C","x":"Wave II is from the VIIIth nerve or cochlear nucleus (3.0 msec). Wave III is the cochlear nucleus or superior olive (4.1 msec). Wave IV is the lateral lemniscus (5.3 msec). Wave V is the inferior colliculus (5.9 msec). (Ref: Essential Otolaryngol- J ogy, p. 73)","n":2},{"bn":38,"s":"The ABR generated by a broad-band click stimulus has its major contribution from the following frequency range","o":["250 to 500 Hz","500 to 1000 Hz","1000 to 2000 Hz","2000 to 3000 Hz","3000 to 4000 Hz"],"k":"E","x":"","n":3},{"bn":39,"s":"A patient has a 60 dB hearing level at 4000 Hz in the suspect ear. To correct the latency of the ABR for this patient, the following time interval should be deducted","o":["0.05 msec","0.1 msec","0.2 msec","0.3 msec","0.4 msec"],"k":"B","x":"","n":4},{"bn":40,"s":"The least interaural latency difference considered suspicious for an acoustic tumor is","o":["0.1 msec","0.2 msec","0.3 msec","0.4 msec","0.5 msec"],"k":"B","x":"The interaural difference in wave V latency, called ITS, will normally be 0.2 milliseconds (allowing for observational error). Experience has shown that ITS is greater than 0.2 milliseconds in more than 96% of acoustic tumors and thus is an excellent diagnostic measure. (Ref: Essential Otolaryngology, p. 84)","n":5},{"bn":41,"s":"The cochlear microphonic originates from the","o":["auditory nerve","cochlear nucleus","stria vascularis","hair cells","inferior colliculus"],"k":"D","x":"The source of the cochlear microphonic (CM) is the hairbearing surface of the hair cells. Its onset is immediate and it mimics the wave form of the acoustic stimulus. (Ref: Essential Otolaryngology, p. 75)","n":6},{"bn":42,"s":"Of the following, the most accurate noninvasive test for acoustic tumor diagnosis is","o":["computerized tomography","auditory brainstem responses","the crossed acoustic reflex","temporal bone polytomography","electronystagmosgraphy T"],"k":"B","x":"The success of ABR depends on the fact that acoustic tumors stretch or compress the auditory nerve, producing a delay in the response latency that ABR ‘can detect. This delay may occur in an ear with normal hearing. Conversely, cochlear lesions have little effect on the brainstem response latencies for high intensity stimuli until the hearing loss becomes severe. (Ref: Essential Otolaryngology, p. 84)","n":7},{"bn":43,"s":"The normal latency of the fifth wave of the ABR is in the range of","o":["1 to 2 msec","2to3 msec","3to4 msec","4to5 msec","5 to 6 msec"],"k":"E","x":"Wave V is at the level of the inferior colliculus and has a normal latency of 5.9 msec. (Ref: Essential Otolaryngology, f p. 73)","n":8},{"bn":44,"s":"The origin of wave of the ABR is the","o":["primary auditory projections","hair cells","inferior colliculus","auditory nerve","cochlear nucleus"],"k":"D","x":"","n":9}]},{"t":"Q46–55 · The Vestibular System, Part I","q":[{"bn":46,"s":"The kinocilia are located","o":["inthe saccule","in the utricle","completely along the top of each hair cell","atthe end of each hair cell nearest the tallest stereocilia","inthe saccular aqueduct"],"k":"D","x":"Each hair cell has two varieties of hairs or cilia. The stereocilia are arranged in an ascending pipe organ manner. A single kinocilium is located at the end nearest the tallest stereocilia. The kinocilium is less rigid in structure than the stereocilia and appears wavy and more flexible. The deflection of the cilia either toward or away from the kinocilium stimulates the hair cell. (Ref: Essential Otolaryngology, p. 94)","n":1},{"bn":47,"s":"The utricle is primarily sensitive to","o":["vertical movement","angular movement","circular movement","linear movement","spatial movement"],"k":"D","x":"","n":2},{"bn":48,"s":"A 40-year-old patient is having a caloric test done. Stimulating the right ear with water w rmer than body temperature results in the following directional movement of endolymph","o":["ampullofugal","vertical","utriculofugal","away from the utricle","ampullopetal"],"k":"E","x":"Stimulating the right ear with water warmer than the body temperature results in an ampullopetal (toward the ampulla) or utriculopetal (toward the utricle) movement of endolymph. This endolymph flow deflects the stereocilia toward the kinocilia. (Ref: Essential Otolaryngology, p. 94)","n":3},{"bn":49,"s":"The endolymphatic potential across the membrane separating the endolymph from the perilymph is","o":["20mV","40mV","80mV","200 mV","150mV"],"k":"C","x":"","n":4},{"bn":50,"s":"In electronystagmography testing (ENG), investigators use the following percentage difference between right-beating and leftbeating nystagmus to be significant in the Jongkee formula for directional preponderance (DP)","o":["10to 15%","15 to 20%","25 to 30%","35 to 40%","40 to 45%"],"k":"C","x":"Directional preponderance (DP) refers only to bithermal caloric testing. It simply means there is more nystagmus beating in one direction compared to the other despite normal differences between ears. When present at pathologic or significant levels, it ( means that the vestibular system is not functioning normally and is not useful for localizing the disorder. (Ref: Essential Otolaryngology, p. 102)","n":5},{"bn":52,"s":"Simultaneous binaural bithermal stimulus testing produces diagnostic information and is what percentage more sensitive than the alternate binaural bithermal method done?","o":["10%","20%","30%","45%","55%"],"k":"E","x":"For this reason, simultaneous binaural bithermal stimulus is recommended as a 6.5-minute addition to the vestibular evaluation. (Ref: Essential Otolaryngology, pp. 103-104)","n":6},{"bn":53,"s":"A 60-year-old male is suspected of having a central lesion. One of the most reliable signs would be","o":["failure of ocular fixation","right-beating nystagmus","direction-fixed nystagmus","direction-changing position nystagmus","ocular fixation"],"k":"A","x":"Failure of ocular fixation suppression is a very reliable sign of a central disorder. (Ref: Essential Otolaryngology, p. 104)","n":7},{"bn":55,"s":"On ENG testing of a 23-year-old female with symptoms of unsteadiness, it was noted that there was evidence of anterior internuclear ophthalmoplegia on testing eye movements. This is indicative of","o":["acoustic neuroma","Ménière syndrome","subarachnoid hemorrhage","syphilis","multiple sclerosis"],"k":"E","x":"ENG in multiple sclerosis may show anything from normal or peripheral or central findings. Auditory brainstem evoked potentials may show delay of central conduction. More likely, usually evoked potentials are significantly delayed. Internuclear ophthalmoplegia is almost pathognomonic of multiple sclerosis","n":8}]},{"t":"Q56–65 · The Vestibular System, Part II","q":[{"bn":56,"s":"Nystagmus present when gazing in the direction of the fast component and in straight gaze is termed","o":["first-degree spontaneous nystagmus","positional nystagmus","Aschan type II nystagmus","second-degree nystagmus","Nylen type nystagmus"],"k":"D","x":"Second-degree spontaneous nystagmus suggests a central origin. Also, vertical or diagonal nystagmus suggests a central origin. (Ref: Essential Otolaryngology, p. 98) iT","n":1},{"bn":57,"s":"Positional. nystagmus, when the direction of the nystagmus remains fixed regardless of the position of the head during the positional testing although it may be stronger in a particular direction, is termed","o":["Nylen type II nystagmus","second-degree nystagmus","third-degree nystagmus","Nylen type II nystagmus","Nylen type nystagmus 29°"],"k":"A","x":"This implies either a peripheral lesion or a central lesion such as an acoustic neuroma. Nylen type nystagmus is when the. direction of the nystagmus varies with the position of the head 1 during positional testing and implies a central lesion. (Ref: Essential Otolaryngology, p. 98) i]","n":2},{"bn":58,"s":"Aschan type nystagmus is when","o":["the direction of nystagmus varies with the head during positional testing","the nystagmus is present when gazing in the direction of the first component and on straight gaze","the nystagmus is nonfatigable and persistent: its direction remains fixed with change of head position","the nystagmus is nonfatigable and persistent: its direction changes with head position","the nystagmus is present only when gazing in the direction of the first component"],"k":"D","x":"This indicates a CNS etiology. Aschan type II nystagmus is different from type in that its direction remains fixed with change in head position. This is mainly associated with CNS disorders. Type III is all varieties of transitory positional nystagmus with latency and fatigue. This is associated with peripheral disease. (Ref: Essential Otolaryngology, p. 98) iE","n":3},{"bn":60,"s":"The directional preponderance test is a standardized test to measure canal paresis and directional preponderance and in this test the patient is placed supine and the head is elevated at a","o":["15° angle","30° angle","45° angle","60° angle","0° angle"],"k":"B","x":"In this test, each ear is douched in turn with no less than 250 mL of water at 86° F (30° C) and 112° F (44° C). At least 5 minr utes must elapse between each douche. Directional preponderance is believed to be toward the side of a central lesion and away from the side of a peripheral lesion. (Ref: Essential Otolaryngology, p. 103)","n":4},{"bn":61,"s":"The principle of electronystagmography is based on the differ ence in electrical potential between the retina (-) and the","o":["skin over the eyelid","skin over forehead","lens","cornea","tarsal plate"],"k":"D","x":"","n":5},{"bn":62,"s":"In a positive fistula test, stimulation of the ear with positive pressure results in nystagmus","o":["to the same side","to the opposite side","ina vertical direction","ina rotary direction","ina variable direction"],"k":"A","x":"","n":6},{"bn":63,"s":"The Charcot triad (nystagmus, scanning speech, intention tremor) may be associated with","o":["multiple sclerosis","Parkinson disease","congenital syphilis","basilar—vertebral insufficiency","Wallenberg syndrome"],"k":"A","x":"Vertigo can be the presenting symptom in 10% of multiple sclerosis patients. There is an increased gamma globulin level in the CSF in 90% of these patients and, .on MRI scan in 70 to 95% of patients, one may identify white matter lesions. (Ref: Essential Otolaryngology, p. 110)","n":7},{"bn":64,"s":"The rare variant of Ménière disease in which there is a dramatic restoration of hearing after an acute attack of vertigo is called","o":["crises of Tumarkin","Cogan syndrome","Lermoyez syndrome","Rollet syndrome","Shafer syndrome"],"k":"C","x":"This is a rare presentation of Ménière disease. There is an increased tinnitus and hearing loss before the episode with a dramatic resolution after the episode. The crises of Tumarkin is a sudden unexplained fall without loss of consciousness. It is felt that this is a consequence of an abrupt change in otolithic input. (Ref: Otolaryngology—Head and Neck Surgery, p. 3157)","n":8},{"bn":65,"s":"Internuclear ophthalmoplegia is a disturbance of the lateral movements of the eyes characterized by a paralysis of the internal rectus on one side and weakness of the external rectus on the other, and if it is bilateral it is pathognomonic of","o":["myasthenia gravis","Cogan syndrome","congenital syphilis","Wallenberg syndrome","multiple sclerosis"],"k":"E","x":"Blurring or loss of vision caused by demyelinating of the optic nerve (retrobulbar neuritis) is the initial symptom of multiy. ple sclerosis in approximately 207% of patients. Hearing loss occurs in approximately 25% of patients. (Ref: Otolaryngology— Head and Neck Surgery, pp. 3192-3193) t er cnn Speech, Language, and Voice","n":9}]},{"t":"Q66–75 · Speech, Language, and Voice","q":[{"bn":66,"s":"A speech impairment that occurs with a cerebrovascular accident or another neurologic problem in which substitutions and additions of sounds in words is termed","o":["apraxia","dysarthria","dysfluency","misarticulation","disarticulation"],"k":"A","x":"This speech impairment is called apraxia. Dysarthria is a central or peripheral nervous system deficit resulting in muscle slowness, weakness, or incoordination. (Ref: Essential Otolaryngology, p. 129)","n":1},{"bn":67,"s":"When a child tends to repeat what is said to him or her it is termed","o":["echolalia","r ":"The region of the intermediate and deep layers of the lamina propria is called the","o":["Reinkes space","vocal ligament","fibroblastic layer","vocal fold","membranous portion of the vocal fold"],"k":"B","x":"This is called the vocal ligament. Reinkes space is the superficial layer of the lamina propria. (Ref: Otolaryngology— Head and Neck Surgery, p. 2020)","n":7},{"bn":73,"s":"The volume of air remaining in the lungs at the end of expiration during normal breathing, which may be divided into expiratory reserve volume and residual volume, is called","o":["tidal volume","functional residual capacity","inspiratory capacity","vital capacity","forced vital capacity"],"k":"B","x":"","n":8},{"bn":74,"s":"This medication has been used in treatment of performance anxiety but can produce thrombocytopenic purpura, mental depression, and bronchospasm among other adverse reactions","o":["ativan","valium","beta blockers","alpha blockers","cimetidine"],"k":"C","x":"Beta blockers have been used to help individuals with performance anxiety but can have many side effects including hypotension and so on. (Ref: Otolaryngology—Head and Neck Ij Surgery, p. 2043)","n":9},{"bn":75,"s":"The theory of speech that Suggests that the contribution of a particular speech maneuver to the spectrum depends on its relation to the nodes or antinodes of the standing waves is called the","o":["perturbation theory","quantal theory","source filter theory","linguistic theory","motor theory"],"k":"A","x":"This is called the perturbation theory. this theory, it is Ho, suggested that widening near a volume velocity node lowers the frequency of that resonance, while narrowing raises it. (Ref: Otolaryngology—Head and Neck Surgery, p. 1743), ) in hl","n":10}]},{"t":"Q76–100 · Congenital Deafness","q":[{"bn":76,"s":"Hereditary deafness occurs in the following incidence of live births","o":["1:4000","1:10,000","1:20,000","1:2000","1:15,000"],"k":"A","x":"","n":1},{"bn":77,"s":"The Mundini-Alexander classifica s. It is autosomal dominant. (Ref: Essential Otolaryngology, p. 147)","n":5},{"bn":82,"s":"The autosomal dominant hereditary congenital deafness syndrome associated with widely spaced medial canthi, flat nasal root in 75% of the cases, confluent eyebrows, white forelock, and colored irides is","o":["Forney syndrome","ectodermal dysplasia","Mohr syndrome","Waardenburg disease","Hunter syndrome"],"k":"D","x":"The two most common abnormalities in Waardenburg syndrome are dystrophic canthi and abnormal intercanthal distance. Histopathologic findings show a normal.bony labyrinth, lack of the organ of corti and spiral ganglion cells, as well as atrophy of the stria vascularis. The vestibular labyrinth is normal. (Ref: Pediatric Otolaryngology, pp. 550-551)","n":6},{"bn":83,"s":"Achondroplasia is associated with saddle nose, frontal and mandibular prominence, mixed hearing loss, and","o":["dwarfism","mitral insufficiency","abnormal tyrosine metabolism","confluent eyebrows","fine retinal pigmentation"],"k":"A","x":"","n":7},{"bn":85,"s":"The hereditary congenital deafness syndrome associated with","o":["Mohr syndrome","Forney syndrome","Roaf syndrome","Apert syndrome","Baelz syndrome"],"k":"A","x":"Craniofacial dysostosis is a hereditary autosomal dominant disorder. Audiometric findings reveal that approximately one third of the patients with this syndrome have a hearing loss that is usually nonprogressive and conductive in nature. (Ref","n":8},{"bn":86,"s":"Klippel—Feil syndrome is a hereditary congenital deafness associated with sensorineural hearing loss, short neck due to fused cervical vertebrae, external auditory canal atresia, and","o":["congenital flexion contractures of fingers and toes","hypoplastic maxilla","spina bifida","internal hydrocephalus","cleft palate"],"k":"C","x":"Brevicollis or Klippel—Feil syndrome is a hereditary disorder that appears to be due to a recessive gene. Females are predominantly affected and the disease is rare. Deafness is the second mest common finding in this disorder and is of the 1 spec —sSSCSC‘sS sensorineural or mixed type. There is frequently an absence of f vestibular function. (Ref","n":9},{"bn":87,"s":"The syndrome of congenital deafness, pigeon breast, scoliosis, thin elongated individuals with long spidery fingers and hammer toes is","o":["Sturge-Weber","Tapia","cleidocranial","Englemann","Marfan"],"k":"E","x":"Marfan syndrome is an autosomal dominant disorder in which individuals have a tall stature with a disproportionately long lower segment, long fingers and toes, detached lens, and aortic aneurysms. (Ref: Essential Otolaryngology, p. 149)","n":10},{"bn":88,"s":"A 6-month-old male presents with hearing loss, optic atrophy, sclerotic brittle bone, choanal atresia, and fluctuating facial nerve H paralysis. The most likely diagnosis is","o":["Roaf syndrome","Albers—Schonberg disease","Klippel—Feil syndrome","Pyle syndrome","osteitis deformans"],"k":"B","x":"Marble bone disease, osteopetrosis, or Albers—Schonberg disease is of autosomal recessive inheritance. There is a conductive or mixed hearing loss. The bone is brittle due to failure of re- . i} sorption of calcified cartilage. There may be involvement of cra- L nial nerves II, V, and VII and there can be optic atrophy. (Ref: Essential Otolaryngology, p. 149)","n":11},{"bn":89,"s":"Treacher Collins syndrome is associated with malformation of ossicles, antimongoloid palpebral fissure, mandibular hypoplasia, anda","o":["normal IQ","cleft palate","preauricular fistula","glossoptosis","subglottic stenosis"],"k":"A","x":"Mandibulofacial dysostosis or Treacher Collins syndrome","n":12},{"bn":90,"s":"A i-year-old male presents with micrognathia, cleft palate, mixed hearing loss, hypoplastic mandible, mental retardation, and 4 breathing difficulties when sleeping. The most likely diagnosis is","o":["Pyle syndrome","Oto-palatal—digital syndrome","Samters syndrome","Van Buchem syndrome","Pierre Robin syndrome"],"k":"E","x":"Pierre Robin syndrome is an autosomal dominant trait with","n":13},{"bn":91,"s":"Van der Hoeve syndrome or osteogenesis imperfecta is an autosomal dominant congenital hearing loss syndrome associated with fragile bones, loose ligaments, hearing loss, and 60% have","o":["cleft lip and cleft palate","mental retardation","blue sclera","retinal atrophy","torticollis"],"k":"C","x":"Osteogenesis imperfecta is a hereditary autosomal dominant disease. It is characterized by ‘defective synthesis of connective A tissue, including bone matrix. There is also abnormal tooth dentin","n":14},{"bn":92,"s":"Alport syndrome is suspected in a 4-month-old baby. One of the most helpful tests in making the diagnosis would be a","o":["peripheral blood smear","bone marrow exam","liver function screen","urinalysis","chest x-ray"],"k":"D","x":"","n":15},{"bn":93,"s":"Fanconi anemia syndrome, Alstrom syndrome, Van Buchem syndrome, and Mohr syndrome all share the same trait of","o":["autosomal recessive inheritance","deformed thumb","cranial nerve palsies","retinal degeneration","dwarfism"],"k":"A","x":"Fanconi anemia syndrome is associated with an absent or deformed thumb. Hurler syndrome is associated with dwarfism. Cockayne syndrome is associated with retinal degeneration and","n":16},{"bn":95,"s":"Hurler syndrome (gargoylism) is a hereditary congenital deafness syndrome: associated with mental retardation, dwarfism, mixed hearing loss, forehead prominence, and","o":["progressive myopia and cataracts","goiter","abnormal development of the petrous pyramid","hypogonadism","abnormal mucopolysaccharides are deposited in tissues"],"k":"E","x":"","n":17},{"bn":97,"s":"Pendred syndrome is a hereditary congenital deafness syndrome associated with a “U”-shaped audiogram, diffuse goiter developing at puberty, and a normal IQ. This syndrome constitutes the following percentage of hereditary deafness syndromes","o":["20%","10%","5%","2%","15%"],"k":"B","x":"Pendred syndrome is a very common cause of hereditary deafness. It is autosomal recessive. The goiter is treated with exogenous hormone to suppress thyroid-stimulating hormone (TSH) secretion. There is also a positive perchlorate test. (Ref: Essential Otolaryngology, p. 156)","n":18},{"bn":98,"s":"The syndrome associated with retinitis pigmentosa, polyneuropathy, ataxia, and sensorineural hearing loss is","o":["Norrie syndrome","Richard—Rundel syndrome","Taylor syndrome","Refsum syndrome","Hallgren syndrome"],"k":"D","x":"Refsum disease or heredopathia atactica polyneuritiformis is an autosomal recessive disease that also has associated sensorineural hearing loss, visual impairment usually beginning in the second decade, and elevated plasma phytanic acid levels. (Ref: Essential Otolaryngology, pp. 156-157)","n":19},{"bn":99,"s":"With regards to congenital abnormalities of the middle and external ear, when one has microtia, atretic canals, and abnormal ossicles it is termed a","o":["class II abnormality","class V abnormality","class abnormality","class III abnormality","class IV abnormality"],"k":"D","x":"Class II abnormalities are associated with microtia, atretic canal, and abnormal ossicles with normal aeration of mastoid and middle ear. Class abnormalities have a normal auricle in shape and size, a well-pneumatized mastoid and middle ear, an ossicular problem, and is the most common type. (Ref: Essential Otolaryngology, p. 159) 4","n":20},{"bn":100,"s":"The hereditary congenital deafness syndrome that is autosomal recessive and is associated with retinitis pigmentosa, ataxia, and vestibular dysfunction is","o":["Weil syndrome","MGébius syndrome","Hunter syndrome","Usher syndrome","Alstrom syndrome"],"k":"D","x":"","n":21}]},{"t":"Q101–110 · Cochlear Implants","q":[{"bn":101,"s":"The F, (fundamental frequency) is mainly responsible for pitch in cochlear implant technology. This is a frequency range from","o":["50 to 100 Hz","100 to 200 Hz","500 to 700 Hz","1000 to 1200 Hz","2000 to 2200 Hz"],"k":"B","x":"","n":1},{"bn":105," eprivation","participation in an oral communication therapy program"],"k":"C","x":"The anatomic size of the round window is not a factor on the outcome of the surgery unless it is so small an implant cannot be positioned. (Ref: Essential Otolaryngology, pp. 169-170)","n":6}]},{"t":"Q111–120 · Neurotology and Skull Base Surgery","q":[{"bn":114,"s":"In performing a middle fossa procedure to remove an acoustic neuroma, generally the anterior limit of the dissection is the","o":["Bill bar","cochlea","facial nerve","arcuate eminence","middle meningeal artery"],"k":"E","x":"With removing intracanalicular acoustic neuromas that have adequate hearing preoperatively, one can preserve facial nerve function and hearing in approximately 60% of patients if surgery is approached via a middle cranial fossa approach. (Ref: Essential Otolaryngology p. 708)","n":1},{"bn":115,"s":"Transposition of the following nerve routinely occurs during a transcochlear approach","o":["V","VI","VII","VII","X"],"k":"C","x":"This routinely occurs in order to provide nerve access for surgery. (Ref: Essential Otolaryngology, p. 708)","n":2},{"bn":116,"s":"The greater and lesser wings of the sphenoid bone are separated by the","o":["superior orbital fissure","inferior orbital fissure","foramen spinosum","foramen lacerum","foramen ovale"],"k":"A","x":"The superior orbital fissure lies between the roof and the lateral wall of the nose. It transmits cranial nerves It, IV, VI, Vi the superior orbital vein, ophthalmic vein, orbital branch of the middle meningeal artery, and recurrent branch of the lacrimal artery. (Ref: Essential Otolaryngology, p. 341)","n":3},{"bn":117,"s":"Identify which ganglion lies in the Meckel cave","o":["Scarpa ganglion","trigeminal ganglion","nodose ganglion","otic ganglion","olfactory ganglion"],"k":"B","x":"The Meckel cave is a depression in the anteromedial aspect of the petrous portion of the temporal bone in which rests the gasserian ganglion of cranial nerve V. (Ref: Essentia plicated in the cause of gingival hyperplasia in about 25% of chronically treated patients","o":["furosemide","nitrogen mustard","diphenylhydantoin (Dilantin)","quinine","scopolamine (Hyoscine)"],"k":"C","x":"Gingival hyperplasia occurs in about 25% of chronically treated patients taking diphenylhydantoin (Dilantin) and is the most common adverse reaction in children and adolescents. (Ref: Essential Otolaryngology, pp. 1075-1076)","n":8},{"bn":610,"s":"Desmopressin (DDAVP) has been found to increase temporarily the concentration of factor","o":["V","VI","VII","VIII","IX Pharmacology and Therapeutics"],"k":"D","x":"Desmopressin releases stored von Willebrand factor and factor VIII:C from endothelium, temporarily raising factor VIII levels (used in mild haemophilia A and type 1 vWD).","f":"Key corrected — book key: C; updated answer: D.","n":9}]},{"t":"Q611–630 · Miscellaneous","q":[{"bn":611,"s":"The contents of the superior orbital fissure include the superior ophthalmic vein, the inferior ophthalmic vein branch, V, nerve branches, and the following nerves","o":["IL, IV, V,, and VI","TLandIV","II, IV, V,, and VI","III, IV, and VI","I, Il, IV, and VI"],"k":"D","x":"The inferior orbital fissure contains V, branches (zygomatic nerves and sphenopalatine branch) and the inferior ophthalmic vein. (Ref: Essential Otolaryngology, p. 1143)","n":1},{"bn":612,"s":"The V, cranial nerve exits the skull via the","o":["foramen lacerum","foramen ovale","foramen rotundum","foramen spinosum","hypoglossal canal"],"k":"C","x":"The V, comes through the superior orbital fissure and the V,, comes through the foramen ovale. (Ref: Essential Otolaryngology, p. 1143)","n":2},{"bn":613,"s":"The esophageal dehiscence between the cricopharyngeus and the circular fibers of the esophagus is called by the following name","o":["Killian","Killian—-Jamieson","Laimer—Hackermann","Winkler—Jamieson","Winkler"],"k":"B","x":"The Killian dehiscence is between the cricopharyngeus and the thyropharyngeus muscles and the Laimer—Hackermann dehiscence is between the circular and longitudinal fibers of the esophagus. (Ref: Essential Otolaryngology, p. 1147)","n":3},{"bn":614,"s":"The most common complication of cholesteatoma is","o":["serous or suppurative labyrinthitis","semicircular canal erosion/fistula and disequilibrium","facial nerve paralysis","Bezold abscess","brain abscess"],"k":"B","x":"After semicircular canal erosion and fistula, the most common complications of cholesteatoma are extradural or perisinus abscess; serous or suppurative labyrinthitis; facial nerve paralysis; meningitis; epidural, subdural or parenchymal brain abscess; and recurrent cholesteatoma. (Ref: Essential Otolaryngology, p. 1086)","n":4},{"bn":615,"s":"Numbness of the postauricular area associated with compression of the facial nerve by an acoustic neuroma is called","o":["Hitselberger sign","Leopold sign","Sewell sign","Ramsay sign","Guttman sign"],"k":"A","x":"This is a very rare sign of an acoustic neuroma. (Ref: Essential Otolaryngology, p. 1090) 297 ee ee","n":5},{"bn":616,"s":"The percentage of patients who have a family history of otosclerosis is","o":["25%","50%","75%","60%","100%"],"k":"B","x":"","n":6},{"bn":617,"s":"The following test is used to diagnose gustatory sweating after parotidectomy","o":["Guttman","Guyon","Minor","Goodwin","Brooke"],"k":"C","x":"","n":7},{"bn":618,"s":"A 70-year-old male has been diagnosed on biopsy of having a metastatic malignant tumor of the temporal bone. The most probable site of the primary tumor is the","o":["prostate","liver","colon","testes","parotid"],"k":"A","x":"Bony metastases to the temporal bone can also originate f from the breast, kidney, lung, stomach, larynx, and colon. (Ref: Essential Otolaryngology, p. 1094)","n":8},{"bn":619,"s":"A 6-year-old girl is having a T&A. Suddenly, her temperature increases, her pulse increases, and the patient becomes rigid. One should discontinue anesthetic agents, administer 100% oxygen, cool the patient, and give intravenous","o":["digoxin","Xylocaine","Diamox","dantrolene","calcium chloride"],"k":"D","x":"","n":9},{"bn":620,"s":"An 18-month-old male presented with fever, proptosis, hepatomegaly, multiple bony lesions, and exfoliative dermatitis. The child died in 4 months. The most probable diagnosis was","o":["eosinophilic granuloma","acute myelogenous leukemia","Hand-Schüller-Christian disease","acute lymphosarcoma","Letterer—Siwe disease"],"k":"E","x":"Letterer—Siwe disease is a rapidly progressive disease that is almost always fatal. Hand-Schüller—Christian disease has a 30% mortality. (Ref: Essential Otolaryngology, p. 1101)","n":10},{"bn":621,"s":"A 66-year-old female presents with oral bullae. Biopsy shows autoantibodies, acantholysis, and a positive Nikolsky sign. The diagnosis is","o":["pemphigoid","squamous cell carcinoma","pemphigus","granular cell myoblastoma","lichen planus"],"k":"C","x":"Pemphigus has oral manifestations in 66% of cases. . Hl Steroids are the method of treatment. (Ref: Essential Otolaryngology, p. 1107)","n":11},{"bn":622,"s":"The following percentage of basilar skull fractures have CSF otorrhea","o":["<2%","10%","6%","20%","30%"],"k":"C","x":"Approximately 90% of basilar skull fractures heal spontaneously. (Ref: Essential Otolaryngology, p. 1109) Wl","n":12},{"bn":623,"s":"The incidence of metastases of squamous cell carcinoma of the lower lip is","o":["1to3%","> 30%","6 to 8%","10 to 12%","20 to 30%"],"k":"C","x":"Basal cell carcinoma is most often associated with upper lip lesion. Squamous cell carcinoma of the upper lip often will metastasize early. (Ref: Essential Otolaryngology, p. 1110)","n":13},{"bn":624,"s":"The most common soft tissue malignancy in the head and neck in children is","o":["granular cell myoblastoma","histiocytosis X","squamous cell carcinoma","rhabdomyosarcoma","craniopharyngioma"],"k":"D","x":"","n":14},{"bn":625,"s":"A 50-year-old male presents with left upper cervical lymphadenopathy. Needle aspiration reveals squamous cell carcinoma and workup is negative for a primary. His 5-year survival with treatment is","o":["10%","50%","30%","70%","90%"],"k":"C","x":"","n":15},{"bn":626,"s":"The most frequent virus to be associated with the common cold is","o":["enterovirus","adenovirus","influenza virus","parainfluenza virus","rhinovirus a"],"k":"E","x":"","n":16},{"bn":627,"s":"A 70-year-old male has a loss of sense of taste, vocal cord paralysis, palate paralysis, and limited movement of his shoulder and tongue. He has the following syndrome","o":["Vernet","Schmidt","Villaret","Collet-Sicard t","Avellis"],"k":"D","x":"","n":17},{"bn":628,"s":"A 17-year-old female presents with a diffuse painless swelling of the left cheek. X-rays reveal a ground glass, multilocular appearance with diffuse margins. The most likely diagnosis is","o":["fibrous dysplasia","ossifying. fibroma","Wegener granulomatosis","Hand-Schüller—Christian disease","eosinophilic granuloma"],"k":"A","x":"The appearance of bone in fibrous dysplasia has been described as “ground glass.” The bone proliferation of fibrous dysplagia should not be confused with an osteoma, in which the margin of the dense bone mass is usually much more sharply defined. (Ref: Otolaryngology—Head and Neck Surgery, pp. 921-923)","n":18},{"bn":629,"s":"The incidence of malignant melanoma is 7/100,000 and of these the following percentage is found in the head and neck region","o":["5%","10%","30%","20%","50%"],"k":"D","x":"","n":19},{"bn":630,"s":"Malignant melanoma classification of 3.60 mm: non-BANS according to the modified Breslow staging has a 5-year survival rate of","o":["(20%","50%","30%","70%","90%"],"k":"D","x":"Modified Breslow staging of 0.85 mm and 0.85 to 1.70 mm: non-BANS have a 5-year survival rate of 99%. BANS and 1.70 to 3.60 mm: non-BANS have a 5-year survival rate of 75%. BANS has a 0% 5-year survival rate. (Ref: Essential Otolaryngology, p. 1137) 5 mmm Sr","n":20}]}];
const L='ABCDE';
let S={sel:new Set(DATA.map((_,i)=>i)),order:'book',list:[],pos:0,ans:{},multiPick:{}};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const id=(c,n)=>c+'-'+n;
function home(){
  document.body.querySelector('.nav')?.remove();
  const total=[...S.sel].reduce((a,c)=>a+DATA[c].q.length,0);
  $('#app').innerHTML=`<h1>Specialty board review</h1><p class="sub">${DATA.reduce((a,c)=>a+c.q.length,0)} single-best-answer questions from the 630-question board review, in book wording with the book's discussion. Keys rechecked against current references; corrected keys and outdated items are flagged in the answer box. Pick chapters, then start.</p>
  ${DATA.map((c,i)=>{const done=c.q.filter(q=>S.ans[id(i,q.n)]).length;return `<button class="chap ${S.sel.has(i)?'on':''}" onclick="tog(${i})" aria-pressed="${S.sel.has(i)}"><b>${c.t}</b>${done?`<span class="done">${done} done</span>`:''}<span>${c.q.length}</span></button>`}).join('')}
  <div class="row"><div class="seg" role="group" aria-label="Order"><button class="${S.order=='book'?'on':''}" onclick="S.order='book';home()">Book order</button><button class="${S.order=='shuf'?'on':''}" onclick="S.order='shuf';home()">Shuffled</button></div>
  <div class="seg"><button onclick="S.sel=new Set(DATA.map((_,i)=>i));home()">All</button><button onclick="S.sel=new Set();home()">None</button></div></div>
  <button class="primary" ${total?'':'disabled'} onclick="start()">Start ${total} questions</button>
  ${Object.keys(S.ans).length?`<div class="row"><button class="ghost" style="flex:1" onclick="results()">See results so far</button><button class="ghost" style="flex:1" onclick="if(confirm('Clear all answers?')){S.ans={};home()}">Clear answers</button></div>`:''}
  <p class="note" style="margin-top:18px">Answers are kept while this page is open. Tap any figure to enlarge.</p>`;
  scrollTo(0,0);
}
function tog(i){S.sel.has(i)?S.sel.delete(i):S.sel.add(i);home()}
function start(list){
  if(!list){list=[];[...S.sel].sort().forEach(c=>DATA[c].q.forEach(q=>list.push([c,q.n])));
    if(S.order=='shuf')for(let i=list.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[list[i],list[j]]=[list[j],list[i]]}}
  S.list=list;S.pos=0;const f=list.findIndex(([c,n])=>!S.ans[id(c,n)]);if(f>0)S.pos=f;show();
}
function score(){let a=0,r=0;S.list.forEach(([c,n])=>{const x=S.ans[id(c,n)];if(x){a++;if(x.ok)r++}});return{a,r}}
function show(){
  const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const A=S.ans[id(c,n)];const {a,r}=score();
  const pick=S.multiPick[id(c,n)]||new Set();
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="home()" aria-label="Back to chapters">Chapters</button><span class="t">${DATA[c].t}</span><span class="sc">${r}/${a}</span></div><div class="bar"><i style="width:${(S.pos+1)/S.list.length*100}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${S.list.length} &nbsp;·&nbsp; Book Q${q.bn||n}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${n}" onclick="zoom(this.src)">`).join('')}</div>`;
  if(q.m)h+=`<p class="note">More than one answer. Select all that apply, then check.</p>`;
  q.o.forEach((t,i)=>{const l=L[i];let cl='';
    if(A){if(q.k.includes(l))cl='ok';else if(A.pick.includes(l))cl='bad'}else if(pick.has(l))cl='sel';
    h+=`<button class="opt ${cl}" ${A?'disabled':''} onclick="choose('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(q.m&&!A)h+=`<button class="primary" style="margin-top:6px" ${pick.size?'':'disabled'} onclick="check()">Check answer</button>`;
  if(A){h+=`<div class="exp"><h3 class="${A.ok?'ok':'bad'}">${A.ok?'Correct':'Incorrect'} — answer ${q.k.split('').join(', ')}</h3>`;
    if(q.f)h+=`<div class="flag">${esc(q.f)}</div>`;
    h+=q.x?q.x.split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join(''):`<p class="note" style="margin:0">Key only — the discussion for this item could not be matched reliably in the scan.</p>`;
    if(q.xi)h+=q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join('');
    h+=`</div>`}
  $('#app').innerHTML=h;
  let nav=document.querySelector('.nav');if(!nav){nav=document.createElement('div');nav.className='nav';document.body.appendChild(nav)}
  const last=S.pos==S.list.length-1;
  nav.innerHTML=`<div class="navi"><button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Jump</button><button class="primary" onclick="${last?'results()':'go(1)'}">${last?'Finish':'Next'}</button></div>`;
  scrollTo(0,0);
}
function choose(l){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);if(S.ans[k])return;
  if(q.m){const p=S.multiPick[k]||new Set();p.has(l)?p.delete(l):p.add(l);S.multiPick[k]=p;const y=scrollY;show();scrollTo(0,y);return}
  S.ans[k]={pick:[l],ok:l==q.k};const y=scrollY;show();scrollTo(0,y)}
function check(){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);const p=[...S.multiPick[k]].sort().join('');
  S.ans[k]={pick:p.split(''),ok:p==q.k};const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(S.list.length-1,S.pos+d));show()}
function grid(){const d=$('#dlg');
  d.innerHTML=`<b>Jump to question</b><div class="grid">${S.list.map(([c,n],i)=>{const a=S.ans[id(c,n)];return `<button class="${a?(a.ok?'g-ok':'g-bad'):''} ${i==S.pos?'g-cur':''}" onclick="S.pos=${i};$('#dlg').close();show()">${i+1}</button>`}).join('')}</div><button class="ghost" style="width:100%;margin-top:8px" onclick="$('#dlg').close()">Close</button>`;
  d.showModal()}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
function results(){
  document.querySelector('.nav')?.remove();
  let rows='',ta=0,tr=0,wrong=[];
  DATA.forEach((c,ci)=>{let a=0,r=0;c.q.forEach(q=>{const x=S.ans[id(ci,q.n)];if(x){a++;if(x.ok)r++;else wrong.push([ci,q.n])}});
    ta+=a;tr+=r;if(a)rows+=`<tr><td>${c.t}</td><td>${r}/${a} · ${Math.round(r/a*100)}%</td></tr>`});
  $('#app').innerHTML=`<h1>Results</h1><div class="big">${ta?Math.round(tr/ta*100):0}%</div><p class="sub">${tr} correct of ${ta} answered</p>
  <table>${rows||'<tr><td>No answers yet</td><td></td></tr>'}</table>
  ${wrong.length?`<button class="primary" onclick="redo()">Retry ${wrong.length} incorrect</button>`:''}
  <div class="row"><button class="ghost" style="flex:1" onclick="home()">Back to chapters</button></div>`;
  S.wrong=wrong;scrollTo(0,0)}
function redo(){S.wrong.forEach(([c,n])=>{delete S.ans[id(c,n)];delete S.multiPick[id(c,n)]});start(S.wrong.slice())}
document.addEventListener('keydown',e=>{if($('#dlg').open||!document.querySelector('.nav'))return;
  if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else if('abcde'.includes(e.key.toLowerCase())&&e.key.length==1)choose(e.key.toUpperCase())});
home();
</script></body></html>
