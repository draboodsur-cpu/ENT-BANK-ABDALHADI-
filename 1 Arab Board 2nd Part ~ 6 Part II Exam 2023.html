<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ENT Part II Exam 2023 — Answered &amp; Referenced</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--amber:#B06A00;--amber-soft:#FBEFD9;--box:#0B1418;--on-teal:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--amber:#E8A94A;--amber-soft:#3A2C14;--box:#000;--on-teal:#06201F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td:last-child{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px 8px;text-align:center}
.seg button.on{background:var(--teal);color:var(--on-teal);font-weight:600}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note{font-size:.9rem;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.timer{font:700 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.topi .t{flex:1;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.flagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
.flagbtn.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.qn{font-weight:600;font-size:.9rem;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{opacity:1}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}.exp h3.na{color:var(--amber)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;position:relative}
.grid .ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.grid .flg{box-shadow:inset 0 0 0 2px var(--amber)}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-na{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid .cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.legend .a::before{background:var(--teal-soft);border-color:var(--teal)}.legend .f::before{box-shadow:inset 0 0 0 2px var(--amber)}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3.2rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>button{flex:1}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--teal)}
</style></head><body>

<script>
const PAPERS=[{"title":"2023 Exam (December)","q":[{"s":"Surgical Care Improvement Guidelines require that preoperative antibiotics be given when?","o":["At the time of incision","2 hours before incision","Within 1 hour of incision","Any time during the procedure"],"k":"C","x":"Prophylactic antibiotics are given within 60 minutes before incision (SCIP; Bailey).","src":"2023 exam recall · Q1","d":"Others"},{"s":"Which of the following is true for iatrogenic cerebrospinal fluid (CSF) leaks resulting from endoscopic sinus surgery?","o":["Most commonly occur at the posterior ethmoid roof","Leaks more commonly occur on the right side","Majority of leaks manifest in a delayed fashion","Leaks are equally common in the hands of novice and experienced surgeons"],"k":"B","x":"Iatrogenic CSF leaks during ESS occur more on the right side (right-handed surgeon) and most often at the lateral lamella of the cribriform plate; most are recognized intraoperatively (Bailey).","src":"2023 exam recall · Q2","d":"Rhinology"},{"s":"What is the most common location of the ophthalmic artery in relation to the optic nerve as it runs through the optic canal?","o":["Lateral","Superior","Inferior","Medial"],"k":"C","x":"⚑ No answer given in the recall; answered from the references. — In the optic canal the ophthalmic artery lies inferior (inferolateral) to the optic nerve, within the dural sheath (Bailey).","src":"2023 exam recall · Q3","d":"Others"},{"s":"Which of the following is not an indication for computer-image-guided surgery according to the American Academy of Otolaryngology-Head and Neck Surgery consensus statement guidelines?","o":["Revision sinus surgery","Extensive nasal polyposis","Cases involving cerebrospinal fluid (CSF) leak repair","Cases involving concha bullosa takedown"],"k":"D","x":"AAO-HNS image-guidance indications: revision surgery, distorted anatomy, extensive polyposis, frontal/posterior ethmoid/sphenoid disease, skull base or CSF leak, and tumours — not routine concha bullosa (Bailey).","src":"2023 exam recall · Q4","d":"Head & Neck"},{"s":"A cerebrospinal fluid leak during ethmoidectomy is most likely to occur at","o":["The junction of fovea ethmoidalis and lamina papyracea","The medial fovea ethmoidalis","The insertion of the uncinate process","The planum sphenoidale"],"k":"B","x":"The thin lateral lamella/medial fovea ethmoidalis (cribriform junction) is the commonest site of skull base injury during ethmoidectomy (Bailey).","src":"2023 exam recall · Q5","d":"Rhinology"},{"s":"In patients with cerebrospinal fluid (CSF) rhinorrhea after skull base fracture, the use of prophylactic antibiotics is associated with","o":["Decrease in frequency of meningitis","Reduction in meningitis-related mortality","Less need for surgical repair of CSF leakage","No apparent therapeutic benefit"],"k":"D","x":"Prophylactic antibiotics in post-traumatic CSF rhinorrhoea have not been shown to reduce meningitis (Cochrane; Bailey).","src":"2023 exam recall · Q6","d":"Rhinology"},{"s":"The natural os of the maxillary sinus is identified in what orientation?","o":["Parasaggital plane","Coronal","Axial","Variable"],"k":"A","x":"The natural maxillary ostium is oriented in a parasagittal (oblique sagittal) plane at the floor of the ethmoid infundibulum, hidden behind the uncinate (Bailey).","src":"2023 exam recall · Q7","d":"Rhinology"},{"s":"What is the thinnest part of the anterior skull base?","o":["Ethmoid roof (fovea ethmoidalis)","Lateral lamella","Sella turcica","Planum sphenoidale"],"k":"B","x":"The lateral lamella of the cribriform plate is the thinnest part of the anterior skull base (Keros) (Bailey).","src":"2023 exam recall · Q8","d":"Rhinology"},{"s":"The agger nasi cell is identified on a coronal CT scan as","o":["Cell extending into the frontal sinus","Cell attached to the lamina papyracea","Cell anterior to the attachment of middle turbinate","Cell pneumatizing into middle turbinate"],"k":"C","x":"The agger nasi cell lies anterior and superior to the attachment of the middle turbinate on coronal CT (Bailey).","src":"2023 exam recall · Q9","d":"Rhinology"},{"s":"Which of the following symptoms of chronic rhinosinusitis would be least improved by endoscopic sinus surgery?","o":["Postnasal discharge","Facial pain","Hyposmia","Nasal congestion"],"k":"C","x":"After ESS, nasal obstruction and facial pressure improve most; olfaction is the least consistently improved (Bailey).","src":"2023 exam recall · Q10","d":"Rhinology"},{"s":"45-year-old woman presents to the emergency room with a 2-day history of progressive swelling of the floor of mouth, firm induration of the submandibular region, trismus, and dyspnea. Which the following is the most appropriate next step in management?","o":["Awake tracheotomy","Conventional endotracheal intubation","Close observation and monitoring in the intensive care unit","Thoracic surgery consultation"],"k":"A","x":"Ludwig angina with dyspnoea and trismus: secure the airway by awake tracheostomy (or awake fibreoptic intubation) — conventional intubation is dangerous (Bailey).","src":"2023 exam recall · Q11","d":"Others"},{"s":"3-year-old boy presents with an abscess of the retropharyngeal space. What is the most likely etiology for this infectious process?","o":["Sialadenitis","Upper respiratory tract infection","Tooth decay","Surgical instrumentation trauma"],"k":"B","x":"Paediatric retropharyngeal abscess usually follows URTI with suppuration of retropharyngeal (Rouvière) nodes (Bailey).","src":"2023 exam recall · Q12","d":"Paediatric"},{"s":"In essence, voice therapy does which of the following?","o":["Strengthens the vocal folds","Balances the systems of respiration, phonation, and resonance","Instructs patients in good vocal hygiene","Instructs patients not to yell and scream"],"k":"B","x":"Voice therapy rebalances respiration, phonation and resonance — the subsystems of voice production (Bailey).","src":"2023 exam recall · Q13","d":"Laryngology"},{"s":"A patient is sent to you with dysphagia and dysarthria and demonstrates an exaggerated jaw jerk and gag, a spastic tongue, and emotional lability. Which of the following terms refers to this constellation of symptoms?","o":["Amyotrophic lateral sclerosis (ALS)","Bulbar palsy","Pseudobulbar palsy","Botulism from improperly canned food"],"k":"C","x":"Spastic tongue, brisk jaw jerk and gag, and emotional lability = pseudobulbar palsy (bilateral upper motor neurone) (Bailey).","src":"2023 exam recall · Q14","d":"Laryngology"},{"s":"What is the first-line treatment for recurrent respiratory papillomatosis?","o":["Surgical removal","Inhaled cidofovir","High-dose oral steroid burst","Azathioprine","Radiation therapy"],"k":"A","x":"Surgical debulking (microdebrider/laser) is first-line for RRP; adjuvants (cidofovir, bevacizumab, HPV vaccine) are added for frequent recurrence (Bailey).","src":"2023 exam recall · Q15","d":"Laryngology"},{"s":"Intraoperative mydriasis is noted while repairing an orbital floor fracture. Which of the following is the most likely cause?","o":["Pressure on the ciliary ganglion","Transection of the optic nerve","Occlusion of the ophthalmic artery","Retrobulbar hematoma"],"k":"A","x":"Mydriasis during orbital floor repair is usually from pressure/traction on the ciliary ganglion (parasympathetics), not optic nerve injury (Bailey).","src":"2023 exam recall · Q16","d":"Rhinology"},{"s":"Which of the following fractures is most common in childhood?","o":["Frontal sinus","Orbital","Nasal","Le Fort"],"k":"C","x":"Nasal fractures are the commonest facial fractures in children (Bailey).","src":"2023 exam recall · Q17","d":"Others"},{"s":"The virus most commonly identified as a cause of congenital hearing loss is?","o":["Adenovirus","Respiratory syncytial virus","Cytomegalovirus (CMV)","Rubella"],"k":"C","x":"Congenital CMV is the commonest non-genetic cause of congenital SNHL (Bailey).","src":"2023 exam recall · Q18","d":"Otology"},{"s":"Which of the following is the best initial surgical procedure for chronic pediatric rhinosinusitis?","o":["Adenoidectomy","Anterior ethmoidectomy","Maxillary antrostomy","Anterior ethmoidectomy with maxillary antrostomy"],"k":"A","x":"Adenoidectomy (± irrigation) is the first-line surgical procedure for paediatric CRS (AAO-HNS consensus).","src":"2023 exam recall · Q19","d":"Paediatric"},{"s":"Which of these is the most common salivary gland malignancy in children?","o":["Acinic cell carcinoma","Squamous cell carcinoma","Mucoepidermoid carcinoma (MEC)","Warthin tumor"],"k":"C","x":"Mucoepidermoid carcinoma is the commonest salivary malignancy in children (Bailey).","src":"2023 exam recall · Q20","d":"Paediatric"},{"s":"A patient with a T3N0 squamous cell carcinoma of the lateral floor of the mouth is to undergo surgical treatment. Which of the following is an appropriate neck dissection in this case?","o":["Selective neck dissection of levels I and II (suprahyoid)","Selective neck dissection of levels I, II and III (supraomohyoid)","Selective neck dissection of levels II, III and IV (lateral)","Modified radical neck dissection preserving the jugular vein and spinal accessory nerve","Modified radical neck dissection preserving the spinal accessory nerve"],"k":"B","x":"T3N0 lateral floor of mouth: elective supraomohyoid neck dissection (levels I–III) (Bailey).","src":"2023 exam recall · Q21","d":"Head & Neck"},{"s":"Which of the following salivary cancers is most associated with pain and perineural","o":["Acinic cell cancer","Adenoid cystic cancer","High-grade mucoepidermoid cancer","Squamous cell cancer"],"k":"B","x":"Adenoid cystic carcinoma is classically associated with pain and perineural spread (Bailey).","src":"2023 exam recall · Q22","d":"Head & Neck"},{"s":"Which diagnostic procedure is the gold standard in the diagnosis of lymphoma in","o":["Excisional biopsy","Fine-needle aspiration (FNA) biopsy","Core needle biopsy (CNB)","Contrast-enhanced CT scan"],"k":"A","x":"Excisional node biopsy (fresh tissue for flow cytometry) is the gold standard for diagnosing lymphoma; core biopsy is an acceptable alternative (Bailey).","src":"2023 exam recall · Q23","d":"Head & Neck"},{"s":"A 40-year-old male smoker presents with hoarseness for 4 months. Office fiberoptic laryngoscopy reveals I superficial hyperkeratotic lesion on the right anterior vocal cord. Cord mobility is normal. What would be the next logical step in management?","o":["MRI","Antireflux agents and speech therapy","Direct laryngoscopy with transoral laser microsurgery (TLM) excisional biopsy","Fiberoptic laryngoscopy after 1 month"],"k":"C","x":"A persistent hyperkeratotic vocal fold lesion needs direct laryngoscopy with excisional (TLM) biopsy (Bailey).","src":"2023 exam recall · Q24","d":"Laryngology"},{"s":"Which laryngeal site is the most at risk of developing radionecrosis?","o":["Cricoid","Thyroid lamina","Arytenoid","Epiglottis"],"k":"C","x":"The arytenoid cartilages are the most vulnerable to radionecrosis/chondronecrosis (Bailey).","src":"2023 exam recall · Q25","d":"Laryngology"},{"s":"A 28-year-old undergoes partial parotidectomy with facial nerve dissection for a 22-mm tumor. Pathology shows a low-grade mucoepidermoid carcinoma. Margins are negative. The neck is radiologically negative. What therapy do you recommend?","o":["No further therapy, observation","Completion of total parotidectomy","Total parotidectomy, adjuvant radiation","Total parotidectomy, neck dissection"],"k":"A","x":"Completely excised low-grade MEC with negative margins and N0 neck: observation (NCCN; Bailey).","src":"2023 exam recall · Q26","d":"Otology"},{"s":"Which of the following statements is true regarding early supraglottic","o":["Location of the tumor does not influence prognosis","Pulmonary function is not important in selecting therapy for early tumors","Regional metastasis is rare","The contralateral neck does not need to be treated","Supraglottic laryngectomy, radiation therapy, and laser excision have similar cure rates"],"k":"E","x":"⚑ No answer given in the recall; answered from the references. — Early supraglottic carcinoma can be treated by supraglottic laryngectomy, radiotherapy, or transoral laser with equivalent control; nodal metastasis is common and the contralateral neck needs treatment (Ballenger).","src":"2023 exam recall · Q27","d":"Others"},{"s":"On a radiographic study using barium contrast in a child with stridor, a large posterior","o":["An aberrant right subclavian artery with a left aortic arch","An aberrant left subclavian artery with a right aortic arch","A \"pulmonary sling\" (anomalous left pulmonary artery arising from the right pulmonary artery)","A right hyparterial bronchus","A vascular ring, such as a double aortic arch"],"k":"E","x":"A posterior oesophageal indentation plus anterior tracheal compression on barium swallow indicates a complete vascular ring such as a double aortic arch (Ballenger).","src":"2023 exam recall · Q28","d":"Paediatric"},{"s":"The most effective tool for imaging parathyroid adenomas of mass exceeding 250 mg is","o":["Subtraction thallium 201 scan","Ultrasonography","Technetium 99m pertechnetate scan","Technetium Tc 99m sestamibi scan","Tetrofosmin scan"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — Technetium-99m sestamibi (with SPECT ± US) is the most effective localization study for parathyroid adenomas (Ballenger).","src":"2023 exam recall · Q29","d":"Head & Neck"},{"s":"Where is the most common site of origin of congenital cholesteatoma?","o":["Epitympanum","Posterior-superior quadrant of the middle ear","Anterior-superior quadrant of the middle ear","Mastoid antrum 26.A 27. E. 28. F. 29.D"],"k":"C","x":"Congenital cholesteatoma most often arises in the anterosuperior quadrant of the middle ear (Ballenger).","src":"2023 exam recall · Q30","d":"Otology"},{"s":"In evaluating for occult nodal metastases from laryngopharyngeal malignancies, positron emission tomography","o":["Is based on differential uptake of galactose by tumor cells","Provides the most anatomic detail of any imaging study","Is of no use in the clinically NO neck","Is more sensitive and specific than computed tomography or magnetic resonance imaging","Is chosen for single-modality imaging"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — PET (FDG) is more sensitive and specific than CT/MRI for nodal metastasis, but gives poor anatomic detail and has limited sensitivity for micrometastases (Ballenger).","src":"2023 exam recall · Q31","d":"Laryngology"},{"s":"The initial management for a child with suspected supraglottitis is","o":["Referral to radiology for a soft tissue lateral radiograph of the neck","Fiberoptic laryngoscopy to confirm the diagnosis","Consultation with pediatric infectious disease for Antimicrobial recommendations","Supervised transport to the operating room to secure the airway","Admission to the pediatric intensive care unit for observation and intravenous antibiotics"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — Suspected paediatric supraglottitis: supervised transport to theatre to secure the airway before any examination or imaging (Ballenger).","src":"2023 exam recall · Q32","d":"Paediatric"},{"s":"What theoretical plane from the medial canthus of the eye to the angle of the mandible divides the facial skeleton into two parts?","o":["Ohngren's line","Frankford's line","Kennedy's line","Osguthorpe's line","Arcuate line"],"k":"A","x":"Ohngren line runs from the medial canthus to the angle of the mandible; maxillary tumours above/behind it carry worse prognosis.","src":"2023 exam recall · Q33","d":"Head & Neck"},{"s":"Cytokines responsible for the migration of eosinophils in chronic sinusitis include","o":["Interferon-y and histamine","Interleukin-4 and interleukin-5","Tumor necrosis factor-a and major basic protein","Interleukin-1 and interleukin-2","Eosinophilic cationic protein and interleukin-3"],"k":"B","x":"IL-4 and IL-5 (Th2) drive eosinophil recruitment and survival in chronic sinusitis (Ballenger).","src":"2023 exam recall · Q34","d":"Rhinology"},{"s":"In primary ciliary dyskinesia (PCD)","o":["All of the cilia have an abnormal ultrastructure","The mucociliary clearance time is lengthened","Nitric oxide levels in the nose are less than in the chest","Ciliary beat frequencies are around 10 Hz","Patients are always infertile. 31.D. 32. D"],"k":"B","x":"PCD prolongs mucociliary clearance; not all cilia are ultrastructurally abnormal, nasal NO is low, and infertility is common but not universal (Ballenger).","src":"2023 exam recall · Q35","d":"Others"},{"s":"Intracanalicular vestibular schwannomas typically do not present with","o":["Unilateral hearing loss","Tinnitus","Facial numbness","Imbalance or dysequilibrium","Vertigo"],"k":"C","x":"⚑ No answer given in the recall; answered from the references. — Intracanalicular vestibular schwannomas present with hearing loss, tinnitus and imbalance; facial numbness (CN V) occurs only with large CPA tumours (Ballenger).","src":"2023 exam recall · Q36","d":"Otology"},{"s":"Accepted therapy for confirmed autoimmune inner ear disease involves","o":["High-dose prednisone (60 mg) for at least several weeks","Transtympanic cyclophosphamide 1 mg/mL daily for 2 weeks","Endolymphatic sac shunt surgery","Perilymph perfusion with dexamethasone","Oral famciclovir since herpes viruses have been shown to be the basis of autoimmune inner ear disease"],"k":"A","x":"⚑ No answer given in the recall; answered from the references. — Autoimmune inner ear disease: high-dose prednisone (about 60 mg/day) for several weeks, tapering by response (Ballenger).","src":"2023 exam recall · Q37","d":"Otology"},{"s":"A patient with sudden sensorineural hearing loss reports that she had skin rash and joint pain about a month ago. Your workup should include","o":["Computed tomography","Otoacoustic emissions","Serologic tests","Complete blood count","Electronystagmography"],"k":"C","x":"⚑ No answer given in the recall; answered from the references. — Sudden SNHL after rash and arthralgia suggests systemic/infectious disease (Lyme, syphilis, autoimmune) — serologic tests (Ballenger).","src":"2023 exam recall · Q38","d":"Otology"},{"s":"Temporary threshold shift is caused by","o":["A traveling wave harmonic","Physical shaking of the hair cells","Excessive neurotransmitter release at the hair celldendrite junction","Fracture of the cilial rootlet","Oxygen desaturation of the stria vascularis"],"k":"C","x":"Temporary threshold shift reflects metabolic exhaustion with excessive neurotransmitter (glutamate) release at the hair cell synapse (Ballenger).","src":"2023 exam recall · Q39","d":"Others"},{"s":"Which of the following statements is most accurate about hereditary hearing loss?","o":["Approximately 50% of cases are autosomal dominant","Syndromic hearing loss accounts for nearly one-third of cases","There is little phenotypic variation in syndromic hearing loss","It is almost never caused by mitochondrial mutations","It is always congenital. 36.C. 37.A. 38.C"],"k":"B","x":"Syndromic hearing loss is about 30% of hereditary cases; about 75–80% of non-syndromic is AR (Ballenger).","src":"2023 exam recall · Q40","d":"Otology"},{"s":"The most frequent site of first occurrence of otosclerosis is in the","o":["Oval window rim","Fossula post fenestram","Round window niche","Fissula ante fenestram","Processus cochleariformis"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — Otosclerosis most often begins at the fissula ante fenestram (anterior to the oval window) (Ballenger).","src":"2023 exam recall · Q41","d":"Otology"},{"s":"A 14-year-old girl is febrile and toxic and has a 2 cm diffuse, tender mass at the angle of the mandible. The ear on that side has been draining for 3 weeks; granulation tissue is seen coming through a perforation of the tympanic membrane, but examination is difficult. Before you obtain a computed tomography (CT) scan, your clinical impression is","o":["Masked mastoiditis","Bezold's abscess","Coalescent mastoiditis","Cervical adenopathy","Cholesteatoma"],"k":"B","x":"⚑ No answer given in the recall; answered from the references. — Mastoid pus tracking deep to SCM gives a Bezold abscess — tender neck mass in a toxic patient with chronic otorrhoea (Ballenger).","src":"2023 exam recall · Q42","d":"Paediatric"},{"s":"The radiologic study of choice to diagnose lateral sinus thrombosis is","o":["Arteriography","Ultrasonography","Jugular venography","Enhanced magnetic resonance imaging","Enhanced computed tomography"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — Contrast-enhanced MRI with MR venography is the study of choice for lateral sinus thrombosis (Ballenger).","src":"2023 exam recall · Q43","d":"Otology"},{"s":"The major anatomic generator of the wave V component of the auditory","o":["Lateral lemniscus","Cochlear nucleus","Superior olivary complex","Inferior colliculus","Medial Geniculate body"],"k":"A","x":"Ballenger attributes wave V to the lateral lemniscus as it terminates in the inferior colliculus.","src":"2023 exam recall · Q44","d":"Others"},{"s":"Duration of antimicrobial therapy in a patient with malignant external otitis determined by","o":["Serum glucose level","Electroneuronography","Gallium scan and erythrocyte sedimentation rate","Magnetic resonance imaging","Relief of symptoms. 41.D. 42.B. 43.D"],"k":"C","x":"Treatment duration in necrotizing otitis externa is guided by gallium scanning and ESR normalisation (Ballenger).","src":"2023 exam recall · Q45","d":"Otology"},{"s":"Spontaneous nystagmus","o":["Of peripheral origin is most pronounced with fixation present","Of central origin is most pronounced with fixation removed","Is recorded in the lateral position","Is not a useful sign for either central or peripheral disease","Is common immediately following unilateral peripheral injury"],"k":"E","x":"Spontaneous nystagmus is common immediately after acute unilateral peripheral loss; peripheral nystagmus is suppressed by fixation (Ballenger).","src":"2023 exam recall · Q46","d":"Otology"},{"s":"Which of the following patient symptom descriptors would suggest that vestibular and balance rehabilitation should be considered as treatment option?","o":["Patient reports spontaneous spells of vertigo lasting 1 to 2 hours, with no symptoms between the events","Patient reports a rocking sensation when standing or sitting still with all symptoms absent when in motion","Patient reports symptoms that are provoked by head or visual motion stimuli producing brief spells of vertigo with no symptoms when the head is still","Patient reports imbalance only when arising from lying or sitting, lasting seconds, with no other symptoms noted","Patient reports spontaneous spells of imbalance and vertigo lasting 2 to 3 minutes multiple times per day independent of head position or movement"],"k":"C","x":"⚑ No answer given in the recall; answered from the references. — Vestibular rehabilitation suits brief vertigo provoked by head or visual motion with no symptoms at rest (Ballenger).","src":"2023 exam recall · Q47","d":"Otology"},{"s":"In situations of bilateral peripheral paresis, the rotational chair system","o":["Provides for accurate prognosis of recovery of function in patients with peripheral lesions","Can affect the management plan of the patient by being the only study available to delineate the actual extent of bilateral paresis","Is the only study available to determine the relative reduction in responsiveness, left versus right","Is typically of no use","A and B"],"k":"B","x":"⚑ No answer given in the recall; answered from the references. — In bilateral paresis, rotational chair testing quantifies residual function and can guide management (Ballenger).","src":"2023 exam recall · Q48","d":"Others"},{"s":"In patients with serious bilateral conductive hearing loss, a measurement problem associated with interference of the masking sound presented to the nontest ear referred to as the","o":["Pure-tone average","Rollover","Loudness recruitment","Acoustic reflex","Masking dilemma"],"k":"E","x":"The masking dilemma: in bilateral large conductive losses, masking noise in the non-test ear crosses over and masks the test ear (Ballenger).","src":"2023 exam recall · Q49","d":"Otology"},{"s":"Determination that a patient has absence of warm, cool, and ice water caloric responses for right ear irrigations implies that","o":["The right peripheral system is completely nonresponsive throughout the frequency range (dead system)","There is severe low-frequency loss of sensitivity for the right peripheral part of the vestibular system","The right medial vestibular nucleus is severely reduced in its lowfrequency responsiveness","This finding can only occur secondary to technical error(s) and is not reliable","None of the above"],"k":"B","x":"⚑ No answer given in the recall; answered from the references. — Absent responses even to ice water mean severe low-frequency vestibular hypofunction; residual high-frequency function may remain (Ballenger).","src":"2023 exam recall · Q50","d":"Otology"},{"s":"The primary clinical utility of electronystagmography is","o":["Results lead to specific diagnosis in the majority of patients","Results directly guide recommendations for the majority of patients","The direct evaluation of otolithic organs","As confirmatory evidence for suspected site of lesion for consistency with the suspected diagnosis","As a consistently positive study even in mild cases of peripheral system involvement"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — ENG mainly provides confirmatory evidence for a suspected site of lesion (Ballenger).","src":"2023 exam recall · Q51","d":"Others"},{"s":"Otoacoustic emissions are produced by the","o":["Basilar membrane traveling waves","Round window membrane vibrations","Synchronous firing of the eighth cranial nerve fibers","Outer hair cell motility","Efferent auditory system innervation of outer hair cells"],"k":"D","x":"⚑ No answer given in the recall; answered from the references. — Otoacoustic emissions are produced by outer hair cell electromotility (Ballenger).","src":"2023 exam recall · Q52","d":"Otology"},{"s":"39-year-old man is seen with a chronically draining left ear and has a positive fistula test in that ear. A computed tomography scan suggests possible erosion of the lateral semicircular canal. Against which of the following pairs of microorganisms should antibiotic therapy be directed?","o":["Streptococcus pneumoniae and Mycoplasma pneumoniae","Pseudomonas aeruginosa and Mycoplasma pneumoniae","Haemophilus influenzae and Bacteroides fragilis","Haemophilus influenza and Streptococcus pneumoniae","Pseudomonas aeruginosa and Bacteroides fragilis 50.B. 51.D. 52. D"],"k":"E","x":"Chronic suppurative otitis media/cholesteatoma: Pseudomonas aeruginosa with anaerobes (Bacteroides) and S. aureus (Ballenger).","src":"2023 exam recall · Q53","d":"Otology"},{"s":"30-year-old lady with proptosis without nasal symptoms, the diagnosis is?","o":["Chronic invasive fungal RS","Allergic fungal","Fungal granuloma of ethmoid","Eosinophilic fungal RS"],"k":"C","x":"Proptosis without nasal symptoms in a young adult (Sudan/India) suggests chronic granulomatous (fungal granuloma) invasive fungal sinusitis of the ethmoid (Cummings).","src":"2023 exam recall · Q54","d":"Rhinology"},{"s":"Trotter triad is found in","o":["Juvenile nasopharyngeal angiofibroma","Nasopharyngeal carcinoma","Hypopharyngeal carcinoma","Oropharyngeal lymphoma"],"k":"B","x":"Trotter triad (conductive deafness, palatal immobility, trigeminal neuralgia) is a sign of nasopharyngeal carcinoma (Scott-Brown).","src":"2023 exam recall · Q55","d":"Others"},{"s":"Tear drop sign in radiology of which one?","o":["Le fort fracture","Tripod fracture","Zygoma fracture","Orbital blowout fracture"],"k":"D","x":"The teardrop sign (herniated orbital fat/muscle into the maxillary roof) indicates an orbital floor blowout fracture.","src":"2023 exam recall · Q56","d":"Others"},{"s":"a 9-month-old child with type 3 laryngomalacia what is the cause?","o":["Floor of mouth mass","Nasopharyngeal mass","Retrognathia","Short neck"],"k":"C","x":"Type 3 laryngomalacia (posterior epiglottic collapse) is associated with neurological disorders and retrognathia (Cummings).","src":"2023 exam recall · Q57","d":"Paediatric"},{"s":"Amenoblastoma commonest site?","o":["Mandibular premolar","Mandibular molar","Maxillary molar","Maxillary premolar"],"k":"B","x":"Ameloblastoma most commonly arises in the posterior mandible (molar–ramus region) (Cummings).","src":"2023 exam recall · Q58","d":"Others"},{"s":"Site of Perilymph CSF leak?","o":["Fissula antefenestrum","Posterior fenestrum","Fissure of santorini","Hyrtle fissure"],"k":"A","x":"Perilymph fistulae occur most often at the fissula ante fenestram and round window (Scott-Brown).","src":"2023 exam recall · Q59","d":"Otology"},{"s":"30 years man has firm palatal mass with intact mucosa what is the diagnosis?","o":["Pleomorphic Adenoma","Ca in situ","Retention cyst","Abscess"],"k":"A","x":"A firm, mucosa-covered palatal mass is most often a minor salivary pleomorphic adenoma (Scott-Brown).","src":"2023 exam recall · Q60","d":"Others"},{"s":"External surgical approach used for which type of Sinonasal mucocele?","o":["Bilateral mucocele","Ethmoid mucocele with orbital extension","Mucocele in hypoplastic frontal","Sphenoid mucocele"],"k":"C","x":"External (osteoplastic/Lynch) approaches remain useful for frontal mucoceles that cannot be reached endoscopically (lateral or hypoplastic frontal sinus) (Wormald).","src":"2023 exam recall · Q61","d":"Rhinology"},{"s":"Mouse nibbling appearance in larynx","o":["Tuberculosis","Sarcoidosis","Syphilis","Laryngeal amyloidosis"],"k":"A","x":"\"Mouse-nibbled\" laryngeal ulceration is classic for laryngeal tuberculosis (Scott-Brown).","src":"2023 exam recall · Q62","d":"Laryngology"},{"s":"Which one can heal spontaneously?","o":["Tuberculosis","Syphilis","Sarcoidosis","Leprosy"],"k":"C","x":"Sarcoidosis may resolve spontaneously (about 60% of pulmonary cases) (Cummings).","src":"2023 exam recall · Q63","d":"Others"},{"s":"Most common complication of cochlear implant in children","o":["Meningitis","Injury to Facial nerve","Migration of device","Wound infection"],"k":"D","x":"Wound/flap complications (infection, breakdown) are the commonest complications of paediatric cochlear implantation (Cummings).","src":"2023 exam recall · Q64","d":"Paediatric"},{"s":"Which odontogenic cyst may give rise to (unicystic) ameloblastoma?","o":["Dentigerous cyst","Radicular (periapical) cyst","Nasopalatine duct cyst","Stafne bone cyst"],"k":"A","x":"⚑ Options repaired: the recalled options (osteogenic carcinoma, osteoclastoma…) did not fit the stem. — Ameloblastoma can arise from the lining of a dentigerous cyst (unicystic ameloblastoma) (Cummings).","src":"2023 exam recall · Q65","d":"Others"},{"s":"Distance between anterior wall of sphenoid and nasal spine?","o":["7cm 30 degree","9cm 30 degree","9cm 45 degree","6 cm 30 degree"],"k":"A","x":"The anterior sphenoid wall lies about 7 cm from the anterior nasal spine at about 30° to the nasal floor (Scott-Brown).","src":"2023 exam recall · Q66","d":"Rhinology"},{"s":"Most common used surgical approach in bilateral choanal atresia?","o":["Endoscopic intranasal choanoplasty","Endoscopic intranasal Perforation","Trans palatal","Trans nasal perforation"],"k":"A","x":"Bilateral choanal atresia is repaired by endoscopic transnasal choanoplasty (± stents) (Cummings).","src":"2023 exam recall · Q67","d":"Rhinology"},{"s":"T Cell lymphoma","o":["Is caused by EBV","Is more common in females","Is treated by surgery alone","Is unrelated to viral infection"],"k":"A","x":"Extranodal NK/T-cell lymphoma (nasal type) is EBV-associated (Cummings).","src":"2023 exam recall · Q68","d":"Head & Neck"},{"s":"Best Implant type use in Peri-Lymphatic CSF gusher?","o":["Straight electrode without stopper","Short (hybrid) electrode","Electrode with a stopper/cork to seal the cochleostomy","Perimodiolar electrode inserted through the round window only"],"k":"C","x":"For a CSF/perilymph gusher, use an electrode with a stopper/cork that seals the cochleostomy (Cummings).","src":"2023 exam recall · Q69","d":"Otology"},{"s":"Familial adenomatous polyposis With","o":["Adenocarcinoma","Squamous cell carcinoma","Inverted papilloma","Juvenile Nasopharyngeal Angiofibroma"],"k":"D","x":"⚑ Recalled answer: A (adenocarcinoma); updated answer: D — FAP is associated with JNA. — Juvenile nasopharyngeal angiofibroma has a strong association with familial adenomatous polyposis (APC mutation), about 25× increased risk (Cummings).","src":"2023 exam recall · Q70","d":"Others"},{"s":"Future treatment of congenital hearing loss","o":["Cochlear implant","Brainstem implant","Gene therapy","Hearing aids"],"k":"C","x":"Gene therapy (e.g., OTOF) is the emerging future treatment of congenital genetic hearing loss.","src":"2023 exam recall · Q71","d":"Otology"},{"s":"Patient with Otitis Media with effusion and delay speech what should be in his hearing assessment","o":["Age-appropriate hearing tests","Evoked auditory test","Pharyngoscope and esophagoscope","Ct – Scan"],"k":"A","x":"Children with OME and speech delay need age-appropriate audiometry (AAO-HNS OME guideline).","src":"2023 exam recall · Q72","d":"Otology"},{"s":"Most common cause of Facial palsy in cochlear implant","o":["Mondini malformation","Common cavity","Cochlear hypoplasia","Enlarged vestibular aqueduct"],"k":"C","x":"⚑ Debatable — facial nerve anomalies occur in both hypoplasia and common cavity (see Q89). — Facial nerve anomalies and stimulation are more frequent with malformed cochleae (hypoplasia, common cavity) (Cummings).","src":"2023 exam recall · Q73","d":"Otology"},{"s":"Tulio phenomenon occurs in","o":["Ménière disease","Waardenburg syndrome","Treacher Collins syndrome","Usher syndrome"],"k":"A","x":"Tullio phenomenon is seen in third-window lesions (SSCD), perilymph fistula, syphilis and Ménière disease; of these options, Ménière disease (Scott-Brown).","src":"2023 exam recall · Q74","d":"Others"},{"s":"Best way for assessment of periorbital invasion in Paranasal sinus Carcinoma is ?","o":["PET and CT","MRI T1 with contrast","MRI T2 without contrast","Plain radiography"],"k":"B","x":"Contrast-enhanced T1 MRI (fat-saturated) best assesses periorbital invasion by sinonasal carcinoma (Cummings).","src":"2023 exam recall · Q75","d":"Rhinology"},{"s":"best preoperative localization of Parathyroid adenoma","o":["Technetium-99m sestamibi scan","Ultrasound alone","PET-CT","Chest X-ray"],"k":"A","x":"Technetium-99m sestamibi (with US/SPECT-CT) is the classic best preoperative localization of a parathyroid adenoma (Cummings).","src":"2023 exam recall · Q76","d":"Head & Neck"},{"s":"3 Years old child post facial nerve injury the best way of treatment is","o":["Muscle transfer","Primary anastomosis","Facial–hypoglossal jump anastomosis","Static sling"],"k":"B","x":"Acute facial nerve transection in a child is best repaired by primary tension-free neurorrhaphy (Cummings).","src":"2023 exam recall · Q77","d":"Paediatric"},{"s":"Cholesteatoma of deep sinus tympanum is associated with risk of injury to","o":["Posterior SCC","Round window","Facial nerve","Footplate of stapes"],"k":"C","x":"The facial nerve lies immediately lateral to the sinus tympani and is at risk during cholesteatoma removal there (Brackmann).","src":"2023 exam recall · Q78","d":"Otology"},{"s":"What is the Defect in pathogenesis of xeroderma pigmentosa?","o":["Pigmentation","DNA repair mechanism","Maturation of melanocyte","Cell division"],"k":"B","x":"Xeroderma pigmentosum is a defect of nucleotide-excision DNA repair of UV damage (Cummings).","src":"2023 exam recall · Q79","d":"Others"},{"s":"Most common asymptomatic midline posterior lingual swelling","o":["Ranula","Lingual thyroid","Epidermoid cyst","Mucoepidermoid Carcinoma"],"k":"B","x":"A midline posterior tongue-base swelling that is asymptomatic is most often a lingual thyroid (Scott-Brown).","src":"2023 exam recall · Q80","d":"Others"},{"s":"The main differential diagnosis of Bullous myringitis is","o":["Acute otitis media","Otitis externa","Ramsay-Hunt Syndrome","Eczema"],"k":"C","x":"Bullous myringitis must be distinguished from herpes zoster oticus (Ramsay Hunt), which also causes vesicles and severe pain (Scott-Brown).","src":"2023 exam recall · Q81","d":"Others"},{"s":"Treatment of Grade 3 subglottic stenosis","o":["Laser excision","Dilatation","Laryngotracheal reconstruction (expansion)","Observation"],"k":"C","x":"Grade 3 subglottic stenosis in children is treated by laryngotracheal reconstruction/expansion with cartilage grafts (Cummings).","src":"2023 exam recall · Q82","d":"Others"},{"s":"Patient with large cleft Palate, large adenoid, tonsils and OME, treatment is","o":["Adenoidectomy","Adenotonsillectomy","Long-term ventilation tubes","Observation"],"k":"C","x":"In cleft palate with OME, long-term ventilation tubes are used; adenoidectomy is avoided because it worsens VPI (Scott-Brown).","src":"2023 exam recall · Q83","d":"Others"},{"s":"What is the Nonsuppurative Sialadenitis?","o":["Mumps","Acute Sialadenitis","Chronic Sialadenitis","Necrotizing Sialadenitis"],"k":"A","x":"Mumps is the classic non-suppurative (viral) sialadenitis (Scott-Brown).","src":"2023 exam recall · Q84","d":"Head & Neck"},{"s":"Complication of total inferior turbinectomy?","o":["Infection","Bleeding","Persistent obstruction","Atrophic Rhinitis","Hyposmia"],"k":"D","x":"Total inferior turbinectomy risks atrophic rhinitis/empty nose syndrome (Cummings).","src":"2023 exam recall · Q85","d":"Others"},{"s":"what is lifesaving emergency protection in elderly with severe stridor?","o":["Emergency laryngectomy","Percutaneous Tracheostomy","Admission and plan for tracheostomy","Cricothyroidotomy"],"k":"D","x":"Emergency airway in severe stridor: cricothyroidotomy (then formal tracheostomy) (Scott-Brown).","src":"2023 exam recall · Q86","d":"Laryngology"},{"s":"28 years old lady with Superior SSC dehiscence, which symptom least improved after Surgery?","o":["Tinnitus","Autophony","Hearing loss","Unsteadiness"],"k":"D","x":"⚑ Recall marked A or D; updated answer: D. — After SSCD repair, autophony and sound/pressure symptoms improve most; chronic disequilibrium is least likely to improve (Crane 2008; Cummings).","src":"2023 exam recall · Q87","d":"Others"},{"s":"Lymphatic drainage of Larynx","o":["Mainly to superficial cervical node","Glottic rich drain","Sparse at supraglottic part","Infraglottic drain to Pre-laryngeal Lymph nodes"],"k":"D","x":"Subglottic lymphatics drain to prelaryngeal (Delphian), pretracheal and paratracheal nodes; the glottis is sparsely drained and the supraglottis richly (Scott-Brown).","src":"2023 exam recall · Q88","d":"Laryngology"},{"s":"Increased risk of facial palsy with congenital anomaly","o":["Cochlear hypoplasia","Mondini malformation","Enlarged vestibular aqueduct","Common cavity"],"k":"D","x":"Common cavity and severe cochlear hypoplasia carry the highest risk of an aberrant facial nerve and facial nerve stimulation/injury (Cummings).","src":"2023 exam recall · Q89","d":"Others"},{"s":"Which is not typical presentation of vestibular Schwannoma","o":["Tinnitus","Facial numbness","Vertigo and imbalance","Hearing loss"],"k":"B","x":"Facial numbness is not a typical presentation (it occurs only with large tumours); hearing loss, tinnitus and imbalance are typical (Cummings).","src":"2023 exam recall · Q90","d":"Otology"},{"s":"Post meningitis cochlear implantation best to be done after","o":["1-2WK","2-4WK","4-6WK","6-8WK"],"k":"C","x":"⚑ Recall marked C or A; C kept. — After meningitis, implant early (within about 4–6 weeks) before labyrinthitis ossificans develops (Cummings).","src":"2023 exam recall · Q91","d":"Otology"},{"s":"Fungal infection associated with prosthesis failure tracheoesophageal puncture","o":["Candida albicans","Coccidiosis immitis","Cryptococcus neoformans","Mucormycotic","Aspergillus"],"k":"A","x":"Candida albicans biofilm causes most voice-prosthesis valve failure (Scott-Brown).","src":"2023 exam recall · Q92","d":"Laryngology"},{"s":"After completion of treatment for nasopharyngeal cancer, there is persistence of EBV DNA best management will be","o":["Repeat biopsy","Radiotherapy","MRI to detect residual tumor","Surgery","PET - Scan"],"k":"E","x":"Persistent plasma EBV DNA after NPC treatment suggests residual disease; restage with PET-CT (± MRI) to localize it (NCCN).","src":"2023 exam recall · Q93","d":"Rhinology"},{"s":"In which condition prophylactic neck dissection is indicated in papillary thyroid Carcinoma?","o":["extrathyroidal extension","size equal or > 2 cm","male gender","Age > 60 years"],"k":"A","x":"Prophylactic central neck dissection is considered for advanced primary tumours (T3–T4, gross extrathyroidal extension) (ATA 2015).","src":"2023 exam recall · Q94","d":"Head & Neck"},{"s":"Best treatment of Macrocystic lymphatic malformation","o":["Laser","Immunotherapy","Surgery","Observation only"],"k":"C","x":"Of the options, surgery (complete excision) is listed; percutaneous sclerotherapy (OK-432, doxycycline, bleomycin) is now often first-line for macrocystic lesions (Cummings).","src":"2023 exam recall · Q95","d":"Head & Neck"},{"s":"Cause of death in Wegner’s granulomatosis","o":["Renal failure","Pulmonary haemorrhage alone","Subglottic stenosis","Septal perforation"],"k":"A","x":"Renal failure (glomerulonephritis) is the main cause of death in GPA (Cummings).","src":"2023 exam recall · Q96","d":"Others"},{"s":"Spread of infection to skull base in necrotizing osteomyelitis","o":["Hyrtl fissure","Fissures of Santorin function rshow(){const i=S.list[S.rpos],q=Q[i],a=S.ans[i];
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="results()">Results</button><span class="t">${S.rtitle} · ${S.rpos+1}/${S.list.length}</span>${S.flag[i]?'<span class="flagbtn on">Flagged</span>':''}</div></div>
  <div class="qn">Question ${i+1}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,j)=>{const l=L[j];const c=l==q.k?'ok':(l==a?'bad':'');h+=`<button class="opt ${c}" disabled><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  h+=expl(q,a);$('#app').innerHTML=h;
  nav(`<button class="ghost" ${S.rpos?'':'disabled'} onclick="S.rpos--;rshow();scrollTo(0,0)">Previous</button><button class="primary" ${S.rpos<S.list.length-1?'':'disabled'} onclick="S.rpos++;rshow();scrollTo(0,0)">Next</button>`)}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
window.addEventListener('beforeunload',e=>{if(S.phase=='run'){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(S.phase!='run'||$('#dlg').open)return;if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else{const i=L.indexOf(e.key.toUpperCase());if(e.key.length==1&&i>=0&&i<Q[S.pos].o.length)pick(L[i])}});
startScreen();

function pickPaper(i){PI=i;P=PAPERS[i];Q=P.q;S.ans={};S.flag={};S.pos=0;startScreen()}</script></body></html>
